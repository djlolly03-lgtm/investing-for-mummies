<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg-m" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <filter id="glow-m" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hud-m" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-m"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#020408"/>
  <circle cx="100" cy="100" r="97" fill="url(#bg-m)"/>

  <!-- Grid background -->
  <g clip-path="url(#clip-m)" stroke="#1e293b" stroke-width="0.8" opacity="0.5">
    <line x1="20" y1="0" x2="20" y2="200"/><line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/><line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/><line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/><line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="0" y1="20" x2="200" y2="20"/><line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="60" x2="200" y2="60"/><line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="100" x2="200" y2="100"/><line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/><line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
  </g>

  <!-- Shoulder pylons -->
  <rect x="25" y="108" width="28" height="36" rx="6" fill="#0f172a"/>
  <rect x="147" y="108" width="28" height="36" rx="6" fill="#0f172a"/>
  <rect x="27" y="110" width="24" height="32" rx="5" fill="#1e293b"/>
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.6">
    <line x1="30" y1="116" x2="50" y2="116"/><line x1="30" y1="120" x2="50" y2="120"/>
    <line x1="30" y1="124" x2="50" y2="124"/><line x1="30" y1="128" x2="50" y2="128"/>
    <line x1="150" y1="116" x2="170" y2="116"/><line x1="150" y1="120" x2="170" y2="120"/>
    <line x1="150" y1="124" x2="170" y2="124"/><line x1="150" y1="128" x2="170" y2="128"/>
  </g>
  <!-- Pylon lights -->
  <circle cx="39" cy="136" r="3" fill="#38bdf8" filter="url(#hud-m)" opacity="0.9"/>
  <circle cx="161" cy="136" r="3" fill="#38bdf8" filter="url(#hud-m)" opacity="0.9"/>

  <!-- Neck/collar -->
  <rect x="72" y="132" width="56" height="22" rx="6" fill="#0f172a"/>
  <rect x="75" y="134" width="50" height="18" rx="5" fill="#1e293b"/>
  <g stroke="#64748b" stroke-width="1" opacity="0.4">
    <line x1="80" y1="138" x2="80" y2="148"/><line x1="88" y1="138" x2="88" y2="148"/>
    <line x1="96" y1="138" x2="96" y2="148"/><line x1="104" y1="138" x2="104" y2="148"/>
    <line x1="112" y1="138" x2="112" y2="148"/><line x1="120" y1="138" x2="120" y2="148"/>
  </g>

  <!-- Helmet/head main block -->
  <rect x="54" y="62" width="92" height="80" rx="14" fill="#0f172a"/>
  <rect x="57" y="65" width="86" height="74" rx="12" fill="#1e293b"/>
  <rect x="60" y="68" width="80" height="68" rx="10" fill="#243044"/>

  <!-- Top antenna/crest -->
  <rect x="88" y="42" width="24" height="24" rx="5" fill="#0f172a"/>
  <rect x="91" y="45" width="18" height="18" rx="4" fill="#1e293b"/>
  <circle cx="100" cy="42" r="6" fill="#0f172a"/>
  <circle cx="100" cy="42" r="4" fill="#38bdf8" filter="url(#hud-m)"/>
  <line x1="100" y1="18" x2="100" y2="42" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Side vents -->
  <rect x="56" y="80" width="12" height="30" rx="3" fill="#0f172a"/>
  <rect x="132" y="80" width="12" height="30" rx="3" fill="#0f172a"/>
  <g stroke="#38bdf8" stroke-width="1" opacity="0.5">
    <line x1="59" y1="85" x2="65" y2="85"/><line x1="59" y1="89" x2="65" y2="89"/>
    <line x1="59" y1="93" x2="65" y2="93"/><line x1="59" y1="97" x2="65" y2="97"/>
    <line x1="59" y1="101" x2="65" y2="101"/><line x1="59" y1="105" x2="65" y2="105"/>
    <line x1="135" y1="85" x2="141" y2="85"/><line x1="135" y1="89" x2="141" y2="89"/>
    <line x1="135" y1="93" x2="141" y2="93"/><line x1="135" y1="97" x2="141" y2="97"/>
    <line x1="135" y1="101" x2="141" y2="101"/><line x1="135" y1="105" x2="141" y2="105"/>
  </g>

  <!-- Visor band -->
  <rect x="64" y="85" width="72" height="32" rx="6" fill="#020d18"/>
  <rect x="66" y="87" width="68" height="28" rx="5" fill="#041422"/>
  <!-- Visor glow rim -->
  <rect x="64" y="85" width="72" height="32" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.5" filter="url(#hud-m)" opacity="0.8"/>

  <!-- Eye lenses -->
  <rect x="68" y="89" width="28" height="22" rx="4" fill="#020d18"/>
  <ellipse cx="82" cy="100" rx="11" ry="8" fill="#0ea5e9" filter="url(#hud-m)" opacity="0.9"/>
  <ellipse cx="82" cy="100" rx="7" ry="5" fill="#7dd3fc"/>
  <ellipse cx="82" cy="100" rx="3.5" ry="4" fill="#020d18"/>
  <circle cx="80" cy="98" r="1.5" fill="white" opacity="0.9"/>

  <rect x="104" y="89" width="28" height="22" rx="4" fill="#020d18"/>
  <ellipse cx="118" cy="100" rx="11" ry="8" fill="#0ea5e9" filter="url(#hud-m)" opacity="0.9"/>
  <ellipse cx="118" cy="100" rx="7" ry="5" fill="#7dd3fc"/>
  <ellipse cx="118" cy="100" rx="3.5" ry="4" fill="#020d18"/>
  <circle cx="116" cy="98" r="1.5" fill="white" opacity="0.9"/>

  <!-- Visor centre divider -->
  <rect x="98" y="87" width="4" height="28" rx="2" fill="#0f172a"/>

  <!-- Lower face plate -->
  <rect x="68" y="120" width="64" height="20" rx="5" fill="#0f172a"/>
  <rect x="71" y="122" width="58" height="16" rx="4" fill="#1e293b"/>
  <!-- Grille slots -->
  <g fill="#0f172a">
    <rect x="75" y="125" width="6" height="10" rx="2"/>
    <rect x="84" y="125" width="6" height="10" rx="2"/>
    <rect x="93" y="125" width="6" height="10" rx="2"/>
    <rect x="102" y="125" width="6" height="10" rx="2"/>
    <rect x="111" y="125" width="6" height="10" rx="2"/>
    <rect x="120" y="125" width="6" height="10" rx="2"/>
  </g>

  <!-- HUD data readouts -->
  <g fill="#38bdf8" opacity="0.45" font-size="7" font-family="monospace" clip-path="url(#clip-m)">
    <text x="28" y="164">SYS:ON</text>
    <text x="140" y="164">ARM:RDY</text>
  </g>

  <!-- Crown ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#334155" stroke-width="3" filter="url(#glow-m)" opacity="0.95"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Corner ticks -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.7">
    <line x1="20" y1="55" x2="28" y2="55"/><line x1="20" y1="55" x2="20" y2="63"/>
    <line x1="180" y1="55" x2="172" y2="55"/><line x1="180" y1="55" x2="180" y2="63"/>
    <line x1="20" y1="145" x2="28" y2="145"/><line x1="20" y1="145" x2="20" y2="137"/>
    <line x1="180" y1="145" x2="172" y2="145"/><line x1="180" y1="145" x2="180" y2="137"/>
  </g>
</svg>
