<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg-s" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#001233"/>
      <stop offset="100%" stop-color="#000a1a"/>
    </radialGradient>
    <radialGradient id="water-s" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eye-s" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-s"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#000a1a"/>
  <circle cx="100" cy="100" r="97" fill="url(#bg-s)"/>

  <!-- Underwater glow -->
  <circle cx="100" cy="100" r="97" fill="url(#water-s)"/>

  <!-- Stars / space effect -->
  <g fill="#7dd3fc" opacity="0.25">
    <circle cx="30" cy="35" r="1"/><circle cx="55" cy="22" r="1.2"/><circle cx="80" cy="18" r="0.8"/>
    <circle cx="145" cy="28" r="1"/><circle cx="165" cy="42" r="0.8"/><circle cx="170" cy="22" r="1.2"/>
    <circle cx="25" cy="70" r="0.8"/><circle cx="175" cy="68" r="1"/>
  </g>

  <!-- Dorsal fin -->
  <polygon points="100,14 88,60 112,60" fill="#0c4a6e" filter="url(#glow-s)"/>
  <polygon points="100,14 92,58 100,54 108,58" fill="#0ea5e9" opacity="0.7"/>
  <!-- Fin detail lines -->
  <line x1="100" y1="20" x2="93" y2="55" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="22" x2="106" y2="56" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>

  <!-- Body / head mass -->
  <ellipse cx="100" cy="115" rx="52" ry="48" fill="#0c4a6e"/>
  <ellipse cx="100" cy="112" rx="46" ry="44" fill="#075985"/>
  <ellipse cx="100" cy="108" rx="42" ry="40" fill="#0369a1"/>

  <!-- White underbelly -->
  <ellipse cx="100" cy="120" rx="30" ry="28" fill="#e0f2fe" opacity="0.15"/>
  <ellipse cx="100" cy="122" rx="22" ry="18" fill="#f0f9ff" opacity="0.12"/>

  <!-- Pectoral fins (sides) -->
  <polygon points="58,108 30,130 62,128" fill="#0c4a6e" opacity="0.9"/>
  <polygon points="142,108 170,130 138,128" fill="#0c4a6e" opacity="0.9"/>
  <line x1="58" y1="108" x2="34" y2="128" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
  <line x1="142" y1="108" x2="166" y2="128" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>

  <!-- VR goggles / mech visor -->
  <rect x="62" y="88" width="76" height="28" rx="8" fill="#0a2540"/>
  <rect x="64" y="90" width="72" height="24" rx="7" fill="#0e3a5e"/>
  <!-- Visor split -->
  <line x1="100" y1="90" x2="100" y2="114" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
  <!-- Lens left -->
  <rect x="66" y="92" width="30" height="20" rx="5" fill="#001e3c"/>
  <ellipse cx="81" cy="102" rx="11" ry="8" fill="#0284c7" opacity="0.8" filter="url(#eye-s)"/>
  <ellipse cx="81" cy="102" rx="7" ry="5.5" fill="#38bdf8" filter="url(#eye-s)"/>
  <ellipse cx="81" cy="102" rx="3.5" ry="4.5" fill="#001e3c"/>
  <circle cx="79" cy="100" r="1.2" fill="white" opacity="0.9"/>
  <!-- Lens right -->
  <rect x="104" y="92" width="30" height="20" rx="5" fill="#001e3c"/>
  <ellipse cx="119" cy="102" rx="11" ry="8" fill="#0284c7" opacity="0.8" filter="url(#eye-s)"/>
  <ellipse cx="119" cy="102" rx="7" ry="5.5" fill="#38bdf8" filter="url(#eye-s)"/>
  <ellipse cx="119" cy="102" rx="3.5" ry="4.5" fill="#001e3c"/>
  <circle cx="117" cy="100" r="1.2" fill="white" opacity="0.9"/>
  <!-- Visor glow rim -->
  <rect x="62" y="88" width="76" height="28" rx="8" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" filter="url(#glow-s)"/>

  <!-- Snout -->
  <ellipse cx="100" cy="124" rx="28" ry="16" fill="#0369a1"/>
  <ellipse cx="100" cy="122" rx="24" ry="12" fill="#0c4a6e"/>

  <!-- Teeth -->
  <g fill="white" opacity="0.9">
    <polygon points="82,129 86,142 90,129"/>
    <polygon points="90,130 94,144 98,130"/>
    <polygon points="102,130 106,144 110,130"/>
    <polygon points="110,129 114,142 118,129"/>
  </g>
  <g fill="#bae6fd" opacity="0.5">
    <polygon points="84,129 87,138 90,129"/>
    <polygon points="92,130 95,140 98,130"/>
    <polygon points="102,130 105,140 108,130"/>
    <polygon points="110,129 113,138 116,129"/>
  </g>

  <!-- Jaw line -->
  <path d="M72 128 Q100 136 128 128" stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Gill slits -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M60 108 Q62 116 60 124"/>
    <path d="M65 106 Q67 114 65 122"/>
    <path d="M140 108 Q138 116 140 124"/>
    <path d="M135 106 Q133 114 135 122"/>
  </g>

  <!-- Mech detail on forehead -->
  <rect x="86" y="78" width="28" height="6" rx="2" fill="#0c4a6e" opacity="0.8"/>
  <rect x="90" y="79" width="8" height="4" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="102" y="79" width="8" height="4" rx="1" fill="#38bdf8" opacity="0.7"/>

  <!-- Crown ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#0284c7" stroke-width="3" filter="url(#glow-s)" opacity="0.95"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Corner ticks -->
  <g stroke="#0284c7" stroke-width="1.5" opacity="0.6">
    <line x1="20" y1="55" x2="28" y2="55"/><line x1="20" y1="55" x2="20" y2="63"/>
    <line x1="180" y1="55" x2="172" y2="55"/><line x1="180" y1="55" x2="180" y2="63"/>
    <line x1="20" y1="145" x2="28" y2="145"/><line x1="20" y1="145" x2="20" y2="137"/>
    <line x1="180" y1="145" x2="172" y2="145"/><line x1="180" y1="145" x2="180" y2="137"/>
  </g>
</svg>
