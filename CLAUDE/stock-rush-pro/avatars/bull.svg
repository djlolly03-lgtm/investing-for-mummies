<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg-b" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#001a08"/>
      <stop offset="100%" stop-color="#000a02"/>
    </radialGradient>
    <filter id="glow-b" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cash-b" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-b"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#000a02"/>
  <circle cx="100" cy="100" r="97" fill="url(#bg-b)"/>

  <!-- Money/circuit glow in background -->
  <g clip-path="url(#clip-b)" filter="url(#cash-b)" opacity="0.2">
    <text x="18" y="45" font-size="18" fill="#4ade80" font-family="monospace">$</text>
    <text x="160" y="40" font-size="16" fill="#4ade80" font-family="monospace">₹</text>
    <text x="30" y="150" font-size="14" fill="#4ade80" font-family="monospace">$</text>
    <text x="155" y="155" font-size="18" fill="#4ade80" font-family="monospace">₹</text>
  </g>

  <!-- Left horn -->
  <path d="M64 72 Q30 40 22 18 Q38 30 50 50 Q52 56 68 68Z" fill="#d97706" filter="url(#glow-b)"/>
  <path d="M64 72 Q32 42 26 22 Q40 34 52 52" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Right horn -->
  <path d="M136 72 Q170 40 178 18 Q162 30 150 50 Q148 56 132 68Z" fill="#d97706" filter="url(#glow-b)"/>
  <path d="M136 72 Q168 42 174 22 Q160 34 148 52" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Circuit body / neck -->
  <ellipse cx="100" cy="148" rx="40" ry="30" fill="#14532d"/>
  <ellipse cx="100" cy="145" rx="34" ry="26" fill="#15803d"/>

  <!-- Circuit lines on body -->
  <g stroke="#4ade80" stroke-width="1" opacity="0.35" fill="none" clip-path="url(#clip-b)">
    <path d="M82 138 L82 152 L90 152 L90 162"/>
    <path d="M118 138 L118 152 L110 152 L110 162"/>
    <line x1="78" y1="146" x2="86" y2="146"/>
    <line x1="114" y1="146" x2="122" y2="146"/>
    <path d="M94 155 L94 162 L100 162"/>
    <path d="M106 155 L106 162 L100 162"/>
  </g>

  <!-- Head -->
  <ellipse cx="100" cy="102" rx="50" ry="52" fill="#14532d"/>
  <ellipse cx="100" cy="100" rx="46" ry="48" fill="#166534"/>
  <ellipse cx="100" cy="98" rx="42" ry="44" fill="#15803d"/>

  <!-- Circuit plating on cheeks -->
  <rect x="56" y="90" width="22" height="24" rx="5" fill="#14532d" opacity="0.8"/>
  <rect x="122" y="90" width="22" height="24" rx="5" fill="#14532d" opacity="0.8"/>
  <g stroke="#4ade80" stroke-width="1.2" opacity="0.6">
    <line x1="59" y1="96" x2="75" y2="96"/><line x1="59" y1="100" x2="75" y2="100"/>
    <line x1="59" y1="104" x2="75" y2="104"/><line x1="59" y1="108" x2="75" y2="108"/>
    <line x1="125" y1="96" x2="141" y2="96"/><line x1="125" y1="100" x2="141" y2="100"/>
    <line x1="125" y1="104" x2="141" y2="104"/><line x1="125" y1="108" x2="141" y2="108"/>
  </g>

  <!-- Ear left -->
  <ellipse cx="62" cy="84" rx="12" ry="10" fill="#14532d"/>
  <ellipse cx="62" cy="84" rx="8" ry="7" fill="#16a34a" opacity="0.6"/>
  <!-- Ear right -->
  <ellipse cx="138" cy="84" rx="12" ry="10" fill="#14532d"/>
  <ellipse cx="138" cy="84" rx="8" ry="7" fill="#16a34a" opacity="0.6"/>

  <!-- Forehead plate -->
  <rect x="80" y="68" width="40" height="18" rx="6" fill="#14532d" opacity="0.9"/>
  <rect x="84" y="71" width="32" height="12" rx="4" fill="#064e3b" opacity="0.8"/>
  <rect x="86" y="73" width="10" height="8" rx="2" fill="#4ade80" opacity="0.5"/>
  <rect x="104" y="73" width="10" height="8" rx="2" fill="#4ade80" opacity="0.5"/>

  <!-- Eyes -->
  <ellipse cx="82" cy="98" rx="12" ry="11" fill="#052e16"/>
  <ellipse cx="118" cy="98" rx="12" ry="11" fill="#052e16"/>
  <ellipse cx="82" cy="98" rx="9" ry="8.5" fill="#16a34a" filter="url(#glow-b)"/>
  <ellipse cx="118" cy="98" rx="9" ry="8.5" fill="#16a34a" filter="url(#glow-b)"/>
  <ellipse cx="82" cy="98" rx="5" ry="7" fill="#052e16"/>
  <ellipse cx="118" cy="98" rx="5" ry="7" fill="#052e16"/>
  <circle cx="80" cy="96" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="116" cy="96" r="1.5" fill="white" opacity="0.9"/>

  <!-- Snout / muzzle -->
  <ellipse cx="100" cy="120" rx="28" ry="22" fill="#14532d"/>
  <ellipse cx="100" cy="118" rx="24" ry="18" fill="#166534"/>
  <!-- Nostrils -->
  <ellipse cx="91" cy="120" rx="5" ry="4" fill="#052e16"/>
  <ellipse cx="109" cy="120" rx="5" ry="4" fill="#052e16"/>
  <circle cx="91" cy="120" r="2.5" fill="#4ade80" opacity="0.4" filter="url(#glow-b)"/>
  <circle cx="109" cy="120" r="2.5" fill="#4ade80" opacity="0.4" filter="url(#glow-b)"/>

  <!-- Chin -->
  <ellipse cx="100" cy="132" rx="15" ry="10" fill="#14532d"/>

  <!-- Ring in nose -->
  <path d="M94 122 Q100 130 106 122" stroke="#d97706" stroke-width="2.5" fill="none" filter="url(#cash-b)"/>

  <!-- Crown ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#15803d" stroke-width="3" filter="url(#glow-b)" opacity="0.95"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.4"/>

  <!-- Corner ticks -->
  <g stroke="#15803d" stroke-width="1.5" opacity="0.6">
    <line x1="20" y1="55" x2="28" y2="55"/><line x1="20" y1="55" x2="20" y2="63"/>
    <line x1="180" y1="55" x2="172" y2="55"/><line x1="180" y1="55" x2="180" y2="63"/>
    <line x1="20" y1="145" x2="28" y2="145"/><line x1="20" y1="145" x2="20" y2="137"/>
    <line x1="180" y1="145" x2="172" y2="145"/><line x1="180" y1="145" x2="180" y2="137"/>
  </g>
</svg>
