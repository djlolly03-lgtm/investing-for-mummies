<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg-r" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d0018"/>
      <stop offset="100%" stop-color="#06000e"/>
    </radialGradient>
    <filter id="glow-r" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eye-r" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-r"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#06000e"/>
  <circle cx="100" cy="100" r="97" fill="url(#bg-r)"/>

  <!-- Purple lightning in background -->
  <g clip-path="url(#clip-r)" filter="url(#glow-r)" opacity="0.15">
    <polyline points="35,15 28,50 40,44 25,85" stroke="#a855f7" stroke-width="2" fill="none"/>
    <polyline points="165,15 172,50 160,44 175,85" stroke="#a855f7" stroke-width="2" fill="none"/>
    <polyline points="20,120 32,132 22,145" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
    <polyline points="180,120 168,132 178,145" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Body -->
  <ellipse cx="100" cy="150" rx="40" ry="28" fill="#3b0764"/>
  <ellipse cx="100" cy="146" rx="34" ry="24" fill="#4c1d95"/>
  <!-- Chest stripe (raccoon) -->
  <ellipse cx="100" cy="148" rx="12" ry="16" fill="#7c3aed" opacity="0.3"/>

  <!-- Head -->
  <ellipse cx="100" cy="102" rx="50" ry="52" fill="#3b0764"/>
  <ellipse cx="100" cy="100" rx="46" ry="48" fill="#4c1d95"/>
  <ellipse cx="100" cy="98" rx="42" ry="44" fill="#6d28d9"/>

  <!-- Ears (rounded raccoon ears with tech bits) -->
  <circle cx="70" cy="70" r="18" fill="#3b0764"/>
  <circle cx="70" cy="70" r="13" fill="#4c1d95"/>
  <circle cx="70" cy="70" r="8" fill="#7c3aed" opacity="0.6"/>
  <!-- Ear tech ring -->
  <circle cx="70" cy="70" r="15" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5" filter="url(#glow-r)"/>
  <circle cx="130" cy="70" r="18" fill="#3b0764"/>
  <circle cx="130" cy="70" r="13" fill="#4c1d95"/>
  <circle cx="130" cy="70" r="8" fill="#7c3aed" opacity="0.6"/>
  <circle cx="130" cy="70" r="15" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5" filter="url(#glow-r)"/>

  <!-- RACCOON EYE MASK — the defining feature -->
  <!-- Black mask area around both eyes -->
  <path d="M58 90 Q68 82 90 88 L92 110 Q76 114 60 106 Z" fill="#1a0030"/>
  <path d="M142 90 Q132 82 110 88 L108 110 Q124 114 140 106 Z" fill="#1a0030"/>

  <!-- Mask highlight edge -->
  <path d="M60 90 Q70 83 90 89" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M140 90 Q130 83 110 89" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Eyes — glowing purple -->
  <ellipse cx="78" cy="98" rx="12" ry="11" fill="#0d0020"/>
  <ellipse cx="122" cy="98" rx="12" ry="11" fill="#0d0020"/>
  <ellipse cx="78" cy="98" rx="9" ry="8.5" fill="#a855f7" filter="url(#eye-r)"/>
  <ellipse cx="122" cy="98" rx="9" ry="8.5" fill="#a855f7" filter="url(#eye-r)"/>
  <ellipse cx="78" cy="98" rx="5.5" ry="7" fill="#0d0020"/>
  <ellipse cx="122" cy="98" rx="5.5" ry="7" fill="#0d0020"/>
  <circle cx="76" cy="96" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="120" cy="96" r="1.5" fill="white" opacity="0.9"/>

  <!-- Forehead band / visor hint -->
  <rect x="78" y="76" width="44" height="12" rx="5" fill="#2e1065" opacity="0.9"/>
  <rect x="81" y="78" width="38" height="8" rx="4" fill="#1a0030"/>
  <!-- Visor lights -->
  <circle cx="88" cy="82" r="2.5" fill="#a855f7" filter="url(#glow-r)" opacity="0.8"/>
  <circle cx="100" cy="82" r="2.5" fill="#c084fc" filter="url(#glow-r)" opacity="0.8"/>
  <circle cx="112" cy="82" r="2.5" fill="#a855f7" filter="url(#glow-r)" opacity="0.8"/>

  <!-- Nose -->
  <ellipse cx="100" cy="116" rx="6" ry="4.5" fill="#1a0030"/>
  <ellipse cx="100" cy="115" rx="4.5" ry="3" fill="#c084fc" opacity="0.7"/>

  <!-- Muzzle -->
  <ellipse cx="88" cy="122" rx="9" ry="7" fill="#7c3aed" opacity="0.3"/>
  <ellipse cx="112" cy="122" rx="9" ry="7" fill="#7c3aed" opacity="0.3"/>
  <path d="M100 118 L100 125" stroke="#1a0030" stroke-width="1.5"/>
  <path d="M100 125 Q90 131 86 128" stroke="#4c1d95" stroke-width="1.5" fill="none"/>
  <path d="M100 125 Q110 131 114 128" stroke="#4c1d95" stroke-width="1.5" fill="none"/>

  <!-- Whisker dots -->
  <g fill="#c084fc" opacity="0.7">
    <circle cx="82" cy="120" r="1.5"/><circle cx="76" cy="122" r="1.5"/><circle cx="70" cy="120" r="1.5"/>
    <circle cx="118" cy="120" r="1.5"/><circle cx="124" cy="122" r="1.5"/><circle cx="130" cy="120" r="1.5"/>
  </g>

  <!-- Stripe down face center -->
  <path d="M100 55 Q102 70 100 84" stroke="#9333ea" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Shoulder armour blips -->
  <rect x="54" y="130" width="20" height="14" rx="4" fill="#2e1065" opacity="0.9"/>
  <rect x="126" y="130" width="20" height="14" rx="4" fill="#2e1065" opacity="0.9"/>
  <circle cx="64" cy="137" r="3" fill="#a855f7" filter="url(#glow-r)" opacity="0.8"/>
  <circle cx="136" cy="137" r="3" fill="#a855f7" filter="url(#glow-r)" opacity="0.8"/>

  <!-- Crown ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#6d28d9" stroke-width="3" filter="url(#glow-r)" opacity="0.95"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4"/>

  <!-- Corner ticks -->
  <g stroke="#6d28d9" stroke-width="1.5" opacity="0.6">
    <line x1="20" y1="55" x2="28" y2="55"/><line x1="20" y1="55" x2="20" y2="63"/>
    <line x1="180" y1="55" x2="172" y2="55"/><line x1="180" y1="55" x2="180" y2="63"/>
    <line x1="20" y1="145" x2="28" y2="145"/><line x1="20" y1="145" x2="20" y2="137"/>
    <line x1="180" y1="145" x2="172" y2="145"/><line x1="180" y1="145" x2="180" y2="137"/>
  </g>
</svg>
