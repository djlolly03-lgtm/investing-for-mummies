<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg-n" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d0a1f"/>
      <stop offset="100%" stop-color="#04030f"/>
    </radialGradient>
    <filter id="glow-n" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shuriken-n" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-n"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#04030f"/>
  <circle cx="100" cy="100" r="97" fill="url(#bg-n)"/>

  <!-- Background shuriken shapes -->
  <g clip-path="url(#clip-n)" opacity="0.12">
    <polygon points="28,28 32,20 36,28 44,24 40,32 48,36 40,40 44,48 36,44 32,52 28,44 20,48 24,40 16,36 24,32" fill="#818cf8"/>
    <polygon points="158,155 162,147 166,155 174,151 170,159 178,163 170,167 174,175 166,171 162,179 158,171 150,175 154,167 146,163 154,159" fill="#818cf8"/>
  </g>

  <!-- Body silhouette -->
  <ellipse cx="100" cy="152" rx="35" ry="28" fill="#1e1b4b"/>
  <path d="M72 142 Q100 165 128 142 L130 170 Q100 178 70 170Z" fill="#312e81" clip-path="url(#clip-n)"/>

  <!-- Arms hinting at combat pose -->
  <path d="M65 128 Q40 118 25 105" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" fill="none" clip-path="url(#clip-n)"/>
  <path d="M135 128 Q160 118 175 105" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" fill="none" clip-path="url(#clip-n)"/>

  <!-- Shuriken in right hand -->
  <g transform="translate(168,100)" filter="url(#shuriken-n)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#a5b4fc" opacity="0.9"/>
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#e0e7ff" opacity="0.7"/>
    <circle cx="0" cy="0" r="3" fill="#4f46e5"/>
  </g>

  <!-- Neck/hood -->
  <ellipse cx="100" cy="130" rx="40" ry="22" fill="#1e1b4b"/>
  <ellipse cx="100" cy="126" rx="36" ry="18" fill="#312e81"/>

  <!-- Head -->
  <ellipse cx="100" cy="96" rx="46" ry="48" fill="#1e1b4b"/>
  <ellipse cx="100" cy="94" rx="42" ry="44" fill="#312e81"/>

  <!-- Hood/mask wrapping -->
  <!-- Hood top -->
  <path d="M68 76 Q100 55 132 76 Q128 65 100 58 Q72 65 68 76Z" fill="#1e1b4b"/>
  <!-- Mask band (covers nose/mouth) -->
  <rect x="62" y="112" width="76" height="28" rx="8" fill="#1e1b4b" opacity="0.95"/>
  <rect x="64" y="114" width="72" height="24" rx="7" fill="#312e81"/>
  <!-- Mask stitching details -->
  <line x1="68" y1="126" x2="132" y2="126" stroke="#4f46e5" stroke-width="1" opacity="0.4"/>
  <g stroke="#6366f1" stroke-width="1" opacity="0.3">
    <line x1="72" y1="118" x2="72" y2="134"/><line x1="80" y1="118" x2="80" y2="134"/>
    <line x1="120" y1="118" x2="120" y2="134"/><line x1="128" y1="118" x2="128" y2="134"/>
  </g>
  <!-- Mask glow trim -->
  <rect x="62" y="112" width="76" height="28" rx="8" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>

  <!-- Bandana/headband -->
  <rect x="64" y="82" width="72" height="12" rx="5" fill="#3730a3"/>
  <rect x="66" y="84" width="68" height="8" rx="4" fill="#4338ca"/>
  <!-- Headband knot at side -->
  <ellipse cx="68" cy="88" rx="6" ry="4" fill="#3730a3"/>
  <path d="M62 86 Q56 82 52 88 Q56 94 62 90" fill="#312e81" opacity="0.7"/>

  <!-- Eyes — narrowed, fierce -->
  <ellipse cx="82" cy="100" rx="12" ry="7" fill="#0f0d28"/>
  <ellipse cx="118" cy="100" rx="12" ry="7" fill="#0f0d28"/>
  <ellipse cx="82" cy="100" rx="9" ry="5.5" fill="#6366f1" filter="url(#glow-n)"/>
  <ellipse cx="118" cy="100" rx="9" ry="5.5" fill="#6366f1" filter="url(#glow-n)"/>
  <ellipse cx="82" cy="100" rx="5" ry="4.5" fill="#0f0d28"/>
  <ellipse cx="118" cy="100" rx="5" ry="4.5" fill="#0f0d28"/>
  <circle cx="80" cy="99" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="116" cy="99" r="1.2" fill="white" opacity="0.9"/>

  <!-- Brow slashes (fierce) -->
  <path d="M70 93 Q80 88 92 92" stroke="#818cf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M130 93 Q120 88 108 92" stroke="#818cf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Small shurikens orbiting -->
  <g filter="url(#shuriken-n)" opacity="0.5">
    <g transform="translate(32,72)">
      <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="#a5b4fc"/>
    </g>
    <g transform="translate(168,72)">
      <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="#a5b4fc"/>
    </g>
  </g>

  <!-- Crown ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#4f46e5" stroke-width="3" filter="url(#glow-n)" opacity="0.95"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>

  <!-- Corner ticks -->
  <g stroke="#4f46e5" stroke-width="1.5" opacity="0.6">
    <line x1="20" y1="55" x2="28" y2="55"/><line x1="20" y1="55" x2="20" y2="63"/>
    <line x1="180" y1="55" x2="172" y2="55"/><line x1="180" y1="55" x2="180" y2="63"/>
    <line x1="20" y1="145" x2="28" y2="145"/><line x1="20" y1="145" x2="20" y2="137"/>
    <line x1="180" y1="145" x2="172" y2="145"/><line x1="180" y1="145" x2="180" y2="137"/>
  </g>
</svg>
