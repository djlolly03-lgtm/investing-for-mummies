<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFM OS — Content Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0C548E; --ink:#24313F; --ink-2:#55646f; --muted:#8c94a1;
  /* The brand navy from the IFM palette, for filled primary buttons. `--navy` above is the
     interactive accent (focus rings, hovers, links) and is a brighter blue — as the page's
     single largest block of colour it read as generic startup blue rather than as IFM. */
  --navy-deep:#1a3a5c;
  /* Display ink. Sampled off the storyboard: titles there are a deep navy (#101C3A),
     not the charcoal body colour. It is what makes the type feel like a brand and not
     a database, so it is a token rather than a one-off. */
  --display:#15263F;
  --paper:#FCFAF7; --cream:#F7F1E8; --stone:#E9E2D8; --stone-2:#f2ece3;
  --gold:#E5C76B; --card:#fff;
  --f-d:'Lora',Georgia,serif; --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  /* The content column, in one place. Measured off the storyboard, where the search field
     and the card grid leave gutters of about 5.5% rather than the 11% this had — the page
     was reading a good deal narrower than the design. Masthead, search bar and grid all
     derive their left edge from this single number. */
  --col:1284px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
/* Flex column so the empty state can compose: the question and field sit in the upper
   third and the brand image drops to the foot of the viewport, as in the storyboard,
   instead of stopping two-thirds down and leaving a dead band underneath. */
body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:15px;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
/* ONE focus ring, in the interactive accent, for everything. There was no designed focus
   state at all: most controls here have their border removed, so a keyboard user got
   whatever Chrome draws — a hairline on a chip, nothing legible on a card. `:focus-visible`
   rather than `:focus`, so a mouse click never paints a ring. */
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--navy);
  outline-offset:3px;border-radius:5px}
.cardx:focus-visible{outline-offset:5px;border-radius:10px}
.themes button:focus-visible{outline-offset:4px;border-radius:14px}
.try button:focus-visible,.btn:focus-visible{border-radius:999px}
.btn:focus-visible{border-radius:6px}
/* The field paints its own focus state on .sbox — a second ring inside it is noise. */
.sbox input:focus-visible{outline:none}
/* Chromium draws its own ✕ inside input[type=search]. Left alone it sat beside our own
   clear button — two identical crosses, 16px apart. */
input[type=search]::-webkit-search-cancel-button,
input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}

/* ------------------------------------------------------------------- masthead */
/* One left edge for the whole page. `max(28px, …)` resolves to exactly the gutter the
   1124px content column sits behind, so masthead, search field and the first card in the
   grid all start on the same pixel at every width — instead of the search bar running
   130px wider than the grid it belongs to. */
.mast,.stage{padding-inline:max(28px,calc((100% - var(--col))/2))}
.mast{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding-block:16px;background:rgba(252,250,247,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--stone)}
/* One colour, as the storyboard has it. The two-tone "IFM / OS" split read as a logo
   treatment the brand does not actually use. */
.brand{font-family:var(--f-d);font-weight:600;font-size:19px;letter-spacing:.01em;
  color:var(--display);padding:0;line-height:1}
/* The count belongs to the empty state only. In the storyboard the app frame carries
   "IFM OS" and "378 assets" on panel 1 and nothing at all on the results panels — the
   tagline beside the wordmark is the POSTER's title, not the product's chrome. Carried on
   every screen it spent the top of the page on words that say nothing about the content. */
.mast .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------- stage (hero/results) */
/* 52px is the masthead's exact height (16 + 19 + 16 + 1px rule). Anything larger leaves a
   band of page showing through between the two sticky bars as you scroll. */
/* No rule, no blur, no bar. A full-width border under a full-width control is what made
   this read as a toolbar pinned above a table of records. The field now sits on the page's
   own paper and results scroll under it. */
.stage{position:sticky;top:52px;z-index:35;background:var(--paper);padding-block:20px 12px}
/* Scrolled results were being guillotined: the sticky field's opaque paper cut each card
   off at an invisible horizontal line, mid-photograph. A rule there would put the toolbar
   back (see above), so the edge is softened instead — 22px of paper fading to nothing, so
   content dissolves under the field rather than being sliced by it. */
.stage::after{content:'';position:absolute;left:0;right:0;top:100%;height:22px;
  pointer-events:none;background:linear-gradient(var(--paper),rgba(252,250,247,0))}
.stage.hero::after{display:none}
/* padding-block only — the shared padding-inline above still applies, so the empty-state
   field lines up with the masthead and, more usefully, with the field it turns into the
   moment she types. It used to be a 470px box centred on nothing. */
/* 9vh, not 14vh, and no bottom padding: the hero image now follows directly instead of
   being flung to the foot of the viewport, so the question, the field and the photograph
   read as one composition rather than three strips with dead bands between them. */
.stage.hero{position:static;border-bottom:none;background:none;backdrop-filter:none;
  padding-block:8vh 40px;text-align:center;flex:none}
.herotext{display:none}
.stage.hero .herotext{display:block;max-width:600px;margin:0 auto 28px}
/* The 29px floor put the question within 19px of the right gutter on a 375 phone. */
.stage h1{font-family:var(--f-d);font-weight:500;font-size:clamp(25px,5.2vw,38px);
  line-height:1.16;margin:0;letter-spacing:-.018em;color:var(--display)}
/* Capped, not full-bleed. In the storyboard the field is about 60% of the frame with clear
   space to its right; stretched across 1440px it stopped reading as a question and started
   reading as a toolbar, which is the single strongest "admin panel" signal a page can send.
   Filters stays inside the same group so the two never drift apart. */
/* Two measures, not one. 760px is right for the QUESTION — centred, with clear space
   around it, it reads as an invitation. In results it read as an orphan: a 760px control
   left-aligned under a 1284px grid, with 520px of nothing to its right. Boards 01 and 02
   both run the results field to about three-quarters of the grid it sits over, which is
   wide enough to belong to the results and still short of a full-width toolbar. */
.searchrow{display:flex;gap:10px;align-items:center;max-width:960px}
.stage.hero .searchrow{margin:0 auto;max-width:760px}
/* Generous and soft rather than tight and utilitarian. The size is doing the talking now
   that the icon is gone: a field this open reads as an invitation to say something, where
   a 40px-high box with a lens in it reads as a query bar. */
.sbox{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);
  border:1.5px solid var(--stone);border-radius:12px;padding:13px 18px;min-width:0;
  transition:border-color .15s,box-shadow .15s}
.stage.hero .sbox{padding:19px 24px;border-radius:15px;
  box-shadow:0 1px 2px rgba(21,38,63,.03),0 8px 26px -18px rgba(21,38,63,.28)}
.sbox:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(12,84,142,.08)}
.sbox .clr svg{width:16px;height:16px;flex:none}
.sbox input{flex:1;border:none;outline:none;background:none;font-family:inherit;
  font-size:15px;color:var(--ink);min-width:0}
.stage.hero .sbox input{font-size:17px}
.sbox input::placeholder{color:var(--muted)}
.sbox .clr{color:var(--muted);padding:0;display:none;line-height:0;flex:none;transition:color .15s}
.sbox .clr:hover{color:var(--display)}
.sbox.has .clr{display:block}
.try{display:none}
/* Left-aligned to the field's own left edge, not centred — that is how the storyboard
   sets it, and it gives the empty state a second alignment to hang on. */
.stage.hero .try{display:flex;margin:18px auto 0;gap:8px;max-width:760px;
  justify-content:flex-start;flex-wrap:wrap;align-items:center}
.try .lbl{color:var(--muted);font-size:12.5px;margin-right:2px}
/* One quiet line, on the field's own left edge. It is the only thing standing between her
   and the library, so it is text rather than a button — but it is always there. */
/* THE LIBRARY FRONT PAGE.
   The empty state used to be a search field with a photograph under it, and it read as
   bare because it was: one control and no content. Reference board 02 fills that space
   with the library itself — themes to enter by, and what has just arrived. Neither is a
   new feature. The tiles are the existing Format filter with a face on it; "Recently
   added" is the catalogue sorted by date. No new taxonomy, no new filter, and none of the
   sidebar, Collections, Favourites or profile that §9 and §26 rule out. */
.home{display:none}
.stage.hero .home{display:block;max-width:var(--col);margin:46px auto 0;text-align:left}
.homehead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin:0 0 16px}
.homehead+.themes+.homehead{margin-top:40px}   /* or the next heading sits on the tiles */
.homehead h2{font-family:var(--f-d);font-weight:500;font-size:17px;margin:0;
  color:var(--display);letter-spacing:-.005em}
.morelink{font-size:12.5px;color:var(--muted);padding:0;line-height:1.4;
  border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.morelink:hover{color:var(--navy);border-bottom-color:var(--navy)}

/* Tiles at the content width, not squeezed into the search field's 760px. At six across
   they were 110px squares — too small to recognise a room, a face or a slide, which is the
   entire job of a thumbnail. */
.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
/* position:relative is load-bearing. The label and count are siblings of .tw, not children,
   so without a positioned ancestor here they escaped the tile entirely and rendered
   nowhere useful. */
.themes button{padding:0;background:none;display:block;position:relative}
.themes .tw{display:block;width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;
  background:var(--stone-2);position:relative;box-shadow:inset 0 0 0 1px rgba(21,38,63,.07)}
.themes img{width:100%;height:100%;object-fit:cover;
  transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.themes button:hover img{transform:scale(1.05)}
/* The label sits ON the image, as board 02 sets it — a caption underneath turns six tiles
   into six captions, and the pictures stop being the thing you look at. */
/* The scrim has to survive a LIGHT tile. At .78 the B-roll tile — a pale logo on cream —
   put white type on near-white and the label was unreadable. Darker, and taller. */
.themes .tw::after{content:'';position:absolute;inset:auto 0 0 0;height:74%;
  background:linear-gradient(to top,rgba(10,16,26,.92),rgba(10,16,26,.55) 38%,transparent)}
.themes .tl{position:absolute;left:13px;right:13px;bottom:24px;z-index:1;color:#fff;
  font-family:var(--f-d);font-size:14.5px;font-weight:600;line-height:1.25;
  letter-spacing:-.004em;text-shadow:0 1px 8px rgba(14,22,34,.4)}
.themes .tn{position:absolute;left:13px;bottom:9px;z-index:1;color:rgba(255,255,255,.82);
  font-size:11.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}

.recent{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-bottom:8px}
.recent .cardx .ttl{font-size:13.5px;-webkit-line-clamp:2;margin-bottom:3px}
.recent .cardx .ctx{font-size:12px;margin:0;line-height:1.4}
.recent .cardx .tags{display:none}
.recent .shot{border-radius:10px;margin-bottom:9px}

/* 1180, not 1000. Six tiles need the full content column to be recognisable; between 1000
   and 1180 they resolved to ~154px squares with "Classroom Moments" wrapping onto two lines
   over the picture and every Recently-added title clamped mid-word. Three across at 1024 is
   a 320px tile — which is the size that makes a tile worth looking at. */
@media(max-width:1180px){
  .themes,.recent{grid-template-columns:repeat(3,1fr);gap:15px}
  /* The 4:5 crop is for a 195px tile in a row of six. Carried onto a 310px tile in a row of
     three it made two 390px-tall rows that pushed Recently added entirely off the first
     screen — a portrait ratio only works while the tile is narrow. 3:2 at this width keeps
     all six themes on one screen AND puts them in the same ratio as the result cards. */
  .themes .tw{aspect-ratio:3/2}
  .recent .cardx:nth-child(n+4){display:none}
}
@media(max-width:760px){
  .stage.hero .home{margin-top:30px}
  .themes,.recent{grid-template-columns:repeat(2,1fr);gap:12px}
  .themes .tl{font-size:13px;bottom:22px}
  .homehead h2{font-size:15.5px}
  .recent .cardx:nth-child(n+5){display:none}
}
.browseall{display:none}
.stage.hero .browseall{display:block;max-width:760px;margin:20px auto 0;text-align:left}
.browseall button{font-size:13px;color:var(--ink-2);padding:0;line-height:1.5;
  border-bottom:1px solid var(--stone);transition:color .15s,border-color .15s}
.browseall button:hover{color:var(--navy);border-bottom-color:var(--navy)}
.try button{background:var(--card);border:1px solid var(--stone);border-radius:999px;
  padding:6px 14px;font-size:12.5px;color:var(--ink-2);transition:border-color .15s,color .15s}
.try button:hover{border-color:var(--navy);color:var(--navy)}

/* the quiet brand moment at the foot of the empty state */
/* INSET, not full-bleed, and rounded — the storyboard sets the photograph inside the panel
   with the same gutters as the content, which is what keeps it feeling like part of a
   composed page rather than a banner bolted to the bottom of one. Pinning it to the foot of
   the viewport with `margin-top:auto` is gone too: that was what opened the dead band
   between the Try chips and the image. It now simply follows them. */
/* `margin-top:auto` seats it at the foot of the first screen, as the storyboard does, and
   the taller frame is what keeps the gap above it reading as composed whitespace rather
   than as the orphan band the full-bleed version left. */
/* RETIRED 17 Sep 2026. hero.jpg is a workshop group photo used as decoration, and it was
   taking the whole lower half of the first screen — 400px of desaturated grey directly
   under the one control that matters. §22 allows a hero only if it does not dominate the
   search action; this dominated it. That space now carries Explore by theme and Recently
   added, which is the library itself rather than a picture of it. The file stays in the
   repo; put this back by deleting the `display:none`. */
.heroimg{display:none}
.heroimg.on{display:block;width:min(var(--col),calc(100% - 56px));margin:auto auto 0;
  position:relative;overflow:hidden;border-radius:12px;flex:none;height:clamp(240px,30vw,400px)}
/* Muted on purpose. At full saturation the photo shouts louder than the one question on
   the page, and the italic caption sitting on it was illegible against the foliage. */
.heroimg img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  filter:saturate(.84) contrast(.99) brightness(1.02)}
/* The wash is only where the caption lands. Spread across the whole frame it drained the
   photograph of the warmth that is the point of putting it there. */
.heroimg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(252,250,247,0) 44%,rgba(252,250,247,.55) 72%,
    rgba(252,250,247,.92) 100%)}
.heroimg figcaption{position:absolute;right:30px;bottom:24px;text-align:right;z-index:1;
  font-family:var(--f-d);font-style:italic;font-size:15px;line-height:1.7;color:#243457;
  letter-spacing:.005em}
@media(max-width:760px){ .heroimg figcaption{font-size:12px;right:16px;bottom:14px} }

/* -------------------------------------------------------------------- results */
/* width:100% is load-bearing now that body is a flex column: auto inline margins on a flex
   item beat align-items:stretch, so without it .wrap sized itself to its content and landed
   6px inside the masthead's left edge. */
.wrap{width:100%;max-width:calc(var(--col) + 56px);margin:0 auto;padding:0 28px}
/* No border-top: the search bar above already closes with a full-width rule, and the two
   lines 14px apart read as a mistake. */
.filters{display:none;border-bottom:1px solid var(--stone);padding:20px 0 22px}
.filters.open{display:block}
/* Four, not auto-fit. There are exactly seven controls, and auto-fit resolved to six at
   this width — leaving Status stranded alone on a second row. 4 + 3 is deliberate. */
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px}
@media(max-width:1000px){ .fgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(max-width:620px){ .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.fgrid label{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:5px}
.fgrid select{width:100%;padding:6px 2px;border:none;border-bottom:1px solid var(--stone);
  background:none;font-family:inherit;font-size:13.5px;color:var(--ink);border-radius:0;
  transition:border-color .15s}
.fgrid select:focus{outline:none;border-bottom-color:var(--navy)}
.fclear{margin-top:20px;color:var(--navy);font-size:13.5px;font-weight:500;padding:0;
  text-decoration:underline;text-underline-offset:3px}

.summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:20px 0 16px;flex-wrap:wrap}
/* A sentence rather than a count — "6 relevant results / Most relevant first" is a database
   reporting its query plan, and this is the library telling her what it found.
   But NOT serif at 16.5px. At that size and face it was identical to the card titles below
   it, so the line describing the results carried exactly as much weight as any one result:
   no hierarchy at all. Both reference boards set this as a small bold sans caption above a
   grid of serif titles, and pair it with the control at the other end of the row. */
.summary h2{font-weight:600;font-size:13px;margin:0;color:var(--display);letter-spacing:.005em}
/* Refine is the old Filters control, demoted out of the primary row: quiet text, no border,
   no icon, no pill. Present for the person who wants it, invisible to the person who does
   not — which is the opposite of a bordered button sitting beside the field. */
/* Quiet, but a control. As bare 12.5px --muted text it was indistinguishable from the
   context lines below it and read as a caption; the icon and the darker ink are what say
   "press me" without putting a bordered button back on the primary row. */
.sumright{display:flex;align-items:baseline;gap:18px}
.summary .refine{display:inline-flex;align-items:center;gap:7px;font-size:13px;
  color:var(--ink-2);padding:0;line-height:1.4;
  border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.summary .refine svg{width:14px;height:14px;flex:none;opacity:.75;transition:opacity .15s}
.summary .refine:hover,.summary .refine.on{color:var(--navy);border-bottom-color:var(--navy)}
.summary .refine:hover svg,.summary .refine.on svg{opacity:1}

/* Gutters measured off the storyboard: the column gap there is ~11% of the card width,
   and the row gap runs about a quarter wider again so rows read as rows. */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px 36px;padding-bottom:24px}
/* A flex column, not a block. Row alignment used to be bought by reserving two lines of
   title height on EVERY card — which meant a one-line title left a 20px hole between
   itself and its own context line, on most cards, in every view. The slack belongs at the
   BOTTOM of the card, not inside it: stretched to the row's height, each card can hug its
   own text and still land its tag pills on one shared baseline (see .tags below). */
.cardx{text-align:left;padding:0;display:flex;flex-direction:column;width:100%;background:none}
/* display:block matters. As an inline span, aspect-ratio and width:100% were both
   ignored, every thumbnail rendered at its natural size and the cards ran 718px tall. */
/* 3:2 and an 8px radius, measured off the storyboard. The 5:4 crop was taller than the
   design, which pushed the second row of results below the fold at 1440x900 where the
   storyboard shows two full rows; square corners read as data cells rather than content. */
.shot{display:block;position:relative;width:100%;aspect-ratio:3/2;border-radius:8px;
  overflow:hidden;background:var(--stone-2);margin-bottom:12px;
  box-shadow:inset 0 0 0 1px rgba(21,38,63,.07);transition:box-shadow .25s}
/* The only hover feedback was a 3.5% image scale inside a fixed frame, which on a busy
   photograph is close to invisible. A soft lift under the frame reads at a glance and tells
   you the whole card is the target, not just the picture. */
.cardx:hover .shot{box-shadow:inset 0 0 0 1px rgba(21,38,63,.07),0 12px 26px -16px rgba(21,38,63,.55)}
/* Absolute, so it paints over the "no preview" label that always sits underneath it.
   23 of the 378 rows point at a thumbnail that 404s; removing the broken <img> then
   uncovers the label instead of leaving a silent empty rectangle. */
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .45s cubic-bezier(.2,.6,.2,1)}
.cardx:hover .shot img{transform:scale(1.035)}
.shot .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#c3b8a8;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
/* The white ring is what makes the badge legible on a bright thumbnail as well as a dark
   one — without it the play mark disappears into the gold-bar stills. */
.play{position:absolute;left:12px;bottom:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(14,22,34,.72);box-shadow:0 0 0 1.5px rgba(255,255,255,.9);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}
.play::after{content:'';border-left:9px solid #fff;border-top:6px solid transparent;
  border-bottom:6px solid transparent;margin-left:3px}
.dur{position:absolute;right:12px;bottom:12px;background:rgba(14,22,34,.72);backdrop-filter:blur(3px);
  color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:4px;line-height:1.35;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* Two lines, always. Reserving the second line is what lets the context lines and the tag
   pills sit on one baseline right across a row of three. */
/* Serif titles, as reference board 04 sets them. Inter 600 read as a UI label on a row;
   Lora reads as the name of a piece of content, which is what it is. */
.kind{position:absolute;left:12px;bottom:12px;width:30px;height:30px;border-radius:50%;
  background:rgba(14,22,34,.6);box-shadow:0 0 0 1.5px rgba(255,255,255,.85);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;color:#fff}
.kind svg{width:15px;height:15px}
/* Deliberately not a circle like .play and .kind — this is an absence, and it should not
   read at a glance as another control you can press. */
.nopv{position:absolute;left:12px;bottom:12px;background:rgba(14,22,34,.6);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.55);backdrop-filter:blur(3px);color:rgba(255,255,255,.92);
  font-size:10px;font-weight:500;letter-spacing:.03em;padding:4px 9px;border-radius:4px;line-height:1.3}
@media(max-width:760px){ .nopv{font-size:8.5px;padding:3px 6px;left:5px;bottom:5px} }
.cardx .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-family:var(--f-d);font-size:16px;font-weight:600;line-height:1.36;color:var(--display);
  margin-bottom:4px;transition:color .15s;letter-spacing:-.006em}
.cardx:hover .ttl{color:var(--navy)}
/* Who and when is the line she scans a row by — it was 12px at --muted (#8c94a1), which on
   this paper is roughly 2.8:1 and read as disabled text rather than as information. */
.cardx .ctx{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.45}
/* No auto-margin pushing these to a shared row baseline. That was tried: it aligns the
   pills, but it does it by moving the hole rather than closing it — a one-line card then
   carries 42px of air between its context line and its own tags. Reference board 04 does
   not align them either; a card that hugs its own text reads as one object, and a 22px rag
   where a title runs to two lines is cheaper than a hole inside every other card. */
.cardx .tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cardx .t{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:5px;
  background:var(--stone-2);color:var(--ink-2);white-space:nowrap;line-height:1.35}
.cardx .tsep{color:var(--muted);font-size:11.5px;line-height:1}

/* A soft filled bar, as the storyboard draws it — not a bordered white one. White fill
   inside a hairline stone border, 1284px wide, read as an empty text input sitting under
   the results; and at radius 6 against the cards' 8 it was subtly out of key with
   everything above it. Fill and no border is what makes it read as a quiet band of page
   you can press rather than a field you should type into. */
.weak{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin:24px 0 48px;padding:15px;border-radius:8px;
  color:var(--ink-2);font-size:13.5px;font-weight:500;background:var(--stone-2);
  transition:background .15s,color .15s}
.weak:hover{background:var(--stone);color:var(--display)}
.sep{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:4px 0 0;
  color:var(--muted);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:500}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--stone)}
/* Section rule for the browse view. Same language as .sep, its own spacing — it separates
   whole grids rather than sitting inside one. */
.gsec{display:flex;align-items:center;gap:16px;margin:34px 0 20px;color:var(--ink-2);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.gsec:first-child{margin-top:8px}
.gsec .n{color:var(--muted);font-weight:500;letter-spacing:.06em}
.gsec::after{content:'';flex:1;height:1px;background:var(--stone)}

.none-state{text-align:center;padding:76px 24px 100px}
/* The storyboard's empty-result mark is generous — roughly twice the height of the search
   field it sits under. At 60px it read as an apology; at 84px it reads as a full stop. */
.none-state .ring{width:84px;height:84px;border-radius:50%;background:var(--stone-2);
  margin:0 auto 28px;display:flex;align-items:center;justify-content:center}
.none-state h2{font-family:var(--f-d);font-weight:500;font-size:24px;margin:0 0 10px;
  color:var(--display);letter-spacing:-.008em}
.none-state p{color:var(--muted);font-size:13.5px;margin:0 0 26px}

/* --------------------------------------------------------------------- detail */
.scrim{position:fixed;inset:0;background:rgba(36,49,63,.34);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
/* A CENTRED MODAL, not a right-edge drawer. The drawer forced everything into one vertical
   stack — media on top, metadata underneath — which is what squashed the media into a short
   letterbox and put the database fields in the middle of vision. The storyboard composes it
   side by side: media left, words right. Restoring that is the whole point of this pass. */
#detail{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:28px;opacity:0;pointer-events:none;transition:opacity .2s}
#detail.open{opacity:1;pointer-events:auto}
/* fit-content, so the card takes its width from the asset. A fixed 1080 left a portrait
   still floating in the middle of an over-wide left column — the same visual fault as the
   pillarboxing, one level up. The storyboard's two detail panels are not the same width
   either: the composition follows the media. */
.dcard{width:fit-content;max-width:min(1080px,100%);min-width:min(720px,100%);
  max-height:calc(100vh - 56px);background:var(--paper);
  border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px -26px rgba(21,38,63,.5);
  transform:translateY(12px) scale(.985);transition:transform .24s cubic-bezier(.4,0,.2,1)}
#detail.open .dcard{transform:none}
/* No rule on desktop: with only a close button in it, a bordered bar reads as an empty
   toolbar. The storyboard just floats the ✕. Mobile keeps the rule — it has a Back control
   that needs to sit against something. */
.dtop{display:flex;align-items:center;padding:14px 24px 0;flex:none}
.dtop .back{display:none;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.dtop .x{margin-left:auto;width:30px;height:30px;border-radius:50%;color:var(--muted);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
.dtop .x:hover{background:var(--stone-2);color:var(--display)}
.dbody{overflow-y:auto;flex:1;padding:14px 24px 32px}
/* video detail is two columns; image/carousel detail is one wide visual then text */
/* stretch, not start: the right column then runs the full height of the player, so
   `margin-top:auto` can drop the actions onto the same bottom line as the filmstrip. */
/* `auto` for the media column so it hugs the asset, and a bounded text column so the words
   keep a readable measure whatever the media does. */
.dgrid{display:grid;grid-template-columns:auto minmax(320px,390px);gap:34px;align-items:start}
/* NO fixed frame, and no background behind the media. The old box was a fixed landscape
   rectangle with `width:100%` and `object-fit:contain`, so every portrait asset floated in
   the middle of it with wide beige bars either side — on mobile roughly a third of the
   media area was dead space. Letting the media size itself and the box hug it means the
   frame takes the asset's own aspect ratio, and there is nothing left to pillarbox. */
/* fit-content on BOTH. The media column is `auto`, so it sized to the widest thing in it —
   which was the "no sound" note, not the player. The dark ground then stretched to 612px
   behind a 324px portrait clip, and the bars were back by a different route. Hugging the
   media means the ground can never be wider than what it sits behind, and the filmstrip
   lines up with the player edge as the storyboard draws it. */
.dvis{display:flex;flex-direction:column;width:fit-content;max-width:100%}
.dmedia{display:flex;align-items:flex-start;justify-content:center;border-radius:8px;
  width:fit-content;max-width:100%}
.dmedia img,.dmedia video{display:block;max-width:min(620px,48vw);max-height:64vh;
  width:auto;height:auto;border-radius:8px}
/* Dark ground only behind a real player — black surround is a video convention, and a
   photograph on a near-black slab made two harsh columns. It hugs the player, so it can
   never show as bars. */
.dmedia.dark{background:#141d27}
/* A grid of five, so the strip measures exactly the same as the player above it — the
   storyboard aligns both edges, and five fixed-width frames left a ragged right end. */
/* `width:0;min-width:100%` keeps these two OUT of the wrapper's intrinsic width while still
   letting them fill it. Without it the five 120px canvases summed to 632px and the note's
   text to ~600px, so the fit-content wrapper sized to THEM rather than to the 324px portrait
   player — which pushed the modal back out to its 1080 cap and reopened a gap beside the
   media. The strip must measure the player, not the other way round. */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;
  width:0;min-width:100%}
.strip .frame{width:100%;height:auto;border-radius:3px;opacity:.85;display:block;
  transition:opacity .15s;background:var(--stone-2)}
.strip .frame:hover{opacity:1}
/* The asset's caveat, closing the text column under the actions — see openDetail. */
.dnote{display:flex;gap:11px;align-items:flex-start;margin-top:26px;padding:14px 16px;
  background:var(--cream);border-radius:8px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.dnote svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--navy);opacity:.85}
.dnote b{display:block;font-weight:600;font-size:13px;color:var(--display);margin-bottom:3px;
  letter-spacing:-.003em}
.dtext{display:flex;flex-direction:column}
.dtext h2{font-family:var(--f-d);font-weight:600;font-size:21px;line-height:1.3;margin:0 0 6px;
  color:var(--display);letter-spacing:-.005em}
.dtext .ctx{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.dtext .desc{font-size:13.5px;color:var(--ink-2);line-height:1.62;margin:0 0 24px}
.dl{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:start;align-content:start;
  gap:11px 16px;font-size:13px;margin:0 0 28px}
.dl.two{grid-template-columns:76px minmax(0,1fr) 76px minmax(0,1fr);gap:11px 20px}
.dl dt{color:var(--muted);font-weight:400;line-height:1.45}
.dl dd{margin:0;color:var(--ink);line-height:1.45}
.dl dd.unset,.dl dd .unset{color:#a8a095;font-style:italic}
/* Right-aligned and last, as the storyboard has them — the actions close the column
   rather than interrupting it.
   NOT `margin-top:auto`. Pinning them to the foot of a column whose height is set by a
   tall player opened a 390px canyon between the last metadata row and the buttons — the
   two things that belong together were the two furthest apart on the screen. Reference
   board 04 sets the actions a single generous step below the metadata and lets the column
   end there; the media column is free to run on past it. */
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.btn{border-radius:6px;padding:11px 18px;font-size:13.5px;font-weight:500;
  border:1.5px solid var(--navy-deep);background:var(--navy-deep);color:#fff;text-decoration:none;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:#142e49;border-color:#142e49}
.btn.ghost{background:var(--card);color:var(--ink-2);border-color:var(--stone)}
.btn.ghost:hover{background:var(--card);border-color:var(--navy);color:var(--navy)}
.btn svg{flex:none}
.nolink{margin:0;font-size:12.5px;color:var(--muted);font-style:italic;align-self:center}

/* --------------------------------------------------------------------- mobile */
@media(max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr);gap:36px 30px} }
@media(max-width:860px){ .dgrid{grid-template-columns:1fr} .acts{justify-content:flex-start} }
@media(max-width:760px){
  .mast{padding-block:13px} .brand{font-size:17px}
  /* The storyboard's phone opens on search and goes straight to results — there is no hero
     on mobile at all. Carried over from desktop it produced roughly 500px of void followed
     by a washed-out photograph almost entirely below the fold. */
  .heroimg{display:none}
  .stage{top:44px;padding-block:11px} .stage.hero{padding:3.5vh 16px 0}  /* 13+17+13+1 */
  .wrap{padding:0 16px} .mast,.stage{padding-inline:16px}
  /* The storyboard's mobile header carries the count alone — the sort note is the first
     thing to go when there is 343px to play with. */
  .summary{padding:16px 0 10px} .summary .sub{display:none}
  /* Storyboard mobile is a compact scannable LIST, not stacked full-width cards —
     more results per screen with thumbnails still big enough to recognise. The tag pills
     are dropped here: the storyboard's mobile rows carry title + context only. */
  .grid{display:block;padding-bottom:12px}
  /* `auto 1fr` is load-bearing. With two equal rows the grid split the thumbnail's spare
     height between them and the context line drifted 23px clear of its own title. */
  .cardx{display:grid;grid-template-columns:116px minmax(0,1fr);grid-template-rows:auto 1fr;
    gap:0 14px;align-items:start;padding:13px 0;border-bottom:1px solid var(--stone-2)}
  .shot{grid-row:1/3;width:116px;aspect-ratio:3/2;margin:0;border-radius:6px}
  .cardx:hover .shot img{transform:none}
  .cardx .ttl{grid-column:2;font-size:14px;margin-bottom:4px;align-self:start}
  .cardx .ctx{grid-column:2;margin-bottom:0;align-self:start}
  .cardx .tags{display:none}
  .dur{font-size:9.5px;padding:2px 5px;right:5px;bottom:5px}
  .play{width:22px;height:22px;left:5px;bottom:5px;box-shadow:0 0 0 1.2px rgba(255,255,255,.9)}
  .play::after{border-left-width:6px;border-top-width:4px;border-bottom-width:4px;margin-left:2px}
  .sep{margin:18px 0 8px}
  .weak{margin:14px 0 32px}
  /* Full-screen on a phone: a centred card with a margin around it wastes the only
     dimension there is. */
  #detail{padding:0}
  .dcard{width:100%;height:100%;max-height:100%;border-radius:0;transform:none}
  .dtop .back{display:flex} .dtop .x{display:none}
  .dtop{padding:12px 16px;border-bottom:1px solid var(--stone)} .dbody{padding:18px 16px 28px}
  .dl,.dl.two{grid-template-columns:72px minmax(0,1fr);gap:10px 14px}
  /* Everything below is aimed at one thing: getting "Open in Drive" onto the first screen.
     The storyboard's phone detail shows media, title, a short description, Type and Topic,
     then the button — and nothing else above it. */
  /* The 48vw cap exists to balance the two desktop columns; on a phone there is only one
     column, and 48vw is 180px — half the screen left unused. Centred, because the wrapper
     hugs the media and a portrait still would otherwise sit hard against the left margin. */
  .dvis{margin-inline:auto}
  .dmedia img,.dmedia video{max-width:calc(100vw - 32px);max-height:50vh}
  .dtext .desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;margin-bottom:18px}
  .dl{margin-bottom:20px}
  .dl .sec{display:none}
  /* Stacked, full width — the storyboard's phone detail gives "Open in Drive" the whole
     measure rather than halving it against a secondary action. */
  .acts{gap:9px;flex-direction:column;align-items:stretch}
  .acts .btn{width:100%;justify-content:center;padding:13px 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <button class="brand" id="home">IFM OS</button>
  <span class="count" id="libcount"></span>
</header>

<div class="stage hero" id="stage">
  <div class="herotext"><h1>What are you looking for?</h1></div>
  <!-- A request field, not a search box. The magnifier is deliberately gone: a hand lens is
       the universal mark of "query this database", and it was the first thing on the page
       telling her she was addressing a system rather than asking for something. -->
  <div class="searchrow">
    <div class="sbox" id="sbox">
      <input id="q" type="search" placeholder="Tell us what you're looking for…" autocomplete="off" aria-label="Tell us what you're looking for">
      <button class="clr" id="clearq" aria-label="Clear"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="try">
    <span class="lbl">Try</span>
    <button data-ex="Hiral talking about gold">Hiral talking about gold</button>
    <button data-ex="funny classroom moments">funny classroom moments</button>
    <button data-ex="August certificates">August certificates</button>
  </div>
  <!-- The front door. Without it the only way into 378 assets was guessing the right
       words, because `main` is hidden until something is searched or filtered.
       Reference board 02 arrives at the same conclusion from the design side — "Explore
       by theme" — so the text link it started as is now what that board shows: real
       thumbnails, real counts, one tap into the library. -->
  <div class="home">
    <div class="homehead"><h2>Explore by theme</h2>
      <button class="morelink" data-act="browse" id="browseall"></button></div>
    <div class="themes" id="themes"></div>
    <div class="homehead"><h2>Recently added</h2></div>
    <div class="recent" id="recent"></div>
  </div>
</div>

<figure class="heroimg" id="heroimg">
  <img src="hero.jpg" alt="" loading="lazy">
  <figcaption>Real conversations<br>Real women<br>A richer financial future</figcaption>
</figure>

<main class="wrap" id="main" hidden>
  <!-- Summary first, then the refine panel it belongs to: the control that opens it now
       lives on the summary line, so the panel has to unfold directly beneath it. -->
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters">
    <div class="fgrid" id="fgrid"></div>
    <button class="fclear" id="fclear" hidden>Clear filters</button>
  </div>
  <div id="results"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside id="detail" aria-hidden="true">
  <div class="dcard">
    <div class="dtop">
      <button class="back" id="dback"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 19l-7-7 7-7"/></svg>Back</button>
      <button class="x" id="dclose" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dbody" id="dbody"></div>
  </div>
</aside>

<script src="taxonomy.js"></script>
<script src="v1-catalogue.js"></script>
<script src="media-map.js"></script>
<script src="transcripts.js"></script>
<script src="interpreter.js"></script>
<script>
/* The Library is what Aakara can discover. `library:false` covers logos, playable games
 * and the 33 Goa clips whose masters were deleted; "Do Not Use" is the human's own verdict,
 * set in the Catalogue sheet. Marking it removes the asset from view here IMMEDIATELY and
 * reversibly, and nothing on Drive moves until someone runs scripts/ifm-retire-assets.sh
 * on a machine. That separation is deliberate: this page is public and un-authenticated,
 * so it must never be able to destroy anything. */
const T=window.IFM_TAXONOMY,
      ASSETS=window.IFM_V1.filter(r=>r.library!==false && (r.status||'')!=='Do Not Use');
// Fold speech into each asset's searchable text BEFORE the engine builds its index. The
// engine already weights `search_terms`, so a spoken word becomes findable without
// touching a line of frozen scoring code, and without inventing a new taxonomy field.
(function(){
  const TX=window.IFM_TRANSCRIPTS||{};
  ASSETS.forEach(a=>{ const t=TX[a.id]; if(t) a.search_terms=((a.search_terms||'')+' '+t).trim(); });
})();
/* ---------------------------------------------------------------- search ----
 * Deliberately NOT embeddings. Embeddings need an API at index time, ship a vector
 * blob, and add infrastructure this project does not have. What actually makes the
 * example queries work is having good TEXT to match — the per-asset `search_terms`
 * field carrying synonyms, the finance terms that have no Topic of their own (SIP,
 * XIRR, SGB), and affect words people really type ("funny", "candid").
 *
 * Matching is WORD-BOUNDARY, not substring. That single decision is what stops a
 * search for "gold" returning "marigold", "teal/gold" and "black/gold" — which is
 * exactly what the current hub does, on 37 rows, almost all of them wrong.
 */
const STOP=new Set(['find','me','a','an','the','of','for','show','get','to','on','in','at','is',
  'with','and','or','some','any','please','i','want','need','looking','look','can','you','that',
  'from','about','where','which','it','this','our','us','all',
  // Generic query nouns. They carry no discriminating meaning and mostly do not appear in
  // the catalogue text at all, so without this they were treated as "words we do not have"
  // and vetoed perfectly good queries — "funny classroom moments" returned nothing because
  // of `moments`. Note `footage`, `shot` and `clip` are NOT here: they map to real
  // Format/Type meaning through SYN.
  'moment','moments','content','stuff','thing','things','something','anything',
  'piece','pieces','asset','assets','file','files','material','bit','bits','item','items',
  // Conversational filler. These are how people TALK, and they are catastrophic here: 'was'
  // occurs in exactly 1 of 378 assets, so it scores an IDF of 27.8 against 'gold' at 6.1 —
  // a meaningless word outweighing the subject 4x and starving the coverage test.
  'was','were','do','does','did','we','have','has','had','there','here','be','been',
  'good','nice','great','best','really','just','actually','maybe','some','somewhere',
  'that','those','these','my','your','their','am','are','then','when','while','got']);

// Query word -> extra tokens. Lets someone type how they speak and still hit the taxonomy.
const SYN={
  talking:['hiral speaking','speaking','explaining','teaching'],
  talks:['hiral speaking','speaking'], talk:['hiral speaking','speaking'],
  speaking:['hiral speaking'], explains:['hiral speaking','explaining'],
  explaining:['hiral speaking'], teaching:['hiral speaking'], teaches:['hiral speaking'],
  says:['hiral speaking'], discusses:['hiral speaking','explaining'], discussing:['hiral speaking'],
  funny:['candid','laughing','smiling','fun','warm','joyful','lively'],
  fun:['candid','smiling','lively'], candid:['candid','unposed','natural'],
  testimonial:['testimonial'], testimonials:['testimonial'], review:['testimonial'],
  reviews:['testimonial'], feedback:['testimonial'],
  broll:['b-roll'], 'b-roll':['b-roll'], cutaway:['b-roll'], footage:['b-roll'],
  clip:['video'], clips:['video'], reel:['video'], reels:['video'], film:['video'],
  photo:['image'], photos:['image'], picture:['image'], pictures:['image'], image:['image'],
  pic:['image'], pics:['image'], snap:['image'], snaps:['image'], visual:['image'],
  visuals:['image'], imagery:['image'], stills:['image'], still:['image'],
  shot:['image'], shots:['image'], headshot:['portrait'], headshots:['portrait'],
  portrait:['portrait'], portraits:['portrait'],
  certificate:['certificate'], certificates:['certificate'], graduation:['certificate'],
  question:['student question'], questions:['student question'], qna:['student question'],
  classroom:['classroom moment'], workshop:['classroom moment','workshop'],
  student:['student'], students:['student'], teens:['teens','student'],
  ai:['ai generated'], generated:['ai generated'],
  sip:['sip','systematic investment plan','compounding'],
  xirr:['xirr','cagr','returns','risk & returns'],
  independence:['financial independence'], freedom:['financial independence'],
  august:['aug'], july:['jul'], june:['jun'], september:['sep'],
};

// Field weights. Topic and title dominate; description is support, not signal.
const FIELDS=[
  ['title',5],['topic',5],['format',4],['person',4],['search_terms',3],
  ['slide_text',3],['session',3],['source',2],['type',2],['description',2],
];

function textOf(a,f){
  const v=a[f];
  return Array.isArray(v)?v.join(' ').toLowerCase():String(v||'').toLowerCase();
}
function tokenise(s){
  return s.toLowerCase().split(/[^a-z0-9₹&/+-]+/).filter(w=>w.length>1&&!STOP.has(w));
}
function expand(tokens){
  const out=[];
  tokens.forEach(t=>{ out.push(t); (SYN[t]||[]).forEach(s=>out.push(s)); });
  return [...new Set(out)];
}
// Word-boundary test. `gold` must not match `marigold`.
function hasTerm(hay,term){
  if(term.includes(' ')) return hay.includes(term);
  return new RegExp('(^|[^a-z0-9])'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(hay);
}

/* Rarity weighting (IDF). Without it, "the video where Hiral talks about XIRR" ranks
 * every Hiral video above the one asset that actually says XIRR, because `hiral`,
 * `video` and `talks` each score as much as the one rare word that identifies it.
 * Computed once over the corpus: a term in 1 of 20 assets is worth far more than a
 * term in 15 of 20. */
const DF={};
ASSETS.forEach(a=>{
  const seen=new Set();
  FIELDS.forEach(([f])=>tokenise(textOf(a,f)).forEach(t=>seen.add(t)));
  seen.forEach(t=>DF[t]=(DF[t]||0)+1);
});
// Squared, not linear. A linear curve made `xirr` (in 1 asset) worth only ~2x `hiral`
// (in 12), so three Hiral videos still outranked the one asset that mentions XIRR.
// Squaring makes it ~5x, which is what "the video about XIRR" actually means.
const idf=t=>Math.pow(Math.log(1+ASSETS.length/(1+(DF[t]||0))),2)+0.3;

/* IDF of a word the USER typed. A word absent from the corpus scores near-infinite
 * rarity, which is right for ranking but wrong for coverage: "talks" appears in no
 * asset, so it dominated the denominator and pushed the XIRR asset below the 55% bar
 * despite matching the only word that mattered. When a word is reachable only through a
 * synonym, weight it as that synonym — which is what it actually means here. */
function rawIdf(t){
  if(DF[t]) return idf(t);
  let best=0;
  (SYN[t]||[]).forEach(s=>{ const h=s.split(' ')[0]; if(DF[h]) best=Math.max(best,idf(h)); });
  return best||idf(t);
}

// Words that constrain rather than describe. If a query names a format or a type, the
// user means "only those" — "gold b-roll" must not return gold talks ranked above b-roll.
//
// ⚠️ Constraints are read from what the user ACTUALLY TYPED, never from the synonym
// expansion. "Hiral talks about XIRR" expands `talks` -> `hiral speaking`; treating that
// as a hard format filter silently excluded every B-roll asset, including the only one
// that mentions XIRR. A synonym is a hint for ranking; it is not an instruction.
const FORMAT_L=T.format.map(f=>f.toLowerCase());
const TYPE_L=T.type.map(t=>t.toLowerCase());
function constraintsOf(rawTokens,queryText){
  const q=' '+queryText.toLowerCase()+' ';
  return {
    format:FORMAT_L.filter(f=>f.includes(' ')||f.includes('/')?q.includes(f):rawTokens.includes(f)),
    type:TYPE_L.filter(t=>rawTokens.includes(t)),
  };
}

function conWordsOf(con){
  const w=new Set();
  [...con.format,...con.type].forEach(v=>{ w.add(v);
    v.split(/[^a-z0-9]+/).filter(Boolean).forEach(p=>w.add(p)); });
  return w;
}
function search(query){
  const raw=tokenise(query);
  if(!raw.length) return ASSETS.map(a=>({a,score:0,hits:[]}));
  const terms=expand(raw);
  // Which raw word produced which expanded term, so a synonym hit still counts as
  // covering the word the user typed ("august" -> "aug" must satisfy "august").
  const origin={};
  raw.forEach(r=>{ origin[r]=r; (SYN[r]||[]).forEach(s=>{ origin[s]=r; }); });
  const con=constraintsOf(raw,query);

  // A word the user typed that appears NOWHERE in the library — not in any field, and not
  // via a synonym — is strong evidence we do not have the thing they are describing.
  // "purple elephant" was returning the Money Map reel because `purple` matched its purple
  // budget tracker and `elephant` was quietly dropped from consideration. Dropping the
  // unmatched word turned a two-word query into a one-word one. When any content word is
  // wholly absent from a multi-word query, the honest answer is nothing.
  const contentWords=raw.filter(t=>!conWordsOf(con).has(t));
  if(contentWords.length>1){
    const absent=contentWords.filter(t=>!DF[t] && !(SYN[t]||[]).some(x=>DF[x.split(' ')[0]]));
    if(absent.length) return [];
  }

  const results=[];
  ASSETS.forEach(a=>{
    if(con.format.length && !con.format.includes((a.format||'').toLowerCase())) return;
    if(con.type.length && !con.type.includes((a.type||'').toLowerCase())) return;

    // Score each TERM ONCE, at the best field it appears in — not once per field.
    // Summing across fields let `hiral` bank points from title + person + description +
    // search_terms, which is how a generic Hiral video outranked the XIRR one.
    const best={}; const coveredRaw=new Set(); const hits=new Set();
    FIELDS.forEach(([f,w])=>{
      const hay=textOf(a,f);
      if(!hay) return;
      terms.forEach(t=>{
        if(hasTerm(hay,t)){
          if(w>(best[t]||0)) best[t]=w;
          if(origin[t]) coveredRaw.add(origin[t]);
          if(['topic','format','person','type','source'].includes(f)) hits.add(f);
        }
      });
    });
    let score=0;
    Object.entries(best).forEach(([t,w])=>{ score+=w*idf(t.split(' ')[0]); });

    // CONTROLLED-VOCABULARY BOOST (approved 16 Sep). A word that names a Topic or Format
    // the asset actually carries is a far stronger signal than the same word appearing in
    // prose. Without this, searching `gold` returned 36 results ALL scoring exactly 68 —
    // every hit tied, so ordering was array position, and four decorative "gold globe"
    // renders outranked the real gold-investment clips. Ties also left no score spread,
    // so the relevance cutoff had nothing to cut.
    // Matching is per word inside the value, so `allocation` hits "Asset Allocation" and
    // `classroom` hits "Classroom Moment" without needing the exact phrase.
    const controlled = [...(a.topic||[]), a.format||''].join(' ').toLowerCase();
    raw.forEach(t=>{ if(controlled && hasTerm(controlled, t)) score += idf(t) * 9; });

    // Tie-break: an asset whose TITLE names the thing edges ahead of one that merely
    // carries the tag. Six assets legitimately carry the Gold topic and tied exactly;
    // 'Gold as a Safe Haven Talk' should sit above 'Swayamvar — game reel'. Scoring
    // takes each term once at its best field, so title and topic both being weight 5
    // meant holding both counted no more than holding one.
    const titleL = (a.title||'').toLowerCase();
    raw.forEach(t=>{ if(hasTerm(titleL, t)) score += idf(t) * 3; });

    // Coverage is measured in IDF MASS, not word count. Two failures drove this:
    //   "student testimonials" — `student` never matches the text-quote carousel, but
    //      `testimonials` is the rare, load-bearing word. Counting words dropped it.
    //   "financial independence" — `financial` is common and matches Financial Planning
    //      assets; the phrase itself matches nothing. Counting words let it through.
    // Requiring most of the query's *rarity* to be accounted for handles both.
    // A word used as a CONSTRAINT is already doing its job by filtering, so it must not
    // also count as content matched. Otherwise "gold b-roll" is satisfied by `b-roll`
    // alone and quietly degenerates into "every B-roll asset", ignoring gold entirely.
    const conWords=new Set();
    [...con.format,...con.type].forEach(v=>{
      conWords.add(v);                                     // the whole value, e.g. "b-roll"
      v.split(/[^a-z0-9]+/).filter(Boolean).forEach(w=>conWords.add(w));   // and its parts
    });
    const meaningful=raw.filter(t=>((DF[t]||0)>0 || (SYN[t]||[]).some(s=>DF[s.split(' ')[0]]>0))
                                   && !conWords.has(t));
    if(!meaningful.length){
      // Two very different situations reach here and they must not share an answer.
      // (a) The query was nothing BUT a constraint ("portrait", "b-roll"): the filter has
      //     already selected the right set, so every survivor is a hit.
      // (b) NOTHING the user typed exists anywhere in the corpus ("CAGR", "REIT"): the
      //     honest answer is no results. Returning everything — which this did, all 378
      //     assets for "ETF" — is the worst possible response to an unknown term.
      if(!con.format.length && !con.type.length) return;
      results.push({a,score:Math.round(score)||1,hits:[...hits]}); return;
    }
    // ROOT-CAUSE FIX. Coverage asks "did we account for most of what she meant?" and
  // weights each word by rarity. But rarity in a 378-asset catalogue is not importance:
  // 'was' appears in 1 asset and scores 27.8, while 'gold' appears in 36 and scores 6.1.
  // A filler word therefore outweighed the subject 4x and starved every query of coverage.
  // Capping the weight any single word can contribute keeps rare-but-real terms strong
  // (xirr, sgb) while stopping incidental words from deciding the whole query.
  const COVER_CAP=8;
  const cidf=t=>Math.min(rawIdf(t),COVER_CAP);
  let total=0; meaningful.forEach(t=>total+=cidf(t));
    let cover=0; coveredRaw.forEach(t=>{ if(meaningful.includes(t)) cover+=cidf(t); });
    // 0.45, not 0.55. At 20 assets 0.55 was right; across 379 a single rare filler word
    // ('batch', 'clip') carries enough IDF mass on its own to sink a query whose real
    // terms all matched. 'certificates from the August batch' lost the August certificates
    // this way. Re-verified against the full suite after loosening.
    if(cover/total < 0.45) return;

    results.push({a,score:Math.round(score+cover*6),hits:[...hits]});
  });
  return results.sort((x,y)=>y.score-x.score);
}
/* ======================================================================= UI ==
 * Presentation only. Everything above is the approved search engine, byte-identical.
 */
const MEDIA=window.IFM_MEDIA||{};
const media=a=>MEDIA[a.id]||{kind:'image',playable:false};
const RELEVANT=0.7;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={q:'',filters:{},showWeak:false,openId:null,engaged:false,browse:false,sort:'relevance'};

const FILTERS=[['type','Type',T.type],['format','Format',T.format],['topic','Topic',null],
  ['person','Person',T.person],['source','Source',T.source],['session','Session',null],['status','Status',T.status]];
function buildFilters(){
  const sessions=[...new Set(ASSETS.map(a=>a.session).filter(Boolean))].sort();
  $('fgrid').innerHTML=FILTERS.map(([k,label,vals])=>{
    const opts = k==='topic'
      ? Object.entries(T.topic).map(([g,vs])=>`<optgroup label="${esc(g)}">${vs.map(v=>`<option>${esc(v)}</option>`).join('')}</optgroup>`).join('')
      : (vals||sessions).map(v=>`<option>${esc(v)}</option>`).join('');
    return `<div><label for="f-${k}">${esc(label)}</label><select id="f-${k}" data-k="${k}"><option value="">Any</option>${opts}</select></div>`;
  }).join('');
  $('fgrid').querySelectorAll('select').forEach(s=>s.onchange=()=>{state.filters[s.dataset.k]=s.value;state.showWeak=false;render();});
}
const activeFilters=()=>Object.values(state.filters).filter(Boolean).length;
function clearFilters(){state.filters={};$('fgrid').querySelectorAll('select').forEach(s=>s.value='');state.showWeak=false;render();}

/* Spec §8:  user request -> interpretation -> existing engine -> ranking.
 * The interpreter is a TRANSLATOR. It strips purpose and filler, maps subjects onto
 * controlled Topics and passes through the constraints she actually stated; it never
 * scores, never ranks and never sees an asset. The engine below it is untouched.
 * If interpreter.js fails to load for any reason the page falls straight back to the
 * raw engine rather than breaking search. */
const INT=window.IFM_INTERPRETER;
const retrieve=q=>INT?INT.run(q,search).results:search(q);

function currentResults(){
  let list=state.q.trim()?retrieve(state.q):ASSETS.map(a=>({a,score:0}));
  const f=state.filters;
  list=list.filter(({a})=>(!f.type||a.type===f.type)&&(!f.format||a.format===f.format)&&
    (!f.topic||(a.topic||[]).includes(f.topic))&&(!f.person||(a.person||[]).includes(f.person))&&
    (!f.source||a.source===f.source)&&(!f.session||a.session===f.session)&&(!f.status||a.status===f.status));
  if(!state.q.trim()) return {strong:list,weak:[]};
  const top=list.length?list[0].score:0;
  return {strong:list.filter(x=>x.score>=top*RELEVANT),weak:list.filter(x=>x.score<top*RELEVANT)};
}

// "Hiral · Apr 2026" — who and when, the two things she actually remembers.
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONRX='Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec';
// Session strings carry a day where the catalogue happens to have one, so the context
// lines read "4 Jun 2026" in one card and "Apr 2026" in the next. Month and year is the
// grain she thinks in, and it is the grain the storyboard shows — so drop the day.
const dropDay=s=>s.replace(new RegExp('\\b\\d{1,2}(?:st|nd|rd|th)?\\s+(?=(?:'+MONRX+'))','gi'),'')
                  .replace(new RegExp('\\b('+MONRX+')[a-z]*\\.?\\s+\\d{1,2},\\s*(?=\\d{4})','gi'),'$1 ');
function context(a){
  const who=(a.person||[]).includes('Hiral')?'Hiral':null;
  let when='';
  if(a.session){ when=dropDay(a.session.replace(/\s+—\s+/,' · ').replace(/\s*\(uploaded[^)]*\)/,'')); }
  else if(a.date){ const d=new Date(a.date); if(!isNaN(d)) when=MON[d.getMonth()]+' '+d.getFullYear(); }
  return [who,when].filter(Boolean).join(' · ');
}
// Many titles end with the month they were shot in — "… celebration moment (Aug 2026)" —
// which the context line directly underneath is already saying. Two lines is all a card
// title gets; spending one of them on a repeat is the wrong trade.
const TITLE_DATE=new RegExp('\\s*\\((?:'+MONRX+')[a-z]*\\.?\\s+\\d{4}\\)\\s*$','i');
function titleOf(a){
  const t=String(a.title||'').trim();
  return (context(a)?t.replace(TITLE_DATE,''):t)||'Untitled';
}
// "Hiral Speaking" -> "Speaking": the card already says Hiral in its context line.
const shortFmt=f=>({'Hiral Speaking':'Speaking','Classroom Moment':'Classroom',
  'Social / Promotional':'Promo','Social Graphic':'Graphic','Student Question':'Q&A'}[f]||f);

const ICO={
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-5.5 5.5L8 14l-5 5"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="4" width="13" height="16" rx="2.5"/><path d="M4 7v11.5A2.5 2.5 0 0 0 6.5 21H16"/></svg>'
};
function card(x){
  const a=x.a, m=media(a);
  const qt=state.q.toLowerCase();
  const hot=(a.topic||[]).find(t=>qt&&hasTerm(qt,t.toLowerCase().split(' ')[0]));
  // Two pills, both the same quiet stone — the storyboard gives neither of them emphasis.
  // The topic shown is the one she searched for when there is one, otherwise the first.
  const tags=[];
  if(hot) tags.push(esc(hot));
  else if((a.topic||[]).length) tags.push(esc(a.topic[0]));
  if(a.format) tags.push(esc(shortFmt(a.format)));
  const pills=tags.map(t=>`<span class="t">${t}</span>`).join('<span class="tsep">·</span>');
  // Play badge and duration ONLY when a real file was probed and answered. Never from `type`.
  // Reference board 04 marks EVERY thumbnail with what it is: a play control on real
  // video, a still icon on images, a layers icon on carousels. Before this, a still and a
  // video-with-no-playable-master looked identical — both unbadged — so the one thing a
  // person needs to know at a glance was the one thing the card did not say.
  // §14 is not weakened: an image icon is not a play icon, and an unplayable video still
  // gets nothing, because any marker there would imply playback we cannot deliver.
  const badge = m.playable
    ? '<span class="play"></span>'+(m.dur?`<span class="dur">${esc(m.dur)}</span>`:'')
    : a.type==='Image'    ? '<span class="kind" title="Image">'+ICO.img+'</span>'
    : a.type==='Carousel' ? '<span class="kind" title="Carousel">'+ICO.car+'</span>'
    // 145 of 179 videos have no playable master. Leaving those cards unmarked meant asking
    // for "students laughing video" returned things that cannot be watched, with nothing
    // on the card to say so — you found that out by clicking. §14 requires a "video
    // preview unavailable" indication for exactly this case and it existed only in the
    // detail view. Saying it out loud is the opposite of implying playback.
    : a.type==='Video'    ? '<span class="nopv">No preview</span>'
    : '';
  // Spans throughout: <h3>/<p> are flow content and are not valid inside a <button>.
  return `<button class="cardx" data-id="${esc(a.id)}">
    <span class="shot"><span class="none">no preview</span>${a.thumb?`<img loading="lazy" src="${esc(a.thumb)}" alt="" onerror="this.remove()">`:''}${badge}</span>
    <span class="ttl">${esc(titleOf(a))}</span>
    <span class="ctx">${esc(context(a))||'&nbsp;'}</span>
    <span class="tags">${pills}</span>
  </button>`;
}

/* BROWSE — the library grouped by Format, which the ablation showed is the strongest
 * dimension in the catalogue by a distance (removing it costs five queries; removing
 * Person, Source, Status or Session costs none). Sections are ordered by size, and the 51
 * assets with no format land in "Unsorted" rather than being quietly dropped — the gap is
 * real and hiding it is how it stays unfixed.
 *
 * This is also the only view that can answer "show me the options". Ranked search returns
 * the single best match by construction, so the eight near-identical Vedanta B-roll
 * variants can never all surface; here they sit together under one heading. */
function groupByFormat(list){
  const by={};
  list.forEach(x=>{ const k=x.a.format||'Unsorted'; (by[k]=by[k]||[]).push(x); });
  const keys=Object.keys(by).sort((x,y)=>
    x==='Unsorted'?1 : y==='Unsorted'?-1 : by[y].length-by[x].length);
  return keys.map(k=>
    `<div class="gsec">${esc(k)}<span class="n">${by[k].length}</span></div>`+
    `<div class="grid">${by[k].map(card).join('')}</div>`).join('');
}

/* Six tiles, largest Format first, each showing a real asset from inside it.
 *
 * FACE SELECTION. A first pass picked the first asset with any `thumb` at all, and two of
 * six tiles rendered as empty beige squares — the eleven rows that point at an absolute
 * URL are full-size PNGs of up to 2.2MB, and they had not painted by the time anyone
 * looked. Preferring the local `../thumbs/` set, which is the small probed one, is what
 * makes a tile reliably show a picture. `onerror` still hides a broken image rather than
 * leaving a browser icon in the frame. */
const THEME_LABEL={'Hiral Speaking':'Hiral Speaks','Classroom Moment':'Classroom Moments',
  'Social Graphic':'Social Graphics','Social / Promotional':'Promos','B-roll':'B-roll',
  'Portrait':'Portraits','Certificate':'Certificates','Testimonial':'Testimonials',
  'Student Question':'Student Questions'};
function buildThemes(){
  $('browseall').textContent=`Browse all ${ASSETS.length} →`;
  const by={};
  ASSETS.forEach(a=>{ if(a.format) (by[a.format]=by[a.format]||[]).push(a); });
  const top=Object.entries(by).sort((x,y)=>y[1].length-x[1].length).slice(0,6);
  const local=a=>a.thumb&&a.thumb.startsWith('../thumbs/');
  $('themes').innerHTML=top.map(([fmt,list])=>{
    const face=list.find(local)||list.find(a=>a.thumb)||list[0];
    return `<button data-theme="${esc(fmt)}">
      <span class="tw">${face.thumb?`<img loading="lazy" src="${esc(face.thumb)}" alt="" onerror="this.remove()">`:''}</span>
      <span class="tl">${esc(THEME_LABEL[fmt]||fmt)}</span>
      <span class="tn">${list.length}</span>
    </button>`;}).join('');
}

/* Recently added. Not a new feature and not a new field — the catalogue sorted by the date
 * it already carries. It answers the question the empty state could not: "what has landed
 * since I last looked?" Assets with no thumbnail are skipped, because a row of grey
 * rectangles is worse than a shorter row. */
function buildRecent(){
  const dated=ASSETS.filter(a=>a.thumb&&a.thumb.startsWith('../thumbs/')&&a.date)
    .sort((x,y)=>String(y.date).localeCompare(String(x.date)));
  // One per session. Straight date order gave four near-identical certificate photos from
  // a single afternoon — the same cannibalisation that makes ranked search unable to show
  // you a spread. Six different things is the point of the row.
  const seen=new Set(), out=[];
  for(const a of dated){
    const k=a.session||a.format||a.id;
    if(seen.has(k)) continue;
    seen.add(k); out.push(a);
    if(out.length===6) break;
  }
  $('recent').innerHTML=out.map(a=>card({a})).join('');
}

function render(){
  const searching=!!state.q.trim();
  const heroMode=!state.engaged&&!searching&&!activeFilters()&&!state.browse;
  $('stage').classList.toggle('hero',heroMode);
  $('heroimg').hidden=!heroMode;
  $('main').hidden=heroMode;
  $('libcount').textContent=`${ASSETS.length} assets`;
  $('libcount').hidden=!heroMode;          // empty state only, as the storyboard has it
  $('sbox').classList.toggle('has',searching);
  $('fclear').hidden=!activeFilters();
  if(heroMode) return;

  const {strong,weak}=currentResults();
  if(!strong.length&&!weak.length){
    $('summary').innerHTML='';
    $('results').innerHTML=`<div class="none-state">
      <div class="ring"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#15263F" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.9-3.9"/></svg></div>
      <h2>No matching content found.</h2>
      <p>Try a different search or clear your filters.</p>
      <button class="btn ghost" data-act="${activeFilters()?'clearf':'clearq'}">${activeFilters()?'Clear filters':'Clear search'}</button>
    </div>`;
    return;
  }
  // A sentence, not a query report. "Found" rather than "I found": first person is where an
  // assistant persona starts, and this is a library that understood her, not a chatbot.
  const n=strong.length, piece=`${n} piece${n===1?'':'s'} of content`;
  const nf=activeFilters();
  $('summary').innerHTML=`<h2>${searching?`Found ${piece}`:piece}</h2>
    <span class="sumright"><button class="refine${state.sort==='newest'?' on':''}" data-act="sort" title="${state.sort==='newest'?'Showing newest uploads first — tap for best matches':'Showing best matches first — tap for newest uploads'}">${state.sort==='newest'?'Newest first':'Most relevant'}</button><button class="refine${nf?' on':''}" data-act="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>Filters${nf?` · ${nf}`:''}</button></span>`;
  /* Newest first is applied AFTER the engine has ranked, and only when she asks for it.
   * The default stays relevance, so the validated ordering is what you get unless you
   * choose otherwise — the frontend is not quietly re-ranking anything. Undated assets
   * sort last rather than jumping to the top on an empty string. */
  if(state.sort==='newest'){
    const key=a=>a.date||a.session||'';
    const byDate=(x,y)=>String(key(y.a)).localeCompare(String(key(x.a)));
    strong.sort(byDate); weak.sort(byDate);
  }
  // Browsing: sectioned by Format. Searching: one ranked grid, unchanged.
  if(state.browse&&!searching){ $('results').innerHTML=groupByFormat(strong); return; }
  let html='<div class="grid">'+strong.map(card).join('');
  if(weak.length&&state.showWeak) html+='<div class="sep">Weaker matches</div>'+weak.map(card).join('');
  html+='</div>';
  if(weak.length&&!state.showWeak)
    html+=`<button class="weak" data-act="weak">Show ${weak.length} weaker match${weak.length===1?'':'es'} ↓</button>`;
  $('results').innerHTML=html;
}

function openDetail(id){
  const a=ASSETS.find(x=>x.id===id); if(!a)return;
  const m=media(a); state.openId=id;
  /* Rows are built, not templated, so a field with no value produces NOTHING. Printing
     "Session — not recorded" is the interface announcing the shape of the database; two of
     the six rows on a typical asset were placeholders for absent data, padding the block
     until it competed with the image. `sec` marks the secondary fields the storyboard's
     phone layout leaves out — hidden by CSS on mobile, present on desktop. */
  const row=(k,v,sec)=>v?`<dt class="${sec?'sec':''}">${k}</dt><dd class="${sec?'sec':''}">${v}</dd>`:'';
  const list=v=>(v||[]).length?v.map(esc).join(', '):'';
  let visual;
  /* The caveat about this asset — no sound, no playable master, cover slide only. It used
     to sit under the media in the left column, which put it as far as it could get from the
     "Open in Drive" button that is its actual answer, and left the right column ending 320px
     short of the media beside it. Reference board 04 composes it the other way: the note is
     the last block of the TEXT column, directly under the actions, and it is what closes
     that column. Splitting each into a heading and a sentence is that board's treatment too
     — a one-line grey sentence reads as a disclaimer, a titled panel reads as an answer. */
  const note=(k,b)=>`<div class="dnote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.05" fill="currentColor" stroke="none"/></svg><div><b>${k}</b>${b}</div></div>`;
  let caveat='';
  if(m.playable&&m.url){
    // The filmstrip is built from real frames of THIS file (see buildStrip). It used to be
    // built by joining on `session` — which looked reasonable and rendered for exactly none
    // of the 34 playable assets, because not one of them carries a session value. Frames
    // also can't mislead: neighbouring thumbnails under a player read as "this video".
    visual=`<div class="dvis"><div class="dmedia dark"><video controls preload="metadata" playsinline
        ${a.thumb?`poster="${esc(a.thumb)}"`:''} src="${esc(m.url)}"></video></div>
      <div class="strip" hidden></div></div>`;
    if(m.silent) caveat=note('Preview has no sound','This clip is a silent preview. The original on Drive has its audio.');
  } else {
    visual=`<div class="dvis"><div class="dmedia">${a.thumb?`<img src="${esc(a.thumb)}" alt="">`:''}</div></div>`;
    if(m.kind==='video') caveat=note('Video preview unavailable','No playable master has been made for this asset. Open the original on Drive to watch it.');
    else if(m.kind==='carousel') caveat=note('Cover slide shown','This is the first slide only. Open in Drive for the full carousel.');
  }
  const meta=`<dl class="dl">
      ${row('Type',esc(a.type||''))}
      ${row('Topic',list(a.topic))}
      ${row('Person',list(a.person),true)}
      ${row('Session',esc(a.session||''),true)}
      ${row('Source',a.source&&a.source!=='Unknown'?esc(a.source):'',true)}
      ${row('Status',esc(a.status||''),true)}</dl>`;
  const text=`<div class="dtext"><h2>${esc(titleOf(a))}</h2>
      <p class="ctx">${esc(context(a))}</p>
      ${a.description?`<p class="desc">${esc(a.description)}</p>`:''}
      ${meta}
      <div class="acts">${a.drive
        ? `<a class="btn" href="${esc(a.drive)}" target="_blank" rel="noopener">Open in Drive ↗</a>
        <button class="btn ghost" data-act="copy" data-href="${esc(a.drive)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="lbl">Copy link</span></button>`
        // One asset in the library has no Drive link. Rendering Copy link anyway gave a
        // button that swallowed the click and did nothing — say so instead.
        : `<p class="nolink">No Drive link recorded for this asset.</p>`}
      </div>${caveat}</div>`;
  // Always two columns. The `single` variant collapsed every non-playable asset — the large
  // majority of the library — back into the stacked layout this pass exists to remove.
  $('dbody').innerHTML=`<div class="dgrid">${visual}${text}</div>`;
  $('detail').classList.add('open'); $('detail').setAttribute('aria-hidden','false');
  $('scrim').classList.add('open');
  if(m.playable&&m.url) buildStrip(m.url,id);
}

/* Five evenly-spaced frames, decoded from the clip itself with a second, offscreen video.
 * Cross-origin video taints a canvas but still draws to it, so this works against the
 * Vercel-hosted previews; nothing is ever read back out.
 * Everything here fails closed — the strip starts hidden and is only revealed once a frame
 * has actually been painted, so a missing range request or a codec the browser will not
 * seek leaves the detail exactly as it was before.
 */
function buildStrip(url,forId){
  const box=$('dbody').querySelector('.strip'); if(!box) return;
  const N=5, W=120, H=84;
  const v=document.createElement('video');
  // Deliberately NO crossOrigin. We only ever draw, never read pixels back, so tainting the
  // canvas costs nothing — whereas asking for CORS makes the strip depend on a header the
  // clip host happens to send today and would fail outright the day it stops.
  v.preload='metadata'; v.muted=true; v.playsInline=true;
  const stop=()=>{ v.removeAttribute('src'); v.load(); };
  v.addEventListener('error',stop);
  v.addEventListener('loadedmetadata',()=>{
    const d=v.duration;
    if(state.openId!==forId||!isFinite(d)||d<=0||!v.videoWidth) return stop();
    const times=Array.from({length:N},(_,i)=>d*(i+0.5)/N);
    const cvs=times.map(()=>{ const c=document.createElement('canvas');
      c.width=W; c.height=H; c.className='frame'; box.appendChild(c); return c; });
    let i=0;
    const seek=()=>{ if(i>=N||state.openId!==forId) return stop(); v.currentTime=times[i]; };
    v.addEventListener('seeked',()=>{
      if(state.openId!==forId) return stop();
      try{
        // cover-crop, so a 9:16 clip is not squashed into a 10:7 frame
        const s=Math.max(W/v.videoWidth,H/v.videoHeight);
        const dw=v.videoWidth*s, dh=v.videoHeight*s;
        cvs[i].getContext('2d').drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);
        box.hidden=false;
      }catch(e){ return stop(); }
      i++; seek();
    });
    seek();
  },{once:true});
  v.src=url;
}
function closeDetail(){
  state.openId=null;
  $('detail').classList.remove('open'); $('detail').setAttribute('aria-hidden','true');
  $('scrim').classList.remove('open');
  $('dbody').querySelectorAll('video').forEach(v=>v.pause());
}

function setQuery(v,{engage=true}={}){
  state.q=v; state.showWeak=false;
  if(v.trim())state.engaged=true;
  if(engage===false){state.engaged=false;state.browse=false;}
  closeDetail(); $('q').value=v; render();
}
$('q').addEventListener('input',e=>{state.q=e.target.value;state.showWeak=false;
  if(state.q.trim())state.engaged=true; closeDetail(); render();});
$('clearq').onclick=()=>{setQuery('',{engage:false});$('q').focus();};
$('home').onclick=()=>{state.filters={};$('fgrid').querySelectorAll('select').forEach(x=>x.value='');
  setQuery('',{engage:false});window.scrollTo({top:0});};
$('fclear').onclick=clearFilters;
$('dclose').onclick=closeDetail; $('dback').onclick=closeDetail; $('scrim').onclick=closeDetail;
// The modal's own backdrop. #detail now covers the viewport to centre the card, so it sits
// over .scrim and swallows the click that used to dismiss it — this restores click-outside.
$('detail').addEventListener('click',e=>{ if(e.target===$('detail')) closeDetail(); });
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
document.querySelectorAll('.try button').forEach(b=>b.onclick=()=>{setQuery(b.dataset.ex);$('q').focus();});
document.addEventListener('click',e=>{
  const c=e.target.closest('.cardx'); if(c){openDetail(c.dataset.id);return;}
  // A theme tile is the Format filter, entered from the empty state.
  const t=e.target.closest('[data-theme]');
  if(t){ state.filters={format:t.dataset.theme}; state.browse=true; state.engaged=true;
         const sel=$('f-format'); if(sel) sel.value=t.dataset.theme;
         render(); window.scrollTo({top:0}); return; }
  const act=e.target.closest('[data-act]'); if(!act)return;
  const a=act.dataset.act;
  if(a==='weak'){state.showWeak=true;render();}
  if(a==='browse'){state.browse=true;state.engaged=true;render();window.scrollTo({top:0});}
  // Refine lives inside the summary, which is rebuilt on every render, so it cannot
  // carry its own handler the way the old static Filters button did.
  if(a==='filters')$('filters').classList.toggle('open');
  if(a==='sort'){state.sort=state.sort==='newest'?'relevance':'newest';render();}
  if(a==='clearq')setQuery('',{engage:false});
  if(a==='clearf')clearFilters();
  if(a==='copy'){const h=act.dataset.href; if(!h)return;
    const lbl=act.querySelector('.lbl')||act;
    navigator.clipboard?.writeText(h).then(()=>{lbl.textContent='Copied';setTimeout(()=>lbl.textContent='Copy link',1400);});}
});
buildFilters(); buildThemes(); buildRecent(); render();
</script>
</body>
</html>
