<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFM OS — Content Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0C548E; --ink:#24313F; --ink-2:#55646f; --muted:#8c94a1;
  /* Display ink. Sampled off the storyboard: titles there are a deep navy (#101C3A),
     not the charcoal body colour. It is what makes the type feel like a brand and not
     a database, so it is a token rather than a one-off. */
  --display:#15263F;
  --paper:#FCFAF7; --cream:#F7F1E8; --stone:#E9E2D8; --stone-2:#f2ece3;
  --gold:#E5C76B; --card:#fff;
  --f-d:'Lora',Georgia,serif; --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  /* The content column, in one place. Measured off the storyboard, where the search field
     and the card grid leave gutters of about 5.5% rather than the 11% this had — the page
     was reading a good deal narrower than the design. Masthead, search bar and grid all
     derive their left edge from this single number. */
  --col:1284px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
/* Flex column so the empty state can compose: the question and field sit in the upper
   third and the brand image drops to the foot of the viewport, as in the storyboard,
   instead of stopping two-thirds down and leaving a dead band underneath. */
body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:15px;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
/* Chromium draws its own ✕ inside input[type=search]. Left alone it sat beside our own
   clear button — two identical crosses, 16px apart. */
input[type=search]::-webkit-search-cancel-button,
input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}

/* ------------------------------------------------------------------- masthead */
/* One left edge for the whole page. `max(28px, …)` resolves to exactly the gutter the
   1124px content column sits behind, so masthead, search field and the first card in the
   grid all start on the same pixel at every width — instead of the search bar running
   130px wider than the grid it belongs to. */
.mast,.stage{padding-inline:max(28px,calc((100% - var(--col))/2))}
.mast{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding-block:16px;background:rgba(252,250,247,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--stone)}
/* One colour, as the storyboard has it. The two-tone "IFM / OS" split read as a logo
   treatment the brand does not actually use. */
.brand{font-family:var(--f-d);font-weight:600;font-size:19px;letter-spacing:.01em;
  color:var(--display);padding:0;line-height:1}
.mast .rule{width:1px;height:18px;background:var(--stone)}
.mast .tag{font-family:var(--f-d);font-size:14px;color:var(--ink-2);line-height:1}
.mast .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-width:760px){ .mast .rule,.mast .tag{display:none} }

/* ------------------------------------------------------- stage (hero/results) */
/* 52px is the masthead's exact height (16 + 19 + 16 + 1px rule). Anything larger leaves a
   band of page showing through between the two sticky bars as you scroll. */
.stage{position:sticky;top:52px;z-index:35;background:rgba(252,250,247,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--stone);padding-block:14px}
/* padding-block only — the shared padding-inline above still applies, so the empty-state
   field lines up with the masthead and, more usefully, with the field it turns into the
   moment she types. It used to be a 470px box centred on nothing. */
.stage.hero{position:static;border-bottom:none;background:none;backdrop-filter:none;
  padding-block:14vh 6vh;text-align:center;flex:none}
.herotext{display:none}
.stage.hero .herotext{display:block;max-width:600px;margin:0 auto 28px}
/* The 29px floor put the question within 19px of the right gutter on a 375 phone. */
.stage h1{font-family:var(--f-d);font-weight:500;font-size:clamp(25px,5.2vw,38px);
  line-height:1.16;margin:0;letter-spacing:-.018em;color:var(--display)}
.searchrow{display:flex;gap:10px;align-items:center}
/* Full content width, as the storyboard draws it. The field is the page here. */
.stage.hero .searchrow{margin:0}
.stage.hero .fbtn{display:none}
.sbox{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);
  border:1.5px solid var(--stone);border-radius:10px;padding:10px 14px;min-width:0;
  transition:border-color .15s,box-shadow .15s}
.stage.hero .sbox{padding:13px 16px;border-radius:11px}
.sbox:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(12,84,142,.08)}
.sbox svg{width:16px;height:16px;flex:none;color:var(--muted)}
.sbox input{flex:1;border:none;outline:none;background:none;font-family:inherit;
  font-size:14.5px;color:var(--ink);min-width:0}
.sbox input::placeholder{color:var(--muted)}
.sbox .clr{color:var(--muted);padding:0;display:none;line-height:0;flex:none;transition:color .15s}
.sbox .clr:hover{color:var(--display)}
.sbox.has .clr{display:block}
.fbtn{display:flex;align-items:center;gap:7px;border:1.5px solid var(--stone);
  background:var(--card);border-radius:10px;padding:10px 15px;font-size:13.5px;
  font-weight:500;color:var(--ink-2);white-space:nowrap}
.fbtn:hover,.fbtn.on{border-color:var(--navy);color:var(--navy)}
.fbtn .dot{width:5px;height:5px;border-radius:50%;background:var(--navy)}
.try{display:none}
/* Left-aligned to the field's own left edge, not centred — that is how the storyboard
   sets it, and it gives the empty state a second alignment to hang on. */
.stage.hero .try{display:flex;margin:18px 0 0;gap:8px;
  justify-content:flex-start;flex-wrap:wrap;align-items:center}
.try .lbl{color:var(--muted);font-size:12.5px;margin-right:2px}
.try button{background:var(--card);border:1px solid var(--stone);border-radius:999px;
  padding:6px 14px;font-size:12.5px;color:var(--ink-2);transition:border-color .15s,color .15s}
.try button:hover{border-color:var(--navy);color:var(--navy)}

/* the quiet brand moment at the foot of the empty state */
/* Full-bleed and pinned to the foot of the viewport, as the storyboard has it. `margin-top:
   auto` in the body flex column does the pinning; capped at 1600 so a 1200px-wide source
   is never asked to stretch across a very large display. */
/* hero.jpg is a 1200x270 strip. Left at its natural ratio it rendered 84px tall on a phone
   — a sliver the caption alone overflowed. The floor keeps it an image at every width, and
   the expression is written so the crop never asks the source to upscale past 1.33x:
   at 1440 the natural height already wins, below that the 240px floor crops horizontally. */
.heroimg{width:100%;max-width:1600px;margin:auto auto 0;position:relative;overflow:hidden;
  flex:none;height:max(240px,calc(min(100vw,1600px) / 4.444))}
/* Muted on purpose. At full saturation the photo shouts louder than the one question on
   the page, and the italic caption sitting on it was illegible against the foliage. */
.heroimg img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  filter:saturate(.72) contrast(.97) brightness(1.04)}
/* The wash is only where the caption lands. Spread across the whole frame it drained the
   photograph of the warmth that is the point of putting it there. */
.heroimg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(252,250,247,0) 44%,rgba(252,250,247,.55) 72%,
    rgba(252,250,247,.92) 100%)}
.heroimg figcaption{position:absolute;right:30px;bottom:24px;text-align:right;z-index:1;
  font-family:var(--f-d);font-style:italic;font-size:15px;line-height:1.7;color:#243457;
  letter-spacing:.005em}
@media(max-width:760px){ .heroimg figcaption{font-size:12px;right:16px;bottom:14px} }

/* -------------------------------------------------------------------- results */
/* width:100% is load-bearing now that body is a flex column: auto inline margins on a flex
   item beat align-items:stretch, so without it .wrap sized itself to its content and landed
   6px inside the masthead's left edge. */
.wrap{width:100%;max-width:calc(var(--col) + 56px);margin:0 auto;padding:0 28px}
/* No border-top: the search bar above already closes with a full-width rule, and the two
   lines 14px apart read as a mistake. */
.filters{display:none;border-bottom:1px solid var(--stone);padding:20px 0 22px}
.filters.open{display:block}
/* Four, not auto-fit. There are exactly seven controls, and auto-fit resolved to six at
   this width — leaving Status stranded alone on a second row. 4 + 3 is deliberate. */
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px}
@media(max-width:1000px){ .fgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(max-width:620px){ .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.fgrid label{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:5px}
.fgrid select{width:100%;padding:6px 2px;border:none;border-bottom:1px solid var(--stone);
  background:none;font-family:inherit;font-size:13.5px;color:var(--ink);border-radius:0;
  transition:border-color .15s}
.fgrid select:focus{outline:none;border-bottom-color:var(--navy)}
.fclear{margin-top:20px;color:var(--navy);font-size:13.5px;font-weight:500;padding:0;
  text-decoration:underline;text-underline-offset:3px}

.summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:20px 0 16px;flex-wrap:wrap}
.summary h2{font-size:14px;font-weight:600;margin:0;color:var(--display)}
.summary .sub{font-size:12.5px;color:var(--muted)}

/* Gutters measured off the storyboard: the column gap there is ~11% of the card width,
   and the row gap runs about a quarter wider again so rows read as rows. */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px 36px;padding-bottom:24px}
.cardx{text-align:left;padding:0;display:block;width:100%;background:none}
/* display:block matters. As an inline span, aspect-ratio and width:100% were both
   ignored, every thumbnail rendered at its natural size and the cards ran 718px tall. */
.shot{display:block;position:relative;width:100%;aspect-ratio:5/4;border-radius:6px;
  overflow:hidden;background:var(--stone-2);margin-bottom:12px;
  box-shadow:inset 0 0 0 1px rgba(21,38,63,.07)}
/* Absolute, so it paints over the "no preview" label that always sits underneath it.
   23 of the 378 rows point at a thumbnail that 404s; removing the broken <img> then
   uncovers the label instead of leaving a silent empty rectangle. */
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .45s cubic-bezier(.2,.6,.2,1)}
.cardx:hover .shot img{transform:scale(1.035)}
.shot .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#c3b8a8;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
/* The white ring is what makes the badge legible on a bright thumbnail as well as a dark
   one — without it the play mark disappears into the gold-bar stills. */
.play{position:absolute;left:12px;bottom:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(14,22,34,.72);box-shadow:0 0 0 1.5px rgba(255,255,255,.9);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}
.play::after{content:'';border-left:9px solid #fff;border-top:6px solid transparent;
  border-bottom:6px solid transparent;margin-left:3px}
.dur{position:absolute;right:12px;bottom:12px;background:rgba(14,22,34,.72);backdrop-filter:blur(3px);
  color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:4px;line-height:1.35;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* Two lines, always. Reserving the second line is what lets the context lines and the tag
   pills sit on one baseline right across a row of three. */
.cardx .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:40px;font-size:14.5px;font-weight:600;line-height:1.38;color:var(--display);
  margin-bottom:5px;transition:color .15s;letter-spacing:-.006em}
.cardx:hover .ttl{color:var(--navy)}
.cardx .ctx{display:block;font-size:12px;color:var(--muted);margin-bottom:9px;line-height:1.4}
.cardx .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cardx .t{font-size:10.5px;font-weight:500;padding:3px 8px;border-radius:4px;
  background:var(--stone-2);color:var(--ink-2);white-space:nowrap;line-height:1.35}
.cardx .tsep{color:var(--muted);font-size:10.5px;line-height:1}

.weak{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin:4px 0 44px;padding:14px;border:1px solid var(--stone);border-radius:6px;
  color:var(--ink-2);font-size:13.5px;font-weight:500;background:var(--card);
  transition:border-color .15s,color .15s}
.weak:hover{border-color:var(--navy);color:var(--navy)}
.sep{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:4px 0 0;
  color:var(--muted);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:500}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--stone)}

.none-state{text-align:center;padding:76px 24px 100px}
/* The storyboard's empty-result mark is generous — roughly twice the height of the search
   field it sits under. At 60px it read as an apology; at 84px it reads as a full stop. */
.none-state .ring{width:84px;height:84px;border-radius:50%;background:var(--stone-2);
  margin:0 auto 28px;display:flex;align-items:center;justify-content:center}
.none-state h2{font-family:var(--f-d);font-weight:500;font-size:24px;margin:0 0 10px;
  color:var(--display);letter-spacing:-.008em}
.none-state p{color:var(--muted);font-size:13.5px;margin:0 0 26px}

/* --------------------------------------------------------------------- detail */
.scrim{position:fixed;inset:0;background:rgba(36,49,63,.34);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
#detail{position:fixed;top:0;right:0;width:min(880px,100%);height:100%;background:var(--paper);
  z-index:60;transform:translateX(101%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-10px 0 50px -20px rgba(36,49,63,.5)}
#detail.open{transform:none}
/* No rule on desktop: with only a close button in it, a bordered bar reads as an empty
   toolbar. The storyboard just floats the ✕. Mobile keeps the rule — it has a Back control
   that needs to sit against something. */
.dtop{display:flex;align-items:center;padding:14px 24px 0;flex:none}
.dtop .back{display:none;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.dtop .x{margin-left:auto;width:30px;height:30px;border-radius:50%;color:var(--muted);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
.dtop .x:hover{background:var(--stone-2);color:var(--display)}
.dbody{overflow-y:auto;flex:1;padding:14px 24px 32px}
/* video detail is two columns; image/carousel detail is one wide visual then text */
/* stretch, not start: the right column then runs the full height of the player, so
   `margin-top:auto` can drop the actions onto the same bottom line as the filmstrip. */
.dgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:stretch}
.dgrid.single{grid-template-columns:1fr}
/* Dark ground only where there is a real player — black bars around a photograph are a
   video convention, and putting a still on a near-black slab made two harsh columns. */
.dmedia{background:var(--stone-2);border-radius:6px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.dmedia.dark{background:#141d27}
.dmedia video,.dmedia img{width:100%;max-height:58vh;object-fit:contain}
.dgrid.single .dmedia img{max-height:50vh}
/* A grid of five, so the strip measures exactly the same as the player above it — the
   storyboard aligns both edges, and five fixed-width frames left a ragged right end. */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.strip .frame{width:100%;height:auto;border-radius:3px;opacity:.85;display:block;
  transition:opacity .15s;background:var(--stone-2)}
.strip .frame:hover{opacity:1}
.note{margin:12px 0 0;padding:9px 12px;background:var(--cream);border-radius:5px;
  font-size:12.5px;color:var(--ink-2);line-height:1.5}
.dtext{display:flex;flex-direction:column}
.dtext h2{font-family:var(--f-d);font-weight:600;font-size:21px;line-height:1.3;margin:0 0 6px;
  color:var(--display);letter-spacing:-.005em}
.dtext .ctx{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.dtext .desc{font-size:13.5px;color:var(--ink-2);line-height:1.62;margin:0 0 24px}
.dl{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:start;align-content:start;
  gap:11px 16px;font-size:13px;margin:0 0 28px}
.dl.two{grid-template-columns:76px minmax(0,1fr) 76px minmax(0,1fr);gap:11px 20px}
.dl dt{color:var(--muted);font-weight:400;line-height:1.45}
.dl dd{margin:0;color:var(--ink);line-height:1.45}
.dl dd.unset,.dl dd .unset{color:#a8a095;font-style:italic}
/* Right-aligned and last, as the storyboard has them — the actions close the column
   rather than interrupting it. */
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:auto}
.btn{border-radius:6px;padding:11px 18px;font-size:13.5px;font-weight:500;
  border:1.5px solid var(--navy);background:var(--navy);color:#fff;text-decoration:none;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:#0a4677;border-color:#0a4677}
.btn.ghost{background:var(--card);color:var(--ink-2);border-color:var(--stone)}
.btn.ghost:hover{background:var(--card);border-color:var(--navy);color:var(--navy)}
.btn svg{flex:none}
.nolink{margin:0;font-size:12.5px;color:var(--muted);font-style:italic;align-self:center}

/* --------------------------------------------------------------------- mobile */
@media(max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr);gap:36px 30px} }
@media(max-width:860px){ .dgrid{grid-template-columns:1fr} .acts{justify-content:flex-start} }
@media(max-width:760px){
  .mast{padding-block:13px} .brand{font-size:17px}
  .stage{top:44px;padding-block:11px} .stage.hero{padding:6vh 18px 0}   /* 13+17+13+1 */
  .searchrow{flex-wrap:wrap;gap:9px} .fbtn{width:100%;justify-content:center}
  .wrap{padding:0 16px} .mast,.stage{padding-inline:16px}
  /* The storyboard's mobile header carries the count alone — the sort note is the first
     thing to go when there is 343px to play with. */
  .summary{padding:16px 0 10px} .summary .sub{display:none}
  /* Storyboard mobile is a compact scannable LIST, not stacked full-width cards —
     more results per screen with thumbnails still big enough to recognise. The tag pills
     are dropped here: the storyboard's mobile rows carry title + context only. */
  .grid{display:block;padding-bottom:12px}
  /* `auto 1fr` is load-bearing. With two equal rows the grid split the thumbnail's spare
     height between them and the context line drifted 23px clear of its own title. */
  .cardx{display:grid;grid-template-columns:116px minmax(0,1fr);grid-template-rows:auto 1fr;
    gap:0 14px;align-items:start;padding:13px 0;border-bottom:1px solid var(--stone-2)}
  .shot{grid-row:1/3;width:116px;aspect-ratio:5/4;margin:0;border-radius:5px}
  .cardx:hover .shot img{transform:none}
  .cardx .ttl{grid-column:2;font-size:14px;min-height:0;margin-bottom:4px;align-self:start}
  .cardx .ctx{grid-column:2;margin-bottom:0;align-self:start}
  .cardx .tags{display:none}
  .dur{font-size:9.5px;padding:2px 5px;right:5px;bottom:5px}
  .play{width:22px;height:22px;left:5px;bottom:5px;box-shadow:0 0 0 1.2px rgba(255,255,255,.9)}
  .play::after{border-left-width:6px;border-top-width:4px;border-bottom-width:4px;margin-left:2px}
  .sep{margin:18px 0 8px}
  .weak{margin:14px 0 32px}
  #detail{width:100%} .dtop .back{display:flex} .dtop .x{display:none}
  .dtop{padding:12px 16px;border-bottom:1px solid var(--stone)} .dbody{padding:18px 16px 28px}
  .dl,.dl.two{grid-template-columns:72px minmax(0,1fr);gap:10px 14px}
  /* Stacked, full width — the storyboard's phone detail gives "Open in Drive" the whole
     measure rather than halving it against a secondary action. */
  .acts{gap:9px;flex-direction:column;align-items:stretch}
  .acts .btn{width:100%;justify-content:center;padding:13px 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <button class="brand" id="home">IFM OS</button>
  <span class="rule"></span>
  <span class="tag">Content library for a richer financial future.</span>
  <span class="count" id="libcount"></span>
</header>

<div class="stage hero" id="stage">
  <div class="herotext"><h1>What are you looking for?</h1></div>
  <div class="searchrow">
    <div class="sbox" id="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Search the IFM library…" autocomplete="off" aria-label="Search the IFM library">
      <button class="clr" id="clearq" aria-label="Clear search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="fbtn" id="fbtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      Filters<span class="dot" id="fdot" hidden></span>
    </button>
  </div>
  <div class="try">

    <button class="x" id="dclose" aria-label="Close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<script src="taxonomy.js"></script>
<script src="v1-catalogue.js"></script>
<script src="media-map.js"></script>
<script>
const T=window.IFM_TAXONOMY, ASSETS=window.IFM_V1.filter(r=>r.library!==false);
/* ---------------------------------------------------------------- search ----
 * Deliberately NOT embeddings. Embeddings need an API at index time, ship a vector
 * blob, and add infrastructure this project does not have. What actually makes the
 * example queries work is having good TEXT to match — the per-asset `search_terms`
 * field carrying synonyms, the finance terms that have no Topic of their own (SIP,
 * XIRR, SGB), and affect words people really type ("funny", "candid").
 *
 * Matching is WORD-BOUNDARY, not substring. That single decision is what stops a
 * search for "gold" returning "marigold", "teal/gold" and "black/gold" — which is
 * exactly what the current hub does, on 37 rows, almost all of them wrong.
 */
const STOP=new Set(['find','me','a','an','the','of','for','show','get','to','on','in','at','is',
  'with','and','or','some','any','please','i','want','need','looking','look','can','you','that',
  'from','about','where','which','it','this','our','us','all',
  // Generic query nouns. They carry no discriminating meaning and mostly do not appear in
  // the catalogue text at all, so without this they were treated as "words we do not have"
  // and vetoed perfectly good queries — "funny classroom moments" returned nothing because
  // of `moments`. Note `footage`, `shot` and `clip` are NOT here: they map to real
  // Format/Type meaning through SYN.
  'moment','moments','content','stuff','thing','things','something','anything',
  'piece','pieces','asset','assets','file','files','material','bit','bits','item','items',
  // Conversational filler. These are how people TALK, and they are catastrophic here: 'was'
  // occurs in exactly 1 of 378 assets, so it scores an IDF of 27.8 against 'gold' at 6.1 —
  // a meaningless word outweighing the subject 4x and starving the coverage test.
  'was','were','do','does','did','we','have','has','had','there','here','be','been',
  'good','nice','great','best','really','just','actually','maybe','some','somewhere',
  'that','those','these','my','your','their','am','are','then','when','while','got']);

// Query word -> extra tokens. Lets someone type how they speak and still hit the taxonomy.
const SYN={
  talking:['hiral speaking','speaking','explaining','teaching'],
  talks:['hiral speaking','speaking'], talk:['hiral speaking','speaking'],
  speaking:['hiral speaking'], explains:['hiral speaking','explaining'],
  explaining:['hiral speaking'], teaching:['hiral speaking'], teaches:['hiral speaking'],
  says:['hiral speaking'], discusses:['hiral speaking','explaining'], discussing:['hiral speaking'],
  funny:['candid','laughing','smiling','fun','warm','joyful','lively'],
  fun:['candid','smiling','lively'], candid:['candid','unposed','natural'],
  testimonial:['testimonial'], testimonials:['testimonial'], review:['testimonial'],
  reviews:['testimonial'], feedback:['testimonial'],
  broll:['b-roll'], 'b-roll':['b-roll'], cutaway:['b-roll'], footage:['b-roll'],
  clip:['video'], clips:['video'], reel:['video'], reels:['video'], film:['video'],
  photo:['image'], photos:['image'], picture:['image'], pictures:['image'], image:['image'],
  pic:['image'], pics:['image'], snap:['image'], snaps:['image'], visual:['image'],
  visuals:['image'], imagery:['image'], stills:['image'], still:['image'],
  shot:['image'], shots:['image'], headshot:['portrait'], headshots:['portrait'],
  portrait:['portrait'], portraits:['portrait'],
  certificate:['certificate'], certificates:['certificate'], graduation:['certificate'],
  question:['student question'], questions:['student question'], qna:['student question'],
  classroom:['classroom moment'], workshop:['classroom moment','workshop'],
  student:['student'], students:['student'], teens:['teens','student'],
  ai:['ai generated'], generated:['ai generated'],
  sip:['sip','systematic investment plan','compounding'],
  xirr:['xirr','cagr','returns','risk & returns'],
  independence:['financial independence'], freedom:['financial independence'],
  august:['aug'], july:['jul'], june:['jun'], september:['sep'],
};

// Field weights. Topic and title dominate; description is support, not signal.
const FIELDS=[
  ['title',5],['topic',5],['format',4],['person',4],['search_terms',3],
  ['slide_text',3],['session',3],['source',2],['type',2],['description',2],
];

function textOf(a,f){
  const v=a[f];
  return Array.isArray(v)?v.join(' ').toLowerCase():String(v||'').toLowerCase();
}
function tokenise(s){
  return s.toLowerCase().split(/[^a-z0-9₹&/+-]+/).filter(w=>w.length>1&&!STOP.has(w));
}
function expand(tokens){
  const out=[];
  tokens.forEach(t=>{ out.push(t); (SYN[t]||[]).forEach(s=>out.push(s)); });
  return [...new Set(out)];
}
// Word-boundary test. `gold` must not match `marigold`.
function hasTerm(hay,term){
  if(term.includes(' ')) return hay.includes(term);
  return new RegExp('(^|[^a-z0-9])'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(hay);
}

/* Rarity weighting (IDF). Without it, "the video where Hiral talks about XIRR" ranks
 * every Hiral video above the one asset that actually says XIRR, because `hiral`,
 * `video` and `talks` each score as much as the one rare word that identifies it.
 * Computed once over the corpus: a term in 1 of 20 assets is worth far more than a
 * term in 15 of 20. */
const DF={};
ASSETS.forEach(a=>{
  const seen=new Set();
  FIELDS.forEach(([f])=>tokenise(textOf(a,f)).forEach(t=>seen.add(t)));
  seen.forEach(t=>DF[t]=(DF[t]||0)+1);
});
// Squared, not linear. A linear curve made `xirr` (in 1 asset) worth only ~2x `hiral`
// (in 12), so three Hiral videos still outranked the one asset that mentions XIRR.
// Squaring makes it ~5x, which is what "the video about XIRR" actually means.
const idf=t=>Math.pow(Math.log(1+ASSETS.length/(1+(DF[t]||0))),2)+0.3;

/* IDF of a word the USER typed. A word absent from the corpus scores near-infinite
 * rarity, which is right for ranking but wrong for coverage: "talks" appears in no
 * asset, so it dominated the denominator and pushed the XIRR asset below the 55% bar
 * despite matching the only word that mattered. When a word is reachable only through a
 * synonym, weight it as that synonym — which is what it actually means here. */
function rawIdf(t){
  if(DF[t]) return idf(t);
  let best=0;
  (SYN[t]||[]).forEach(s=>{ const h=s.split(' ')[0]; if(DF[h]) best=Math.max(best,idf(h)); });
  return best||idf(t);
}

// Words that constrain rather than describe. If a query names a format or a type, the
// user means "only those" — "gold b-roll" must not return gold talks ranked above b-roll.
//
// ⚠️ Constraints are read from what the user ACTUALLY TYPED, never from the synonym
// expansion. "Hiral talks about XIRR" expands `talks` -> `hiral speaking`; treating that
// as a hard format filter silently excluded every B-roll asset, including the only one
// that mentions XIRR. A synonym is a hint for ranking; it is not an instruction.
const FORMAT_L=T.format.map(f=>f.toLowerCase());
const TYPE_L=T.type.map(t=>t.toLowerCase());
function constraintsOf(rawTokens,queryText){
  const q=' '+queryText.toLowerCase()+' ';
  return {
    format:FORMAT_L.filter(f=>f.includes(' ')||f.includes('/')?q.includes(f):rawTokens.includes(f)),
    type:TYPE_L.filter(t=>rawTokens.includes(t)),
  };
}

function conWordsOf(con){
  const w=new Set();
  [...con.format,...con.type].forEach(v=>{ w.add(v);
    v.split(/[^a-z0-9]+/).filter(Boolean).forEach(p=>w.add(p)); });
  return w;
}
function search(query){
  const raw=tokenise(query);
  if(!raw.length) return ASSETS.map(a=>({a,score:0,hits:[]}));
  const terms=expand(raw);
  // Which raw word produced which expanded term, so a synonym hit still counts as
  // covering the word the user typed ("august" -> "aug" must satisfy "august").
  const origin={};
  raw.forEach(r=>{ origin[r]=r; (SYN[r]||[]).forEach(s=>{ origin[s]=r; }); });
  const con=constraintsOf(raw,query);

  // A word the user typed that appears NOWHERE in the library — not in any field, and not
  // via a synonym — is strong evidence we do not have the thing they are describing.
  // "purple elephant" was returning the Money Map reel because `purple` matched its purple
  // budget tracker and `elephant` was quietly dropped from consideration. Dropping the
  // unmatched word turned a two-word query into a one-word one. When any content word is
  // wholly absent from a multi-word query, the honest answer is nothing.
  const contentWords=raw.filter(t=>!conWordsOf(con).has(t));
  if(contentWords.length>1){
    const absent=contentWords.filter(t=>!DF[t] && !(SYN[t]||[]).some(x=>DF[x.split(' ')[0]]));
    if(absent.length) return [];
  }

  const results=[];
  ASSETS.forEach(a=>{
    if(con.format.length && !con.format.includes((a.format||'').toLowerCase())) return;
    if(con.type.length && !con.type.includes((a.type||'').toLowerCase())) return;

    // Score each TERM ONCE, at the best field it appears in — not once per field.
    // Summing across fields let `hiral` bank points from title + person + description +
    // search_terms, which is how a generic Hiral video outranked the XIRR one.
    const best={}; const coveredRaw=new Set(); const hits=new Set();
    FIELDS.forEach(([f,w])=>{
      const hay=textOf(a,f);
      if(!hay) return;
      terms.forEach(t=>{
        if(hasTerm(hay,t)){
          if(w>(best[t]||0)) best[t]=w;
          if(origin[t]) coveredRaw.add(origin[t]);
          if(['topic','format','person','type','source'].includes(f)) hits.add(f);
        }
      });
    });
    let score=0;
    Object.entries(best).forEach(([t,w])=>{ score+=w*idf(t.split(' ')[0]); });

    // CONTROLLED-VOCABULARY BOOST (approved 16 Sep). A word that names a Topic or Format
    // the asset actually carries is a far stronger signal than the same word appearing in
    // prose. Without this, searching `gold` returned 36 results ALL scoring exactly 68 —
    // every hit tied, so ordering was array position, and four decorative "gold globe"
    // renders outranked the real gold-investment clips. Ties also left no score spread,
    // so the relevance cutoff had nothing to cut.
    // Matching is per word inside the value, so `allocation` hits "Asset Allocation" and
    // `classroom` hits "Classroom Moment" without needing the exact phrase.
    const controlled = [...(a.topic||[]), a.format||''].join(' ').toLowerCase();
    raw.forEach(t=>{ if(controlled && hasTerm(controlled, t)) score += idf(t) * 9; });

    // Tie-break: an asset whose TITLE names the thing edges ahead of one that merely
    // carries the tag. Six assets legitimately carry the Gold topic and tied exactly;
    // 'Gold as a Safe Haven Talk' should sit above 'Swayamvar — game reel'. Scoring
    // takes each term once at its best field, so title and topic both being weight 5
    // meant holding both counted no more than holding one.
    const titleL = (a.title||'').toLowerCase();
    raw.forEach(t=>{ if(hasTerm(titleL, t)) score += idf(t) * 3; });

    // Coverage is measured in IDF MASS, not word count. Two failures drove this:
    //   "student testimonials" — `student` never matches the text-quote carousel, but
    //      `testimonials` is the rare, load-bearing word. Counting words dropped it.
    //   "financial independence" — `financial` is common and matches Financial Planning
    //      assets; the phrase itself matches nothing. Counting words let it through.
    // Requiring most of the query's *rarity* to be accounted for handles both.
    // A word used as a CONSTRAINT is already doing its job by filtering, so it must not
    // also count as content matched. Otherwise "gold b-roll" is satisfied by `b-roll`
    // alone and quietly degenerates into "every B-roll asset", ignoring gold entirely.
    const conWords=new Set();
    [...con.format,...con.type].forEach(v=>{
      conWords.add(v);                                     // the whole value, e.g. "b-roll"
      v.split(/[^a-z0-9]+/).filter(Boolean).forEach(w=>conWords.add(w));   // and its parts
    });
    const meaningful=raw.filter(t=>((DF[t]||0)>0 || (SYN[t]||[]).some(s=>DF[s.split(' ')[0]]>0))
                                   && !conWords.has(t));
    if(!meaningful.length){
      // Two very different situations reach here and they must not share an answer.
      // (a) The query was nothing BUT a constraint ("portrait", "b-roll"): the filter has
      //     already selected the right set, so every survivor is a hit.
      // (b) NOTHING the user typed exists anywhere in the corpus ("CAGR", "REIT"): the
      //     honest answer is no results. Returning everything — which this did, all 378
      //     assets for "ETF" — is the worst possible response to an unknown term.
      if(!con.format.length && !con.type.length) return;
      results.push({a,score:Math.round(score)||1,hits:[...hits]}); return;
    }
    // ROOT-CAUSE FIX. Coverage asks "did we account for most of what she meant?" and
  // weights each word by rarity. But rarity in a 378-asset catalogue is not importance:
  // 'was' appears in 1 asset and scores 27.8, while 'gold' appears in 36 and scores 6.1.
  // A filler word therefore outweighed the subject 4x and starved every query of coverage.
  // Capping the weight any single word can contribute keeps rare-but-real terms strong
  // (xirr, sgb) while stopping incidental words from deciding the whole query.
  const COVER_CAP=8;
  const cidf=t=>Math.min(rawIdf(t),COVER_CAP);
  let total=0; meaningful.forEach(t=>total+=cidf(t));
    let cover=0; coveredRaw.forEach(t=>{ if(meaningful.includes(t)) cover+=cidf(t); });
    // 0.45, not 0.55. At 20 assets 0.55 was right; across 379 a single rare filler word
    // ('batch', 'clip') carries enough IDF mass on its own to sink a query whose real
    // terms all matched. 'certificates from the August batch' lost the August certificates
    // this way. Re-verified against the full suite after loosening.
    if(cover/total < 0.45) return;

    results.push({a,score:Math.round(score+cover*6),hits:[...hits]});
  });
  return results.sort((x,y)=>y.score-x.score);
}
/* ======================================================================= UI ==
 * Presentation only. Everything above is the approved search engine, byte-identical.
 */
const MEDIA=window.IFM_MEDIA||{};
const media=a=>MEDIA[a.id]||{kind:'image',playable:false};
const RELEVANT=0.7;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={q:'',filters:{},showWeak:false,openId:null,engaged:false};

const FILTERS=[['type','Type',T.type],['format','Format',T.format],['topic','Topic',null],
  ['person','Person',T.person],['source','Source',T.source],['session','Session',null],['status','Status',T.status]];
function buildFilters(){
  const sessions=[...new Set(ASSETS.map(a=>a.session).filter(Boolean))].sort();
  $('fgrid').innerHTML=FILTERS.map(([k,label,vals])=>{
    const opts = k==='topic'
      ? Object.entries(T.topic).map(([g,vs])=>`<optgroup label="${esc(g)}">${vs.map(v=>`<option>${esc(v)}</option>`).join('')}</optgroup>`).join('')
      : (vals||sessions).map(v=>`<option>${esc(v)}</option>`).join('');
    return `<div><label for="f-${k}">${esc(label)}</label><select id="f-${k}" data-k="${k}"><option value="">Any</option>${opts}</select></div>`;
  }).join('');
  $('fgrid').querySelectorAll('select').forEach(s=>s.onchange=()=>{state.filters[s.dataset.k]=s.value;state.showWeak=false;render();});
}
const activeFilters=()=>Object.values(state.filters).filter(Boolean).length;
function clearFilters(){state.filters={};$('fgrid').querySelectorAll('select').forEach(s=>s.value='');state.showWeak=false;render();}

function currentResults(){
  let list=state.q.trim()?search(state.q):ASSETS.map(a=>({a,score:0}));
  const f=state.filters;
  list=list.filter(({a})=>(!f.type||a.type===f.type)&&(!f.format||a.format===f.format)&&
    (!f.topic||(a.topic||[]).includes(f.topic))&&(!f.person||(a.person||[]).includes(f.person))&&
    (!f.source||a.source===f.source)&&(!f.session||a.session===f.session)&&(!f.status||a.status===f.status));
  if(!state.q.trim()) return {strong:list,weak:[]};
  const top=list.length?list[0].score:0;
  return {strong:list.filter(x=>x.score>=top*RELEVANT),weak:list.filter(x=>x.score<top*RELEVANT)};
}

// "Hiral · Apr 2026" — who and when, the two things she actually remembers.
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONRX='Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec';
// Session strings carry a day where the catalogue happens to have one, so the context
// lines read "4 Jun 2026" in one card and "Apr 2026" in the next. Month and year is the
// grain she thinks in, and it is the grain the storyboard shows — so drop the day.
const dropDay=s=>s.replace(new RegExp('\\b\\d{1,2}(?:st|nd|rd|th)?\\s+(?=(?:'+MONRX+'))','gi'),'')
                  .replace(new RegExp('\\b('+MONRX+')[a-z]*\\.?\\s+\\d{1,2},\\s*(?=\\d{4})','gi'),'$1 ');
function context(a){
  const who=(a.person||[]).includes('Hiral')?'Hiral':null;
  let when='';
  if(a.session){ when=dropDay(a.session.replace(/\s+—\s+/,' · ').replace(/\s*\(uploaded[^)]*\)/,'')); }
  else if(a.date){ const d=new Date(a.date); if(!isNaN(d)) when=MON[d.getMonth()]+' '+d.getFullYear(); }
  return [who,when].filter(Boolean).join(' · ');
}
// Many titles end with the month they were shot in — "… celebration moment (Aug 2026)" —
// which the context line directly underneath is already saying. Two lines is all a card
// title gets; spending one of them on a repeat is the wrong trade.
const TITLE_DATE=new RegExp('\\s*\\((?:'+MONRX+')[a-z]*\\.?\\s+\\d{4}\\)\\s*$','i');
function titleOf(a){
  const t=String(a.title||'').trim();
  return (context(a)?t.replace(TITLE_DATE,''):t)||'Untitled';
}
// "Hiral Speaking" -> "Speaking": the card already says Hiral in its context line.
const shortFmt=f=>({'Hiral Speaking':'Speaking','Classroom Moment':'Classroom',
  'Social / Promotional':'Promo','Social Graphic':'Graphic','Student Question':'Q&A'}[f]||f);

function card(x){
  const a=x.a, m=media(a);
  const qt=state.q.toLowerCase();
  const hot=(a.topic||[]).find(t=>qt&&hasTerm(qt,t.toLowerCase().split(' ')[0]));
  // Two pills, both the same quiet stone — the storyboard gives neither of them emphasis.
  // The topic shown is the one she searched for when there is one, otherwise the first.
  const tags=[];
  if(hot) tags.push(esc(hot));
  else if((a.topic||[]).length) tags.push(esc(a.topic[0]));
  if(a.format) tags.push(esc(shortFmt(a.format)));
  const pills=tags.map(t=>`<span class="t">${t}</span>`).join('<span class="tsep">·</span>');
  // Play badge and duration ONLY when a real file was probed and answered. Never from `type`.
  const badge = m.playable ? '<span class="play"></span>'+(m.dur?`<span class="dur">${esc(m.dur)}</span>`:'') : '';
  // Spans throughout: <h3>/<p> are flow content and are not valid inside a <button>.
  return `<button class="cardx" data-id="${esc(a.id)}">
    <span class="shot"><span class="none">no preview</span>${a.thumb?`<img loading="lazy" src="${esc(a.thumb)}" alt="" onerror="this.remove()">`:''}${badge}</span>
    <span class="ttl">${esc(titleOf(a))}</span>
    <span class="ctx">${esc(context(a))||'&nbsp;'}</span>
    <span class="tags">${pills}</span>
  </button>`;
}

function render(){
  const searching=!!state.q.trim();
  const heroMode=!state.engaged&&!searching&&!activeFilters();
  $('stage').classList.toggle('hero',heroMode);
  $('heroimg').hidden=!heroMode;
  $('main').hidden=heroMode;
  $('libcount').textContent=`${ASSETS.length} assets`;
  $('sbox').classList.toggle('has',searching);
  $('fbtn').classList.toggle('on',activeFilters()>0);
  $('fdot').hidden=!activeFilters(); $('fclear').hidden=!activeFilters();
  if(heroMode) return;

  const {strong,weak}=currentResults();
  if(!strong.length&&!weak.length){
    $('summary').innerHTML='';
    $('results').innerHTML=`<div class="none-state">
      <div class="ring"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#15263F" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.9-3.9"/></svg></div>
      <h2>No matching content found.</h2>
      <p>Try a different search, topic or person.</p>
      <button class="btn ghost" data-act="${activeFilters()?'clearf':'clearq'}">${activeFilters()?'Clear filters':'Clear search'}</button>
    </div>`;
    return;
  }
  $('summary').innerHTML=`<h2>${strong.length} ${searching?'relevant result':'asset'}${strong.length===1?'':'s'}</h2>
    <span class="sub">${searching?'Most relevant first':'Newest first'}</span>`;
  let html='<div class="grid">'+strong.map(card).join('');
  if(weak.length&&state.showWeak) html+='<div class="sep">Weaker matches</div>'+weak.map(card).join('');
  html+='</div>';
  if(weak.length&&!state.showWeak)
    html+=`<button class="weak" data-act="weak">Show ${weak.length} weaker match${weak.length===1?'':'es'} ↓</button>`;
  $('results').innerHTML=html;
}

function openDetail(id){
  const a=ASSETS.find(x=>x.id===id); if(!a)return;
  const m=media(a); state.openId=id;
  const unset=v=>v?esc(v):'<span class="unset">not recorded</span>';
  const row=(k,v)=>`<dt>${k}</dt><dd>${v}</dd>`;
  let visual;
  if(m.playable&&m.url){
    // The filmstrip is built from real frames of THIS file (see buildStrip). It used to be
    // built by joining on `session` — which looked reasonable and rendered for exactly none
    // of the 34 playable assets, because not one of them carries a session value. Frames
    // also can't mislead: neighbouring thumbnails under a player read as "this video".
    visual=`<div><div class="dmedia dark"><video controls preload="metadata" playsinline
        ${a.thumb?`poster="${esc(a.thumb)}"`:''} src="${esc(m.url)}"></video></div>
      <div class="strip" hidden></div>
      ${m.silent?'<p class="note">Preview has no sound — the original on Drive does.</p>':''}</div>`;
  } else {
    visual=`<div><div class="dmedia">${a.thumb?`<img src="${esc(a.thumb)}" alt="">`:''}</div>
      ${m.kind==='video'?'<p class="note">Video preview unavailable — open the original on Drive to watch it.</p>':''}
      ${m.kind==='carousel'?'<p class="note">Carousel — cover shown. Open in Drive for all slides.</p>':''}</div>`;
  }
  const meta=`<dl class="dl${m.kind==='video'?'':' two'}">
      ${row('Type',esc(a.type||'—'))}
      ${row('Topic',(a.topic||[]).length?a.topic.map(esc).join(', '):'<span class="unset">none</span>')}
      ${row('Person',(a.person||[]).length?a.person.map(esc).join(', '):'<span class="unset">not recorded</span>')}
      ${row('Session',unset(a.session))}
      ${row('Source',a.source==='Unknown'?'<span class="unset">unknown</span>':esc(a.source))}
      ${row('Status',esc(a.status))}</dl>`;
  const text=`<div class="dtext"><h2>${esc(titleOf(a))}</h2>
      <p class="ctx">${esc(context(a))}</p>
      ${a.description?`<p class="desc">${esc(a.description)}</p>`:''}
      ${meta}
      <div class="acts">${a.drive
        ? `<a class="btn" href="${esc(a.drive)}" target="_blank" rel="noopener">Open in Drive ↗</a>
        <button class="btn ghost" data-act="copy" data-href="${esc(a.drive)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="lbl">Copy link</span></button>`
        // One asset in the library has no Drive link. Rendering Copy link anyway gave a
        // button that swallowed the click and did nothing — say so instead.
        : `<p class="nolink">No Drive link recorded for this asset.</p>`}
      </div></div>`;
  $('dbody').innerHTML=`<div class="dgrid${m.playable?'':' single'}">${visual}${text}</div>`;
  $('detail').classList.add('open'); $('detail').setAttribute('aria-hidden','false');
  $('scrim').classList.add('open');
  if(m.playable&&m.url) buildStrip(m.url,id);
}

/* Five evenly-spaced frames, decoded from the clip itself with a second, offscreen video.
 * Cross-origin video taints a canvas but still draws to it, so this works against the
 * Vercel-hosted previews; nothing is ever read back out.
 * Everything here fails closed — the strip starts hidden and is only revealed once a frame
 * has actually been painted, so a missing range request or a codec the browser will not
 * seek leaves the detail exactly as it was before.
 */
function buildStrip(url,forId){
  const box=$('dbody').querySelector('.strip'); if(!box) return;
  const N=5, W=120, H=84;
  const v=document.createElement('video');
  // Deliberately NO crossOrigin. We only ever draw, never read pixels back, so tainting the
  // canvas costs nothing — whereas asking for CORS makes the strip depend on a header the
  // clip host happens to send today and would fail outright the day it stops.
  v.preload='metadata'; v.muted=true; v.playsInline=true;
  const stop=()=>{ v.removeAttribute('src'); v.load(); };
  v.addEventListener('error',stop);
  v.addEventListener('loadedmetadata',()=>{
    const d=v.duration;
    if(state.openId!==forId||!isFinite(d)||d<=0||!v.videoWidth) return stop();
    const times=Array.from({length:N},(_,i)=>d*(i+0.5)/N);
    const cvs=times.map(()=>{ const c=document.createElement('canvas');
      c.width=W; c.height=H; c.className='frame'; box.appendChild(c); return c; });
    let i=0;
    const seek=()=>{ if(i>=N||state.openId!==forId) return stop(); v.currentTime=times[i]; };
    v.addEventListener('seeked',()=>{
      if(state.openId!==forId) return stop();
      try{
        // cover-crop, so a 9:16 clip is not squashed into a 10:7 frame
        const s=Math.max(W/v.videoWidth,H/v.videoHeight);
        const dw=v.videoWidth*s, dh=v.videoHeight*s;
        cvs[i].getContext('2d').drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);
        box.hidden=false;
      }catch(e){ return stop(); }
      i++; seek();
    });
    seek();
  },{once:true});
  v.src=url;
}
function closeDetail(){
  state.openId=null;
  $('detail').classList.remove('open'); $('detail').setAttribute('aria-hidden','true');
  $('scrim').classList.remove('open');
  $('dbody').querySelectorAll('video').forEach(v=>v.pause());
}

function setQuery(v,{engage=true}={}){
  state.q=v; state.showWeak=false;
  if(v.trim())state.engaged=true; if(engage===false)state.engaged=false;
  closeDetail(); $('q').value=v; render();
}
$('q').addEventListener('input',e=>{state.q=e.target.value;state.showWeak=false;
  if(state.q.trim())state.engaged=true; closeDetail(); render();});
$('clearq').onclick=()=>{setQuery('',{engage:false});$('q').focus();};
$('home').onclick=()=>{state.filters={};$('fgrid').querySelectorAll('select').forEach(x=>x.value='');
  setQuery('',{engage:false});window.scrollTo({top:0});};
$('fbtn').onclick=()=>$('filters').classList.toggle('open');
$('fclear').onclick=clearFilters;
$('dclose').onclick=closeDetail; $('dback').onclick=closeDetail; $('scrim').onclick=closeDetail;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
document.querySelectorAll('.try button').forEach(b=>b.onclick=()=>{setQuery(b.dataset.ex);$('q').focus();});
document.addEventListener('click',e=>{
  const c=e.target.closest('.cardx'); if(c){openDetail(c.dataset.id);return;}
  const act=e.target.closest('[data-act]'); if(!act)return;
  const a=act.dataset.act;
  if(a==='weak'){state.showWeak=true;render();}
  if(a==='clearq')setQuery('',{engage:false});
  if(a==='clearf')clearFilters();
  if(a==='copy'){const h=act.dataset.href; if(!h)return;
    const lbl=act.querySelector('.lbl')||act;
    navigator.clipboard?.writeText(h).then(()=>{lbl.textContent='Copied';setTimeout(()=>lbl.textContent='Copy link',1400);});}
});
buildFilters(); render();
</script>
</body>
