<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFM Content Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Palette from the redesign brief. Warm ivory and stone rather than cool grey is what
     keeps this from reading as a SaaS dashboard. Navy is the one saturated colour; gold
     appears two or three times a screen and is never a fill. */
  --navy:#0C548E;
  --ink:#24313F; --ink-2:#55646f; --muted:#8b9099;
  --paper:#FCFAF7; --cream:#F7F1E8; --stone:#E9E2D8; --stone-2:#f2ece3;
  --gold:#E5C76B; --card:#fff;
  --shadow:0 1px 2px rgba(36,49,63,.04), 0 14px 34px -20px rgba(36,49,63,.26);
  --f-d:'Lora',Georgia,serif;
  --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
/* [hidden] is an attribute selector at the same specificity as a class, so any rule
   like .bar2{display:flex} that comes later simply beats it and the element stays
   visible. This caught the hero and the results bar showing at the same time. */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:15px;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

/* ------------------------------------------------------------------- masthead */
.mast{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:14px 26px;background:rgba(252,250,247,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--stone)}
.brand{font-family:var(--f-d);font-weight:600;font-size:15.5px;letter-spacing:.07em;
  background:none;border:none;color:var(--ink);padding:0}
.brand em{font-style:normal;color:var(--navy)}
.mast .spacer{margin-left:auto}
.mast .count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------- stage (hero -> results) */
/* The search box is ONE element in both modes. In hero mode the stage centres it under
   a headline; once there is a query the stage becomes a sticky compact bar. Because the
   input is never destroyed, focus and cursor survive the transition — which is what made
   the old two-input version feel like the page was snatching the keyboard away. */
.stage{position:sticky;top:53px;z-index:35;background:rgba(252,250,247,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--stone);
  padding:12px 26px;transition:padding .2s}
.stage.hero{position:static;border-bottom:none;background:none;backdrop-filter:none;
  padding:11vh 24px 7vh;text-align:center}
.herotext{display:none}
.stage.hero .herotext{display:block;max-width:640px;margin:0 auto}
.kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--navy);font-weight:600;margin:0 0 18px}
.stage h1{font-family:var(--f-d);font-weight:500;font-size:clamp(30px,5vw,42px);
  line-height:1.12;margin:0 0 12px;letter-spacing:-.02em}
.lede{color:var(--ink-2);font-size:15px;margin:0 auto 30px;max-width:44ch;line-height:1.55}
.searchrow{display:flex;gap:10px;align-items:center}
.stage.hero .searchrow{max-width:520px;margin:0 auto}
.stage.hero .fbtn{display:none}
.try{display:none}
.stage.hero .try{display:flex;margin-top:22px;gap:8px;justify-content:center;
  flex-wrap:wrap;align-items:center}
.try .lbl{color:var(--muted);font-size:12.5px}
.try button{background:var(--card);border:1px solid var(--stone);border-radius:999px;
  padding:7px 14px;font-size:12.5px;color:var(--ink-2)}
.try button:hover{border-color:var(--navy);color:var(--navy)}

/* ------------------------------------------------------------------- searchbox */
.sbox{flex:1;display:flex;align-items:center;gap:11px;background:var(--card);
  border:1.5px solid var(--stone);border-radius:11px;padding:10px 15px;
  box-shadow:0 1px 2px rgba(36,49,63,.04);transition:border-color .15s,box-shadow .15s}
.stage.hero .sbox{padding:15px 18px;border-radius:14px}
.sbox:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(12,84,142,.09)}
.sbox svg{width:17px;height:17px;flex:none;color:var(--muted)}
.sbox input{flex:1;border:none;outline:none;background:none;font-family:inherit;
  font-size:14.5px;color:var(--ink);min-width:0}
.stage.hero .sbox input{font-size:15.5px}
.sbox input::placeholder{color:var(--muted)}
.sbox .clr{border:none;background:none;color:var(--muted);font-size:16px;padding:0 2px;display:none}
.sbox.has .clr{display:block}

/* --------------------------------------------------------------- results shell */
.fbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--stone);
  background:var(--card);border-radius:11px;padding:11px 16px;font-size:13.5px;
  font-weight:600;color:var(--ink-2);white-space:nowrap}
.fbtn:hover{border-color:var(--navy);color:var(--navy)}
.fbtn.on{border-color:var(--navy);color:var(--navy);background:var(--cream)}
.fbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--navy)}

.panelwrap{max-width:1180px;margin:0 auto;padding:0 26px}
.summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:22px 0 12px;flex-wrap:wrap}
.summary h2{font-size:15px;font-weight:600;margin:0}
.summary .sub{font-size:12.5px;color:var(--muted)}

/* ------------------------------------------------------------------- filters */
.filters{display:none;background:var(--cream);border:1px solid var(--stone);
  border-radius:var(--r);padding:16px 18px;margin-bottom:6px}
.filters.open{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px}
.fgrid label{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:5px}
.fgrid select{width:100%;padding:9px 11px;border:1px solid var(--stone);border-radius:9px;
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink)}
.fclear{margin-top:13px;border:none;background:none;color:var(--navy);font-size:13px;
  font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* -------------------------------------------------------------------- results */
.res{display:grid;grid-template-columns:var(--thumb-w,132px) 1fr auto;gap:18px;align-items:center;
  padding:15px 12px;border-radius:var(--r);border:1px solid transparent;
  background:none;width:100%;text-align:left;color:inherit;font-family:inherit}
.res + .res{border-top:1px solid var(--stone-2)}
.res:hover,.res:focus-visible{background:var(--card);border-color:var(--stone);
  box-shadow:var(--shadow);outline:none}
.res.sel{background:var(--cream);border-color:var(--stone)}
.thumb{position:relative;width:var(--thumb-w,132px);height:var(--thumb-h,84px);border-radius:9px;overflow:hidden;
  background:var(--stone);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#b6ab9c;font-size:19px}
.play{position:absolute;left:8px;bottom:8px;width:23px;height:23px;border-radius:50%;
  background:rgba(36,49,63,.76);display:flex;align-items:center;justify-content:center}
.play::after{content:'';border-left:7px solid #fff;border-top:4.5px solid transparent;
  border-bottom:4.5px solid transparent;margin-left:2px}
.res h3{font-size:15px;font-weight:600;margin:0 0 3px;line-height:1.35}
.when{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;
  letter-spacing:.01em}
.res p{font-size:13px;color:var(--ink-2);margin:0 0 9px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.t{font-size:11px;font-weight:500;padding:3px 9px;border-radius:6px;
  background:var(--stone-2);color:var(--ink-2);white-space:nowrap}
.t.key{background:#e7effa;color:var(--navy)}
.view{border:1.5px solid var(--stone);background:var(--card);border-radius:10px;
  padding:9px 18px;font-size:13px;font-weight:600;color:var(--ink)}
.res:hover .view{border-color:var(--navy);color:var(--navy)}

.weak{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  margin:14px 0 34px;padding:14px;border:1px dashed var(--stone);border-radius:var(--r);
  background:none;color:var(--ink-2);font-size:13.5px;font-weight:500}
.weak:hover{border-color:var(--navy);color:var(--navy);background:var(--cream)}
.divider{display:flex;align-items:center;gap:14px;margin:26px 0 8px;color:var(--muted);
  font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--stone)}

/* ------------------------------------------------------------------ no results */
.none{text-align:center;padding:76px 24px 90px}
.none .ring{width:54px;height:54px;border-radius:50%;background:var(--cream);
  border:1px solid var(--stone);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.none h2{font-family:var(--f-d);font-weight:500;font-size:22px;margin:0 0 9px}
.none p{color:var(--muted);font-size:14px;margin:0 0 22px}
.none .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* --------------------------------------------------------------------- detail */
.scrim{position:fixed;inset:0;background:rgba(36,49,63,.32);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
#detail{position:fixed;top:0;right:0;width:min(620px,100%);height:100%;background:var(--paper);
  z-index:60;transform:translateX(101%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-10px 0 44px -18px rgba(36,49,63,.45)}
#detail.open{transform:none}
.dtop{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--stone);flex:none}
.dtop .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dtop .x{margin-left:auto;border:1px solid var(--stone);background:var(--card);width:32px;height:32px;
  border-radius:50%;color:var(--ink-2);font-size:14px;line-height:1}
.dbody{overflow-y:auto;flex:1}
.dmedia{background:#1b242e;display:flex;align-items:center;justify-content:center;
  min-height:190px;max-height:52vh}
.dmedia video,.dmedia img{width:100%;max-height:52vh;object-fit:contain;display:block}
.note{margin:0;padding:9px 24px;background:var(--cream);border-bottom:1px solid var(--stone);
  font-size:12.5px;color:var(--ink-2)}
.dtext{padding:22px 24px 30px}
.dtext h2{font-family:var(--f-d);font-weight:600;font-size:22px;line-height:1.28;margin:0 0 11px}
.dtext .desc{font-size:14px;color:var(--ink-2);line-height:1.6;margin:0 0 22px}
.dl{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:start;align-content:start;
  gap:11px 16px;font-size:13.5px;margin-bottom:26px}
.dl dt{color:var(--muted);font-weight:500}
.dl dd{margin:0;color:var(--ink)}
.dl dd.unset{color:#a39c92;font-style:italic}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;
  border:1.5px solid var(--navy);background:var(--navy);color:#fff;text-decoration:none;
  display:inline-flex;align-items:center;gap:7px}
.btn.ghost{background:var(--card);color:var(--ink-2);border-color:var(--stone)}
.btn.ghost:hover{border-color:var(--navy);color:var(--navy)}

/* --------------------------------------------------------------------- mobile */
@media(min-width:1180px){ :root{--thumb-w:168px;--thumb-h:106px} }
@media(max-width:760px){
  .mast{padding:12px 16px}
    .bar2 .fbtn{padding:11px 13px}
  .panelwrap{padding:0 16px}
  .res{grid-template-columns:112px 1fr;gap:13px;padding:13px 6px;align-items:start}
  .thumb{width:112px;height:74px}
  .res h3{font-size:14px}
  .res p{-webkit-line-clamp:2;font-size:12.5px;margin-bottom:7px}
  /* The View button is redundant on touch — the whole row is the target. */
  .res .view{display:none}
  #detail{width:100%}
  .dtext{padding:18px 18px 26px}
  .dl{grid-template-columns:80px minmax(0,1fr);font-size:13px}
  .acts .btn{flex:1;justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <button class="brand" id="home">INVESTING FOR <em>MUMMIES</em></button>
  <span class="spacer"></span>
  <span class="count" id="libcount"></span>
</header>

<!-- One stage, one input. The hero is a costume the search box wears, not a second
     screen with a second field: swapping inputs teleported focus mid-keystroke, and
     backspacing to empty tore the page down and lost the cursor entirely. -->
<div class="stage" id="stage">
  <div class="herotext" id="herotext">
    <p class="kicker">Content Library</p>
    <h1>What are you looking for?</h1>
    <p class="lede">Videos, photos, carousels and workshop footage — searchable in plain English.</p>
  </div>
  <div class="searchrow">
    <div class="sbox" id="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Search IFM content…" autocomplete="off" aria-label="Search IFM content">
      <button class="clr" id="clearq" aria-label="Clear search">✕</button>
    </div>
    <button class="fbtn" id="fbtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      Filters<span class="dot" id="fdot" hidden></span>
    </button>
  </div>
  <div class="try" id="try">
    <span class="lbl">Try</span>
    <button data-ex="Hiral talking about gold">Hiral talking about gold</button>
    <button data-ex="funny classroom moments">funny classroom moments</button>
    <button data-ex="August certificates">August certificates</button>
  </div>
</div>

<main class="panelwrap" id="main" hidden>
  <div class="filters" id="filters">
    <div class="fgrid" id="fgrid"></div>
    <button class="fclear" id="fclear" hidden>Clear filters</button>
  </div>
  <div class="summary" id="summary"></div>
  <div id="results"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside id="detail" aria-hidden="true">
  <div class="dtop"><span class="lbl" id="dlbl"></span><button class="x" id="dclose" aria-label="Close">✕</button></div>
  <div class="dbody" id="dbody"></div>
</aside>

<script src="taxonomy.js"></script>
<script src="v1-catalogue.js"></script>
<script>
const T=window.IFM_TAXONOMY, ASSETS=window.IFM_V1.filter(r=>r.library!==false);
/* ---------------------------------------------------------------- search ----
 * Deliberately NOT embeddings. Embeddings need an API at index time, ship a vector
 * blob, and add infrastructure this project does not have. What actually makes the
 * example queries work is having good TEXT to match — the per-asset `search_terms`
 * field carrying synonyms, the finance terms that have no Topic of their own (SIP,
 * XIRR, SGB), and affect words people really type ("funny", "candid").
 *
 * Matching is WORD-BOUNDARY, not substring. That single decision is what stops a
 * search for "gold" returning "marigold", "teal/gold" and "black/gold" — which is
 * exactly what the current hub does, on 37 rows, almost all of them wrong.
 */
const STOP=new Set(['find','me','a','an','the','of','for','show','get','to','on','in','at','is',
  'with','and','or','some','any','please','i','want','need','looking','look','can','you','that',
  'from','about','where','which','it','this','our','us','all',
  // Generic query nouns. They carry no discriminating meaning and mostly do not appear in
  // the catalogue text at all, so without this they were treated as "words we do not have"
  // and vetoed perfectly good queries — "funny classroom moments" returned nothing because
  // of `moments`. Note `footage`, `shot` and `clip` are NOT here: they map to real
  // Format/Type meaning through SYN.
  'moment','moments','content','stuff','thing','things','something','anything',
  'piece','pieces','asset','assets','file','files','material','bit','bits','item','items']);

// Query word -> extra tokens. Lets someone type how they speak and still hit the taxonomy.
const SYN={
  talking:['hiral speaking','speaking','explaining','teaching'],
  talks:['hiral speaking','speaking'], talk:['hiral speaking','speaking'],
  speaking:['hiral speaking'], explains:['hiral speaking','explaining'],
  explaining:['hiral speaking'], teaching:['hiral speaking'], teaches:['hiral speaking'],
  says:['hiral speaking'], discusses:['hiral speaking','explaining'], discussing:['hiral speaking'],
  funny:['candid','laughing','smiling','fun','warm','joyful','lively'],
  fun:['candid','smiling','lively'], candid:['candid','unposed','natural'],
  testimonial:['testimonial'], testimonials:['testimonial'], review:['testimonial'],
  reviews:['testimonial'], feedback:['testimonial'],
  broll:['b-roll'], 'b-roll':['b-roll'], cutaway:['b-roll'], footage:['b-roll'],
  clip:['video'], clips:['video'], reel:['video'], reels:['video'], film:['video'],
  photo:['image'], photos:['image'], picture:['image'], pictures:['image'], image:['image'],
  shot:['image'], shots:['image'], headshot:['portrait'], headshots:['portrait'],
  portrait:['portrait'], portraits:['portrait'],
  certificate:['certificate'], certificates:['certificate'], graduation:['certificate'],
  question:['student question'], questions:['student question'], qna:['student question'],
  classroom:['classroom moment'], workshop:['classroom moment','workshop'],
  student:['student'], students:['student'], teens:['teens','student'],
  ai:['ai generated'], generated:['ai generated'],
  sip:['sip','systematic investment plan','compounding'],
  xirr:['xirr','cagr','returns','risk & returns'],
  independence:['financial independence'], freedom:['financial independence'],
  august:['aug'], july:['jul'], june:['jun'], september:['sep'],
};

// Field weights. Topic and title dominate; description is support, not signal.
const FIELDS=[
  ['title',5],['topic',5],['format',4],['person',4],['search_terms',3],
  ['slide_text',3],['session',3],['source',2],['type',2],['description',2],
];

function textOf(a,f){
  const v=a[f];
  return Array.isArray(v)?v.join(' ').toLowerCase():String(v||'').toLowerCase();
}
function tokenise(s){
  return s.toLowerCase().split(/[^a-z0-9₹&/+-]+/).filter(w=>w.length>1&&!STOP.has(w));
}
function expand(tokens){
  const out=[];
  tokens.forEach(t=>{ out.push(t); (SYN[t]||[]).forEach(s=>out.push(s)); });
  return [...new Set(out)];
}
// Word-boundary test. `gold` must not match `marigold`.
function hasTerm(hay,term){
  if(term.includes(' ')) return hay.includes(term);
  return new RegExp('(^|[^a-z0-9])'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(hay);
}

/* Rarity weighting (IDF). Without it, "the video where Hiral talks about XIRR" ranks
 * every Hiral video above the one asset that actually says XIRR, because `hiral`,
 * `video` and `talks` each score as much as the one rare word that identifies it.
 * Computed once over the corpus: a term in 1 of 20 assets is worth far more than a
 * term in 15 of 20. */
const DF={};
ASSETS.forEach(a=>{
  const seen=new Set();
  FIELDS.forEach(([f])=>tokenise(textOf(a,f)).forEach(t=>seen.add(t)));
  seen.forEach(t=>DF[t]=(DF[t]||0)+1);
});
// Squared, not linear. A linear curve made `xirr` (in 1 asset) worth only ~2x `hiral`
// (in 12), so three Hiral videos still outranked the one asset that mentions XIRR.
// Squaring makes it ~5x, which is what "the video about XIRR" actually means.
const idf=t=>Math.pow(Math.log(1+ASSETS.length/(1+(DF[t]||0))),2)+0.3;

/* IDF of a word the USER typed. A word absent from the corpus scores near-infinite
 * rarity, which is right for ranking but wrong for coverage: "talks" appears in no
 * asset, so it dominated the denominator and pushed the XIRR asset below the 55% bar
 * despite matching the only word that mattered. When a word is reachable only through a
 * synonym, weight it as that synonym — which is what it actually means here. */
function rawIdf(t){
  if(DF[t]) return idf(t);
  let best=0;
  (SYN[t]||[]).forEach(s=>{ const h=s.split(' ')[0]; if(DF[h]) best=Math.max(best,idf(h)); });
  return best||idf(t);
}

// Words that constrain rather than describe. If a query names a format or a type, the
// user means "only those" — "gold b-roll" must not return gold talks ranked above b-roll.
//
// ⚠️ Constraints are read from what the user ACTUALLY TYPED, never from the synonym
// expansion. "Hiral talks about XIRR" expands `talks` -> `hiral speaking`; treating that
// as a hard format filter silently excluded every B-roll asset, including the only one
// that mentions XIRR. A synonym is a hint for ranking; it is not an instruction.
const FORMAT_L=T.format.map(f=>f.toLowerCase());
const TYPE_L=T.type.map(t=>t.toLowerCase());
function constraintsOf(rawTokens,queryText){
  const q=' '+queryText.toLowerCase()+' ';
  return {
    format:FORMAT_L.filter(f=>f.includes(' ')||f.includes('/')?q.includes(f):rawTokens.includes(f)),
    type:TYPE_L.filter(t=>rawTokens.includes(t)),
  };
}

function conWordsOf(con){
  const w=new Set();
  [...con.format,...con.type].forEach(v=>{ w.add(v);
    v.split(/[^a-z0-9]+/).filter(Boolean).forEach(p=>w.add(p)); });
  return w;
}
function search(query){
  const raw=tokenise(query);
  if(!raw.length) return ASSETS.map(a=>({a,score:0,hits:[]}));
  const terms=expand(raw);
  // Which raw word produced which expanded term, so a synonym hit still counts as
  // covering the word the user typed ("august" -> "aug" must satisfy "august").
  const origin={};
  raw.forEach(r=>{ origin[r]=r; (SYN[r]||[]).forEach(s=>{ origin[s]=r; }); });
  const con=constraintsOf(raw,query);

  // A word the user typed that appears NOWHERE in the library — not in any field, and not
  // via a synonym — is strong evidence we do not have the thing they are describing.
  // "purple elephant" was returning the Money Map reel because `purple` matched its purple
  // budget tracker and `elephant` was quietly dropped from consideration. Dropping the
  // unmatched word turned a two-word query into a one-word one. When any content word is
  // wholly absent from a multi-word query, the honest answer is nothing.
  const contentWords=raw.filter(t=>!conWordsOf(con).has(t));
  if(contentWords.length>1){
    const absent=contentWords.filter(t=>!DF[t] && !(SYN[t]||[]).some(x=>DF[x.split(' ')[0]]));
    if(absent.length) return [];
  }

  const results=[];
  ASSETS.forEach(a=>{
    if(con.format.length && !con.format.includes((a.format||'').toLowerCase())) return;
    if(con.type.length && !con.type.includes((a.type||'').toLowerCase())) return;

    // Score each TERM ONCE, at the best field it appears in — not once per field.
    // Summing across fields let `hiral` bank points from title + person + description +
    // search_terms, which is how a generic Hiral video outranked the XIRR one.
    const best={}; const coveredRaw=new Set(); const hits=new Set();
    FIELDS.forEach(([f,w])=>{
      const hay=textOf(a,f);
      if(!hay) return;
      terms.forEach(t=>{
        if(hasTerm(hay,t)){
          if(w>(best[t]||0)) best[t]=w;
          if(origin[t]) coveredRaw.add(origin[t]);
          if(['topic','format','person','type','source'].includes(f)) hits.add(f);
        }
      });
    });
    let score=0;
    Object.entries(best).forEach(([t,w])=>{ score+=w*idf(t.split(' ')[0]); });

    // CONTROLLED-VOCABULARY BOOST (approved 16 Sep). A word that names a Topic or Format
    // the asset actually carries is a far stronger signal than the same word appearing in
    // prose. Without this, searching `gold` returned 36 results ALL scoring exactly 68 —
    // every hit tied, so ordering was array position, and four decorative "gold globe"
    // renders outranked the real gold-investment clips. Ties also left no score spread,
    // so the relevance cutoff had nothing to cut.
    // Matching is per word inside the value, so `allocation` hits "Asset Allocation" and
    // `classroom` hits "Classroom Moment" without needing the exact phrase.
    const controlled = [...(a.topic||[]), a.format||''].join(' ').toLowerCase();
    raw.forEach(t=>{ if(controlled && hasTerm(controlled, t)) score += idf(t) * 9; });

    // Tie-break: an asset whose TITLE names the thing edges ahead of one that merely
    // carries the tag. Six assets legitimately carry the Gold topic and tied exactly;
    // 'Gold as a Safe Haven Talk' should sit above 'Swayamvar — game reel'. Scoring
    // takes each term once at its best field, so title and topic both being weight 5
    // meant holding both counted no more than holding one.
    const titleL = (a.title||'').toLowerCase();
    raw.forEach(t=>{ if(hasTerm(titleL, t)) score += idf(t) * 3; });

    // Coverage is measured in IDF MASS, not word count. Two failures drove this:
    //   "student testimonials" — `student` never matches the text-quote carousel, but
    //      `testimonials` is the rare, load-bearing word. Counting words dropped it.
    //   "financial independence" — `financial` is common and matches Financial Planning
    //      assets; the phrase itself matches nothing. Counting words let it through.
    // Requiring most of the query's *rarity* to be accounted for handles both.
    // A word used as a CONSTRAINT is already doing its job by filtering, so it must not
    // also count as content matched. Otherwise "gold b-roll" is satisfied by `b-roll`
    // alone and quietly degenerates into "every B-roll asset", ignoring gold entirely.
    const conWords=new Set();
    [...con.format,...con.type].forEach(v=>{
      conWords.add(v);                                     // the whole value, e.g. "b-roll"
      v.split(/[^a-z0-9]+/).filter(Boolean).forEach(w=>conWords.add(w));   // and its parts
    });
    const meaningful=raw.filter(t=>((DF[t]||0)>0 || (SYN[t]||[]).some(s=>DF[s.split(' ')[0]]>0))
                                   && !conWords.has(t));
    if(!meaningful.length){
      // Two very different situations reach here and they must not share an answer.
      // (a) The query was nothing BUT a constraint ("portrait", "b-roll"): the filter has
      //     already selected the right set, so every survivor is a hit.
      // (b) NOTHING the user typed exists anywhere in the corpus ("CAGR", "REIT"): the
      //     honest answer is no results. Returning everything — which this did, all 378
      //     assets for "ETF" — is the worst possible response to an unknown term.
      if(!con.format.length && !con.type.length) return;
      results.push({a,score:Math.round(score)||1,hits:[...hits]}); return;
    }
    let total=0; meaningful.forEach(t=>total+=rawIdf(t));
    let cover=0; coveredRaw.forEach(t=>{ if(meaningful.includes(t)) cover+=rawIdf(t); });
    // 0.45, not 0.55. At 20 assets 0.55 was right; across 379 a single rare filler word
    // ('batch', 'clip') carries enough IDF mass on its own to sink a query whose real
    // terms all matched. 'certificates from the August batch' lost the August certificates
    // this way. Re-verified against the full suite after loosening.
    if(cover/total < 0.45) return;

    results.push({a,score:Math.round(score+cover*6),hits:[...hits]});
  });
  return results.sort((x,y)=>y.score-x.score);
}
/* ======================================================================= UI ==
 * Presentation only. Everything above this line is the validated search engine
 * and is byte-identical to the version that passes all 28 retrieval tests.
 */

// A result is "relevant" if it scores at least this share of the best hit. Broad queries
// legitimately match a long tail — "funny classroom" touches 172 assets — and dumping all
// of them is the same as returning none. The tail is offered, never hidden outright.
const RELEVANT = 0.7;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={q:'',filters:{},showWeak:false,openId:null,engaged:false};

/* ------------------------------------------------------------------- filters */
const FILTERS=[['type','Type',T.type],['format','Format',T.format],
  ['topic','Topic',null],['person','Person',T.person],
  ['source','Source',T.source],['session','Session',null],['status','Status',T.status]];

function buildFilters(){
  const sessions=[...new Set(ASSETS.map(a=>a.session).filter(Boolean))].sort();
  $('fgrid').innerHTML=FILTERS.map(([k,label,vals])=>{
    let opts;
    if(k==='topic'){
      opts=Object.entries(T.topic).map(([g,vs])=>
        `<optgroup label="${esc(g)}">${vs.map(v=>`<option>${esc(v)}</option>`).join('')}</optgroup>`).join('');
    } else {
      opts=(vals||sessions).map(v=>`<option>${esc(v)}</option>`).join('');
    }
    return `<div><label for="f-${k}">${esc(label)}</label>
      <select id="f-${k}" data-k="${k}"><option value="">Any</option>${opts}</select></div>`;
  }).join('');
  $('fgrid').querySelectorAll('select').forEach(s=>s.onchange=()=>{
    state.filters[s.dataset.k]=s.value; state.showWeak=false; render();
  });
}
const activeFilters=()=>Object.values(state.filters).filter(Boolean).length;
function clearFilters(){
  state.filters={}; $('fgrid').querySelectorAll('select').forEach(s=>s.value='');
  state.showWeak=false; render();
}

/* ------------------------------------------------------------------- matching */
function currentResults(){
  let list = state.q.trim() ? search(state.q) : ASSETS.map(a=>({a,score:0,hits:[]}));
  const f=state.filters;
  list=list.filter(({a})=>
    (!f.type||a.type===f.type) && (!f.format||a.format===f.format) &&
    (!f.topic||(a.topic||[]).includes(f.topic)) &&
    (!f.person||(a.person||[]).includes(f.person)) &&
    (!f.source||a.source===f.source) && (!f.session||a.session===f.session) &&
    (!f.status||a.status===f.status));
  if(!state.q.trim()) return {strong:list,weak:[]};
  const top=list.length?list[0].score:0;
  return {strong:list.filter(x=>x.score>=top*RELEVANT),
          weak:  list.filter(x=>x.score< top*RELEVANT)};
}

/* ------------------------------------------------------------------ rendering */
const ICON={Video:'▶',Image:'▣',Carousel:'❐'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Session is the human handle ("Teens — Aug 2026"); fall back to a plain month + year.
function when(a){
  if(a.session) return a.session.replace(/\s+—\s+/,' · ');
  if(!a.date) return '';
  const d=new Date(a.date); if(isNaN(d)) return '';
  return MON[d.getMonth()]+' '+d.getFullYear();
}
function card(x){
  const a=x.a;
  // Show at most three tags: the topic that earned the match, then format, then person.
  const tags=[];
  const qt=state.q.toLowerCase();
  const hot=(a.topic||[]).find(t=>qt && hasTerm(qt,t.toLowerCase().split(' ')[0]));
  if(hot) tags.push(`<span class="t key">${esc(hot)}</span>`);
  if(a.format) tags.push(`<span class="t">${esc(a.format)}</span>`);
  if(!hot && (a.topic||[]).length) tags.push(`<span class="t key">${esc(a.topic[0])}</span>`);
  if((a.person||[]).includes('Hiral')) tags.push('<span class="t">Hiral</span>');
  const isVid=a.type==='Video';
  return `<button class="res${state.openId===a.id?' sel':''}" data-id="${esc(a.id)}">
    <span class="thumb">${a.thumb
      ? `<img loading="lazy" src="${esc(a.thumb)}" alt="" onerror="this.remove()">`
      : `<span class="ph">${ICON[a.type]||'▣'}</span>`}${isVid?'<span class="play"></span>':''}</span>
    <span>
      <h3>${esc(a.title)||'Untitled'}</h3>
      ${when(a)?`<span class="when">${esc(when(a))}</span>`:''}
      <p>${esc(a.description||'')}</p>
      <span class="tags">${tags.slice(0,3).join('')}</span>
    </span>
    <span class="view">View</span>
  </button>`;
}

function render(){
  const searching=!!state.q.trim();
  // `engaged` is sticky. Once she has started searching the layout stops rearranging
  // itself: deleting the query back to empty used to snap the whole page back to the
  // hero and destroy the cursor mid-edit. Now only the logo or Clear returns to the hero.
  const heroMode = !state.engaged && !searching && !activeFilters();
  $('stage').classList.toggle('hero',heroMode);
  $('main').hidden = heroMode;
  $('libcount').textContent=`${ASSETS.length} assets`;
  $('sbox').classList.toggle('has',searching);
  $('fbtn').classList.toggle('on',activeFilters()>0);
  $('fdot').hidden=!activeFilters();
  $('fclear').hidden=!activeFilters();
  if(heroMode) return;

  const {strong,weak}=currentResults();
  const sum=$('summary');
  if(!strong.length && !weak.length){
    sum.innerHTML='';
    $('results').innerHTML=`<div class="none">
      <div class="ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b9099" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></div>
      <h2>No matching content found.</h2>
      <p>Try a different search${activeFilters()?', or clear your filters':''}.</p>
      <div class="acts">
        <button class="btn ghost" data-act="clearq">Clear search</button>
        ${activeFilters()?'<button class="btn ghost" data-act="clearf">Clear filters</button>':''}
      </div></div>`;
    return;
  }
  sum.innerHTML=`<h2>${strong.length} ${searching?'relevant result':'asset'}${strong.length===1?'':'s'}</h2>
    <span class="sub">${searching?'Most relevant first':'Newest first'}</span>`;
  let html=strong.map(card).join('');
  if(weak.length && !state.showWeak){
    html+=`<button class="weak" data-act="weak">⌄ Show ${weak.length} weaker match${weak.length===1?'':'es'}</button>`;
  } else if(weak.length){
    html+=`<div class="divider">Weaker matches</div>`+weak.map(card).join('');
  }
  $('results').innerHTML=html;
}

/* --------------------------------------------------------------- detail panel */
function openDetail(id){
  const a=ASSETS.find(x=>x.id===id); if(!a) return;
  state.openId=id;
  $('dlbl').textContent=[a.type,a.format].filter(Boolean).join(' · ');
  const media=a.video
    ? `<video controls preload="metadata" playsinline ${a.thumb?`poster="${esc(a.thumb)}"`:''} src="${esc(a.video)}"></video>`
    : (a.thumb?`<img src="${esc(a.thumb)}" alt="">`:'');
  // Say it plainly rather than letting a silent clip look like a broken one.
  const silentNote = (a.video && a.silent)
    ? '<p class="note">Preview has no sound — the original on Drive does.</p>' : '';
  const unset=v=>v?esc(v):'<span class="unset">not recorded</span>';
  const row=(k,v)=>`<dt>${k}</dt><dd>${v}</dd>`;
  $('dbody').innerHTML=`
    ${media?`<div class="dmedia">${media}</div>`:''}
    ${silentNote}
    <div class="dtext">
      <h2>${esc(a.title)||'Untitled'}</h2>
      ${a.description?`<p class="desc">${esc(a.description)}</p>`:''}
      <dl class="dl">
        ${row('Topics',(a.topic||[]).length?a.topic.map(esc).join(' · '):'<span class="unset">none recorded</span>')}
        ${row('Person',(a.person||[]).length?a.person.map(esc).join(', '):'<span class="unset">not recorded</span>')}
        ${row('Session',unset(a.session))}
        ${row('Source',a.source==='Unknown'?'<span class="unset">unknown</span>':esc(a.source))}
        ${row('Status',esc(a.status))}
      </dl>
      <div class="acts">
        ${a.drive?`<a class="btn" href="${esc(a.drive)}" target="_blank" rel="noopener">Open in Drive ↗</a>`:''}
        <button class="btn ghost" data-act="copy" data-href="${esc(a.drive||'')}">Copy link</button>
      </div>
    </div>`;
  $('detail').classList.add('open'); $('detail').setAttribute('aria-hidden','false');
  $('scrim').classList.add('open');
  document.querySelectorAll('.res').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
}
function closeDetail(){
  state.openId=null;
  $('detail').classList.remove('open'); $('detail').setAttribute('aria-hidden','true');
  $('scrim').classList.remove('open');
  // Stop audio continuing behind a closed panel.
  $('dbody').querySelectorAll('video').forEach(v=>v.pause());
  document.querySelectorAll('.res').forEach(r=>r.classList.remove('sel'));
}

/* ------------------------------------------------------------------- plumbing */
function setQuery(v,{engage=true}={}){
  state.q=v; state.showWeak=false;
  if(v.trim()) state.engaged=true;
  if(engage===false) state.engaged=false;
  closeDetail();                     // a new search must never leave the panel over results
  $('q').value=v;
  render();
}
$('q').addEventListener('input',e=>{
  state.q=e.target.value; state.showWeak=false;
  if(state.q.trim()) state.engaged=true;
  closeDetail(); render();
});
$('clearq').onclick=()=>{ setQuery('',{engage:false}); $('q').focus(); };
$('home').onclick=()=>{ state.filters={}; $('fgrid').querySelectorAll('select').forEach(x=>x.value='');
                        setQuery('',{engage:false}); window.scrollTo({top:0}); };
$('fbtn').onclick=()=>$('filters').classList.toggle('open');
$('fclear').onclick=clearFilters;
$('dclose').onclick=closeDetail;
$('scrim').onclick=closeDetail;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
document.querySelectorAll('.try button').forEach(b=>b.onclick=()=>{ setQuery(b.dataset.ex); $('q').focus(); });

document.addEventListener('click',e=>{
  const row=e.target.closest('.res'); if(row){ openDetail(row.dataset.id); return; }
  const act=e.target.closest('[data-act]'); if(!act) return;
  const a=act.dataset.act;
  if(a==='weak'){ state.showWeak=true; render(); }
  if(a==='clearq'){ setQuery(''); }
  if(a==='clearf'){ clearFilters(); }
  if(a==='copy'){
    const h=act.dataset.href; if(!h) return;
    navigator.clipboard?.writeText(h).then(()=>{ act.textContent='Copied'; setTimeout(()=>act.textContent='Copy link',1400); });
  }
});

buildFilters(); render();
</script>
</body>
</html>
