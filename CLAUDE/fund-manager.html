/* ── Statement · guided tour over a REAL investor's account statement ── */
const STMT_TOUR=[
  {k:'name', t:'Account holder', d:'This statement belongs to one investor — a real player from today’s game. Every figure below is theirs.'},
  {k:'folio', t:'Folio Number', d:'Their unique account number with the fund house — like a bank account number, but for this fund.'},
  {k:'pan', t:'PAN', d:'The investor’s tax ID, linked to every fund they own — it’s how the fund and the taxman recognise them (shown part-masked for privacy).'},
  {k:'scheme', t:'Scheme · Plan · Option', d:'The exact fund owned. “Direct Plan” = bought straight from the AMC (no distributor cut). “Growth” = profits stay invested and compound.'},
  {k:'advisor', t:'Advisor / ARN', d:'“DIRECT” means no distributor and no commission — the low-cost way to invest. A Regular plan would show a broker’s ARN code here.'},
  {k:'col-txn', t:'Transaction type', d:'Every row is one action — a lump-sum Purchase, or a monthly SIP instalment.'},
  {k:'col-amt', t:'Amount', d:'The money that went in on that date. A lumpsum is one big row; a SIP is many equal rows.'},
  {k:'col-nav', t:'NAV / Price', d:'The price of one unit on the transaction date — it changes every day with the market.'},
  {k:'col-units', t:'Units allotted', d:'Units = Amount ÷ NAV. The cheaper the NAV that month, the MORE units the same money bought — that’s rupee-cost averaging.'},
  {k:'col-bal', t:'Unit balance', d:'The running total of units after each transaction — it only climbs as you keep investing.'},
  {k:'cur-val', t:'Market value', d:'Units held × today’s NAV = what the investment is worth right now.'},
  {k:'gain', t:'The gain', d:'Market value − total invested = the profit (or loss). These are this player’s real numbers from today’s game.'},
];
const STMT_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function stmtDate(i,day){ const d=(''+((day||5))).padStart(2,'0'); return d+'-'+STMT_MON[i%12]+'-2025'; }  // SIP debit date, each month
function stmtNext(){ state.stmtStep=Math.min((state.stmtStep||0)+1, STMT_TOUR.length-1); saveNow(); renderHost(); }
function stmtPrev(){ state.stmtStep=Math.max((state.stmtStep||0)-1, 0); saveNow(); renderHost(); }
function pickStmtInvestor(id){ state.stmtInvestor=id; state.stmtStep=0; saveNow(); renderHost(); }
function stmtPick(){
  const invs=invList();
  let sel=state.stmtInvestor&&state.investors[state.stmtInvestor]?state.investors[state.stmtInvestor]:null;
  if(!sel) sel=invs.find(p=>p.mode)||invs[0]||null;
  return sel;
}
/* build the real transaction rows for one investor */
function stmtTxns(p){
  if(!p) return [];
  if(p.mode==='lump') return [{lbl:'Launch',txn:'Purchase',amt:p.invested,nav:NAV0,units:p.units}];
  if(p.mode==='sip') return (p.sipBought||[]).map(b=>({lbl:'Month '+b.m,txn:'SIP',amt:p.sipAmt,nav:b.nav,units:b.units}));
  return [];
}
function hostStatement(){
  const invs=invList();
  if(!invs.length) return `<div class="glass pad"><div class="eyebrow">🧾 Read a Statement</div><h2 style="margin:6px 0">No investors yet</h2><p class="muted">Once students have joined and invested, pick one here to read their real statement.</p><div class="controls"><button class="btn dark" onclick="goPhase('withdraw')">← Withdraw</button><div class="spacer"></div><button class="btn lg" onclick="goPhase('report')">Skip →</button></div></div>`;
  const step=state.stmtStep||0, cur=STMT_TOUR[step], hk=cur.k;
  const hl=k=>k===hk?'mfs-hl':''; const col=k=>k===hk?'mfs-col':'';
  const sel=stmtPick();
  let bal=0; const rows=stmtTxns(sel).map((t,i)=>{ bal+=t.units; return {...t,bal,date:sel.mode==='lump'?'02-Jan-2025':stmtDate(i,sel.sipDate)}; });
  const curNav=state.nav, totalInv=sel.invested||0, units=sel.units||0, curVal=units*curNav, gain=curVal-totalInv;
  const fund=(state.fund&&state.fund.name)||'IFM Growth Fund';
  const tn=state.fund&&state.fund.type?FUND_TYPES[state.fund.type].name:'Mutual Fund';
  const folio=(sel.id.replace(/[^0-9]/g,'')+'914072').slice(0,8).replace(/(\d{4})(\d{4})/,'$1$2')||'19140728';
  const money=n=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const picker=`<span style="font-family:Inter;text-transform:none;letter-spacing:0;font-weight:700;color:var(--tx-2);font-size:.82rem">Whose statement?
    <select onchange="pickStmtInvestor(this.value)" style="background:#0c1d31;color:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-weight:800;font-family:Inter;margin-left:4px">
      ${invs.map(p=>`<option value="${p.id}" ${p.id===sel.id?'selected':''}>${escapeHtml(p.name)}${p.mode?' · '+(p.mode==='sip'?'SIP':'Lumpsum'):' · —'}</option>`).join('')}
    </select></span>`;
  return `<div class="host-grid">
    <div class="glass pad">
      <div class="eyebrow" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">🧾 Read a Mutual Fund Statement ${picker}</div>
      ${sel.mode?`<div class="mfs">
        <div class="mfs-head">
          <div class="mfs-amc">IFM Mutual Fund<small>Asset Management Ltd · An Investing for Mummies company</small></div>
          <div class="mfs-ttl"><b>Account Statement</b><span>01-Jan-2025 to 31-Dec-2025</span></div>
        </div>
        <div class="mfs-info">
          <div class="${hl('name')}"><span class="lbl">Name</span><span class="val">${escapeHtml(sel.name.toUpperCase())}</span></div>
          <div class="${hl('folio')}"><span class="lbl">Folio No.</span><span class="val">${folio} / 21</span></div>
          <div class="${hl('pan')}"><span class="lbl">PAN</span><span class="val">ABCDE****F</span></div>
          <div><span class="lbl">KYC</span><span class="val" style="color:#0e7a3e">OK · Verified</span></div>
          <div><span class="lbl">Registrar</span><span class="val">CAMS</span></div>
          <div class="${hl('advisor')}"><span class="lbl">Advisor</span><span class="val">DIRECT</span></div>
        </div>
        <div class="mfs-scheme ${hl('scheme')}">${escapeHtml(fund)} — Direct Plan · Growth Option<small>ISIN: INF200K01AB7 · Open-ended ${tn} Scheme · Registrar Folio</small></div>
        <table class="mfs-tbl"><thead><tr>
          <th>Date</th><th class="${hl('col-txn')}">Transaction</th><th class="${hl('col-amt')}">Amount (₹)</th><th class="${hl('col-nav')}">NAV (₹)</th><th class="${hl('col-units')}">Units</th><th class="${hl('col-bal')}">Unit Balance</th>
        </tr></thead><tbody>
          <tr class="open"><td>${rows[0]?rows[0].date:'01-Jan-2025'}</td><td>Opening Balance</td><td>—</td><td>—</td><td>—</td><td>0.000</td></tr>
          ${rows.map(r=>`<tr><td>${r.date}</td><td class="${col('col-txn')}">${r.txn==='SIP'?'SIP Purchase':'Purchase'}</td><td class="${col('col-amt')}">${money(r.amt)}</td><td class="${col('col-nav')}">${r.nav.toFixed(4)}</td><td class="${col('col-units')}">${r.units.toFixed(3)}</td><td class="${col('col-bal')}">${r.bal.toFixed(3)}</td></tr>`).join('')}
          <tr class="close"><td>31-Dec-2025</td><td>Closing Balance</td><td>—</td><td>${curNav.toFixed(4)}</td><td>—</td><td>${units.toFixed(3)}</td></tr>
        </tbody></table>
        <div class="mfs-foot">
          <span class="mv ${hl('cur-val')}">Market Value (31-Dec-2025 · NAV ₹${curNav.toFixed(2)}): <b>₹${money(curVal)}</b></span>
          <span class="${hl('gain')}">Total Invested ₹${money(totalInv)} · Gain: <b style="color:${gain>=0?'#0e7a3e':'#c0392b'}">${gain>=0?'+':'−'}₹${money(Math.abs(gain))}</b></span>
        </div>
        <div class="mfs-fine">This is a computer-generated statement and does not require a signature. Mutual fund investments are subject to market risks; read all scheme-related documents carefully. Units are allotted at the NAV of the transaction date after realisation of funds.</div>
      </div>`:`<p class="muted" style="padding:24px 0">${escapeHtml(sel.name)} didn’t invest this game. Pick another investor above ☝️</p>`}
    </div>
    <div class="glass pad">
      <div class="eyebrow">📖 Guided tour · step ${step+1} of ${STMT_TOUR.length}</div>
      <div class="tour-step"><div class="tour-t">${cur.t}</div><div class="tour-d">${cur.d}</div></div>
      <div class="tour-dots">${STMT_TOUR.map((s,i)=>`<span class="${i===step?'on':i<step?'done':''}"></span>`).join('')}</div>
      <div class="controls">
        <button class="btn dark" onclick="stmtPrev()" ${step>0?'':'disabled'}>← Back</button>
        <button class="btn ghost" onclick="goPhase('report')">Skip to Recap ⏭</button>
        <div class="spacer"></div>
        ${step<STMT_TOUR.length-1?`<button class="btn lg" onclick="stmtNext()">Next →</button>`:`<button class="btn lg" onclick="goPhase('report')">Next: Recap →</button>`}
      </div>
    </div>
  </div>`;
}
function pStatement(p){
  const step=state.stmtStep||0, cur=STMT_TOUR[step]||STMT_TOUR[0];
  const sel=stmtPick(), mine=sel&&sel.id===MY_ID;
  const who=mine?'YOUR statement 📢':(sel?escapeHtml(sel.name)+'’s statement':'a statement');
  return `<div class="p-center" style="gap:12px"><div style="font-size:1.9rem">🧾</div><div class="p-status" style="font-size:1.2rem">Reading ${who}</div>
    <div class="pf-card" style="text-align:left"><div class="pf-val-k" style="color:var(--gold)">${cur.t}</div><p style="margin-top:7px;font-weight:600;color:var(--tx);line-height:1.45">${cur.d}</p></div>
    <p class="p-sub">Follow the highlight on the big screen 👀 · step ${step+1} of ${STMT_TOUR.length}</p></div>`;
}

/* ── Factsheet · a live multiple-choice class on reading a real fund report ── */
function fsQuiz(){
  const f=state.fund||{};
  const rc=f.type==='equity'?0:f.type==='hybrid'?1:2;   // correct risk index by fund type
  return [
    {k:'nav',   q:'The NAV — what does that number tell you?', opts:['The price of ONE unit today','The total money in the whole fund','The yearly fee the fund charges'], correct:0},
    {k:'aum',   q:'What does AUM stand for?', opts:['Assets Under Management — all the money pooled','Average Units per Member','Annual Upfront Money'], correct:0},
    {k:'ret',   q:'The return figure on a factsheet is…', opts:['Past growth over a period — never a guarantee','A bonus the fund pays you','Money you owe the fund'], correct:0},
    {k:'risk',  q:`How risky is this ${f.type?FUND_TYPES[f.type].name:'fund'}?`, opts:['High — lots of ups & downs','Moderate — a balanced mix','Low — steady & safer'], correct:rc},
    {k:'holds', q:'"Top holdings" on a factsheet are…', opts:['The actual stocks the fund owns','The richest investors','The manager’s salary'], correct:0},
    {k:'sip',   q:'A SIP lets you…', opts:['Invest a fixed amount every month','Withdraw everything instantly','Remove all risk'], correct:0},
  ];
}
function fsReveal(){ state.fsShow=true; saveNow(); renderHost(); }
function fsNext(){ const n=fsQuiz().length; state.fsStep=Math.min((state.fsStep||0)+1,n-1); state.fsShow=false; saveNow(); renderHost(); }
function fsPrev(){ state.fsStep=Math.max((state.fsStep||0)-1,0); state.fsShow=false; saveNow(); renderHost(); }
function pFsAnswer(k,choice){ const m=me(); if(!m||state.fsShow)return; sendAction({type:'fsanswer',k,choice,id:MY_ID}); }
function hostFactsheet(){
  const f=state.fund, aum=AUM(), assets=(f.assets&&f.assets.length)?f.assets:['—'], w=100/assets.length;
  const risk={equity:'High',debt:'Low',hybrid:'Moderate'}[f.type]||'—';
  const ret1=(state.nav-NAV0)/NAV0*100;
  const step=state.fsStep||0, quiz=fsQuiz(), cur=quiz[step], show=state.fsShow, hk=cur.k;
  const hl=k=>k===hk?'tour-hl':'';
  const invs=invList(), answered=invs.filter(p=>p.fs&&p.fs[cur.k]!=null).length;
  const tally=cur.opts.map((o,i)=>invs.filter(p=>p.fs&&p.fs[cur.k]===i).length);
  return `<div class="host-grid">
    <div class="glass pad fsheet">
      <div class="fs-head">
        <div><div class="eyebrow">Fund Factsheet</div><h2 style="margin:2px 0">${escapeHtml(f.name)}</h2>
          <div class="muted tiny">${f.type?FUND_TYPES[f.type].name:'Mutual Fund'} · open-ended</div></div>
        <div class="fs-nav ${hl('nav')}"><div class="num">₹${state.nav.toFixed(2)}</div><div class="k">NAV</div></div>
      </div>
      <div class="fs-grid">
        <div class="fs-cell ${hl('aum')}"><div class="v num">${fmtMoney(aum)}</div><div class="k">AUM</div></div>
        <div class="fs-cell ${hl('ret')}"><div class="v num" style="color:var(--${ret1>=0?'grow':'crash'})">${ret1>=0?'+':''}${ret1.toFixed(1)}%</div><div class="k">1-yr return</div></div>
        <div class="fs-cell ${hl('risk')}"><div class="v num">${risk}</div><div class="k">Risk</div></div>
        <div class="fs-cell ${hl('sip')}"><div class="v num">₹10,000</div><div class="k">Min SIP / mo</div></div>
      </div>
      <div class="fs-sec-h ${hl('holds')}" style="margin-top:12px;padding:4px 6px;border-radius:8px">Top holdings — where your money actually is · ${invs.length} investors</div>
      <div class="fs-holds">${assets.map(a=>`<div class="fs-hold"><span class="hi-nm">${a} <span class="hi-sec">${assetSector(a)}</span></span><b class="num">${w.toFixed(0)}%</b></div>`).join('')}</div>
    </div>
    <div class="glass pad">
      <div class="eyebrow">🎯 Quiz · question ${step+1} of ${quiz.length}</div>
      <div class="tour-step"><div class="tour-t" style="font-size:1.1rem">${cur.q}</div></div>
      <div class="div-choices">${cur.opts.map((o,i)=>{
        const isC=i===cur.correct;
        const pickers=invs.filter(p=>p.fs&&p.fs[cur.k]===i), shown=pickers.slice(0,7);
        const st=show?(isC?'border-color:var(--grow);background:rgba(52,211,153,.16)':'opacity:.5'):'';
        return `<div class="div-chip" style="align-items:center;gap:8px;${st}">
          <span class="hi-nm" style="flex:1">${String.fromCharCode(65+i)}. ${o}${show&&isC?' <b style="color:var(--grow)">✓ correct</b>':''}</span>
          <span class="pickers">${shown.map(p=>`<span class="av av-mini" style="background:${p.color}" title="${escapeHtml(p.name)}">${p.av}</span>`).join('')}${pickers.length>7?`<span class="tiny" style="color:var(--tx-2);margin-left:4px">+${pickers.length-7}</span>`:''}${pickers.length?'':'<span class="tiny" style="color:var(--tx-3)">—</span>'}</span></div>`;
      }).join('')}</div>
      <div class="controls"><span class="phase-tag">${answered}/${invs.length} answered</span>
        ${!show?`<button class="btn gold" onclick="fsReveal()">Reveal answer</button>`:''}
        <div class="spacer"></div>
        <button class="btn dark" onclick="fsPrev()" ${step>0?'':'disabled'}>←</button>
        ${step<quiz.length-1?`<button class="btn lg" onclick="fsNext()">Next question →</button>`:`<button class="btn gold lg" onclick="goPhase('report')">Done · Recap →</button>`}
      </div>
    </div>
  </div>`;
}
function pFactsheet(p){
  const step=state.fsStep||0, quiz=fsQuiz(), cur=quiz[step], show=state.fsShow;
  const my=(p.fs&&p.fs[cur.k]!=null)?p.fs[cur.k]:null;
  if(show){
    const right=my===cur.correct;
    return `<div class="p-center" style="gap:12px"><div style="font-size:2.2rem">${my==null?'🤔':right?'✅':'❌'}</div>
      <div class="p-status" style="font-size:1.2rem">${my==null?'No answer':right?'Correct! 🎉':'Not quite'}</div>
      <div class="pf-card" style="text-align:left"><div class="pf-val-k" style="color:var(--gold)">Q${step+1} · ${cur.q}</div>
        <p style="margin-top:8px;color:var(--grow);font-weight:800">✓ ${cur.opts[cur.correct]}</p>
        ${my!=null&&!right?`<p style="margin-top:4px;color:var(--tx-2);font-weight:600">You picked: ${cur.opts[my]}</p>`:''}</div>
      <p class="p-sub">Watch the big screen for the next question 👀</p></div>`;
  }
  return `<div class="p-center" style="gap:12px;justify-content:flex-start;padding-top:8px">
    <div class="p-status" style="font-size:1.15rem">🎯 Question ${step+1} of ${quiz.length}</div>
    <p class="p-sub" style="font-weight:800;color:var(--tx);font-size:1rem">${cur.q}</p>
    <div class="amt-grid" style="grid-template-columns:1fr;gap:9px">${cur.opts.map((o,i)=>`<button onclick="pFsAnswer('${cur.k}',${i})" style="text-align:left;background:var(--panel);border:1.5px solid ${my===i?'var(--grow)':'var(--line)'};${my===i?'background:rgba(52,211,153,.12);':''}border-radius:14px;padding:13px 15px;color:#fff;font-family:Inter;font-weight:700;font-size:.95rem">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>
    <p class="p-sub">${my!=null?`Locked in ${String.fromCharCode(65+my)} · tap another to change until reveal`:'Tap your answer'}</p></div>`;
}

/* ── utils ──────────────────────────────────────────── */
function escapeHtml(s){return (s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ── boot ───────────────────────────────────────────── */
if(isHost) initHost(); else initPlayer();

/* ── Tap-to-rejoin (added 2026-09-17) — see quiz.html for full note.
   Reload is portfolio-safe: MY_ID is in localStorage ('mfm_pid'), and
   the host's join handler is a no-op for players still in
   state.investors[a.id] (fund-manager.html:778). */
(function(){
  if (typeof isHost === 'undefined' || isHost) return;
  var lastRenderAt = Date.now(), wasHidden = false, graceTimer = null, overlayEl = null;
  if (typeof renderPlayer === 'function') {
    var _orig = renderPlayer;
    renderPlayer = function(){
      lastRenderAt = Date.now();
      if (overlayEl) { overlayEl.remove(); overlayEl = null; }
      return _orig.apply(this, arguments);
    };
  }
  function showOverlay(){
    if (overlayEl) return;
    overlayEl = document.createElement('div');
    overlayEl.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,14,22,0.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px';
    overlayEl.innerHTML = '<div style="text-align:center;max-width:380px;color:#fff;font-family:system-ui,-apple-system,sans-serif"><div style="font-size:64px;margin-bottom:18px">📡</div><div style="font-size:26px;font-weight:800;margin-bottom:10px;letter-spacing:-0.02em">Lost connection</div><div style="font-size:16px;color:rgba(255,255,255,0.72);margin-bottom:28px;line-height:1.5">Your phone stopped hearing from the game. Tap below to rejoin — your progress is safe.</div><button id="__rejoinBtn" style="width:100%;padding:18px 24px;background:linear-gradient(135deg,#22c55e 0%,#15803d 100%);border:none;border-radius:14px;color:#fff;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(34,197,94,0.35),0 2px 6px rgba(0,0,0,0.25)">Tap to rejoin →</button></div>';
    document.body.appendChild(overlayEl);
    document.getElementById('__rejoinBtn').onclick = function(){ location.reload(); };
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) { wasHidden = true; return; }
    if (!wasHidden) return;
    wasHidden = false; lastRenderAt = Date.now();
    clearTimeout(graceTimer);
    graceTimer = setTimeout(function(){
      if (Date.now() - lastRenderAt >= 4000) showOverlay();
    }, 4200);
  });
})();
</script>
</body>
</html>
