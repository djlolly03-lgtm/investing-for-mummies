<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mutual Fund Manager LIVE — Investing for Mummies</title>
<link rel="icon" type="image/png" href="/ifm-round.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- ══════════════════════════════════════════════════════════════════════════
   MUTUAL FUND MANAGER LIVE — IFM flagship classroom simulation
   Teacher = Fund Manager (host / projector).  Students = Investors (phones).
   Reuses the Stock Rush Supabase project (games table) — NO new setup.
   Room codes:  MF#### (e.g. MF7421) — distinct from Stock Rush (letters) and
   the KBC quiz (4-digit numeric) so they can never collide in the shared table.

   ── ASSET PLACEHOLDER MANIFEST (numbered chronologically by screen) ──────────
   Drop rich images / video later by filling the MEDIA map (search "const MEDIA").
   See fund-manager-ASSETS.md for the full spec.
     ASSET-01  S1 Lobby/launch hero banner            host    16:9
     ASSET-02  Equity fund crest                      both    1:1
     ASSET-03  Debt fund crest                        both    1:1
     ASSET-04  Hybrid fund crest                      both    1:1
     ASSET-05  S2 "Your money at work" art            player  4:3
     ASSET-06  S4 Equity Rally event art              host    16:9
     ASSET-07  S4 Market Crash event art              host    16:9
     ASSET-08  S4 IT Stocks Boom event art            host    16:9
     ASSET-09  S4 Bonds Rise event art                host    16:9
     ASSET-10  S5 NAV Discovery backdrop              host    16:9
   (Phase 2 continues the sequence: Feezilla, STP water-flow, SWP tank, etc.)
   ════════════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --ink:#0a1422;--ink-2:#0f2036;--ink-3:#14304f;
  --panel:rgba(255,255,255,.055);--panel-2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);
  --grow:#34d399;--grow-d:#0e9f6e;--gold:#f5c451;--gold-d:#d9a017;--crash:#ef5a4c;--accent:#4ea8ff;--accent-d:#2b6fd6;
  --tx:#eaf2fb;--tx-2:#9fb2c8;--tx-3:#6d829c;
  --shadow:0 18px 50px rgba(0,0,0,.45);--shadow-sm:0 8px 24px rgba(0,0,0,.35);
  --r:20px;
  --stage-h:clamp(540px,calc(100vh - 152px),800px); /* one standard height for every teaching stage */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Inter',sans-serif;color:var(--tx);
  background:
   radial-gradient(120% 90% at 15% -10%,#13304f 0%,transparent 55%),
   radial-gradient(120% 90% at 100% 0%,#10283f 0%,transparent 50%),
   linear-gradient(180deg,#0a1422 0%,#070f1a 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Sora',sans-serif;letter-spacing:-.01em}
.hide{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:12px 18px}
.num{font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ── buttons ─────────────────────────────────────────── */
button{font-family:'Inter';font-weight:800;cursor:pointer;border:none}
.btn{padding:14px 24px;border-radius:14px;font-size:1.02rem;color:#06121f;
  background:linear-gradient(135deg,var(--grow),var(--grow-d));box-shadow:var(--shadow-sm);transition:.14s;letter-spacing:.01em}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0) scale(.99)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2a1c00}
.btn.blue{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#04101f}
.btn.ghost{background:var(--panel-2);color:var(--tx);border:1px solid var(--line)}
.btn.dark{background:#0c1d31;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn.lg{font-size:1.18rem;padding:17px 30px;border-radius:16px}

/* ── glass cards ─────────────────────────────────────── */
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.glass.pad{padding:17px}
.eyebrow{font-family:'Sora';text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:700;color:var(--accent)}
.muted{color:var(--tx-2)}.tiny{font-size:.78rem}

/* ── brand bar ───────────────────────────────────────── */
.brandbar{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:9px;flex-wrap:wrap}
.brandbar .l{display:flex;align-items:center;gap:13px}
.brandbar img{width:48px;height:48px;border-radius:50%;box-shadow:var(--shadow-sm);background:#fff}
.brandbar .nm{font-family:'Sora';font-weight:800;font-size:1.18rem;line-height:1.05}
.brandbar .sub{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.livedot{display:inline-flex;align-items:center;gap:7px;background:rgba(239,90,76,.14);color:#ff8e82;
  border:1px solid rgba(239,90,76,.4);padding:6px 13px;border-radius:30px;font-weight:800;font-size:.78rem;letter-spacing:.08em}
.livedot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crash);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.roomtag{font-family:'Sora';font-weight:700;color:var(--tx-2);font-size:.82rem}
.fundchip{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:var(--shadow-sm)}
.fundchip .fc-k{font-size:.58rem;letter-spacing:.16em;color:var(--tx-3);font-weight:800}
.fundchip .fc-n{font-family:'Sora';font-weight:800;font-size:1.02rem;color:var(--tx);line-height:1}
.fundchip .fc-t{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.mini-qr{display:flex;align-items:center;gap:8px;background:#fff;border-radius:11px;padding:4px 11px 4px 4px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.12s}
.mini-qr:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.mini-qr img{width:40px;height:40px;display:block;border-radius:7px}
.mini-qr span{font-size:.66rem;font-weight:800;color:#0a1422;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}

/* ── ASSET placeholder slot ──────────────────────────── */
.slot{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;
  border:2px dashed rgba(120,170,255,.35);border-radius:16px;color:var(--tx-3);
  background:linear-gradient(135deg,rgba(78,168,255,.05),rgba(52,211,153,.05));overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .slot-lbl{padding:14px}
.slot .slot-id{font-family:'Sora';font-weight:800;color:var(--accent);font-size:.82rem;letter-spacing:.1em}
.slot .slot-desc{font-size:.78rem;margin-top:4px;color:var(--tx-2)}
.slot .slot-ar{font-size:.68rem;margin-top:3px;opacity:.7}
.slot.r169{aspect-ratio:16/9}.slot.r43{aspect-ratio:4/3}.slot.r11{aspect-ratio:1/1}

/* ══════════ HOST · Fund Control Room ══════════ */
.host-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:stretch;height:var(--stage-h)}
@media(max-width:900px){.host-grid{grid-template-columns:1fr;height:auto}}
/* ── standard stage: every teaching screen is the SAME fixed height, and the Next-button bar is
   pinned to the bottom (sticky) so it never jumps when a Reveal opens and always lands in the same
   place. If a screen's content is taller than the stage, that panel scrolls internally. ── */
#host>.glass.pad{height:var(--stage-h)}
#host>.glass.pad,#host .host-grid>.glass.pad{display:flex;flex-direction:column;overflow-y:auto}
#host>.glass.pad>.controls:last-child,#host .host-grid>.glass.pad>.controls:last-child{
  position:sticky;bottom:0;margin-top:auto;padding:12px 0 2px;
  background:linear-gradient(180deg,rgba(11,19,31,0),rgba(11,19,31,.97) 42%)}
@media(max-width:900px){#host>.glass.pad{height:auto}}

/* lobby */
.lobby-hero{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.lobby-hero .overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:26px;background:linear-gradient(0deg,rgba(7,15,26,.92),rgba(7,15,26,.25) 55%,transparent)}
.lobby-hero h1{font-size:2.7rem;margin:2px 0 0;font-weight:800}
.lobby-cols{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.lobby-cols{grid-template-columns:1fr}}
.lobby-right{display:flex;flex-direction:column;gap:18px;min-width:0}
.invpanel{padding-top:12px!important;padding-bottom:12px!important}
.invpanel-grid{max-height:132px;overflow-y:auto;align-content:flex-start}
.join-card{text-align:center}
#qrbox{display:flex;justify-content:center;margin:14px 0}
#qrbox img,#qrbox canvas{border-radius:14px;border:7px solid #fff;box-shadow:var(--shadow)}
.pin-label{color:var(--tx-3);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem}
.pin{font-family:'Sora';font-size:2.9rem;font-weight:800;letter-spacing:.4rem;color:#fff;line-height:1}
.joinurl{font-size:.74rem;color:var(--tx-3);word-break:break-all;font-weight:600;margin-top:6px}

/* fund builder */
.type-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.type-btn{border:1.5px solid var(--line);background:var(--panel);border-radius:16px;padding:11px 10px;text-align:center;
  color:var(--tx);transition:.14s;cursor:pointer}
.type-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.type-btn.sel{border-color:var(--grow);background:rgba(52,211,153,.12);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
.type-btn .ic{font-size:1.7rem}
.type-btn .tn{font-family:'Sora';font-weight:700;margin-top:5px;font-size:.98rem}
.type-btn .td{font-size:.72rem;color:var(--tx-2);margin-top:2px}
.fund-name-in{width:100%;background:#091a2b;border:1.5px solid var(--line);border-radius:13px;color:#fff;
  font-family:'Sora';font-weight:700;font-size:1.25rem;padding:13px 16px;outline:none}
.fund-name-in:focus{border-color:var(--accent)}
.pool{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.asset-pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:30px;padding:8px 14px;font-weight:700;font-size:.9rem;cursor:pointer;transition:.12s;color:var(--tx)}
.asset-pill:hover{border-color:var(--accent);transform:translateY(-1px)}
.asset-pill .dot{width:9px;height:9px;border-radius:50%}
.asset-pill.added{opacity:.4;pointer-events:none}
.basket{min-height:54px;display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;padding:12px;border-radius:14px;
  background:rgba(52,211,153,.06);border:1px dashed rgba(52,211,153,.3)}
.basket .asset-pill{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4)}
.basket .x{margin-left:2px;opacity:.6;font-weight:900}
.empty-basket{color:var(--tx-3);font-size:.86rem;font-weight:600;align-self:center}

/* AUM gauge */
.gauge-wrap{text-align:center;padding:8px 0 2px}
.gauge{position:relative;width:100%;max-width:330px;margin:0 auto}
.gauge svg{width:100%;display:block;overflow:visible}
.g-track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:16;stroke-linecap:round}
.g-fill{fill:none;stroke:url(#aumgrad);stroke-width:16;stroke-linecap:round;
  filter:drop-shadow(0 0 10px rgba(52,211,153,.55));transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.gauge .g-center{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.aum-big{font-family:'Sora';font-weight:800;font-size:2.4rem;line-height:1;
  background:linear-gradient(135deg,#7df3c4,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.aum-lbl{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-2);font-weight:800;margin-top:4px}
.gauge-scale{display:flex;justify-content:space-between;max-width:420px;margin:2px auto 0;color:var(--tx-3);font-size:.7rem;font-weight:700}

/* stat tiles */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat .v{font-family:'Sora';font-weight:800;font-size:1.5rem;color:#fff}
.stat .k{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-2);font-weight:800;margin-top:3px}
.stat .v.grow{color:var(--grow)}.stat .v.gold{color:var(--gold)}.stat .v.blue{color:var(--accent)}

/* investor chips on host */
.inv-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.inv-grid{display:flex;flex-wrap:wrap;gap:9px}
.ichip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:30px;padding:7px 14px 7px 7px;font-weight:700;animation:pop .3s;font-size:.9rem}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;color:#06121f;font-weight:900;flex:0 0 auto}
.av-mini{width:26px;height:26px;font-size:.9rem;margin-left:-5px;border:2px solid #0e1a2b;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pickers{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;padding-left:5px}
.ichip .amt{font-family:'Sora';color:var(--grow);font-weight:800;margin-left:2px}
.ichip.pending .amt{color:var(--tx-3)}
.waiting{color:var(--tx-3);font-weight:600}

/* reveal card */
.reveal{margin-top:13px;border-radius:18px;padding:15px 18px;border:1px solid rgba(245,196,81,.4);
  background:linear-gradient(135deg,rgba(245,196,81,.14),rgba(245,196,81,.05));animation:rin .5s}
@keyframes rin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.reveal .acr{font-family:'Sora';font-size:2.2rem;font-weight:800;color:var(--gold)}
.reveal .full{font-weight:800;font-size:1.05rem;margin:2px 0 8px}
.reveal p{margin:0;color:var(--tx)}

/* market event card */
.event-card{text-align:center;border-radius:18px;padding:13px 18px;margin-top:6px;animation:rin .45s;border:1px solid var(--line)}
.event-card.up{background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(52,211,153,.04));border-color:rgba(52,211,153,.45)}
.event-card.down{background:linear-gradient(135deg,rgba(239,90,76,.18),rgba(239,90,76,.04));border-color:rgba(239,90,76,.45)}
.event-card .em{font-size:2.1rem;line-height:1.1}
.event-card .ev-nm{font-family:'Sora';font-size:1.6rem;font-weight:800;margin:4px 0}
.event-card .ev-pct{font-family:'Sora';font-size:2.6rem;font-weight:800}
.event-card.up .ev-pct{color:var(--grow)}.event-card.down .ev-pct{color:var(--crash)}
.event-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.event-grid.one{grid-template-columns:1fr}
.hold-impact{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hi-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 13px;font-weight:700;font-size:.92rem}
.hi-nm{color:var(--tx)}
.hi-sec{display:inline-block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--tx-3);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:20px;margin-left:6px}
.hi-chg.up{color:var(--grow)}.hi-chg.down{color:var(--crash)}
.hi-total{background:rgba(78,168,255,.1);border-color:rgba(78,168,255,.35)}
.hi-total .hi-nm{font-family:'Sora';font-weight:800}
/* factsheet */
.fsheet{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
.fs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.fs-nav{text-align:right}.fs-nav .num{font-family:'Sora';font-weight:800;font-size:2rem;color:var(--gold);line-height:1}
.fs-nav .k,.fs-cell .k{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-2);font-weight:800;margin-top:2px}
.fs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.fs-cell{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}
.fs-cell .v{font-family:'Sora';font-weight:800;font-size:1.3rem;color:#fff}
.fs-sec-h{font-family:'Sora';font-weight:700;font-size:.95rem;color:var(--tx)}
.fs-holds{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fs-hold{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 13px;font-weight:700}
.fs-hold b{font-family:'Sora';color:var(--accent)}
.fs-legend{display:flex;flex-direction:column;gap:9px;margin-top:8px;color:var(--tx-2);font-weight:600;line-height:1.4}
.fs-legend b{color:var(--tx);font-family:'Sora'}
.fs-gl{padding:8px 0;border-bottom:1px solid var(--line)}
.fs-gl:last-child{border-bottom:none}.fs-gl b{color:var(--gold)}
.event-pick{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--tx);transition:.12s}
.event-pick:hover{border-color:var(--accent);transform:translateY(-2px)}
.event-pick .em{font-size:1.5rem}
.event-pick .ev-nm2{font-weight:800;font-size:.95rem}
.event-pick .pc{margin-left:auto;font-family:'Sora';font-weight:800}
.pc.up{color:var(--grow)}.pc.down{color:var(--crash)}

/* NAV sparkline + ticker */
.nav-ticker{display:flex;align-items:baseline;gap:10px;justify-content:center;margin:2px 0}
.nav-ticker .nv{font-family:'Sora';font-weight:800;font-size:2.4rem;color:#fff}
.nav-ticker .chg{font-family:'Sora';font-weight:800;font-size:1.05rem;padding:3px 10px;border-radius:20px}
.chg.up{color:var(--grow);background:rgba(52,211,153,.14)}.chg.down{color:var(--crash);background:rgba(239,90,76,.14)}
.spark{width:100%;height:70px;display:block;margin-top:4px}

/* yesterday/today compare */
.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:6px}
.cmp-col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.cmp-col.today{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.07)}
.cmp-col .ct{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-2);font-weight:800}
.cmp-row{display:flex;justify-content:space-between;margin-top:9px;font-weight:700}
.cmp-row b{font-family:'Sora'}
.cmp-arrow{font-size:1.8rem;color:var(--accent)}
@media(max-width:620px){.compare{grid-template-columns:1fr;}.cmp-arrow{transform:rotate(90deg)}}

/* host controls bar */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.controls .btn.lg{margin-left:auto}
.controls .spacer{flex:1}
.phase-tag{font-family:'Sora';font-weight:700;font-size:.8rem;color:var(--tx-2);background:var(--panel);
  border:1px solid var(--line);padding:6px 13px;border-radius:30px}
/* the 3 things that matter — AUM · NAV · UNITS */
.metrics3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:10px 0}
.m3{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.m3.aum{border-color:rgba(52,211,153,.45)}.m3.nav{border-color:rgba(245,196,81,.45)}.m3.units{border-color:rgba(78,168,255,.45)}
.m3-v{font-family:'Sora';font-weight:800;font-size:2.05rem;line-height:1}
.m3.aum .m3-v{color:var(--grow)}.m3.nav .m3-v{color:var(--gold)}.m3.units .m3-v{color:var(--accent)}
.m3-t{font-family:'Sora';font-weight:800;font-size:.9rem;letter-spacing:.06em;margin-top:7px}
.m3-k{font-size:.68rem;color:var(--tx-2);font-weight:600;margin-top:2px;line-height:1.25}
.m3-d{font-size:.72rem;font-weight:800;margin-top:4px}.m3-d.up{color:var(--grow)}.m3-d.down{color:var(--crash)}.m3-d.same{color:var(--accent)}
.m3-was{font-size:.74rem;color:var(--tx-3);font-weight:700;margin-top:5px}
.m3-badge{margin-top:8px;display:inline-block;font-family:'Sora';font-weight:800;font-size:.86rem;padding:5px 13px;border-radius:20px;letter-spacing:.02em}
.m3-badge.up{background:rgba(52,211,153,.2);color:#7df3c4}
.m3-badge.down{background:rgba(239,90,76,.2);color:#ff8e82}
.m3-badge.same{background:rgba(78,168,255,.22);color:#bfe0ff}
.m3.ch-up{border-color:var(--grow);box-shadow:0 0 0 2px rgba(52,211,153,.28),0 10px 28px rgba(52,211,153,.2);animation:m3pop .45s ease-out}
.m3.ch-down{border-color:var(--crash);box-shadow:0 0 0 2px rgba(239,90,76,.28),0 10px 28px rgba(239,90,76,.2);animation:m3pop .45s ease-out}
.m3.ch-same{border-color:var(--accent);animation:m3same 1.3s ease-in-out infinite}
@keyframes m3pop{0%{transform:scale(.88);opacity:.35}62%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes m3same{0%,100%{box-shadow:0 0 0 2px rgba(78,168,255,.3),0 8px 24px rgba(78,168,255,.14)}50%{box-shadow:0 0 0 3px rgba(78,168,255,.6),0 10px 30px rgba(78,168,255,.4)}}
.sc-note{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.9rem;font-weight:600;color:var(--tx);line-height:1.45}
.sc-note.flow{border-color:rgba(78,168,255,.45);background:rgba(78,168,255,.08)}
.scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0}
.scenario-btn{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 13px;color:#fff;transition:.12s}
.scenario-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.scenario-btn .em{font-size:1.5rem;line-height:1.2}
.scenario-btn .snm{font-family:'Sora';font-weight:800;font-size:1rem}
.scenario-btn .ssub{font-size:.72rem;color:var(--tx-2);font-weight:600}
.scenario-btn.s-up.sel,.scenario-btn.s-in.sel{border-color:var(--grow);background:rgba(52,211,153,.12);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
.scenario-btn.s-down.sel,.scenario-btn.s-out.sel{border-color:var(--crash);background:rgba(239,90,76,.12);box-shadow:0 0 0 3px rgba(239,90,76,.16)}
.sc-rows{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem}
.sc-rows>div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sc-rows .sc-k{color:var(--tx-2);text-transform:uppercase;font-size:.68rem;letter-spacing:.06em;font-weight:800;min-width:44px}
.rule-table{display:flex;flex-direction:column;gap:6px}
.rule-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-weight:800;font-size:.95rem;transition:.15s}
.rule-row.head{background:none;border:none;padding:0 13px 2px;font-size:.68rem;color:var(--tx-3);text-transform:uppercase;letter-spacing:.06em}
.rule-row.lit{border-color:var(--gold);background:rgba(245,196,81,.1);box-shadow:0 0 0 2px rgba(245,196,81,.22)}
.rule-row .up{color:var(--grow)}.rule-row .down{color:var(--crash)}.rule-row .same{color:var(--accent)}
.done-badge{display:inline-flex;align-items:center;gap:8px;font-family:'Sora';font-weight:800;font-size:1rem;color:#0c1d16;
  background:linear-gradient(135deg,#7df3c4,#34d399);border:1px solid rgba(52,211,153,.6);padding:11px 20px;border-radius:14px;box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.host-reset{position:fixed;top:14px;right:14px;z-index:50;background:#0c1d31;color:var(--tx);border:1px solid var(--line);
  padding:9px 15px;border-radius:30px;font-weight:800;font-size:.82rem;box-shadow:var(--shadow-sm)}

/* the steps stepper */
.steps{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.step{font-size:.72rem;font-weight:800;color:var(--tx-3);background:var(--panel);border:1px solid var(--line);
  padding:6px 11px;border-radius:30px;letter-spacing:.02em}
.step.on{color:#06121f;background:linear-gradient(135deg,var(--gold),var(--gold-d));border-color:transparent}
.step.done{color:var(--grow);border-color:rgba(52,211,153,.4)}

/* ══════════ PLAYER · investor phone ══════════ */
.player-scr{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px}
.p-top{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;margin-bottom:6px}
.p-top .who{display:flex;align-items:center;gap:9px;font-weight:800}
.p-top .cash{font-family:'Sora';font-weight:800;color:var(--gold);font-size:1.05rem}
.p-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:14px 6px}
.p-input{width:100%;background:#091a2b;border:1.5px solid var(--line);border-radius:14px;color:#fff;
  font-size:1.1rem;padding:15px 16px;outline:none;font-weight:700;text-align:center}
.p-input:focus{border-color:var(--accent)}
.p-status{font-family:'Sora';font-weight:800;font-size:1.5rem}
.p-sub{color:var(--tx-2);font-weight:600}
.cash-banner{background:linear-gradient(135deg,rgba(245,196,81,.16),rgba(245,196,81,.05));border:1px solid rgba(245,196,81,.35);
  border-radius:16px;padding:14px;width:100%}
.cash-banner .cb-v{font-family:'Sora';font-weight:800;font-size:1.9rem;color:var(--gold)}
.cash-banner .cb-k{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-2);font-weight:800}
.amt-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%}
.invest-hero{width:calc(100% + 32px);margin:-6px -16px 2px}
.invest-hero .slot{border-radius:0;border-left:none;border-right:none}
.cash-pill{background:rgba(245,196,81,.13);border:1px solid rgba(245,196,81,.32);border-radius:18px;padding:9px 16px;font-weight:700;color:var(--tx-2);text-align:center;line-height:1.35}
.cash-pill b{font-family:'Sora';color:var(--gold);font-size:1.05rem}
.amt-btn{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;color:#fff;
  font-family:'Sora';font-weight:800;font-size:1.25rem;transition:.12s}
.amt-btn:hover{border-color:var(--grow);transform:translateY(-2px)}
.amt-btn:disabled{opacity:.3}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:9px;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--grow));outline:none;margin:6px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--grow);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.slider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--grow);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.slider-ends{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--tx-3)}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mode-tab{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;color:#fff;font-family:'Sora';font-weight:800;font-size:1.05rem;transition:.12s}
.mode-tab .sub{display:block;font-family:'Inter';font-size:.72rem;color:var(--tx-2);font-weight:700;margin-top:3px}
.mode-tab.sel{border-color:var(--grow);background:rgba(52,211,153,.12);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
.date-chips{display:flex;gap:8px;width:100%}
.date-chip{flex:1;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;color:#fff;font-family:'Sora';font-weight:800;font-size:1.05rem;transition:.12s}
.date-chip:hover{border-color:var(--grow)}
.date-chip.sel{border-color:var(--grow);background:rgba(52,211,153,.16);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.tip-nudge{margin-top:12px;background:linear-gradient(135deg,rgba(245,196,81,.14),rgba(245,196,81,.05));border:1px solid rgba(245,196,81,.4);border-radius:12px;padding:11px 14px;font-size:.86rem;font-weight:600;color:var(--tx);line-height:1.45}
.amt-btn .sub{display:block;font-family:'Inter';font-size:.7rem;color:var(--tx-2);font-weight:700;margin-top:3px}
.custom-row{display:flex;gap:9px;width:100%}
.custom-row input{flex:1;background:#091a2b;border:1.5px solid var(--line);border-radius:14px;color:#fff;
  font-family:'Sora';font-weight:800;font-size:1.1rem;padding:13px 15px;outline:none;text-align:center}
.custom-row input:focus{border-color:var(--accent)}

/* portfolio card */
.pf-card{width:100%;border-radius:20px;padding:20px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(78,168,255,.12),rgba(52,211,153,.06));box-shadow:var(--shadow)}
.pf-val{font-family:'Sora';font-weight:800;font-size:2.6rem;line-height:1;color:#fff}
.pf-val-k{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-2);font-weight:800}
.pf-gain{font-family:'Sora';font-weight:800;font-size:1.05rem;margin-top:6px;display:inline-block;padding:4px 12px;border-radius:20px}
.pf-gain.up{color:var(--grow);background:rgba(52,211,153,.14)}.pf-gain.down{color:var(--crash);background:rgba(239,90,76,.14)}
.pf-gain.flat{color:var(--tx-2);background:var(--panel)}
.pf-rows{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.pf-cell{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.pf-cell .v{font-family:'Sora';font-weight:800;font-size:1.25rem;color:#fff}
.pf-cell .k{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2);font-weight:800;margin-top:3px}
/* unit jar */
.jar{width:100%;height:14px;border-radius:20px;background:rgba(0,0,0,.25);overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.jar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--grow));border-radius:20px;transition:width .7s}
.invest-again{margin-top:14px;width:100%}
.tag-assets{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:4px}
.tag-assets .t{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:.78rem;font-weight:700}

body.host-bg{}
body.player-bg{background:
   radial-gradient(120% 70% at 50% -10%,#163a5e 0%,transparent 60%),
   linear-gradient(180deg,#0a1422 0%,#070f1a 100%)}
.connecting{text-align:center;padding:40px;color:var(--tx-2);font-weight:700}

/* ── Phase 2 ── */
.vote2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.fundcard{border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:center;background:var(--panel)}
.fundcard.A{border-color:rgba(78,168,255,.4)}.fundcard.B{border-color:rgba(245,196,81,.4)}
.fc-tag{font-family:'Sora';font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;color:var(--tx-2)}
.fc-nav{font-family:'Sora';font-weight:800;font-size:2.6rem;color:#fff;line-height:1.15}
.fc-k{font-size:.74rem;color:var(--tx-2);font-weight:700}
.votebar{height:12px;border-radius:20px;background:rgba(0,0,0,.28);overflow:hidden;margin:10px 0 4px;border:1px solid var(--line)}
.votebar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--grow));transition:width .5s}
.fc-res{margin-top:10px;font-size:1rem;color:var(--tx-2)}.fc-res b{font-family:'Sora';font-size:1.35rem;color:#fff}
.fc-gain{display:inline-block;margin-top:8px;color:var(--grow);background:rgba(52,211,153,.14);font-family:'Sora';font-weight:800;padding:4px 14px;border-radius:20px}
.stmt{background:#0c1726;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.stmt-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:9px}
.stmt-title{font-family:'Sora';font-weight:800;font-size:1.05rem;color:#fff}
.stmt-sub{color:var(--tx-2);font-size:.72rem;font-weight:600}
.stmt-amc{font-family:'Sora';font-weight:700;color:var(--accent);font-size:.85rem}
.stmt-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.stmt-meta>div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.stmt-meta span{color:var(--tx-3);font-size:.72rem;font-weight:700}
.stmt-meta b{font-family:'Sora';color:var(--tx);font-size:.82rem}
.stmt-tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.stmt-tbl th{color:var(--tx-3);font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;font-weight:800;padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
.stmt-tbl th:first-child,.stmt-tbl th:nth-child(2){text-align:left}
.stmt-tbl td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05);text-align:right;color:var(--tx)}
.stmt-tbl td:first-child,.stmt-tbl td:nth-child(2){text-align:left;color:var(--tx-2)}
.stmt-tbl .num{font-family:'Sora'}
.stmt-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stmt-summary>div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.stmt-summary span{display:block;color:var(--tx-3);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;font-weight:800}
.stmt-summary b{font-family:'Sora';font-size:1rem;color:#fff}
/* real paper-look mutual fund account statement (white document inside the dark app) */
.mfs{background:#fbfbf6;color:#1c2733;border-radius:6px;border:1px solid #cfd2c8;box-shadow:0 12px 32px rgba(0,0,0,.4);font-family:'Inter',Arial,sans-serif;padding:12px 15px;font-size:.78rem;line-height:1.32}
.mfs-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0e2c52;padding-bottom:8px;gap:12px}
.mfs-amc{font-weight:900;font-size:1.02rem;color:#0e2c52;letter-spacing:-.01em}
.mfs-amc small{display:block;font-weight:600;font-size:.6rem;color:#6a7280;letter-spacing:.03em;text-transform:uppercase;margin-top:1px}
.mfs-ttl{text-align:right}.mfs-ttl b{font-size:.84rem;color:#1c2733}.mfs-ttl span{display:block;font-size:.64rem;color:#6a7280;margin-top:1px}
.mfs-info{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin:9px 0}
.mfs-info div{display:flex;gap:6px;padding:3px 2px;border-bottom:1px dotted #d9d9cd;font-size:.75rem}
.mfs-info .lbl{color:#7a828c;min-width:74px;font-weight:600}
.mfs-info .val{color:#1c2733;font-weight:700}
.mfs-scheme{background:#e9efe6;border:1px solid #cfd7c8;border-radius:4px;padding:7px 10px;margin:7px 0 4px;font-weight:800;color:#0e2c52;font-size:.82rem}
.mfs-scheme small{display:block;font-weight:600;color:#6a7280;font-size:.64rem;margin-top:2px;letter-spacing:.02em}
.mfs-tbl{width:100%;border-collapse:collapse;font-size:.75rem;margin-top:4px}
.mfs-tbl th{background:#0e2c52;color:#fff;font-weight:700;padding:5px 7px;text-align:right;font-size:.64rem;text-transform:uppercase;letter-spacing:.02em}
.mfs-tbl th:first-child,.mfs-tbl th:nth-child(2){text-align:left}
.mfs-tbl td{padding:2.5px 7px;text-align:right;border-bottom:1px solid #e7e7dc;color:#1c2733;font-variant-numeric:tabular-nums}
.mfs-tbl td:first-child,.mfs-tbl td:nth-child(2){text-align:left}
.mfs-tbl tr.open td,.mfs-tbl tr.close td{background:#eef1e6;font-weight:800;color:#0e2c52}
.mfs-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:9px;padding-top:8px;border-top:2px solid #0e2c52;font-weight:800;font-size:.82rem}
.mfs-foot b{color:#0e2c52}.mfs-foot .mv b{color:#0e7a3e}
.mfs-fine{font-size:.58rem;color:#9aa0a8;margin-top:9px;line-height:1.35}
.mfs-hl{outline:2.5px solid #e0a400!important;outline-offset:1px;background:#fff2b8!important;border-radius:3px}
.mfs-col{background:#fff6cf!important}
/* spotlight: during the tour, blur/dim everything except the highlighted field/column so it POPS */
.mfs.spot .mfs-head,.mfs.spot .mfs-info>div:not(.mfs-hl),.mfs.spot .mfs-scheme:not(.mfs-hl),.mfs.spot .mfs-tbl th:not(.mfs-hl),.mfs.spot .mfs-tbl td:not(.mfs-col),.mfs.spot .mfs-foot>span:not(.mfs-hl),.mfs.spot .mfs-fine{opacity:.24;filter:blur(1.4px);transition:opacity .25s,filter .25s}
.mfs.spot .mfs-hl,.mfs.spot .mfs-col{opacity:1;filter:none}
.mfs.spot .mfs-hl{box-shadow:0 0 0 3px rgba(224,164,0,.4),0 8px 22px rgba(0,0,0,.22)}
.tour-hl{outline:2.5px solid var(--gold)!important;outline-offset:1px;background:rgba(245,196,81,.18)!important;border-radius:6px;box-shadow:0 0 0 5px rgba(245,196,81,.1)}
.tour-col{background:rgba(245,196,81,.13)!important}
.tour-step{background:rgba(245,196,81,.08);border:1px solid rgba(245,196,81,.35);border-radius:14px;padding:14px;margin:8px 0}
.tour-t{font-family:'Sora';font-weight:800;font-size:1.2rem;color:var(--gold)}
.tour-d{margin-top:5px;color:var(--tx);font-weight:500;line-height:1.45}
.tour-dots{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.tour-dots span{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.2s}
.tour-dots span.on{background:var(--gold);transform:scale(1.3)}
.tour-dots span.done{background:var(--grow)}
.div-choices{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.div-chip{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700}
.div-chip.fund{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.div-chip b{font-family:'Sora';color:var(--accent);font-size:1.1rem}
.div-shock{text-align:center;background:rgba(239,90,76,.12);border:1px solid rgba(239,90,76,.4);border-radius:14px;padding:12px;font-weight:700;color:var(--tx)}
.comp-bars{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.comp-row{display:flex;align-items:center;gap:12px}
.comp-lbl{width:130px;flex:0 0 auto;font-weight:700;font-size:.92rem;line-height:1.25}
.comp-bar{flex:1;height:26px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.comp-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--grow));border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.comp-val{font-family:'Sora';font-weight:800;color:var(--grow);min-width:96px;text-align:right}
.myth-x{text-align:center;margin:10px 0 2px;padding:9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--tx-2);font-weight:700}
.myth-x b{color:var(--tx)}
.myth-x.right{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.45);color:var(--grow)}
.myth-x.right b{color:var(--grow)}
.fc-steps{text-align:left;margin:10px 0 2px;font-size:.92rem;line-height:1.5;color:var(--tx-2)}
.fc-steps b{color:#fff;font-family:'Sora'}
.fc-steps div{padding:6px 0;border-bottom:1px solid var(--line)}
.fc-steps div:last-child{border-bottom:none}
.er-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}

/* ── formatting (Indian ₹) ──────────────────────────── */

function fmtMoney(n){ const s=n<0?'-':''; n=Math.abs(Math.round(n));

  return s+'₹'+n;
}

const FUND_TYPES={

/* each asset belongs to a sector — this is how events connect to YOUR holdings */
const SECTORS={
  'Reliance':'Energy','HDFC Bank':'Banking','Infosys':'IT','TCS':'IT','ITC':'FMCG','Asian Paints':'Consumer',
  'Government Bonds':'Debt','Corporate Bonds':'Debt','Treasury Bills':'Debt','State Dev Loans':'Debt'
};
function assetSector(a){ return SECTORS[a]||'Equity'; }
/* market events — each moves SECTORS differently. Your NAV change = how YOUR holdings react. */
/* MONTHLY moves — small & realistic so 12 months compound to about +10–14% a year
   (a real equity fund does ~1%/month on average, with the odd down month). */
const EVENTS=[
  {key:'rally', em:'📈', name:'Strong month', art:'ASSET-06', head:'markets broadly rise',
    sect:{IT:2.9,Banking:2.7,Energy:2.4,FMCG:2,Consumer:2.1,Equity:2.5,Debt:0.4}},
  {key:'steady',em:'😌', name:'Quiet month',  art:'ASSET-09', head:'a calm, slightly-up month',
    sect:{IT:0.7,Banking:0.6,Energy:0.5,FMCG:0.5,Consumer:0.5,Equity:0.6,Debt:0.4}},
  {key:'itboom',em:'💻', name:'Tech surge',   art:'ASSET-08', head:'IT stocks lead the way',

/* the heart of it: an event hits each holding by its sector; the fund's NAV moves by the average */
function eventImpact(ev){
  const assets=(state.fund&&state.fund.assets)||[];
  if(!assets.length) return {pct:0, rows:[]};
  const rows=assets.map(a=>{ const s=assetSector(a); const chg=(ev.sect[s]!=null?ev.sect[s]:5); return {asset:a,sector:s,chg}; });
  const pct=rows.reduce((x,r)=>x+r.chg,0)/rows.length;
  return {pct:Math.round(pct*10)/10, rows};
}
/* Random market day is WEIGHTED so the fund trends UP over time (markets reward patience):
   mostly good days with the occasional dip — never a crash on day 1 or two crashes in a row.
   (The teacher can still hand-pick a crash to teach about dips.) */
const EVENT_WEIGHT={rally:26,steady:22,itboom:15,bonds:12,dip:25};
function randomEvent(){
  const lastDip=state.market.lastEvent&&state.market.lastEvent.key==='dip';  // no two dips back-to-back
  const pool=[];
  EVENTS.forEach(e=>{ let w=EVENT_WEIGHT[e.key]||20; if(e.key==='dip'&&lastDip)w=0; for(let i=0;i<w;i++)pool.push(e); });
  return pool[Math.floor(Math.random()*pool.length)];
}

    .on('broadcast',{event:'action'},({payload})=>{ if(isHost) hostHandleAction(payload); })
    .subscribe();

function hostHandleAction(a){
  if(!a||!a.type)return;
  if(a.type==='join'){
    if(!state.investors[a.id]){
      const n=Object.keys(state.investors).length;
      state.investors[a.id]={id:a.id,name:(a.name||'Investor').slice(0,16),
        av:AV_EMOJI[n%AV_EMOJI.length],color:AV_COLOR[n%AV_COLOR.length],
        cash:START_CASH,invested:0,units:0,mode:null};
    }else{ state.investors[a.id].name=(a.name||'').slice(0,16)||state.investors[a.id].name; }
    save(); if(state.phase==='lobby') renderHost();
  }
  else if(a.type==='investmode'){
    const p=state.investors[a.id]; if(!p||state.phase!=='invest'||p.mode)return;
    if(a.mode==='lump'){ let amt=Math.round(+a.amount||0); amt=Math.max(0,Math.min(LUMP_MAX,amt)); if(amt<=0)return;
      p.mode='lump'; p.invested=amt; p.units=amt/state.nav; p.cash=START_CASH-amt; }
    else { let amt=Math.round(+a.amount||0); amt=Math.max(SIP_MIN,Math.min(SIP_MAX,amt));
      p.mode='sip'; p.sipAmt=amt; p.sipDate=[1,5,10,25].includes(+a.sipDate)?+a.sipDate:5; p.sipBought=[];
      const u=amt/state.nav;              // first month goes in NOW, at launch NAV ₹10 — right alongside lumpsum
      p.units=u; p.invested=amt; p.sipBought.push({m:1,nav:state.nav,units:u}); p.sipLeft=SIP_MONTHS-1; }
    save(); renderHostInvestLive();
  }
  else if(a.type==='vote'){ const p=state.investors[a.id]; if(!p||state.phase!=='navmyth'||state.navMyth.run)return;
    p.vote=(a.choice==='B'?'B':a.choice==='X'?'X':'A'); save(); renderHost(); }
  else if(a.type==='sipplan'){ const p=state.investors[a.id]; if(!p||state.phase!=='sip'||state.sim.month>0)return;
    p.sip={amt:Math.max(0,Math.round(+a.amt||0)),bought:[],invested:0,units:0}; save(); renderHost(); }
  else if(a.type==='stpchoice'){ const p=state.investors[a.id]; if(!p||state.phase!=='stp'||state.sim.month>0)return;
    const nav0=state.sim.navPath[0];
    if(a.mode==='lump') p.stp={mode:'lump',liquid:0,equityUnits:100000/nav0,equityInvested:100000,hist:[]};
    else p.stp={mode:'stp',liquid:100000,equityUnits:0,equityInvested:0,hist:[]};
    save(); renderHost(); }
  else if(a.type==='swpplan'){ const p=state.investors[a.id]; if(!p||state.phase!=='swp'||state.sim.month>0)return;
    p.swp={nav:SWP_NAV0,units:SWP_START/SWP_NAV0,withdrawn:0,amt:Math.max(0,Math.round(+a.amt||0)),hist:[]}; save(); renderHost(); }
  else if(a.type==='divchoice'){ const p=state.investors[a.id]; if(!p||state.phase!=='diversify'||(state.diversify&&state.diversify.shocked))return; p.div=a.choice; save(); renderHost(); }
  else if(a.type==='compstart'){ const p=state.investors[a.id]; if(!p||state.phase!=='compound'||(state.compound&&state.compound.run))return; p.comp=a.age; save(); renderHost(); }
  else if(a.type==='fsanswer'){ const p=state.investors[a.id]; if(!p||state.phase!=='factsheet'||state.fsShow)return; p.fs=p.fs||{}; p.fs[a.k]=a.choice; save(); renderHost(); }
  else if(a.type==='reinvest'){ const p=state.investors[a.id]; if(!p||state.phase!=='reinvest'||p.reinvested!=null)return;
    let amt=Math.max(0,Math.min(REINVEST_MAX,Math.round(+a.amount||0)));
    p.reinvested=amt; if(amt>0){ p.units+=amt/state.nav; p.invested+=amt; } save(); renderHost(); }
  else if(a.type==='withdraw'){ const p=state.investors[a.id]; if(!p||state.phase!=='withdraw'||!state.withdraw.ff||p.withdrawn!=null)return;
    let amt=Math.max(0,Math.min(Math.round(investorValue(p)),Math.round(+a.amount||0)));
    p.withdrawn=amt; if(amt>0){ p.units=Math.max(0,p.units-amt/state.nav); } save(); renderHost(); }
}

/* One month: the market moves the holdings → new NAV; SIP investors add ₹10k at that NAV. */
function marketStep(){
  const mk=state.market; if(mk.month>=mk.max)return;
  const ev=randomEvent();
  const imp=eventImpact(ev);
  const before=state.nav;
  state.nav=Math.round(before*(1+imp.pct/100)*100)/100;
  let sipIn=0;  // fresh SIP money that flows into the AUM this month
  for(const id in state.investors){ const p=state.investors[id];
    if(p.mode==='sip'&&p.sipLeft>0){ const amt=p.sipAmt;   // SIP = fresh money from each month's income
      const u=amt/state.nav; p.units+=u; p.invested+=amt; p.sipLeft--; sipIn+=amt;
      p.sipBought=p.sipBought||[]; p.sipBought.push({m:p.sipBought.length+1,nav:state.nav,units:u}); } }
  mk.month++;
  mk.lastEvent={...ev,pct:imp.pct,rows:imp.rows,before,after:state.nav,sipIn};
  state.navHistory.push({label:ev.name,nav:state.nav,aum:AUM(),month:mk.month,sipIn});
  state.reveals.market=false;
}
function hostMonthNext(){ marketStep(); saveNow(); renderHost(); }
function hostMonthAll(){ while(state.market.month<state.market.max)marketStep(); saveNow(); renderHost(); }

    <svg viewBox="0 0 220 130">

      <path class="g-fill"  d="M16,118 A94,94 0 0 1 204,118" pathLength="100" style="stroke-dasharray:${(frac*100).toFixed(2)} 100"/>
    </svg>
    <div class="g-center"><div class="aum-big num">${fmtMoney(aum)}</div><div class="aum-lbl">Assets Under Management</div></div>

function niceMax(v){ if(v<=0)return 500000; const e=Math.pow(10,Math.floor(Math.log10(v))); const m=v/e;
  const step=m<=1?1:m<=2?2:m<=5?5:10; return step*e*1.15>v?step*e:Math.ceil(v/(step*e))* (step*e); }

/* S6 — Market: 4 interactive scenarios teaching what moves the NAV (and what doesn't) */
const MKT_RISE=6, MKT_FALL=5, FLOW_AMT=50000;
function dispUnits(){ return totalUnits()+(state.market.flowUnits||0); }   // includes demo money-in/out units
function dispAUM(){ return dispUnits()*state.nav; }
function sipBuyRound(){ for(const id in state.investors){ const p=state.investors[id];
  if(p.mode==='sip'&&p.sipLeft>0){ const un=p.sipAmt/state.nav; p.units+=un; p.invested+=p.sipAmt; p.sipLeft--;
    p.sipBought=p.sipBought||[]; p.sipBought.push({m:p.sipBought.length+1,nav:state.nav,units:un}); } } }
function mktScenario(type){
  // Pure teaching demo — each scenario moves exactly ONE driver so the 3 cards read cleanly.
  // Market up/down = NAV only (units never change). Money in/out = units only (NAV never changes).
  const before={aum:dispAUM(),nav:state.nav,units:dispUnits()};
  if(type==='up') state.nav=Math.round(state.nav*(1+MKT_RISE/100)*100)/100;
  else if(type==='down') state.nav=Math.round(state.nav*(1-MKT_FALL/100)*100)/100;
  else if(type==='in') state.market.flowUnits=(state.market.flowUnits||0)+FLOW_AMT/state.nav;
  else if(type==='out') state.market.flowUnits=Math.max(0,(state.market.flowUnits||0)-FLOW_AMT/state.nav);
  state.market.lastScenario={type,before,after:{aum:dispAUM(),nav:state.nav,units:dispUnits()}};
  saveNow(); renderHost();
}
function mktReset(){
  state.nav=NAV0; state.market.flowUnits=0; state.market.lastScenario=null;
  state.navHistory=[{label:'Launch',nav:NAV0,aum:0}];
  for(const id in state.investors){ const p=state.investors[id]; if(p.mode==='sip'){ const f=p.sipBought&&p.sipBought[0];
    p.units=f?f.units:p.sipAmt/NAV0; p.invested=p.sipAmt; p.sipBought=f?[f]:[{m:1,nav:NAV0,units:p.sipAmt/NAV0}]; p.sipLeft=SIP_MONTHS-1; } }
  saveNow(); renderHost();
}
function mktFinishAndGo(){   // the market screen was a sandbox — reset the fund to a clean state, complete SIPs at ₹10, then Reinvest
  state.nav=NAV0; state.market.flowUnits=0; state.market.lastScenario=null;  // clear the teaching demo
  state.navHistory=[{label:'Launch',nav:NAV0,aum:0}];
  for(const id in state.investors){ const p=state.investors[id]; let g=0;
    while(p.mode==='sip'&&p.sipLeft>0&&g++<50){ const un=p.sipAmt/NAV0; p.units+=un; p.invested+=p.sipAmt; p.sipLeft--; p.sipBought=p.sipBought||[]; p.sipBought.push({m:p.sipBought.length+1,nav:NAV0,units:un}); } }
  goPhase('reinvest');
}
function scenarioResult(sc){

/* AUM · NAV · UNITS — the three things every screen comes back to.
   opts.sc = a scenario {before,after} → each card lights up ▲/▼/= vs its before value.
   opts.badges = static {aum,nav,units:{cls,txt}} indicators. */
function metrics3(opts){
  opts=opts||{};

  const b=opts.sc?opts.sc.before:null, sb=opts.badges||{};
  function card(key,cls,label,cur,curStr,sub){
    let foot=`<div class="m3-k">${sub}</div>`, badge='';
    if(b){ const prev=b[key], eps=(key==='nav'?0.005:1);
      const same=Math.abs(cur-prev)<eps, up=cur>prev, dc=same?'same':up?'up':'down';
      const prevStr=key==='aum'?fmtMoney(prev):key==='nav'?'₹'+prev.toFixed(2):fmtUnits(prev);
      badge=`<div class="m3-badge ${dc}">${same?'= NO CHANGE':up?'▲ UP':'▼ DOWN'}</div>`;
      foot=`<div class="m3-was">was ${prevStr}</div>`;
      cls+=' ch-'+dc;
    } else if(sb[key]){ badge=`<div class="m3-badge ${sb[key].cls}">${sb[key].txt}</div>`; cls+=' ch-'+sb[key].cls; }
    return `<div class="m3 ${cls}"><div class="m3-t">${label}</div><div class="m3-v">${curStr}</div>${foot}${badge}</div>`;
  }
  return `<div class="metrics3">
    ${card('aum','aum','AUM',aum,fmtMoney(aum),'money in the fund')}
    ${card('nav','nav','NAV',nav,'₹'+nav.toFixed(2),'price of one unit')}
    ${card('units','units','UNITS',u,fmtUnits(u),'shares held')}

}

function navChart(){
  const h=state.navHistory, vals=h.map(x=>x.nav), n=vals.length;
  const w=460,H=200,padL=44,padR=18,padT=16,padB=26;
  const lo=Math.min(NAV0,...vals)-0.3, hi=Math.max(NAV0,...vals)+0.3, rng=(hi-lo)||1;
  const iw=w-padL-padR, ih=H-padT-padB, baseY=padT+ih;
  const X=i=>padL+(n>1?i*(iw/(n-1)):iw/2), Y=v=>padT+ih*(1-(v-lo)/rng);
  const up=vals[n-1]>=NAV0, col=up?'#34d399':'#ef5a4c';
  const line=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const area=`${X(0).toFixed(1)},${baseY.toFixed(1)} ${line} ${X(n-1).toFixed(1)},${baseY.toFixed(1)}`;
  const grid=[lo,(lo+hi)/2,hi].map(v=>{const y=Y(Math.round(v*10)/10);return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${(w-padR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.06)"/><text x="${(padL-8).toFixed(1)}" y="${(y+4).toFixed(1)}" fill="#6d829c" font-size="11" text-anchor="end" font-family="Sora">₹${(Math.round(v*10)/10).toFixed(1)}</text>`;}).join('');
  const launch=`<line x1="${padL}" y1="${Y(NAV0).toFixed(1)}" x2="${(w-padR).toFixed(1)}" y2="${Y(NAV0).toFixed(1)}" stroke="rgba(245,196,81,.55)" stroke-dasharray="5 4"/>`;
  const every=n>9?2:1;
  const xl=h.map((e,i)=>(i===0||(i%every!==0&&i!==n-1))?'':`<text x="${X(i).toFixed(1)}" y="${(H-7).toFixed(1)}" fill="#6d829c" font-size="10" text-anchor="middle">M${e.month||i}</text>`).join('');
  const lx=X(n-1), ly=Y(vals[n-1]);
  return `<svg viewBox="0 0 ${w} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="navfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${launch}
    ${n>1?`<polygon points="${area}" fill="url(#navfill)"/>
    <polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${line}" style="filter:drop-shadow(0 0 5px ${col}66)"/>`:''}
    ${vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4.6:2.4}" fill="${col}"/>`).join('')}
    ${n>1?`<text x="${(lx-6).toFixed(1)}" y="${(ly<padT+16?ly+16:ly-9).toFixed(1)}" fill="#fff" font-size="13" font-weight="800" text-anchor="end" font-family="Sora">₹${vals[n-1].toFixed(2)}</text>`:''}
    ${xl}
  </svg>`;
}
function navPanel(){

function sparkline(vals){
  if(vals.length<2)vals=[vals[0]||10,vals[0]||10];
  const w=300,h=64,pad=6;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{const x=pad+i*((w-2*pad)/(vals.length-1));const y=h-pad-((v-mn)/rng)*(h-2*pad);return `${x.toFixed(1)},${y.toFixed(1)}`;});
  const up=vals[vals.length-1]>=vals[0];
  const col=up?'#34d399':'#ef5a4c';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"

}

  if(!ROOM){document.getElementById('player').innerHTML='<div class="player-scr"><div class="p-center"><h2>Scan the QR on the screen</h2><p class="p-sub">or open the link with a game PIN.</p></div></div>';return;}
  joinChannel();
  try{const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle(); if(data&&data.state)state=data.state;}catch(e){}
  renderPlayer();
  // self-heal poll — recover any dropped realtime event within ~2.5s
  setInterval(async()=>{ if(!me())return;
    try{const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle();
      if(data&&data.state&&data.state.updatedAt!==state.updatedAt){state=data.state;renderPlayer();}}catch(e){}
  },2500);
}

/* fee chart with real ₹ axis + year axis + shaded "eaten" gap + end values */
function feeChart(Lo,Hi){

/* ── S10 · SWP (retirement) ── */
function swpStep(){ const s=state.sim; s.started=true;
  for(const id in state.investors){ const w=state.investors[id].swp; if(!w)continue;
    const before=w.units*w.nav; w.nav*=SWP_GROW; const grew=w.units*w.nav-before;
    const red=Math.min(w.amt, w.units*w.nav); w.units-=red/w.nav; w.withdrawn+=red;
    (w.hist=w.hist||[]).push({mo:s.month+1,grew,paid:red,corpus:w.units*w.nav}); }
  s.month++; }
function hostSwpNext(){ const s=state.sim; if(s.kind!=='swp'||s.month>=s.max)return; swpStep(); saveNow(); renderHost(); }
function hostSwpAll(){ const s=state.sim; while(s.kind==='swp'&&s.month<s.max)swpStep(); saveNow(); renderHost(); }
function hostRevealSwp(){ state.reveals.swp=true; saveNow(); renderHost(); }
function hostSwp(){
  const s=state.sim, m=s.month, draw=25000;
  let nav=SWP_NAV0, units=SWP_START/SWP_NAV0, withdrawn=0, rows=[];
  for(let i=0;i<s.max;i++){ const done=i<m; let grew=0,paid=0;
    if(done){ const before=units*nav; nav*=SWP_GROW; grew=units*nav-before; paid=Math.min(draw,units*nav); units-=paid/nav; withdrawn+=paid; }
    rows.push({mo:i+1,done,grew,paid,corpus:units*nav}); }
  const value=units*nav, fillPct=Math.min(100,value/SWP_START*100), setCount=invList().filter(p=>p.swp).length;
  const monthlyGrow=SWP_START*(SWP_GROW-1);
  return `<div class="host-grid">
   <div class="glass pad">
    <div class="eyebrow">Screen 10 · Retirement — SWP</div>
    <h2 style="margin:6px 0">You're 60 · ₹50,00,000 saved · Month ${Math.min(m,s.max)} of ${s.max}</h2>
    <p class="muted tiny">Your money stays invested and grows about <b>0.8% a month (≈₹${Math.round(monthlyGrow/1000)}k)</b>. Each month you sell <b>just enough units</b> to draw a ₹25,000 income — the rest keeps compounding.</p>
    <div class="tanks" style="grid-template-columns:1fr;margin-top:8px">
      <div><div class="tank eq" style="height:120px"><div class="liq" style="height:${fillPct.toFixed(0)}%"></div></div>
        <div class="tank-lbl">Corpus still invested</div><div class="tank-v num" style="font-size:1.5rem">${fmtMoney(value)}</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="v gold num">${fmtMoney(withdrawn)}</div><div class="k">Income drawn (${m} mo)</div></div>
      <div class="stat"><div class="v ${value>=SWP_START?'grow':''} num">${fmtMoney(value)}</div><div class="k">Corpus now</div></div>
      <div class="stat"><div class="v blue num">${fmtUnits(units)}</div><div class="k">Units left</div></div>
    </div>
    ${state.reveals.swp?`<div class="reveal"><div class="acr" style="font-size:1.35rem">SWP = Systematic Withdrawal Plan</div>
       <p style="margin-top:4px">Growth on ₹50L is about <b style="color:var(--grow)">₹${Math.round(monthlyGrow/1000)}k a month</b> — more than the <b>₹25k</b> you draw. So even while paying you an income, the corpus ${value>=SWP_START?`<b>grew</b> to ${fmtMoney(value)}`:'barely shrank'}. You sell a few units; the rest keeps compounding — that's how a SWP can pay you for decades.</p></div>`:''}
    <div class="controls"><span class="phase-tag">${setCount} set an income · demo ₹25k/mo</span><div class="spacer"></div>
      ${m<s.max?`<button class="btn blue" onclick="hostSwpNext()">Next month →</button> <button class="btn dark" onclick="hostSwpAll()">Run the year ⏩</button>`
        :`${revealBtn('swp','Reveal: why it lasts')} <button class="btn lg" onclick="hostGo('diversify')">Next: Spread the risk →</button>`}
    </div>
   </div>
   <div class="glass pad"><div class="eyebrow">Monthly breakdown</div>
     <table class="siptbl"><thead><tr><th>Mo</th><th>Grew</th><th>Income</th><th>Corpus</th></tr></thead><tbody>
       ${rows.map(r=>`<tr style="${r.done?'':'opacity:.35'}"><td>${r.mo}</td><td class="num" style="color:var(--grow)">${r.done?'+'+fmtMoney(r.grew):'—'}</td><td class="num" style="color:var(--gold)">${r.done?'−₹25k':'—'}</td><td class="num">${r.done?fmtMoney(r.corpus):'—'}</td></tr>`).join('')}
     </tbody></table>
     <div class="tiny muted" style="margin:8px 0 6px;text-align:center">Grew more than you drew → corpus holds 💪</div>
     ${slot('ASSET-13','16:9')}
   </div>
  </div>`;
}
function pSwp(p){
  const s=state.sim, started=s.month>0;
  if(!p.swp){
    if(started) return `<div class="p-center"><div class="p-status">SWP running</div><p class="p-sub">Watch the screen.</p></div>`;
    return `<div class="p-center"><div class="p-status">You're retired 🌴</div><p class="p-sub">₹50,00,000 saved. How much monthly income do you want?</p>

      <div class="tiny muted" style="margin-top:10px;text-align:center">${val>=SWP_START?'📈 Still bigger than you started with!':'Drawing down gently'}</div></div>
    ${hist.length?`<table class="siptbl" style="width:100%"><thead><tr><th>Mo</th><th>Grew</th><th>You drew</th><th>Left</th></tr></thead><tbody>
      ${hist.map(h=>`<tr><td>${h.mo}</td><td class="num" style="color:var(--grow)">+${fmtMoney(h.grew)}</td><td class="num" style="color:var(--gold)">−${fmtMoney(h.paid)}</td><td class="num">${fmtMoney(h.corpus)}</td></tr>`).join('')}
    </tbody></table><p class="p-sub" style="font-size:.84rem">Each month it grew more than you drew — so it kept paying you.</p>`
    :`<p class="p-sub">Each month your money grows, then you sell just enough units to take ${fmtMoney(p.swp.amt)}. Watch the corpus hold.</p>`}</div>`;
}
function pSwpSet(a){ const m=me(); if(!m)return; sendAction({type:'swpplan',id:MY_ID,amt:a}); customOpen=false; }

/* ── Diversification · one stock vs the whole basket ── */
function hostDivShock(){
  const assets=state.fund.assets||[]; if(!assets.length)return;
  const shocked=assets[Math.floor(Math.random()*assets.length)];
  const moves={}; assets.forEach(a=>moves[a]=a===shocked?-40:2);
  state.diversify={shocked,moves}; state.reveals.diversify=false; saveNow(); renderHost();
}
function hostDiversify(){
  const invs=invList(), assets=(state.fund.assets||[]), base=50000;
  const d=state.diversify||{}, shocked=d.shocked, moves=d.moves;
  const fundMove=moves?assets.reduce((s,a)=>s+moves[a],0)/assets.length:0;
  const cnt=a=>invs.filter(p=>p.div===a).length, fundCnt=invs.filter(p=>p.div==='fund').length, chosen=invs.filter(p=>p.div).length;
  return `<div class="glass pad">
    <div class="eyebrow">Diversification · one stock, or the whole basket?</div>
    <h2 style="margin:4px 0 2px">Put ₹50,000 in <span style="color:var(--accent)">ONE stock</span> — or spread it across the fund?</h2>
    <p class="muted tiny" style="margin:2px 0">A mutual fund holds many stocks at once. Does that actually protect you? Let's see what happens when bad news hits one company.</p>
    ${!shocked?`
      <div class="div-choices">
        ${assets.map(a=>`<div class="div-chip"><span class="hi-nm">${a} <span class="hi-sec">${assetSector(a)}</span></span><b>${cnt(a)}</b></div>`).join('')}
        <div class="div-chip fund"><span class="hi-nm">🧺 The whole fund — all ${assets.length} stocks</span><b>${fundCnt}</b></div>
      </div>
      <div class="controls"><span class="phase-tag">${chosen}/${invs.length} chose</span>
        <button class="btn lg" onclick="hostDivShock()">💥 Bad news strikes →</button></div>
    `:`
      <div class="div-shock">📉 <b>${shocked}</b> just crashed <b style="color:var(--crash)">−40%</b> — a scandal! The other stocks barely moved.</div>
      <div class="vote2" style="margin-top:10px">
        <div class="fundcard" style="border-color:rgba(239,90,76,.45)"><div class="fc-tag" style="color:#ff8e82">😱 All-in on ${shocked}</div><div class="fc-nav num" style="color:var(--crash);font-size:1.9rem">${fmt(base*0.6)}</div><div class="fc-k">−40% · lost ${fmtMoney(base*0.4)}</div></div>
        <div class="fundcard" style="border-color:rgba(52,211,153,.45)"><div class="fc-tag" style="color:#86f0c4">🧺 Spread across the fund</div><div class="fc-nav num" style="color:var(--grow);font-size:1.9rem">${fmt(Math.round(base*(1+fundMove/100)))}</div><div class="fc-k">${fundMove>=0?'+':''}${fundMove.toFixed(1)}% · only ${fmtMoney(base-base*(1+fundMove/100))} dip</div></div>
      </div>
      ${state.reveals.diversify?`<div class="reveal"><div class="acr" style="font-size:1.3rem">Don't put all your eggs in one basket</div><p>The all-in investor lost <b>${fmtMoney(base*0.4)}</b>. The fund investor barely felt it — ${shocked} is just 1 of ${assets.length} holdings, so one crash gets averaged away. You can't know <i>which</i> stock will tank; a fund means you're never all-in on the loser. <b>That's the whole point of a mutual fund.</b></p></div>`:''}
      <div class="controls">${revealBtn('diversify','Reveal: why the fund held up')}<button class="btn lg" onclick="hostGo('compound')">Next: Compounding →</button></div>
    `}
  </div>`;
}
function pDiv(c){ const m=me(); if(!m||m.div)return; sendAction({type:'divchoice',choice:c,id:MY_ID}); }
function pDiversify(p){
  const d=state.diversify||{}, assets=(state.fund.assets||[]), base=50000;
  if(d.shocked){
    const myMove=p.div==='fund'?(assets.reduce((s,a)=>s+d.moves[a],0)/assets.length):(p.div&&d.moves[p.div]!=null?d.moves[p.div]:0);
    const val=base*(1+myMove/100), ok=p.div==='fund';
    return `<div class="p-center"><div class="p-status">${ok?'🧺 You spread it out':p.div?('😬 All-in on '+p.div):'You sat this one out'}</div>
      <div class="pf-card"><div class="pf-val-k">Your ₹50,000 is now</div><div class="pf-val num" style="color:${myMove<0?'var(--crash)':'var(--grow)'}">${fmt(Math.round(val))}</div>
        <div class="pf-gain ${myMove<0?'down':'up'} num">${myMove>=0?'▲ +':'▼ '}${fmtMoney(Math.abs(base-val))} (${myMove>=0?'+':''}${myMove.toFixed(1)}%)</div></div>
      <p class="p-sub">${ok?'The fund spread your risk — one crash barely dented you.':p.div?'All your eggs were in one basket. A fund would have softened the blow.':'Watch the big screen.'}</p></div>`;
  }
  if(p.div) return `<div class="p-center"><div class="p-status">Locked in: ${p.div==='fund'?'the whole fund 🧺':p.div}</div><p class="p-sub">Watch the big screen…</p></div>`;
  return `<div class="p-center"><div class="p-status">Where will your ₹50,000 go?</div>

}
