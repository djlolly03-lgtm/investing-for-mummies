<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Wealth Hack — Investing for Mummies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ── IFM palette (Brand Guidelines §3) ─────────────────────────── */
:root{
  --navy:#1a3a5c;--ink:#1a3a5c;--navy-lt:#264d78;--teal:#2a9d8f;--teal-d:#1f7d72;--muted:#5a7d8a;
  --cream:#f7faf9;--white:#fff;--mint:#bde9e4;--mint-lt:#e0f3f0;--gold:#c9a84c;--gold-lt:#f5f0e0;
  --success:#27AE60;--danger:#c0392b;--wa:#25D366;
  --ink-night:#050c15;--gold-hi:#f7dea0;--ivory:#f6f1e7;--mist:#9bb0ae;
  /* projector-only tones: the studio is dark, so text and accents lift to these */
  --stage-ink:#eaf6f3;--stage-sub:#9fc2bb;--teal-bright:#2dd4bf;--gold-bright:#f5c451;--coral:#ff8a76;
  --glass:rgba(10,26,34,.72);--glass-edge:rgba(255,255,255,.12);
  --shadow:0 2px 12px rgba(26,58,92,.06);--shadow-lg:0 16px 48px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Manrope',sans-serif;color:var(--navy);background:var(--cream)}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0}
button,input{font-family:'Manrope',sans-serif}
button{cursor:pointer}
.hide{display:none!important}

/* ════════ HOST · projector ════════ */
body.host-bg{background:linear-gradient(180deg,rgba(6,16,28,.30) 0%,rgba(6,16,28,.55) 55%,rgba(6,16,28,.82) 100%),url('wealth-hack-stage.jpg') center/cover fixed no-repeat;color:var(--stage-ink);min-height:100vh}
#host{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 32px 70px}
.stage{width:100%;max-width:1240px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.presents{font-size:.72rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--stage-ink);text-align:center;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.title{font-size:clamp(1.9rem,3.6vw,2.9rem);line-height:1.1;text-align:center;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.title em{font-style:italic;color:var(--gold-bright)}
.tag{font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:700;color:var(--stage-ink);text-align:center;margin:0;max-width:820px;line-height:1.45;text-shadow:0 1px 14px rgba(0,0,0,.75)}
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-lg)}
.panel{background:#fff;color:var(--navy);border-radius:16px;box-shadow:var(--shadow-lg)}
.kicker{font-size:.66rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.glass .kicker{color:var(--stage-sub)}
.btn{font:800 .95rem 'Manrope',sans-serif;color:#1a1203;border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,var(--gold-hi),#d79f34);box-shadow:0 12px 32px rgba(233,191,98,.3),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(233,191,98,.42),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:disabled{background:rgba(255,255,255,.07);color:rgba(246,241,231,.42);box-shadow:none;border:1px solid rgba(255,255,255,.14);cursor:not-allowed;transform:none}
.btn.big{font-size:1.1rem;padding:17px 34px}
.btn.gold{background:linear-gradient(135deg,var(--gold-hi),#d79f34)}

body.host-bg.end-bg{background:linear-gradient(180deg,rgba(6,16,28,.15) 0%,rgba(6,16,28,.35) 100%),url('wealth-hack-hero.jpg') center/cover fixed no-repeat}
/* live backdrop: the looping rooftop video sits behind everything on the projector; the closing screen swaps to the still jars */
.bgv,.bgshade{display:none;position:fixed;inset:0;width:100%;height:100%}
.bgv{object-fit:cover;z-index:-2}
.bgshade{z-index:-1;background:linear-gradient(180deg,rgba(6,16,28,.30) 0%,rgba(6,16,28,.55) 55%,rgba(6,16,28,.82) 100%)}
body.host-bg .bgv,body.host-bg .bgshade{display:block}
body.host-bg.end-bg .bgv,body.host-bg.end-bg .bgshade{display:none}
/* closing screen: content lives in the dark gap between the two jars */
.end-stage{max-width:520px;gap:12px}
.end-stage .title{font-size:clamp(1.7rem,2.9vw,2.4rem)}
.end-stage .end-grid{grid-template-columns:1fr;gap:10px;max-width:none}
.end-stage .end-grid .stat{padding:12px 16px}
.end-stage .tag{font-size:.95rem}
/* lobby */
.lobby-stage{gap:16px}
.hero-mark{display:block;width:64px;height:64px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 1px rgba(233,191,98,.5),0 0 56px rgba(233,191,98,.4),0 18px 44px rgba(0,0,0,.5)}
.hero-title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(3rem,6.2vw,5.2rem);line-height:1;letter-spacing:-.02em;color:#fff;text-align:center;font-variation-settings:'opsz' 144;text-shadow:0 6px 44px rgba(0,0,0,.6)}
.hero-title .the{display:block;font-style:italic;font-weight:500;font-size:.36em;color:var(--gold-hi);letter-spacing:.01em;margin-bottom:-.12em}
.hero-tag{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(1.05rem,1.7vw,1.4rem);color:#d6e2df;text-align:center;margin:0;text-shadow:0 2px 20px rgba(0,0,0,.85)}
.hero-tag b{font-weight:600;color:var(--gold-hi)}
.lobby-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;width:100%;max-width:1040px;align-items:stretch}
.lcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 26px 24px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03)),rgba(6,14,22,.58);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.lcard::before{content:"";position:absolute;left:36px;right:36px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9}
.lk{display:flex;align-items:center;gap:10px;font-size:.68rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--stage-sub)}
.lk i{display:block;width:22px;height:1px;background:var(--gold)}
.qr-tile{margin:18px 0 12px;padding:14px;border-radius:22px;background:#fff;line-height:0;cursor:zoom-in;box-shadow:0 0 0 1px rgba(233,191,98,.6),0 0 74px rgba(233,191,98,.3),0 26px 60px rgba(0,0,0,.55)}
.scan-how{font-size:.86rem;font-weight:600;color:var(--stage-sub);margin:6px 0 0;max-width:290px;line-height:1.45}
.pin-row{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pin-label{font-size:.62rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--stage-sub)}
.pin{font-family:'Fraunces',serif;font-weight:600;font-size:3.1rem;letter-spacing:.2em;padding-left:.2em;line-height:1;color:var(--gold-hi);text-shadow:0 0 40px rgba(233,191,98,.35)}
.joinurl{font-size:.7rem;word-break:break-all;font-weight:600;margin-top:10px;color:var(--stage-sub);opacity:.75}
.room-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.room-head h2{font-family:'Fraunces',serif;font-size:1.55rem;font-weight:600;color:var(--ivory)}
.count{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;background:rgba(233,191,98,.14);border:1px solid rgba(233,191,98,.4);color:var(--gold-hi);font:800 .95rem 'Manrope',sans-serif}
.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-start;align-content:flex-start;width:100%;min-height:92px;max-height:30vh;overflow:auto;padding:2px}
.pl{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700;font-size:.92rem;color:var(--ivory);animation:pop .3s ease-out}
.pl .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;color:#fff;flex:none}
.pl .age{color:var(--gold-hi);font-size:.8rem;font-weight:800}
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 8px}
.slots span{width:34px;height:34px;border-radius:50%;border:1px dashed rgba(255,255,255,.28)}
.waiting{color:var(--stage-sub);font-family:'Fraunces',serif;font-style:italic;font-size:1rem;margin:0}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.plan{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 16px;text-align:left}
.plan>div{position:relative;padding:12px 14px 12px 14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:3px}
.plan i{position:absolute;top:10px;right:13px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:1.5rem;line-height:1;color:rgba(233,191,98,.55)}
.plan b{font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;color:var(--ivory);padding-right:26px;line-height:1.2}
.plan span{font-size:.78rem;font-weight:500;color:var(--stage-sub);line-height:1.4}
/* names are the hero of the room: big in small rooms, smaller as it fills */
.sz-xl .pl,.sz-lg .pl{font-weight:700}
.sz-xl .pl{gap:12px;padding:7px 22px 7px 7px;font-size:1.4rem}
.sz-xl .pl .av{width:48px;height:48px;font-size:1.5rem}
.sz-xl .pl .age{font-size:1.05rem}
.sz-lg .pl{gap:10px;padding:6px 18px 6px 6px;font-size:1.12rem}
.sz-lg .pl .av{width:38px;height:38px;font-size:1.2rem}
.sz-lg .pl .age{font-size:.9rem}
.players.sz-xl,.players.sz-lg{gap:10px}
.slots span{width:48px;height:48px}
.lcard .btn{width:100%;margin-top:auto}
.whatif{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:center;padding:9px 18px;border-radius:999px}
.whatif .wk{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--gold-bright);font-size:1rem}
.whatif .wl{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-sub);margin-right:3px}
.whatif .grp{display:flex;align-items:center;gap:5px}
.whatif .chip{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);border-radius:10px;padding:4px 10px;font:800 .76rem 'Manrope',sans-serif;transition:background .2s}
.whatif .chip:hover{background:rgba(255,255,255,.16)}
.whatif .chip.on{background:linear-gradient(135deg,var(--gold-hi),#d79f34);border-color:transparent;color:#1a1203}
.whatif .rate{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);outline:none;margin:0 6px;cursor:pointer}
.whatif .rate::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold-hi);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
.whatif .rate::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold-hi);border:2px solid #fff;cursor:grab}
.whatif .rate-v{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--gold-bright);min-width:44px;display:inline-block}

/* ask */
.q-panel{width:100%;max-width:1000px;padding:28px 36px;text-align:center;border-color:rgba(233,191,98,.5);animation:qpulse 2.6s ease-in-out infinite}
@keyframes qpulse{0%,100%{box-shadow:0 0 0 1px rgba(233,191,98,.22),0 0 40px rgba(233,191,98,.12),var(--shadow-lg)}50%{box-shadow:0 0 0 1px rgba(233,191,98,.45),0 0 70px rgba(233,191,98,.26),var(--shadow-lg)}}
.q-panel .q{font-family:'Fraunces',serif;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.22;font-weight:700;color:#fff;margin:0}
.q-panel .q em{font-style:italic;color:var(--gold-bright)}
.q-panel .why{margin:12px auto 0;font-size:1rem;color:var(--stage-sub);font-weight:700;max-width:820px;line-height:1.45}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-bright)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--teal-bright);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.prog{font-size:1.25rem;font-weight:800;color:var(--stage-ink)}
.prog b{color:var(--gold-bright);font-size:1.7rem;font-family:'Fraunces',serif}
.pl-wall{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1100px}
.pl-wall .pl{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);transition:opacity .3s}
.pl-wall .pl .age{color:var(--stage-sub)}
.pl-wall .pl.dim{opacity:.38}
.pl-wall .pl.lit{opacity:1;border-color:rgba(233,191,98,.7)}

/* reveal */
.rv{display:grid;grid-template-columns:1fr 440px;gap:16px;width:100%;align-items:start}
.rv-table{padding:8px 16px 6px}
.rv-head,.rv-row{display:grid;grid-template-columns:1.6fr .7fr 1fr 1.25fr 1.05fr;align-items:center;gap:10px;padding:7px 6px}
.rv-head{font-size:.62rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--stage-sub);border-bottom:1px solid var(--glass-edge)}
.rv-row{border-bottom:1px solid rgba(255,255,255,.07);font-weight:700;color:var(--stage-ink);opacity:0;animation:rise .4s ease-out forwards}
.rv-row:last-child{border-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv-row .nm{display:flex;align-items:center;gap:9px;font-weight:800}
.rv-row .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;color:#fff;flex:none}
.rv-row small{color:var(--stage-sub);font-weight:800}
.rv-row .guess{color:var(--stage-sub)}
.rv-row .real{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700;color:var(--teal-bright)}
.rv-row .real.hot{color:var(--gold-bright)}
.rv-row .off{font-size:.78rem;font-weight:800;text-transform:none;letter-spacing:.02em;border-radius:10px;padding:4px 9px;margin-top:0;text-align:center;background:rgba(45,212,191,.15);color:var(--teal-bright);white-space:nowrap}
.rv-row .off.low{background:rgba(255,138,118,.16);color:var(--coral)}
.rv-row .off.high{background:rgba(245,196,81,.16);color:var(--gold-bright)}
.rv-row .off.up{background:rgba(45,212,191,.18);color:var(--teal-bright)}
.rv-row .extra{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700;color:var(--coral)}
.side{display:flex;flex-direction:column;gap:12px}
.stat{padding:12px 16px}
.stat .big{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;color:#fff;line-height:1.1;margin-top:4px}
.stat .big.gold{color:var(--gold-bright)}
.stat .big.coral{color:var(--coral)}
.stat .big.teal{color:var(--teal-bright)}
.stat .sm{color:var(--stage-sub);font-weight:700;margin-top:4px;font-size:.88rem;line-height:1.45}
.stat .sm b{color:var(--stage-ink)}
.chart{width:100%;height:auto;display:block}
.punch{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(1.15rem,2vw,1.6rem);color:var(--gold-bright);text-align:center;max-width:1000px;line-height:1.35;opacity:0;animation:rise .6s ease-out forwards}

/* poll / end */
.bars{width:100%;max-width:760px;display:grid;gap:10px}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-radius:14px;background:rgba(10,26,34,.72);border:1px solid var(--glass-edge);overflow:hidden;font-weight:700;font-size:1.05rem;color:var(--stage-ink)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(42,157,143,.5),rgba(45,212,191,.25));transition:width .5s ease}
.bar.lead .bar-fill{background:linear-gradient(90deg,rgba(201,168,76,.65),rgba(245,196,81,.3))}
.bar.lead{border-color:rgba(245,196,81,.5)}
.bar .bt,.bar .bn{position:relative;z-index:1}
.bar .bn{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--gold-bright);min-width:24px;text-align:right}
.opts{display:grid;gap:8px}
.optb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--mint);background:#fff;border-radius:12px;padding:13px 14px;font:700 .92rem 'Manrope',sans-serif;color:var(--navy);transition:border-color .2s,background .2s}
.optb .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--mint);flex:none;transition:.2s}
.optb.on{border-color:var(--teal);background:var(--mint-lt)}
.optb.on .dot{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 45%,transparent 50%)}
.wall{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:1000px}
.end-grid .stat{text-align:center;padding:20px}

/* chrome — same placement as the KBC quiz so the room sees one family of games */
.host-reset{position:fixed;top:6px;left:10px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Manrope',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-reset:hover{background:rgba(10,26,34,.95)}
.join-corner{position:fixed;top:6px;right:10px;z-index:95;display:flex;align-items:center;gap:9px;padding:3px 12px 3px 6px;border-radius:14px;cursor:zoom-in;background:linear-gradient(165deg,rgba(26,56,70,.9),rgba(10,26,34,.94));border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 26px rgba(0,0,0,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s}
.join-corner:hover{transform:scale(1.04)}
.join-corner .jc-qr{width:48px;height:48px;background:#fff;border-radius:7px;padding:2px;display:grid;place-items:center;flex:0 0 auto}
.join-corner .jc-txt{text-align:left;line-height:1.2}
.join-corner .jc-lbl{color:var(--stage-sub);font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.join-corner .jc-pin{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;letter-spacing:.16rem;color:var(--gold-hi)}
.join-corner .jc-tap{color:var(--gold);font-size:.62rem;font-weight:800}
.key-hint{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);z-index:95;color:var(--stage-sub);font-size:.72rem;font-weight:800;background:rgba(10,26,34,.72);border:1px solid var(--glass-edge);padding:5px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.key-hint b{color:var(--stage-ink)}
.host-back{position:fixed;bottom:7px;left:14px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Manrope',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 15px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-next{position:fixed;bottom:7px;right:14px;z-index:95;font:800 .8rem 'Manrope',sans-serif;color:#1a1203;background:linear-gradient(135deg,var(--gold-hi),#d79f34);border:0;padding:8px 18px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
/* the fixed corner pills reserve their own band — nothing centred ever runs underneath them */
#host.has-corner{padding-top:62px}
#qrFull{position:fixed;inset:0;z-index:100;background:rgba(5,15,20,.92);display:grid;place-items:center;cursor:pointer}
#qrFull .lcard{padding:30px 34px}
#qrFull .pin{font-size:3.6rem}

<script>
/* ═══════════════════════════════════════════════════════════════
   THE WEALTH HACK — IFM young-adults opener
   "By 40, ₹10 Cr. How much a month?" Everyone in the room is a different age,
   so everyone has a different number. Guess → reveal → shock → what's stopped you.
   Reuses the Stock Rush / KBC Supabase project (games table) — no setup.
   Host = projector (?role=host, default). Players = phones (?role=player&room=PIN).
   ═══════════════════════════════════════════════════════════════ */
const GAME_NAME='The Wealth Hack';
const TAGLINE='One started early. One started “soon”. Only one of them is rich.';
const SUPABASE_URL='https://gkfldkytzfngwnkrwrga.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrZmxka3l0emZuZ3dua3J3cmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MzI4NDksImV4cCI6MjA5NDUwODg0OX0.wwyFY0bhbGhCKCpAjgZ0oCS8gda21FHcvDdvlg9xCmU';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const LOGO='IFM round logo for watermark.png';            // QR centre + round slots (§18)
const PRINT_LOGO_SRC='IFM logo white background.png';     // hero banners via .hero-logo-wide (§8, §18)
const AV_EMOJI=['🦊','🐯','🦄','🐼','🦁','🐨','🐸','🦋','🐝','🦉','🐙','🦖','🌸','🍀','⭐','🚀','💎','🎯','🍰','🦚'];
const AV_COLOR=['#e05a47','#3a78c9','#2a9d8f','#c8900a','#8e44ad','#e0699a','#16a085','#d97a34','#5a7d8a','#6c5ce7'];

/* ── money formatting (§9) ────────────────────────────────────── */
function fmtMoney(n){ n=Math.round(n);
  if(n>=10000000){const v=n/10000000;return '₹'+(v>=100?Math.round(v):v%1?v.toFixed(v<10?2:1):v)+' Cr';}
  if(n>=100000){const v=n/100000;return '₹'+(v>=100?Math.round(v):v%1?v.toFixed(v<10?2:1):v)+' L';}
  if(n>=1000){const v=n/1000;return '₹'+(v%1?v.toFixed(1):v)+'k';}
  return '₹'+n;
}
function indianFormat(digits){ digits=String(digits).replace(/\D/g,''); if(!digits) return '';
  const last3=digits.slice(-3), rest=digits.slice(0,-3);
  return (rest?rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',':'')+last3; }
const parseNum=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── the maths ────────────────────────────────────────────────── */
function sipFor(fv,years,ratePct){ const r=ratePct/1200, n=Math.round(years*12); if(n<=0) return fv; return fv*r/(Math.pow(1+r,n)-1); }
function fvOf(p,years,ratePct){ const r=ratePct/1200, n=Math.round(years*12); if(n<=0) return 0; return p*(Math.pow(1+r,n)-1)/r; }
// Someone older than the target age (the teacher at 46, a parent in the room) can't be asked about
// '₹10 Cr by 40'. Anyone within 5 years of the target gets their own finish line instead: 60, or
// age+10 if they are past 55. Every screen reads the horizon from here, never from S.targetAge.
function horizonFor(p,S){ return (S.targetAge-p.age>=5)?S.targetAge:Math.max(S.flipAge,p.age+10); }
function calc(p,S){
  const horizon=horizonFor(p,S); const yrs=Math.max(1,horizon-p.age);
  const now=sipFor(S.target,yrs,S.rate);
  const plus1=sipFor(S.target,Math.max(1,yrs-1),S.rate);
  const delay=Math.min(S.delayYears,Math.max(0,yrs-1));
  const late=sipFor(S.target,Math.max(1,yrs-delay),S.rate);
  const flipYrs=Math.max(1,S.flipAge-p.age);
  const flip=fvOf(S.flipSip,flipYrs,S.rate);
  const flipEarly=fvOf(S.flipSip,flipYrs+5,S.rate);
  return {horizon,yrs,now,plus1,delay,late,flipYrs,flip,flipEarly};
}
function realFor(p,rk,S){ const c=calc(p,S); return rk==='r1'?c.now:rk==='r2'?c.late:c.flip; }
function offBy(guess,real){
  if(!guess||guess<=0) return {cls:'',txt:'no guess',err:99};
  const k=guess/real, err=Math.abs(Math.log(k)), d=Math.abs(real-guess);
  if(k>=0.95&&k<=1.05) return {cls:'',txt:'spot on',err};
  if(k<1) return {cls:'low',txt:fmtMoney(d)+' short',err};
  return {cls:'high',txt:fmtMoney(d)+' over',err};
}

/* ── rounds ───────────────────────────────────────────────────── */
const PHASES=['lobby','r1_ask','r1_reveal','r1_whatif','r2_ask','r2_reveal','r2_whatif','r3_ask','r3_reveal','r3_whatif','poll','end'];
const SIP_CHIPS=[2000,5000,10000,25000,50000,100000,200000,500000];
const FV_CHIPS=[1000000,2500000,5000000,10000000,20000000,50000000,100000000];
const BLOCKERS=[
  {k:'how',  txt:'I didn’t know how to start',     short:'Not knowing how',   fix:'That is exactly what the next few days are for.'},
  {k:'money',txt:'I don’t have spare money yet',   short:'No spare money yet',fix:'₹500 a month is a real start. You have just seen the maths.'},
  {k:'risk', txt:'It feels risky',                  short:'It felt risky',     fix:'Doing nothing is the riskier choice. We will show you why.'},
  {k:'young',txt:'I thought I was too young to bother',short:'Felt too young', fix:'You have just seen it. Young is the unfair advantage.'},
  {k:'later',txt:'I kept telling myself “later”',   short:'Saying “later”',    fix:'You have just seen exactly what “later” costs.'},
];
const ROUNDS={
  r1:{n:1,title:'The big number',
      hostQ:S=>`To have <em>${fmtMoney(S.target)}</em> by the time you turn <em>${S.targetAge}</em>, how much would you need to invest <em>every month</em>?`,
      hostWhy:S=>`Assume ${S.rate}% a year — what a plain equity mutual fund has done over long stretches. Your age decides your number. Every phone in this room has a different answer.`,
      phoneQ:(p,S)=>{const h=horizonFor(p,S);return `You're ${p.age}. To have <em>${fmtMoney(S.target)}</em> by ${h}, how much would you need to invest every month?`;},
      phoneNote:(p,S)=>{const h=horizonFor(p,S);return h!==S.targetAge?`The room is playing to ${S.targetAge}. At ${p.age} your finish line is ${h}.`:'';},
      chips:SIP_CHIPS, unit:'per month'},
  r2:{n:2,title:'The cost of waiting',
      hostQ:S=>`Same target. But you do nothing for <em>${S.delayYears} years</em> and start then. How much a month <em>now</em>?`,
      hostWhy:S=>`Same ${fmtMoney(S.target)}, same ${S.rate}%, same finish line. You just start later.`,
      phoneQ:(p,S)=>{const c=calc(p,S);return `Same ${fmtMoney(S.target)} by ${c.horizon}. But you wait <em>${c.delay} years</em> and start at ${p.age+c.delay}. How much a month then?`;},
      phoneNote:()=>'', chips:SIP_CHIPS, unit:'per month'},
  r3:{n:3,title:'The flip',
      hostQ:S=>`Forget ${fmtMoney(S.target)}. You invest just <em>${fmtMoney(S.flipSip)} a month</em> from today until you're <em>${S.flipAge}</em>. What does it become?`,
      hostWhy:S=>`Same ${S.rate}% a year. No increases, no top-ups. Just ${fmtMoney(S.flipSip)} every month, left to grow.`,
      phoneQ:(p,S)=>`You're ${p.age}. You invest <em>${fmtMoney(S.flipSip)} a month</em> from today until you're ${S.flipAge}. What does it grow to?`,
      phoneNote:()=>'', chips:FV_CHIPS, unit:'in total'},
};
function roundOf(phase){ const m=/^(r\d)_/.exec(phase||''); return m?m[1]:null; }

/* ── role / room ──────────────────────────────────────────────── */
const params=new URLSearchParams(location.search);
let ROLE=params.get('role')||'host';
let ROOM=params.get('room')||null;
const MY_ID=(function(){let id=localStorage.getItem('wh_pid');if(!id){id=(crypto.randomUUID?crypto.randomUUID():'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));localStorage.setItem('wh_pid',id);}return id;})();
let isHost=(ROLE==='host');
let state=null;
function freshState(){
  return {phase:'lobby',nonce:0,
    settings:{target:100000000,targetAge:40,rate:12,delayYears:5,flipSip:5000,flipAge:60},
    players:{},hostId:MY_ID,updatedAt:Date.now()};
}
const S=()=>state.settings;
const W=()=>Object.assign({},state.settings,state.whatif||{});   // the sandbox rules shown on a what-if screen
const playersSorted=()=>Object.values(state.players).sort((a,b)=>a.age-b.age||a.name.localeCompare(b.name));
const av=p=>`<span class="av" style="background:${p.color}">${p.av}</span>`;

/* ── DB: ordered, retried saves ───────────────────────────────── */
let _saveTimer=null,_saveDirty=false,_saveBusy=false,_saveFails=0;
function save(){ state.updatedAt=Date.now(); clearTimeout(_saveTimer); _saveTimer=setTimeout(flushSave,60); }
function saveNow(){ state.updatedAt=Date.now(); return flushSave(); }
async function flushSave(){
  _saveDirty=true; if(_saveBusy) return; _saveBusy=true;
  try{
    while(_saveDirty){ _saveDirty=false; let ok=false;
      try{ const {error}=await db.from('games').upsert({room_code:ROOM,state,host_id:MY_ID,updated_at:new Date().toISOString()});
           ok=!error; if(error) console.warn('save failed — retrying',error.message||error); }
      catch(e){ console.warn('save failed — retrying',e); }
      if(ok){ _saveFails=0; } else { _saveFails++; _saveDirty=true; await new Promise(r=>setTimeout(r,Math.min(4000,400*2**Math.min(_saveFails-1,4)))); }
      netBanner();
    }
  } finally { _saveBusy=false; }
}
function netBanner(){
  if(!isHost) return;
  let b=document.getElementById('netBanner');

let channel=null, _lastStateAt=Date.now();
function joinChannel(){
  channel=db.channel('room:'+ROOM);

    (p)=>{const s=p.new&&p.new.state; if(s&&!isHost){state=s; _lastStateAt=Date.now(); renderPlayer();}})

let _timers=[];

const IDLE_MS=120*60*1000; let _lastActivity=Date.now();

async function initHost(){

    const p=new URLSearchParams(location.search);p.set('role','host');p.set('room',ROOM);history.replaceState(null,'','?'+p.toString()); }
  joinChannel();

    const s=data&&data.state;

    if(s&&recent&&s.settings&&s.phase!=='lobby'&&s.phase!=='end'&&Object.keys(s.players||{}).length>0){ state=s; state.hostId=MY_ID; resumed=true; }
  }catch(e){}
  if(!resumed){ state=freshState(); await saveNow(); }
  // Local design QA only: ?demo=1&phase=r1_reveal seeds a room so every screen can be screenshotted.
  if(params.get('demo')&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){

    D.forEach((d,i)=>{ state.players['d'+i]={id:'d'+i,name:d[0],age:d[1],av:AV_EMOJI[i],color:AV_COLOR[i],guess:{r1:d[2],r2:d[3],r3:d[4]},vote:d[5]}; });
    state.phase=params.get('phase')||'lobby'; if(/_whatif$/.test(state.phase)) state.whatif={targetAge:60};
  }
  const rb=document.createElement('button'); rb.className='host-reset'; rb.textContent='↺ New game'; rb.onclick=hostReset; document.body.appendChild(rb);
  const jw=document.createElement('div'); jw.className='join-corner'; jw.id='joinCorner'; jw.title='Scan to join or rejoin';
  jw.innerHTML='<div class="jc-qr" id="jcQr"></div><div class="jc-txt"><div class="jc-lbl">Scan to (re)join</div><div class="jc-pin">'+ROOM+'</div><div class="jc-tap">tap to enlarge ⛶</div></div>';
  jw.onclick=openQRFull; document.body.appendChild(jw); makeQR(document.getElementById('jcQr'),44);
  const kh=document.createElement('div'); kh.className='key-hint'; kh.id='keyHint'; document.body.appendChild(kh);
  const bk=document.createElement('button'); bk.className='host-back'; bk.id='hostBack'; bk.textContent='← Back'; bk.onclick=hostBack; document.body.appendChild(bk);
  const nx=document.createElement('button'); nx.className='host-next'; nx.id='hostNext'; nx.onclick=hostAdvance; document.body.appendChild(nx);
  document.addEventListener('keydown',e=>{
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;

  });

function playerUrl(){return location.origin+location.pathname+'?role=player&room='+ROOM;}

function setSetting(k,v){ if(!/_whatif$/.test(state.phase)) return; bump(); state.whatif=state.whatif||{}; state.whatif[k]=v; save(); renderHost(); }
function resetWhatIf(){ bump(); state.whatif={}; save(); renderHost(); }
function hostAdvance(){
  const i=PHASES.indexOf(state.phase); if(i<0||i>=PHASES.length-1) return;
  if(state.phase==='lobby'&&!Object.keys(state.players).length) return;
  bump(); state.phase=PHASES[i+1]; state.nonce++; if(/_whatif$/.test(state.phase)) state.whatif={}; save(); renderHost();
}
function hostBack(){ const i=PHASES.indexOf(state.phase); if(i<=0) return; bump(); state.phase=PHASES[i-1]; state.nonce++; if(/_whatif$/.test(state.phase)) state.whatif={}; save(); renderHost(); }

function hostHandleAction(a){
  if(!a||!a.type||!state) return; bump();
  if(a.type==='join'){
    const name=String(a.name||'').slice(0,16).trim(); const age=Math.min(70,Math.max(10,parseInt(a.age,10)||0));
    if(!name||!age) return;
    if(!state.players[a.id]){ const n=Object.keys(state.players).length;
      state.players[a.id]={id:a.id,name,age,av:AV_EMOJI[n%AV_EMOJI.length],color:AV_COLOR[n%AV_COLOR.length],guess:{},vote:null}; }
    else { state.players[a.id].name=name; state.players[a.id].age=age; }
    save(); if(state.phase==='lobby'||/_ask$/.test(state.phase)) renderHost();
  }
  else if(a.type==='guess'){
    const p=state.players[a.id]; const rk=roundOf(state.phase);
    if(!p||!rk||state.phase!==rk+'_ask'||a.round!==rk) return;
    p.guess[rk]=Math.max(0,Math.round(+a.value||0)); save(); renderHost();
  }
  else if(a.type==='vote'){
    const p=state.players[a.id]; if(!p||state.phase!=='poll') return;
    const v=Math.round(+a.value); if(!(v>=0&&v<BLOCKERS.length)) return;
    p.vote=v; save(); renderHost();
  }
}

/* ── host render ──────────────────────────────────────────────── */
const NEXT_LABEL={lobby:'Start · Round 1 →',r1_ask:'Reveal →',r1_reveal:'What if…? →',r1_whatif:'Round 2 →',r2_ask:'Reveal →',r2_reveal:'What if…? →',r2_whatif:'Round 3 →',r3_ask:'Reveal →',r3_reveal:'What if…? →',r3_whatif:'One last question →',poll:'Wrap up →',end:''};

function whatIf(rk){

               `<span class="grp"><span class="wl">Return</span><input type="range" class="rate" min="6" max="18" step="0.5" value="${W().rate}" oninput="document.getElementById('rateV').textContent=(+this.value)+'%'" onchange="setSetting('rate',+this.value)"><b class="rate-v" id="rateV">${W().rate}%</b></span>`];
  if(rk==='r2') parts.push(`<span class="grp"><span class="wl">Wait</span>${chipRow('delayYears',[3,5,10],v=>v+' yrs')}</span>`);
  if(rk==='r3') parts.push(`<span class="grp"><span class="wl">A month</span>${chipRow('flipSip',[2000,5000,10000],fmtMoney)}</span>`);

function tplAsk(rk){

function cu(val,cls,delay){ return `<span class="${cls||''}" data-cu="${Math.round(val)}" data-delay="${delay||0}">₹0</span>`; }
function runCountUps(){

const STEP=380; // ms between rows on a reveal — youngest first, so the number visibly climbs
const ageCell=(p,k,s)=>`<span>${p.age}${k.horizon!==s.targetAge?` <small>→${k.horizon}</small>`:''}</span>`;
function tplReveal1(){

function chart1(ps,s,label){
  const onCurve=ps.filter(p=>horizonFor(p,s)===s.targetAge); const ages=(onCurve.length?onCurve:ps).map(p=>p.age);
  const a0=Math.max(15,Math.min(...ages)-2), a1=Math.min(s.targetAge-4,Math.max(...ages)+8);
  const W=440,H=250,L=66,R=14,T=16,B=34; const pts=[]; for(let a=a0;a<=a1;a+=0.5) pts.push([a,sipFor(s.target,s.targetAge-a,s.rate)]);
  const ymax=Math.max(...pts.map(q=>q[1]))*1.05;
  const X=a=>L+(a-a0)/(a1-a0)*(W-L-R), Y=v=>T+(1-v/ymax)*(H-T-B);
  const path=pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ');
  const ticks=[0.25,0.5,0.75,1].map(f=>`<text x="${L-8}" y="${Y(ymax*f/1.05)+4}" text-anchor="end" font-size="10" font-weight="800" fill="#9fc2bb">${fmtMoney(ymax*f/1.05)}</text><line x1="${L}" x2="${W-R}" y1="${Y(ymax*f/1.05)}" y2="${Y(ymax*f/1.05)}" stroke="rgba(255,255,255,.08)"/>`).join('');
  const xs=[]; for(let a=Math.ceil(a0/2)*2;a<=a1;a+=2) xs.push(`<text x="${X(a)}" y="${H-B+16}" text-anchor="middle" font-size="10" font-weight="800" fill="#9fc2bb">${a}</text>`);
  const dots=onCurve.map((p,i)=>{const v=calc(p,s).now; return `<g style="opacity:0;animation:rise .4s ease-out ${i*STEP+200}ms forwards"><circle cx="${X(p.age)}" cy="${Y(v)}" r="6.5" fill="${p.color}" stroke="#fff" stroke-width="2"/><text x="${X(p.age)}" y="${Y(v)+(i%2?20:-11)}" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">${esc(p.name.split(' ')[0])}</text></g>`;}).join('');
  return `<div class="kicker">${label||'Monthly SIP needed, by the age you start'}</div>
  <svg class="chart" viewBox="0 0 ${W} ${H}">${ticks}${xs.join('')}<path d="${path}" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>${dots}<text x="${W-R}" y="${H-3}" text-anchor="end" font-size="9" font-weight="800" fill="#9fc2bb">age you start →</text></svg>`;
}
function tplReveal2(){

        ${c?`<div class="glass stat"><div class="kicker">🎯 Closest guess</div><div class="big teal">${esc(c.p.name)}</div><div class="sm">guessed ${fmtMoney(c.p.guess.r2)} · real ${fmtMoney(realFor(c.p,'r2',s))}</div></div>`:''}

function whatIfRow(p,rk,s,w,i){
  const a=realFor(p,rk,s), b=realFor(p,rk,w), d=b-a, k=calc(p,w);
  const chg=Math.abs(d)<1?'<span class="off">same</span>':`<span class="off ${d>0?'low':'up'}">${d>0?'+':'−'}${fmtMoney(Math.abs(d))}</span>`;
  return `<div class="rv-row" style="animation-delay:${i*120}ms"><span class="nm">${av(p)}${esc(p.name)}</span>${ageCell(p,k,w)}<span class="guess">${fmtMoney(a)}</span>${cu(b,'real'+(b>a?' hot':''),i*120+100)}${chg}</div>`;
}
function tplWhatIf(rk){
  const ps=playersSorted(), s=S(), w=W(); const R=ROUNDS[rk];
  const changed=JSON.stringify(state.whatif||{})!=='{}';
  const unit=rk==='r3'?'it becomes':'per month';
  const played=rk==='r3'?`${fmtMoney(s.flipSip)}/mo to ${s.flipAge} at ${s.rate}%`:rk==='r2'?`${fmtMoney(s.target)} by ${s.targetAge}, ${s.delayYears} yrs late, ${s.rate}%`:`${fmtMoney(s.target)} by ${s.targetAge} at ${s.rate}%`;
  const now=rk==='r3'?`${fmtMoney(w.flipSip)}/mo to ${w.flipAge} at ${w.rate}%`:rk==='r2'?`${fmtMoney(w.target)} by ${w.targetAge}, ${w.delayYears} yrs late, ${w.rate}%`:`${fmtMoney(w.target)} by ${w.targetAge} at ${w.rate}%`;
  const rows=ps.map((p,i)=>whatIfRow(p,rk,s,w,i)).join('');
  const avgA=ps.reduce((a,p)=>a+realFor(p,rk,s),0)/ps.length, avgB=ps.reduce((a,p)=>a+realFor(p,rk,w),0)/ps.length;
  return `<div class="stage">
    <div class="presents">Round ${R.n}B · what if…?</div>
    <h2 class="title" style="font-size:clamp(1.4rem,2.6vw,2.1rem)">Change one thing. <em>Watch every number move.</em></h2>
    ${whatIf(rk)}
    <div class="rv">
      <div class="glass rv-table"><div class="rv-head"><span>Name</span><span>Age</span><span>As played</span><span>What if · ${unit}</span><span>Change</span></div>${rows}</div>
      <div class="side">
        ${rk==='r1'?`<div class="glass stat">${chart1(ps,w,'Monthly SIP needed, by the age you start · what-if rules')}</div>`:''}
        <div class="glass stat"><div class="kicker">As played</div><div class="sm" style="color:var(--stage-ink)">${played}</div><div class="big" style="font-size:1.4rem">${fmtMoney(avgA)} <span style="font:800 .8rem 'Manrope',sans-serif;color:var(--stage-sub)">room average</span></div></div>
        <div class="glass stat" style="border-color:${changed?'rgba(45,212,191,.45)':'var(--glass-edge)'}"><div class="kicker">What if</div><div class="sm" style="color:var(--stage-ink)">${now}</div><div class="big ${avgB<avgA?'teal':'gold'}" style="font-size:1.4rem">${fmtMoney(avgB)} <span style="font:800 .8rem 'Manrope',sans-serif;color:var(--stage-sub)">room average</span></div>${changed?`<div class="sm">${avgB<avgA?'↓':'↑'} ${fmtMoney(Math.abs(avgB-avgA))} ${rk==='r3'?'':'a month'} ${avgB<avgA?'less':'more'} than as played</div>`:'<div class="sm">Tap a lever above. The phones change with it.</div>'}</div>
      </div>
    </div>

}
function tally(){
  const ps=playersSorted(); const c=BLOCKERS.map(()=>0);
  ps.forEach(p=>{ if(p.vote!=null&&p.vote>=0&&p.vote<c.length) c[p.vote]++; });
  const max=Math.max(1,...c); const voted=c.reduce((a,b)=>a+b,0);
  let lead=-1; if(voted){ lead=c.indexOf(Math.max(...c)); }
  return {c,max,voted,total:ps.length,lead};
}
function tplPoll(){
  const t=tally();
  const bars=BLOCKERS.map((b,i)=>`<div class="bar ${i===t.lead?'lead':''}"><div class="bar-fill" style="width:${t.c[i]?Math.max(6,Math.round(t.c[i]/t.max*100)):0}%"></div><span class="bt">${b.txt}</span><span class="bn">${t.c[i]||''}</span></div>`).join('');
  return `<div class="stage">
    <div class="presents">One last question</div>
    <h1 class="title">What has actually stopped you from <em>starting?</em></h1>
    <p class="tag">Tap one on your phone. Be honest. Everyone in this room has used one of these.</p>
    <div class="prog"><b>${t.voted}</b> / ${t.total} answered</div>
    <div class="bars">${bars}</div>
    ${t.lead>=0?`<p class="punch" style="animation-delay:0ms;opacity:1;animation:none">${BLOCKERS[t.lead].fix}</p>`:''}
  </div>`;
}
function bestEstimator(){
  const s=S(); const scored=playersSorted().map(p=>{ const errs=['r1','r2','r3'].filter(rk=>p.guess[rk]>0).map(rk=>offBy(p.guess[rk],realFor(p,rk,s)).err);
    return {p,n:errs.length,avg:errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:99}; }).filter(x=>x.n>=2).sort((a,b)=>a.avg-b.avg);
  return scored[0]||null;
}
function tplEnd(){
  const ps=playersSorted(), s=S(); const t=tally(); const b=bestEstimator();
  const g=ps.filter(p=>p.guess.r1>0); const avgG=g.length?g.reduce((a,p)=>a+p.guess.r1,0)/g.length:0;
  const avgR=ps.length?ps.reduce((a,p)=>a+calc(p,s).now,0)/ps.length:0; const gap=avgG&&avgR>avgG?(avgR/avgG).toFixed(1):null;
  return `<div class="stage end-stage">

      <div class="glass stat"><div class="kicker">How far off the room guessed</div><div class="big gold">${gap?gap+'× too low':'—'}</div><div class="sm">on what ${fmtMoney(s.target)} by ${s.targetAge} really takes</div></div>
      <div class="glass stat"><div class="kicker">🎯 Best estimator</div><div class="big">${b?esc(b.p.name):'—'}</div><div class="sm">${b?'closest across the rounds':'needs two guesses'}</div></div>
    </div>
    <p class="tag">Your numbers are on your phone. Send them to yourself on WhatsApp before you leave.</p>

async function initPlayer(){
  document.getElementById('player').classList.remove('hide');
  document.body.classList.add('player-bg');
  if(!ROOM){ document.getElementById('player').innerHTML=shell('<div class="card center"><h2>Scan the QR on the screen</h2><p>or open the link with the game PIN.</p></div>'); return; }
  joinChannel();
  try{ const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle(); if(data&&data.state)state=data.state; }catch(e){}
  renderPlayer();
  setInterval(async()=>{ // safety net for dropped realtime events
    if(!me())return;
    try{ const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle();
      if(data&&data.state&&data.state.updatedAt!==(state&&state.updatedAt)){ state=data.state; _lastStateAt=Date.now(); renderPlayer(); }
    }catch(e){}
  },2500);
  // Tap-to-rejoin (build-guide): iOS kills the socket during a phone call; if the tab comes back
  // and nothing arrives for a few seconds, offer a reload. Identity is in localStorage so it's safe.
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ hiddenAt=Date.now(); return; }
    if(!hiddenAt||Date.now()-hiddenAt<8000) return;
    const seen=_lastStateAt;
    setTimeout(()=>{ if(_lastStateAt===seen&&me()){ const o=document.createElement('div'); o.className='rejoin'; o.innerHTML='<div><h2>Tap to rejoin</h2><p>Your phone lost the game for a moment.</p></div>'; o.onclick=()=>location.reload(); document.body.appendChild(o); } },4000);
  });
}

  return `<div class="crowd"><div class="stack">${show.map(p=>`<span style="background:${p.color}">${p.av}</span>`).join('')}${rest>0?`<span style="background:#3b4650;font-size:11px">+${rest}</span>`:''}</div><p>${text}<br>${others.length>1?'are':'is'} already in.</p></div>`;
}
function shell(inner,full){ const rate=state&&state.settings?state.settings.rate:12;
  return `<div class="wrap">
    <div class="p-hero ${full?'full':''}"></div>
    <div class="p-bar"><div class="mark"><img src="${LOGO}" alt=""></div><div class="brand">Investing<br>for Mummies</div><div class="room"><i></i>ROOM ${esc(ROOM||'')}</div></div>
    ${full?`<div class="p-title"><div class="the">The</div><h1>Wealth Hack</h1><p class="tag">One started early. One started “soon”. <b>Only one of them is rich.</b></p></div>`:`<div class="p-title compact"><h1>The Wealth Hack</h1></div>`}
    ${inner}
    ${full?crowdRow():''}
    <div class="foot">Investing for Mummies · assumes ${rate}% a year, not a promise</div></div>`; }

if(isHost) initHost(); else initPlayer();
</script>
