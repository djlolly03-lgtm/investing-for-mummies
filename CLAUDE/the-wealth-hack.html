<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Wealth Hack — Investing for Mummies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lora:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ── IFM palette (Brand Guidelines §3) ─────────────────────────── */
:root{
  --navy:#1a3a5c;--ink:#1a3a5c;--navy-lt:#264d78;--teal:#2a9d8f;--teal-d:#1f7d72;--muted:#5a7d8a;
  --cream:#f7faf9;--white:#fff;--mint:#bde9e4;--mint-lt:#e0f3f0;--gold:#c9a84c;--gold-lt:#f5f0e0;
  --success:#27AE60;--danger:#c0392b;--wa:#25D366;
  /* projector-only tones: the studio is dark, so text and accents lift to these */
  --stage-ink:#eaf6f3;--stage-sub:#9fc2bb;--teal-bright:#2dd4bf;--gold-bright:#f5c451;--coral:#ff8a76;
  --glass:rgba(10,26,34,.72);--glass-edge:rgba(255,255,255,.12);
  --shadow:0 2px 12px rgba(26,58,92,.06);--shadow-lg:0 16px 48px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Nunito',sans-serif;color:var(--navy);background:var(--cream)}
h1,h2,h3{font-family:'Lora',serif;font-weight:700;margin:0}
button,input{font-family:'Nunito',sans-serif}
button{cursor:pointer}
.hide{display:none!important}

/* ════════ HOST · projector ════════ */
body.host-bg{background:radial-gradient(125% 95% at 50% -5%,rgba(14,38,48,.42),rgba(5,15,20,.94) 78%),url('quiz-studio.jpg') center/cover fixed no-repeat;color:var(--stage-ink);min-height:100vh}
#host{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 32px 70px}
.stage{width:100%;max-width:1240px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.presents{font-size:.72rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--stage-sub);text-align:center}
.title{font-size:clamp(1.9rem,3.6vw,2.9rem);line-height:1.1;text-align:center;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.title em{font-style:italic;color:var(--gold-bright)}
.tag{font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:700;color:var(--stage-sub);text-align:center;margin:0;max-width:820px;line-height:1.45}
.hero-mark{display:block;width:118px;height:118px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 60px rgba(45,212,191,.35),0 20px 50px rgba(0,0,0,.5)}
@media(max-height:760px){.hero-mark{width:88px;height:88px}}
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-lg)}
.panel{background:#fff;color:var(--navy);border-radius:16px;box-shadow:var(--shadow-lg)}
.kicker{font-size:.66rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.glass .kicker{color:var(--stage-sub)}
.btn{font:800 .95rem 'Nunito',sans-serif;color:#fff;border:0;border-radius:12px;padding:13px 28px;background:linear-gradient(135deg,var(--navy),var(--teal));box-shadow:0 4px 16px rgba(26,58,92,.2);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(26,58,92,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.big{font-size:1.1rem;padding:15px 34px}
.btn.gold{background:linear-gradient(135deg,var(--gold),#a8862f)}

/* lobby */
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:980px;align-items:stretch}
.lobby-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 18px}
.lobby-card h2{font-size:1.15rem;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.count-big{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:var(--mint-lt);color:var(--teal-d);font:900 .95rem 'Nunito',sans-serif}
#lobbyQr{cursor:zoom-in}
.qr-hint{font-size:.72rem;font-weight:800;color:var(--teal-d);margin-top:10px;cursor:pointer}
.scan-how{margin:-4px 0 12px;font-size:.84rem;font-weight:600;color:var(--muted);max-width:300px;line-height:1.4}
.pin-label{font-size:.62rem;text-transform:uppercase;letter-spacing:1.6px;font-weight:900;margin-top:10px;color:var(--muted)}
.pin{font-family:'Lora',serif;font-size:2.8rem;font-weight:700;letter-spacing:.3rem;line-height:1.1;color:var(--navy)}
.joinurl{font-size:.7rem;word-break:break-all;font-weight:700;margin-top:6px;color:var(--muted);opacity:.8}
.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-start;align-content:flex-start;width:100%;min-height:52px;max-height:22vh;overflow:auto;padding:2px}
.pl{display:inline-flex;align-items:center;gap:7px;background:var(--mint-lt);border-radius:999px;padding:5px 12px 5px 5px;font-weight:800;font-size:.9rem;color:var(--navy);animation:pop .3s ease-out}
.pl .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;color:#fff;flex:none}
.pl .age{color:var(--muted);font-size:.8rem;font-weight:900}
.waiting{color:var(--muted);font-weight:700;font-style:italic;font-size:.9rem;margin:14px 0}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.lobby-card .btn{width:100%;margin-top:auto}
.lobby-card .players{flex:1}
.plan{width:100%;text-align:left;margin:14px 0 4px;border-top:1px solid var(--mint-lt);padding-top:12px}
.plan .row{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline;padding:5px 0;font-size:.86rem;font-weight:600;color:var(--muted)}
.plan .row b{font-family:'Lora',serif;color:var(--navy);font-weight:700;font-size:.95rem}
.plan .row i{font-style:normal;font:900 .72rem 'Nunito',sans-serif;color:var(--teal);letter-spacing:.08em}
.whatif{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:center;padding:9px 18px;border-radius:999px}
.whatif .wk{font-family:'Lora',serif;font-style:italic;font-weight:600;color:var(--gold-bright);font-size:1rem}
.whatif .wl{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-sub);margin-right:3px}
.whatif .grp{display:flex;align-items:center;gap:5px}
.whatif .chip{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);border-radius:10px;padding:4px 10px;font:800 .76rem 'Nunito',sans-serif;transition:background .2s}
.whatif .chip:hover{background:rgba(255,255,255,.16)}
.whatif .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.whatif .rate{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);outline:none;margin:0 6px;cursor:pointer}
.whatif .rate::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--teal-bright);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
.whatif .rate::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--teal-bright);border:2px solid #fff;cursor:grab}
.whatif .rate-v{font-family:'Lora',serif;font-size:1.05rem;color:var(--gold-bright);min-width:44px;display:inline-block}

/* ask */
.q-panel{width:100%;max-width:1000px;padding:28px 36px;text-align:center;border-color:rgba(45,212,191,.45);animation:qpulse 2.6s ease-in-out infinite}
@keyframes qpulse{0%,100%{box-shadow:0 0 0 1px rgba(45,212,191,.2),0 0 40px rgba(45,212,191,.12),var(--shadow-lg)}50%{box-shadow:0 0 0 1px rgba(45,212,191,.4),0 0 70px rgba(45,212,191,.26),var(--shadow-lg)}}
.q-panel .q{font-family:'Lora',serif;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.22;font-weight:700;color:#fff;margin:0}
.q-panel .q em{font-style:italic;color:var(--gold-bright)}
.q-panel .why{margin:12px auto 0;font-size:1rem;color:var(--stage-sub);font-weight:700;max-width:820px;line-height:1.45}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-bright)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--teal-bright);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.prog{font-size:1.25rem;font-weight:800;color:var(--stage-ink)}
.prog b{color:var(--gold-bright);font-size:1.7rem;font-family:'Lora',serif}
.pl-wall{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1100px}
.pl-wall .pl{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);transition:opacity .3s}
.pl-wall .pl .age{color:var(--stage-sub)}
.pl-wall .pl.dim{opacity:.38}
.pl-wall .pl.lit{opacity:1;border-color:var(--teal-bright)}

/* reveal */
.rv{display:grid;grid-template-columns:1fr 440px;gap:16px;width:100%;align-items:start}
.rv-table{padding:8px 16px 6px}
.rv-head,.rv-row{display:grid;grid-template-columns:1.6fr .7fr 1fr 1.25fr 1.05fr;align-items:center;gap:10px;padding:7px 6px}
.rv-head{font-size:.62rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--stage-sub);border-bottom:1px solid var(--glass-edge)}
.rv-row{border-bottom:1px solid rgba(255,255,255,.07);font-weight:700;color:var(--stage-ink);opacity:0;animation:rise .4s ease-out forwards}
.rv-row:last-child{border-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv-row .nm{display:flex;align-items:center;gap:9px;font-weight:800}
.rv-row .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;color:#fff;flex:none}
.rv-row small{color:var(--stage-sub);font-weight:800}
.rv-row .guess{color:var(--stage-sub)}
.rv-row .real{font-family:'Lora',serif;font-size:1.35rem;font-weight:700;color:var(--teal-bright)}
.rv-row .real.hot{color:var(--gold-bright)}
.rv-row .off{font-size:.72rem;font-weight:900;border-radius:10px;padding:4px 9px;text-align:center;background:rgba(45,212,191,.15);color:var(--teal-bright);white-space:nowrap}
.rv-row .off.low{background:rgba(255,138,118,.16);color:var(--coral)}
.rv-row .off.high{background:rgba(245,196,81,.16);color:var(--gold-bright)}
.rv-row .off.up{background:rgba(45,212,191,.18);color:var(--teal-bright)}
.rv-row .extra{font-family:'Lora',serif;font-size:1.25rem;font-weight:700;color:var(--coral)}
.side{display:flex;flex-direction:column;gap:12px}
.stat{padding:12px 16px}
.stat .big{font-family:'Lora',serif;font-size:1.9rem;font-weight:700;color:#fff;line-height:1.1;margin-top:4px}
.stat .big.gold{color:var(--gold-bright)}
.stat .big.coral{color:var(--coral)}
.stat .big.teal{color:var(--teal-bright)}
.stat .sm{color:var(--stage-sub);font-weight:700;margin-top:4px;font-size:.88rem;line-height:1.45}
.stat .sm b{color:var(--stage-ink)}
.chart{width:100%;height:auto;display:block}
.punch{font-family:'Lora',serif;font-style:italic;font-weight:600;font-size:clamp(1.15rem,2vw,1.6rem);color:var(--gold-bright);text-align:center;max-width:1000px;line-height:1.35;opacity:0;animation:rise .6s ease-out forwards}

/* pledge / end */
.wall{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.pledge-tag{display:inline-flex;align-items:center;gap:9px;background:#fff;color:var(--navy);border-radius:999px;padding:6px 16px 6px 6px;font-weight:900;font-size:1rem;animation:pop .35s ease-out;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.pledge-tag .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pledge-tag .amt{color:var(--teal-d)}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:1000px}
.end-grid .stat{text-align:center;padding:20px}

/* chrome — same placement as the KBC quiz so the room sees one family of games */
.host-reset{position:fixed;top:6px;left:10px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Nunito',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-reset:hover{background:rgba(10,26,34,.95)}
.join-corner{position:fixed;top:6px;right:10px;z-index:95;display:flex;align-items:center;gap:9px;padding:3px 12px 3px 6px;border-radius:14px;cursor:zoom-in;background:linear-gradient(165deg,rgba(26,56,70,.9),rgba(10,26,34,.94));border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 26px rgba(0,0,0,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s}
.join-corner:hover{transform:scale(1.04)}
.join-corner .jc-qr{width:48px;height:48px;background:#fff;border-radius:7px;padding:2px;display:grid;place-items:center;flex:0 0 auto}
.join-corner .jc-txt{text-align:left;line-height:1.2}
.join-corner .jc-lbl{color:var(--stage-sub);font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.join-corner .jc-pin{font-family:'Lora',serif;font-weight:700;font-size:1.1rem;letter-spacing:.14rem;color:#fff}
.join-corner .jc-tap{color:#8fe6d8;font-size:.62rem;font-weight:800}
.key-hint{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);z-index:95;color:var(--stage-sub);font-size:.72rem;font-weight:800;background:rgba(10,26,34,.72);border:1px solid var(--glass-edge);padding:5px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.key-hint b{color:var(--stage-ink)}
.host-back{position:fixed;bottom:7px;left:14px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Nunito',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 15px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-next{position:fixed;bottom:7px;right:14px;z-index:95;font:800 .8rem 'Nunito',sans-serif;color:#fff;background:linear-gradient(135deg,var(--navy),var(--teal));border:0;padding:8px 18px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
/* the fixed corner pills reserve their own band — nothing centred ever runs underneath them */
#host.has-corner{padding-top:62px}
#qrFull{position:fixed;inset:0;z-index:100;background:rgba(5,15,20,.92);display:grid;place-items:center;cursor:pointer}
#qrFull .panel{text-align:center;padding:28px 30px}
#qrFull .pin{font-size:3.6rem}
.net{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:96;background:var(--gold-lt);color:#6b4e00;border:2px solid var(--gold);border-radius:12px;padding:9px 16px;font-weight:800;font-size:.9rem}
@media(max-width:1000px){.join-corner,.key-hint{display:none!important}.lobby-grid,.rv{grid-template-columns:1fr}.end-grid{grid-template-columns:1fr}#host.has-corner{padding-top:14px}}

/* ════════ PLAYER · phone (Brand Guidelines §5–§8) ════════ */
body.player-bg{background:var(--cream)}
.wrap{max-width:480px;margin:0 auto;padding:10px 14px 36px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
.game-hero{position:relative;overflow:hidden;border-radius:16px;padding:18px 20px 18px 95px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--teal))}
.hero-logo-wide{position:absolute;top:50%;left:12px;transform:translateY(-50%);height:62px;width:auto;max-width:140px;object-fit:contain;border-radius:8px;z-index:2;background:#fff}
.game-hero .pill{display:inline-block;background:rgba(255,255,255,.2);border-radius:10px;padding:2px 9px;font-size:.58rem;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.game-hero h1{font-size:1.35rem;line-height:1.15;margin:5px 0 3px}
.game-hero p{margin:0;font-size:.8rem;color:rgba(255,255,255,.85);font-weight:600}
@media(max-width:540px){.hero-logo-wide{height:44px;max-width:96px;left:8px}.game-hero[data-logo]{padding-left:112px!important}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.2rem;line-height:1.25;margin-bottom:6px}
.card h2 em{font-style:italic;color:var(--teal-d)}
.card p{margin:0 0 12px;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.5}
.lbl{font-size:.62rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:12px}
.inp{width:100%;border:2px solid var(--mint);border-radius:12px;padding:12px 14px;font:800 1.1rem 'Nunito',sans-serif;color:var(--navy);background:#fff;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--teal)}
.inp-wrap{position:relative}
.inp-wrap .rs{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:900;font-size:1.1rem;color:var(--muted)}
.inp-wrap .inp.money{padding-left:32px}
.sh-badge{display:inline-block;margin-top:6px;font-size:.62rem;font-weight:800;color:var(--teal);background:#e8f5f2;padding:1px 5px;border-radius:4px}
.sh-badge:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{border:2px solid var(--mint);background:#fff;color:var(--navy);border-radius:10px;padding:7px 11px;font:800 .82rem 'Nunito',sans-serif;transition:border-color .2s,background .2s}
.chip:hover,.chip.on{border-color:var(--teal);background:var(--mint-lt)}
.p-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;color:#fff;border:0;border-radius:12px;padding:13px 16px;font:800 .95rem 'Nunito',sans-serif;background:linear-gradient(135deg,var(--navy),var(--teal));box-shadow:0 4px 16px rgba(26,58,92,.2);transition:transform .2s,opacity .2s}
.p-btn:hover{transform:translateY(-1px)}
.p-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.p-btn.gold{background:linear-gradient(135deg,var(--gold),#a8862f)}
.p-btn.outline{background:#fff;color:var(--muted);border:2px solid var(--mint);box-shadow:none;margin-top:8px}
.p-btn.wa{background:var(--wa);margin-top:8px;box-shadow:0 4px 14px rgba(37,211,102,.28)}
.p-btn.wa svg{width:20px;height:20px;flex:none}
.center{text-align:center;padding:10px 0}
.center .av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;color:#fff;margin:0 auto 10px}
.locked{background:var(--mint-lt);border-left:4px solid var(--teal);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:8px}
.locked .lbl{color:var(--teal-d);margin-bottom:2px}
.locked .v{font-family:'Lora',serif;font-size:1.6rem;font-weight:700;color:var(--navy)}
.locked .u{font-size:.78rem;color:var(--muted);font-weight:700}
.real{text-align:center;padding:4px 0 6px}
.real .v{font-family:'Lora',serif;font-size:2.4rem;font-weight:700;color:var(--teal-d);line-height:1.1;margin:4px 0}
.real .v.red{color:var(--danger)}
.real .g{color:var(--muted);font-weight:700;font-size:.88rem}
.off{display:inline-block;margin-top:8px;border-radius:10px;padding:4px 10px;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;background:#e8f5f2;color:var(--teal-d)}
.off.low{background:#fce8e8;color:var(--danger)}
.off.high{background:var(--gold-lt);color:#8a6d1f}
.fb{margin-top:12px;background:var(--mint-lt);border-left:4px solid var(--navy);border-radius:0 12px 12px 0;padding:12px 14px;font-weight:700;line-height:1.5;font-size:.9rem}
.fb b{color:var(--danger)}
.fb.good b{color:var(--teal-d)}
.sum{display:grid;gap:8px}
.sum .row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--mint-lt);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.86rem}
.sum .row b{font-family:'Lora',serif;font-size:1rem;color:var(--teal-d);white-space:nowrap}
.sum .row b.red{color:var(--danger)}

.rejoin h2{color:#fff;font-size:1.5rem;margin-bottom:8px}

<body>
<div id="host" class="hide"></div>
<div id="player" class="hide"></div>
<div id="qrFull" class="hide" onclick="closeQRFull()"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   THE WEALTH HACK — IFM young-adults opener
   "By 40, ₹10 Cr. How much a month?" Everyone in the room is a different age,
   so everyone has a different number. Guess → reveal → shock → pledge.
   Reuses the Stock Rush / KBC Supabase project (games table) — no setup.
   Host = projector (?role=host, default). Players = phones (?role=player&room=PIN).
   ═══════════════════════════════════════════════════════════════ */
const GAME_NAME='The Wealth Hack';
const TAGLINE='One started early. One started “soon”. Only one of them is rich.';
const SUPABASE_URL='https://gkfldkytzfngwnkrwrga.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrZmxka3l0emZuZ3dua3J3cmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MzI4NDksImV4cCI6MjA5NDUwODg0OX0.wwyFY0bhbGhCKCpAjgZ0oCS8gda21FHcvDdvlg9xCmU';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const LOGO='IFM round logo for watermark.png';            // QR centre + round slots (§18)
const PRINT_LOGO_SRC='IFM logo white background.png';     // hero banners via .hero-logo-wide (§8, §18)
const AV_EMOJI=['🦊','🐯','🦄','🐼','🦁','🐨','🐸','🦋','🐝','🦉','🐙','🦖','🌸','🍀','⭐','🚀','💎','🎯','🍰','🦚'];
const AV_COLOR=['#e05a47','#3a78c9','#2a9d8f','#c8900a','#8e44ad','#e0699a','#16a085','#d97a34','#5a7d8a','#6c5ce7'];

/* ── money formatting (§9) ────────────────────────────────────── */
function fmtMoney(n){ n=Math.round(n);
  if(n>=10000000){const v=n/10000000;return '₹'+(v>=100?Math.round(v):v%1?v.toFixed(v<10?2:1):v)+' Cr';}
  if(n>=100000){const v=n/100000;return '₹'+(v>=100?Math.round(v):v%1?v.toFixed(v<10?2:1):v)+' L';}
  if(n>=1000){const v=n/1000;return '₹'+(v%1?v.toFixed(1):v)+'k';}
  return '₹'+n;
}
function indianFormat(digits){ digits=String(digits).replace(/\D/g,''); if(!digits) return '';
  const last3=digits.slice(-3), rest=digits.slice(0,-3);
  return (rest?rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',':'')+last3; }
const parseNum=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── the maths ────────────────────────────────────────────────── */
function sipFor(fv,years,ratePct){ const r=ratePct/1200, n=Math.round(years*12); if(n<=0) return fv; return fv*r/(Math.pow(1+r,n)-1); }
function fvOf(p,years,ratePct){ const r=ratePct/1200, n=Math.round(years*12); if(n<=0) return 0; return p*(Math.pow(1+r,n)-1)/r; }
// Someone older than the target age (the teacher at 46, a parent in the room) can't be asked about
// '₹10 Cr by 40'. Anyone within 5 years of the target gets their own finish line instead: 60, or
// age+10 if they are past 55. Every screen reads the horizon from here, never from S.targetAge.
function horizonFor(p,S){ return (S.targetAge-p.age>=5)?S.targetAge:Math.max(S.flipAge,p.age+10); }
function calc(p,S){
  const horizon=horizonFor(p,S); const yrs=Math.max(1,horizon-p.age);
  const now=sipFor(S.target,yrs,S.rate);
  const plus1=sipFor(S.target,Math.max(1,yrs-1),S.rate);
  const delay=Math.min(S.delayYears,Math.max(0,yrs-1));
  const late=sipFor(S.target,Math.max(1,yrs-delay),S.rate);
  const flipYrs=Math.max(1,S.flipAge-p.age);
  const flip=fvOf(S.flipSip,flipYrs,S.rate);
  const flipEarly=fvOf(S.flipSip,flipYrs+5,S.rate);
  return {horizon,yrs,now,plus1,delay,late,flipYrs,flip,flipEarly};
}
function realFor(p,rk,S){ const c=calc(p,S); return rk==='r1'?c.now:rk==='r2'?c.late:c.flip; }
function offBy(guess,real){
  if(!guess||guess<=0) return {cls:'',txt:'no guess',err:99};
  const k=guess/real, err=Math.abs(Math.log(k)), d=Math.abs(real-guess);
  if(k>=0.95&&k<=1.05) return {cls:'',txt:'spot on',err};
  if(k<1) return {cls:'low',txt:fmtMoney(d)+' short',err};
  return {cls:'high',txt:fmtMoney(d)+' over',err};
}

/* ── rounds ───────────────────────────────────────────────────── */
const PHASES=['lobby','r1_ask','r1_reveal','r1_whatif','r2_ask','r2_reveal','r2_whatif','r3_ask','r3_reveal','r3_whatif','pledge','end'];
const SIP_CHIPS=[2000,5000,10000,25000,50000,100000,200000,500000];
const FV_CHIPS=[1000000,2500000,5000000,10000000,20000000,50000000,100000000];
const PLEDGE_CHIPS=[500,1000,2000,5000,10000];
const ROUNDS={
  r1:{n:1,title:'The big number',
      hostQ:S=>`To have <em>${fmtMoney(S.target)}</em> by the time you turn <em>${S.targetAge}</em>, how much would you need to invest <em>every month</em>?`,
      hostWhy:S=>`Assume ${S.rate}% a year — what a plain equity mutual fund has done over long stretches. Your age decides your number. Every phone in this room has a different answer.`,
      phoneQ:(p,S)=>{const h=horizonFor(p,S);return `You're ${p.age}. To have <em>${fmtMoney(S.target)}</em> by ${h}, how much would you need to invest every month?`;},
      phoneNote:(p,S)=>{const h=horizonFor(p,S);return h!==S.targetAge?`The room is playing to ${S.targetAge}. At ${p.age} your finish line is ${h}.`:'';},
      chips:SIP_CHIPS, unit:'per month'},
  r2:{n:2,title:'The cost of waiting',
      hostQ:S=>`Same target. But you do nothing for <em>${S.delayYears} years</em> and start then. How much a month <em>now</em>?`,
      hostWhy:S=>`Same ${fmtMoney(S.target)}, same ${S.rate}%, same finish line. You just start later.`,
      phoneQ:(p,S)=>{const c=calc(p,S);return `Same ${fmtMoney(S.target)} by ${c.horizon}. But you wait <em>${c.delay} years</em> and start at ${p.age+c.delay}. How much a month then?`;},
      phoneNote:()=>'', chips:SIP_CHIPS, unit:'per month'},
  r3:{n:3,title:'The flip',
      hostQ:S=>`Forget ${fmtMoney(S.target)}. You invest just <em>${fmtMoney(S.flipSip)} a month</em> from today until you're <em>${S.flipAge}</em>. What does it become?`,
      hostWhy:S=>`Same ${S.rate}% a year. No increases, no top-ups. Just ${fmtMoney(S.flipSip)} every month, left to grow.`,
      phoneQ:(p,S)=>`You're ${p.age}. You invest <em>${fmtMoney(S.flipSip)} a month</em> from today until you're ${S.flipAge}. What does it grow to?`,
      phoneNote:()=>'', chips:FV_CHIPS, unit:'in total'},
};
function roundOf(phase){ const m=/^(r\d)_/.exec(phase||''); return m?m[1]:null; }

/* ── role / room ──────────────────────────────────────────────── */
const params=new URLSearchParams(location.search);
let ROLE=params.get('role')||'host';
let ROOM=params.get('room')||null;
const MY_ID=(function(){let id=localStorage.getItem('wh_pid');if(!id){id=(crypto.randomUUID?crypto.randomUUID():'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));localStorage.setItem('wh_pid',id);}return id;})();
let isHost=(ROLE==='host');
let state=null;
function freshState(){
  return {phase:'lobby',nonce:0,
    settings:{target:100000000,targetAge:40,rate:12,delayYears:5,flipSip:5000,flipAge:60,pledgeRate:10},
    players:{},hostId:MY_ID,updatedAt:Date.now()};
}
const S=()=>state.settings;
const W=()=>Object.assign({},state.settings,state.whatif||{});   // the sandbox rules shown on a what-if screen
const PR=()=>S().pledgeRate||10;   // pledges are projected at a cautious 10%, not the game's 12%
const playersSorted=()=>Object.values(state.players).sort((a,b)=>a.age-b.age||a.name.localeCompare(b.name));
const av=p=>`<span class="av" style="background:${p.color}">${p.av}</span>`;

/* ── DB: ordered, retried saves ───────────────────────────────── */
let _saveTimer=null,_saveDirty=false,_saveBusy=false,_saveFails=0;
function save(){ state.updatedAt=Date.now(); clearTimeout(_saveTimer); _saveTimer=setTimeout(flushSave,60); }
function saveNow(){ state.updatedAt=Date.now(); return flushSave(); }
async function flushSave(){
  _saveDirty=true; if(_saveBusy) return; _saveBusy=true;
  try{
    while(_saveDirty){ _saveDirty=false; let ok=false;
      try{ const {error}=await db.from('games').upsert({room_code:ROOM,state,host_id:MY_ID,updated_at:new Date().toISOString()});
           ok=!error; if(error) console.warn('save failed — retrying',error.message||error); }
      catch(e){ console.warn('save failed — retrying',e); }
      if(ok){ _saveFails=0; } else { _saveFails++; _saveDirty=true; await new Promise(r=>setTimeout(r,Math.min(4000,400*2**Math.min(_saveFails-1,4)))); }
      netBanner();
    }
  } finally { _saveBusy=false; }
}
function netBanner(){
  if(!isHost) return;
  let b=document.getElementById('netBanner');
  const bad=_saveFails>=2||navigator.onLine===false;
  if(!bad){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement('div'); b.id='netBanner'; b.className='net'; document.body.appendChild(b); }
  b.innerHTML='⚠️ The phones can’t get this screen right now — retrying… <b>Don’t move on yet.</b>';
}
addEventListener('online',()=>{ if(isHost){ netBanner(); saveNow(); } }); addEventListener('offline',()=>netBanner());

/* ── realtime ─────────────────────────────────────────────────── */
let channel=null, _lastStateAt=Date.now();
function joinChannel(){
  channel=db.channel('room:'+ROOM);
  channel.on('postgres_changes',{event:'*',schema:'public',table:'games',filter:'room_code=eq.'+ROOM},
    (p)=>{const s=p.new&&p.new.state; if(s&&!isHost){state=s; _lastStateAt=Date.now(); renderPlayer();}})
    .on('broadcast',{event:'action'},({payload})=>{ if(isHost) hostHandleAction(payload); })
    .subscribe();
}
function sendAction(payload){ channel.send({type:'broadcast',event:'action',payload}); }

/* ═══════════════════ HOST ═══════════════════ */
let _timers=[];
function clearTimers(){ _timers.forEach(clearTimeout); _timers=[]; }
function later(fn,ms){ _timers.push(setTimeout(fn,ms)); }
// Multiplayer rule B (§23): wipe to a fresh lobby after 120 min with no host or student action.
const IDLE_MS=120*60*1000; let _lastActivity=Date.now();
function bump(){ _lastActivity=Date.now(); }
// Multiplayer rule A (§23): tell the parent page when the room is live so it can hide the chat widget.
function postLive(){ try{ const live=state.phase!=='lobby'&&state.phase!=='end'; window.parent.postMessage({type:live?'stock-rush-live':'stock-rush-idle'},'*'); }catch(e){} }

async function initHost(){
  document.getElementById('host').classList.remove('hide');
  document.body.classList.add('host-bg');
  if(!ROOM){ ROOM='E'+(1000+Math.floor(Math.random()*9000));   // E-prefix: never collides with KBC's 4-digit PINs in the shared table
    const p=new URLSearchParams(location.search);p.set('role','host');p.set('room',ROOM);history.replaceState(null,'','?'+p.toString()); }
  joinChannel();
  let resumed=false;
  try{
    const {data}=await db.from('games').select('state,updated_at').eq('room_code',ROOM).maybeSingle();
    const s=data&&data.state;
    const recent=data&&data.updated_at&&(Date.now()-new Date(data.updated_at).getTime()<45*60*1000);
    if(s&&recent&&s.settings&&s.phase!=='lobby'&&s.phase!=='end'&&Object.keys(s.players||{}).length>0){ state=s; state.hostId=MY_ID; resumed=true; }
  }catch(e){}
  if(!resumed){ state=freshState(); await saveNow(); }
  // Local design QA only: ?demo=1&phase=r1_reveal seeds a room so every screen can be screenshotted.
  if(params.get('demo')&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
    const D=[['Aanya',21,25000,100000,5000000,2000],['Rohan',24,50000,200000,2500000,1000],['Meera',27,150000,500000,10000000,5000],['Kabir',29,100000,300000,20000000,0],['Zoya',22,10000,50000,1000000,500],['Dev',31,200000,600000,50000000,2000]];
    D.forEach((d,i)=>{ state.players['d'+i]={id:'d'+i,name:d[0],age:d[1],av:AV_EMOJI[i],color:AV_COLOR[i],guess:{r1:d[2],r2:d[3],r3:d[4]},pledge:d[5]}; });
    state.phase=params.get('phase')||'lobby'; if(/_whatif$/.test(state.phase)) state.whatif={targetAge:60};
  }
  const rb=document.createElement('button'); rb.className='host-reset'; rb.textContent='↺ New game'; rb.onclick=hostReset; document.body.appendChild(rb);
  const jw=document.createElement('div'); jw.className='join-corner'; jw.id='joinCorner'; jw.title='Scan to join or rejoin';
  jw.innerHTML='<div class="jc-qr" id="jcQr"></div><div class="jc-txt"><div class="jc-lbl">Scan to (re)join</div><div class="jc-pin">'+ROOM+'</div><div class="jc-tap">tap to enlarge ⛶</div></div>';
  jw.onclick=openQRFull; document.body.appendChild(jw); makeQR(document.getElementById('jcQr'),44);
  const kh=document.createElement('div'); kh.className='key-hint'; kh.id='keyHint'; document.body.appendChild(kh);
  const bk=document.createElement('button'); bk.className='host-back'; bk.id='hostBack'; bk.textContent='← Back'; bk.onclick=hostBack; document.body.appendChild(bk);
  const nx=document.createElement('button'); nx.className='host-next'; nx.id='hostNext'; nx.onclick=hostAdvance; document.body.appendChild(nx);
  document.addEventListener('keydown',e=>{
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(!document.getElementById('qrFull').classList.contains('hide')){ closeQRFull(); return; }
    if(e.code==='Space'||e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); hostAdvance(); }
    else if(e.key==='ArrowLeft'||e.key==='Backspace'){ e.preventDefault(); hostBack(); }
  });
  setInterval(()=>{ if(state&&state.phase!=='lobby'&&Date.now()-_lastActivity>IDLE_MS){ bump(); state=freshState(); saveNow(); renderHost(); } },30000);
  renderHost();
}
function playerUrl(){return location.origin+location.pathname+'?role=player&room='+ROOM;}
function makeQR(el,size){
  el.innerHTML=''; el.style.position='relative'; el.style.width=size+'px'; el.style.height=size+'px';
  try{
    new QRCode(el,{text:playerUrl(),width:size,height:size,colorDark:'#1a3a5c',colorLight:'#ffffff',correctLevel:(window.QRCode&&QRCode.CorrectLevel?QRCode.CorrectLevel.H:2)});
    const s=Math.round(size*0.22), pad=Math.max(3,Math.round(size*0.014));
    const logo=document.createElement('img'); logo.src=LOGO;
    logo.style.cssText=`position:absolute;left:50%;top:50%;width:${s}px;height:${s}px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;padding:${pad}px;box-sizing:content-box`;
    el.appendChild(logo);
  }catch(e){ el.textContent=playerUrl(); }
}
function openQRFull(){ const q=document.getElementById('qrFull'); q.classList.remove('hide');
  q.innerHTML=`<div class="panel"><div id="qrBig" style="margin:0 auto"></div><div class="pin-label" style="margin-top:14px">Game PIN</div><div class="pin">${ROOM}</div><div class="joinurl">${playerUrl()}</div><div class="kicker" style="margin-top:12px">tap anywhere to close</div></div>`;
  makeQR(document.getElementById('qrBig'),Math.min(520,Math.round(innerHeight*0.6))); }
function closeQRFull(){ document.getElementById('qrFull').classList.add('hide'); }
function hostReset(){ if(!confirm('Start a fresh game in this room? Everyone will need to rejoin.')) return; bump(); clearTimers(); state=freshState(); saveNow(); renderHost(); }

function setSetting(k,v){ if(!/_whatif$/.test(state.phase)) return; bump(); state.whatif=state.whatif||{}; state.whatif[k]=v; save(); renderHost(); }
function resetWhatIf(){ bump(); state.whatif={}; save(); renderHost(); }
function hostAdvance(){
  const i=PHASES.indexOf(state.phase); if(i<0||i>=PHASES.length-1) return;
  if(state.phase==='lobby'&&!Object.keys(state.players).length) return;
  bump(); state.phase=PHASES[i+1]; state.nonce++; if(/_whatif$/.test(state.phase)) state.whatif={}; save(); renderHost();
}
function hostBack(){ const i=PHASES.indexOf(state.phase); if(i<=0) return; bump(); state.phase=PHASES[i-1]; state.nonce++; if(/_whatif$/.test(state.phase)) state.whatif={}; save(); renderHost(); }

function hostHandleAction(a){
  if(!a||!a.type||!state) return; bump();
  if(a.type==='join'){
    const name=String(a.name||'').slice(0,16).trim(); const age=Math.min(70,Math.max(10,parseInt(a.age,10)||0));
    if(!name||!age) return;
    if(!state.players[a.id]){ const n=Object.keys(state.players).length;
      state.players[a.id]={id:a.id,name,age,av:AV_EMOJI[n%AV_EMOJI.length],color:AV_COLOR[n%AV_COLOR.length],guess:{},pledge:0}; }
    else { state.players[a.id].name=name; state.players[a.id].age=age; }
    save(); if(state.phase==='lobby'||/_ask$/.test(state.phase)) renderHost();
  }
  else if(a.type==='guess'){
    const p=state.players[a.id]; const rk=roundOf(state.phase);
    if(!p||!rk||state.phase!==rk+'_ask'||a.round!==rk) return;
    p.guess[rk]=Math.max(0,Math.round(+a.value||0)); save(); renderHost();
  }
  else if(a.type==='pledge'){
    const p=state.players[a.id]; if(!p||state.phase!=='pledge') return;
    p.pledge=Math.max(0,Math.round(+a.value||0)); save(); renderHost();
  }
}

/* ── host render ──────────────────────────────────────────────── */
const NEXT_LABEL={lobby:'Start · Round 1 →',r1_ask:'Reveal →',r1_reveal:'What if…? →',r1_whatif:'Round 2 →',r2_ask:'Reveal →',r2_reveal:'What if…? →',r2_whatif:'Round 3 →',r3_ask:'Reveal →',r3_reveal:'What if…? →',r3_whatif:'Make it real →',pledge:'Wrap up →',end:''};
function renderHost(){
  clearTimers(); postLive();
  const h=document.getElementById('host'); const ph=state.phase;
  const lobby=ph==='lobby';
  document.getElementById('joinCorner').style.display=lobby?'none':'flex';
  h.classList.toggle('has-corner',!lobby);
  const kh=document.getElementById('keyHint'); kh.innerHTML=lobby?'<b>Space</b> starts once someone has joined':'<b>Space</b> / <b>→</b> next · <b>←</b> back'; kh.style.display=/_(reveal|whatif)$/.test(ph)?'none':'block';
  document.getElementById('hostBack').style.display=lobby?'none':'block';
  const nx=document.getElementById('hostNext'); nx.textContent=NEXT_LABEL[ph]||''; nx.style.display=(lobby||!NEXT_LABEL[ph])?'none':'block';
  if(lobby) h.innerHTML=tplLobby();
  else if(/_ask$/.test(ph)) h.innerHTML=tplAsk(roundOf(ph));
  else if(ph==='r1_reveal') h.innerHTML=tplReveal1();
  else if(ph==='r2_reveal') h.innerHTML=tplReveal2();
  else if(ph==='r3_reveal') h.innerHTML=tplReveal3();
  else if(/_whatif$/.test(ph)) h.innerHTML=tplWhatIf(roundOf(ph));
  else if(ph==='pledge') h.innerHTML=tplPledge();
  else if(ph==='end') h.innerHTML=tplEnd();
  if(lobby) makeQR(document.getElementById('lobbyQr'),210);
  runCountUps();
}
// Live "what if" levers on the reveal screens. Flipping one re-runs every number on the projector AND on
// every phone — the room watches ₹1.15 L a month become ₹8.5k when the finish line moves from 40 to 60.
function whatIf(rk){
  const parts=[`<span class="grp"><span class="wl">By age</span>${chipRow('targetAge',[40,50,60],v=>v)}</span>`,
               `<span class="grp"><span class="wl">Return</span><input type="range" class="rate" min="6" max="18" step="0.5" value="${W().rate}" oninput="document.getElementById('rateV').textContent=(+this.value)+'%'" onchange="setSetting('rate',+this.value)"><b class="rate-v" id="rateV">${W().rate}%</b></span>`];
  if(rk==='r2') parts.push(`<span class="grp"><span class="wl">Wait</span>${chipRow('delayYears',[3,5,10],v=>v+' yrs')}</span>`);
  if(rk==='r3') parts.push(`<span class="grp"><span class="wl">A month</span>${chipRow('flipSip',[2000,5000,10000],fmtMoney)}</span>`);
  if(rk!=='r3') parts.push(`<span class="grp"><span class="wl">Target</span>${chipRow('target',[10000000,50000000,100000000],fmtMoney)}</span>`);
  parts.push(`<button class="chip" onclick="resetWhatIf()" title="Back to the rules the room played">↺ as played</button>`);
  return `<div class="glass whatif"><span class="wk">What if…</span>${parts.join('')}</div>`;
}
function chipRow(k,opts,fmtf){ return opts.map(v=>`<button class="chip ${W()[k]===v?'on':''}" onclick="setSetting('${k}',${v})">${fmtf(v)}</button>`).join(''); }
function tplLobby(){
  const ps=playersSorted(), s=S(), n=ps.length;
  return `<div class="stage">
    <img class="hero-mark" src="${LOGO}" alt="">
    <div>
      <div class="presents">Investing for Mummies presents</div>
      <h1 class="title">${GAME_NAME}</h1>
      <p class="tag">${TAGLINE}</p>
    </div>
    <div class="lobby-grid">
      <div class="panel lobby-card">
        <h2>📲 Scan to join</h2>
        <p class="scan-how">Point your phone camera at the code, then type your name and age.</p>
        <div id="lobbyQr" onclick="openQRFull()" title="Tap to enlarge"></div>
        <div class="qr-hint" onclick="openQRFull()">⛶ Tap the QR to enlarge for the room</div>
        <div class="pin-label">or enter Game PIN</div>
        <div class="pin">${ROOM}</div>
        <div class="joinurl">${playerUrl().replace(/^https?:\/\//,'')}</div>
      </div>
      <div class="panel lobby-card">
        <h2>🪑 In the room <span class="count-big">${n}</span></h2>

function chart1(ps,s,label){

  const X=a=>L+(a-a0)/(a1-a0)*(W-L-R), Y=v=>T+(1-v/ymax)*(H-T-B);
  const path=pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ');
  const ticks=[0.25,0.5,0.75,1].map(f=>`<text x="${L-8}" y="${Y(ymax*f/1.05)+4}" text-anchor="end" font-size="10" font-weight="800" fill="#9fc2bb">${fmtMoney(ymax*f/1.05)}</text><line x1="${L}" x2="${W-R}" y1="${Y(ymax*f/1.05)}" y2="${Y(ymax*f/1.05)}" stroke="rgba(255,255,255,.08)"/>`).join('');
  const xs=[]; for(let a=Math.ceil(a0/2)*2;a<=a1;a+=2) xs.push(`<text x="${X(a)}" y="${H-B+16}" text-anchor="middle" font-size="10" font-weight="800" fill="#9fc2bb">${a}</text>`);

  <svg class="chart" viewBox="0 0 ${W} ${H}">${ticks}${xs.join('')}<path d="${path}" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>${dots}<text x="${W-R}" y="${H-3}" text-anchor="end" font-size="9" font-weight="800" fill="#9fc2bb">age you start →</text></svg>`;
}

async function initPlayer(){
  document.getElementById('player').classList.remove('hide');
  document.body.classList.add('player-bg');
  if(!ROOM){ document.getElementById('player').innerHTML=shell('<div class="card center"><h2>Scan the QR on the screen</h2><p>or open the link with the game PIN.</p></div>'); return; }
  joinChannel();
  try{ const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle(); if(data&&data.state)state=data.state; }catch(e){}
  renderPlayer();
  setInterval(async()=>{ // safety net for dropped realtime events
    if(!me())return;
    try{ const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle();
      if(data&&data.state&&data.state.updatedAt!==(state&&state.updatedAt)){ state=data.state; _lastStateAt=Date.now(); renderPlayer(); }
    }catch(e){}
  },2500);
  // Tap-to-rejoin (build-guide): iOS kills the socket during a phone call; if the tab comes back
  // and nothing arrives for a few seconds, offer a reload. Identity is in localStorage so it's safe.
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ hiddenAt=Date.now(); return; }
    if(!hiddenAt||Date.now()-hiddenAt<8000) return;
    const seen=_lastStateAt;
    setTimeout(()=>{ if(_lastStateAt===seen&&me()){ const o=document.createElement('div'); o.className='rejoin'; o.innerHTML='<div><h2>Tap to rejoin</h2><p>Your phone lost the game for a moment.</p></div>'; o.onclick=()=>location.reload(); document.body.appendChild(o); } },4000);
  });
}

// WhatsApp share (§20): one function, message encoded at runtime, app URL appended — never a bare wa.me href.
function ifmShare(msg){ window.open('https://wa.me/?text='+encodeURIComponent(msg+'\n\n👉 https://ifm-deploy.vercel.app'),'_blank'); }
const WA_ICON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>';
let _shareMsg='';
function waBtn(msg,label){ _shareMsg=msg; return `<button class="p-btn wa" onclick="ifmShare(_shareMsg)">${WA_ICON}<span>${label}</span></button>`; }
function pledgeText(p,s,val){ return `🌱 ${p.name}, ${p.age}: I'm starting a SIP of ${fmtMoney(val)} a month — starting THIS month.\n\nAt a cautious ${PR()}% a year that's ${fmtMoney(fvOf(val,calc(p,s).flipYrs,PR()))} by ${s.flipAge}.\n\nThe Wealth Hack · Investing for Mummies`; }
function numbersText(p,s){ const k=calc(p,s); return `📊 ${p.name}, ${p.age} — my numbers from ${GAME_NAME}:\n\n• ${fmtMoney(s.target)} by ${k.horizon}, start now: ${fmtMoney(k.now)}/month\n• Start ${k.delay} years late: ${fmtMoney(k.late)}/month\n• ${fmtMoney(s.flipSip)}/month until ${s.flipAge} becomes: ${fmtMoney(k.flip)}${p.pledge?`\n• My pledge: ${fmtMoney(p.pledge)}/month → ${fmtMoney(fvOf(p.pledge,k.flipYrs,PR()))} by ${s.flipAge} (at ${PR()}%)`:''}\n\nAssumes ${s.rate}% a year. Investing for Mummies`; }

function renderPlayer(){
  const el=document.getElementById('player'); if(!state){ el.innerHTML=shell('<div class="card center"><h2>Finding the game…</h2><p>Room '+esc(ROOM)+'</p></div>'); return; }
  const p=me(); const ph=state.phase, rk=roundOf(ph), s=state.settings;
  if(ph!==_lastPhase){ _pendingVal=0; _lastPhase=ph; }
  if(!state.whatif) state.whatif={};
  if(!p){
    if(joinSent&&ph==='lobby') return el.innerHTML=shell(`<div class="card center"><h2>Joining…</h2><p>${esc(myName)}, ${esc(myAge)}</p></div>`);
    joinSent=false;
    return el.innerHTML=shell(`<div class="card"><h2>Your name and <em>your age</em></h2><p>Your age decides your number, so be honest.</p>
      <div class="field"><div class="lbl">Name</div><input id="nameInput" class="inp" maxlength="16" placeholder="First name" value="${esc(myName)}" autocomplete="off"></div>
      <div class="field"><div class="lbl">Age</div><input id="ageInput" class="inp" type="number" inputmode="numeric" min="10" max="70" placeholder="e.g. 22" value="${esc(myAge)}"></div>
      <button class="p-btn" onclick="doJoin()">Join the game →</button></div>`);
  }
  if(ph==='lobby') return el.innerHTML=shell(`<div class="card center"><div class="av" style="background:${p.color}">${p.av}</div><h2>You're in, ${esc(p.name)}.</h2><p>Age ${p.age}. Eyes on the screen — the teacher starts the game.</p></div>`);
  if(rk&&/_ask$/.test(ph)){
    const R=ROUNDS[rk]; const locked=myLockedNonce[rk]===state.nonce||(p.guess[rk]>0&&myLockedNonce[rk]!==-1);
    const val=myLocal[rk]||p.guess[rk]||0; const note=R.phoneNote(p,s);
    if(locked) return el.innerHTML=shell(`<div class="card"><div class="lbl">Round ${R.n} · ${R.title}</div><h2>${R.phoneQ(p,s)}</h2>
      <div class="locked"><div class="lbl">Locked in ✓</div><div class="v">${fmtMoney(val)}</div><div class="u">${R.unit}</div></div>
      <p style="margin:0 0 4px">Watch the screen for the reveal.</p><button class="p-btn outline" onclick="pChange('${rk}')">Change my guess</button></div>`);
    return el.innerHTML=shell(`<div class="card"><div class="lbl">Round ${R.n} · ${R.title}</div><h2>${R.phoneQ(p,s)}</h2><p>${note||'Guess. Nobody gets it right first time.'}</p>
      <div class="chips">${R.chips.map(v=>`<button class="chip ${v===val?'on':''}" data-v="${v}" onclick="pickChip(${v})">${fmtMoney(v)}</button>`).join('')}</div>
      <div class="field"><div class="lbl">Your guess · ${R.unit}</div><div class="inp-wrap"><span class="rs">₹</span><input id="moneyInput" class="inp money" inputmode="numeric" placeholder="0" oninput="onMoney(this)" value="${val?indianFormat(val):''}"></div><span class="sh-badge" id="shBadge">${val?fmtMoney(val):''}</span></div>
      <button class="p-btn" id="lockBtn" onclick="pLock('${rk}')" ${val?'':'disabled'}>Lock it in →</button></div>`);
  }
  if(rk&&/_reveal$/.test(ph)){
    const k=calc(p,s); const real=realFor(p,rk,s); const g=p.guess[rk]||0; const o=offBy(g,real); const R=ROUNDS[rk];
    let line='';
    if(rk==='r1') line=`<div class="fb">Wait just <b>one year</b> and your number becomes <b>${fmtMoney(k.plus1)}</b> a month — <b>${fmtMoney(k.plus1-k.now)}</b> more, every month, for the rest of the way.</div>`;
    if(rk==='r2') line=`<div class="fb">Starting at ${p.age}: <b style="color:var(--teal-d)">${fmtMoney(k.now)}</b>. Starting at ${p.age+k.delay}: <b>${fmtMoney(k.late)}</b>. Those ${k.delay} years cost you <b>${fmtMoney(k.late-k.now)}</b> every month.</div>`;
    if(rk==='r3') line=`<div class="fb good">You put in ${fmtMoney(s.flipSip*12*k.flipYrs)} in total. Growth does the rest. Had you started 5 years earlier: <b>${fmtMoney(k.flipEarly)}</b>.</div>`;
    return el.innerHTML=shell(`<div class="card"><div class="lbl">Round ${R.n} · the real number</div>
      <div class="real"><div class="lbl">${rk==='r3'?`${fmtMoney(s.flipSip)} a month until ${s.flipAge} becomes`:`You need, every month`}</div><div class="v ${rk==='r2'?'red':''}">${fmtMoney(real)}</div><div class="g">you guessed ${g?fmtMoney(g):'—'}</div><span class="off ${o.cls}">${o.txt}</span></div>${line}</div>`);
  }
  if(rk&&/_whatif$/.test(ph)){
    const w=Object.assign({},s,state.whatif||{}); const a=realFor(p,rk,s), b=realFor(p,rk,w); const R=ROUNDS[rk];
    const rule=rk==='r3'?`${fmtMoney(w.flipSip)} a month until ${w.flipAge}, at ${w.rate}%`:rk==='r2'?`${fmtMoney(w.target)} by ${horizonFor(p,w)}, starting ${calc(p,w).delay} years late, at ${w.rate}%`:`${fmtMoney(w.target)} by ${horizonFor(p,w)}, at ${w.rate}%`;
    return el.innerHTML=shell(`<div class="card"><div class="lbl">Round ${R.n}B · what if…?</div><h2>The rules on screen are changing. <em>So is your number.</em></h2><p>${rule}</p>
      <div class="real"><div class="lbl">${rk==='r3'?'it becomes':'you need, every month'}</div><div class="v ${b>a?'red':''}">${fmtMoney(b)}</div><div class="g">as played: ${fmtMoney(a)}</div>${Math.abs(b-a)>=1?`<span class="off ${b>a?'low':''}">${b>a?'+':'−'}${fmtMoney(Math.abs(b-a))}</span>`:''}</div></div>`);
  }
  if(ph==='pledge'){
    const locked=myLockedNonce.pledge===state.nonce||p.pledge>0; const val=myLocal.pledge||p.pledge||0;
    if(locked) return el.innerHTML=shell(`<div class="card center"><div class="lbl">Your pledge</div><h2>${fmtMoney(val)} a month. <em>Starting this month.</em></h2><p>By ${s.flipAge} that's <b style="color:var(--teal-d)">${fmtMoney(fvOf(val,calc(p,s).flipYrs,PR()))}</b> at a cautious ${PR()}%. It's on the wall.</p>${waBtn(pledgeText(p,s,val),'Share via WhatsApp')}<button class="p-btn outline" onclick="myLockedNonce.pledge=-1;p.pledge=0;renderPlayer()">Change amount</button></div>`);
    return el.innerHTML=shell(`<div class="card"><div class="lbl">Make it real</div><h2>I will start a SIP of <em>₹ ____</em> this month.</h2><p>Any amount. The number matters less than the month.</p>
      <div class="chips">${PLEDGE_CHIPS.map(v=>`<button class="chip" data-v="${v}" onclick="pickChip(${v})">${fmtMoney(v)}</button>`).join('')}</div>
      <div class="field"><div class="lbl">Per month</div><div class="inp-wrap"><span class="rs">₹</span><input id="moneyInput" class="inp money" inputmode="numeric" placeholder="0" oninput="onMoney(this)"></div><span class="sh-badge" id="shBadge"></span></div>
      <button class="p-btn gold" id="lockBtn" onclick="pPledge()" disabled>I'm in →</button></div>`);
  }
  if(ph==='end'){
    const k=calc(p,s);
    return el.innerHTML=shell(`<div class="card"><div class="lbl">Your numbers · keep these</div><h2>${esc(p.name)}, ${p.age}</h2>
      <div class="sum">
        <div class="row"><span>${fmtMoney(s.target)} by ${k.horizon}, start now</span><b>${fmtMoney(k.now)}/mo</b></div>
        <div class="row"><span>…start ${k.delay} years late</span><b class="red">${fmtMoney(k.late)}/mo</b></div>
        <div class="row"><span>${fmtMoney(s.flipSip)}/mo until ${s.flipAge}</span><b>${fmtMoney(k.flip)}</b></div>
        <div class="row"><span>Your pledge</span><b>${p.pledge?fmtMoney(p.pledge)+'/mo':'—'}</b></div>
        ${p.pledge?`<div class="row"><span>…by ${s.flipAge} at ${PR()}%</span><b>${fmtMoney(fvOf(p.pledge,k.flipYrs,PR()))}</b></div>`:''}
      </div>${waBtn(numbersText(p,s),'Share via WhatsApp')}<p style="margin:12px 0 0;text-align:center">Then open a SIP before the month ends.</p></div>`);
  }
  el.innerHTML=shell('<div class="card center"><h2>Eyes on the screen</h2></div>');
}
function shell(inner){ const rate=state&&state.settings?state.settings.rate:12;
  return `<div class="wrap">
    <div class="game-hero" data-logo><img class="hero-logo-wide" src="${PRINT_LOGO_SRC}" alt="Investing for Mummies"><span class="pill">Live game · room ${esc(ROOM||'')}</span><h1>${GAME_NAME}</h1><p>${TAGLINE}</p></div>
    ${inner}
    <div class="foot">Investing for Mummies · assumes ${rate}% a year, not a promise</div></div>`; }

if(isHost) initHost(); else initPlayer();
</script>
</body>
</html>
