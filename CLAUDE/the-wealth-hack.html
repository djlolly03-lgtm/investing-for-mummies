<style>
/* ── IFM palette (Brand Guidelines §3) ─────────────────────────── */
:root{
  --navy:#1a3a5c;--ink:#1a3a5c;--navy-lt:#264d78;--teal:#2a9d8f;--teal-d:#1f7d72;--muted:#5a7d8a;
  --cream:#f7faf9;--white:#fff;--mint:#bde9e4;--mint-lt:#e0f3f0;--gold:#c9a84c;--gold-lt:#f5f0e0;
  --success:#27AE60;--danger:#c0392b;--wa:#25D366;
  --ink-night:#050c15;--gold-hi:#f7dea0;--ivory:#f6f1e7;--mist:#9bb0ae;
  /* projector-only tones: the studio is dark, so text and accents lift to these */
  --stage-ink:#eaf6f3;--stage-sub:#9fc2bb;--teal-bright:#2dd4bf;--gold-bright:#f5c451;--coral:#ff8f3f;
  --glass:rgba(10,26,34,.72);--glass-edge:rgba(255,255,255,.12);
  --shadow:0 2px 12px rgba(26,58,92,.06);--shadow-lg:0 16px 48px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Manrope',sans-serif;color:var(--navy);background:var(--cream)}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0}
button,input{font-family:'Manrope',sans-serif}
button{cursor:pointer}
.hide{display:none!important}

/* ════════ HOST · projector ════════ */
body.host-bg{background:linear-gradient(180deg,rgba(6,16,28,.30) 0%,rgba(6,16,28,.55) 55%,rgba(6,16,28,.82) 100%),url('wealth-hack-stage.jpg') center/cover fixed no-repeat;color:var(--stage-ink);min-height:100vh}
#host{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 32px 110px}
.stage{width:100%;max-width:1240px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.presents{font-size:.72rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--stage-ink);text-align:center;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.title{font-size:clamp(1.9rem,3.6vw,2.9rem);line-height:1.1;text-align:center;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.title em{font-style:italic;color:var(--gold-bright)}
.tag{font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:700;color:var(--stage-ink);text-align:center;margin:0;max-width:820px;line-height:1.45;text-shadow:0 1px 14px rgba(0,0,0,.75)}
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-lg)}
.panel{background:#fff;color:var(--navy);border-radius:16px;box-shadow:var(--shadow-lg)}
.kicker{font-size:.66rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.glass .kicker{color:var(--stage-sub)}
.btn{font:800 .95rem 'Manrope',sans-serif;color:#1a1203;border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,var(--gold-hi),#d79f34);box-shadow:0 12px 32px rgba(233,191,98,.3),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(233,191,98,.42),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:disabled{background:rgba(255,255,255,.07);color:rgba(246,241,231,.42);box-shadow:none;border:1px solid rgba(255,255,255,.14);cursor:not-allowed;transform:none}
.btn.big{font-size:1.1rem;padding:17px 34px}
.btn.gold{background:linear-gradient(135deg,var(--gold-hi),#d79f34)}

body.host-bg.end-bg{background:linear-gradient(180deg,rgba(6,16,28,.15) 0%,rgba(6,16,28,.35) 100%),url('wealth-hack-hero.jpg') center/cover fixed no-repeat}
/* live backdrop: the looping rooftop video sits behind everything on the projector; the closing screen swaps to the still jars */
.bgv,.bgshade{display:none;position:fixed;inset:0;width:100%;height:100%}
.bgv{object-fit:cover;z-index:-2}
.bgshade{z-index:-1;background:linear-gradient(180deg,rgba(6,16,28,.30) 0%,rgba(6,16,28,.55) 55%,rgba(6,16,28,.82) 100%)}
body.host-bg .bgv,body.host-bg .bgshade{display:block}
body.host-bg.end-bg .bgv,body.host-bg.end-bg .bgshade{display:none}
/* closing screen: content lives in the dark gap between the two jars */
.end-stage{max-width:520px;gap:12px}
.end-stage .title{font-size:clamp(1.7rem,2.9vw,2.4rem)}
.end-stage .end-grid{grid-template-columns:1fr;gap:10px;max-width:none}
.end-stage .end-grid .stat{padding:12px 16px}
.end-stage .tag{font-size:.95rem}
/* lobby */
.lobby-stage{gap:16px}
.hero-mark{display:block;width:64px;height:64px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 1px rgba(233,191,98,.5),0 0 56px rgba(233,191,98,.4),0 18px 44px rgba(0,0,0,.5)}
.hero-title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(3rem,6.2vw,5.2rem);line-height:1;letter-spacing:-.02em;color:#fff;text-align:center;font-variation-settings:'opsz' 144;text-shadow:0 6px 44px rgba(0,0,0,.6)}
.hero-title .the{display:block;font-style:italic;font-weight:500;font-size:.36em;color:var(--gold-hi);letter-spacing:.01em;margin-bottom:-.12em}
.hero-tag{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(1.05rem,1.7vw,1.4rem);color:#d6e2df;text-align:center;margin:0;text-shadow:0 2px 20px rgba(0,0,0,.85)}
.hero-tag b{font-weight:600;color:var(--gold-hi)}
.lobby-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;width:100%;max-width:1040px;align-items:stretch}
.lcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 26px 24px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03)),rgba(6,14,22,.58);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.lcard::before{content:"";position:absolute;left:36px;right:36px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9}
.lk{display:flex;align-items:center;gap:10px;font-size:.68rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--stage-sub)}
.lk i{display:block;width:22px;height:1px;background:var(--gold)}
.qr-tile{margin:18px 0 12px;padding:14px;border-radius:22px;background:#fff;line-height:0;cursor:zoom-in;box-shadow:0 0 0 1px rgba(233,191,98,.6),0 0 74px rgba(233,191,98,.3),0 26px 60px rgba(0,0,0,.55)}
.scan-how{font-size:.86rem;font-weight:600;color:var(--stage-sub);margin:6px 0 0;max-width:290px;line-height:1.45}
.pin-row{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pin-label{font-size:.62rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--stage-sub)}
.pin{font-family:'Fraunces',serif;font-weight:600;font-size:3.1rem;letter-spacing:.2em;padding-left:.2em;line-height:1;color:var(--gold-hi);text-shadow:0 0 40px rgba(233,191,98,.35)}
.joinurl{font-size:.7rem;word-break:break-all;font-weight:600;margin-top:10px;color:var(--stage-sub);opacity:.75}
.room-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.room-head h2{font-family:'Fraunces',serif;font-size:1.55rem;font-weight:600;color:var(--ivory)}
.count{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;background:rgba(233,191,98,.14);border:1px solid rgba(233,191,98,.4);color:var(--gold-hi);font:800 .95rem 'Manrope',sans-serif}
.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-start;align-content:flex-start;width:100%;min-height:92px;max-height:30vh;overflow:auto;padding:2px}
.pl{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700;font-size:.92rem;color:var(--ivory);animation:pop .3s ease-out}
.pl .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;color:#fff;flex:none}
.pl .age{color:var(--gold-hi);font-size:.8rem;font-weight:800}
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 8px}
.slots span{width:34px;height:34px;border-radius:50%;border:1px dashed rgba(255,255,255,.28)}
.waiting{color:var(--stage-sub);font-family:'Fraunces',serif;font-style:italic;font-size:1rem;margin:0}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.plan{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 16px;text-align:left}
.plan>div{position:relative;padding:12px 14px 12px 14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:3px}
.plan i{position:absolute;top:10px;right:13px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:1.5rem;line-height:1;color:rgba(233,191,98,.55)}
.plan b{font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;color:var(--ivory);padding-right:26px;line-height:1.2}
.plan span{font-size:.78rem;font-weight:500;color:var(--stage-sub);line-height:1.4}
/* names are the hero of the room: big in small rooms, smaller as it fills */
.sz-xl .pl,.sz-lg .pl{font-weight:700}
.sz-xl .pl{gap:12px;padding:7px 22px 7px 7px;font-size:1.4rem}
.sz-xl .pl .av{width:48px;height:48px;font-size:1.5rem}
.sz-xl .pl .age{font-size:1.05rem}
.sz-lg .pl{gap:10px;padding:6px 18px 6px 6px;font-size:1.12rem}
.sz-lg .pl .av{width:38px;height:38px;font-size:1.2rem}
.sz-lg .pl .age{font-size:.9rem}
.players.sz-xl,.players.sz-lg{gap:10px}
.slots span{width:48px;height:48px}
.lcard .btn{width:100%;margin-top:auto}
.whatif{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:center;padding:9px 18px;border-radius:999px}
.whatif .wk{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--gold-bright);font-size:1rem}
.whatif .wl{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-sub);margin-right:3px}
.whatif .grp{display:flex;align-items:center;gap:5px}
.whatif .chip{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);border-radius:10px;padding:4px 10px;font:800 .76rem 'Manrope',sans-serif;transition:background .2s}
.whatif .chip:hover{background:rgba(255,255,255,.16)}
.whatif .chip.on{background:linear-gradient(135deg,var(--gold-hi),#d79f34);border-color:transparent;color:#1a1203}
.whatif .rate{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);outline:none;margin:0 6px;cursor:pointer}
.whatif .rate::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold-hi);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
.whatif .rate::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold-hi);border:2px solid #fff;cursor:grab}
.whatif .rate-v{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--gold-bright);min-width:44px;display:inline-block}

/* ask */
.q-panel{width:100%;max-width:1000px;padding:28px 36px;text-align:center;border-color:rgba(233,191,98,.5);animation:qpulse 2.6s ease-in-out infinite}
@keyframes qpulse{0%,100%{box-shadow:0 0 0 1px rgba(233,191,98,.22),0 0 40px rgba(233,191,98,.12),var(--shadow-lg)}50%{box-shadow:0 0 0 1px rgba(233,191,98,.45),0 0 70px rgba(233,191,98,.26),var(--shadow-lg)}}
.q-panel .q{font-family:'Fraunces',serif;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.22;font-weight:700;color:#fff;margin:0}
.q-panel .q em{font-style:italic;color:var(--gold-bright)}
.q-panel .why{margin:12px auto 0;font-size:1rem;color:var(--stage-sub);font-weight:700;max-width:820px;line-height:1.45}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-bright)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--teal-bright);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.prog{font-size:1.25rem;font-weight:800;color:var(--stage-ink)}
.prog b{color:var(--gold-bright);font-size:1.7rem;font-family:'Fraunces',serif}
.pl-wall{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1100px}
.pl-wall .pl{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);transition:opacity .3s}
.pl-wall .pl .age{color:var(--stage-sub)}
.pl-wall .pl.dim{opacity:.38}
.pl-wall .pl.lit{opacity:1;border-color:rgba(233,191,98,.7)}

/* reveal */
.rv{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;width:100%;align-items:start}
.rv-table{padding:8px 16px 6px}
.rv-head,.rv-row{display:grid;grid-template-columns:1.35fr 2.2fr .95fr 1.2fr 1.05fr;align-items:center;gap:12px;padding:8px 6px}
.rv-head{font-size:.62rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--stage-sub);border-bottom:1px solid var(--glass-edge)}
.rv-row{border-bottom:1px solid rgba(255,255,255,.07);font-weight:700;color:var(--stage-ink);opacity:0;animation:rise .4s ease-out forwards}
.rv-row:last-child{border-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv-row .nm{display:flex;align-items:center;gap:9px;font-weight:800}
.rv-row .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;color:#fff;flex:none}
.rv-row small{color:var(--stage-sub);font-weight:800}
.rv-row .guess{color:var(--stage-sub)}
.rv-row .real{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700;color:var(--teal-bright)}
.rv-row .real.hot{color:var(--gold-bright)}
.rv-row .off{font-size:.78rem;font-weight:800;text-transform:none;letter-spacing:.02em;border-radius:10px;padding:4px 9px;margin-top:0;text-align:center;background:rgba(45,212,191,.15);color:var(--teal-bright);white-space:nowrap}
.rv-row .off.low{background:rgba(255,143,63,.16);color:var(--coral)}
.rv-row .off.high{background:rgba(245,196,81,.16);color:var(--gold-bright)}
.rv-row .off.up{background:rgba(45,212,191,.18);color:var(--teal-bright)}
.rv-row .extra{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700;color:var(--coral)}
.side{display:flex;flex-direction:column;gap:12px}
.stat{padding:12px 16px}
.stat .big{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;color:#fff;line-height:1.1;margin-top:4px}
.stat .big.gold{color:var(--gold-bright)}
.stat .big.coral{color:var(--coral)}
.stat .big.teal{color:var(--teal-bright)}
.stat .sm{color:var(--stage-sub);font-weight:700;margin-top:4px;font-size:.88rem;line-height:1.45}
.stat .sm b{color:var(--stage-ink)}
.chart{width:100%;height:auto;display:block}
.past-note{margin:-6px 0 2px;font-family:'Fraunces',serif;font-style:italic;font-size:1rem;color:var(--stage-sub);text-align:center}
.punch{margin-bottom:10px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(1.15rem,2vw,1.6rem);color:var(--gold-bright);text-align:center;max-width:1000px;line-height:1.35;opacity:0;animation:rise .6s ease-out forwards}

/* life bar — today → (wait) → finish line */
.lb{position:relative;height:58px;min-width:180px}
.lb-c{position:absolute;left:0;right:0;top:0;text-align:center;font:700 .74rem 'Manrope',sans-serif;color:var(--stage-sub);white-space:nowrap}
.lb-c .lost{color:#ff8f3f;font-weight:800}.lb-c .grow{color:var(--gold-hi);font-weight:700}
.lb-track{position:absolute;left:0;right:0;top:24px;height:9px;border-radius:99px;background:rgba(255,255,255,.1)}
.lb-seg{position:absolute;top:0;height:100%;border-radius:99px;transition:left .5s ease,width .5s ease}
.lb-inv{background:linear-gradient(90deg,#d79f34,#f7dea0);box-shadow:0 0 14px rgba(233,191,98,.35)}
.lb-wait{background:repeating-linear-gradient(135deg,rgba(255,143,63,.95) 0 5px,rgba(255,143,63,.35) 5px 10px)}
.lb-dot{position:absolute;top:-4px;width:17px;height:17px;border-radius:50%;transform:translateX(-50%);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:left .5s ease}
.lb-dot.s{background:#ff8f3f}
.lb-flag{position:absolute;top:-3px;width:15px;height:15px;transform:translateX(-50%) rotate(45deg);background:var(--gold-hi);border:2px solid #1a1203;border-radius:3px;transition:left .5s ease}
.lb-t{position:absolute;top:38px;font:800 .82rem 'Manrope',sans-serif;color:var(--stage-ink);white-space:nowrap;transition:left .5s ease}
.lb-t.n{transform:translateX(-85%)}
.lb-t.s{transform:translateX(-10%);color:#ff8f3f}
.lb-t.f{transform:translateX(-50%);color:var(--gold-hi)}
.lb-t.l{transform:translateX(-50%);color:var(--stage-sub);font-weight:700;opacity:.75}
.lb-line{position:absolute;top:-9px;bottom:-9px;width:0;border-left:2px dashed rgba(255,255,255,.45);transform:translateX(-1px)}
.lb-c .past{color:var(--stage-sub);font-weight:700}
/* what-if control room */
.wi-stage{gap:12px}
.wi-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;width:100%;align-items:start}
.wi-left{display:flex;flex-direction:column;gap:14px}
.wi-score{padding:18px 20px;text-align:center}
.wi-score.on{border-color:rgba(233,191,98,.55);box-shadow:0 0 0 1px rgba(233,191,98,.25),0 0 60px rgba(233,191,98,.18),var(--shadow-lg)}
.wi-sc{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.wi-n{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:2.7rem;line-height:1.05;color:var(--gold-hi);margin:6px 0 2px;text-shadow:0 0 36px rgba(233,191,98,.3)}
.wi-n.dim{color:var(--stage-sub);font-size:1.9rem;text-shadow:none}
.wi-n.good{color:#6fe3d0}.wi-n.bad{color:#ff8f3f}
.wi-arrow{font-family:'Fraunces',serif;font-size:2rem;color:var(--gold)}
.wi-s{font-size:.72rem;font-weight:600;color:var(--stage-sub);line-height:1.3}
.wi-delta{margin-top:12px;padding:9px 12px;border-radius:12px;font-weight:800;font-size:1rem}
.wi-delta.good{background:rgba(111,227,208,.14);color:#6fe3d0}.wi-delta.bad{background:rgba(255,143,63,.14);color:#ff8f3f}
.wi-delta.idle{background:rgba(255,255,255,.06);color:var(--stage-sub);font-weight:600;font-size:.9rem}
.wi-ctl{padding:18px 20px 20px}

/* ════════ HOST type scale (20 Oct 2026) ════════

body.host-bg .rv-head{font-size:.9rem}
body.host-bg .rv-row{font-size:1.15rem}
body.host-bg .rv-row .nm{font-size:1.3rem}
body.host-bg .rv-row .guess{font-size:1.3rem}
body.host-bg .rv-row .real{font-size:2.1rem}
body.host-bg .rv-row .extra{font-size:1.8rem}

body.host-bg .stat .big{font-size:2.6rem}

body.host-bg .wi-s{font-size:1rem}
body.host-bg .wi-l{font-size:.95rem}
body.host-bg .wi-n{font-size:3.2rem}
body.host-bg .wi-n.dim{font-size:2.3rem}
body.host-bg .wi-delta{font-size:1.25rem}

/* poll / end */
.bars{width:100%;max-width:760px;display:grid;gap:10px}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-radius:14px;background:rgba(10,26,34,.72);border:1px solid var(--glass-edge);overflow:hidden;font-weight:700;font-size:1.05rem;color:var(--stage-ink)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(42,157,143,.5),rgba(45,212,191,.25));transition:width .5s ease}
.bar.lead .bar-fill{background:linear-gradient(90deg,rgba(201,168,76,.65),rgba(245,196,81,.3))}

.bar .bt,.bar .bn{position:relative;z-index:1}
.bar .bn{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--gold-bright);min-width:24px;text-align:right}
.opts{display:grid;gap:8px}
.optb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--mint);background:#fff;border-radius:12px;padding:13px 14px;font:700 .92rem 'Manrope',sans-serif;color:var(--navy);transition:border-color .2s,background .2s}
.optb .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--mint);flex:none;transition:.2s}
.optb.on{border-color:var(--teal);background:var(--mint-lt)}
.optb.on .dot{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 45%,transparent 50%)}
.wall{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:1000px}
.end-grid .stat{text-align:center;padding:20px}

/* chrome — same placement as the KBC quiz so the room sees one family of games */
.host-reset{position:fixed;top:6px;left:10px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Manrope',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-reset:hover{background:rgba(10,26,34,.95)}
.join-corner{position:fixed;top:6px;right:10px;z-index:95;display:flex;align-items:center;gap:9px;padding:3px 12px 3px 6px;border-radius:14px;cursor:zoom-in;background:linear-gradient(165deg,rgba(26,56,70,.9),rgba(10,26,34,.94));border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 26px rgba(0,0,0,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s}

.join-corner .jc-txt{text-align:left;line-height:1.2}
.join-corner .jc-lbl{color:var(--stage-sub);font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.join-corner .jc-pin{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;letter-spacing:.16rem;color:var(--gold-hi)}
.join-corner .jc-tap{color:var(--gold);font-size:.62rem;font-weight:800}
.key-hint{position:fixed;bottom:14px;right:16px;z-index:95;color:var(--stage-sub);font-size:.72rem;font-weight:800;background:rgba(10,26,34,.72);border:1px solid var(--glass-edge);padding:5px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}

.host-back{position:fixed;bottom:22px;left:16px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Manrope',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 15px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-next{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:95;min-width:340px;font:800 1.2rem 'Manrope',sans-serif;color:#1a1203;background:linear-gradient(135deg,var(--gold-hi),#d79f34);border:0;padding:17px 44px;border-radius:18px;box-shadow:0 16px 44px rgba(233,191,98,.38),0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55);transition:box-shadow .2s,transform .2s}

.gs-stairs i:nth-child(1){height:14px}.gs-stairs i:nth-child(2){height:24px;animation-delay:.15s}.gs-stairs i:nth-child(3){height:38px;animation-delay:.3s}.gs-stairs i:nth-child(4){height:52px;animation-delay:.45s}.gs-stairs i:nth-child(5){height:68px;animation-delay:.6s}
@keyframes gsstair{0%,100%{opacity:.55}50%{opacity:1}}
.gs-lbl{font:800 12px 'Manrope',sans-serif;letter-spacing:.18em;color:#9bb0ae;text-align:center}
.gs-real{font:600 52px/1.05 'Fraunces',serif;text-align:center;color:#f7dea0;text-shadow:0 0 30px rgba(233,191,98,.3)}
.gs-sub{font:700 15px 'Manrope',sans-serif;color:#9bb0ae;text-align:center}
.gs-gap{align-self:center;background:rgba(45,212,191,.14);color:#6fe3d0;font:800 18px 'Manrope',sans-serif;padding:6px 18px;border-radius:99px}
.gs-msg{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;font:600 15px/1.4 'Manrope',sans-serif;text-align:center;color:#eaf6f3}
.gs-msg.good{background:rgba(233,191,98,.14);color:#f7dea0}
.gs-punch{background:rgba(255,143,63,.14);border:1px solid rgba(255,143,63,.35);border-radius:14px;padding:10px 12px;font:700 15px/1.4 'Manrope',sans-serif;text-align:center;color:#ffc48f}
.gs-punch b{color:#ff8f3f}
.gs-lines{display:grid;gap:6px;margin:4px 0}
.gs-line{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:9px 12px;font:700 14px 'Manrope',sans-serif;color:#d6e2df}
.gs-line b{color:#f7dea0}
.gs-wa{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:16px;background:#25d366;color:#04210f;font:800 16px 'Manrope',sans-serif;box-shadow:0 5px 0 #168a43}
.gs-wa svg{width:22px;height:22px}
.gs-end{text-align:center!important;font-weight:800!important;color:#f7dea0!important}
.gs-foot{text-align:center;font:600 11px 'Manrope',sans-serif;color:rgba(155,176,174,.75);padding-top:4px}
/* keypad open: drop the extras so the question, the amount and LOCK IT IN all fit above the keyboard */
body.typing .gs-round,body.typing .gs-nudge,body.typing .ifm-disc{display:none}
body.typing .gs-years span{font-size:40px}
body.typing .gs-q{padding:8px 12px 10px}
body.typing .gs-wrap{gap:8px;padding-top:8px}

.gs-sync{font:800 12px 'Manrope',sans-serif;color:#ffb866;margin-top:4px}
.gs-sync.ok{color:#2dd4bf}

/* meeting round: winner pop-up, put-in line, ladder with totals, podium finisher card */
.winpop{position:fixed;inset:0;z-index:145;display:grid;place-items:center;background:radial-gradient(circle,rgba(5,12,21,.82),rgba(5,12,21,.45) 72%);animation:wpfade .35s ease-out;transition:opacity .6s;pointer-events:none}
.winpop.out{opacity:0}
@keyframes wpfade{from{opacity:0}to{opacity:1}}
.wp-in{text-align:center;animation:wppop .7s cubic-bezier(.2,1.5,.3,1)}
@keyframes wppop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.wp-medal{font-size:7rem;line-height:1}
.wp-lbl{font:800 1.5rem 'Manrope',sans-serif;letter-spacing:.26em;color:var(--gold-hi);margin:.3rem 0 .4rem}
.wp-name{font:700 clamp(4rem,11vw,9rem)/1.05 'Fraunces',serif;color:#fff;text-shadow:0 0 70px rgba(245,196,81,.8),0 6px 30px rgba(0,0,0,.6);padding:0 3vw}
body.host-bg .invest{font-size:1.25rem;font-weight:700;color:var(--stage-ink);text-align:center;margin-top:-.2rem}
body.host-bg .invest b{color:var(--gold-hi)}
body.hc.host-bg .invest{font-size:1.1rem}
body.host-bg .pl-put{display:block;font-size:1.1rem;font-weight:700;color:var(--stage-sub);margin-top:.25rem}
body.host-bg .pl-put b{color:var(--coral)}
body.hc.host-bg .pl-put{font-size:.98rem}
body.host-bg .ladder{max-width:74rem}
body.host-bg .lhead,body.host-bg .lrow{grid-template-columns:8rem 1fr 9rem 11rem 11rem}
body.host-bg .lhead{display:grid;gap:1rem;padding:0 0 .4rem;font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-sub);border-bottom:1px solid rgba(255,255,255,.1)}
body.host-bg .lhead span:nth-child(3){text-align:right}
body.host-bg .lp b{display:block;font-family:'Fraunces',serif;font-size:1.5rem;color:var(--stage-ink);line-height:1.05}
body.host-bg .lp small{display:block;font-size:.85rem;font-weight:700;color:var(--coral)}
body.host-bg .ly{font-size:1.5rem}
body.hc.host-bg .lp b{font-size:1.3rem}
.gs-winner{text-align:center;align-items:center;gap:6px;background:linear-gradient(180deg,rgba(245,196,81,.2),rgba(10,26,34,.9) 60%)!important;border:1.5px solid rgba(245,196,81,.8)!important;box-shadow:0 0 60px rgba(245,196,81,.25),0 20px 50px rgba(0,0,0,.45)!important}
.gs-winner.m2{background:linear-gradient(180deg,rgba(207,214,220,.18),rgba(10,26,34,.9) 60%)!important;border-color:rgba(207,214,220,.7)!important;box-shadow:0 0 50px rgba(207,214,220,.18),0 20px 50px rgba(0,0,0,.45)!important}
.gs-winner.m3{background:linear-gradient(180deg,rgba(208,138,78,.2),rgba(10,26,34,.9) 60%)!important;border-color:rgba(208,138,78,.7)!important;box-shadow:0 0 50px rgba(208,138,78,.2),0 20px 50px rgba(0,0,0,.45)!important}
.gs-wdisc{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;font:700 46px 'Fraunces',serif;color:#2a1a00;background:radial-gradient(circle at 35% 28%,#fff6c4,#f5c451 55%,#c98f12);box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.5)}
.m2 .gs-wdisc{background:radial-gradient(circle at 35% 28%,#fff,#d3dae0 55%,#8f9aa5)}
.m3 .gs-wdisc{background:radial-gradient(circle at 35% 28%,#ffdfc0,#d48f52 55%,#8f5424)}
.gs-wtitle{font:800 14px 'Manrope',sans-serif;letter-spacing:.26em;color:#f7dea0}
.gs-wname{font:700 44px/1.05 'Fraunces',serif;color:#fff;word-break:break-word}
.gs-wpts{font:700 15px 'Manrope',sans-serif;color:#9bb0ae;margin-bottom:6px}
.gs-winner .gs-lines{width:100%}
.gs-link{display:block;text-align:center;margin-top:8px;font:800 14px 'Manrope',sans-serif;color:#f7dea0;text-decoration:none}

/* the money the delay costs: the hurt number */
body.host-bg .hurt-row{display:flex;justify-content:center;align-items:flex-end;gap:2.4rem;flex-wrap:wrap}
body.host-bg .hr-a b{display:block;font-family:'Fraunces',serif;font-size:2rem;color:var(--coral);line-height:1.05}
body.host-bg .hr-b strong{display:block;font-family:'Fraunces',serif;font-weight:700;font-size:3.6rem;line-height:1;color:var(--coral);text-shadow:0 0 50px rgba(255,143,63,.5);animation:pctpulse 1.3s ease-in-out infinite}
body.host-bg .hurt-row span{display:block;font-size:1.05rem;font-weight:800;color:var(--stage-ink)}
body.hc.host-bg .hr-b strong{font-size:2.7rem}
body.hc.host-bg .hr-a b{font-size:1.6rem}
body.host-bg .pl-foot{font-weight:400}
body.host-bg .lp.hot b{display:block;font-family:'Fraunces',serif;font-weight:700;color:var(--coral);line-height:1.02;text-shadow:0 0 24px rgba(255,143,63,.35)}
body.host-bg .lp b.base{color:var(--stage-sub);font-size:1.3rem}
body.host-bg .lhead,body.host-bg .lrow{grid-template-columns:8rem 1fr 8.5rem 9rem 14rem}
/* the finisher's poster: a card made to be screenshotted */
.gp-poster{position:relative;overflow:hidden;border-radius:26px;min-height:520px;padding:18px 16px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid #f5c451;box-shadow:0 0 0 4px rgba(245,196,81,.15),0 0 70px rgba(245,196,81,.35),0 24px 60px rgba(0,0,0,.6);color:#fff;--c1:#fff6c4;--c2:#f5c451;--c3:#c98f12;--rim:#f5c451}
.gp-poster.m2{--c1:#ffffff;--c2:#d3dae0;--c3:#8f9aa5;--rim:#d3dae0;border-color:#d3dae0;box-shadow:0 0 0 4px rgba(211,218,224,.14),0 0 60px rgba(211,218,224,.28),0 24px 60px rgba(0,0,0,.6)}
.gp-poster.m3{--c1:#ffdfc0;--c2:#d48f52;--c3:#8f5424;--rim:#d48f52;border-color:#d48f52;box-shadow:0 0 0 4px rgba(212,143,82,.14),0 0 60px rgba(212,143,82,.28),0 24px 60px rgba(0,0,0,.6)}
.gp-bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,21,.35) 0%,rgba(5,12,21,.55) 45%,rgba(5,12,21,.92) 100%),url('assets/wealth-hack-tree.webp') 50% 0/cover no-repeat;z-index:0}
.gp-rays{position:absolute;left:50%;top:92px;width:520px;height:520px;margin-left:-260px;background:repeating-conic-gradient(from 0deg,rgba(255,236,160,.28) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 66%);mask:radial-gradient(circle,#000 8%,transparent 66%);animation:gprays 26s linear infinite;z-index:0}
@keyframes gprays{to{transform:rotate(360deg)}}
.gp-coins{position:absolute;inset:0;pointer-events:none;z-index:1}
.gp-coins .coin{position:absolute;top:-30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#f5c451 55%,#b8860b);box-shadow:0 0 8px rgba(245,196,81,.7),inset 0 0 0 2px rgba(120,80,0,.35);animation:coinfall 4s linear infinite}
@keyframes coinfall{0%{transform:translateY(0) rotateY(0);opacity:0}8%{opacity:1}100%{transform:translateY(560px) rotateY(900deg);opacity:.9}}
.gp-poster>*:not(.gp-bg):not(.gp-rays):not(.gp-coins){position:relative;z-index:2}
.gp-top{display:flex;align-items:center;gap:8px;font:800 13px 'Manrope',sans-serif;letter-spacing:.24em;color:#f7dea0}
.gp-top img{width:30px;height:30px;border-radius:50%;background:#fff;padding:2px}
.gp-medal{margin-top:8px}
.gp-disc{position:relative;overflow:hidden;display:grid;place-items:center;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--c1),var(--c2) 55%,var(--c3));box-shadow:inset 0 -10px 18px rgba(0,0,0,.28),inset 0 6px 10px rgba(255,255,255,.55),0 0 0 6px rgba(255,255,255,.12),0 0 60px var(--rim),0 14px 34px rgba(0,0,0,.6)}
.gp-disc b{font:700 78px/1 'Fraunces',serif;color:#2a1a00;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.gp-disc::after{content:'';position:absolute;top:0;bottom:0;width:46%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.85),transparent);transform:translateX(-160%) skewX(-12deg);animation:gpshine 2.6s ease-in-out infinite}
@keyframes gpshine{0%,55%{transform:translateX(-160%) skewX(-12deg)}100%{transform:translateX(330%) skewX(-12deg)}}
.gp-ribbon{margin-top:-14px;position:relative}
.gp-ribbon span{display:inline-block;padding:7px 30px;background:linear-gradient(180deg,var(--c1),var(--c2) 45%,var(--c3));color:#2a1a00;font:800 15px 'Manrope',sans-serif;letter-spacing:.3em;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.55)}
.gp-name{font:700 54px/1.02 'Fraunces',serif;color:#fff;text-shadow:0 0 40px var(--rim),0 4px 18px rgba(0,0,0,.7);margin-top:6px;word-break:break-word;padding:0 6px}
.gp-sub{font:700 15px 'Manrope',sans-serif;color:#d6e2df}
.gp-pts{margin-top:4px;padding:6px 22px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid var(--rim);font:800 15px 'Manrope',sans-serif;letter-spacing:.1em;color:var(--c1)}
.gp-pts b{font:700 28px 'Fraunces',serif;color:#fff;margin-right:4px}
.gp-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:8px}
.gp-chip{background:rgba(5,12,21,.62);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 4px}
.gp-chip i{display:block;font:800 10px 'Manrope',sans-serif;letter-spacing:.12em;color:#9fc2bb;font-style:normal}
.gp-chip b{display:block;font:700 16px 'Fraunces',serif;color:var(--c1);margin-top:2px;word-break:break-word}
.gp-chip small{font:700 11px 'Manrope',sans-serif;color:#9bb0ae}
.gp-tag{margin-top:auto;padding-top:12px;font:italic 600 15px 'Fraunces',serif;color:#f7dea0}

.gp-poster.m0{--c1:#e9fbf6;--c2:#7fd9c8;--c3:#2a8f80;--rim:#5fd0bd;border-color:#5fd0bd;box-shadow:0 0 0 4px rgba(95,208,189,.14),0 0 60px rgba(95,208,189,.25),0 24px 60px rgba(0,0,0,.6)}
.gp-poster.m0 .gp-ribbon span{letter-spacing:.24em}

.wp-name.multi{font-size:clamp(3rem,8vw,6.5rem)}
.wp-name small{font:800 .38em 'Manrope',sans-serif;letter-spacing:.06em;color:var(--gold-hi);vertical-align:middle}

/* ── solo game: full-bleed brand look ── */
body.gs{background:#050c15}
.sl-wrap{position:relative;overflow:hidden;min-height:var(--vvh,100dvh);max-width:480px;margin:0 auto;padding:14px 16px 14px;display:flex;flex-direction:column;gap:12px;color:#f6f1e7;isolation:isolate}
.sl-bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(5,12,21,.55) 0%,rgba(5,12,21,.78) 40%,#050c15 92%),url('/assets/wealth-hack-tree.webp') 50% 0/cover no-repeat;animation:slbg 26s ease-in-out infinite alternate}
.sl-wrap.intro .sl-bg{background:linear-gradient(180deg,rgba(5,12,21,.15) 0%,rgba(5,12,21,.55) 45%,rgba(5,12,21,.94) 78%),url('/assets/wealth-hack-tree.webp') 50% 0/cover no-repeat}
@keyframes slbg{from{transform:scale(1)}to{transform:scale(1.08)}}
.sl-coins{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sl-coins .coin{position:absolute;top:-30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#f5c451 55%,#b8860b);box-shadow:0 0 8px rgba(245,196,81,.7),inset 0 0 0 2px rgba(120,80,0,.35);animation:coinfall 5s linear infinite;opacity:0}
.sl-body{display:flex;flex-direction:column;gap:12px;flex:1}
.sl-top{display:flex;align-items:center;gap:10px}
.sl-logo{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px;flex:none;box-shadow:0 0 22px rgba(233,191,98,.45)}
.sl-logo img,.sl-biglogo img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.sl-brand{display:flex;flex-direction:column;line-height:1.1}
.sl-brand b{font:700 18px 'Fraunces',serif;color:#f7dea0}
.sl-brand small{font:800 9px 'Manrope',sans-serif;letter-spacing:.22em;color:#9fc2bb;margin-top:2px}
.sl-foot{text-align:center;font:600 11px 'Manrope',sans-serif;color:rgba(190,205,203,.75);padding-top:2px}
/* intro */
.sl-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6vh}
.sl-biglogo{width:104px;height:104px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 4px rgba(245,196,81,.35),0 0 60px rgba(245,196,81,.55),0 14px 40px rgba(0,0,0,.5);animation:slfloat 4s ease-in-out infinite}
@keyframes slfloat{50%{transform:translateY(-6px)}}
.sl-eyebrow{font:800 11px 'Manrope',sans-serif;letter-spacing:.26em;color:#f0d28a;margin-top:6px}
.sl-title{margin:0;white-space:nowrap;font:700 clamp(32px,10vw,50px)/1 'Fraunces',serif;color:#fff;text-shadow:0 0 50px rgba(245,196,81,.55),0 4px 20px rgba(0,0,0,.6)}
.sl-hook{margin:2px 0 6px;font:600 19px/1.35 'Fraunces',serif;color:#e9f0ee;max-width:20em}
.sl-hook b{color:#f7dea0}
.sl-rounds{display:grid;gap:8px;width:100%;margin:6px 0 4px}
.sl-round{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(5,12,21,.62);border:1px solid rgba(245,196,81,.28);border-radius:16px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sl-round>b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f7dea0,#d79f34);color:#2a1a00;font:700 18px 'Fraunces',serif}
.sl-round strong{display:block;font:800 14px 'Manrope',sans-serif;color:#f7dea0;letter-spacing:.02em}
.sl-round span{display:block;font:600 13px/1.3 'Manrope',sans-serif;color:#c9d8d5}
.sl-go{width:100%;border:0;border-radius:20px;padding:14px 10px 12px;margin-top:6px;background:linear-gradient(135deg,#fbe6ac,#d79f34);color:#1a1203;font:800 24px 'Manrope',sans-serif;letter-spacing:.08em;box-shadow:0 7px 0 #8a6a1a,0 0 40px rgba(245,196,81,.45);animation:slpulse 1.8s ease-in-out infinite}
.sl-go small{display:block;font:700 12px 'Manrope',sans-serif;letter-spacing:.04em;margin-top:2px;color:#4a3606}
.sl-go:active{transform:translateY(5px);box-shadow:0 2px 0 #8a6a1a}
@keyframes slpulse{50%{box-shadow:0 7px 0 #8a6a1a,0 0 64px rgba(245,196,81,.75)}}
.sl-note{margin:2px 0 0;font:600 13px/1.4 'Manrope',sans-serif;color:#aebfbc}
.sl-link{font:800 14px 'Manrope',sans-serif;color:#f7dea0;text-decoration:none;text-align:center;padding:6px}
/* progress steps */
.sl-steps{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;position:relative;padding:2px 6px}
.sl-steps::before{content:'';position:absolute;left:12%;right:12%;top:17px;height:3px;border-radius:3px;background:rgba(255,255,255,.14)}
.sl-step{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.sl-step b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#0c1a28;border:2px solid rgba(255,255,255,.2);color:#8aa09d;font:800 15px 'Manrope',sans-serif}
.sl-step span{font:800 10px 'Manrope',sans-serif;letter-spacing:.1em;color:#7f9794}
.sl-step.now b{background:linear-gradient(135deg,#f7dea0,#d79f34);border-color:#f7dea0;color:#2a1a00;box-shadow:0 0 24px rgba(245,196,81,.6)}
.sl-step.now span{color:#f7dea0}
.sl-step.done b{background:#2dd4bf;border-color:#2dd4bf;color:#052a2a}
.sl-step.done span{color:#6fe3d0}
.sl-wrap .gs-q{background:rgba(5,12,21,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sl-wrap .gs-lock{margin-top:auto}
/* the roll */
.sl-rollcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:6vh;background:rgba(5,12,21,.7);border:1.5px solid rgba(245,196,81,.5);border-radius:24px;padding:22px 12px 20px;box-shadow:0 0 60px rgba(245,196,81,.18)}
.sl-kick{font:800 11px 'Manrope',sans-serif;letter-spacing:.24em;color:#9fc2bb}
.sl-reels{display:flex;align-items:center;justify-content:center;gap:5px}
.sl-rs{font:700 38px 'Oswald',sans-serif;color:#f7dea0;margin-right:2px}
.sl-d{width:38px;height:62px;border-radius:10px;background:#050c15;color:#f7dea0;font:700 42px/62px 'Oswald',sans-serif;text-align:center;box-shadow:inset 0 0 0 2px rgba(245,196,81,.7);filter:blur(.6px)}
.sl-d.stopped{filter:none;color:#fff;box-shadow:inset 0 0 0 2px #f5c451,0 0 18px rgba(245,196,81,.7);animation:slpop .35s ease-out}
@keyframes slpop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.sl-reels em{font:700 38px 'Oswald',sans-serif;color:#f7dea0;font-style:normal}
.sl-sub{font:700 14px/1.35 'Manrope',sans-serif;color:#b9c9c6;max-width:22em}
/* result */
.sl-result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:rgba(5,12,21,.74);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:16px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sl-verdict{font:800 13px 'Manrope',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.08);color:#dbe7e4}
.sl-verdict.good{background:linear-gradient(135deg,#f7dea0,#d79f34);color:#2a1a00;box-shadow:0 0 30px rgba(245,196,81,.5)}
.sl-real{font:700 54px/1.05 'Fraunces',serif;color:#f7dea0;text-shadow:0 0 36px rgba(245,196,81,.4)}

/* ── money (§9) ───────────────────────────────────────────────── */
function fmtMoney(n){ n=Math.round(n);
  if(n>=10000000){const v=n/10000000;return '₹'+(v>=100?Math.round(v):v%1?v.toFixed(v<10?2:1):v)+' Cr';}

  return (rest?rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',':'')+last3; }

/* ── the maths: end-of-month SIP, monthly compounding (same as The Wealth Hack) ── */
function sipFor(fv,years,ratePct){ const r=ratePct/1200, n=Math.round(years*12); if(n<=0) return fv; return fv*r/(Math.pow(1+r,n)-1); }

const ROUNDS={
  r1:{n:1,title:'Ten years',

      label:S=>`To get to ${tgt(S)} in ${S.years1} years, put away`},
  r2:{n:2,title:'Twenty years',
      hostQ:S=>`Same ${tgt(S)}. Now you have ${yrs(S.years2+' years')}. How much a month?`,
      why:S=>`Same ${S.rate}% a year. More time to grow.`,
      pq:S=>({q1:`Same <b>${tgt(S)}</b>. Now you have`,y:S.years2,q2:'How much a month?'}),
      label:S=>`To get to ${tgt(S)} in ${S.years2} years, put away`},
  r3:{n:3,title:'The cost of delay',
      hostQ:S=>`Start today and it's <em>${rupees(realOf('r1',S))}</em> a month. Now you start ${yrs(S.delay+' years')} late, with ${S.years1-S.delay} years left. How much a month to still get to ${tgt(S)}?`,
      why:S=>`Same ${S.rate}% a year, same ${tgt(S)}. Less time.`,
      pq:S=>({q1:`Start today: <b>${rupees(realOf('r1',S))}</b> a month. But you start`,y:S.delay,q2:`late, with ${S.years1-S.delay} years left. How much a month to still get to ${tgt(S)}?`}),
      label:S=>`Starting ${S.delay} years late, you put away`},

function roundOf(phase){ const m=/^(r\d)_/.exec(phase||''); return m&&ROUNDS[m[1]]?m[1]:null; }

/* ── role / room ──────────────────────────────────────────────── */

}
const S=()=>state.settings;
const playersList=()=>Object.values(state.players).sort((a,b)=>a.name.localeCompare(b.name));
const av=p=>`<span class="av" style="background:${p.color}">${p.av}</span>`;
const hasGuess=(p,rk)=>p.guess&&p.guess[rk]>0;

/* ── scoring: the smallest rupee gap wins; ties share the rank; 3 / 2 / 1 points for the top three ── */
function closeRound(rk){
  const real=Math.round(realOf(rk));
  const rows=Object.values(state.players).filter(p=>hasGuess(p,rk)).map(p=>({id:p.id,guess:p.guess[rk],gap:Math.abs(p.guess[rk]-real)}))
    .sort((a,b)=>a.gap-b.gap||a.guess-b.guess);
  let rank=0,last=null; rows.forEach(r=>{ if(r.gap!==last){ rank++; last=r.gap; } r.rank=rank; r.pts=rank<=3?4-rank:0; });
  state.results[rk]={real,rows};
}
function scoreboard(){
  const tot={}; Object.keys(state.players).forEach(id=>tot[id]={id,pts:0,wins:0});
  ROUND_KEYS.forEach(rk=>{ const r=state.results[rk]; if(!r) return; r.rows.forEach(x=>{ if(!tot[x.id]) return; tot[x.id].pts+=x.pts; if(x.rank===1) tot[x.id].wins++; }); });
  return Object.values(tot).map(t=>Object.assign(t,{p:state.players[t.id]})).filter(t=>t.p).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||a.p.name.localeCompare(b.p.name));
}
// equal points and wins share a place, so a tie never hands one player the medal
function ranked(){ const sc=scoreboard(); let pos=0,last=null; sc.forEach(t=>{ const k=t.pts+':'+t.wins; if(k!==last){ pos++; last=k; } t.pos=pos; }); return sc; }
const gapText=(gap,real)=>gap===0?'EXACT! to the rupee':rupees(gap)+' away';

/* ── DB: ordered, retried saves ───────────────────────────────── */
let _saveTimer=null,_saveDirty=false,_saveBusy=false,_saveFails=0;
function save(){ state.updatedAt=Date.now(); clearTimeout(_saveTimer); _saveTimer=setTimeout(flushSave,60); }
function saveNow(){ state.updatedAt=Date.now(); return flushSave(); }
async function flushSave(){
  _saveDirty=true; if(_saveBusy) return; _saveBusy=true;
  try{
    while(_saveDirty){ _saveDirty=false; let ok=false;
      try{ const {error}=await db.from('games').upsert({room_code:ROOM,state,host_id:MY_ID,updated_at:new Date().toISOString()});
           ok=!error; if(error) console.warn('save failed — retrying',error.message||error); }
      catch(e){ console.warn('save failed — retrying',e); }
      if(ok){ _saveFails=0; } else { _saveFails++; _saveDirty=true; await new Promise(r=>setTimeout(r,Math.min(4000,400*2**Math.min(_saveFails-1,4)))); }
      netBanner();
    }
  } finally { _saveBusy=false; }
}
function netBanner(){
  if(!isHost) return;
  let b=document.getElementById('netBanner');
  const bad=_saveFails>=2||navigator.onLine===false;
  if(!bad){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement('div'); b.id='netBanner'; b.className='net'; document.body.appendChild(b); }
  b.innerHTML='⚠️ The phones can’t get this screen right now — retrying… <b>Don’t move on yet.</b>';
}
addEventListener('online',()=>{ if(isHost){ netBanner(); saveNow(); } }); addEventListener('offline',()=>netBanner());

/* ── realtime ─────────────────────────────────────────────────── */
let channel=null, _lastStateAt=Date.now();
function joinChannel(){
  channel=db.channel('room:'+ROOM);
  channel.on('postgres_changes',{event:'*',schema:'public',table:'games',filter:'room_code=eq.'+ROOM},
    (p)=>{const s=p.new&&p.new.state; if(s&&!isHost){state=s; _lastStateAt=Date.now(); renderPlayer();}})
    .on('broadcast',{event:'action'},({payload})=>{ if(isHost) hostHandleAction(payload); })
    .subscribe(st=>{ if(st==='SUBSCRIBED'){ _subscribed=true; _outq.splice(0).forEach(m=>channel.send({type:'broadcast',event:'action',payload:m})); } });
}
let _subscribed=false, _outq=[];
// a tap that happens before the connection is up is queued, not lost
function sendAction(payload){ if(!_subscribed){ _outq.push(payload); return; } channel.send({type:'broadcast',event:'action',payload}); }

/* ── confetti (plain canvas, no library) ──────────────────────── */
function confetti(ms,count){
  if(REDUCED) return;
  let cv=document.getElementById('confetti'); if(!cv){ cv=document.createElement('canvas'); cv.id='confetti'; document.body.appendChild(cv); }
  const w=cv.width=innerWidth, h=cv.height=innerHeight, ctx=cv.getContext('2d');
  const cols=['#f7dea0','#e9bf62','#2dd4bf','#ff8a76','#ffffff','#a78bfa'];
  const ps=Array.from({length:count||160},()=>({x:Math.random()*w,y:-20-Math.random()*h*0.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function frame(t){ const k=t-t0; ctx.clearRect(0,0,w,h);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-Math.max(0,k-ms*.7)/(ms*.3)); ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); ctx.restore(); });
    if(k<ms) requestAnimationFrame(frame); else ctx.clearRect(0,0,w,h); })(t0);
}

/* ── sound: synthesised with WebAudio, no files. M mutes. Starts on the host's first key press or click. ── */
let _ac=null, MUTED=false; try{ MUTED=localStorage.getItem('ls_muted')==='1'; }catch(e){}
function ac(){ if(MUTED) return null; try{ if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); return _ac; }catch(e){ return null; } }
function tone(f,t0,d,type,vol,slideTo){
  const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+t0;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);

const sfx={

  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.75,'triangle',.3)); [392,523,659,784].forEach((f,i)=>tone(f,.5+i*.05,1.1,'square',.12)); },
  reveal(){ tone(300,0,.25,'sawtooth',.18,720); tone(700,.2,.35,'triangle',.25); },
  drum(){ for(let i=0;i<14;i++) tone(105,i*.095,.09,'triangle',.22+i*.012); },
  ding(){ tone(1568,0,.6,'sine',.26); tone(2093,.05,.5,'sine',.15); },
  rise(i){ tone(300+i*110,0,.32,'sawtooth',.16,620+i*230); tone(600+i*170,.16,.38,'triangle',.24); }
};
function toggleMute(){ MUTED=!MUTED; try{ localStorage.setItem('ls_muted',MUTED?'1':'0'); }catch(e){} const b=document.getElementById('muteBtn'); if(b) b.textContent=MUTED?'🔇 Sound off · M':'🔊 Sound on · M'; if(!MUTED) sfx.ding(); }
function countUp(el,to,ms){ const t0=performance.now(); (function f(t){ const k=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(f); else sfx.ding(); })(t0); }
// the person, not just the number: their name takes over the screen for a moment, then goes back in
function winPop(names,label,medal){ const arr=(Array.isArray(names)?names:[names]).filter(Boolean), shown=arr.slice(0,2), more=arr.length-shown.length;

/* Local design QA only: ?demo=1&phase=r1_reveal seeds a room (host) or a player (role=player) so every screen can be screenshotted. */
const DEMO=!!(params.get('demo')&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname));
if(DEMO&&params.get('static')) REDUCED=true;
function seedDemo(meId){
  const real={r1:realOf('r1'),r2:realOf('r2'),r3:realOf('r3')};
  const base=['Meera','Rohan','Aanya','Kabir','Zoya','Dev','Tara','Imran','Nisha','Arjun','Priya','Kavya','Rahul','Sneha','Vikram','Anika','Ishaan','Diya','Karan','Mira'], f=[1.02,0.8,1.35,0.55,0.97,1.12,0.7,1.6];
  const N=+params.get('n')||8, names=Array.from({length:N},(_,i)=>i<base.length?base[i]:base[i%base.length]+' '+(Math.floor(i/base.length)+1));
  names.forEach((n,i)=>{ state.players['d'+i]={id:'d'+i,name:n,av:AV_EMOJI[i%AV_EMOJI.length],color:AV_COLOR[i%AV_COLOR.length],guess:{r1:Math.round(real.r1*f[i%8]),r2:Math.round(real.r2*f[(i+3)%8]),r3:Math.round(real.r3*f[(i+5)%8])}}; });
  if(params.get('ties')) ROUND_KEYS.forEach(rk=>{ [1,2,3].forEach(i=>state.players['d'+i].guess[rk]=Math.round(real[rk])+29); state.players.d4.guess[rk]=Math.round(real[rk]); });
  state.phase=params.get('phase')||'lobby'; state.endStep=+params.get('step')||0; state.show25=!!params.get('show25');

    const rows=ROUND_KEYS.map(k=>{ const r=myRow(k); return `<div class="gs-line"><span>${ROUNDS[k].title}</span><b>${r?gapText(r.gap,state.results[k].real):'no guess'}</b></div>`; }).join('');
    if(mine.pos&&mine.pos<=3&&mine.pts>0){
      const T=['','CHAMPION','SECOND PLACE','THIRD PLACE'][mine.pos], short={r1:'10 YEARS',r2:'20 YEARS',r3:s.delay+' YEARS LATE'};
      if(mine.pos===1&&!_celebrated.final){ _celebrated.final=1; setTimeout(()=>confetti(4600,220,true),400); }
      const coins=Array.from({length:16},(_,k)=>`<i class="coin" style="left:${(k*61)%100}%;animation-delay:${(k*0.37).toFixed(2)}s;animation-duration:${(3.4+(k%5)*.5).toFixed(1)}s;width:${12+(k%4)*4}px;height:${12+(k%4)*4}px"></i>`).join('');
      const chips=ROUND_KEYS.map(k=>{ const r=myRow(k); return `<div class="gp-chip"><i>${short[k]}</i><b>${r?(r.gap===0?'EXACT!':rupees(r.gap)):'-'}</b><small>${r?(r.gap===0?'to the rupee':'away'):'no guess'}</small></div>`; }).join('');
      return paint('end:podium'+mine.pos,shell(`<div class="gp-poster m${mine.pos}"><div class="gp-bg"></div><div class="gp-rays"></div><div class="gp-coins">${coins}</div>
        <div class="gp-top"><img src="${LOGO}" alt=""><span>THE WEALTH HACK</span></div>
        <div class="gp-medal"><div class="gp-disc"><b>${mine.pos}</b></div></div>
        <div class="gp-ribbon"><span>${T}</span></div>
        <div class="gp-name">${esc(p.name)}</div>
        <div class="gp-sub">closest to the real numbers</div>
        <div class="gp-pts"><b>${mine.pts}</b> point${mine.pts===1?'':'s'}</div>
        <div class="gp-chips">${chips}</div>
        <div class="gp-tag">The best month to start is this one.</div></div>
        ${waBtn(shareText(p,mine,sc.length),'Share on WhatsApp')}<p class="gs-end" style="margin:0">Screenshot your card and show it off.</p>`));
    }
    { const short={r1:'10 YEARS',r2:'20 YEARS',r3:s.delay+' YEARS LATE'}, n=sc.length;
      const coins=Array.from({length:12},(_,k)=>`<i class="coin" style="left:${(k*83)%100}%;animation-delay:${(k*0.45).toFixed(2)}s;animation-duration:${(3.8+(k%5)*.5).toFixed(1)}s;width:${12+(k%4)*4}px;height:${12+(k%4)*4}px"></i>`).join('');
      const chips=ROUND_KEYS.map(k=>{ const r=myRow(k); return `<div class="gp-chip"><i>${short[k]}</i><b>${r?(r.gap===0?'EXACT!':rupees(r.gap)):'-'}</b><small>${r?(r.gap===0?'to the rupee':'away'):'no guess'}</small></div>`; }).join('');
      const place=mine.pos?`<div class="gp-medal"><div class="gp-disc"><b>${mine.pos}</b></div></div><div class="gp-ribbon"><span>OUT OF ${n}</span></div>`:`<div class="gp-medal"><div class="gp-disc"><b style="font-size:54px">${mine.pts}</b></div></div><div class="gp-ribbon"><span>POINTS</span></div>`;
      return paint('end:final',shell(`<div class="gp-poster m0"><div class="gp-bg"></div><div class="gp-rays"></div><div class="gp-coins">${coins}</div>
        <div class="gp-top"><img src="${LOGO}" alt=""><span>THE WEALTH HACK</span></div>
        ${place}
        <div class="gp-name">${esc(p.name)}</div>
        <div class="gp-sub">${mine.pts&&mine.pos?`finished number ${mine.pos} of ${n}`:'thanks for playing'}</div>
        <div class="gp-pts"><b>${mine.pts}</b> point${mine.pts===1?'':'s'}</div>
        <div class="gp-chips">${chips}</div>
        <div class="gp-tag">The best month to start is this one.</div></div>
        ${waBtn(shareText(p,mine,n),'Share on WhatsApp')}<p class="gs-end" style="margin:0">Screenshot your card and show it off.</p>`)); }
  }
  paint('wait',shell(waitCard('👀','Eyes on the screen','')));
}

/* ── solo: the shared link on its own (no room code) is a one-person game: same three questions, no room, no scores ── */
let SOLO={i:-1,g:{},roll:null};
function initSolo(){ document.getElementById('player').classList.remove('hide'); document.body.classList.add('player-bg','gs'); state=freshState(); SOLO={i:-1,g:{},roll:null}; renderSolo(); }
function soloGo(){ SOLO.i=0; renderSolo(); }
function soloAgain(){ SOLO={i:0,g:{},roll:null}; renderSolo(); }
function soloNext(){ SOLO.i++; renderSolo(); }
function soloLock(rk){ if(!(_pendingVal>0)) return; SOLO.g[rk]=_pendingVal; SOLO.roll=rk; _pendingVal=0; document.body.classList.remove('typing'); renderSolo(); }
function soloRow(rk){ const g=SOLO.g[rk]; if(!g) return null; const real=Math.round(realOf(rk,state.settings)); return {guess:g,real,gap:Math.abs(g-real)}; }
function soloShareText(){
  const s=state.settings, a=realOf('r1',s), b=realOf('r3',s), d=b-a, L=['🎲 *'+GAME_NAME+'*','_guess the number_',''];
  ROUND_KEYS.forEach((rk,i)=>{ const r=soloRow(rk), what=i===0?`${tgt(s)} in ${s.years1} years`:i===1?`${tgt(s)} in ${s.years2} years`:`Start ${s.delay} years late`;
    L.push(r?`▸ ${what}: I guessed *${rupees(r.guess)}*, the real number is *${rupees(r.real)}* (${gapText(r.gap,r.real).replace('EXACT! to the rupee','exact!')})`:`▸ ${what}: real number *${rupees(Math.round(realOf(rk,s)))}*`); });
  L.push('',`⏳ Waiting ${s.delay} years costs *${rupees(d)} more every month*. That is *+${Math.round(d/a*100)}%*.`,'',`_(assumes ${s.rate}% a year, not a promise)_`,'','Can you get closer? 👇',SHARE_URL);
  return L.join('\n');
}
/* The solo game is the first thing many people see of IFM outside a class, so it has its own full-bleed look. */
const IFM_SITE='https://www.investingformummies.com';
function soloShell(inner,kind){ const rate=state&&state.settings?state.settings.rate:12;
  const coins=Array.from({length:14},(_,k)=>`<i class="coin" style="left:${(k*71)%100}%;animation-delay:${(k*0.41).toFixed(2)}s;animation-duration:${(4+(k%5)*.6).toFixed(1)}s;width:${10+(k%4)*4}px;height:${10+(k%4)*4}px"></i>`).join('');
  return `<div class="sl-wrap ${kind||''}"><div class="sl-bg"></div><div class="sl-coins">${coins}</div>
    ${(kind==='intro'||kind==='end')?'':`<div class="sl-top"><span class="sl-logo"><img src="${LOGO}" alt=""></span><span class="sl-brand"><b>The Wealth Hack</b><small>INVESTING FOR MUMMIES</small></span></div>`}
    <div class="sl-body">${inner}</div><div class="sl-foot">The Wealth Hack assumes ${rate}% a year, not a promise</div></div>`; }
function soloSteps(i,doneNow){ const s=state.settings, lab=[s.years1+' YEARS',s.years2+' YEARS',s.delay+' YEARS LATE'];
  return `<div class="sl-steps">${lab.map((l,n)=>{ const done=n<i||(n===i&&doneNow); return `<div class="sl-step ${done?'done':n===i?'now':''}"><b>${done?'✓':n+1}</b><span>${l}</span></div>`; }).join('')}</div>`; }
function soloIntro(s){
  const lab=[[s.years1+' years','Start today. What does ₹1 Cr cost you a month?'],[s.years2+' years','Give it more time. How much does it fall?'],['Start '+s.delay+' years late','What does waiting really cost?']];
  return soloShell(`<div class="sl-hero"><span class="sl-biglogo"><img src="${LOGO}" alt="Investing for Mummies"></span>
    <div class="sl-eyebrow">INVESTING FOR MUMMIES PRESENTS</div>
    <h1 class="sl-title">The Wealth Hack</h1>
    <p class="sl-hook">What does <b>${tgt(s)}</b> really cost you every month?</p>
    <div class="sl-rounds">${lab.map((l,n)=>`<div class="sl-round"><b>${n+1}</b><div><strong>${l[0]}</strong><span>${l[1]}</span></div></div>`).join('')}</div>
    <button class="sl-go" onclick="soloGo()">PLAY NOW<small>3 guesses · about a minute</small></button>
    <p class="sl-note">Playing in a class? Scan the QR on your teacher’s screen instead.</p>
    <a class="sl-link" href="https://games.investingformummies.com">More money games →</a></div>`,'intro');
}
function soloEnd(s){
  const a=realOf('r1',s), d=realOf('r3',s)-a, short={r1:s.years1+' YEARS',r2:s.years2+' YEARS',r3:s.delay+' YEARS LATE'};
  const rowsOf=ROUND_KEYS.map(k=>({k,r:soloRow(k)})), played=rowsOf.filter(x=>x.r).sort((x,y)=>x.r.gap-y.r.gap), best=played[0];
  const coins=Array.from({length:12},(_,k)=>`<i class="coin" style="left:${(k*83)%100}%;animation-delay:${(k*0.45).toFixed(2)}s;animation-duration:${(3.8+(k%5)*.5).toFixed(1)}s;width:${12+(k%4)*4}px;height:${12+(k%4)*4}px"></i>`).join('');
  const chips=rowsOf.map(({k,r})=>`<div class="gp-chip"><i>${short[k]}</i><b>${r?(r.gap===0?'EXACT!':rupees(r.gap)):'-'}</b><small>${r?(r.gap===0?'to the rupee':'away'):'no guess'}</small></div>`).join('');
  if(!_celebrated.soloEnd){ _celebrated.soloEnd=1; setTimeout(()=>confetti(3200,160,true),500); }
  return soloShell(`<div class="gp-poster m1"><div class="gp-bg"></div><div class="gp-rays"></div><div class="gp-coins">${coins}</div>
      <div class="gp-top"><img src="${LOGO}" alt=""><span>THE WEALTH HACK</span></div>
      <div class="gp-medal"><div class="gp-disc"><b style="font-size:42px">+${Math.round(d/a*100)}%</b></div></div>
      <div class="gp-ribbon"><span>WAIT ${s.delay} YEARS</span></div>
      <div class="gp-name" style="font-size:40px">${roughDiff(d)} more</div>
      <div class="gp-sub">every month, to still reach ${tgt(s)}</div>
      ${best?`<div class="gp-pts" style="white-space:nowrap">Closest guess: <b style="font-size:18px">${short[best.k].toLowerCase()}</b></div>`:''}
      <div class="gp-chips">${chips}</div>
      <div class="gp-tag">The best month to start is this one.</div></div>
      ${waBtn(soloShareText(),'Share my results')}
      <div class="sl-cta"><b>Want to do this with real money?</b><span>Learn to invest the Investing for Mummies way.</span><a href="${IFM_SITE}" target="_blank" rel="noopener">Join a class →</a></div>
      <button class="gs-ghost" onclick="soloAgain()" style="margin-top:0">Play again</button>
      <a class="sl-link" href="https://games.investingformummies.com">More money games →</a>`,'end');
}
function renderSolo(){
  const s=state.settings, i=SOLO.i;
  if(i<0){ document.body.classList.add('solo-intro'); return paint('solo:intro',soloIntro(s)); }
  document.body.classList.remove('solo-intro');
  if(i>=3) return paint('solo:end',soloEnd(s));
  const rk=ROUND_KEYS[i], R=ROUNDS[rk], q=R.pq(s), r=soloRow(rk);
  const qBlock=`${soloSteps(i,!!r)}<div class="gs-q"><div class="gs-q1">${q.q1}</div><div class="gs-years"><span>${q.y}</span> YEARS</div><div class="gs-q2">${q.q2}</div></div>`;
  if(!r) return paint(`solo:${rk}:ask`,soloShell(`${qBlock}
    <div class="gs-amt"><span class="rs">₹</span><input id="moneyInput" inputmode="numeric" placeholder="0" oninput="onMoney(this)" onfocus="document.body.classList.add('typing')" onblur="document.body.classList.remove('typing')"></div>
    <div class="gs-badge" id="shBadge">&nbsp;</div>
    <button class="gs-lock" id="lockBtn" onpointerdown="tapOnce(event,()=>soloLock('${rk}'))" onclick="tapOnce(null,()=>soloLock('${rk}'))" disabled>LOCK IT IN</button>`),()=>{ _pendingVal=0; });
  const real=r.real, digits=indianFormat(String(real)).split('');
  if(SOLO.roll===rk){ const nd=digits.filter(c=>/\d/.test(c)).length, total=800+nd*330+700; setTimeout(()=>{ if(SOLO.roll===rk){ SOLO.roll=null; renderSolo(); } },total);
    return paint(`solo:${rk}:roll`,soloShell(`${soloSteps(i,false)}<div class="sl-rollcard"><div class="sl-kick">THE REAL NUMBER</div><div class="sl-reels"><span class="sl-rs">₹</span>${digits.map(c=>/\d/.test(c)?`<b class="sl-d" data-d="${c}">0</b>`:`<em>${c}</em>`).join('')}</div><div class="sl-sub">${R.label(s)}</div></div>`),()=>{
        const bs=[...document.querySelectorAll('.sl-d')], t0=Date.now(); let k=0;
        _vt.push(setInterval(()=>{ const el=Date.now()-t0; bs.forEach((b,n)=>{ if(b.classList.contains('stopped')) return; if(el>=800+n*330){ b.textContent=b.dataset.d; b.classList.add('stopped'); } else b.textContent=Math.floor(Math.random()*10); }); },60)); }); }
  const pct=r.gap/r.real, exact=r.gap===0, close=pct<0.05, ok=pct<0.25;
  const verdict=exact?'EXACT! To the rupee.':close?'So close!':ok?'Good instinct.':'That is the surprise.';
  const mx=Math.max(r.guess,r.real);
  let lesson;
  if(rk==='r1') lesson=`Start today and <b>${rupees(real)}</b> a month builds ${tgt(s).replace(' ','\u00a0')} in ${s.years1} years.`;
  else if(rk==='r2'){ const a=realOf('r1',s), fall=Math.round((1-real/a)*100); lesson=`Give it ${s.years2} years and the monthly amount falls to <b>${rupees(real)}</b>, <b>${fall}% less</b>. Time does the heavy lifting.`; }
  else { const a=realOf('r1',s), d=real-a, extra=putIn(real,s.years1-s.delay)-putIn(a,s.years1); lesson=`Waiting ${s.delay} years costs about <b>${roughDiff(d)} more</b> every month (<b>+${Math.round(d/a*100)}%</b>) and about <b>${lakhs(extra)} more</b> out of your own pocket.`; }
  if(close&&!_celebrated['solo'+rk]){ _celebrated['solo'+rk]=1; setTimeout(()=>confetti(2600,120,true),350); }
  return paint(`solo:${rk}:res`,soloShell(`${soloSteps(i,true)}<div class="sl-result"><div class="sl-verdict ${close?'good':''}">${verdict}</div>
      <div class="sl-kick">THE REAL NUMBER</div><div class="sl-real">${rupees(real)}</div><div class="sl-sub">${R.label(s)}</div>
      <div class="sl-bars"><div class="sl-bar you"><span>You</span><div><i style="--w:${(r.guess/mx*100).toFixed(1)}%"></i></div><b>${rupees(r.guess)}</b></div>
      <div class="sl-bar real"><span>Real</span><div><i style="--w:${(real/mx*100).toFixed(1)}%"></i></div><b>${rupees(real)}</b></div></div>
      <div class="gs-gap">${gapText(r.gap,r.real)}</div>
      <div class="sl-lesson ${rk==='r3'?'hurt':''}">${lesson}</div></div>
    <button class="gs-lock" style="margin-top:6px;width:100%" onclick="soloNext()">${i<2?'NEXT QUESTION':'SEE MY CARD'}</button>`));
}

if(isHost) initHost(); else initPlayer();
</script>
