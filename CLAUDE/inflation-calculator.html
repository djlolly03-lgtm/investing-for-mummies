function MythBusterStage({onComplete,addCoins,loseHeart}){
  var [idx,setIdx]=useState(0);
  var [answered,setAnswered]=useState(null);
  var [score,setScore]=useState(0);
  var [animKey,setAnimKey]=useState(0);
  var [showAnim,setShowAnim]=useState(false);
  var current=MYTHS[idx];

  function answer(choice){
    if(answered!==null) return;
    var correct=choice===current.correct;
    setAnswered(choice);
    if(correct){setScore(s=>s+1);addCoins(8);setShowAnim(true);setAnimKey(k=>k+1);}
    else loseHeart();
    setTimeout(function(){
      setShowAnim(false);
      if(idx<MYTHS.length-1){setIdx(i=>i+1);setAnswered(null);}
      else onComplete(score+(correct?1:0));
    },2200);
  }

  return React.createElement('div',{className:'card-stage'},
    showAnim && React.createElement(CoinsAnim,{amount:8,key2:animKey}),
    React.createElement('div',{className:'stage-progress'},'Question '+(idx+1)+' of '+MYTHS.length),
    React.createElement('div',{className:'myth-card'},
      React.createElement('div',{className:'myth-text'},current.stmt),
      answered===null
        ? React.createElement('div',{className:'myth-btns'},
            React.createElement('button',{className:'myth-btn myth',onClick:function(){answer('MYTH');}},'\uD83D\uDEAB MYTH'),
            React.createElement('button',{className:'myth-btn fact',onClick:function(){answer('FACT');}},'\u2705 FACT')
          )
        : React.createElement('div',{className:'feedback-box '+(answered===current.correct?'correct':'wrong')},
            React.createElement('div',{className:'feedback-label'},answered===current.correct?'\u2714 Correct! It\u2019s a MYTH':'\u274C Wrong \u2014 this IS a MYTH'),
            current.exp
          )
    )
  );
}

function SorterStage({onComplete,addCoins}){
  var [order,setOrder]=useState([]);
  var [checked,setChecked]=useState(false);
  var [score,setScore]=useState(0);

  function tap(i){
    if(checked) return;
    if(order.includes(i)) return;
    var newOrder=order.concat([i]);
    setOrder(newOrder);
    if(newOrder.length===SORTER_ITEMS.length) {}
  }

  function check(){
    var correct=0;
    order.forEach(function(item,rank){
      if(item===SORTER_CORRECT[rank]) correct++;
    });
    setScore(correct);
    setChecked(true);
    if(correct>=3) addCoins(correct===5?40:20);
  }

  function reset(){setOrder([]);setChecked(false);setScore(0);}

  if(checked){
    return React.createElement('div',{className:'card-stage'},
      React.createElement('div',{className:'complete-card'},
        React.createElement('div',{className:'complete-icon'},score===5?'\uD83C\uDFC6':'\uD83D\uDCA1'),
        React.createElement('div',{className:'complete-title'},score===5?'Perfect Order!':score+'/5 correct'),
        score>=3 && React.createElement('div',{className:'score-chip'},score===5?'+40 coins':'+20 coins'),
        React.createElement('div',{style:{marginTop:16,textAlign:'left'}}),
        SORTER_ITEMS.map(function(item,i){
          return React.createElement('div',{key:i,style:{background:'#1e1b2e',borderRadius:10,padding:'10px 12px',marginBottom:8,border:'2px solid '+(order[i]===i?'#22c55e':'#f87171')}},
            React.createElement('div',{style:{fontWeight:700,fontSize:'.85rem',color:order[i]===i?'#4ade80':'#f87171'}},String(i+1)+'. '+(order[i]!==undefined?SORTER_ITEMS[order[i]]:'\u2014')),
            React.createElement('div',{style:{fontSize:'.78rem',color:'rgba(255,255,255,.6)',marginTop:4}},SORTER_WHY[i])
          );
        }),
        React.createElement('button',{className:'btn-primary',style:{marginTop:16},onClick:function(){onComplete(score);}},'\uD83C\uDFC1 Continue')
      )
    );
  }

  return React.createElement('div',{className:'card-stage'},
    React.createElement('div',{className:'stage-progress'},'Tap items in correct priority order (1 = do first)'),
    React.createElement('div',{style:{marginBottom:14}},
      SORTER_ITEMS.map(function(item,i){
        var rank=order.indexOf(i);
        return React.createElement('div',{key:i,className:'sorter-item '+(rank>=0?'ranked':''),onClick:function(){tap(i);}},
          React.createElement('div',{className:'sorter-rank '+(rank<0?'empty':'')},rank>=0?String(rank+1):'?'),
          React.createElement('div',{style:{flex:1,fontSize:'.92rem'}},item)
        );
      })
    ),
    order.length===SORTER_ITEMS.length && React.createElement('button',{className:'btn-primary',onClick:check},'Check Answer'),
    order.length>0 && !checked && React.createElement('button',{className:'btn-secondary',onClick:reset},'Reset')
  );
}

function QuickFireStage({onComplete,addCoins,loseHeart}){
  var [idx,setIdx]=useState(0);
  var [timeLeft,setTimeLeft]=useState(12);
  var [answered,setAnswered]=useState(null);
  var [score,setScore]=useState(0);
  var [animKey,setAnimKey]=useState(0);
  var [showAnim,setShowAnim]=useState(false);
  var timerRef=useRef(null);

  useEffect(function(){
    if(answered!==null) return;
    timerRef.current=setInterval(function(){
      setTimeLeft(function(t){
        if(t<=1){
          clearInterval(timerRef.current);
          loseHeart();
          setAnswered('timeout');
          setTimeout(advance,1500);
          return 0;
        }
        return t-1;
      });
    },1000);
    return function(){clearInterval(timerRef.current);};
  },[idx,answered]);

  function answer(val){
    if(answered!==null) return;
    clearInterval(timerRef.current);
    setAnswered(val);
    var correct=val===QUICKFIRE[idx].ans;
    if(correct){setScore(s=>s+1);addCoins(8);setShowAnim(true);setAnimKey(k=>k+1);}
    else loseHeart();
    setTimeout(advance,1200);
  }

  function advance(){
    setShowAnim(false);
    if(idx<QUICKFIRE.length-1){setIdx(i=>i+1);setTimeLeft(12);setAnswered(null);}
    else onComplete(score);
  }

  var current=QUICKFIRE[idx];
  var timerPct=(timeLeft/12)*100;
  var timerColor=timeLeft>5?'#4ade80':timeLeft>3?'#fbbf24':'#f87171';

  return React.createElement('div',{className:'card-stage'},
    showAnim && React.createElement(CoinsAnim,{amount:8,key2:animKey}),
    React.createElement('div',{className:'qf-score'},score+' correct so far \u2022 '+(idx+1)+'/'+QUICKFIRE.length),
    React.createElement('div',{className:'qf-timer',style:{width:timerPct+'%',background:timerColor}}),
    React.createElement('div',{style:{textAlign:'right',fontSize:'.75rem',color:'rgba(255,255,255,.45)',marginBottom:8}},timeLeft+'s'),
    React.createElement('div',{className:'qf-card'},

      answered===null

            React.createElement('button',{className:'tf-btn false-btn',onClick:function(){answer(false);}},'\u2718 FALSE')
          )
        : React.createElement('div',{className:'feedback-box '+(answered===current.ans?'correct':answered==='timeout'?'wrong':'wrong'),style:{marginTop:12}},
            answered==='timeout'?'\u23F0 Time\u2019s up! Answer: '+(current.ans?'TRUE':'FALSE')
            :(answered===current.ans?'\u2714 Correct!':'\u274C Wrong \u2014 Answer: '+(current.ans?'TRUE':'FALSE'))
          )
    )
  );

// ─── WORLD VIEW ─────────────────────────────────────────────────────────────

function WorldView({worldNum,progress,onBack,addCoins,loseHeart,onWorldComplete}){
  var [activeStage,setActiveStage]=useState(null);
  var [stageResult,setStageResult]=useState(null);
  var allStageIds=STAGES.map(function(s){return s.id;});

  var completedStages=progress.completedStages||[];

  function getStageStatus(stageId){
    if(completedStages.includes(stageId)) return 'done';
    var idx=allStageIds.indexOf(stageId);
    if(idx===0) return 'active';
    var prev=allStageIds[idx-1];
    if(completedStages.includes(prev)) return 'active';
    return 'locked';
  }

  function startStage(stageId){
    var status=getStageStatus(stageId);
    if(status==='locked') return;
    setActiveStage(stageId);
    setStageResult(null);
  }

  function completeStage(score){
    var newCompleted=completedStages.includes(activeStage)?completedStages:completedStages.concat([activeStage]);
    if(activeStage==='boss') addCoins(300);
    setStageResult({score:score,stageId:activeStage});
    setActiveStage(null);
    onWorldComplete(newCompleted);
  }

  if(activeStage){
    var stageDef=STAGES.find(function(s){return s.id===activeStage;});
    return React.createElement('div',{className:'app-wrap'},
      React.createElement('button',{className:'back-btn',onClick:function(){setActiveStage(null);}},'\u2190 '+stageDef.name),

    );
  }

  var allDone=allStageIds.every(function(id){return completedStages.includes(id);});

  return React.createElement('div',{className:'app-wrap'},
    React.createElement('button',{className:'back-btn',onClick:onBack},'\u2190 World Map'),
    React.createElement('div',{className:'hdr'},
      React.createElement('span',{className:'hdr-title'},'\uD83C\uDF0D World 1: Clean House'),
      React.createElement('span',{className:'coins-badge'},'\uD83E\uDE99 '+loadCoins())
    ),
    React.createElement('div',{className:'progress-bar-wrap'},
      React.createElement('div',{className:'progress-bar-fill',style:{width:(completedStages.length/STAGES.length*100)+'%'}})
    ),
    React.createElement('div',{style:{fontSize:'.82rem',color:'rgba(255,255,255,.5)',marginBottom:14,textAlign:'center'}},completedStages.length+'/'+STAGES.length+' stages complete'),
    allDone && React.createElement('div',{className:'world-complete',style:{marginBottom:16}},
      React.createElement('div',{style:{fontSize:'2.5rem',marginBottom:8}},'\uD83C\uDFC6'),
      React.createElement('div',{style:{fontSize:'1.2rem',fontWeight:700,color:'#4ade80',marginBottom:6}},'World 1 Complete!'),
      React.createElement('div',{style:{fontSize:'.88rem',color:'rgba(255,255,255,.7)'}},'You\u2019ve mastered the Clean House journey. World 2 is now unlocked!')
    ),
    React.createElement('div',{className:'stage-list'},
      STAGES.map(function(stage){
        var status=getStageStatus(stage.id);
        return React.createElement('div',{key:stage.id,className:'stage-item '+status,onClick:function(){startStage(stage.id);}},
          React.createElement('div',{className:'stage-num',style:{background:status==='done'?'#22c55e':status==='active'?'#7c3aed':'#2a2a4e'}},
            status==='done'?'\u2713':status==='locked'?'\uD83D\uDD12':stage.icon
          ),
          React.createElement('div',{className:'stage-info'},
            React.createElement('div',{className:'stage-name'},stage.name),
            React.createElement('div',{className:'stage-desc'},stage.desc)
          ),
          status==='done' && React.createElement('div',{style:{color:'#4ade80',fontSize:'.8rem',fontWeight:600}},'\u2713 Done')
        );
      })
    )
  );
}

    setHearts(function(h){var next=Math.max(0,h-1);saveHearts(next);return next;});

      React.createElement('div',{style:{display:'flex',gap:10,alignItems:'center'}},
        React.createElement('span',{className:'coins-badge'},'\uD83E\uDE99 '+coins),
        React.createElement('div',{className:'hearts'},

        )
      )
    ),
    React.createElement('div',{style:{fontSize:'.85rem',color:'rgba(255,255,255,.55)',marginBottom:16}},
      world1Done?'\uD83C\uDFC6 World 1 complete! World 2 unlocked.':'Complete World 1 to unlock the next world.'
    ),
    React.createElement('div',{className:'world-map'},
      worldCards.map(function(w){

            React.createElement('div',{className:'world-status',style:{color:w.done?'#4ade80':w.unlocked?'#7c3aed':'#555'}},
              w.done?'\u2713':w.unlocked?'\u25B6':'\uD83D\uDD12'

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

// ─── DATA ───────────────────────────────────────────────────────────────────

const MYTHS = [
  {stmt:"Investing is only for people who earn a lot.",correct:"MYTH",exp:"You can start a SIP with just \u20b9500/month. Starting small and early beats starting big and late every single time."},
  {stmt:"Fixed Deposits are the safest investment.",correct:"MYTH",exp:"FDs feel safe but lose to inflation. If FD gives 6.5% and inflation is 6%, your real return is just 0.5% \u2014 you\u2019re barely keeping up."},

  {stmt:"You should wait until you have enough money before investing.",correct:"MYTH",exp:"Waiting is the most expensive mistake. \u20b95,000/month invested at 25 beats \u20b910,000/month invested at 35, even with double the SIP."},

  {stmt:"You need to understand everything before you start.",correct:"MYTH",exp:"Action beats perfection. A simple index fund SIP started today, while you\u2019re still learning, will outperform the perfect plan you never execute."},

const VOCAB = [
  {def:"The rate at which the general price of goods and services rises over time, reducing your purchasing power.",term:"Inflation",opts:["Inflation","Depreciation","Recession","Stagflation"]},
  {def:"How quickly and easily an investment can be converted to cash without losing value.",term:"Liquidity",opts:["Solvency","Liquidity","Maturity","Flexibility"]},
  {def:"Spreading your money across different asset types, sectors, and geographies to reduce risk.",term:"Diversification",opts:["Allocation","Rebalancing","Diversification","Hedging"]},

const SORTER_ITEMS = [

  "Get health insurance",
  "Build your emergency fund (3-6 months)",

const SORTER_WHY = [
  "High-interest debt (36%+) guarantees you lose money. No investment beats that. Clear it first.",
  "Health emergencies are unpredictable and expensive. Insurance protects your future savings before they exist.",

  "Term insurance protects your family\u2019s financial future at the lowest cost when you\u2019re young and healthy.",

const HEALTH_CHECK = [
  {stmt:"A savings account at 3.5% is a good place to park your emergency fund long-term.",correct:false,exp:"A savings account works for liquidity but earns below inflation. Once your emergency fund is built, move it to a liquid mutual fund earning 6-7% while staying accessible within 1 day."},
  {stmt:"You should know your net worth before starting to invest.",correct:true,exp:"Net worth = Assets - Liabilities. Without this baseline, you don\u2019t know where you stand. It takes 10 minutes and changes everything."},
  {stmt:"A home loan EMI is a liability; the house itself is an asset.",correct:true,exp:"The property is an asset (it holds value). The loan is a liability (you owe money). Understanding this distinction is foundational."},
  {stmt:"Credit card debt at 36% interest should be paid off before any investing.",correct:true,exp:"No investment reliably beats 36% guaranteed return. Paying off a 36% interest credit card IS a 36% return, risk-free."},
  {stmt:"Having 6 months of emergency fund is excessive \u2014 1 month is enough.",correct:false,exp:"1 month is dangerously thin. Job hunts take 3-6 months. Medical emergencies can last longer. 3 months is minimum; 6 months is ideal."},

const BUCKETS = [
  {name:"Critical Illness Insurance",hint:"Pays lump sum if diagnosed with serious illness",correct:"E",dyk:"A serious illness can sideline your income for months. This cover pays a lump sum so you can focus on recovery, not bills."},

  {name:"International Fund (US Index)",hint:"Exposure to global markets like S&P 500",correct:"G",dyk:"Investing in the S&P 500 via an international fund diversifies your portfolio globally and hedges against rupee depreciation."},
];

const INSURANCE_MCQ = [
  {q:"Priya earns \u20b980,000/month and has 2 dependents. Using the 15x income rule, what term insurance cover should she aim for?",opts:["\u20b950 Lakhs","\u20b91.44 Crore","\u20b92 Crore","\u20b980 Lakhs"],correct:1,exp:"15\u00d7 annual income = 15 \u00d7 \u20b99,60,000 = \u20b91.44 Crore. This ensures her family can sustain their lifestyle if she\u2019s no longer there."},
  {q:"Which type of insurance gives you MONEY BACK if you survive the policy term?",opts:["Term Insurance","Endowment Plan","Health Insurance","Critical Illness Cover"],correct:1,exp:"Endowment plans pay on death OR maturity. However, they\u2019re expensive and give poor returns. Term insurance is far better for pure protection."},
  {q:"Your corporate health insurance is \u20b93 Lakhs. A week in a good private hospital today can cost:",opts:["\u20b910,000\u2013\u20b930,000","\u20b950,000\u2013\u20b91,00,000","\u20b91,50,000\u2013\u20b95,00,000","\u20b920,000\u2013\u20b940,000"],correct:2,exp:"One week of serious illness in a private hospital with ICU, medicines, and tests can easily cost \u20b92\u20134 Lakhs. \u20b93L corporate cover can vanish in days."},

const INSURANCE_TF = [

const COMPOUND_MCQ = [
  {q:"Using the Rule of 72: At 8% annual return, how many years does it take to double your money?",opts:["6 years","9 years","12 years","18 years"],correct:1,exp:"72 \u00f7 8 = 9 years. The Rule of 72 is a quick mental shortcut. At 12%, it takes just 6 years (72\u00f712). At 6%, it takes 12 years (72\u00f76)."},

const SCENARIOS = [
  {situation:"Meera, 34, has \u20b93 Lakhs in her savings account. Her monthly expenses are \u20b960,000. She has no insurance and no investments. A financial advisor tells her to start a \u20b915,000/month SIP immediately. What should she do FIRST?",opts:["Start the \u20b915,000 SIP right away","Build emergency fund to \u20b91.8L first, then SIP","Buy term + health insurance first, then build emergency fund, then SIP","Invest everything in FD for safety"],correct:2,exp:"The right order: Insurance first (cheapest protection), then emergency fund (\u20b91.8L = 3 months of \u20b960K expenses), then SIP. Starting a SIP while uninsured and without emergency fund means one illness or job loss forces you to break your investments at the worst time."},

function fmtINR(n){
  if(n>=10000000) return '\u20b9'+(n/10000000).toFixed(1)+' Cr';
  if(n>=100000) return '\u20b9'+(n/100000).toFixed(1)+' L';
  if(n>=1000) return '\u20b9'+(n/1000).toFixed(0)+' K';
  return '\u20b9'+Math.round(n);
}

function calcSIP(sip,years,rate){
  var r=rate/12/100;
  var n=years*12;
  var fv=sip*(Math.pow(1+r,n)-1)/r*(1+r);
  var invested=sip*n;
  return {invested:invested,fv:Math.round(fv),gain:Math.round(fv-invested)};
}

function SorterStage({onComplete,addCoins}){
  var [order,setOrder]=useState([]);
  var [checked,setChecked]=useState(false);
  var [score,setScore]=useState(0);

  function tap(i){
    if(checked) return;
    if(order.includes(i)) return;
    var newOrder=order.concat([i]);
    setOrder(newOrder);
    if(newOrder.length===SORTER_ITEMS.length) {}
  }

  function check(){
    var correct=0;
    order.forEach(function(item,rank){
      if(item===SORTER_CORRECT[rank]) correct++;
    });
    setScore(correct);
    setChecked(true);
    if(correct>=3) addCoins(correct===5?40:20);
  }

  function reset(){setOrder([]);setChecked(false);setScore(0);}

  if(checked){
    return React.createElement('div',{className:'card-stage'},
      React.createElement('div',{className:'complete-card'},
        React.createElement('div',{className:'complete-icon'},score===5?'\uD83C\uDFC6':'\uD83D\uDCA1'),

          );
        }),
        React.createElement('button',{className:'btn-primary',style:{marginTop:16},onClick:function(){onComplete(score);}},'\uD83C\uDFC1 Continue')
      )
    );
  }

  return React.createElement('div',{className:'card-stage'},
    React.createElement('div',{className:'stage-progress'},'Tap items in correct priority order (1 = do first)'),

    if(correct){setScore(s=>s+1);addCoins(8);setShowAnim(true);setAnimKey(k=>k+1);}
    else loseHeart();
  }
  function next(){

    else{
      var finalScore=score+((current.type==='mcq'?selected===current.correct:selected===current.ans)?1:0);

  }
  var correct=(current.type==='mcq')?selected===current.correct:selected===current.ans;

  return React.createElement('div',{className:'card-stage'},
    showAnim && React.createElement(CoinsAnim,{amount:8,key2:animKey}),

    React.createElement('div',{className:'vocab-def',style:{marginBottom:14}},current.q),
    current.type==='mcq'
      ? current.opts.map(function(o,i){

          if(selected!==null){if(i===current.correct)cls+=' correct-ans';else if(i===selected)cls+=' wrong-ans';}
          return React.createElement('button',{key:i,className:cls,onClick:function(){answer(i);},disabled:selected!==null},o);
        })
      : selected===null && React.createElement('div',{className:'tf-btns'},
          React.createElement('button',{className:'tf-btn true-btn',onClick:function(){answer(true);}},'\u2714 TRUE'),
          React.createElement('button',{className:'tf-btn false-btn',onClick:function(){answer(false);}},'\u2718 FALSE')
        ),
    selected!==null && React.createElement('div',null,
      React.createElement('div',{className:'feedback-box '+(correct?'correct':'wrong')},
        React.createElement('div',{className:'feedback-label'},correct?'\u2714 Correct!':'\u274C Wrong'),
        current.exp
      ),
      React.createElement('button',{className:'btn-primary',onClick:next},'Next \u2192')
    )
  );
}

function QuickFireStage({onComplete,addCoins,loseHeart}){
  var [idx,setIdx]=useState(0);
  var [timeLeft,setTimeLeft]=useState(12);
  var [answered,setAnswered]=useState(null);
  var [score,setScore]=useState(0);
  var [animKey,setAnimKey]=useState(0);
  var [showAnim,setShowAnim]=useState(false);
  var timerRef=useRef(null);

  useEffect(function(){
    if(answered!==null) return;
    timerRef.current=setInterval(function(){
      setTimeLeft(function(t){
        if(t<=1){
          clearInterval(timerRef.current);
          loseHeart();
          setAnswered('timeout');
          setTimeout(advance,1500);
          return 0;
        }
        return t-1;
      });
    },1000);
    return function(){clearInterval(timerRef.current);};
  },[idx,answered]);

  function answer(val){
    if(answered!==null) return;
    clearInterval(timerRef.current);
    setAnswered(val);
    var correct=val===QUICKFIRE[idx].ans;
    if(correct){setScore(s=>s+1);addCoins(8);setShowAnim(true);setAnimKey(k=>k+1);}
    else loseHeart();
    setTimeout(advance,1200);
  }

  function advance(){
    setShowAnim(false);
    if(idx<QUICKFIRE.length-1){setIdx(i=>i+1);setTimeLeft(12);setAnswered(null);}
    else onComplete(score);
  }

  var current=QUICKFIRE[idx];
  var timerPct=(timeLeft/12)*100;
  var timerColor=timeLeft>5?'#4ade80':timeLeft>3?'#fbbf24':'#f87171';

  return React.createElement('div',{className:'card-stage'},
    showAnim && React.createElement(CoinsAnim,{amount:8,key2:animKey}),
    React.createElement('div',{className:'qf-score'},score+' correct so far \u2022 '+(idx+1)+'/'+QUICKFIRE.length),
    React.createElement('div',{className:'qf-timer',style:{width:timerPct+'%',background:timerColor}}),
    React.createElement('div',{style:{textAlign:'right',fontSize:'.75rem',color:'rgba(255,255,255,.45)',marginBottom:8}},timeLeft+'s'),
    React.createElement('div',{className:'qf-card'},
      React.createElement('div',{style:{fontSize:'1rem',lineHeight:1.55}},current.q),
      answered===null
        ? React.createElement('div',{className:'tf-btns',style:{marginTop:14}},
            React.createElement('button',{className:'tf-btn true-btn',onClick:function(){answer(true);}},'\u2714 TRUE'),
            React.createElement('button',{className:'tf-btn false-btn',onClick:function(){answer(false);}},'\u2718 FALSE')
          )
        : React.createElement('div',{className:'feedback-box '+(answered===current.ans?'correct':answered==='timeout'?'wrong':'wrong'),style:{marginTop:12}},
            answered==='timeout'?'\u23F0 Time\u2019s up! Answer: '+(current.ans?'TRUE':'FALSE')
            :(answered===current.ans?'\u2714 Correct!':'\u274C Wrong \u2014 Answer: '+(current.ans?'TRUE':'FALSE'))
          )
    )
  );
}

function StageRouter({stageId,onComplete,addCoins,loseHeart}){
  switch(stageId){
    case 'myths': return React.createElement(MythBusterStage,{onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart});
    case 'vocab': return React.createElement(VocabStage,{onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart});
    case 'sorter': return React.createElement(SorterStage,{onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart});
    case 'health': return React.createElement(TFStage,{items:HEALTH_CHECK,onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart,coinsPerQ:8});
    case 'buckets': return React.createElement(BucketStage,{onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart});
    case 'insurance': return React.createElement(InsuranceStage,{onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart});
    case 'compound': return React.createElement(CompoundStage,{onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart});
    case 'scenarios': return React.createElement(MCQStage,{items:SCENARIOS,onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart,coinsPerQ:12});
    case 'quickfire': return React.createElement(QuickFireStage,{onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart});
    case 'boss': return React.createElement(MCQStage,{items:BOSS_QS,onComplete:onComplete,addCoins:addCoins,loseHeart:loseHeart,coinsPerQ:25,showContext:true,context:BOSS_CONTEXT});
    default: return React.createElement('div',null,'Unknown stage');
  }
}

// ─── WORLD VIEW ─────────────────────────────────────────────────────────────

function WorldView({worldNum,progress,onBack,addCoins,loseHeart,onWorldComplete}){
  var [activeStage,setActiveStage]=useState(null);
  var [stageResult,setStageResult]=useState(null);
  var allStageIds=STAGES.map(function(s){return s.id;});

  var completedStages=progress.completedStages||[];

  function getStageStatus(stageId){
    if(completedStages.includes(stageId)) return 'done';
    var idx=allStageIds.indexOf(stageId);
    if(idx===0) return 'active';
    var prev=allStageIds[idx-1];
    if(completedStages.includes(prev)) return 'active';
    return 'locked';
  }

  function startStage(stageId){
    var status=getStageStatus(stageId);
    if(status==='locked') return;
    setActiveStage(stageId);
    setStageResult(null);
  }

  function completeStage(score){
    var newCompleted=completedStages.includes(activeStage)?completedStages:completedStages.concat([activeStage]);
    if(activeStage==='boss') addCoins(300);
    setStageResult({score:score,stageId:activeStage});
    setActiveStage(null);
    onWorldComplete(newCompleted);
  }

  if(activeStage){
    var stageDef=STAGES.find(function(s){return s.id===activeStage;});
    return React.createElement('div',{className:'app-wrap'},
      React.createElement('button',{className:'back-btn',onClick:function(){setActiveStage(null);}},'\u2190 '+stageDef.name),
      React.createElement('div',{className:'hdr'},
        React.createElement('span',{className:'hdr-title'},stageDef.icon+' '+stageDef.name),
        React.createElement('div',{style:{display:'flex',gap:8,alignItems:'center'}},
          React.createElement('span',{className:'coins-badge'},'\uD83E\uDE99 '+loadCoins())
        )
      ),
      React.createElement(StageRouter,{stageId:activeStage,onComplete:completeStage,addCoins:addCoins,loseHeart:loseHeart})
    );
  }

  var allDone=allStageIds.every(function(id){return completedStages.includes(id);});

  return React.createElement('div',{className:'app-wrap'},
    React.createElement('button',{className:'back-btn',onClick:onBack},'\u2190 World Map'),
    React.createElement('div',{className:'hdr'},
      React.createElement('span',{className:'hdr-title'},'\uD83C\uDF0D World 1: Clean House'),
      React.createElement('span',{className:'coins-badge'},'\uD83E\uDE99 '+loadCoins())
    ),
    React.createElement('div',{className:'progress-bar-wrap'},
      React.createElement('div',{className:'progress-bar-fill',style:{width:(completedStages.length/STAGES.length*100)+'%'}})
    ),
    React.createElement('div',{style:{fontSize:'.82rem',color:'rgba(255,255,255,.5)',marginBottom:14,textAlign:'center'}},completedStages.length+'/'+STAGES.length+' stages complete'),
    allDone && React.createElement('div',{className:'world-complete',style:{marginBottom:16}},
      React.createElement('div',{style:{fontSize:'2.5rem',marginBottom:8}},'\uD83C\uDFC6'),
      React.createElement('div',{style:{fontSize:'1.2rem',fontWeight:700,color:'#4ade80',marginBottom:6}},'World 1 Complete!'),
      React.createElement('div',{style:{fontSize:'.88rem',color:'rgba(255,255,255,.7)'}},'You\u2019ve mastered the Clean House journey. World 2 is now unlocked!')
    ),
    React.createElement('div',{className:'stage-list'},
      STAGES.map(function(stage){
        var status=getStageStatus(stage.id);
        return React.createElement('div',{key:stage.id,className:'stage-item '+status,onClick:function(){startStage(stage.id);}},
          React.createElement('div',{className:'stage-num',style:{background:status==='done'?'#22c55e':status==='active'?'#7c3aed':'#2a2a4e'}},
            status==='done'?'\u2713':status==='locked'?'\uD83D\uDD12':stage.icon
          ),
          React.createElement('div',{className:'stage-info'},
            React.createElement('div',{className:'stage-name'},stage.name),
            React.createElement('div',{className:'stage-desc'},stage.desc)
          ),
          status==='done' && React.createElement('div',{style:{color:'#4ade80',fontSize:'.8rem',fontWeight:600}},'\u2713 Done')
        );
      })
    )
  );
}

function App(){
  var [screen,setScreen]=useState('map');
  var [activeWorld,setActiveWorld]=useState(null);

  var world1Progress=progress.world1||{completedStages:[]};

  function addCoins(n){
    setCoins(function(c){var next=c+n;saveCoins(next);return next;});
  }
  function loseHeart(){
    setHearts(function(h){var next=Math.max(0,h-1);saveHearts(next);return next;});
  }
  function updateWorld1Progress(completedStages){
    var newProg=Object.assign({},progress,{world1:{completedStages:completedStages}});
    setProgress(newProg);

  }

  return React.createElement('div',{className:'app-wrap'},
    React.createElement('div',{className:'hdr'},
      React.createElement('span',{className:'hdr-title'},'\uD83E\uDDE0 Investopia 2'),
      React.createElement('div',{style:{display:'flex',gap:10,alignItems:'center'}},
        React.createElement('span',{className:'coins-badge'},'\uD83E\uDE99 '+coins),
        React.createElement('div',{className:'hearts'},
          [1,2,3,4,5].map(function(i){return React.createElement('span',{key:i,className:'heart'},i<=hearts?'\u2665\uFE0F':'\u2661');})
        )
      )
    ),
    React.createElement('div',{style:{fontSize:'.85rem',color:'rgba(255,255,255,.55)',marginBottom:16}},
      world1Done?'\uD83C\uDFC6 World 1 complete! World 2 unlocked.':'Complete World 1 to unlock the next world.'
    ),
    React.createElement('div',{className:'world-map'},
      worldCards.map(function(w){
        var cls='world-card '+(w.done?'completed':w.unlocked?'unlocked':'locked');
        return React.createElement('div',{key:w.num,className:cls,onClick:function(){

            React.createElement('div',null,
              React.createElement('div',{className:'world-name',style:{color:w.done?'#4ade80':w.unlocked?'#c084fc':'rgba(255,255,255,.5)'}},
                'World '+w.num+': '+w.name
              ),
              React.createElement('div',{className:'world-sub'},w.sub),
              React.createElement('div',{className:'world-sub',style:{marginTop:2}},w.desc)
            ),
            React.createElement('div',{className:'world-status',style:{color:w.done?'#4ade80':w.unlocked?'#7c3aed':'#555'}},
              w.done?'\u2713':w.unlocked?'\u25B6':'\uD83D\uDD12'
