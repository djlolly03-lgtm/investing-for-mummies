          &lt;/div&gt;
          &lt;div style={{background:&quot;rgba(255,255,255,0.95)&quot;,borderRadius:12,padding:&quot;10px&quot;,color:&quot;var(--navy)&quot;}}&gt;
            &lt;div style={{fontSize:&quot;0.52rem&quot;,fontWeight:800,letterSpacing:1,textTransform:&quot;uppercase&quot;,opacity:0.7}}&gt;Ended with&lt;/div&gt;
            &lt;div style={{fontFamily:&quot;&#x27;Lora&#x27;,serif&quot;,fontWeight:700,fontSize:&quot;1.1rem&quot;,marginTop:2,color:totalReturn&gt;=0?&quot;var(--success)&quot;:&quot;var(--danger)&quot;}}&gt;{inrShort(netWorth)}&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div style={{background:&quot;rgba(255,255,255,0.1)&quot;,borderRadius:12,padding:&quot;10px&quot;}}&gt;
          &lt;div style={{fontSize:&quot;0.58rem&quot;,opacity:0.8,marginBottom:2}}&gt;Total Return&lt;/div&gt;
          &lt;div style={{fontFamily:&quot;&#x27;Lora&#x27;,serif&quot;,fontWeight:700,fontSize:&quot;1.6rem&quot;,color:totalReturn&gt;=0?&quot;#4dffaa&quot;:&quot;#ff8a80&quot;}}&gt;
            {totalReturn&gt;=0?&quot;+&quot;:&quot;&quot;}{returnPct}%
          &lt;/div&gt;
          &lt;div style={{fontSize:&quot;0.7rem&quot;,opacity:0.85,marginTop:2}}&gt;{inrSigned(totalReturn)}&lt;/div&gt;
        &lt;/div&gt;
        {/* Growth chart */}
        {portfolioHistory &amp;&amp; portfolioHistory.length &gt;= 2 &amp;&amp; (
          &lt;div style={{marginTop:14,background:&quot;rgba(255,255,255,0.08)&quot;,borderRadius:12,padding:&quot;10px 6px 4px&quot;}}&gt;
            &lt;div style={{fontSize:&quot;0.52rem&quot;,fontWeight:900,letterSpacing:1.5,textTransform:&quot;uppercase&quot;,opacity:0.7,marginBottom:4,textAlign:&quot;center&quot;}}&gt;Portfolio Growth&lt;/div&gt;
            &lt;PortfolioChart history={portfolioHistory}/&gt;
          &lt;/div&gt;
        )}
      &lt;/div&gt;

      {/* Dividends */}
      {totalDividends &gt; 0 &amp;&amp; (
        &lt;div style={{background:&quot;var(--gold-lt)&quot;,border:&quot;1.5px solid var(--gold)&quot;,borderRadius:14,padding:&quot;12px 14px&quot;,marginBottom:10,display:&quot;flex&quot;,alignItems:&quot;center&quot;,gap:12}}&gt;
          &lt;div style={{fontSize:&quot;1.6rem&quot;}}&gt;💰&lt;/div&gt;
          &lt;div&gt;
            &lt;div style={{fontWeight:800,color:&quot;#8b5e1a&quot;,fontSize:&quot;0.78rem&quot;}}&gt;Total dividends received&lt;/div&gt;
            &lt;div style={{fontFamily:&quot;&#x27;Lora&#x27;,serif&quot;,fontWeight:700,fontSize:&quot;1.1rem&quot;,color:var_gold()}}&gt;{inr(totalDividends)}&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      )}

      {/* Holdings */}
      {ownedStocks.length &gt; 0 &amp;&amp; (
        &lt;div className=&quot;card&quot;&gt;
          &lt;div className=&quot;card-title&quot;&gt;📊 Final Holdings&lt;/div&gt;
          {ownedStocks.map(c=&gt;{
            const h = holdings[c.id];
            const curVal = h.qty*(prices[c.id]||0);
            const gl = curVal - h.costBasis;
            const glPct = h.costBasis&gt;0 ? (gl/h.costBasis*100).toFixed(1) : &quot;0&quot;;
            return (
              &lt;div key={c.id} className=&quot;pf-row&quot;&gt;
                &lt;Logo stock={c} size={38} /&gt;
                &lt;div className=&quot;pf-info&quot;&gt;
                  &lt;div className=&quot;pf-name&quot;&gt;{c.name}&lt;/div&gt;
                  &lt;div className=&quot;pf-sub&quot;&gt;{h.qty} shares · avg {inr(h.costBasis/h.qty)}&lt;/div&gt;
                &lt;/div&gt;
                &lt;div className=&quot;pf-val&quot;&gt;
                  &lt;div className=&quot;pf-cur&quot;&gt;{inrShort(curVal)}&lt;/div&gt;
                  &lt;div className={&quot;pf-gl &quot;+(gl&gt;=0?&quot;pos&quot;:&quot;neg&quot;)}&gt;{gl&gt;=0?&quot;+&quot;:&quot;&quot;}{glPct}%&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            );
          })}
          &lt;div style={{display:&quot;flex&quot;,justifyContent:&quot;space-between&quot;,alignItems:&quot;center&quot;,paddingTop:10,marginTop:4,borderTop:&quot;1px solid #eef2f4&quot;}}&gt;
            &lt;span style={{fontSize:&quot;0.72rem&quot;,color:&quot;var(--muted)&quot;,fontWeight:700}}&gt;Cash remaining&lt;/span&gt;
            &lt;span style={{fontFamily:&quot;&#x27;Lora&#x27;,serif&quot;,fontWeight:700,color:&quot;var(--navy)&quot;}}&gt;{inrShort(cash)}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      )}

      {/* Insight */}
      &lt;div className=&quot;scenario-box&quot; style={{marginBottom:10}}&gt;
        &lt;div className=&quot;lbl&quot;&gt;🌟 The Big Lesson&lt;/div&gt;
        &lt;div className=&quot;body-t&quot;&gt;The Indian stock market has rewarded long-term, patient investors enormously. Dixon gave 100× returns. Reliance 3×. Yes Bank was a cautionary tale. Diversification and staying invested through crashes are the real superpowers.&lt;/div&gt;
      &lt;/div&gt;

      &lt;button className=&quot;btn-primary&quot; onClick={onRestart}&gt;🔄 Play Again — try a different strategy&lt;/button&gt;
    &lt;/div&gt;
  );
}

// hack to use CSS var in JS
function var_gold() { return &quot;#c9a84c&quot;; }

/* ═══════════════════════════════════════
   MAIN APP
═══════════════════════════════════════ */
function App() {
  const [phase, setPhase]   = useState(&quot;welcome&quot;); // welcome|round|event|trade|results
  const [ri, setRi]         = useState(0);
  const [ei, setEi]         = useState(0);
  const [cash, setCash]     = useState(STARTING_CASH);
  const [holdings, setHoldings] = useState({});
  const [prices, setPrices] = useState({...ROUND_PRICES[0]});
  const [tradeLog, setTradeLog]   = useState([]);
  const [totalDividends, setTotalDividends] = useState(0);
  const [zomatoInGame, setZomatoInGame] = useState(false);
  const [portfolioHistory, setPortfolioHistory] = useState([{year:&quot;Start&quot;,value:STARTING_CASH}]);
  const [toast, setToast]   = useState(null);
  const [activeStock, setActiveStock] = useState(null);
  const [ipoOpen, setIpoOpen] = useState(false);
  const [allocResult, setAllocResult] = useState(null);
  const [buybackOffer, setBuybackOffer] = useState(null);
  const [rightsOffer, setRightsOffer] = useState(null);

  const round = ROUNDS[ri];
  const allStocks = ALL_STOCKS(zomatoInGame);

  const showToast = (msg, kind=&quot;success&quot;) =&gt; {
    setToast({msg,kind,id:Date.now()});
    setTimeout(()=&gt;setToast(null),2200);
  };

  const applyRoundPrices = (roundIdx) =&gt; setPrices({...ROUND_PRICES[roundIdx]});

  const applyEvent = (ev) =&gt; {
    if (ev.type === &quot;split&quot;) {
      const h = holdings[ev.stockId]?.qty||0;
      if (h &gt; 0) {
        setHoldings(prev=&gt;({...prev,[ev.stockId]:{qty:prev[ev.stockId].qty*ev.ratio,costBasis:prev[ev.stockId].costBasis}}));
      }
    }
    if (ev.type === &quot;bonus&quot;) {
      const h = holdings[ev.stockId]?.qty||0;
      if (h &gt; 0) {
        setHoldings(prev=&gt;({...prev,[ev.stockId]:{qty:prev[ev.stockId].qty*(1+ev.ratio),costBasis:prev[ev.stockId].costBasis}}));
      }
    }
    if (ev.type === &quot;dividend&quot;) {
      const h = holdings[ev.stockId]?.qty||0;
      if (h &gt; 0) {
        const earned = h*ev.perShare;
        setCash(c=&gt;c+earned);
        setTotalDividends(d=&gt;d+earned);
      }
    }
  };

  const handleBuy = (stock, qty) =&gt; {
    const p = prices[stock.id]||0;
    const cost = qty*p;
    if (cost &gt; cash) { showToast(&quot;Not enough cash!&quot;,&quot;error&quot;); return; }
    setCash(c=&gt;c-cost);
    setHoldings(h=&gt;{
      const cur = h[stock.id]||{qty:0,costBasis:0};
      return {...h,[stock.id]:{qty:cur.qty+qty,costBasis:cur.costBasis+cost}};
    });
    setTradeLog(l=&gt;[...l,{type:&quot;buy&quot;,stockId:stock.id,qty,price:p,year:round.year}]);
    showToast(`Bought ${qty} ${stock.name} · ${inr(cost)}`);
  };

  const handleSell = (stock, qty) =&gt; {
    const cur = holdings[stock.id];
    if (!cur||cur.qty&lt;qty) { showToast(&quot;Not enough shares&quot;,&quot;error&quot;); return; }
    const p = prices[stock.id]||0;
    const proceeds = qty*p;
    setCash(c=&gt;c+proceeds);
    setHoldings(h=&gt;{
      const avg = cur.costBasis/cur.qty;
      const newQty = cur.qty-qty;
      return {...h,[stock.id]:{qty:newQty,costBasis:newQty*avg}};
    });
    setTradeLog(l=&gt;[...l,{type:&quot;sell&quot;,stockId:stock.id,qty,price:p,year:round.year}]);
    showToast(`Sold ${qty} ${stock.name} · +${inr(proceeds)}`);
  };

  const handleIPOApply = ({lots,sellPlan,applyAmount}) =&gt; {
    let totalProceeds = 0;
    const newH = {...holdings};
    Object.entries(sellPlan).forEach(([id,q])=&gt;{
      if(!q) return;
      const p = prices[id]||0;
      const cur = newH[id]||{qty:0,costBasis:0};
      const avg = cur.costBasis/cur.qty;
      const nq = cur.qty-q;
      newH[id]={qty:nq,costBasis:nq*avg};
      totalProceeds += q*p;
    });
    setHoldings(newH);
    const lotsAllotted = Math.max(1,Math.round(lots*ZOMATO.expectedAlloc));
    const allocated = lotsAllotted*ZOMATO.lotSize;
    const actualCost = allocated*ZOMATO.ipoPrice;
    const refunded = applyAmount-actualCost;
    setCash(c=&gt;c+totalProceeds-actualCost);
    setHoldings(h=&gt;{
      const cur=h.zomato||{qty:0,costBasis:0};
      return {...h,zomato:{qty:cur.qty+allocated,costBasis:cur.costBasis+actualCost}};
    });
    setZomatoInGame(true);
    setAllocResult({applied:applyAmount,allocated,refunded,lotsAllotted});
  };

  // Navigation
  const startGame = () =&gt; {
    applyRoundPrices(0);
    setPhase(&quot;round&quot;);
  };

  // IPO events are handled via the trade-screen banner — skip in EventScreen
  const isDisplayable = (ev) =&gt; ev.type !== &quot;ipo&quot;;

  const startRound = () =&gt; {
    applyRoundPrices(ri);
    const events = round.events;
    const firstIdx = events.findIndex(isDisplayable);
    if (firstIdx &gt;= 0) {
      setEi(firstIdx);
      setPhase(&quot;event&quot;);
    } else {
      setPhase(&quot;trade&quot;);
    }
  };

  const nextEvent = () =&gt; {
    // Apply the current event NOW (after player has had chance to buy)
    applyEvent(round.events[ei]);
    const events = round.events;
    const nextIdx = events.findIndex((e, i) =&gt; i &gt; ei &amp;&amp; isDisplayable(e));
    if (nextIdx &gt;= 0) {
      setEi(nextIdx);
    } else {
      setPhase(&quot;trade&quot;);
    }
  };

  const doneTrading = () =&gt; {
    // Snapshot portfolio value for chart
    const allSt = ALL_STOCKS(zomatoInGame);
    const snap = cash + allSt.reduce((s,c)=&gt;s+(holdings[c.id]?.qty||0)*(prices[c.id]||0),0);
    setPortfolioHistory(h =&gt; {
      const next = [...h];
      next[ri+1] = {year:round.year, value:snap}; // ri+1 because index 0 = Start
      return next.slice(0, ri+2);
    });
    if (ri &lt; ROUNDS.length-1) {
      setRi(r=&gt;r+1);
      setPhase(&quot;round&quot;);
      setActiveStock(null); setIpoOpen(false);
    } else {
      setPhase(&quot;results&quot;);
    }
  };

  const handleBuyback = ({stockId,buybackPrice,maxShares}) =&gt; {
    const cur = holdings[stockId];
    if (!cur||cur.qty&lt;=0) { nextEvent(); return; }
    const proceeds = maxShares*buybackPrice;
    setCash(c=&gt;c+proceeds);
    setHoldings(h=&gt;{
      const avg=cur.costBasis/cur.qty;
      const nq=cur.qty-maxShares;
      return {...h,[stockId]:{qty:nq,costBasis:nq*avg}};
    });
    showToast(`Tendered ${maxShares} shares at ${inr(buybackPrice)} — premium secured!`);
    nextEvent();
  };

  const handleRights = ({stockId,shares,price}) =&gt; {
    const cost = shares*price;
    if (cost &gt; cash) { showToast(&quot;Not enough cash&quot;,&quot;error&quot;); return; }
    setCash(c=&gt;c-cost);
    setHoldings(h=&gt;{
      const cur=h[stockId]||{qty:0,costBasis:0};
      return {...h,[stockId]:{qty:cur.qty+shares,costBasis:cur.costBasis+cost}};
    });
    showToast(`Subscribed ${shares} Dixon shares at ${inr(price)}!`);
    nextEvent();
  };

  const restart = () =&gt; {
    setRi(0); setEi(0);
    setCash(STARTING_CASH); setHoldings({});
    setPrices({...ROUND_PRICES[0]});
    setTradeLog([]); setTotalDividends(0);
    setZomatoInGame(false); setActiveStock(null);
    setIpoOpen(false); setAllocResult(null);
    setPortfolioHistory([{year:&quot;Start&quot;,value:STARTING_CASH}]);
    setPhase(&quot;welcome&quot;);
  };

  // Hero headline
  const heroHeadline = phase===&quot;trade&quot;
    ? round.headline
    : phase===&quot;event&quot;
    ? round.events[ei]?.headline
    : round.headline;

  return (
    &lt;div className=&quot;phone&quot;&gt;
      {/* Hero */}
      &lt;div className=&quot;hero&quot;&gt;
        &lt;div className=&quot;hero-top&quot;&gt;
          &lt;div className=&quot;hero-logo&quot;&gt;&lt;img src={IFM_LOGO} alt=&quot;IFM&quot; onError={e=&gt;e.target.style.display=&quot;none&quot;}/&gt;&lt;/div&gt;
          &lt;div className=&quot;hero-meta&quot;&gt;
            &lt;div className=&quot;gtag&quot;&gt;📊 Trading Simulation&lt;/div&gt;
            &lt;div className=&quot;gname&quot;&gt;My First Trade&lt;/div&gt;
          &lt;/div&gt;
          &lt;div className=&quot;round-chip&quot;&gt;{round.emoji} {round.year} · {round.roundLabel}&lt;/div&gt;
        &lt;/div&gt;
        {phase !== &quot;welcome&quot; &amp;&amp; phase !== &quot;results&quot; &amp;&amp; (
          &lt;Kpi cash={cash} holdings={holdings} prices={prices} zomatoInGame={zomatoInGame}/&gt;
        )}
      &lt;/div&gt;

      {/* News strip */}
      {phase !== &quot;welcome&quot; &amp;&amp; phase !== &quot;results&quot; &amp;&amp; (
        &lt;div className=&quot;news&quot;&gt;
          &lt;div className=&quot;news-ic&quot;&gt;{round.emoji}&lt;/div&gt;
          &lt;div className=&quot;news-txt&quot;&gt;{heroHeadline}&lt;/div&gt;
        &lt;/div&gt;
      )}

      {/* Progress dots */}
      {phase !== &quot;welcome&quot; &amp;&amp; phase !== &quot;results&quot; &amp;&amp; (
        &lt;div className=&quot;dots&quot; style={{padding:&quot;6px 0&quot;,background:&quot;var(--cream)&quot;}}&gt;
          {ROUNDS.map((_,i)=&gt;(
            &lt;div key={i} className={&quot;dot&quot;+(i&lt;ri?&quot; done&quot;:i===ri?&quot; active&quot;:&quot;&quot;)} style={{width:i===ri?22:8}}/&gt;
          ))}
        &lt;/div&gt;
      )}

      {/* Screen content */}
      {phase===&quot;welcome&quot; &amp;&amp; &lt;WelcomeScreen onStart={startGame}/&gt;}
      {phase===&quot;round&quot;   &amp;&amp; &lt;RoundScreen round={round} ri={ri} holdings={holdings} prices={prices} cash={cash} zomatoInGame={zomatoInGame} onStart={startRound}/&gt;}
      {phase===&quot;event&quot;   &amp;&amp; &lt;EventScreen event={round.events[ei]} ri={ri} holdings={holdings} prices={prices} cash={cash} onNext={nextEvent} onBuyback={handleBuyback} onRights={handleRights} onBuyFirst={s=&gt;setActiveStock(s)} onGoBack={ri&gt;0?()=&gt;{setActiveStock(null);setRi(r=&gt;r-1);setPhase(&quot;trade&quot;);}:null}/&gt;}
      {phase===&quot;trade&quot;   &amp;&amp; (
        &lt;div className=&quot;body&quot; style={{padding:12}}&gt;
          {/* IPO banner if Zomato round and not yet in game */}
          {ri===2 &amp;&amp; !zomatoInGame &amp;&amp; (
            &lt;div className=&quot;ipo-card&quot; onClick={()=&gt;setIpoOpen(true)}&gt;
              &lt;div className=&quot;ipo-pulse&quot;&gt;🔥 LIVE&lt;/div&gt;
              &lt;div className=&quot;ipo-logo&quot;&gt;Z&lt;/div&gt;
              &lt;div className=&quot;ipo-meta&quot;&gt;
                &lt;div className=&quot;ipo-tag&quot;&gt;First-Ever IPO Opportunity&lt;/div&gt;
                &lt;div className=&quot;ipo-title&quot;&gt;Zomato IPO · ₹76&lt;/div&gt;
                &lt;div className=&quot;ipo-sub&quot;&gt;Lot ₹14,820 · 38× subscribed · Close soon&lt;/div&gt;
              &lt;/div&gt;
              &lt;div className=&quot;ipo-cta&quot;&gt;Apply →&lt;/div&gt;
            &lt;/div&gt;
          )}
          &lt;div className=&quot;stock-grid&quot;&gt;
            {allStocks.map(s=&gt;(
              &lt;StockCard
                key={s.id}
                stock={s}
                price={prices[s.id]||0}
                prevPrice={ROUND_PRICES[Math.max(0,ri-1)][s.id]||prices[s.id]||1}
                held={holdings[s.id]?.qty||0}
                onTap={()=&gt;setActiveStock(s)}
              /&gt;
            ))}
          &lt;/div&gt;
          &lt;button className=&quot;btn-primary&quot; style={{marginTop:4}} onClick={doneTrading}&gt;
            {ri&lt;ROUNDS.length-1 ? `Done Trading · Advance to ${ROUNDS[ri+1].year} →` : &quot;See My Results 🎓&quot;}
          &lt;/button&gt;
        &lt;/div&gt;
      )}
      {phase===&quot;results&quot; &amp;&amp; &lt;ResultsScreen holdings={holdings} prices={prices} cash={cash} tradeLog={tradeLog} totalDividends={totalDividends} zomatoInGame={zomatoInGame} onRestart={restart} portfolioHistory={portfolioHistory}/&gt;}

      {/* Trade sheet */}
      &lt;TradeSheet
        stock={activeStock}
        price={activeStock?prices[activeStock.id]||0:0}
        prevPrice={activeStock?ROUND_PRICES[Math.max(0,ri-1)][activeStock.id]||prices[activeStock.id]||1:1}
        held={activeStock?holdings[activeStock.id]?.qty||0:0}
        cash={cash}
        onClose={()=&gt;setActiveStock(null)}
        onBuy={handleBuy}
        onSell={handleSell}
        prevYear={ri&gt;0?ROUNDS[ri-1].year:null}
        onGoBack={ri&gt;0?()=&gt;{setActiveStock(null);setRi(r=&gt;r-1);setPhase(&quot;trade&quot;);}:null}
      /&gt;
      &lt;IPOSheet open={ipoOpen} cash={cash} holdings={holdings} prices={prices} onClose={()=&gt;setIpoOpen(false)} onApply={handleIPOApply}/&gt;
      &lt;AllocResult result={allocResult} onClose={()=&gt;setAllocResult(null)}/&gt;

      {/* Toast */}
      {toast &amp;&amp; &lt;div className={&quot;toast show &quot;+toast.kind} key={toast.id}&gt;{toast.msg}&lt;/div&gt;}
    &lt;/div&gt;
  );
}

ReactDOM.createRoot(document.getElementById(&quot;root&quot;)).render(&lt;App/&gt;);
&lt;/script&gt;
&lt;/body&gt;
