<!-- Show JS errors on mobile instead of blank screen -->
<script>
window.addEventListener('error', function(e) {
  var r = document.getElementById('root');
  if (r && r.innerHTML.indexOf('Loading') !== -1) {
    r.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#071a10;color:#fff;font-family:sans-serif;text-align:center;padding:24px"><div><div style="font-size:18px;margin-bottom:12px">Failed to load</div><div style="color:rgba(255,255,255,0.6);font-size:13px;word-break:break-all">' + (e.message || 'Unknown error') + '</div><div style="margin-top:16px"><a href="" style="color:#4ade80">Tap to refresh</a></div></div></div>';
  }
});
</script>

<!-- Polyfills for older mobile browsers -->
<script>
if (!crypto.randomUUID) {
  crypto.randomUUID = function() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
      var v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  };
}
if (!window.structuredClone) {
  window.structuredClone = function(obj) { return JSON.parse(JSON.stringify(obj)); };
}
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Load Supabase async, then boot engine. Page stays responsive on slow connections. -->
<script>
(function(){
  function loadEngine() {
    var e = document.createElement('script');
    e.src = 'engine.js?v=20260730at-layoutfx';
    document.head.appendChild(e);
  }
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  s.onload = loadEngine;
  s.onerror = function() {
    document.getElementById('root').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#071a10;color:#fff;font-family:sans-serif;text-align:center;padding:24px">' +
      '<div><div style="font-size:22px;margin-bottom:12px">No connection</div>' +
      '<div style="color:rgba(255,255,255,0.6)">Check your internet and <a href="" style="color:#4ade80">tap to refresh</a></div></div></div>';
  };
  document.head.appendChild(s);
})();
</script>

<!-- shared UI -->
<script type="text/babel" src="ui-common.jsx?v=20260730at-layoutfx"></script>
<script type="text/babel" src="host-view.jsx?v=20260730at-layoutfx"></script>
<script type="text/babel" src="player-view.jsx?v=20260730at-layoutfx"></script>

<script type="text/babel">
function App() {
  const params = new URLSearchParams(window.location.search);
  // Bare /stock-rush/ now defaults straight to host — the landing splash was
  // dead weight for the teacher's one-click "open + project" flow. Rival-host
  // clashes are prevented by (a) per-workshop random room codes, so a random
  // visitor gets their own throwaway room, and (b) explicit ?role=player for
  // the student join link (baked into the QR code).
  const initialRole = params.get('role') || 'host';
  const [role, setRole] = React.useState(initialRole);
  // Wait for engine.js to finish loading (it loads async after Supabase)
  const [ready, setReady] = React.useState(!!window.StockRush);
  const [slow, setSlow]   = React.useState(false);

  React.useEffect(() => {
    if (window.StockRush) { setReady(true); return; }
    const timeout = setTimeout(() => setSlow(true), 10000);
    const t = setInterval(() => {
      if (window.StockRush) { setReady(true); clearInterval(t); clearTimeout(timeout); }
    }, 100);
    return () => { clearInterval(t); clearTimeout(timeout); };
  }, []);

  if (!ready) {
    if (slow) return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#071a10',color:'#fff',fontFamily:'sans-serif',textAlign:'center',padding:24}}>
        <div>
          <div style={{fontSize:18,marginBottom:12}}>Taking longer than expected</div>
          <div style={{color:'rgba(255,255,255,0.6)',marginBottom:16,fontSize:14}}>Check your internet connection</div>
          <a href="" style={{color:'#4ade80',fontSize:15}}>Tap to refresh</a>
        </div>
      </div>
    );
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#071a10',color:'rgba(255,255,255,0.5)',fontFamily:'sans-serif',fontSize:16,letterSpacing:'0.05em'}}>
        Loading…
      </div>
    );
  }

  function pick(r) {
    // Full reload so engine.js re-bootstraps with the new role. `_isHostTab`
    // is evaluated at engine init from the URL, so we can't just flip React
    // state — the engine needs to see `?role=host` at page load to actually
    // claim host and start writing.
    const p = new URLSearchParams(window.location.search);
    p.set('role', r);
    // Going to host mode → always mint a fresh per-workshop room. Stripping
    // any stale ?room= param forces the engine to generate a new 4-letter
    // code (see engine.js:26-33) instead of resuming a leftover room from
    // yesterday or someone else's session.
    if (r === 'host') p.delete('room');
    window.location.search = p.toString();
  }

  if (role === 'host')   return <ErrorBoundary name="host"><HostView /></ErrorBoundary>;
  if (role === 'player') return <ErrorBoundary name="player"><PlayerView /></ErrorBoundary>;
  return <Landing onPick={pick} />;
}

// React error boundary: if HostView or PlayerView throws during render, we
// show a Retry screen with the error message instead of a blank white page.
// Class component because error boundaries can't be hooks-based (yet). Logs
// to console so a live debug session can grab the stack trace.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, message: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, message: (error && error.message) || String(error) };
  }
  componentDidCatch(error, info) {
    try {
      console.error('[StockRush] Uncaught render error in ' + (this.props.name || 'view') + ':', error, info);
    } catch(e) {}
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          height: '100vh', background: '#071a10', color: '#fff',
          fontFamily: 'sans-serif', textAlign: 'center', padding: 24,
        }}>
          <div style={{ maxWidth: 380 }}>
            <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>Something broke</div>
            <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.6)', marginBottom: 20, wordBreak: 'break-word' }}>
              {this.state.message || 'Unknown error'}
            </div>
            <button
              onClick={() => window.location.reload()}
              style={{
                background: '#4ade80', color: '#071a10', border: 'none',
                padding: '10px 20px', borderRadius: 8, fontSize: 15,
                fontWeight: 700, cursor: 'pointer',
              }}
            >
              ↺ Reload
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function Landing({ onPick }) {
  return (
    <div className="landing">
      <div className="landing-card">
        <div className="landing-mark">SR</div>
        <h1 className="landing-title">Stock Rush</h1>
        <div className="landing-sub">
          A fast-paced classroom stock market game. Teacher projects the leaderboard; students join on their phones.
        </div>
        <div className="role-row">
          <button className="role-card" onClick={() => onPick('host')}>
            <div className="role-eyebrow">FOR TEACHERS</div>
            <div className="role-title">Host the game</div>
            <div className="role-desc">
              Project this on the classroom screen. Shows the live market, headlines, leaderboard, and a room code for students to join.
            </div>
            <div className="role-cta">OPEN HOST VIEW →</div>
          </button>
          <button className="role-card" onClick={() => onPick('player')}>
            <div className="role-eyebrow">FOR STUDENTS</div>
            <div className="role-title">Join as a player</div>
            <div className="role-desc">
              Trade from your phone. Buy and sell, react to headlines, climb the leaderboard.
            </div>
            <div className="role-cta">JOIN GAME →</div>
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
