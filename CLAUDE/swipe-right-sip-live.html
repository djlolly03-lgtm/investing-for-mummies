<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Swipe Right on SIP — Live Classroom</title>
<link rel="icon" type="image/png" href="/ifm-round.png">
<meta name="theme-color" content="#1e3a27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --forest:#1e3a27; --forest-2:#16301f; --forest-3:#0f2415;
  --lime:#c9f24e; --cream:#ece6d7; --amber:#e9b63c; --rust:#e8714a;
  --line:rgba(201,242,78,0.14); --line-soft:rgba(236,230,215,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
body{
  background:var(--forest); color:var(--cream); font-family:'Space Grotesk',sans-serif;
  overflow-x:hidden;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:260px 260px; background-position:center top;
}
.mono{font-family:'Space Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;}
.anton{font-family:'Anton',sans-serif;text-transform:uppercase;font-weight:400;}
#root{min-height:100vh;}
.fade{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

/* layout shells */
.pwrap{max-width:440px;margin:0 auto;min-height:100vh;padding:0 16px 40px;}
.hwrap{max-width:1180px;margin:0 auto;min-height:100vh;padding:0 32px 48px;}
.strip{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 0;font-size:0.62rem;color:var(--lime);}
.kicker{color:var(--amber);font-size:0.66rem;margin:26px 2px 6px;}

/* buttons */
.cta{display:block;width:100%;background:var(--lime);color:var(--forest-3);border:none;border-radius:16px;padding:18px;font-family:'Anton',sans-serif;font-size:1.25rem;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:transform .15s;}
.cta:active{transform:scale(0.98);}
.cta[disabled]{background:rgba(201,242,78,0.25);color:rgba(15,36,21,0.55);cursor:not-allowed;}
.cta.ghost{background:transparent;color:var(--cream);border:1px solid rgba(236,230,215,0.4);font-size:0.95rem;padding:13px;}
.cta.amber{background:var(--amber);}

/* landing */
.role-grid{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px;}
.role-btn{flex:1;min-width:240px;background:var(--forest-3);border:1px solid var(--line);border-radius:20px;padding:30px 22px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s;color:var(--cream);}
.role-btn:hover{transform:translateY(-3px);border-color:var(--lime);}
.role-btn .big{font-size:2.4rem;margin-bottom:10px;}
.role-btn .rl{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
.role-btn .rn{font-family:'Anton',sans-serif;font-size:1.5rem;letter-spacing:0.04em;text-transform:uppercase;}
.role-btn .rd{font-size:0.8rem;color:rgba(236,230,215,0.65);margin-top:8px;line-height:1.4;}

/* host lobby */
.lob{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;margin-top:28px;}
.qrcard{background:var(--cream);border-radius:20px;padding:26px 26px 20px;text-align:center;flex:0 0 auto;}
.qrcard .ql{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.16em;text-transform:uppercase;color:#5a6b4f;margin-bottom:14px;}
.qrcard .qurl{font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.04em;color:var(--forest-3);margin-top:14px;font-weight:700;word-break:break-all;max-width:300px;}
.qrcard .qroom{font-family:'Anton',sans-serif;font-size:1.6rem;color:var(--forest-3);margin-top:6px;letter-spacing:0.12em;}
.lob-right{flex:1 1 380px;min-width:300px;}
.count-row{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;}
.count-row .n{font-family:'Anton',sans-serif;font-size:3.4rem;color:var(--lime);line-height:1;}
.count-row .t{font-size:1.05rem;color:rgba(236,230,215,0.8);}
.count-row .live{margin-left:auto;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--amber);animation:pulse 1.6s infinite;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px;max-height:300px;overflow-y:auto;}
.pchip{display:inline-flex;align-items:center;gap:7px;background:var(--forest-3);border:1px solid var(--line);border-radius:30px;padding:8px 15px;font-size:0.85rem;font-weight:600;animation:fadeIn .3s ease;}
.pchip .e{font-size:1rem;}
.pchip.dim{opacity:0.38;}
.pchip.lit{border-color:var(--lime);}
.pchip.lit .nm{color:var(--lime);}

/* host fund stage */
.stage{display:flex;gap:36px;align-items:stretch;flex-wrap:wrap;margin-top:20px;}
.bigpost{flex:1 1 520px;background:var(--forest-3);border:1px solid var(--line);border-radius:24px;padding:34px 32px;display:flex;flex-direction:column;min-height:380px;box-shadow:0 18px 50px rgba(0,0,0,0.4);}
.bigpost .phead{display:flex;align-items:center;gap:16px;margin-bottom:22px;}
.bigpost .av{width:64px;height:64px;border-radius:50%;background:var(--forest-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;flex:none;}
.bigpost .handle{font-weight:700;font-size:1.5rem;}
.bigpost .meta{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(236,230,215,0.5);margin-top:4px;}
.bigpost .likes{margin-left:auto;font-family:'Anton',sans-serif;color:var(--amber);font-size:1.9rem;text-align:right;line-height:1;}
.bigpost .likes .l{display:block;font-family:'Space Mono',monospace;font-size:0.5rem;letter-spacing:0.14em;color:rgba(236,230,215,0.5);margin-top:4px;}
.bigpost .pitch{flex:1;font-size:clamp(1.4rem,2.4vw,2rem);line-height:1.5;font-weight:500;display:flex;align-items:center;}
.chip{border-bottom:3px dotted var(--lime);color:var(--lime);cursor:pointer;font-weight:600;}
.side{flex:0 1 320px;min-width:260px;display:flex;flex-direction:column;gap:14px;}
.tallybox{background:var(--forest-3);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;}
.tallybox .n{font-family:'Anton',sans-serif;font-size:2.6rem;color:var(--lime);line-height:1;}
.tallybox .l{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(236,230,215,0.6);margin-top:6px;}

/* host reveal */
.rev-flag{font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber);margin-top:6px;}
.verdict-big{font-family:'Anton',sans-serif;font-size:clamp(2.4rem,5vw,3.6rem);line-height:1;}
.verdict-big.good{color:var(--lime);} .verdict-big.bad{color:var(--rust);} .verdict-big.meh{color:var(--amber);}
.moneyline{font-family:'Anton',sans-serif;font-size:clamp(1.6rem,3.4vw,2.4rem);background:var(--forest-2);border:1px solid var(--line);border-radius:14px;padding:14px 20px;display:inline-flex;gap:14px;align-items:baseline;margin:14px 0;}
.moneyline .a{color:var(--amber);font-size:0.7em;}
.moneyline .up{color:var(--lime);} .moneyline .dn{color:var(--rust);}
.whytext{font-size:clamp(0.95rem,1.7vw,1.2rem);line-height:1.6;color:rgba(236,230,215,0.92);max-width:760px;}
.splitcols{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;}
.splitcol{flex:1 1 280px;background:var(--forest-3);border:1px solid var(--line);border-radius:18px;padding:18px;}
.splitcol.inv{border-color:rgba(201,242,78,0.5);}
.splitcol .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.splitcol .st{font-family:'Anton',sans-serif;font-size:1.1rem;letter-spacing:0.05em;}
.splitcol.inv .st{color:var(--lime);}
.splitcol.skp .st{color:rgba(236,230,215,0.75);}
.splitcol .sn{font-family:'Anton',sans-serif;font-size:1.4rem;color:var(--amber);}
.namechips{display:flex;flex-wrap:wrap;gap:7px;}
.nchip{display:inline-flex;align-items:center;gap:6px;background:var(--forest-2);border:1px solid var(--line);border-radius:24px;padding:6px 12px;font-size:0.8rem;font-weight:600;}
.nchip.ghost{opacity:0.4;}
.nonechip{font-size:0.8rem;color:rgba(236,230,215,0.45);font-style:italic;}

/* host controls */
.ctrl{position:fixed;left:0;right:0;bottom:0;background:rgba(15,36,21,0.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 28px;display:flex;gap:14px;align-items:center;z-index:30;}
.ctrl .sp{flex:1;}
.cbtn{border:none;border-radius:14px;padding:14px 28px;font-family:'Anton',sans-serif;font-size:1.05rem;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;transition:transform .12s;}
.cbtn:active{transform:scale(0.97);}
.cbtn.go{background:var(--lime);color:var(--forest-3);}
.cbtn.go[disabled]{background:rgba(201,242,78,0.25);color:rgba(15,36,21,0.55);cursor:not-allowed;}
.cbtn.dim{background:transparent;color:rgba(236,230,215,0.6);border:1px solid rgba(236,230,215,0.3);font-size:0.8rem;padding:12px 18px;}
.ctrl-note{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(236,230,215,0.5);}
.hpad{padding-bottom:110px;}

/* finale board */
.board{margin-top:24px;display:flex;flex-direction:column;gap:10px;max-width:860px;}
.brow{display:flex;align-items:center;gap:16px;background:var(--forest-3);border:1px solid var(--line);border-radius:16px;padding:14px 20px;animation:fadeIn .3s ease;}
.brow.top1{border-color:var(--lime);background:linear-gradient(135deg,rgba(201,242,78,0.13),var(--forest-3));}
.brow.top2{border-color:rgba(233,182,60,0.6);}
.brow.top3{border-color:rgba(236,230,215,0.4);}
.brow .rk{font-family:'Anton',sans-serif;font-size:1.5rem;color:rgba(236,230,215,0.4);width:46px;flex:none;}
.brow.top1 .rk{color:var(--lime);}
.brow .pe{font-size:1.5rem;flex:none;}
.brow .pn{font-weight:700;font-size:1.1rem;flex:1;min-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brow .pc{font-family:'Anton',sans-serif;font-size:1.4rem;color:var(--lime);flex:none;}
.brow .pd{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber);flex:none;width:96px;text-align:right;}
.brow .pg{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.08em;text-transform:uppercase;border:1px solid;border-radius:20px;padding:5px 11px;flex:none;}
.pg.g1{color:var(--lime);border-color:var(--lime);} .pg.g2{color:var(--cream);border-color:rgba(236,230,215,0.5);}
.pg.g3{color:var(--amber);border-color:var(--amber);} .pg.g4{color:var(--rust);border-color:var(--rust);}
.classstats{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;max-width:860px;}
.cstat{flex:1 1 250px;background:var(--forest-3);border:1px solid var(--line);border-radius:16px;padding:18px;}
.cstat .cl{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;}
.cstat .cv{font-size:0.95rem;line-height:1.5;}

/* player */
.hud{display:flex;gap:8px;margin:14px 0;}
.hud .box{flex:1;border:1px solid var(--line);border-radius:12px;background:rgba(15,36,21,0.6);padding:9px 6px 7px;text-align:center;}
.hud .box .n{font-family:'Anton',sans-serif;font-size:1.05rem;color:var(--lime);line-height:1;}
.hud .box .n.amber{color:var(--amber);}
.hud .box .l{font-size:0.48rem;color:rgba(236,230,215,0.6);margin-top:4px;font-family:'Space Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;}
.ppost{background:var(--forest-3);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:0 18px 50px rgba(0,0,0,0.4);position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;}
.stamp{position:absolute;top:18px;font-family:'Anton',sans-serif;font-size:1.6rem;letter-spacing:0.05em;padding:5px 14px;border-radius:10px;border:3px solid;opacity:0;transform:rotate(-12deg);pointer-events:none;z-index:2;}
.stamp.yes{left:14px;color:var(--lime);border-color:var(--lime);}
.stamp.no{right:14px;color:var(--rust);border-color:var(--rust);transform:rotate(12deg);}
.ppost .phead{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.ppost .av{width:46px;height:46px;border-radius:50%;background:var(--forest-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none;}
.ppost .who{flex:1;min-width:0;}
.ppost .handle{font-weight:700;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ppost .meta{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(236,230,215,0.5);margin-top:2px;}
.ppost .likes{font-family:'Anton',sans-serif;color:var(--amber);font-size:1.05rem;text-align:right;line-height:1;flex:none;}
.ppost .likes .l{display:block;font-family:'Space Mono',monospace;font-size:0.45rem;letter-spacing:0.12em;color:rgba(236,230,215,0.5);margin-top:3px;}
.ppost .pitch{font-size:1.15rem;line-height:1.5;font-weight:500;min-height:130px;display:flex;align-items:center;}
.acts{display:flex;gap:12px;margin-top:16px;}
.act{flex:1;border-radius:16px;padding:17px 8px;font-family:'Anton',sans-serif;font-size:1.1rem;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border:none;transition:transform .12s;}
.act:active{transform:scale(0.96);}
.act.skip{background:transparent;color:var(--cream);border:1.5px solid rgba(236,230,215,0.4);}
.act.invest{background:var(--lime);color:var(--forest-3);}
.act[disabled]{opacity:0.35;cursor:not-allowed;}
.locked{margin-top:22px;text-align:center;border:1px solid var(--line);border-radius:18px;background:var(--forest-3);padding:26px 18px;}
.locked .lk{font-family:'Anton',sans-serif;font-size:1.6rem;letter-spacing:0.04em;}
.locked .lk.inv{color:var(--lime);} .locked .lk.skp{color:var(--cream);}
.locked .ls{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(236,230,215,0.55);margin-top:10px;animation:pulse 1.8s infinite;}
.waitcard{text-align:center;margin-top:18vh;}
.waitcard .we{font-size:3rem;}
.waitcard .wt{font-family:'Anton',sans-serif;font-size:1.8rem;text-transform:uppercase;color:var(--lime);margin-top:14px;}
.waitcard .ws{color:rgba(236,230,215,0.75);margin-top:10px;font-size:0.92rem;line-height:1.5;}
.joinform{margin-top:26px;}
.joinform label{display:block;font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px;}
.joinform input{width:100%;background:var(--forest-3);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--cream);font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:600;outline:none;}
.joinform input:focus{border-color:var(--lime);}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.eopt{font-size:1.5rem;background:var(--forest-3);border:1px solid var(--line);border-radius:12px;padding:10px 0;text-align:center;cursor:pointer;}
.eopt.sel{border-color:var(--lime);background:rgba(201,242,78,0.12);}
.prev-card{background:var(--forest-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;}
.prev-card .vh{display:flex;justify-content:space-between;align-items:baseline;}
.prev-card .vt{font-family:'Anton',sans-serif;font-size:1.15rem;}
.prev-card .vt.good{color:var(--lime);} .prev-card .vt.bad{color:var(--rust);} .prev-card .vt.meh{color:var(--amber);}
.prev-card .vm{font-family:'Anton',sans-serif;font-size:1rem;color:var(--cream);}
.prev-card .vw{font-size:0.85rem;line-height:1.5;color:rgba(236,230,215,0.85);margin-top:8px;}

/* results player card */
.mycard{background:var(--lime);color:var(--forest-3);border-radius:18px;padding:20px;margin-top:18px;}
.mycard .l{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.14em;text-transform:uppercase;opacity:0.7;}
.mycard .v{font-family:'Anton',sans-serif;font-size:2.4rem;line-height:1.05;margin-top:4px;}
.mycard .sub{font-weight:700;margin-top:8px;font-size:0.9rem;}

/* sheet + toast */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;z-index:40;}
#sheet{position:fixed;left:0;right:0;bottom:-110%;z-index:41;transition:bottom .28s ease;max-width:520px;margin:0 auto;background:var(--forest-2);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:22px 20px 34px;}
#sheet.on{bottom:0;}
#sheet .term{font-family:'Anton',sans-serif;font-size:1.4rem;color:var(--lime);text-transform:uppercase;margin-bottom:8px;}
#sheet .def{font-size:0.98rem;line-height:1.55;}
#sheet .close{margin-top:18px;width:100%;background:transparent;border:1px solid rgba(236,230,215,0.4);color:var(--cream);border-radius:12px;padding:12px;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);z-index:50;background:var(--amber);color:var(--forest-3);font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;padding:12px 20px;border-radius:30px;transition:transform .25s ease;white-space:nowrap;}
#toast.on{transform:translateX(-50%) translateY(0);}
</style>

/* ═══════════ ENGINE (Swayamvar pattern: save+broadcast, verify-retry) ═══════════ */
var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var _ID_KEY = 'ss-myid-' + ROOM;
var MY_ID;
try {
  MY_ID = localStorage.getItem(_ID_KEY);
  if (!MY_ID) { MY_ID = crypto.randomUUID(); localStorage.setItem(_ID_KEY, MY_ID); }
} catch(e){ MY_ID = 'p' + Math.random().toString(36).slice(2); }

var listeners = new Set();
var currentState = freshState();
var _channel = null;

function freshState(){
  return {
    sessionId: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()),
    phase: 'lobby',                 // lobby | swiping | jump | receipts | finale
    fundIndex: 0,                   // which fund is being swiped (0..9)
    revealIndex: 0,                 // which receipt is on screen (0..9)
    run: [],                        // 10 deck indices, drawn at startGame
    players: {},                    // { id: {id,name,emoji} }
    swipes: {}                      // { [fundIndex]: { [playerId]: 1|-1 } }
  };
}
function notify(){ var snap = JSON.parse(JSON.stringify(currentState)); listeners.forEach(function(fn){ fn(snap); }); }
async function save(state){ await db.from('games').upsert({ room_code: GAME_KEY, state: state, updated_at: new Date().toISOString() }); }
async function load(){ var r = await db.from('games').select('state').eq('room_code', GAME_KEY).single(); return (r.data && r.data.state) || null; }
async function setupRealtime(){
  if (_channel) db.removeChannel(_channel);
  _channel = db.channel('room:' + GAME_KEY)
    .on('broadcast', { event: 'state' }, function(msg){
      if (!msg.payload || !msg.payload.state) return;
      currentState = msg.payload.state;
      notify();
    })
    .subscribe();
}
async function broadcast(state){ if (_channel) await _channel.send({ type:'broadcast', event:'state', payload:{ state: state } }); }
async function push(state){ currentState = state; notify(); await Promise.all([save(state), broadcast(state)]); }

var readyPromise = (async function(){
  await setupRealtime();
  var saved = await load();
  if (saved){ currentState = saved; notify(); }
})();

var Live = {
  ready: readyPromise,
  getState: function(){ return JSON.parse(JSON.stringify(currentState)); },
  subscribe: function(fn){ listeners.add(fn); return function(){ listeners.delete(fn); }; },
  myId: function(){ return MY_ID; },

  /* host */
  startGame: async function(){
    var s = JSON.parse(JSON.stringify(currentState));
    s.run = drawRun();
    s.phase = 'swiping';
    s.fundIndex = 0;
    s.swipes = {};
    await push(s);
  },
  nextFund: async function(){
    var s = JSON.parse(JSON.stringify(currentState));
    if (s.fundIndex + 1 >= NUM_FUNDS){ s.phase = 'jump'; }
    else { s.fundIndex += 1; }
    await push(s);
  },
  showReceipts: async function(){
    var s = JSON.parse(JSON.stringify(currentState));
    s.phase = 'receipts';
    s.revealIndex = 0;
    await push(s);
  },
  nextReceipt: async function(){
    var s = JSON.parse(JSON.stringify(currentState));
    if (s.revealIndex + 1 >= NUM_FUNDS){ s.phase = 'finale'; }
    else { s.revealIndex += 1; }
    await push(s);
  },
  resetToLobby: async function(){ await push(freshState()); },

  /* player — write→verify→retry (Swayamvar concurrency fix) */
  join: async function(name, emoji){
    var player = { id: MY_ID, name: name, emoji: emoji };
    for (var attempt = 0; attempt < 5; attempt++){
      if (attempt > 0) await new Promise(function(r){ setTimeout(r, 150 + Math.random()*250); });
      var fresh = await load();
      if (fresh) currentState = fresh;
      var s = JSON.parse(JSON.stringify(currentState));
      s.players[MY_ID] = player;
      await save(s);
      await new Promise(function(r){ setTimeout(r, 200); });
      var verified = await load();
      if (verified && verified.players && verified.players[MY_ID]){
        currentState = verified; notify(); await broadcast(verified);
        return verified.sessionId;
      }
    }
    return currentState.sessionId;
  },
  castSwipe: async function(fundIdx, dir){
    for (var attempt = 0; attempt < 5; attempt++){
      if (attempt > 0) await new Promise(function(r){ setTimeout(r, 120 + Math.random()*220); });
      var fresh = await load();
      if (fresh) currentState = fresh;
      var s = JSON.parse(JSON.stringify(currentState));
      if (!s.swipes[fundIdx]) s.swipes[fundIdx] = {};
      s.swipes[fundIdx][MY_ID] = dir;
      currentState = s; notify();          // optimistic — lock UI immediately
      await save(s);
      await new Promise(function(r){ setTimeout(r, 180); });
      var verified = await load();
      if (verified && verified.swipes && verified.swipes[fundIdx] && verified.swipes[fundIdx][MY_ID] === dir){
        currentState = verified; notify(); await broadcast(verified);
        return;
      }
    }
  }
};

/* ═══════════ SHARED HELPERS ═══════════ */
function drawRun(){
  function shuffled(arr){ var a = arr.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t; } return a; }
  var idxOf = function(t){ return DECK.map(function(c,i){ return c.type===t ? i : -1; }).filter(function(i){ return i>=0; }); };
  var reds = shuffled(idxOf('r')), greens = shuffled(idxOf('g')), yellows = shuffled(idxOf('y'));
  var nRed = 5 + Math.floor(Math.random()*2);
  return shuffled(reds.slice(0,nRed).concat(greens.slice(0,NUM_FUNDS-nRed-1), yellows.slice(0,1)));
}
function fmt(n){
  n = Math.round(n);
  var s = String(Math.abs(n)), out = "";
  if (s.length > 3){ out = "," + s.slice(-3); s = s.slice(0,-3);
    while (s.length > 2){ out = "," + s.slice(-2) + out; s = s.slice(0,-2); } out = s + out; }
  else out = s;
  return (n < 0 ? "-₹" : "₹") + out;
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function chipify(p){
  return p.replace(/\[\[(\w+)\|([^\]]+)\]\]/g, function(m,k,txt){
    return DEFS[k] ? '<span class="chip" data-k="'+k+'">'+txt+'</span>' : txt;
  });
}
function openSheet(k){
  document.getElementById('sheet-term').textContent = DEFS[k][0];
  document.getElementById('sheet-def').textContent = DEFS[k][1];
  document.getElementById('sheetbg').style.display = 'block';
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheetbg').style.display = 'none';
  document.getElementById('sheet').classList.remove('on');
}
document.addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if (c && c.dataset.k) openSheet(c.dataset.k);
});
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

/* verdict for a player's action on a card */
function verdictFor(card, dir){
  if (dir === 1){
    if (card.type==='r') return ['OUCH.','bad'];
    if (card.type==='g') return ["IT'S A MATCH 💚",'good'];
    return ['FAIR PLAY 👍','good'];
  }
  if (card.type==='r') return ['DODGED 🚩','good'];
  if (card.type==='g') return ['SCROLLED PAST 💔','meh'];
  return ['FAIR CALL','meh'];
}

/* per-player stats over revealed funds (non-vote = skip) */
function playerStats(state, pid, upTo){
  var invested = 0, corpus = 0, dodged = 0, reds = 0;
  var last = (upTo === undefined) ? NUM_FUNDS - 1 : upTo;
  for (var i = 0; i <= last && i < (state.run||[]).length; i++){
    var card = DECK[state.run[i]];
    var dir = (state.swipes[i] || {})[pid] || -1;
    if (card.type === 'r') reds++;
    if (dir === 1 && invested < MAX_PICKS){ invested++; corpus += card.val; }
    else if (card.type === 'r') dodged++;
  }
  corpus += (MAX_PICKS - invested) * SAVINGS_VAL;
  return { invested: invested, corpus: corpus, dodged: dodged, reds: reds };
}
function gradeFor(state, st){
  var cards = (state.run||[]).map(function(i){ return DECK[i]; });
  var victim = cards.slice().sort(function(a,b){ return b.ln-a.ln; }).slice(0,5).reduce(function(s,c){ return s+c.val; },0);
  var genius = cards.slice().sort(function(a,b){ return b.val-a.val; }).slice(0,5).reduce(function(s,c){ return s+c.val; },0);
  var skill = genius > victim ? Math.max(0, Math.min(1, (st.corpus - victim) / (genius - victim))) : 0.5;
  var radar = st.reds > 0 ? st.dodged / st.reds : 1;
  var combined = 0.6*skill + 0.4*radar;
  if (combined >= 0.85) return ['BORING GENIUS','g1'];
  if (combined >= 0.6)  return ['STEADY HAND','g2'];
  if (combined >= 0.35) return ['HYPE CURIOUS','g3'];
  return ['HYPE VICTIM','g4'];
}

/* drag-to-swipe on the student card (mirrors the solo game) */
function bindPlayerDrag(el, canInvest){
  var sx=0, sy=0, dx=0, dragging=false, moved=false, done=false;
  function pt(e){ return e.touches ? e.touches[0] : e; }
  function down(e){
    if (done || e.target.closest('.chip')) return;
    dragging = true; moved = false;
    var p = pt(e); sx = p.clientX; sy = p.clientY; dx = 0;
    el.style.transition = 'none';
  }
  function move(e){
    if (!dragging || done) return;
    var p = pt(e); dx = p.clientX - sx; var dy = p.clientY - sy;
    if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) moved = true;
    if (moved && e.cancelable) e.preventDefault();
    if (!moved) return;
    el.style.transform = 'translateX('+dx+'px) translateY('+(dy*0.12)+'px) rotate('+(dx/14)+'deg)';
    var y = el.querySelector('.stamp.yes'), n = el.querySelector('.stamp.no');
    if (y) y.style.opacity = dx > 0 ? Math.min(dx/90, 1) : 0;
    if (n) n.style.opacity = dx < 0 ? Math.min(-dx/90, 1) : 0;
  }
  function snapBack(){
    el.style.transition = 'transform .25s ease';
    el.style.transform = '';
    var y = el.querySelector('.stamp.yes'), n = el.querySelector('.stamp.no');
    if (y) y.style.opacity = 0;
    if (n) n.style.opacity = 0;
  }
  function up(){
    if (!dragging || done) return;
    dragging = false;
    if (dx > 85){
      if (!canInvest){ toast('NO CASH LEFT — SKIP THE REST!'); snapBack(); return; }
      flyOut(1);
    } else if (dx < -85){
      flyOut(-1);
    } else snapBack();
  }
  function flyOut(dir){
    done = true;
    el.style.transition = 'transform .3s ease, opacity .3s ease';
    el.style.transform = 'translateX('+(dir*520)+'px) rotate('+(dir*22)+'deg)';
    el.style.opacity = '0';
    setTimeout(function(){ doSwipe(dir); }, 200);
  }
  el.addEventListener('mousedown', down);
  el.addEventListener('touchstart', down, {passive:true});
  window.addEventListener('mousemove', move, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', up);
  window.addEventListener('touchend', up);
}

    '</div>');
}

/* ── DISPATCH ── */
function render(s){
  if (!ROLE){ renderLanding(); return; }
  if (ROLE === 'host') renderHost(s);
  else renderPlayer(s);
}

(async function(){
  if (!ROLE){ renderLanding(); return; }
  root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;" class="mono">CONNECTING…</div>';
  await Live.ready;
  /* player eviction: if teacher reset (new sessionId), drop back to join */
  Live.subscribe(function(s){
    if (ROLE === 'player' && _joinedSession && s.sessionId !== _joinedSession){
      _joinedSession = null;
      try { localStorage.removeItem('ss-joined-' + ROOM); } catch(e){}
    }
    render(s);
  });
  render(Live.getState());
})();
</script>
</body>
</html>
