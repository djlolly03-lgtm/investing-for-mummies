<style>
/* ── IFM palette (Brand Guidelines §3) ─────────────────────────── */
:root{
  --navy:#1a3a5c;--ink:#1a3a5c;--navy-lt:#264d78;--teal:#2a9d8f;--teal-d:#1f7d72;--muted:#5a7d8a;
  --cream:#f7faf9;--white:#fff;--mint:#bde9e4;--mint-lt:#e0f3f0;--gold:#c9a84c;--gold-lt:#f5f0e0;
  --success:#27AE60;--danger:#c0392b;--wa:#25D366;
  --ink-night:#050c15;--gold-hi:#f7dea0;--ivory:#f6f1e7;--mist:#9bb0ae;
  /* projector-only tones: the studio is dark, so text and accents lift to these */
  --stage-ink:#eaf6f3;--stage-sub:#9fc2bb;--teal-bright:#2dd4bf;--gold-bright:#f5c451;--coral:#ff8a76;
  --glass:rgba(10,26,34,.72);--glass-edge:rgba(255,255,255,.12);
  --shadow:0 2px 12px rgba(26,58,92,.06);--shadow-lg:0 16px 48px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Manrope',sans-serif;color:var(--navy);background:var(--cream)}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0}
button,input{font-family:'Manrope',sans-serif}
button{cursor:pointer}
.hide{display:none!important}

/* ════════ HOST · projector ════════ */
body.host-bg{background:linear-gradient(180deg,rgba(6,16,28,.30) 0%,rgba(6,16,28,.55) 55%,rgba(6,16,28,.82) 100%),url('wealth-hack-stage.jpg') center/cover fixed no-repeat;color:var(--stage-ink);min-height:100vh}
#host{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 32px 110px}
.stage{width:100%;max-width:1240px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.presents{font-size:.72rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--stage-ink);text-align:center;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.title{font-size:clamp(1.9rem,3.6vw,2.9rem);line-height:1.1;text-align:center;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.title em{font-style:italic;color:var(--gold-bright)}
.tag{font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:700;color:var(--stage-ink);text-align:center;margin:0;max-width:820px;line-height:1.45;text-shadow:0 1px 14px rgba(0,0,0,.75)}
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-lg)}
.panel{background:#fff;color:var(--navy);border-radius:16px;box-shadow:var(--shadow-lg)}
.kicker{font-size:.66rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.glass .kicker{color:var(--stage-sub)}
.btn{font:800 .95rem 'Manrope',sans-serif;color:#1a1203;border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,var(--gold-hi),#d79f34);box-shadow:0 12px 32px rgba(233,191,98,.3),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(233,191,98,.42),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:disabled{background:rgba(255,255,255,.07);color:rgba(246,241,231,.42);box-shadow:none;border:1px solid rgba(255,255,255,.14);cursor:not-allowed;transform:none}
.btn.big{font-size:1.1rem;padding:17px 34px}
.btn.gold{background:linear-gradient(135deg,var(--gold-hi),#d79f34)}

body.host-bg.end-bg{background:linear-gradient(180deg,rgba(6,16,28,.15) 0%,rgba(6,16,28,.35) 100%),url('wealth-hack-hero.jpg') center/cover fixed no-repeat}
/* live backdrop: the looping rooftop video sits behind everything on the projector; the closing screen swaps to the still jars */
.bgv,.bgshade{display:none;position:fixed;inset:0;width:100%;height:100%}
.bgv{object-fit:cover;z-index:-2}
.bgshade{z-index:-1;background:linear-gradient(180deg,rgba(6,16,28,.30) 0%,rgba(6,16,28,.55) 55%,rgba(6,16,28,.82) 100%)}
body.host-bg .bgv,body.host-bg .bgshade{display:block}
body.host-bg.end-bg .bgv,body.host-bg.end-bg .bgshade{display:none}
/* closing screen: content lives in the dark gap between the two jars */
.end-stage{max-width:520px;gap:12px}
.end-stage .title{font-size:clamp(1.7rem,2.9vw,2.4rem)}
.end-stage .end-grid{grid-template-columns:1fr;gap:10px;max-width:none}
.end-stage .end-grid .stat{padding:12px 16px}
.end-stage .tag{font-size:.95rem}
/* lobby */
.lobby-stage{gap:16px}
.hero-mark{display:block;width:64px;height:64px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 1px rgba(233,191,98,.5),0 0 56px rgba(233,191,98,.4),0 18px 44px rgba(0,0,0,.5)}
.hero-title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(3rem,6.2vw,5.2rem);line-height:1;letter-spacing:-.02em;color:#fff;text-align:center;font-variation-settings:'opsz' 144;text-shadow:0 6px 44px rgba(0,0,0,.6)}
.hero-title .the{display:block;font-style:italic;font-weight:500;font-size:.36em;color:var(--gold-hi);letter-spacing:.01em;margin-bottom:-.12em}
.hero-tag{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(1.05rem,1.7vw,1.4rem);color:#d6e2df;text-align:center;margin:0;text-shadow:0 2px 20px rgba(0,0,0,.85)}
.hero-tag b{font-weight:600;color:var(--gold-hi)}
.lobby-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;width:100%;max-width:1040px;align-items:stretch}
.lcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 26px 24px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03)),rgba(6,14,22,.58);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.lcard::before{content:"";position:absolute;left:36px;right:36px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9}
.lk{display:flex;align-items:center;gap:10px;font-size:.68rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--stage-sub)}
.lk i{display:block;width:22px;height:1px;background:var(--gold)}
.qr-tile{margin:18px 0 12px;padding:14px;border-radius:22px;background:#fff;line-height:0;cursor:zoom-in;box-shadow:0 0 0 1px rgba(233,191,98,.6),0 0 74px rgba(233,191,98,.3),0 26px 60px rgba(0,0,0,.55)}
.scan-how{font-size:.86rem;font-weight:600;color:var(--stage-sub);margin:6px 0 0;max-width:290px;line-height:1.45}
.pin-row{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pin-label{font-size:.62rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--stage-sub)}
.pin{font-family:'Fraunces',serif;font-weight:600;font-size:3.1rem;letter-spacing:.2em;padding-left:.2em;line-height:1;color:var(--gold-hi);text-shadow:0 0 40px rgba(233,191,98,.35)}
.joinurl{font-size:.7rem;word-break:break-all;font-weight:600;margin-top:10px;color:var(--stage-sub);opacity:.75}
.room-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.room-head h2{font-family:'Fraunces',serif;font-size:1.55rem;font-weight:600;color:var(--ivory)}
.count{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;background:rgba(233,191,98,.14);border:1px solid rgba(233,191,98,.4);color:var(--gold-hi);font:800 .95rem 'Manrope',sans-serif}
.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-start;align-content:flex-start;width:100%;min-height:92px;max-height:30vh;overflow:auto;padding:2px}
.pl{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700;font-size:.92rem;color:var(--ivory);animation:pop .3s ease-out}
.pl .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;color:#fff;flex:none}
.pl .age{color:var(--gold-hi);font-size:.8rem;font-weight:800}
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 8px}
.slots span{width:34px;height:34px;border-radius:50%;border:1px dashed rgba(255,255,255,.28)}
.waiting{color:var(--stage-sub);font-family:'Fraunces',serif;font-style:italic;font-size:1rem;margin:0}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.plan{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 16px;text-align:left}
.plan>div{position:relative;padding:12px 14px 12px 14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:3px}
.plan i{position:absolute;top:10px;right:13px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:1.5rem;line-height:1;color:rgba(233,191,98,.55)}
.plan b{font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;color:var(--ivory);padding-right:26px;line-height:1.2}
.plan span{font-size:.78rem;font-weight:500;color:var(--stage-sub);line-height:1.4}
/* names are the hero of the room: big in small rooms, smaller as it fills */
.sz-xl .pl,.sz-lg .pl{font-weight:700}
.sz-xl .pl{gap:12px;padding:7px 22px 7px 7px;font-size:1.4rem}
.sz-xl .pl .av{width:48px;height:48px;font-size:1.5rem}
.sz-xl .pl .age{font-size:1.05rem}
.sz-lg .pl{gap:10px;padding:6px 18px 6px 6px;font-size:1.12rem}
.sz-lg .pl .av{width:38px;height:38px;font-size:1.2rem}
.sz-lg .pl .age{font-size:.9rem}
.players.sz-xl,.players.sz-lg{gap:10px}
.slots span{width:48px;height:48px}
.lcard .btn{width:100%;margin-top:auto}
.whatif{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:center;padding:9px 18px;border-radius:999px}
.whatif .wk{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--gold-bright);font-size:1rem}
.whatif .wl{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-sub);margin-right:3px}
.whatif .grp{display:flex;align-items:center;gap:5px}
.whatif .chip{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);border-radius:10px;padding:4px 10px;font:800 .76rem 'Manrope',sans-serif;transition:background .2s}
.whatif .chip:hover{background:rgba(255,255,255,.16)}
.whatif .chip.on{background:linear-gradient(135deg,var(--gold-hi),#d79f34);border-color:transparent;color:#1a1203}
.whatif .rate{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);outline:none;margin:0 6px;cursor:pointer}
.whatif .rate::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold-hi);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
.whatif .rate::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold-hi);border:2px solid #fff;cursor:grab}
.whatif .rate-v{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--gold-bright);min-width:44px;display:inline-block}

/* ask */
.q-panel{width:100%;max-width:1000px;padding:28px 36px;text-align:center;border-color:rgba(233,191,98,.5);animation:qpulse 2.6s ease-in-out infinite}
@keyframes qpulse{0%,100%{box-shadow:0 0 0 1px rgba(233,191,98,.22),0 0 40px rgba(233,191,98,.12),var(--shadow-lg)}50%{box-shadow:0 0 0 1px rgba(233,191,98,.45),0 0 70px rgba(233,191,98,.26),var(--shadow-lg)}}
.q-panel .q{font-family:'Fraunces',serif;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.22;font-weight:700;color:#fff;margin:0}
.q-panel .q em{font-style:italic;color:var(--gold-bright)}
.q-panel .why{margin:12px auto 0;font-size:1rem;color:var(--stage-sub);font-weight:700;max-width:820px;line-height:1.45}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-bright)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--teal-bright);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.prog{font-size:1.25rem;font-weight:800;color:var(--stage-ink)}
.prog b{color:var(--gold-bright);font-size:1.7rem;font-family:'Fraunces',serif}
.pl-wall{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1100px}
.pl-wall .pl{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);color:var(--stage-ink);transition:opacity .3s}
.pl-wall .pl .age{color:var(--stage-sub)}
.pl-wall .pl.dim{opacity:.38}
.pl-wall .pl.lit{opacity:1;border-color:rgba(233,191,98,.7)}

/* reveal */
.rv{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;width:100%;align-items:start}
.rv-table{padding:8px 16px 6px}
.rv-head,.rv-row{display:grid;grid-template-columns:1.35fr 2.2fr .95fr 1.2fr 1.05fr;align-items:center;gap:12px;padding:8px 6px}
.rv-head{font-size:.62rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--stage-sub);border-bottom:1px solid var(--glass-edge)}
.rv-row{border-bottom:1px solid rgba(255,255,255,.07);font-weight:700;color:var(--stage-ink);opacity:0;animation:rise .4s ease-out forwards}
.rv-row:last-child{border-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv-row .nm{display:flex;align-items:center;gap:9px;font-weight:800}
.rv-row .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;color:#fff;flex:none}
.rv-row small{color:var(--stage-sub);font-weight:800}
.rv-row .guess{color:var(--stage-sub)}
.rv-row .real{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700;color:var(--teal-bright)}
.rv-row .real.hot{color:var(--gold-bright)}
.rv-row .off{font-size:.78rem;font-weight:800;text-transform:none;letter-spacing:.02em;border-radius:10px;padding:4px 9px;margin-top:0;text-align:center;background:rgba(45,212,191,.15);color:var(--teal-bright);white-space:nowrap}
.rv-row .off.low{background:rgba(255,138,118,.16);color:var(--coral)}
.rv-row .off.high{background:rgba(245,196,81,.16);color:var(--gold-bright)}
.rv-row .off.up{background:rgba(45,212,191,.18);color:var(--teal-bright)}
.rv-row .extra{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700;color:var(--coral)}
.side{display:flex;flex-direction:column;gap:12px}
.stat{padding:12px 16px}
.stat .big{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;color:#fff;line-height:1.1;margin-top:4px}
.stat .big.gold{color:var(--gold-bright)}
.stat .big.coral{color:var(--coral)}
.stat .big.teal{color:var(--teal-bright)}
.stat .sm{color:var(--stage-sub);font-weight:700;margin-top:4px;font-size:.88rem;line-height:1.45}
.stat .sm b{color:var(--stage-ink)}
.chart{width:100%;height:auto;display:block}
.past-note{margin:-6px 0 2px;font-family:'Fraunces',serif;font-style:italic;font-size:1rem;color:var(--stage-sub);text-align:center}
.punch{margin-bottom:10px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(1.15rem,2vw,1.6rem);color:var(--gold-bright);text-align:center;max-width:1000px;line-height:1.35;opacity:0;animation:rise .6s ease-out forwards}

/* life bar — today → (wait) → finish line */
.lb{position:relative;height:58px;min-width:180px}
.lb-c{position:absolute;left:0;right:0;top:0;text-align:center;font:700 .74rem 'Manrope',sans-serif;color:var(--stage-sub);white-space:nowrap}
.lb-c .lost{color:#ff8a76;font-weight:800}.lb-c .grow{color:var(--gold-hi);font-weight:700}
.lb-track{position:absolute;left:0;right:0;top:24px;height:9px;border-radius:99px;background:rgba(255,255,255,.1)}
.lb-seg{position:absolute;top:0;height:100%;border-radius:99px;transition:left .5s ease,width .5s ease}
.lb-inv{background:linear-gradient(90deg,#d79f34,#f7dea0);box-shadow:0 0 14px rgba(233,191,98,.35)}
.lb-wait{background:repeating-linear-gradient(135deg,rgba(255,138,118,.95) 0 5px,rgba(255,138,118,.35) 5px 10px)}
.lb-dot{position:absolute;top:-4px;width:17px;height:17px;border-radius:50%;transform:translateX(-50%);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:left .5s ease}
.lb-dot.s{background:#ff8a76}
.lb-flag{position:absolute;top:-3px;width:15px;height:15px;transform:translateX(-50%) rotate(45deg);background:var(--gold-hi);border:2px solid #1a1203;border-radius:3px;transition:left .5s ease}
.lb-t{position:absolute;top:38px;font:800 .82rem 'Manrope',sans-serif;color:var(--stage-ink);white-space:nowrap;transition:left .5s ease}
.lb-t.n{transform:translateX(-85%)}
.lb-t.s{transform:translateX(-10%);color:#ff8a76}
.lb-t.f{transform:translateX(-50%);color:var(--gold-hi)}
.lb-t.l{transform:translateX(-50%);color:var(--stage-sub);font-weight:700;opacity:.75}
.lb-line{position:absolute;top:-9px;bottom:-9px;width:0;border-left:2px dashed rgba(255,255,255,.45);transform:translateX(-1px)}
.lb-c .past{color:var(--stage-sub);font-weight:700}
/* what-if control room */
.wi-stage{gap:12px}
.wi-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;width:100%;align-items:start}
.wi-left{display:flex;flex-direction:column;gap:14px}
.wi-score{padding:18px 20px;text-align:center}
.wi-score.on{border-color:rgba(233,191,98,.55);box-shadow:0 0 0 1px rgba(233,191,98,.25),0 0 60px rgba(233,191,98,.18),var(--shadow-lg)}
.wi-sc{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.wi-n{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:2.7rem;line-height:1.05;color:var(--gold-hi);margin:6px 0 2px;text-shadow:0 0 36px rgba(233,191,98,.3)}
.wi-n.dim{color:var(--stage-sub);font-size:1.9rem;text-shadow:none}
.wi-n.good{color:#6fe3d0}.wi-n.bad{color:#ff8a76}
.wi-arrow{font-family:'Fraunces',serif;font-size:2rem;color:var(--gold)}
.wi-s{font-size:.72rem;font-weight:600;color:var(--stage-sub);line-height:1.3}
.wi-delta{margin-top:12px;padding:9px 12px;border-radius:12px;font-weight:800;font-size:1rem}
.wi-delta.good{background:rgba(111,227,208,.14);color:#6fe3d0}.wi-delta.bad{background:rgba(255,138,118,.14);color:#ff8a76}
.wi-delta.idle{background:rgba(255,255,255,.06);color:var(--stage-sub);font-weight:600;font-size:.9rem}
.wi-ctl{padding:18px 20px 20px}
.wi-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

.wi-g{margin-bottom:16px}

.wi-l{font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--stage-sub);margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline}
.wi-v{font-family:'Fraunces',serif;font-size:1.6rem;letter-spacing:0;text-transform:none;color:var(--gold-hi)}

.wi-h .chip{padding:7px 14px;font-size:.85rem;border-radius:999px}
.wi-ctl .rate{width:100%;height:7px;margin:6px 0 2px;-webkit-appearance:none;appearance:none;border-radius:4px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}

.wi-row .nm{font-size:1.3rem;font-weight:700}

.wi-real.good{color:#6fe3d0}.wi-real.bad{color:#ff8a76}
.wi-chg{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;border-radius:12px;font-weight:800;font-size:1.02rem;white-space:nowrap}
.wi-chg small{font-size:.62rem;font-weight:600;opacity:.8}
.wi-chg.good{background:rgba(111,227,208,.15);color:#6fe3d0}.wi-chg.bad{background:rgba(255,138,118,.15);color:#ff8a76}.wi-chg.same{background:rgba(255,255,255,.07);color:var(--stage-sub);font-weight:600;font-size:.9rem}
.wi-table.dense .wi-row{padding:7px 6px;min-height:52px}.wi-table.dense .wi-real{font-size:1.6rem}.wi-table.dense .wi-row .nm{font-size:1.05rem}
.wi-table .rv-head,.wi-table .rv-row{grid-template-columns:1.15fr 1.95fr .9fr 1.4fr 1.15fr}

/* ════════ HOST type scale (20 Oct 2026) ════════
   The projector is read from the back of a room and the old type was tuned for a laptop. fitHost() sets the root
   font size from the screen — 16px on a 1440-wide laptop, ~21px on a 1080p projector — so every rem below scales with the room.
   Everything is scoped to body.host-bg so the phone, which shares some class names, is untouched. */

body.host-bg .prog{font-size:1.5rem}
body.host-bg .prog b{font-size:2.4rem}
body.host-bg .q-panel{max-width:64rem}
body.host-bg .q-panel .q{font-size:clamp(1.8rem,3.2vw,3rem)}
body.host-bg .q-panel .why{font-size:1.25rem;max-width:52rem}
body.host-bg .pl-wall{max-width:70rem}
body.host-bg .pl{font-size:1.12rem}
body.host-bg .pl .age{font-size:.95rem}
body.host-bg .lk{font-size:.92rem}
body.host-bg .scan-how{font-size:1.05rem;max-width:21rem}
body.host-bg .pin-label{font-size:.88rem}
body.host-bg .joinurl{font-size:.92rem}
body.host-bg .lobby-grid{max-width:68rem}
body.host-bg .plan b{font-size:1.3rem}

body.host-bg .rv{grid-template-columns:minmax(0,1fr) 28rem}
body.host-bg .wi-grid{grid-template-columns:28rem minmax(0,1fr)}
body.host-bg .rv-head{font-size:.9rem}
body.host-bg .rv-row{font-size:1.15rem}
body.host-bg .rv-row .nm{font-size:1.3rem}
body.host-bg .rv-row .guess{font-size:1.3rem}
body.host-bg .rv-row .real{font-size:2.1rem}
body.host-bg .rv-row .extra{font-size:1.8rem}
body.host-bg .rv-row .off{font-size:1.05rem}
body.host-bg .stat .big{font-size:2.6rem}
body.host-bg .stat .sm{font-size:1.15rem}
body.host-bg .punch{font-size:clamp(1.3rem,2.2vw,1.9rem);max-width:64rem}
body.host-bg .past-note{font-size:1.2rem}
body.host-bg .lb{height:4.5rem;min-width:12rem}
body.host-bg .lb-c{font-size:1.02rem}
body.host-bg .lb-track{top:1.9rem;height:.75rem}

body.host-bg .lb-t{top:2.9rem;font-size:1.08rem}
body.host-bg .wi-s{font-size:1rem}
body.host-bg .wi-l{font-size:.95rem}
body.host-bg .wi-n{font-size:3.2rem}
body.host-bg .wi-n.dim{font-size:2.3rem}
body.host-bg .wi-delta{font-size:1.25rem}
body.host-bg .wi-delta.idle{font-size:1.08rem}
body.host-bg .wi-h span{font-size:1.9rem}
body.host-bg .wi-ctl .chip{font-size:1.2rem}
body.host-bg .wi-h .chip{font-size:1rem}
body.host-bg .wi-row .nm{font-size:1.5rem}
body.host-bg .wi-row .guess{font-size:1.35rem}
body.host-bg .wi-real{font-size:2.4rem}
body.host-bg .wi-chg{font-size:1.2rem}

body.host-bg .wi-table .rv-head{font-size:.92rem}
body.host-bg .bars{max-width:52rem}
body.host-bg .bar{font-size:1.4rem}

body.host-bg .end-grid{max-width:64rem}
body.host-bg .host-reset,body.host-bg .host-back{font-size:.98rem}

/* age rows — the projector shows groups, never people */
body.host-bg .agecell{display:flex;flex-direction:column;line-height:1.1}

body.host-bg .rv-agg5 .rv-head,body.host-bg .rv-agg5 .rv-row{grid-template-columns:.9fr 2.3fr 1fr 1.3fr 1.35fr}
body.host-bg .rv-agg5 .rv-head{font-size:.8rem;letter-spacing:.09em}
body.host-bg .gsplit{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.8rem}
body.host-bg .gs{padding:.55rem .3rem;border-radius:12px;text-align:center;font-size:.95rem;font-weight:800;line-height:1.25}

/* play screen: the clock, then the discussion prompt */
body.host-bg .ask-stage{gap:1rem}

body.host-bg .clock{font-family:'Fraunces',serif;font-weight:600;font-size:4.6rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;text-shadow:0 0 44px rgba(233,191,98,.3)}
body.host-bg .clock.low,body.host-bg .clock.done{color:var(--coral);text-shadow:0 0 44px rgba(255,138,118,.3)}
body.host-bg .clock.done{animation:blink 1.2s infinite}
body.host-bg .clockbox .kicker{margin-top:.35rem}
body.host-bg .clock-btns{display:flex;flex-direction:column;gap:.45rem;margin-left:auto}
body.host-bg .cbtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--stage-ink);border-radius:12px;padding:.5rem 1rem;font:800 1.05rem 'Manrope',sans-serif}
body.host-bg .cbtn:hover{background:rgba(255,255,255,.18)}
body.host-bg .progbox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.45rem;padding:.9rem 1.5rem;border-radius:18px}

@keyframes nextpulse{0%,100%{box-shadow:0 16px 44px rgba(233,191,98,.38),0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55)}50%{box-shadow:0 16px 64px rgba(233,191,98,.85),0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55)}}

/* demo: the teacher plays one guess on the big screen, exactly as it looks on a phone */
body.host-bg .demo-stage{gap:1rem}
body.host-bg .demo-grid{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:2rem;width:100%;max-width:64rem;align-items:center}

body.host-bg .demo-steps>div{display:flex;gap:1rem;align-items:flex-start;padding:1rem 1.3rem;border-radius:16px;background:rgba(10,26,34,.74);border:1px solid var(--glass-edge);backdrop-filter:blur(8px)}
body.host-bg .demo-steps i{flex:none;display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),#d79f34);color:#1a1203;font:800 1.2rem 'Manrope',sans-serif;font-style:normal}

body.host-bg .dp-tag{text-align:center;font-size:.82rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:.7rem}
body.host-bg .dp-note{margin:.2rem 0 .6rem;text-align:center;font-weight:700;font-size:1.1rem;color:var(--gold-hi)}
body.host-bg .demo-phone .amt{margin:0 0 .7rem}
body.host-bg .demo-phone .amt-in{font-size:2.3rem;padding:.7rem 1rem .7rem 2.6rem}
body.host-bg .demo-phone .amt-box .rs{font-size:1.8rem}

/* poll / end */
.bars{width:100%;max-width:760px;display:grid;gap:10px}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-radius:14px;background:rgba(10,26,34,.72);border:1px solid var(--glass-edge);overflow:hidden;font-weight:700;font-size:1.05rem;color:var(--stage-ink)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(42,157,143,.5),rgba(45,212,191,.25));transition:width .5s ease}
.bar.lead .bar-fill{background:linear-gradient(90deg,rgba(201,168,76,.65),rgba(245,196,81,.3))}
.bar.lead{border-color:rgba(245,196,81,.5)}
.bar .bt,.bar .bn{position:relative;z-index:1}
.bar .bn{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--gold-bright);min-width:24px;text-align:right}
.opts{display:grid;gap:8px}
.optb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--mint);background:#fff;border-radius:12px;padding:13px 14px;font:700 .92rem 'Manrope',sans-serif;color:var(--navy);transition:border-color .2s,background .2s}
.optb .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--mint);flex:none;transition:.2s}
.optb.on{border-color:var(--teal);background:var(--mint-lt)}
.optb.on .dot{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 45%,transparent 50%)}
.wall{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:1000px}
.end-grid .stat{text-align:center;padding:20px}

/* chrome — same placement as the KBC quiz so the room sees one family of games */
.host-reset{position:fixed;top:6px;left:10px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Manrope',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-reset:hover{background:rgba(10,26,34,.95)}
.join-corner{position:fixed;top:6px;right:10px;z-index:95;display:flex;align-items:center;gap:9px;padding:3px 12px 3px 6px;border-radius:14px;cursor:zoom-in;background:linear-gradient(165deg,rgba(26,56,70,.9),rgba(10,26,34,.94));border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 26px rgba(0,0,0,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s}
.join-corner:hover{transform:scale(1.04)}
.join-corner .jc-qr{width:48px;height:48px;background:#fff;border-radius:7px;padding:2px;display:grid;place-items:center;flex:0 0 auto}
.join-corner .jc-txt{text-align:left;line-height:1.2}
.join-corner .jc-lbl{color:var(--stage-sub);font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.join-corner .jc-pin{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;letter-spacing:.16rem;color:var(--gold-hi)}
.join-corner .jc-tap{color:var(--gold);font-size:.62rem;font-weight:800}
.key-hint{position:fixed;bottom:14px;right:16px;z-index:95;color:var(--stage-sub);font-size:.72rem;font-weight:800;background:rgba(10,26,34,.72);border:1px solid var(--glass-edge);padding:5px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.key-hint b{color:var(--stage-ink)}
.host-back{position:fixed;bottom:22px;left:16px;z-index:95;color:var(--stage-ink);font:800 .76rem 'Manrope',sans-serif;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 15px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-next{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:95;min-width:340px;font:800 1.2rem 'Manrope',sans-serif;color:#1a1203;background:linear-gradient(135deg,var(--gold-hi),#d79f34);border:0;padding:17px 44px;border-radius:18px;box-shadow:0 16px 44px rgba(233,191,98,.38),0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55);transition:box-shadow .2s,transform .2s}
.host-next:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 20px 54px rgba(233,191,98,.5),0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55)}
/* the fixed corner pills reserve their own band — nothing centred ever runs underneath them */
#host.has-corner{padding-top:62px}
#qrFull{position:fixed;inset:0;z-index:100;background:rgba(5,15,20,.92);display:grid;place-items:center;cursor:pointer}

#qrFull .pin{font-size:3.6rem}
.net{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:96;background:#f5f0e0;color:#6b4e00;border:2px solid var(--gold);border-radius:12px;padding:9px 16px;font-weight:800;font-size:.9rem}

body.hc .pin{font-size:2.6rem}

/* ── money (§9) ───────────────────────────────────────────────── */
function fmtMoney(n){ n=Math.round(n);
  if(n>=10000000){const v=n/10000000;return '₹'+(v>=100?Math.round(v):v%1?v.toFixed(v<10?2:1):v)+' Cr';}
  if(n>=100000){const v=n/100000;return '₹'+(v>=100?Math.round(v):v%1?v.toFixed(v<10?2:1):v)+' L';}
  if(n>=1000){const v=n/1000;return '₹'+(v%1?v.toFixed(1):v)+'k';}
  return '₹'+n;
}
function indianFormat(digits){ digits=String(digits).replace(/\D/g,''); if(!digits) return '';
  const last3=digits.slice(-3), rest=digits.slice(0,-3);
  return (rest?rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',':'')+last3; }
const rupees=n=>'₹'+indianFormat(Math.round(n));          // the exact figure: ₹43,471
const parseNum=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── the maths: end-of-month SIP, monthly compounding (same as The Wealth Hack) ── */
function sipFor(fv,years,ratePct){ const r=ratePct/1200, n=Math.round(years*12); if(n<=0) return fv; return fv*r/(Math.pow(1+r,n)-1); }

  if(rk==='r1') return sipFor(s.target,s.years1,s.rate);
  if(rk==='r2') return sipFor(s.target,s.years2,s.rate);
  return sipFor(s.target,s.years1-s.delay,s.rate);
}
const ROUNDS={
  r1:{n:1,title:'Ten years',
      hostQ:S=>`How much would you need to put away <em>every month</em> to have <em>${tgt(S)}</em> in <em>${S.years1} years</em>?`,
      why:S=>`Assume ${S.rate}% a year. Type the monthly amount you think it takes.`,
      phoneQ:S=>`How much would you need to put away every month to have <em>${tgt(S)}</em> in <em>${S.years1} years</em>?`,
      label:S=>`To have ${tgt(S)} in ${S.years1} years, put away`},
  r2:{n:2,title:'Twenty years',
      hostQ:S=>`Same ${tgt(S)}. Now you have <em>${S.years2} years</em>. How much a month?`,
      why:S=>`Same ${S.rate}% a year. More time to grow.`,
      phoneQ:S=>`Same ${tgt(S)}. Now you have <em>${S.years2} years</em>. How much a month?`,
      label:S=>`To have ${tgt(S)} in ${S.years2} years, put away`},
  r3:{n:3,title:'The cost of delay',
      hostQ:S=>`Same ${tgt(S)}, same finish line in <em>${S.startYear+S.years1}</em>. Starting in ${S.startYear} took <em>${rupees(realOf('r1',S))}</em> a month. What if you start in <em>${S.startYear+S.delay}</em>?`,
      why:S=>`Only ${S.years1-S.delay} years left to build it. How much a month now?`,
      phoneQ:S=>`Same ${tgt(S)}, same finish line in <em>${S.startYear+S.years1}</em>. Starting in ${S.startYear} took ${rupees(realOf('r1',S))} a month. What if you start in <em>${S.startYear+S.delay}</em>?`,
      label:S=>`Starting in ${S.startYear+S.delay}, you put away`},
};
function roundOf(phase){ const m=/^(r\d)_/.exec(phase||''); return m&&ROUNDS[m[1]]?m[1]:null; }

/* ── role / room ──────────────────────────────────────────────── */
const params=new URLSearchParams(location.search);
const _soloDetect=()=>{ try{ return matchMedia('(pointer:coarse)').matches&&innerWidth<700; }catch(e){ return false; } };
let ROLE=params.get('role')||(_soloDetect()?'player':'host');

const MY_ID=(function(){let id=localStorage.getItem('ls_pid');if(!id){id=(crypto.randomUUID?crypto.randomUUID():'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));localStorage.setItem('ls_pid',id);}return id;})();

}
const S=()=>state.settings;

const hasGuess=(p,rk)=>p.guess&&p.guess[rk]>0;

/* ── scoring: the smallest rupee gap wins; ties share the rank; 3 / 2 / 1 points for the top three ── */
function closeRound(rk){
  const real=Math.round(realOf(rk));
  const rows=Object.values(state.players).filter(p=>hasGuess(p,rk)).map(p=>({id:p.id,guess:p.guess[rk],gap:Math.abs(p.guess[rk]-real)}))
    .sort((a,b)=>a.gap-b.gap||a.guess-b.guess);
  let rank=0,last=null; rows.forEach(r=>{ if(r.gap!==last){ rank++; last=r.gap; } r.rank=rank; r.pts=rank<=3?4-rank:0; });
  state.results[rk]={real,rows};
}
function scoreboard(){
  const tot={}; Object.keys(state.players).forEach(id=>tot[id]={id,pts:0,wins:0});
  ROUND_KEYS.forEach(rk=>{ const r=state.results[rk]; if(!r) return; r.rows.forEach(x=>{ if(!tot[x.id]) return; tot[x.id].pts+=x.pts; if(x.rank===1) tot[x.id].wins++; }); });
  return Object.values(tot).map(t=>Object.assign(t,{p:state.players[t.id]})).filter(t=>t.p).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||a.p.name.localeCompare(b.p.name));
}
// equal points and wins share a place, so a tie never hands one player the medal
function ranked(){ const sc=scoreboard(); let pos=0,last=null; sc.forEach(t=>{ const k=t.pts+':'+t.wins; if(k!==last){ pos++; last=k; } t.pos=pos; }); return sc; }
const gapText=(gap,real)=>gap<=Math.max(25,real*0.002)?'almost exact':fmtMoney(gap)+' away';

/* ── DB: ordered, retried saves ───────────────────────────────── */
let _saveTimer=null,_saveDirty=false,_saveBusy=false,_saveFails=0;
function save(){ state.updatedAt=Date.now(); clearTimeout(_saveTimer); _saveTimer=setTimeout(flushSave,60); }
function saveNow(){ state.updatedAt=Date.now(); return flushSave(); }
async function flushSave(){
  _saveDirty=true; if(_saveBusy) return; _saveBusy=true;
  try{
    while(_saveDirty){ _saveDirty=false; let ok=false;
      try{ const {error}=await db.from('games').upsert({room_code:ROOM,state,host_id:MY_ID,updated_at:new Date().toISOString()});
           ok=!error; if(error) console.warn('save failed — retrying',error.message||error); }
      catch(e){ console.warn('save failed — retrying',e); }
      if(ok){ _saveFails=0; } else { _saveFails++; _saveDirty=true; await new Promise(r=>setTimeout(r,Math.min(4000,400*2**Math.min(_saveFails-1,4)))); }
      netBanner();
    }
  } finally { _saveBusy=false; }
}
function netBanner(){
  if(!isHost) return;
  let b=document.getElementById('netBanner');
  const bad=_saveFails>=2||navigator.onLine===false;
  if(!bad){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement('div'); b.id='netBanner'; b.className='net'; document.body.appendChild(b); }
  b.innerHTML='⚠️ The phones can’t get this screen right now — retrying… <b>Don’t move on yet.</b>';
}
addEventListener('online',()=>{ if(isHost){ netBanner(); saveNow(); } }); addEventListener('offline',()=>netBanner());

/* ── realtime ─────────────────────────────────────────────────── */
let channel=null, _lastStateAt=Date.now();
function joinChannel(){
  channel=db.channel('room:'+ROOM);
  channel.on('postgres_changes',{event:'*',schema:'public',table:'games',filter:'room_code=eq.'+ROOM},
    (p)=>{const s=p.new&&p.new.state; if(s&&!isHost){state=s; _lastStateAt=Date.now(); renderPlayer();}})
    .on('broadcast',{event:'action'},({payload})=>{ if(isHost) hostHandleAction(payload); })
    .subscribe();
}
function sendAction(payload){ channel.send({type:'broadcast',event:'action',payload}); }

/* ── confetti (plain canvas, no library) ──────────────────────── */
function confetti(ms,count){
  if(REDUCED) return;
  let cv=document.getElementById('confetti'); if(!cv){ cv=document.createElement('canvas'); cv.id='confetti'; document.body.appendChild(cv); }
  const w=cv.width=innerWidth, h=cv.height=innerHeight, ctx=cv.getContext('2d');
  const cols=['#f7dea0','#e9bf62','#2dd4bf','#ff8a76','#ffffff','#a78bfa'];
  const ps=Array.from({length:count||160},()=>({x:Math.random()*w,y:-20-Math.random()*h*0.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function frame(t){ const k=t-t0; ctx.clearRect(0,0,w,h);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-Math.max(0,k-ms*.7)/(ms*.3)); ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); ctx.restore(); });
    if(k<ms) requestAnimationFrame(frame); else ctx.clearRect(0,0,w,h); })(t0);
}

/* ═══════════════════ HOST ═══════════════════ */
let _timers=[], _iv=null;
function clearTimers(){ _timers.forEach(clearTimeout); _timers=[]; clearInterval(_iv); }
function later(fn,ms){ _timers.push(setTimeout(fn,ms)); }
const IDLE_MS=120*60*1000; let _lastActivity=Date.now();
function bump(){ _lastActivity=Date.now(); }
function postLive(){ try{ const live=state.phase!=='lobby'&&state.phase!=='end'; window.parent.postMessage({type:live?'stock-rush-live':'stock-rush-idle'},'*'); }catch(e){} }
// The projector UI scales with the screen: 16px root on a laptop, ~21px on a 1080p projector. `hc` marks a short screen.
function fitHost(){
  const px=Math.max(16,Math.min(22,innerWidth/90,innerHeight/50.6));
  document.documentElement.style.fontSize=px+'px';
  document.body.classList.toggle('hc',innerHeight/px<57);
  return px;
}

async function initHost(){
  try{ if(window.self!==window.top) document.body.classList.add('framed'); }catch(e){ document.body.classList.add('framed'); }
  document.getElementById('host').classList.remove('hide');
  document.body.classList.add('host-bg');
  fitHost(); let _rz=null; addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(()=>{ fitHost(); if(state) renderHost(); },150); });
  if(!ROOM){ ROOM='L'+(1000+Math.floor(Math.random()*9000));   // L-prefix: never collides with E#### (Wealth Hack), MF####, SG#### or KBC's numeric PINs
    const p=new URLSearchParams(location.search);p.set('role','host');p.set('room',ROOM);history.replaceState(null,'','?'+p.toString()); }
  joinChannel();
  let resumed=false;
  try{
    const {data}=await db.from('games').select('state,updated_at').eq('room_code',ROOM).maybeSingle();
    const s=data&&data.state;
    const recent=data&&data.updated_at&&(Date.now()-new Date(data.updated_at).getTime()<45*60*1000);
    if(s&&recent&&s.settings&&s.phase!=='lobby'&&s.phase!=='end'&&Object.keys(s.players||{}).length>0){ state=s; state.hostId=MY_ID; state.results=state.results||{}; resumed=true; }
  }catch(e){}
  if(!resumed){ state=freshState(); await saveNow(); }
  // Local design QA only: ?demo=1&phase=r1_reveal seeds a room so every screen can be screenshotted.
  if(params.get('demo')&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
    const real={r1:realOf('r1'),r2:realOf('r2'),r3:realOf('r3')};
    const names=['Meera','Rohan','Aanya','Kabir','Zoya','Dev','Tara','Imran'], f=[1.02,0.8,1.35,0.55,0.97,1.12,0.7,1.6];
    names.forEach((n,i)=>{ state.players['d'+i]={id:'d'+i,name:n,av:AV_EMOJI[i],color:AV_COLOR[i],guess:{r1:Math.round(real.r1*f[i]),r2:Math.round(real.r2*f[(i+3)%8]),r3:Math.round(real.r3*f[(i+5)%8])}}; });
    state.phase=params.get('phase')||'lobby';
    const idx=PHASES.indexOf(state.phase);
    ROUND_KEYS.forEach((rk,i)=>{ if(idx>PHASES.indexOf(rk+'_ask')) closeRound(rk); });
  }
  const rb=document.createElement('button'); rb.className='host-reset'; rb.textContent='↺ New game'; rb.onclick=hostReset; document.body.appendChild(rb);
  const jw=document.createElement('div'); jw.className='join-corner'; jw.id='joinCorner'; jw.title='Scan to join or rejoin';
  jw.innerHTML='<div class="jc-qr" id="jcQr"></div><div class="jc-txt"><div class="jc-lbl">Scan to (re)join</div><div class="jc-pin">'+ROOM+'</div><div class="jc-tap">tap to enlarge ⛶</div></div>';
  jw.onclick=openQRFull; document.body.appendChild(jw); makeQR(document.getElementById('jcQr'),56);
  const kh=document.createElement('div'); kh.className='key-hint'; kh.id='keyHint'; document.body.appendChild(kh);
  const bk=document.createElement('button'); bk.className='host-back'; bk.id='hostBack'; bk.textContent='← Back'; bk.onclick=hostBack; document.body.appendChild(bk);
  const nx=document.createElement('button'); nx.className='host-next'; nx.id='hostNext'; nx.onclick=hostAdvance; document.body.appendChild(nx);
  document.addEventListener('keydown',e=>{
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(!document.getElementById('qrFull').classList.contains('hide')){ closeQRFull(); return; }
    if(e.code==='Space'||e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); hostAdvance(); }
    else if(e.key==='ArrowLeft'||e.key==='Backspace'){ e.preventDefault(); hostBack(); }
  });
  setInterval(()=>{ if(state&&state.phase!=='lobby'&&Date.now()-_lastActivity>IDLE_MS){ bump(); state=freshState(); saveNow(); renderHost(); } },30000);
  renderHost();
}
function playerUrl(){return location.origin+location.pathname+'?role=player&room='+ROOM;}
function makeQR(el,size){
  el.innerHTML=''; el.style.position='relative'; el.style.width=size+'px'; el.style.height=size+'px';
  try{
    new QRCode(el,{text:playerUrl(),width:size,height:size,colorDark:'#1a3a5c',colorLight:'#ffffff',correctLevel:(window.QRCode&&QRCode.CorrectLevel?QRCode.CorrectLevel.H:2)});
    const s=Math.round(size*0.22), pad=Math.max(3,Math.round(size*0.014));
    const logo=document.createElement('img'); logo.src=LOGO;
    logo.style.cssText=`position:absolute;left:50%;top:50%;width:${s}px;height:${s}px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;padding:${pad}px;box-sizing:content-box`;
    el.appendChild(logo);
  }catch(e){ el.textContent=playerUrl(); }
}
function openQRFull(){ const q=document.getElementById('qrFull'); q.classList.remove('hide');
  q.innerHTML=`<div class="lcard"><div class="lk"><i></i>Scan to join</div><div class="qr-tile" style="cursor:pointer"><div id="qrBig"></div></div><div class="pin-row"><span class="pin-label">game pin</span><span class="pin">${ROOM}</span></div><div class="joinurl">${playerUrl()}</div><div class="pin-label" style="margin-top:14px;opacity:.7">tap anywhere to close</div></div>`;
  makeQR(document.getElementById('qrBig'),Math.min(500,Math.round(innerHeight*0.56))); }
function closeQRFull(){ document.getElementById('qrFull').classList.add('hide'); }
function hostReset(){ if(!confirm('Start a fresh game in this room? Everyone will need to rejoin.')) return; bump(); clearTimers(); _played=null; state=freshState(); saveNow(); renderHost(); }

// Advancing out of an "ask" phase closes the answers: the result is stored right then, so a late tap can never change it.
function enterPhase(ph){ state.phase=ph; state.nonce++; }
function hostAdvance(){
  const i=PHASES.indexOf(state.phase); if(i<0||i>=PHASES.length-1) return;
  if(state.phase==='lobby'&&!Object.keys(state.players).length) return;
  bump(); const rk=roundOf(state.phase); if(rk&&/_ask$/.test(state.phase)) closeRound(rk);
  enterPhase(PHASES[i+1]); save(); renderHost();
}
function hostBack(){
  const i=PHASES.indexOf(state.phase); if(i<=0) return; bump();
  const rk=roundOf(state.phase); if(rk&&/_reveal$/.test(state.phase)) delete state.results[rk];   // answers re-open, and are scored again on the next close
  enterPhase(PHASES[i-1]); save(); renderHost();
}
function hostHandleAction(a){
  if(!a||!a.type||!state) return; bump();
  if(a.type==='join'){
    let name=String(a.name||'').slice(0,16).trim(); if(!name) return;
    if(!state.players[a.id]){
      const taken=Object.values(state.players).map(p=>p.name.toLowerCase()); let nm=name, k=2; while(taken.includes(nm.toLowerCase())) nm=name.slice(0,13)+' '+(k++); name=nm;
      const n=Object.keys(state.players).length;
      state.players[a.id]={id:a.id,name,av:AV_EMOJI[n%AV_EMOJI.length],color:AV_COLOR[n%AV_COLOR.length],guess:{}};
    }
    save(); if(state.phase==='lobby'||/_ask$/.test(state.phase)) renderHost();
  }
  else if(a.type==='guess'){
    const p=state.players[a.id]; const rk=roundOf(state.phase);
    if(!p||!rk||state.phase!==rk+'_ask'||a.round!==rk) return;
    const v=Math.min(100000000,Math.max(0,Math.round(+a.value||0))); if(!(v>0)) return;
    p.guess=p.guess||{}; p.guess[rk]=v; save(); renderHost();
  }
}

// Reveal: a drum roll, the real number lands, then the podium fills from third place up to the winner.
function tplReveal(rk){
  const R=ROUNDS[rk], s=S(), res=state.results[rk]||{real:Math.round(realOf(rk)),rows:[]}, real=res.real;
  const top=res.rows.filter(r=>r.pts>0).slice(0,6);
  const order=r=>r.rank===1?1:r.rank===2?0:2;         // podium: 2nd left, 1st middle, 3rd right
  const medal=['','🥇','🥈','🥉'];
  const cards=top.slice().sort((a,b)=>order(a)-order(b)||a.gap-b.gap).map(r=>{ const p=state.players[r.id]; if(!p) return '';
    return `<div class="glass pcard ${r.rank===1?'win':''}" data-rank="${r.rank}"><div class="medal">${medal[r.rank]}</div><div class="pn">${esc(p.name)}</div><div class="pg">guessed ${rupees(r.guess)}</div><div class="pgap">${gapText(r.gap,real)}</div></div>`; }).join('');
  let extra='';
  if(rk==='r2'){
    const yrs=[...new Set([s.years1,s.years2,25])].sort((a,b)=>a-b), amts=yrs.map(y=>sipFor(s.target,y,s.rate)), mx=Math.max(...amts);
    extra=`<div class="glass cmp xtra"><div class="kicker">Same ${tgt(s)}, more time</div>${yrs.map((y,i)=>`<div class="cmp-row ${y===s.years2?'cur':''}"><span class="cy">${y} years</span><span class="cbar"><i style="width:${Math.max(4,amts[i]/mx*100)}%"></i></span><b>${rupees(amts[i])}</b></div>`).join('')}</div>`;
  }
  if(rk==='r3'){
    const a=realOf('r1'), b=realOf('r3'), d=b-a;
    extra=`<div class="glass cmp xtra delay"><div class="dl"><div class="kicker">Start in ${s.startYear}</div><div class="dn">${rupees(a)}</div></div><div class="dl-arrow">→</div><div class="dl"><div class="kicker">Start in ${s.startYear+s.delay}</div><div class="dn gold">${rupees(b)}</div></div>
      <div class="dl-extra"><b>${rupees(d)} more</b> every month<span>${Math.round(d/a*100)}% higher for waiting ${s.delay} years</span></div></div>`;
  }
  return `<div class="stage reveal-stage">
    <div class="presents">Round ${R.n} · the real number</div>
    <div class="real-label">${R.label(s)}</div>
    <div class="big-real rolling" id="bigReal">${'₹ '+'• '.repeat(String(Math.round(real)).length)}</div>
    <div class="real-sub">every month · ${s.rate}% a year</div>
    ${extra}
    ${top.length?`<div class="podium">${cards}</div>`:`<p class="nobody xtra">Nobody locked in this round.</p>`}
  </div>`;
}
function playReveal(rk){
  const key=state.phase+':'+state.nonce, instant=_played===key||REDUCED; _played=key;
  const big=document.getElementById('bigReal'); if(!big) return;
  const real=String(Math.round(state.results[rk]?state.results[rk].real:realOf(rk)));
  const final=rupees(real), cards=[...document.querySelectorAll('.pcard')], extras=[...document.querySelectorAll('.xtra')];
  const land=()=>{ clearInterval(_iv); big.textContent=final; big.classList.remove('rolling'); big.classList.add('landed'); };
  if(instant){ land(); big.classList.remove('landed'); cards.concat(extras).forEach(c=>c.classList.add('show')); return; }
  const t0=performance.now(), n=real.length, DUR=1900;
  _iv=setInterval(()=>{
    const k=(performance.now()-t0)/DUR; if(k>=1){ land(); return; }
    const digs=real.split('').map((d,i)=>k>(i+1)/(n+1)?d:String(Math.floor(Math.random()*10))).join('');
    big.textContent='₹'+indianFormat(digs);
  },55);
  later(()=>extras.forEach(c=>c.classList.add('show')),DUR+300);
  const seq=cards.slice().sort((a,b)=>(+b.dataset.rank)-(+a.dataset.rank));   // third place first, the winner last
  seq.forEach((c,i)=>later(()=>c.classList.add('show'),DUR+900+i*750));
  const winAt=DUR+900+Math.max(0,seq.length-1)*750;
  if(cards.length) later(()=>confetti(3200,170),winAt+200);
}
// The ladder: each extra year of waiting, one bar at a time. No guessing.
function tplLadder(){

  const body=rows.map((r,i)=>{ const prev=i?rows[i-1].a:null;
    return `<div class="lrow" style="animation-delay:${i*900}ms"><span class="ly">${r.y}${i===0?'<small>on time</small>':''}</span><span class="lbar"><i style="width:${Math.max(5,r.a/mx*100)}%"></i></span><b class="la">${rupees(r.a)}</b>
      <span class="lx">${i===0?'':`<em>+${rupees(r.a-base)}</em><small>${prev?`this year alone: +${rupees(r.a-prev)}`:''}</small>`}</span></div>`; }).join('');
  return `<div class="stage ladder-stage">
    <div class="presents">The cost of delay</div>
    <h2 class="title" style="font-size:clamp(1.5rem,2.8vw,2.4rem)">Same ${tgt(s)}, same finish line in ${s.startYear+s.years1}. <em>Every year you wait costs more than the last.</em></h2>

}

      if(data&&data.state&&data.state.updatedAt!==(state&&state.updatedAt)){ state=data.state; _lastStateAt=Date.now(); renderPlayer(); }
