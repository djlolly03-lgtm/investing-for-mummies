            <div className="db-hdr-round" style={{fontSize:'0.62rem',fontWeight:'800',textTransform:'uppercase',letterSpacing:'1px',color:'#bde9e4'}}>ROUND {round} OF 4</div>
            <div className="db-hdr-score" style={{fontSize:'0.7rem',fontWeight:'800',color:'#fdf3dc'}}>Score: {score} pts</div>
          </div>
        </div>
        <div style={{display:'flex',gap:'5px'}}>
          {[1,2,3,4].map(function(i){return <div key={i} className="db-hdr-bar" style={{flex:1,height:'4px',borderRadius:'2px',background:i<=round?'#bde9e4':'rgba(255,255,255,0.2)'}}></div>;})}
        </div>
      </div>
    );
  }

  // ── Phase 1: Event info + quiz ───────────────────────────────────
  if (phase === 'event') {
    return (
      <div style={{background:'#f7faf9',fontFamily:"Nunito,sans-serif"}}>
        {showPopup && <EventPopup ev={ev} onClose={function(){ setShowPopup(false); }} />}
        <Header />
        <div className="db-wrap-narrow" style={{maxWidth:'480px',margin:'0 auto',padding:'12px 16px'}}>
          {/* Event headline card */}
          <div className="db-ev-headline-card" style={{background:headerGrad,borderRadius:'16px',padding:'14px 16px',marginBottom:'12px',color:'#fff'}}>
            <div className="db-ev-year" style={{fontSize:'0.6rem',fontWeight:'800',textTransform:'uppercase',letterSpacing:'1px',color:'rgba(255,255,255,0.65)',marginBottom:'3px'}}>{ev.year}</div>
            <div className="db-ev-title" style={{fontSize:'1.1rem',fontWeight:'900',marginBottom:'4px'}}>{ev.emoji} {ev.title}</div>
            <div className="db-ev-headline" style={{fontSize:'0.75rem',color:'rgba(255,255,255,0.85)',lineHeight:1.5}}>{ev.headline}</div>
          </div>

          {/* Quiz card */}
          <div className="db-card" style={{background:'#fff',borderRadius:'16px',padding:'14px 15px',marginBottom:'12px',boxShadow:'0 2px 10px rgba(26,58,92,0.07)'}}>
            <div className="db-quiz-eyebrow" style={{fontSize:'0.6rem',fontWeight:'800',textTransform:'uppercase',letterSpacing:'0.8px',color:'#6a8a9c',marginBottom:'6px'}}>Quick Question — +25 pts</div>
            <div className="db-quiz-q" style={{fontSize:'0.85rem',fontWeight:'700',color:'#1a3a5c',marginBottom:'10px',lineHeight:1.5}}>{ev.q}</div>
            <div style={{display:'flex',flexDirection:'column',gap:'7px'}}>
              {ev.opts.map(function(opt, i) {
                var bg='#f7faf9', border='1.5px solid #bde9e4', col='#1a3a5c';
                if (answered) {
                  if (i === ev.ans) { bg='#e0f3f0'; border='2px solid #2e7d32'; col='#0e6050'; }
                  else if (i === chosen) { bg='#fde8e6'; border='2px solid #c62828'; col='#b5474a'; }
                }
                return (
                  <button key={i} className="db-quiz-opt" onClick={function(){handle(i);}} disabled={answered}
                    style={{padding:'9px 12px',background:bg,border:border,borderRadius:'11px',cursor:answered?'default':'pointer',textAlign:'left',fontSize:'0.8rem',fontWeight:'700',color:col}}>
                    {answered && i === ev.ans ? '✅ ' : (answered && i === chosen && i !== ev.ans ? '❌ ' : '')}{opt}
                  </button>
                );
              })}
            </div>
            {answered && (
              <div className="db-quiz-feedback" style={{marginTop:'10px',padding:'9px 12px',background:correct?'#e0f3f0':'#fff8e1',borderRadius:'11px',borderLeft:'3px solid '+(correct?'#2a9d8f':'#b5600a'),fontSize:'0.75rem',color:'#1a3a5c',lineHeight:1.55}}>
                {correct ? '🎉 +25 points! ' : '💡 Good try! '}{ev.explain}
              </div>
            )}
          </div>

          <button
            className="db-cta"
            onClick={function(){ setPhase('impact'); }}
            disabled={!answered}
            style={{width:'100%',padding:'13px',background:answered?headerGrad:'#bde9e4',color:'#fff',fontWeight:'900',fontSize:'0.92rem',border:'none',borderRadius:'14px',cursor:answered?'pointer':'not-allowed',opacity:answered?1:0.7,boxShadow:answered?'0 4px 14px rgba(26,58,92,0.2)':'none'}}
          >
            See how your portfolio performed →
          </button>
        </div>
      </div>
    );
  }

  // ── Phase 2: Per-instrument impact visualization ─────────────────
  var allocatedInstr = INSTR.filter(function(inst){ return alloc[inst.id] > 0; });
  var totalAfter = allocatedInstr.reduce(function(s, inst){
    return s + (portfolio[inst.id] || 0) * (1 + ev.impacts[inst.id] / 100);
  }, 0);
  var totalGain = totalAfter - currentTotal;
  var totalGainPct = currentTotal > 0 ? (totalGain / currentTotal * 100) : 0;

  // Max absolute impact for bar scaling
  var maxImpact = Math.max.apply(null, allocatedInstr.map(function(inst){ return Math.abs(ev.impacts[inst.id]); }));

  return (
    <div className="db-page" style={{background:'#f7faf9',fontFamily:"Nunito,sans-serif",paddingBottom:'24px'}}>
      <Header />
      <div className="db-wrap" style={{maxWidth:'480px',margin:'0 auto',padding:'12px 16px'}}>

        {/* Journey strip — portfolio value across all rounds */}
        {(function(){
          var points = [{label:'Start', value:TOTAL, emoji:'🏁', done:true}];
          portHistory.forEach(function(h){ points.push({label:'Yr '+h.round, value:h.total, emoji:h.emoji, done:true}); });
          points.push({label:'Yr '+round, value:totalAfter, emoji:ev.emoji, current:true});
          for (var i = round + 1; i <= 4; i++) points.push({label:'Yr '+i, value:null, emoji:EVENTS[i-1]?EVENTS[i-1].emoji:'⬜', future:true});
          return (
            <div className="db-journey" style={{background:'#fff',borderRadius:'16px',padding:'12px 14px',marginBottom:'12px',boxShadow:'0 2px 10px rgba(26,58,92,0.07)'}}>
              <div style={{fontSize:'0.6rem',fontWeight:'800',textTransform:'uppercase',letterSpacing:'1.5px',color:'#8a9fb0',marginBottom:'10px'}}>📈 Portfolio Journey</div>
              <div style={{display:'flex',alignItems:'stretch',overflowX:'auto',gap:'0',paddingBottom:'2px',WebkitOverflowScrolling:'touch'}}>
                {points.map(function(pt, idx){
                  var pct = null;
                  if (idx > 0 && pt.value && points[idx-1].value) {
                    pct = ((pt.value - points[idx-1].value) / points[idx-1].value * 100);
                  }
                  var bgCol = pt.current ? '#1a3a5c' : pt.future ? '#f7faf9' : '#e0f3f0';
                  var textCol = pt.current ? '#fff' : pt.future ? '#b0bec5' : '#1a3a5c';
                  var subCol = pt.current ? 'rgba(255,255,255,0.65)' : pt.future ? '#c0cfd8' : '#5a7d8a';
                  var pctBg = pt.current ? 'rgba(255,255,255,0.15)' : (pct>=0 ? '#e0f3f0' : '#fde8e6');
                  var pctCol = pt.current ? (pct>=0?'#bde9e4':'#f5c0bc') : (pct>=0?'#2a9d8f':'#b5474a');
                  return (
                    <React.Fragment key={idx}>
                      {idx > 0 && (
                        <div style={{display:'flex',alignItems:'center',flexShrink:0,color:pt.future?'#e0f3f0':'#2a9d8f',fontSize:'1.1rem',fontWeight:'900',padding:'0 1px',lineHeight:1,alignSelf:'center'}}>›</div>
                      )}
                      <div style={{flexShrink:0,width:'68px',background:bgCol,borderRadius:'12px',padding:'8px 5px 7px',textAlign:'center',display:'flex',flexDirection:'column',gap:'3px',alignItems:'center'}}>
                        <div style={{fontSize:'1.25rem',lineHeight:1}}>{pt.emoji}</div>
                        <div style={{fontSize:'0.57rem',fontWeight:'800',color:subCol,lineHeight:1,textTransform:'uppercase',letterSpacing:'0.4px'}}>{pt.label}</div>
                        <div style={{fontSize:'0.78rem',fontWeight:'900',color:textCol,lineHeight:1.1,letterSpacing:'-0.3px'}}>{pt.value ? fmtShort(pt.value) : '—'}</div>
                        {pct !== null
                          ? <div style={{fontSize:'0.63rem',fontWeight:'900',color:pctCol,background:pctBg,borderRadius:'6px',padding:'1px 5px',lineHeight:1.3}}>{pct>=0?'+':''}{pct.toFixed(1)}%</div>
                          : <div style={{height:'17px'}}></div>
                        }
                      </div>
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* Summary banner */}
        <div className="db-summary-banner" style={{background:headerGrad,borderRadius:'16px',padding:'14px 18px',marginBottom:'14px',color:'#fff'}}>
          <div style={{fontSize:'0.65rem',fontWeight:'800',textTransform:'uppercase',letterSpacing:'1px',color:'rgba(255,255,255,0.65)',marginBottom:'4px'}}>{ev.emoji} {ev.title} — Portfolio Impact</div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
            <div>
              <div style={{fontSize:'0.7rem',color:'rgba(255,255,255,0.7)'}}>Before</div>
              <div style={{fontSize:'1.2rem',fontWeight:'900'}}>{fmtShort(currentTotal)}</div>
            </div>
            <div style={{fontSize:'1.6rem',opacity:0.6}}>→</div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:'0.7rem',color:'rgba(255,255,255,0.7)'}}>After</div>
              <div style={{fontSize:'1.2rem',fontWeight:'900',color:totalGain>=0?'#bde9e4':'#f5c0bc'}}>{fmtShort(totalAfter)}</div>
            </div>
            <div style={{textAlign:'right',background:'rgba(0,0,0,0.2)',borderRadius:'10px',padding:'6px 12px'}}>
              <div style={{fontSize:'0.65rem',color:'rgba(255,255,255,0.7)'}}>Net</div>
              <div style={{fontSize:'1.1rem',fontWeight:'900',color:totalGain>=0?'#bde9e4':'#f5c0bc'}}>{totalGain>=0?'+':''}{totalGainPct.toFixed(1)}%</div>
            </div>
          </div>
        </div>

        {/* Per-instrument cards — matches the Allocate screen's 6-across card system */}
        <div className="db-grid6" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}}>
          {allocatedInstr.map(function(inst){
            var imp = ev.impacts[inst.id];
            var before = portfolio[inst.id] || 0;
            var after = before * (1 + imp / 100);
            var gain = after - before;
            var isPos = imp >= 0;
            var barWidth = maxImpact > 0 ? Math.abs(imp) / maxImpact * 100 : 0;
            var col = isPos ? inst.col : '#b5474a';

            return (
              <div key={inst.id} className="db-instr-card" style={{background:isPos?inst.col+'0d':'#fde8e6',borderRadius:'14px',padding:'10px',boxShadow:'0 2px 8px rgba(26,58,92,0.06)',border:'2.5px solid '+(isPos?inst.col+'99':'#e08a8a'),display:'flex',flexDirection:'column',gap:'7px'}}>
                {/* Icon badge + name */}
                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                  <div className="db-instr-icon-badge" style={{width:'34px',height:'34px',borderRadius:'50%',background:'#fff',border:'1.5px solid '+col+'55',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.1rem',flexShrink:0,boxShadow:'0 2px 6px rgba(26,58,92,0.08)'}}>{inst.icon}</div>
                  <div className="db-instr-name" style={{fontWeight:'800',color:'#1a3a5c',fontSize:'0.75rem',lineHeight:1.2}}>{inst.name}</div>
                </div>

                {/* % change */}
                <div className="db-instr-rate" style={{fontSize:'1.1rem',fontWeight:'900',color:isPos?'#0e6050':'#b5474a'}}>{pctStr(imp)}</div>

                {/* Impact bar */}
                <div style={{height:'6px',borderRadius:'3px',background:'#fff',overflow:'hidden'}}>
                  <div style={{height:'100%',width:barWidth+'%',background:isPos?'linear-gradient(90deg,#2a9d8f,#4db89e)':'linear-gradient(90deg,#c0575a,#d9838a)',borderRadius:'3px'}}></div>
                </div>

                {/* After value, prominent — with Before as muted subtext. Stacked (not side-by-side) so it never has to
                    squeeze two 9-character rupee amounts into a ~150px-wide 6-across card; this is what was colliding. */}
                <div className="db-instr-amt" style={{background:'#fff',border:'1px solid '+(isPos?col+'30':'#f0c7c7'),borderRadius:'8px',padding:'6px 7px',minHeight:'auto',textAlign:'center'}}>
                  <div style={{fontSize:'0.5rem',color:'#8a9fb0',fontWeight:'700',letterSpacing:'0.3px'}}>AFTER</div>
                  <div style={{fontSize:'0.78rem',fontWeight:'900',color:isPos?'#0e6050':'#b5474a',fontVariantNumeric:'tabular-nums',lineHeight:1.3}}>₹{indFmtDB(Math.round(after))}</div>
                  <div style={{fontSize:'0.58rem',color:'#aab8c2',fontWeight:'700',fontVariantNumeric:'tabular-nums'}}>was ₹{indFmtDB(Math.round(before))}</div>
                </div>

                {/* Gain/loss badge */}
                <div style={{fontSize:'0.62rem',fontWeight:'800',color:isPos?'#2a9d8f':'#b5474a',textAlign:'center',background:isPos?'#e0f3f0':'#fde8e6',borderRadius:'7px',padding:'3px 4px'}}>
                  {isPos?'▲ +':'▼ '}₹{indFmtDB(Math.round(Math.abs(gain)))}
                </div>
              </div>
            );
          })}
        </div>

        {round === 4 && (
          <button onClick={function(){ setShowInflPopup(true); }}
            style={{width:'100%',padding:'13px',background:'linear-gradient(135deg,#bf360c,#e65100)',color:'#fff',fontWeight:'900',fontSize:'0.88rem',border:'none',borderRadius:'14px',cursor:'pointer',marginBottom:'10px',boxShadow:'0 3px 14px rgba(230,81,0,0.32)',letterSpacing:'0.2px'}}>
            🧮 See the Real Return Working →
          </button>
        )}

        <button
          onClick={onNext}
          style={{width:'100%',padding:'14px',background:'linear-gradient(135deg,#1a3a5c,#2a9d8f)',color:'#fff',fontWeight:'900',fontSize:'0.95rem',border:'none',borderRadius:'14px',cursor:'pointer',boxShadow:'0 4px 14px rgba(26,58,92,0.2)',letterSpacing:'0.3px'}}
        >
          {round < 4 ? 'Next: '+EVENTS[round].emoji+' '+EVENTS[round].title+' →' : '🏆 See Final Results'}
        </button>
      </div>

      {showInflPopup && (
        <div onClick={function(e){if(e.target===e.currentTarget)setShowInflPopup(false);}}
          style={{position:'fixed',inset:0,background:'rgba(26,58,92,0.62)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px',overflowY:'auto'}}>
          <div className="db-infl-card" style={{background:'#fff',borderRadius:'22px',maxWidth:'420px',width:'100%',maxHeight:'960px',overflowY:'visible',boxShadow:'0 12px 48px rgba(26,58,92,0.28)',display:'flex',flexDirection:'column'}}>

            {/* Header (pinned) */}
            <div className="db-infl-head" style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'24px 20px 14px',flexShrink:0}}>
              <div style={{fontFamily:'Lora,Georgia,serif',fontSize:'1rem',fontWeight:'700',color:'#1a3a5c'}}>🧮 Real Return Calculator</div>
              <button onClick={function(){setShowInflPopup(false);}} style={{background:'none',border:'none',fontSize:'1.4rem',cursor:'pointer',color:'#8a9fb0',lineHeight:1}}>✕</button>
            </div>

            {/* Scrollable middle */}
            <div className="db-infl-body" style={{padding:'0 20px',overflowY:'auto',flex:'1 1 auto',minHeight:0}}>

            {/* Formula callout */}
            <div style={{background:'#fff8e1',borderRadius:'12px',padding:'11px 13px',marginBottom:'14px',border:'1.5px solid #ffe082'}}>
              <div style={{fontSize:'0.82rem',fontWeight:'900',color:'#b5600a',marginBottom:'4px'}}>Real Return = Nominal Return − Inflation</div>
              <div style={{fontSize:'0.75rem',color:'#7f5200',lineHeight:1.55}}>Your money "grew" on paper — but if inflation rose by the same amount, your purchasing power didn't. Real return shows what you actually gained.</div>
            </div>

            <div style={{fontSize:'0.62rem',fontWeight:'800',textTransform:'uppercase',color:'#8a9fb0',letterSpacing:'0.6px',marginBottom:'10px'}}>Year 4 — Inflation: 7.5%</div>

            {/* Instrument rows */}
            <div className="db-infl-list">
            {[
              {name:'FD',           icon:'🏦', nominal:7.5,  col:'#1a3a5c', note:'Just keeping pace with inflation'},
              {name:'Gold Bond',    icon:'🪙', nominal:7.0,  col:'#b8860b', note:'Falling behind inflation'},
              {name:'SSY',          icon:'👧', nominal:8.2,  col:'#7b1fa2', note:'Barely ahead — but still positive'},
              {name:'PPF',          icon:'🏛️', nominal:7.1,  col:'#0e6050', note:'Slightly behind inflation'},
              {name:'Corp Bond',    icon:'🏢', nominal:11.0, col:'#b5474a', note:'Comfortably ahead of inflation'},
            ].map(function(item){
              var real = Math.round((item.nominal - 7.5) * 10) / 10;
              var isPos = real > 0, isZero = real === 0;
              var realCol = isPos ? '#0e6050' : isZero ? '#1a3a5c' : '#b5474a';
              var realBg  = isPos ? '#e0f3f0' : isZero ? '#e0f3f0' : '#fde8e6';
              var border  = isPos ? '#e0f3f0' : isZero ? '#e0f3f0' : '#f5c0bc';
              return (
                <div key={item.name} className="db-infl-row" style={{background:'#f7faf9',borderRadius:'13px',padding:'12px 13px',marginBottom:'9px',border:'1.5px solid '+border}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
                      <span style={{fontSize:'1.2rem'}}>{item.icon}</span>
                      <span style={{fontWeight:'800',color:item.col,fontSize:'0.82rem'}}>{item.name}</span>
                    </div>
                    <div style={{fontWeight:'900',fontSize:'1.05rem',color:realCol}}>{isPos?'+':''}{real.toFixed(1)}%</div>
                  </div>
                  {/* Working row */}
                  <div style={{display:'flex',alignItems:'center',gap:'5px',fontSize:'0.74rem',flexWrap:'wrap',marginBottom:'5px'}}>
                    <span style={{background:'#e0f3f0',borderRadius:'7px',padding:'3px 8px',fontWeight:'700',color:'#1a3a5c'}}>{item.nominal}%</span>
                    <span style={{color:'#8a9fb0',fontWeight:'700'}}>−</span>
                    <span style={{background:'#f7faf9',borderRadius:'7px',padding:'3px 8px',fontWeight:'700',color:'#b5600a'}}>7.5% inflation</span>
                    <span style={{color:'#8a9fb0',fontWeight:'700'}}>=</span>
                    <span style={{background:realBg,borderRadius:'7px',padding:'3px 8px',fontWeight:'900',color:realCol}}>{isPos?'+':''}{real.toFixed(1)}%</span>
                  </div>
                  <div style={{fontSize:'0.68rem',color:'#7a8fa0',fontStyle:'italic'}}>{item.note}</div>
                </div>
              );
            })}
            </div>

            {/* Insight */}
            <div style={{background:'linear-gradient(135deg,#e0f3f0,#f7faf9)',borderRadius:'13px',padding:'12px 14px',margin:'4px 0 20px',border:'1.5px solid #a5d6a7'}}>
              <div style={{fontWeight:'900',color:'#0e6050',fontSize:'0.8rem',marginBottom:'5px'}}>💡 The Takeaway</div>
              <div style={{fontSize:'0.76rem',color:'#2a9d8f',lineHeight:1.6}}>Only Corporate Bonds meaningfully beat inflation (+3.5%). FDs and PPF barely keep up — or fall behind. This is why long-term wealth needs <strong>growth assets beyond just debt</strong>.</div>
            </div>
            </div>{/* end db-infl-body */}

            {/* Footer (pinned) */}
            <div className="db-infl-foot" style={{padding:'12px 20px 20px',flexShrink:0}}>
              <button onClick={function(){setShowInflPopup(false);}}
                style={{width:'100%',padding:'13px',background:'linear-gradient(135deg,#1a3a5c,#2a9d8f)',color:'#fff',border:'none',borderRadius:'13px',fontWeight:'900',fontSize:'0.9rem',cursor:'pointer',boxShadow:'0 3px 12px rgba(26,58,92,0.2)'}}>
                Got it! 👍
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

function Results({ portfolio, alloc, score, onReplay }) {
  var nominalFinal = INSTR.reduce(function(s, v) { return s + (portfolio[v.id] || 0); }, 0);
  var YEARS = 4;
  var INFL_FACTOR = Math.pow(1.07, YEARS); // ≈ 1.3108
  var realFinal = nominalFinal / INFL_FACTOR;

  var nomGain = nominalFinal - TOTAL;
  var nomGainPct = (nomGain / TOTAL * 100);
  var realGain = realFinal - TOTAL;
  var realGainPct = (realGain / TOTAL * 100);

  var grade = score >= 100 ? 'Debt Master!' : score >= 75 ? 'Smart Lender!' : score >= 50 ? 'Learning Fast!' : 'Keep Practising!';
  var safeAlloc = (alloc.ppf||0)+(alloc.ssy||0)+(alloc.fd||0);
  var riskAlloc = (alloc.cbond||0)+(alloc.dmf||0);
  var profile = safeAlloc >= TOTAL * 0.6
    ? { name:'Safety First Investor', icon:'🛡️', col:'#1a3a5c', desc:'You prioritize capital protection. Great for stability, but inflation can quietly erode real returns over time.' }
    : riskAlloc >= TOTAL * 0.5
    ? { name:'Yield Hunter', icon:'🎯', col:'#1a3a5c', desc:'You chase higher returns and can handle volatility. Rewarding when markets behave — just remember to diversify!' }
    : { name:'Balanced Borrower', icon:'🔮', col:'#1a3a5c', desc:'You balance safety and yield — the professional approach that weathers most market conditions.' };
  return (
    <div className="db-page" style={{background:'#f7faf9',fontFamily:"Nunito,sans-serif"}}>
      <div className="db-res-hero" style={{background:'linear-gradient(160deg,#0d2744 0%,#1a3a5c 60%,#2a5272 100%)',padding:'12px 18px 14px',color:'#fff'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
          <img src={RECT_LOGO} alt="IFM" style={{height:'28px',objectFit:'contain',objectPosition:'left'}} onError={function(e){e.target.style.display='none';}} />
          <div style={{textAlign:'right'}}>
            <div className="db-res-grade" style={{fontFamily:'Lora,Georgia,serif',fontSize:'1.1rem',fontWeight:'700'}}>{grade}</div>
            <div className="db-res-score" style={{fontSize:'1.8rem',fontWeight:'900',color:'#fdf3dc',lineHeight:1}}>{score} <span className="db-res-score-sub" style={{fontSize:'0.9rem',color:'#bde9e4'}}>/ 100 🏆</span></div>
          </div>
        </div>
      </div>
      <div className="db-wrap-narrow" style={{padding:'8px 13px',maxWidth:'440px',margin:'0 auto'}}>

        <div className="db-card" style={{background:'#fff',borderRadius:'13px',padding:'12px',marginBottom:'7px',boxShadow:'0 2px 8px rgba(26,58,92,0.07)'}}>

          {/* Summary totals row */}
          <div style={{display:'flex',alignItems:'stretch',gap:'10px',marginBottom:'11px'}}>
            <div style={{flex:'0 0 auto',display:'flex',flexDirection:'column',justifyContent:'center'}}>
              <div className="db-res-label" style={{fontSize:'0.72rem',color:'#8a9fb0',fontWeight:'800',textTransform:'uppercase',marginBottom:'3px'}}>Started</div>
              <div className="db-res-started" style={{fontSize:'1.3rem',fontWeight:'900',color:'#1a3a5c'}}>{fmt(TOTAL)}</div>
            </div>
            <div style={{flex:1,display:'flex',flexDirection:'column',gap:'6px'}}>
              {/* Nominal total */}
              <div style={{background:'#e0f3f0',borderRadius:'9px',padding:'9px 12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div className="db-res-label" style={{fontSize:'0.72rem',color:'#0e6050',fontWeight:'800',textTransform:'uppercase'}}>💰 Nominal</div>
                <div style={{textAlign:'right'}}>
                  <span className="db-res-pct-big" style={{fontSize:'1.25rem',fontWeight:'900',color:nomGain>=0?'#0e6050':'#b5474a'}}>{nomGain>=0?'+':''}{nomGainPct.toFixed(1)}%</span>
                  <span className="db-res-pct-sub" style={{fontSize:'0.78rem',fontWeight:'700',color:'#5a7d8a',marginLeft:'8px'}}>{fmt(Math.round(nominalFinal))}</span>
                </div>
              </div>
              {/* Real total */}
              <div style={{background:realGain>=0?'#e0f3f0':'#fde8e6',borderRadius:'9px',padding:'9px 12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div className="db-res-label" style={{fontSize:'0.72rem',color:realGain>=0?'#0e6050':'#b5474a',fontWeight:'800',textTransform:'uppercase'}}>📉 Real @7%</div>
                <div style={{textAlign:'right'}}>
                  <span className="db-res-pct-big" style={{fontSize:'1.25rem',fontWeight:'900',color:realGain>=0?'#0e6050':'#b5474a'}}>{realGain>=0?'+':''}{realGainPct.toFixed(1)}%</span>
                  <span className="db-res-pct-sub" style={{fontSize:'0.78rem',fontWeight:'700',color:realGain>=0?'#5a7d8a':'#b5474a',marginLeft:'8px'}}>{fmt(Math.round(realFinal))}</span>
                </div>
              </div>
            </div>
          </div>

          {/* Column headers */}
          <div style={{display:'grid',gridTemplateColumns:'1.5fr 1fr 1fr',gap:'4px',paddingBottom:'8px',borderBottom:'1.5px solid #e0f3f0',marginBottom:'2px'}}>
            <div className="db-res-label" style={{fontSize:'0.68rem',fontWeight:'800',color:'#8a9fb0',textTransform:'uppercase'}}>Instrument</div>
            <div className="db-res-label" style={{fontSize:'0.68rem',fontWeight:'800',color:'#2a9d8f',textTransform:'uppercase',textAlign:'center'}}>💰 Nominal</div>
            <div className="db-res-label" style={{fontSize:'0.68rem',fontWeight:'800',color:'#b5474a',textTransform:'uppercase',textAlign:'center'}}>📉 Real @7%</div>
          </div>

          {/* Per-instrument table rows */}
          {(function(){
            var allocated = INSTR.filter(function(i){ return alloc[i.id] > 0; });
            var maxAbsPct = Math.max.apply(null, allocated.map(function(inst){
              var init = alloc[inst.id];
              var nomFin = portfolio[inst.id] || 0;
              var realFin = nomFin / INFL_FACTOR;
              return Math.max(Math.abs((nomFin-init)/init*100), Math.abs((realFin-init)/init*100));
            }));
            return allocated.map(function(inst) {
              var init = alloc[inst.id] || 0;
              var nomFin = portfolio[inst.id] || 0;
              var realFin = nomFin / INFL_FACTOR;
              var nomIg = nomFin - init;
              var nomIgPct = init > 0 ? (nomIg / init * 100) : 0;
              var realIg = realFin - init;
              var realIgPct = init > 0 ? (realIg / init * 100) : 0;
              var nomPos = nomIg >= 0;
              var realPos = realIg >= 0;
              var scale = maxAbsPct || 50;
              var barWNom = Math.min(100, Math.abs(nomIgPct) / scale * 100);
              var barWReal = Math.min(100, Math.abs(realIgPct) / scale * 100);
              return (
                <div key={inst.id} className="db-res-row" style={{display:'grid',gridTemplateColumns:'1.5fr 1fr 1fr',gap:'4px',padding:'8px 0',borderBottom:'1px solid #edf5f3',alignItems:'center'}}>
                  {/* Name */}
                  <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
                    <span className="db-res-row-icon" style={{fontSize:'1.7rem',flexShrink:0,lineHeight:1}}>{inst.icon}</span>
                    <span className="db-res-row-name" style={{fontSize:'0.88rem',fontWeight:'800',color:'#1a3a5c',lineHeight:1.2}}>{inst.name}</span>
                  </div>
                  {/* Nominal col */}
                  <div style={{textAlign:'center'}}>
                    <div className="db-res-row-pct" style={{fontSize:'1.1rem',fontWeight:'900',color:nomPos?'#0e6050':'#b5474a',lineHeight:1}}>{nomPos?'+':''}{nomIgPct.toFixed(1)}%</div>
                    <div className="db-res-row-bar" style={{height:'5px',borderRadius:'3px',background:'#e0f3f0',overflow:'hidden',margin:'5px 4px 4px'}}>
                      <div style={{height:'100%',width:barWNom+'%',background:nomPos?'#2a9d8f':'#c0575a',borderRadius:'3px'}}></div>
                    </div>
                    <div className="db-res-row-amt" style={{fontSize:'0.68rem',fontWeight:'700',color:'#8a9fb0'}}>{nomPos?'+':'−'}₹{indFmtDB(Math.round(Math.abs(nomIg)))}</div>
                  </div>
                  {/* Real col */}
                  <div style={{textAlign:'center'}}>
                    <div className="db-res-row-pct" style={{fontSize:'1.1rem',fontWeight:'900',color:realPos?'#0e6050':'#b5474a',lineHeight:1}}>{realPos?'+':''}{realIgPct.toFixed(1)}%</div>
                    <div className="db-res-row-bar" style={{height:'5px',borderRadius:'3px',background:'#e0f3f0',overflow:'hidden',margin:'5px 4px 4px'}}>
                      <div style={{height:'100%',width:barWReal+'%',background:realPos?'#2a9d8f':'#c0575a',borderRadius:'3px'}}></div>
                    </div>
                    <div className="db-res-row-amt" style={{fontSize:'0.68rem',fontWeight:'700',color:realPos?'#8a9fb0':'#b5474a'}}>{realPos?'+':'−'}₹{indFmtDB(Math.round(Math.abs(realIg)))}</div>
                  </div>
                </div>
              );
            });
          })()}

          {/* Footnote */}
          <div className="db-res-footnote" style={{marginTop:'8px',fontSize:'0.68rem',color:'#aab8c2',fontWeight:'600',lineHeight:1.5}}>
            📉 Real @7% = what your money is worth in today's rupees (÷{INFL_FACTOR.toFixed(2)})
          </div>
        </div>
        <div style={{background:'#fff',borderRadius:'13px',padding:'9px 10px',marginBottom:'6px',boxShadow:'0 2px 8px rgba(26,58,92,0.07)',borderLeft:'4px solid '+profile.col}}>
          <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'3px'}}>
            <span className="db-res-profile-icon" style={{fontSize:'1.5rem'}}>{profile.icon}</span>
            <div className="db-res-profile-name" style={{fontSize:'0.88rem',fontWeight:'900',color:profile.col}}>{profile.name}</div>
          </div>
          <div className="db-res-profile-desc" style={{fontSize:'0.7rem',color:'#4a5a6a',lineHeight:1.5}}>{profile.desc}</div>
        </div>
        <div style={{background:'linear-gradient(135deg,#e0f3f0,#f7faf9)',borderRadius:'13px',padding:'9px 10px',marginBottom:'7px',borderLeft:'4px solid #2a9d8f'}}>
          <div className="db-res-lesson" style={{fontSize:'0.7rem',color:'#1a3a5c',lineHeight:1.55}}>
            The Big Lesson: Debt instruments are not all equal — interest rates, credit defaults, and inflation attack each one differently. Diversifying across government, bank, and market-linked debt gives you stability and growth.
          </div>
        </div>

        {/* Disclaimer */}
        <div style={{background:'#f7faf9',borderRadius:'13px',padding:'10px 12px',marginBottom:'8px',border:'1px solid #e0f3f0'}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:'8px'}}>
            <span style={{fontSize:'1.1rem',flexShrink:0,marginTop:'1px'}}>ℹ️</span>
            <div>
              <div className="db-res-disc-title" style={{fontSize:'0.72rem',fontWeight:'900',color:'#1a3a5c',marginBottom:'5px'}}>For Educational Purposes Only</div>
              <div className="db-res-disc-text" style={{fontSize:'0.67rem',color:'#5a7d8a',lineHeight:1.65}}>
                The events in this game — including the corporate bond default — are <strong>simulated scenarios</strong> designed to show how different market conditions affect debt portfolios. They do not reflect any specific company or real event.
              </div>
              <div className="db-res-disc-text" style={{fontSize:'0.67rem',color:'#5a7d8a',lineHeight:1.65,marginTop:'6px'}}>
                Corporate bonds, government bonds, FDs, PPF and other debt instruments all have a legitimate place in a well-constructed portfolio. <strong>No instrument should be written off based on a game outcome.</strong> Always consult a qualified financial advisor before making investment decisions.
              </div>
            </div>
          </div>
        </div>

        <button className="db-res-btn" onClick={onReplay} style={{width:'100%',padding:'11px',background:'linear-gradient(135deg,#1a3a5c,#2a5272)',color:'#fff',fontWeight:'800',fontSize:'0.88rem',border:'none',borderRadius:'13px',cursor:'pointer',marginBottom:'6px'}}>
          Play Again with Different Allocation
        </button>
        <button className="db-res-btn" onClick={function(){
          try { window.parent.postMessage({type:'db_done', score:score}, '*'); } catch(ex) {}
          try { window.top.location.href = '/'; } catch(ex) { window.location.href = '/'; }
        }} style={{width:'100%',padding:'8px',background:'transparent',color:'#1a3a5c',fontWeight:'700',fontSize:'0.82rem',border:'2px solid #1a3a5c',borderRadius:'13px',cursor:'pointer',marginBottom:'10px'}}>
          Back to Main Menu
        </button>
      </div>
    </div>
  );
}

function App() {
  var screenState = useState('welcome');
  var screen = screenState[0], setScreen = screenState[1];
  var allocState = useState({ppf:150000, ssy:150000, fd:200000, gbond:200000, cbond:150000, dmf:150000});
  var alloc = allocState[0], setAlloc = allocState[1];
  var roundState = useState(0);
  var round = roundState[0], setRound = roundState[1];
  var portState = useState({});
  var portfolio = portState[0], setPortfolio = portState[1];
  var scoreState = useState(0);
  var score = scoreState[0], setScore = scoreState[1];
  var histState = useState([]);
  var portHistory = histState[0], setPortHistory = histState[1];

  function startSim() {
    var p = {};
    INSTR.forEach(function(inst) { p[inst.id] = alloc[inst.id] || 0; });
    setPortfolio(p);
    setPortHistory([]);
    setRound(1);
    setScreen('event');
  }

  function handleAnswer(isCorrect) {
    if (isCorrect) setScore(function(s) { return s + 25; });
  }

  function nextRound() {
    var ev = EVENTS[round - 1];
    var newP = {};
    INSTR.forEach(function(inst) { newP[inst.id] = (portfolio[inst.id] || 0) * (1 + ev.impacts[inst.id] / 100); });
    var newTotal = INSTR.reduce(function(s, v) { return s + (newP[v.id] || 0); }, 0);
    setPortHistory(function(h) { return h.concat([{round: round, emoji: ev.emoji, total: newTotal}]); });
    setPortfolio(newP);
    if (round < 4) {
      setRound(function(r) { return r + 1; });
    } else {
      setScreen('results');
    }
  }

  function replay() {
    setScreen('welcome');
    setScore(0);
    setAlloc({ppf:150000, ssy:150000, fd:200000, gbond:200000, cbond:150000, dmf:150000});
    setRound(0);
    setPortfolio({});
    setPortHistory([]);
  }

  // Auto-resize iframe to content height on every render.
  // Popups (db-popup-card / db-infl-card) are position:fixed, so they never contribute to
  // document.body.scrollHeight — the iframe was staying frozen at whatever height the screen
  // behind the popup needed, which meant a popup taller than that stale height had nowhere to
  // go but scroll internally, no matter how big its own max-height budget was.
  //
  // getBoundingClientRect() alone isn't enough either: the popup body's own max-height is set
  // in vh units, relative to THIS iframe's current (still-small) viewport — so the rect
  // we'd measure is already clamped to the old height, and the iframe can never grow past that
  // local minimum. Instead, measure body.scrollHeight (the natural, un-clamped content height,
  // which scrollHeight always reports regardless of overflow/max-height) so the FIRST
  // measurement already accounts for full content, then remeasure shortly after so any
  // vh-based CSS that recomputes against the new, taller iframe settles without a scrollbar.
  useEffect(function() {
    function sendH() {
      var h = document.body.scrollHeight;
      var popup = document.querySelector('.db-popup-card, .db-infl-card');
      if (popup) {
        var head = popup.querySelector('.db-popup-head, .db-infl-head');
        var body = popup.querySelector('.db-popup-body, .db-infl-body');
        var foot = popup.querySelector('.db-popup-foot, .db-infl-foot');
        var natural = (head?head.offsetHeight:0) + (body?body.scrollHeight:0) + (foot?foot.offsetHeight:0);
        var r = popup.getBoundingClientRect();
        h = Math.max(h, r.top + Math.max(r.height, natural) + 32);
      }
      try { window.parent.postMessage({type:'db_height', h: h}, '*'); } catch(e) {}
    }
    sendH();
    var t1 = setTimeout(sendH, 120);  // catch late reflows
    var t2 = setTimeout(sendH, 350);  // remeasure once the grown iframe's own vh has settled
    return function() { clearTimeout(t1); clearTimeout(t2); };
  });

  if (screen === 'welcome') return <Welcome onNext={function(){setScreen('allocate');}} />;
  if (screen === 'allocate') return <Allocate alloc={alloc} setAlloc={setAlloc} onNext={startSim} />;
  if (screen === 'event') return <EventScreen key={round} ev={EVENTS[round-1]} round={round} portfolio={portfolio} alloc={alloc} score={score} portHistory={portHistory} onAnswer={handleAnswer} onNext={nextRound} />;
  if (screen === 'results') return <Results portfolio={portfolio} alloc={alloc} score={score} onReplay={replay} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  <\/script>
</body>
</html>`;

})();
window.gameScores=window.gameScores||{};window.addEventListener("load",function(){try{showGame("debtboss");}catch(e){console.error(e);}});
</script>
