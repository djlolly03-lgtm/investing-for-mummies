/* ════════ IPO BONANZA dark terminal system (sibling of ipo-bonanza.html) ════════ */
:root {
  --bg:        #1a2e45;
  --bg-2:      #1e3550;
  --panel:     #243d5c;
  --panel-2:   #2a456a;
  --panel-3:   #304e78;
  --line:      rgba(120, 160, 200, 0.12);
  --line-2:    rgba(120, 160, 200, 0.22);
  --ink:       #d9e6f2;
  --ink-2:     #8da3bf;
  --ink-3:     #5e7593;
  --up:        #00ff95;
  --dn:        #ff3366;
  --amber:     #ffb648;
  --violet:    #b48cff;
  --up-glow:   rgba(0, 255, 149, 0.15);
  --dn-glow:   rgba(255, 51, 102, 0.15);
  --amber-glow: rgba(255, 182, 72, 0.18);
  --gold-ifm:  #c9a84c;
  --teal-ifm:  #2a9d8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Inter',system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(1200px 700px at 20% -10%, rgba(40,80,140,0.18), transparent 60%),
    radial-gradient(900px 600px at 90% 10%, rgba(0,255,149,0.04), transparent 60%),
    var(--bg);
  min-height:100vh;
}
.mono{font-family:'JetBrains Mono',monospace;font-feature-settings:'tnum'}
.up{color:var(--up)} .dn{color:var(--dn)} .amber{color:var(--amber)} .dim{color:var(--ink-3)}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ── terminal tape (host top bar) ── */
.tape{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 20px;
  background:linear-gradient(180deg,#0a1220 0%,#0c1626 100%);border-bottom:1px solid var(--line);font-size:12px}
.tape-l,.tape-r{display:flex;align-items:center;gap:12px;min-width:0}
.logo-dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 30% 30%, #00ff95, #007a48 70%, #003520);
  box-shadow:0 0 12px rgba(0,255,149,0.6), inset 0 0 4px rgba(0,0,0,0.4)}
.brand{font-weight:900;letter-spacing:2.5px;font-size:13px;white-space:nowrap}
.brand-2{color:var(--ink-2);font-weight:600;letter-spacing:2px;font-size:11px;white-space:nowrap}
.tape-sep{width:1px;height:14px;background:var(--line-2)}
.tape-pill{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:4px 9px;border-radius:4px;
  background:rgba(0,255,149,0.10);color:var(--up);border:1px solid rgba(0,255,149,0.30);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tape-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);animation:pulse 1.6s infinite}
.tape-pill.amberp{background:rgba(255,182,72,0.10);color:var(--amber);border-color:rgba(255,182,72,0.30)}
.tape-pill.amberp .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tape-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);letter-spacing:1.5px;font-weight:700;white-space:nowrap}
@keyframes pulse{50%{opacity:0.35}}
@media(max-width:700px){.brand-2,.tape-sep{display:none}}

/* ── stage grammar ── */
.stage{padding:22px 24px 90px;max-width:1200px;margin:0 auto;width:100%}
.stage-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.stage-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--amber)}
.stage-title{font-size:28px;font-weight:800;letter-spacing:-0.4px;color:var(--ink);text-wrap:pretty}
.stage-sub{color:var(--ink-2);font-size:14px;max-width:720px;margin:0 0 22px;line-height:1.5}

/* ── panels ── */
.panel{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border-bottom:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;font-weight:700;color:var(--ink-2)}
.panel-body{padding:16px}
.stat-row{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stat-cell{background:var(--panel-2);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat-cell .l{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);letter-spacing:1.2px;font-weight:700}
.stat-cell .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--ink);text-align:right}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;
  background:linear-gradient(180deg,#00ff95,#00b86a);color:#03110a;border:0;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12.5px;letter-spacing:2px;cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,255,149,0.5), 0 6px 24px rgba(0,255,149,0.25);transition:transform 0.12s, box-shadow 0.12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(0,255,149,0.7), 0 8px 30px rgba(0,255,149,0.35)}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink);border-color:var(--ink-3);transform:none;box-shadow:none}
.btn.amber{background:linear-gradient(180deg,#ffd58c,#f59e0b);color:#1a1100;
  box-shadow:0 0 0 1px rgba(255,182,72,0.5), 0 6px 24px rgba(255,182,72,0.25)}
.btn.danger{background:linear-gradient(180deg,#ff6b8f,#d61f4a);color:#fff;
  box-shadow:0 0 0 1px rgba(255,51,102,0.5), 0 6px 24px rgba(255,51,102,0.25)}
.btn.big{padding:16px 34px;font-size:15px}

/* ── S1 hero (Jio snapshot) ── */
.hero1{max-width:1150px;margin:0 auto;padding:46px 24px 90px;display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:start}
@media(max-width:900px){.hero1{grid-template-columns:1fr}}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:2px;color:var(--up);background:rgba(0,255,149,0.08);border:1px solid rgba(0,255,149,0.3);
  padding:6px 12px;border-radius:4px}
.hero1 h1{font-size:clamp(38px,4.6vw,62px);line-height:1;font-weight:900;letter-spacing:-2px;margin:16px 0 18px;color:var(--ink)}
.accent{background:linear-gradient(90deg,#00ff95,#ffb648);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-lede{font-size:17px;line-height:1.55;color:var(--ink-2);max-width:560px}
.ipo-card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line-2);border-radius:8px;padding:22px;position:relative;overflow:hidden}
.ipo-card::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 200px at 100% 0%, rgba(0,255,149,0.08), transparent);pointer-events:none}
.ipo-logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#00ff95,#00a85f);color:#001a0e;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:0 0 auto}
.ipo-card h3{margin:2px 0;font-size:19px;font-weight:800;letter-spacing:-0.3px}
.sector{color:var(--ink-2);font-size:12.5px;font-weight:600}
.ipo-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:16px}
.ipo-meta>div{background:var(--panel-2);padding:10px 12px}
.ipo-meta .l{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:1.2px;font-weight:700}
.ipo-meta .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--ink);margin-top:3px}
.ipo-window{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:9px 12px;border-radius:4px;
  background:rgba(255,182,72,0.08);border:1px solid rgba(255,182,72,0.25);
  font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700}
.ipo-window .l{color:var(--ink-3);letter-spacing:1.2px}
.ipo-window .r{color:var(--amber);letter-spacing:1px}

/* ── S2 DRHP hunt ── */
.drhp{display:grid;gap:10px}
.drhp-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;background:var(--panel-2);
  border:1px solid var(--line-2);border-radius:6px;transition:all 0.16s}
.drhp-row.live{border-color:rgba(255,182,72,0.55);background:rgba(255,182,72,0.06);box-shadow:0 0 0 1px rgba(255,182,72,0.2), 0 8px 30px rgba(0,0,0,0.25)}
.drhp-row.revealed-bad{background:rgba(255,51,102,0.10);border-color:rgba(255,51,102,0.6)}
.drhp-row.revealed-warn{background:rgba(255,182,72,0.08);border-color:rgba(255,182,72,0.5)}
.drhp-section{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--ink-3);margin-bottom:5px}
.drhp-text{font-size:15px;line-height:1.5;color:var(--ink);font-weight:500}
.drhp-text.big{font-size:clamp(16px,1.6vw,20px)}
.drhp-verdict{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;letter-spacing:1.5px;
  padding:6px 12px;border-radius:4px;margin-top:12px;display:inline-block;animation:slam 0.35s cubic-bezier(.2,1.6,.4,1)}
.drhp-verdict.bad{background:rgba(255,51,102,0.22);color:var(--dn);border:1px solid rgba(255,51,102,0.5)}
.drhp-verdict.miss{background:rgba(255,182,72,0.20);color:var(--amber);border:1px solid rgba(255,182,72,0.5)}
.drhp-verdict.ghost{background:rgba(120,160,200,0.10);color:var(--ink-3);border:1px solid rgba(120,160,200,0.25)}
.drhp-teach{margin-top:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);border-left:2px solid var(--amber);padding-left:12px;animation:fadeup 0.5s ease}
.drhp-ask{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;letter-spacing:2.5px;color:var(--amber);margin-top:12px;animation:pulse 2.2s infinite}
.drhp-done{opacity:0.72}
.drhp-done .drhp-text{font-size:13px}
@keyframes slam{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeup{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── S3 terms / category cards ── */
.terms-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:820px){.terms-grid{grid-template-columns:1fr}}
.cat-panel{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:20px;position:relative;overflow:hidden}
.cat-panel.ret{border-color:rgba(42,157,143,0.55);box-shadow:0 0 0 1px rgba(42,157,143,0.15)}
.cat-panel.hni{border-color:rgba(201,168,76,0.55);box-shadow:0 0 0 1px rgba(201,168,76,0.15)}
.cat-name{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;letter-spacing:2.5px}
.cat-panel.ret .cat-name{color:var(--teal-ifm)}
.cat-panel.hni .cat-name{color:var(--gold-ifm)}
.cat-desc{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:8px}
.cat-rows{margin-top:14px;display:grid;gap:8px}
.cat-rows .r{display:flex;justify-content:space-between;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;
  border-bottom:1px dashed var(--line);padding-bottom:8px}
.cat-rows .r .l{color:var(--ink-3);letter-spacing:1px;font-weight:700}
.cat-rows .r .v{color:var(--ink);font-weight:700;text-align:right}
.terms-closer{margin-top:22px;text-align:center;font-size:clamp(18px,2.2vw,26px);font-weight:800;letter-spacing:-0.3px}
.terms-closer b{color:var(--amber)}

/* ── S4 lobby ── */
.lobby{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
@media(max-width:860px){.lobby{grid-template-columns:1fr}}
.room-code{font-family:'JetBrains Mono',monospace;font-size:clamp(44px,5vw,64px);font-weight:800;letter-spacing:10px;
  color:var(--up);text-shadow:0 0 24px rgba(0,255,149,0.4);text-align:center;line-height:1;margin:6px 0 2px}
.room-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.5px;color:var(--ink-3);font-weight:700;text-align:center}
.qr-big{display:flex;justify-content:center;margin:16px 0 8px}
.qr-big>div{background:#fff;padding:12px;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.4)}
.join-url{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3);word-break:break-all;text-align:center;letter-spacing:0.5px}
.pcount{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:800;color:var(--ink);line-height:1}
.pcount .cap{font-size:13px;color:var(--ink-3);letter-spacing:1.5px;font-weight:700}
.pgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:4px;padding:7px 12px 7px 8px;font-weight:700;font-size:13.5px;animation:popin 0.3s cubic-bezier(.2,1.5,.4,1)}
.pchip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:0.95rem;flex:0 0 auto}
.pchip.won{border-color:rgba(0,255,149,0.6);background:rgba(0,255,149,0.08)}
.pchip.lost{opacity:0.55}
.pchip .shn{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;letter-spacing:0.5px;color:var(--up)}
@keyframes popin{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ── S5 live bidding ── */
.livewrap{max-width:1050px;margin:0 auto;padding:30px 24px 110px}
.lb-row{margin:28px 0;position:relative}
.lb-label{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;letter-spacing:3px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline}
.lb-label .amt{font-family:'JetBrains Mono',monospace;font-size:clamp(18px,2.2vw,26px);font-weight:800;color:var(--ink);letter-spacing:0}
.lb-track{height:clamp(34px,4.6vh,52px);background:rgba(5,8,16,0.55);border:1px solid var(--line-2);border-radius:6px;margin-top:8px;overflow:hidden;position:relative}
.lb-fill{height:100%;width:0%;border-radius:5px;transition:width 0.45s cubic-bezier(.3,1,.4,1);position:relative;min-width:4px}
.lb-fill.teal{background:linear-gradient(90deg,#1f7367,var(--teal-ifm))}
.lb-fill.gold{background:linear-gradient(90deg,#9a7d33,var(--gold-ifm))}
.lb-fill::after{content:'';position:absolute;left:0;right:0;top:0;height:24%;background:rgba(247,250,249,0.10);border-radius:5px}
.lb-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);letter-spacing:1.2px;font-weight:700;margin-top:6px}
.lb-total{text-align:center;margin-top:44px}
.lb-total .l{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:4px;color:var(--ink-3);font-weight:700}
.lb-total .v{font-family:'JetBrains Mono',monospace;font-size:clamp(34px,4.4vw,56px);font-weight:800;color:var(--ink);letter-spacing:-1px;margin-top:8px}
.tick{position:absolute;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;color:var(--up);
  pointer-events:none;animation:tickup 1.3s ease forwards;text-shadow:0 0 12px rgba(0,255,149,0.6);z-index:5}
.tick.goldt{color:var(--amber);text-shadow:0 0 12px rgba(255,182,72,0.6)}
@keyframes tickup{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-54px);opacity:0}}
.live-stats{display:flex;justify-content:center;gap:26px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);letter-spacing:1.5px;font-weight:700}

/* ── S7 subscription reveal ── */
.sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
@media(max-width:760px){.sub-grid{grid-template-columns:1fr}}
.sub-card{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:18px;position:relative;overflow:hidden;animation:slam 0.4s cubic-bezier(.2,1.5,.4,1)}
.sub-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}

<script>

function esc(s){return (s==null?'':''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* Indian digit grouping: last 3, then groups of 2 */
function fmtIN(n){
  n=Math.floor(Math.abs(+n||0));
  let s=String(n);
  if(s.length<=3) return s;
  const last=s.slice(-3);
  const rest=s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',');
  return rest+','+last;
}
function rup(n){return '₹'+fmtIN(n);}
/* ₹82.5 LAKH / ₹1.2 CRORE style captions (caps=true → LAKH/CRORE) */
function fmtLakhCr(rupees,caps){
  rupees=Math.max(0,+rupees||0);
  if(rupees>=1e7){
    const cr=rupees/1e7;
    const s=cr>=100?fmtIN(Math.round(cr)):String(Math.round(cr*100)/100);
    return '₹'+s+(caps?' CRORE':' Crore');
  }
  if(rupees>=1e5){
    const lk=Math.round(rupees/1e5*10)/10;
    return '₹'+lk+(caps?' LAKH':' Lakh');
  }
  return rup(rupees);
}

/* ───────────────────────── save: raw fetch + 6s abort + retry (the 2 Nov 2026 fix) ───────────────────────── */
let _saveTimer=null,_saveBusy=false,_saveDirty=false,_saveFails=0,_otherHostAt=0;
function save(){ state.updatedAt=Date.now(); clearTimeout(_saveTimer); _saveTimer=setTimeout(flushSave,60); }
function saveNow(){ state.updatedAt=Date.now(); clearTimeout(_saveTimer); return flushSave(); }
async function flushSave(){
  _saveDirty=true; if(_saveBusy) return; _saveBusy=true;
  try{
    while(_saveDirty){ _saveDirty=false;
      let ok=false;
      try{
        const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),6000);
        const r=await fetch(SUPABASE_URL+'/rest/v1/games?on_conflict=room_code',{method:'POST',signal:ctl.signal,keepalive:false,
          headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify({room_code:ROOM,state,host_id:MY_ID,updated_at:new Date().toISOString()})}).finally(()=>clearTimeout(tm));
        ok=r.ok; if(!ok) console.warn('save failed — retrying',r.status);
      }catch(e){ console.warn('save failed — retrying',e); }
      if(ok){ _saveFails=0; }
      else { _saveFails++; _saveDirty=true; netBanner(); await new Promise(r=>setTimeout(r,Math.min(4000,400*2**Math.min(_saveFails-1,4)))); }
      netBanner();
    }
  } finally { _saveBusy=false; }
}
function netBanner(){
  if(!isHost) return;
  let b=document.getElementById('netBanner');
  const msg=(_saveFails>=2||navigator.onLine===false)
      ? '⚠️ The phones can’t get this screen right now — retrying… <b>Don’t move on yet.</b>'
      : (Date.now()-_otherHostAt<30000 ? '⚠️ This game is also open as the <b>host on another device</b>. Close it there, or the phones will jump between the two.' : '');

}

/* ───────────────────────── realtime channel ───────────────────────── */
let channel=null, _chRetry=null, _chFails=0;
/* Players reach the host ONLY through this channel, so a dead socket on the
   host = nobody can join or bid. Rebuild it on any failure. */
function joinChannel(){
  clearTimeout(_chRetry);
  const old=channel; channel=null;
  if(old){ try{ db.removeChannel(old); }catch(e){} }
  const ch=db.channel('room:'+ROOM);
  channel=ch;
  ch.on('postgres_changes',{event:'*',schema:'public',table:'games',filter:'room_code=eq.'+ROOM},onRoomChange)
    .on('broadcast',{event:'action'},({payload})=>{ if(isHost) hostHandleAction(payload); })
    .subscribe(status=>{
      if(ch!==channel) return;
      if(status==='SUBSCRIBED'){ _chFails=0; window._lastHeardAt=Date.now(); return; }
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        _chFails++;
        clearTimeout(_chRetry);
        _chRetry=setTimeout(joinChannel,Math.min(8000,700*_chFails));
      }
    });
}
function sendAction(payload){ try{ channel.send({type:'broadcast',event:'action',payload}); }catch(e){} }
function onRoomChange(p){
  const row=p&&p.new, st=row&&row.state;
  /* Host NEVER adopts its own DB echo — in-memory state is the truth.
     The only thing it reads is a foreign host_id (two-devices warning). */
  if(isHost){ if(row&&row.host_id&&row.host_id!==MY_ID){ _otherHostAt=Date.now(); netBanner(); } return; }
  window._lastHeardAt=Date.now();
  if(st){ state=st; renderPlayer(); }
}

/* ───────────────────────── host: fold player actions into state ───────────────────────── */
function hostHandleAction(a){
  if(!a||!a.type) return;
  if(a.type==='join'){
    if(!a.id||!a.name) return;
    const ex=state.players[a.id];
    if(ex){ const nm=(''+a.name).slice(0,16); if(ex.name!==nm){ ex.name=nm; save(); } else { save(); } }
    else{
      const n=Object.keys(state.players).length;
      state.players[a.id]={id:a.id,name:(''+a.name).slice(0,16),av:AV_EMOJI[n%AV_EMOJI.length],color:AV_COLOR[n%AV_COLOR.length],
        joined:Date.now(),cat:null,lots:0,bid:0};
      save();
    }
    if(state.phase==='lobby') renderHost();
    else if(state.phase==='bidding') updateBiddingBars();
    return;
  }
  if(a.type==='bid'){
    if(state.phase!=='bidding') return;                       // closed, or not open yet
    const p=state.players[a.id]; if(!p) return;
    if(p.bid>0) return;                                       // already locked — idempotent
    const cat=(a.cat==='HNI')?'HNI':'RETAIL';
    const lots=Math.floor(+a.lots||0);
    const lim=(cat==='HNI')?CONFIG.HNI:CONFIG.RETAIL;
    if(lots<lim.minLots||lots>lim.maxLots) return;            // category limits enforced at submit (host side)
    const amt=lots*CONFIG.IPO.lotCost;
    if(amt>CONFIG.PLAYER_CASH) return;
    p.cat=cat; p.lots=lots; p.bid=amt; p.bidTs=Date.now();
    if(cat==='HNI') state.hniTotal+=amt; else state.retailTotal+=amt;
    state.bidsCount=(state.bidsCount||0)+1;
    save();
    biddingTick(cat,amt);
    updateBiddingBars();
    return;
  }
}
function recomputeTotals(){
  let r=0,h=0,c=0;
  for(const p of Object.values(state.players||{})){
    if(p.bid>0){ c++; if(p.cat==='HNI') h+=p.bid; else r+=p.bid; }
  }
  state.retailTotal=r; state.hniTotal=h; state.bidsCount=c;
}

/* ───────────────────────── allotment math ─────────────────────────
   Retail  = lottery: exactly round(0.37 × applicants) winners (min 1 if any),
             each winner gets 1 lot (12 shares) regardless of lots applied.
   HNI     = no lottery: shares = floor(bid ÷ 14 ÷ 1119), ≈7% of bid converts.
   Listing = shares × ₹239 gain per share.                                   */
function runAllotment(){
  const ps=Object.values(state.players||{});
  const retail=ps.filter(p=>p.cat==='RETAIL'&&p.bid>0);
  const hni=ps.filter(p=>p.cat==='HNI'&&p.bid>0);
  const order=retail.slice();
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; }
  const winN=retail.length?Math.max(1,Math.round(CONFIG.IPO.retailWinPct*retail.length)):0;
  order.forEach((p,i)=>{
    p.win=i<winN;
    p.shares=p.win?CONFIG.IPO.lotShares:0;
    p.cost=p.shares*CONFIG.IPO.issuePrice;
    p.refund=p.bid-p.cost;
  });
  hni.forEach(p=>{
    p.shares=Math.floor(p.bid/CONFIG.IPO.hniDivisor/CONFIG.IPO.issuePrice);
    p.win=p.shares>0;
    p.cost=p.shares*CONFIG.IPO.issuePrice;
    p.refund=p.bid-p.cost;
  });
  ps.forEach(p=>{
    if(!(p.bid>0)){ p.win=null; p.shares=0; p.cost=0; p.refund=0; }
    p.gain=(p.shares||0)*CONFIG.IPO.gainPerShare;
  });
  state.allotment={retailApplicants:retail.length,retailWinners:winN,hniApplicants:hni.length,ts:Date.now()};
}

/* ═══════════════════════════════════════════════════════════════════
   THE DOT MOMENT — adapted verbatim from ipo-frenzy-dev/dot-v3-zoomout.html
   Parameterized with the LIVE class totals; national side untouched.
   DotMoment.init({retailTotal, hniTotal, onDone}) → {advance, destroy}
   Scenes: A (frozen live bars) → COLLAPSE → B (the dot) → FLOOD → onDone
   ═══════════════════════════════════════════════════════════════════ */
const DotMoment=(function(){
  const GOLD='#c9a84c', TEAL='#2a9d8f', MINT='#bde9e4', CREAM='#f7faf9';

  /* national-side constants — DO NOT TOUCH (fixed real data) */
  const TOTAL_CR   = 490414;   // ₹4,90,414 Crore of national bids
  const CR_PER_CELL= 100;      // each grid cell = ₹100 Crore
  const CELL_TOTAL = 4904;     // honest count: 490414 / 100 ≈ 4904 cells

  const COLLAPSE_DUR = 2.2;    // s
  const FLOOD_DUR    = 4.6;    // s (counter easing window)
  const T_RING  = 5.3;         // gold ring + "Your classroom"
  const T_MAG   = 5.9;         // magnification note
  const T_CLOSE = 6.4;         // closing line
  const T_INPUT = 6.6;         // advance allowed → onDone gate
  const T_HINTC = 7.3;         // hint in scene C

  const mount=document.getElementById('dmMount');
  const cv=document.getElementById('dmCv');
  const ctx=cv.getContext('2d');
  let W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2.5);
    W=mount.clientWidth||window.innerWidth; H=mount.clientHeight||window.innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    if(opts) setMagnote();
  }
  try{ new ResizeObserver(resize).observe(mount); }catch(e){ window.addEventListener('resize',resize); }

  const elCapB=document.getElementById('dmCapB');
  const elCount=document.getElementById('dmCounter');
  const elCnum=document.getElementById('dmCnum');
  const elMag=document.getElementById('dmMag');
  const elClose=document.getElementById('dmClose');
  const elHint=document.getElementById('dmHint');

  const clamp01=v=>v<0?0:(v>1?1:v);
  const lerp=(a,b,u)=>a+(b-a)*u;
  const easeInCubic=u=>u*u*u;
  const easeOutCubic=u=>1-Math.pow(1-u,3);
  const easeInOutCubic=u=>u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  function mulberry32(a){
    return function(){
      a|=0; a=a+0x6D2B79F5|0;
      let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function rr(c,x,y,w,h,r){
    r=Math.min(r,h/2,w/2);
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  /* flood cells: square spiral out from centre; (0,0) left empty — the class dot lives there */
  const BUCKETS=[
    {c:'rgba(31,110,100,0.80)', w:22},
    {c:'rgba(42,157,143,0.85)', w:26},
    {c:'rgba(42,157,143,0.52)', w:16},
    {c:'rgba(100,188,174,0.85)',w:14},
    {c:'rgba(189,233,228,0.85)',w:9 },
    {c:'rgba(189,233,228,0.48)',w:7 },
    {c:'rgba(247,250,249,0.92)',w:4 },
    {c:'rgba(26,58,92,0.9)',    w:2 },
  ];
  const CELLS=[];
  const BL=BUCKETS.map(()=>[]);
  const TW=[];
  (function buildCells(){
    const rnd=mulberry32(20261108);          // fixed seed — deterministic city
    const wsum=BUCKETS.reduce((a,b)=>a+b.w,0);
    function pickBucket(){
      let r=rnd()*wsum;
      for(let b=0;b<BUCKETS.length;b++){ r-=BUCKETS[b].w; if(r<=0) return b; }
      return 0;
    }
    let ring=1;
    while(CELLS.length<CELL_TOTAL){
      const r=ring, pts=[];
      for(let x=-r;x<=r;x++){ pts.push([x,-r]); pts.push([x,r]); }
      for(let y=-r+1;y<=r-1;y++){ pts.push([-r,y]); pts.push([r,y]); }
      for(let i=pts.length-1;i>0;i--){
        const j=(rnd()*(i+1))|0;
        const tmp=pts[i]; pts[i]=pts[j]; pts[j]=tmp;
      }
      for(const p of pts){
        if(CELLS.length>=CELL_TOTAL) break;
        const i=CELLS.length;
        CELLS.push({gx:p[0],gy:p[1],ring:r});
        BL[pickBucket()].push({i,gx:p[0],gy:p[1]});
        if(i%17===0) TW.push({i,gx:p[0],gy:p[1],ph:rnd()*Math.PI*2});
      }
      ring++;
    }
  })();
  function ringForCount(c){ return Math.ceil((Math.sqrt(c+1)-1)/2); }

  const MARKER_DEFS=[
    {th:1000,   label:'₹1,000 Cr'},
    {th:50000,  label:'₹50,000 Cr'},
    {th:200000, label:'₹2,00,000 Cr'},
  ];

  /* module state */
  let opts=null, running=false, raf=0;
  const S={scene:'A',t0:0,snap:null,trail:[],markers:[],markerIdx:0,logS:Math.log(110),frontier:0,lastNum:'',prev:0};

  function classTotal(){ return (opts?(opts.retailTotal+opts.hniTotal):0); }

  function setScene(s){
    S.scene=s;
    S.t0=performance.now();
    if(s==='COLLAPSE') S.trail.length=0;
    if(s==='FLOOD'){ S.markers.length=0; S.markerIdx=0; S.logS=Math.log(110); S.frontier=0; S.lastNum=''; }
  }
  function clearOverlays(){
    elCapB.classList.remove('show','dim');
    elCount.classList.remove('show');
    elMag.classList.remove('show');
    elClose.classList.remove('show');
    elHint.classList.remove('show');
  }
  function setMagnote(){
    const ct=classTotal();
    if(ct<=0){ elMag.textContent=''; return; }
    const minD=Math.min(W,H)||1000;
    const finalScale=Math.min(110,(minD*0.42)/37);          // frontier settles at ring ~35
    const trueCells=ct/1e9;                                 // one cell = ₹100 Cr = ₹1e9
    const trueArea=Math.max(trueCells*finalScale*finalScale,1e-9);
    const drawnArea=Math.PI*22*22;                          // ring settles at radius 22px
    let f=drawnArea/trueArea;
    if(f<2){ elMag.textContent='(your dot is drawn to scale — this room really bid that much)'; return; }
    const mag=Math.pow(10,Math.floor(Math.log10(f)));
    f=Math.round(f/mag)*mag;
    elMag.textContent='(your dot is magnified ~'+fmtIN(f)+'× so you can still see it)';
  }

  function advance(){
    if(!running) return;
    const t=(performance.now()-S.t0)/1000;
    if(S.scene==='A'){ S.snap=captureBars(); setScene('COLLAPSE'); }
    else if(S.scene==='B'){ setScene('FLOOD'); }
    else if(S.scene==='FLOOD'&&t>T_INPUT){ if(opts&&opts.onDone) opts.onDone(); }
    /* COLLAPSE and the flood animation itself ignore input */
  }

  /* scene A: frozen bidding screen — LIVE totals, bars normalised against the max */
  function barLayout(){
    const bw=Math.min(W*0.60,940);
    const bh=Math.max(32,Math.min(52,H*0.048));
    const x=(W-bw)/2;
    const cy=H*0.47;
    const gap=bh*2.4;
    const rT=opts?opts.retailTotal:0, hT=opts?opts.hniTotal:0;
    const maxT=Math.max(rT,hT,1);
    const wR=Math.max(bw*0.02,bw*(rT/maxT));
    const wH=Math.max(bw*0.02,bw*(hT/maxT));
    return {
      bw,bh,x,cy,
      retail:{x,y:cy-gap,w:wR,h:bh},
      hni:{x,y:cy+gap-bh,w:wH,h:bh},
    };
  }
  function captureBars(){
    const L=barLayout();
    return {retail:{...L.retail},hni:{...L.hni}};
  }

  function drawBG(darken){
    const g=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.75);
    g.addColorStop(0,'#0a1626');
    g.addColorStop(1,'#04070d');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    if(darken>0){
      ctx.fillStyle='rgba(2,4,8,'+(darken*0.72)+')';
      ctx.fillRect(0,0,W,H);
    }
  }

  function drawBarFill(r,kind){
    let g;
    if(kind==='retail'){
      g=ctx.createLinearGradient(r.x,0,r.x+r.w,0);
      g.addColorStop(0,'#1f7367');
      g.addColorStop(1,TEAL);
    }else{
      g=ctx.createLinearGradient(r.x,0,r.x+r.w,0);
      g.addColorStop(0,'#9a7d33');
      g.addColorStop(1,GOLD);
    }
    ctx.fillStyle=g;
    rr(ctx,r.x,r.y,r.w,r.h,6);
    ctx.fill();
    ctx.fillStyle='rgba(247,250,249,0.08)';
    rr(ctx,r.x,r.y,r.w,Math.max(3,r.h*0.22),6);
    ctx.fill();
  }

  function drawSceneAText(L,alpha){
    if(alpha<=0) return;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.textBaseline='alphabetic';

    ctx.textAlign='left';
    ctx.letterSpacing='0.28em';
    ctx.font='800 '+Math.max(13,Math.min(17,W*0.009))+'px Nunito';
    ctx.fillStyle=MINT;
    ctx.globalAlpha=alpha*0.8;
    ctx.fillText('RETAIL',L.retail.x,L.retail.y-13);
    ctx.fillText('HNI',L.hni.x,L.hni.y-13);
    ctx.globalAlpha=alpha;
    ctx.letterSpacing='0.02em';

    const amtF='700 '+Math.max(17,Math.min(24,W*0.0125))+'px Nunito';
    ctx.font=amtF;
    const amount=(bar,txt)=>{
      const mw=ctx.measureText(txt).width;
      if(bar.x+bar.w+16+mw<=W-14){
        ctx.textAlign='left';
        ctx.fillStyle=CREAM;
        ctx.fillText(txt,bar.x+bar.w+16,bar.y+bar.h*0.68);
      }else{
        ctx.textAlign='right';
        ctx.fillStyle='rgba(4,7,13,0.82)';
        ctx.fillText(txt,bar.x+bar.w-14,bar.y+bar.h*0.68);
      }
    };
    amount(L.retail,'₹'+fmtIN(opts.retailTotal));
    amount(L.hni,'₹'+fmtIN(opts.hniTotal));
    ctx.textAlign='left';

    ctx.textAlign='center';
    ctx.letterSpacing='0.34em';
    ctx.font='700 '+Math.max(11,Math.min(14,W*0.0075))+'px Nunito';
    ctx.fillStyle=MINT;
    ctx.globalAlpha=alpha*0.65;
    ctx.fillText('TOTAL',W/2,L.hni.y+L.hni.h+58);
    ctx.globalAlpha=alpha;
    ctx.letterSpacing='0.04em';
    ctx.font='800 '+Math.max(24,Math.min(34,W*0.018))+'px Nunito';
    ctx.fillStyle=CREAM;
    ctx.fillText('₹'+fmtIN(classTotal()),W/2,L.hni.y+L.hni.h+98);

    /* IPO CLOSED stamp */
    const sx=L.x+L.bw-8, sy=L.retail.y-86;
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(-0.12);
    ctx.globalAlpha=alpha*0.9;
    ctx.strokeStyle=GOLD;
    ctx.lineWidth=2;
    const stw=176,sth=46;
    rr(ctx,-stw,-sth/2,stw,sth,5); ctx.stroke();
    ctx.lineWidth=1;
    ctx.globalAlpha=alpha*0.45;
    rr(ctx,-stw+5,-sth/2+5,stw-10,sth-10,3); ctx.stroke();
    ctx.globalAlpha=alpha*0.95;
    ctx.fillStyle=GOLD;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.letterSpacing='0.3em';
    ctx.font='900 17px Nunito';
    ctx.fillText('IPO CLOSED',-stw/2+3,1);
    ctx.restore();

    ctx.restore();
    ctx.letterSpacing='0px';
  }

  function drawSceneA(){
    drawBG(0);
    const L=barLayout();
    drawBarFill(L.retail,'retail');
    drawBarFill(L.hni,'hni');
    drawSceneAText(L,1);
  }

  /* collapse transition */
  function lerpRect(a,b,u){
    return {x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),w:lerp(a.w,b.w,u),h:lerp(a.h,b.h,u)};
  }
  function collapseRect(start,slabDY,p){
    const cx=W/2,cy=H/2;
    const slab={x:cx-95,y:cy+slabDY,w:190,h:22};
    const merge={x:cx-44,y:cy-15,w:88,h:30};
    const dot={x:cx-5,y:cy-5,w:10,h:10};
    if(p<0.52){
      return lerpRect(start,slab,easeInCubic(p/0.52));
    }
    if(p<0.80){
      const u=easeInOutCubic((p-0.52)/0.28);
      const r=lerpRect(slab,merge,u);
      const sq=Math.sin(u*Math.PI);           // squash as the slabs slam together
      r.w*=1+0.10*sq; r.h*=1-0.16*sq;
      r.x-=(r.w-(r.w/(1+0.10*sq)))/2;
      return r;
    }
    return lerpRect(merge,dot,easeInCubic((p-0.80)/0.20));
  }

  function drawCollapse(t){
    const p=clamp01(t/COLLAPSE_DUR);
    drawBG(p);
    const L=barLayout();
    drawSceneAText(L,Math.max(0,1-p*4));

    const r1=collapseRect(S.snap.retail,-30,p);
    const r2=collapseRect(S.snap.hni,8,p);
    S.trail.push({a:r1,b:r2});
    if(S.trail.length>14) S.trail.shift();

    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let k=0;k<S.trail.length;k++){
      const al=((k+1)/S.trail.length)*0.055;
      const s=S.trail[k];
      ctx.globalAlpha=al;
      ctx.fillStyle=TEAL; rr(ctx,s.a.x,s.a.y,s.a.w,s.a.h,6); ctx.fill();
      ctx.fillStyle=GOLD; rr(ctx,s.b.x,s.b.y,s.b.w,s.b.h,6); ctx.fill();
    }
    ctx.restore();

    const goldify=clamp01((p-0.6)/0.25);
    ctx.save();
    if(goldify<1){
      ctx.globalAlpha=1-goldify;
      drawBarFill(r1,'retail');
      ctx.globalAlpha=1;
    }
    if(goldify>0){
      ctx.globalAlpha=goldify;
      drawBarFill(r1,'hni');
      ctx.globalAlpha=1;
    }
    drawBarFill(r2,'hni');
    ctx.restore();

    if(p>0.86){
      const f=(p-0.86)/0.14;
      const rad=26+150*easeOutCubic(f);
      const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,rad);
      g.addColorStop(0,'rgba(255,233,176,'+(0.55*f)+')');
      g.addColorStop(0.4,'rgba(201,168,76,'+(0.30*f)+')');
      g.addColorStop(1,'rgba(201,168,76,0)');
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(W/2,H/2,rad,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    if(t>=COLLAPSE_DUR) setScene('B');
  }

  /* the dot */
  function drawDot(cx,cy,now,coreR,glowR,glowA){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);
    g.addColorStop(0,'rgba(255,233,176,'+(0.75*glowA)+')');
    g.addColorStop(0.35,'rgba(201,168,76,'+(0.35*glowA)+')');
    g.addColorStop(1,'rgba(201,168,76,0)');
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2); ctx.fill();
    ctx.restore();
    const c=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
    c.addColorStop(0,'#ffeecb');
    c.addColorStop(1,GOLD);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill();
  }

  function drawSceneB(t,now){
    const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
    g.addColorStop(0,'#060b14');
    g.addColorStop(1,'#02040a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    if(t<0.7){
      const f=1-t/0.7;
      const rad=170*(1-f*0.4);
      const bg2=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,rad);
      bg2.addColorStop(0,'rgba(201,168,76,'+(0.22*f)+')');
      bg2.addColorStop(1,'rgba(201,168,76,0)');
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=bg2;
      ctx.beginPath(); ctx.arc(W/2,H/2,rad,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    const ph=Math.sin(now/1000*Math.PI);        // 2 s cycle
    const core=5.5*(1+0.10*ph);
    const glow=34*(1+0.16*ph);
    drawDot(W/2,H/2,now,core,glow,0.95);
  }

  /* scene C: the flood (camera pull-back) */
  function drawFlood(t,now,dt){
    const p=clamp01(t/FLOOD_DUR);
    const e=1-Math.pow(1-p,4);                 // fast start, agonizing finish
    const v=TOTAL_CR*e;
    const spawn=Math.min(CELL_TOTAL,Math.floor(v/CR_PER_CELL));
    if(spawn>0) S.frontier=Math.max(S.frontier,CELLS[spawn-1].ring);

    /* camera: fit the frontier, smoothed in log space */
    const minD=Math.min(W,H);
    const target=Math.min(110,(minD*0.42)/(S.frontier+2));
    S.logS+=(Math.log(target)-S.logS)*Math.min(1,dt*2.4);
    const scale=Math.exp(S.logS);
    const cx=W/2,cy=H/2;

    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
    g.addColorStop(0,'#050a12');
    g.addColorStop(1,'#02040a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    if(spawn>0){
      const ext=(S.frontier+1.5)*scale;
      const hz=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(40,ext));
      hz.addColorStop(0,'rgba(42,157,143,0.10)');
      hz.addColorStop(0.7,'rgba(42,157,143,0.05)');
      hz.addColorStop(1,'rgba(42,157,143,0)');
      ctx.fillStyle=hz;
      ctx.beginPath(); ctx.arc(cx,cy,Math.max(40,ext),0,Math.PI*2); ctx.fill();
    }

    if(spawn>0&&scale>5){
      const R=S.frontier+1;
      const n=Math.max(1,Math.ceil((2*R+1)/90));
      ctx.strokeStyle='rgba(42,157,143,'+Math.min(0.07,scale*0.004)+')';
      ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=-R;i<=R+1;i+=n){
        const o=(i-0.5)*scale;
        ctx.moveTo(cx+o,cy-(R+0.5)*scale); ctx.lineTo(cx+o,cy+(R+0.5)*scale);
        ctx.moveTo(cx-(R+0.5)*scale,cy+o); ctx.lineTo(cx+(R+0.5)*scale,cy+o);
      }
      ctx.stroke();
    }

    /* cells — batched by colour bucket (perf-critical: do not refactor) */
    const cs=scale*0.86,cs2=cs/2;
    for(let b=0;b<BL.length;b++){
      const arr=BL[b];
      ctx.fillStyle=BUCKETS[b].c;
      for(let k=0;k<arr.length;k++){
        const c=arr[k];
        if(c.i>=spawn) continue;
        ctx.fillRect(cx+c.gx*scale-cs2,cy+c.gy*scale-cs2,cs,cs);
      }
    }

    /* pop: the newest cells flash bright for a beat */
    const POP=420;
    ctx.fillStyle=CREAM;
    for(let i=Math.max(0,spawn-POP);i<spawn;i++){
      const c=CELLS[i];
      ctx.globalAlpha=(1-(spawn-1-i)/POP)*0.5;
      ctx.fillRect(cx+c.gx*scale-cs2,cy+c.gy*scale-cs2,cs,cs);
    }
    ctx.globalAlpha=1;

    /* twinkle layer */
    ctx.fillStyle=MINT;
    for(let k=0;k<TW.length;k++){
      const c=TW[k];
      if(c.i>=spawn) continue;
      ctx.globalAlpha=0.14+0.14*Math.sin(now/700+c.ph);
      ctx.fillRect(cx+c.gx*scale-cs2,cy+c.gy*scale-cs2,cs,cs);
    }
    ctx.globalAlpha=1;

    /* magnitude markers flying past */
    while(S.markerIdx<MARKER_DEFS.length&&v>=MARKER_DEFS[S.markerIdx].th){
      const d=MARKER_DEFS[S.markerIdx];
      S.markers.push({label:d.label,r:ringForCount(d.th/CR_PER_CELL)+0.5,t0:now});
      S.markerIdx++;
    }
    ctx.lineWidth=1;
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.font='600 13px Nunito';
    for(const m of S.markers){
      const age=(now-m.t0)/1000;
      const a=Math.max(0,0.5*(1-age/2.2));
      if(a<=0) continue;
      const half=m.r*scale;
      ctx.strokeStyle='rgba(189,233,228,'+a+')';
      ctx.strokeRect(cx-half,cy-half,half*2,half*2);
      ctx.save();
      ctx.shadowColor='rgba(3,6,10,0.9)';
      ctx.shadowBlur=8;
      ctx.fillStyle='rgba(189,233,228,'+Math.min(0.85,a*1.6)+')';
      ctx.fillText(m.label,cx,cy-half-8);
      ctx.restore();
    }

    /* the class dot — fixed point, fixed size, at centre */
    ctx.fillStyle='rgba(3,6,10,0.55)';
    ctx.beginPath(); ctx.arc(cx,cy,13,0,Math.PI*2); ctx.fill();
    const ph2=Math.sin(now/1000*Math.PI);
    drawDot(cx,cy,now,4.5*(1+0.05*ph2),18,0.9);

    /* after settle: gold ring + pointer + "Your classroom" */
    const ra=clamp01((t-T_RING)/0.9);
    if(ra>0){
      const rad=13+9*easeOutCubic(ra);
      ctx.strokeStyle='rgba(201,168,76,'+(0.9*ra)+')';
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
      const k=Math.SQRT1_2;
      ctx.strokeStyle='rgba(201,168,76,'+(0.6*ra)+')';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(cx+rad*k,cy-rad*k);
      ctx.lineTo(cx+84,cy-62);
      ctx.stroke();
      ctx.save();
      ctx.shadowColor='rgba(3,6,10,0.95)';
      ctx.shadowBlur=10;
      ctx.fillStyle='rgba(247,250,249,'+(0.95*ra)+')';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.font='700 15px Nunito';
      ctx.fillText('Your classroom',cx+92,cy-64);
      ctx.fillText('Your classroom',cx+92,cy-64);   /* double draw strengthens the glyph — deliberate */
      ctx.restore();
    }

    /* counter (dirty-checked DOM write) */
    const num='₹'+fmtIN(v);
    if(num!==S.lastNum){ elCnum.textContent=num; S.lastNum=num; }
  }

  /* DOM text choreography (driven from the loop) */
  function cls(el,name,on){ el.classList.toggle(name,on); }
  function syncDOM(t){
    cls(elCapB,'show',S.scene==='B'&&t>0.45);
    cls(elCapB,'dim',S.scene==='B'&&t>4.4);
    cls(elCount,'show',S.scene==='FLOOD');
    cls(elMag,'show',S.scene==='FLOOD'&&t>T_MAG);
    cls(elClose,'show',S.scene==='FLOOD'&&t>T_CLOSE);
    const hintOn=(S.scene==='A'&&t>1.2)
              ||(S.scene==='B'&&t>5.0)
              ||(S.scene==='FLOOD'&&t>T_HINTC);
    cls(elHint,'show',hintOn);
  }

  /* main loop */
  function frame(now){
    if(!running) return;
    const dt=Math.min(0.05,(now-S.prev)/1000);
    S.prev=now;
    const t=(now-S.t0)/1000;

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    if(S.scene==='A') drawSceneA();
    else if(S.scene==='COLLAPSE') drawCollapse(t);
    else if(S.scene==='B') drawSceneB(t,now);
    else if(S.scene==='FLOOD') drawFlood(t,now,dt);

    syncDOM((now-S.t0)/1000);      // re-read: COLLAPSE may have become B this frame
    raf=requestAnimationFrame(frame);
  }

  function init(o){
    opts={retailTotal:Math.max(0,+o.retailTotal||0),hniTotal:Math.max(0,+o.hniTotal||0),onDone:o.onDone||null};
    mount.classList.remove('hide');
    resize();
    try{ document.fonts.load('900 17px Nunito'); document.fonts.load('700 15px Nunito'); }catch(e){}
    const ct=classTotal();
    elCapB.textContent=fmtLakhCr(ct,true)+' — everything this room applied';
    elClose.textContent=fmtLakhCr(ct,false)+' of ₹4,90,414 Crore';
    elCnum.textContent='₹0';
    setMagnote();
    clearOverlays();
    S.scene='A'; S.snap=null; S.trail.length=0; S.markers.length=0; S.markerIdx=0;
    S.logS=Math.log(110); S.frontier=0; S.lastNum='';
    S.t0=performance.now(); S.prev=performance.now();
    running=true;
    raf=requestAnimationFrame(frame);
    return {advance:advance,destroy:destroy};
  }
  function destroy(){
    running=false;
    cancelAnimationFrame(raf);
    clearOverlays();
    mount.classList.add('hide');
    opts=null;
  }

  return {init,destroy,advance};
})();

function playerUrl(){ return location.origin+location.pathname+'?role=player&room='+ROOM; }
function makeQR(el,size){
  el.innerHTML=''; el.style.position='relative';
  try{
    new QRCode(el,{text:playerUrl(),width:size,height:size,colorDark:'#1a3a5c',colorLight:'#ffffff',
      correctLevel:(window.QRCode&&QRCode.CorrectLevel?QRCode.CorrectLevel.H:2)});
    const s=Math.round(size*0.22), pad=Math.max(3,Math.round(size*0.014));
    const logo=document.createElement('img'); logo.src=LOGO;
    logo.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:'+s+'px;height:'+s+'px;border-radius:50%;background:#fff;padding:'+pad+'px;box-shadow:0 0 0 '+pad+'px #fff';
    logo.onerror=function(){this.style.display='none';};
    el.appendChild(logo);
  }catch(e){ el.innerHTML='<div style="font-weight:800;font-size:12px;color:#1a3a5c;word-break:break-all">'+esc(playerUrl())+'</div>'; }
}
function openQRFull(){
  let o=document.getElementById('qrOverlay');
  if(o){ o.remove(); return; }
  o=document.createElement('div'); o.id='qrOverlay';
  o.innerHTML='<div class="ql">SCAN TO JOIN · OR GO TO THE URL AND ENTER THE CODE</div><div class="qc" id="qrFullBox"></div><div class="code">'+esc(ROOM)+'</div>';
  o.onclick=()=>o.remove();
  document.body.appendChild(o);
  makeQR(document.getElementById('qrFullBox'),Math.round(Math.min(innerWidth,innerHeight)*0.6));
}

function startAllotment(){
  if(state.phase!=='allot'||state.allotStep!=='idle') return;
  pushHistory();
  state.allotStep='suspense';
  saveNow(); renderHost();
  const names=Object.values(state.players||{}).filter(p=>p.bid>0).map(p=>p.name);
  clearInterval(_suspenseSpin);
  _suspenseSpin=setInterval(()=>{
    const el=document.getElementById('lotPan');
    if(el&&names.length) el.textContent=names[Math.floor(Math.random()*names.length)];
  },90);
  clearTimeout(_suspenseTimer);
  _suspenseTimer=setTimeout(()=>{
    clearInterval(_suspenseSpin);
    if(state.phase!=='allot'||state.allotStep!=='suspense') return;
    runAllotment();
    state.allotStep='board';
    saveNow(); renderHost();
  },3000);
}

function vsExamples(){
  const I=CONFIG.IPO;
  const ps=Object.values(state.players||{});
  const rw=ps.filter(p=>p.cat==='RETAIL'&&p.win).sort((a,b)=>a.bid-b.bid)[0];
  const hb=ps.filter(p=>p.cat==='HNI'&&p.bid>0).sort((a,b)=>b.bid-a.bid)[0];
  const canonH={gain:Math.floor(CONFIG.HNI.maxLots*I.lotCost/I.hniDivisor/I.issuePrice)*I.gainPerShare,blocked:CONFIG.HNI.maxLots*I.lotCost};
  const r=rw?{name:rw.name,gain:rw.gain,blocked:rw.bid}:{name:null,gain:I.lotShares*I.gainPerShare,blocked:I.lotCost};
  const h=hb?{name:hb.name,gain:hb.gain,blocked:hb.bid}:{name:null,gain:canonH.gain,blocked:canonH.blocked};
  r.pct=r.blocked?r.gain/r.blocked*100:0;
  h.pct=h.blocked?h.gain/h.blocked*100:0;
  return {r,h};
}

/* ── host render dispatch ── */
function renderHost(){
  if(!isHost) return;
  clearInterval(_suspenseSpin);
  renderTape();
  const m=document.getElementById('hostMain');
  const ph=state.phase;
  if(ph==='slides'){ m.innerHTML=state.slide===1?hostS1():(state.slide===2?hostS2():hostS3()); }
  else if(ph==='lobby'){ m.innerHTML=hostS4(); makeQR(document.getElementById('lobbyQR'),240); }
  else if(ph==='bidding'){ m.innerHTML=hostS5(); updateBiddingBars();
    const b=document.getElementById('btnCloseIPO'); if(b) b.onclick=closeIPO; }
  else if(ph==='dot'){ m.innerHTML=''; startDot(); }
  else if(ph==='subs'){ m.innerHTML=hostS7(); }
  else if(ph==='allot'){ m.innerHTML=hostS8();
    const b=document.getElementById('btnRunAllot'); if(b) b.onclick=startAllotment; }
  else if(ph==='listing'){ m.innerHTML=hostS9(); }
  else if(ph==='kamath'){ m.innerHTML=hostS10(); }
  else if(ph==='lesson'){ m.innerHTML=hostS11();
    const b=document.getElementById('btnNewGame'); if(b) b.onclick=hostReset; }
  if(ph!=='dot'&&dmHandle){ DotMoment.destroy(); dmHandle=null; }
  renderChrome();
}

/* ── advance / back / reset ── */
function pushHistory(){
  try{ _history.push(JSON.stringify(state)); if(_history.length>40) _history.shift(); }catch(e){}
}
function hostAdvance(){
  if(!isHost) return;
  const st=state;
  if(st.phase==='bidding') return;                     // CLOSE IPO button only — no accidental close
  if(st.phase==='dot'){ if(dmHandle) DotMoment.advance(); return; }
  if(st.phase==='allot'){
    if(st.allotStep==='idle'){ startAllotment(); return; }
    if(st.allotStep==='suspense') return;
  }
  if(st.phase==='lesson') return;                      // only NEW GAME from here
  if(st.phase==='lobby'&&playerCount()===0){
    if(!confirm('No players have joined yet.\n\nOpen bidding anyway?')) return;
  }
  pushHistory();
  if(st.phase==='slides'){
    if(st.slide===1){ st.slide=2; st.flagIdx=0; st.flagOpen=false; }
    else if(st.slide===2){
      if(!st.flagOpen) st.flagOpen=true;
      else if(st.flagIdx<FLAGS.length-1){ st.flagIdx++; st.flagOpen=false; }
      else st.slide=3;
    }
    else { st.phase='lobby'; }
  }
  else if(st.phase==='lobby'){ st.phase='bidding'; }
  else if(st.phase==='subs'){
    if(st.subsStep<4) st.subsStep++;
    else { st.phase='allot'; st.allotStep='idle'; }
  }
  else if(st.phase==='allot'){ st.phase='listing'; st.listStep=0; }
  else if(st.phase==='listing'){
    if(st.listStep<2) st.listStep++;
    else st.phase='kamath';
  }
  else if(st.phase==='kamath'){ st.phase='lesson'; }
  saveNow(); renderHost();
}
function hostBack(){
  if(!isHost||!_history.length) return;
  clearTimeout(_suspenseTimer); clearInterval(_suspenseSpin);
  if(dmHandle){ DotMoment.destroy(); dmHandle=null; }
  try{ state=JSON.parse(_history.pop()); }catch(e){ return; }
  state.hostId=MY_ID;
  saveNow(); renderHost();
}
function hostReset(){
  if(!confirm('Start a brand-new game?\n\nThis clears ALL players, bids and results, and sends every phone back to the join screen.')) return;
  clearTimeout(_suspenseTimer); clearInterval(_suspenseSpin);
  if(dmHandle){ DotMoment.destroy(); dmHandle=null; }
  const nonce=(state.bidNonce||1)+1;
  _history=[];
  state=freshState();
  state.bidNonce=nonce;
  saveNow(); renderHost();
}

/* host keyboard: SPACE / → advance · ← back */
addEventListener('keydown',e=>{
  if(!isHost) return;
  const tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.code==='Space'||e.code==='ArrowRight'){ e.preventDefault(); if(!e.repeat) hostAdvance(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); if(!e.repeat) hostBack(); }
});

/* ── host boot + resume ── */
async function initHost(){
  document.getElementById('host').classList.remove('hide');
  if(!ROOM){
    ROOM=CONFIG.ROOM_PREFIX+(1000+Math.floor(Math.random()*9000));
    const p=new URLSearchParams(location.search); p.set('role','host'); p.set('room',ROOM);
    try{history.replaceState(null,'','?'+p.toString());}catch(e){}
  }
  joinChannel();
  let resumed=false;
  try{
    const {data}=await db.from('games').select('state,updated_at').eq('room_code',ROOM).maybeSingle();
    const s=data&&data.state;
    const recent=data&&data.updated_at&&(Date.now()-new Date(data.updated_at).getTime()<CONFIG.STALE_GAME_MS);
    if(s&&recent&&s.phase&&(Object.keys(s.players||{}).length>0||s.phase!=='slides'||(s.slide||1)>1)){
      state=s; state.hostId=MY_ID; resumed=true;
      if(state.allotStep==='suspense') state.allotStep='idle';   // timers don't survive a reload
    }
  }catch(e){}
  if(!resumed){ state=freshState(); }
  await saveNow();
  renderHost();
}

function doJoin(){
  const inp=document.getElementById('pname');
  const v=(inp&&inp.value||'').trim().slice(0,16);
  if(!v){ if(inp) inp.focus(); return; }
  try{ localStorage.setItem('ifj_name',v); }catch(e){}
  sendAction({type:'join',id:MY_ID,name:v});
  joinSent=true;
  renderPlayer(true);
  /* belt & braces on venue wifi: re-send the join once if no ack */
  setTimeout(()=>{ if(!me()&&joinSent) sendAction({type:'join',id:MY_ID,name:v}); },2200);
}

function wirePick(){
  const I=CONFIG.IPO, lim=myCat==='HNI'?CONFIG.HNI:CONFIG.RETAIL;
  const range=document.getElementById('lotRange');
  const apply=document.getElementById('lotApply');
  function setLots(n){
    myLots=Math.min(lim.maxLots,Math.max(lim.minLots,Math.floor(n)));
    if(range&&+range.value!==myLots) range.value=myLots;
    const amt=myLots*I.lotCost;
    document.getElementById('lotN').textContent=myLots;
    document.getElementById('lotSh').textContent=myLots*I.lotShares;
    document.getElementById('lotAmt').textContent=rup(amt);
    document.getElementById('lotLeft').textContent=rup(CONFIG.PLAYER_CASH-amt);
    if(myConfirming){ myConfirming=false; clearTimeout(_confirmTimer);
      apply.textContent=''; apply.innerHTML='APPLY · <span id="lotBtnAmt">'+rup(amt)+'</span>'; apply.classList.remove('amberb'); }
    else document.getElementById('lotBtnAmt').textContent=rup(amt);
  }
  if(range) range.addEventListener('input',()=>setLots(+range.value));
  const m=document.getElementById('lotMinus'), pl=document.getElementById('lotPlus');
  if(m) m.onclick=()=>setLots(myLots-1);
  if(pl) pl.onclick=()=>setLots(myLots+1);
  const back=document.getElementById('lotBackBtn');
  if(back) back.onclick=()=>{ myCat=null; myConfirming=false; clearTimeout(_confirmTimer); renderPlayer(true); };
  if(apply) apply.onclick=()=>{
    const amt=myLots*I.lotCost;
    if(myLots<lim.minLots||myLots>lim.maxLots||amt>CONFIG.PLAYER_CASH) return;  // limits enforced at submit (client)
    if(!myConfirming){
      myConfirming=true;
      apply.classList.add('amberb');
      apply.innerHTML='CONFIRM — FINAL · '+rup(amt);
      clearTimeout(_confirmTimer);
      _confirmTimer=setTimeout(()=>{ myConfirming=false;
        if(document.getElementById('lotApply')===apply){ apply.classList.remove('amberb');
          apply.innerHTML='APPLY · <span id="lotBtnAmt">'+rup(amt)+'</span>'; } },5000);
      return;
    }
    clearTimeout(_confirmTimer); myConfirming=false;
    sendAction({type:'bid',id:MY_ID,cat:myCat,lots:myLots});
    myBidSentAt=Date.now();
    renderPlayer(true);
  };
}

        '<div style="text-align:left;margin-top:14px">'+
        '<div class="prow"><span class="l">STAYS INVESTED</span><span class="v">'+rup(p.cost)+'</span></div>'+
        '<div class="prow"><span class="l">RELEASED BACK TO YOU</span><span class="v up">'+rup(p.refund)+'</span></div>'+
        (al.retailApplicants?'<div class="prow"><span class="l">YOUR ODDS</span><span class="v">'+al.retailWinners+' OF '+al.retailApplicants+' WON</span></div>':'')+
        '</div></div>';
    }
    return '<div class="pcard" style="text-align:center">'+
      '<div class="pkicker">RETAIL LOTTERY · RESULT</div>'+
      '<div class="presult-big lostc">NOT ALLOTTED</div>'+
      '<p class="psub"><b style="color:var(--ink)">'+rup(p.bid)+' released back to you.</b><br>'+I.retailLosePctLabel+' of retail applicants got nothing. Your money was never at risk — ASBA just unfroze it.</p>'+
    '</div>';
  }
  /* HNI */
  const asked=Math.round(p.bid/I.issuePrice);
  return '<div class="pcard" style="text-align:center">'+
    '<div class="pkicker">HNI · PROPORTIONAL · NO LOTTERY</div>'+
    '<div class="presult-big won">ALLOTTED — '+p.shares+' SHARES</div>'+
    '<p class="psub">You asked for '+fmtIN(asked)+' shares. At 14× oversubscription you get ≈ your bid ÷ 14. Pure math, no luck.</p>'+
    '<div style="text-align:left;margin-top:14px">'+
    '<div class="prow"><span class="l">STAYS INVESTED</span><span class="v">'+rup(p.cost)+'</span></div>'+
    '<div class="prow"><span class="l">RELEASED BACK TO YOU</span><span class="v up">'+rup(p.refund)+'</span></div>'+
    '</div></div>';
}

/* J6 — personal listing P&L */

    return '<div class="pcard">'+

      '<div class="presult-big won" style="text-align:center">+'+rup(gain)+'</div>'+
      '<div class="prow"><span class="l">YOUR SHARES</span><span class="v">'+shares+' × +₹'+fmtIN(I.gainPerShare)+'</span></div>'+
      '<div class="prow"><span class="l">MONEY THAT WAS BLOCKED</span><span class="v">'+rup(p.bid)+'</span></div>'+
      '<div class="prow"><span class="l">RETURN ON BLOCKED ₹</span><span class="v '+(roi>=5?'up':'amber')+'">+'+pct1(roi)+'%</span></div>'+
      '<div class="prow"><span class="l">YOUR ₹10,00,000 IS NOW</span><span class="v up">'+rup(finalTotal)+'</span></div>'+
      '<p class="psub" style="margin-top:14px">'+(p.cat==='RETAIL'
        ?'Small ticket, full +'+I.gainPct+'% pop — the lottery winner’s prize.'
        :'The pop was +'+I.gainPct+'% per share — but look how much money stood frozen to catch your slice.')+'</p>'+
    '</div>';
  }
  if(p.bid>0){
    return '<div class="pcard">'+
      '<div class="pkicker">LISTING DAY · ₹'+fmtIN(I.issuePrice)+' → ₹'+fmtIN(I.listPrice)+'</div>'+
      '<div class="presult-big" style="text-align:center;color:var(--ink-2)">±₹0</div>'+
      '<div class="prow"><span class="l">SHARES</span><span class="v">0</span></div>'+
      '<div class="prow"><span class="l">BLOCKED, THEN RELEASED</span><span class="v">'+rup(p.bid)+'</span></div>'+
      '<div class="prow"><span class="l">YOUR ₹10,00,000 IS NOW</span><span class="v">'+rup(finalTotal)+'</span></div>'+
      '<p class="psub" style="margin-top:14px">No shares, no loss — your money came back untouched. It just earned nothing while it was frozen. That’s the hidden cost of IPO season.</p>'+
    '</div>';
  }
  return '<div class="pcard">'+
    '<div class="pkicker">LISTING DAY · ₹'+fmtIN(I.issuePrice)+' → ₹'+fmtIN(I.listPrice)+'</div>'+
    '<div class="presult-big" style="text-align:center;color:var(--ink-2)">'+rup(finalTotal)+'</div>'+
    '<p class="psub" style="text-align:center">Unchanged — you never applied. The winners made +'+I.gainPct+'% on a small slice; the cost of sitting out was a lesson, not a loss.</p>'+
  '</div>';
}

/* polling fallback — realtime drops events on venue wifi */
setInterval(async()=>{
  if(isHost||!ROOM) return;
  try{
    const {data,error}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle();
    if(!error) window._lastHeardAt=Date.now();
    if(data&&data.state&&data.state.updatedAt!==state.updatedAt){ state=data.state; renderPlayer(); }
  }catch(e){}
},2500);

/* ── player boot ── */
async function initPlayer(){
  document.getElementById('player').classList.remove('hide');
  document.title='Jio IPO · LIVE — join the room';
  renderPlayer(true);
  if(!ROOM) return;
  joinChannel();
  try{
    const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle();
    if(data&&data.state) state=data.state;
  }catch(e){}
  renderPlayer(true);
}

/* ── boot ── */
if(isHost) initHost(); else initPlayer();

/* ── Tap-to-rejoin (quiz.html pattern) ─────────────────────────────
   Recovers from iOS Safari killing the Realtime socket (phone call,
   long background). Dormant during normal play; wakes only when the
   tab returns to the foreground and no render has happened for a few
   seconds. Reload is safe: MY_ID is in localStorage ('ifj_pid') and
   the host's join handler is a no-op for existing players. */
(function(){
  if(typeof isHost==='undefined'||isHost) return;
  var lastRenderAt=Date.now(), wasHidden=false, graceTimer=null, overlayEl=null;
  if(typeof renderPlayer==='function'){
    var _orig=renderPlayer;
    renderPlayer=function(){
      lastRenderAt=Date.now();
      if(overlayEl){ overlayEl.remove(); overlayEl=null; }
      return _orig.apply(this,arguments);
    };
  }
  function showOverlay(){
    if(overlayEl) return;
    overlayEl=document.createElement('div');
    overlayEl.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(10,14,22,0.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px';
    overlayEl.innerHTML='<div style="text-align:center;max-width:380px;color:#fff;font-family:system-ui,-apple-system,sans-serif"><div style="font-size:64px;margin-bottom:18px">📡</div><div style="font-size:26px;font-weight:800;margin-bottom:10px;letter-spacing:-0.02em">Lost connection</div><div style="font-size:16px;color:rgba(255,255,255,0.72);margin-bottom:28px;line-height:1.5">Your phone stopped hearing from the game. Tap below to rejoin — your bid is safe.</div><button id="__rejoinBtn" style="width:100%;padding:18px 24px;background:linear-gradient(135deg,#00ff95 0%,#00b86a 100%);border:none;border-radius:14px;color:#03110a;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(0,255,149,0.35),0 2px 6px rgba(0,0,0,0.25)">Tap to rejoin →</button></div>';
    document.body.appendChild(overlayEl);
    document.getElementById('__rejoinBtn').onclick=function(){ location.reload(); };
  }
  /* Judge by server contact, not renders: a student parked on the choose/slider
     screen legitimately gets no re-renders, which falsely tripped the overlay. */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ wasHidden=true; return; }
    if(!wasHidden) return;
    wasHidden=false;
    var backAt=Date.now();
    clearTimeout(graceTimer);
    graceTimer=setTimeout(function(){
      if(!((window._lastHeardAt||0)>=backAt)) showOverlay();
    },6500);
  });
})();
</script>
