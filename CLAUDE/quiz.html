<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kaun Banega Crorepati — IFM Quiz</title>
<link rel="icon" type="image/png" href="/ifm-round.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --teal:#2a9d8f;--teal-d:#1f7d72;--navy:#1a3a5c;--muted:#5a7d8a;
  --cream:#f7faf9;--mint:#bde9e4;--mint-lt:#e0f3f0;--white:#fff;--gold:#c8900a;--gold-lt:#fff5d6;--teal-bright:#2dd4bf;--gold-bright:#f5c451;
  --A:#e05a47;--B:#3a78c9;--C:#e0a429;--D:#34a36b; /* answer tile colours */
  --shadow:0 6px 24px rgba(26,58,92,.14);--shadow-lg:0 16px 48px rgba(26,58,92,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Nunito',sans-serif;color:var(--navy);
  background:radial-gradient(120% 120% at 50% 0%,#eef7f5 0%,#dceee9 45%,#c9e6df 100%);min-height:100vh}
h1,h2,h3,.serif{font-family:'Poppins',serif}
button{font-family:'Nunito';font-weight:800;cursor:pointer;border:none}
.hide{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.btn{padding:14px 22px;border-radius:14px;font-size:1.05rem;color:#fff;background:var(--teal);box-shadow:var(--shadow);transition:.12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal-d));font-size:1.15rem}
.btn.dark{background:var(--navy)}.btn.gold{background:linear-gradient(135deg,#e0a82e,var(--gold))}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:2px}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:var(--shadow)}
/* +6px keeps the panel tops clear of the fixed scan-to-join badge (it overlapped by 5px). */
body.host-bg .host-play{margin-top:8px}
.sub{text-align:center;color:var(--teal-d);font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:.85rem}
.title{text-align:center;font-size:2.5rem;font-weight:800;letter-spacing:-.5px;margin:2px 0 0;color:var(--navy)}
.card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:22px}

/* ── HOST ─────────────────────────── */
.host-lobby{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;margin-top:18px}
@media(max-width:780px){.host-lobby{grid-template-columns:1fr}}
.join-card{text-align:center}
.pin{font-family:'Poppins';font-size:3.4rem;font-weight:700;letter-spacing:.5rem;color:var(--navy);line-height:1}
.pin-label{color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:.78rem}
#qrbox{display:flex;justify-content:center;margin:14px 0}
#qrbox img,#qrbox canvas{border-radius:12px;border:6px solid #fff;box-shadow:var(--shadow)}
.joinurl{font-size:.8rem;color:var(--muted);word-break:break-all;font-weight:700}
.players-grid{display:flex;flex-wrap:wrap;gap:10px}
.pchip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:30px;padding:7px 14px 7px 7px;box-shadow:var(--shadow);font-weight:800;animation:pop .3s}
.pchip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;color:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.count-big{font-family:'Poppins';font-size:2.2rem;color:var(--teal-d);font-weight:700}

/* question display */
.stage{margin-top:10px;text-align:center}
.round-pill{display:inline-block;background:var(--navy);color:#fff;padding:7px 18px;border-radius:30px;font-weight:800;font-size:.9rem;margin-bottom:8px}
.diff-pill{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:#fff}
.diff-easy{background:#34a36b}.diff-medium{background:#e0a429}.diff-hard{background:#e05a47}
.qtext{font-family:'Poppins';font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--navy);margin:14px auto;max-width:900px;line-height:1.25}
.timer-ring{font-family:'Poppins';font-size:2.6rem;font-weight:700;color:var(--navy);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:0 auto;border:7px solid var(--mint);background:#fff;box-shadow:var(--shadow)}
.timer-ring.warn{border-color:#e05a47;color:#e05a47;animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:880px;margin:8px auto}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:11px;padding:9px 14px;border-radius:15px;color:#fff;font-size:.98rem;line-height:1.16;font-weight:800;text-align:left;box-shadow:var(--shadow);transition:.15s;position:relative}
.opt .ic{font-size:1.4rem;font-weight:900;width:30px;flex:0 0 auto}
.opt.A{background:var(--A)}.opt.B{background:var(--B)}.opt.C{background:var(--C)}.opt.D{background:var(--D)}
.opt.dim{opacity:.32}.opt.right{outline:5px solid #1a3a5c;transform:scale(1.02)}
.opt .tally{margin-left:auto;background:rgba(0,0,0,.22);padding:3px 10px;border-radius:20px;font-size:.9rem}
.answered-bar{font-weight:800;color:var(--teal-d);font-size:1.05rem;margin:4px 0}

/* leaderboard */
.lb{max-width:620px;margin:14px auto;text-align:left}
.lb-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:9px;box-shadow:var(--shadow);font-weight:800;animation:slideIn .35s}
@keyframes slideIn{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
.lb-row .rank{font-family:'Poppins';font-size:1.3rem;color:var(--muted);width:30px}
.lb-row .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.1rem}
.lb-row .sc{margin-left:auto;font-family:'Poppins';font-size:1.3rem;color:var(--teal-d)}
.lb-row .delta{font-size:.8rem;color:#34a36b;font-weight:900;margin-left:6px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:14px 0 10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:5px}
.pod .bar{width:104px;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-family:'Poppins';font-size:1.25rem;font-weight:700;padding-top:8px;box-shadow:var(--shadow)}
.pod.p1 .bar{height:112px;background:linear-gradient(180deg,#e7b008,#c8900a)}
.pod.p2 .bar{height:86px;background:linear-gradient(180deg,#9fb3c2,#6b7d93)}
.pod.p3 .bar{height:66px;background:linear-gradient(180deg,#d08a5a,#b5703c)}
.pod .nm{font-weight:900;font-size:.92rem}.pod .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.35rem;margin-bottom:2px}
/* podium screen polish + 1-player winner hero */
/* The podium now carries the race chart and the revisit strip on top of the medals and the
   full standings, so it's a fixed-height flex column: everything else keeps its size and the
   standings list scrolls inside itself. Same trick as the round-end leaderboard. */
.podium-stage{padding-bottom:6px;display:flex;flex-direction:column;height:calc(100vh - 112px);max-height:calc(100vh - 112px)}
.podium-stage > *{flex:0 0 auto}
.podium-stage .lb-scroll{flex:1 1 auto;min-height:60px;max-height:none;overflow-y:auto}
.podium-stage .host-controls{margin-top:8px}
.podium-video{max-height:11vh}
/* NB: .race's own max-height is declared further down the sheet, so it would win at equal
   specificity — hence the descendant selector here. */
@media(max-height:820px){.podium-video{display:none}.crorepati-title{font-size:1.8rem;margin:2px 0}
  .podium{margin:8px 0 6px}.win-hero{margin:8px auto;padding:10px 20px}
  .podium-stage .race{max-height:17vh}.podium-stage .revisit{margin:4px auto 2px}
  .podium-stage .rv-chip{font-size:.76rem;padding:4px 10px}
  .podium-stage .pod .bar{height:78px}.podium-stage .pod.p2 .bar{height:62px}.podium-stage .pod.p3 .bar{height:50px}}
.crorepati-title{font-size:2.1rem;color:var(--gold);margin:6px 0 2px;text-shadow:0 0 26px rgba(245,196,81,.4)}
.win-hero{display:inline-flex;align-items:center;gap:16px;background:linear-gradient(120deg,rgba(245,196,81,.32),rgba(200,144,10,.12));border:1.5px solid rgba(245,196,81,.6);box-shadow:0 0 30px rgba(245,196,81,.28);border-radius:20px;padding:14px 26px;margin:12px auto}
.win-hero .win-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:2rem;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.win-hero .win-name{font-weight:900;font-size:1.3rem}
.win-hero .win-amt{font-family:'Poppins';font-weight:800;font-size:2rem;color:#c8900a;line-height:1.05}
body.host-bg .win-hero .win-amt{color:#ffe08a;text-shadow:0 0 16px rgba(245,196,81,.5)}
body.host-bg .win-hero .win-name{color:#fff}
.win-line{font-size:1.2rem;font-weight:900;margin:6px 0 2px}
body.host-bg .win-line{color:#eef7f4}
.lb-scroll{max-height:26vh;overflow-y:auto}
/* wager lock-in chips (teacher screen) */
.wchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px auto;max-width:660px}
.wchip{display:flex;align-items:center;gap:7px;background:var(--cream);border:2px solid transparent;border-radius:30px;padding:6px 13px 6px 6px;font-weight:800;font-size:.9rem;opacity:.5;transition:.2s}
.wchip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.9rem}
.wchip.locked{opacity:1;border-color:var(--gold);background:var(--gold-lt)}
.host-controls{text-align:center;margin:18px 0}
.host-controls .btn{margin:6px}

/* ════════ HOST · premium broadcast layout ════════ */
/* The play screen was boxed into .wrap's 1100px, leaving ~133px of dead margin either side at
   1366 (410px at 1920). Widen the host shell and spend ALL of it on the two side panels —
   the centre column keeps its exact 612px, so question legibility is untouched. */
body.host-bg .wrap{max-width:1300px}
.host-play{display:grid;grid-template-columns:298px 1fr 326px;gap:14px;align-items:start;margin-top:6px}
@media(max-width:1040px){.host-play{grid-template-columns:1fr}}
.center-col{min-width:0}
/* pin the primary action button to the same spot on question + reveal so it never jumps */
.center-col > .stage:not(.card){display:flex;flex-direction:column;min-height:560px}
.center-col > .stage:not(.card) .host-controls{margin-top:auto;margin-bottom:6px}
/* no page scroll on the teacher screen */
body.host-bg{overflow:hidden}
.key-hint{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);z-index:95;color:#9fc2bb;font-size:.72rem;font-weight:800;background:rgba(10,26,34,.72);border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.key-hint b{color:#eaf6f3}
.host-back{position:fixed;bottom:7px;left:14px;z-index:95;color:#eaf6f3;font-size:.76rem;font-weight:800;background:rgba(10,26,34,.74);border:1px solid rgba(255,255,255,.15);padding:6px 15px;border-radius:20px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.host-back:hover{background:rgba(45,212,191,.28);border-color:transparent}
@media(max-width:1000px){.key-hint,.host-back{display:none!important}}
.side-panel{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px 15px}
.side-panel h3{margin:0 0 12px;font-family:'Poppins';font-size:1.12rem;display:flex;align-items:center;gap:7px}
.side-lb{max-height:78vh;overflow-y:auto;padding-right:2px}
.side-lb .lb-row{gap:9px;padding:10px 12px}
.side-lb .lb-row .rank{width:24px;font-size:1.1rem}
.side-lb .lb-row .av{width:33px;height:33px;font-size:1.02rem}
.side-lb .lb-row .nm{font-size:.92rem}
.side-lb .lb-row .delta{padding:2px 7px;font-size:.66rem}
.side-lb .lb-row .sc{font-size:1.18rem}

/* quiz map */
.maze-head{text-align:center;margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid rgba(0,0,0,.08)}
.maze-num{font-family:'Poppins';font-size:3rem;font-weight:700;color:var(--teal-d);line-height:1}
.maze-head .lbl{font-size:.64rem;font-weight:900;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}
.maze-round{margin-bottom:12px}
.maze-round .rname{font-size:.62rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.maze-round.active .rname{color:var(--gold)}
.maze-pips{display:flex;gap:7px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.62rem;font-weight:900;background:#e9f1ef;color:var(--muted);transition:.2s}
.pip.done{background:linear-gradient(160deg,var(--teal),var(--teal-d));color:#fff}
.pip.cur{background:linear-gradient(160deg,var(--gold-bright),var(--gold));color:#fff;box-shadow:0 0 0 4px rgba(245,196,81,.3);animation:pulse .9s infinite}

/* stage: pills */
.pill-row{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.round-pill{display:inline-block;background:linear-gradient(135deg,#23485c,#16314e);color:#fff;padding:8px 20px;border-radius:30px;font-weight:800;font-size:.92rem;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.diff-pill{display:inline-block;padding:6px 15px;border-radius:30px;font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.7px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.diff-easy{background:linear-gradient(135deg,#43c07d,#2f9d62)}
.diff-medium{background:linear-gradient(135deg,#f0b429,#d6920a)}
.diff-hard{background:linear-gradient(135deg,#f0506e,#c0392b)}
.prize-pill{display:inline-block;padding:6px 15px;border-radius:30px;font-weight:900;font-size:.78rem;color:#5a4500;background:linear-gradient(135deg,#ffe08a,#f5c451);box-shadow:0 6px 18px rgba(245,196,81,.4)}
/* KBC prize ladder (right panel) */
.ladder{display:flex;flex-direction:column;gap:3px}
.rung{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:9px;font-weight:800;font-size:.8rem}
.rung .rno{width:30px;color:var(--muted);font-size:.66rem;font-weight:900;flex:0 0 auto}
.rung .ramt{flex:1;text-align:right;font-family:'Poppins';font-weight:700}
.rung .rsafe{font-size:.7rem}
.rung.up{opacity:.45}
.rung.passed{background:rgba(42,157,143,.12)}
.rung.now{background:linear-gradient(90deg,rgba(245,196,81,.28),rgba(245,196,81,.04));box-shadow:inset 0 0 0 1.5px var(--gold)}
.rung.safe .ramt{color:var(--gold)}
body.host-bg .rung{color:#cfe6e0}
body.host-bg .rung .rno{color:#8fb0aa}
body.host-bg .rung.passed{background:rgba(45,212,191,.14);color:#eef7f4}
body.host-bg .rung.now{background:linear-gradient(90deg,rgba(245,196,81,.32),rgba(245,196,81,.05));box-shadow:inset 0 0 0 1.5px rgba(245,196,81,.75);color:#fff}
body.host-bg .rung.now .ramt,body.host-bg .rung.safe .ramt{color:#ffe08a}

/* stage: question + SVG timer ring */
.qtext{font-family:'Poppins';font-size:clamp(1.55rem,2.9vw,2.35rem);margin:6px auto;max-width:1000px;line-height:1.18;color:var(--navy)}
.tring{position:relative;width:94px;height:94px;margin:2px auto}
.tring svg{transform:rotate(-90deg);display:block;width:94px;height:94px}
.tring .trk{fill:none;stroke:rgba(150,180,190,.25);stroke-width:9}
.tring .prg{fill:none;stroke:var(--teal-bright);stroke-width:9;stroke-linecap:round;stroke-dasharray:326.726;stroke-dashoffset:0;transition:stroke-dashoffset .26s linear,stroke .3s}
.tring .tnum{position:absolute;inset:0;display:grid;place-items:center;font-family:'Poppins';font-size:1.95rem;font-weight:700;color:var(--navy)}
.answered-bar{font-weight:800;font-size:1.05rem;letter-spacing:.3px;margin:8px 0;color:var(--teal-d)}

/* stage: answer tiles */
.opts{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:9px;max-width:900px;margin:8px auto}
.opts.flow{grid-auto-rows:auto;align-items:start}  /* choices/reveal — let a long option size itself, don't force all 4 tall */
@media(max-width:560px){.opts{grid-template-columns:1fr;grid-auto-rows:auto}}
.opt{position:relative;display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:16px;color:#fff;font-size:1.3rem;font-weight:800;line-height:1.18;text-align:left;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28);transition:.2s}
.opt .badge{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:1.25rem;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.opt .label{flex:1;min-width:0}
.opt.A{background:linear-gradient(145deg,#d8455a,#9e1f31)}
.opt.B{background:linear-gradient(145deg,#3f7fd6,#234a9c)}
.opt.C{background:linear-gradient(145deg,#e3a72e,#b9790c)}
.opt.D{background:linear-gradient(145deg,#33ac6c,#1c7a49)}
.opt .pct{margin-left:auto;background:rgba(0,0,0,.30);padding:4px 12px;border-radius:20px;font-size:.95rem;font-weight:900;flex:0 0 auto}
.opt .bar{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.85);border-radius:3px}
.opt.dim{opacity:.32;filter:saturate(.55)}
.opt.right{box-shadow:0 0 0 4px #fff,0 0 36px 7px rgba(94,233,168,.6),0 14px 32px rgba(0,0,0,.3);transform:translateY(-2px)}

/* leaderboard rows */
.lb{max-width:640px;margin:14px auto;text-align:left}
.lb-row{display:flex;align-items:center;gap:12px;border-radius:15px;padding:11px 15px;margin-bottom:9px;font-weight:800;position:relative;overflow:hidden;background:#fff;box-shadow:var(--shadow);animation:slideIn .35s}
.lb-row .rank{font-family:'Poppins';font-size:1.25rem;width:30px;text-align:center;flex:0 0 auto}
.lb-row .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.15rem;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.25)}
.lb-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900}
.lb-row .delta{font-size:.72rem;font-weight:900;padding:3px 9px;border-radius:20px;flex:0 0 auto}
.lb-row .delta.up{background:rgba(52,211,153,.16);color:#1f9d62}
.lb-row .delta.dn{background:rgba(240,80,110,.16);color:#c0392b}
.lb-row .sc{font-family:'Poppins';font-size:1.35rem;font-weight:700;color:var(--teal-d);flex:0 0 auto}
.lb-bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--teal-bright));opacity:.55;border-radius:2px}

/* ════════ TV-studio dark theming (host only) ════════ */
body.host-bg{background:radial-gradient(125% 95% at 50% -5%,rgba(14,38,48,.42),rgba(5,15,20,.94) 78%),url('quiz-studio.jpg') center/cover fixed no-repeat}
/* while a question is live, the whole screen lifts to a brighter teal so it obviously POPS */
body.host-bg.qlive-on{background:radial-gradient(125% 96% at 50% -8%,rgba(32,132,120,.60),rgba(7,30,32,.90) 80%),url('quiz-studio.jpg') center/cover fixed no-repeat}
body.host-bg.qlive-on::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 0 4px rgba(45,212,191,.35),inset 0 0 120px rgba(45,212,191,.22);animation:liveEdge 2.4s ease-in-out infinite}
@keyframes liveEdge{0%,100%{box-shadow:inset 0 0 0 4px rgba(45,212,191,.30),inset 0 0 100px rgba(45,212,191,.16)}50%{box-shadow:inset 0 0 0 5px rgba(45,212,191,.5),inset 0 0 150px rgba(45,212,191,.30)}}
body.host-bg #host{padding:14px 20px 34px}
body.host-bg .brand img{box-shadow:0 6px 22px rgba(0,0,0,.55)}
body.host-bg #host .sub{color:var(--teal-bright);letter-spacing:2.5px}
body.host-bg #host .title{color:#fff;text-shadow:0 4px 26px rgba(0,0,0,.7)}
body.host-bg #host > p{color:#bcd7d0}
/* panels → dark frosted glass */
body.host-bg .side-panel{background:linear-gradient(165deg,rgba(26,56,70,.74),rgba(10,26,34,.82));border:1px solid rgba(255,255,255,.12);box-shadow:0 26px 64px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.10);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15)}
body.host-bg .side-panel h3{color:#eaf6f3;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:10px}
body.host-bg .maze-head{border-bottom-color:rgba(255,255,255,.14)}
body.host-bg .maze-num{color:var(--gold-bright);text-shadow:0 0 22px rgba(245,196,81,.4)}
body.host-bg .maze-head .lbl{color:#9fc2bb}
body.host-bg .maze-round .rname{color:#8fb0aa}
body.host-bg .pip{background:rgba(255,255,255,.08);color:#cfe6e0}
/* leaderboard → dark glass rows */
body.host-bg .lb-row{background:linear-gradient(120deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 22px rgba(0,0,0,.3);color:#eef7f4}
body.host-bg .lb-row .rank{color:#8fb0aa}
body.host-bg .lb-row .sc{color:var(--teal-bright);text-shadow:0 0 14px rgba(45,212,191,.45)}
body.host-bg .lb-row .delta.up{background:rgba(94,233,168,.18);color:#7df0b6}
body.host-bg .lb-row .delta.dn{background:rgba(255,138,160,.18);color:#ff9fb1}
body.host-bg .lb-row.r1{background:linear-gradient(120deg,rgba(245,196,81,.32),rgba(200,144,10,.10));border-color:rgba(245,196,81,.6);box-shadow:0 0 30px rgba(245,196,81,.28)}
body.host-bg .lb-row.r1 .rank,body.host-bg .lb-row.r1 .sc{color:#ffe08a;text-shadow:0 0 16px rgba(245,196,81,.5)}
body.host-bg .lb-bar{opacity:.7}
body.host-bg .lb-row.r1 .lb-bar{background:linear-gradient(90deg,var(--gold),var(--gold-bright))}
/* stage dark */
body.host-bg .qtext{color:#fff;text-shadow:0 3px 22px rgba(0,0,0,.65)}
body.host-bg .tring .trk{stroke:rgba(255,255,255,.14)}
body.host-bg .tring .tnum{color:#fff}
body.host-bg .answered-bar{color:#8fe6d8}
body.host-bg .center-col h2{color:#fff}
/* Round-end / standings leaderboard heading. It renders OUTSIDE .center-col, so the rule
   above never reached it — it was dark navy on the dark studio bg, i.e. invisible. */
.lb-title{font-size:2rem;margin:2px 0 10px;flex:0 0 auto}
body.host-bg .lb-title{color:#fff;text-shadow:0 3px 22px rgba(0,0,0,.6)}
/* Round-end / standings: fixed-height flex column so the player list NEVER pushes the
   "Next round" button off a projector. The list scrolls inside itself; the button is pinned
   to the bottom, landing in the SAME spot for 2 players or 30. Two columns past 8 players. */
.lb-stage{display:flex;flex-direction:column;height:calc(100vh - 118px);max-height:calc(100vh - 118px)}
.lb-stage .round-pill{flex:0 0 auto}
.lb-stage .lb{flex:1 1 auto;min-height:0;overflow-y:auto;margin:4px auto;width:100%;padding-right:2px}
.lb-stage .host-controls{flex:0 0 auto;margin:10px 0 0}
.lb.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-width:1180px;align-content:start}
.lb.two-col .lb-row{margin-bottom:8px}
@media(max-height:745px){.lb-stage{height:calc(100vh - 104px);max-height:calc(100vh - 104px)}}
.reveal-correct{color:var(--teal-d);font-weight:800}
body.host-bg .reveal-correct{color:#8fe6d8;text-shadow:0 0 16px rgba(143,230,216,.4)}
/* lobby + intro */
.lobby-video{display:block;margin:0 auto 4px;width:360px;max-width:80%;max-height:20vh;object-fit:cover;border-radius:18px;box-shadow:0 26px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.22)}
.podium-video{display:block;margin:0 auto 6px;width:340px;max-width:70%;border-radius:16px;box-shadow:0 20px 44px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.22)}
.qr-hint{font-size:.74rem;font-weight:800;color:var(--muted);cursor:zoom-in;margin-top:6px;letter-spacing:.3px}
body.host-bg .qr-hint{color:#8fb0aa}
#qrbox{cursor:zoom-in;transition:transform .15s}#qrbox:hover{transform:scale(1.03)}
.intro-banner{max-height:30vh;width:auto;max-width:92%;border-radius:16px;margin:0 auto 8px;display:block;box-shadow:0 20px 44px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3)}

/* ════ premium lobby ════ */
.lobby-hero{text-align:center;margin-top:2px}
.lobby-tag{font-weight:700;margin:6px 0 0}
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:18px auto 6px;align-items:stretch}
@media(max-width:760px){.lobby-grid{grid-template-columns:1fr}}
.lobby-card{display:flex;flex-direction:column;align-items:center;border-radius:22px;padding:20px 18px;text-align:center;background:#fff;box-shadow:var(--shadow)}
.lobby-card.players{justify-content:flex-start}
.lobby-card-h{font-family:'Poppins';font-size:1.18rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
.lobby-card.join #qrbox{margin:0 auto 12px}
.lobby-card .pin{font-family:'Poppins';font-size:3rem;font-weight:700;letter-spacing:.4rem;line-height:1;margin:2px 0;color:var(--navy)}
.lobby-card .pin-label{font-size:.64rem;text-transform:uppercase;letter-spacing:1.6px;font-weight:900;margin-top:8px;color:var(--muted)}
.lobby-card .joinurl{font-size:.72rem;word-break:break-all;font-weight:700;margin-top:8px;opacity:.7;color:var(--muted)}
.lobby-card .btn{width:100%;margin-top:auto}
/* capped + internally scrollable so a big class never pushes the audience picker or the
   Start button off a 768px-tall projector (the host body is overflow:hidden) */
.players-grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-content:flex-start;width:100%;flex:1;margin-bottom:14px;min-height:64px;max-height:19vh;overflow-y:auto}
/* Short projectors (768p/720p are the common ones): the decorative hero shrinks and the
   player list scrolls internally, so the QR, the audience picker, the Start button AND the
   notice all stay on screen — the host body is overflow:hidden, so anything below the fold
   is simply unreachable. Verified 0px overflow at 720/768/900/1080 with up to 24 players. */
@media(max-height:940px){.lobby-video{max-height:9vh}.notice{margin:5px auto}}
@media(max-height:745px){.players-grid{max-height:13vh}.lobby-video{max-height:6vh}.lobby-grid{margin:8px auto 4px}.notice{padding:7px 12px;font-size:.8rem}body.host-bg #host{padding-bottom:24px}}
.count-big{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:30px;font-family:'Poppins';font-size:1.2rem;font-weight:700;background:var(--mint-lt);color:var(--teal-d)}
.waiting{font-weight:700;align-self:center;margin:auto;color:var(--muted)}

/* ── audience picker: two big buttons choosing the question bank (lobby only) ── */
.aud-pick{width:100%;margin:0 0 12px}
.aud-lbl{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:7px;text-align:center}
.aud-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aud-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:12px 8px;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.16);color:#eaf6f3;transition:.15s;line-height:1.15}
.aud-btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.3)}
.aud-btn .aud-emoji{font-size:1.85rem}
.aud-btn .aud-name{font-family:'Poppins';font-weight:800;font-size:1.15rem}
.aud-btn .aud-sub{font-size:.68rem;font-weight:800;opacity:.6;letter-spacing:.3px}
.aud-btn.on{background:linear-gradient(160deg,rgba(45,212,191,.30),rgba(45,212,191,.10));border-color:var(--teal-bright);
  box-shadow:0 0 0 4px rgba(45,212,191,.14),0 10px 26px rgba(0,0,0,.3)}
.aud-btn.on .aud-sub{opacity:.9;color:#8fe6d8}

/* hard-reset button (host) */
.host-reset{position:fixed;top:12px;left:14px;z-index:90;background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.28);padding:8px 15px;border-radius:30px;font-size:.82rem;font-weight:800;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.32);transition:.15s}
/* persistent corner join/rejoin QR (all play screens) */
.join-corner{position:fixed;top:6px;right:10px;z-index:95;display:flex;align-items:center;gap:9px;padding:3px 12px 3px 6px;border-radius:14px;cursor:zoom-in;background:linear-gradient(165deg,rgba(26,56,70,.9),rgba(10,26,34,.94));border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 26px rgba(0,0,0,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.15s}
.join-corner:hover{transform:scale(1.04)}
.join-corner .jc-qr{width:48px;height:48px;background:#fff;border-radius:7px;padding:2px;display:grid;place-items:center;flex:0 0 auto}
.join-corner .jc-txt{text-align:left;line-height:1.2}
.join-corner .jc-txt .jc-lbl{color:#9fc2bb;font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.join-corner .jc-txt .jc-pin{font-family:'Poppins';font-weight:800;font-size:1.1rem;letter-spacing:.18rem;color:#fff}
.join-corner .jc-txt .jc-tap{color:#8fe6d8;font-size:.62rem;font-weight:800}
@media(max-width:1000px){.join-corner{display:none!important}}
.host-reset:hover{background:rgba(240,80,110,.9);border-color:transparent}

/* dark glass for lobby cards + reset (host theme) */
body.host-bg .lobby-card{background:linear-gradient(165deg,rgba(26,56,70,.74),rgba(10,26,34,.82));border:1px solid rgba(255,255,255,.12);box-shadow:0 26px 64px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.10);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15)}
body.host-bg .lobby-card-h{color:#eaf6f3}
body.host-bg .lobby-card .pin{color:#fff;text-shadow:0 0 24px rgba(45,212,191,.4)}
body.host-bg .lobby-card .pin-label,body.host-bg .lobby-card .joinurl,body.host-bg .lobby-tag{color:#bcd7d0}
body.host-bg .count-big{background:rgba(45,212,191,.22);color:var(--teal-bright)}
body.host-bg .pchip{background:rgba(255,255,255,.13);color:#eef7f4;box-shadow:none}
body.host-bg .waiting{color:#9fc2bb}
body.host-bg .notice{background:rgba(245,196,81,.14);border-color:rgba(245,196,81,.45);color:#f3dca0}

/* ── PLAYER ─────────────────────────── */
.player-scr{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px}
.p-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.p-input{width:100%;border:2.5px solid var(--mint);border-radius:14px;padding:16px;font-size:1.2rem;font-weight:800;text-align:center;color:var(--navy);font-family:'Nunito'}
.p-input:focus{outline:none;border-color:var(--teal)}
.p-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.p-tile{aspect-ratio:1.4/1;border-radius:20px;color:#fff;font-size:1.9rem;font-weight:900;display:grid;place-items:center;box-shadow:0 12px 26px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.3);transition:.12s;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.p-tile:active{transform:scale(.94);filter:brightness(1.08)}
.p-tile.A{background:linear-gradient(145deg,#d8455a,#9e1f31)}.p-tile.B{background:linear-gradient(145deg,#3f7fd6,#234a9c)}.p-tile.C{background:linear-gradient(145deg,#e3a72e,#b9790c)}.p-tile.D{background:linear-gradient(145deg,#33ac6c,#1c7a49)}
.p-tile.faded{opacity:.25}
.p-status{font-size:1.3rem;font-weight:800;color:var(--navy)}
.p-score{font-family:'Poppins';font-size:2.4rem;font-weight:700;color:var(--teal-d)}
.p-result{font-family:'Poppins';font-size:2rem;font-weight:700}
/* ════ player (phone) — dark game-show theme ════ */
body.player-bg{background:radial-gradient(125% 90% at 50% -5%,#1a4a5e 0%,#0b1f29 60%,#08171f 100%);color:#eef7f4}
body.player-bg .p-status{color:#fff}
body.player-bg .sub{color:var(--teal-bright);letter-spacing:2px}
body.player-bg .title{color:#fff}
body.player-bg .p-score{color:var(--teal-bright);text-shadow:0 0 18px rgba(45,212,191,.4)}
body.player-bg .p-bar-top{background:linear-gradient(120deg,rgba(26,56,70,.88),rgba(10,26,34,.92));color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 26px rgba(0,0,0,.35)}
body.player-bg .p-input{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.24);color:#fff}
body.player-bg .p-input::placeholder{color:#9fc2bb}
body.player-bg input[type=range]{accent-color:var(--gold-bright)}
.p-bar-top{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);font-weight:900;margin-bottom:8px}
.p-bar-top .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-right:8px}
.wager-box{width:100%}
.wager-val{font-family:'Poppins';font-size:2.8rem;font-weight:800;color:var(--gold);line-height:1.05}
.wager-sub{font-weight:800;font-size:1.05rem;color:#9fc2bb;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--teal);height:30px}
.role-toggle{position:fixed;bottom:8px;right:10px;font-size:.72rem;color:var(--muted);opacity:.6;font-weight:700;z-index:99}
.role-toggle a{color:var(--teal-d)}
.notice{background:var(--gold-lt);border:1.5px solid var(--gold);color:#7a5c1a;border-radius:12px;padding:10px 14px;font-weight:700;font-size:.85rem;margin:10px auto;max-width:600px;text-align:center}

/* ── side panels scaled up ~50-75% for projector legibility (they now have the width) ── */
.side-panel{padding:18px 17px}
.side-panel h3{font-size:1.45rem;gap:9px;margin-bottom:14px}
/* left: class answers */
.av-big-n{font-size:3.5rem}
.av-big-l{font-size:.82rem;letter-spacing:.7px}
.av-hint{font-size:.78rem;margin:-2px 0 10px}
.av-list{gap:9px}
.av-row .av-q{width:64px;font-size:.95rem}
.av-row .av-track{height:17px;border-radius:10px}
.av-row .av-fill{border-radius:10px}
.av-row .av-pc{width:52px;font-size:1.12rem}
/* right: prize ladder */
/* The amount is sized independently of the Q label: it's the number the room reads from
   the back of the hall, and growing it also closes the dead space right-alignment leaves. */
.rung{padding:5px 13px;font-size:1.24rem;border-radius:11px;gap:8px}
.rung .rno{width:42px;font-size:.98rem}
.rung .ramt{font-size:1.62rem;line-height:1.15;letter-spacing:-.01em}
.rung .rsafe{font-size:1rem}
.ladder{gap:3px}

/* 768-tall projectors: 16 rungs at the full amount size run 37px past the fold, so trim the
   number and the row padding. Declared BEFORE the 745 block so 720p still wins there. */
@media(max-height:800px){
  .side-panel{padding:15px 16px}
  .rung{padding:4px 13px}
  .rung .ramt{font-size:1.5rem}
  .ladder{gap:2px}
}

/* 720p projectors: the enlarged panels + a full 16-question log are the tallest things on
   screen, so pull them back just enough to keep everything above the fold. */
@media(max-height:745px){
  .side-panel{padding:12px 13px}
  .side-panel h3{font-size:1.18rem;margin-bottom:9px}
  .av-big-n{font-size:2.5rem}
  .av-big{margin:0 0 8px}
  .av-list{max-height:42vh;gap:6px}
  .av-row .av-track{height:14px}
  /* the Round-4 intro carries the safety-net banner too — pull the briefing back so neither
     the rules nor the banner get clipped on a 720p projector */
  /* NB: the base .round-intro rules are declared LATER in this stylesheet, so these must
     out-specify them (.stage.round-intro / descendant selectors) or they lose the cascade. */
  .stage.round-intro{height:calc(100vh - 80px);max-height:calc(100vh - 80px)}
  .stage.round-intro .intro-banner{max-height:10vh;margin-bottom:4px}
  .stage.round-intro .ri-pill{font-size:.95rem;padding:5px 18px}
  .stage.round-intro .ri-sub{font-size:clamp(1.4rem,2.4vw,1.8rem);margin:5px 0 7px}
  .stage.round-intro .ri-rules{font-size:clamp(1rem,1.75vw,1.3rem);line-height:1.3}
  .stage.round-intro .ri-btn{font-size:1.1rem;padding:10px 24px;margin-top:5px}
  .stage.round-intro .floor-ups{padding:6px 11px;margin-top:6px}
  .stage.round-intro .fu-head{font-size:.88rem}
  .stage.round-intro .fu-chip{font-size:.8rem;padding:3px 9px 3px 3px}
  .stage.round-intro .fu-chip .av{width:19px;height:19px;font-size:.72rem}
  .rung{padding:2px 11px;font-size:.98rem;gap:6px}
  .rung .rno{width:36px;font-size:.82rem}
  .rung .ramt{font-size:1.24rem}
  .ladder{gap:2px}
  /* the badge is already tightened; reclaim the top offset on 720p projectors */
  body.host-bg .host-play{margin-top:2px}
}

/* ── 🛡️ safety net: who the finale floor caught, shown on the Round 4 intro ── */
.floor-ups{margin:10px auto 0;max-width:760px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(135deg,rgba(45,212,191,.16),rgba(45,212,191,.04));border:1px solid rgba(45,212,191,.45)}
.fu-head{font-family:'Poppins';font-weight:800;font-size:1.02rem;color:#0e7a6e}
body.host-bg .fu-head{color:#8fe6d8}
.fu-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:7px 0 4px}
.fu-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 4px;border-radius:20px;
  font-weight:800;font-size:.92rem;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
.fu-chip .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}

/* ── 🔥 streak: chip on the leaderboard row, beats on the reveal, tease on the live question ── */
.streak-chip{flex:0 0 auto;font-size:.78rem;font-weight:900;padding:3px 9px;border-radius:20px;letter-spacing:.3px;
  background:linear-gradient(135deg,#ffb347,#ff7a1a);color:#3a1b00;box-shadow:0 0 14px rgba(255,140,40,.45)}
.streak-beats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px auto 0;max-width:900px}
.beat{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:30px;font-size:.95rem;font-weight:800}
.beat.up{background:linear-gradient(135deg,rgba(255,179,71,.30),rgba(255,122,26,.12));border:1px solid rgba(255,160,60,.6);color:#ffd9a3}
.beat.dn{background:rgba(240,80,110,.14);border:1px solid rgba(240,80,110,.45);color:#ffb3c4}
.beat b{color:#fff}
.beat-amt{font-family:'Poppins';font-weight:800;color:#7CFFB0}
.beat-av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.85rem;color:#fff;flex:0 0 auto}
.streak-tease{display:inline-flex;align-items:center;gap:9px;margin:2px auto 0;padding:7px 18px;border-radius:30px;
  font-size:1.05rem;font-weight:800;color:#ffd9a3;background:linear-gradient(135deg,rgba(255,179,71,.24),rgba(255,122,26,.08));
  border:1px solid rgba(255,160,60,.5);animation:teasePulse 1.8s ease-in-out infinite}
.streak-tease b{color:#fff}
.tease-more{font-size:.8rem;font-weight:800;opacity:.75}
@keyframes teasePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,150,50,.0)}50%{box-shadow:0 0 22px 2px rgba(255,150,50,.35)}}

/* ── behaviour / finale pills ── */
.diff-behaviour{background:linear-gradient(135deg,#7c5cff,#5b3fd6)}
.diff-finale{background:linear-gradient(135deg,#f5c451,#d69b0a);color:#4a3600}
.diff-trap{background:linear-gradient(135deg,#e0699a,#b23a6f)}

/* ── QUESTION-TIME cue: glowing teal panel + blinking LIVE badge so it's obvious you're answering ── */
.center-col > .stage.qlive{background:linear-gradient(165deg,rgba(45,212,191,.12),rgba(10,26,34,.10));border:2px solid rgba(45,212,191,.55);border-radius:22px;padding:12px 16px 6px;box-shadow:0 0 0 4px rgba(45,212,191,.10),0 0 60px rgba(45,212,191,.20);animation:qpulse 2s ease-in-out infinite}
@keyframes qpulse{0%,100%{box-shadow:0 0 0 4px rgba(45,212,191,.08),0 0 42px rgba(45,212,191,.15)}50%{box-shadow:0 0 0 5px rgba(45,212,191,.18),0 0 74px rgba(45,212,191,.30)}}
.live-badge{display:inline-block;padding:5px 14px;border-radius:30px;font-weight:900;font-size:.7rem;letter-spacing:.6px;text-transform:uppercase;color:#062018;background:linear-gradient(135deg,#5eead4,#2dd4bf);box-shadow:0 0 18px rgba(45,212,191,.55);animation:blink 1.5s steps(2,start) infinite}
@keyframes blink{50%{opacity:.5}}

/* ── left-panel hover popover: full A/B/C/D breakdown + who answered ── */

const LADDER=[10000,25000,50000,100000,200000, 300000,400000,550000,750000,1000000, 1300000,1600000,1900000,2250000,2600000,3000000];
const SAFETY=new Set([4,9]); // safety nets: Q5 (₹2L), Q10 (₹10L)
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function fmtMoney(n){ n=Math.round(n);
  if(n>=10000000){const v=n/10000000;return '₹'+(v%1?v.toFixed(2):v)+' Cr';}
  if(n>=100000){const v=n/100000;return '₹'+(v%1?v.toFixed(2):v)+' L';}

/* ── ROUND structure — 16 questions across 4 rounds (4·4·4·4) ──────────────

   Q9-12 R3  wager + 50:50, NO clock · Q13-16 R4  finale, NO clock

/* Audience banks. The lobby's two big buttons pick one; the choice lands in
   state.audience and buildRounds() reads it. Adding a third bank later = one line. */
const BANKS={mums:BANK_MUMS,teens:BANK_TEENS};
function activeBank(){ return BANKS[(state&&state.audience)||'mums']||BANK_MUMS; }
let ROUND_QS=[]; // host-built per game (randomised selection + prizes)
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildRounds(){
  // Fixed workshop script: take the ACTIVE bank (mums or teens — see state.audience) in its
  // authored order and chunk it into the 4 rounds by their tier-array LENGTHS (4·4·4·4). We
  // still shuffle each question's A/B/C/D so the correct answer isn't always in the same slot.
  const BANK=activeBank();
  let gi=0;
  ROUND_QS=ROUND_DEFS.map(rd=>rd.tiers.map(()=>{
    const src=BANK[gi]||BANK[0];
    const order=shuffle([0,1,2,3]);
    const opts=order.map(i=>src.options[i]);
    const correct=order.indexOf(src.correct);
    const item={q:src.q,options:opts,correct,diff:src.diff,behaviour:!!src.behaviour,prize:LADDER[gi],gi,finalWager:false};
    gi++; return item;
  }));
}

async function initHost(){
  document.getElementById('host').classList.remove('hide');
  document.body.classList.add('host-bg');
  if(!ROOM){ ROOM=''+(1000+Math.floor(Math.random()*9000));
    const p=new URLSearchParams(location.search);p.set('role','host');p.set('room',ROOM);history.replaceState(null,'','?'+p.toString()); }
  joinChannel();
  // Resume an in-progress game on reload (refresh / sleep / projector reconnect) instead
  // of wiping it. Peek the room: if a recent, non-lobby game with players + a question set
  // is there, adopt it and re-claim host rather than overwriting with a fresh lobby.
  let resumed=false;
  try{
    const {data}=await db.from('games').select('state,updated_at').eq('room_code',ROOM).maybeSingle();
    const s=data&&data.state;
    const recent=data&&data.updated_at&&(Date.now()-new Date(data.updated_at).getTime()<30*60*1000);
    if(s&&recent&&s.phase!=='lobby'&&s.phase!=='ended'&&Object.keys(s.players||{}).length>0&&(s.roundQs||[]).length){
      state=s; state.hostId=MY_ID; ROUND_QS=s.roundQs; resumed=true;
      // Live timer + in-memory answers are gone after a reload, so don't try to rescue a
      // half-answered question — show a recovery card and restart the current question.
      if(state.phase==='question'||state.phase==='wager'||state.phase==='choices') _recovering=true;
    }
  }catch(e){}
  if(!resumed){ state=freshState(); await saveNow(); }
  renderHost();
  document.getElementById('roleToggle').innerHTML='Host screen · PIN '+ROOM;
  const rb=document.createElement('button'); rb.className='host-reset'; rb.textContent='↺ New game'; rb.onclick=hostReset; document.body.appendChild(rb);

  jw.onclick=openQRFull; document.body.appendChild(jw);

  const kh=document.createElement('div'); kh.className='key-hint'; kh.id='keyHint'; kh.innerHTML='<b>Space</b> / <b>→</b> next · <b>←</b> back';
  document.body.appendChild(kh);

  document.addEventListener('keydown', hostKey);

}
function hostKey(e){

  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){

    const modal=document.getElementById('hostModal'); if(modal){ hideHostModal(); return; }  // Space dismisses a popup first
    if(advanceLocked()) return;   // just auto-revealed — let the room see it
    hostAdvance();

    const modal=document.getElementById('hostModal'); if(modal){ hideHostModal(); return; }

function hostAdvance(){

function toggleJoinCorner(){

function hostHandleAction(a){
  if(!a||!a.type)return;
  if(a.type==='join'){
    if(!state.players[a.id]){
      const n=Object.keys(state.players).length;
      state.players[a.id]={id:a.id,name:a.name.slice(0,16),av:AV_EMOJI[n%AV_EMOJI.length],color:AV_COLOR[n%AV_COLOR.length],score:0,answered:false,wager:0,lastDelta:0,streak:0,streakBonus:0,scoreHistory:[]};
    }else{ state.players[a.id].name=a.name.slice(0,16); }
    state.totalPlayers=Object.keys(state.players).length;
    save(); if(state.phase==='lobby') updateLobbyPlayers();
  }
  else if(a.type==='answer'){
    const p=state.players[a.id]; if(!p||state.phase!=='question')return;
    const k=a.qkey; if(k!==qkey())return; // stale answer for another question
    _answers[k]=_answers[k]||{};
    // Students mis-tap: the phone shows only A/B/C/D, so a wrong tile is easy to hit under
    // pressure. Everywhere EXCEPT fastest-finger you may change your mind while the question
    // is live and we overwrite. In fastest-finger the first tap stands — speed is the whole
    // point of that round, and allowing changes would make the speed bonus gameable.
    const locksOnFirstTap = curRound().mode==='fastest';
    if(_answers[k][a.id] && locksOnFirstTap) return;
    _answers[k][a.id]={choice:a.choice,ts:Date.now()};
    p.answered=true;
    state.answeredCount=Object.keys(_answers[k]||{}).length;   // distinct players, not taps
    save(); updateLiveUI();
    maybeAutoReveal();
  }
  else if(a.type==='wager'){
    const p=state.players[a.id]; if(!p)return;
    p.wager=Math.max(0,Math.min(a.amount, maxWager(p))); p.wagerLocked=true;
    save(); if(state.phase==='wager') renderHost();
  }
  else if(a.type==='lifeline'){
    const p=state.players[a.id]; if(!p||p.lifelineUsed)return;
    p.lifelineUsed=true; save();   // persist so it survives a phone reload; 1 use per player

}
// The current question's prize. Works on BOTH sides: the host has state.roundQs (which it
// built), and players receive the same array over realtime; publicQ.prize is the fallback.
function curPrize(){
  const rq=state&&state.roundQs&&state.roundQs[state.round-1];
  const q=rq?rq[state.qIndex]:null;
  if(q&&q.prize) return q.prize;
  return (state&&state.publicQ&&state.publicQ.prize)||0;
}
// You may invest what you HAVE (floored at the ₹10k starter stake so nobody is benched), and
// never more than the question is worth. Capping to the rung keeps the round additive — betting
// your whole bank compounded, which let one lucky all-in run away with the game. The floor is
// safe for that balance: ₹10k is ~1.3% of a Round-3 rung, unlike the old ₹1L floor it replaces.
function maxWager(p){ return Math.max(0, Math.min(Math.max(p.score||0, MIN_STAKE), curPrize())); }

/* host flow */
function hostStart(){ pushHistory(); buildRounds(); state.roundQs=ROUND_QS; state.round=1;state.qIndex=0;state.phase='round_intro';state.reveal=null; resetAnswered(); saveNow(); renderHost(); }
function hostReset(){

}
function hostRoundIntro(){ state.phase='round_intro'; state.reveal=null; saveNow(); renderHost(); }
function tplRecovered(){

    <div class="host-controls"><button class="btn primary" onclick="hostResumeQuestion()">Resume question →</button></div>
  </div>`;
}
function hostResumeQuestion(){ _recovering=false; state.wagerPhase=false; state.reveal=null; _skipPush=true; hostShowQuestion(); }
function resetAnswered(){ for(const id in state.players){state.players[id].answered=false;state.players[id].lastDelta=0;} state.answeredCount=0;
  state.graceUntil=null; clearInterval(_graceTimer); _graceTimer=null; }

function hostShowQuestion(){
  if(_skipPush){ _skipPush=false; } else { pushHistory(); }
  const q=curQ(); resetAnswered();
  const gi=globalQIndex();
  state.qNonce=(state.qNonce||0)+1;   // new instance id each time a question is shown (also forces re-answer on a resume)
  if(isWagerQ() && !state.wagerPhase){ // open a 15-second wager window first (default 50%)
    state.wagerPhase=true; state.phase='wager';
    state.timeLimit=WAGER_SECS; state.qStartTs=Date.now();
    for(const id in state.players){state.players[id].wager=Math.round(maxWager(state.players[id])*0.5/100)*100; state.players[id].wagerLocked=false;}
    state.publicQ={round:state.round,roundName:curRound().name,diff:q.diff,prize:q.prize,gi,finalWager:!!q.finalWager,mode:curRound().mode,wagerSecs:WAGER_SECS};
    saveNow(); renderHost(); startTick(); return;
  }
  state.wagerPhase=false;
  const timed=curRound().time>0;
  state.phase='question'; state.timeLimit=curRound().time; state.qStartTs=Date.now();
  state.reveal=null; state.choices=null;
  state.publicQ={round:state.round,roundName:curRound().name,diff:q.diff,q:q.q,options:q.options,prize:q.prize,gi,
    mode:curRound().mode,behaviour:!!q.behaviour,finalWager:!!q.finalWager,time:curRound().time,timed,lifeline:(gi>=LIFELINE_FROM)};

}
function startTick(){ stopTick();

    else if(state.phase==='wager'){ updateWagerUI(); if(timeLeft()<=0){ stopTick(); hostShowQuestion(); } } // 15s up → reveal the question (unlocked players keep their 50% default)
    else stopTick();

}
function updateWagerUI(){

  const n=document.getElementById('wagerCount'); if(n) n.textContent=Math.ceil(timeLeft());
}
function stopTick(){ if(_tick){clearInterval(_tick);_tick=null;} }
function updateLiveUI(){

  const num=document.getElementById('ringNum'), ring=document.getElementById('ringProg'), ab=document.getElementById('answeredBar');
  const d=ringDash();
  if(num){ num.textContent=Math.ceil(timeLeft()); num.style.color=d.col; }
  if(ring){ ring.style.strokeDashoffset=d.off; ring.style.stroke=d.col; }

function timeLeft(){ if(!state.qStartTs)return 0; return Math.max(0,state.timeLimit-(Date.now()-state.qStartTs)/1000); }

/* Everyone's in — reveal on our own. Saves the teacher watching the counter, and it fires the
   moment the last phone lands rather than whenever they happen to look up. Manual Space still

/* Everyone is in — but the LAST person to lock in had no time to reconsider, while everybody
   else did. So instead of revealing straight away we open a short window for them: the host and
   every phone count it down, a change during it still counts, and Space reveals early when the

const GRACE_SECS=3;
let _graceTimer=null;
function maybeAutoReveal(){
  if(!isHost||state.phase!=='question')return;
  const total=Object.keys(state.players).length;
  if(total<1||state.answeredCount<total){ cancelGrace(); return; }
  if(state.graceUntil) return;                       // already counting down
  state.graceUntil=Date.now()+GRACE_SECS*1000;

}
function cancelGrace(){
  clearInterval(_graceTimer); _graceTimer=null;

}
function graceLeft(){ return state&&state.graceUntil?Math.max(0,(state.graceUntil-Date.now())/1000):0; }
function startGrace(){
  clearInterval(_graceTimer);

    if(!isHost||!state||state.phase!=='question'||!state.graceUntil){ clearInterval(_graceTimer); _graceTimer=null; return; }
    const el=document.getElementById('graceCount'); if(el) el.textContent=Math.ceil(graceLeft());
    if(graceLeft()<=0){
      clearInterval(_graceTimer); _graceTimer=null;

    }

/* The teacher is quick on the spacebar. After an AUTO reveal we swallow input briefly so the

let _advanceLockUntil=0;
function lockAdvance(ms){ _advanceLockUntil=Date.now()+ms; toggleJoinCorner(); setTimeout(toggleJoinCorner, ms+60); }
function advanceLocked(){ return Date.now()<_advanceLockUntil; }
function hostReveal(auto){
  if(state.phase!=='question'&&state.phase!=='choices')return;   // reveal from the live question OR the discussion screen
  pushHistory();
  stopTick();
  const q=curQ(),r=curRound(),k=qkey(),ans=_answers[k]||{};
  // rank correct answers by time for fastest-finger
  const correctList=Object.entries(ans).filter(([,v])=>v.choice===q.correct)
    .sort((a,b)=>a[1].ts-b[1].ts).map(([id])=>id);
  const tally=[0,0,0,0];
  for(const id in ans){ const c=ans[id].choice; if(c>=0&&c<4)tally[c]++; }
  // score everyone
  const streakUps=[], streakBreaks=[];
  for(const id in state.players){
    const p=state.players[id]; let delta=0;
    const a=ans[id]; const correct=a&&a.choice===q.correct;
    if(isWagerQ()){ delta = correct? (p.wager||0) : -(p.wager||0); }
    else if(correct){
      delta = q.prize;                                   // win this rung's prize
      if(r.mode==='fastest' && id===correctList[0]) delta = q.prize*2; // fastest correct doubles it
    }
    // ── streak ──────────────────────────────────────────────────────────────
    // Correct extends it; a wrong OR unanswered question breaks it. From 3 in a row the
    // bonus is (streak-2)×25% of THIS question's prize, capped at +100%. The cap matters:
    // uncapped, a perfect 16/16 run earns ~₹4.3 Cr in bonuses — 2.7× the whole ladder —
    // which would rebuild the runaway the wager cap just removed.
    const before=p.streak||0;
    let bonus=0;
    if(correct){
      p.streak=before+1;
      if(p.streak>=STREAK_FROM){
        bonus=Math.round(q.prize*streakPct(p.streak));
        delta+=bonus;
        streakUps.push({id,name:p.name,av:p.av,color:p.color,streak:p.streak,bonus});
      }
    }else{
      p.streak=0;

  }

    streakUps:streakUps.sort((a,b)=>b.streak-a.streak), streakBreaks};

  const answered=Object.keys(ans).length;

  for(const id in ans){ const c=ans[id].choice; if(c>=0&&c<4){ const pl=state.players[id]; if(pl) who[c].push({av:pl.av,color:pl.color,name:pl.name}); } }

}
/* Discussion beat: show the spread of what everyone picked — no correct answer yet — so

function hostShowChoices(){

function hostNext(){

  else if(STANDINGS_AFTER.has(gi)){ state.phase='standings'; state.reveal=null; state.choices=null; saveNow(); renderHost(); } // mid-round full-screen standings

function hostNextRound(){

// Lift anyone below the safety rung as the finale opens. Idempotent (it sets a floor rather

function applyFinaleFloor(){
  const ups=[];

    if((p.score||0) < FINALE_FLOOR){ ups.push({id,name:p.name,av:p.av,color:p.color,from:p.score||0}); p.score=FINALE_FLOOR; }

/* 🔥 The streak theatre. Three of the four moments live here (the chip is on the leaderboard

function tplStreakBeats(rv){

/* The pre-question tease — the moment the user singled out. During a live question we show
   who is riding a streak, so the room knows exactly who is under pressure. p.streak still
   holds the count from the PREVIOUS question here, which is what makes this work. */
function tplStreakTease(){
  const on=Object.values(state.players).filter(p=>(p.streak||0)>=STREAK_FROM).sort((a,b)=>b.streak-a.streak);
  if(!on.length) return '';
  const s=on[0], more=on.length>1?` <span class="tease-more">+${on.length-1} more on a run</span>`:'';

  return `<div class="streak-tease"><span class="beat-av" style="background:${s.color}">${s.av}</span><span><b>${escapeHtml(s.name)}</b> is on <b>${s.streak}</b> — can they make it ${s.streak+1}?${more}</span></div>`;
}
function tplHostReveal(){ const q=curQ(),r=curRound(),rv=state.reveal;

function tplMiniLeader(){ const top=sortedPlayers().slice(0,5);

function tplLeaderboard(title,opts){ opts=opts||{}; const ps=sortedPlayers();

  const label=opts.btnLabel||(last?'See final results 🏆':'Next round →');
