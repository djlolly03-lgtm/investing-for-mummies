function lbRow(p,i){
  const rk=i+1, medal=rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':rk;
  const d=p.lastDelta||0;
  const delta=d?`<span class="delta ${d>0?'up':'dn'}">${d>0?'+':'−'}${fmtMoney(Math.abs(d))}</span>`:'';
  const mx=Math.max(1,...Object.values(state.players).map(x=>x.score||0));
  const w=Math.round(((p.score||0)/mx)*100);
  const fire=(p.streak||0)>=STREAK_FROM?`<span class="streak-chip">🔥${p.streak}</span>`:'';
  const spark=tplSparkline(p);
  return `<div class="lb-row r${rk<=3?rk:'n'}"><span class="rank">${medal}</span><span class="av" style="background:${p.color}">${p.av}</span><span class="nm">${escapeHtml(p.name)}</span>${fire}${spark}${delta}<span class="sc">${fmtMoney(p.score)}</span><span class="lb-bar" style="width:${w}%"></span></div>`;
}
/* ── RANK over time ───────────────────────────────────────────────────────────
   We plot rank, not money: the ladder is so back-loaded that money lines sit flat for
   12 questions then all rocket together, and money lines almost never fall so they never
   cross — and crossing lines ARE the competition. Ties SHARE a rank (standard competition
   ranking, 1,1,3): early on the room genuinely is level, and fastest-finger already rewards
   speed so we don't tie-break on it again. Cached per render — recomputing per row is O(n²). */
let _rankCache=null;
function getRanks(){
  if(_rankCache) return _rankCache;
  const ps=Object.values(state.players||{});
  const n=Math.max(0,...ps.map(p=>(p.scoreHistory||[]).length));
  const ranks={}; ps.forEach(p=>ranks[p.id]=[]);
  for(let i=0;i<n;i++){
    const col=ps.map(p=>({id:p.id,s:(p.scoreHistory||[])[i]}))
                .filter(x=>typeof x.s==='number').sort((a,b)=>b.s-a.s);
    let rank=0,prev=null,seen=0;
    for(const v of col){ seen++; if(prev===null||v.s<prev){ rank=seen; prev=v.s; } ranks[v.id].push(rank); }
  }
  _rankCache={ranks,n,total:ps.length};
  return _rankCache;
}
// Tiny rank trajectory for a leaderboard row — top of the box is 1st.
function tplSparkline(p){
  const {ranks,n,total}=getRanks();
  const r=ranks[p.id]||[];
  if(n<2||r.length<2||total<2) return '';
  const W=54,H=18,pad=2;
  const x=i=>pad+(i/(n-1))*(W-pad*2);
  const y=v=>pad+((v-1)/Math.max(1,total-1))*(H-pad*2);
  const pts=r.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last=r[r.length-1], first=r[0];
  const col=last<first?'#7CFFB0':(last>first?'#ff9db0':'#9fc2bb');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(r.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.1" fill="${col}"/></svg>`;
}
/* The race chart — the story of the whole game in one picture. Only the top few get colour
   and a label; everyone else is a grey thread, so with 20+ players it stays readable from the
   back of a room instead of turning into spaghetti. */
function tplRaceChart(){
  const {ranks,n,total}=getRanks();
  if(n<2||total<2) return '';
  const ps=sortedPlayers(), lead=ps.slice(0,Math.min(6,ps.length)), leadIds=new Set(lead.map(p=>p.id));
  const W=980,H=250,L=34,R=132,T=16,B=26;
  const x=i=>L+(i/(n-1))*(W-L-R);
  const y=v=>T+((v-1)/Math.max(1,total-1))*(H-T-B);
  const path=p=>(ranks[p.id]||[]).map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const grey=ps.filter(p=>!leadIds.has(p.id))
    .map(p=>`<polyline points="${path(p)}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>`).join('');
  const hot=lead.map(p=>{
    const r=ranks[p.id]||[]; if(r.length<2) return '';
    const lx=x(r.length-1), ly=y(r[r.length-1]);
    return `<polyline points="${path(p)}" fill="none" stroke="${p.color}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>
      <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="${p.color}"/>
      <text x="${(lx+9).toFixed(1)}" y="${(ly+4).toFixed(1)}" class="rc-name" fill="${p.color}">${p.av} ${escapeHtml(p.name)}</text>`;
  }).join('');
  // question gridlines + round boundaries
  let grid='';
  for(let i=0;i<n;i++){
    const bound=[3,7,11].includes(i);
    grid+=`<line x1="${x(i).toFixed(1)}" y1="${T}" x2="${x(i).toFixed(1)}" y2="${H-B}" stroke="rgba(255,255,255,${bound?.16:.06})" stroke-width="1"${bound?' stroke-dasharray="3 3"':''}/>`;
    if(i%2===0||i===n-1) grid+=`<text x="${x(i).toFixed(1)}" y="${H-8}" class="rc-ax" text-anchor="middle">Q${i+1}</text>`;
  }
  return `<div class="race-wrap">
    <svg class="race" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Rank of each player across the questions">
      <text x="4" y="${(T+10)}" class="rc-ax">1st</text>
      <text x="4" y="${(H-B)}" class="rc-ax">${total}${total>9?'':'th'}</text>
      ${grid}${grey}${hot}
    </svg></div>`;
}
/* "Worth revisiting" — the teaching payoff of the whole game. Any question the room mostly
   got wrong is a concept that didn't land, so hand the teacher that list at the end rather
   than making them remember it. Uses the answerLog we already record at every reveal. */
// Questions half the room or fewer got right, worst first.
function weakQuestions(){
  return (state.answerLog||[]).filter(l=>l.answered>0)
    .map(l=>({...l,pct:l.correct/l.answered}))
    .filter(l=>l.pct<=0.5)
    .sort((a,b)=>a.pct-b.pct).slice(0,4);
}
function tplRevisit(){
  if(!(state.answerLog||[]).filter(l=>l.answered>0).length) return '';
  const weak=weakQuestions();
  if(!weak.length) return `<div class="revisit good">✅ No weak spots — the room got every question mostly right.</div>`;
  const chips=weak.map((l,i)=>`<span class="rv-chip" onclick="hostRevisit(${i})"><b>Q${l.gi+1}</b> ${Math.round((1-l.pct)*100)}% wrong</span>`).join('');
  return `<div class="revisit"><div class="rv-head">📚 Worth revisiting — tap one to teach it</div><div class="rv-chips">${chips}</div></div>`;
}
/* The teaching screen. A truncated chip tells a teacher nothing they can work with, so this puts
   ONE question back on the projector in full — the wording, all four options, how the room split,
   and which wrong answer tempted them. The popular wrong answer is the lesson; the right one is
   just the footnote. */
function tplRevisitDetail(){
  const weak=weakQuestions();
  if(!weak.length) return tplStory();
  const i=Math.max(0,Math.min(weak.length-1,state.rvIndex||0));
  const l=weak[i], total=l.answered||1;
  const wrongPct=Math.round((1-l.correct/total)*100);
  // the wrong option the most people fell for — what actually needs explaining
  let lure=-1, lureN=-1;
  (l.tally||[]).forEach((n,ix)=>{ if(ix!==l.correctIdx && n>lureN){ lureN=n; lure=ix; } });
  const opts=(l.opts||[]).map((o,ix)=>{
    const n=(l.tally||[])[ix]||0, pc=Math.round(n/total*100);
    const cls=ix===l.correctIdx?'ok':(ix===lure&&n>0?'lure':'');
    return `<div class="rvo ${cls}">
      <span class="rvo-l">${'ABCD'[ix]}</span>
      <span class="rvo-t">${escapeHtml(o)}</span>
      <span class="rvo-n">${n}<small>/${total}</small></span>
      <span class="rvo-bar"><i style="width:${pc}%"></i></span>
      <span class="rvo-pc">${pc}%</span>
      ${ix===l.correctIdx?'<span class="rvo-tag ok">correct</span>':(ix===lure&&n>0?'<span class="rvo-tag lure">top wrong answer</span>':'')}
    </div>`;
  }).join('');
  return `<div class="stage revisit-stage">
    <div class="rvd-top">
      <span class="rvd-step">📚 Worth revisiting · ${i+1} of ${weak.length}</span>
      <span class="rvd-score">Q${l.gi+1} — <b>${wrongPct}% got this wrong</b> (${l.correct} of ${total} right)</span>
    </div>
    <h2 class="rvd-q">${escapeHtml(l.q||('Question '+(l.gi+1)))}</h2>
    <div class="rvd-opts">${opts}</div>
    <div class="host-controls rvd-nav">
      <button class="btn dark" onclick="hostRevisitNav(-1)" ${i===0?'disabled':''}>← Previous</button>
      <button class="btn dark" onclick="hostStory()">Back to the story</button>
      <button class="btn primary" onclick="hostRevisitNav(1)" ${i===weak.length-1?'disabled':''}>Next question →</button>
    </div>
  </div>`;
}
function hostRevisit(i){ pushHistory(); state.phase='revisit'; state.rvIndex=i||0; saveNow(); renderHost(); }
function hostRevisitNav(d){
  const n=weakQuestions().length; if(!n) return;
  const nx=(state.rvIndex||0)+d;
  if(nx<0||nx>=n) return;
  state.rvIndex=nx; saveNow(); renderHost();
}
/* The closing screen. The podium celebrates; THIS is where the game gets explained — how the
   lead actually moved, and which ideas didn't land. Given its own screen because cramming both
   onto the podium squeezed the chart down to an unreadable strip. */
function tplStory(){
  return `<div class="stage story-stage">
    <h2 class="lb-title">\u{1F4C8} The story of the game</h2>
    ${tplRaceChart()}
    ${tplRevisit()}
    <div class="host-controls">${weakQuestions().length?`<button class="btn primary" onclick="hostRevisit(0)">Teach the tricky ones \u2192</button>`:''}<button class="btn dark" onclick="location.href=location.pathname+'?role=host'">New game</button></div>
  </div>`;
}
function hostStory(){ pushHistory(); state.phase='story'; saveNow(); renderHost(); }
function tplPodium(){ const ps=sortedPlayers(); const [a,b,c]=ps; const n=ps.length;
  const pod=(p,cls,medal)=>p?`<div class="pod ${cls}"><div class="av" style="background:${p.color}">${p.av}</div><div class="nm">${escapeHtml(p.name)}</div><div class="bar">${medal}<br>${fmtMoney(p.score)}</div></div>`:'';
  const winHero=a?`<div class="win-hero"><div class="win-av" style="background:${a.color}">${a.av}</div><div><div class="win-name">${escapeHtml(a.name)}</div><div class="win-amt">${fmtMoney(a.score)}</div></div></div>`:'';
  // 3+ players → medal podium; 1–2 players → a proper winner hero (no empty podium steps)
  const centre = n>=3 ? `<div class="podium">${pod(b,'p2','🥈')}${pod(a,'p1','🥇')}${pod(c,'p3','🥉')}</div>` : winHero;
  return `<div class="stage podium-stage">
    <video class="podium-video" src="ifm-hero-lockup-9s.mp4" autoplay muted loop playsinline poster="${LOGO}"></video>
    <h2 class="crorepati-title">🏆 Crorepati! 🎉</h2>
    ${centre}
    ${a?`<p class="win-line">${escapeHtml(a.name)} wins with ${fmtMoney(a.score)}! 🎉</p>`:''}
    <div class="lb lb-scroll">${ps.map((p,i)=>lbRow(p,i)).join('')}</div>
    <div class="host-controls" style="margin-top:10px"><button class="btn primary" onclick="hostStory()">See how the lead changed →</button></div>
  </div>`;
}

/* ═══════════════════ PLAYER ═══════════════════ */
let myName=localStorage.getItem('mm_name')||'';
let myAnswered=false, myChoice=-1, myLastNonce=-1, myWagerNonce=-1, joinSent=false, wasJoined=false;
let myLifeline=null;              // per-question: [keptIndexA, keptIndexB] once 50:50 is used
let myLifelineUsed=false;         // session-sticky: 50:50 is ONE use per game. Never un-set by incoming
                                  // state (belt-and-suspenders over the server p.lifelineUsed flag); reset
                                  // only on a fresh join / new game (doJoin).
let _pwTimer=null, myWagerLocked=false;   // player-side 15s wager countdown
let myPick=-1, _paTimer=null;             // tile tapped but NOT yet confirmed (see pPick/pConfirm)
async function initPlayer(){
  document.getElementById('player').classList.remove('hide');
  document.body.classList.add('player-bg');
  if(!ROOM){ document.getElementById('player').innerHTML='<div class="player-scr"><div class="p-center"><h2>Scan the QR on the screen</h2><p>or open the link with a game PIN.</p></div></div>'; return; }
  joinChannel();
  // peek current state
  try{ const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle(); if(data&&data.state)state=data.state; }catch(e){}
  document.getElementById('roleToggle').innerHTML='Player · room '+ROOM;
  renderPlayer();
  // Safety-net poll: if a realtime event is ever dropped (flaky venue wifi, rapid
  // round transitions like the wager round), re-sync within ~2.5s so the phone never
  // gets stuck needing a manual reload. Gated on me() so it never disturbs the join form.
  setInterval(async()=>{
    if(!me())return;
    try{ const {data}=await db.from('games').select('state').eq('room_code',ROOM).maybeSingle();
      if(data&&data.state&&data.state.updatedAt!==state.updatedAt){ state=data.state; renderPlayer(); }
    }catch(e){}
  },2500);
}
function me(){return state&&state.players?state.players[MY_ID]:null;}
function doJoin(){
  const inp=document.getElementById('nameInput'); const n=(inp.value||'').trim();
  if(!n){inp.focus();return;}
  myName=n; localStorage.setItem('mm_name',n);
  joinSent=true;
  myLifelineUsed=false; myLifeline=null;   // fresh join / new game re-arms the one 50:50
  sendAction({type:'join',id:MY_ID,name:n});
  // optimistic local
  renderPlayerJoined();
}
// In fastest-finger the first tap is final. Everywhere else you may re-tap to change your
// answer while the question is live — the host overwrites it.
function answerLocksOnFirstTap(){ return (state&&state.publicQ&&state.publicQ.mode)==='fastest'; }
/* Two-step answering. Tapping a tile only SELECTS it; nothing is sent until the student
   confirms. A fat-fingered tap is therefore never an answer — which matters most now that the
   host auto-reveals the moment the last person answers, leaving them no window to correct it.
   pPick = chosen on the phone, not sent. myChoice = confirmed and sent. */
function pPick(i){
  if(myAnswered && answerLocksOnFirstTap()) return;    // fastest-finger: confirmed is final
  if(myLifeline && myLifeline.indexOf(i)<0) return;    // eliminated by 50:50
  myPick=i; renderPlayer();
}
function pConfirm(){
  if(myPick<0) return;
  if(myAnswered && answerLocksOnFirstTap()) return;
  if(myAnswered && myChoice===myPick){ myPick=-1; renderPlayer(); return; }  // confirmed what they already had
  myAnswered=true; myChoice=myPick; myPick=-1;
  sendAction({type:'answer',id:MY_ID,qkey:state.round+'-'+state.qIndex,choice:myChoice});
  renderPlayer();
}
// A selection the student never confirms would score as unanswered and break their streak, so
// on a timed question the phone commits it for them as the clock runs out.
function startAnswerCountdown(){
  clearInterval(_paTimer);
  if(!state||state.phase!=='question') return;
  _paTimer=setInterval(()=>{
    if(!state||state.phase!=='question'){ clearInterval(_paTimer); return; }
    // the "everyone's in, revealing in N" clock, mirrored from the host
    const g=document.getElementById('pGrace');
    if(g) g.textContent=Math.ceil(graceLeft());
    else if(state.graceUntil && myAnswered && myPick<0) renderPlayer();   // countdown just opened
    if(state.timeLimit>0 && timeLeft()<=0.6){ if(myPick>=0 && !myAnswered) pConfirm(); }
  },300);
}
function wagerAmt(pct){ const m=me(); if(!m)return 0; return Math.round(maxWager(m)*(+pct)/100/100)*100; }
function pSetWager(pct){ const a=wagerAmt(pct); const el=document.getElementById('wval'); if(el)el.textContent=fmt(a); const s=document.getElementById('wvalsub'); if(s)s.textContent=fmtShort(a); }
function pSubmitWager(){ const pctEl=document.getElementById('wpct'); if(!pctEl)return; const amt=wagerAmt(pctEl.value);
  myWagerLocked=true; clearInterval(_pwTimer);
  sendAction({type:'wager',id:MY_ID,amount:amt});
  document.getElementById('wagerArea').innerHTML=`<div class="p-status">Invested 🔒</div><div class="wager-val">${fmt(amt)}</div><div class="wager-sub">${fmtShort(amt)}</div><p style="color:#9fc2bb">Waiting for the question…</p>`;
}

function renderPlayer(){
  const el=document.getElementById('player');
  if(!state){ el.innerHTML=scr('<h2>Connecting…</h2>'); return; }
  const p=me();
  if(!p){
    // Host wiped the game (hard reset) → drop my stale "joined" state, show join form again.
    if(wasJoined){ wasJoined=false; joinSent=false; }
    if(joinSent && state.phase!=='ended'){ renderPlayerJoined(); return; } // optimistic, awaiting host ack
    renderJoinForm(el); return;
  }
  wasJoined=true;
  // Reset "answered" each time a new question instance is shown. Keyed on state.qNonce
  // (bumped by the host every hostShowQuestion) so it fires for new rounds AND for a
  // restarted question after a host reload — but never on round_intro/wager.
  if(state.phase==='question'){
    if(myLastNonce!==state.qNonce){ myAnswered=false; myChoice=-1; myPick=-1; myLifeline=null; myLastNonce=state.qNonce; }
  }

  let inner='';
  if(state.phase==='lobby') inner=`<div class="p-center"><div class="p-status">You're in! 🎉</div><p>Hi <b>${escapeHtml(p.name)}</b> — look at the big screen.</p><p>Waiting for the host to start…</p></div>`;
  else if(state.phase==='round_intro'){
    const caught=((state.floorUps)||[]).some(u=>u.id===p.id);
    inner=`<div class="p-center"><div class="round-pill">${state.publicQ?'':''}Get ready</div><div class="p-status">${curRoundNamePlayer()}</div>`
      +(caught?`<p style="color:#8fe6d8;font-weight:800;max-width:300px">🛡️ The safety net caught you — you start the finale on <b>${fmt(FINALE_FLOOR)}</b>. Four questions left and they’re the biggest of the day. 💪</p>`
              :`<p>Eyes on the screen — first question coming up.</p>`)
      +`${pScoreLine(p)}</div>`;
  }
  else if(state.phase==='wager'){
    // Render the wager UI ONCE per question. Re-renders triggered by OTHER players
    // submitting wagers must NOT clobber this player's in-progress slider or their
    // already-locked screen, so skip the rebuild if we've shown this wager question.
    if(myWagerNonce===state.qNonce) return;
    myWagerNonce=state.qNonce; myWagerLocked=false; inner=tplPlayerWager(p);
  }
  else if(state.phase==='question') inner=tplPlayerQuestion(p);
  else if(state.phase==='choices') inner=`<div class="p-center"><div class="p-status">👀 Eyes on the big screen</div><p>Here’s what the room picked — let’s talk it through before the answer.</p>${pScoreLine(p)}</div>`;
  else if(state.phase==='reveal') inner=tplPlayerReveal(p);
  else if(state.phase==='standings'||state.phase==='round_end') inner=`<div class="p-center"><div class="p-status">${state.phase==='standings'?'📊 Where we stand':'Round done!'}</div>${pScoreLine(p)}${pRankLine(p)}<p>Check the leaderboard on screen.</p></div>`;
  else if(state.phase==='revisit') inner=`<div class="p-center"><div class="p-status">\u{1F4DA} Let\u2019s look at the tricky ones</div><p>Eyes on the big screen \u{1F440}</p>${pScoreLine(p)}${pRankLine(p)}</div>`;
  else if(state.phase==='ended'||state.phase==='story') inner=tplPlayerEnd(p);
  el.innerHTML=`<div class="player-scr">${topBar(p)}${inner}</div>`;
  if(state.phase==='wager') startWagerCountdown();
  if(state.phase==='question') startAnswerCountdown(); else clearInterval(_paTimer);
}
function startWagerCountdown(){
  clearInterval(_pwTimer);
  _pwTimer=setInterval(()=>{
    if(!state||state.phase!=='wager'){ clearInterval(_pwTimer); return; }
    const el=document.getElementById('wagerCount2'); const t=Math.max(0,Math.ceil(timeLeft()));
    if(el) el.textContent=t;
    if(t<=0){ clearInterval(_pwTimer); if(!myWagerLocked) pSubmitWager(); }   // auto-lock at 0 (defaults to 50%)
  },300);
}
function curRoundNamePlayer(){const r=ROUND_DEFS[state.round-1];return r?r.name:'';}
function topBar(p){ if(!p)return''; return `<div class="p-bar-top"><div style="display:flex;align-items:center"><span class="av" style="background:${p.color}">${p.av}</span>${escapeHtml(p.name)}</div><div style="color:#2dd4bf;font-family:'Poppins';font-weight:800;font-size:1.25rem">${fmtMoney(p.score)}</div></div>`;}
function pScoreLine(p){return `<div class="p-score">${fmt(p.score)}</div><div style="color:#9fc2bb;font-weight:800">${p.score>=1000?fmtShort(p.score)+' · ':''}won so far</div>`;}
function pRankLine(p){const ps=Object.values(state.players).sort((a,b)=>b.score-a.score);const r=ps.findIndex(x=>x.id===p.id)+1;return `<p style="font-weight:800">Rank ${r} of ${ps.length}</p>`;}
function scr(html){return `<div class="player-scr"><div class="p-center">${html}</div></div>`;}

function renderJoinForm(el){
  el.innerHTML=`<div class="player-scr"><div class="p-center">
    <img src="${LOGO}" style="width:70px;border-radius:50%" onerror="this.style.display='none'">
    <div class="sub">Investing for Mummies</div>
    <h1 class="title" style="font-size:1.7rem">Kaun Banega Crorepati</h1>
    <p style="color:#9fc2bb;font-weight:700">Room ${ROOM}</p>
    <input id="nameInput" class="p-input" placeholder="Your name" maxlength="16" value="${escapeHtml(myName)}">
    <button class="btn primary" style="width:100%" onclick="doJoin()">Join the quiz →</button>
  </div></div>`;
  setTimeout(()=>{const i=document.getElementById('nameInput');if(i)i.focus();},100);
}
function renderPlayerJoined(){
  document.getElementById('player').innerHTML=scr(`<div class="p-status">You're in! 🎉</div><p>Hi <b>${escapeHtml(myName)}</b></p><p>Waiting for the host to start…</p>`);
}
function tplPlayerQuestion(p){
  const pqa=state.publicQ||{};
  if(myAnswered){
    // Always show WHICH answer they locked — a silent "locked ✓" hides mis-taps completely.
    const L='ABCD'[myChoice]||'?';
    const txt=(pqa.options&&pqa.options[myChoice])?escapeHtml(pqa.options[myChoice]):'';
    const locked=answerLocksOnFirstTap();
    const tiles=locked?'':`<div class="p-tiles change-tiles">${[0,1,2,3].map(i=>{
        const elim = myLifeline && myLifeline.indexOf(i)<0;
        const mine = i===myChoice, pick = i===myPick;
        return `<div class="p-tile ${'ABCD'[i]}${elim?' faded':''}${mine?' mine':''}${pick?' picked':''}" ${elim?'':`onclick="pPick(${i})"`}>${'ABCD'[i]}${mine&&myPick<0?'<span class="tx">✓</span>':''}</div>`;
      }).join('')}</div>`;
    // A change goes through the same confirm step — nothing moves without a second, deliberate tap.
    const changing = !locked && myPick>=0 && myPick!==myChoice;
    return `<div class="p-center" style="gap:12px">
      <div class="p-status">Answer locked ✓</div>
      <div class="chosen"><span class="chosen-badge ${L}">${L}</span>${txt?`<span class="chosen-txt">${txt}</span>`:''}</div>
      ${tiles}
      ${changing?`<button class="btn gold confirm-btn" onclick="pConfirm()">Change to ${'ABCD'[myPick]} 🔒</button>
                  <p style="color:#9fc2bb;font-weight:700">Still ${L} until you tap that.</p>`
                :(state.graceUntil&&!locked
                    ? `<div class="grace-chip">⏳ Answer shows in <b id="pGrace">${Math.ceil(graceLeft())}</b>s — tap another to change</div>`
                    : `<p style="color:#9fc2bb;font-weight:700">${locked?'First tap is final in this round ⚡':'Changed your mind? Tap another, then confirm — it counts until the answer is shown.'}</p>`)}
      ${pScoreLine(p)}
    </div>`;
  }
  const pq=state.publicQ||{};
  const isBet=(pq.mode==='wager'||pq.finalWager);
  const canLL = pq.lifeline && p && !p.lifelineUsed && !myLifelineUsed && !myLifeline;   // 50:50 available from Q9, exactly ONCE per game
  const sub = isBet ? 'Your investment is in play 💰' : (pq.timed===false ? 'No timer — think it through 🧠' : (pq.prize?'Playing for '+fmt(pq.prize):''));
  const tiles=[0,1,2,3].map(i=>{
    const elim = myLifeline && myLifeline.indexOf(i)<0;
    const pick = i===myPick;
    return `<div class="p-tile ${'ABCD'[i]}${elim?' faded':''}${pick?' picked':''}" ${elim?'':`onclick="pPick(${i})"`}>${'ABCD'[i]}${elim?'<span class="tx">✕</span>':''}</div>`;
  }).join('');
  const ll = canLL
    ? `<button class="ll-btn" onclick="pLifeline()">💡 Use 50:50 · remove 2 wrong</button>`
    : (myLifeline?'<div class="ll-used">💡 50:50 used — 2 options left</div>':(((p&&p.lifelineUsed)||myLifelineUsed)?'<div class="ll-used">💡 50:50 already used</div>':''));
  return `<div class="p-center" style="gap:15px">
    <div class="p-status">${pq.finalWager?'FINAL — choose!':(pq.behaviour?'Your call 🎯':'Tap your answer!')}</div>
    ${sub?`<div style="font-weight:800;color:#8fe6d8">${sub}</div>`:''}
    <div class="p-tiles">${tiles}</div>
    ${myPick>=0
      ? `<button class="btn gold confirm-btn" onclick="pConfirm()">Lock in ${'ABCD'[myPick]} 🔒</button>
         <p style="color:#9fc2bb;font-weight:700">Tap a different letter to change it${pq.timed===false?'':' — or it locks in as the clock runs out'}.</p>`
      : `${ll}
         ${pq.mode==='fastest'?'<div class="lock-warn">⚡ Once you lock it in, it’s final</div>':''}
         <p style="color:#9fc2bb;font-weight:700">Read the options on the big screen 👀</p>`}
  </div>`;
}
function playerCurQ(){ const rq=state&&state.roundQs&&state.roundQs[state.round-1]; return rq?rq[state.qIndex]:null; }
function pLifeline(){
  if(myAnswered||myLifeline||myLifelineUsed)return; const m=me(); if(!m||m.lifelineUsed)return;
  const q=playerCurQ(); if(!q)return;
  const correct=q.correct; const wrongs=[0,1,2,3].filter(i=>i!==correct);
  const keepWrong=wrongs[Math.floor(Math.random()*wrongs.length)];
  myLifeline=[correct,keepWrong].sort((a,b)=>a-b);   // keep correct + one random wrong; grey the other two
  myLifelineUsed=true;                                // session-sticky one-shot guard (survives state re-syncs)
  m.lifelineUsed=true;                                // optimistic; host confirms + persists
  sendAction({type:'lifeline',id:MY_ID});
  renderPlayer();
}
function tplPlayerReveal(p){
  const rv=state.reveal; const a=null; const delta=p.lastDelta||0;
  const correct=delta>0 || (delta===0 && false);
  const got = p.answered;
  let head,col;
  if(!got){head='⏱ Too slow';col='var(--muted)';}
  else if(delta>0){head='✓ Correct!';col='#34a36b';}
  else if(delta<0){head='✗ Investment lost';col='#e05a47';}
  else {head='✗ Not quite';col='#e05a47';}
  return `<div class="p-center">
    <div class="p-result" style="color:${col}">${head}</div>
    ${delta?`<div class="wager-val" style="color:${delta>0?'#34a36b':'#e05a47'}">${delta>0?'+':'−'}${fmtMoney(Math.abs(delta))}</div>`:''}
    ${rv&&p.id===rv.fastest?'<div style="font-weight:900;color:var(--gold)">⚡ Fastest correct answer!</div>':''}
    ${pScoreLine(p)}${pRankLine(p)}
  </div>`;
}
function tplPlayerWager(p){
  const mx=maxWager(p);
  // A player on ₹0 — a late joiner, or someone who lost it all — plays the round on the ₹10k
  // starter stake rather than being benched. They can't fall below zero, so it's pure upside.
  const starter=(p.score||0)<MIN_STAKE;
  if(mx<=0) return `<div class="p-center wager-box" id="wagerArea">
    <div class="p-status">💰 Investing round</div>
    <p style="color:#9fc2bb;font-weight:700;max-width:300px">Hang tight — this one opens in a moment.</p>
  </div>`;
  return `<div class="p-center wager-box" id="wagerArea">
    <div class="p-status">💰 Make your investment</div>
    <div class="wager-timer">⏱ locks in <b id="wagerCount2">${Math.max(0,Math.ceil(timeLeft()))}</b>s · defaults to half</div>
    ${starter?`<p style="color:#8fe6d8;font-weight:800;max-width:300px">You’re playing this one with a <b>${fmt(MIN_STAKE)} starter stake</b> — get it right and you’re back in it. 💪</p>`
             :''}
    <p style="color:#9fc2bb;font-weight:700">Invest part of your winnings. Right, it <b>grows</b>; wrong, it’s <b>gone</b>.</p>
    <div class="wager-val" id="wval">${fmt(wagerAmt(50))}</div>
    <div class="wager-sub" id="wvalsub">${fmtShort(wagerAmt(50))}</div>
    <input type="range" id="wpct" min="0" max="100" step="5" value="50" oninput="pSetWager(this.value)">
    <div style="display:flex;justify-content:space-between;width:100%;font-weight:800;color:#9fc2bb"><span>₹0 safe</span><span>${fmt(mx)} max</span></div>
    <button class="btn gold" style="width:100%;margin-top:10px" onclick="pSubmitWager()">Invest it 🔒</button>
  </div>`;
}
function tplPlayerEnd(p){
  const ps=Object.values(state.players).sort((a,b)=>b.score-a.score);
  const r=ps.findIndex(x=>x.id===p.id)+1;
  const medal=r===1?'🥇':r===2?'🥈':r===3?'🥉':'🎓';
  return `<div class="p-center">
    <div style="font-size:3rem">${medal}</div>
    <div class="p-result">${r===1?'You are the Crorepati! 🎉':'Rank '+r+' of '+ps.length}</div>
    ${pScoreLine(p)}
    <p style="font-weight:700;color:#9fc2bb">Thanks for playing — now go invest like a pro 💪</p>
  </div>`;
}

/* ── utils ────────────────────────────────────────────────────── */
function escapeHtml(s){return (s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ── boot ─────────────────────────────────────────────────────── */
if(isHost) initHost(); else initPlayer();
</script>
</body>
</html>
