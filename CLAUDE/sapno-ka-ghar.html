<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sapno Ka Ghar — Investing for Mummies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ═══════ SAPNO KA GHAR — warm home-magazine take on the IFM palette ═══════ */
:root{
  --teal:#2a9d8f; --navy:#1a3a5c; --muted:#5a7d8a; --cream:#f7faf9;
  --mint:#bde9e4; --mint-lt:#e0f3f0;
  --gold:#c9962e; --gold-lt:#fdf3dd;
  --coral:#e76f51; --coral-lt:#fdeae4;
  --insta:#d6336c; --lim:#7048e8;
  --card:#ffffff; --line:#e3ece9;
  --shadow:0 6px 24px rgba(26,58,92,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--navy);overflow-x:hidden}
body.host-bg{background:
  radial-gradient(1200px 500px at 85% -10%, var(--mint-lt) 0%, transparent 60%),
  radial-gradient(900px 420px at -10% 110%, var(--gold-lt) 0%, transparent 55%),
  var(--cream); overflow:hidden}
body.player-bg{background:
  radial-gradient(600px 280px at 100% 0%, var(--mint-lt) 0%, transparent 60%),
  var(--cream)}
.hide{display:none!important}
h1,h2,h3,.serif{font-family:'Lora',serif}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ── buttons ── */
.btn{border:none;border-radius:14px;padding:13px 26px;font-weight:900;font-size:1.05rem;
  background:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(42,157,143,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(42,157,143,.45)}
.btn.gold{background:linear-gradient(135deg,#d9a83e,var(--gold));box-shadow:0 4px 14px rgba(201,150,46,.4)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--mint)}
.btn.lg{font-size:1.2rem;padding:16px 34px;border-radius:16px}
.btn.sm{font-size:.9rem;padding:8px 16px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}

/* ── HOST chrome ─────────────────────────────────────── */
#host{max-width:1500px;margin:0 auto;padding:14px 22px;height:100vh;display:flex;flex-direction:column}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 2px 12px}
.brandbar .l{display:flex;align-items:center;gap:12px}
.brandbar img{width:46px;height:46px;border-radius:50%;box-shadow:var(--shadow)}
.brandbar .sub{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brandbar .nm{font-family:'Lora',serif;font-weight:700;font-size:1.35rem;color:var(--navy)}
.brandbar .nm em{color:var(--teal);font-style:italic}
.livedot{font-size:.7rem;font-weight:900;letter-spacing:.1em;color:#fff;background:var(--coral);
  border-radius:999px;padding:5px 11px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.mini-qr{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:5px 10px 5px 5px;cursor:pointer;box-shadow:var(--shadow)}
.mini-qr img{width:44px;height:44px;border-radius:6px;box-shadow:none}
.mini-qr span{font-size:.66rem;font-weight:800;line-height:1.15;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.host-reset{position:fixed;top:12px;left:12px;z-index:60;background:#fff;border:1.5px solid var(--line);color:var(--muted);
  border-radius:10px;padding:6px 12px;font-weight:800;font-size:.8rem}
.host-reset:hover{color:var(--coral);border-color:var(--coral)}

/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.step{font-size:.78rem;font-weight:800;color:var(--muted);background:#fff;border:1.5px solid var(--line);
  border-radius:999px;padding:6px 13px;cursor:pointer;transition:all .15s}
.step.done{color:var(--teal);border-color:var(--mint);background:var(--mint-lt)}
.step.on{color:#fff;background:var(--navy);border-color:var(--navy)}

/* stage */
.stage{flex:1;min-height:0;background:var(--card);border:1.5px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow);padding:26px 32px;display:flex;flex-direction:column;overflow-y:auto;position:relative}
.stage .controls{position:sticky;bottom:-26px;margin:auto -32px -26px;padding:14px 32px 18px;display:flex;gap:12px;align-items:center;
  justify-content:flex-end;background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0));z-index:5}
.stage .controls .spacer{flex:1}
.eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.stage h2{font-size:clamp(1.6rem,2.6vw,2.3rem);font-weight:700;margin:4px 0 6px}
.stage .lead{font-size:1.08rem;color:var(--muted);font-weight:600;max-width:900px}
.host-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:26px;flex:1;min-height:0;align-items:start}
.panel{background:var(--cream);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px}
.panel h3{font-size:1.1rem;margin-bottom:8px}

/* gold reveal card (the Hiral moment) */
.reveal-card{background:linear-gradient(135deg,#fdf6e3,var(--gold-lt));border:2px solid #e8c97a;border-radius:18px;
  padding:20px 24px;animation:rin .5s ease;box-shadow:0 10px 30px rgba(201,150,46,.18)}
.reveal-card .rc-t{font-family:'Lora',serif;font-style:italic;font-size:clamp(1.2rem,2vw,1.6rem);color:#7c5a12;font-weight:600}
@keyframes rin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.pop{animation:rin .35s ease}

/* lobby */
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:26px;flex:1;min-height:0}
.lobby .qr-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:var(--cream);border:1.5px solid var(--line);border-radius:20px;padding:22px;cursor:pointer}
.lobby .qr-box{background:#fff;padding:14px;border-radius:16px;box-shadow:var(--shadow)}
.pin{font-family:'Lora',serif;font-size:2.4rem;font-weight:700;letter-spacing:.12em;color:var(--navy)}
.pin small{display:block;font-family:'Nunito',sans-serif;font-size:.75rem;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.lobby-right{display:flex;flex-direction:column;min-height:0}
.pl-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding:6px 2px}
.pchip{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;
  padding:6px 16px 6px 6px;font-weight:800;animation:rin .3s ease}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;color:#fff;flex:none}
.story-card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:14px}
.story-card p{font-family:'Lora',serif;font-style:italic;font-size:1.15rem;color:var(--navy);line-height:1.55}

/* shop host */
.shop-head{display:flex;align-items:center;gap:26px;margin-bottom:14px}
.timer-big{font-family:'Lora',serif;font-weight:700;font-size:clamp(3rem,7vw,5rem);color:var(--navy);min-width:170px;text-align:center;
  background:var(--cream);border:1.5px solid var(--line);border-radius:20px;padding:6px 20px}
.timer-big.warn{color:var(--coral);border-color:var(--coral);animation:pulse 1s infinite}
.feed{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.feed-item{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;
  padding:8px 14px;font-weight:700;font-size:1rem;animation:rin .3s ease}
.feed-item b{color:var(--teal)}
.feed-item.big{border-left-color:var(--coral)}
.feed-item.big b{color:var(--coral)}
.shopper-grid{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;overflow-y:auto}
.schip{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.88rem;font-weight:800;
  display:flex;align-items:center;gap:8px}
.schip .av{width:24px;height:24px;font-size:.8rem}
.schip .sp{color:var(--teal);font-weight:900}

/* score tables + bars */
.tbl{width:100%;border-collapse:collapse;font-size:1rem}
.tbl th{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:right;padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700;text-align:right}
.tbl tr:nth-child(even) td{background:#f6faf8}
.badge{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.05em;border-radius:999px;padding:3px 9px;margin-left:6px}
.badge.lux{background:var(--gold-lt);color:var(--gold)}
.badge.disc{background:var(--coral-lt);color:var(--coral)}
.badge.froze{background:#e7f0fb;color:#3b6ea5}
.badge.hoard{background:#f0e7fb;color:var(--lim)}
.badge.star{background:var(--mint-lt);color:var(--teal)}
.scorebar{display:flex;align-items:center;gap:10px;margin:10px 0}
.scorebar .k{width:170px;font-weight:800;font-size:.95rem}
.scorebar .track{flex:1;height:16px;background:var(--mint-lt);border-radius:999px;overflow:hidden}
.scorebar .fill{height:100%;border-radius:999px;background:var(--teal);transition:width .8s ease}
.scorebar .v{width:44px;text-align:right;font-weight:900}
.bignum{font-family:'Lora',serif;font-size:clamp(2.6rem,5vw,4rem);font-weight:700;color:var(--teal)}

/* feelings tally */
.feel-row{display:flex;align-items:center;gap:12px;margin:12px 0}
.feel-row .em{font-size:1.9rem;width:52px;text-align:center}
.feel-row .lbl{width:300px;font-weight:800;font-size:1.15rem}
.feel-row .track{flex:1;height:26px;background:var(--mint-lt);border-radius:999px;overflow:hidden}
.feel-row .fill{height:100%;background:var(--teal);border-radius:999px;transition:width .6s ease;min-width:0}
.feel-row .n{width:40px;font-weight:900;font-size:1.2rem;text-align:right}

/* compare cards (DIY vs designer / neighbour) */
.vs-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch;margin:14px 0}
.vs-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px;text-align:center}
.vs-card.win{border-color:var(--teal);box-shadow:0 8px 26px rgba(42,157,143,.18)}
.vs-card.gold{border-color:#e8c97a;background:linear-gradient(160deg,#fffdf7,var(--gold-lt))}
.vs-mid{display:grid;place-items:center;font-family:'Lora',serif;font-weight:700;font-size:1.4rem;color:var(--muted)}
.vs-score{font-family:'Lora',serif;font-size:3rem;font-weight:700;color:var(--navy)}
.vs-card .cap{font-size:.75rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* event cards */
.event-hero{display:flex;gap:24px;align-items:center;background:var(--cream);border:1.5px solid var(--line);
  border-radius:20px;padding:22px 26px;margin:12px 0}
.event-hero .em{font-size:4.2rem}
.event-hero h3{font-size:1.7rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.split .half{border-radius:16px;padding:16px 18px;border:2px solid var(--line);background:#fff}
.split .half.good{border-color:var(--mint);background:var(--mint-lt)}
.split .half.bad{border-color:#f2c4b5;background:var(--coral-lt)}
.split .half h4{font-size:1.02rem;margin-bottom:6px}
.split .half p{font-weight:600;font-size:.98rem;color:#33566e}

/* sip chart */
.chart-wrap{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px}
.legend{display:flex;gap:18px;font-size:.85rem;font-weight:800;margin-top:8px;flex-wrap:wrap}
.legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}

/* mapping reveal */
.map-row{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:10px;background:#fff;
  border:1.5px solid var(--line);border-radius:14px;padding:12px 18px;margin:8px 0;animation:rin .4s ease}
.map-row .home{font-weight:800;font-size:1.12rem}
.map-row .arrow{text-align:center;font-size:1.3rem;color:var(--gold)}
.map-row .inv{font-weight:900;font-size:1.12rem;color:var(--teal);text-align:right}
.map-row .sub{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}

/* finale */
.finale-hero{text-align:center;padding:10px 0 4px}
.finale-hero h2{font-size:clamp(1.8rem,3.4vw,2.8rem)}
.closing{max-width:880px;margin:10px auto;font-family:'Lora',serif;font-style:italic;font-size:clamp(1.15rem,1.9vw,1.5rem);
  line-height:1.6;color:#54432a;text-align:center;background:linear-gradient(135deg,#fdf6e3,var(--gold-lt));
  border:2px solid #e8c97a;border-radius:20px;padding:22px 30px}
.award{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--mint);border-radius:16px;
  padding:10px 20px;margin:6px;font-weight:800;font-size:1.05rem}

/* QR modal */
#qrModal{position:fixed;inset:0;background:rgba(26,58,92,.9);display:none;z-index:100;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer}
#qrModal.show{display:flex}
.qm-box{background:#fff;padding:22px;border-radius:24px}
.qm-pin{color:#fff;font-family:'Lora',serif;font-size:3rem;font-weight:700;letter-spacing:.14em;text-align:center}
.qm-pin small{display:block;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.qm-hint{color:#cfe6e2;font-weight:700}

/* confetti */
.conf{position:fixed;top:-14px;font-size:1.3rem;z-index:200;animation:confFall linear forwards;pointer-events:none}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg)}}

/* ── PLAYER ──────────────────────────────────────────── */
#player{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.player-scr{flex:1;display:flex;flex-direction:column;padding:12px 14px 90px}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px 12px;position:sticky;top:0;
  background:linear-gradient(to bottom,var(--cream) 82%,rgba(247,250,249,0));z-index:20}
.p-top .who{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.02rem}
.p-top .cash{font-weight:900;color:var(--teal);font-size:1.05rem;background:#fff;border:1.5px solid var(--line);
  border-radius:999px;padding:6px 14px;box-shadow:var(--shadow)}
.p-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px 8px}
.p-status{font-family:'Lora',serif;font-size:1.9rem;font-weight:700}
.p-sub{color:var(--muted);font-weight:700;font-size:1.02rem;max-width:420px}
.p-input{width:100%;max-width:340px;border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:1.15rem;
  font-weight:800;text-align:center;background:#fff;color:var(--navy);outline:none}
.p-input:focus{border-color:var(--teal)}
.p-card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin:8px 0}

/* player shop */
.p-shop-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.p-budget{font-weight:900;font-size:1.3rem;color:var(--navy)}
.p-budget small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.p-timer{font-family:'Lora',serif;font-weight:700;font-size:1.7rem;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:4px 14px;min-width:74px;text-align:center}
.p-timer.warn{color:var(--coral);border-color:var(--coral);animation:pulse 1s infinite}
.cat-row{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:56px;
  background:var(--cream);z-index:19}
.cat-row::-webkit-scrollbar{display:none}
.cat-chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
  font-weight:800;font-size:.85rem;color:var(--muted)}
.cat-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;position:relative;
  display:flex;flex-direction:column;gap:3px}
.icard.owned{border-color:var(--teal);background:var(--mint-lt)}
.icard .iem{font-size:2rem;line-height:1.15}
.icard .inm{font-weight:800;font-size:.92rem;line-height:1.2}
.icard .ibr{font-size:.72rem;font-weight:700;color:var(--muted)}
.icard .ipr{font-weight:900;font-size:1.02rem;margin-top:2px}
.icard .ipr s{color:var(--muted);font-weight:600;font-size:.8rem;margin-left:5px}
.icard .ist{font-size:.76rem;font-weight:800;color:#b98a00}
.icard .irv{font-size:.72rem;font-weight:600;color:var(--muted);font-style:italic;line-height:1.25}
.ribbon{position:absolute;top:-8px;right:8px;font-size:.62rem;font-weight:900;letter-spacing:.05em;color:#fff;
  border-radius:999px;padding:3px 9px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.ribbon.SALE{background:var(--coral)} .ribbon.BEST{background:#e8a512} .ribbon.INSTA{background:var(--insta)} .ribbon.LIM{background:var(--lim)}
.ibuy{margin-top:6px;border:none;border-radius:10px;padding:8px;font-weight:900;font-size:.88rem;background:var(--navy);color:#fff}
.ibuy.own{background:var(--teal)}
.ibuy:disabled{background:#cdd9d6;color:#fff}
.cart-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.cart-inner{pointer-events:auto;width:100%;max-width:560px;margin:0 14px 12px;background:var(--navy);color:#fff;border-radius:18px;
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 30px rgba(26,58,92,.4);font-weight:800}
.cart-inner .left small{display:block;font-size:.68rem;opacity:.75;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.p-tabs{display:flex;gap:8px;margin-bottom:10px}
.p-tab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:900;color:var(--muted)}
.p-tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.room-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;margin:8px 0}
.room-card h4{font-size:.95rem;margin-bottom:6px}
.room-card .ritem{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;padding:3px 0;gap:8px}
.room-card .ritem .rt{color:var(--muted);font-weight:800;white-space:nowrap}
.empty-room{color:var(--muted);font-weight:700;font-style:italic;font-size:.88rem}

/* player choice chips (questions, feelings, votes) */
.choice-grid{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin:0 auto}
.choice{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 18px;font-weight:800;font-size:1.05rem;
  text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s;color:var(--navy)}
.choice .cem{font-size:1.6rem}
.choice.on{border-color:var(--teal);background:var(--mint-lt);box-shadow:0 6px 18px rgba(42,157,143,.2)}
.choice:disabled{opacity:.55}
.choice-row{display:flex;gap:10px;width:100%;max-width:420px;margin:0 auto}
.choice-row .choice{flex:1;flex-direction:column;text-align:center;gap:4px;padding:12px 8px}
.q-step{font-size:.75rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}

.miss-list span{display:inline-block;background:#fff;border-radius:999px;padding:4px 12px;margin:3px 4px 3px 0;font-weight:800;font-size:.85rem}

.designer-chip{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fdf6e3,var(--gold-lt));

/* noise machine + recommendations */
.noise-toast{position:fixed;top:10px;left:50%;transform:translate(-50%,-130%);max-width:520px;width:calc(100% - 40px);

   A home is judged as a WHOLE: Comfort, Functionality, Balance,
   Budget Discipline. (Exactly how a portfolio is judged.) */
function scoreHome(ids,extraSpent){
  const items=ids.map(i=>ITEMS[i]).filter(Boolean);
  const spent=items.reduce((s,it)=>s+it.price,0)+(extraSpent||0);
  const byCat={};
  items.forEach(it=>{ (byCat[it.cat]=byCat[it.cat]||[]).push(it); });
  // Functionality — does the home actually work? (essentials coverage)
  const essOwned=ESSENTIALS.filter(c=>byCat[c]&&byCat[c].length);
  const func=Math.round(essOwned.length/ESSENTIALS.length*100);
  // Comfort — quality where it matters: sleep, sit, cool, soften
  const comfortCats=['bed','mattress','sofa','cool','curtain'];
  let cq=0;
  comfortCats.forEach(c=>{ if(byCat[c]) cq+=Math.max(...byCat[c].map(i=>i.q)); });
  const comfort=Math.round(cq/50*100);
  // Balance — no single hero item, no hoarding, breadth + softness
  let bal=100; const notes=[];
  if(items.some(it=>it.price>BUDGET*0.3)){ bal-=25; notes.push('one item swallowed over 30% of the budget'); }
  if(spent>0 && Object.keys(byCat).some(c=>byCat[c].reduce((s,i)=>s+i.price,0)/spent>0.5)){ bal-=15; notes.push('half the money went into a single category'); }
  if(Object.keys(byCat).length<6){ bal-=20; notes.push('too few corners of the home covered'); }
  if(!SOFT_CATS.some(c=>byCat[c])){ bal-=10; notes.push('no soft touches — the house feels bare'); }
  if(Object.keys(byCat).some(c=>byCat[c].length>5)){ bal-=15; notes.push('hoarded one category'); }
  bal=Math.max(0,bal);
  // Budget Discipline — use the money, keep a buffer
  const s=spent/BUDGET*100; let bud;
  if(s>=55&&s<=92) bud=100;
  else if(s<55) bud=Math.max(0,Math.round(100-(55-s)*2));
  else bud=Math.max(0,Math.round(100-(s-92)*5));
  const total=Math.round((comfort+func+bal+bud)/4);
  return {comfort,func,bal,bud,total,spent,notes,
    missing:ESSENTIALS.filter(c=>!essOwned.includes(c))};
}
function archetype(p){
  if(!p.r1) return null;
  const items=(p.r1.items||[]).map(i=>ITEMS[i]).filter(Boolean);
  if(items.some(it=>it.price>=300000)) return ['lux','💎 Luxury splurge'];
  const sale=items.filter(it=>it.tag==='SALE').length;
  if(sale>=4) return ['disc','🏷️ Discount hunter'];
  if(p.r1.spent<BUDGET*0.4) return ['froze','🥶 Froze up'];
  const byCat={}; items.forEach(it=>byCat[it.cat]=(byCat[it.cat]||0)+1);
  if(Object.values(byCat).some(n=>n>5)) return ['hoard','📦 Category hoarder'];
  return null;
}

/* ── incoming player actions ────────────────────────── */
function hostHandleAction(a){
  if(!a||!a.type)return;
  const p=state.players[a.id];
  if(a.type==='join'){
    if(!state.players[a.id]){
      const n=Object.keys(state.players).length;
      state.players[a.id]={id:a.id,name:(a.name||'Guest').slice(0,16),
        av:AV_EMOJI[n%AV_EMOJI.length],color:AV_COLOR[n%AV_COLOR.length],
        items:[],r1:null,feel:null,hired:null,ans:null,designedIds:null,decisions:0,dpick:null,
        sub:null,sipMode:null,sipCash:0,upgrades:[],nbVote:null,premium:false};
    }else{ state.players[a.id].name=(a.name||'').slice(0,16)||state.players[a.id].name; }
    save(); if(state.phase==='lobby'||state.phase==='shop') renderHost();
  }
  else if(a.type==='buy'){
    if(!p||!shopOpen())return;
    const it=ITEMS[a.item]; if(!it||p.items.includes(it.id))return;
    if(spentOf(p)+it.price>BUDGET)return;
    p.items.push(it.id); p.decisions=(p.decisions||0)+1;
    state.feed.unshift({n:p.name,item:it.name,price:it.price,big:it.price>=150000,t:Date.now()});
    state.feed=state.feed.slice(0,9);
    save(); renderHostShopLive();
  }
  else if(a.type==='ret'){
    if(!p||!shopOpen())return;
    p.items=p.items.filter(i=>i!==a.item); p.decisions=(p.decisions||0)+1;
    save(); renderHostShopLive();
  }
  else if(a.type==='dpick'){
    if(!p||state.phase!=='pick'||state.dpickReveal)return;
    if(DESIGNERS[a.v]) p.dpick=a.v;
    save(); renderHost();
  }
  else if(a.type==='feel'){
    if(!p||state.phase!=='feel')return;
    if(FEELINGS.some(f=>f[0]===a.k)) p.feel=a.k;
    save(); renderHost();
  }
  else if(a.type==='hire'){
    if(!p||state.phase!=='designer'||p.hired!=null)return;
    if(a.yes){ p.hired=true; }             // answers arrive next
    else{ p.hired=false;                    // brave DIY soul — keeps the round-1 home
      p.sub=p.r1?{comfort:p.r1.comfort,func:p.r1.func,bal:p.r1.bal,bud:p.r1.bud}:{comfort:0,func:0,bal:0,bud:0}; }
    save(); renderHost();
  }
  else if(a.type==='answers'){
    if(!p||state.phase!=='designer'||!p.hired||p.designedIds)return;
    p.ans={budget:a.budget==='full'?'full':'buffer',kids:!!a.kids,guests:!!a.guests,
      style:DESIGNER_PICKS[a.style]?a.style:'modern'};
    const home=buildDesignerHome(p.ans);
    p.designedIds=home.ids; p.items=home.ids.slice();
    // designers are consistently GOOD, not perfect: land each home at 82–90
    let h=0; for(const ch of a.id) h=(h*31+ch.charCodeAt(0))>>>0;
    const target=82+(h%9), f=Math.min(1,target/Math.max(1,home.sc.total));
    p.sub={comfort:Math.round(home.sc.comfort*f),func:Math.round(home.sc.func*f),
           bal:Math.round(home.sc.bal*f),bud:Math.round(home.sc.bud*f)};
    p.designedSpent=home.sc.spent;
    save(); renderHost();
  }
  else if(a.type==='sipmode'){
    if(!p||state.phase!=='sip'||state.sip.month>0||p.sipMode)return;
    if(SIP_MODES[a.m]) p.sipMode=a.m;
    save(); renderHost();
  }
  else if(a.type==='nbvote'){
    if(!p||state.phase!=='neighbour'||state.nbReveal)return;
    p.nbVote=(a.v==='regret'?'regret':'whole');
    save(); renderHost();
  }
}

function goPhase(ph){ if(!PHASE_ORDER.includes(ph))return; state.phase=ph; saveNow(); renderHost(); }
function hostStartShop(){
  state.phase='shop'; state.shopStart=Date.now(); state.shopDone=false; state.feed=[];
  plist().forEach(p=>{p.items=[];p.r1=null;});
  saveNow(); renderHost();
}
let _lastLeft=null;
function hostTick(){
  if(!state)return;
  if(state.phase==='shop'&&state.shopStart&&!state.shopDone){
    const left=Math.max(0,SHOP_SECS-Math.floor((Date.now()-state.shopStart)/1000));
    if(left!==_lastLeft){ _lastLeft=left; const el=document.getElementById('hostTimer');
      if(el){ el.textContent=fmtTime(left); el.classList.toggle('warn',left<=15); } }
    const nb=document.getElementById('noiseBar');
    if(nb){ const ni=Math.floor((Date.now()-state.shopStart)/15000);
      nb.textContent=ni>0?NOISE[(ni-1)%NOISE.length]:'📱 …the noise is about to begin…'; }
    if(left<=0){ hostEndShop(); }
  }
}
function hostEndShop(){
  if(state.shopDone)return;
  state.shopDone=true;
  plist().forEach(p=>{
    const sc=scoreHome(p.items);
    p.r1={...sc,items:p.items.slice()};
    p.sub={comfort:sc.comfort,func:sc.func,bal:sc.bal,bud:sc.bud};
  });
  state.phase='score1'; saveNow(); renderHost();
}
function hostToFeel(){ goPhase('feel'); }
function hostToPick(){ goPhase('pick'); }
function hostPickReveal(){ state.dpickReveal=true; saveNow(); renderHost(); }
function hostToDesigner(){ goPhase('designer'); }
function hostDesignerReveal(){ state.designerReveal=!state.designerReveal; saveNow(); renderHost(); }
function hostToEvents(){ state.phase='events'; state.eventIdx=-1; state.eventReveal=false; saveNow(); renderHost(); }
function hostNextEvent(){
  if(state.eventIdx>=0&&!state.eventReveal){ state.eventReveal=true; // second click reveals impact
    const ev=EVENTS[state.eventIdx];
    plist().forEach(p=>{ if(p.sub) ev.apply(p,!!p.hired); });
    saveNow(); renderHost(); return; }
  if(state.eventIdx<EVENTS.length-1){ state.eventIdx++; state.eventReveal=false; saveNow(); renderHost(); }
  else goPhase('sip');
}
function sipCohort(k){ const ps=plist().filter(p=>p.sub);
  return k==='ignore'?ps.filter(p=>p.sipMode==='ignore'||!p.sipMode):ps.filter(p=>p.sipMode===k); }
function sipSnapshot(){
  const avgBy=k=>{const l=sipCohort(k); return l.length?Math.round(l.reduce((s,p)=>s+curScore(p),0)/l.length):null;};
  return {designer:avgBy('designer'),splurge:avgBy('splurge'),ignore:avgBy('ignore')};
}
function hostSipMonth(){ hostSipMonthCore(); saveNow(); renderHost(); }
function hostSipAll(){ while(state.sip.month<state.sip.max) hostSipMonthCore(); saveNow(); renderHost(); }
function hostSipMonthCore(){
  const m=state.sip; if(m.month>=m.max)return;
  if(!state.sipHist) state.sipHist=[sipSnapshot()];   // month-0 baseline
  m.month++;
  plist().forEach(p=>{
    if(!p.sub)return;
    if(p.sipMode==='designer'){
      // the designer fixes the weakest corner first — steady, boring, effective
      const keys=['comfort','func','bal','bud'];
      keys.sort((a,b)=>p.sub[a]-p.sub[b]);
      p.sub[keys[0]]=Math.min(96,p.sub[keys[0]]+3);
      p.sub[keys[1]]=Math.min(96,p.sub[keys[1]]+1);
      p.upgrades.push(SIP_UPGRADES[(m.month-1)%SIP_UPGRADES.length]);
    }else if(p.sipMode==='splurge'){
      const w=SPLURGE_WOBBLE[(m.month-1)%SPLURGE_WOBBLE.length];
      p.sub.comfort=Math.max(0,Math.min(100,p.sub.comfort+w));
      p.sub.bud=Math.max(0,p.sub.bud-1);   // money out, plan none
      p.upgrades.push(SPLURGE_BUYS[(m.month-1)%SPLURGE_BUYS.length]);
    }else{
      p.sipCash+=SIP_AMT;                   // piles up in the cupboard
    }
  });
  state.sipHist.push(sipSnapshot());
}

    plist().forEach(p=>{ if(p.hired&&p.sub){ p.premium=true;

}

function confettiBurst(){
  const ems=['🎉','🏡','✨','🪄','💚','🧡'];
  for(let i=0;i<44;i++){ const d=document.createElement('div'); d.className='conf';
    d.textContent=ems[i%ems.length];
    d.style.left=(Math.random()*100)+'vw';

function stepper(active){
  const steps=[['lobby','1 · Lobby'],['shop','2 · Shopping Rush'],['score1','3 · Scores'],['feel','4 · How did it feel?'],
    ['pick','5 · Pick a Designer'],['designer','6 · The Designer'],['events','7 · Life Happens'],['sip','8 · Monthly ₹50k'],

  return `<div class="steps">${steps.map(s=>{

    return `<button class="step ${si<ai?'done':si===ai?'on':''}" onclick="goPhase('${s[0]}')">${s[1]}</button>`;}).join('')}</div>`;

function sipChart(){
  const H=state.sipHist||[]; if(!H.length)return '<p class="lead">The journey chart appears from month 1…</p>';
  const W=640,Ht=250,pad=34;
  const x=i=>pad+i*(W-2*pad)/SIP_MONTHS, y=v=>Ht-pad-(v/100)*(Ht-2*pad);
  const line=(key,color)=>{ if(!H.some(h=>h[key]!=null)) return '';   // empty cohort → no line
    const pts=H.map((h,i)=>`${x(i)},${y(h[key]!=null?h[key]:0)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round"/>`;};
  return `<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;height:auto">
    ${[0,25,50,75,100].map(v=>`<line x1="${pad}" y1="${y(v)}" x2="${W-pad}" y2="${y(v)}" stroke="#e3ece9"/><text x="${pad-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5a7d8a" font-weight="700">${v}</text>`).join('')}
    ${line('designer','#2a9d8f')}${line('splurge','#e76f51')}${line('ignore','#5a7d8a')}
    <text x="${W-pad}" y="${Ht-8}" text-anchor="end" font-size="11" fill="#5a7d8a" font-weight="700">months →</text></svg>`;
}

let myName=localStorage.getItem('skg_name')||'';

let pendingOps=[];   // optimistic cart ops awaiting server echo

async function initPlayer(){
  document.getElementById('player').classList.remove('hide');
  document.body.classList.add('player-bg');
  if(!ROOM){document.getElementById('player').innerHTML='<div class="player-scr"><div class="p-center"><div style="font-size:3rem">🏡</div><h2 class="serif">Scan the QR on the big screen</h2><p class="p-sub">or open the link with a game PIN to join Sapno Ka Ghar.</p></div></div>';return;}
  joinChannel();
  try{const {data}=await db.from('games').select('state').eq('room_code',ROOM).single(); if(data&&data.state)state=data.state;}catch(e){}
  renderPlayer();
  // self-heal poll — recover any dropped realtime event within ~2.5s
  setInterval(async()=>{ if(!me())return;
    try{const {data}=await db.from('games').select('state').eq('room_code',ROOM).single();
      if(data&&data.state&&data.state.updatedAt!==state.updatedAt){state=data.state;renderPlayer();}}catch(e){}
  },2500);
  document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState!=='visible')return;
    try{const {data}=await db.from('games').select('state').eq('room_code',ROOM).single();
      if(data&&data.state){state=data.state;renderPlayer();}}catch(e){} });
  setInterval(playerTick,500);
}
function me(){return state&&state.players?state.players[MY_ID]:null;}
function doJoin(){

}
let _pLastLeft=null;
function playerTick(){
  if(!state||state.phase!=='shop'||!state.shopStart)return;
  const left=Math.max(0,SHOP_SECS-Math.floor((Date.now()-state.shopStart)/1000));
  if(left!==_pLastLeft){ _pLastLeft=left;
    const el=document.getElementById('pTimer');
    if(el){ el.textContent=fmtTime(left); el.classList.toggle('warn',left<=15); }
    if(left===0) renderPlayer();   // lock the shop
  }
  // the Noise Machine — a push notification every 15 seconds
  if(shopLive()){
    const ni=Math.floor((Date.now()-state.shopStart)/15000);
    if(ni>_lastNoiseIdx&&ni>=1){ _lastNoiseIdx=ni; showNoise(NOISE[(ni-1)%NOISE.length]); }
  }
}
let _lastNoiseIdx=0;
function showNoise(txt){
  let t=document.getElementById('noiseToast');
  if(!t){ t=document.createElement('div'); t.id='noiseToast'; t.className='noise-toast'; document.body.appendChild(t); }
  t.textContent=txt; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),5500);
}

/* optimistic cart */
function effItems(p){
  let items=(p.items||[]).slice();
  const now=Date.now();
  pendingOps=pendingOps.filter(o=>now-o.t<4000&&!(o.op==='buy'?items.includes(o.id):!items.includes(o.id)));
  pendingOps.forEach(o=>{ if(o.op==='buy'&&!items.includes(o.id))items.push(o.id);
    if(o.op==='ret')items=items.filter(i=>i!==o.id); });
  return items;
}
function pBuy(id){
  const p=me(); if(!p||!shopLive())return;
  const items=effItems(p); const it=ITEMS[id];
  if(items.includes(id))return;
  if(items.reduce((s,i)=>s+ITEMS[i].price,0)+it.price>BUDGET){ flashBudget(); return; }
  pendingOps.push({op:'buy',id,t:Date.now()});
  sendAction({type:'buy',id:MY_ID,item:id});
  renderPlayer();
}
function pRet(id){
  const p=me(); if(!p||!shopLive())return;
  pendingOps.push({op:'ret',id,t:Date.now()});
  sendAction({type:'ret',item:id,id:MY_ID});
  renderPlayer();
}
function flashBudget(){ const el=document.getElementById('pBudget');
  if(el){ el.style.color='var(--coral)'; setTimeout(()=>{el.style.color='';},600); } }
function shopLive(){ return state.phase==='shop'&&state.shopStart&&!state.shopDone
  &&(Date.now()-state.shopStart)<SHOP_SECS*1000; }
function setTab(t){shopTab=t;renderPlayer();}
function setCat(c){shopCat=c;renderPlayer();}

/* ── render ── */
function renderPlayer(){
  const el=document.getElementById('player');
  if(!state){el.innerHTML='<div class="player-scr"><div class="p-center"><p class="p-sub">Connecting…</p></div></div>';return;}
  const p=me();
  if(!p){
    if(wasJoined){ wasJoined=false; joinSent=false; myFeel=null;myVote=null;mySip=null;myPick=null;ansStep=0;ansSent=false;hireChoice=null;
      myAns={budget:null,kids:null,guests:null,style:null}; pendingOps=[]; }
    el.innerHTML=joinSent?waitingScr():joinScr(); return;
  }
  wasJoined=true;
  const ph=state.phase;
  let inner='';
  if(ph==='lobby') inner=pLobby(p);
  else if(ph==='shop') inner=pShop(p);
  else if(ph==='score1') inner=pScore1(p);
  else if(ph==='feel') inner=pFeel(p);
  else if(ph==='pick') inner=pPick(p);
  else if(ph==='designer') inner=pDesigner(p);
  else if(ph==='events') inner=pEvents(p);
  else if(ph==='sip') inner=pSip(p);
  else if(ph==='pool') inner=pPool(p);
  else if(ph==='neighbour') inner=pNeighbour(p);
  else if(ph==='reveal') inner=pReveal(p);
  else if(ph==='finale') inner=pFinale(p);
  el.innerHTML=`<div class="player-scr">${pTop(p)}${inner}</div>`;
}

/* SHOP */
function pShop(p){
  if(!shopLive()){
    return `<div class="p-center"><div style="font-size:2.6rem">⏰</div>
      <div class="p-status">Time's up!</div>
      <p class="p-sub">Pens down, wallets away. Look at the big screen — the scores are coming.</p></div>`;
  }
  const items=effItems(p);
  const spent=items.reduce((s,i)=>s+ITEMS[i].price,0);
  const left=Math.max(0,SHOP_SECS-Math.floor((Date.now()-state.shopStart)/1000));
  const cats=['all',...Object.keys(CATS)];
  let body='';
  if(shopTab==='home'){ body=homeRooms(items,'Tap items in the catalogue to fill these rooms.'); }
  else{
    const list=ALL_IDS.filter(id=>shopCat==='all'||ITEMS[id].cat===shopCat);
    let recs='';
    if(items.length){ // confirmation bias: the app feeds you more of what you bought
      const last=ITEMS[items[items.length-1]];
      const ownBrands=new Set(items.map(i=>ITEMS[i].brand));
      const rl=ALL_IDS.filter(id=>!items.includes(id)&&ownBrands.has(ITEMS[id].brand)).slice(0,4);
      if(rl.length) recs=`<div class="rec-head">🎯 Recommended for you · because you bought ${escapeHtml(last.name)}</div>
        <div class="item-grid" style="margin-bottom:10px">${rl.map(id=>icard(ITEMS[id],false)).join('')}</div>`;
    }
    body=recs+`<div class="item-grid">${list.map(id=>icard(ITEMS[id],items.includes(id))).join('')}</div>`;
  }
  return `
  <div class="p-shop-head">
    <div class="p-budget" id="pBudgetBig">${fmt(BUDGET-spent)}<small>left of ₹10,00,000</small></div>
    <div class="p-timer num ${left<=15?'warn':''}" id="pTimer">${fmtTime(left)}</div>
  </div>
  <div class="p-tabs">
    <button class="p-tab ${shopTab==='cat'?'on':''}" onclick="setTab('cat')">🛒 Catalogue</button>
    <button class="p-tab ${shopTab==='home'?'on':''}" onclick="setTab('home')">🏡 My home (${items.length})</button>
  </div>
  ${shopTab==='cat'?`<div class="cat-row">${cats.map(c=>`<button class="cat-chip ${shopCat===c?'on':''}" onclick="setCat('${c}')">${c==='all'?'✨ All':CATS[c].em+' '+CATS[c].n}</button>`).join('')}</div>`:''}
  ${body}
  <div class="cart-bar"><div class="cart-inner">
    <div class="left"><small>Spent so far</small>${fmt(spent)}</div>
    <div>${items.length} item${items.length===1?'':'s'} 🛍️</div>
  </div></div>`;
}
function stars(v){ return '★'.repeat(Math.round(v))+`<span style="color:#d8e2ea">${'★'.repeat(5-Math.round(v))}</span> <b>${v.toFixed(1)}</b>`; }
function icard(it,owned){
  const wasPrice=it.tag==='SALE'?`<s>${fmt(Math.round(it.price*1.6))}</s>`:'';
  return `<div class="icard ${owned?'owned':''}">
    ${it.tag?`<div class="ribbon ${it.tag}">${{SALE:'🔥 20% OFF TODAY',BEST:'🏅 BEST SELLER',INSTA:'📸 INSTA FAVE',LIM:'⏳ LIMITED STOCK'}[it.tag]}</div>`:''}
    <div class="iem">${CATS[it.cat].em}</div>
    <div class="inm">${escapeHtml(it.name)}</div>
    <div class="ibr">${escapeHtml(it.brand)}</div>
    <div class="ist">${stars(it.stars)}</div>
    <div class="ipr">${fmt(it.price)} ${wasPrice}</div>
    <div class="irv">“${escapeHtml(it.rev)}”</div>
    <button class="ibuy ${owned?'own':''}" onclick="${owned?`pRet('${it.id}')`:`pBuy('${it.id}')`}">${owned?'✓ In your home · tap to return':'Add to home'}</button>
  </div>`;
}
function homeRooms(ids,emptyMsg){
  const byRoom={};
  ids.forEach(i=>{const it=ITEMS[i]; if(!it)return; (byRoom[CATS[it.cat].room]=byRoom[CATS[it.cat].room]||[]).push(it);});
  const rooms=['Living Room','Bedroom','Kitchen','Dining','Study Corner','Kids Corner','Balcony','All Rooms'];
  if(!ids.length) return `<div class="p-card"><p class="empty-room">${emptyMsg||'Nothing here yet.'}</p></div>`;
  return rooms.filter(r=>byRoom[r]).map(r=>`<div class="room-card"><h4>${r}</h4>
    ${byRoom[r].map(it=>`<div class="ritem"><span>${CATS[it.cat].em} ${escapeHtml(it.name)}</span><span class="rt">${fmtMoney(it.price)}</span></div>`).join('')}
  </div>`).join('');
}

/* SCORE 1 */
function scoreBars(sc){
  const rows=[['😌 Comfort',sc.comfort],['🔧 Functionality',sc.func],['⚖️ Balance',sc.bal],['💰 Budget Discipline',sc.bud]];
  return rows.map(r=>`<div class="scorebar"><div class="k">${r[0]}</div>
    <div class="track"><div class="fill" style="width:${r[1]}%;background:${r[1]>=60?'var(--teal)':'var(--coral)'}"></div></div>
    <div class="v num">${r[1]}</div></div>`).join('');
}
function pScore1(p){
  if(!p.r1) return `<div class="p-center"><p class="p-sub">Scoring your home…</p></div>`;
  const missing=p.r1.missing.map(c=>`<span>${CATS[c].em} ${CATS[c].n}</span>`).join('');
  // regret: the beauties you didn't buy
  const almost=ALL_IDS.filter(id=>!p.r1.items.includes(id)&&(ITEMS[id].tag==='INSTA'||ITEMS[id].tag==='LIM'||ITEMS[id].stars>=4.6))
    .sort((a,b)=>ITEMS[b].price-ITEMS[a].price).slice(0,4);
  // opportunity cost: what the hero item ate
  const big=p.r1.items.map(i=>ITEMS[i]).filter(it=>it.price>=250000).sort((a,b)=>b.price-a.price)[0];
  const oppList=[]; if(big){ let sum=0;
    p.r1.missing.forEach(c=>{ const cand=ALL_IDS.map(i=>ITEMS[i]).filter(it=>it.cat===c&&it.q>=7).sort((a,b)=>a.price-b.price)[0];
      if(cand&&sum+cand.price<=big.price){ oppList.push(cand); sum+=cand.price; } }); }
  // confirmation bias: did the app play you?
  const bc={}; p.r1.items.forEach(i=>{const b=ITEMS[i].brand; bc[b]=(bc[b]||0)+1;});
  const echoBrand=Object.keys(bc).find(b=>bc[b]>=2);
  return `<div class="p-score-hero">
      <div class="eyebrow">Your home score</div>
      <div class="bignum" style="color:${p.r1.total>=60?'var(--teal)':'var(--coral)'}">${p.r1.total}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div>
      <p class="p-sub">You spent ${fmt(p.r1.spent)} on ${p.r1.items.length} items</p>
    </div>
    <div class="p-card">${scoreBars(p.r1)}</div>
    ${p.r1.notes.length?`<div class="miss-list"><h4>What pulled you down</h4><p style="font-weight:700;font-size:.9rem">${p.r1.notes.map(n=>'• '+n).join('<br>')}</p></div>`:''}
    ${missing?`<div class="miss-list"><h4>Essentials your home is missing</h4>${missing}</div>`:''}
    ${big&&oppList.length?`<div class="miss-list"><h4>💸 What the ${escapeHtml(big.name)} really cost you</h4>
      <p style="font-weight:700;font-size:.9rem">For the same ${fmt(big.price)} you could have had:</p>
      ${oppList.map(it=>`<span>${CATS[it.cat].em} ${escapeHtml(it.name)} · ${fmtMoney(it.price)}</span>`).join('')}
      <p style="font-weight:700;font-size:.85rem;margin-top:4px;color:var(--muted)">One showpiece = many missing rooms. (In investing: 60% in one stock = everything else starves.)</p></div>`:''}
    ${echoBrand?`<div class="p-card"><p style="font-weight:700">😏 Notice how the app kept recommending more <b>${escapeHtml(echoBrand)}</b> once you bought one? That's <b>confirmation bias</b> — every matching ad made you feel righter. Apps do it. So do stock tips.</p></div>`:''}
    ${almost.length?`<div class="p-card"><h4 style="margin-bottom:6px">😩 You almost bought…</h4>
      ${almost.map(id=>`<div class="ritem" style="display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;padding:3px 0"><span>${CATS[ITEMS[id].cat].em} ${escapeHtml(ITEMS[id].name)} ★${ITEMS[id].stars.toFixed(1)}</span><span style="color:var(--muted)">${fmtMoney(ITEMS[id].price)}</span></div>`).join('')}
      <p style="font-weight:700;font-size:.85rem;margin-top:6px;color:var(--muted)">Feel that little “damn…”? Nobody buys everything — every investor misses some winners. A good home doesn't need every beautiful thing.</p></div>`:''}
    ${homeRooms(p.r1.items)}`;
}

/* FEEL */
function pFeel(p){
  const sel=p.feel||myFeel;
  return `<div style="padding-top:14px">
    <div class="p-q">How did that feel?</div>
    <div class="choice-grid">
      ${FEELINGS.map(f=>`<button class="choice ${sel===f[0]?'on':''}" onclick="pSendFeel('${f[0]}')">
        <span class="cem">${f[1]}</span>${f[2]}</button>`).join('')}
    </div>
    ${sel?`<p class="p-sub" style="text-align:center;margin-top:14px">Noted. Look at the big screen 👀</p>`:''}
  </div>`;
}
function pSendFeel(k){ myFeel=k; sendAction({type:'feel',id:MY_ID,k}); renderPlayer(); }

/* PICK A DESIGNER */
function pPick(p){
  const sel=p.dpick||myPick;
  if(state.dpickReveal){
    const d=sel?DESIGNERS[sel]:null;
    return `<div class="p-center">
      <div style="font-size:2.6rem">${d?d.em:'🤷'}</div>
      ${d?`<div class="p-status">${d.name}</div>
      <div class="${sel==='b'?'upg':'miss-list'}" style="max-width:400px"><p style="font-weight:700">${d.outcome}</p></div>`:'<p class="p-sub">You never picked!</p>'}
      <p class="p-sub">${sel==='b'?'Great instincts. Boring wins. 🏆':'No shame — most people fall for it once. Everyone gets a do-over with Sharma & Associates.'}</p></div>`;
  }
  return `<div style="padding-top:14px">
    <div class="p-q">Three designers want the job.<br>Who gets YOUR home?</div>
    <div class="choice-grid">
      ${Object.entries(DESIGNERS).map(([k,d])=>`<button class="choice ${sel===k?'on':''}" onclick="pSendPick('${k}')">
        <span class="cem">${d.em}</span><span><b>${d.name}</b> · ${d.fee}<br><small style="font-weight:700;color:var(--muted)">${d.pitch}</small></span></button>`).join('')}
    </div>
    ${sel?'<p class="p-sub" style="text-align:center;margin-top:12px">Locked in — watch the big screen 👀</p>':''}</div>`;
}
function pSendPick(k){ myPick=k; sendAction({type:'dpick',id:MY_ID,v:k}); renderPlayer(); }

/* DESIGNER */
function pDesigner(p){
  if(p.hired==null&&hireChoice==null){
    return `<div class="p-center">
      <div style="font-size:3rem">🧑‍🎨</div>
      <h2 class="serif" style="font-size:1.6rem">An Interior Designer offers to help</h2>
      <p class="p-sub">“I'll ask you <b>4 quick questions</b> and design your entire home — balanced, practical, within budget. My fee: <b>₹10,000</b> (1% of your budget).”</p>
      <div class="choice-grid">
        <button class="choice" onclick="pHire(true)"><span class="cem">🪄</span>Yes — design it for me (₹10,000 fee)</button>
        <button class="choice" onclick="pHire(false)"><span class="cem">💪</span>No thanks — I'll keep my DIY home</button>
      </div></div>`;
  }
  if(p.hired===false||hireChoice===false){
    return `<div class="p-center"><div style="font-size:2.6rem">💪</div>
      <div class="p-status">Respect.</div>
      <p class="p-sub">You're keeping your own Round-1 home (score <b>${p.r1?p.r1.total:'—'}</b>). Let's see how it handles what life throws at it…</p>
      ${homeRooms(p.items)}</div>`;
  }
  if(p.designedIds){
    const sc=curScore(p);
    return `<div style="padding-top:10px;text-align:center">
      <div class="designer-chip">🧑‍🎨 Designed by your Interior Designer · fee ₹10,000</div>
      <div class="p-score-hero"><div class="eyebrow">Your new home score</div>
        <div class="bignum">${sc}<span style="font-size:1.4rem;color:var(--muted)">/100</span></div>
        <p class="p-sub">was ${p.r1?p.r1.total:'—'} when you did it alone · spent ${fmt(p.designedSpent||0)} incl. fee</p></div>
      <div class="p-card" style="text-align:left">${scoreBars(p.sub)}</div>
      <div style="text-align:left">${homeRooms(p.items)}</div></div>`;
  }
  if(ansSent){ return `<div class="p-center"><div style="font-size:2.6rem">📐✏️</div>
    <div class="p-status">Designing your home…</div><p class="p-sub">Sourcing, measuring, matching colours…</p></div>`; }
  // the 4 questions
  const Q=[
    {k:'budget',q:'What should I do with your ₹10 lakh?',opts:[['buffer','🛡️','Furnish well, keep some aside'],['full','🎀','Use it fully — every finishing touch']]},
    {k:'kids',q:'Do you have young children?',opts:[[true,'👶','Yes / planning to'],[false,'🧘','No']]},
    {k:'guests',q:'Do you entertain guests often?',opts:[[true,'🥳','All the time!'],[false,'🍵','Rarely — quiet home']]},
    {k:'style',q:'Which style feels like YOU?',opts:[['modern','✨','Modern'],['classic','🏛️','Classic'],['cozy','☕','Cozy']]},
  ];
  const step=Q[ansStep];
  return `<div style="padding-top:14px">
    <div class="q-step" style="text-align:center">Question ${ansStep+1} of 4</div>
    <div class="p-q">${step.q}</div>
    <div class="choice-grid">
      ${step.opts.map(o=>`<button class="choice" onclick="pAns('${step.k}',${typeof o[0]==='string'?`'${o[0]}'`:o[0]})"><span class="cem">${o[1]}</span>${o[2]}</button>`).join('')}
    </div></div>`;
}
function pHire(yes){ hireChoice=yes; sendAction({type:'hire',id:MY_ID,yes}); renderPlayer(); }
function pAns(k,v){ myAns[k]=v;
  if(ansStep<3){ ansStep++; renderPlayer(); return; }
  ansSent=true;
  sendAction({type:'answers',id:MY_ID,budget:myAns.budget,kids:myAns.kids,guests:myAns.guests,style:myAns.style});
  renderPlayer();
}

/* EVENTS */
function pEvents(p){
  const i=state.eventIdx;
  if(i<0) return `<div class="p-center"><div style="font-size:2.6rem">🎲</div>
    <div class="p-status">Life happens…</div><p class="p-sub">Watch the big screen. Three surprises are coming for every home.</p></div>`;
  const ev=EVENTS[i];
  if(ev.key==='luck'){
    const outs=state.eventReveal?luckOutcomes(p):[];
    return `<div class="p-center" style="justify-content:flex-start;padding-top:30px">
      <div style="font-size:3.4rem">🎲</div>
      <h2 class="serif" style="font-size:1.5rem;text-align:center">${ev.name}</h2>
      <p class="p-sub">${ev.line}</p>
      ${state.eventReveal?(outs.length?outs.map(o=>`<div class="${o[2][0]==='+'?'upg':'miss-list'}" style="width:100%;max-width:400px;text-align:left"><p style="font-weight:700">${o[1]} <b>(${o[2]})</b></p></div>`).join(''):'<div class="p-card"><p style="font-weight:700">Luck passed you by this time — nothing changed.</p></div>'):'<p class="p-sub">What could possibly go wrong…? 👀</p>'}
      ${p.sub?`<p class="p-sub" style="margin-top:10px">Your home score: <b style="color:var(--teal);font-size:1.2rem">${curScore(p)}</b></p>`:''}</div>`;
  }
  let msg;
  if(!state.eventReveal) msg=`<p class="p-sub">What does this mean for YOUR home? 🤔</p>`;
  else if(p.hired) msg=`<div class="upg">🪄 ${ev.designer}</div>`;
  else if(ev.diyHit(p)) msg=`<div class="miss-list"><h4>Uh oh</h4><p style="font-weight:700">${ev.diyBad}</p></div>`;
  else msg=`<div class="p-card"><p style="font-weight:700">${ev.diyOk}</p></div>`;
  return `<div class="p-center" style="justify-content:flex-start;padding-top:30px">
    <div style="font-size:3.4rem">${ev.em}</div>
    <h2 class="serif" style="font-size:1.5rem;text-align:center">${ev.name}</h2>
    <p class="p-sub">${ev.line}</p>${msg}
    ${p.sub?`<p class="p-sub" style="margin-top:10px">Your home score: <b style="color:var(--teal);font-size:1.2rem">${curScore(p)}</b></p>`:''}</div>`;
}

/* SIP */
function pSip(p){
  const m=state.sip;
  if(m.month===0){
    const sel=p.sipMode||mySip;
    return `<div style="padding-top:14px">
      <div class="p-q">₹50,000 arrives every month.<br>What's your plan?</div>
      <div class="choice-grid">
        ${Object.entries(SIP_MODES).map(([k,v])=>`<button class="choice ${sel===k?'on':''}" ${p.sipMode?'disabled':''} onclick="pPickSip('${k}')">
          <span class="cem">${v.em}</span><span>${v.label}<br><small style="font-weight:700;color:var(--muted)">${v.desc}</small></span></button>`).join('')}
      </div>
      ${sel?'<p class="p-sub" style="text-align:center;margin-top:12px">Locked in ✓ — watch the year unfold on the big screen.</p>':''}</div>`;
  }
  const last=p.upgrades&&p.upgrades.length?p.upgrades[p.upgrades.length-1]:null;
  return `<div style="padding-top:10px;text-align:center">
    <div class="eyebrow">Month ${m.month} of ${m.max}</div>
    <div class="bignum">${p.sub?curScore(p):'—'}</div>
    <p class="p-sub">your home score</p>
    ${p.sipMode==='designer'&&last?`<div class="upg" style="text-align:left">🪄 This month: <b>${escapeHtml(last)}</b></div>`:''}
    ${p.sipMode==='splurge'&&last?`<div class="upg" style="text-align:left;background:var(--coral-lt);border-color:#f2c4b5">🛍️ You bought: <b>${escapeHtml(last)}</b></div>`:''}
    ${p.sipMode==='ignore'?`<div class="p-card"><p style="font-weight:800">💤 ${fmt(p.sipCash)} sitting in the cupboard</p><p class="p-sub">Doing nothing. Quietly losing to rising prices.</p></div>`:''}
    ${!p.sipMode?'<p class="p-sub">You never picked a plan — the money just sits there.</p>':''}
  </div>`;
}
function pPickSip(k){ mySip=k; sendAction({type:'sipmode',id:MY_ID,m:k}); renderPlayer(); }

/* POOL */
function pPool(p){
  return `<div class="p-center">
    <div style="font-size:3rem">🧰</div>
    <h2 class="serif" style="font-size:1.5rem;text-align:center">Your designer just hired a whole team</h2>
    <p class="p-sub">4,000 families trust her — so YOUR home now gets a lighting expert, a kitchen expert, a master carpenter, a colour consultant and a project manager.</p>
    ${state.poolReveal&&p.premium?`<div class="upg pop" style="font-size:1.05rem">🧰 <b>Specialist detail-pass done!</b> A hundred little things you'd never have noticed — quietly fixed.</div>
      <p class="p-sub">New score: <b style="color:var(--teal);font-size:1.3rem">${curScore(p)}</b></p>`
    :state.poolReveal&&!p.hired?`<div class="p-card"><p style="font-weight:700">DIY homes don't get the team. Every hinge, finish and supplier is still yours to research alone. 🥲</p></div>`
    :`<p class="p-sub">Watch the big screen…</p>`}</div>`;
}

/* NEIGHBOUR */
function pNeighbour(p){
  const sel=p.nbVote||myVote;
  return `<div style="padding-top:14px">
    <div class="p-q">“My neighbour's sofa cost ₹4 lakh.<br>Yours only cost ₹80,000…”</div>
    <p class="p-sub" style="text-align:center;margin-bottom:12px">Be honest — what's your gut feeling?</p>
    <div class="choice-grid">
      <button class="choice ${sel==='regret'?'on':''}" ${state.nbReveal?'disabled':''} onclick="pNb('regret')"><span class="cem">😖</span>Ouch… did I go wrong?</button>
      <button class="choice ${sel==='whole'?'on':''}" ${state.nbReveal?'disabled':''} onclick="pNb('whole')"><span class="cem">😌</span>My whole home matters more than one sofa</button>
    </div>
    ${state.nbReveal?`<div class="upg pop" style="margin-top:14px">🏡 Their flashy-sofa house scores <b>58</b>. Your home scores <b>${curScore(p)||'—'}</b>. A home is judged as a whole.</div>`:''}
  </div>`;
}
function pNb(v){ myVote=v; sendAction({type:'nbvote',id:MY_ID,v}); renderPlayer(); }

/* REVEAL */
function pReveal(p){
  return `<div style="padding-top:10px">
    <h2 class="serif" style="text-align:center;font-size:1.4rem">You've been investing all along 🤯</h2>
    <div class="p-card" style="text-align:center"><p style="font-weight:900;font-size:1.05rem">You made ${(p.decisions||0)>0?(p.decisions||0)+' buy/return decisions':'a hundred micro-decisions'} in Round 1.</p>
    <p style="font-weight:700;color:var(--muted);font-size:.9rem">Designer clients made 4. That's the real product: fewer, better decisions.</p></div>
    ${MAPPING.map(m=>`<div class="map-row" style="grid-template-columns:1fr 30px 1fr;padding:10px 12px">
      <div class="home" style="font-size:.92rem">${m[0]}</div><div class="arrow" style="font-size:1rem">⟶</div>
      <div class="inv" style="font-size:.95rem">${m[1]}</div></div>`).join('')}
  </div>`;
}

/* FINALE */
function pFinale(p){
  const now=p.sub?curScore(p):null, start=p.r1?p.r1.total:null;
  return `<div class="p-center" style="justify-content:flex-start;padding-top:24px">
    <div style="font-size:3rem">🏡✨</div>
    <div class="p-status">Your dream home got built.</div>
    ${now!=null&&start!=null?`<div class="p-card" style="width:100%;max-width:380px;text-align:center">
      <div style="display:flex;justify-content:space-around;align-items:center">
        <div><div class="bignum" style="font-size:2rem;color:var(--muted)">${start}</div><small style="font-weight:800;color:var(--muted)">DIY, day one</small></div>
        <div style="font-size:1.6rem">→</div>
        <div><div class="bignum" style="font-size:2.6rem">${now}</div><small style="font-weight:800;color:var(--muted)">your home today</small></div>
      </div>${p.premium?'<div class="designer-chip" style="margin-top:8px">👑 Premium collection member</div>':''}</div>`:''}
    <div class="p-card" style="max-width:420px"><p style="font-family:'Lora',serif;font-style:italic;line-height:1.55;color:#54432a">“${CLOSING}”</p></div>
    <p class="p-sub" style="margin-top:6px">— Sapno Ka Ghar · Investing for Mummies</p>
  </div>`;
}

/* ── boot ───────────────────────────────────────────── */
if(isHost) initHost(); else initPlayer();

</script>
