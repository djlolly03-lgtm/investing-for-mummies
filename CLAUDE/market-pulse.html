  &lt;title&gt;Market Pulse — IFM&lt;/title&gt;
  &lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot; /&gt;
  &lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin /&gt;
  &lt;link href=&quot;https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;700;800&amp;display=swap&quot; rel=&quot;stylesheet&quot; /&gt;
  &lt;script src=&quot;https://unpkg.com/react@18.3.1/umd/react.development.js&quot; integrity=&quot;sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js&quot; integrity=&quot;sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://unpkg.com/@babel/standalone@7.29.0/babel.min.js&quot; integrity=&quot;sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;
  &lt;style&gt;

  :root {
    --bg:        #0f1e30;
    --bg-2:      #132436;
    --panel:     #182d44;
    --panel-2:   #1d3451;
    --panel-3:   #22405e;
    --line:      rgba(120, 160, 200, 0.12);
    --line-2:    rgba(120, 160, 200, 0.22);
    --ink:       #d9e6f2;
    --ink-2:     #8da3bf;
    --ink-3:     #5e7593;
    --up:        #00ff95;
    --dn:        #ff3366;
    --amber:     #ffb648;
    --up-glow:   rgba(0, 255, 149, 0.15);
    --dn-glow:   rgba(255, 51, 102, 0.15);
    --amber-glow: rgba(255, 182, 72, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: &#x27;Inter&#x27;, system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .mono { font-family: &#x27;JetBrains Mono&#x27;, monospace; font-feature-settings: &#x27;tnum&#x27;; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  .amber { color: var(--amber); }
  .dim { color: var(--ink-3); }

  /* ─── chrome shell ─── */
  .terminal {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    background:
      radial-gradient(1200px 700px at 20% -10%, rgba(40,80,140,0.18), transparent 60%),
      radial-gradient(900px 600px at 90% 10%, rgba(0,255,149,0.04), transparent 60%),
      var(--bg);
  }

  /* ─── top tape ─── */
  .tape {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px;
    background: linear-gradient(180deg, #132436 0%, #172d44 100%);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .tape-l, .tape-r { display: flex; align-items: center; gap: 14px; }
  .logo-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #00ff95, #007a48 70%, #003520);
    box-shadow: 0 0 12px rgba(0,255,149,0.6), inset 0 0 4px rgba(0,0,0,0.4);
  }
  .logo-dot.lg { width: 28px; height: 28px; }
  .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 13px; }
  .brand-2 { color: var(--ink-2); font-weight: 600; letter-spacing: 2px; }
  .tape-sep { width: 1px; height: 14px; background: var(--line-2); }
  .tape-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 4px;
    background: rgba(255, 51, 102, 0.12); color: var(--dn);
    border: 1px solid rgba(255, 51, 102, 0.35);
  }
  .tape-pill.live .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dn); box-shadow: 0 0 8px var(--dn);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .tape-meta {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    color: var(--ink-3); letter-spacing: 1.5px;
  }

  /* ─── ticker bar ─── */
  .ticker {
    overflow: hidden; white-space: nowrap;
    background: #0d1c2e;
    border-bottom: 1px solid var(--line);
    padding: 9px 0; position: relative;
  }
  .ticker::before, .ticker::after {
    content: &#x27;&#x27;; position: absolute; top: 0; bottom: 0; width: 80px; z-index: 2; pointer-events: none;
  }
  .ticker::before { left: 0; background: linear-gradient(90deg, #050810, transparent); }
  .ticker::after  { right: 0; background: linear-gradient(-90deg, #050810, transparent); }
  .ticker-track {
    display: inline-flex; gap: 28px;
    animation: scroll 90s linear infinite;
    will-change: transform;
  }
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-item {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px;
  }
  .t-sym { font-weight: 800; letter-spacing: 0.5px; color: var(--ink); }
  .t-px  { color: var(--ink-2); }
  .t-pct { font-weight: 700; font-size: 11.5px; }

  /* ─── main layout ─── */
  .main {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 14px;
    padding: 14px 16px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .main { grid-template-columns: 1fr; }
  }

  /* ─── BREAKING / predict panel ─── */
  .breaking {
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .brk-band {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px;
    background: linear-gradient(90deg, rgba(255,51,102,0.18), rgba(255,51,102,0.04));
    border-bottom: 1px solid rgba(255,51,102,0.3);
    font-size: 11px;
  }
  .brk-flag {
    font-weight: 900; font-size: 12px; letter-spacing: 2px;
    color: var(--dn); text-shadow: 0 0 8px rgba(255,51,102,0.5);
  }
  .brk-time { color: var(--ink); font-weight: 700; letter-spacing: 1px; }
  .brk-window { letter-spacing: 1px; }
  .brk-round { margin-left: auto; }
  .brk-head { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); }
  .brk-ticker { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .primary-sym {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 700;
    font-size: 13px; letter-spacing: 1.5px;
    padding: 4px 10px; border-radius: 4px;
    background: rgba(0,255,149,0.08); color: var(--up);
    border: 1px solid rgba(0,255,149,0.3);
  }
  .brk-concept {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    color: var(--amber); letter-spacing: 1.5px; font-weight: 700;
    padding: 4px 8px; border-radius: 3px;
    background: var(--amber-glow);
    border: 1px solid rgba(255,182,72,0.3);
  }
  .brk-headline {
    font-size: 19px; line-height: 1.35; font-weight: 600;
    color: var(--ink); letter-spacing: -0.2px;
    text-wrap: pretty;
  }

  .q-band {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: linear-gradient(90deg, rgba(255,182,72,0.10), rgba(255,182,72,0.02));
    border-bottom: 1px solid var(--line);
  }
  .q-label {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    font-weight: 700; letter-spacing: 2px; color: var(--amber);
  }
  .q-text { font-size: 15px; font-weight: 700; color: var(--ink); }

  .choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px; }
  @media (max-width: 720px) {
    .choices { grid-template-columns: repeat(2, 1fr); }
  }
  .choice {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line-2);
    border-radius: 4px; padding: 14px 10px;
    font-family: inherit; cursor: pointer;
    transition: all 0.14s ease;
  }
  .choice:hover {
    transform: translateY(-1px);
    border-color: rgba(255,255,255,0.35);
    background: var(--panel-3);
  }
  .c-arrow { font-size: 22px; font-weight: 700; letter-spacing: -2px; }
  .c-up .c-arrow { color: var(--up); text-shadow: 0 0 10px rgba(0,255,149,0.4); }
  .c-dn .c-arrow { color: var(--dn); text-shadow: 0 0 10px rgba(255,51,102,0.4); }
  .c-flat .c-arrow { color: var(--ink-2); }
  .c-label { font-weight: 800; font-size: 11.5px; letter-spacing: 1.2px; white-space: nowrap; }
  .c-sub { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.4px; white-space: nowrap; }
  .c-up:hover { border-color: var(--up); box-shadow: 0 0 0 1px var(--up), 0 0 18px rgba(0,255,149,0.25); }
  .c-dn:hover { border-color: var(--dn); box-shadow: 0 0 0 1px var(--dn), 0 0 18px rgba(255,51,102,0.25); }
  .c-flat:hover { border-color: var(--ink-2); }

  /* ─── reveal ─── */
  .reveal { display: flex; flex-direction: column; gap: 12px; }
  .verdict {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 6px;
    border: 1px solid var(--line-2);
    background: var(--panel);
  }
  .v-ok { border-left: 4px solid var(--up); background: linear-gradient(90deg, rgba(0,255,149,0.08), transparent 60%); }
  .v-no { border-left: 4px solid var(--dn); background: linear-gradient(90deg, rgba(255,51,102,0.08), transparent 60%); }
  .v-tag {
    font-weight: 900; letter-spacing: 2px; font-size: 12px;
    padding: 4px 10px; border-radius: 3px;
    white-space: nowrap; flex-shrink: 0;
  }
  .v-ok .v-tag { background: rgba(0,255,149,0.14); color: var(--up); }
  .v-no .v-tag { background: rgba(255,51,102,0.14); color: var(--dn); }
  .v-line { font-size: 14px; color: var(--ink-2); font-weight: 500; }

  .chart-panel {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; overflow: hidden;
  }
  .chart-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom: 1px solid var(--line);
  }
  .ch-sym {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 700;
    font-size: 14px; letter-spacing: 1px; color: var(--ink);
  }
  .ch-meta { font-size: 11px; letter-spacing: 1.5px; margin-top: 2px; }
  .ch-px {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
  }
  .ch-arrow { font-size: 18px; }

  .why-panel {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 14px 16px;
  }
  .evr { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
  .evr-col {
    padding: 12px; border-radius: 4px;
    border: 1px solid var(--line-2); background: var(--panel-2);
  }
  .evr-up { border-color: rgba(0,255,149,0.4); background: rgba(0,255,149,0.05); }
  .evr-dn { border-color: rgba(255,51,102,0.4); background: rgba(255,51,102,0.05); }
  .evr-arrow {
    display: flex; align-items: center; color: var(--amber);
    font-weight: 800; font-size: 22px;
    text-shadow: 0 0 10px rgba(255,182,72,0.5);
  }
  .evr-tag {
    font-size: 10.5px; font-weight: 800; letter-spacing: 2px;
    color: var(--ink-3); margin-bottom: 6px;
  }
  .evr-up .evr-tag { color: var(--up); }
  .evr-dn .evr-tag { color: var(--dn); }
  .evr-text { font-size: 13px; line-height: 1.45; color: var(--ink); font-weight: 500; }
  @media (max-width: 720px) {
    .evr { grid-template-columns: 1fr; }
    .evr-arrow { justify-content: center; transform: rotate(90deg); }
  }

  .why-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .why-row { display: flex; gap: 12px; align-items: flex-start; }
  .why-tag {
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
    padding: 3px 8px; border-radius: 3px;
    background: var(--panel-3); color: var(--amber); flex-shrink: 0;
    min-width: 78px; text-align: center;
    border: 1px solid rgba(255,182,72,0.25);
  }
  .why-text { font-size: 13px; line-height: 1.5; color: var(--ink); font-weight: 500; padding-top: 2px; }

  .next-btn {
    align-self: flex-start; padding: 12px 22px;
    background: linear-gradient(180deg, #00ff95, #00b86a);
    color: #03110a;
    border: 0; border-radius: 4px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 800;
    font-size: 13px; letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,255,149,0.5), 0 6px 24px rgba(0,255,149,0.25);
    transition: transform 0.1s;
  }
  .next-btn:hover { transform: translateY(-1px); }

  /* ─── ticker grid panel ─── */
  .grid-panel {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    position: sticky; top: 12px;
  }
  .panel-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom: 1px solid var(--line);
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    font-weight: 700; letter-spacing: 2px; color: var(--ink-2);
  }
  .grid-rows { max-height: 540px; overflow-y: auto; }
  .grid-rows::-webkit-scrollbar { width: 6px; }
  .grid-rows::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  .grow {
    display: grid; grid-template-columns: 1fr 70px 60px 60px;
    gap: 10px; align-items: center;
    padding: 7px 12px;
    border-bottom: 1px solid rgba(120,160,200,0.05);
    font-size: 11.5px;
    transition: background 0.4s;
  }
  .grow-up { background: rgba(0,255,149,0.10); animation: flashG 1.2s ease-out; }
  .grow-dn { background: rgba(255,51,102,0.10); animation: flashR 1.2s ease-out; }
  @keyframes flashG { 0% { background: rgba(0,255,149,0.45); } 100% { background: rgba(0,255,149,0.10); } }
  @keyframes flashR { 0% { background: rgba(255,51,102,0.45); } 100% { background: rgba(255,51,102,0.10); } }
  .grow.hi {
    box-shadow: inset 3px 0 0 var(--amber);
  }
  .g-sym { font-weight: 700; letter-spacing: 0.4px; color: var(--ink); font-size: 12px; }
  .g-px  { color: var(--ink-2); text-align: right; font-size: 11.5px; }
  .g-pct { text-align: right; font-weight: 700; font-size: 11.5px; }

  /* ─── status bar ─── */
  .statusbar {
    display: flex; align-items: center; gap: 14px;
    padding: 7px 16px;
    background: #050810;
    border-top: 1px solid var(--line-2);
    font-size: 11px;
    color: var(--ink-2);
  }
  .s-l b { color: var(--ink); font-weight: 800; margin-left: 4px; letter-spacing: 0.5px; }
  .sep { width: 1px; height: 12px; background: var(--line-2); }
  .grow-sp { flex: 1; }
  .s-r { letter-spacing: 1.5px; }

  /* ─── boot screen ─── */
  .boot {
    min-height: 60vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 16px;
  }
  .boot-card {
    max-width: 720px; width: 100%;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 28px;
    box-shadow: 0 16px 60px rgba(0,0,0,0.5);
  }
  .boot-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .boot-t { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; }
  .boot-s { font-size: 11px; color: var(--ink-3); letter-spacing: 1.5px; margin-top: 2px; }

  .boot-log {
    background: #03070d; border: 1px solid var(--line);
    border-radius: 4px; padding: 14px 16px;
    font-size: 12.5px; color: var(--up);
    min-height: 184px;
  }
  .boot-line { line-height: 1.6; opacity: 0.92; }
  .boot-line::before { content: &#x27;$ &#x27;; color: var(--ink-3); }
  .boot-caret {
    display: inline-block; width: 8px; height: 14px;
    background: var(--up); vertical-align: text-bottom;
    animation: blink 1s steps(2, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .boot-rules { margin-top: 22px; display: flex; flex-direction: column; gap: 6px; }
  .rule { font-size: 13.5px; color: var(--ink-2); }
  .rule b { color: var(--amber); margin-right: 6px; font-weight: 800; }

  .boot-btn {
    margin-top: 22px; width: 100%;
    padding: 14px 0; cursor: pointer;
    background: linear-gradient(180deg, #00ff95, #00b86a);
    color: #03110a; border: 0; border-radius: 4px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 800;
    font-size: 14px; letter-spacing: 2.5px;
    box-shadow: 0 0 0 1px rgba(0,255,149,0.5), 0 8px 30px rgba(0,255,149,0.3);
  }

  /* ─── summary ─── */
  .summary { padding: 22px 16px; display: flex; justify-content: center; }
  .sum-card {
    max-width: 820px; width: 100%;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 28px;
    box-shadow: 0 16px 60px rgba(0,0,0,0.5);
  }
  .sum-tag { font-size: 11px; letter-spacing: 2px; color: var(--ink-3); }
  .sum-rank {
    font-size: 32px; font-weight: 900; letter-spacing: 2px;
    color: var(--up); margin-top: 6px;
    text-shadow: 0 0 24px rgba(0,255,149,0.3);
  }
  .sum-blurb { color: var(--ink-2); margin-top: 6px; font-size: 14px; max-width: 600px; }
  .sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; }
  .sum-stat {
    padding: 14px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--line-2);
    text-align: center;
  }
  .ss-l { font-size: 10.5px; letter-spacing: 2px; color: var(--ink-3); }
  .ss-v { font-size: 28px; font-weight: 800; margin-top: 4px; }
  .sum-list { margin-top: 22px; display: flex; flex-direction: column; gap: 4px; }
  .sum-row {
    display: grid; grid-template-columns: 28px 110px 1fr 80px 28px;
    gap: 10px; align-items: center;
    padding: 8px 12px; border-radius: 3px;
    background: var(--panel-2); border: 1px solid var(--line-2);
    font-size: 12.5px;
  }
  .sum-ok { border-left: 3px solid var(--up); }
  .sum-no { border-left: 3px solid var(--dn); }
  .sum-sym { font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 700; letter-spacing: 0.5px; }
  .sum-conc { color: var(--ink-3); font-size: 12px; }
  .sum-mark { font-weight: 900; text-align: center; }

  /* ─── flash overlay ─── */
  .flash {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .flash-red {
    background: radial-gradient(circle, rgba(255,51,102,0.30), rgba(255,51,102,0.0) 60%);
    animation: flashRed 0.45s ease-out 2;
    box-shadow: inset 0 0 200px rgba(255,51,102,0.5);
  }
  .flash-red-soft {
    background: radial-gradient(circle, rgba(255,51,102,0.15), rgba(255,51,102,0.0) 70%);
    animation: flashRed 0.5s ease-out;
  }
  .flash-red-strobe {
    animation: strobe 0.18s steps(1) 14;
  }
  .flash-green {
    background: radial-gradient(circle, rgba(0,255,149,0.30), rgba(0,255,149,0.0) 60%);
    animation: flashGr 0.45s ease-out 2;
    box-shadow: inset 0 0 200px rgba(0,255,149,0.5);
  }
  @keyframes flashRed { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes flashGr  { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes strobe {
    0%, 49%   { background: rgba(255,51,102,0.45); box-shadow: inset 0 0 280px rgba(255,51,102,0.6); }
    50%, 100% { background: transparent; box-shadow: none; }
  }

  .flash-card {
    background: #03070d; border: 2px solid var(--dn);
    border-radius: 6px; padding: 32px 60px;
    box-shadow: 0 0 80px rgba(255,51,102,0.6);
    text-align: center; position: relative; overflow: hidden;
    max-width: 80vw;
  }
  .flash-green .flash-card { border-color: var(--up); box-shadow: 0 0 80px rgba(0,255,149,0.6); }
  .flash-t {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 800;
    font-size: 32px; letter-spacing: 4px; color: var(--dn);
    text-shadow: 0 0 16px rgba(255,51,102,0.6);
  }
  .flash-green .flash-t { color: var(--up); text-shadow: 0 0 16px rgba(0,255,149,0.6); }
  .flash-s {
    margin-top: 8px; font-size: 12px; letter-spacing: 2px;
    color: var(--ink-2);
  }
  .flash-marquee {
    position: absolute; top: 0; left: 0; right: 0;
    background: var(--dn); color: #000;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 800;
    font-size: 10px; letter-spacing: 2px;
    padding: 4px 0; white-space: nowrap; overflow: hidden;
    animation: marquee 8s linear infinite;
  }
  .flash-green .flash-marquee { background: var(--up); color: #03110a; }
  @keyframes marquee {
    0% { transform: translateX(0); } 100% { transform: translateX(-50%); }
  }

// Synthesized market sounds — bell, alarm, thud — using Web Audio.
// No assets needed. Each sound returns a stop() so we can interrupt.

(function () {
  let ctx = null;
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === &#x27;suspended&#x27;) ctx.resume();
    return ctx;
  }

  function envOsc({ freq, type = &#x27;sine&#x27;, dur = 0.4, gain = 0.18, decay = 0.4, detune = 0 }) {
    const a = ac();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.detune.value = detune;
    o.connect(g); g.connect(a.destination);
    const t = a.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o.start(t);
    o.stop(t + dur);
    return () =&gt; { try { o.stop(); } catch(e){} };
  }

  // Opening bell — bright, layered, ~1s
  function playBell() {
    envOsc({ freq: 880, type: &#x27;sine&#x27;, dur: 1.2, decay: 1.2, gain: 0.22 });
    envOsc({ freq: 1320, type: &#x27;sine&#x27;, dur: 1.0, decay: 1.0, gain: 0.14 });
    envOsc({ freq: 1760, type: &#x27;triangle&#x27;, dur: 0.6, decay: 0.6, gain: 0.08 });
    setTimeout(() =&gt; {
      envOsc({ freq: 880, type: &#x27;sine&#x27;, dur: 0.9, decay: 0.9, gain: 0.16 });
      envOsc({ freq: 1320, type: &#x27;sine&#x27;, dur: 0.7, decay: 0.7, gain: 0.1 });
    }, 220);
  }

  // Circuit alarm — two-tone klaxon
  function playAlarm(longVer) {
    const a = ac();
    const tones = longVer ? 6 : 3;
    for (let i = 0; i &lt; tones; i++) {
      const hi = i % 2 === 0;
      setTimeout(() =&gt; {
        envOsc({ freq: hi ? 740 : 520, type: &#x27;square&#x27;, dur: 0.28, decay: 0.28, gain: 0.16 });
      }, i * 320);
    }
  }

  // Low thud — soft negative move
  function playThud() {
    envOsc({ freq: 110, type: &#x27;sine&#x27;, dur: 0.55, decay: 0.55, gain: 0.32 });
    envOsc({ freq: 55,  type: &#x27;triangle&#x27;, dur: 0.55, decay: 0.55, gain: 0.22 });
  }

  // tick — for ticker updates
  function playTick() {
    envOsc({ freq: 1800, type: &#x27;square&#x27;, dur: 0.04, decay: 0.04, gain: 0.04 });
  }

  window.SFX = {
    bell: playBell,
    alarm: () =&gt; playAlarm(false),
    &#x27;alarm-long&#x27;: () =&gt; playAlarm(true),
    thud: playThud,
    tick: playTick,
    init: () =&gt; ac(),
  };
})();

// Terminal-style price chart with animated reveal.
// Renders SVG path of series, color-coded green/red, with grid + axis ticks.

function TerminalChart({ event, animate = true, width = 720, height = 260 }) {
  const series = event.series;
  const isUp = event.actualMovePct &gt;= 0;
  const stroke = isUp ? &#x27;var(--up)&#x27; : &#x27;var(--dn)&#x27;;
  const fill   = isUp ? &#x27;var(--up-glow)&#x27; : &#x27;var(--dn-glow)&#x27;;

  const padL = 56, padR = 16, padT = 18, padB = 28;
  const w = width, h = height;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const minY = Math.min(...series) - 1;
  const maxY = Math.max(...series) + 1;
  const xs = i =&gt; padL + (innerW * (i / (series.length - 1)));
  const ys = v =&gt; padT + innerH - (innerH * (v - minY) / (maxY - minY));

  const [progress, setProgress] = React.useState(animate ? 0 : 1);
  React.useEffect(() =&gt; {
    if (!animate) return;
    let raf, start;
    const dur = 1200;
    function tick(ts) {
      if (!start) start = ts;
      const p = Math.min(1, (ts - start) / dur);
      setProgress(p);
      if (p &lt; 1) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () =&gt; cancelAnimationFrame(raf);
  }, [event.id, animate]);

  // Path with progress
  const drawCount = Math.max(2, Math.ceil(progress * series.length));
  const pts = series.slice(0, drawCount).map((v, i) =&gt; `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`);
  const pathD = &#x27;M &#x27; + pts.join(&#x27; L &#x27;);
  const areaD = pathD + ` L ${xs(drawCount - 1).toFixed(1)},${(h - padB).toFixed(1)} L ${xs(0).toFixed(1)},${(h - padB).toFixed(1)} Z`;

  // Grid lines
  const gridY = [0, 0.25, 0.5, 0.75, 1].map(p =&gt; {
    const y = padT + innerH * p;
    const val = (maxY - (maxY - minY) * p).toFixed(1);
    return { y, val };
  });
  const gridX = series.map((_, i) =&gt; xs(i));

  const last = series[drawCount - 1];
  const lastX = xs(drawCount - 1);
  const lastY = ys(last);

  return (
    &lt;svg viewBox={`0 0 ${w} ${h}`} style={{ width: &#x27;100%&#x27;, height: &#x27;auto&#x27;, display: &#x27;block&#x27; }}&gt;
      &lt;defs&gt;
        &lt;linearGradient id={`grad-${event.id}`} x1=&quot;0&quot; x2=&quot;0&quot; y1=&quot;0&quot; y2=&quot;1&quot;&gt;
          &lt;stop offset=&quot;0%&quot;  stopColor={isUp ? &#x27;#00ff95&#x27; : &#x27;#ff3366&#x27;} stopOpacity=&quot;0.32&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stopColor={isUp ? &#x27;#00ff95&#x27; : &#x27;#ff3366&#x27;} stopOpacity=&quot;0&quot;/&gt;
        &lt;/linearGradient&gt;
      &lt;/defs&gt;

      {/* grid */}
      {gridY.map((g, i) =&gt; (
        &lt;g key={i}&gt;
          &lt;line x1={padL} x2={w - padR} y1={g.y} y2={g.y}
            stroke=&quot;rgba(255,255,255,0.05)&quot; strokeDasharray=&quot;2 4&quot;/&gt;
          &lt;text x={padL - 8} y={g.y + 3} textAnchor=&quot;end&quot;
            fontFamily=&quot;&#x27;JetBrains Mono&#x27;, monospace&quot; fontSize=&quot;10&quot;
            fill=&quot;rgba(180,200,220,0.55)&quot;&gt;{g.val}&lt;/text&gt;
        &lt;/g&gt;
      ))}
      {gridX.map((x, i) =&gt; (
        &lt;line key={i} x1={x} x2={x} y1={padT} y2={h - padB}
          stroke=&quot;rgba(255,255,255,0.03)&quot;/&gt;
      ))}

      {/* area + line */}
      &lt;path d={areaD} fill={`url(#grad-${event.id})`} /&gt;
      &lt;path d={pathD} fill=&quot;none&quot; stroke={stroke} strokeWidth=&quot;2.4&quot;
        strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;
        style={{ filter: `drop-shadow(0 0 6px ${isUp ? &#x27;#00ff95&#x27; : &#x27;#ff3366&#x27;})` }}/&gt;

      {/* live dot */}
      &lt;circle cx={lastX} cy={lastY} r=&quot;5&quot; fill={stroke}
        style={{ filter: `drop-shadow(0 0 8px ${isUp ? &#x27;#00ff95&#x27; : &#x27;#ff3366&#x27;})` }}/&gt;
      &lt;circle cx={lastX} cy={lastY} r=&quot;9&quot; fill=&quot;none&quot; stroke={stroke} strokeOpacity=&quot;0.35&quot;/&gt;

      {/* event marker line */}
      &lt;line x1={xs(0)} x2={xs(0)} y1={padT} y2={h - padB}
        stroke=&quot;rgba(250,200,80,0.45)&quot; strokeDasharray=&quot;3 3&quot;/&gt;
      &lt;text x={xs(0) + 4} y={padT + 12}
        fontFamily=&quot;&#x27;JetBrains Mono&#x27;, monospace&quot; fontSize=&quot;9.5&quot;
        fill=&quot;rgba(250,200,80,0.85)&quot; letterSpacing=&quot;1&quot;&gt;EVENT&lt;/text&gt;
    &lt;/svg&gt;
  );
}

// tiny sparkline for ticker grid
function MiniSpark({ pts, color = &#x27;#00ff95&#x27;, w = 60, h = 22 }) {
  const min = Math.min(...pts), max = Math.max(...pts);
  const span = (max - min) || 1;
  const xs = i =&gt; (w * i) / (pts.length - 1);
  const ys = v =&gt; h - ((v - min) / span) * (h - 4) - 2;
  const d = &#x27;M &#x27; + pts.map((v, i) =&gt; `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(&#x27; L &#x27;);
  return (
    &lt;svg width={w} height={h} style={{ display: &#x27;block&#x27; }}&gt;
      &lt;path d={d} fill=&quot;none&quot; stroke={color} strokeWidth=&quot;1.4&quot;
        strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;/&gt;
    &lt;/svg&gt;
  );
}

window.TerminalChart = TerminalChart;
window.MiniSpark = MiniSpark;
  &lt;/script&gt;
  &lt;script type=&quot;text/babel&quot;&gt;
// MARKET REACTS — main terminal app
// Layout: top tape + ticker, left &quot;BREAKING&quot; panel + question, right ticker grid, bottom status bar.
// Flow: idle =&gt; event drops =&gt; user predicts =&gt; reveal (chart, flash, sound, ticker updates) =&gt; next.

const { useState, useEffect, useMemo, useRef } = React;

// ───────────────────────── helpers
function fmtPx(p) {
  if (p &gt;= 1000) return p.toLocaleString(&#x27;en-IN&#x27;, { maximumFractionDigits: 2 });
  return p.toFixed(2);
}
function pad2(n) { return String(n).padStart(2, &#x27;0&#x27;); }
function useClock() {
  const [t, setT] = useState(new Date());
  useEffect(() =&gt; {
    const id = setInterval(() =&gt; setT(new Date()), 1000);
    return () =&gt; clearInterval(id);
  }, []);
  return t;
}

// ───────────────────────── jitter — gentle random walk for tickers between events
function useTickerState() {
  const [board, setBoard] = useState(() =&gt;
    window.TICKERS.map(t =&gt; ({
      ...t,
      base: t.px,
      chg: 0,
      pct: 0,
      spark: Array.from({ length: 18 }, () =&gt; t.px * (1 + (Math.random() - 0.5) * 0.001)),
      flash: null,
    }))
  );

  // gentle jitter every 900ms
  useEffect(() =&gt; {
    const id = setInterval(() =&gt; {
      setBoard(b =&gt; b.map(t =&gt; {
        const drift = (Math.random() - 0.5) * (t.kind === &#x27;index&#x27; ? 0.0008 : 0.0014);
        const np = Math.max(0.01, t.px * (1 + drift));
        const sp = [...t.spark.slice(1), np];
        return { ...t, px: np, spark: sp, chg: np - t.base, pct: ((np - t.base) / t.base) * 100,
          flash: drift &gt; 0 ? &#x27;up&#x27; : &#x27;dn&#x27; };
      }));
    }, 900);
    return () =&gt; clearInterval(id);
  }, []);

  // applyEvent: shift the affected tickers by the % deltas
  function applyEvent(affected) {
    setBoard(b =&gt; b.map(t =&gt; {
      const pct = affected[t.sym];
      if (pct == null) return t;
      const np = t.px * (1 + pct / 100);
      const sp = [...t.spark, np];
      while (sp.length &gt; 22) sp.shift();
      return { ...t, px: np, spark: sp, chg: np - t.base, pct: ((np - t.base) / t.base) * 100,
        flash: pct &gt; 0 ? &#x27;up-big&#x27; : &#x27;dn-big&#x27; };
    }));
  }

  return [board, applyEvent];
}

// ───────────────────────── top tape (date + brand + clock)
function TopTape() {
  const t = useClock();
  const time = `${pad2(t.getHours())}:${pad2(t.getMinutes())}:${pad2(t.getSeconds())} IST`;
  return (
    &lt;div className=&quot;tape&quot;&gt;
      &lt;div className=&quot;tape-l&quot;&gt;
        &lt;span className=&quot;logo-dot&quot; /&gt;
        &lt;span className=&quot;brand&quot;&gt;IFM &lt;span className=&quot;brand-2&quot;&gt;MARKET PULSE&lt;/span&gt;&lt;/span&gt;
        &lt;span className=&quot;tape-sep&quot;/&gt;
        &lt;span className=&quot;tape-pill live&quot;&gt;&lt;span className=&quot;dot&quot;/&gt;LIVE&lt;/span&gt;
        &lt;span className=&quot;tape-meta&quot;&gt;NSE · BSE · INTRADAY&lt;/span&gt;
      &lt;/div&gt;
      &lt;div className=&quot;tape-r&quot;&gt;
        &lt;span className=&quot;tape-meta&quot;&gt;SESSION OPEN&lt;/span&gt;
        &lt;span className=&quot;tape-sep&quot;/&gt;
        &lt;span className=&quot;mono&quot;&gt;{time}&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── scrolling ticker bar
function TickerBar({ board }) {
  // duplicate for seamless loop
  const items = [...board, ...board];
  return (
    &lt;div className=&quot;ticker&quot;&gt;
      &lt;div className=&quot;ticker-track&quot;&gt;
        {items.map((t, i) =&gt; {
          const up = t.pct &gt;= 0;
          return (
            &lt;span key={i} className=&quot;ticker-item&quot;&gt;
              &lt;span className=&quot;t-sym&quot;&gt;{t.sym}&lt;/span&gt;
              &lt;span className=&quot;t-px mono&quot;&gt;{fmtPx(t.px)}&lt;/span&gt;
              &lt;span className={`t-pct mono ${up ? &#x27;up&#x27; : &#x27;dn&#x27;}`}&gt;
                {up ? &#x27;▲&#x27; : &#x27;▼&#x27;} {Math.abs(t.pct).toFixed(2)}%
              &lt;/span&gt;
            &lt;/span&gt;
          );
        })}
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── ticker grid (right column)
function TickerGrid({ board, highlight }) {
  return (
    &lt;div className=&quot;grid-panel&quot;&gt;
      &lt;div className=&quot;panel-h&quot;&gt;
        &lt;span&gt;MARKET DEPTH&lt;/span&gt;
        &lt;span className=&quot;mono dim&quot;&gt;{board.length} symbols&lt;/span&gt;
      &lt;/div&gt;
      &lt;div className=&quot;grid-rows&quot;&gt;
        {board.map((t, i) =&gt; {
          const up = t.pct &gt;= 0;
          const isHi = highlight &amp;&amp; (highlight === t.sym ||
            (highlight === &#x27;NIFTY 50&#x27; &amp;&amp; t.sym === &#x27;NIFTY 50&#x27;));
          const isBig = t.flash === &#x27;up-big&#x27; || t.flash === &#x27;dn-big&#x27;;
          return (
            &lt;div key={t.sym}
              className={`grow ${isHi ? &#x27;hi&#x27; : &#x27;&#x27;} ${isBig ? (up ? &#x27;grow-up&#x27; : &#x27;grow-dn&#x27;) : &#x27;&#x27;}`}&gt;
              &lt;span className=&quot;g-sym&quot;&gt;{t.sym}&lt;/span&gt;
              &lt;span className=&quot;g-px mono&quot;&gt;{fmtPx(t.px)}&lt;/span&gt;
              &lt;MiniSpark pts={t.spark} color={up ? &#x27;#00ff95&#x27; : &#x27;#ff3366&#x27;} w={50} h={18}/&gt;
              &lt;span className={`g-pct mono ${up ? &#x27;up&#x27; : &#x27;dn&#x27;}`}&gt;
                {up ? &#x27;+&#x27; : &#x27;&#x27;}{t.pct.toFixed(2)}%
              &lt;/span&gt;
            &lt;/div&gt;
          );
        })}
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── BREAKING news panel + question
const CHOICES = [
  { id: &#x27;sharp_rise&#x27;,  label: &#x27;SHARP RISE&#x27;, sub: &#x27;+5% or more&#x27;,     dir: 1,  arrow: &#x27;▲▲&#x27;, tone: &#x27;up&#x27; },
  { id: &#x27;slight_rise&#x27;, label: &#x27;SLIGHT RISE&#x27;, sub: &#x27;+1% to +5%&#x27;,     dir: 1,  arrow: &#x27;▲&#x27;,  tone: &#x27;up&#x27; },
  { id: &#x27;flat&#x27;,        label: &#x27;FLAT&#x27;,       sub: &#x27;Within ±1%&#x27;,      dir: 0,  arrow: &#x27;◆&#x27;,  tone: &#x27;flat&#x27; },
  { id: &#x27;slight_fall&#x27;, label: &#x27;SLIGHT FALL&#x27;, sub: &#x27;−1% to −5%&#x27;,     dir: -1, arrow: &#x27;▼&#x27;,  tone: &#x27;dn&#x27; },
  { id: &#x27;sharp_fall&#x27;,  label: &#x27;SHARP FALL&#x27;, sub: &#x27;−5% or more&#x27;,     dir: -1, arrow: &#x27;▼▼&#x27;, tone: &#x27;dn&#x27; },
];

function BreakingPanel({ event, round, total, onAnswer }) {
  return (
    &lt;div className=&quot;breaking&quot;&gt;
      &lt;div className=&quot;brk-band&quot;&gt;
        &lt;span className=&quot;brk-flag&quot;&gt;⚡ {event.tape}&lt;/span&gt;
        &lt;span className=&quot;brk-time mono&quot;&gt;{event.time}&lt;/span&gt;
        &lt;span className=&quot;brk-window mono dim&quot;&gt;{event.window}&lt;/span&gt;
        &lt;span className=&quot;brk-round mono dim&quot;&gt;EVENT {pad2(round)} / {pad2(total)}&lt;/span&gt;
      &lt;/div&gt;
      &lt;div className=&quot;brk-head&quot;&gt;
        &lt;div className=&quot;brk-ticker&quot;&gt;
          &lt;span className=&quot;primary-sym&quot;&gt;{event.primaryTicker}&lt;/span&gt;
          &lt;span className=&quot;brk-concept&quot;&gt;{event.concept}&lt;/span&gt;
        &lt;/div&gt;
        &lt;div className=&quot;brk-headline&quot;&gt;{event.headline}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div className=&quot;q-band&quot;&gt;
        &lt;span className=&quot;q-label&quot;&gt;PREDICT →&lt;/span&gt;
        &lt;span className=&quot;q-text&quot;&gt;{event.question}&lt;/span&gt;
      &lt;/div&gt;
      &lt;div className=&quot;choices&quot;&gt;
        {CHOICES.map(c =&gt; (
          &lt;button key={c.id} className={`choice c-${c.tone}`} onClick={() =&gt; onAnswer(c.id)}&gt;
            &lt;span className=&quot;c-arrow&quot;&gt;{c.arrow}&lt;/span&gt;
            &lt;span className=&quot;c-label&quot;&gt;{c.label}&lt;/span&gt;
            &lt;span className=&quot;c-sub mono&quot;&gt;{c.sub}&lt;/span&gt;
          &lt;/button&gt;
        ))}
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── reveal panel
function RevealPanel({ event, userChoice, round, total, onNext, isLast }) {
  const correct = userChoice === event.correct;
  const isUp = event.actualMovePct &gt;= 0;
  const correctC = CHOICES.find(c =&gt; c.id === event.correct);
  const userC = CHOICES.find(c =&gt; c.id === userChoice);

  return (
    &lt;div className=&quot;reveal&quot;&gt;
      &lt;div className={`verdict ${correct ? &#x27;v-ok&#x27; : &#x27;v-no&#x27;}`}&gt;
        &lt;div className=&quot;v-tag mono&quot;&gt;{correct ? &#x27;✓ CALLED IT&#x27; : &#x27;✗ MISSED&#x27;}&lt;/div&gt;
        &lt;div className=&quot;v-line&quot;&gt;
          {correct
            ? `You read the tape right. Market did ${correctC.label}.`
            : `You picked ${userC.label}. Market did ${correctC.label}.`}
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div className=&quot;chart-panel&quot;&gt;
        &lt;div className=&quot;chart-head&quot;&gt;
          &lt;div&gt;
            &lt;div className=&quot;ch-sym&quot;&gt;{event.primaryTicker}&lt;/div&gt;
            &lt;div className=&quot;ch-meta mono dim&quot;&gt;{event.window} · {event.tape}&lt;/div&gt;
          &lt;/div&gt;
          &lt;div className={`ch-px ${isUp ? &#x27;up&#x27; : &#x27;dn&#x27;}`}&gt;
            &lt;span className=&quot;ch-arrow&quot;&gt;{isUp ? &#x27;▲&#x27; : &#x27;▼&#x27;}&lt;/span&gt;
            &lt;span className=&quot;mono&quot;&gt;{isUp ? &#x27;+&#x27; : &#x27;&#x27;}{event.actualMovePct}%&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;TerminalChart event={event} animate={true}/&gt;
      &lt;/div&gt;

      &lt;div className=&quot;why-panel&quot;&gt;
        &lt;div className=&quot;evr&quot;&gt;
          &lt;div className=&quot;evr-col evr-l&quot;&gt;
            &lt;div className=&quot;evr-tag mono&quot;&gt;{event.expected.tag}&lt;/div&gt;
            &lt;div className=&quot;evr-text&quot;&gt;{event.expected.text}&lt;/div&gt;
          &lt;/div&gt;
          &lt;div className=&quot;evr-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div className={`evr-col evr-r ${isUp ? &#x27;evr-up&#x27; : &#x27;evr-dn&#x27;}`}&gt;
            &lt;div className=&quot;evr-tag mono&quot;&gt;{event.reality.tag}&lt;/div&gt;
            &lt;div className=&quot;evr-text&quot;&gt;{event.reality.text}&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div className=&quot;why-list&quot;&gt;
          {event.why.map((w, i) =&gt; (
            &lt;div key={i} className=&quot;why-row&quot;&gt;
              &lt;span className=&quot;why-tag mono&quot;&gt;{w.tag}&lt;/span&gt;
              &lt;span className=&quot;why-text&quot;&gt;{w.text}&lt;/span&gt;
            &lt;/div&gt;
          ))}
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;button className=&quot;next-btn&quot; onClick={onNext}&gt;
        {isLast ? &#x27;CLOSE SESSION →&#x27; : &#x27;NEXT EVENT →&#x27;}
      &lt;/button&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── circuit / flash overlay
function FlashOverlay({ kind, reaction, onDone }) {
  const doneRef = useRef(onDone);
  useEffect(() =&gt; { doneRef.current = onDone; });
  useEffect(() =&gt; {
    if (!kind) return;
    const ms = reaction === &#x27;market-halt&#x27; ? 3000
             : reaction === &#x27;lower-circuit&#x27; || reaction === &#x27;upper-circuit&#x27; ? 2200
             : 900;
    const id = setTimeout(() =&gt; doneRef.current &amp;&amp; doneRef.current(), ms);
    return () =&gt; clearTimeout(id);
  }, [kind, reaction]);
  if (!kind) return null;

  let label = null;
  if (reaction === &#x27;lower-circuit&#x27;) label = { t: &#x27;LOWER CIRCUIT HIT&#x27;, s: &#x27;TRADING HALTED · 20% LIMIT BREACHED&#x27; };
  if (reaction === &#x27;upper-circuit&#x27;) label = { t: &#x27;UPPER CIRCUIT HIT&#x27;, s: &#x27;TRADING HALTED · 20% LIMIT BREACHED&#x27; };
  if (reaction === &#x27;market-halt&#x27;)   label = { t: &#x27;MARKET-WIDE CIRCUIT BREAKER&#x27;, s: &#x27;NIFTY −10% · ALL TRADING HALTED FOR 45 MIN&#x27; };
  if (reaction === &#x27;bull&#x27;)          label = { t: &#x27;BULL RUN&#x27;, s: &#x27;BUYERS IN CONTROL · BREADTH POSITIVE&#x27; };
  if (reaction === &#x27;bear&#x27;)          label = { t: &#x27;BEAR MOVE&#x27;, s: &#x27;SELLERS IN CONTROL · BREADTH NEGATIVE&#x27; };
  if (reaction === &#x27;fade&#x27;)          label = { t: &#x27;PRICED IN&#x27;, s: &#x27;NEWS ALREADY IN THE TAPE&#x27; };

  return (
    &lt;div className={`flash flash-${kind} ${reaction === &#x27;market-halt&#x27; ? &#x27;flash-strobe&#x27; : &#x27;&#x27;}`}&gt;
      {label &amp;&amp; (
        &lt;div className=&quot;flash-card&quot;&gt;
          &lt;div className=&quot;flash-marquee&quot; aria-hidden=&quot;true&quot;&gt;
            {Array.from({ length: 12 }, (_, i) =&gt; (
              &lt;span key={i}&gt;{label.t} · &lt;/span&gt;
            ))}
          &lt;/div&gt;
          &lt;div className=&quot;flash-t&quot;&gt;{label.t}&lt;/div&gt;
          &lt;div className=&quot;flash-s mono&quot;&gt;{label.s}&lt;/div&gt;
        &lt;/div&gt;
      )}
    &lt;/div&gt;
  );
}

// ───────────────────────── status bar (P&amp;L of predictions)
function StatusBar({ answers, total, streak }) {
  const correct = answers.filter(a =&gt; a.correct).length;
  const acc = answers.length ? Math.round((correct / answers.length) * 100) : 0;
  // simulated &quot;sentiment&quot; — tilt to whichever side the user is hitting more
  const calls = answers.length;
  return (
    &lt;div className=&quot;statusbar&quot;&gt;
      &lt;span className=&quot;s-l mono&quot;&gt;CALLS &lt;b&gt;{pad2(calls)}/{pad2(total)}&lt;/b&gt;&lt;/span&gt;
      &lt;span className=&quot;sep&quot;/&gt;
      &lt;span className=&quot;s-l mono&quot;&gt;HITS &lt;b className=&quot;up&quot;&gt;{pad2(correct)}&lt;/b&gt;&lt;/span&gt;
      &lt;span className=&quot;sep&quot;/&gt;
      &lt;span className=&quot;s-l mono&quot;&gt;ACCURACY &lt;b className=&quot;up&quot;&gt;{acc}%&lt;/b&gt;&lt;/span&gt;
      &lt;span className=&quot;sep&quot;/&gt;
      &lt;span className=&quot;s-l mono&quot;&gt;STREAK &lt;b className=&quot;amber&quot;&gt;{streak}🔥&lt;/b&gt;&lt;/span&gt;
      &lt;span className=&quot;grow-sp&quot;/&gt;
      &lt;span className=&quot;s-r mono dim&quot;&gt;F1 HELP · F8 BUY · F9 SELL · ESC CLOSE&lt;/span&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── intro / boot screen
function BootScreen({ onStart }) {
  const [lines, setLines] = useState([]);
  const all = [
    &#x27;[ifm-pulse] booting market simulation...&#x27;,
    &#x27;[net] connecting to NSE feed ......... OK&#x27;,
    &#x27;[net] connecting to BSE feed ......... OK&#x27;,
    &#x27;[net] connecting to MCX feed ......... OK&#x27;,
    &#x27;[feed] subscribing to 24 symbols ..... OK&#x27;,
    &#x27;[risk] loading circuit thresholds .... ±10% ±15% ±20%&#x27;,
    &#x27;[session] 09:15 IST · pre-open complete&#x27;,
    &#x27;[ifm-pulse] terminal ready. press ENTER to begin.&#x27;,
  ];
  useEffect(() =&gt; {
    let i = 0;
    const id = setInterval(() =&gt; {
      setLines(prev =&gt; [...prev, all[i]]);
      i++;
      if (i &gt;= all.length) clearInterval(id);
    }, 180);
    return () =&gt; clearInterval(id);
  }, []);
  useEffect(() =&gt; {
    function onKey(e) { if (e.key === &#x27;Enter&#x27;) onStart(); }
    window.addEventListener(&#x27;keydown&#x27;, onKey);
    return () =&gt; window.removeEventListener(&#x27;keydown&#x27;, onKey);
  }, [onStart]);
  return (
    &lt;div className=&quot;boot&quot;&gt;
      &lt;div className=&quot;boot-card&quot;&gt;
        &lt;div className=&quot;boot-brand&quot;&gt;
          &lt;span className=&quot;logo-dot lg&quot;/&gt;
          &lt;div&gt;
            &lt;div className=&quot;boot-t&quot;&gt;IFM &lt;span className=&quot;brand-2&quot;&gt;MARKET PULSE&lt;/span&gt;&lt;/div&gt;
            &lt;div className=&quot;boot-s mono&quot;&gt;v2.1.04 · stocks · indices · derivatives&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div className=&quot;boot-log mono&quot;&gt;
          {lines.map((l, i) =&gt; &lt;div key={i} className=&quot;boot-line&quot;&gt;{l}&lt;/div&gt;)}
          &lt;div className=&quot;boot-caret&quot;/&gt;
        &lt;/div&gt;
        &lt;div className=&quot;boot-rules&quot;&gt;
          &lt;div className=&quot;rule&quot;&gt;&lt;b&gt;1.&lt;/b&gt; A market event drops. Read the headline.&lt;/div&gt;
          &lt;div className=&quot;rule&quot;&gt;&lt;b&gt;2.&lt;/b&gt; Predict: sharp rise, slight rise, flat, slight fall, sharp fall.&lt;/div&gt;
          &lt;div className=&quot;rule&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Watch the tape react. Learn why.&lt;/div&gt;
        &lt;/div&gt;
        &lt;button className=&quot;boot-btn&quot; onClick={onStart}&gt;
          ▶ ENTER TRADING FLOOR &lt;span className=&quot;mono dim&quot;&gt;[ENTER]&lt;/span&gt;
        &lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── summary
function SummaryScreen({ answers, onReplay }) {
  const correct = answers.filter(a =&gt; a.correct).length;
  const total = answers.length;
  const pct = Math.round((correct / total) * 100);
  let rank, blurb;
  if (pct &gt;= 80)      { rank = &#x27;PORTFOLIO MANAGER&#x27;; blurb = &#x27;You read the tape like a pro. Institutional reactions matched yours.&#x27;; }
  else if (pct &gt;= 60) { rank = &#x27;SHARP ANALYST&#x27;;     blurb = &#x27;Strong instincts. You separated hype from fundamentals on most calls.&#x27;; }
  else if (pct &gt;= 40) { rank = &#x27;CURIOUS TRAINEE&#x27;;   blurb = &#x27;You’re getting it. The surprises are exactly where the lessons live.&#x27;; }
  else                { rank = &#x27;FRESH INTERN&#x27;;      blurb = &#x27;The market fooled you today — it fools everyone. That’s the lesson.&#x27;; }

  return (
    &lt;div className=&quot;summary&quot;&gt;
      &lt;div className=&quot;sum-card&quot;&gt;
        &lt;div className=&quot;sum-tag mono&quot;&gt;SESSION CLOSED · {pad2(new Date().getHours())}:{pad2(new Date().getMinutes())} IST&lt;/div&gt;
        &lt;div className=&quot;sum-rank&quot;&gt;{rank}&lt;/div&gt;
        &lt;div className=&quot;sum-blurb&quot;&gt;{blurb}&lt;/div&gt;
        &lt;div className=&quot;sum-stats&quot;&gt;
          &lt;div className=&quot;sum-stat&quot;&gt;&lt;div className=&quot;ss-l mono&quot;&gt;HITS&lt;/div&gt;&lt;div className=&quot;ss-v up&quot;&gt;{correct}&lt;/div&gt;&lt;/div&gt;
          &lt;div className=&quot;sum-stat&quot;&gt;&lt;div className=&quot;ss-l mono&quot;&gt;MISSES&lt;/div&gt;&lt;div className=&quot;ss-v dn&quot;&gt;{total - correct}&lt;/div&gt;&lt;/div&gt;
          &lt;div className=&quot;sum-stat&quot;&gt;&lt;div className=&quot;ss-l mono&quot;&gt;ACCURACY&lt;/div&gt;&lt;div className=&quot;ss-v amber&quot;&gt;{pct}%&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div className=&quot;sum-list&quot;&gt;
          {answers.map((a, i) =&gt; {
            const ev = window.EVENTS.find(e =&gt; e.id === a.id);
            const up = ev.actualMovePct &gt;= 0;
            return (
              &lt;div key={i} className={`sum-row ${a.correct ? &#x27;sum-ok&#x27; : &#x27;sum-no&#x27;}`}&gt;
                &lt;span className=&quot;mono dim&quot;&gt;{pad2(i+1)}&lt;/span&gt;
                &lt;span className=&quot;sum-sym&quot;&gt;{ev.primaryTicker}&lt;/span&gt;
                &lt;span className=&quot;sum-conc&quot;&gt;{ev.concept}&lt;/span&gt;
                &lt;span className={`mono ${up ? &#x27;up&#x27; : &#x27;dn&#x27;}`}&gt;{up ? &#x27;+&#x27; : &#x27;&#x27;}{ev.actualMovePct}%&lt;/span&gt;
                &lt;span className={`sum-mark mono ${a.correct ? &#x27;up&#x27; : &#x27;dn&#x27;}`}&gt;{a.correct ? &#x27;✓&#x27; : &#x27;✗&#x27;}&lt;/span&gt;
              &lt;/div&gt;
            );
          })}
        &lt;/div&gt;
        &lt;button className=&quot;boot-btn&quot; onClick={onReplay}&gt;↻ RE-OPEN SESSION&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

// ───────────────────────── App
function App() {
  const [phase, setPhase] = useState(&#x27;boot&#x27;); // boot | predict | reveal | summary
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [streak, setStreak] = useState(0);
  const [flash, setFlash] = useState(null); // {kind, reaction}
  const [board, applyEvent] = useTickerState();

  const events = useMemo(() =&gt; {
    const a = window.EVENTS.slice();
    for (let i = a.length - 1; i &gt; 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a.slice(0, Math.min(10, a.length));
  }, []);
  const total = events.length;
  const current = events[idx];

  function start() {
    window.SFX.init();
    window.SFX.bell();
    setPhase(&#x27;predict&#x27;);
  }
  function answer(choiceId) {
    const isCorrect = choiceId === current.correct;
    setAnswers(a =&gt; [...a, { id: current.id, choice: choiceId, correct: isCorrect }]);
    setStreak(s =&gt; isCorrect ? s + 1 : 0);

    // Trigger ticker move + flash + sound
    applyEvent(current.affected);
    if (current.sound &amp;&amp; window.SFX[current.sound]) window.SFX[current.sound]();
    setFlash({ kind: current.flash, reaction: current.reaction });

    // Move to reveal after the flash starts (short delay so player feels it land)
    setTimeout(() =&gt; setPhase(&#x27;reveal&#x27;), 300);
  }
  function next() {
    setFlash(null);
    setTimeout(function(){try{var fe=window.frameElement;window.parent.scrollTo({top:window.parent.pageYOffset+fe.getBoundingClientRect().top-60,behavior:&#x27;smooth&#x27;});}catch(e){}},120);
    if (idx + 1 &gt;= total) {
      setPhase(&#x27;summary&#x27;);
    } else {
      setIdx(i =&gt; i + 1);
      setPhase(&#x27;predict&#x27;);
    }
  }
  function replay() {
    setIdx(0); setAnswers([]); setStreak(0); setPhase(&#x27;boot&#x27;);
  }

  const lastChoice = answers.length &amp;&amp; phase === &#x27;reveal&#x27; ? answers[answers.length - 1].choice : null;

  return (
    &lt;div className=&quot;terminal&quot; data-screen-label={phase}&gt;
      &lt;TopTape /&gt;
      &lt;TickerBar board={board} /&gt;

      {phase === &#x27;boot&#x27; &amp;&amp; &lt;BootScreen onStart={start}/&gt;}

      {(phase === &#x27;predict&#x27; || phase === &#x27;reveal&#x27;) &amp;&amp; (
        &lt;div className=&quot;main&quot;&gt;
          &lt;div className=&quot;main-l&quot;&gt;
            {phase === &#x27;predict&#x27; &amp;&amp; (
              &lt;BreakingPanel event={current} round={idx+1} total={total} onAnswer={answer}/&gt;
            )}
            {phase === &#x27;reveal&#x27; &amp;&amp; (
              &lt;RevealPanel event={current} userChoice={lastChoice}
                round={idx+1} total={total} onNext={next}
                isLast={idx+1 &gt;= total}/&gt;
            )}
          &lt;/div&gt;
          &lt;div className=&quot;main-r&quot;&gt;
            &lt;TickerGrid board={board} highlight={current.primaryTicker}/&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      )}

      {phase === &#x27;summary&#x27; &amp;&amp; &lt;SummaryScreen answers={answers} onReplay={replay}/&gt;}

      &lt;StatusBar answers={answers} total={total} streak={streak}/&gt;
      &lt;FlashOverlay kind={flash?.kind} reaction={flash?.reaction} onDone={() =&gt; setFlash(null)}/&gt;
    &lt;/div&gt;
  );
}

ReactDOM.createRoot(document.getElementById(&#x27;stage&#x27;)).render(&lt;App /&gt;);
  &lt;/script&gt;
&lt;/body&gt;
