<style>
:root{
  /* Brand Guidelines 2026 §3 — exact values, no drift */
  --navy:#1a3a5c;     --ink:#1a3a5c;      --navy-lt:#264d78;
  --teal:#2a9d8f;     --teal-deep:#1f7a70;
  --muted:#5a7d8a;    --cream:#f7faf9;    --white:#ffffff;
  --mint:#bde9e4;     --mint-lt:#e0f3f0;
  --gold:#c9a84c;     --gold-lt:#f5f0e0;
  --success:#27AE60;  --danger:#c0392b;
  --line:#dfe9e7;

  --r-sec:16px; --r-card:14px; --r-input:12px; --r-pill:10px;
}
@page{ size:A4; margin:16mm 16mm 15mm; }

@page dark { size:A4; margin:0; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

  font-size:10.5pt; line-height:1.6;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
p{margin:0 0 3.6mm}
b,strong{font-weight:700}
em{font-style:italic}

.page{break-before:page;page-break-before:always}

/* full-bleed tinted sheets — §24 "alternating section backgrounds" */
.sheet{width:210mm;min-height:297mm;padding:18mm 16mm 16mm;break-before:page;
  page-break-before:always}
.sheet.cream{page:cream;background:var(--cream)}
.sheet.mint {page:cream;background:var(--mint-lt)}
.sheet.mint .shot{border-color:#c8e3de}

.sheet.dark figcaption{color:#a9c6d4}
.sheet.dark .shot{border-color:rgba(189,233,228,.28);

.sheet.dark .step p{color:#bcd4dc}

/* ══ COVER ══════════════════════════════════════════════════════════════ */
.cover{
  page:cover; width:210mm; height:297mm; padding:22mm 20mm 18mm;

}
.cover::after{ /* watermark */

  background:url('assets/ifm-logo-round.png') center/contain no-repeat; opacity:.05;
}
.cover-logo{background:#fff;border-radius:var(--r-card);padding:4mm 6mm;align-self:flex-start;
  box-shadow:0 2mm 8mm rgba(0,0,0,.18)}
.cover-logo img{height:15mm;width:auto;display:block}
.cover-eyebrow{margin:14mm 0 0;font-size:8.5pt;letter-spacing:.32em;text-transform:uppercase;
  color:#8fd8cd;font-weight:600}
.cover h1{font-family:Lora,Georgia,serif;font-size:46pt;line-height:1.04;font-weight:700;

  border-left:.55mm solid var(--teal-deep);border-bottom:.55mm solid var(--teal-deep);
  transform:rotate(-45deg)}

/* ══ STAT BAND ══════════════════════════════════════════════════════════ */
.stats{display:flex;border-radius:var(--r-sec);color:#fff;overflow:hidden;margin:0 0 5mm;
  background:linear-gradient(135deg, var(--teal) 0%, var(--navy-lt) 55%, var(--navy) 100%)}
.stat{flex:1;padding:4.5mm 4.5mm;border-right:.3mm solid rgba(255,255,255,.14)}
.stat:last-child{border-right:none}
.stat .fig{font-family:Lora,Georgia,serif;font-size:22pt;font-weight:700;color:#f0dfa6;
  line-height:1;margin-bottom:1.5mm}
.stat .cap{font-size:8.5pt;color:#dbeceb;line-height:1.4}

/* ══ IMAGES ═════════════════════════════════════════════════════════════ */
figure{margin:0}
.shot{border-radius:var(--r-input);overflow:hidden;border:.3mm solid var(--line);
  box-shadow:0 1mm 5mm rgba(26,58,92,.10)}
.shot img{width:100%;display:block}
figcaption{font-size:8.5pt;color:var(--muted);margin-top:2mm;line-height:1.45}
.tiles{display:flex;gap:3.5mm;margin-top:5mm}
.tiles figure{flex:1}
.tiles .shot img{height:36mm;object-fit:cover;object-position:top}
.split{display:flex;gap:6mm;align-items:flex-start}
.split .col{flex:1}

/* side photo column (page 2) */
.sidephoto .shot img{height:70mm;object-fit:cover;object-position:center 45%}
/* timeline photo column — fixed heights so both fit beside the timeline */
.tl-photo-a .shot img{height:92mm;object-fit:cover;object-position:center 35%}
.tl-photo-b .shot img{height:58mm;object-fit:cover;object-position:center 40%}

/* wide photo band inside a normal page */
.wideband{margin:0 0 6mm}
.wideband .shot img{height:44mm;object-fit:cover;object-position:center 40%}

/* three-up photo strip */
.pstrip{display:flex;gap:3.5mm;margin:0 0 5mm;break-inside:avoid;page-break-inside:avoid}
.pstrip figure{flex:1}
.pstrip .shot img{height:35mm;object-fit:cover;object-position:center 35%}
.sheet.dark .pstrip .shot{border-color:rgba(189,233,228,.30)}
.closing .pstrip .shot img{height:42mm}

/* two-up photo pair */
.ppair{display:flex;gap:4mm;margin:5mm 0 0;break-inside:avoid;page-break-inside:avoid}
.ppair figure{flex:1}
.ppair .shot img{height:46mm;object-fit:cover;object-position:center 38%}
.ppair.sm .shot img{height:33mm}

/* tinted panel (mint) for short lists */
.panel{background:var(--mint-lt);border-radius:var(--r-sec);padding:5mm 5.5mm 4mm;
  margin:0 0 5mm;break-inside:avoid}
.panel h3{margin-bottom:2.5mm}
.panel .checks{margin-bottom:0}
.panel .checks li{margin-bottom:1.8mm}
.panel .checks li::before{background:#fff}

/* three-step "how they join" strip */
.steps{display:flex;gap:4mm;margin:6mm 0 0}
.step{flex:1;display:flex;gap:3mm;align-items:flex-start}
.step .k{flex:0 0 7mm;height:7mm;border-radius:50%;background:var(--teal);color:#fff;
  font-size:9pt;font-weight:700;display:flex;align-items:center;justify-content:center}
.step p{font-size:9pt;color:var(--muted);margin:0;line-height:1.45}
.step b{color:var(--navy);display:block;font-size:9.5pt}

/* ══ WORKSHOP CARDS ═════════════════════════════════════════════════════ */
.wcard{break-inside:avoid;page-break-inside:avoid;border:.3mm solid var(--line);
  border-radius:var(--r-card);padding:4.5mm 5mm 4mm;margin:0 0 4mm;background:#fff;
  box-shadow:0 1mm 4mm rgba(26,58,92,.06);border-top:1.4mm solid var(--accent,var(--teal))}
.wcard .wnum{background:var(--accent,var(--navy));color:var(--accent-fg,#fff)}
.wcard .pill{background:var(--accent-tint,var(--mint-lt));color:var(--accent-ink,var(--teal-deep))}
.wcard .takeaway{background:var(--accent-tint,var(--cream));
  border-left-color:var(--accent,var(--gold))}
.wcard .takeaway b{color:var(--accent-ink,var(--teal-deep))}
.wcard .wlabel{color:var(--accent-ink,var(--teal-deep))}
.wcard .checks li::before{background:var(--accent-tint,var(--mint-lt))}
.wcard .checks li::after{border-color:var(--accent-ink,var(--teal-deep))}
.wcard .checks{margin-bottom:0}
.wcard .checks li{margin-bottom:1.9mm;font-size:9.6pt}
.wcard-head{display:flex;align-items:flex-start;gap:4mm;margin-bottom:2.5mm}
.wnum{flex:0 0 11mm;height:11mm;border-radius:var(--r-input);background:var(--navy);color:#fff;
  font-family:Lora,Georgia,serif;font-size:14pt;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.wtitle{flex:1}
.wtitle h3{margin:0 0 1.2mm;line-height:1.25}
.pill{display:inline-block;background:var(--mint-lt);color:var(--teal-deep);font-size:8pt;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1mm 3mm;border-radius:99px}
.wobj{font-size:9.4pt;color:var(--muted);margin:0 0 3mm;line-height:1.48}
.wlabel{font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-deep);
  font-weight:700;margin:0 0 2.2mm}
.takeaway{background:var(--cream);border-left:1.2mm solid var(--gold);border-radius:0 var(--r-pill) var(--r-pill) 0;
  padding:3mm 4mm;margin-top:3.5mm;font-family:Lora,Georgia,serif;font-size:9.8pt;
  font-style:italic;line-height:1.42}
.takeaway b{font-style:normal;font-weight:700;color:var(--teal-deep);font-family:inherit}

/* summary table */
.sumtable{width:100%;border-collapse:collapse;margin:0 0 6mm;font-size:9pt}
.sumtable th{font-size:7.6pt;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-deep);
  text-align:left;padding:0 4mm 2.2mm 0;border-bottom:.6mm solid var(--navy);font-weight:700}
.sumtable td{padding:2.6mm 4mm 2.6mm 0;border-bottom:.3mm solid var(--line);vertical-align:top;
  line-height:1.45}
.sumtable td:first-child{font-weight:700;width:38%}
.sumtable td:nth-child(2){color:var(--teal-deep);font-weight:700;width:14%;white-space:nowrap}

/* ══ TIMELINE ═══════════════════════════════════════════════════════════ */
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 5mm 14mm;border-left:.4mm solid var(--line);
  margin-left:16mm}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline .t{position:absolute;left:-16mm;top:-0.5mm;width:14mm;text-align:right;
  font-size:9pt;font-weight:700;color:var(--teal-deep);font-variant-numeric:tabular-nums}
.timeline li::before{content:"";position:absolute;left:-1.6mm;top:1mm;width:3mm;height:3mm;
  border-radius:50%;background:var(--teal);border:.6mm solid #fff}
.timeline h4{font-size:10.5pt;font-weight:700;margin:0 0 1mm}
.timeline p{font-size:9pt;color:var(--muted);margin:0;line-height:1.5}

/* ══ QUOTES / TESTIMONIALS ══════════════════════════════════════════════ */
.quotes{display:flex;gap:4mm;margin:0 0 7mm}
.quote{flex:1;background:var(--mint-lt);border-radius:var(--r-card);padding:5mm}
.quote p{font-family:Lora,Georgia,serif;font-style:italic;font-size:10pt;line-height:1.45;
  margin:0 0 3mm}
.quote .who{font-size:8.5pt;color:var(--teal-deep);font-weight:700;font-style:normal}

.founder{display:flex;gap:6mm;align-items:flex-start}
.founder .pic{flex:0 0 46mm}
.founder .pic img{width:100%;border-radius:var(--r-card);display:block}
.founder .pic .cap{font-size:8.5pt;color:var(--muted);text-align:center;margin-top:2mm}
.founder .txt{flex:1}
.founder .txt p{font-size:9.5pt;margin-bottom:3mm}

/* ══ CLOSING SHEET (bookends the cover) ═════════════════════════════════ */
.closing{display:flex;flex-direction:column;position:relative;overflow:hidden}
.closing::after{content:"";position:absolute;left:-46mm;bottom:-46mm;width:150mm;height:150mm;
  background:url('assets/ifm-logo-round.png') center/contain no-repeat;opacity:.06}
.closing .inner{margin:auto 0;position:relative;z-index:1}
.closing .eyebrow{color:var(--mint)}
.closing h2{color:#fff;font-size:30pt;margin-bottom:4mm}
.closing .rule{width:30mm;height:1.4mm;background:var(--gold);border-radius:1mm;margin:0 0 6mm}
.closing .say{font-size:11.5pt;color:#d3e6e4;max-width:125mm;line-height:1.55}
.closing .card{background:rgba(255,255,255,.07);border:.3mm solid rgba(189,233,228,.28);
  border-radius:var(--r-sec);padding:7mm 7.5mm;margin-top:8mm;max-width:135mm}
.closing .name{font-family:Lora,Georgia,serif;font-size:17pt;font-weight:700;color:#fff;
  margin:0 0 2mm}
.closing .line{font-size:11pt;color:#fff;margin:0 0 4mm}
.closing .line a{color:var(--mint);text-decoration:none}
.closing .links{font-size:9.8pt;color:#c6dcdd;line-height:1.9;margin:0;padding-top:4mm;
  border-top:.3mm solid rgba(189,233,228,.24)}
.closing .links a{color:var(--gold);text-decoration:none}
.closing .foot{margin-top:auto;position:relative;z-index:1;display:flex;align-items:center;
  gap:4mm;padding-top:8mm;border-top:.3mm solid rgba(189,233,228,.20)}
.closing .foot img{width:13mm}
.closing .foot b{display:block;font-size:10pt;color:#fff}
.closing .foot small{font-size:8.5pt;color:#a9c6d4}

/* ══ CLOSING ════════════════════════════════════════════════════════════ */
.cta{background:var(--navy);color:#fff;border-radius:var(--r-card);padding:6.5mm 7mm;margin-top:5mm;
  position:relative;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
.cta h2{color:#fff;margin-bottom:2.5mm;font-size:20pt}
.cta p{color:#cddae3;max-width:120mm}
.cta .name{font-family:Lora,Georgia,serif;font-size:14pt;font-weight:700;color:#fff;margin:4mm 0 1mm}
.cta .line{font-size:10.5pt;color:#fff;margin:0 0 1mm}
.cta a{color:var(--gold);text-decoration:none}
.cta .links{font-size:9.3pt;color:#cddae3;line-height:1.7;margin-top:3.5mm;
  padding-top:3.5mm;border-top:.3mm solid rgba(255,255,255,.18)}
.brandfoot{text-align:center;margin-top:5mm;break-inside:avoid}
.brandfoot img{width:11mm;display:block;margin:0 auto 1.5mm}
.brandfoot span{font-size:8.5pt;font-weight:700;color:var(--navy)}
.brandfoot small{display:block;font-size:8pt;color:var(--muted);margin-top:.5mm}
.note{font-size:8.6pt;color:var(--muted);margin-top:3mm;line-height:1.45}
</style>
