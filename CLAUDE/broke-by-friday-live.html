function renderWealthStressChart(ps){
  if(!ps||ps.length<2) return '';
  const W=500,H=170,PL=42,PR=20,PT=20,PB=38,IW=W-PL-PR,IH=H-PT-PB;
  const minNW=-3000,maxNW=STARTING_CASH;
  const cx=nw=>PL+((Math.max(minNW,Math.min(maxNW,nw))-minNW)/(maxNW-minNW))*IW;
  const cy=st=>PT+(1-Math.min(100,Math.max(0,st))/100)*IH;
  const zeroX=cx(0).toFixed(1);
  const dots=ps.map(p=>{
    const nw=netWorth(p),st=stressOf(p);
    const x=cx(nw).toFixed(1),y=cy(st).toFixed(1);
    return `<g><circle cx="${x}" cy="${y}" r="12" fill="${p.color}" stroke="#140a24" stroke-width="2" opacity=".92"/><text x="${x}" y="${(parseFloat(y)+4.5).toFixed(1)}" text-anchor="middle" font-size="11" font-family="Nunito">${p.av}</text></g>`;
  }).join('');
  return `<div class="sb-chart">
    <div class="sb-chart-lbl">💸 wealth vs 😤 stress — the broke-and-stressed cluster tells the whole story</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible">
      <defs>
        <linearGradient id="dzg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4757" stop-opacity=".18"/><stop offset="1" stop-color="#ff4757" stop-opacity="0"/></linearGradient>
      </defs>
      <rect x="${PL}" y="${PT}" width="${IW*0.38}" height="${IH*0.55}" fill="url(#dzg)" rx="8"/>
      <text x="${PL+6}" y="${PT+13}" font-size="8.5" fill="rgba(255,71,87,.65)" font-weight="900" font-family="Nunito">⚠️ BROKE + STRESSED</text>
      <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      <line x1="${zeroX}" y1="${PT}" x2="${zeroX}" y2="${H-PB}" stroke="rgba(255,71,87,.28)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="${PL+2}" y="${H-PB+13}" font-size="8" fill="rgba(255,255,255,.3)" font-weight="800" font-family="Nunito">BROKE</text>
      <text x="${W-PR}" y="${H-PB+13}" font-size="8" fill="rgba(255,255,255,.3)" font-weight="800" text-anchor="end" font-family="Nunito">LOADED</text>
      <text x="${PL-6}" y="${PT+5}" font-size="8" fill="rgba(255,255,255,.3)" font-weight="800" text-anchor="end" font-family="Nunito">😤</text>
      <text x="${PL-6}" y="${H-PB+2}" font-size="8" fill="rgba(255,255,255,.3)" font-weight="800" text-anchor="end" font-family="Nunito">😌</text>
      ${dots}
    </svg>
  </div>`;
}

function rosterDots(){
  return playersArr().map(p=>{
    const done=p.lastRound===state.round;
    return `<div class="rdot${done?' done':''}" style="background:${p.color}" title="${p.name}">${done?'✓':p.av}</div>`;
  }).join('');
}

/* ════════════════════ PLAYER ════════════════════ */
async function initPlayer(){
  if(!ROOM){ renderJoinPrompt(); return; }
  document.getElementById('connecting').classList.add('hide');
  document.getElementById('player').classList.remove('hide');
  document.getElementById('roleToggle').textContent='Player · room '+ROOM;
  joinChannel();
  try{ const {data}=await db.from('games').select('state').eq('room_code',NS()).single(); if(data&&data.state)state=data.state; }catch(e){}
  if(!state) state=freshState();
  renderPlayer();
  // keep-alive resync every 5s in case a realtime packet is missed
  setInterval(async()=>{ if(isHost)return; try{ const {data}=await db.from('games').select('state').eq('room_code',NS()).single(); if(data&&data.state){ state=data.state; renderPlayer(); } }catch(e){} },5000);
}
function renderJoinPrompt(){
  document.getElementById('connecting').classList.add('hide');
  const pl=document.getElementById('player'); pl.classList.remove('hide');
  pl.innerHTML=`<div class="p-lobby"><h1>BROKE <span class="pk">by</span> FRIDAY</h1><div class="tag">enter the room code from the screen</div>
    <div class="field-lab">room code</div>
    <input class="nameinput" id="roomIn" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;text-align:center;letter-spacing:6px">
    <button class="btn primary" onclick="goRoom()">join →</button></div>`;
}
function goRoom(){ const v=(document.getElementById('roomIn').value||'').trim().toUpperCase(); if(v.length<3)return; location.href=location.pathname+'?role=player&room='+v; }

function me(){ return state&&state.players?state.players[MY_ID]:null; }

function renderPlayer(){
  const pl=document.getElementById('player');
  const p=me();
  // not joined yet → lobby setup
  if(!p){ pl.innerHTML=playerLobby(); return; }
  if(state.phase==='lobby'){ pl.innerHTML=playerWaiting('🎬','you\'re in!','waiting for your teacher to start the month…',p); return; }
  if(state.phase==='goalReveal'){ pl.innerHTML=playerGoalReveal(p); return; }
  if(state.phase==='ended'){ pl.innerHTML=playerEnding(p); return; }
  const scn=curScn();
  const answered = p.lastRound===state.round;
  if(state.phase==='playing'){
    if(answered) _loanSent=null;
    // (B) another student is asking ME to lend
    const lendReq=Object.values(state.loanReqs||{}).find(r=>r.toId===MY_ID);
    if(lendReq){ pl.innerHTML=lendPrompt(lendReq,p); return; }
    // (A) I'm waiting on a lender's answer
    const myReq=(state.loanReqs||{})[MY_ID];
    if((myReq||_loanSent) && !answered){ pl.innerHTML=waitingLender(myReq||_loanSent,p); return; }
    // (A) I'm choosing which classmate to ask
    if(_borrowPick && !answered){ pl.innerHTML=borrowPicker(p); return; }
    if(answered){ pl.innerHTML=playerWaiting('🔒','locked in ✓','waiting for the rest of the class…',p); }
    else { pl.innerHTML=playerScenario(scn,p); }
    return;
  }
  _borrowPick=null; _loanSent=null;
  if(state.phase==='reveal'){ pl.innerHTML=answered?playerResponse(scn,p):playerWaiting('💤','you sat this one out','you didn\'t tap in time — catch the next one!',p); return; }
  if(state.phase==='calendar'){ pl.innerHTML=playerWaiting('📅','next situation loading…','your teacher is setting up the next day 👀',p); return; }
}
/* ── peer-to-peer borrowing (player UI) ── */
let _borrowPick=null;   // {choiceIdx, amount} — A is choosing who to ask
let _loanSent=null;     // {toName, amount} — optimistic waiting state for A
function startBorrowPick(i,amount){ _borrowPick={choiceIdx:i, amount}; renderPlayer(); }
function cancelBorrowPick(){ _borrowPick=null; renderPlayer(); }
function chooseBorrowFrom(toId){ const p=me(); if(!p||!_borrowPick)return; const B=state.players[toId]; const amt=_borrowPick.amount;
  sendAction({type:'loan_request',fromId:MY_ID,toId,round:state.round,choiceIdx:_borrowPick.choiceIdx,amount:amt,fromName:p.name});
  _loanSent={toName:B?B.name:'them', amount:amt}; _borrowPick=null; renderPlayer(); }
function lendRespond(fromId,agree){ sendAction({type:'loan_respond',fromId,agree}); }
function borrowPicker(p){
  const others=playersArr().filter(x=>x.id!==MY_ID);
  const list=others.length?others.map(x=>{const can=x.cash>=_borrowPick.amount;return `<button class="borrow-pick-btn ${can?'':'short'}" ${can?`onclick="chooseBorrowFrom('${x.id}')"`:'disabled'}><span class="bm-av" style="background:${x.color}">${x.av}</span><span class="bp-nm">${x.name}</span><span class="bp-cash">${can?'can lend ✓':"can't — only "+fmt(x.cash)}</span></button>`;}).join('')
    :'<div style="color:var(--faint);font-weight:800;text-align:center;padding:18px">no classmates connected yet</div>';
  return `<div class="pcard">
    <div class="p-prompt" style="margin-top:6px">🤝 borrow ${fmt(_borrowPick.amount)} — who do you ask?</div>
    <div class="bp-hint">they get a notification on their phone. if they say no, you miss out. 😬</div>
    <div class="choices">${list}</div>
    <button class="btn dark" style="margin-top:12px" onclick="cancelBorrowPick()">← back to choices</button>
  </div>`;
}
function lendPrompt(req,p){
  const canLend=p.cash>=req.amount;
  return `<div class="p-center">
    <div class="big-emoji">🤝</div><h2>${req.fromName} needs you</h2>
    <div class="resp-card">
      <div class="lend-ask"><b>${req.fromName}</b> wants to borrow <b style="color:var(--yellow)">${fmt(req.amount)}</b> from you</div>
      <div class="lend-sub">you have ${fmt(p.cash)}. ${canLend?`lend it and they'll owe you ${fmt(req.amount)} 👀`:`you're too broke to cover this 😬`}</div>
      <div class="lend-btns">
        ${canLend?`<button class="btn lime" onclick="lendRespond('${req.fromId}',true)">💸 Lend ${fmt(req.amount)}</button>`:''}
        <button class="btn dark" onclick="lendRespond('${req.fromId}',false)">🙅 ${canLend?'Nope':"Can't"}</button>
      </div>
    </div>
    ${meterHUD(p)}
  </div>`;
}
function waitingLender(req,p){
  return `<div class="p-center"><div class="big-emoji">⏳</div><h2>asking ${req.toName}…</h2><p>waiting to see if <b>${req.toName}</b> will spot you ${fmt(req.amount)} 🤞</p>${statsPanel(p)}</div>`;
}

/* player lobby: name + dream goal */
function playerLobby(){
  const nameVal=_selName!=null?_selName:(localStorage.getItem('bbf_name')||'');
  const goals=GOALS.map(g=>`<button class="goal-card ${_selGoal===g.id?'on':''}" onclick="pickGoal('${g.id}')"><span class="gce">${g.emoji}</span><span class="gcx"><span class="gcn">${g.name}</span><span class="gcp">${fmt(g.target)}</span></span></button>`).join('');
  const ready=nameVal.trim().length>=1 && _selGoal;
  return `<div class="p-lobby">
    <div class="p-lobby-top">
      <h1>BROKE <span class="pk">by</span> FRIDAY</h1>
      <div class="tag">₹15,000 · one month · don't go broke</div>
    </div>
    <div class="p-lobby-mid">
      <div class="field-lab">your name</div>
      <input class="nameinput" id="nameIn" maxlength="14" placeholder="type your name" value="${nameVal.replace(/"/g,'&quot;')}" oninput="_selName=this.value;updateJoinBtn()">
      <div class="field-lab">pick your dream 🎯</div>
      <div class="goal-grid">${goals}</div>
    </div>
    <button class="btn primary" onclick="doJoin()" ${ready?'':'disabled'} id="joinBtn">${joinBtnLabel(nameVal)}</button>
  </div>`;
}
function joinBtnLabel(nameVal){ if(!(nameVal||'').trim())return 'type your name first'; if(!_selGoal)return 'pick a dream first'; return 'lock it in →'; }
function updateJoinBtn(){ const b=document.getElementById('joinBtn'); if(!b)return; const ni=document.getElementById('nameIn'); const nameVal=_selName!=null?_selName:(ni?ni.value:''); b.disabled=!((nameVal||'').trim().length>=1 && _selGoal); b.textContent=joinBtnLabel(nameVal); }
function pickGoal(id){ const ni=document.getElementById('nameIn'); if(ni)_selName=ni.value; _selGoal=id; renderPlayer(); }
function doJoin(){
  const ni=document.getElementById('nameIn'); const raw=(_selName!=null?_selName:(ni?ni.value:''))||'';
  const name=raw.trim().slice(0,14); if(!name){ if(ni)ni.focus(); return; }
  if(!_selGoal)return;
  localStorage.setItem('bbf_name',name);
  const goal=GOALS.find(g=>g.id===_selGoal)||GOALS[0];
  sendAction({type:'join',id:MY_ID,name,goal:{name:goal.name,target:goal.target,emoji:goal.emoji}});
}

function meterHUD(p){
  const st=stressOf(p);
  const sc=v=>v>=70?{bg:'rgba(80,216,144,.18)',br:'rgba(80,216,144,.4)',tx:'#50d890'}:v>=50?{bg:'rgba(168,224,106,.14)',br:'rgba(168,224,106,.35)',tx:'#a8e06a'}:v>=30?{bg:'rgba(255,169,77,.15)',br:'rgba(255,169,77,.38)',tx:'#ffa94d'}:{bg:'rgba(255,71,87,.16)',br:'rgba(255,71,87,.42)',tx:'#ff4757'};
  const mc=sc(p.vibes), fc=sc(p.futureYou);
  const stC=st>=70?'#ff4757':st>=40?'#ffa94d':'#50d890';
  const stSz=st>=70?'2.1rem':st>=40?'1.7rem':'1.4rem';
  const stFire=st>=70?' 🔥':'';
  return `<div class="p-ident"><span class="p-ident-av" style="background:${p.color}">${p.av}</span><span class="p-ident-nm">${p.name}</span></div>
  <div class="p-meterhud">
    <div class="p-meterhud-top">
      <div class="m feat" style="background:${mc.bg};border:1.5px solid ${mc.br}">
        <div class="mv" style="color:${mc.tx}">${Math.round(p.vibes)}<span style="font-size:.9rem">/100</span></div>
        <div class="ml">✨ mood</div>
      </div>
      <div class="m feat" style="background:${fc.bg};border:1.5px solid ${fc.br}">
        <div class="mv" style="color:${fc.tx}">${Math.round(p.futureYou)}<span style="font-size:.9rem">/100</span></div>
        <div class="ml">🔮 future you</div>
      </div>
    </div>
    <div class="p-meterhud-bot">
      <div class="m sm"><div class="mv" style="color:var(--lime)">${fmt(p.cash)}</div><div class="ml">💸 wallet</div></div>
      <div class="m sm"><div class="mv" style="color:var(--yellow)">${fmt(p.jarred)}</div><div class="ml">🫙 saved</div></div>
      <div class="m sm"><div class="mv" style="color:${stC};font-size:${stSz};font-weight:900;line-height:1">${st}${stFire}</div><div class="ml">😤 stress</div></div>
    </div>
  </div>`;
}
function goalBar(p){
  if(!p.goal)return '';
  const pct=Math.min(100,Math.round(p.jarred/p.goal.target*100));
  return `<div class="p-goal"><span class="ge">${p.goal.emoji}</span><div class="gt"><div class="gn">${p.goal.name}</div><div class="gbar"><div class="gfill" style="width:${pct}%"></div></div></div><span class="gp">${pct}%</span></div>`;
}

function playerScenario(scn,p){
  let body='';
  if(scn.kind==='chat') body=`<div class="p-scn-msg">${scn.notif.preview}</div>`;
  else if(scn.kind==='insta') body=`<div class="p-scn-msg"><b>${scn.storyText}</b> <span class="sub">${scn.storySub}</span><span class="sub">${scn.notif.preview}</span></div>`;
  else body=`<div class="p-scn-msg"><b>${scn.alertHeadline}</b> <span class="sub">${scn.alertSub}</span>${scn.momText?`<span class="sub">mom 💗: ${scn.momText}</span>`:''}</div>`;
  const hasBorrowInScn=scn.choices.some(c=>c.debt||c.friendDebt);
  const choices=scn.choices.map((c,i)=>{
    if(c.breakPiggy && (!p.jarred || p.jarred<(c.needsPiggy||1))) return '';
    const spend=Math.abs(c.cash||0);
    let locked=false,need=0;
    if(c.requires && p.cash<c.requires){locked=true;need=c.requires;}
    else if(!c.breakPiggy && (c.cash||0)<0 && p.cash<spend){locked=true;need=spend;}
    if(locked && !hasBorrowInScn){
      const alts=buildAlternatives(c,p);
      if(alts.length){
        const sf=need-p.cash;
        const classmate = playersArr().length>1 ? `<button class="choice borrow" onclick="startBorrowPick(${i},${sf})"><div class="clabel">🤝 borrow from a classmate</div><div class="csub">ask a real student to spot you ${fmt(sf)}</div><div class="cdeltas"><span class="d cash-neg">💸 you'd owe them ${fmt(sf)}</span></div></button>` : '';
        return `<div class="borrow-group">
          <div class="borrow-head"><span>can't afford "${c.label}"</span><span class="borrow-short">short ${fmt(sf)}</span></div>
          ${classmate}
          ${alts.map(a=>`<button class="choice borrow" onclick="chooseAlt(${i},'${a.mode}')"><div class="clabel">${a.label}</div><div class="csub">${a.sub}</div><div class="cdeltas">${altChips(a)}</div></button>`).join('')}
        </div>`;
      }
    }
    const deltas=[
      (c.cash!==undefined&&c.cash!==0)?`<span class="d ${c.cash<0?'cash-neg':'cash-pos'}">${c.cash<0?'−':'+'}${fmt(Math.abs(c.cash))}</span>`:'',
      (c.vibes!==undefined&&c.vibes!==0)?`<span class="d vibe">✨ ${c.vibes>0?'+':''}${c.vibes}</span>`:'',
      (c.futureYou!==undefined&&c.futureYou!==0)?`<span class="d fut">🔮 ${c.futureYou>0?'+':''}${c.futureYou}</span>`:'',
    ].join('');
    const isBroke=c.brokePick&&!locked;
    return `<button class="choice ${locked?'locked':''} ${c.breakPiggy?'piggy':''} ${isBroke?'broke-pick':''}" ${locked?'disabled':`onclick="choose(${i})"`}>
      ${isBroke?'<div class="broke-badge">💀 BROKE MOVE</div>':''}
      <div class="clabel">${c.label}</div><div class="csub">${c.sub}</div>
      ${locked?`<div class="clock">🔒 need ${fmt(need)}</div>`:''}
      <div class="cdeltas">${deltas}</div></button>`;
  }).join('');
  const side = p.sideEvent?`<div class="p-goal" style="background:rgba(80,216,144,.1);border-color:rgba(80,216,144,.3)"><span class="ge">${p.sideEvent.emoji}</span><div class="gt"><div class="gn">${p.sideEvent.text}</div></div></div>`:'';
  return `<div class="pcard choice-screen">${meterHUD(p)}${goalBar(p)}${side}
    <div class="p-scn-head"><div class="p-scn-app" style="background:${scn.appColor}">${appIcon(scn.app)}</div><div><div class="p-scn-from">${scn.sender}</div><div class="p-scn-handle">${scn.handle} · ${scn.notif.time}</div></div></div>
    ${body}
    <div class="p-prompt">${scn.prompt}</div>
    <div class="choices">${choices}</div></div>`;
}
function choose(i){ const p=me(); if(!p||p.lastRound===state.round)return; sendAction({type:'choose',id:MY_ID,round:state.round,choiceIdx:i,mode:'normal'}); }
function chooseAlt(i,mode){ const p=me(); if(!p||p.lastRound===state.round)return; sendAction({type:'choose',id:MY_ID,round:state.round,choiceIdx:i,mode}); }

function playerResponse(scn,p){
  const d=p.lastDeltas||{};
  const bd=[
    (d.cash)?`<div class="bd"><div class="bv" style="color:${d.cash<0?'var(--red)':'var(--lime)'}">${d.cash<0?'−':'+'}${fmt(Math.abs(d.cash))}</div><div class="bl">wallet</div></div>`:'',
    (d.vibes)?`<div class="bd"><div class="bv" style="color:var(--pink-s)">${d.vibes>0?'+':''}${d.vibes}</div><div class="bl">✨ mood</div></div>`:'',
    (d.futureYou)?`<div class="bd"><div class="bv" style="color:var(--purple)">${d.futureYou>0?'+':''}${d.futureYou}</div><div class="bl">🔮 future</div></div>`:'',
  ].join('');
  return `<div class="p-center">
    ${p.lastSticker?`<div class="resp-sticker">${p.lastSticker}</div>`:''}
    <div class="big-emoji">${scn.kind==='alert'?'⚡':'💬'}</div>
    <div class="resp-card">
      <div class="resp-reply">${p.lastReply||'choice locked in.'}</div>
      ${bd?`<div class="resp-deltas">${bd}</div>`:''}
    </div>
    <div style="font-size:.82rem;font-weight:900;letter-spacing:1px;color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:10px">📊 your stats now</div>
    ${statsPanel(p)}
    <p>waiting for your teacher to start the next day…</p>
  </div>`;
}
function playerWaiting(emoji,title,sub,p){
  return `<div class="p-center"><div class="big-emoji">${emoji}</div><h2>${title}</h2>${statsPanel(p)}<p>${sub}</p></div>`;
}
function playerGoalReveal(p){
  const nw=netWorth(p);
  const goal=p.goal||{name:'the bag',target:8000,emoji:'💰'};
  const canAfford=nw>=goal.target;
  if(p.goalAchieved){
    return `<div class="gr-claimed">
      <div class="gr-trophy">🏆</div>
      <div class="gr-score">+20</div>
      <div class="gr-name">life score bonus added!</div>
      <div style="font-size:2rem;margin:4px 0">${goal.emoji}</div>
      <div style="font-weight:900;font-size:1.05rem;color:var(--lime)">${goal.name} — YOURS!</div>
      <div style="font-size:.88rem;color:var(--muted);font-weight:800;margin-top:4px">wallet: ${fmt(nw)} · you made it happen 💪</div>
    </div>`;
  }
  if(canAfford){
    return `<div class="gr-afford">
      <div style="font-size:.85rem;font-weight:900;letter-spacing:1px;color:#FFD700;text-transform:uppercase">🎯 You did it</div>
      <div class="gr-emoji">${goal.emoji}</div>
      <div class="gr-title">YOU SAVED ENOUGH!</div>
      <div class="gr-sub">Wallet: <b style="color:#FFD700">${fmt(nw)}</b> · Target was ${fmt(goal.target)}</div>
      <button class="gr-claim-btn" onclick="claimGoal()">🎉 Claim my ${goal.name}!</button>
      <div style="font-size:.78rem;color:var(--muted);font-weight:800">+20 life score bonus when you tap</div>
    </div>`;
  }
  const shortfall=goal.target-nw;
  const pct=Math.round(nw/goal.target*100);
  const spent=STARTING_CASH-nw;
  return `<div class="gr-miss">
    <div class="gr-emoji-faded">${goal.emoji}</div>
    <div class="gr-miss-title">₹${Math.round(shortfall).toLocaleString('en-IN')} away</div>
    <div style="font-size:.95rem;font-weight:800;color:var(--muted)">from your ${goal.name}</div>
    <div class="gr-miss-detail">
      You reached <strong>${pct}%</strong> of your goal.<br>
      You had <strong>${fmt(STARTING_CASH)}</strong> to start and spent <strong>${fmt(spent)}</strong>.<br>
      <span style="color:var(--amber)">One fewer splurge would have done it.</span>
    </div>
    ${statsPanel(p)}
  </div>`;
}
function claimGoal(){
  sendAction({type:'claimGoal',id:MY_ID});
  const p=me(); if(p) p.goalAchieved=true;
  _confettiBurst();
  renderPlayer();
}
function _confettiBurst(){
  const colors=['#FFD700','#ff9500','#50d890','#ff4757','#9a7bf0','#34c759','#00cfff'];
  for(let i=0;i<70;i++){
    const el=document.createElement('div');
    const size=6+Math.random()*8;
    el.style.cssText=`position:fixed;width:${size}px;height:${size}px;background:${colors[i%colors.length]};`+
      `left:${Math.random()*100}vw;top:-10px;border-radius:${Math.random()>.5?'50%':'3px'};`+
      `z-index:9999;pointer-events:none;`+
      `animation:confettiFall ${1.2+Math.random()*1.8}s ease-in ${Math.random()*.4}s forwards`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3200);
  }
}

function playerEnding(p){
  const nw=netWorth(p); const pct=p.goal?Math.min(100,Math.round(p.jarred/p.goal.target*100)):0;
  const hit=p.goal&&p.jarred>=p.goal.target;
  let tier,title,sub;
  if(hit && p.futureYou>=65 && p.vibes>=50){tier='secret';title='GENERATIONAL WEALTH LOADING…';sub=`you saved up for ${p.goal.emoji} ${p.goal.name} AND had fun. new game+ energy.`;}
  else if(nw>=4000 && p.vibes>=50 && p.futureYou>=50){tier='thriving';title='THRIVING ✨';sub='wallet healthy. mood intact. future-you sending hearts.';}
  else if(nw>=1500){tier='survived';title='SURVIVED 😮‍💨';sub='you made it. barely. respectfully.';}
  else if(nw>=0){tier='broke';title='BROKE BY FRIDAY 💀';sub='wallet empty. group chat awkward. mom suspicious.';}
  else {tier='broke';title='OVERDRAWN 🚨';sub='you spent more than you had. real-world, this is how debt starts.';}
  const goal=p.goal||{name:'the bag',target:8000,emoji:'💰'};
  const lesson=computeLesson(p);
  const cfNW=nw+lesson.extra;
  const cfSaved=p.jarred+lesson.extra;
  const cfGoalPct=Math.min(100,Math.round(cfSaved/goal.target*100));
  const wouldHit=cfSaved>=goal.target;
  let lessonHtml;
  if(lesson.extra>=100){
    lessonHtml=`<div class="lesson-card">
      <div class="lc-tag">🔮 if you'd played it differently…</div>
      <div class="lc-body">Make the <b>smart-money call</b> at every buzz and you'd have <b>${fmt(cfNW)}</b> — that's <b>${fmt(lesson.extra)} more</b> than you walked away with.</div>
      <div class="lc-twin">
        <div class="lc-col"><div class="lc-v">${fmt(nw)}</div><div class="lc-l">the you<br>that played</div></div>
        <div class="lc-vs">vs</div>
        <div class="lc-col win"><div class="lc-v">${fmt(cfNW)}</div><div class="lc-l">your disciplined<br>twin</div></div>
      </div>
      <div class="lc-win">${wouldHit?`🎯 that's enough to FINISH your ${goal.emoji} ${goal.name}${cfSaved-goal.target>0?` — with ${fmt(cfSaved-goal.target)} to spare`:''}. you got ${pct}%.`:`that would've put you ${cfGoalPct}% toward ${goal.emoji} ${goal.name} — you reached ${pct}%.`}</div>
      ${lesson.biggest?`<div class="lc-leak">💸 <b>your biggest leak — day ${lesson.biggest.day}:</b> you chose "${lesson.biggest.their}". The smart move was "${lesson.biggest.saver}" — worth ${fmt(lesson.biggest.gain)} on its own.</div>`:''}
    </div>`;
  } else {
    lessonHtml=`<div class="lesson-card"><div class="lc-tag">🔮 the verdict</div><div class="lc-body">You played the <b>smart-money game</b> — you barely left a rupee on the table. ${hit?`And you hit your ${goal.emoji} ${goal.name}. Absolute legend.`:`A little more stashed and ${goal.name} is yours next month.`}</div></div>`;
  }
  return `<div class="p-center">
    <div class="big-emoji">${hit?'🎉':tier==='thriving'?'✨':tier==='survived'?'😮‍💨':'💀'}</div>
    <h2 style="color:${tier==='broke'?'var(--red)':'var(--lime)'}">${title}</h2>
    <p>${sub}</p>
    ${lessonHtml}
    <div style="font-size:.62rem;font-weight:900;letter-spacing:1.5px;color:var(--faint);text-transform:uppercase">📊 your final stats</div>
    ${statsPanel(p)}
    <p>🔮 next month: flip the spend-vs-save ratio and ${goal.name} is yours.</p>
  </div>`;
}

let _pillQR=null,_bigQR=null,_lobbyQR=null;

  try{ _lobbyQR=new QRCode(box,{text:playerUrl(),width:172,height:172,colorDark:'#140a24',colorLight:'#ffffff'}); }catch(e){ box.innerHTML='<div style="color:#140a24;font-weight:900;font-size:.7rem;padding:8px">'+playerUrl()+'</div>'; } }
/* ── rules slideshow ── */
const RULE_SLIDES=[
  {emoji:'💰',title:'₹15,000 to start',body:'Every student gets ₹15,000 of pocket money for the month. One month. Real decisions. Every tap moves money — for better or worse.'},
  {emoji:'📱',title:'Scenarios hit the phone',body:'Text messages. Instagram drops. Family asks. Midnight cravings. Students pick on their phones — you see every choice on the projector in real time.'},
  {emoji:'✨',title:'Mood',body:'Goes UP when you say yes to fun or help friends. Goes DOWN when you miss out, stress-spend, or FOMO-buy something you instantly regret.'},
  {emoji:'🔮',title:'Future You',body:'Rises when you save, resist impulse buys, or invest in yourself. Drops when you overspend, take debt, or blow cash on things that don\'t last.'},
  {emoji:'😤',title:'Stress',body:'Builds when cash gets dangerously low or you borrow money. High stress tanks your final score — even if you still have money left.'},
  {emoji:'⭐',title:'Life Score = how you WIN',body:'Score = wealth ÷ 500 + 2× mood + future you − stress. It\'s not just about money. Boring savers crater their score too. Balance wins.'},
  {emoji:'🎯',title:'Dream Goal',body:'Every student picks something they\'re saving toward — Jordans, PS5, Coldplay PIT. Save enough by the end? Claim it on the phone for a +20 bonus on the final score!'},
];
let _rulesIdx=0;
function openRules(){ _rulesIdx=0; _renderRulesSlide(); document.getElementById('rulesOverlay').classList.add('open'); }
function closeRules(){ document.getElementById('rulesOverlay').classList.remove('open'); }
function rulesNext(){ if(_rulesIdx<RULE_SLIDES.length-1){ _rulesIdx++; _renderRulesSlide(); } else closeRules(); }
function rulesPrev(){ if(_rulesIdx>0){ _rulesIdx--; _renderRulesSlide(); } }
function _renderRulesSlide(){
  const s=RULE_SLIDES[_rulesIdx], last=_rulesIdx===RULE_SLIDES.length-1;
  document.getElementById('rulesEmoji').textContent=s.emoji;
  document.getElementById('rulesTitle').textContent=s.title;
  document.getElementById('rulesBody').textContent=s.body;
  document.getElementById('rulesCounter').textContent=(_rulesIdx+1)+' / '+RULE_SLIDES.length;
  document.getElementById('rulesPrevBtn').disabled=_rulesIdx===0;
  const nb=document.getElementById('rulesNextBtn');
  nb.textContent=last?'✓ Done':'Next →';
  nb.className='rules-nav-btn'+(last?' done':'');
  document.getElementById('rulesDots').innerHTML=RULE_SLIDES.map((_,i)=>`<div class="rules-dot${i===_rulesIdx?' active':''}"></div>`).join('');
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('rulesOverlay').classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key===' ')rulesNext();
  if(e.key==='ArrowLeft')rulesPrev();
  if(e.key==='Escape')closeRules();
});

function openShareQR(){ const box=document.getElementById('bigqr'); box.innerHTML=''; try{ _bigQR=new QRCode(box,{text:playerUrl(),width:248,height:248,colorDark:'#1a1340',colorLight:'#ffffff'}); }catch(e){} document.getElementById('qrOverlay').classList.add('open'); }
function closeShareQR(){ document.getElementById('qrOverlay').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeShareQR(); });

/* ════════════════════ BOOT ════════════════════ */
if(isHost) initHost(); else initPlayer();

/* ── Tap-to-rejoin (added 2026-09-17) — see quiz.html for full note.
   Reload is portfolio-safe: MY_ID is in localStorage ('bbf_pid'), and
   the host's join handler restores from removedPlayers if archived, or
   is a no-op for players still in state.players[a.id]
   (broke-by-friday-live.html:1007-1009). */
(function(){
  if (typeof isHost === 'undefined' || isHost) return;
  var lastRenderAt = Date.now(), wasHidden = false, graceTimer = null, overlayEl = null;
  if (typeof renderPlayer === 'function') {
    var _orig = renderPlayer;
    renderPlayer = function(){
      lastRenderAt = Date.now();
      if (overlayEl) { overlayEl.remove(); overlayEl = null; }
      return _orig.apply(this, arguments);
    };
  }
  function showOverlay(){
    if (overlayEl) return;
    overlayEl = document.createElement('div');
    overlayEl.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,14,22,0.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px';
    overlayEl.innerHTML = '<div style="text-align:center;max-width:380px;color:#fff;font-family:system-ui,-apple-system,sans-serif"><div style="font-size:64px;margin-bottom:18px">📡</div><div style="font-size:26px;font-weight:800;margin-bottom:10px;letter-spacing:-0.02em">Lost connection</div><div style="font-size:16px;color:rgba(255,255,255,0.72);margin-bottom:28px;line-height:1.5">Your phone stopped hearing from the game. Tap below to rejoin — your progress is safe.</div><button id="__rejoinBtn" style="width:100%;padding:18px 24px;background:linear-gradient(135deg,#22c55e 0%,#15803d 100%);border:none;border-radius:14px;color:#fff;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(34,197,94,0.35),0 2px 6px rgba(0,0,0,0.25)">Tap to rejoin →</button></div>';
    document.body.appendChild(overlayEl);
    document.getElementById('__rejoinBtn').onclick = function(){ location.reload(); };
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) { wasHidden = true; return; }
    if (!wasHidden) return;
    wasHidden = false; lastRenderAt = Date.now();
    clearTimeout(graceTimer);
    graceTimer = setTimeout(function(){
      if (Date.now() - lastRenderAt >= 4000) showOverlay();
    }, 4200);
  });
})();
</script>
