<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Broke by Friday — LIVE</title>
<link rel="icon" type="image/png" href="/ifm-round.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#140a24; --bg2:#1d0f38; --panel:rgba(255,255,255,0.05); --panel-b:rgba(255,255,255,0.10);
  --ink:#fff; --muted:rgba(255,255,255,0.55); --faint:rgba(255,255,255,0.32);
  --pink:#ff2e93; --pink-s:#f470a8; --lime:#50d890; --cyan:#5bbef0; --yellow:#ffd233; --purple:#9a7bf0; --red:#ff4757; --amber:#ffa94d;
  --shadow:0 18px 50px rgba(0,0,0,0.45);
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
body{background:radial-gradient(1200px 600px at 15% -10%,#2a1450 0,transparent 55%),radial-gradient(1000px 700px at 100% 110%,#3a0f50 0,transparent 50%),var(--bg)}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}
.btn{font-weight:900;letter-spacing:.2px;border-radius:16px;padding:15px 24px;font-size:1rem;transition:transform .12s,opacity .12s,box-shadow .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 10px 28px rgba(255,46,147,.35)}
.btn.lime{background:linear-gradient(135deg,var(--lime),#2bb673);color:#062b1a;box-shadow:0 10px 28px rgba(80,216,144,.3)}
.btn.dark{background:rgba(255,255,255,0.08);color:#fff;border:1.5px solid var(--panel-b)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ============ JOIN PILL + QR MODAL (persistent, every phase) ============ */
.join-pill{position:fixed;top:14px;right:16px;z-index:60;display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,0.07);border:1.5px solid var(--panel-b);backdrop-filter:blur(8px);
  border-radius:18px;padding:8px 14px 8px 9px;box-shadow:var(--shadow)}
.join-pill #pillqr{width:52px;height:52px;border-radius:9px;background:#fff;padding:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.join-pill #pillqr img,.join-pill #pillqr canvas{width:46px!important;height:46px!important}
.join-pill .jp-txt{text-align:left;line-height:1.15}
.join-pill .jp-label{font-size:.56rem;font-weight:900;letter-spacing:1.3px;color:var(--yellow);text-transform:uppercase}
.join-pill .jp-code{font-size:1.15rem;font-weight:900;letter-spacing:1px}
.join-pill .jp-tap{font-size:.55rem;color:var(--faint);font-weight:800}
.qr-overlay{display:none;position:fixed;inset:0;background:rgba(8,4,18,.84);z-index:200;align-items:center;justify-content:center;padding:20px}
.qr-overlay.open{display:flex}
.qr-card{background:#fff;color:#1a1340;border-radius:26px;padding:30px 26px;max-width:380px;width:100%;text-align:center;position:relative;box-shadow:var(--shadow)}
.qr-card .qr-close{position:absolute;top:14px;right:16px;background:#f0eaf8;width:34px;height:34px;border-radius:50%;font-size:1.1rem;color:#6b5c8a;font-weight:900}
.qr-card h3{font-size:1.5rem;font-weight:900;margin-bottom:3px}
.qr-card p{font-size:.85rem;color:#7a6c95;font-weight:700;margin-bottom:16px}
#bigqr{display:flex;justify-content:center;margin:0 auto 16px;width:248px;height:248px}
#bigqr img,#bigqr canvas{border-radius:14px}
.qr-room{background:#f4f0fb;border-radius:16px;padding:13px}
.qr-room .lab{font-size:.6rem;font-weight:900;letter-spacing:1.5px;color:#9a8bb5;text-transform:uppercase}
.qr-room .pin{font-size:2.1rem;font-weight:900;letter-spacing:5px;color:var(--pink)}
.qr-room .url{font-size:.72rem;font-weight:800;color:#7a6c95;word-break:break-all;margin-top:4px}

/* ===================== HOST ===================== */
#host{padding:18px 20px 40px;max-width:1320px;margin:0 auto}
.host-top{display:flex;align-items:center;gap:14px;margin:4px 4px 16px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand .b1{font-size:1.7rem;font-weight:900;letter-spacing:-1px}
.brand .b2{font-size:.95rem;font-weight:800;font-style:italic;color:var(--pink-s)}
.brand .b3{font-size:1.7rem;font-weight:900;letter-spacing:-1px;color:var(--pink)}
.brand .live{margin-left:6px;font-size:.62rem;font-weight:900;letter-spacing:1.5px;background:var(--red);color:#fff;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;animation:livepulse 1.6s infinite}
.brand .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.5)}50%{box-shadow:0 0 0 7px rgba(255,71,87,0)}}
.day-chip{margin-left:14px;background:var(--panel);border:1.5px solid var(--panel-b);border-radius:16px;padding:7px 16px;font-weight:900;font-size:.92rem}
.host-top{flex-wrap:wrap}
.day-chip b{color:var(--yellow)}

/* scenario banner during play */
.scn-banner{background:linear-gradient(135deg,rgba(255,46,147,.13),rgba(154,123,240,.13));border:1.5px solid var(--panel-b);border-radius:22px;padding:16px 20px;margin-bottom:16px;display:flex;gap:16px;align-items:center}
.scn-banner .scn-app{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.scn-banner .scn-body{flex:1;min-width:0}
.scn-banner .scn-from{font-weight:900;font-size:.95rem}
.scn-banner .scn-prompt{color:var(--muted);font-weight:700;font-size:.9rem;margin-top:2px}
.scn-banner .scn-count{flex-shrink:0;text-align:center;background:rgba(0,0,0,.25);border-radius:14px;padding:9px 15px}
.scn-banner .scn-count .n{font-size:1.5rem;font-weight:900;color:var(--lime)}
.scn-banner .scn-count .l{font-size:.6rem;font-weight:800;color:var(--faint);letter-spacing:.5px}

.host-controls{display:flex;gap:12px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
/* prominent fixed primary action (Reveal / Next day / Final results) */
.host-primary{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:65;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:.2px;padding:19px 34px;border-radius:20px;border:none;cursor:pointer;transition:filter .12s}
.host-primary::after{content:"";position:absolute;inset:-3px;border-radius:23px;border:2px solid rgba(255,255,255,.25);animation:ringpulse 1.8s ease-out infinite;pointer-events:none}
@keyframes ringpulse{0%{transform:scale(.96);opacity:.8}100%{transform:scale(1.12);opacity:0}}
.host-primary:hover{filter:brightness(1.08)}
.host-primary:active{transform:translateX(-50%) scale(.97)}
/* host utility buttons live in the header (top) — keeps BOTH bottom corners free for browser/chat widgets */
.host-util{display:flex;gap:8px;margin-left:12px}
.util-btn{background:rgba(255,255,255,.06);border:1px solid var(--panel-b);color:var(--muted);font-weight:800;font-size:.72rem;padding:6px 12px;border-radius:11px;cursor:pointer}
.util-btn:hover{color:#fff}
.util-btn.end:hover{color:var(--red);border-color:rgba(255,71,87,.4)}
@media(max-width:560px){.host-primary{font-size:1rem;padding:14px 22px;bottom:14px}}

/* 4-panel grid */
.viz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:880px){.viz-grid{grid-template-columns:1fr}}
.viz{background:var(--panel);border:1.5px solid var(--panel-b);border-radius:24px;padding:18px;position:relative;overflow:hidden;min-height:268px}
.viz-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.viz-head .vemoji{font-size:1.35rem}
.viz-head .vtitle{font-weight:900;font-size:1.05rem}
.viz-head .vsub{font-size:.66rem;font-weight:800;color:var(--faint);letter-spacing:.4px;margin-left:auto;text-align:right}
.viz-head .vtitle{font-size:1.15rem}
/* ── big QUESTION card (projector — stays up the whole round) ── */
.hq-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:6px 0 100px}
.hq-card{background:var(--panel);border:1.5px solid var(--panel-b);border-radius:28px;padding:26px 30px;max-width:880px;width:100%;box-shadow:var(--shadow);animation:vizIn .4s ease-out}
.hq-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.hq-app{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.hq-from{font-weight:900;font-size:1.45rem;line-height:1.1}
.hq-handle{color:var(--faint);font-weight:800;font-size:.92rem}
.hq-msg{background:rgba(255,255,255,.06);border-radius:18px;padding:18px 22px;font-size:1.5rem;font-weight:800;line-height:1.4;margin-bottom:16px}
.hq-mom{font-size:1.05rem;color:var(--pink-s);margin-top:8px;font-weight:800}
.hq-prompt{font-size:2.1rem;font-weight:900;line-height:1.22;margin-bottom:20px;letter-spacing:-.5px}
.hq-tnote{margin-bottom:20px}
.hq-tnote-btn{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:rgba(255,211,50,.08);border:1.5px solid rgba(255,211,50,.25);border-radius:10px;padding:7px 14px;font-size:.88rem;font-weight:800;color:rgba(255,211,50,.6);user-select:none}
.hq-tnote-btn::-webkit-details-marker{display:none}
.hq-tnote[open] .hq-tnote-btn{color:var(--yellow);background:rgba(255,211,50,.13);border-color:rgba(255,211,50,.4)}
.hq-tnote-arr{font-size:.8rem;transition:transform .2s}
.hq-tnote[open] .hq-tnote-arr{transform:rotate(180deg)}
.hq-tnote-body{margin-top:10px;background:rgba(255,211,50,.1);border:1.5px solid rgba(255,211,50,.3);border-radius:12px;padding:12px 15px;color:var(--yellow);font-size:1.05rem;font-weight:700;line-height:1.45}
.hq-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hq-opt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--panel-b);border-radius:16px;padding:14px 18px;font-size:1.12rem;font-weight:800}
.hq-optn{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.hq-status{display:flex;flex-direction:column;align-items:center;gap:6px}
.hq-roster{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:600px}
.rdot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.92rem;opacity:.38;transition:opacity .25s,transform .25s;border:1.5px solid rgba(255,255,255,.12)}
.rdot.done{opacity:1;transform:scale(1.12);border-color:rgba(255,255,255,.35)}
.hq-count{font-size:3.6rem;font-weight:900;color:var(--lime);line-height:1;text-shadow:0 0 30px rgba(80,216,144,.5)}
.hq-of{font-size:1.5rem;color:var(--faint)}
.hq-status-l{color:var(--muted);font-weight:800;font-size:1.05rem}
@media(max-width:680px){.hq-opts{grid-template-columns:1fr}.hq-prompt{font-size:1.5rem}.hq-msg{font-size:1.15rem}.hq-from{font-size:1.2rem}}
/* ── game-show reveal animations ── */
.reveal-in .viz{animation:vizIn .5s cubic-bezier(.2,.8,.2,1) backwards}
.reveal-in .viz:nth-child(2){animation-delay:.08s}
.reveal-in .viz:nth-child(3){animation-delay:.16s}
.reveal-in .viz:nth-child(4){animation-delay:.24s}
@keyframes vizIn{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.reveal-in .bo-barfill{transform-origin:left;animation:raceIn .9s cubic-bezier(.2,.85,.25,1) backwards}
@keyframes raceIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reveal-in .bo-entry:first-child{animation:leaderPulse 1.6s ease-in-out 1.1s infinite}
@keyframes leaderPulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 9px rgba(255,215,0,.5))}}
/* === Broke-o-Meter (drop-in design) === */
.bo-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.bo-header .vtitle{font-size:1.3rem;font-weight:900;margin:0}
.bo-avg{font-size:.8rem;font-weight:900;color:var(--muted);background:rgba(255,255,255,.05);padding:5px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.bo-board{display:flex;flex-direction:column;gap:12px}
.bo-entry{display:flex;align-items:center;gap:12px}
.bo-rankav{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bo-rank{font-size:.8rem;font-weight:900;color:var(--faint);width:24px;text-align:right}
.bo-av{width:28px;height:28px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.bo-content{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.bo-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bo-name{font-size:1rem;font-weight:900;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bo-stats{font-size:.78rem;font-weight:800;color:var(--muted);flex-shrink:0;white-space:nowrap}
.bo-barbg{height:10px;background:#312151;border-radius:5px;overflow:hidden}
.bo-barfill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.leader-icon{margin-left:7px;flex-shrink:0}
/* === Broke-o-Meter v2 === */
.bm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.bm-sub{font-size:.7rem;font-weight:800;color:var(--faint);margin-top:1px}
.bm-legend{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.bm-legend .lg{font-size:.6rem;font-weight:900;padding:2px 7px;border-radius:6px;white-space:nowrap}
.bm-legend .lg.s{background:rgba(255,210,74,.2);color:#ffd233}
.bm-legend .lg.w{background:rgba(91,190,240,.2);color:#5bbef0}
.bm-legend .lg.d{background:rgba(255,71,87,.2);color:#ff7a85}
.bm-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bm-rank{width:18px;text-align:center;font-size:.95rem;flex-shrink:0}
.bm-name{width:80px;text-align:right;font-weight:800;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bm-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.92rem;flex-shrink:0}
.bm-av.sm{width:20px;height:20px;font-size:.78rem}
.bm-track{flex:1;height:21px;background:rgba(0,0,0,.3);border-radius:6px;display:flex;align-items:center;min-width:0}
.bm-saved{height:21px;background:linear-gradient(90deg,#ffd24a,#ffb300);border-radius:6px 0 0 6px;flex-shrink:0}
.bm-cash{height:21px;background:linear-gradient(90deg,#5bbef0,#3a9fe0);flex-shrink:0}
.bm-owe{background:#ff4757;color:#fff;font-weight:900;font-size:.62rem;padding:2px 7px;border-radius:6px;white-space:nowrap;margin-left:5px;flex-shrink:0}
.bm-brokeclub{margin-top:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px solid rgba(255,71,87,.4);background:rgba(255,71,87,.1);border-radius:12px;padding:7px 11px}
.bm-bc-tag{font-weight:900;font-size:.74rem;color:#ff7a85;flex-shrink:0}
.bm-bitem{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.72rem;color:rgba(255,255,255,.82)}
/* === Mood vibe === */
.mood-vibe{text-align:center;font-weight:800;font-size:.84rem;color:var(--muted);letter-spacing:.5px;margin-top:2px}
.mood-vibe b{color:#fff;font-weight:900}
/* === Forecast grid === */
.fc-headline{font-weight:900;font-size:1.05rem;line-height:1.18;margin-bottom:3px}
.fc-subline{font-size:.72rem;font-weight:800;color:var(--muted);margin-bottom:11px}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.fc-cell{border:1px solid;border-radius:11px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fc-w{font-size:1.05rem;line-height:1}
.fc-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem}
/* === Stress volcano v2 === */
.sv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.sv-label{font-weight:900;font-size:1.05rem;line-height:1.08;color:var(--muted)}
.sv-label small{font-size:.64rem;font-weight:800;color:var(--faint)}
.sv-num{font-size:3rem;font-weight:900;line-height:1;flex-shrink:0}
.sv-body{display:flex;align-items:flex-end;gap:8px}
.sv-volc{flex:1;min-width:0}
.sv-calm{flex-shrink:0;width:138px;border:1.5px solid rgba(154,123,240,.45);background:rgba(154,123,240,.1);border-radius:12px;padding:8px 9px;margin-bottom:6px}
.sv-calm-h{font-weight:900;font-size:.6rem;letter-spacing:.5px;color:#c4b3ff;margin-bottom:6px}
.sv-crow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sv-cr{font-weight:900;font-size:.74rem;color:var(--faint);width:11px;flex-shrink:0}
.sv-cn{font-weight:800;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Stress Volcano (drop-in design) */
.sv2{text-align:center}
.sv2-score{font-size:3rem;font-weight:900;line-height:1;margin-top:6px}
.sv2-level{font-size:1.3rem;font-weight:900;margin-top:2px;letter-spacing:.5px}
.sv2-calm{margin-top:12px;font-size:.78rem;font-weight:800;color:var(--muted)}
.sv2-calm b{color:#fff;font-weight:900}
/* HYBRID panels — Higgsfield backdrop + live-data overlay */
.viz.hv{position:relative;min-height:288px;padding:0;overflow:hidden;border:none;background-size:cover;background-position:center}
.hv-volc{background-image:url(assets/viz-volcano-bg.png)}
.hv-title{position:absolute;top:15px;left:20px;font-size:1.3rem;font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.hv-sub{position:absolute;top:46px;left:20px;font-size:.72rem;font-weight:800;color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(0,0,0,.9)}
.hv-num{position:absolute;top:12px;right:24px;font-size:3.7rem;font-weight:900;line-height:1}
.hv-level{position:absolute;top:96px;right:24px;font-size:1rem;font-weight:900;letter-spacing:1.5px;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.hv-calm{position:absolute;bottom:16px;right:16px;background:rgba(18,9,32,.62);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:9px 12px;min-width:134px}
.hv-calm-h{font-weight:900;font-size:.58rem;letter-spacing:.6px;color:#d6c8ff;margin-bottom:6px}
.hv-crow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.hv-crow:last-child{margin-bottom:0}
.hv-cr{font-weight:900;font-size:.72rem;color:rgba(255,255,255,.5);width:10px}
.hv-cn{font-weight:800;font-size:.78rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
/* hybrid: Broke-o-Meter */
.hv-money{background-image:url(assets/viz-money-bg.png)}
.hv-pill{position:absolute;top:16px;right:20px;font-size:.76rem;font-weight:900;color:#fff;background:rgba(18,9,32,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);padding:5px 12px;border-radius:20px;z-index:2}
.hv-rows{position:absolute;top:64px;left:18px;right:18px;bottom:12px;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;overflow:hidden}
.hv-rows .bo-name,.hv-rows .bo-stats{text-shadow:0 1px 6px rgba(0,0,0,.8)}
/* hybrid: Mood Ring */
.hv-mood{background-image:url(assets/viz-mood-bg.png)}
.hv-gauge{position:absolute;top:50%;left:50%;transform:translate(-50%,-44%);width:82%;max-width:330px}
.hv-vibe{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-weight:800;font-size:.86rem;color:var(--muted);text-shadow:0 1px 8px rgba(0,0,0,.9)}
.hv-vibe b{color:#fff;font-weight:900}
/* hybrid: Forecast */
.hv-forecast{background-image:url(assets/viz-forecast-bg.png)}
.hv-fc-head{position:absolute;top:54px;left:20px;right:128px;font-weight:900;font-size:1rem;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.hv-fc-sub{position:absolute;top:84px;left:20px;right:128px;font-size:.7rem;font-weight:800;color:rgba(255,255,255,.72);text-shadow:0 1px 6px rgba(0,0,0,.9)}
.hv-fc-grid{position:absolute;top:108px;left:20px;right:128px;bottom:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;align-content:start;overflow:hidden}

/* leaderboard rows (shared) */
.lb-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:12px;margin-bottom:4px;background:rgba(255,255,255,0.03)}
.lb-row .rank{font-weight:900;font-size:.8rem;color:var(--faint);width:20px;flex-shrink:0}
.lb-row .av{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.lb-row .nm{font-weight:800;font-size:.86rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .val{font-weight:900;font-size:.9rem;flex-shrink:0}
.lb-row.me{outline:2px solid var(--yellow)}

/* Broke-o-meter bars */
.bom-track{position:relative;margin-top:4px}
.bom-bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bom-bar .av{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.bom-bar .nm{font-weight:800;font-size:.8rem;width:74px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bom-bar .fillwrap{flex:1;height:18px;background:rgba(0,0,0,.28);border-radius:10px;overflow:hidden;position:relative}
.bom-bar .fill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,var(--lime),#9be8c0)}
.bom-bar.broke .fill{background:linear-gradient(90deg,var(--red),#ff8a80)}
.bom-bar .amt{font-weight:900;font-size:.78rem;width:64px;text-align:right;flex-shrink:0}
.broke-club{margin-top:8px;font-size:.74rem;font-weight:900;color:var(--red);background:rgba(255,71,87,.13);border:1px dashed rgba(255,71,87,.4);border-radius:12px;padding:7px 11px;text-align:center}

/* Mood ring */
.mood-wrap{display:flex;gap:14px;align-items:center}
.mood-ring{width:130px;height:130px;flex-shrink:0;position:relative}
.mood-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.mood-side{flex:1;min-width:0}
.mood-avg{font-size:2rem;font-weight:900;line-height:1}
.mood-avg small{font-size:.8rem;color:var(--faint)}
.mood-label{font-weight:900;font-size:.9rem;margin:2px 0 8px}

/* Future-you forecast */
.fc-scene{height:96px;border-radius:18px;position:relative;overflow:hidden;margin-bottom:10px;display:flex;align-items:center;justify-content:center;transition:background .8s}
.fc-icon{font-size:3rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));animation:bobf 3s ease-in-out infinite}
@keyframes bobf{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fc-head{font-weight:900;font-size:.95rem;text-align:center;margin-bottom:8px}
.fc-students{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.fc-chip{font-size:1rem;background:rgba(255,255,255,.06);border-radius:8px;padding:2px 5px}

/* Stress volcano */
.volc{height:150px;position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#2a1a3a,#1a0f28);margin-bottom:8px}
.volc-mtn{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(180deg,#ff6b3d,#ff2e57);transition:height 1s cubic-bezier(.3,.7,.3,1);border-radius:40% 40% 0 0/22px 22px 0 0}
.volc-glow{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:78%;height:60%;background:radial-gradient(ellipse at bottom,rgba(255,210,80,.55),transparent 70%);opacity:0;transition:opacity .6s}
.volc-num{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:2.3rem;font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:3}
.volc-num small{font-size:.85rem;font-weight:800;color:var(--muted)}
.bubble{position:absolute;bottom:0;width:10px;height:10px;border-radius:50%;background:rgba(255,210,80,.8);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
.volc-tag{text-align:center;font-weight:900;font-size:.82rem}
/* ── redesigned visuals ── */
.bom2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bom2 .av{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.bom2 .nm{font-weight:800;font-size:.8rem;width:66px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bom2-track{flex:1;height:19px;background:rgba(0,0,0,.32);border-radius:10px;overflow:hidden;display:flex}
.bom2-saved{height:100%;background:linear-gradient(90deg,#ffd233,#ffb800);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bom2-cash{height:100%;background:linear-gradient(90deg,#5bbef0,#7fd0ff);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bom2-amt{font-weight:900;font-size:.78rem;min-width:60px;text-align:right;flex-shrink:0;line-height:1.05}
.bom2-amt.broke{color:var(--red)}
.bom2-debt{display:block;font-size:.58rem;color:var(--red);font-weight:800}
.fc-cloud{animation:fcdrift 6s ease-in-out infinite alternate}
@keyframes fcdrift{from{transform:translateX(-7px)}to{transform:translateX(9px)}}
.fc-rain{animation:fcrain .9s linear infinite}
@keyframes fcrain{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(15px);opacity:0}}
.fc-bolt{animation:fcflash 2.6s steps(1) infinite}
@keyframes fcflash{0%,90%,100%{opacity:0}93%,97%{opacity:1}}
.volc-smoke{animation:volcsmoke 3s ease-out infinite}
@keyframes volcsmoke{0%{transform:translateY(0) scale(1);opacity:.55}100%{transform:translateY(-26px) scale(1.9);opacity:0}}
.volc-spurt{animation:volcspurt 1.1s ease-out infinite}
@keyframes volcspurt{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-30px);opacity:0}}
/* === Scoreboard (replaces 4 panels) === */
.sb{background:var(--panel);border:1.5px solid var(--panel-b);border-radius:24px;padding:22px 26px;overflow:hidden;animation:vizIn .4s ease-out}
.sb-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sb-hd h3{font-size:1.6rem;font-weight:900;margin:0}
.sb-sub{font-size:.95rem;font-weight:800;color:var(--faint)}
.sb-avg-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sb-avg{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 12px;font-size:.88rem;font-weight:800;white-space:nowrap}
.sb-table{width:100%;border-spacing:0 6px;border-collapse:separate}
.sb-th{font-size:1rem;font-weight:900;letter-spacing:.5px;color:rgba(255,255,255,.55);text-transform:uppercase;padding:0 12px 12px;text-align:right;white-space:nowrap}
.sb-th:nth-child(2){text-align:left}
.sb-tr{background:rgba(255,255,255,.04);border-radius:14px}
.sb-tr.leader{background:rgba(255,215,0,.09);outline:1.5px solid rgba(255,215,0,.35)}
.sb-tr.sb-broke{background:rgba(255,71,87,.07);outline:1.5px dashed rgba(255,71,87,.35)}
.sb-td{padding:13px 12px;font-size:1.35rem;font-weight:800;text-align:right;vertical-align:middle;white-space:nowrap}
.sb-td:first-child{padding-left:16px;width:40px;color:var(--faint);font-size:1.1rem;text-align:center}
.sb-nm{text-align:left!important;min-width:180px}
.sb-nm-inner{display:flex;align-items:center;gap:10px}
.sb-nm-col{display:flex;flex-direction:column;min-width:0}
.sb-av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.nm-txt{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;font-size:1.2rem}
.sb-goal-tag{font-size:.88rem;font-weight:800;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;opacity:.85}
.sb-pos{color:var(--lime)!important}
.sb-neg{color:var(--red)!important}
.sb-owe{display:block;font-size:.58rem;color:var(--red);font-weight:900;line-height:1.1}
.sb-broke-chip{font-size:.58rem;font-weight:900;background:rgba(255,71,87,.2);color:#ff8a90;padding:2px 6px;border-radius:6px;flex-shrink:0}
.sb-chart{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}
.sb-chart-lbl{font-size:.66rem;font-weight:900;color:var(--faint);letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase}
/* Calendar teaser screen */
.cal-wrap{max-width:780px;margin:0 auto;padding:20px 0 100px;text-align:center}
.cal-badge{display:inline-block;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:900;font-size:.72rem;letter-spacing:1.5px;padding:5px 16px;border-radius:20px;margin-bottom:14px;animation:livepulse 1.6s infinite}
.cal-title{font-size:2.4rem;font-weight:900;letter-spacing:-1px;margin-bottom:4px}
.cal-sub{color:var(--muted);font-weight:800;font-size:.98rem;margin-bottom:22px}
.cal-notif{max-width:440px;margin:0 auto 22px;border:1.5px solid;border-radius:22px;padding:16px 18px;text-align:left}
.cal-notif-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-notif-app{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.cal-notif-from{font-weight:900;font-size:.95rem;flex:1}
.cal-notif-day{font-size:.68rem;color:var(--faint);font-weight:800;background:rgba(255,255,255,.08);padding:3px 8px;border-radius:8px}
.cal-notif-preview{font-weight:800;font-size:1.08rem;line-height:1.4}
.cal-scores{max-width:440px;margin:0 auto;background:var(--panel);border:1.5px solid var(--panel-b);border-radius:18px;padding:14px 18px;text-align:left}
.cal-scores-h{font-size:.6rem;font-weight:900;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;margin-bottom:10px}
.cal-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.cal-row:last-child{border-bottom:none}
.cal-rank{font-size:.95rem;width:26px;flex-shrink:0;text-align:center}
.cal-av{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.92rem;flex-shrink:0}
.cal-nm{font-weight:800;font-size:.88rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-nw{font-weight:900;font-size:.9rem;color:var(--lime);flex-shrink:0}
.cal-nw.neg{color:var(--red)}
/* Broke-pick choice styling */
.choice.broke-pick{border-color:rgba(255,71,87,.5);background:rgba(255,71,87,.08)}
.choice.broke-pick:hover,.choice.broke-pick:focus{background:rgba(255,71,87,.14)}
.broke-badge{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-weight:900;font-size:.62rem;letter-spacing:.5px;padding:3px 9px;border-radius:10px;margin-bottom:8px}
/* borrow / dip-into-savings group */
.borrow-group{border:1.5px dashed rgba(255,210,51,.45);border-radius:18px;padding:10px;background:rgba(255,210,51,.05);display:flex;flex-direction:column;gap:8px}
.borrow-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:900;font-size:.82rem;color:var(--muted);padding:0 2px}
.borrow-short{color:var(--red);font-size:.72rem;flex-shrink:0;font-weight:800}
.choice.borrow{margin:0;background:rgba(255,255,255,.05)}
/* peer-to-peer borrow picker + lend prompt */
.borrow-pick-btn{display:flex;align-items:center;gap:10px;width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--panel-b);border-radius:16px;padding:12px 14px;text-align:left;transition:transform .12s}
.borrow-pick-btn:active{transform:scale(.98)}
.borrow-pick-btn.short{opacity:.55}
.borrow-pick-btn .bm-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.bp-nm{font-weight:900;font-size:.95rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-cash{font-weight:800;font-size:.74rem;color:var(--lime);flex-shrink:0}
.borrow-pick-btn.short .bp-cash{color:var(--red)}
.bp-hint{font-size:.78rem;color:var(--muted);font-weight:700;margin:2px 2px 12px}
.lend-ask{font-weight:800;font-size:1.08rem;margin-bottom:6px;line-height:1.35}
.lend-sub{color:var(--muted);font-weight:700;font-size:.88rem;margin-bottom:14px}
.lend-btns{display:flex;gap:10px}
.lend-btns .btn{flex:1}

/* lobby (host) */
.lobby{padding:10px 0 0}
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.lobby-left{display:flex;flex-direction:column;align-items:center}
.lobby h2{font-size:2.2rem;font-weight:900;letter-spacing:-1px;margin-bottom:6px;text-align:center}
.lobby .sub{color:var(--muted);font-weight:800;font-size:1.02rem;margin-bottom:16px;text-align:center}
.lobby-right{display:flex;flex-direction:column;gap:12px}
.lobby-roster-hd{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:1rem;padding:2px 0}
.lobby-roster-hd .lr-count{color:var(--lime);font-size:.85rem;font-weight:800}
.lobby-hero{width:100%;max-width:620px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:var(--shadow)}
.p-hero{width:100%;border-radius:18px;display:block;margin-bottom:14px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.lobby-join{display:flex;justify-content:center;margin:0 auto 22px}
.lobby-join .lj-card{background:var(--panel);border:1.5px solid var(--panel-b);border-radius:24px;padding:22px 26px;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow)}
.lobby-join #lobbyqr{width:188px;height:188px;background:#fff;border-radius:14px;padding:8px}
.lobby-join .lj-right{text-align:left}
.lobby-join .lj-step{font-size:.7rem;font-weight:900;letter-spacing:1.5px;color:var(--faint);text-transform:uppercase}
.lobby-join .lj-pin{font-size:3rem;font-weight:900;letter-spacing:4px;color:var(--pink);line-height:1.1}
.lobby-join .lj-url{font-weight:800;color:var(--muted);font-size:.92rem;margin-top:2px}
.roster{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:920px;margin:0 auto 6px}
.roster .pchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--panel-b);border-radius:14px;padding:9px 14px 9px 9px;font-weight:900;animation:pop .3s;flex-direction:column;align-items:flex-start}
.roster .pchip .av{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.roster .pchip .pchip-name{font-weight:900;font-size:.95rem}
.roster .pchip-goal{font-size:.75rem;font-weight:800;color:var(--yellow);margin-top:2px}
.roster .pchip-top{display:flex;align-items:center;gap:8px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.roster-empty{color:var(--faint);font-weight:800;padding:20px}
.lobby-explainer{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:16px;padding:18px 20px;margin:18px 0 8px;text-align:left;display:flex;flex-direction:column;gap:11px;max-width:620px;margin-left:auto;margin-right:auto;width:100%}
.lex-row{display:flex;align-items:flex-start;gap:14px;font-size:.92rem;font-weight:700;line-height:1.45}
.lex-icon{font-size:1.3rem;flex-shrink:0;width:26px;text-align:center}

/* reveal distribution */
.dist{background:var(--panel);border:1.5px solid var(--panel-b);border-radius:22px;padding:18px;margin-bottom:16px}
.dist h3{font-weight:900;font-size:1.1rem;margin-bottom:4px}
.dist .lesson{color:var(--yellow);font-weight:800;font-size:.92rem;margin-bottom:14px}
.dist-choice{margin-bottom:12px;padding:10px 13px;background:rgba(255,255,255,.04);border-radius:14px;border:1.5px solid rgba(255,255,255,.08)}
.dist-choice.dist-broke{border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.07)}
.dist-clabel{font-weight:900;font-size:.88rem;margin-bottom:8px;color:rgba(255,255,255,.85)}
.dist-choice.dist-broke .dist-clabel{color:var(--red)}
.dist-badges{display:flex;flex-wrap:wrap;gap:6px;min-height:10px}
.dist-badge{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border-radius:20px;padding:3px 10px 3px 4px}
.dist-badge-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0}
.dist-badge-nm{font-weight:800;font-size:.78rem;white-space:nowrap}
.dist-nobody{color:var(--faint);font-weight:800;font-size:.8rem;font-style:italic}

/* ===================== PLAYER ===================== */
#player{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0}
.pcard{flex:1;display:flex;flex-direction:column;padding:18px 16px 26px}
.choice-screen{background:linear-gradient(160deg,#0d3d30 0%,#1c1040 100%)}
.p-ident{display:flex;align-items:center;gap:8px;margin-bottom:8px;justify-content:center}
.p-ident-av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.p-ident-nm{font-weight:900;font-size:1rem}
.p-meterhud{display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(0,0,0,.22);border-radius:16px;margin-bottom:14px}
.p-meterhud-top{display:flex;gap:8px}
.p-meterhud-bot{display:flex;gap:8px}
.p-meterhud .m{flex:1;text-align:center;border-radius:12px;padding:7px 6px}
.p-meterhud .m.sm{background:rgba(255,255,255,.06);padding:6px}
.p-meterhud .m.feat{padding:14px 8px}
.p-meterhud .m .mv{font-weight:900;font-size:1rem}
.p-meterhud .m.feat .mv{font-size:2rem;line-height:1}
.p-meterhud .m .ml{font-size:.65rem;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.3px;text-transform:uppercase;margin-top:3px}
.p-meterhud .m.feat .ml{font-size:.78rem;margin-top:6px}
.p-goal{display:flex;align-items:center;gap:9px;background:rgba(255,210,51,.1);border:1px solid rgba(255,210,51,.3);border-radius:14px;padding:9px 12px;margin-bottom:14px}
.p-goal .ge{font-size:1.4rem}
.p-goal .gt{flex:1;min-width:0}
.p-goal .gn{font-weight:900;font-size:.84rem}
.p-goal .gbar{height:6px;background:rgba(0,0,0,.3);border-radius:4px;margin-top:4px;overflow:hidden}
.p-goal .gfill{height:100%;background:var(--yellow);border-radius:4px;transition:width .5s}
.p-goal .gp{font-weight:900;font-size:.9rem;color:var(--yellow)}

/* player scenario */
.p-scn-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.p-scn-app{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.p-scn-from{font-weight:900;font-size:1rem}
.p-scn-handle{font-size:.72rem;color:var(--faint);font-weight:700}
.p-scn-msg{background:rgba(255,255,255,.06);border-radius:16px;border-top-left-radius:4px;padding:13px 15px;font-weight:800;font-size:1rem;line-height:1.4;margin-bottom:6px}
.p-scn-msg .sub{display:block;color:var(--muted);font-weight:700;font-size:.86rem;margin-top:5px}
.p-prompt{font-weight:900;font-size:1.05rem;line-height:1.35;margin:12px 2px 12px}
.choices{display:flex;flex-direction:column;gap:13px}

const appIcon=a=>({WhatsApp:"💬",iMessage:"💬",Instagram:"📷",Netflix:"▶",Lockscreen:"🔒"}[a]||"•");
const fmt=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const clamp=n=>Math.max(0,Math.min(100,n));

/* ════════════════════ ROLE / ROOM ════════════════════ */
const params=new URLSearchParams(location.search);
let ROLE=params.get('role')||'host';
let ROOM=params.get('room')?params.get('room').toUpperCase():null;
const MY_ID=(function(){let id=localStorage.getItem('bbf_pid');if(!id){id=crypto.randomUUID();localStorage.setItem('bbf_pid',id);}return id;})();
let isHost=(ROLE==='host');
let state=null, channel=null, _saveTimer=null, _tick=null, _lastActivity=Date.now();
let _selGoal=null;            // player: chosen goal pre-join
let _selName=null;            // player: typed name (preserved across re-renders)
const NS=()=>GAME_KEY+'-'+ROOM;

/* ════════════════════ STATE ════════════════════ */
function freshState(){
  return {phase:'lobby', round:0, deckLen:12, deckSelected:null, players:{}, removedPlayers:{}, loanReqs:{}, hostId:MY_ID, updatedAt:Date.now()};
}
function freshPlayer(name,goal,n){
  return {id:MY_ID, name:(name||'player').slice(0,14), av:AV_EMOJI[n%AV_EMOJI.length], color:AV_COLOR[n%AV_COLOR.length],
    cash:STARTING_CASH, jarred:0, debt:0, friendDebt:0, lentOut:0, vibes:50, futureYou:50, stressEvents:0,
    goal:goal||GOALS[0], piggyBroken:false, refundsPending:[], history:[],
    lastRound:0, lastChoiceIdx:-1, lastReply:null, lastSticker:null, lastDeltas:null, sideEvent:null};
}
function curScn(){
  if(!state||state.round<1)return null;
  const sel=state.deckSelected;
  return sel?DECK[sel[state.round-1]]:DECK[state.round-1];
}
function stressOf(p){
  let s=0;
  if(p.cash<500)s+=50; else if(p.cash<1500)s+=30; else if(p.cash<3000)s+=12;
  if(p.piggyBroken)s+=18;
  if(p.debt>0)s+=12;
  if(p.friendDebt>0)s+=10;
  if(p.vibes<30)s+=14;
  s+=Math.min(20,(p.stressEvents||0)*7);
  return Math.min(100,s);
}
function netWorth(p){return Math.round(p.cash+p.jarred-(p.debt||0)-(p.friendDebt||0)+(p.lentOut||0));}
function playersArr(){return Object.values(state.players||{});}

/* ── personalized end-of-game lesson (counterfactual "disciplined twin") ── */
function nwDelta(d){ return (d.cash||0)+(d.jarred||0)-(d.debt||0)-(d.friendDebt||0); }
function saverChoice(scn){ let best=null; for(const c of scn.choices){ if(c.breakPiggy)continue; if(best===null||(c.futureYou||0)>(best.futureYou||0)) best=c; } return best; }
function computeLesson(p){
  let extra=0, biggest=null;
  const sel=state&&state.deckSelected;
  for(const h of (p.history||[])){
    const scn=sel?DECK[sel[h.round-1]]:DECK[h.round-1]; if(!scn)continue;
    const saver=saverChoice(scn); if(!saver)continue;
    const gain=nwDelta(saver)-nwDelta(h.deltas);
    if(gain>0.5){ extra+=gain; if(!biggest||gain>biggest.gain) biggest={gain:Math.round(gain),day:h.day,their:h.label,saver:saver.label}; }
  }
  return {extra:Math.round(extra), biggest};
}

/* ── rich personalized stats dashboard (shown on phone after each choice) ── */
function statsPanel(p){
  const st=stressOf(p), nw=netWorth(p), owe=(p.debt||0)+(p.friendDebt||0);
  const gp=p.goal?Math.min(100,Math.round(p.jarred/p.goal.target*100)):0;
  const bar=(v,col)=>`<div class="sp-bar"><div class="sp-fill" style="width:${Math.max(3,Math.min(100,v))}%;background:${col}"></div></div>`;
  const stressCol=st>=70?'linear-gradient(90deg,#ff4757,#ff8a80)':st>=40?'linear-gradient(90deg,#ffa94d,#ffd233)':'linear-gradient(90deg,#5bbef0,#7fd0ff)';
  return `<div class="stats-panel">
    <div class="sp-money">
      <div class="sp-m"><div class="sp-mv" style="color:var(--lime)">${fmt(p.cash)}</div><div class="sp-ml">💸 wallet</div></div>
      <div class="sp-m"><div class="sp-mv" style="color:var(--yellow)">${fmt(p.jarred)}</div><div class="sp-ml">🫙 saved</div></div>
      <div class="sp-m"><div class="sp-mv" style="color:${nw<0?'var(--red)':'#fff'}">${fmt(nw)}</div><div class="sp-ml">net worth</div></div>
    </div>
    ${owe?`<div class="sp-debt">😬 you owe ${fmt(owe)}</div>`:''}
    ${(p.lentOut||0)>0?`<div class="sp-lent">🤝 lent out ${fmt(p.lentOut)} · owed back to you</div>`:''}
    <div class="sp-meter"><span class="sp-lab">✨ mood</span>${bar(p.vibes,'linear-gradient(90deg,#f470a8,#ff2e93)')}<span class="sp-num">${Math.round(p.vibes)}</span></div>
    <div class="sp-meter"><span class="sp-lab">🔮 future-you</span>${bar(p.futureYou,'linear-gradient(90deg,#9a7bf0,#c4b3ff)')}<span class="sp-num">${Math.round(p.futureYou)}</span></div>
    <div class="sp-meter"><span class="sp-lab">😤 stress</span>${bar(st,stressCol)}<span class="sp-num">${st}</span></div>
    ${p.goal?`<div class="sp-goal"><span class="ge">${p.goal.emoji}</span><div class="gt"><div class="gn">${p.goal.name} · ${gp}% saved</div><div class="gbar"><div class="gfill" style="width:${gp}%"></div></div></div></div>`:''}
  </div>`;
}

/* ════════════════════ DB + REALTIME ════════════════════ */
async function save(){ state.updatedAt=Date.now();
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{ try{await db.from('games').upsert({room_code:NS(),state,host_id:MY_ID,updated_at:new Date().toISOString()});}catch(e){console.warn('save',e);} },60);
}
async function saveNow(){ state.updatedAt=Date.now();
  try{await db.from('games').upsert({room_code:NS(),state,host_id:MY_ID,updated_at:new Date().toISOString()});}catch(e){console.warn(e);}
}
function joinChannel(){
  channel=db.channel('room:'+NS());
  channel.on('postgres_changes',{event:'*',schema:'public',table:'games',filter:'room_code=eq.'+NS()},
      (p)=>{const s=p.new&&p.new.state; if(s&&!isHost){state=s; renderPlayer();}})
    .on('broadcast',{event:'action'},({payload})=>{ if(isHost) hostHandleAction(payload); })
    .subscribe();
}
function sendAction(payload){ channel.send({type:'broadcast',event:'action',payload}); }

/* ════════════════════ HOST ════════════════════ */
async function initHost(){
  document.getElementById('connecting').classList.add('hide');
  document.getElementById('host').classList.remove('hide');
  document.getElementById('joinPill').classList.remove('hide');
  if(!ROOM){ ROOM=randRoom();
    const p=new URLSearchParams(location.search);p.set('role','host');p.set('room',ROOM);history.replaceState(null,'','?'+p.toString()); }
  joinChannel();
  // resume in-progress game on reload instead of wiping
  let resumed=false;
  try{
    const {data}=await db.from('games').select('state,updated_at').eq('room_code',NS()).single();
    const s=data&&data.state;
    const recent=data&&data.updated_at&&(Date.now()-new Date(data.updated_at).getTime()<30*60*1000);
    if(s&&recent&&s.phase!=='lobby'&&s.phase!=='ended'&&Object.keys(s.players||{}).length>0){ state=s; state.hostId=MY_ID; resumed=true; }
  }catch(e){}
  if(!resumed){ state=freshState(); await saveNow(); }
  setupQR();
  // single fixed primary action, centered at the bottom (New game + End early live in the header now)
  const pb=document.createElement('button'); pb.className='host-primary'; pb.id='hostPrimary'; pb.style.display='none'; document.body.appendChild(pb);
  renderHost();
  document.getElementById('roleToggle').textContent='Host · room '+ROOM;
  startTick();
  notifyParent();
}
function randRoom(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let r='';for(let i=0;i<4;i++)r+=a[Math.floor(Math.random()*a.length)];return r;}

function hostHandleAction(a){
  if(!a||!a.type)return; _bump();
  if(a.type==='join'){
    if(state.phase==='ended')return;
    if(state.removedPlayers&&state.removedPlayers[a.id]){ state.players[a.id]=state.removedPlayers[a.id]; delete state.removedPlayers[a.id]; }
    if(!state.players[a.id]){ const n=Object.keys(state.players).length; state.players[a.id]=freshPlayer(a.name,a.goal,n); state.players[a.id].id=a.id; }
    else { state.players[a.id].name=(a.name||state.players[a.id].name).slice(0,14); if(a.goal)state.players[a.id].goal=a.goal; }
    save(); if(state.phase==='lobby') renderHost(); else renderHostPanels();
  }
  else if(a.type==='choose'){
    const p=state.players[a.id]; const scn=curScn();
    if(!p||!scn||state.phase!=='playing')return;
    if(a.round!==state.round)return;            // stale
    if(p.lastRound===state.round)return;        // already chose this round
    const base=scn.choices[a.choiceIdx]; if(!base)return;
    let applied=base;
    if(a.mode && a.mode!=='normal'){ const alts=buildAlternatives(base,p); applied=alts.find(x=>x.mode===a.mode); if(!applied)return; }
    applyChoice(p,scn,applied,a.choiceIdx);
    save(); renderHostPanels();
  }
  else if(a.type==='loan_request'){
    const A=state.players[a.fromId], B=state.players[a.toId], scn=curScn();
    if(!A||!B||!scn||state.phase!=='playing')return;
    if(a.round!==state.round||A.lastRound===state.round||a.fromId===a.toId)return;
    state.loanReqs[a.fromId]={fromId:a.fromId, fromName:A.name, toId:a.toId, toName:B.name, round:state.round, choiceIdx:a.choiceIdx, amount:a.amount};
    save(); renderHostPanels();
  }
  else if(a.type==='loan_respond'){
    const req=state.loanReqs&&state.loanReqs[a.fromId]; if(!req)return;
    const A=state.players[a.fromId], B=state.players[req.toId], scn=curScn();
    delete state.loanReqs[a.fromId];
    if(A&&scn&&A.lastRound!==state.round){
      if(a.agree && B && B.cash>=req.amount) applyPeerLoan(A,B,scn,req);
      else applyLoanMiss(A,scn,req, a.agree?'broke':'refused');
    }
    save(); renderHostPanels();
  }
  else if(a.type==='claimGoal'){
    const p=state.players[a.id];
    if(p && !p.goalAchieved && netWorth(p)>=(p.goal?p.goal.target:Infinity)){
      p.goalAchieved=true;
    }
    save(); renderHost(); renderHostPanels();
  }
}
function applyPeerLoan(A,B,scn,req){
  const base=scn.choices[req.choiceIdx]||{};
  // lent from the lender's WALLET → tracked in their own "lent out" bucket (an asset, owed back)
  B.cash=Math.max(0,B.cash-req.amount); B.lentOut=(B.lentOut||0)+req.amount; B.vibes=clamp(B.vibes+2);
  const applied={cash:-(A.cash||0), friendDebt:req.amount, vibes:(base.vibes||0)-5, futureYou:(base.futureYou||0)-8,
    reply:(base.reply||'')+` ${req.toName} spotted you ${fmt(req.amount)}! you owe them now 👀`, sticker:`🤝 ${req.toName} SPOTTED YOU`, _peer:true};
  applyChoice(A,scn,applied,req.choiceIdx);
}
function applyLoanMiss(A,scn,req,why){
  const applied={cash:0, vibes:-16, futureYou:8,
    reply:`${req.toName} ${why==='broke'?"couldn't":"didn't"} lend. time's up — you've been FORCED to miss out. 💔`,
    sticker:'💔 MISSED OUT', _miss:true};
  applyChoice(A,scn,applied,req.choiceIdx);
}
function applyChoice(p,scn,c,idx){
  if(c.breakPiggy && p.jarred>0){ p.cash+=p.jarred; p.jarred=0; p.piggyBroken=true; }
  if(c._dip){ p.piggyBroken=true; }
  const stressBump=(scn.kind==='alert'||c.breakPiggy||c._dip||(c.debt>0)||(c.friendDebt>0))?1:0;
  p.cash=Math.max(0,p.cash+(c.cash||0));
  p.jarred=(p.jarred||0)+(c.jarred||0);
  p.debt=(p.debt||0)+(c.debt||0);
  p.friendDebt=(p.friendDebt||0)+(c.friendDebt||0);
  p.vibes=clamp(p.vibes+(c.vibes||0));
  p.futureYou=clamp(p.futureYou+(c.futureYou||0));
  p.stressEvents=(p.stressEvents||0)+stressBump;
  if(c.refund){ p.refundsPending=[...(p.refundsPending||[]),{day:c.refundDay,amount:c.refund}]; }
  p.history.push({round:state.round,day:scn.day,label:c.label,deltas:{cash:c.cash||0,jarred:c.jarred||0,vibes:c.vibes||0,futureYou:c.futureYou||0,debt:c.debt||0,friendDebt:c.friendDebt||0}});
  p.lastRound=state.round; p.lastChoiceIdx=idx; p.lastReply=c.reply; p.lastSticker=c.sticker||null;
  p.lastDeltas={cash:c.cash||0,jarred:c.jarred||0,vibes:c.vibes||0,futureYou:c.futureYou||0};
}

/* when a player can't afford a choice, offer ways to cover the gap (dip savings / borrow).
   Used by BOTH the player (to render buttons) and the host (to apply authoritatively). */
function buildAlternatives(c,p){
  const cost=c.requires||Math.abs(c.cash||0);
  const shortfall=cost-(p.cash||0);
  if(shortfall<=0) return [];
  const alts=[];
  if((p.jarred||0)>=shortfall){
    alts.push({mode:'dip', _dip:true, label:'🐷 dip into savings', sub:`pull ${fmt(shortfall)} from your goal jar`,
      cash:-(p.cash||0), jarred:-shortfall, vibes:(c.vibes||0)-4, futureYou:(c.futureYou||0)-12,
      reply:(c.reply||'')+' you raided the jar to afford it. the dream took a hit. 🐷💔', sticker:'🐷 DIPPED INTO SAVINGS'});
  }
  alts.push({mode:'mom', label:'🙏 ask mom for an advance', sub:`${fmt(shortfall)} out of next month's allowance`,
    cash:-(p.cash||0), debt:shortfall, vibes:(c.vibes||0)-4, futureYou:(c.futureYou||0)-8,
    reply:(c.reply||'')+" mom: 'fine. but it's COMING OUT of december.'", sticker:'🙏 ADVANCE TAKEN'});
  return alts;
}
function altChips(a){
  const owe=a.friendDebt?`💸 owe ${fmt(a.friendDebt)}`:a.debt?`🙏 owe ${fmt(a.debt)}`:`🐷 −${fmt(Math.abs(a.jarred||0))} saved`;
  return `<span class="d cash-neg">${owe}</span>`
    + (a.vibes?`<span class="d vibe">✨ ${a.vibes>0?'+':''}${a.vibes}</span>`:'')
    + (a.futureYou?`<span class="d fut">🔮 ${a.futureYou>0?'+':''}${a.futureYou}</span>`:'');
}

/* host flow (teacher-paced — NO timers advance rounds) */
function hostStart(){
  if(playersArr().length===0)return;
  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  // split deck into high-ticket (brokePick cost ≥ ₹5k or requires ≥ ₹5k) vs rest
  const highTicket=[], rest=[];
  DECK.forEach((s,i)=>{
    const isHigh=s.choices.some(c=>(c.brokePick&&Math.abs(c.cash||0)>=5000)||(c.requires&&c.requires>=5000));
    (isHigh?highTicket:rest).push(i);
  });
  // guarantee 2–3 high-ticket scenarios per game
  const htCount=Math.random()<0.5?2:3;
  const picks=[...shuffle(highTicket).slice(0,htCount),...shuffle(rest).slice(0,12-htCount)];
  state.deckSelected=picks.sort((a,b)=>DECK[a].day-DECK[b].day);
  state.deckLen=12;
  state.round=1; state.phase='playing'; saveNow(); renderHost(); notifyParent();
}
function hostReveal(){
  if(state.phase!=='playing')return;
  // auto-refuse any unanswered loan requests ("time's up")
  for(const id in (state.loanReqs||{})){ const req=state.loanReqs[id], A=state.players[id], scn=curScn(); if(A&&scn&&A.lastRound!==state.round) applyLoanMiss(A,scn,req,'refused'); }
  state.loanReqs={};
  state.phase='reveal'; saveNow(); renderHost();
}
function hostCalendar(){
  // skip calendar screen — go straight to next round
  if(state.phase!=='reveal')return;
  if(state.round>=(state.deckLen||12)){ hostFinish(); return; }
  state.loanReqs={};
  const sel=state.deckSelected;
  const nextScn=sel?DECK[sel[state.round]]:DECK[state.round];
  const nextDay=nextScn?nextScn.day:(state.round+1);
  for(const p of playersArr()){
    p.sideEvent=null; const still=[];
    for(const r of (p.refundsPending||[])){ if(r.day<=nextDay){ p.cash+=r.amount; p.sideEvent={emoji:"💗",text:`mom paytm'd you ${fmt(r.amount)} back`}; } else still.push(r); }
    p.refundsPending=still;
  }
  state.round++; state.phase='playing'; saveNow(); renderHost(); notifyParent();
}
function hostCalendarGo(){ hostCalendar(); }
function hostFinish(){ state.phase='goalReveal'; saveNow(); renderHost(); notifyParent(); }
function hostShowResults(){ state.phase='ended'; saveNow(); renderHost(); notifyParent(); }
function hostReset(){
  if(!confirm('Start a brand-new month?\n\nThis clears ALL players and scores and sends every phone back to the join screen.'))return;
  state=freshState(); saveNow(); renderHost(); notifyParent();
}

/* idle auto-reset (build-rule B) */
function _bump(){ _lastActivity=Date.now(); }
function startTick(){ stopTick(); _tick=setInterval(()=>{
  if(state && state.phase!=='lobby' && state.phase!=='ended' && Date.now()-_lastActivity>_IDLE_MS){ _bump(); state=freshState(); saveNow(); renderHost(); notifyParent(); }
},30000); }
function stopTick(){ if(_tick){clearInterval(_tick);_tick=null;} }

/* hide-chat postMessage (build-rule A) */
function notifyParent(){ try{ const live=(state.phase==='playing'||state.phase==='reveal'||state.phase==='calendar'); window.parent.postMessage({type:live?'stock-rush-live':'stock-rush-idle'},'*'); }catch(e){} }

/* ───────── HOST RENDER ───────── */
function hostHeader(){
  const scn=curScn();
  const deckLen=state.deckLen||12;
  const dayTxt = state.phase==='lobby' ? 'lobby'
    : state.phase==='ended' ? 'month over'
    : state.phase==='goalReveal' ? '🎯 goal moment'
    : state.phase==='calendar' ? 'between rounds'
    : 'day '+(scn?scn.day:'')+' · round '+state.round+'/'+deckLen;
  const endBtn = (state.phase==='playing'||state.phase==='reveal'||state.phase==='calendar') ? `<button class="util-btn end" onclick="hostEndEarlyConfirm()">⏹ end early</button>` : '';
  return `<div class="host-top">
    <div class="brand"><span class="b1">BROKE</span><span class="b2">by</span><span class="b3">FRIDAY</span><span class="live">LIVE</span></div>
    <div class="day-chip">📅 <b>${dayTxt}</b></div>
    <div class="host-util">${endBtn}<button class="util-btn" onclick="hostReset()">↺ new game</button></div>
  </div>`;
}
function renderHost(){
  document.getElementById('pillCode').textContent=ROOM;
  if(state.phase==='lobby'){ renderHostLobby(); updateFixedControls(); return; }
  const host=document.getElementById('host');
  const scn=curScn();
  if(state.phase==='playing'){
    host.innerHTML = hostHeader()+bigQuestionCard(scn);
  } else if(state.phase==='reveal'){
    host.innerHTML = hostHeader()+`<div style="display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start">${renderScoreboard(true)}${renderDistribution(scn)}</div>`;
  } else if(state.phase==='calendar'){
    host.innerHTML = hostHeader()+renderCalendar();
  } else if(state.phase==='goalReveal'){
    host.innerHTML = hostHeader()+renderGoalReveal()+renderScoreboard();
  } else { // ended
    host.innerHTML = hostHeader()+renderEndBanner()+renderScoreboard();
  }
  updateFixedControls();
}
/* big question card — full projector focus during a round (stays until Reveal) */
function bigQuestionCard(scn){
  const total=playersArr().length;
  const chosen=playersArr().filter(p=>p.lastRound===state.round).length;
  let msg;
  if(scn.kind==='chat') msg=`<div class="hq-msg">${scn.notif.preview}</div>`;
  else if(scn.kind==='insta') msg=`<div class="hq-msg"><b>${scn.storyText}</b> — ${scn.storySub}</div>`;
  else msg=`<div class="hq-msg"><b>${scn.alertHeadline}</b> — ${scn.alertSub}${scn.momText?`<div class="hq-mom">mom 💗: ${scn.momText}</div>`:''}</div>`;
  const opts=scn.choices.filter(c=>!c.breakPiggy).map((c,i)=>`<div class="hq-opt"><span class="hq-optn">${String.fromCharCode(65+i)}</span><span>${c.label}</span></div>`).join('');
  return `<div class="hq-wrap">
    <div class="hq-card">
      <div class="hq-top"><div class="hq-app" style="background:${scn.appColor}">${appIcon(scn.app)}</div><div><div class="hq-from">${scn.sender}</div><div class="hq-handle">${scn.handle} · day ${scn.day}</div></div></div>
      ${msg}
      <details class="hq-tnote"><summary class="hq-tnote-btn">🎙️ teacher notes <span class="hq-tnote-arr">▾</span></summary><div class="hq-tnote-body">${scn.teacherNote||scn.prompt}</div></details>
      <div class="hq-opts">${opts}</div>
    </div>
    <div class="hq-status">
      <div class="hq-count"><span id="chosenN">${chosen}</span> <span class="hq-of">/ ${total}</span></div>
      <div class="hq-status-l">📱 the class is picking on their phones…</div>
      <div class="hq-roster" id="rosterDots">${rosterDots()}</div>
    </div>
  </div>`;
}
/* fixed controls: prominent primary action bottom-center */
function updateFixedControls(){
  const pb=document.getElementById('hostPrimary');
  if(!pb)return;
  const deckLen=state.deckLen||12;
  if(state.phase==='playing'){
    pb.style.display=''; pb.textContent='👀 Reveal what the class chose →';
    pb.style.background='linear-gradient(135deg,var(--lime),#2bb673)'; pb.style.color='#062b1a';
    pb.style.boxShadow='0 14px 38px rgba(80,216,144,.5)'; pb.onclick=hostReveal;
  } else if(state.phase==='reveal'){
    pb.style.display='';
    pb.style.background='linear-gradient(135deg,var(--pink),var(--purple))'; pb.style.color='#fff';
    pb.style.boxShadow='0 14px 38px rgba(255,46,147,.5)';
    if(state.round>=deckLen){ pb.textContent='🏆 Final results'; pb.onclick=hostFinish; }
    else { pb.textContent='📅 Next day →'; pb.onclick=hostCalendar; }
  } else if(state.phase==='calendar'){
    pb.style.display='';
    pb.style.background='linear-gradient(135deg,var(--cyan),var(--purple))'; pb.style.color='#fff';
    pb.style.boxShadow='0 14px 38px rgba(91,190,240,.5)';
    pb.textContent="🚀 Let's go! →"; pb.onclick=hostCalendarGo;
  } else if(state.phase==='goalReveal'){
    pb.style.display='';
    pb.style.background='linear-gradient(135deg,#FFD700,#ff9500)'; pb.style.color='#1a1340';
    pb.style.boxShadow='0 14px 38px rgba(255,215,0,.5)';
    pb.textContent='🏆 Final Leaderboard →'; pb.onclick=hostShowResults;
  } else { pb.style.display='none'; }
}
function hostEndEarlyConfirm(){ if(confirm('End the month now and jump to the final results?\n\nStudents won\'t get the remaining rounds.')) hostFinish(); }

/* distribution of choices for the round just revealed */
function renderDistribution(scn){
  const byChoice=scn.choices.map(()=>[]);
  for(const p of playersArr()){
    if(p.lastRound===state.round && p.lastChoiceIdx>=0 && p.lastChoiceIdx<scn.choices.length)
      byChoice[p.lastChoiceIdx].push(p);
  }
  const rows=scn.choices.map((c,i)=>{
    const badges=byChoice[i].length
      ? byChoice[i].map(p=>`<div class="dist-badge"><div class="dist-badge-av" style="background:${p.color}">${p.av}</div><span class="dist-badge-nm">${p.name}</span></div>`).join('')
      : `<span class="dist-nobody">nobody</span>`;
    return `<div class="dist-choice${c.brokePick?' dist-broke':''}">
      <div class="dist-clabel">${c.brokePick?'💀 ':''}${c.label}</div>
      <div class="dist-badges">${badges}</div>
    </div>`;
  }).join('');
  return `<div class="dist"><h3>📊 what the class chose</h3><div class="lesson">💡 ${scn.lesson}</div>${rows}</div>`;
}
function renderEndBanner(){
  const ps=playersArr(); if(!ps.length) return '';
  const avgNW=Math.round(ps.reduce((s,p)=>s+netWorth(p),0)/ps.length);
  const broke=ps.filter(p=>netWorth(p)<=0).length;
  const goalHit=ps.filter(p=>p.jarred>=(p.goal?p.goal.target:99999)).length;
  return `<div class="dist"><h3>🏁 the month is over</h3>
    <div class="lesson">class avg net worth ${fmt(avgNW)} · ${goalHit} hit their dream 🎯 · ${broke} went broke 💀</div>
    <div style="color:var(--muted);font-weight:800;font-size:.9rem">The winners weren't the ones who never spent — they're the ones who said small no's to dumb stuff and one big yes to what they actually wanted.</div>
  </div>`;
}

/* ═══════ GOAL REVEAL PHASE ═══════ */
function renderGoalReveal(){
  const ps=playersArr();
  const claimed=ps.filter(p=>p.goalAchieved);
  const canClaim=ps.filter(p=>!p.goalAchieved&&netWorth(p)>=(p.goal?p.goal.target:Infinity));
  const missed=ps.filter(p=>!p.goalAchieved&&netWorth(p)<(p.goal?p.goal.target:Infinity));
  const claimedCards=claimed.map(p=>{
    const goal=p.goal||{name:'the bag',emoji:'💰'};
    return `<div class="gr-card gr-win">
      <div class="gr-card-av" style="background:${p.color}">${p.av}</div>
      <div class="gr-card-info">
        <div class="gr-card-name">${p.name}</div>
        <div class="gr-card-goal">${goal.emoji} ${goal.name}</div>
      </div>
      <div class="gr-card-status" style="color:var(--lime)">🏆 +20</div>
    </div>`;
  }).join('');
  const waitCards=canClaim.map(p=>{
    const goal=p.goal||{name:'the bag',emoji:'💰'};
    return `<div class="gr-card gr-win" style="border-color:rgba(255,215,0,.4);background:rgba(255,215,0,.07)">
      <div class="gr-card-av" style="background:${p.color}">${p.av}</div>
      <div class="gr-card-info">
        <div class="gr-card-name">${p.name}</div>
        <div class="gr-card-goal">${goal.emoji} ${goal.name} · can afford!</div>
      </div>
      <div class="gr-card-status" style="color:#FFD700;animation:claimPulse 1.2s ease-in-out infinite">⏳</div>
    </div>`;
  }).join('');
  const missCards=missed.map(p=>{
    const goal=p.goal||{name:'the bag',target:8000,emoji:'💰'};
    const short=goal.target-netWorth(p);
    return `<div class="gr-card gr-lose">
      <div class="gr-card-av" style="background:${p.color}">${p.av}</div>
      <div class="gr-card-info">
        <div class="gr-card-name">${p.name}</div>
        <div class="gr-card-goal">${goal.emoji} ${goal.name} · ${fmt(short)} short</div>
      </div>
      <div class="gr-card-status" style="color:var(--faint)">💔</div>
    </div>`;
  }).join('');
  return `<div class="dist">
    <div class="gr-host-counter">
      <div class="gr-big-n">${claimed.length}<span style="color:var(--faint);font-size:2.5rem"> / ${ps.length}</span></div>
      <div class="gr-big-label">students claimed their dream goal 🎯</div>
      ${canClaim.length?`<div style="color:#FFD700;font-weight:800;font-size:.9rem;margin-top:8px">⚡ ${canClaim.length} more can claim — waiting on their phones</div>`:''}
    </div>
    <div class="gr-cards">${claimedCards}${waitCards}${missCards}</div>
    <div style="color:var(--muted);font-size:.82rem;font-weight:800;text-align:center;margin-top:14px">Claiming adds +20 to final life score · students tap the button on their phone</div>
  </div>`;
}

/* ═══════ CLASS SCOREBOARD (replaces 4 wacky panels) ═══════ */
function lifeScore(p){ return Math.round(Math.max(0,netWorth(p))/500 + p.vibes*2 + p.futureYou - stressOf(p) + (p.goalAchieved?20:0)); }
function renderScoreboard(noChart){
  const ps=[...playersArr()].sort((a,b)=>lifeScore(b)-lifeScore(a));
  if(!ps.length) return `<div class="sb" id="sbWrap"><div style="color:var(--faint);text-align:center;padding:32px;font-weight:800">no players yet</div></div>`;
  const stressCol=s=>s>=70?'var(--red)':s>=40?'var(--amber)':'var(--lime)';
  const CROWN=`<svg width="14" height="12" viewBox="0 0 18 15" fill="none" style="flex-shrink:0"><path d="M9 0L11.7251 5.38531L17.55 6.22383L13.275 10.2237L14.28 15L9 12.3853L3.72 15L4.725 10.2237L0.45 6.22383L6.27487 5.38531L9 0Z" fill="#FFD700"/></svg>`;
  const ls0=lifeScore(ps[0])||1;
  const rows=ps.map((p,i)=>{
    const nw=netWorth(p), st=stressOf(p), broke=nw<=0, ls=lifeScore(p);
    const isLeader=i===0&&ls>0;
    const owe=(p.debt||0)+(p.friendDebt||0);
    return `<tr class="sb-tr${isLeader?' leader':''}${broke?' sb-broke':''}">
      <td class="sb-td">${i===0&&ls>0?'👑':'#'+(i+1)}</td>
      <td class="sb-td sb-nm"><div class="sb-nm-inner"><div class="sb-av" style="background:${p.color}">${p.av}</div><span class="nm-txt">${p.name}</span>${isLeader?CROWN:''}${broke?`<span class="sb-broke-chip">💀</span>`:''}</div></td>
      <td class="sb-td" style="font-size:1.4rem;text-align:center" title="${p.goal?p.goal.name:''}">${p.goal?(p.goalAchieved?'🏆':p.goal.emoji):''}</td>
      <td class="sb-td" style="font-size:1.55rem;font-weight:900;color:${ls>=ls0*.9?'#50d890':ls>=ls0*.7?'#a8e06a':ls>=ls0*.5?'#ffa94d':'#ff4757'}">${ls}</td>
      <td class="sb-td ${p.cash<=200?'sb-neg':''}">${fmt(p.cash)}</td>
      <td class="sb-td" style="color:${p.vibes>=70?'#50d890':p.vibes>=50?'#a8e06a':p.vibes>=30?'#ffa94d':'#ff4757'}">${Math.round(p.vibes)}</td>
      <td class="sb-td" style="color:${p.futureYou>=70?'#50d890':p.futureYou>=50?'#a8e06a':p.futureYou>=30?'#ffa94d':'#ff4757'}">${Math.round(p.futureYou)}</td>
      <td class="sb-td" style="color:${stressCol(st)};${st>=70?'font-size:.95rem;font-weight:900':st>=40?'font-weight:900':''}">${st}${st>=70?' 🔥':''}</td>
    </tr>`;
  }).join('');
  return `<div class="sb" id="sbWrap">
    <div class="sb-hd"><h3>📊 Class Scoreboard</h3><span class="sb-sub">${ps.length} students · round ${state.round}/${state.deckLen||12}</span></div>
    <div style="font-size:.8rem;color:var(--muted);text-align:center;margin:-6px 0 10px;font-weight:700">⭐ life score = wealth + 2× mood + future − stress · balance wins</div>
    <table class="sb-table">
      <thead><tr>
        <th class="sb-th">#</th>
        <th class="sb-th" style="text-align:left">student</th>
        <th class="sb-th">🎯</th>
        <th class="sb-th">⭐ life score</th>
        <th class="sb-th">💸 wallet</th>
        <th class="sb-th">✨ mood</th>
        <th class="sb-th">🔮 future</th>
        <th class="sb-th">😤 stress</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${noChart?'':renderWealthStressChart(ps)}
  </div>`;
}

/* ═══════ CALENDAR TEASER (between reveal → next round) ═══════ */
function renderCalendar(){
  const deckLen=state.deckLen||12;
  const nextRound=state.round+1;
  const sel=state.deckSelected;
  const next=sel&&state.round<deckLen?DECK[sel[state.round]]:null;
