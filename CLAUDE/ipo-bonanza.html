  :root {
    --bg:        #1a2e45;
    --bg-2:      #1e3550;
    --panel:     #243d5c;
    --panel-2:   #2a456a;
    --panel-3:   #304e78;
    --line:      rgba(120, 160, 200, 0.12);
    --line-2:    rgba(120, 160, 200, 0.22);
    --ink:       #d9e6f2;
    --ink-2:     #8da3bf;
    --ink-3:     #5e7593;
    --up:        #00ff95;
    --dn:        #ff3366;
    --amber:     #ffb648;
    --violet:    #b48cff;
    --up-glow:   rgba(0, 255, 149, 0.15);
    --dn-glow:   rgba(255, 51, 102, 0.15);
    --amber-glow: rgba(255, 182, 72, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: &#x27;Inter&#x27;, system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .mono { font-family: &#x27;JetBrains Mono&#x27;, monospace; font-feature-settings: &#x27;tnum&#x27;; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  .amber { color: var(--amber); }
  .dim { color: var(--ink-3); }
  button { font-family: inherit; }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr;
    background:
      radial-gradient(1200px 700px at 20% -10%, rgba(40,80,140,0.18), transparent 60%),
      radial-gradient(900px 600px at 90% 10%, rgba(0,255,149,0.04), transparent 60%),
      var(--bg);
  }

  /* ─── top tape ─── */
  .tape {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px;
    background: linear-gradient(180deg, #0a1220 0%, #0c1626 100%);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .tape-l, .tape-r { display: flex; align-items: center; gap: 14px; }
  .logo-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #00ff95, #007a48 70%, #003520);
    box-shadow: 0 0 12px rgba(0,255,149,0.6), inset 0 0 4px rgba(0,0,0,0.4);
  }
  .brand { font-weight: 900; letter-spacing: 2.5px; font-size: 13px; }
  .brand-2 { color: var(--ink-2); font-weight: 600; letter-spacing: 2px; font-size: 11px; }
  .tape-sep { width: 1px; height: 14px; background: var(--line-2); }
  .tape-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; font-weight: 700;
    padding: 4px 9px; border-radius: 4px;
    background: rgba(0, 255, 149, 0.10); color: var(--up);
    border: 1px solid rgba(0,255,149,0.30);
  }
  .tape-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--up); box-shadow: 0 0 8px var(--up);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .tape-meta {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    color: var(--ink-3); letter-spacing: 1.5px;
  }
  .xp-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 10px; border-radius: 4px;
    background: rgba(180,140,255,0.10); color: var(--violet);
    border: 1px solid rgba(180,140,255,0.30);
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 1px;
  }

  /* ─── stage stepper ─── */
  .stepper {
    display: flex; align-items: center;
    background: #050810;
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    overflow-x: auto;
    gap: 4px;
  }
  .step {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 11px; border-radius: 4px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: 1.2px; color: var(--ink-3);
    background: transparent;
    border: 1px solid transparent;
    white-space: nowrap;
    cursor: default;
    transition: all 0.18s;
  }
  .step .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--panel-3); color: var(--ink-3);
    font-size: 9.5px;
  }
  .step.done { color: var(--up); }
  .step.done .n { background: rgba(0,255,149,0.18); color: var(--up); }
  .step.current { color: var(--amber); background: rgba(255,182,72,0.08); border-color: rgba(255,182,72,0.3); }
  .step.current .n { background: var(--amber); color: #1a1100; }
  .step-arr { color: var(--ink-3); font-size: 11px; }

  /* ─── stage shell ─── */
  .stage {
    padding: 22px 24px 60px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  .stage-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 8px;
  }
  .stage-num {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 2px; color: var(--amber);
  }
  .stage-title {
    font-size: 28px; font-weight: 800; letter-spacing: -0.4px;
    color: var(--ink); text-wrap: pretty;
  }
  .stage-sub {
    color: var(--ink-2); font-size: 14px; max-width: 720px; margin-bottom: 22px;
    line-height: 1.5;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    overflow: hidden;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom: 1px solid var(--line);
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    letter-spacing: 1.5px; font-weight: 700; color: var(--ink-2);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px;
    background: linear-gradient(180deg, #00ff95, #00b86a);
    color: #03110a;
    border: 0; border-radius: 4px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 800;
    font-size: 12.5px; letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,255,149,0.5), 0 6px 24px rgba(0,255,149,0.25);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(0,255,149,0.7), 0 8px 30px rgba(0,255,149,0.35); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost {
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--line-2); box-shadow: none;
  }
  .btn.ghost:hover { background: var(--panel-2); color: var(--ink); border-color: var(--ink-3); transform: none; box-shadow: none; }
  .btn.amber {
    background: linear-gradient(180deg, #ffd58c, #f59e0b);
    color: #1a1100;
    box-shadow: 0 0 0 1px rgba(255,182,72,0.5), 0 6px 24px rgba(255,182,72,0.25);
  }
  .btn.amber:hover { box-shadow: 0 0 0 1px rgba(255,182,72,0.7), 0 8px 30px rgba(255,182,72,0.35); }

  .footer-bar {
    margin-top: 28px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }

  /* ─── hero / start screen ─── */
  .hero {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 20px;
    padding: 40px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .hero-l h1 {
    font-size: 56px; line-height: 1; font-weight: 900;
    letter-spacing: -2px; margin: 14px 0 18px;
    color: var(--ink);
    text-wrap: balance;
  }
  .hero-l h1 .accent {
    background: linear-gradient(90deg, #00ff95, #ffb648);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 2px; color: var(--up);
    padding: 5px 10px; border-radius: 4px;
    background: rgba(0,255,149,0.08); border: 1px solid rgba(0,255,149,0.3);
  }
  .hero-lede {
    font-size: 17px; line-height: 1.55; color: var(--ink-2);
    max-width: 560px; margin-bottom: 26px;
  }
  .mode-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 28px;
  }
  .mode-card {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 14px;
    text-align: left;
  }
  .mode-card.locked { opacity: 0.55; }
  .mode-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .mode-pip {
    width: 8px; height: 8px; border-radius: 50%; background: var(--up);
    box-shadow: 0 0 8px var(--up);
  }
  .mode-card.locked .mode-pip { background: var(--ink-3); box-shadow: none; }
  .mode-name { font-weight: 800; font-size: 13px; letter-spacing: 0.4px; }
  .mode-soon {
    margin-left: auto;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 9.5px; font-weight: 700;
    letter-spacing: 1.5px; color: var(--ink-3);
  }
  .mode-desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }

  .ipo-card {
    background:
      linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line-2);
    border-radius: 8px; padding: 22px;
    position: relative; overflow: hidden;
  }
  .ipo-card::before {
    content: &#x27;&#x27;; position: absolute; inset: 0;
    background: radial-gradient(400px 200px at 100% 0%, rgba(0,255,149,0.08), transparent);
    pointer-events: none;
  }
  .ipo-logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 10px;
    background: linear-gradient(135deg, #00ff95, #00a85f);
    color: #001a0e; font-weight: 900; font-size: 20px;
    letter-spacing: -1px;
    box-shadow: 0 6px 24px rgba(0,255,149,0.3);
  }
  .ipo-card h3 { margin: 14px 0 4px; font-size: 22px; letter-spacing: -0.3px; }
  .ipo-card .sector { color: var(--ink-3); font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; letter-spacing: 1.5px; }
  .ipo-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    margin-top: 18px; background: var(--line);
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  }
  .ipo-meta div { background: var(--panel-2); padding: 10px 12px; }
  .ipo-meta .l { font-size: 10.5px; letter-spacing: 1.5px; color: var(--ink-3); font-weight: 700; font-family: &#x27;JetBrains Mono&#x27;, monospace; }
  .ipo-meta .v { font-size: 15px; font-weight: 700; color: var(--ink); margin-top: 3px; font-family: &#x27;JetBrains Mono&#x27;, monospace; }
  .ipo-window {
    margin-top: 14px; padding: 10px 12px;
    background: rgba(255,182,72,0.08);
    border: 1px solid rgba(255,182,72,0.25);
    border-radius: 4px;
    display: flex; align-items: center; gap: 10px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11.5px;
  }
  .ipo-window .l { color: var(--amber); font-weight: 700; letter-spacing: 1.2px; }
  .ipo-window .r { color: var(--ink); margin-left: auto; font-weight: 600; }

  /* ─── company intro ─── */
  .intro-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  @media (max-width: 760px) { .intro-grid { grid-template-columns: 1fr; } }
  .stat-row { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .stat-cell { background: var(--panel-2); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .stat-cell .l { font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; color: var(--ink-3); letter-spacing: 1.2px; font-weight: 700; }
  .stat-cell .v { font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 14px; font-weight: 700; }

  /* ─── DRHP red-flag mini-game ─── */
  .drhp {
    display: grid; gap: 10px;
  }
  .drhp-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 16px;
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.16s;
  }
  .drhp-row:hover { background: var(--panel-3); border-color: var(--line); }
  .drhp-row.flagged {
    background: rgba(255,51,102,0.15);
    border-color: rgba(255,51,102,0.7);
    border-width: 2px;
  }
  .drhp-row.flagged.correct {
    background: rgba(0,255,149,0.12);
    border-color: rgba(0,255,149,0.75);
    border-width: 2px;
  }
  .drhp-row.missed {
    background: rgba(255,182,72,0.10);
    border-color: rgba(255,182,72,0.60);
    border-width: 2px;
  }
  .drhp-check {
    width: 24px; height: 24px; border-radius: 5px;
    border: 2px solid var(--ink-3); flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--bg);
    font-weight: 900; font-size: 13px;
    margin-top: 2px;
  }
  .drhp-row.flagged .drhp-check {
    background: var(--dn); border-color: var(--dn); color: #fff;
  }
  .drhp-row.flagged.correct .drhp-check {
    background: var(--up); border-color: var(--up); color: #001a0e;
  }
  .drhp-body { flex: 1; }
  .drhp-section {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; color: var(--ink-3); margin-bottom: 3px;
  }
  .drhp-text { font-size: 14px; line-height: 1.45; color: var(--ink); font-weight: 500; }
  .drhp-verdict {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11.5px; font-weight: 800;
    letter-spacing: 1.5px; padding: 6px 12px; border-radius: 4px;
    margin-top: 10px; display: inline-block;
  }
  .drhp-verdict.bad   { background: rgba(255,51,102,0.22);  color: var(--dn);   border: 1px solid rgba(255,51,102,0.5); }
  .drhp-verdict.good  { background: rgba(0,255,149,0.18);   color: var(--up);   border: 1px solid rgba(0,255,149,0.5); }
  .drhp-verdict.ok    { background: rgba(0,255,149,0.18);   color: var(--up);   border: 1px solid rgba(0,255,149,0.5); }
  .drhp-verdict.miss  { background: rgba(255,182,72,0.20);  color: var(--amber); border: 1px solid rgba(255,182,72,0.5); }
  .drhp-verdict.ghost { background: rgba(120,160,200,0.10); color: var(--ink-3); border: 1px solid rgba(120,160,200,0.25); }

  /* ─── bidding ─── */
  .bid-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 860px) { .bid-grid { grid-template-columns: 1fr; } }

  .bid-form { padding: 18px; }
  .bid-label {
    display: flex; justify-content: space-between; align-items: center;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; font-weight: 700;
    color: var(--ink-2); letter-spacing: 1.5px; margin-bottom: 8px;
  }
  .bid-row { margin-bottom: 18px; }
  .lot-bar {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .lot-chip {
    flex: 1; min-width: 70px;
    padding: 12px 4px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--line-2);
    color: var(--ink); cursor: pointer;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 700; font-size: 13px;
    transition: all 0.14s;
  }
  .lot-chip:hover { border-color: var(--ink-3); background: var(--panel-3); }
  .lot-chip.active {
    background: rgba(255,182,72,0.10);
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: 0 0 0 1px rgba(255,182,72,0.4);
  }
  .lot-chip small { display: block; font-size: 10px; color: var(--ink-3); margin-top: 3px; font-weight: 600; letter-spacing: 1px; }
  .lot-chip.active small { color: rgba(255,182,72,0.8); }

  .price-slider {
    width: 100%; -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--panel-3), var(--panel-3));
    outline: none; margin: 6px 0 4px;
  }
  .price-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 4px rgba(255,182,72,0.18), 0 0 14px rgba(255,182,72,0.5);
    cursor: pointer; border: 2px solid #1a1100;
  }
  .price-slider::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--amber); border: 2px solid #1a1100;
    box-shadow: 0 0 0 4px rgba(255,182,72,0.18), 0 0 14px rgba(255,182,72,0.5);
    cursor: pointer;
  }
  .price-marks {
    display: flex; justify-content: space-between;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    color: var(--ink-3); font-weight: 700; letter-spacing: 1px;
  }
  .cutoff-toggle {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
    padding: 10px 12px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--line-2);
    cursor: pointer;
  }
  .cutoff-toggle.on { background: rgba(180,140,255,0.08); border-color: rgba(180,140,255,0.4); }
  .toggle-pip {
    width: 36px; height: 20px; border-radius: 12px;
    background: var(--panel-3); position: relative; flex-shrink: 0;
    transition: background 0.18s;
  }
  .toggle-pip::after {
    content: &#x27;&#x27;; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--ink-3); transition: all 0.18s;
  }
  .cutoff-toggle.on .toggle-pip { background: rgba(180,140,255,0.3); }
  .cutoff-toggle.on .toggle-pip::after { left: 18px; background: var(--violet); }

  .bid-summary {
    background: var(--panel-2); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 16px;
    display: grid; gap: 12px;
  }
  .sum-row { display: flex; justify-content: space-between; align-items: center; font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 13px; }
  .sum-row.big { font-size: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  .sum-row .l { color: var(--ink-3); letter-spacing: 1px; font-weight: 600; font-size: 11.5px; }
  .sum-row.big .l { color: var(--amber); font-size: 12px; }
  .sum-row .v { color: var(--ink); font-weight: 700; }
  .sum-row.big .v { color: var(--amber); font-weight: 900; font-size: 22px; }

  /* ─── demand curve ─── */
  .demand-panel { padding: 16px; }
  .demand-svg { width: 100%; height: 220px; display: block; }
  .demand-legend {
    display: flex; justify-content: space-around; margin-top: 8px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 10.5px;
    color: var(--ink-3); letter-spacing: 1px;
  }
  .demand-legend b { color: var(--ink); display: block; font-size: 14px; margin-top: 2px; }

  /* ─── Newspaper basis-of-allotment announcement ─── */
  .newspaper {
    margin-top: 22px;
    background: linear-gradient(180deg, #f5efe0 0%, #ede4d0 100%);
    border: 1px solid #c9b88a;
    border-radius: 4px;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.4),
      0 14px 30px -10px rgba(0,0,0,0.5),
      inset 0 0 60px rgba(140,110,60,0.08);
    color: #1a1408;
    font-family: &#x27;Georgia&#x27;, &#x27;Times New Roman&#x27;, serif;
    position: relative;
    overflow: hidden;
  }
  .newspaper::before {
    content: &#x27;&#x27;;
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(120,90,30,0.05) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(120,90,30,0.06) 0%, transparent 40%);
    pointer-events: none;
  }
  .np-stamp {
    position: absolute; top: 14px; right: 14px;
    transform: rotate(-7deg);
    border: 2px solid #b03a2e;
    color: #b03a2e;
    padding: 4px 12px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace;
    font-size: 10px; font-weight: 800; letter-spacing: 2px;
    opacity: 0.78;
    border-radius: 2px;
    z-index: 2;
  }
  .np-masthead {
    text-align: center;
    padding: 18px 24px 12px;
    border-bottom: 3px double #2a1f0a;
    position: relative; z-index: 1;
  }
  .np-masthead .ed {
    font-family: &#x27;JetBrains Mono&#x27;, monospace;
    font-size: 10px; letter-spacing: 4px;
    color: #5a4520; font-weight: 700;
  }
  .np-masthead h2 {
    font-size: 24px; font-weight: 900; letter-spacing: 1px;
    margin: 4px 0 2px;
    text-transform: uppercase;
    color: #1a1408;
  }
  .np-masthead .sub {
    font-size: 11px; letter-spacing: 3px; color: #5a4520;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 700;
  }
  .np-body {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    position: relative; z-index: 1;
  }
  .np-ad {
    padding: 22px 24px 24px;
    border-right: 1px solid #c9b88a;
  }
  .np-ad h3 {
    text-align: center;
    font-size: 13px; font-weight: 800;
    letter-spacing: 2px;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  .np-ad h4 {
    text-align: center;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px;
    margin: 0 0 16px;
    color: #5a4520;
    text-transform: uppercase;
  }
  .np-ad .corp {
    text-align: center;
    font-size: 18px; font-weight: 900;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .np-ad .corp-meta {
    text-align: center;
    font-size: 10px; color: #5a4520;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .np-rule { border: 0; border-top: 1px solid #8a6f3a; margin: 12px 0; }
  .np-rule-thick { border: 0; border-top: 2px solid #2a1f0a; margin: 14px 0 12px; }
  .np-sec-head {
    font-size: 11px; font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    background: #2a1f0a;
    color: #f5efe0;
    padding: 4px 10px;
    display: inline-block;
  }
  .np-table {
    width: 100%; border-collapse: collapse;
    font-size: 11.5px;
    margin-bottom: 10px;
  }
  .np-table th, .np-table td {
    padding: 5px 8px;
    border: 1px solid #8a6f3a;
    text-align: right;
  }
  .np-table th:first-child, .np-table td:first-child { text-align: left; }
  .np-table thead th {
    background: #e3d4ac;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .np-table tbody tr.total td {
    background: #efe3bf;
    font-weight: 800;
  }
  .np-para { font-size: 11.5px; line-height: 1.55; margin: 8px 0; text-align: justify; }
  .np-foot {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #8a6f3a;
    font-size: 10px;
    color: #5a4520;
    letter-spacing: 0.5px;
    line-height: 1.5;
  }
  .np-key {
    font-family: &#x27;JetBrains Mono&#x27;, monospace;
    font-size: 11px;
    background: #efe3bf;
    padding: 1px 5px;
    border-radius: 2px;
    font-weight: 700;
  }
  /* annotation column */
  .np-annot {
    padding: 20px 20px 24px;
    background: rgba(245,239,224,0.4);
    display: flex; flex-direction: column; gap: 14px;
  }
  .np-annot-head {
    font-family: &#x27;JetBrains Mono&#x27;, monospace;
    font-size: 10px; letter-spacing: 2px;
    color: #5a4520;
    font-weight: 800;
    padding-bottom: 6px;
    border-bottom: 1px solid #8a6f3a;
  }
  .np-callout {
    border-left: 3px solid #c0791a;
    padding: 4px 0 4px 12px;
    font-family: &#x27;Inter&#x27;, system-ui, sans-serif;
  }
  .np-callout .num {
    display: inline-block;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #c0791a;
    color: #f5efe0;
    text-align: center;
    line-height: 22px;
    font-size: 11px; font-weight: 800;
    font-family: &#x27;JetBrains Mono&#x27;, monospace;
    margin-bottom: 6px;
  }
  .np-callout .label {
    font-size: 12px; font-weight: 800;
    color: #2a1f0a;
    margin-bottom: 3px;
    letter-spacing: 0.3px;
  }
  .np-callout .body {
    font-size: 11.5px; line-height: 1.5;
    color: #2a1f0a;
  }
  .np-pointer {
    display: inline-block;
    width: 18px; height: 18px;
    background: #c0791a;
    color: #f5efe0;
    border-radius: 50%;
    font-family: &#x27;JetBrains Mono&#x27;, monospace;
    font-size: 10px; font-weight: 800;
    text-align: center; line-height: 18px;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* ─── ASBA bank ─── */
  .asba-card {
    background:
      linear-gradient(135deg, #0b1a2e 0%, #0f2640 100%);
    border: 1px solid rgba(120,160,255,0.25);
    border-radius: 10px; padding: 22px;
    color: var(--ink);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .asba-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 22px;
  }
  .asba-bank {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 12px;
    letter-spacing: 2px; font-weight: 800; color: var(--ink);
  }
  .asba-bank .sub { color: var(--ink-3); font-size: 10px; letter-spacing: 1.5px; }
  .asba-acct {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px;
    color: var(--ink-3); letter-spacing: 2px;
  }
  .asba-bal-l { font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; color: var(--ink-3); letter-spacing: 1.5px; font-weight: 700; }
  .asba-bal {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 36px; font-weight: 900;
    letter-spacing: -1px; margin-top: 2px; color: var(--ink);
  }
  .asba-meter {
    display: flex; height: 22px; border-radius: 4px; overflow: hidden;
    background: var(--panel-3); margin-top: 20px;
    border: 1px solid var(--line);
  }
  .asba-meter .available { background: linear-gradient(180deg, rgba(0,255,149,0.4), rgba(0,255,149,0.2)); }
  .asba-meter .blocked { background: repeating-linear-gradient(45deg, rgba(255,182,72,0.5), rgba(255,182,72,0.5) 6px, rgba(255,182,72,0.3) 6px, rgba(255,182,72,0.3) 12px); transition: width 0.6s ease; }
  .asba-meter-key {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 11px; letter-spacing: 1px;
  }
  .asba-meter-key span { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 700; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }

  /* ─── oversubscription ─── */
  .sub-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 18px;
  }
  @media (max-width: 720px) { .sub-grid { grid-template-columns: 1fr; } }
  .sub-card {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 16px;
    position: relative; overflow: hidden;
  }
  .sub-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
  }
  .sub-name {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 800;
    font-size: 13px; letter-spacing: 1.5px;
  }
  .sub-name.qib { color: var(--violet); }
  .sub-name.hni { color: var(--amber); }
  .sub-name.ret { color: var(--up); }
  .sub-mult {
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-weight: 900;
    font-size: 32px; letter-spacing: -1px; color: var(--ink);
    line-height: 1;
  }
  .sub-mult sup { font-size: 16px; color: var(--ink-3); font-weight: 700; }
  .sub-bar {
    height: 8px; background: var(--panel-3); border-radius: 4px;
    overflow: hidden; margin-top: 12px;
  }
  .sub-fill { height: 100%; transition: width 0.4s ease; }
  .sub-fill.qib { background: linear-gradient(90deg, var(--violet), #d4b8ff); box-shadow: 0 0 12px rgba(180,140,255,0.5); }
  .sub-fill.hni { background: linear-gradient(90deg, var(--amber), #ffd58c); box-shadow: 0 0 12px rgba(255,182,72,0.5); }
  .sub-fill.ret { background: linear-gradient(90deg, var(--up), #6fffc6); box-shadow: 0 0 12px rgba(0,255,149,0.5); }
  .sub-meta {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-family: &#x27;JetBrains Mono&#x27;, monospace; font-size: 10.5px;
    color: var(--ink-3); letter-spacing: 1px; font-weight: 700;
  }

  .news-feed {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 14px 18px;
    max-height: 260px; overflow: hidden;
    position: relative;
  }
  .news-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
    animation: slideIn 0.5s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } }

/* ============================================================
   ROOT APP
   ============================================================ */
function App() {
  const [stage, setStage] = useState(0);
  const [xp, setXp]       = useState(0);
  const [game, setGame]   = useState({
    correctFlags: [],
    wrongFlags:   [],
    bidPrice: PRICE_HIGH,
    bidLots:  1,
    useCutoff: true,
    bankBalance: 250000,
    blocked: 0,
    finalSubscription: null,    // { qib, hni, ret }
    finalIssuePrice: PRICE_HIGH,
    allotment: null,            // { sharesAlloted, refund, won }
    listingPrice: null,
    listingPath: [],
    badges: new Set(),
  });

  const addXp = (n) =&gt; setXp(x =&gt; x + n);
  const grantBadge = (b) =&gt; setGame(g =&gt; {
    const s = new Set(g.badges); s.add(b); return { ...g, badges: s };
  });

  const scrollTop = () =&gt; {
    try { window.scrollTo({ top: 0, behavior: &#x27;smooth&#x27; }); } catch(e) {}
    try {
      const f = window.frameElement;
      if (f) {
        const top = f.getBoundingClientRect().top + window.parent.scrollY - 80;
        window.parent.scrollTo({ top: Math.max(0, top), behavior: &#x27;smooth&#x27; });
      }
    } catch(e) {}
  };
  const next = () =&gt; { setStage(s =&gt; s + 1); scrollTop(); };
  const back = () =&gt; { setStage(s =&gt; Math.max(0, s - 1)); scrollTop(); };

  const ctx = { stage, setStage, xp, addXp, game, setGame, grantBadge, next, back };

  return (
    &lt;div className=&quot;app&quot;&gt;
      &lt;TopTape xp={xp} stage={stage} /&gt;
      {stage &gt; 0 &amp;&amp; stage &lt; 9 &amp;&amp; &lt;Stepper stage={stage} /&gt;}
      {stage === 0 &amp;&amp; &lt;Start ctx={ctx} /&gt;}
      {stage === 1 &amp;&amp; &lt;CompanyIntro ctx={ctx} /&gt;}
      {stage === 2 &amp;&amp; &lt;DRHPHunt ctx={ctx} /&gt;}
      {stage === 3 &amp;&amp; &lt;PriceBand ctx={ctx} /&gt;}
      {stage === 4 &amp;&amp; &lt;Bidding ctx={ctx} /&gt;}
      {stage === 5 &amp;&amp; &lt;ASBABlock ctx={ctx} /&gt;}
      {stage === 6 &amp;&amp; &lt;Oversubscription ctx={ctx} /&gt;}
      {stage === 7 &amp;&amp; &lt;Allotment ctx={ctx} /&gt;}
      {stage === 8 &amp;&amp; &lt;ListingDay ctx={ctx} /&gt;}
      {stage === 9 &amp;&amp; &lt;FinalScore ctx={ctx} /&gt;}
    &lt;/div&gt;
  );
}

/* ============================================================

        &lt;span className=&quot;logo-dot&quot;&gt;&lt;/span&gt;
        &lt;span className=&quot;brand&quot;&gt;IPO BONANZA&lt;/span&gt;
        &lt;span className=&quot;tape-sep&quot;&gt;&lt;/span&gt;
        &lt;span className=&quot;brand-2&quot;&gt;FROM STARTUP · TO STOCK EXCHANGE&lt;/span&gt;
      &lt;/div&gt;
      &lt;div className=&quot;tape-r&quot;&gt;
        {stage &gt; 0 &amp;&amp; stage &lt; 9 &amp;&amp; (
          &lt;span className=&quot;tape-pill&quot;&gt;&lt;span className=&quot;dot&quot;&gt;&lt;/span&gt; ISSUE LIVE · NEXAFIN&lt;/span&gt;
        )}
        &lt;span className=&quot;xp-pill&quot;&gt;★ {xp.toLocaleString(&#x27;en-IN&#x27;)} XP&lt;/span&gt;

      &lt;/div&gt;
    &lt;/div&gt;
  );
}

/* ============================================================
   STEPPER
   ============================================================ */
const STEPS = [
  &#x27;COMPANY&#x27;, &#x27;DRHP&#x27;, &#x27;PRICE BAND&#x27;, &#x27;BID&#x27;, &#x27;ASBA&#x27;, &#x27;SUBSCRIPTION&#x27;, &#x27;ALLOTMENT&#x27;, &#x27;LISTING&#x27;,
];
function Stepper({ stage }) {
  // stage 1 = step 0, ..., stage 8 = step 7
  const current = stage - 1;
  return (
    &lt;div className=&quot;stepper&quot;&gt;
      {STEPS.map((s, i) =&gt; (
        &lt;React.Fragment key={s}&gt;
          &lt;div className={`step ${i &lt; current ? &#x27;done&#x27; : &#x27;&#x27;} ${i === current ? &#x27;current&#x27; : &#x27;&#x27;}`}&gt;
            &lt;span className=&quot;n&quot;&gt;{i &lt; current ? &#x27;✓&#x27; : (i + 1).toString().padStart(2, &#x27;0&#x27;)}&lt;/span&gt;
            &lt;span&gt;{s}&lt;/span&gt;
          &lt;/div&gt;
          {i &lt; STEPS.length - 1 &amp;&amp; &lt;span className=&quot;step-arr&quot;&gt;›&lt;/span&gt;}
        &lt;/React.Fragment&gt;
      ))}
    &lt;/div&gt;
  );
}

/* ============================================================
   STAGE 0 — START
   ============================================================ */
function Start({ ctx }) {

/* ============================================================
   STAGE 2 — DRHP RED-FLAG HUNT
   ============================================================ */
function DRHPHunt({ ctx }) {
  const [flagged, setFlagged] = useState(new Set());
  const [submitted, setSubmitted] = useState(false);

  const toggle = (i) =&gt; {
    if (submitted) return;
    const s = new Set(flagged);
    if (s.has(i)) s.delete(i); else s.add(i);
    setFlagged(s);
  };

  const realFlags = DRHP_ITEMS.map((d, i) =&gt; d.isFlag ? i : null).filter(x =&gt; x !== null);
  const correctCount = [...flagged].filter(i =&gt; DRHP_ITEMS[i].isFlag).length;
  const wrongCount   = [...flagged].filter(i =&gt; !DRHP_ITEMS[i].isFlag).length;
  const missed       = realFlags.filter(i =&gt; !flagged.has(i)).length;

  const submit = () =&gt; {
    setSubmitted(true);
    const score = correctCount * 30 - wrongCount * 15;
    ctx.addXp(Math.max(0, score));
    ctx.setGame(g =&gt; ({ ...g, correctFlags: [...flagged].filter(i =&gt; DRHP_ITEMS[i].isFlag), wrongFlags: [...flagged].filter(i =&gt; !DRHP_ITEMS[i].isFlag) }));
    if (correctCount === realFlags.length &amp;&amp; wrongCount === 0) ctx.grantBadge(&#x27;DD HOUND&#x27;);
  };

  return (
    &lt;div className=&quot;stage&quot;&gt;
      &lt;div className=&quot;stage-head&quot;&gt;&lt;span className=&quot;stage-num&quot;&gt;STAGE 02 / 08&lt;/span&gt;&lt;/div&gt;
      &lt;div className=&quot;stage-title&quot;&gt;Hunt the red flags in the DRHP.&lt;/div&gt;
      &lt;p className=&quot;stage-sub&quot;&gt;
        The &lt;b&gt;Draft Red Herring Prospectus&lt;/b&gt; is the company’s sworn pitch document. It also legally requires them to disclose ugly things. Tap every statement that should make you nervous — be picky, false alarms cost XP.
      &lt;/p&gt;

      &lt;div className=&quot;drhp&quot;&gt;
        {DRHP_ITEMS.map((d, i) =&gt; {
          const isOn = flagged.has(i);
          const correct = isOn &amp;&amp; d.isFlag;
          const wrong   = isOn &amp;&amp; !d.isFlag;
          return (
            &lt;div
              key={i}
              className={`drhp-row ${isOn ? &#x27;flagged&#x27; : &#x27;&#x27;} ${submitted &amp;&amp; correct ? &#x27;correct&#x27; : &#x27;&#x27;} ${submitted &amp;&amp; !isOn &amp;&amp; d.isFlag ? &#x27;missed&#x27; : &#x27;&#x27;}`}
              onClick={() =&gt; toggle(i)}
            &gt;
              &lt;span className=&quot;drhp-check&quot;&gt;{isOn ? &#x27;⚑&#x27; : &#x27;&#x27;}&lt;/span&gt;
              &lt;div className=&quot;drhp-body&quot;&gt;
                &lt;div className=&quot;drhp-section&quot;&gt;{d.section}&lt;/div&gt;
                &lt;div className=&quot;drhp-text&quot;&gt;{d.text}&lt;/div&gt;
                {d.translation &amp;&amp; &lt;div style={{fontSize:12.5,color:&#x27;var(--ink-3)&#x27;,marginTop:6,fontStyle:&#x27;italic&#x27;,lineHeight:1.4}}&gt;{d.translation}&lt;/div&gt;}
                {submitted &amp;&amp; (
                  &lt;&gt;
                    {d.isFlag &amp;&amp; isOn &amp;&amp; &lt;span className=&quot;drhp-verdict good&quot;&gt;🚩 RED FLAG CAUGHT · +30 XP&lt;/span&gt;}
                    {d.isFlag &amp;&amp; !isOn &amp;&amp; &lt;span className=&quot;drhp-verdict miss&quot;&gt;⚠ RED FLAG MISSED · 0 XP&lt;/span&gt;}
                    {!d.isFlag &amp;&amp; isOn &amp;&amp; &lt;span className=&quot;drhp-verdict bad&quot;&gt;✗ FALSE ALARM · –15 XP&lt;/span&gt;}
                    {!d.isFlag &amp;&amp; !isOn &amp;&amp; &lt;span className=&quot;drhp-verdict ghost&quot;&gt;✓ CORRECTLY IGNORED&lt;/span&gt;}
                    &lt;p style={{fontSize:12.5,lineHeight:1.5,color:&#x27;var(--ink-2)&#x27;,marginTop:8,marginBottom:0}}&gt;{d.why}&lt;/p&gt;
                  &lt;/&gt;
                )}
              &lt;/div&gt;
            &lt;/div&gt;
          );
        })}
      &lt;/div&gt;

      &lt;div className=&quot;concept&quot;&gt;
        &lt;span className=&quot;tag&quot;&gt;CONCEPT · DRHP&lt;/span&gt;
        &lt;div className=&quot;text&quot;&gt;Investment bankers help draft the DRHP and file it with &lt;b&gt;SEBI&lt;/b&gt;. SEBI reviews, asks for clarifications, and the document becomes the &lt;b&gt;RHP&lt;/b&gt; when fully cleared. The disclosures are dense and dry — but every regrettable IPO of the last decade was foreshadowed in its DRHP.&lt;/div&gt;
      &lt;/div&gt;

      &lt;div className=&quot;footer-bar&quot;&gt;
        &lt;button className=&quot;btn ghost&quot; onClick={ctx.back}&gt;← BACK&lt;/button&gt;
        {!submitted
          ? &lt;button className=&quot;btn amber&quot; disabled={flagged.size === 0} onClick={submit}&gt;SUBMIT {flagged.size &gt; 0 &amp;&amp; `(${flagged.size} FLAGGED)`}&lt;/button&gt;
          : (
            &lt;div style={{display:&#x27;flex&#x27;,gap:14,alignItems:&#x27;center&#x27;}}&gt;
              &lt;span className=&quot;mono&quot; style={{fontSize:12,letterSpacing:1.5}}&gt;
                &lt;span className=&quot;up&quot;&gt;CAUGHT {correctCount}/{realFlags.length}&lt;/span&gt; · &lt;span className=&quot;dn&quot;&gt;{wrongCount} FALSE&lt;/span&gt; · &lt;span className=&quot;dim&quot;&gt;{missed} MISSED&lt;/span&gt;
              &lt;/span&gt;
              &lt;button className=&quot;btn&quot; onClick={ctx.next}&gt;CONTINUE  →&lt;/button&gt;
            &lt;/div&gt;
          )
        }
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

function PriceBand({ ctx }) {
  return (
    &lt;div className=&quot;stage&quot;&gt;
      &lt;div className=&quot;stage-head&quot;&gt;&lt;span className=&quot;stage-num&quot;&gt;STAGE 03 / 08&lt;/span&gt;&lt;/div&gt;

      &lt;p className=&quot;stage-sub&quot;&gt;Two days before bidding, the company files the &lt;b&gt;price band&lt;/b&gt; with SEBI and runs a public notice in the financial dailies. Read it first — then decide your bid.&lt;/p&gt;

      &lt;NewspaperAnnouncement /&gt;

      &lt;p className=&quot;stage-sub&quot; style={{marginTop:24}}&gt;Now that you’ve seen the announcement, here’s how book-building actually works in a &lt;b&gt;book-built&lt;/b&gt; IPO: the company gives a &lt;b&gt;range&lt;/b&gt;, and demand inside the range sets the final price. Different investor classes get reserved slices of the issue.&lt;/p&gt;

      &lt;div className=&quot;intro-grid&quot;&gt;
        &lt;div className=&quot;panel&quot;&gt;
          &lt;div className=&quot;panel-head&quot;&gt;&lt;span&gt;PRICE BAND · BOOK BUILDING&lt;/span&gt;&lt;span className=&quot;mono dim&quot;&gt;₹25 SPREAD&lt;/span&gt;&lt;/div&gt;
          &lt;div style={{padding:22}}&gt;
            &lt;BandViz /&gt;
            &lt;p style={{fontSize:13,color:&#x27;var(--ink-2)&#x27;,lineHeight:1.5,marginTop:16,marginBottom:0}}&gt;
              You can bid &lt;b&gt;at any price in the band, in ₹1 increments&lt;/b&gt;. Bid below the eventual cut-off and your bid is invalid — no shares for you. Bid &lt;b&gt;at cut-off&lt;/b&gt; and you accept whatever final price the book settles on.
            &lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div className=&quot;panel&quot;&gt;
          &lt;div className=&quot;panel-head&quot;&gt;&lt;span&gt;ALLOCATION BUCKETS&lt;/span&gt;&lt;span className=&quot;mono dim&quot;&gt;SEBI MANDATED&lt;/span&gt;&lt;/div&gt;
          &lt;div style={{padding:18, display:&#x27;grid&#x27;, gap: 10}}&gt;
            &lt;AllocRow color=&quot;var(--violet)&quot; pct={50} name=&quot;QIB&quot; full=&quot;Qualified Institutional Buyers&quot; desc=&quot;Mutual funds, insurance, FIIs. Bid in millions. Sets the smart-money tone.&quot; /&gt;
            &lt;AllocRow color=&quot;var(--amber)&quot; pct={15} name=&quot;NII / HNI&quot; full=&quot;Non-Institutional Investors&quot; desc=&quot;₹2L+ applications. Famous for taking loans to chase allotment.&quot; /&gt;
            &lt;AllocRow color=&quot;var(--up)&quot; pct={35} name=&quot;RETAIL&quot; full=&quot;Retail Individual Investors&quot; desc=&quot;That’s you. Up to ₹2L per application. Allotment via lottery if oversubscribed.&quot; active /&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div className=&quot;concept&quot;&gt;
        &lt;span className=&quot;tag&quot;&gt;CONCEPT · BOOK BUILDING&lt;/span&gt;
        &lt;div className=&quot;text&quot;&gt;Bankers don’t magically know the right price. They publish a band, collect bids across price points, and observe demand. The price where the issue is &lt;b&gt;fully subscribed&lt;/b&gt; (or close to it) at the highest level becomes the cut-off. Retail-friendly tip: bidding at cut-off almost always makes sense — you commit to the top of band but get refunded if it settles lower.&lt;/div&gt;
      &lt;/div&gt;

      &lt;div className=&quot;footer-bar&quot;&gt;
        &lt;button className=&quot;btn ghost&quot; onClick={ctx.back}&gt;← BACK&lt;/button&gt;
        &lt;button className=&quot;btn&quot; onClick={() =&gt; { ctx.addXp(40); ctx.next(); }}&gt;PLACE YOUR BID  →&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

function DemandCurve({ userPrice }) {
  // Demand curve: weight heavy at low (some) and very heavy at cut-off
  const points = [];
  for (let p = PRICE_LOW; p &lt;= PRICE_HIGH; p++) {
    const t = (p - PRICE_LOW) / (PRICE_HIGH - PRICE_LOW);
    // Demand profile: small bump low, large surge at top
    const d = 0.15 + 0.18 * Math.exp(-Math.pow((t - 0.05) / 0.18, 2)) + 0.85 * Math.pow(t, 5);
    points.push({ p, d });
  }
  const max = Math.max(...points.map(x =&gt; x.d));
  const W = 100, H = 100;
  const path = points.map((pt, i) =&gt; {
    const x = (i / (points.length - 1)) * W;
    const y = H - (pt.d / max) * (H - 8) - 2;
    return `${i === 0 ? &#x27;M&#x27; : &#x27;L&#x27;} ${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(&#x27; &#x27;);
  const area = `${path} L ${W} ${H} L 0 ${H} Z`;

  const userX = userPrice == null ? null : ((userPrice - PRICE_LOW) / (PRICE_HIGH - PRICE_LOW)) * W;

  return (
    &lt;svg className=&quot;demand-svg&quot; viewBox={`0 0 ${W} ${H}`} preserveAspectRatio=&quot;none&quot;&gt;
      &lt;defs&gt;
        &lt;linearGradient id=&quot;demand-fill&quot; x1=&quot;0&quot; x2=&quot;0&quot; y1=&quot;0&quot; y2=&quot;1&quot;&gt;
          &lt;stop offset=&quot;0%&quot; stopColor=&quot;#ffb648&quot; stopOpacity=&quot;0.45&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stopColor=&quot;#ffb648&quot; stopOpacity=&quot;0.02&quot;/&gt;
        &lt;/linearGradient&gt;
      &lt;/defs&gt;
      {/* gridlines */}
      {[20,40,60,80].map(y =&gt; &lt;line key={y} x1=&quot;0&quot; x2={W} y1={y} y2={y} stroke=&quot;rgba(120,160,200,0.07)&quot; strokeWidth=&quot;0.3&quot;/&gt;)}
      &lt;path d={area} fill=&quot;url(#demand-fill)&quot; /&gt;
      &lt;path d={path} stroke=&quot;#ffb648&quot; strokeWidth=&quot;0.8&quot; fill=&quot;none&quot; vectorEffect=&quot;non-scaling-stroke&quot; /&gt;
      {/* user marker */}
      {userX !== null &amp;&amp; (
        &lt;&gt;
          &lt;line x1={userX} x2={userX} y1=&quot;0&quot; y2={H} stroke=&quot;#00ff95&quot; strokeWidth=&quot;0.6&quot; strokeDasharray=&quot;2 2&quot; vectorEffect=&quot;non-scaling-stroke&quot;/&gt;
          &lt;circle cx={userX} cy=&quot;6&quot; r=&quot;2&quot; fill=&quot;#00ff95&quot;/&gt;
        &lt;/&gt;
      )}
      {/* cut-off marker */}
      &lt;line x1={W-0.3} x2={W-0.3} y1=&quot;0&quot; y2={H} stroke=&quot;#b48cff&quot; strokeWidth=&quot;1&quot; vectorEffect=&quot;non-scaling-stroke&quot;/&gt;
    &lt;/svg&gt;
  );
}

/* ============================================================
   STAGE 6 — OVERSUBSCRIPTION FRENZY (animated)
   ============================================================ */
const FINAL_SUB = { qib: 51.79, hni: 32.96, ret: 7.45 };
function Oversubscription({ ctx }) {
  const [t, setT] = useState(0);          // 0..1 progress
  const [newsCount, setNewsCount] = useState(0);
  const [done, setDone] = useState(false);
  const rafRef = useRef(null);

  useEffect(() =&gt; {
    const start = performance.now();
    const DURATION = 9100;
    const tick = () =&gt; {
      const elapsed = performance.now() - start;
      const p = Math.min(1, elapsed / DURATION);
      const eased = 1 - Math.pow(1 - p, 2.6);
      setT(eased);
      setNewsCount(Math.min(NEWS_FEED.length, Math.ceil(eased * NEWS_FEED.length)));
      if (p &lt; 1) rafRef.current = requestAnimationFrame(tick);
      else {
        setDone(true);
        ctx.setGame(g =&gt; ({ ...g, finalSubscription: FINAL_SUB }));
        ctx.addXp(40);
      }
    };
    rafRef.current = requestAnimationFrame(tick);
    return () =&gt; cancelAnimationFrame(rafRef.current);
  }, []);

  return (
    &lt;div className=&quot;stage&quot;&gt;
      &lt;div className=&quot;stage-head&quot;&gt;&lt;span className=&quot;stage-num&quot;&gt;STAGE 06 / 08&lt;/span&gt;&lt;/div&gt;
      &lt;div className=&quot;stage-title&quot;&gt;{done ? &#x27;Bidding closed. The book is in.&#x27; : &#x27;Subscription is live. Watch the multiples climb.&#x27;}&lt;/div&gt;
      &lt;p className=&quot;stage-sub&quot;&gt;A 1.0× bucket means it was fully subscribed. 10×, 20×, 50× means demand far outstripped supply — and your allotment odds drop with every multiple.&lt;/p&gt;

      &lt;div className=&quot;sub-grid&quot;&gt;
        &lt;SubCard cls=&quot;qib&quot; name=&quot;QIB&quot; full=&quot;QUALIFIED INSTITUTIONAL&quot; target={FINAL_SUB.qib} t={t}/&gt;
        &lt;SubCard cls=&quot;hni&quot; name=&quot;NII / HNI&quot; full=&quot;HIGH NET-WORTH&quot; target={FINAL_SUB.hni} t={t}/&gt;
        &lt;SubCard cls=&quot;ret&quot; name=&quot;RETAIL&quot; full=&quot;INDIVIDUAL · YOU&quot; target={FINAL_SUB.ret} t={t}/&gt;
      &lt;/div&gt;

      &lt;div className=&quot;news-feed&quot;&gt;
        &lt;div className=&quot;panel-head&quot; style={{padding:&#x27;0 0 10px&#x27;, background:&#x27;transparent&#x27;, border:0}}&gt;&lt;span&gt;BREAKING · STREET TICKER&lt;/span&gt;&lt;span className=&quot;mono dim&quot;&gt;{done ? &#x27;BIDDING CLOSED&#x27; : &#x27;LIVE&#x27;}&lt;/span&gt;&lt;/div&gt;
        &lt;div style={{display:&#x27;flex&#x27;, flexDirection:&#x27;column&#x27;, maxHeight:200, overflowY:&#x27;auto&#x27;}}&gt;
          {NEWS_FEED.slice(0, newsCount).slice().reverse().map((n, i) =&gt; (
            &lt;div className=&quot;news-item&quot; key={i}&gt;
              &lt;span className=&quot;news-time&quot;&gt;{n.t}&lt;/span&gt;
              &lt;div&gt;&lt;span className={`news-tag ${n.tag}`}&gt;{n.tag.toUpperCase()}&lt;/span&gt;&lt;span className=&quot;news-text&quot;&gt;{n.text}&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          ))}
        &lt;/div&gt;
      &lt;/div&gt;

      {done &amp;&amp; (
        &lt;div className=&quot;concept&quot;&gt;
          &lt;span className=&quot;tag&quot;&gt;CONCEPT · OVERSUBSCRIPTION&lt;/span&gt;
          &lt;div className=&quot;text&quot;&gt;When retail demand exceeds supply, &lt;b&gt;shares are allotted by lottery&lt;/b&gt; in lots of 30. At {FINAL_SUB.ret}× retail subscription, roughly &lt;b&gt;1 in {Math.round(FINAL_SUB.ret)} retail applicants&lt;/b&gt; get one lot. The size of your bid doesn’t increase your odds beyond one lot — a 1-lot bidder and a 6-lot bidder have similar chances of getting a single lot.&lt;/div&gt;
        &lt;/div&gt;

      &lt;div className=&quot;footer-bar&quot;&gt;

  );

/* ============================================================
   STAGE 7 — ALLOTMENT LOTTERY
   ============================================================ */
function Allotment({ ctx }) {
  const { game } = ctx;
  const [phase, setPhase] = useState(&#x27;idle&#x27;); // idle | spin | result
  const [panDisplay, setPanDisplay] = useState(&#x27;A B C D E · 0000 X&#x27;);
  const [forcedOutcome, setForcedOutcome] = useState(null); // null | &#x27;won&#x27; | &#x27;lost&#x27;
  const intervalRef = useRef(null);

  // Decide outcome based on the player&#x27;s bid behaviour &amp; retail oversubscription
  const naturalOutcome = useMemo(() =&gt; {
    let pWin;
    if (game.useCutoff || game.bidPrice &gt;= PRICE_HIGH) pWin = 0.32;
    else if (game.bidPrice &gt;= 475) pWin = 0.18;
    else if (game.bidPrice &gt;= 468) pWin = 0.05;
    else pWin = 0.0;
    const won = Math.random() &lt; pWin;
    return { won, eligible: pWin &gt; 0 };
  }, [game.useCutoff, game.bidPrice]);

  const won = forcedOutcome === &#x27;won&#x27; ? true : forcedOutcome === &#x27;lost&#x27; ? false : naturalOutcome.won;
  const sharesAlloted = won ? LOT : 0;
  const cost = sharesAlloted * PRICE_HIGH;
  const refund = game.blocked - cost;
  const outcome = { won, sharesAlloted, cost, refund, eligible: naturalOutcome.eligible };

  const start = () =&gt; {
    setPhase(&#x27;spin&#x27;);
    const chars = &#x27;0123456789ABCDEFGHJKLMNPQRSTUVWXYZ&#x27;;
    let n = 0;
    intervalRef.current = setInterval(() =&gt; {
      const rand = Array.from({length: 10}, () =&gt; chars[Math.floor(Math.random()*chars.length)]).join(&#x27;&#x27;);
      setPanDisplay(`${rand.slice(0,5)} · ${rand.slice(5)}`);
      n++;
      if (n &gt; 28) {
        clearInterval(intervalRef.current);
        setPanDisplay(&#x27;A B C D E · 1 2 3 4 K&#x27;);
        setPhase(&#x27;result&#x27;);
        ctx.setGame(g =&gt; ({ ...g, allotment: outcome }));
        if (outcome.won) { ctx.addXp(150); ctx.grantBadge(&#x27;ALLOTTED&#x27;); }
        else ctx.addXp(40);
      }
    }, 80);
  };

  const flipOutcome = (target) =&gt; {
    setForcedOutcome(target);
    const newOutcome = {
      won: target === &#x27;won&#x27;,
      sharesAlloted: target === &#x27;won&#x27; ? LOT : 0,
      cost: target === &#x27;won&#x27; ? LOT * PRICE_HIGH : 0,
      refund: target === &#x27;won&#x27; ? game.blocked - LOT * PRICE_HIGH : game.blocked,
      eligible: naturalOutcome.eligible,
    };
    ctx.setGame(g =&gt; ({ ...g, allotment: newOutcome }));
    if (newOutcome.won) ctx.grantBadge(&#x27;ALLOTTED&#x27;);
  };

  useEffect(() =&gt; () =&gt; clearInterval(intervalRef.current), []);

  return (
    &lt;div className=&quot;stage&quot;&gt;
      &lt;div className=&quot;stage-head&quot;&gt;&lt;span className=&quot;stage-num&quot;&gt;STAGE 07 / 08&lt;/span&gt;&lt;/div&gt;

      &lt;p className=&quot;stage-sub&quot;&gt;For oversubscribed retail buckets, SEBI mandates a &lt;b&gt;random lottery&lt;/b&gt; in lots of 30. The registrar runs it on the basis-of-allotment date.&lt;/p&gt;

      &lt;div className=&quot;panel&quot;&gt;
        &lt;div className=&quot;panel-head&quot;&gt;&lt;span&gt;BASIS OF ALLOTMENT · LOTTERY DRAW&lt;/span&gt;&lt;span className=&quot;mono dim&quot;&gt;REGISTRAR · KFinTech&lt;/span&gt;&lt;/div&gt;
        &lt;div className=&quot;lottery&quot;&gt;
          &lt;div className=&quot;lottery-label&quot;&gt;YOUR PAN APPLICATION ID&lt;/div&gt;
          &lt;div className={`lottery-pan mono ${phase}`}&gt;{panDisplay}&lt;/div&gt;

          {phase === &#x27;idle&#x27; &amp;&amp; (
            &lt;div style={{marginTop:30}}&gt;
              {!outcome.eligible &amp;&amp; (
                &lt;p style={{color:&#x27;var(--dn)&#x27;,fontSize:13.5,marginBottom:18,maxWidth:520,margin:&#x27;0 auto 18px&#x27;}}&gt;⚠ You bid at &lt;b&gt;₹{ctx.game.bidPrice}&lt;/b&gt;, below the indicative cut-off. Your application is &lt;b&gt;outside the book&lt;/b&gt; — the lottery won’t even include you. Run it to see.&lt;/p&gt;
              )}
              &lt;button className=&quot;btn amber&quot; onClick={start}&gt;RUN THE LOTTERY  ⚂&lt;/button&gt;
            &lt;/div&gt;
          )}

          {phase === &#x27;result&#x27; &amp;&amp; (
            &lt;&gt;
              &lt;div className={`lottery-result ${outcome.won ? &#x27;won&#x27; : &#x27;lost&#x27;}`}&gt;
                {outcome.won ? &#x27;🎉 1 LOT ALLOTTED · 30 SHARES&#x27; : &#x27;NOT ALLOTTED · 0 SHARES&#x27;}
              &lt;/div&gt;
              &lt;div className=&quot;lottery-detail&quot;&gt;
                {outcome.won
                  ? &lt;&gt;Shares credited to your Demat · partial refund auto-unblocked.&lt;/&gt;
                  : !outcome.eligible
                    ? &lt;&gt;Bid below cut-off, application invalid · full amount auto-unblocked.&lt;/&gt;
                    : &lt;&gt;Lottery is random · full amount auto-unblocked.&lt;/&gt;
                }
              &lt;/div&gt;
            &lt;/&gt;
          )}
        &lt;/div&gt;
      &lt;/div&gt;

      {phase === &#x27;result&#x27; &amp;&amp; (
        &lt;&gt;
          &lt;AsbaTimeline blocked={game.blocked} cost={outcome.cost} refund={outcome.refund} bank={game.bankBalance} won={outcome.won} sharesAlloted={outcome.sharesAlloted}/&gt;

          &lt;div style={{
            marginTop:14, padding:&#x27;14px 16px&#x27;,
            background:&#x27;rgba(180,140,255,0.06)&#x27;,
            border:&#x27;1px solid rgba(180,140,255,0.30)&#x27;,
            borderRadius:6,
            display:&#x27;flex&#x27;, alignItems:&#x27;center&#x27;, gap:14, flexWrap:&#x27;wrap&#x27;,
          }}&gt;
            &lt;div&gt;
              &lt;div className=&quot;mono&quot; style={{fontSize:11, letterSpacing:1.5, fontWeight:800, color:&#x27;var(--violet)&#x27;}}&gt;EXPLORE BOTH OUTCOMES&lt;/div&gt;
              &lt;div style={{fontSize:13, color:&#x27;var(--ink-2)&#x27;, marginTop:3}}&gt;Allotment is random. Try the other path to see what would have happened.&lt;/div&gt;
            &lt;/div&gt;
            &lt;div style={{marginLeft:&#x27;auto&#x27;, display:&#x27;flex&#x27;, gap:8}}&gt;
              &lt;button

                style={!outcome.won ? {borderColor:&#x27;var(--dn)&#x27;, color:&#x27;var(--dn)&#x27;} : {}}
              &gt;SHOW: NO ALLOTMENT&lt;/button&gt;
              &lt;button
                className=&quot;btn ghost&quot;
                onClick={() =&gt; flipOutcome(&#x27;won&#x27;)}
                style={outcome.won ? {borderColor:&#x27;var(--up)&#x27;, color:&#x27;var(--up)&#x27;} : {}}
              &gt;SHOW: GOT ALLOTMENT&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/&gt;
      )}

      &lt;div className=&quot;concept&quot;&gt;
        &lt;span className=&quot;tag&quot;&gt;CONCEPT · ALLOTMENT&lt;/span&gt;
        &lt;div className=&quot;text&quot;&gt;Two allotment methods you’ll see: &lt;b&gt;Proportional&lt;/b&gt; (QIB/HNI — get a slice in proportion to your bid) and &lt;b&gt;Lottery&lt;/b&gt; (retail when oversubscribed — random draw of 1 lot per winning PAN). HNIs sometimes apply across family PANs to multiply their lottery chances; that’s why HNI subscription can look insane.&lt;/div&gt;
      &lt;/div&gt;

      &lt;div className=&quot;footer-bar&quot;&gt;
        &lt;button className=&quot;btn ghost&quot; onClick={ctx.back}&gt;← BACK&lt;/button&gt;
        &lt;button className=&quot;btn&quot; disabled={phase !== &#x27;result&#x27;} onClick={ctx.next}&gt;LISTING DAY  →&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

function AsbaTimeline({ blocked, cost, refund, bank, won, sharesAlloted }) {
  const fmt = (n) =&gt; &#x27;₹&#x27; + Math.abs(n).toLocaleString(&#x27;en-IN&#x27;);
  const finalBank = bank - cost;   // post-allotment bank balance

  const events = [
    { day: &#x27;D-1&#x27;, date: &#x27;Dec 04&#x27;,  tag: &#x27;BID&#x27;,     color: &#x27;var(--amber)&#x27;, title: &#x27;Bid placed via ASBA&#x27;,     body: &lt;&gt;Bank flags &lt;b className=&quot;mono&quot;&gt;{fmt(blocked)}&lt;/b&gt; as &lt;b&gt;blocked&lt;/b&gt;. Money still in your account — but unusable.&lt;/&gt; },
    { day: &#x27;D+0&#x27;, date: &#x27;Dec 06&#x27;,  tag: &#x27;CLOSE&#x27;,   color: &#x27;var(--ink-2)&#x27;, title: &#x27;Bidding window closes&#x27;,   body: &lt;&gt;Funds remain blocked. Interest continues to accrue (this is why ASBA replaced cheque-based bidding).&lt;/&gt; },
    { day: &#x27;D+5&#x27;, date: &#x27;Dec 11&#x27;,  tag: &#x27;LOTTERY&#x27;, color: &#x27;var(--violet)&#x27;,title: &#x27;Basis of Allotment&#x27;,      body: &lt;&gt;Registrar (KFinTech) runs the lottery. Your PAN: &lt;b className={won ? &#x27;up&#x27; : &#x27;dn&#x27;}&gt;{won ? &#x27;WINNER&#x27; : &#x27;NOT DRAWN&#x27;}&lt;/b&gt;.&lt;/&gt; },
    won
      ? { day: &#x27;D+6&#x27;, date: &#x27;Dec 12&#x27;,  tag: &#x27;DEBIT&#x27;,   color: &#x27;var(--dn)&#x27;,  title: &#x27;Allotment money debited&#x27;, body: &lt;&gt;Bank releases lien on full &lt;b className=&quot;mono&quot;&gt;{fmt(blocked)}&lt;/b&gt;, then debits &lt;b className=&quot;mono dn&quot;&gt;{fmt(cost)}&lt;/b&gt; for {sharesAlloted} shares × ₹{PRICE_HIGH}.&lt;/&gt; }
      : { day: &#x27;D+6&#x27;, date: &#x27;Dec 12&#x27;,  tag: &#x27;UNBLOCK&#x27;, color: &#x27;var(--up)&#x27;,  title: &#x27;Full amount unblocked&#x27;,   body: &lt;&gt;Bank releases the lien on the entire &lt;b className=&quot;mono&quot;&gt;{fmt(blocked)}&lt;/b&gt;. Money is yours again, with interest earned during the block period.&lt;/&gt; },
    won
      ? { day: &#x27;D+6&#x27;, date: &#x27;Dec 12&#x27;,  tag: &#x27;REFUND&#x27;,  color: &#x27;var(--up)&#x27;,  title: &#x27;Refund auto-credited&#x27;,    body: &lt;&gt;The un-utilised &lt;b className=&quot;mono up&quot;&gt;{fmt(refund)}&lt;/b&gt; is auto-unblocked back to spendable. Shares hit your Demat account.&lt;/&gt; }
      : null,
    { day: &#x27;D+7&#x27;, date: &#x27;Dec 13&#x27;,  tag: &#x27;LISTING&#x27;,color: &#x27;var(--amber)&#x27;, title: &#x27;Listing day&#x27;,              body: won ? &lt;&gt;Your {sharesAlloted} shares list on NSE/BSE — tomorrow you find out the listing price.&lt;/&gt; : &lt;&gt;You can still buy on the open market tomorrow — but at whatever price the listing settles on, not the issue price.&lt;/&gt; },
  ].filter(Boolean);

  return (
    &lt;div className=&quot;panel&quot; style={{marginTop:18}}&gt;
      &lt;div className=&quot;panel-head&quot;&gt;
        &lt;span&gt;ASBA · FULL CYCLE&lt;/span&gt;
        &lt;span className=&quot;mono dim&quot;&gt;{won ? `${sharesAlloted} SH ALLOTTED · ${fmt(refund)} REFUNDED` : `BLOCKED FOR 7 DAYS · ${fmt(blocked)} UNBLOCKED`}&lt;/span&gt;
      &lt;/div&gt;

      &lt;div style={{padding:&#x27;18px 20px&#x27;, display:&#x27;grid&#x27;, gridTemplateColumns:&#x27;1fr 320px&#x27;, gap:24}}&gt;
        {/* Timeline */}
        &lt;div style={{position:&#x27;relative&#x27;}}&gt;
          &lt;div style={{position:&#x27;absolute&#x27;, left:10, top:8, bottom:8, width:2, background:&#x27;var(--line-2)&#x27;}}&gt;&lt;/div&gt;
          &lt;div style={{display:&#x27;flex&#x27;, flexDirection:&#x27;column&#x27;, gap:16}}&gt;
            {events.map((e, i) =&gt; (
              &lt;div key={i} style={{display:&#x27;flex&#x27;, gap:14, position:&#x27;relative&#x27;}}&gt;
                &lt;div style={{
                  width:22, height:22, borderRadius:&#x27;50%&#x27;,
                  background:&#x27;var(--panel)&#x27;, border:`2px solid ${e.color}`,
                  flexShrink:0, marginTop:2, position:&#x27;relative&#x27;,
                  boxShadow: `0 0 0 3px var(--panel), 0 0 12px ${e.color}80`,
                  zIndex:1,
                }}&gt;
                  &lt;div style={{position:&#x27;absolute&#x27;, inset:3, borderRadius:&#x27;50%&#x27;, background:e.color}}&gt;&lt;/div&gt;
                &lt;/div&gt;
                &lt;div style={{flex:1, paddingTop:1}}&gt;
                  &lt;div style={{display:&#x27;flex&#x27;, gap:10, alignItems:&#x27;baseline&#x27;, flexWrap:&#x27;wrap&#x27;}}&gt;
                    &lt;span className=&quot;mono&quot; style={{fontSize:10.5, fontWeight:800, letterSpacing:1.5, color:e.color, padding:&#x27;2px 7px&#x27;, background:`${e.color}1f`, borderRadius:3}}&gt;{e.tag}&lt;/span&gt;
                    &lt;span className=&quot;mono dim&quot; style={{fontSize:11, letterSpacing:1.2, fontWeight:700}}&gt;{e.day} · {e.date}&lt;/span&gt;
                    &lt;span style={{fontSize:13.5, fontWeight:700, color:&#x27;var(--ink)&#x27;}}&gt;{e.title}&lt;/span&gt;
                  &lt;/div&gt;
                  &lt;div style={{fontSize:12.5, color:&#x27;var(--ink-2)&#x27;, lineHeight:1.5, marginTop:4}}&gt;{e.body}&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            ))}
          &lt;/div&gt;
        &lt;/div&gt;

        {/* Bank card after */}
        &lt;div className=&quot;asba-card&quot; style={{padding:18}}&gt;
          &lt;div className=&quot;asba-head&quot; style={{marginBottom:14}}&gt;
            &lt;div className=&quot;asba-bank&quot; style={{fontSize:11}}&gt;YOUR BANK · POST-ALLOTMENT&lt;div className=&quot;sub&quot; style={{fontSize:9.5}}&gt;{won ? &#x27;DEC 12 · SETTLED&#x27; : &#x27;DEC 12 · FULL UNBLOCK&#x27;}&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div className=&quot;asba-bal-l&quot;&gt;SPENDABLE BALANCE&lt;/div&gt;
          &lt;div className=&quot;asba-bal mono&quot; style={{fontSize:28, color: won ? &#x27;var(--up)&#x27; : &#x27;var(--ink)&#x27;}}&gt;{fmt(won ? finalBank : bank)}&lt;/div&gt;

          &lt;div className=&quot;asba-meter&quot;&gt;
            &lt;div className=&quot;available&quot; style={{width: won ? `${(finalBank/bank)*100}%` : &#x27;100%&#x27;}}&gt;&lt;/div&gt;
            {won &amp;&amp; &lt;div style={{width:`${(cost/bank)*100}%`, background:&#x27;rgba(255,51,102,0.35)&#x27;}}&gt;&lt;/div&gt;}
          &lt;/div&gt;
          &lt;div className=&quot;asba-meter-key&quot;&gt;
            &lt;span&gt;&lt;span className=&quot;swatch&quot; style={{background:&#x27;rgba(0,255,149,0.4)&#x27;}}&gt;&lt;/span&gt; AVAILABLE&lt;/span&gt;
            {won &amp;&amp; &lt;span&gt;&lt;span className=&quot;swatch&quot; style={{background:&#x27;rgba(255,51,102,0.35)&#x27;}}&gt;&lt;/span&gt; DEBITED {fmt(cost)}&lt;/span&gt;}
          &lt;/div&gt;

          &lt;div style={{marginTop:16, paddingTop:14, borderTop:&#x27;1px solid rgba(120,160,200,0.18)&#x27;, display:&#x27;grid&#x27;, gap:8}}&gt;
            &lt;div style={{display:&#x27;flex&#x27;, justifyContent:&#x27;space-between&#x27;, fontSize:12}}&gt;
              &lt;span style={{color:&#x27;var(--ink-3)&#x27;, letterSpacing:1, fontFamily:&quot;&#x27;JetBrains Mono&#x27;, monospace&quot;}}&gt;BLOCKED FOR&lt;/span&gt;
              &lt;span className=&quot;mono&quot; style={{color:&#x27;var(--ink)&#x27;, fontWeight:700}}&gt;7 days&lt;/span&gt;
            &lt;/div&gt;
            &lt;div style={{display:&#x27;flex&#x27;, justifyContent:&#x27;space-between&#x27;, fontSize:12}}&gt;
              &lt;span style={{color:&#x27;var(--ink-3)&#x27;, letterSpacing:1, fontFamily:&quot;&#x27;JetBrains Mono&#x27;, monospace&quot;}}&gt;INTEREST EARNED&lt;/span&gt;
              &lt;span className=&quot;mono up&quot; style={{fontWeight:700}}&gt;+ ₹{Math.round(blocked * 0.035 * 7 / 365).toLocaleString(&#x27;en-IN&#x27;)}&lt;/span&gt;
            &lt;/div&gt;
            {won &amp;&amp; (
              &lt;div style={{display:&#x27;flex&#x27;, justifyContent:&#x27;space-between&#x27;, fontSize:12}}&gt;
                &lt;span style={{color:&#x27;var(--ink-3)&#x27;, letterSpacing:1, fontFamily:&quot;&#x27;JetBrains Mono&#x27;, monospace&quot;}}&gt;SHARES IN DEMAT&lt;/span&gt;
                &lt;span className=&quot;mono up&quot; style={{fontWeight:700}}&gt;{sharesAlloted} × NEXAFIN&lt;/span&gt;
              &lt;/div&gt;
            )}
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

            Every mainboard IPO publishes a notice like this 1–2 days before bidding opens, in 2–3 financial newspapers. Read this &lt;b&gt;before&lt;/b&gt; you decide your price band — it has every fact you need.
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}
/* ============================================================
   STAGE 8 — LISTING DAY (animated price)
   ============================================================ */
function ListingDay({ ctx }) {
  const { game } = ctx;
  const allotted = game.allotment?.sharesAlloted || 0;
  const issuePrice = PRICE_HIGH;

  // Generate a listing-day path: open at premium, then volatile
  const seed = useMemo(() =&gt; {
    const openPct = 0.51 + (Math.random() - 0.5) * 0.08;   // ~+47% to +55% open (Zomato listed +51%)
    const openPx = issuePrice * (1 + openPct);
    const pts = [{ t: 0, p: openPx }];
    let px = openPx;
    for (let i = 1; i &lt; 60; i++) {
      px = px + (Math.random() - 0.48) * px * 0.018;
      // mild mean reversion to a final ~ +12-26%
      const target = issuePrice * (1 + 0.66);   // Day-1 close was ~₹126 vs ₹76 issue
      px += (target - px) * 0.012;
      pts.push({ t: i, p: px });
    }
    return pts;
  }, []);

  const [step, setStep] = useState(0);
  useEffect(() =&gt; {
    const id = setInterval(() =&gt; {
      setStep(s =&gt; {
        if (s &gt;= seed.length - 1) { clearInterval(id); return s; }
        return s + 1;
      });
    }, 50);
    return () =&gt; clearInterval(id);
  }, [seed.length]);

  const currentPx = seed[step].p;
  const chgPct = ((currentPx - issuePrice) / issuePrice) * 100;
  const isUp = currentPx &gt;= issuePrice;
  const pnl = allotted * (currentPx - issuePrice);

  const done = step &gt;= seed.length - 1;
  useEffect(() =&gt; {
    if (done) {
      ctx.setGame(g =&gt; ({ ...g, listingPrice: currentPx, listingPath: seed }));
      if (allotted &gt; 0 &amp;&amp; pnl &gt; 0) ctx.grantBadge(&#x27;LISTING POP&#x27;);
      if (allotted &gt; 0 &amp;&amp; pnl &gt; 10000) { ctx.addXp(200); ctx.grantBadge(&#x27;FIVE FIGURE FLEX&#x27;); }
    }
  }, [done]);

  return (
    &lt;div className=&quot;stage&quot;&gt;
      &lt;div className=&quot;stage-head&quot;&gt;&lt;span className=&quot;stage-num&quot;&gt;STAGE 08 / 08&lt;/span&gt;&lt;/div&gt;
      &lt;div className=&quot;stage-title&quot;&gt;Opening bell. The market votes.&lt;/div&gt;
      &lt;p className=&quot;stage-sub&quot;&gt;The IPO price was discovered by the book. The listing price is discovered by everyone else — including those who didn’t get allotment and now want in.&lt;/p&gt;

      &lt;div className=&quot;listing&quot;&gt;
        &lt;div className=&quot;listing-head&quot;&gt;
          &lt;span className=&quot;flag&quot;&gt;● LIVE · NSE · NEXAFIN&lt;/span&gt;
          &lt;span className=&quot;mono&quot; style={{fontSize:11,color:&#x27;var(--ink-3)&#x27;,letterSpacing:1.5}}&gt;LISTING SESSION · {done ? &#x27;CLOSE 15:30&#x27; : `T+${Math.floor(step/10)}m`}&lt;/span&gt;
        &lt;/div&gt;
        &lt;div className=&quot;listing-body&quot;&gt;
          &lt;div&gt;
            &lt;div className=&quot;listing-px-l&quot;&gt;LIVE PRICE · NSE&lt;/div&gt;
            &lt;div className={`listing-px mono ${isUp ? &#x27;up&#x27; : &#x27;dn&#x27;}`}&gt;₹{currentPx.toFixed(2)}&lt;/div&gt;
            &lt;div className={`listing-chg mono ${isUp ? &#x27;up&#x27; : &#x27;dn&#x27;}`}&gt;{isUp ? &#x27;▲&#x27; : &#x27;▼&#x27;} {Math.abs(chgPct).toFixed(2)}% vs issue&lt;/div&gt;
            &lt;div className=&quot;listing-vs&quot;&gt;
              &lt;div&gt;&lt;div className=&quot;l&quot;&gt;ISSUE PRICE&lt;/div&gt;&lt;div className=&quot;v&quot;&gt;₹{issuePrice}&lt;/div&gt;&lt;/div&gt;
              &lt;div&gt;&lt;div className=&quot;l&quot;&gt;OPEN&lt;/div&gt;&lt;div className=&quot;v&quot;&gt;₹{seed[0].p.toFixed(2)}&lt;/div&gt;&lt;/div&gt;
              &lt;div&gt;&lt;div className=&quot;l&quot;&gt;DAY HIGH&lt;/div&gt;&lt;div className=&quot;v&quot;&gt;₹{Math.max(...seed.slice(0, step+1).map(x=&gt;x.p)).toFixed(2)}&lt;/div&gt;&lt;/div&gt;
              &lt;div&gt;&lt;div className=&quot;l&quot;&gt;DAY LOW&lt;/div&gt;&lt;div className=&quot;v&quot;&gt;₹{Math.min(...seed.slice(0, step+1).map(x=&gt;x.p)).toFixed(2)}&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;div className=&quot;price-graph&quot;&gt;
              &lt;PriceLine path={seed.slice(0, step+1)} issuePrice={issuePrice} fullLen={seed.length}/&gt;
            &lt;/div&gt;
            &lt;div style={{
              marginTop:14, padding:14, borderRadius:6,
              border: `1px solid ${allotted &gt; 0 ? (pnl &gt; 0 ? &#x27;rgba(0,255,149,0.4)&#x27; : &#x27;rgba(255,51,102,0.4)&#x27;) : &#x27;var(--line-2)&#x27;}`,
              background: allotted &gt; 0 ? (pnl &gt; 0 ? &#x27;rgba(0,255,149,0.06)&#x27; : &#x27;rgba(255,51,102,0.06)&#x27;) : &#x27;var(--panel-2)&#x27;
            }}&gt;
              &lt;div className=&quot;mono dim&quot; style={{fontSize:11, letterSpacing:1.5, fontWeight:700}}&gt;YOUR P&amp;amp;L · LISTING SESSION&lt;/div&gt;
              {allotted &gt; 0 ? (
                &lt;&gt;
                  &lt;div className=&quot;mono&quot; style={{fontSize:30, fontWeight:900, marginTop:4, color: pnl &gt; 0 ? &#x27;var(--up)&#x27; : &#x27;var(--dn)&#x27;}}&gt;
                    {pnl &gt;= 0 ? &#x27;+&#x27; : &#x27;−&#x27;}₹{Math.abs(pnl).toFixed(0).toLocaleString(&#x27;en-IN&#x27;)}
                  &lt;/div&gt;
                  &lt;div className=&quot;mono dim&quot; style={{fontSize:11.5, marginTop:6,letterSpacing:1}}&gt;
                    {allotted} SH × (₹{currentPx.toFixed(2)} − ₹{issuePrice}) · {pnl &gt; 0 ? &#x27;BOOK OR HOLD?&#x27; : &#x27;CUT OR HOPE?&#x27;}
                  &lt;/div&gt;
                &lt;/&gt;
              ) : (
                &lt;div style={{marginTop:6,color:&#x27;var(--ink-2)&#x27;,fontSize:13.5,lineHeight:1.5}}&gt;
                  No allotment → no listing P&amp;amp;L. The stock is trading at &lt;b className={isUp ? &#x27;up&#x27; : &#x27;dn&#x27;}&gt;{isUp ? &#x27;+&#x27; : &#x27;−&#x27;}{Math.abs(chgPct).toFixed(1)}%&lt;/b&gt; — buying now means paying the listing premium yourself.
                &lt;/div&gt;
              )}
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      {done &amp;&amp; &lt;Confetti up={isUp &amp;&amp; allotted &gt; 0}/&gt;}

      &lt;div className=&quot;concept&quot;&gt;
        &lt;span className=&quot;tag&quot;&gt;CONCEPT · LISTING DAY&lt;/span&gt;
        &lt;div className=&quot;text&quot;&gt;Listing gains aren’t guaranteed. ~40% of recent Indian IPOs listed at a &lt;b&gt;discount&lt;/b&gt;. The 3 forces moving the price: &lt;b&gt;anchor lock-up&lt;/b&gt; (large holders can’t sell for 30/90 days), &lt;b&gt;grey market sentiment&lt;/b&gt; (informal pre-listing trading), and &lt;b&gt;flippers&lt;/b&gt; (allottees selling immediately). When all three align, you get a pop. When they don’t — buyer beware.&lt;/div&gt;
      &lt;/div&gt;

      &lt;div className=&quot;footer-bar&quot;&gt;
        &lt;button className=&quot;btn ghost&quot; onClick={ctx.back}&gt;← BACK&lt;/button&gt;
        &lt;button className=&quot;btn&quot; disabled={!done} onClick={ctx.next}&gt;SEE FINAL SCORE  →&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

function PriceLine({ path, issuePrice, fullLen }) {
  const W = 400, H = 180, PAD = 8;
  const allPrices = path.map(p =&gt; p.p).concat([issuePrice]);
  const min = Math.min(...allPrices) * 0.99;
  const max = Math.max(...allPrices) * 1.01;
  const xOf = (i) =&gt; PAD + (i / (fullLen - 1)) * (W - PAD*2);
  const yOf = (p) =&gt; H - PAD - ((p - min) / (max - min)) * (H - PAD*2);
  const d = path.map((pt, i) =&gt; `${i===0?&#x27;M&#x27;:&#x27;L&#x27;} ${xOf(i).toFixed(1)} ${yOf(pt.p).toFixed(1)}`).join(&#x27; &#x27;);
  const issueY = yOf(issuePrice);
  const last = path[path.length-1];
  const lastY = yOf(last.p);
  const lastX = xOf(path.length-1);
  const isUp = last.p &gt;= issuePrice;
  const stroke = isUp ? &#x27;#00ff95&#x27; : &#x27;#ff3366&#x27;;

  return (
    &lt;svg viewBox={`0 0 ${W} ${H}`} style={{width:&#x27;100%&#x27;,height:&#x27;auto&#x27;,display:&#x27;block&#x27;}}&gt;
      &lt;defs&gt;
        &lt;linearGradient id=&quot;px-fill&quot; x1=&quot;0&quot; x2=&quot;0&quot; y1=&quot;0&quot; y2=&quot;1&quot;&gt;
          &lt;stop offset=&quot;0%&quot; stopColor={stroke} stopOpacity=&quot;0.35&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stopColor={stroke} stopOpacity=&quot;0&quot;/&gt;
        &lt;/linearGradient&gt;
      &lt;/defs&gt;
      {/* issue baseline */}
      &lt;line x1={PAD} x2={W-PAD} y1={issueY} y2={issueY} stroke=&quot;#5e7593&quot; strokeWidth=&quot;0.8&quot; strokeDasharray=&quot;3 3&quot;/&gt;
      &lt;text x={W-PAD} y={issueY - 4} fill=&quot;#5e7593&quot; fontSize=&quot;9&quot; fontFamily=&quot;JetBrains Mono&quot; textAnchor=&quot;end&quot; letterSpacing=&quot;1&quot;&gt;ISSUE ₹{issuePrice}&lt;/text&gt;
      {/* area */}
      &lt;path d={`${d} L ${lastX} ${H-PAD} L ${PAD} ${H-PAD} Z`} fill=&quot;url(#px-fill)&quot;/&gt;
      {/* line */}
      &lt;path d={d} stroke={stroke} strokeWidth=&quot;2&quot; fill=&quot;none&quot; strokeLinecap=&quot;round&quot; strokeLinejoin=&quot;round&quot;/&gt;
      {/* head dot */}
      &lt;circle cx={lastX} cy={lastY} r=&quot;4&quot; fill={stroke}/&gt;
      &lt;circle cx={lastX} cy={lastY} r=&quot;9&quot; fill={stroke} opacity=&quot;0.2&quot;&gt;
        &lt;animate attributeName=&quot;r&quot; from=&quot;4&quot; to=&quot;14&quot; dur=&quot;1.4s&quot; repeatCount=&quot;indefinite&quot;/&gt;
        &lt;animate attributeName=&quot;opacity&quot; from=&quot;0.4&quot; to=&quot;0&quot; dur=&quot;1.4s&quot; repeatCount=&quot;indefinite&quot;/&gt;
      &lt;/circle&gt;
    &lt;/svg&gt;
  );
}

function Confetti({ up }) {
  if (!up) return null;
  const pieces = useMemo(() =&gt; Array.from({length: 60}, (_, i) =&gt; ({
    left: Math.random() * 100,
    delay: Math.random() * 0.8,
    dur: 2.5 + Math.random() * 2,
    color: [&#x27;#00ff95&#x27;,&#x27;#ffb648&#x27;,&#x27;#b48cff&#x27;,&#x27;#d9e6f2&#x27;][i%4],
    rot: Math.random() * 360,
  })), []);
  return (
    &lt;div className=&quot;confetti-layer&quot;&gt;
      {pieces.map((p, i) =&gt; (
        &lt;div key={i} className=&quot;confetti&quot; style={{
          left: `${p.left}%`,
          background: p.color,
          animationDelay: `${p.delay}s`,
          animationDuration: `${p.dur}s`,
          transform: `rotate(${p.rot}deg)`,
        }}/&gt;
      ))}
    &lt;/div&gt;
  );
}

/* ============================================================
   STAGE 9 — FINAL SCORE
   ============================================================ */
const ALL_BADGES = [
  { key: &#x27;DD HOUND&#x27;,         name: &#x27;DD Hound&#x27;,         desc: &#x27;Spotted every red flag in the DRHP with no false alarms.&#x27; },
  { key: &#x27;CUT-OFF NATIVE&#x27;,   name: &#x27;Cut-off Native&#x27;,   desc: &#x27;Bid at cut-off — the retail-friendly default.&#x27; },
  { key: &#x27;ALLOTTED&#x27;,         name: &#x27;Allotted&#x27;,         desc: &#x27;Got at least 1 lot in an oversubscribed issue.&#x27; },
  { key: &#x27;LISTING POP&#x27;,      name: &#x27;Listing Pop&#x27;,      desc: &#x27;Closed the listing session in green.&#x27; },
  { key: &#x27;FIVE FIGURE FLEX&#x27;, name: &#x27;Five-Figure Flex&#x27;, desc: &#x27;Made ₹10,000+ on listing day.&#x27; },
];
const ALL_RECAP = [
  { tag: &#x27;LEARN&#x27;, text: &#x27;An &lt;b&gt;IPO&lt;/b&gt; raises capital by selling shares to the public for the first time.&#x27; },
  { tag: &#x27;LEARN&#x27;, text: &#x27;The &lt;b&gt;DRHP&lt;/b&gt; is the company’s sworn disclosure. Red flags hide in plain sight.&#x27; },
  { tag: &#x27;LEARN&#x27;, text: &#x27;&lt;b&gt;Book building&lt;/b&gt; uses a price band; demand sets the final cut-off.&#x27; },
  { tag: &#x27;LEARN&#x27;, text: &#x27;Allocation buckets: &lt;b&gt;QIB 50% · HNI 15% · Retail 35%&lt;/b&gt;.&#x27; },
  { tag: &#x27;LEARN&#x27;, text: &#x27;&lt;b&gt;ASBA&lt;/b&gt; blocks (not deducts) your bid amount; un-allotted portion auto-unblocks.&#x27; },
  { tag: &#x27;LEARN&#x27;, text: &#x27;Oversubscribed retail → &lt;b&gt;random lottery&lt;/b&gt;. Big bids don’t buy better odds.&#x27; },
  { tag: &#x27;LEARN&#x27;, text: &#x27;Listing gains aren’t guaranteed. ~40% of recent Indian IPOs listed at a discount.&#x27; },
];

function FinalScore({ ctx }) {
  const { game, xp } = ctx;
  const personaTier =
    xp &gt;= 600 ? { tag: &#x27;IPO GURU&#x27;,     desc: &#x27;Caught red flags, bid smart, brave on the bell.&#x27; } :
    xp &gt;= 400 ? { tag: &#x27;PRUDENT BIDDER&#x27;, desc: &#x27;Solid instincts. A few details to tighten.&#x27; } :
    xp &gt;= 200 ? { tag: &#x27;CURIOUS NOVICE&#x27;, desc: &#x27;Learned the loop. Next round you’ll out-score this.&#x27; } :
                { tag: &#x27;GREATER FOOL&#x27;,   desc: &#x27;Hype-pilled, under-prepared. Replay and recover.&#x27; };

  const finalPx = game.listingPrice ?? PRICE_HIGH;
  const allotted = game.allotment?.sharesAlloted || 0;
  const pnl = allotted * (finalPx - PRICE_HIGH);

  return (
    &lt;div className=&quot;stage&quot;&gt;
      &lt;div className=&quot;stage-head&quot;&gt;&lt;span className=&quot;stage-num&quot;&gt;FINAL REPORT&lt;/span&gt;&lt;/div&gt;
      &lt;div className=&quot;stage-title&quot;&gt;Your IPO journey · debrief.&lt;/div&gt;
      &lt;p className=&quot;stage-sub&quot;&gt;One IPO closed. Here’s what you learned, what you earned, and how to play smarter next round.&lt;/p&gt;

      &lt;div className=&quot;score-grid&quot;&gt;
        &lt;div className=&quot;score-hero&quot;&gt;
          &lt;span className=&quot;score-tag&quot;&gt;YOUR INVESTOR PERSONA&lt;/span&gt;
          &lt;div className=&quot;score-name&quot;&gt;{personaTier.tag}&lt;/div&gt;
          &lt;div className=&quot;score-sub&quot;&gt;{personaTier.desc}&lt;/div&gt;
          &lt;div className=&quot;score-xp&quot;&gt;
            &lt;span className=&quot;n&quot;&gt;{xp.toLocaleString(&#x27;en-IN&#x27;)}&lt;/span&gt;
            &lt;span className=&quot;l&quot;&gt;XP EARNED&lt;/span&gt;
          &lt;/div&gt;

          &lt;div className=&quot;stat-row&quot; style={{marginTop:18}}&gt;
            &lt;div className=&quot;stat-cell&quot;&gt;&lt;span className=&quot;l&quot;&gt;DRHP RED FLAGS CAUGHT&lt;/span&gt;&lt;span className=&quot;v up&quot;&gt;{game.correctFlags.length} / 4&lt;/span&gt;&lt;/div&gt;
            &lt;div className=&quot;stat-cell&quot;&gt;&lt;span className=&quot;l&quot;&gt;BID STRATEGY&lt;/span&gt;&lt;span className=&quot;v amber&quot;&gt;{game.useCutoff ? &#x27;CUT-OFF&#x27; : `₹${game.bidPrice}`}&lt;/span&gt;&lt;/div&gt;
            &lt;div className=&quot;stat-cell&quot;&gt;&lt;span className=&quot;l&quot;&gt;ALLOTMENT&lt;/span&gt;&lt;span className=&quot;v&quot; style={{color: allotted ? &#x27;var(--up)&#x27; : &#x27;var(--dn)&#x27;}}&gt;{allotted ? `${allotted} SH` : &#x27;NONE&#x27;}&lt;/span&gt;&lt;/div&gt;
            &lt;div className=&quot;stat-cell&quot;&gt;&lt;span className=&quot;l&quot;&gt;LISTING P&amp;amp;L&lt;/span&gt;&lt;span className=&quot;v&quot; style={{color: pnl &gt; 0 ? &#x27;var(--up)&#x27; : pnl &lt; 0 ? &#x27;var(--dn)&#x27; : &#x27;var(--ink-3)&#x27;}}&gt;
              {pnl &gt; 0 ? &#x27;+&#x27; : pnl &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;}₹{Math.abs(pnl).toFixed(0).toLocaleString(&#x27;en-IN&#x27;)}
            &lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div style={{marginTop:18}}&gt;
            &lt;div className=&quot;mono dim&quot; style={{fontSize:11,letterSpacing:1.5,fontWeight:700,marginBottom:8}}&gt;BADGES&lt;/div&gt;

              {ALL_BADGES.map(b =&gt; (
                &lt;div key={b.key} className={`badge ${game.badges.has(b.key) ? &#x27;earned&#x27; : &#x27;&#x27;}`}&gt;

        &lt;/div&gt;

        &lt;div className=&quot;panel&quot;&gt;
          &lt;div className=&quot;panel-head&quot;&gt;&lt;span&gt;CONCEPT RECAP&lt;/span&gt;&lt;span className=&quot;mono dim&quot;&gt;SAVE THIS&lt;/span&gt;&lt;/div&gt;
          &lt;div className=&quot;recap-list&quot;&gt;
            {ALL_RECAP.map((r, i) =&gt; (
              &lt;div className=&quot;recap-row&quot; key={i}&gt;
                &lt;span className={`recap-tag ${r.tag.toLowerCase()}`}&gt;{r.tag}&lt;/span&gt;
                &lt;span className=&quot;recap-text&quot; dangerouslySetInnerHTML={{__html: r.text}}&gt;&lt;/span&gt;
              &lt;/div&gt;

            {game.wrongFlags.length &gt; 0 &amp;&amp; (
              &lt;div className=&quot;recap-row&quot;&gt;
                &lt;span className=&quot;recap-tag miss&quot;&gt;REVIEW&lt;/span&gt;
                &lt;span className=&quot;recap-text&quot;&gt;You flagged {game.wrongFlags.length} benign item{game.wrongFlags.length&gt;1?&#x27;s&#x27;:&#x27;&#x27;} as suspicious. Re-read those sections of the DRHP — disclosure ≠ red flag.&lt;/span&gt;
              &lt;/div&gt;
            )}
