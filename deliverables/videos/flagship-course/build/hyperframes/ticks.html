<!doctype html>
<!-- Walk-away, v20 (user: "this could be a better text, better graphic", and the old top-left list covered Hiral's face
     on the third shot). Now the house falling-sticker stack, built from the BOTTOM up so it stays clear of every face in
     the three class shots, each line landing as its phrase starts and its gold tick popping on her word.
     Transparent, laid over WALK2 (293 frames) by walk_real.py. WALK-local word times: "framework" 1.04, "goals" 2.70,
     "a simple" 3.94, "investments" 5.68, "strategies" 6.80, "journey" 8.66. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lora"; src: url("assets/fonts/Lora.ttf"); font-weight: 400 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .st { position: absolute; display: flex; align-items: center; gap: 22px; padding: 16px 32px; border-radius: 14px;
            font-family: "Lora"; font-weight: 700; font-size: 66px; line-height: 1.1; white-space: nowrap;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32); opacity: 0; }
      .cream { background: #f4f1e6; color: #294354; }
      .gold { background: #fcc536; color: #294354; }
      .slate { background: #294354; color: #f4f1e6; }
      #k { left: 40px; top: 1180px; font-size: 58px; background: rgba(16, 22, 30, 0.88); color: #fcc536; }
      #r0 { left: 40px; top: 1300px; } #r1 { left: 70px; top: 1424px; } #r2 { left: 40px; top: 1548px; }
      .tk { position: relative; width: 64px; height: 64px; border-radius: 50%; flex: none; transform: scale(0); }
      .cream .tk, .slate .tk { background: #fcc536; } .gold .tk { background: #294354; }
      .tk::after { content: ""; position: absolute; left: 21px; top: 10px; width: 16px; height: 32px; transform: rotate(45deg);
                   border-right: 8px solid #294354; border-bottom: 8px solid #294354; }
      .gold .tk::after { border-color: #fcc536; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ticks" data-start="0" data-duration="9.767" data-width="1080" data-height="1920">
      <div id="tk" class="clip" data-start="0" data-duration="9.767" data-track-index="0">
        <div class="st" id="k">You walk away with:</div>
        <div class="st cream" id="r0"><span class="tk" id="t0"></span>Goals that mean something</div>
        <div class="st gold" id="r1"><span class="tk" id="t1"></span>Your investments, sorted</div>
        <div class="st slate" id="r2"><span class="tk" id="t2"></span>A plan for the whole journey</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const drop = (sel, at, rot) => tl.fromTo(sel, { opacity: 0, y: -260, rotation: rot * 3 }, { opacity: 1, y: 0, rotation: rot, duration: 0.32, ease: "back.out(1.6)" }, at);
      drop("#k", 0.2, -1.0);
      [[0.95, 2.70, -1.5], [3.94, 5.68, 1.5], [6.80, 8.66, -1.0]].forEach(([inn, tick, rot], i) => {
        drop("#r" + i, inn, rot);
        tl.to("#t" + i, { scale: 1, duration: 0.3, ease: "back.out(2.6)" }, tick);
      });
      tl.to({}, { duration: 0.01 }, 9.75);
      window.__timelines["ticks"] = tl;
    </script>
  </body>
</html>
