<!doctype html>
<!-- v14: the closing proof, in place of the profile wall's single counter (user: "200+ women taught", "400+ hours of
     teaching", "40+ games"). A dark card under her chin; each stat counts up in turn, then Follow flips to Following.
     Transparent, laid over H5_f from 7.4s (the wall's start) by hf_overlays.py. 4.167s. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "IFM Nunito"; src: url("assets/fonts/fixed-Nunito-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #card { position: absolute; left: 90px; top: 1370px; width: 900px; padding: 34px 44px 30px; border-radius: 44px;
              background: rgba(14, 18, 24, 0.80); border: 2px solid rgba(255, 255, 255, 0.16); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); opacity: 0; }
      .stat { display: flex; align-items: baseline; gap: 22px; height: 92px; opacity: 0; }
      .num { font-family: "IFM Nunito"; font-weight: 700; font-size: 82px; color: #fcc536; min-width: 230px; text-align: right; }
      .lab { font-family: "IFM Nunito"; font-weight: 700; font-size: 50px; color: #fff; }
      #foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 22px; border-top: 2px solid rgba(255, 255, 255, 0.14); }
      #handle { font-family: "IFM Nunito"; font-weight: 700; font-size: 38px; color: rgba(244, 241, 230, 0.85); }
      #btn { position: relative; width: 250px; height: 70px; border-radius: 35px; background: #fff; }
      #btn span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "IFM Nunito"; font-weight: 700; font-size: 34px; }
      #follow { color: #10141a; }
      #following { color: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stats" data-start="0" data-duration="4.167" data-width="1080" data-height="1920">
      <div id="st" class="clip" data-start="0" data-duration="4.167" data-track-index="0">
        <div id="card">
          <div class="stat" id="s0"><span class="num" id="n0">0</span><span class="lab">women taught</span></div>
          <div class="stat" id="s1"><span class="num" id="n1">0</span><span class="lab">hours of teaching</span></div>
          <div class="stat" id="s2"><span class="num" id="n2">0</span><span class="lab">games</span></div>
          <div id="foot"><span id="handle">@investingformummies</span><div id="btn"><span id="follow">Follow</span><span id="following">Following</span></div></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      [[200, 0.25], [400, 0.95], [40, 1.65]].forEach(([to, at], i) => {
        const o = { v: 0 }, el = document.getElementById("n" + i);
        tl.fromTo("#s" + i, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, at);
        tl.to(o, { v: to, duration: 0.6, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(o.v) + (o.v >= to ? "+" : ""); } }, at);
      });
      tl.to("#btn", { backgroundColor: "#3c3f46", duration: 0.12 }, 3.0);
      tl.to("#follow", { opacity: 0, duration: 0.1 }, 3.0);
      tl.to("#following", { opacity: 1, duration: 0.12 }, 3.02);
      tl.fromTo("#btn", { scale: 1 }, { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 2.96);
      tl.to({}, { duration: 0.01 }, 4.15);
      window.__timelines["stats"] = tl;
    </script>
  </body>
</html>
