<!doctype html>
<!-- Her next line after "ask again" (v9 bridge): "Because confidence doesn't come from knowing everything. It comes from
     knowing that you can learn." Mechanic of the registry's kinetic-type-swap: a held sentence with one masked slot
     that rolls to its final word — here "everything" rolls away and "that you can learn" rolls in, on her words.
     Transparent, laid over the Qc shot (211 frames) by hf_overlays.py. Times are Qc-local: "confidence" 2.70,
     "everything" 4.30, "that you can learn" 6.36–6.94. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lora"; src: url("assets/fonts/Lora.ttf"); font-weight: 400 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #scrim { position: absolute; left: 0; right: 0; top: 0; height: 760px; background: linear-gradient(180deg, rgba(8, 16, 24, 0.62), rgba(8, 16, 24, 0)); opacity: 0; }
      #stage { position: absolute; left: 0; right: 0; top: 120px; text-align: center; opacity: 0; }
      #held { font-family: "Lora"; font-weight: 700; font-size: 70px; line-height: 1.1; color: #f4f1e6; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45); }
      #slot { position: relative; display: inline-block; height: 128px; width: 1000px; overflow: hidden; margin-top: 18px; }
      .w { position: absolute; left: 0; right: 0; top: 0; font-family: "Lora"; font-weight: 700; font-size: 104px; line-height: 128px; white-space: nowrap; }
      #w1 { color: #f4f1e6; }
      #w2 { color: #fcc536; text-shadow: 0 0 36px rgba(252, 197, 54, 0.45); }
      #strike { position: absolute; left: 50%; top: 66px; height: 8px; width: 560px; margin-left: -280px; background: #ff3b3b; transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="swap" data-start="0" data-duration="7.033" data-width="1080" data-height="1920">
      <div id="sw" class="clip" data-start="0" data-duration="7.033" data-track-index="0">
        <div id="scrim"></div>
        <div id="stage">
          <div id="held">Confidence comes from knowing</div>
          <div id="slot"><div class="w" id="w1">everything</div><div class="w" id="w2">that you can learn.</div><div id="strike"></div></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#w1", { yPercent: 100 }); gsap.set("#w2", { yPercent: 100 }); gsap.set("#strike", { scaleX: 0 });
      tl.to("#scrim", { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.15);
      tl.fromTo("#stage", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.2);    // v12: after the longer ASK AGAIN ("confidence" is 2.83)
      tl.to("#w1", { yPercent: 0, duration: 0.45, ease: "power3.out" }, 4.22);                                      // "everything"
      tl.to("#strike", { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, 5.05);                                 // "It comes from…" — not everything
      tl.to("#w1", { yPercent: -110, duration: 0.42, ease: "power3.in" }, 6.0);                                    // rolls away…
      tl.to("#strike", { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.0);                                    // (the strike goes with it)
      tl.to("#w2", { yPercent: 0, duration: 0.5, ease: "power3.out" }, 6.28);                                      // …"that you can learn"
      tl.to({}, { duration: 0.01 }, 7.02);
      window.__timelines["swap"] = tl;
    </script>
  </body>
</html>
