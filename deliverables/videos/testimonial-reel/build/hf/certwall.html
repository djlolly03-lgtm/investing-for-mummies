<!doctype html>
<!-- v17 certificate beat (user: "the reel graphic with 200+ women … could be while showing the certificate, and the reel
     could be photos of actual certificates"). Over the real Flagship certificate day (IFM-369, built by cert_wall.py):
     the "You finish with a certificate." sticker, then a Reels-style grid of Hiral with big and small groups of women (v21;
     was certificate photos),
     then the stats card counting up, then Follow -> Following. Transparent, 6.0s (v19). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lora"; src: url("assets/fonts/Lora.ttf"); font-weight: 400 700; }
      @font-face { font-family: "IFM Nunito"; src: url("assets/fonts/fixed-Nunito-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #sticker { position: absolute; left: 60px; top: 150px; padding: 18px 32px; border-radius: 14px; background: #fcc536; color: #294354;
                 font-family: "Lora"; font-weight: 700; font-size: 70px; transform: rotate(-1.2deg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); opacity: 0; }
      #grid { position: absolute; left: 45px; top: 110px; width: 990px; padding: 26px 26px 30px; border-radius: 40px; background: rgba(16, 16, 18, 0.94);
              box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); opacity: 0; }
      #tabs { display: flex; justify-content: space-around; font-family: "IFM Nunito"; font-weight: 700; font-size: 34px; color: #828288; margin-bottom: 22px; }
      #tabs .on { color: #fff; border-bottom: 5px solid #fff; padding-bottom: 6px; }
      #tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .tile { width: 100%; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; opacity: 0; }
      .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .tile.wide { grid-column: span 2; aspect-ratio: auto; height: 100%; }   /* the 28-woman group (IFM-316) gets two columns */
      #card { position: absolute; left: 90px; top: 1150px; width: 900px; padding: 34px 44px 30px; border-radius: 44px;
              background: rgba(14, 18, 24, 0.86); border: 2px solid rgba(255, 255, 255, 0.16); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); opacity: 0; }
      .stat { display: flex; align-items: baseline; gap: 22px; height: 100px; opacity: 0; }
      .num { font-family: "IFM Nunito"; font-weight: 700; font-size: 92px; color: #fcc536; min-width: 250px; text-align: right; }
      .lab { font-family: "IFM Nunito"; font-weight: 700; font-size: 54px; color: #fff; }
      #foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 22px; border-top: 2px solid rgba(255, 255, 255, 0.14); }
      #handle { font-family: "IFM Nunito"; font-weight: 700; font-size: 38px; color: rgba(244, 241, 230, 0.85); }
      #btn { position: relative; width: 250px; height: 70px; border-radius: 35px; background: #fff; }
      #btn span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "IFM Nunito"; font-weight: 700; font-size: 34px; }
      #follow { color: #10141a; }
      #following { color: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="certwall" data-start="0" data-duration="6.0" data-width="1080" data-height="1920">
      <div id="cw" class="clip" data-start="0" data-duration="6.0" data-track-index="0">
        <div id="sticker">You finish with a certificate.</div>
        <div id="grid">
          <div id="tabs"><span>Posts</span><span class="on">Reels</span><span>Tagged</span></div>
          <div id="tiles">   <!-- v21: Hiral with big and small groups of women (Library rows tagged Hiral), not certificates (user).
                                v22: the Goa cohort on the steps (IFM-254) gets the second wide tile (user) -->
            <div class="tile wide"><img src="assets/groups/g1.jpg" /></div><div class="tile"><img src="assets/groups/g2.jpg" /></div>
            <div class="tile"><img src="assets/groups/g3.jpg" /></div><div class="tile"><img src="assets/groups/g4.jpg" /></div>
            <div class="tile"><img src="assets/groups/g5.jpg" /></div><div class="tile wide"><img src="assets/groups/g8.jpg" /></div>
          </div>
        </div>
        <div id="card">
          <div class="stat" id="s0"><span class="num" id="n0">0</span><span class="lab">women taught</span></div>
          <div class="stat" id="s1"><span class="num" id="n1">0</span><span class="lab">hours of teaching</span></div>
          <div class="stat" id="s2"><span class="num" id="n2">0</span><span class="lab">games</span></div>
          <div id="foot"><span id="handle">@investingformummies</span><div id="btn"><span id="follow">Follow</span><span id="following">Following</span></div></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#sticker", { opacity: 0, y: -60, scale: 1.15 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.15);
      tl.to("#sticker", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, 1.35);
      tl.fromTo("#grid", { opacity: 0, y: -40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 1.5);
      gsap.utils.toArray(".tile").forEach((t, i) => tl.fromTo(t, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, 1.62 + 0.07 * i));
      tl.fromTo("#card", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.2);
      [[200, 2.35], [400, 2.95], [40, 3.55]].forEach(([to, at], i) => {
        const o = { v: 0 }, el = document.getElementById("n" + i);
        tl.fromTo("#s" + i, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, at);
        tl.to(o, { v: to, duration: 0.55, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(o.v) + (o.v >= to ? "+" : ""); } }, at);
      });
      tl.fromTo("#btn", { scale: 1 }, { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 4.26);
      tl.to("#btn", { backgroundColor: "#3c3f46", duration: 0.12 }, 4.3);
      tl.to("#follow", { opacity: 0, duration: 0.1 }, 4.3);
      tl.to("#following", { opacity: 1, duration: 0.12 }, 4.32);
      tl.to({}, { duration: 0.01 }, 5.98);   // v19: held a further second on the full grid + stats
      window.__timelines["certwall"] = tl;
    </script>
  </body>
</html>
