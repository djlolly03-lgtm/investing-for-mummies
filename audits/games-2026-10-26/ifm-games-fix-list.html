o the 'Price Growth % p.a.' field is cut off on the right. Stack the two fields.", "id": "tools-divplan--3"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "It uses an orange theme unlike other IFM tools, and starts with empty inputs, so first-time users see nothing until they guess numbers. Pre-fill a realistic example and restyle to brand colours.", "id": "tools-divplan--4"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "There are two 'Download My Plan' buttons, and the WhatsApp share uses the old ifm-deploy.vercel.app address. Keep one button and fix the address.", "id": "tools-divplan--5"}], "key": "tools-divplan"}, {"slug": "tools-goals", "title": "Financial Goal Planner (beta)", "url": "https://games.investingformummies.com/classic?open=resources&tab=goals", "file": "classic.html (#res_goals)", "kind": "tool", "audience": "Mummies", "verdict": "A careful 4-step goal planner (goals, inflated targets, current investments, shortfall and SIP). It overlaps heavily with the standalone Fund YOUR Goal and Goal Tracker, has no disclaimer, and contradicts its own tip by applying one 12% return to every goal.", "load": "96 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "My 3 goals need ₹X in total; ₹Y a month gets me there (assuming 12%). Map your goals: <link>", "share_moment": "Step 4, under the 'Total Monthly SIP to Fund All Goals' card", "recommendation": "Merge with Fund YOUR Goal — the standalone Fund YOUR Goal and Goal Tracker pages already cover single goals; fold this tool's multi-goal buckets and per-bucket inflation into them rather than shipping a third goal tool.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "It applies one 12% return to every goal, including short-term goals 1–3 years away, while its own tip says short-term money should sit in liquid funds or FDs. Use a separate return per bucket (for example 6% short, 9% medium, 12% long) and add the missing 'estimates, not guaranteed' disclaimer.", "id": "tools-goals--1"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "On a phone it shows in an 1,100px box while its content is 1,685px tall (taller after each step), so steps 2–4 scroll inside a box. Goal names are cut off ('Home Down Paym'). As a page, let it grow and stack goal name, amount and years.", "id": "tools-goals--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Its four steps each need a button press, with no way to go back and tweak one goal and see the SIP change. Recalculate live once all goals are entered.", "id": "tools-goals--3"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The 'beta' label and three goal tools (Goal Planner, Fund Goal, Goal Tracker) side by side in the tab bar confuse visitors. Whichever survives the merge, name it plainly: 'Plan all my goals'.", "id": "tools-goals--4"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The WhatsApp share sends the old ifm-deploy.vercel.app address with no result in the text. Fix it in the merged tool.", "id": "tools-goals--5"}], "key": "tools-goals"}, {"slug": "classic-mixport", "title": "Mix My Portfolio", "url": "https://games.investingformummies.com/classic?open=mixport", "file": "classic.html (#mixport)", "kind": "solo", "audience": "Mummies", "verdict": "A neat persona game (Neha 25 … Kavita 60): set five sliders and get scored against an 'ideal' mix with side-by-side pies. Scoring to the exact percent against one 'correct' answer teaches false precision.", "load": "12 KB of markup + about 8 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I scored 410/500 matching portfolios to 5 women's life stages. Can you beat me? <link>", "share_moment": "Final 'Portfolio Master' screen after the total score", "recommendation": "Move to games as its own page — unique persona framing. Absorb the Asset Allocation calculator as a last 'now try your own age' round.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Each persona has one exact 'ideal' mix and you lose a point for every 1% away, so 65% equity for Neha loses points even though any of 60–75% is sensible. Score by bands (within 10% = full marks) and show the ideal as a range.", "id": "classic-mixport--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Neha's hint says '100 minus age = equity %' (75%) and her tip says '~75', yet her 'ideal' equity is 70%. Make the hint, tip and answer agree.", "id": "classic-mixport--2"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The sliders are 3px thin tracks with small thumbs, hard to drag on a phone, and moving one slider silently shifts the others. Make the tracks taller, enlarge the thumbs to 44px, and use +/− buttons as an alternative.", "id": "classic-mixport--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Calling one mix the 'ideal' for a real-sounding person edges toward advice. Use 'a typical rule-of-thumb mix for someone like Neha', and add one line that real choices depend on goals and risk comfort.", "id": "classic-mixport--4"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "On the final screen add 'Want to work out the right mix for your own goals? Find your batch'.", "id": "classic-mixport--5"}], "key": "classic-mixport"}, {"slug": "classic-rollercoaster", "title": "Market Rollercoaster", "url": "https://games.investingformummies.com/classic?open=game1", "file": "classic.html (#game1)", "kind": "solo", "audience": "Both", "verdict": "A short, well-paced lesson on rupee-cost averaging, with Vikram's year-by-year units reveal. It gives away its own quiz answer and overclaims ('markets always recover').", "load": "6.5 KB of markup + about 5 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Markets crashed 20% and I kept my SIP. Vikram got his most units in the crash year. Would you panic? <link>", "share_moment": "After Step 4, next to the closing quote", "recommendation": "Move to games as its own page — the clearest rupee-cost-averaging lesson on the site, and short enough for a WhatsApp click. Link onward to The Timing Trap.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "When Step 2 finishes, the chips already show 'Final Value ₹68,016', and then Step 3B asks 'what do you think his investment is worth now?'. Hide the final value until after that question is answered.", "id": "classic-rollercoaster--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Answer C reads 'Continue my SIP — markets always recover', and the feedback calls rupee-cost averaging 'the most powerful tool'. Say 'markets have historically recovered over time, though not always quickly' and drop the superlative.", "id": "classic-rollercoaster--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Vikram invests '₹10,000 every year' yet it's called a SIP, which is monthly. Make it ₹10,000 a month, or call it a yearly investment, so beginners don't learn the wrong idea of a SIP.", "id": "classic-rollercoaster--3"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Each year row packs five things (year, bar, %, NAV, units) into one line. On a phone the bar is squeezed to a few pixels. Put NAV and units on a second line under the bar.", "id": "classic-rollercoaster--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Points are counted but never shown. There is no end screen. Add a small result card ('4/4 — you've got the crash-proof mindset') before 'Play again' so the lesson has a payoff.", "id": "classic-rollercoaster--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Under the closing quote add 'Learn to build a SIP you won't panic-sell: find your batch'.", "id": "classic-rollercoaster--6"}], "key": "classic-rollercoaster"}, {"slug": "classic-chaiboss", "title": "ChaiBoss Ltd", "url": "https://games.investingformummies.com/classic?open=game7", "file": "classic.html (#game7)", "kind": "solo", "audience": "Both", "verdict": "A charming 8-quarter story that teaches EPS, P/E and price = EPS × P/E with a chai brand. The answer is almost always option A, and the hint shown before you answer gives it away.", "load": "6 KB of markup + about 25 KB of scenario script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I scored 7/8 reading ChaiBoss's stock like a pro (EPS, P/E and all). Can you? <link>", "share_moment": "Results screen, beside 'Points Earned' and 'Correct Answers'", "recommendation": "Move to games as its own page — the best plain-English P/E lesson here. Fold Fair or Fleeced in as its bonus round.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The correct choice is option A in 7 of 8 quarters (only Quarter 3 is B), so players learn to tap A. Shuffle the order of the choices each round.", "id": "classic-chaiboss--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The hint box sits above the choices and states the answer (for example 'EPS jumped… investors get excited'). Hide it behind a 'Need a hint?' button, as Rollercoaster does.", "id": "classic-chaiboss--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Quarter 3's headline says an analyst calls ChaiBoss 'Overvalued', but the story says its P/E of 9 is well below the industry's 15, which is undervalued. Change the headline to 'Undervalued — or in trouble?'.", "id": "classic-chaiboss--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The intro promises 'you'll run a fictional chai company', but your answers never change the stock price. Make it honest ('predict how the market reacts'), or let a correct call earn the player a share bonus so choices matter.", "id": "classic-chaiboss--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "On a phone the price, EPS, P/E and points chips stack in a tall navy block, and 'Price: ₹' wraps. Put the four stats in one compact row.", "id": "classic-chaiboss--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "On the results screen add 'Want to read a real company's numbers with confidence? Find your batch'.", "id": "classic-chaiboss--6"}], "key": "classic-chaiboss"}, {"slug": "classic-divdash", "title": "Dividend or Dash?", "url": "https://games.investingformummies.com/classic?open=divdash", "file": "classic.html (#divdash)", "kind": "solo", "audience": "Mummies", "verdict": "A good idea (match income or growth to a life stage). Its simulation bars contradict its own correct answers and explanations, and it names a real PSU stock.", "load": "3.6 KB of markup + about 6 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I matched 5 life stages to dividend or growth stocks and scored 40/50. Which would you pick at 58? <link>", "share_moment": "Final score card", "recommendation": "Move to games as its own page — but only after fixing the numbers below; otherwise retire it.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Round 4's explanation says '₹1L becomes ₹32L in 20 years vs ₹3.9L', but the bars on screen show ₹75.1L vs ₹7.4L. Make the text use the same calculation as the bars.", "id": "classic-divdash--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "In the three rounds where 'dividend' is the correct answer, the bars still show the growth stock ending 4–10× richer (for example ₹86.7L vs ₹9.3L), which undercuts the lesson. For income rounds, show monthly income received and risk of a fall, not 20-year wealth.", "id": "classic-divdash--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "'PowerGrid Corp — Steady 5.1% yield, PSU stock' is a real listed company presented as the right pick for a near-retiree. Use fictional names only, as the other rounds do (StableBank, TechRocket).", "id": "classic-divdash--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Growth rates of 22–25% a year for 20 years and yields of 4–6.5% are unrealistic and presented without any 'assumed' label. Use toned-down rates (12–15% growth, 1.5–4% yield) and label them assumed.", "id": "classic-divdash--4"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The title 'Dividend or Dash?' doesn't say what 'dash' means. Use 'Income Now or Growth Later?' or add a subtitle; also note that in India dividends are taxed at your slab rate.", "id": "classic-divdash--5"}], "key": "classic-divdash"}, {"slug": "classic-fairfl", "title": "Fair or Fleeced?", "url": "https://games.investingformummies.com/classic?open=fairfl", "file": "classic.html (#fairfl)", "kind": "solo", "audience": "Both", "verdict": "A clean 5-round P/E drill (cheap, fair or pricey against the sector) with a strong closing takeaway. It is thin on its own, and repeats ChaiBoss's subject.", "load": "6.6 KB of markup + about 4 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I spotted which 4/5 stocks were cheap or pricey just from their P/E. Fair or fleeced — can you tell? <link>", "share_moment": "Final score card under the 'P/E is a relative tool' takeaway", "recommendation": "Merge with ChaiBoss Ltd — it is the natural 'level 2' after ChaiBoss teaches what P/E is; five rounds is too thin for a page of its own.", "items": [{"area": "Copy", "priority": "Med", "effort": "S", "text": "One fictional company is called 'Sahara Power'. Sahara is a real group linked to a well-known investor scandal. Rename it (for example 'Surya Power') to avoid confusion.", "id": "classic-fairfl--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Players must divide 420 by 21 in their heads. Many beginners will guess. Add a 'Show me the maths' tap that reveals the P/E before they choose, and score the verdict, not the arithmetic.", "id": "classic-fairfl--2"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The explanations call stocks 'potentially undervalued!' and 'a hidden gem'. Add one line that a low P/E alone is not a reason to buy, which ChaiBoss already teaches as a 'value trap'.", "id": "classic-fairfl--3"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "With five fixed rounds, every replay is identical. Shuffle the order and add 3–5 more companies so a replay feels fresh.", "id": "classic-fairfl--4"}], "key": "classic-fairfl"}, {"slug": "classic-timing-trap", "title": "The Timing Trap", "url": "https://games.investingformummies.com/classic?open=nifty26", "file": "classic.html (#nifty26)", "kind": "solo", "audience": "Both", "verdict": "A strong, real-data story: three investors, 26 years of Nifty, and perfect versus worst timing barely differ. The data stops in 2021, some wording overclaims, and two versions of the game load on every visit.", "load": "36 KB game + an older 27 KB version that loads first and is then replaced, both compiled in the browser by React + Babel; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Even the investor who bought at the worst moment every year for 26 years ended with ₹X. Timing barely matters: <link>", "share_moment": "Result screen, under the CAGR comparison", "recommendation": "Move to games as its own page — the most convincing 'time in the market' lesson on the site (real Nifty history). Point Three Investors and Rollercoaster to it.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "The simulation ends in 2021 while it is now late 2026. Extend it to 2025 (or reframe as 2000–2025) so the result includes the 2022 dip and recent years.", "id": "classic-timing-trap--1"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Event notes say 'markets always recover from macro shocks', and 2014 is labelled 'Modi Wave'. Say 'markets have historically recovered', rename the event '2014 election rally', and note that the figures are the Nifty price index, past returns only.", "id": "classic-timing-trap--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Steady Sunita invests once a year on 1 January but the takeaway calls this 'a boring SIP'. Also the worst-timer is 'Worried Waris' on the cards and 'Unlucky Waris' in the story. Use 'invests every January' and one name throughout.", "id": "classic-timing-trap--3"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Both the old and the new version are set up on every open, so the browser compiles two React apps and throws one away. Ship only the new version, pre-built without Babel.", "id": "classic-timing-trap--4"}, {"area": "Mobile", "priority": "Low", "effort": "S", "text": "On a phone the three investor cards stack to almost three screens before the start button. Show them as a compact row of three or a swipeable strip.", "id": "classic-timing-trap--5"}], "key": "classic-timing-trap"}, {"slug": "classic-market-madness-1", "title": "Market Madness 1", "url": "https://games.investingformummies.com/classic?open=marketmad", "file": "classic.html (#marketmad)", "kind": "solo", "audience": "Both", "verdict": "A 6-round buy, hold or sell race against a Reactive, a Smart Picker and a Safe investor. Market Madness 2 (live at /market-madness-2) already does the same and more, and both use real stock names with fictional returns.", "load": "39 KB plain-JavaScript frame; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I raced a panic seller and an index investor over 6 crazy market years and ended at ₹X. Did you beat the Nifty? <link>", "share_moment": "Final standings screen", "recommendation": "Retire — Market Madness 2 already has its own page and reuses the same assets, opponents and behaviour stats.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "It labels real single stocks with risk levels (Reliance Industries and HDFC Bank 'Low risk', Yes Bank and Suzlon 'High risk') and gives them invented returns. If anything is kept, use fictional company names. The same applies to Market Madness 2.", "id": "classic-market-madness-1--1"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Zomato' was renamed Eternal in 2025, so the list already looks dated. Another reason not to use real names.", "id": "classic-market-madness-1--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Before retiring it, check that MM2 keeps the one strong feature here: the end-of-game 'Your behaviour' panel (trades made, panic sells, late buys).", "id": "classic-market-madness-1--3"}], "key": "classic-market-madness-1"}, {"slug": "classic-investopia", "title": "Investopia", "url": "https://games.investingformummies.com/classic?open=investopia", "file": "classic.html (#investopia)", "kind": "solo", "audience": "Mummies", "verdict": "An 8-world map, but only World 1 ('Clean House') exists, and the other seven are locked forever. Its content overlaps Module 1 and IFM Course.", "load": "43 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I cleaned up my money house in World 1 of Investopia: emergency fund, insurance, debt. Start yours: <link>", "share_moment": "World 1 completion screen", "recommendation": "Retire — World 1 is the same 'Clean House' material as Module 1 (/module-1) and IFM Course; the other 7 worlds were never built.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Seven of eight worlds show a lock and 'Coming Soon', which reads as abandoned. If it isn't retired, show only World 1 and drop the empty map.", "id": "classic-investopia--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Lost hearts are saved in the browser and never refill, so a player who loses all five stays at zero forever, and nothing happens at zero. Remove hearts or refill them daily.", "id": "classic-investopia--2"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "It downloads React and the Babel compiler for one world of quizzes. If any of it is reused in Module 1, pre-build it.", "id": "classic-investopia--3"}], "key": "classic-investopia"}, {"slug": "classic-investopia-2", "title": "Investopia 2", "url": "https://games.investingformummies.com/classic?open=investopia2", "file": "classic.html (#investopia2)", "kind": "solo", "audience": "Mummies", "verdict": "Byte-for-byte the same file as 'IFM Course' (same 72 KB, same title 'Investopia 2'), shown under a second name.", "load": "72 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Same as IFM Course: 'I finished World 1: 9 stages, 80+ questions, ₹X coins. Ready to clean your money house?' <link>", "share_moment": "World 1 completion screen", "recommendation": "Retire — it is an exact duplicate of IFM Course; keep one copy at most.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Investopia 2 and IFM Course load the identical file, so the hub lists the same game twice under two names, and progress is shared between them. Remove one entry.", "id": "classic-investopia-2--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Six of seven worlds say 'Coming Soon'. Whichever copy survives, hide unbuilt worlds rather than showing a wall of locks.", "id": "classic-investopia-2--2"}], "key": "classic-investopia-2"}, {"slug": "classic-ifm-course", "title": "IFM Course", "url": "https://games.investingformummies.com/classic?open=ifmcourse", "file": "classic.html (#ifmcourse)", "kind": "solo", "audience": "Mummies", "verdict": "A rich 9-stage 'Clean House' journey (myths, vocabulary, insurance, Rule of 72, a boss stage) with coins and hearts. It is titled 'Investopia 2' on screen, uses a dark purple theme, and repeats Module 1.", "load": "72 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I finished World 1 of the IFM money course: 9 stages, 80+ questions. Ready to clean your money house? <link>", "share_moment": "World 1 completion screen", "recommendation": "Merge with Module 1 (/module-1) — same topic. Move its best stages (Insurance IQ, Rule of 72, Quick Fire) into Module 1 and drop the rest.", "items": [{"area": "Copy", "priority": "High", "effort": "S", "text": "The screen opened from 'IFM Course' is titled 'Investopia 2', so a visitor can't tell which course they're in. If it is kept, name it consistently.", "id": "classic-ifm-course--1"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "The dark purple and violet theme ignores the navy, teal and gold brand used by Module 1–6, so the two 'courses' look like different products. Restyle any stages moved into Module 1.", "id": "classic-ifm-course--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Hearts drop on wrong answers, are saved forever, never refill, and nothing happens at zero. That punishes learners for no benefit. Drop hearts, or refill them daily and explain what they do.", "id": "classic-ifm-course--3"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "It compiles React in the browser on every open. Module 1 is plain JavaScript and much lighter; another reason to merge into it.", "id": "classic-ifm-course--4"}], "key": "classic-ifm-course"}, {"slug": "classic-ifm-course-2", "title": "IFM Course 2 (module hub)", "url": "https://games.investingformummies.com/classic?open=ifmcourse2", "file": "classic.html (#ifmcourse2)", "kind": "solo", "audience": "Mummies", "verdict": "A clean menu of the six course modules (Before You Invest → Measuring Returns). The modules already exist as standalone pages (/module-1 … /module-6), but this hub opens the older copies built into the classic page.", "load": "4 KB menu; each module 56–91 KB of plain JavaScript inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I'm working through the free 6-module Investing for Mummies course and just finished Module 2. Join me: <link>", "share_moment": "At the bottom of each finished module, and on the hub once a module shows as complete", "recommendation": "Move to games as its own page — make it a light '/course' landing page that links to the existing /module-1 … /module-6 pages.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The module tiles open the copies built into the classic hub, which have drifted from the standalone /module-1 … /module-6 pages (every one differs by about 3–4 KB). Point each tile at its standalone page so there is one version to maintain.", "id": "classic-ifm-course-2--1"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The hub shows no progress. Add a tick and 'done' badge for finished modules (the modules already save progress in the browser) and a 'Continue where you left off' button.", "id": "classic-ifm-course-2--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'IFM Course 2' means nothing to a visitor. Call it 'The free 6-step money course' and give each module a time estimate (for example '15 min').", "id": "classic-ifm-course-2--3"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "This is the warmest page for sign-ups: after Module 6, or on the hub, add 'Liked the course? Learn it live with Hiral — find your batch'.", "id": "classic-ifm-course-2--4"}], "key": "classic-ifm-course-2"}, {"slug": "classic-ifm-chatbot", "title": "IFM Chat Bot", "url": "https://games.investingformummies.com/classic?open=ifmchat", "file": "classic.html (#ifmchat)", "kind": "solo", "audience": "Mummies", "verdict": "A scripted chat that walks through retirement, education, holiday, savings-goal and SIP sums. It repeats five calculators, its photo-upload does nothing, and on phones the reply box sits under the floating buttons.", "load": "189 KB frame (including the same 23 KB logo image embedded 5 times); loads on every hub visit; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I planned my retirement just by chatting: I need ₹X, that's ₹Y a month. Try it: <link>", "share_moment": "After the bot's final plan summary", "recommendation": "Retire — it duplicates the Retirement, Education, Holiday, Goal and SIP calculators. If a chat-style entry is wanted later, build it as a 'guided mode' that hands off to the /tools pages.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "It offers 'Upload a photo of your portfolio statement', but the photo is never read; only the file name is echoed back. It invites people to share a sensitive financial document for nothing. Remove the option.", "id": "classic-ifm-chatbot--1"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "On a phone the 'Your answer…' box and send button sit under the floating 'Menu' and 'Suggest' buttons, so the main control is covered. Keep the floating buttons away from the chat's bottom bar.", "id": "classic-ifm-chatbot--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The banner says 'we'll build your retirement plan', but the bot first asks you to pick from five goals. Make the promise match ('plan any money goal by chatting').", "id": "classic-ifm-chatbot--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "An older copy of the same bot sits in the Beta screen's 'Chat Planner' tab with the same page ID, so there are two chat bots to maintain and they can clash. Remove the beta copy.", "id": "classic-ifm-chatbot--4"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "It states 'good equity MFs return ~11% p.a. over the long run'. Add 'historically, not guaranteed' to that line.", "id": "classic-ifm-chatbot--5"}], "key": "classic-ifm-chatbot"}, {"slug": "classic-news-agency", "title": "IFM News Agency", "url": "https://games.investingformummies.com/classic?open=newsagency", "file": "classic.html (#newsagency)", "kind": "solo", "audience": "Mummies", "verdict": "Billed as a 'Daily Digest', but its live news feed is gone (the Vercel deployment returns 'not found'), so it shows six articles from 4 May 2026, including one twice, plus a public 'Admin only' panel.", "load": "7.5 KB markup; fetches a dead news feed and then a small backup file; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Today's money news in plain English, simplified for mums: <article title> <link>", "share_moment": "On each article card, after 'Read simplified version'", "recommendation": "Retire — the scanner behind it is offline and the content is six months old. If news returns, publish it on the main website or Instagram, not inside the games site.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The live feed (ifm-news-agency.vercel.app/api/news) returns 'DEPLOYMENT_NOT_FOUND', and the 'Open the newsroom' button links to the same dead address. Remove the screen, or the link at least.", "id": "classic-news-agency--1"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "It says 'Daily Digest' while every article is dated 2026-05-04, two are near-duplicates ('Save Tax and Grow Money'), and most show no source. Stale news hurts trust more than no news.", "id": "classic-news-agency--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "'Copy for WhatsApp' does nothing: the page fills its article list through a different path than the one the copy button reads, so it always finds no article. Fix this if the screen survives.", "id": "classic-news-agency--3"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The public panel reads 'Admin only · scans, mummifies and files to Google Drive', internal wording visitors shouldn't see. Hide it from public visitors.", "id": "classic-news-agency--4"}], "key": "classic-news-agency"}, {"slug": "classic-retirement-beta", "title": "Retirement Planner (beta)", "url": "https://games.investingformummies.com/classic?open=beta", "file": "classic.html (#beta)", "kind": "solo", "audience": "Mummies", "verdict": "A React rebuild of the Retirement Planner with a nice per-investment step-up field. It is a second retirement planner, it breaks on phones, and it compiles in the browser.", "load": "45 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Same as Retirement Planner: 'I'm X% funded for retirement at 60; ₹Y a month closes the gap' <link>", "share_moment": "Under the funded-percentage bar", "recommendation": "Merge with Retirement Planner — two retirement planners confuse people; move the beta's per-investment 'step-up' field and 'income replacement %' into the main planner, then retire this.", "items": [{"area": "Mobile", "priority": "High", "effort": "S", "text": "On a phone it keeps its two-column layout, so the right column (Expenses, Current investments) runs off the screen and the 'Retire at' box shows '6' instead of '60'. This settles which version to keep.", "id": "classic-retirement-beta--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The header badge overlaps its own text ('MU CLASSROOM' printed over 'INVESTING FOR MUMMIES'), and the outer 'Beta Tools' banner plus the inner banner fill the first phone screen.", "id": "classic-retirement-beta--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Worth keeping in the main planner: a step-up % per investment and the 'income replacement %' figure. Move both over before retiring this screen.", "id": "classic-retirement-beta--3"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "It loads React and the Babel compiler only to show a form the main planner already shows without them.", "id": "classic-retirement-beta--4"}], "key": "classic-retirement-beta"}]}, {"group": "killer-a", "games": [{"slug": "killer-hidden-fortunes", "title": "Hidden Fortunes — killer upgrade", "url": "https://games.investingformummies.com/hidden-fortunes", "file": "hidden-fortunes-2.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version turns her real spending into a guessing game and then a printed 'future receipt', with each habit as a line item that rings up its 30-year value on a cash-register sound. The moment she screenshots is the receipt's last line: her Swiggy-and-coffee habit totalled as one big gold number, stamped 'assumes 12% a year, not a promise'. She forwards the archetype it gives her, 'The Café Crorepati-in-waiting', not her rupees.", "load": "", "share_idea": "💎 *Hidden Fortunes*\nMy biggest hidden fortune is sitting in my *café coffee* ☕. Turns out I'm a _Café Crorepati-in-waiting_ 😄\nWhich of your habits is secretly a fortune? Tap and find out 👇\n_(assumes 12% a year for 30 years, not a promise)_\ngames.investingformummies.com/hidden-fortunes\n[Assumption: the habit name comes from her largest selected habit. No rupee amounts are shared.]", "share_moment": "Your Swiggy order is hiding a fortune. Tap your habits. Guess what they become. Then see the receipt.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Make it guess-first. After she taps her habits, she drags one slider ('What does this become in 30 years?' from ₹5 L to ₹5 Cr) before anything is revealed. The real number then counts up and stops past her guess, with an 'off by' pill: 'You guessed ₹40 L. It's ₹3.5 Cr.' This is the one change that makes it stick. (reuse: Wealth Hack count-up + off-by pill). Inspired by benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/).", "id": "killer-hidden-fortunes--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Replace the 3-column result with a 'future receipt': a long paper bill, one line per selected habit (☕ Café coffee ₹6,000/mo → ₹2.1 Cr in 30 yrs), each printing in turn with a till 'ka-ching', then a dashed line and a TOTAL in a big Lora gold figure. The receipt footer carries the assumption line. It is the most screenshot-able format there is, because everyone knows what a bill looks like. (reuse: Wealth Hack count-up, Slash the Scam sound kit). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/); benchmark #17 One personal sentence (NYT rent-or-buy: https://www.ngpf.org/blog/interactive/is-it-better-to-rent-or-buy-a-financial-calculator/).", "id": "killer-hidden-fortunes--2"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Every habit tap should do something. A coin drops into a painted gullak at the top of the screen, the 'found per month' number ticks up with a soft clink, and the phone gives a 10 ms buzz. That replaces the 50 drifting emoji in the background with one object that fills as she plays, so the first tap already feels like progress. (reuse: Slash the Scam sound kit + mute, Wealth Hack count-up). Inspired by benchmark #3 First tap is the first decision (SPENT: https://playspent.org/html/); benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-hidden-fortunes--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add a 'keep the joy' dial on the receipt (keep all / keep half / skip once a week) that redraws every line live. The message changes from 'give it up' to 'even half your coffee is ₹1 Cr', which suits mums who are tired of being told to stop spending, and it gives her a reason to play the result twice. Inspired by benchmark #16 End with a sandbox (Parable of the Polygons: https://ncase.me/polygons/).", "id": "killer-hidden-fortunes--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Swap in habits Indian mums actually recognise. Keep Swiggy/Zomato and salon, and add 'Online sale-day shopping', 'OTT subscriptions', 'Kids' party return-gifts', 'Chai-samosa runs' and a '+ My own habit' card with a typed name. A habit she recognises as her own beats any illustration. Inspired by benchmark #20 Local life events (SEBI Check QR game: https://www.nism.ac.in/wp-content/uploads/2026/02/SEBI-Investor-Awareness-Stall-at-IKBF-2026-Crosses-100000-Visitors-1.pdf).", "id": "killer-hidden-fortunes--5"}, {"area": "Share", "priority": "High", "effort": "S", "text": "End on an identity, not a number: her largest habit becomes the archetype ('The Café Crorepati-in-waiting', 'The Swiggy Saver', 'The Sale-Day Strategist'), one line on what it means, and one next step. The archetype is the share headline. The current share text sends her personal monthly figure and does not state the assumption, so replace it with the line in share_idea. (reuse: Wealth Hack WhatsApp share). Inspired by benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-hidden-fortunes--6"}, {"area": "Share", "priority": "Med", "effort": "M", "text": "Make a 1080×1920 Story card of the receipt with the rupee lines blurred into a 'redacted' bar, so only the habit names, the archetype and '9.7× what you put in' show. 9.7× is the same for everyone at 12% over 30 years, so it gives nothing away. On phones it goes through the native share sheet. (reuse: Hidden Fortunes image share card). Inspired by benchmark #2 9:16 card (Spotify Wrapped: https://nogood.io/blog/spotify-wrapped-marketing-strategy/).", "id": "killer-hidden-fortunes--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Add a challenge link: 'Dare a friend' builds games.investingformummies.com/hidden-fortunes?from=Priya&type=cafe. The friend lands on 'Priya found a fortune hiding in her coffee. What's hiding in yours?' It needs no backend and carries no amounts. Inspired by benchmark #5 A dare (SPENT 'Prove it': https://playspent.org/html/).", "id": "killer-hidden-fortunes--8"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Phone first screen: kicker 'A 60-SECOND MONEY X-RAY', title 'Hidden *Fortunes*' (drop '2.0'), the hook line, then a 2-up habit grid with the found-per-month bar fixed in the thumb zone and the gold 'Show my receipt →' button inside it. (reuse: Wealth Hack top bar + intro shape, sticky CTA).", "id": "killer-hidden-fortunes--9"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Print '12% a year assumed, not guaranteed, not a recommendation' on the receipt footer, the Story card and the WhatsApp text, and add a 'Where does 12% come from?' sheet. A forwarded screenshot has to stay compliant once it leaves the page. (reuse: assumption footer). Inspired by benchmark #18 Show your assumptions (SPENT sources: https://playspent.org/html/files/sources/umd_spent_sources-2.pdf).", "id": "killer-hidden-fortunes--10"}], "key": "killer-hidden-fortunes"}, {"slug": "killer-3-buckets", "title": "3 Buckets — killer upgrade", "url": "https://games.investingformummies.com/3-buckets", "file": "3-buckets.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version teaches the real rule: the bucket depends on WHEN you need the money, not WHAT the product is. It ends with her sorting her own family's money, with no amounts, just ticks. The screenshot moment is her three painted buckets filled to the shape of her real savings, with a verdict like 'The Fortress Builder: Growth bucket nearly empty'.", "load": "", "share_idea": "🪣 *3 Buckets*\nI sorted 11 of 12 🎯, then sorted my *own* money: I'm a _Fortress Builder_ 🛡️ (Growth bucket nearly empty 👀).\nWhat shape are your 3 buckets? 👇\ngames.investingformummies.com/3-buckets\n[No amounts: the shape comes from ticking which products she holds.]", "share_moment": "Same ₹2 lakh. Three different buckets. It all depends on when you'll need it. Can you sort 12 in 2 minutes?", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Make time the clue. Every item card shows a 'Needed in…' chip (tomorrow / 3 years / 15 years), and add 'twin cards' where the same product appears twice for different goals: '₹2 L in a liquid fund for a hospital emergency' (Emergency) vs '₹2 L in a liquid fund for a car in 3 years' (Stability). That twist is what turns it from a product-name quiz into the actual IFM lesson. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-3-buckets--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add a finale, 'Now sort YOUR money'. She ticks what her family actually holds (savings account, FD, PPF, SIP, gold, flat, insurance-linked plan…), with no amounts, and the three painted buckets fill to that shape. A one-sentence verdict follows ('Your safety net is strong; your Growth bucket is nearly empty'), plus one next step. Inspired by benchmark #17 One personal sentence (NYT rent-or-buy: https://www.ngpf.org/blog/interactive/is-it-better-to-rent-or-buy-a-financial-calculator/); benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-3-buckets--2"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "Make it a flick game on phones. The item card sits mid-screen and the three buckets sit side by side along the bottom (thumb zone). She flicks or drags the card into a bucket, or taps one. The card arcs into the bucket in under 600 ms, the water or coin level visibly rises, and the bucket squashes. Correct gives a rising chime; wrong gives a soft thud and the card hops to the right bucket. (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-3-buckets--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add a 'speed sort' replay mode: 60 seconds, as many cards as she can sort, with a personal best on the start screen. The 12-card teaching run stays as round 1, and the timed mode gives a reason to come back. (reuse: Slash the Scam personal best). Inspired by benchmark #15 Same game, one variable changed (NGPF PAYBACK: https://www.ngpf.org/blog/paying-for-college/ngpf-launches-payback/).", "id": "killer-3-buckets--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Rewrite the start screen to the new intro shape: kicker '12 CARDS · 3 MINUTES', title '3 *Buckets*', hook 'Same ₹2 lakh. Three different buckets. It depends on when you'll need it.', one gold button 'Sort the first one →'. Drop the How-It-Works card, the 'Earn badges' pill and 'discuss with your group'. (reuse: Wealth Hack intro shape). Inspired by benchmark #3 First tap is the first decision (SPENT: https://playspent.org/html/).", "id": "killer-3-buckets--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Keep feedback to 35 words: 'Not quite. Needed in 3 years → Stability. A market dip right before you buy the car would hurt.' Put the longer 'why' behind 'More ▸'. Remove the popup's ✕ and the tap-to-close; one gold 'Next card →' sits in the thumb zone.", "id": "killer-3-buckets--6"}, {"area": "Share", "priority": "Med", "effort": "M", "text": "Build a result card with her three painted buckets at their fill levels, the archetype in Lora, '11/12 sorted' and no amounts, rendered as a 1080×1920 image plus the WhatsApp line. (reuse: Hidden Fortunes image share card, Wealth Hack WhatsApp share). Inspired by benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/); benchmark #2 9:16 card (Spotify Wrapped: https://nogood.io/blog/spotify-wrapped-marketing-strategy/).", "id": "killer-3-buckets--7"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Visuals: keep the painted buckets as the game's signature image, re-exported at about 30 KB WebP, and drop the hero video on phones. On the result screen the buckets become the trophy, replacing the emoji 🏆/🌱/📚 trophies and 'Just Getting Started!' grades.", "id": "killer-3-buckets--8"}], "key": "killer-3-buckets"}, {"slug": "killer-one-crore-ladder", "title": "₹1 Crore Ladder — killer upgrade", "url": "https://games.investingformummies.com/one-crore-ladder", "file": "one-crore-ladder.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version is a draw-your-guess climb. She drags a marker up an empty ladder to guess where ₹10,000 a month gets to in 25 years, then taps through the years one rung at a time and feels the slow start, a scary market dip and the explosive end, with a gold flash when the ladder breaks ₹1 crore. The screenshot is her little guess-marker far below the real top of the ladder.", "load": "", "share_idea": "🪜 *The ₹1 Crore Ladder*\nI guessed *₹60 L* for ₹10k a month over 25 years… the real answer is *3× bigger* 🤯\nBet you guess low too 👇\n_(assumes 12% a year, not a promise)_\ngames.investingformummies.com/one-crore-ladder\n[The guess is filled in from her drag. It is the game's example, not her own money.]", "share_moment": "₹10,000 a month for 25 years. Drag the marker: how high does the ladder go?", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Replace the 3 multiple-choice options with a drag-to-guess on an empty vertical ladder (₹30 L to ₹3 Cr). Her marker stays on the ladder for the rest of the game, so every rung she climbs past it is a small shock, and the final 'off by' pill says 'You were ₹1.3 Cr short'. (reuse: Wealth Hack off-by pill). Inspired by benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/).", "id": "killer-one-crore-ladder--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Turn the ladder into one tap per year (25 taps, with a 'hold to fast-forward' for the impatient). Years 1–8 crawl, with copy borrowed from the www compounding story ('Year 5. It feels slow. Most people quit here.'). From year 15 the rungs visibly widen and the counter accelerates. (reuse: Wealth Hack count-up; www ScrollStory ticker copy). Inspired by benchmark #8 Compress decades into minutes (NGPF STAX: https://www.ngpf.org/arcade/).", "id": "killer-one-crore-ladder--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add the one real decision. At year 6 a red 'Markets fall 20%' card drops and she chooses 'Pause my SIP' or 'Keep going'. If she pauses, the ladder greys out for 2 years and the cost is shown at the end ('Pausing for 2 years cost ₹X at year 25'). Label it 'illustrative path averaging 12%'. Inspired by benchmark #8 Compress decades into minutes (NGPF STAX: https://www.ngpf.org/arcade/); benchmark #14 Lifelines with a hidden price (SPENT: https://playspent.org/html/).", "id": "killer-one-crore-ladder--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Make the payoff land. When the ladder crosses ₹1 Cr (just after year 20), it rings a four-note arpeggio, fires gold confetti once and shows a 'CRORE' stamp, and the final 5 years then add more than the first 15 did. Say exactly that in one line. (reuse: www ConfettiBurst, Slash the Scam sound kit). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-one-crore-ladder--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Replace the bar chart with a 'twin ladders' race: replay the same climb next to 'your sister who started 5 years later'. Both ladders climb on the same taps and hers ends far lower, which makes the cost of waiting physical rather than a chart. (reuse: Wealth Hack life bar). Inspired by benchmark #15 Same game, one variable changed (NGPF PAYBACK: https://www.ngpf.org/blog/paying-for-college/ngpf-launches-payback/).", "id": "killer-one-crore-ladder--5"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Phone layout: the ladder fills the screen height, the running total sits large in the serif at the top, and one sticky 'Next year →' button sits in the thumb zone. Chart.js (about 200 KB) goes, because CSS rungs do the job. (reuse: Wealth Hack sticky CTA).", "id": "killer-one-crore-ladder--6"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Result card: her guess-marker vs the real top, the 'off by' gap as a multiple ('3× higher than I guessed'), the assumption, and 'Bet you guess low too'. The WhatsApp text is the line in share_idea. (reuse: Wealth Hack WhatsApp share, Hidden Fortunes image share card). Inspired by benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/).", "id": "killer-one-crore-ladder--7"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Put an always-visible chip under the counter: '12% a year assumed · not guaranteed'. Add a 'Where does 12% come from?' sheet explaining it is an assumption for equity over long periods, with no fund named. (reuse: assumption footer). Inspired by benchmark #18 Show your assumptions (SPENT sources: https://playspent.org/html/files/sources/umd_spent_sources-2.pdf).", "id": "killer-one-crore-ladder--8"}], "key": "killer-one-crore-ladder"}, {"slug": "killer-double-or-nothing", "title": "Double or Nothing — killer upgrade", "url": "https://games.investingformummies.com/double-or-nothing", "file": "double-or-nothing.html", "kind": "solo", "audience": "Both", "verdict": "The killer version is a 60-second Rule-of-72 reflex test that ends on a genuine double-or-nothing gamble: stake your score on one last question about how fast credit-card debt doubles. The share is a Wordle-style row of ⚡✅❌ with a time, the same daily set for everyone, so friends compare scores without any money in the message.", "load": "", "share_idea": "⏱️ *Double or Nothing* #12\n⚡⚡✅⚡❌⚡✅⚡ · 41s\nStaked it all on the last one… and *doubled* 🎉\nHow fast is your money maths? 👇\ngames.investingformummies.com/double-or-nothing\n[No money figures. The # is the daily set number.]", "share_moment": "72 ÷ rate = years to double. You have 60 seconds. No calculator. Prove it.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Turn the 5 fixed questions into a question generator plus a 60-second sprint. Each card is random: 'money at 9%', 'prices at 6% inflation', 'what rate doubles in 6 years?', 'loan at 24%'. She answers on a big 1–24 year number pad instead of 3 options, so there is no answer position to spot and replays never repeat. Inspired by benchmark #8 Compress decades into minutes (NGPF STAX: https://www.ngpf.org/arcade/).", "id": "killer-double-or-nothing--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Make the name pay off. After the sprint, a 'Double or nothing?' card offers to stake her whole score on one hard question, such as 'A credit-card balance at an assumed 36% a year doubles in about…' (2 years). Win and the score doubles with a coin-split animation; lose and it resets to zero, with the lesson that debt compounds against you just as fast. Inspired by benchmark #14 Lifelines with a hidden price (SPENT: https://playspent.org/html/).", "id": "killer-double-or-nothing--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Juice: on each correct answer one gold coin splits into two with a rising two-note chime. The timer is a burning diya-wick fuse along the top, and the streak counter stacks coins. A wrong answer gets a soft thud and the formula flashes ('72 ÷ 9 = 8'), with no buzzer. (reuse: Slash the Scam sound kit + mute, Wealth Hack count-up). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-double-or-nothing--3"}, {"area": "Share", "priority": "High", "effort": "S", "text": "Add a Wordle-style share: one emoji per answer (⚡ under 3 s, ✅ correct, ❌ wrong), total time and whether she won the gamble. It contains no money and no spoilers, so a family group can compare scores. (reuse: Wealth Hack WhatsApp share). Inspired by benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/).", "id": "killer-double-or-nothing--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a daily set: the same 8 questions for everyone that day (generator seeded from the date), a '#N' number and a localStorage streak ('3 days in a row'). It needs no login and no backend, and gives a reason to come back tomorrow. (reuse: Slash the Scam personal best). Inspired by benchmark #19 Daily ritual (Duolingo streaks: https://blog.duolingo.com/how-duolingo-streak-builds-habit/).", "id": "killer-double-or-nothing--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "End on one personal sentence. Ask only her child's age (optional), then show: 'At 6% inflation, prices double about once before Riya turns 18. A savings account at 3% doubles once in 24 years.' State the assumption and give no product advice. Inspired by benchmark #17 One personal sentence (NYT rent-or-buy: https://www.ngpf.org/blog/interactive/is-it-better-to-rent-or-buy-a-financial-calculator/).", "id": "killer-double-or-nothing--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Intro: kicker '60 SECONDS · NO CALCULATOR', title 'Double or *Nothing*', hook '72 ÷ rate = years to double. Prove you can do it faster than your kids.', button 'Start the clock →'. Show the formula once on the intro, then only behind a 'Hint (−1)' chip. (reuse: Wealth Hack intro shape). Inspired by benchmark #5 A dare (SPENT 'Prove it': https://playspent.org/html/); benchmark #3 First tap is the first decision (SPENT: https://playspent.org/html/).", "id": "killer-double-or-nothing--7"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Never name an index in a question. Use generic labels ('equity fund at an assumed 12%', 'FD at an assumed 7%') and add 'the rule is an approximation; returns aren't guaranteed' to the result card.", "id": "killer-double-or-nothing--8"}], "key": "killer-double-or-nothing"}, {"slug": "killer-rice-and-chessboard", "title": "The Rice & the Chessboard — killer upgrade", "url": "https://games.investingformummies.com/rice-and-chessboard", "file": "chess-compounding.html", "kind": "solo", "audience": "Both", "verdict": "The killer version opens on India's own version of the legend, a sage, a king and a chessboard at Ambalappuzha, and makes her decide: ₹1 crore today, or one grain doubled on each of 64 squares? She then holds a button to double and watches a single grain become a bowl, a sack, an auto-rickshaw, a truck, a warehouse and a ship. The screenshot moment: square 64 alone holds more rice than all 63 squares before it combined.", "load": "", "share_idea": "🌾 *The Rice & the Chessboard*\nThe king offered me ₹1 crore or 1 grain of rice doubled 64 times. I took the crore 😅… the rice would outlast the world's harvest for *900+ years*.\nWould you take the deal? 👇\ngames.investingformummies.com/rice-and-chessboard", "share_moment": "₹1 crore today, or 1 grain of rice doubled on every square of a chessboard? The king chose wrong. Will you?", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Open on a wager: '₹1 crore today, or 1 grain on square 1, doubled on every square?' (two big buttons). Then add a quick guess: 'On which square does the rice first fill a 13 kg sack?' (slider 1–64; the answer is 20). Both choices stay pinned in a corner while she plays, so the reveal lands on something she said. Inspired by benchmark #5 A dare (SPENT 'Prove it': https://playspent.org/html/); benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/).", "id": "killer-rice-and-chessboard--1"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "Tell the Indian legend in about 60 words with a painted card: a sage plays the king at chess in Ambalappuzha, Kerala, asks for rice doubling on each square, and the king, unable to pay, serves paal payasam to pilgrims ever after (source: https://en.wikipedia.org/wiki/Ambalappuzha_Sri_Krishna_Temple). It is local, it is a story mums can retell at dinner, and it is free. Inspired by benchmark #20 Local life events (SEBI Check QR game: https://www.nism.ac.in/wp-content/uploads/2026/02/SEBI-Investor-Awareness-Stall-at-IKBF-2026-Crosses-100000-Visitors-1.pdf).", "id": "killer-rice-and-chessboard--2"}, {"area": "Layout", "priority": "High", "effort": "M", "text": "Visuals: replace the log-scale % bar (which reads '33%' when it is a tiny fraction) with a stage of painted containers that swap as she passes milestones: grain → bowl → katori pile → 13 kg sack (sq 20) → auto-rickshaw → truck (sq 30) → warehouse → cargo ship → 'the whole world's harvest' (sq 55). Each is ≤30 KB WebP, with a lakh/crore caption.", "id": "killer-rice-and-chessboard--3"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Use 'hold to double' as the core verb. Holding the thumb button speeds the doubling up (one square per 400 ms falling to 60 ms), with a grain-pour sound rising in pitch and a buzz at each container milestone. Releasing it lets her stop and read. It replaces Next / Auto-play / speed-slider / Reset with one gesture. (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/); benchmark #8 Compress decades into minutes (NGPF STAX: https://www.ngpf.org/arcade/).", "id": "killer-rice-and-chessboard--4"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Make the exponential twist the payoff. On square 64 the board lights all 63 earlier squares in grey and square 64 in gold: 'This one square holds more than all 63 before it combined.' Then bridge to money: 'Your SIP's last few years work the same way.' Doubling is not the lesson; the last doubling is.", "id": "killer-rice-and-chessboard--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add one personal sentence: ask her age only, then 'At an assumed 12% a year, money doubles about every 6 years (Rule of 72). At 34, that's about 4 doublings left before 60, and each is bigger than all the ones before it.' It uses no rupee figures and states the assumption. Inspired by benchmark #17 One personal sentence (NYT rent-or-buy: https://www.ngpf.org/blog/interactive/is-it-better-to-rent-or-buy-a-financial-calculator/).", "id": "killer-rice-and-chessboard--6"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Result card: her wager choice ('I took the crore 😅' / 'I took the rice 🌾'), the 900-years-of-world-harvest line and the dare, as a Story card plus WhatsApp text. The wager is a far better forward than a score. (reuse: Wealth Hack WhatsApp share, Hidden Fortunes image share card). Inspired by benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify); benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/).", "id": "killer-rice-and-chessboard--7"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Phone layout: board on top as a heat-map with no numbers in the squares, the big lakh/crore counter and container illustration below, and the hold button fixed in the thumb zone. Keep it as a Midnight-theme payoff piece but use brand gold #c9a84c and the IFM top bar. (reuse: Wealth Hack top bar, Midnight tokens).", "id": "killer-rice-and-chessboard--8"}], "key": "killer-rice-and-chessboard"}, {"slug": "killer-nav-pizza", "title": "NAV Pizza — killer upgrade", "url": "https://games.investingformummies.com/nav-pizza", "file": "nav-pizza.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version makes the myth physical. She drags a knife across one real-looking pizza to cut it into 10 fat slices or 50 thin ones and sees that the pizza never changes size. Then she bakes both funds for a year in an oven and watches which pizza actually grows. The screenshot moment is two identical pizzas, one in slivers and one in wedges, captioned 'Same pizza. Different knife.'", "load": "", "share_idea": "🍕 *NAV Pizza*\nI almost fell for the ₹10 'bargain' fund 🙈. Turns out NAV is just how thin the pizza is sliced, not how big it grows.\nCan you spot the trap? 👇\ngames.investingformummies.com/nav-pizza", "share_moment": "Two funds. One costs ₹20 a slice, one ₹100. Which is the bargain? (It's a trick question.)", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "First tap is the bet: '₹1,000 to invest. Fund A ₹20 a slice, Fund B ₹100 a slice. Which is the bargain?' Two illustrated pizzas, two big buttons, and she is playing before reading a word of explanation. Her pick stays pinned for the payoff ('You picked the ₹20 slice, like most people'). Inspired by benchmark #3 First tap is the first decision (SPENT: https://playspent.org/html/); benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/).", "id": "killer-nav-pizza--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add the knife slider: one SVG pizza, and she drags to cut it into 5–100 slices. Price per slice changes live (₹200 → ₹10) while the whole-pizza value stays fixed at ₹1,000, in big serif type. Ten seconds of play teaches the idea that the current two-card text explanation tries to explain. Inspired by benchmark #16 End with a sandbox (Parable of the Polygons: https://ncase.me/polygons/).", "id": "killer-nav-pizza--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add an oven fast-forward. She taps 'Bake one year' and both pizzas grow by their return (10% vs 15%), with the slice counts unchanged and the values counting up. Run it twice: same return gives the same pizza, different return means the ₹100 one wins, and add one flip line ('if the ₹20 fund earned 15%, it would win: NAV never decides'). (reuse: Wealth Hack count-up). Inspired by benchmark #8 Compress decades into minutes (NGPF STAX: https://www.ngpf.org/arcade/); benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-nav-pizza--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Collapse the five scenario cards (NFO ₹10, IDCW payout, Growth vs IDCW plan, crash, SIP dip) into a 'Spot the trap' swipe deck: one 10-second card each, with a mini pizza animation as the answer. The IDCW payout shows a slice cut from the pizza and handed over, and the pizza shrinks by exactly that slice. The SIP dip shows 25 extra slices sliding onto her plate. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-nav-pizza--4"}, {"area": "Layout", "priority": "High", "effort": "M", "text": "Visuals: commission one painted pizza (top view, ≤40 KB WebP) and draw the cuts in SVG on top, replacing the 🍕 emoji in circles. Use a warm wooden-board background card. The pizza is this game's signature image and the source of its og:image.", "id": "killer-nav-pizza--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Juice: knife 'shk' on each cut, oven ding when baking finishes, slices sliding with a little bounce, and the score as a filling pizza at the top (one slice per correct answer, 8 slices). (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-nav-pizza--6"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "End on an identity: 'You can't be fooled by a price tag' (all right) / 'You'd have bought the ₹10 NFO, like most first-timers' (some wrong), followed by three takeaway rows. Share the 'Same pizza. Different knife.' card plus the WhatsApp line. (reuse: Wealth Hack result rows, Hidden Fortunes image share card). Inspired by benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify); benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/).", "id": "killer-nav-pizza--7"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Soften the advice-sounding lines ('the Growth option is almost always better', 'Pausing your SIP in a dip is the worst thing you can do') to education: 'IDCW pays out your own money; many long-term investors choose Growth', 'Pausing in a dip means fewer units bought cheap'. No fund named, and state the assumed returns on every bake.", "id": "killer-nav-pizza--8"}], "key": "killer-nav-pizza"}, {"slug": "killer-radhas-mission", "title": "Radha's Money Mission — killer upgrade", "url": "https://games.investingformummies.com/radhas-mission", "file": "radhas-mission.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version is a WhatsApp-style story. Radha messages you for help over one year (the bank RM's form, a market crash, Meena Aunty's retirement), and every reply moves a live meter showing her daughter Ananya's college fund at 18. The moment she forwards is the ending, when she learns she is 'the Amisha of her friend group', the friend everyone asks about money.", "load": "", "share_idea": "🎯 *Radha's Money Mission*\nI helped Radha spot the commission box and keep her SIP through a crash. Turns out I'm the _Amisha_ of my friend group 💁‍♀️\nAre you the Amisha or the Radha? 👇\ngames.investingformummies.com/radhas-mission\n[Radha and her numbers are fictional; nothing about the player is shared.]", "share_moment": "Radha, 32, Mumbai, has ₹2 lakh and one daughter. She just messaged you for help. Reply wisely.", "items": [{"area": "Layout", "priority": "High", "effort": "M", "text": "Re-skin the case study as a WhatsApp-style chat. Radha's messages arrive with typing dots, and the choices are reply bubbles she taps ('Ask her to tick Direct' / 'Trust the RM'). Mums live in WhatsApp, so the format needs no tutorial and each scene is one screen with a progress dot. Inspired by benchmark #20 Local life events (SEBI Check QR game: https://www.nism.ac.in/wp-content/uploads/2026/02/SEBI-Investor-Awareness-Stall-at-IKBF-2026-Crosses-100000-Visitors-1.pdf); benchmark #13 Say how long, show progress (The Evolution of Trust: https://ncase.me/trust/).", "id": "killer-radhas-mission--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add one live number: 'Ananya's college fund at 18' pinned in the chat header, which moves after every choice (Regular vs Direct costs, pausing the SIP in a dip, idle bonus money). Rising is gold, falling is coral, it counts up, and it is labelled 'illustrative, assumes 12% a year'. (reuse: Wealth Hack count-up, assumption footer). Inspired by benchmark #6 One live number (SPENT balance meter: https://playspent.org/html/).", "id": "killer-radhas-mission--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add a 'Play the RM' scene: for one scene she sits on the other side of the desk with a 'your commission this year' meter and chooses which plan box to tick. Then it flips back to show what that tick costs Radha over 18 years. Keep it fair: 'Distributors are paid for advice through Regular plans; the point is to know what you pay.' Inspired by benchmark #9 Play the villain (NGPF Shady Sam: https://www.ngpf.org/blog/just-one-resource/just-one-resource-interactive-shady-sam/).", "id": "killer-radhas-mission--3"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "Replace the typed number boxes with tactile maths. The NAV question becomes 'drag the ₹ coins for equity, bonds and cash into the jar, drag the liabilities out', and the jar divides itself into 40 units. The SIP table becomes four taps ('buy this month') with units filling a glass. Inputs on phones are where players drop off. Move the maths scenes to the middle of the story. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-radhas-mission--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Before the end, a 'Replay as Radha-who-listened-to-the-RM' button runs the same year with the other choices and shows both endings side by side: two college-fund numbers and one sentence on the difference. Inspired by benchmark #15 Same game, one variable changed (NGPF PAYBACK: https://www.ngpf.org/blog/paying-for-college/ngpf-launches-payback/).", "id": "killer-radhas-mission--5"}, {"area": "Share", "priority": "High", "effort": "S", "text": "End on an identity rather than '90/120': 'You're the Amisha of your group' / 'You're getting there, Radha' / 'Ask Amisha to coffee 😄', one warm line on her strongest moment, then a share card with the title and the chat-bubble look. (reuse: Wealth Hack WhatsApp share, Hidden Fortunes image share card). Inspired by benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-radhas-mission--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Use the intro's unused setup for real. Ananya (3) and the ₹2 lakh bonus drive the story, Amisha is introduced in the first message ('my friend Amisha did the IFM course'), and every scene ends on a 2-line 'what just happened' with one rupee figure. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-radhas-mission--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add juice and pacing: a message 'whoosh' as bubbles arrive, a tiny celebration when the fund meter crosses a milestone ('Engineering fees covered ✓'), and a 7-dot progress bar with '~4 min' on the start button. (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/); benchmark #13 Say how long, show progress (The Evolution of Trust: https://ncase.me/trust/).", "id": "killer-radhas-mission--8"}], "key": "killer-radhas-mission"}, {"slug": "killer-three-investors", "title": "The Three Investors — killer upgrade", "url": "https://games.investingformummies.com/three-investors", "file": "three-investors.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version makes her the market timer for real. For 12 years she reads scary and giddy headlines and decides to invest or wait, while two friends' results stay hidden. At the reveal, her line is drawn against the friend who invested the same amount every year without looking, and an archetype names her habit ('The Headline Chaser'). The moment she shares is losing to the friend who never checked.", "load": "", "share_idea": "📉 *The Three Investors*\nI tried to time the market for 12 years… and lost to my friend who never even looked 😅. My style: _The Headline Chaser_.\nThink you can beat a boring SIP? 👇\n_(illustrative market, not real returns)_\ngames.investingformummies.com/three-investors", "share_moment": "₹12 lakh. 12 years. You read the news and decide when to invest. Can you beat the friend who never looks?", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Core loop: each year shows one headline card ('Markets crash 30%. Experts warn worse to come', 'Index at record high. Your colleague doubled her money') and one price on a mini chart. She taps 'Invest ₹1 L', 'Invest ₹3 L' or 'Wait', and her unspent budget shows as a 'cash under the mattress' stack. The decisions are hers, which the random presets never allowed. Inspired by benchmark #6 One live number (SPENT balance meter: https://playspent.org/html/); benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-three-investors--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Add a fear mechanic: during crash years the Invest button trembles and needs a 1-second press-and-hold ('Are you sure?'), while in boom years it glows and invites a tap. Players feel why people buy high and sell low instead of being told. Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-three-investors--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Run several market paths with honest outcomes: crash-early, steady-rise and late-crash, picked at random and named at the end. In the steady-rise path the lump-sum friend wins, and the game says so ('In a steadily rising market, investing early in one go usually wins. SIP wins on discipline'). It replaces the 'You timed the market perfectly' preset. Inspired by benchmark #15 Same game, one variable changed (NGPF PAYBACK: https://www.ngpf.org/blog/paying-for-college/ngpf-launches-payback/).", "id": "killer-three-investors--3"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Reveal: draw her line, then the SIP friend's and the lump-sum friend's lines on top, then one hero number, 'Your average price ₹96 vs her ₹85' (her ₹85 is the real figure from this game's price path), with the 3 rows below. Name the archetype from her actual choices: 'The Headline Chaser', 'The Waiter', 'The Brave Buyer', 'The Steady One'. (reuse: Wealth Hack count-up, Wealth Hack result rows). Inspired by benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/); benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-three-investors--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Offer one specific replay: 'Same market, but this time invest ₹1 L every year no matter what', which auto-plays in 5 seconds and puts both endings side by side. Seeing her own run next to the boring one is the lesson. Inspired by benchmark #15 Same game, one variable changed (NGPF PAYBACK: https://www.ngpf.org/blog/paying-for-college/ngpf-launches-payback/).", "id": "killer-three-investors--5"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "Phone layout: a compact chart on top (inline SVG, drop Chart.js), the headline card in the middle, three thumb buttons at the bottom, and no auto-scrolling. The page never moves on its own; one year is one screen. (reuse: Wealth Hack sticky CTA).", "id": "killer-three-investors--6"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Share the archetype and the 'lost to the friend who never looked' line, never her rupees, as a Story card of the three lines with no axis values plus the WhatsApp text in share_idea. (reuse: Wealth Hack WhatsApp share, Hidden Fortunes image share card). Inspired by benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/); benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-three-investors--7"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Label the market 'An illustrative 12-year path, not a real index' on the chart, the result and the share card. Keep every headline generic (no company or index names) and end on 'This doesn't predict any future market'. Inspired by benchmark #18 Show your assumptions (SPENT sources: https://playspent.org/html/files/sources/umd_spent_sources-2.pdf).", "id": "killer-three-investors--8"}], "key": "killer-three-investors"}, {"slug": "killer-inflation-calculator", "title": "Inflation Calculator — killer upgrade", "url": "https://games.investingformummies.com/inflation-calculator", "file": "inflation-calculator.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version turns a three-tab calculator into a 'Price Time Machine'. She guesses what her kitchen basket and her child's school fee will cost when her child turns 18, then watches the price tags flip like a railway departure board while her ₹100 note visibly shrinks. The screenshot moment is the shrunken note: '₹100 today buys what ₹56 will in 2036'.", "load": "", "share_idea": "🛒 *Price Time Machine*\nI guessed rice would cost ₹75 a kilo in 2036… the time machine says about *₹107* 😳 My ₹100 note will feel like *₹56*.\nGuess yours 👇\n_(assumes 6% inflation a year, not a forecast)_\ngames.investingformummies.com/inflation-calculator\n[Prices are the game's example basket, not her spending.]", "share_moment": "Your ₹60 kilo of rice. Your child's school fee. Guess what they cost when your child turns 18.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Make it guess-first. Show five everyday items using the BASKET already in the code (rice, milk, petrol, auto ride, movie ticket) plus 'school fee'. She drags a price guess on each for '10 years from now', then the real projection flips in, with an off-by pill per item. (reuse: Wealth Hack off-by pill + money input quick chips). Inspired by benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/).", "id": "killer-inflation-calculator--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Add a departure-board reveal: each price tag flips digit by digit like a railway split-flap board, with a soft clatter sound, then the basket total. It is the most satisfying animation in the set for about 40 lines of CSS. (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-inflation-calculator--2"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "One live object: a ₹100 note at the top of the screen that physically shrinks and fades as the years slider moves (₹100 → ₹56 at 10 years, 6%). It is the single image people remember, and the share card. (reuse: Wealth Hack count-up). Inspired by benchmark #6 One live number (SPENT
