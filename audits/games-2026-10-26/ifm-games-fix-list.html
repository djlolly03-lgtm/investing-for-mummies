<title>IFM Games Fix List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one working column — sticky progress + filters, then a card per game with tickable rows. IFM brand: navy / teal / gold, Lora + Nunito. */
:root{
  --bg:#f5f8f7; --surface:#ffffff; --ink:#1a3a5c; --muted:#5a7480; --line:#dbe6e3;
  --teal:#1f7a70; --teal-soft:#e2f2ef; --gold:#a8822a; --gold-soft:#f6eed9;
  --hi:#b4372f; --hi-soft:#f8e4e1; --med:#9a6a10; --med-soft:#f6ecd6; --lo:#4d6b78; --lo-soft:#e6eef1;
  --done:#8aa0a8; --wa:#1f9d57;
  --serif:'Lora',Georgia,'Times New Roman',serif; --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1c27; --surface:#162736; --ink:#e4eef2; --muted:#9db3bd; --line:#26394a;
  --teal:#5fc4b6; --teal-soft:#183a3a; --gold:#d9b85a; --gold-soft:#3a3220;
  --hi:#f08a80; --hi-soft:#43231f; --med:#e2b55a; --med-soft:#3c3018; --lo:#9fbac6; --lo-soft:#203342;
  --done:#5f7682; --wa:#4cc983; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c27; --surface:#162736; --ink:#e4eef2; --muted:#9db3bd; --line:#26394a;
  --teal:#5fc4b6; --teal-soft:#183a3a; --gold:#d9b85a; --gold-soft:#3a3220;
  --hi:#f08a80; --hi-soft:#43231f; --med:#e2b55a; --med-soft:#3c3018; --lo:#9fbac6; --lo-soft:#203342;
  --done:#5f7682; --wa:#4cc983; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
h1,h2{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15}
.lede{color:var(--muted);margin:8px 0 0;max-width:64ch}
.status{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.4em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line);margin-top:18px}
.prog{display:flex;align-items:center;gap:12px}
.prog-track{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog-fill{height:100%;background:var(--teal);width:0;transition:width .4s ease}
.prog-num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:700 13px var(--sans);cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.cb:focus-visible,input[type=search]:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
select#jump{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font:700 13px var(--sans);min-height:36px;max-width:100%}
input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px var(--sans);min-height:36px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.group-h{font-family:var(--sans);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px}
.game{scroll-margin-top:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.game-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 10px;flex-wrap:wrap}
.game-h h2{font-size:20px}
.game-h a{color:var(--teal);font-weight:800;font-size:13.5px;text-decoration:none;white-space:nowrap}
.game-h a:hover{text-decoration:underline}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--teal-soft);color:var(--teal)}
.tag.k-classroom{background:var(--gold-soft);color:var(--gold)}
.tag.k-site{background:var(--ink);color:var(--bg)}
.tag.count{background:transparent;color:var(--muted);padding-left:0}
.meta{padding:0 18px 12px;display:grid;gap:6px;font-size:14px}
.meta p{margin:0;max-width:75ch}
.meta .verdict{color:var(--ink)}
.meta .load,.meta .moment{color:var(--muted);font-size:13.5px}
.share{display:flex;gap:8px;align-items:flex-start;background:var(--teal-soft);border-radius:10px;padding:9px 12px;margin:2px 0 0}
.share svg{flex:none;margin-top:2px}
.share q{font-style:italic}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 18px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.cb{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;margin:1px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.cb:checked{background:var(--teal);border-color:var(--teal)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:disabled{cursor:default;opacity:.6}
.it-body{min-width:0}
.it-text{margin:0}
.it-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12px;font-weight:800}
.p{padding:1px 7px;border-radius:5px}
.p-High{background:var(--hi-soft);color:var(--hi)} .p-Med{background:var(--med-soft);color:var(--med)} .p-Low{background:var(--lo-soft);color:var(--lo)}
.area,.eff{color:var(--muted)}
.when{color:var(--teal)}
.item.is-done .it-text{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--done)}
.item.is-done .p{opacity:.55}
.rec{margin:0 18px 12px;font-size:13.5px;font-weight:700;color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:560px){.game-h,.meta,.item{padding-left:14px;padding-right:14px}.item{gap:10px}.sep{display:none}}
@media (prefers-reduced-motion:reduce){.prog-fill{transition:none}}
</style>

<div class="wrap">
  <h1>IFM Games Fix List</h1>
  <p class="lede">Every game on games.investingformummies.com, audited as a game designer and a web designer. Tick an item when it's done; ticks are saved for everyone who opens this page.</p>
  <p class="status" id="status" role="status">Loading saved ticks…</p>

  <div class="bar">
    <div class="prog"><div class="prog-track" aria-hidden="true"><div class="prog-fill" id="fill"></div></div><div class="prog-num" id="pnum">0 / 0 done</div></div>
    <div class="filters" role="group" aria-label="Filters">
      <button class="chip" data-f="prio" data-v="High" aria-pressed="false">High priority</button>
      <button class="chip" data-f="eff" data-v="S" aria-pressed="false">Quick wins (S)</button>
      <button class="chip" data-f="hide" data-v="1" aria-pressed="false">Hide done</button>
      <span class="sep"></span>
      <button class="chip" data-f="kind" data-v="site" aria-pressed="false">Site-wide</button>
      <button class="chip" data-f="kind" data-v="solo" aria-pressed="false">Solo games</button>
      <button class="chip" data-f="kind" data-v="classroom" aria-pressed="false">Classroom</button>
      <button class="chip" data-f="kind" data-v="tool" aria-pressed="false">Tools</button>
      <select id="jump" aria-label="Jump to a game"><option value="">Jump to a game…</option></select>
      <input type="search" id="q" placeholder="Search games or fixes" aria-label="Search games or fixes">
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>
</div>

(Hiral's priority) as the first tool page. The tested draft is ready.", "id": "_build-order--6"}, {"area": "Layout", "priority": "High", "effort": "L", "text": "Step 7 · Tools on www: move SIP, SWP, Retirement, Education, Holiday, Budget, Fund YOUR Goal, Goal Tracker, Dividend Income Planner and Asset Allocation to their own www/tools pages; drop the Financial Goal Planner.", "id": "_build-order--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Step 8 · Tools on www: add the 'Free money tools' strip to the www homepage and add the tool pages to www's sitemap.", "id": "_build-order--8"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Step 9 · Games hub: beta deep-dive. One decision card per beta game; you choose keep, fix, merge or retire.", "id": "_build-order--9"}, {"area": "Layout", "priority": "High", "effort": "L", "text": "Step 10 · Games hub: one hub with Play and In class tabs, the Gen Next filter, the question chips and real game screenshots. It replaces the homepage and All games pages; the classic hub is retired and redirected.", "id": "_build-order--10"}, {"area": "Game design", "priority": "Med", "effort": "L", "text": "Step 11 · Games hub: In class tab as a showcase, plus a 'play on your own' mode for the classroom games people open alone.", "id": "_build-order--11"}, {"area": "Speed", "priority": "High", "effort": "L", "text": "Step 12 · Speed: pre-build the 9 slow games, turn on caching, and shrink heavy media (3 Buckets, the quiz video, the 1 MB logos).", "id": "_build-order--12"}, {"area": "Game design", "priority": "Med", "effort": "L", "text": "Step 13 · Per game: work through each game's own fixes below, High priority first.", "id": "_build-order--13"}, {"area": "Conversion", "priority": "Med", "effort": "M", "text": "Step 14 · Measure: PostHog events for game started, finished, shared and 'Find your batch' clicked; review which games and tools lead to bookings.", "id": "_build-order--14"}], "key": "_build-order"}]}, {"group": "requests", "games": [{"slug": "_hiral-requests", "title": "Hiral's requests (27 Oct)", "url": "https://games.investingformummies.com/", "file": "classic.html + all-games", "kind": "tool", "audience": "Mummies", "verdict": "Requests from Hiral on 27 Oct 2026. The Education Planner change is her stated priority. A tested draft exists (audits/games-2026-10-26/drafts/education-planner-per-child.html) but nothing is live.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Education Planner: let each child have their own expected SIP return, instead of one rate applied to all children. Children of different ages need different assumptions.", "id": "_hiral-requests--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Education Planner: let each child have their own existing investments (amount, return %, amount still being added each month), instead of one shared pot for all children.", "id": "_hiral-requests--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Education Planner: show, for each child, the monthly SIP (from now until that child's education starts) AND the one-time lump sum needed today to bridge that child's funding gap, plus a family total. Today there's one SIP figure, timed to the eldest child.", "id": "_hiral-requests--3"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Move the Dividend Income Planner out of the games list and into a separate Resources / Tools tab.", "id": "_hiral-requests--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Move Asset Allocation out of the games list and into the Resources / Tools tab.", "id": "_hiral-requests--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Remove the Financial Goal Planner from the listings (Fund YOUR Goal and Goal Tracker already cover it).", "id": "_hiral-requests--6"}], "key": "_hiral-requests"}, {"slug": "_structure-27oct", "title": "Structure decisions (27 Oct)", "url": "https://games.investingformummies.com/all-games.html", "file": "all-games.html, module pages", "kind": "site", "audience": "Both", "verdict": "From the structure discussion on 27 Oct. Course material and never-launched beta games went public on the All games page on 16 Oct. Until then the classic hub had kept them hidden behind admin mode.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "Take the 'Courses & Beta' section (Investopia, Investopia 2, IFM Course, IFM Course 2, Chat Bot, News Agency) off the public All games page. The classic hub kept these hidden behind admin mode; the 16 Oct All games page made them public by mistake.", "id": "_structure-27oct--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Stop Google from listing the course module pages (/module-1 to /module-6): mark them 'noindex' and keep them out of every public listing.", "id": "_structure-27oct--2"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Take the never-launched beta games (Rollercoaster, Mix My Portfolio, ChaiBoss, Timing Trap, Market Madness 1, Dividend or Dash, Fair or Fleeced) off the public All games page until the beta deep-dive decides keep / fix / retire for each.", "id": "_structure-27oct--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Beta deep-dive: one decision card per beta game and classic-hub tool (what it is, screenshot, audit verdict, any usage), so we decide keep / fix / merge / retire for each.", "id": "_structure-27oct--4"}, {"area": "Game design", "priority": "Med", "effort": "L", "text": "Give the classroom games a 'play on your own' mode (against computer players), like The Wealth Hack's solo page. 336 quiz rooms, 75 Broke by Friday rooms and 45 MF Manager rooms were opened and never joined by anyone.", "id": "_structure-27oct--5"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Re-check in 2–3 weeks, using PostHog's game_started events, whether visitors play the classroom games on their own. PostHog has only been on the games site since 22 Oct.", "id": "_structure-27oct--6"}], "key": "_structure-27oct"}]}, {"group": "killer-std", "games": [{"slug": "_old-address-full-scan", "title": "Old ifm-deploy.vercel.app address: complete scan (27 Oct)", "url": "https://games.investingformummies.com/", "file": "18 files across CLAUDE/", "kind": "site", "audience": "Both", "verdict": "Full read-only scan after the old address showed on the projector in Stock Rush PRO on 27 Oct. 3 places print it in the code, and 10 classroom games build their QR from whatever address the host opened, so old bookmarks put it on every projector. The complete fix: change the 3 written-in addresses, add one redirect from the old address to games.investingformummies.com, and update Hiral's bookmarks.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Stock Rush PRO: the projector's 'Join on your phone' box prints ifm-deploy.vercel.app/stock-rush-pro, written into the code (stock-rush-pro/host-view.jsx). Show games.investingformummies.com/stock-rush-pro.", "id": "_old-address-full-scan--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Teen Stock Rush: the same box prints ifm-deploy.vercel.app/stock-rush (stock-rush/host-view.jsx). Change it to the games address (teen version: owner rule says don't edit, so decide first).", "id": "_old-address-full-scan--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Swayamvar: the join QR is built from ifm-deploy.vercel.app/swayamvar (swayamvar/ui-common.js and .jsx). Build it from the games address.", "id": "_old-address-full-scan--3"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Add one redirect rule: anyone opening ifm-deploy.vercel.app goes to games.investingformummies.com, same page. 10 classroom games (Quiz, Wealth Hack, MF Manager, Sapno Ka Ghar, Broke by Friday, Swipe Right LIVE, Lifestyle Time Machine LIVE, both Stock Rushes) build their QR from the address the host opened, so this one rule fixes every QR and every old bookmark at once.", "id": "_old-address-full-scan--4"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Update Hiral's browser bookmarks and class slides to games.investingformummies.com links (and the host links once rooms are per-session).", "id": "_old-address-full-scan--5"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Share messages and printed PDF footers in Fund YOUR Goal, Goal Tracker and the classic hub say 'ifm-deploy.vercel.app' (5 places). Change them to the right address (www/tools once the tools move).", "id": "_old-address-full-scan--6"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The classic hub loads 9 embedded games from ifm-deploy.vercel.app. Switch to same-site links (moot once the classic hub is retired).", "id": "_old-address-full-scan--7"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "18 logo and image references load from ifm-deploy.vercel.app (Crorepati Lane, MF Manager art, Fund YOUR Goal, Goal Tracker, Quiz, Sapno Ka Ghar, Slash the Scam, Money Map, Snakes & Ladders, classic hub). Switch to relative paths, and shrink the 1 MB round logo while at it.", "id": "_old-address-full-scan--8"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Stock Rush PRO activity feed shows a broken question-mark-in-a-diamond symbol before 'Suraj locked in' on the projector (seen in class 27 Oct). Fix the lock line's emoji.", "id": "_old-address-full-scan--9"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Tidy-ups: Snakes & Ladders page meta points at the old address; the unused WordPress publish scripts (bbflive/g8/swayamvar _wp_ commands) and game-reels content links still mention it.", "id": "_old-address-full-scan--10"}], "key": "_old-address-full-scan"}, {"slug": "_rooms-topic", "title": "Classroom rooms: one fixed room, or a new room each session?", "url": "https://games.investingformummies.com/", "file": "swayamvar/, stock-rush/, stock-rush-pro/, swipe-right-sip-live.html (fixed) · quiz, the-wealth-hack, fund-manager, sapno-ka-ghar, broke-by-friday-live (per session)", "kind": "classroom", "audience": "Both", "verdict": "Recommendation: a NEW room every session, everywhere, made as easy as a fixed room. Fixed rooms (Swayamvar 1995, Swipe Right MF101, Stock Rush TEEN, Stock Rush PRO's GO25 fallback) are simple and printable, but two classes collide, old scores show when the screen opens, and anyone with the link can watch or reset a live class. Per-session rooms (Quiz, Wealth Hack, MF Manager, Sapno, BBF) keep classes apart and safe, and they gave us the usage data (1,044 rooms). Players never need a fixed code anyway: they scan the QR on the projector.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Move Swayamvar, Swipe Right LIVE, Stock Rush teen and Stock Rush PRO to a new room per session, like the quiz and Wealth Hack, so two classes can never collide and old scores never appear.", "id": "_rooms-topic--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Give Hiral one bookmarkable host link per game that always opens or resumes HER latest room. That keeps the convenience of a fixed room, without a shared room strangers can reach.", "id": "_rooms-topic--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Make every host screen survive a refresh: remember the host's room on that device and offer 'Resume or start fresh' (Stock Rush PRO already does this; the quiz, Wealth Hack, Sapno and BBF lose the lobby today).", "id": "_rooms-topic--3"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Only the host's own device sees host controls (Reset, Next, Reveal). A plain player link should never show them.", "id": "_rooms-topic--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Use one room-code style everywhere: 4 characters, no look-alike letters (no O/0, I/1), shown big beside the QR, with a typed-code join box on the phone that actually works.", "id": "_rooms-topic--5"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "Build one shared 'rooms' module that all 9 classroom games use (create, join, resume, expire after 6 hours), instead of nine slightly different versions.", "id": "_rooms-topic--6"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Tag each room with game name and date so the room history becomes a simple usage report: which games Hiral runs, how many players, and how far each got.", "id": "_rooms-topic--7"}], "key": "_rooms-topic"}, {"slug": "_killer-standard", "title": "The IFM killer standard (applies to every game)", "url": "https://games.investingformummies.com/", "file": "killer/quality-bar.md", "kind": "site", "audience": "Both", "verdict": "What IFM's newest work does well, written as rules every game should meet. Build it once as a shared kit (one CSS and one JS file), then upgrade each game against it. The full checklist with examples is in audits/games-2026-10-26/killer/quality-bar.md.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Layout", "priority": "High", "effort": "S", "text": "The game title is the hero: a 40-54px serif on the page with exactly one italic accent word in the accent colour, a tracked-caps kicker above it, and a one-sentence hook ending on a twist. (Why: It turns a form into a moment and gives a reason to care before explaining mechanics; it is the single most visible difference between old and new.)", "id": "_killer-standard--1"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Two themes, two font pairs, recorded in Brand Guidelines §4: Daylight = Lora + Nunito; Midnight (live/projector and premium payoffs) = one agreed pair. No new font pair per game. (Why: Six display faces now exist across one brand (Lora, Fraunces, Sora, Poppins, Cormorant, Cinzel); a fixed pair keeps the family recognisable and cuts font weight.)", "id": "_killer-standard--2"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "Phone type floor: body 15-17px, inputs 16-17px, labels 12-13px; only caps kickers may be 10-11px. Replace the Brand Guidelines §4 type scale (0.55-0.92rem) accordingly. (Why: Small text is why old games read as cramped; the guideline itself prescribes it.)", "id": "_killer-standard--3"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Short palette with fixed meanings: gold/mint = money that grows, coral = money that hurts, navy/ivory neutral. All colours from tokens, no inline hex. (Why: Consistent colour meaning teaches without words; colour sprawl looks amateur and drifts off-brand.)", "id": "_killer-standard--4"}, {"area": "Share", "priority": "High", "effort": "S", "text": "Primary buttons use dark text on gold (>=4.5:1); WhatsApp button uses dark text on #25D366. (Why: White on brand gold is 2.3:1 and white on WhatsApp green is 1.98:1, both failing WCAG 1.4.3 (4.5:1). It is the Start button of every old game.)", "id": "_killer-standard--5"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Depth through layers: one glass card with a gold hairline for the screen's key content, a faint grain overlay, glow on hero numbers, and one atmospheric image fading into the background. (Why: Flat white cards on a near-white page make nothing feel important.)", "id": "_killer-standard--6"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Each game owns one signature illustration or photo; emoji are seasoning, not the artwork or the trophy. (Why: Brand Guidelines §24 asks for editorial illustration and rounded outline icons; emoji-as-art reads as a prototype.)", "id": "_killer-standard--7"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Fix the empty logo gutter: remove data-logo from .game-hero (it reserves 112px with no logo) and show the small round mark in a consistent top bar. (Why: On phones the title is squeezed into the right two-thirds of the banner next to an empty hole; REIT's in-game header shows an empty logo circle.)", "id": "_killer-standard--8"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "Phone layout: one column max 480px, 16px gutters, no sideways scroll; title + hook + primary button visible in 390x844 without scrolling; primary button >=56px, in the thumb zone (sticky where there is an input). (Why: Most visitors arrive on phones from Instagram/WhatsApp; a below-the-fold Start button loses them.)", "id": "_killer-standard--9"}, {"area": "Share", "priority": "High", "effort": "S", "text": "Every live/projector game has a solo phone path for visitors who arrive from a shared link without a room code. (Why: Without it, WhatsApp visitors see a squeezed projector lobby or a dead-end 'Scan the QR' screen.)", "id": "_killer-standard--10"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Intro shape: top bar, kicker with length ('3 MINUTES'), title, one-line hook, one input or one button that names the reward, optional social proof, assumption footer. No 'How It Works' card — the first round is the tutorial. (Why: It earns curiosity before asking for effort.)", "id": "_killer-standard--11"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Feedback shows the player's own consequence (a number or picture about them) plus one bold-number sentence of why, max ~35 words; 'Not quite — here's the twist', never 'Wrong'. (Why: Personal consequence is what people remember and retell; long paragraphs are skipped on phones.)", "id": "_killer-standard--12"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Scores and money count up (about 900ms ease-out); under reduce-motion they jump straight to the value. (Why: A counting number makes the payoff land; an instant swap feels like a spreadsheet.)", "id": "_killer-standard--13"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Light synthesised sound: chime for correct, soft thud for wrong, coin on reveal, arpeggio on finish; visible mute button; unlocked on the first tap. (Why: Cheapest 'this is a game' upgrade; no audio files needed.)", "id": "_killer-standard--14"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Result card: player's name, hero number/verdict in serif, max 3 meaning rows, one tailored line, one call to act; full recap behind a tap; confetti only for a real win. (Why: The payoff is the screenshot and the share; a long recap list and a score out of 80 are neither.)", "id": "_killer-standard--15"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Copy voice: smart friend, sentence case, rupees not percentages, buttons say what you get, assumption next to every projection; no patronising grades. (Why: Brand Guidelines §11 ('never patronising'); compliance needs the assumption beside the number.)", "id": "_killer-standard--16"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Every result screen has Share on WhatsApp as the primary button: WhatsApp-formatted text (*bold*, _italic_) with name, result, one teaching line, the assumption and the game's own link; image card via navigator.share where possible. (Why: Most traffic is WhatsApp/Instagram; a share is free distribution and must stay compliant once forwarded.)", "id": "_killer-standard--17"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Each game has its own 1200x630 og:image and title so a forwarded link previews that game. (Why: Every game currently previews the same og-games.jpg.)", "id": "_killer-standard--18"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "End-card buttons, in order: Share on WhatsApp · Play again · More games like this. One disclaimer line only. (Why: Old games end at 'Play again' or 'Back to Main Menu' and stack a yellow disclaimer box on top of the footer disclaimer.)", "id": "_killer-standard--19"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Performance budget: game's own first-screen payload <=500KB (excl. analytics), logo <=15KB, hero image <=120KB WebP, icons <=30KB WebP, video <=400KB and only where shown; LCP <2.5s on 4G, INP <200ms, CLS <=0.1; no in-browser Babel; pinned CDN versions. (Why: Measured: the 1MB round-logo PNG is the heaviest file on most new games; 3 Buckets is 7.8MB on a phone; Wealth Hack phones download a 394KB projector video they never show.)", "id": "_killer-standard--20"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Never disable zoom: viewport is width=device-width, initial-scale=1 only. (Why: WCAG 1.4.4; low-vision users must be able to pinch-zoom. Lighthouse flags user-scalable=no.)", "id": "_killer-standard--21"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Honour prefers-reduced-motion: count-ups jump, confetti skipped, pulses stopped. (Why: WCAG 2.3.3; motion can cause nausea. Zero games do this today.)", "id": "_killer-standard--22"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Keyboard and screen-reader basics: real <button>s (no clickable divs), visible :focus-visible rings, aria-live on reveals, alt on images, colour never the only signal, tap targets >=44px. (Why: WCAG 2.2; Apple HIG 44pt targets.)", "id": "_killer-standard--23"}, {"area": "Share", "priority": "Med", "effort": "M", "text": "Build upgrades from one shared kit (ifm-kit.css + ifm-kit.js) instead of copying code into each game. (Why: There is no shared CSS/JS in CLAUDE/ today; 40+ hand-copied versions drift (dead --purple/--pink tokens in every old game).)", "id": "_killer-standard--24"}], "key": "_killer-standard"}, {"slug": "_killer-playbook", "title": "Games playbook: what the best money games do", "url": "https://games.investingformummies.com/", "file": "killer/games-benchmark.json", "kind": "site", "audience": "Both", "verdict": "Patterns from 24 of the best money and learning games (Spent, Wordle, NYT 'You Draw It', Duolingo, Nicky Case, Zogo and others), ranked by impact for IFM. Gaps found: rivals break on phones, and no Indian product offers an always-on, 2-minute money game for mums with WhatsApp sharing.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Guess first, then reveal: Before every big reveal (what Rs 5,000 a month becomes in 25 years, or what a 2% fee costs over a lifetime), make the player drag a slider to guess, then animate the real number over their guess with the gap labelled, for example 'You were Rs 38 lakh short'. (Inspired by NYT Upshot 'You Draw It: How Family Income Predicts Children's College Chances' )", "id": "_killer-playbook--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Spoiler-free result card built for the chat: End every game with two share options: a one-tap WhatsApp text (game name, an emoji line and a score, with no personal money figures) and a 1080x1920 card in navy, teal and gold for Instagram Stories, both linking straight back into the game. (Inspired by Wordle share grid, and ; Spotify Wrapped 9:16 format,)", "id": "_killer-playbook--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "First tap is the first decision: Remove name entry, rules pages and 'choose a mode' screens from solo games, so the landing screen shows the hook question and a single big 'Start (2 min)' button that opens straight onto choice number one. (Inspired by SPENT, played first-hand, ; Wordle,)", "id": "_killer-playbook--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Link preview as the cover: Give every game URL its own og:image (under 300KB, about 1200x630) carrying the hook question in Lora, for example 'Could you survive a month on Rs 25,000?', and check it by pasting the link into a WhatsApp chat before launch. (Inspired by WhatsApp link-preview requirements, ; 300KB practical limit,)", "id": "_killer-playbook--4"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "A dare that challenges the player's self-image: Phrase each game's opening line and share text as a dare a mum would forward to her group, such as 'Think you'd spot a fake SEBI-registered advisor? Prove it in 90 seconds.' (Inspired by SPENT by McKinney for Urban Ministries of Durham, played first-hand, ; reach fig)", "id": "_killer-playbook--5"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "One live number you can't stop watching: Pin one large, always-visible meter to the top of every money game (balance left, days to payday, or corpus at 60) and animate it after every choice, red when it falls and gold when it grows. (Inspired by SPENT balance meter and calendar, played first-hand,)", "id": "_killer-playbook--6"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Teach in the result, not before the choice: After every choice, show a two-line 'What just happened' bubble with one concrete rupee figure and one plain-English reason, and keep jargon to a tappable chip such as 'What's an expense ratio?'. (Inspired by SPENT result bubbles, played first-hand, ; The Evolution of Trust,)", "id": "_killer-playbook--7"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Compress decades into minutes: Run 'age 28 to 60 in 3 minutes' rounds where each tap is a year, a market fall happens on screen and the player chooses to stay or stop the SIP. Show the assumption (for example '10% a year average, not guaranteed') beside the growing number. (Inspired by NGPF STAX, and)", "id": "_killer-playbook--8"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Play the villain: Build a 'Be the scammer' round for Slash the Scam where the player writes a fake 'guaranteed 3% a month' WhatsApp pitch from tiles (urgency, fake SEBI badge, celebrity photo), then sees each trick flagged as a red flag to watch for. (Inspired by NGPF Shady Sam, ; Slick Wheels, ; NSE Scambush,)", "id": "_killer-playbook--9"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "End on an identity, not a score: Give each game three to five warm, flattering money archetypes, such as 'The Gullak Guardian' or 'The Calm Compounder', each with a one-line strength and one 'next step'. The archetype becomes the headline of the share card. (Inspired by BitLife ribbons, ; Sorted money-personality quiz, ; How Bad Is Your Spotify,)", "id": "_killer-playbook--10"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Compare me with everyone else: Store anonymous guesses (the Stock Rush Supabase already exists) and show one line on the reveal, such as '7 in 10 mums guessed lower than you', with no names and no personal amounts. (Inspired by NYT 'You Draw It' crowd overlay,)", "id": "_killer-playbook--11"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Juice: numbers that roll, coins that land: Make the reveal number count up from zero over about 1.2 seconds with easing, drop a coin into a gullak on every good choice, and add a short phone vibration (navigator.vibrate) on a loss. Keep sound off until the player taps it on, because most people play in public. (Inspired by Juice it or lose it (GDC Europe 2012), ; Duolingo streak animation result,)", "id": "_killer-playbook--12"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Say how long it takes, then show progress: Put the real time on the start button ('2 min') and a row of 5 to 8 progress dots at the top of every solo game, and design to that time on a mid-range Android phone. (Inspired by The Evolution of Trust, played first-hand, ; NGPF Arcade time labels,)", "id": "_killer-playbook--13"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Desperate lifelines with a hidden price: In Broke by Friday and any budget game, add an always-visible 'Instant loan app' or 'Break the FD' button that solves today's problem, then charges interest, a penalty or stress two rounds later, with a callout explaining why. (Inspired by SPENT 'Need cash?' lifelines, played first-hand,)", "id": "_killer-playbook--14"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Same game, one variable changed: replay to see the difference: On every end screen, offer one specific replay button, such as 'Replay starting 5 years earlier' or 'Replay without the loan app', then show both runs' endings side by side. (Inspired by NGPF PAYBACK, and worksheet)", "id": "_killer-playbook--15"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "End with a sandbox: After the scripted rounds, unlock a single-screen what-if panel with two or three sliders (monthly amount, start age, assumed return, shown as an assumption) and a line chart that redraws live, as the Wealth Hack sandbox already starts to do. (Inspired by Parable of the Polygons, played first-hand, ; The Evolution of Trust,)", "id": "_killer-playbook--16"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "One personal sentence as the answer: Make every IFM calculator headline one sentence in the player's own numbers, such as 'Start Rs 3,000 a month now and Riya's college fund is ready by 2041, assuming 10% a year', with the detailed table folded below. (Inspired by NYT Upshot 'Is It Better to Rent or Buy?' (2014; page not opened, because nytime)", "id": "_killer-playbook--17"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Show your sources and assumptions inside the game: Add a small 'Where do these numbers come from?' link on every reveal that opens a sheet listing each assumption (return rate, inflation, fee) and its source, with 'Education only, not investment advice' on the result card. (Inspired by SPENT sources PDF, ; Parable of the Polygons footnotes,)", "id": "_killer-playbook--18"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "A small daily ritual for return visits: Run a 'Paisa Puzzle of the Day': one same-for-everyone money question at a fixed time, with a localStorage streak counter, so it needs no login, and a Wordle-style share line such as 'Paisa Puzzle #42 ✅✅❌ streak 5'. (Inspired by Duolingo streak data, ; Zerodha Varsity app,)", "id": "_killer-playbook--19"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Local life events, local money: Build scenarios around Indian mums' real moments (school-fee season, Diwali shopping, a sister's wedding, gold vs SIP, a WhatsApp 'stock tip' group), and add one real-world action such as 'check this advisor on SEBI's site' as the final step. (Inspired by SEBI Check QR game at Kolkata Book Fair 2026, ; Financial Football Georgia,)", "id": "_killer-playbook--20"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: Heavy game engine and a long loader. Visa's Financial Football web version loads a Unity WebGL build. In testing on desktop broadband it was still on the Unity loading bar after about 25 seconds. On a mid-range phone opened from WhatsApp, most people would leave first. IFM games should be plain HTML/CSS/JS that is playable within about 2 seconds.", "id": "_killer-playbook--21"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: A fixed landscape stage that breaks in portrait. Played in a 375px portrait viewport, the title card of The Evolution of Trust did not fit on screen, and SPENT's opening interstitial was cropped off the right edge. Both are excellent on desktop and lose phone players at the very first screen. IFM traffic is mostly portrait phones.", "id": "_killer-playbook--22"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: Sign-up, access code or teacher gate before play. Zogo needs a partner credit union's access code. The SIFMA Stock Market Game and Investopedia's simulator need accounts. That suits classrooms and loyalty schemes, but it kills cold traffic from a shared link. Ask for a name or number only after the payoff, if ever.", "id": "_killer-playbook--23"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: Trivia dressed up as a game. Financial Football moves a ball down the field for each correct multiple-choice answer, so the football is decoration and the learning is recall. The best examples (SPENT, STAX, Shady Sam) teach through decisions that have consequences. If the theme can be swapped without changing what is learned, it is not doing any teaching.", "id": "_killer-playbook--24"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: Punishing mistakes so hard that people stop experimenting. A qualitative study of Duolingo describes hearts as a punitive mechanic that pushes learners towards avoiding errors rather than learning from them. In a money game the wrong choice is where the lesson is, so let players fail, see why, and replay instantly.", "id": "_killer-playbook--25"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: Prizes as the main reason to play. NSE's investor-week games gave Rs 500 vouchers to 50 winners a day, Zogo pays gift cards, and CRED runs jackpots. Prizes attract prize-hunters whose interest ends with the prize, and they add cost and legal complexity. IFM's reward should be the insight and the share card.", "id": "_killer-playbook--26"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: Leaderboards for the highest short-term portfolio. In the SIFMA Stock Market Game and Investopedia-style contests, the highest portfolio after about 10 weeks wins, which rewards concentrated gambling, the opposite of IFM's message. Naming real stocks would also breach IFM's no-specific-securities rule. Use generic asset types and reward staying invested.", "id": "_killer-playbook--27"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: A lecture or pre-test before the fun. Banzai starts with a pre-test, which is good for teachers' data but means a cold visitor's first experience is an exam. The Evolution of Trust's text intro works only because it is about 100 words and ends in 'let's play a game'. Put any check-what-you-learned step after the payoff and make it optional.", "id": "_killer-playbook--28"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: A share that spoils the game or exposes the player. Wordle's grid succeeded because it 'just leaves the colours', with no answer and no private data. A money-game share card that prints someone's salary, debt or savings is embarrassing to post and will not be shared. Share the archetype, the score and the dare, never the player's real numbers.", "id": "_killer-playbook--29"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Avoid: Doom with no way forward. Poverty and debt simulations can end on a gut-punch (SPENT's 'I can't do this' button leads to a donation page). That works for a charity appeal, but for mums who may already feel money anxiety, ending on shame drives them away. This one is a judgement call; there is no hard evidence either way. Always end with one doable next step and a replay.", "id": "_killer-playbook--30"}], "key": "_killer-playbook"}]}, {"group": "sitewide", "games": [{"slug": "_every-game", "title": "Every game (one shared change, applied everywhere)", "url": "https://games.investingformummies.com/", "file": "all game pages", "kind": "site", "audience": "Both", "verdict": "Every game is a dead end today: none of the 21 checked game pages links back to the games homepage, to the IFM site, or to booking, and none can be shared.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Navigation", "priority": "High", "effort": "M", "text": "Add one slim shared top bar to every game: IFM logo (goes to the games homepage), 'All games' and 'investingformummies.com' links — built once and dropped into every page so it never drifts.", "id": "_every-game--1"}, {"area": "Share", "priority": "High", "effort": "M", "text": "Add one shared 'Share on WhatsApp' button component that every game can call with its own message (the player's result + a hook + the game's link); per-game wording is listed under each game below.", "id": "_every-game--2"}, {"area": "Conversion", "priority": "High", "effort": "M", "text": "Add one shared end-of-game card: 'That was a few minutes of the course' + 'Find your batch' (register.investingformummies.com) + 'Play another' — gentle, after the result, never mid-game.", "id": "_every-game--3"}, {"area": "Navigation", "priority": "Med", "effort": "S", "text": "Stop opening games in a new browser tab from the homepage once every game has its own way back; new tabs pile up on phones.", "id": "_every-game--4"}, {"area": "Speed", "priority": "High", "effort": "L", "text": "Pre-build the 9 games that compile their code on the visitor's phone (Inflation Calculator, Market Pulse, IPO Bonanza, My First Trade, Debt Boss, Asset Boss, Swayamvar, Stock Rush PRO, Stock Rush) and switch off the slow 'developer' React build.", "id": "_every-game--5"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Turn on browser caching for the games site (images, scripts, styles), so returning players don't re-download everything — www already does this.", "id": "_every-game--6"}, {"area": "Share", "priority": "Med", "effort": "M", "text": "Give each game its own share picture (a screenshot of the game) instead of the one generic games image, so WhatsApp previews show the actual game.", "id": "_every-game--7"}, {"area": "Conversion", "priority": "Med", "effort": "M", "text": "Track game_started, game_completed and share_clicked in PostHog for every game, so you can see which games people finish and which ones lead to bookings.", "id": "_every-game--8"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Wherever a game projects future money, show the assumed return on screen (e.g. 'assumes 12% a year — illustrative, not guaranteed'); the general disclaimer line alone isn't enough.", "id": "_every-game--9"}], "key": "_every-game"}, {"slug": "_old-address", "title": "Old ifm-deploy.vercel.app address", "url": "https://games.investingformummies.com/", "file": "several", "kind": "site", "audience": "Both", "verdict": "The old Vercel address still reaches players in share messages and the Swayamvar join code; it works, but looks unbranded and untrustworthy on a phone.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Swayamvar's join QR code sends players to ifm-deploy.vercel.app/swayamvar — switch it to games.investingformummies.com/swayamvar (file swayamvar/ui-common.js).", "id": "_old-address--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Fund YOUR Goal, Goal Tracker and the classic hub's share messages say 'Plan yours free: ifm-deploy.vercel.app' — change to the games address.", "id": "_old-address--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The classic hub loads its embedded games from ifm-deploy.vercel.app — switch to relative links so they load from the same site.", "id": "_old-address--3"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Move the images still pulled from ifm-deploy.vercel.app (Crorepati Lane, Money Map, Quiz, Sapno Ka Ghar, Slash the Scam, MF Manager art) to relative paths.", "id": "_old-address--4"}], "key": "_old-address"}, {"slug": "_games-home", "title": "Games homepage + All games", "url": "https://games.investingformummies.com/", "file": "index.html, all-games.html", "kind": "site", "audience": "Both", "verdict": "Three different 'homes' (homepage, All games, classic hub), emoji instead of real game art, and leftover mockup text on the live page.", "load": "31 KB page; fast", "share_idea": "", "share_moment": "", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Remove the leftover design-file text 'After every game, one line (sample)' from the live homepage.", "id": "_games-home--1"}, {"area": "Layout", "priority": "High", "effort": "L", "text": "Redo the homepage as ONE hub with three sections — Play (solo games), Tools (calculators), In class (host screens) — replacing both the homepage and the All games page; show 2–3 design options first.", "id": "_games-home--2"}, {"area": "Layout", "priority": "High", "effort": "M", "text": "Replace the emoji on game tiles with real screenshots or illustrations of each game, so people can see what they're about to play.", "id": "_games-home--3"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "Add filters people actually think in: topic, time to play (2 / 5 / 10 min), Mums or Gen Next, play alone or in class.", "id": "_games-home--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Pick a finished, polished game as 'Today's game' and rotate it weekly, instead of a fixed one.", "id": "_games-home--5"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Make the game count consistent everywhere ('50+ games and tools') across www, the games homepage and All games.", "id": "_games-home--6"}, {"area": "Navigation", "priority": "Med", "effort": "L", "text": "Retire the classic hub once its calculators and beta games have their own pages; redirect /classic to the new hub.", "id": "_games-home--7"}], "key": "_games-home"}, {"slug": "_tools", "title": "Tools section (calculators)", "url": "https://games.investingformummies.com/tools", "file": "new", "kind": "site", "audience": "Mummies", "verdict": "The calculators are the pages people search Google for, but they're buried inside the 3 MB classic hub. Give them their own section.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Layout", "priority": "High", "effort": "L", "text": "Create games.investingformummies.com/tools with one fast page per calculator (SIP, SWP, retirement, education, holiday, budget, asset allocation, dividend, goal planner, goal tracker) — a section, not a new subdomain, so it's one site, one analytics, one Google ranking.", "id": "_tools--1"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Give each tool a 'Learn this properly in class' link and a WhatsApp 'share my plan' button.", "id": "_tools--2"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Add the tools to the sitemap with their own titles and descriptions so Google can find 'SIP calculator' etc.", "id": "_tools--3"}, {"area": "Navigation", "priority": "Med", "effort": "S", "text": "Link 'Free money tools' from www's menu and footer as well as from the games hub.", "id": "_tools--4"}], "key": "_tools"}]}, {"group": "solo-a", "games": [{"slug": "hidden-fortunes", "title": "Hidden Fortunes", "url": "https://games.investingformummies.com/hidden-fortunes", "file": "hidden-fortunes-2.html", "kind": "solo", "audience": "Mummies", "verdict": "A strong, relatable hook (your salon, Swiggy and coffee money turned into crores) with a nice result card and an image share already built in. What holds it back as the featured game: the screen never says 'tap the cards', the copy promises 'half' but uses the full amount, and on a phone the hero spills sideways and 1.5 MB of logo images load just to decorate sliders.", "load": "~1.8 MB up front: 61 KB page + a 1 MB logo PNG used as the slider knobs + a 0.5 MB logo PNG in the hero + html2canvas (~200 KB); 50 large emoji float behind the page non-stop", "share_idea": "Already has a WhatsApp button; sharpen its text to: 'My ₹10,000 a month of Swiggy + coffee could be ₹3.5 Cr in 30 years (at an assumed 12%). What are YOUR habits worth? 👉 games.investingformummies.com/hidden-fortunes' and point it at the clean /hidden-fortunes link instead of /hidden-fortunes-2.html.", "share_moment": "Result screen, directly under the big 'X× what you put in' panel, before the Download button.", "items": [{"area": "Copy", "priority": "High", "effort": "S", "text": "The intro and tip both say 'what if even half went into a SIP?' but the total uses the full amount of every habit picked; either halve the total or change the words to 'what if this money went into a SIP', so the promise matches the maths.", "id": "hidden-fortunes--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "On first load nothing is selected and the Reveal button is greyed out with no hint why; add a short line like 'Tap the habits you spend on 👇' (or pre-select two cards) so a WhatsApp visitor knows what to do in the first 3 seconds.", "id": "hidden-fortunes--2"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "On a 375px phone the hero subtitle runs off the right edge and the page scrolls sideways; let the subtitle wrap and hide the 'Scan to Play' QR button on phones (people are already on their phone, so a QR code is useless there and steals the most valuable space).", "id": "hidden-fortunes--3"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "The slider knobs use a 1 MB round-logo picture and the hero uses a 0.5 MB logo; swap both for small (under 25 KB) versions so the homepage's featured game opens fast on mobile data.", "id": "hidden-fortunes--4"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "The sliders go from ₹0 to ₹1–3 lakh a month in ₹1,000 steps, so on a phone the knob barely moves between ₹2,000 and ₹6,000; cap each slider at a realistic monthly spend (say ₹20,000–₹50,000) or add –/+ buttons so mums can set their real number.", "id": "hidden-fortunes--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The 50 big floating emoji keep moving behind the results and sit under the 'Redirect ₹10,000/month…' sentence, making it hard to read; slow them down and fade them out once the result is shown (this also saves phone battery).", "id": "hidden-fortunes--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add one honest 'in today's money' line under the 30-year figure (e.g. '₹3.5 Cr in 2056 buys roughly what ₹60 L buys today at 6% inflation'); it keeps the wow but makes the lesson trustworthy and links naturally to the Inflation Calculator.", "id": "hidden-fortunes--7"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Let the player choose how long (10/20/30 years) or what share to redirect (25/50/100%) on the result screen, so they can play with it again instead of only 'Try Different Habits'.", "id": "hidden-fortunes--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Drop '2.0' from the title ('Hidden Fortunes 2.0' means nothing to a first-time visitor) and use one name everywhere: page title, hero and share text.", "id": "hidden-fortunes--9"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "The habit cards are tap-only boxes, not real buttons, so keyboard and screen-reader users cannot select them; make each card a proper button that announces 'selected'.", "id": "hidden-fortunes--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the result, add a gentle line such as 'Want to know where a SIP actually goes and how to start one? Find your batch →' linking to register.investingformummies.com; right now the result ends with only Reset.", "id": "hidden-fortunes--11"}], "key": "hidden-fortunes"}, {"slug": "3-buckets", "title": "3 Buckets", "url": "https://games.investingformummies.com/3-buckets", "file": "3-buckets.html", "kind": "solo", "audience": "Mummies", "verdict": "Beautiful buckets, satisfying fly-in animations and genuinely useful 'why this bucket' explanations. What holds it back: it downloads about 6 MB before you can play, and on a phone the three buckets are stacked one under another so you scroll on every single item.", "load": "~6.3 MB up front: 2.6 MB autoplaying hero video + three 0.65 MB bucket PNGs + a 1 MB round-logo PNG (shown at 28–40px) + a 0.5 MB wide logo that loads and is immediately thrown away + 150 KB marble texture", "share_idea": "'I scored 11/12 sorting money into Emergency, Stability and Growth buckets 🪣 Can you beat me? 👉 games.investingformummies.com/3-buckets'", "share_moment": "Final screen, right under the score ring and 'Bucket Master!' title.", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "Why it is 4.5–6 MB: the decorative hero video (2.6 MB, 1280×720 with a sound track it never plays) autoplays on arrival, each bucket picture is a 650 KB PNG shown at about 230px wide, and two logo PNGs total 1.5 MB; shrink the buckets to ~40 KB WebP each, use small logos, and show only the 60 KB poster image on phones (play the video, re-encoded under 500 KB with no audio, only on desktop) to get the page under 500 KB.", "id": "3-buckets--1"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the buckets stack vertically (Growth starts about 1,100px down, below the fold), so the item and the right bucket are never on screen together and the fly-in animation happens off-screen; put the three buckets side by side as smaller tiles (or as three big labelled buttons) directly under the item card.", "id": "3-buckets--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Items name real brands as examples (SBI savings account; Reliance, TCS, HDFC Bank inside the Nifty item; L&T and Mahindra for bonds); replace them with generic wording ('a bank savings account', 'India's 50 biggest companies') so nothing reads like a recommendation.", "id": "3-buckets--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Rates are stated as current facts (PPF ~7.1%, Sukanya ~8.2%, savings ~2.7%, Nifty '12–14%'); add 'rates as of <month/year>' and change the Nifty line to 'has historically… not guaranteed', since these change every quarter.", "id": "3-buckets--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The government has stopped issuing new Sovereign Gold Bonds, so a mum can no longer act on that item; swap it for 'Gold ETF / Gold mutual fund' or reword it as 'gold held for 8+ years'.", "id": "3-buckets--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The '🏠 Back to Main Menu' button just restarts this game's own start screen instead of going to the games page, and the start screen promises '🏆 Earn badges' but there are no badges; fix the button's destination and remove or deliver the badges.", "id": "3-buckets--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The final screen says 'discuss with your group before playing again' — leftover classroom wording; for a solo player say something like 'Tap any item to see why it belongs there' or 'Play again — the items change each time'.", "id": "3-buckets--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "A wrong answer takes about 3 seconds of animation before the explanation pops up, then needs a tap, for each of 12 items; cut the wait to about 1 second so the pace stays snappy on a phone.", "id": "3-buckets--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The pop-up and item text use projector-sized fonts (set for classroom screens) which make the 'why' box long on a phone; use smaller sizes under 600px wide so the Next button stays visible without scrolling.", "id": "3-buckets--9"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Only one item (Sukanya) ever has two right answers; add one or two more genuinely 'it depends' items (e.g. a hybrid fund) so the 'tricky items' promise on the start screen pays off and the game teaches nuance.", "id": "3-buckets--10"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "The buckets are tap-only pictures, not buttons, so keyboard users cannot play; make each bucket a real button with its name read out.", "id": "3-buckets--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the 'Key Takeaway' on the final screen add a soft 'Want help filling your own three buckets? Find your batch →' link to register.investingformummies.com.", "id": "3-buckets--12"}], "key": "3-buckets"}, {"slug": "one-crore-ladder", "title": "₹1 Crore Ladder", "url": "https://games.investingformummies.com/one-crore-ladder", "file": "one-crore-ladder.html", "kind": "solo", "audience": "Mummies", "verdict": "A clear guess → reveal → 'cost of waiting' story that lands the compounding lesson well. What holds it back: the answer is spoiled before you guess, the numbers on the page disagree with each other, and on a phone the ladder bars shrink to dots.", "load": "117 KB page + Chart.js (~200 KB); fast", "share_idea": "'₹10,000 a month for 25 years → about ₹1.9 Cr at an assumed 12% (I guessed ₹50 L 🙈). How close can you guess? 👉 games.investingformummies.com/one-crore-ladder'", "share_moment": "Right after the ladder finishes (when the ₹1.9 Cr step appears), and again at the end under the 'Cost of Waiting' chart.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The locked 'One More Question…' card underneath is readable while you are still guessing and says 'You just watched ₹10K/month grow to ₹1.9 Crore'; hide that card's text until it unlocks so the guess is a real guess.", "id": "one-crore-ladder--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The numbers disagree: the ladder says ₹1.90 Cr at 25 years but the waiting chart shows ₹1.88 Cr for the same 25 years, and the bonus answer says ₹3.53 Cr at 30 years while the chart shows ₹3.49 Cr; use one formula everywhere so a careful mum doesn't lose trust.", "id": "one-crore-ladder--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Option C ('Over ₹1.5 Crore — compounding is powerful!') gives itself away with its cheerleading tone; make all three options plain numbers so players actually have to think.", "id": "one-crore-ladder--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The game is called '₹1 Crore Ladder' but never marks the moment you cross ₹1 crore (it happens just after year 20); add a gold '₹1 Crore reached in year 20!' rung or flash — that is the payoff the title promises.", "id": "one-crore-ladder--4"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "On a phone the 'Growth' bar column in the ladder is squeezed to a dot, and the 'Cost of Waiting' chart is tiny with overlapping 'Returns: ₹6.0…' labels; drop the mini bars on phones and give the chart more height with labels outside the bars.", "id": "one-crore-ladder--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "If you guess wrong, the feedback never tells you the real number ('The answer will surprise you!'); state '₹30 L grows to about ₹1.9 Cr' in the wrong-answer message too.", "id": "one-crore-ladder--6"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "After the first guess the ladder unlocks but the page doesn't scroll to it, so on a phone it looks like nothing happened; scroll down to the ladder automatically as the later steps already do.", "id": "one-crore-ladder--7"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "'Start at 25 / 30 / 35' assumes a young player while most Mummies are 30–45; let her enter her own age (or show 30/35/40) so the 'cost of waiting' is about her.", "id": "one-crore-ladder--8"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "The 12% is labelled 'Expected Return'; call it 'Assumed return (not guaranteed)' on the chips at the top, since the footnote disclaimer is far below.", "id": "one-crore-ladder--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero text sits off-centre to the right because space is reserved for a logo that never appears; remove that left padding or add the logo.", "id": "one-crore-ladder--10"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Points are counted in the background but never shown; either show a small '2/2 correct' at the end or remove the scoring so the ending has a clear finish.", "id": "one-crore-ladder--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Below the 'Emotional Takeaway' add 'Ready to start your own ladder? Find your batch →' linking to register.investingformummies.com, above Play Again.", "id": "one-crore-ladder--12"}], "key": "one-crore-ladder"}, {"slug": "double-or-nothing", "title": "Double or Nothing", "url": "https://games.investingformummies.com/double-or-nothing", "file": "double-or-nothing.html", "kind": "solo", "audience": "Mummies", "verdict": "A quick, clean 5-round timed quiz that teaches one genuinely handy trick (the Rule of 72). What holds it back: the rules on screen don't match how it actually scores, the right answer is almost always the middle one, and with the same 5 questions every time there is no reason to play twice.", "load": "124 KB page (mostly unused styles), no libraries; fast", "share_idea": "'I scored 13/15 on the Rule of 72 speed test ⏱️ — how fast can you tell when your money doubles? 👉 games.investingformummies.com/double-or-nothing'", "share_moment": "Score screen, right under the big score and verdict ('Money Genius!').", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The rules say '15 seconds per round' and '3 pts under 5 sec, 2 pts under 10 sec', but the timer actually runs 30 seconds and gives 3 pts under 10 sec and 2 pts under 20 sec; make the rules and the timer agree.", "id": "double-or-nothing--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The correct answer is the middle option in 4 of 5 rounds and the Round 4 answer literally says 'doubles in half the time'; shuffle option order and write neutral options so players must do the 72 ÷ rate sum.", "id": "double-or-nothing--2"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "There are only 5 fixed questions, so a replay is identical; add a pool of 15–20 (different rates, prices doubling, 'what rate do I need to double in 6 years?') and pick 5 at random each time.", "id": "double-or-nothing--3"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Round 5 names a real index ('Nifty 50 index fund earning 14% per year') and says it 'has historically returned ~14%' so 'your money doubles roughly every 5 years'; use a generic 'equity fund at an assumed 12%' and add 'past returns are not guaranteed'.", "id": "double-or-nothing--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Round 1's 9% FD is higher than any bank FD a mum will see today; use realistic rates (7% FD) so the example feels real, and mention once that the rule is an approximation.", "id": "double-or-nothing--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The formula hint is shown on every round, so it's a reading test, not a memory test; show it in rounds 1–2, then hide it behind a 'Need a hint?' tap that costs a point.", "id": "double-or-nothing--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The name 'Double or Nothing' suggests a gamble (risking everything), which is the opposite of the lesson; consider 'When Will It Double?' or add a gentle 'double or nothing' bonus round that matches the name.", "id": "double-or-nothing--7"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "The finish is a list of rounds; end on a personal punchline instead, e.g. 'Your ₹1 lakh FD at 7% doubles in ~10 years; at 12% in ~6 years', with an input for her own amount.", "id": "double-or-nothing--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero text sits off-centre to the right because space is reserved for a logo that never appears; remove that left padding or add the logo.", "id": "double-or-nothing--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On the score screen add 'Want to learn where your money can actually double faster? Find your batch →' linking to register.investingformummies.com.", "id": "double-or-nothing--10"}], "key": "double-or-nothing"}, {"slug": "rice-and-chessboard", "title": "The Rice & the Chessboard", "url": "https://games.investingformummies.com/rice-and-chessboard", "file": "chess-compounding.html", "kind": "solo", "audience": "Mummies", "verdict": "A lovely, light (24 KB) retelling of a classic story with great 'sack → truck → warehouse' milestones and a strong ending. What holds it back: the story itself is never told up front, on a phone the Next button is below the screen so every tap needs a scroll, and two of the ending's 'wow' facts are wrong.", "load": "24 KB page, no libraries; very fast", "share_idea": "'One grain of rice, doubled 64 times, is more rice than the world grows in 900 years 🌾 Now imagine your money doing that. 👉 games.investingformummies.com/rice-and-chessboard'", "share_moment": "End screen ('The King Ran Out of Rice'), under the 'So what does this mean for your money?' box.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The story (a wise man asks the king for 1 grain on the first square, doubled on every square) is never explained before you start; add a 2-line intro card with the deal and a 'Do you accept?' button so the player knows what is being promised.", "id": "rice-and-chessboard--1"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the 'Next Square' button sits about 950px down, below the screen, so each tap means scrolling down and the board scrolls out of view; pin the Next / Auto-play buttons to the bottom of the screen on phones.", "id": "rice-and-chessboard--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Two ending facts are wrong: 460 billion tonnes of rice is LESS than a single big mountain, not 'more than every mountain range in India', and 8 billion people eating 200 g a day would get through it in about 790 years, not 'over 2,000 years'; correct or replace these cards.", "id": "rice-and-chessboard--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The ending says 'good Indian index funds have averaged 12–15% a year for decades' as a fact; soften to 'equity has historically returned around 12% (not guaranteed)' and label the ₹10,000 → ₹12.8 L example as an assumption.", "id": "rice-and-chessboard--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add a quick prediction before play ('Which square fills a whole sack of rice?' or 'Would you take this deal or ₹1 crore?') so the player has something at stake when the numbers explode.", "id": "rice-and-chessboard--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The big counter switches to Western words (Million, Billion, Quintillion) and the board shows '10^15', while the milestones use lakh and crore; use lakh/crore (or 'crore crore') consistently and drop the '10^' notation — Mummies think in lakhs.", "id": "rice-and-chessboard--6"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The numbers inside the squares are about 6px tall on a phone and unreadable; show them only on bigger screens and let the big counter and milestone text carry the story on mobile.", "id": "rice-and-chessboard--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The fill bar shows '33%' at square 22 (on a 'log scale') which reads as a third of the rice, when it is a tiny fraction; replace the % with the milestone name ('sack') and drop the 'log scale' label.", "id": "rice-and-chessboard--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "It uses a different gold (#f6c842), an all-dark theme and no IFM logo, unlike the other games; bring it onto the brand gold and add the logo so a shared link is recognisably IFM.", "id": "rice-and-chessboard--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After 'Start early.' on the end screen, add 'Want to put the chessboard to work on your own money? Find your batch →' linking to register.investingformummies.com, and a link to Double or Nothing as the natural next game.", "id": "rice-and-chessboard--10"}], "key": "rice-and-chessboard"}, {"slug": "nav-pizza", "title": "NAV Pizza", "url": "https://games.investingformummies.com/nav-pizza", "file": "nav-pizza.html", "kind": "solo", "audience": "Mummies", "verdict": "The pizza-slice metaphor is a smart, memorable way to bust the 'low NAV = cheap fund' myth, and the explanations are excellent. What holds it back: it is one very long page (about 8½ phone screens) with nine questions, no progress counter and no ending, and the right answer is usually the longest, most sensible-sounding option.", "load": "143 KB page, no libraries; fast to load but a 6,900px-long page on a phone", "share_idea": "'Quick test: Fund A's NAV is ₹20, Fund B's is ₹100 — which is cheaper? 🍕 I got 8/9 on the NAV myth quiz. 👉 games.investingformummies.com/nav-pizza'", "share_moment": "A new end card after the last question showing her score (e.g. '8/9 myths busted').", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "There is no ending — after question 9 nothing happens, and the points are counted but never shown; add a final card with her score, the three key lessons (NAV ≠ price tag, dividends come out of NAV, dips mean more units) and Play Again.", "id": "nav-pizza--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "All nine questions sit on one long page with greyed-out cards below; show one question at a time with a '3 of 9' progress bar so a phone player knows how far she has to go.", "id": "nav-pizza--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The correct answer is almost always the longest, most balanced-sounding option (C or B); rewrite options to similar lengths and vary where the right one sits, so players learn rather than spot the pattern.", "id": "nav-pizza--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "In View 2 the ₹100 fund is simply given the higher return, which can leave a beginner thinking 'higher NAV = better'; add a one-line flip ('…and if the ₹20 fund had earned 15%, it would win — the NAV never decides') to close that loophole.", "id": "nav-pizza--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The hero puts white text on a pale gold background, which is hard to read in sunlight, and sits off-centre because of space reserved for a missing logo; use the navy or a darker gold behind the title and centre it.", "id": "nav-pizza--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Use today's term 'IDCW (formerly Dividend) plan' in the dividend questions, because that is what a mum will see on her fund app and statement.", "id": "nav-pizza--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Fix the garbled sentence 'The total value stayed ₹1,000 at the start' in View 1 (e.g. 'Both started at ₹1,000 and both ended at ₹1,100').", "id": "nav-pizza--7"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "Both 'pizzas' are the same emoji, so the visual doesn't show the idea; draw Fund A as a pizza cut into 50 thin slices and Fund B into 10 big ones — same pizza, different slicing.", "id": "nav-pizza--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The card titled 'Now That You Know the Truth About NAV…' looks like the last question but five more follow; retitle it so the structure doesn't feel endless.", "id": "nav-pizza--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On the new end card add 'Want to read a fund factsheet with confidence? Find your batch →' linking to register.investingformummies.com.", "id": "nav-pizza--10"}], "key": "nav-pizza"}, {"slug": "radhas-mission", "title": "Radha's Money Mission", "url": "https://games.investingformummies.com/radhas-mission", "file": "radhas-mission.html", "kind": "solo", "audience": "Mummies", "verdict": "A relatable 'help a working mum' case study with a good variety of question types (calculate, match, choose). What holds it back: real fund names presented as the 'perfect' pick, a replay bug that makes the game freeze at question 3, and it opens with the hardest maths question.", "load": "132 KB page + Chart.js (~200 KB) that the game never uses", "share_idea": "'I helped Radha (32, Mumbai) sort out her mutual funds and scored 95/120 ⭐ Can you be a Gold Star Mum? 👉 games.investingformummies.com/radhas-mission'", "share_moment": "'Mission Complete!' screen, under the score ring and badges.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "Questions name real funds — 'HDFC Balanced Advantage Fund… 25% returns last year', 'Axis Long Term Equity', 'HDFC Mid-Cap Opportunities', 'SBI Small Cap' — and call each the 'perfect fund' for a friend; replace with made-up fund houses (e.g. 'Sunrise Small Cap Fund') so it can't read as a recommendation.", "id": "radhas-mission--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "After 'Try Again', tapping any answer on questions 3, 4, 6 and 7 does nothing (verified in the browser), so a replaying player gets stuck at question 3; the same fault means the 'Concept Queen' badge can never be earned — fix how those questions remember they were answered.", "id": "radhas-mission--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Question 4 teaches 'always choose Direct, the RM ticks Regular for commission', but question 8's 'correct' answer puts a retired mum in a Regular-plan mid-cap fund for income; change Deepa's mum's an
