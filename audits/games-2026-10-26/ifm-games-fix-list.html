, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Count-up] Make the payoff a 'Likes vs Results' chart. Plot all 10 posts as dots, likes along the bottom and what ₹2,000 became going up, with the player's picks ringed. It should show at a glance that the loudest posts did worst. Headline it with one sentence: 'The most-liked post in your feed turned ₹2,000 into ₹0. The least-liked turned it into ₹3,650.' This becomes the screenshot. (Benchmark #17 One personal sentence as the answer — NYT; #11 Compare me with everyone else)", "id": "killer-swipe-right-sip--2"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Personal best] Add 'Today's Feed #N': the 10 posts are picked by today's date, so every player gets the same feed that day and shares can be compared. Save a streak and a best radar score on the phone ('🏆 Best: 5/5 · streak 3'). Keep the random feed as 'Endless scroll' for replays. (Benchmark #19 A small daily ritual for return visits — Wordle)", "id": "killer-swipe-right-sip--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add a bonus round, 'Be the Finfluencer'. The player builds a hype post from tiles (a fake 'guaranteed' claim, a countdown, 'DM me', a screenshot of profits, a celebrity-style photo) and watches the fake likes climb. Then every tile is stamped with the red flag it plants in a real viewer's head. Writing the trick yourself is the strongest way to remember it, and the post the player makes is funny enough to forward. (Benchmark #9 Play the villain — NGPF Shady Sam, NSE Scambush)", "id": "killer-swipe-right-sip--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Feedback callout + off-by pill] End with one specific replay: 'Run it back with the red-flag goggles'. It replays the same feed with the tells highlighted on each post ('🚩 deadline', '🚩 guaranteed', '🚩 send to my UPI') and then shows both runs' results side by side, so the player sees how much the checklist alone changes the outcome. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-swipe-right-sip--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Sound + Tokens: Midnight] Keep the feed look, but put it on the IFM midnight-and-gold family so a shared screenshot clearly reads as IFM: gold for 'grew', coral for 'shrank', and the IFM round mark in the top bar. Add juice: a whoosh on each swipe, a coin chime when a receipt is green, a deflating thud and a short buzz (navigator.vibrate) for a ₹0 scam, and confetti only for a perfect 5/5 radar. The mute button is always visible. (Benchmark #12 Juice — 'Juice it or lose it')", "id": "killer-swipe-right-sip--6"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Tighten the phone flow so the first screen holds only the title, the one-line dare, the '2 MIN' tag and 'Open your feed →'. Move 'How to play' into a 3-second animated demo card that wiggles left and right on the first post. On the swipe screen keep the card and both buttons inside 844 px, with the buttons at least 56 px tall in the thumb zone. (Benchmark #3 First tap is the first decision — SPENT; #13 Say how long it takes — The Evolution of Trust)", "id": "killer-swipe-right-sip--7"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] Replace 'My ₹10,000 became X' in the share with a spoiler-free row of 10 squares (💚 good pick, 🚩 fell for a flag, ⬜ skipped), the radar score and the title. Offer a 9:16 Story card of the 'Likes vs Results' chart. Both carry the line 'made-up funds and results to show the idea' and link to the game, and the page gets its own preview image: 'Your feed vs your future — 120K likes, ₹0 left.' (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-swipe-right-sip--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Make the result titles warmer and more personal: 'BORING GENIUS', 'STEADY HAND', 'HYPE CURIOUS' and 'ALGORITHM'S FAVOURITE' (instead of 'HYPE VICTIM', which reads as an insult to forward). Each gets one tailored line naming the exact flag that caught the player, for example 'The countdown timer got you twice. Real investing never has a Friday deadline.' (Benchmark #10 End on an identity, not a score — How Bad Is Your Spotify)", "id": "killer-swipe-right-sip--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Keep every fund fictional and generic, and make sure the bonus round and share card never name a real fund house, scheme or influencer handle. Add a tappable 'Where do these numbers come from?' sheet on the receipts screen: 'Made-up 5-year results to show the idea, loosely based on how these fund types have behaved. Real funds go up and down, and nothing is guaranteed.' (Benchmark #18 Show your sources and assumptions inside the game — SPENT sources PDF)", "id": "killer-swipe-right-sip--10"}], "key": "killer-swipe-right-sip"}, {"slug": "killer-asset-boss", "title": "Asset Boss — killer upgrade", "url": "https://games.investingformummies.com/asset-boss", "file": "asset-boss.html", "kind": "solo", "audience": "Both", "verdict": "Make Asset Boss the 'one mix, three futures' game. The player drops ten ₹1 lakh coins into six jars, guesses where their mix ends up, then watches the same mix run through three different 3-year market stories at once (boom-crash-recovery, a long steady rise, a slow grind). It ends on a money-DNA card. The screenshot moment is the Mix Mirror: their mix's range of outcomes drawn as a short calm bar next to the 'all-in crypto' mix's wild bar, under their archetype name, which shows that diversification buys a narrower range of outcomes rather than the top score.", "load": "", "share_idea": "🧺 My money DNA: The Calm Spreader — my mix survived a boom, a crash AND a slow year without blowing up. What's yours? games.investingformummies.com/asset-boss  _(Made-up returns in three invented market stories. Not a promise, education only.)_", "share_moment": "Same ₹10 lakh, three different futures. Build one mix and see if it survives all three. 4 minutes.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Core loop: ten ₹1 lakh coins, six jars (Stocks, Mutual fund, Gold, FD, Real estate, Crypto). Tap a jar to drop a coin in, with a clink. That replaces the 40 taps of ₹25,000 with ten decisions, and the donut fills as coins land. Move the 'Teacher Checkpoint' and discussion screens to a ?mode=class link, so a WhatsApp visitor goes straight from coins to the simulation. (Benchmark #3 First tap is the first decision — SPENT)", "id": "killer-asset-boss--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] [Kit: Money input] Add two guesses. Before Year 1: 'Where will your ₹10 lakh be after 3 years?' as a slider from ₹5 L to ₹20 L. Before the big lesson: 'Which jar did best over the 3 years?' Reveal each over the guess with an off-by pill. The 'Gold and FD beat Stocks and Crypto' surprise lands far harder when the player had just bet on crypto. (Benchmark #1 Guess first, then reveal — NYT You Draw It)", "id": "killer-asset-boss--2"}, {"area": "Game design", "priority": "High", "effort": "L", "text": "Build the Mix Mirror finale: run the player's exact mix through three invented market stories (boom-crash-recovery as today, 'steady climb', 'slow grind'), and draw each mix's outcome range as a horizontal bar. Show the player's mix next to 'All FD', 'Even split' and 'All-in crypto'. The lesson becomes visible: no mix wins every story, and spread-out mixes have the narrowest range. This builds on the earlier audit's 'different market stories' fix. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-asset-boss--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Count-up] [Kit: Sound] [Kit: Life bar / timeline] Make each year a 10-second beat, not a table: a timeline across the top (Year 1 · 2 · 3), the jars rise or drain with a count-up of the total, crypto's jar visibly overflows in the bull run and then cracks in the crash, and gold glows in the crash. Show one 'what just happened' line with a rupee figure for the player's biggest jar, then the year's question. (Benchmark #12 Juice — Juice it or lose it)", "id": "killer-asset-boss--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Result rows] [Kit: Personal best] Upgrade 'Investor DNA' into a share-ready identity card with five warm archetypes: The Calm Spreader, The Gullak Guardian (FD-heavy), The Gold Keeper, The Thrill Seeker, The Basket Believer (mutual-fund-heavy). Each gets one strength, one blind spot and one next step ('Try the same mix with 3 coins moved from FD to a mutual fund'). Store the best (narrowest-range) mix in localStorage as a personal best. (Benchmark #10 End on an identity — BitLife ribbons / Sorted money personality quiz)", "id": "killer-asset-boss--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "End with a sandbox: after the archetype, unlock 'Play with it', with six coin jars still editable and the three-story range bars redrawing live as coins move. That is the natural replay, because people will try 'what if I'd skipped crypto?' on their own. Label the sandbox 'Invented market stories, not forecasts'. (Benchmark #16 End with a sandbox — Parable of the Polygons)", "id": "killer-asset-boss--6"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "[Kit: Top bar] [Kit: Primary / sticky / outline / WhatsApp buttons] Fit each stage into one 390×844 screen: the jars in a 3×2 grid in the top half, a sticky coin tray and 'Run 3 years →' button in the thumb zone, and the 'remaining' figure turned into the coin tray itself (coins left = money left). Drop the duplicated page banner above the game frame and the 'PART 1 / PART 2' pills for solo players.", "id": "killer-asset-boss--7"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "Replace emoji jars (📈 🧺 🥇 ₿) with one set of illustrated glass jars in brand colours, each with a small outline icon and a written label. Keep the jar art at or under 30 KB each as WebP. The coins are the only gold; use coral for loss and teal for growth, as in the Wealth Hack. (Quality bar §1.4 Imagery)", "id": "killer-asset-boss--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text)] [Kit: Share image card] The end screen's primary button is 'Share my money DNA' with the line above. The Story card shows the archetype name in Lora, the six-jar mix as a small donut (percentages only, no rupees), the Mix Mirror bar, and 'Invented market stories · education only'. A secondary button, 'Dare a friend to beat my range', opens the same text with 'Can your mix stay calmer?' added. (Benchmark #2 Spoiler-free result card — Wordle / Spotify Wrapped)", "id": "killer-asset-boss--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "[Kit: Assumption footer] Add a 'What's crypto?' chip: 'Not regulated like shares or mutual funds in India; included here to show what big swings feel like.' Make sure no archetype or 'next step' says any asset is needed ('every portfolio needs some gold' becomes 'many families keep a little gold because it has often held up in crashes'). Print 'Invented returns, not a forecast' on every year screen, not only in the footer.", "id": "killer-asset-boss--10"}], "key": "killer-asset-boss"}, {"slug": "killer-short-squeeze", "title": "The Short Squeeze — killer upgrade", "url": "https://games.investingformummies.com/short-squeeze", "file": "short-squeeze-sim.html", "kind": "solo", "audience": "Mummies", "verdict": "The Short Squeeze becomes a 3-minute push-your-luck game. Your friend swears a stock will crash; you bet against it (or wisely don't); then the price ticks up in front of you, your loss counts in rupees, and one big 'Get me out' button sits under your thumb until the margin call drags you out. The screenshot moment is the final meter: 'You held until it was 6× your bet. The most you could ever have won was 1×.' That is the asymmetry of short selling, felt rather than read.", "load": "", "share_idea": "📉 *The Short Squeeze* — I bet a 'sure-fire loser' stock would fall... and got squeezed at 6× my bet 😱 (the most I could ever win was 1×). How long would YOU hold? 👇 games.investingformummies.com/short-squeeze _(made-up company and prices, education only, not advice)_", "share_moment": "Your friend swears this stock will crash. Bet against it? Most people can't let go in time. · 3 minutes", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Open on the decision, not the lesson. Screen 1 is a WhatsApp-style message from a friend ('This Rent-a-Ride stock is going to crash, bet against it!') with two buttons: 'Bet ₹10,000 it falls' and 'Stay out'. Staying out is a real path: the player watches the squeeze as a spectator and earns 'The Calm Spectator' ending. The current Scene 1 explainer (steps, slider, bangles) moves behind a 'How does betting against a stock work? ▸' sheet that the game offers right after the choice. (Benchmark #3 First tap is the first decision — SPENT; #5 A dare — SPENT 'PROVE IT')", "id": "killer-short-squeeze--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Count-up + Sound] Replace the 'Hold / Cut at $200' pause with a live push-your-luck loop. The price ticks up every 0.6 seconds along a squeeze curve, a big loss counter counts in rupees ('You owe ₹38,000 more than you got'), a rising tick sound speeds up, and one 64 px 'Get me out' button sits in the thumb zone. At 5× the bet a 'MARGIN CALL' stamp slams down and closes the bet for them. Randomise the peak each run (sometimes it fizzles at 1.8×), so holding can't be memorised and the lesson is the risk, not the script. (Benchmark #6 One live number — SPENT; #12 Juice — 'Juice it or lose it')", "id": "killer-short-squeeze--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Retire the 3-question end quiz and fold it into two guesses during play. Before betting: 'You bet ₹10,000 that it falls. What's the most you could lose?', with chips '₹10,000 · ₹50,000 · No limit'. After the squeeze: 'Drag the pin to where you think the price peaked', then the real peak animates and an off-by pill appears. The asymmetry bar chart then confirms what they just guessed. (Benchmark #1 Guess first, then reveal — NYT 'You Draw It'; anti-pattern: trivia dressed up as a game)", "id": "killer-short-squeeze--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Swap the named real company and hedge funds for a fictional cast: 'Rent-a-Ride Ltd' with two big holders, 'Banyan Capital' and 'Peacock Partners', who refuse to lend their shares. Price everything in rupees, so the gold-bangles analogy and the game use the same currency. Add a 'Where does this come from?' sheet that cites a well-documented real squeeze (GameStop, January 2021) as the inspiration, so no unverified dated claims remain on screen. (Benchmark #18 Show your sources and assumptions — SPENT sources PDF)", "id": "killer-short-squeeze--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Show the chain reaction as falling dominoes. Five short-seller avatars stand on a price thermometer; the player taps to push the first margin call, and each forced buy tips the next one while the thermometer climbs (₹200 → ₹350 → ₹600 → ₹850) with a thud per domino. Then the ending: the panic buying stops and the price slides back down. It replaces six text rows revealed by a 'What happens next?' button, and makes 'scarce shares make it worse' something people see. (Benchmark #12 Juice — 'Juice it or lose it')", "id": "killer-short-squeeze--5"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "[Kit: Result rows + Personal best] End on an archetype plus one sentence in multiples, not money. The archetypes: 'The Quick Cutter' (out before 2×), 'The Hold-On Hoper' (squeezed at the margin call), 'The Lucky Survivor' (a fizzled run) and 'The Calm Spectator' (stayed out, the wisest). The sentence: 'You held until it was 6× your bet. The most you could ever have won was 1×.' Then three takeaways at most, and 'Your best: cut at 1.4×' stored on the device. (Benchmark #10 End on an identity — BitLife; #17 One personal sentence — NYT rent-or-buy)", "id": "killer-short-squeeze--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Offer one specific replay: 'Replay with a safety net: set your exit at 1.5× before it starts'. Then show the two runs side by side ('No net: squeezed at 5× · With net: out at 1.5×'). This teaches stop-losses through the player's own runs rather than a definition. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-short-squeeze--7"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "[Kit: Primary / sticky / outline / WhatsApp buttons + Top bar] One beat per screen on phones. The live price and loss sit in the top bar, the chart is full-bleed at 358 px wide, and the single action ('Bet', 'Get me out', 'Push the first domino') is sticky in the bottom third. Replace the 'Scene 1 of 5' dots with '3 min' plus progress dots, and remove the Back buttons during the live squeeze so there is exactly one choice on screen. (Benchmark #13 Say how long it takes — Evolution of Trust)", "id": "killer-short-squeeze--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] Share in multiples and emoji, never rupees: '😱 squeezed at 6×', '✂️ cut at 1.4×' or '🧘 stayed out', with the dare 'How long would YOU hold?'. The Story card shows the squeeze curve with the player's exit dot and the line 'Most you could win: 1×'. Give the page its own og:image: 'Would you hold? Most people can't let go.' (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-short-squeeze--9"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "[Kit: Kicker + Title block + Assumption footer] Rework the intro as kicker 'A 3-MINUTE NERVE TEST', title 'The short *squeeze*' and the friend's-message dare as the hook. Close every ending with one calm line for mums: 'Betting against shares is a professional's game with no ceiling on losses. Long-term investing lets you sleep.' The footer reads 'Made-up company and prices, inspired by real squeezes. Education only.'", "id": "killer-short-squeeze--10"}], "key": "killer-short-squeeze"}, {"slug": "killer-market-madness-2", "title": "Market Madness 2 — killer upgrade", "url": "https://games.investingformummies.com/market-madness-2", "file": "mm2_content.html", "kind": "solo", "audience": "Mummies", "verdict": "Make Market Madness 2 a game about feelings, not stock picking. Six rounds on a fictional bazaar of companies, while a family WhatsApp group pings panic and FOMO at you. All along, a ghost 'Do-Nothing Twin' quietly holds whatever you bought in Round 1. The screenshot-and-forward moment is the Feelings Receipt at the end: a shop-style bill listing each emotional move ('Panic sale, Round 2 · FOMO buy, Round 3'), what each one cost against your twin, and the punchline 'Your twin did nothing. Your twin won.'", "load": "", "share_idea": "🧾 I raced my own do-nothing twin through a market crash… and my feelings lost 😅 Can you beat yours? games.investingformummies.com/market-madness-2  _(Fictional companies and a made-up price path. Education only.)_", "share_moment": "Your twin does nothing for 6 rounds. You get to react. Bet you can't beat your twin.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Add the Do-Nothing Twin. After the player's first move, a faded twin avatar appears in the top bar and simply holds that first portfolio for all six rounds. Show both live numbers side by side every round, so the cost of each later trade is visible as it happens. This replaces the three abstract AI investors as the main rival, and keeps them as a secondary 'How others played' row. (Benchmark #6 One live number you can't stop watching — SPENT balance meter)", "id": "killer-market-madness-2--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows] [Kit: Count-up] Build the Feelings Receipt as the payoff: a printed-bill card that lists every trade the player made, tagged by emotion (Panic sale / FOMO buy / Chasing / Calm hold), each with its rupee cost or gain against the twin, counting up line by line to a 'Total cost of feelings' row. End with one tailored sentence ('Your one panic sale cost more than all your good calls earned'). (Benchmark #17 One personal sentence as the answer — NYT rent-or-buy)", "id": "killer-market-madness-2--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add the family WhatsApp group as the pressure mechanic: before each round, one or two chat bubbles slide in from 'Pinky Aunty', 'Rohan (cousin, trader)' and 'Office group' ('Sell everything!! Market will go to zero 😱', 'Dabba Delivery doubling, last chance'). The messages are fictional and pinned to the round's mood. Each one is a nudge the player can follow or ignore, and the Receipt later credits which nudges they obeyed. (Benchmark #20 Local life events, local money — SEBI Check QR game)", "id": "killer-market-madness-2--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Add guess-then-reveal at both ends. On the intro, ask the player to bet on who will finish first (You, Twin, Panicky Pinky, Picker Priya, Do-Nothing Didi). Before the final board, ask: 'Will you beat your twin? Yes / No'. Reveal the podium over their bet with one line: 'You bet on yourself. Your twin won by doing nothing.' (Benchmark #1 Guess first, then reveal — NYT You Draw It)", "id": "killer-market-madness-2--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Offer a tempting lifeline in the bull round: 'Borrow ₹2 lakh from QuickPaisa app (fictional) to buy more?'. In the crash it doubles the loss and adds interest, and a callout explains why borrowing to invest magnifies the fall. It is optional, but it is the move the Receipt highlights in red. (Benchmark #14 Desperate lifelines with a hidden price — SPENT 'Need cash?')", "id": "killer-market-madness-2--5"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "[Kit: Top bar] [Kit: Primary / sticky / outline / WhatsApp buttons] Collapse the dashboard to one phone screen (today it is about 1.6 screens). Show a top bar with the IFM mark, round dots, You vs Twin; one event card; a horizontally swipeable strip of six company cards with sparkline and price; and a sticky bottom bar with Buy · Sell · Hold, all at least 56 px tall. Move the bid/ask box and the order-type tabs behind a 'Learn the buttons ▸' chip, so the first screen holds no jargon.", "id": "killer-market-madness-2--6"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Tokens: Daylight] Replace the plain list of names with a painted 'bazaar' of six fictional companies, each a shopfront character with its own personality: 'Bharat Mega Industries' (big, steady), 'Ghar Ghar Gas', 'Dabba Delivery', 'Hawa Wind Power' (small, wild), and others. Use the same art on the share card. Keep each shopfront at or under 30 KB, and label every size band in words as well as colour. This builds on the earlier audit's swap to fictional names.", "id": "killer-market-madness-2--7"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Sound] [Kit: Confetti] Add juice in the rounds: in the crash, prices flash coral with a soft low thud (no strobe) and the phone buzzes once; in the recovery, a coin chime plays and the twin's number glows gold. Confetti only if the player beats the twin. Each round's 'How did this feel?' prompt gets three one-tap mood chips (😰 / 😐 / 😎), which feed the Receipt's emotion tags. (Benchmark #12 Juice — Juice it or lose it)", "id": "killer-market-madness-2--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text)] [Kit: Share image card] The end screen's primary button is 'Share my receipt'. The text is the share line above. The Story card shows the Feelings Receipt with emotion tags and win/lose ticks but no rupee amounts, the 'Your twin won' (or 'You beat your twin!') stamp, and the URL. Secondary button: 'Replay — no WhatsApp group this time', which reruns the same price path without the nudges so they can compare. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-market-madness-2--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "[Kit: Assumption footer] Put 'Fictional companies · made-up price path · not a forecast' on the Receipt and in the share text. Write the WhatsApp-group messages as red-flag lessons ('guaranteed', 'last chance', 'my friend's tip'), with a tap-to-reveal 'Red flag' tag, and never as tips that pay off. No real company, app or person is named anywhere, including in the chat bubbles.", "id": "killer-market-madness-2--10"}], "key": "killer-market-madness-2"}, {"slug": "killer-mix-portfolio", "title": "Mix My Portfolio — killer upgrade", "url": "https://games.investingformummies.com/classic?open=mixport", "file": "classic.html#mixport", "kind": "solo", "audience": "Mummies", "verdict": "Five women, five stages of life, one money mix each. You drop 20 coins into five jars for Neha (25) through Kavita (60), then fast-forward her life through a smooth market and a rough one and see whether her goal is met: school fees ready, retirement income lasting. The screenshot moment is the 'Five lives' card, with five illustrated portraits each stamped Sorted, Close call or Rethink under an archetype such as 'The Life-Stage Whisperer'.", "load": "", "share_idea": "🥧 *Mix My Portfolio*: I set the money mix for 5 women aged 25 to 60 🟢🟢🟡🟢🟢 and I'm *The Life-Stage Whisperer*. Can you match a mix to a life? 👇 games.investingformummies.com/classic?open=mixport _(rule-of-thumb ranges and made-up market stories, education only, not advice)_", "share_moment": "Neha is 25. Kavita is 60. Should their money look the same? Set five money mixes · 4 minutes", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Replace the five 3 px sliders, which silently push each other around, with 20 coins (each is 5% of her money) that you tap into five jars: Growth (shares), Safe (FD and bonds), Property, Gold and Cash. A counter says '6 coins left', the jars fill visibly, and 'Lock in Meera's mix →' only appears once all 20 are placed. Every tap is a deliberate choice, and nothing moves on its own. Build the jar component once and share it with the killer Asset Boss (its ten-coin jars) so the two games feel like one family. (Benchmark #3 First tap is the first decision — SPENT)", "id": "killer-mix-portfolio--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] After lock-in, fast-forward her life instead of only scoring the mix. First the player guesses: 'Meera needs ₹6 lakh for school fees in 5 years. The market crashes in year 4. Will the fees be ready? Yes / Close / No.' Then her goal bar plays out under two made-up stories, 'smooth years' and 'crash just before she needs it'. Anita (retiring in 5 years) sees the same crash-at-the-wrong-time risk, and Kavita (60) sees whether her monthly income lasts 25 years. The lesson that money needed soon should be safe is felt, not told. (Benchmark #1 Guess first, then reveal — NYT You Draw It; #8 Compress decades into minutes — NGPF STAX)", "id": "killer-mix-portfolio--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Count-up + Sound] Reveal jar by jar instead of the You / Ideal / +/- table in 10 px type. Each jar's rule-of-thumb range slides in as a green zone beside her coins. A rising chime plays for each jar inside the zone and a soft thud for each one outside, then the round score counts up. Mark misses with a word as well as a colour ('2 coins too many in Growth for a goal 5 years away'). (Benchmark #12 Juice: numbers that roll, coins that land — Juice it or lose it)", "id": "killer-mix-portfolio--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Personal best] End on a 'Five lives' card: five portraits in a row, each stamped Sorted, Close call or Rethink, then one tailored line from the player's most common miss ('You gave the women near retirement too much growth money. Money you need within 5 years should mostly be safe'), and an archetype as the headline: The Life-Stage Whisperer (5 in range), The Bold Planner (too much growth for the older women), The Careful Guardian (too little growth for the young ones), or The Balancer. This replaces the hard-coded 'Portfolio Master! 🏆', which today shows even at 250/500 with one star (seen live). (Benchmark #10 End on an identity, not a score — BitLife ribbons, Sorted quiz)", "id": "killer-mix-portfolio--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a 'same age, different life' twist round and a bigger persona pool. In round 3, two 40-year-olds appear side by side: Lakshmi, whose daughter's wedding is in 2 years, and Farah, who is saving for retirement in 20. Most players give them the same mix, and the reveal shows why the goal date matters more than age ('100 minus age' fails for Lakshmi). On replay, draw 5 from a pool of about 10 Indian-life personas (a freelancer with uneven income, a widow living on a pension, a couple saving a home deposit in 3 years) so each play feels new. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK; #20 Local life events — Visa Financial Football)", "id": "killer-mix-portfolio--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Tokens: Daylight] Replace the emoji personas (👩‍💼 👵 🧓) with five painted portrait cards in the house illustration style (like Slash the Scam's medallions), each ≤30 KB WebP. Draw five simple jar illustrations, and move the purple/blue/orange Material gradient and slider colours onto brand colours: Growth teal, Safe navy, Gold gold, Property terracotta, Cash mist grey. The jars should read as five objects you fill, not a chart legend in 9 px type.", "id": "killer-mix-portfolio--6"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "[Kit: Top bar + Title block + Primary / sticky / outline / WhatsApp buttons] On its own page, use the intro shape: kicker '5 WOMEN · 4 MINUTES', title 'One mix for *every age?*', the hook, and 'Meet Neha →'. In play, one screen holds the persona card at the top, the five jars in a row at thumb height, and a sticky 56 px 'Lock in →' button. Drop today's double header (a big 'Mix My Portfolio' banner, then a second compact banner with the same name), and leave the classic page's floating Menu / Suggest pills behind, since they cover the Lock button on a 390 px screen.", "id": "killer-mix-portfolio--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Write each persona as a moment with a rupee goal rather than a profile: 'Meera, 40: ₹6 lakh of school fees due in 2031. Two kids. Can't afford a bad year right before.' Put the asset words behind tap chips ('Growth = shares of companies: grows most over long periods, can drop a lot in a year'; 'Safe = FDs and bonds: steadier, grows slowly'). Present '100 minus age' as a rule your aunt swears by, to be tested, not as the hint, so the twist round has something to overturn.", "id": "killer-mix-portfolio--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] The WhatsApp line is the five coloured stamps plus the archetype, with no money and no mix percentages, and it links straight back to the game. A 1080×1920 card shows the five portraits with their stamps under the archetype name. Once the game has its own page, point the link and an own og:image ('Neha is 25. Kavita is 60. Same money mix?') at that page instead of classic?open=mixport. (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover — WhatsApp link-preview rules)", "id": "killer-mix-portfolio--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "[Kit: Assumption footer] The fast-forward must print its made-up numbers on screen: 'Smooth story: Growth +11% a year, Safe 7%, Gold 8%. Rough story: Growth −30% in the crash year. Made-up to show the idea; real returns vary and nothing is guaranteed.' Use asset types only, never a fund name. The final card should say 'a rule-of-thumb range for someone in Meera's situation, not advice for you'. Do not add a 'set your own mix' round, because that would be personal allocation advice.", "id": "killer-mix-portfolio--10"}], "key": "killer-mix-portfolio"}, {"slug": "killer-rollercoaster", "title": "The Market Rollercoaster — killer upgrade", "url": "https://games.investingformummies.com/classic?open=game1", "file": "classic.html#game1", "kind": "solo", "audience": "Mummies", "verdict": "Put the player in the front seat. A rollercoaster car rides Vikram's six-year price track, and at each of the two drops it stops at the bottom and asks: stay on, pause the SIP, or get off. Each purchase drops a 'units' coin into a jar, and the crash-year coin is visibly the fattest. The screenshot moment is the finish line: your ride against 'Stayed-on Vikram', with the track showing exactly where you jumped off, under the line 'Getting off at the bottom cost ₹11,216.'", "load": "", "share_idea": "🎢 *The Market Rollercoaster*: 2 crashes, and I stayed on both times ✅✅. I'm *The Steady Rider*. Would you have jumped off at the bottom? 👇 games.investingformummies.com/classic?open=game1 _(made-up fund prices, education only, not advice)_", "share_moment": "Your money just dropped 20%. Your sister is selling. Stay on the ride, or get off? · 2 minutes", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Turn the four-question quiz into a ride with consequences. The six years become a drawn track, and the car stops at the bottom of Year 3 (−20%) and Year 5 (−10%) with three big buttons: 'Stay on (keep investing)', 'Pause my SIP' and 'Get off (sell everything)', plus an optional 'Top up ₹10,000'. The ride then finishes with your choices applied. Using the game's own prices: stay on ends at ₹68,016 from ₹60,000; pause from Year 3 to 5 ends at about ₹62,300; get off in Year 3 ends at about ₹56,800; topping up in both dips ends at about ₹93,100 from ₹80,000. (Benchmark #8 Compress decades into minutes — NGPF STAX; anti-pattern 'Trivia dressed up as a game')", "id": "killer-rollercoaster--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Before the finish, ask the player to drag a slider to guess Vikram's total: 'He put in ₹60,000 through two crashes. What's it worth now?' (range ₹40,000 to ₹1,00,000). Then the real ₹68,016 rolls in over their guess with an off-by pill ('You guessed ₹55,000, ₹13,016 short. The crash years helped him'). This replaces the three-option question, which the stat chips answer before it is asked. (Benchmark #1 Guess first, then reveal — NYT You Draw It)", "id": "killer-rollercoaster--2"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Count-up + Sound] Make units something you can see. Each purchase drops a coin into a 'units jar', with the coin sized by units bought, so the Year 3 coin (98.8 units) lands fat with a clink and a gold flash: 'Sale! Same ₹10,000, more units.' One live number sits at the top showing 'units owned · worth now'. It turns coral when it falls and gold when it rises. This replaces the five-column table row (year, bar, %, price, units) that is cramped on a phone. (Benchmark #6 One live number you can't stop watching — SPENT; #12 Juice — Duolingo streak animation)", "id": "killer-rollercoaster--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Count-up] End on a finish-line card with three rows: 'Stayed on: ₹68,016', 'Your ride: ₹X' (highlighted), and 'Got off at the bottom: ₹56,800'. Beside them, the track carries a pin that says 'You got off here' or 'You held on here'. Under that goes a kind archetype with one next step: The Steady Rider, The Bargain Hunter (topped up), The Nervous Passenger (paused) or The Early Exit (sold). For example: 'Next time markets drop, set a 30-day do-nothing reminder before you touch anything.' This replaces the generic quote box. (Benchmark #10 End on an identity — BitLife; anti-pattern 'Doom with no way forward')", "id": "killer-rollercoaster--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add one-tap replays that change one thing: 'Ride again, but don't get off' shows both endings side by side. After the first ride, a 'Rough ride' track unlocks, with a 35% drop in Year 2 and a slow three-year climb that ends with only a small gain. Players then learn that staying on is about not locking in a loss, not a guaranteed win. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-rollercoaster--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Tokens: Daylight] Draw the track as one SVG generated from the six prices, so the ride is the chart: navy rails, a gold car with a mum and child in it, coral dips and teal climbs, and six station flags labelled with years. On a 390 px phone it fits one screen width with a fixed 220 px-high stage. Keep it under 30 KB, with no image files.", "id": "killer-rollercoaster--6"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "[Kit: Top bar + Title block + Primary / sticky / outline / WhatsApp buttons] On its own page, use the intro shape: kicker '6 YEARS · 2 CRASHES · 2 MINUTES', title 'The Market *Rollercoaster*', the hook, and 'Get on the ride →'. Play goes one stop per screen, with the three decision buttons stacked 56 px tall in the thumb zone. That removes today's long scroll of greyed 'locked' step cards and the floating Menu / Suggest pills, which sit over the 'Reveal Next Year' button on a phone (seen live).", "id": "killer-rollercoaster--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Make the first stop feel real: 'Your ₹30,000 is now ₹26,800. The family WhatsApp group is saying sell. Your sister already has.' Explain jargon as you go: 'price per unit (called NAV)', and 'your ₹10,000 buys more units when prices are low. That's called rupee-cost averaging.' Use buttons that say what you get ('Stay on →'), and use 'Not quite, here's the twist' instead of 'costly mistake!'. (Benchmark #20 Local life events, local money — SEBI Check QR game)", "id": "killer-rollercoaster--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] The WhatsApp line shows one emoji per drop (✅ stayed on, ⏸️ paused, 🚪 got off, ➕ topped up) plus the archetype, with no rupee figures. The 9:16 card shows the track with the player's pins on it. Link to the game's own page once it is promoted, and give that page its own og:image ('Stay on the ride, or get off?'). (Benchmark #2 Spoiler-free result card — Wordle)", "id": "killer-rollercoaster--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "[Kit: Assumption footer] Label the track 'a made-up fund's prices, to show the idea', and under every ending write '(made-up prices; real markets can fall further and take longer to recover; nothing is guaranteed)'. Frame the top-up choice as 'only if you have spare money and an emergency fund already in place', not as the winning move. Never show a fund name.", "id": "killer-rollercoaster--10"}], "key": "killer-rollercoaster"}, {"slug": "killer-chaiboss", "title": "ChaiBoss Ltd — killer upgrade", "url": "https://games.investingformummies.com/classic?open=game7", "file": "classic.html#game7", "kind": "solo", "audience": "Mummies", "verdict": "You don't watch ChaiBoss, you run it. Each quarter you make a boss decision (launch a ₹10 kulhad chai, open five cities, pay the first dividend, quietly cut the milk), then drag a needle to predict what the market does to your share price. The reveal pours the answer into a chai glass: the tea level is profit per share and the steam is market mood. The screenshot moment is the twist quarter, 'Profits up 20%. Share price DOWN 6%. The market expected 30%.', with your needle pointing the wrong way.", "load": "", "share_idea": "☕ *ChaiBoss Ltd*: I ran a chai company for 8 quarters and called the share price 🎯🎯☕🎯❌🎯☕❌. Profits went UP and the price went DOWN. Can you work out why? 👇 games.investingformummies.com/classic?open=game7 _(made-up company, education only, not advice)_", "share_moment": "Your chai company just made record profits. So why did the share price fall? Run ChaiBoss for 8 quarters · 4 minutes", "items": [{"area": "Game design", "priority": "High", "effort": "L", "text": "Make the intro's promise true: you run the company. Each quarter has two beats. First, a boss decision with a trade-off, for example Q2 when a rival launches cheaper chai: 'Cut your price to ₹8' (profit per share falls) or 'Stay premium and advertise' (costs now, mood holds). Second, the market reacts. Some quarters are news you cannot control (a rate cut, milk prices). The decisions change your share's path, and the greedy choice can backfire: cutting milk quality lifts this quarter's profit, then a viral complaint crushes mood the next quarter. (Anti-pattern 'Trivia dressed up as a game'; Benchmark #7 Teach in the result, not before the choice — SPENT)", "id": "killer-chaiboss--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Replace the A/B/C answers with a price needle. After each headline, the player drags a needle on a ₹50 to ₹250 dial to predict the new share price. The real price swings in over it with an off-by pill: within ₹10 is 🎯, within ₹25 is ☕, further off is ❌. A needle cannot show 'always option A', so the answer-position problem goes away by design, and every guess teaches the size of the move, not just its direction. (Benchmark #1 Guess first, then reveal — NYT You Draw It)", "id": "killer-chaiboss--2"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Add the 'priced in' twist quarter that the whole game builds towards: 'Record quarter: profit per share up 20%!' Most players drag the needle up. Then the reveal: analysts had expected 30%, mood drops from 14 to 11, and the price falls about 6% (₹168 to ₹158). A two-line callout explains why ('the share price already contained the good news everyone expected'). This is the counter-intuitive moment people will forward, and it is the share hook. (Benchmark #5 A dare that challenges the player's self-image — SPENT)", "id": "killer-chaiboss--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Count-up + Sound] Show Price = Profit per share × Mood as a chai glass, not four number tiles. The tea level is profit per share in ₹, the steam height is the mood multiplier, and the price label on the glass counts up or down as both change. A pour animates when profit rises, steam puffs when mood rises and fades when it falls, and a kettle whistle plays on big moves. The formula line under it ('₹12 × 11 = ₹132') stays, but now the picture explains it. (Benchmark #12 Juice — Juice it or lose it)", "id": "killer-chaiboss--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Rename the jargon on screen: EPS becomes 'Profit per share (EPS)' and P/E becomes 'Mood multiplier (P/E): investors pay ₹11 for every ₹1 of yearly profit'. Keep the four 'What is…?' chips, but attach each to the number it explains instead of a row above the story. Use sentence case and buttons that say what you get ('Set my price →', 'Next quarter →'). Retire 'Let's Brew Some Profits ☕ →' and the grade titles ('Stock Market Star!', 'Growing Your Knowledge!').", "id": "killer-chaiboss--5"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Personal best] End on an 'Annual report' card styled like a company report: the 8-quarter price line with the player's needle guesses as dots, and three rows. 'Mood moved your price more than profit in 5 of 8 quarters.' 'Best call: the rate-cut rally.' 'The one that fooled you: record profits, falling price.' Headline it with an archetype: The Mood Reader, The Numbers Purist (followed profit, missed mood) or The Eternal Optimist (always guessed up). Add one tailored line and a personal best. (Benchmark #10 End on an identity — How Bad Is Your Spotify)", "id": "killer-chaiboss--6"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "For replay, deal one of three made-up companies at random: ChaiBoss, DosaDost Foods and Kulfi Cart Co. Each has a different order of events and a different twist (for example, bad news everyone expected, so the price rises; or a dividend quarter where the price dips on the payout date). 'Good news means up' then stops being a winning strategy, and a second play teaches something new. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-chaiboss--7"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "[Kit: Top bar + Title block + Primary / sticky / outline / WhatsApp buttons] On its own page, use the intro shape: kicker '8 QUARTERS · 4 MINUTES', title 'Chai*Boss* Ltd', the hook, and 'Open the shop →'. Play goes one screen per beat (headline → decision → needle → reveal), with Price · Profit/share · Mood in one slim sticky row in the top bar instead of the tall stacked navy pills seen live on a phone. Remove the doubled 'The ChaiBoss Challenge' header and the classic page's floating Menu / Suggest pills.", "id": "killer-chaiboss--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] The WhatsApp line is the 8-symbol row of calls (🎯 ☕ ❌) plus the twist as a question, with no player money involved. The 9:16 card shows the chai glass and the 8-quarter price line under the archetype. Link to the game's own page once promoted, and give it an og:image reading 'Profits up. Price down. Why?' (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-chaiboss--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "[Kit: Assumption footer] The 'NSE: CBOSS' ticker makes a made-up company look listed. Change it to 'Fictional company, not listed anywhere'. The 'Market Cap' explainer names TCS and Reliance as examples of 'generally safer' large caps. Replace them with made-up names, and drop 'safer' in favour of 'usually swing less'. The player only ever predicts a price, and nothing on screen says buy or sell.", "id": "killer-chaiboss--10"}], "key": "killer-chaiboss"}, {"slug": "killer-timing-trap", "title": "The Timing Trap — killer upgrade", "url": "https://games.investingformummies.com/classic?open=nifty26", "file": "classic.html#nifty26", "kind": "solo", "audience": "Mummies", "verdict": "Make the player the fourth investor. Lucky, Steady and Worried race through 26 real years of the Nifty 50 index, and you race beside them with the same ₹1 lakh a year. At each crash (2000, 2008, 2011, 2020) you choose: keep going, skip a year, or sell everything for an FD. The screenshot moment is the four-lane finish: Worried Waris, who bought at the top every single year, ends on about ₹1.49 crore, while someone who sold once in 2008 ends on about ₹94 lakh. The unluckiest investor beats the panic seller by more than ₹50 lakh.", "load": "", "share_idea": "📅 *The Timing Trap*: 26 years of the Nifty 50 in 3 minutes. I sat through 4 crashes ✅✅✅✅ and finished ahead of Worried Waris, who bought at the top every year. Could you sit still through 2008? 👇 games.investingformummies.com/classic?open=nifty26 _(real Nifty 50 index levels 1996–2021, price only, before tax and costs; past returns are not a promise)_", "share_moment": "The unluckiest investor bought at the top every year for 26 years, and still ended with crores. Can you beat him? · 3 minutes", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Add a fourth lane: 'You'. Today the player only watches. The killer version gives you the same ₹1 lakh every January, and each crash card (2000, 2008, 2011, 2020) asks 'Your money just fell 30%. What do you do?' with three big buttons: 'Keep investing', 'Skip next year (keep it in savings)' and 'Sell everything, move to an FD'. With the game's own data, staying in ends at about ₹1.88 Cr (same as Steady). Selling once at the end of 2008 (sold money and the 2009 instalment into an FD at 7%, investing again from 2010) ends at about ₹94 L. Skipping the year after every down year (that money kept in savings at 4%) ends at about ₹1.40 Cr. (Benchmark #8 Compress decades into minutes — NGPF STAX; #14 Desperate lifelines with a hidden price — SPENT)", "id": "killer-timing-trap--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Before the result, ask for a guess: 'Lucky bought at every year's lowest point. Waris bought at every year's highest. Drag to guess how much more Lucky ended with.' The slider runs from ₹0 to ₹2 Cr. Then reveal about ₹74 L more (₹2.22 Cr vs ₹1.49 Cr), and a second line: 'Steady, who just invested every January with zero effort, was about ₹34 L behind perfect, and nobody can actually do what Lucky did.' That makes the realistic choice Steady versus panic, which is the honest lesson. (Benchmark #1 Guess first, then reveal — NYT You Draw It)", "id": "killer-timing-trap--2"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "[Kit: Money formatting + Count-up] Talk in rupees, not CAGR. Every card, the chart axis (today labelled 5.8%, 10.1%, 12.5%, 14.2%) and the result heroes show only annualised % returns, which most mums cannot picture. Lead with the rupee value counting up ('₹1.88 Cr from ₹26 L put in') and show the % as a quiet second line ('about 12.7% a year'). The current headline 'the CAGR gap is just 2.3% per year' should become 'Perfect timing vs worst timing: about ₹74 L apart. Panicking once: about ₹94 L behind staying put.'", "id": "killer-timing-trap--3"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "Rebuild the crash card for a phone. Today it lays out the title, three investor cards, 'Why this matters' and the button side by side, so on a 390 px screen the lesson is squeezed into a column about one word wide and runs off the card (seen live on the 2000 Dot-com card). Stack it instead: headline and one line on what happened, the four lane values, a two-line lesson, then the three decision buttons, 56 px tall, in the thumb zone. Raise the 0.42–0.5 rem (7–8 px) labels to at least 12 px.", "id": "killer-timing-trap--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Sound + Count-up] Turn the line chart into a four-lane race. Each investor is a token (🍀 Lucky, 📅 Steady, 😰 Waris, ⭐ You) climbing a lane whose height is the portfolio's value, with a year ticker from 1996 to 2021 and a newspaper headline that flips for each event. Crash years shake the lanes with a soft low thud, recoveries chime, and a faint dashed fifth lane shows 'all 26 lakh in an FD at 7%: about ₹74 L', so 'the real risk is not being invested' is finally visible rather than just asserted. Keep the whole run to about 60 seconds by default. (Benchmark #6 One live number you can't stop watching — SPENT; #12 Juice)", "id": "killer-timing-trap--5"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Life bar / timeline] End on a 'four lanes' card: rupee totals for all four investors with yours highlighted, and a timeline strip marking the years you skipped or sold, each labelled with what it cost compared with staying in. Head it with a kind archetype and one next step: The Statue (never flinched), The Skipper, or The Bailout ('Write down today what you'll do in the next crash, then wait 30 days before acting on a scary headline'). Replace the three takeaway paragraphs in 10 px type. (Benchmark #10 End on an identity — BitLife; #17 One personal sentence as the answer — NYT rent-or-buy)", "id": "killer-timing-trap--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add replays that change one thing. 'Replay without selling' reruns the same 26 years with your sells turned into stays and shows both lanes side by side. 'Start in 2007' begins at the peak just before the 2008 crash, the scariest possible start. Using the game's data to 2021, ₹1 lakh every January from 2007 (₹15 L in total) still reaches about ₹41 L for Steady and about ₹33 L for Waris, against about ₹27 L in a 7% FD. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-timing-trap--7"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "[Kit: Top bar + Title block + Primary / sticky / outline / WhatsApp buttons] On its own page, use the intro shape: kicker '26 YEARS · 4 CRASHES · 3 MINUTES', title 'The Timing *Trap*', the hook as a dare, the three rivals as small tokens, and 'Take your seat →'. That way the first tap is a seat in the race, not a setup table. Leave behind the classic page's banner and the floating Menu / Suggest pills that cover the controls. (Benchmark #3 First tap is the first decision — SPENT, Wordle)", "id": "killer-timing-trap--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] The WhatsApp line is one emoji per crash (✅ stayed, ⏭️ skipped, 🏃 sold) plus where you finished against Waris, with no rupee amounts. The 9:16 card shows the four lanes as a podium. Link to the game's own page once promoted, and give it an og:image reading 'The unluckiest investor still made crores. Can you beat him?' (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-timing-trap--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "[Kit: Assumption footer] A market index (not a single stock or fund) is fine to use, but every rupee figure needs its basis on screen and in the share: 'Nifty 50 price index, excludes dividends, before tax and costs; FD assumed 7% a year; past returns are not a promise.' Rename the takeaway 'Crashes are the best buying opportunities' to 'In these 26 years, every crash was followed by a recovery, so staying put mattered more than timing'. Tag Lucky 'Nobody can do this. He's here to measure the gap.' Recompute every number above when the data is extended past 2021.", "id": "killer-timing-trap--10"}], "key": "killer-timing-trap"}]}]}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('audit-data').textContent);
  const GROUP_NAMES = {'killer-std':'The standard, playbook, rooms and old address', 'killer-a':'Make it killer: older games (1)', 'killer-b':'Make it killer: older games (2) and betas', 'tools-bench':'Make it killer: the tools', buildorder:'Build order \u2014 work top to bottom', requests:'Hiral\u2019s requests \u2014 priority', sitewide:'Site-wide (do once, fixes every game)', 'solo-a':'Solo games — Mummies (1)', 'solo-b':'Solo games — Mummies (2)', 'solo-c':'Gen Next, simulations & tools', 'class-a':'Classroom games (1)', 'class-b':'Classroom games (2)', classic:'Inside the classic hub (to be moved out)'};
  const done = new Map();          // itemId -> {at}
  const f = {prio:null, eff:null, hide:false, kind:null, q:''};
  try { const s = JSON.parse(localStorage.getItem('ifm-fix-filters')||'null'); if (s) Object.assign(f, s); } catch(e){}
  let db = null, canWrite = true;

  const WA = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--wa)" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short'}); } catch(e){ return ''; } };

  function visible(g, it){
    if (f.kind && g.kind !== f.kind) return false;
    if (f.prio && it.priority !== f.prio) return false;
    if (f.eff && it.effort !== f.eff) return false;
    if (f.hide && done.has(it.id)) return false;
    if (f.q){ const q=f.q.toLowerCase(); if(!(g.title+' '+it.text+' '+it.area).toLowerCase().includes(q)) return false; }
    return true;
  }

  function render(){
    const all = DATA.groups.flatMap(gr => gr.games.flatMap(g => g.items));
    const nDone = all.filter(i => done.has(i.id)).length;
    document.getElementById('pnum').textContent = nDone + ' / ' + all.length + ' done';
    document.getElementById('fill').style.width = (all.length ? (100*nDone/all.length) : 0) + '%';
    const left = all.filter(i => !done.has(i.id));
    const games = DATA.groups.reduce((n,gr)=>n+gr.games.length,0);
    document.getElementById('summary').innerHTML =
      '<div class="sum"><b>'+games+'</b><span>Pages audited</span></div>'+
      '<div class="sum"><b>'+left.filter(i=>i.priority==='High').length+'</b><span>High priority left</span></div>'+
      '<div class="sum"><b>'+left.filter(i=>i.effort==='S').length+'</b><span>Under an hour each</span></div>'+
      '<div class="sum"><b>'+nDone+'</b><span>Done</span></div>';
    let html = '';
    for (const gr of DATA.groups){
      let gHtml = '';
      for (const g of gr.games){
        const its = g.items.filter(it => visible(g,it));
        if (!its.length) continue;
        const gd = g.items.filter(i=>done.has(i.id)).length;
        gHtml += '<article class="game" id="g-'+esc(g.key)+'">'+
          '<div class="game-h"><div><h2>'+esc(g.title)+'</h2><div class="tags">'+
            '<span class="tag k-'+esc(g.kind)+'">'+esc(g.kind==='site'?'site-wide':g.kind)+'</span>'+
            (g.audience?'<span class="tag">'+esc(g.audience)+'</span>':'')+
            '<span class="tag count">'+gd+' / '+g.items.length+' done</span></div></div>'+
            (g.url && g.kind!=='site' ? '<a href="'+esc(g.url)+'" target="_blank" rel="noopener">Open game ↗</a>' : '')+
          '</div>'+
          '<div class="meta">'+
            (g.verdict?'<p class="verdict">'+esc(g.verdict)+'</p>':'')+
            (g.load && g.load!=='—'?'<p class="load">Load: '+esc(g.load)+'</p>':'')+
            (g.share_idea?'<p class="share">'+WA+'<span><b>WhatsApp share:</b> <q>'+esc(g.share_idea)+'</q>'+(g.share_moment?' <span class="moment">— '+esc(g.share_moment)+'</span>':'')+'</span></p>':'')+
          '</div>'+
          (g.recommendation?'<p class="rec">Plan: '+esc(g.recommendation)+'</p>':'')+
          '<ul class="items">'+its.map(it => {
            const d = done.get(it.id);
            return '<li class="item'+(d?' is-done':'')+'"><input type="checkbox" class="cb" id="cb-'+esc(it.id)+'" data-id="'+esc(it.id)+'"'+(d?' checked':'')+(canWrite?'':' disabled')+' aria-label="Mark done: '+esc(it.text)+'">'+
              '<div class="it-body"><label for="cb-'+esc(it.id)+'" class="it-text">'+esc(it.text)+'</label>'+
              '<div class="it-tags"><span class="p p-'+esc(it.priority)+'">'+esc(it.priority)+'</span><span class="area">'+esc(it.area)+'</span><span class="eff">· effort '+esc(it.effort)+'</span>'+(d&&d.at?'<span class="when">· done '+esc(fmtDate(d.at))+'</span>':'')+'</div></div></li>';
          }).join('')+'</ul></article>';
      }
      if (gHtml) html += '<h3 class="group-h">'+esc(GROUP_NAMES[gr.group]||gr.group)+'</h3>'+gHtml;
    }
    document.getElementById('list').innerHTML = html || '<p class="empty">Nothing matches these filters.</p>';
    document.querySelectorAll('.chip').forEach(c => {
      const k=c.dataset.f, v=c.dataset.v;
      c.setAttribute('aria-pressed', String(k==='hide' ? !!f.hide : f[k]===v));
    });
  }

  function saveFilters(){ try { localStorage.setItem('ifm-fix-filters', JSON.stringify(f)); } catch(e){} }
  document.querySelector('.filters').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const k=c.dataset.f, v=c.dataset.v;
    if (k==='hide') f.hide = !f.hide; else f[k] = (f[k]===v ? null : v);
    saveFilters(); render();
  });
  const q = document.getElementById('q'); q.value = f.q||'';
  q.addEventListener('input', () => { f.q = q.value.trim(); saveFilters(); render(); });

  const status = document.getElementById('status');
  document.getElementById('list').addEventListener('change', async e => {
    const cb = e.target.closest('.cb'); if (!cb) return;
    const id = cb.dataset.id, on = cb.checked;
    if (on) done.set(id, {at:new Date().toISOString()}); else done.delete(id);
    render();
    if (!db) { status.textContent = 'This view can’t save ticks, so this one will be lost when you leave.'; return; }
    try {
      if (on) await db.doc('done/'+id).set({done:true, at:done.get(id).at});
      else await db.doc('done/'+id).delete();
      status.textContent = 'Saved.';
    } catch(err){
      if (on) done.delete(id); else done.set(id,{at:new Date().toISOString()});
      if (err && err.code==='invalid_argument'){ canWrite=false; status.textContent='You can view this list but not tick items.'; }
      else status.textContent = 'Couldn’t save that tick. Try again in a moment.';
      render();
    }
  });

  const jump = document.getElementById('jump');
  DATA.groups.forEach(gr => gr.games.forEach(g => { const o=document.createElement('option'); o.value=g.key; o.textContent=g.title; jump.appendChild(o); }));
  jump.addEventListener('change', () => { const k=jump.value; if(!k) return;
    if (f.kind||f.prio||f.eff||f.hide||f.q){ f.kind=f.prio=f.eff=null; f.hide=false; f.q=''; q.value=''; saveFilters(); render(); }
    const el=document.getElementById('g-'+k); if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); jump.value=''; });
  render();
  (async () => {
    try {
      db = await (window.claude && window.claude.use ? window.claude.use('db') : null);
      const user = await (window.claude && window.claude.use ? window.claude.use('user') : null);
      if (user && typeof user.can === 'function'){ const w = await user.can('data.write'); if (w === false) canWrite = false; }
    } catch(e){ db = null; }
    if (!db){ status.textContent = 'Ticks can’t be saved in this view.'; render(); return; }
    status.textContent = canWrite ? 'Ticks are saved for everyone.' : 'You can view this list but not tick items.';
    db.collection('done').onSnapshot(snap => {
      done.clear();
      snap.docs.forEach(d => { const v=d.data(); if (v && v.done) done.set(d.id, {at:v.at}); });
      render();
    }, err => { status.textContent = 'Lost the connection to saved ticks; reload to see the latest.'; });
  })();
})();
</script>
