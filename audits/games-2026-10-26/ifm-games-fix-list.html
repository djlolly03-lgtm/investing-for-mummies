 met during play, but the end screen never shows them — add a 'What you learned' strip with those 3–4 scams and their one-line tell, since nobody can read the ticker while swiping.", "id": "slash-the-scam-html--2"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "'Diamonds — precious things hold their value for years' is shaky advice (diamonds usually resell for far less than you paid) — swap the diamond for something solid like 'SIP' or 'Term insurance', or reword it as 'family jewellery — don't panic-sell'.", "id": "slash-the-scam-html--3"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The opening ticker says 'Read the labels…' but the flying items have no labels (by design) — change it to 'Know the shapes: ✂️ slash the tricks, let the good ones land'.", "id": "slash-the-scam-html--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Before the first round, show the 8 symbols with their names for 2 seconds (e.g. 'top hat = magic money scheme') — first-time mums otherwise slash by colour and guesswork.", "id": "slash-the-scam-html--5"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Tapping 'End round' after a few seconds can award 'SCAM-PROOF SUPERMOM' and say 'protected from scams in 75 seconds' — give quitters a neutral verdict ('Round ended early').", "id": "slash-the-scam-html--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "This page has no Google Analytics tag (every other game has one) and no browser-tab icon — add both so its traffic shows up in the games report.", "id": "slash-the-scam-html--7"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "Losing a heart is signalled mostly by red flashes and sound — add a short vibration on phones and keep the 'X hearts left' banner, which helps players who play muted.", "id": "slash-the-scam-html--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under 'The lesson' on the end screen add a soft 'Learn to spot money traps with other mums → Find your batch' link to register.investingformummies.com.", "id": "slash-the-scam-html--9"}], "key": "slash-the-scam-html"}, {"slug": "fundgoal.html", "title": "Fund Your Goal", "url": "https://games.investingformummies.com/fundgoal.html", "file": "fundgoal.html", "kind": "tool", "audience": "Mummies", "verdict": "A genuinely useful goal planner — multi-goal, inflation-adjusted, with a 'cost of delay' view and PDF/WhatsApp export. What holds it back: the 12% return default isn't explained, the 'start today' message is garbled, and every share and PDF still advertises the old ifm-deploy.vercel.app address.", "load": "35 KB page + 1 MB logo from ifm-deploy.vercel.app; logo is most of the weight.", "share_idea": "\"To fund [Child's education] in [10] years I need ₹[SIP]/month — waiting just 1 year adds ₹[extra]/month 😳 Plan your goal free: games.investingformummies.com/fundgoal.html\"", "share_moment": "Under the 'Your Full Picture' totals, where the WhatsApp button already sits (fix its text/link).", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The WhatsApp message ends 'Plan yours free: ifm-deploy.vercel.app' and the PDF footer says the same — change both to games.investingformummies.com/fundgoal.html so every share brings people back to the right site.", "id": "fundgoal-html--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "'Expected return' defaults to 12% with no explanation — add a short note next to it ('12% is an assumption, roughly what equity funds have averaged over long periods; it can be lower and is not guaranteed') and show a safer 8% result alongside for comparison.", "id": "fundgoal-html--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The yellow 'Start today' banner reads 'Every year you delay costs you an extra ₹X — actually, waiting even 1 year means paying ₹Y more every month, forever' — the first number is meaningless and 'forever' is wrong; replace with one clear line: 'Waiting 1 year means ₹Y more every month until your goal.'", "id": "fundgoal-html--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Corpus', 'SIP' and 'Lump sum' are never explained — add tiny helper text ('Corpus = total you'll need', 'SIP = a fixed amount invested every month').", "id": "fundgoal-html--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The summary table has four money columns that get cramped on a 390px phone — stack each goal as a small card on phones instead of a wide table.", "id": "fundgoal-html--5"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Percentage boxes use a number-only keypad, so on iPhones you can't type '6.5%' — allow a decimal keypad for inflation and return.", "id": "fundgoal-html--6"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The 'All goals combined' totals are rebuilt from the rounded '₹12.34 L' text on screen, so they can be slightly off — add up the real numbers instead.", "id": "fundgoal-html--7"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Header logo (and PDF logo) is the 1 MB watermark file from the old domain — swap for a small local logo.", "id": "fundgoal-html--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Once a goal has a monthly amount, add a gentle 'Want help picking where to put this ₹X/month? Find your batch' link to register.investingformummies.com — this is the highest-intent moment on the whole games site.", "id": "fundgoal-html--9"}], "key": "fundgoal-html"}, {"slug": "goal-tracker.html", "title": "Goal Tracker", "url": "https://games.investingformummies.com/goal-tracker.html", "file": "goal-tracker.html", "kind": "tool", "audience": "Mummies", "verdict": "A tidy short/medium/long-term goal board with a clear funded-vs-gap donut, good on a laptop. What holds it back: on a phone the page spills sideways and the 'Funded so far' box is hidden entirely, so the main thing the tool does can't be done on the device most visitors use.", "load": "31 KB page + Chart.js (~200 KB) for a single donut; fine, could be lighter.", "share_idea": "\"My family goals are [42]% funded 🎯 — ₹[gap] to go. Map yours in 2 minutes: games.investingformummies.com/goal-tracker.html\"", "share_moment": "Under the Overall Summary donut, where the WhatsApp button already sits (fix its text/link).", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On phones the 'Funded so far' and 'Gap' columns are hidden and the column labels disappear, so mums can't enter what they've saved and see unlabelled boxes — on small screens show each goal as a stacked card with labelled fields (Goal, Years, Target, Saved so far).", "id": "goal-tracker-html--1"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "Each goal row is wider than the screen (the page is about 462px wide on a 390px phone), causing sideways scrolling — let the row wrap or stack as above.", "id": "goal-tracker-html--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The WhatsApp message and the downloaded plan both say 'ifm-deploy.vercel.app' — change to games.investingformummies.com/goal-tracker.html.", "id": "goal-tracker-html--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The tool shows the gap but not what to do about it — add 'To close this gap in [Years], you'd need about ₹X a month' (or a 'Plan this goal →' link into Fund Your Goal) so a gap turns into an action.", "id": "goal-tracker-html--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Yrs' box is collected but used nowhere, and a 10-year goal can sit under 'Short term' — use the years to place or warn, and in the monthly-amount maths above.", "id": "goal-tracker-html--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "'Download My Plan' saves a plain .txt file, which feels unfinished next to Fund Your Goal's branded PDF — reuse that branded print layout here.", "id": "goal-tracker-html--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'People who write down goals are 42% more likely to achieve them' is an unsourced stat — cite it or soften it ('Writing a goal down with a number and a date makes it far more likely to happen').", "id": "goal-tracker-html--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'Target corpus' is jargon — say 'Amount needed'; also close the 4–5 year gap between 'Medium (1–4 years)' and 'Long (5+ years)'.", "id": "goal-tracker-html--8"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The faint IFM watermark only works when the page sits inside the old site, so on its own it's an empty image — point it at a small local logo or remove it.", "id": "goal-tracker-html--9"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "Chart.js is loaded just to draw one two-colour ring — a simple CSS ring would do the same and save ~200 KB on phones.", "id": "goal-tracker-html--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the summary add a soft 'Not sure how to close the gap? Find your batch' link to register.investingformummies.com.", "id": "goal-tracker-html--11"}], "key": "goal-tracker-html"}]}, {"group": "class-a", "games": [{"slug": "swipe-right-live", "title": "Swipe Right on SIP LIVE", "url": "https://games.investingformummies.com/swipe-right-live", "file": "swipe-right-sip-live.html", "kind": "classroom", "audience": "Gen Next", "verdict": "A tight, funny format: fake finfluencer posts on the projector, students swipe on phones, then a dramatic '5 years later' receipts reveal that names who fell for what. What holds it back: every class shares one fixed room, and much of the projector text is too small to read from the back.", "load": "67 KB page + Supabase live library (~218 KB) + QR library + 3 Google fonts; no images — fast on any phone", "share_idea": "\"I got BORING GENIUS — my ₹10,000 became ₹16,450 and I dodged 5 of 6 scammy finfluencers in Swipe Right on SIP. Can you spot the red flags?\" + link", "share_moment": "On the student's phone, on the final 'Your verdict' card, right under the ₹ total and rank.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Every class plays in the same fixed room, MF101: two teachers running it at once end up in one game, and opening the host screen shows the last class's players and scores until someone presses Reset. Give each new host screen its own random room code, as Broke by Friday already does.", "id": "swipe-right-live--1"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Key projector text is only about 9px: the lobby rules ('₹10,000 · 10 funds · max 5 investments · right = invest'), the bottom-bar hints and the 'swipes locked in' labels. Make the rules line at least three times bigger so the back row can read it.", "id": "swipe-right-live--2"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "A swipe made in the last second can be lost. When the teacher taps 'Next fund', the host saves its own copy of the game, which can overwrite a vote a phone saved a moment earlier. Re-check the latest votes, or pause for a second, before moving on.", "id": "swipe-right-live--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Each ₹2,000 a player doesn't invest quietly grows to ₹2,150 (a savings-account rate) and counts toward their score, but nobody is ever told. Say this in the lobby rules and on the final card so 'skipping everything' is a visible, fair choice.", "id": "swipe-right-live--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The 'I'm playing' button on the landing page sends phones to the default room, and there's nowhere to type a room code. Add a room-code box, so a student whose camera won't scan the QR can still join.", "id": "swipe-right-live--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The teacher can't remove a player, so a prank name stays on the projector for the whole game. Let the host tap a name in the lobby to remove it.", "id": "swipe-right-live--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Receipts show '₹2,000 → ₹3,600 in 5 years' on the big screen with no caveat (the page's disclaimer sits below the fixed control bar, out of view). Add a small line on the receipt screen: 'Made-up 5-year outcomes to show the pattern, not real fund data.'", "id": "swipe-right-live--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone's final screen ends with 'Leaderboard on the big screen'. Add one soft line and link under the lesson, e.g. 'Want to pick real funds this calmly? Find your batch' → register.investingformummies.com.", "id": "swipe-right-live--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The forest-green, lime and Anton look carries no IFM logo on the host screens, and the final board says 'Screenshot the board 📸'. Add the IFM logo and web address to the lobby and final board so shared screenshots credit IFM.", "id": "swipe-right-live--9"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "The page blocks pinch-to-zoom, so players with weak eyesight can't enlarge text. Allow zoom. The same setting is on all five games in this group.", "id": "swipe-right-live--10"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "The live library is loaded as 'whatever the latest version 2 is' (it is 2.118 today), so an upstream update could break a class mid-session. Lock it to one tested version. This applies to all four live games here.", "id": "swipe-right-live--11"}], "key": "swipe-right-live"}, {"slug": "broke-by-friday", "title": "Broke by Friday LIVE", "url": "https://games.investingformummies.com/broke-by-friday", "file": "broke-by-friday-live.html", "kind": "classroom", "audience": "Gen Next", "verdict": "The richest classroom game here: 30 sharp, very Indian-teen scenarios, real peer-to-peer borrowing between students, teacher notes and a lovely 'disciplined twin' ending. What holds it back is joining: the bare link opens a teacher screen, there's no real place to type the room code, and refreshing the projector in the lobby kicks everyone out.", "load": "148 KB page + Supabase library (~218 KB) + QR library; light, but the phone join screen's hero image is missing on the live site (404)", "share_idea": "\"I finished Broke by Friday THRIVING ✨ with ₹6,200 left and my AirPods goal fully saved. Could you survive a month on ₹15,000?\" + link", "share_moment": "On the student's phone end screen, right after the verdict title and the 'disciplined twin' comparison.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The plain link (from WhatsApp or the games page) always opens the teacher screen, so a phone that taps it creates an empty room and never joins the class. Make the plain link ask 'I'm the teacher / Join with a code'. The code box already exists but only appears with ?role=player in the address.", "id": "broke-by-friday--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The lobby tells students 'on the IFM site → enter room', but no such place exists. Show the exact short address to type next to the code, and make that address open the code box.", "id": "broke-by-friday--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Refreshing the projector during the lobby wipes everyone who has already joined. Their phones go back to the join screen and they have to pick their dream again. Keep the lobby on refresh, the same way it already survives mid-game.", "id": "broke-by-friday--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Students' names go onto the projector unescaped, so a name typed with angle-bracket code (e.g. <marquee>) can break or deface the big screen and the borrow lists on other phones. Show names as plain text only, as Quiz and Fund Manager already do.", "id": "broke-by-friday--4"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "'Lock it in' and each choice are sent once with no confirmation. On shaky venue wifi a tap can vanish and the student isn't told. Show 'sending…' and send again automatically if the projector hasn't confirmed within 3 seconds.", "id": "broke-by-friday--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Several prices don't match their own story: café ₹1,300 vs ₹1,800 on the button, hoodie ₹5,600 vs ₹6,800, chef dinner ₹4,000 vs ₹5,000, IMAX ₹2,000 vs ₹2,500, jacket ₹3,800 vs ₹4,500. The Coldplay lesson also says ₹6,500 is '32% of your month' when it is 43% of ₹15,000. Students will check the maths, so fix the numbers.", "id": "broke-by-friday--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The goal moment and the final screen disagree. 'You saved enough! Claim it' counts wallet plus jar, but the final screen and the class banner count only the jar, so a student who just claimed can be told they reached 40%. Use one rule everywhere.", "id": "broke-by-friday--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The life score barely rewards money: an extra ₹10,000 is worth only 20 points, the same as 10 mood points, and mood alone can earn 200. A splurger can top the board and blur the lesson. Give money more weight, or name a separate 'Best saver' winner.", "id": "broke-by-friday--8"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The phone join screen's background art (assets/bbf-live-hero.png) isn't on the live site (404), leaving an empty band at the top. Upload the image or remove the reference.", "id": "broke-by-friday--9"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The lobby QR is only 172px, too small to scan from the back of a classroom unless the teacher knows to tap the corner pill. Show it about 300px wide by default.", "id": "broke-by-friday--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The lobby asks 'can your class make it to day 28?' but scenarios run to day 30. The pop-up dinner also names a real chef (Ranveer Brar) and wrongly calls him 'Michelin'. Make the day number consistent and use a fictional chef.", "id": "broke-by-friday--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The end screen closes with 'next month: flip the spend-vs-save ratio'. Add one line for the parent or teacher watching, e.g. 'IFM runs money workshops for teens: Find your batch' → register.investingformummies.com.", "id": "broke-by-friday--12"}], "key": "broke-by-friday"}, {"slug": "quiz", "title": "The IFM Crorepati (KBC-style quiz)", "url": "https://games.investingformummies.com/quiz", "file": "quiz.html", "kind": "classroom", "audience": "Both", "verdict": "The most polished host experience: a studio backdrop, prize ladder, streaks, fastest-finger, wagers, keyboard control, undo, 'game recovered' after a refresh, and a superb 'teach the tricky ones' ending. What holds it back: the lobby video doesn't load on the live site, a 1 MB logo from the old domain loads on every phone, and players have nowhere to type the PIN the screen tells them to enter.", "load": "158 KB page + Supabase + QR library; host also loads 672 KB + 595 KB studio JPGs and a 1 MB logo PNG from ifm-deploy.vercel.app (phones load that logo too). The 2.8 MB lobby video returns 404 live, so it isn't actually downloading.", "share_idea": "\"I won ₹18.5 Lakh and finished #2 of 24 in the IFM Crorepati money quiz 🏆 Think you know mutual funds better?\" + link", "share_moment": "On the player's phone end screen (rank + winnings), shown once the podium is on the projector.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The lobby and podium video (ifm-hero-lockup-9s.mp4) returns 'not found' on the live site because video files are excluded from deploys, so a cropped logo shows instead. Allow just this file through (it is 2.8 MB, so ideally shrink it) or drop the video.", "id": "quiz--1"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "The IFM logo is a 1 MB PNG pulled from the old ifm-deploy.vercel.app address. It loads on every student's join screen, in the QR centre and as the video poster. Use a small local logo on the new domain (e.g. /ifm-round.png); join screens will open noticeably faster on cheap phones.", "id": "quiz--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector says 'or enter Game PIN', but there's nowhere to type one. The plain link opens a new host screen, and a phone without a room only says 'Scan the QR'. Add a PIN box for phones and make the plain link ask 'Host or join?'.", "id": "quiz--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A mistyped or old PIN leaves the phone on 'Connecting…' forever. Show 'Room not found: check the PIN on the big screen' with a retry box.", "id": "quiz--4"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "Joining and answering are each sent once with no confirmation. If one gets lost, the phone still says 'You're in!' or 'Answer locked ✓', but the projector never counted it and scores the player as 'Too slow'. Resend automatically until the host confirms.", "id": "quiz--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Refreshing the projector during the lobby wipes everyone who joined (refresh mid-game is handled well). Keep lobby players on refresh too.", "id": "quiz--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The screen title is 'Kaun Banega Crorepati', the trademarked name of the Sony TV show, while the browser tab already says 'The IFM Crorepati'. Use the IFM name on screen to avoid a takedown risk.", "id": "quiz--7"}, {"area": "Accessibility", "priority": "Med", "effort": "M", "text": "Phones show only A/B/C/D, so anyone at the back or with weak eyesight can't play fairly. Add a 'show the question on my phone' option; the option text is already sent to the phones.", "id": "quiz--8"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The Round 3 (Risk & Reward) briefing is one dense 70-word paragraph on the projector. Turn it into 3 short lines: 'Invest before you see the question · Right = it grows, wrong = it's gone · Your one 50:50 is now live'.", "id": "quiz--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The player's end screen only says 'now go invest like a pro'. Show the 2–3 questions they got wrong with the right answer (the host already works out the room's 'tricky ones'), then a soft 'Learn this properly: Find your batch' link.", "id": "quiz--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Round 1 says 'trust what you learned this week', which is wrong for one-off talks and the teens set. The podium also shouts 'Crorepati!' even when the winner has ₹6 Lakh. Reword both.", "id": "quiz--11"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The correct answers are included in the data sent to every phone, so a tech-savvy student could peek. Send only the current question's options, and the answer only after the reveal.", "id": "quiz--12"}], "key": "quiz"}, {"slug": "crorepati-lane", "title": "Crorepati Lane", "url": "https://games.investingformummies.com/crorepati-lane", "file": "crorepati-lane.html", "kind": "classroom", "audience": "Mummies", "verdict": "An on-brand, smoothly built Monopoly for mums with nice touches (Market Crash jail, Dividend Pool, SIP top-ups). What holds it back: the game has no end short of bankrupting everyone, and its rules teach the wrong money lesson (other investors pay you 'returns', and an FD behaves exactly like an IPO).", "load": "54 KB page, no libraries; the only weight is a 1 MB logo PNG loaded from ifm-deploy.vercel.app for a 62px icon", "share_idea": "\"I won Crorepati Lane with a ₹48 Lakh portfolio built on index funds and gold 👑 Play the IFM money board game with your friends\" + link", "share_moment": "In the winner pop-up, under the final net-worth ranking, beside 'Play Again'.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "The only ending is when everyone but one player is bankrupt, which can take 1–2 hours, yet the tagline promises 'the richest mum wins'. Let the group pick a length at setup (e.g. 20 minutes or 5 laps), then the highest net worth wins.", "id": "crorepati-lane--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The money lesson is upside down. Landing on another mum's Index Fund makes you 'pay her returns' like rent, and every asset pays the same 10% of its price, so an FD carries the same risk as a small-cap and the IPO is the board's premium square. Pay returns from the market, not from other players. Make FD/PPF small but steady, and stocks bigger but hit by Market Event cards.", "id": "crorepati-lane--2"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the board text is about 8px and names are cut off ('Fixed', 'Govt', 'Small-'), and on a projector it's unreadable from a chair. Use bigger icons with short names, let players tap a square for details, and use the large empty board centre to show the current card or event.", "id": "crorepati-lane--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Advance to PAYDAY' card pays the salary twice (₹4 Lakh instead of ₹2 Lakh): once for passing PAYDAY and again for landing on it.", "id": "crorepati-lane--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A page refresh or an accidental back-swipe wipes the whole game with no warning. Save the game on the device after every turn and offer 'Resume game' on reopening.", "id": "crorepati-lane--5"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The logo is a 1 MB PNG from the old ifm-deploy.vercel.app address, shown at 62px on setup and again on the board. Swap in a small local copy; it is most of this page's download.", "id": "crorepati-lane--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The rules say a frozen player 'needs doubles or ₹50,000', but there is no button to pay ₹50,000 and leave early. Players must fail three turns first. Add a 'Pay ₹50,000 to recover' button.", "id": "crorepati-lane--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The goal is stated two ways ('the richest mum wins' vs 'be the last mum standing'). Some cards also blur real terms: 'Your SIP matured' (SIPs don't mature), and 'top-up your SIP' only after owning a whole colour set. Pick one goal and rename the build step (e.g. 'Grow this holding').", "id": "crorepati-lane--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The winner pop-up only offers 'Play Again'. Add a one-line takeaway (e.g. 'The winner spread her money across safe and growth assets') and a gentle 'Learn to do this for real: Find your batch' link.", "id": "crorepati-lane--9"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The rules hide behind a small 'How to play' link and most mums will skip them. Add a 3-step coach on the first turn (roll → buy or pass → end turn).", "id": "crorepati-lane--10"}, {"area": "Mobile", "priority": "Low", "effort": "S", "text": "The token picker icons are 34px with tight gaps, below the 44px comfortable tap size. Enlarge them or show fewer per row.", "id": "crorepati-lane--11"}], "key": "crorepati-lane"}, {"slug": "mutual-fund-manager", "title": "Mutual Fund Manager LIVE", "url": "https://games.investingformummies.com/mutual-fund-manager", "file": "fund-manager.html", "kind": "classroom", "audience": "Both", "verdict": "A genuinely clever teaching sim: the class becomes the investors of a fund the teacher builds, and AUM, units, NAV, market months and withdrawals are all shown live with the class's own money. What holds it back: a projector refresh wipes the whole session, half the lessons it contains can't be reached, and it names real stocks and shows rosy, unexplained returns.", "load": "207 KB page + Supabase + QR library; plus a 1 MB logo and 13 art JPGs (90–275 KB each, ~2.2 MB total, loaded as screens appear), all from ifm-deploy.vercel.app", "share_idea": "\"Our class just ran a real-style mutual fund: I put in ₹2 Lakh by SIP and watched the NAV go ₹10 → ₹22. Learn how funds really work with IFM\" + link", "share_moment": "On the student's phone, on the final 'Your mutual fund journey' card.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Refreshing the projector wipes the whole session. The host screen always starts a blank fund on load, so every investor is removed and all phones go back to 'join'. Resume the existing room on refresh, as Quiz and Broke by Friday do.", "id": "mutual-fund-manager--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "About half the lessons are built but unreachable: NAV myth, Feezilla (fees), SIP vs lump sum, STP, SWP, diversification, compounding and the factsheet quiz. Nothing in the step bar leads to them, and the host screen has no case to display them. Add them to the flow as optional 'bonus' steps, or remove the dead weight.", "id": "mutual-fund-manager--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The fund's holdings are real companies (Reliance, HDFC Bank, Infosys, TCS, ITC, Asian Paints), which can read as stock picks from an educator who isn't SEBI-registered. Use made-up names (e.g. 'Big Bank Ltd', 'Tech Co') or label them clearly 'names for illustration only'.", "id": "mutual-fund-manager--3"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The fast-forward jumps the NAV to ₹22 in 4 years (roughly doubling, about 19% a year) with 'your money's about to be worth a lot more' and no assumption shown. State the assumption on screen, use a modest figure, and mention it could have been lower.", "id": "mutual-fund-manager--4"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Market months are weighted to rise, and the SIP screen announces 'SIP wins, it's the smart default' based on a dip-then-recover path. Add one honest line: 'In a steadily rising market a lump sum usually ends ahead; SIP's real win is discipline and smoother buying.'", "id": "mutual-fund-manager--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Most explanations on the projector use the 'tiny' style (about 12px) and the step bar is about 11px, too small from the back of a room. Raise body text on host screens to at least 18–20px.", "id": "mutual-fund-manager--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Students can't type the PIN shown on the projector. The plain link opens a new host room, a phone without a room only says 'Scan the QR', and a wrong PIN sits on 'Connecting…' forever. Add a PIN box and a 'Room not found' message.", "id": "mutual-fund-manager--7"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "Joining and investing are sent once with no confirmation. If a message is lost, the phone says 'You're in!' forever while the student is missing from the projector. Resend automatically until the host confirms.", "id": "mutual-fund-manager--8"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The logo and all 13 artworks load from the old ifm-deploy.vercel.app address, but the same art already exists on the games site at /art/. Switch to the local copies so the game keeps working if the old address is retired, and replace the 1 MB logo with a small one.", "id": "mutual-fund-manager--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone's final 'Your mutual fund journey' card has no next step. Add a soft line and link: 'Ready to try this with your own money, step by step? Find your batch' → register.investingformummies.com.", "id": "mutual-fund-manager--10"}], "key": "mutual-fund-manager"}]}, {"group": "class-b", "games": [{"slug": "the-wealth-hack", "title": "The Wealth Hack", "url": "https://games.investingformummies.com/the-wealth-hack", "file": "the-wealth-hack.html", "kind": "classroom", "audience": "Gen Next", "verdict": "The most polished classroom game in this group: projector text scales to the room, guesses stay private, the 12% assumption is printed everywhere, phones opened from WhatsApp get a solo 'find your number' page, and the end screen already has a WhatsApp share. What holds it back is the join path (a game PIN with nowhere to type it, a lobby that empties if the host refreshes) and a heavy phone page.", "load": "123 KB page + Supabase + QR library; phones also pull a 1 MB logo PNG for a 30px badge; projector adds a 400 KB looping video + 215 KB backdrop", "share_idea": "A share already exists and is good. Keep the personal numbers ('₹X a month from today vs ₹Y if I wait 5 years') and the '12% a year, not a promise' line, then add one soft line before the link: 'Want to actually start? Next IFM batch → register.investingformummies.com'.", "share_moment": "Already in the right places (phone end screen after 'Your numbers · keep these', and the solo result). Also add the button to the Round 2 reveal on the phone, which is the peak shock moment.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The projector says 'or enter game PIN E1234', but the phone has nowhere to type a PIN: opening the game on a phone shows the solo page, which only says 'ask your teacher for the game code'. Add a 'Have a game PIN?' box to the solo page so people who can't scan the QR can still join.", "id": "the-wealth-hack--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If the host refreshes while still in the lobby, everyone who already joined disappears and has to join again. The game only picks up where it left off once Round 1 has started. Keep the joined players when the lobby is reloaded, the same way a mid-game reload does.", "id": "the-wealth-hack--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A wrong or expired room link leaves the phone on 'Finding the game…' forever. After about 8 seconds with no game found, show 'We can't find this game. Check the PIN on the big screen' with a box to type it again.", "id": "the-wealth-hack--3"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Every phone downloads a 1 MB logo picture just to show a small round badge in the top bar. A 20 KB version would look the same and makes the join screen appear much faster on slow classroom Wi-Fi.", "id": "the-wealth-hack--4"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The phone screen lays a full-screen grain texture and several blurred glass panels over everything. These make scrolling stutter on cheap Android phones. Turn the grain and blur off on phones and keep them for the projector.", "id": "the-wealth-hack--5"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The game ends on 'The best month to start is this one' and one excuse card even promises 'that is exactly what the next few days are for', but there's no next step. Add a gentle 'Find your batch' link under the WhatsApp button on the phone end screen and at the bottom of the shared message.", "id": "the-wealth-hack--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Nobody mentions that ₹10 Cr in 15–20 years buys much less than ₹10 Cr today. Add one line to the Round 1 reveal, e.g. 'at 6% inflation, ₹10 Cr at 40 is roughly ₹3.5 Cr in today's money'. This keeps the big number honest and makes the 'start now' point stronger.", "id": "the-wealth-hack--7"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Round 1 gives phones 5 minutes on the clock to type one number. Most people lock in within a minute, and the room goes flat while they wait. Start the clock at 2 minutes (the host can still add time) and let the 'Reveal' button pulse as soon as everyone has locked in.", "id": "the-wealth-hack--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The Round 3 reveal says things like '1.6× less money', which is hard to read. Say 'about 60% as much' or 'less than two-thirds'.", "id": "the-wealth-hack--9"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "The headings use Fraunces and Manrope, not the brand's Lora and Nunito. This is the only game here in a different type family. Decide whether the midnight-and-gold look is now the standard. If not, switch the fonts when you do the phone and lobby redesign that's already planned.", "id": "the-wealth-hack--10"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "The projector's background video is hidden on phones, but because it is set to autoplay, some phones may still download its 400 KB. Only add the video to the page in host mode.", "id": "the-wealth-hack--11"}], "key": "the-wealth-hack"}, {"slug": "swayamvar/", "title": "Swayamvar", "url": "https://games.investingformummies.com/swayamvar/", "file": "swayamvar/ (index.html, engine.js, game-data.js, ui-common.js, host-view.js, player-view.js; edit the .jsx then run build-jsx.sh)", "kind": "classroom", "audience": "Mummies", "verdict": "A lovely, very on-brand-for-the-audience idea (asset classes as rishta prospects), with gorgeous art, precompiled code, and a host refresh that keeps the room. But the whole world shares one room (1995), any visitor opens it as the host with a Reset button, and the join address printed on the projector doesn't exist.", "load": "6 KB page + ~120 KB own JS (precompiled, no Babel) + React production + Supabase; portraits are 30–70 KB WebPs loaded per screen (1.7 MB folder). Fast", "share_idea": "'My money Swayamvar: I'd marry Mr. Equity, date Mr. Gold, and call Mr. Cash at 2 AM 💍 Who would you pick for your savings? → games.investingformummies.com/swayamvar/'", "share_moment": "On the phone's 'Your Report Card' screen at the finale, just under the four picks and the 'Welcome to Asset Allocation' quote.", "items": [{"area": "Bug", "priority": "High", "effort": "M", "text": "Every class uses the same fixed room code (1995), and anyone who opens the game link gets the teacher screen for that room, including the 'Reset game' button. A visitor from the games page can see a live class and wipe it, and two workshops on the same day would clash. Give each teacher a new room code when they open the game, as Sapno Ka Ghar and The Wealth Hack already do.", "id": "swayamvar--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector prints 'ifm.game/swayamvar' as the join address, but that domain doesn't exist. Anyone who types it instead of scanning gets an error page. Print the real address plus the room code instead, or remove the line.", "id": "swayamvar--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Confirmed: the QR code sends phones to the old address ifm-deploy.vercel.app/swayamvar/ (built in swayamvar/ui-common.jsx and the compiled ui-common.js). It works today, but students see an unfamiliar web address and it will break if that old project name ever changes. Point it at games.investingformummies.com, then rebuild with build-jsx.sh.", "id": "swayamvar--3"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Someone opening the link on a phone (from the games page or WhatsApp) lands on the projector lobby, which is cut off on a phone and shows a QR they can't scan with the same phone. A friendly 'host or join?' landing page already exists in app.jsx but can never appear, because the game always starts as host. Show it on phones.", "id": "swayamvar--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "One tap on a suitor casts the vote straight away, with no undo. On a two-column grid of small cards, a mis-tap or a scroll that turns into a tap locks in the wrong answer. Make the first tap select the suitor, then add a 'Confirm' button, or allow changes until the host closes voting.", "id": "swayamvar--5"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Lots of labels are tiny: phone captions such as 'YOUR NAME', 'Waiting for others…' and the return figures on the vote cards are about 7–9px, and projector captions are about 8–10px. Set the smallest text to about 12px on phones and 18px on the projector so the back row and older eyes can read them.", "id": "swayamvar--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The finale bucket screen and the phone report card show '12–15% returns', '8–12%+' and '8–10%' with no note. Add 'long-term past averages, not guaranteed' next to these numbers on both screens. The footer disclaimer is too far away and too small to count.", "id": "swayamvar--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone finale ends on the quote and nothing else, and the projector only offers 'Play Again'. Add a soft 'Want your own portfolio built like this? Find your batch' link on the phone report card.", "id": "swayamvar--8"}, {"area": "Bug", "priority": "Low", "effort": "M", "text": "Each vote re-saves the whole game. If the host taps 'close voting' at the same moment someone votes, the saved game can slip back to 'voting', and phones may flip back to the vote screen for a few seconds until the host's next tap. Make votes save only the vote.", "id": "swayamvar--9"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "If the host refreshes during the finale, the bucket reveal starts again from the first step because the step number is only kept in the browser. Save the reveal step with the rest of the game.", "id": "swayamvar--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'est. 1995' and 'Finding the Perfect Match for your savings since 1995' read like a real founding date, but IFM wasn't around then. Either make the joke obvious ('Aunty-approved since 1995') or drop it.", "id": "swayamvar--11"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "React and Supabase load from addresses that only say 'version 18' and 'version 2', with no exact number. A surprise update on the CDN could break the live game during a class. Fix them to the exact versions that work today.", "id": "swayamvar--12"}], "key": "swayamvar"}, {"slug": "stock-rush/", "title": "Stock Rush (teen)", "url": "https://games.investingformummies.com/stock-rush/", "file": "stock-rush/ (index.html + engine.js, game-data.js, ui-common.jsx, host-view.jsx, player-view.jsx compiled in the browser)", "kind": "classroom", "audience": "Gen Next", "verdict": "The game itself is deep: real Indian market history, lock-to-finish rounds, recaps, a counterfactual and an exit quiz. But the bare link puts everyone in one shared room, the printed join address leads to the teacher screen, and phones have to download and compile about 1 MB of development-mode code before anything appears. Every item here needs the owner's call because of the don't-edit rule.", "load": "14 KB page, but every phone downloads ~650 KB of Babel plus ~260 KB of React development builds, then compiles ~330 KB of JSX (including the teacher screen it never uses); slow on a cheap Android", "share_idea": "'I finished #2 in Stock Rush with ₹1.38L from ₹1L, trading 10 years of real Indian market news in 20 minutes 📈 Think you'd beat me? → games.investingformummies.com/stock-rush/'", "share_moment": "On the student's phone end screen, right after their final rank and net worth, above the counterfactual.", "items": [{"area": "Bug", "priority": "High", "effort": "M", "text": "Opening the plain link /stock-rush/ (no '?role=host') shows the teacher screen, but for one shared room called TEEN. Anyone else who opens the same link gets 'There's already a game here' with Resume and Start Fresh buttons for that room, so a curious student or a games-page visitor can take over or wipe a live class. A random room code is only created when the link includes ?role=host. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector prints 'ifm-deploy.vercel.app/stock-rush' as the join address. That is the old domain, and it has no room code, so a student who types it lands on the teacher screen for the shared TEEN room, not the join form. Print the real address including the room code, or drop it and rely on the QR. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Typing the room code by hand never works. The join form only accepts the built-in code 'TEEN', not the teacher's random 4-letter code, so the Join button stays greyed out. Only scanning the QR gets students in. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--3"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "Every phone downloads the in-browser compiler (Babel) plus the slow development versions of React, then compiles about 330 KB of code before showing anything. On a cheap Android that takes several seconds, and the development builds keep the game slower while it runs. Precompiling, as was done for Swayamvar, removes all of this. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A student's identity is kept only for the life of the browser tab. On cheap Androids, switching to WhatsApp or the camera often reloads the tab, and the student lands back on the join screen mid-game. Stock Rush Pro already fixed this by saving identity more permanently. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "With a wrong or expired room link, the phone says 'Waiting for your teacher. Your phone is connected' forever, even though there's no game. After a few seconds, show 'No game found with this code'. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--6"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "About 90 bits of projector text are fixed at 9–13px, so the leaderboard details and the activity feed can't be read from the back of a classroom. Scale the projector text to the screen size, the way The Wealth Hack does. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--7"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The end screen ranks real companies by 'what if you'd put all your money in one stock in 2016', which for teens reads like 'pick the winner'. Add a line under the best result, e.g. 'that's hindsight; nobody knew this in 2016', and show a 'spread across all 8' result as the sensible line. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The link preview (WhatsApp/Google text) says 'eight rounds of real headlines', but the game plays 5 rounds. Change it to five. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--9"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "The look is black-and-white Geist type, with none of the IFM navy, teal, gold, Lora or Nunito, so teens don't connect it to the brand they'll see on posters and Instagram. Add the brand colours and logo, at least on the join and end screens. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--10"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "The student end screen has no share and no next step. For teens the natural next step is 'Tell your parents about IFM's workshops', with a link. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--11"}], "key": "stock-rush"}, {"slug": "stock-rush-pro/", "title": "Stock Rush Pro", "url": "https://games.investingformummies.com/stock-rush-pro/", "file": "stock-rush-pro/ (index.html + engine.js, game-data.js, ui-common.jsx, host-view.jsx, player-view.jsx compiled in the browser)", "kind": "classroom", "audience": "Both", "verdict": "The richest classroom game: IPOs, splits, buybacks and rights issues over real Indian history, a resume-or-restart choice when the host reloads, rejoin-safe phones and a shareable result card. It is held back by a broken manual join (typed codes and the printed address both fail), every phone compiling about 340 KB of JSX, and a share link that 404s.", "load": "9 KB page, but every phone downloads ~650 KB of Babel and compiles ~345 KB of JSX (React production build), plus Supabase, QR and html2canvas; several seconds on a cheap Android", "share_idea": "Fix the existing share text, which ends on a dead link: 'I finished #3 of 24 in Stock Rush Pro, ₹2L → ₹3.1L through 12 years of real Indian markets (IPOs, splits, Yes Bank…) 📈 Play it → games.investingformummies.com/stock-rush-pro/'", "share_moment": "On the player's end screen, on the existing result card, after rank and net worth and before the 'what if' comparison.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Typing a room code never works. If a phone opens the player page without a code in the link, the join form only accepts the built-in code 'GO25', so the teacher's real code (e.g. 'KQWT') keeps the Join button greyed out with no explanation. Only scanning the QR gets people in.", "id": "stock-rush-pro--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector prints 'ifm-deploy.vercel.app/stock-rush-pro' as the join address (in two places). That is the old domain, and the plain link opens a new teacher screen, not the join form. A student who types it starts their own empty game. Print a working join link, or 'scan the QR' only.", "id": "stock-rush-pro--2"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "Every phone downloads the in-browser compiler (Babel, about 650 KB) and compiles about 340 KB of code, including the teacher screens it never uses, before showing the join form. On a cheap Android that's a long blank wait while the room watches. Precompile it, as was done for Swayamvar.", "id": "stock-rush-pro--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share my result' message ends with https://investingformummies.com/stock-rush-pro, which is a 404 page. Change it to games.investingformummies.com/stock-rush-pro/.", "id": "stock-rush-pro--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Someone who taps Stock Rush Pro on the games page from a phone lands on 'Go Live: project this screen', which is meaningless on a phone. On phones, show 'This is a live classroom game. Join with a room code, or see how it works', the way The Wealth Hack's phone page does.", "id": "stock-rush-pro--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "About 80 bits of projector text are fixed at 9–13px (leaderboard sub-lines, activity feed, chips), too small for the back of a room. Scale the projector text with the screen size, as The Wealth Hack does.", "id": "stock-rush-pro--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Real listed companies carry labels like 'low risk' (Infosys, HDFC Bank, TCS), and the end screen compares 'what if you'd held X'. Add one clear line on the end screen and the stock cards: 'real companies, used as a history lesson, not a recommendation; past prices don't predict future ones'.", "id": "stock-rush-pro--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The game describes its own length five different ways: 'A decade', '9 years' (share text), 'twelve years 2014→2026' (landing), 'five real market eras' (link preview) and '6 rounds' (description). Pick one, e.g. '6 rounds, 2014 to 2026', and use it everywhere.", "id": "stock-rush-pro--8"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "The end screen has a share button but no next step. Add a quiet 'Liked managing a portfolio? Learn to do it for real: find your batch' link under the share button.", "id": "stock-rush-pro--9"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "Like the teen version, it uses black-and-white Geist type with none of the IFM colours or fonts, so it doesn't look like an IFM product on the projector. Add the navy, teal and gold and the logo, at least on the lobby and end screens.", "id": "stock-rush-pro--10"}], "key": "stock-rush-pro"}, {"slug": "sapno-ka-ghar.html", "title": "Sapno Ka Ghar", "url": "https://games.investingformummies.com/sapno-ka-ghar.html", "file": "sapno-ka-ghar.html", "kind": "classroom", "audience": "Mummies", "verdict": "A brilliant metaphor that lands: a 90-second shopping panic, bought ratings, a designer who is secretly a fund manager, and a 'you've been investing all along' reveal. It is fully on-brand and gives each class its own room. It is held back by phones that redraw all 116 items whenever anyone buys anything (exactly during the 90-second rush), small buy buttons, and a lobby that empties if the host refreshes.", "load": "128 KB single page + Supabase + QR library; the projector also loads a 1 MB logo PNG from the old ifm-deploy domain. Phones are light on download but heavy on redrawing", "share_idea": "'My dream-home score went from 41 (DIY) to 88 (with a designer) in Sapno Ka Ghar 🏡 Turns out I'd been learning mutual funds the whole time. Try it → games.investingformummies.com/sapno-ka-ghar.html'", "share_moment": "On the phone finale ('Your dream home got built'), right under the DIY → today score card.", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "During the 90-second shopping rush, every purchase by anyone in the room makes every phone redraw the whole 116-item catalogue (the host saves after each buy, and phones also redraw on a 2.5-second check). With 25–30 people on cheap Androids, the list stutters, the category strip jumps back and taps miss, at the one moment speed matters. Update only the budget and the item that changed.", "id": "sapno-ka-ghar-html--1"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The 'Add to home' button is about 30px tall, below the comfortable 44px. The same button instantly turns into 'tap to return', so a nervous double-tap buys and then returns the item. Make it taller, and make returning a separate small link or a confirm.", "id": "sapno-ka-ghar-html--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If the host reloads during the lobby, or more than 30 minutes after the last action, the game starts fresh and everyone who joined disappears from the projector. Phones fall back to the join screen. Keep the lobby and its players on reload, and allow a longer gap for long discussions.", "id": "sapno-ka-ghar-html--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A wrong or old PIN leaves the phone on 'Connecting…' forever. After a few seconds, show 'No game found with this PIN. Check the big screen'. Joining also waits silently on 'Unlocking your door…' if the host screen is offline; add a 'still trying…' message.", "id": "sapno-ka-ghar-html--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The projector's logo is a 1 MB PNG loaded from the old address ifm-deploy.vercel.app. Use a small copy from games.investingformummies.com so it loads fast and survives if the old address goes.", "id": "sapno-ka-ghar-html--5"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Opening the link on a phone (e.g. from a WhatsApp forward) shows the projector screen, with overlapping panels and its own QR. On phones, show 'This is a live class game. Enter the PIN from the big screen' with a PIN box, the way The Wealth Hack does.", "id": "sapno-ka-ghar-html--6"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone finale ends on the closing quote and no next step, though this is the exact moment a mum is thinking 'I want a designer for my money'. Add a gentle 'Want help building yours? Find your batch' link.", "id": "sapno-ka-ghar-html--7"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "On the projector, the '↺ New game' button sits on top of the logo and the 'Investing for Mummies' label in the top-left corner. Move it to a bottom corner.", "id": "sapno-ka-ghar-html--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The phase strip at the top lets the host jump to any step (including back to Lobby) with one click, which is easy to do by accident mid-class. Ask 'Jump back to Lobby?' before going backwards.", "id": "sapno-ka-ghar-html--9"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "The designer (the fund) always lands every home at 82–90, which suggests funds never have a bad year. Add one line to 'The Secret' screen: 'Real funds also have bad years and different fees; check the fund's track record, and past returns aren't promises.'", "id": "sapno-ka-ghar-html--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "SALE items say '20% OFF TODAY', but the crossed-out price makes them about 37% off. One shopping 'noise' message names a real brand (Natuzzi) while every catalogue brand is made up. Match the numbers and use a made-up brand name.", "id": "sapno-ka-ghar-html--11"}], "key": "sapno-ka-ghar-html"}]}, {"group": "classic", "games": [{"slug": "tools-budget", "title": "Budget Tracker", "url": "https://games.investingformummies.com/classic?open=resources&tab=budget", "file": "classic.html (#res_budget)", "kind": "tool", "audience": "Mummies", "verdict": "A thorough monthly budget with a 50/30/20 health check and emergency-fund targets. Two things hold it back: it comes pre-filled with ₹1.24 lakh of sample expenses but no income, and on a phone it sits in a box that scrolls separately from the page.", "load": "99 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "My family's money in 3 numbers: ₹X needs, ₹Y wants, ₹Z left to save. See where your money goes in 2 minutes: <link>", "share_moment": "On the dashboard, right under 'Money Remaining' and the 50/30/20 scorecard", "recommendation": "Move to /tools as its own page — it is the most useful everyday tool here and nothing else on the site duplicates it (Money Map is the teen version).", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 390px phone the calculator sits in a fixed 1,400px-tall box while its content is 2,300px tall and 447px wide, so the results scroll inside a box inside the page, and long labels are cut off ('Salary (…', 'Business…', 'Rental In…'). As its own page, let it grow to full height and stack each label above its input.", "id": "tools-budget--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "All expense fields start filled with sample numbers (₹15,000 EMI, ₹16,000 groceries and more, ₹1.24 lakh a month in total) but income starts at zero. A mum who fills in only her salary gets a scary 'you're spending more than you earn' verdict built on made-up costs. Start every field empty with grey example text, or ask 'Use a sample family?' first.", "id": "tools-budget--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "In the 'Where does your money go' doughnut, 'Fixed Expenses' and 'Essentials' share the same navy colour, and so do the Income and Essentials bars, so the two biggest slices can't be told apart. Give every category its own colour.", "id": "tools-budget--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The results stop at 'Consider moving it into savings'. Add one step that turns the surplus into action: 'Your ₹X left over could be an emergency fund in N months, then a ₹Y SIP'. Link it to the SIP Calculator and the emergency-fund target already on the page.", "id": "tools-budget--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-budget--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "After the health check, add one gentle line: 'Want help building this into a plan? Find your batch' linking to register.investingformummies.com.", "id": "tools-budget--6"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "Shrink the frame on its own page: drop the second, duplicate Google Fonts load and the unused empty script blocks, and load Chart.js only when 'Show Me My Budget Picture' is tapped.", "id": "tools-budget--7"}], "key": "tools-budget"}, {"slug": "tools-sip", "title": "SIP Calculator", "url": "https://games.investingformummies.com/classic?open=resources&tab=sip", "file": "classic.html (#res_sip)", "kind": "tool", "audience": "Both", "verdict": "A strong step-up SIP calculator with a year-by-year table and a 'cost of starting 5 years later' card. But its starting numbers (₹1 lakh a month at 12%) are far from a first-time investor's reality, and some 'real-life' comparisons overpromise.", "load": "85 KB frame, hand-drawn chart, no libraries; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "If I step up my ₹X SIP by 10% a year, I could have ₹Y in Z years instead of ₹W (assuming 12%). Try your number: <link>", "share_moment": "Below the 'Extra Wealth Created' result card", "recommendation": "Move to /tools as its own page — it is the core calculator, and it is the natural next step from Budget and Goal tools.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The default SIP is ₹1,00,000 a month with an 11% step-up, while the explainer underneath talks about ₹10,000 a month. Start at ₹5,000–₹10,000 and a 10% step-up so the first result feels reachable for a mum starting out.", "id": "tools-sip--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The 'real-life equivalent' lines claim things like 'That's 1.2 crore — enough to retire on' and '₹X/month — a nice salary boost' (that one is the lump sum divided by 12, which is not a monthly income). Remove the retirement claim, fix or drop the salary line, and show the return assumption next to every result ('at 12% a year, not guaranteed').", "id": "tools-sip--2"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone it shows in a 900px-tall box while its content is 3,070px tall, so you see only the inputs and must scroll inside the box to reach any result. As its own page, let it run full height and put the two result cards first.", "id": "tools-sip--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The title says 'SIP Step-Up Calculator', but there is no line explaining what a step-up is. Add one: 'Step-up = raising your SIP a little every year, usually when your salary goes up.' The custom-return box also reads '0 %'; leave it blank with a placeholder.", "id": "tools-sip--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a 'show in today's money' switch that removes 6% inflation, so ₹2 crore in 25 years is also shown as roughly ₹46 lakh in today's money. This is the honest version of the big number.", "id": "tools-sip--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-sip--6"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Under 'The Cost of Starting 5 Years Later', add a soft 'Ready to start your first SIP with guidance? Find your batch' link.", "id": "tools-sip--7"}], "key": "tools-sip"}, {"slug": "tools-swp", "title": "SWP Calculator", "url": "https://games.investingformummies.com/classic?open=resources&tab=swp", "file": "classic.html (#res_swp)", "kind": "tool", "audience": "Mummies", "verdict": "A clear 'can your money pay you a salary' calculator with an honest 'money runs out in year 5' warning and safe, moderate and danger withdrawal bands. The 'historical real data' mode names real mutual funds and tells people which plan to pick, which is a compliance risk.", "load": "35 KB built into the hub page (no frame); historical mode calls the free mfapi.in fund database; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Can ₹X give me ₹Y a month for 25 years? This calculator says my money lasts N years. Check yours: <link>", "share_moment": "Directly under the remaining-corpus result and the 'money runs out' banner", "recommendation": "Move to /tools as its own page — it is the only withdrawal tool, and it pairs with the Retirement Planner.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "The historical mode's helper text names real funds ('Parag Parikh Flexi Cap', 'HDFC Top 100') and says 'Pick the Direct option for lower fees'. That reads as a recommendation from an unregistered educator. Use neutral wording ('type any mutual fund name'), drop the advice, and add 'past performance is not a guide to future returns'.", "id": "tools-swp--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The default (₹50 lakh corpus, ₹1 lakh a month, so 24% withdrawn a year) runs out in year 5. That is a dramatic lesson, but it opens on a red failure with no explanation. Either start at a sustainable 5–6% and invite people to push it, or label the default 'What happens if you withdraw too much?'", "id": "tools-swp--2"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "On desktop the IFM logo watermark sits inside the doughnut, behind the 'Remaining Corpus ₹0' figure, and makes the key number hard to read. Remove the watermark from the chart centre.", "id": "tools-swp--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'SWP' is never spelled out. Add 'SWP = Systematic Withdrawal Plan, a fixed monthly amount paid to you from your investments' under the title, and explain 'step-up' as 'raise the withdrawal each year to keep up with prices'.", "id": "tools-swp--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-swp--5"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Add a 'what if markets fall in year 1?' toggle to the simple mode. Showing the same plan with a bad first year teaches sequence risk, the real danger for retirees, far better than a flat 8%.", "id": "tools-swp--6"}], "key": "tools-swp"}, {"slug": "tools-retire", "title": "Retirement Planner", "url": "https://games.investingformummies.com/classic?open=resources&tab=retire", "file": "classic.html (#res_retire)", "kind": "tool", "audience": "Mummies", "verdict": "The most complete planner here: inflation, life expectancy, per-asset existing savings, the gap, the SIP or lump sum to close it, and a disclaimer. It is too technical for beginners (a methodology essay for financial planners) and breaks on phones.", "load": "143 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I need about ₹X to retire at 60 and I'm Y% of the way there. Here's the monthly SIP that closes my gap: <link>", "share_moment": "After the 'Monthly SIP to Bridge the Gap' card", "recommendation": "Move to /tools as its own page — keep this one, retire the beta Retirement Planner and the Chat Bot, and borrow the beta's per-investment step-up field.", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 390px phone the content is 620px wide in a 362px box, so the input boxes and section badges are cut off on the right, and the existing-savings table needs sideways scrolling inside a box that also scrolls up and down. Stack the savings rows as cards on phones, one asset per card.", "id": "tools-retire--1"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The 'Note for Financial Planners — Methodology' block (annuity formulas, 'end-of-period', Excel comparison) sits in the main flow. Fold it behind a 'How we calculate' link so a mum isn't confronted with formulas after her result.", "id": "tools-retire--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The defaults are aimed at a high earner (₹1 lakh a month spending, retire at 65). Use ₹50,000 and 60, the common Indian retirement age, and label the cryptic 'M' and 'Cont. yrs' columns in plain words ('Monthly top-up', 'For how many years').", "id": "tools-retire--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Per-asset return defaults (stocks 13%, mutual funds 12%, NPS 10%) appear as plain numbers. Add a small 'assumed, not guaranteed' note beside the returns rows, not only in the footer disclaimer.", "id": "tools-retire--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-retire--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Under the gap result, add 'Not sure how to close a ₹X gap? This is exactly what our course covers — find your batch' linking to register.investingformummies.com.", "id": "tools-retire--6"}], "key": "tools-retire"}, {"slug": "tools-edu", "title": "Education Planner", "url": "https://games.investingformummies.com/classic?open=resources&tab=edu", "file": "classic.html (#res_edu)", "kind": "tool", "audience": "Mummies", "verdict": "A genuinely useful multi-child planner with India/abroad costs, education inflation and a monthly SIP to close the gap. The phone layout is the main problem: labels cut off and a table wider than the screen.", "load": "115 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "My child's college will cost about ₹X by 2040. Starting ₹Y a month now covers it (assuming 11%). Plan yours: <link>", "share_moment": "After the 'Monthly SIP Needed to Bridge the Gap' card", "recommendation": "Move to /tools as its own page — it is a top worry for the core audience, and nothing else covers it.", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the content is 634px wide in a 362px box. Labels are truncated ('Age When Edu…', 'Duration of Edu…', 'Annua…') and the investments table needs sideways scrolling. Put each label above its field and turn the table rows into stacked cards.", "id": "tools-edu--1"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The savings row 'Sukanya / PPF / SSY' lists Sukanya twice (SSY is Sukanya Samriddhi Yojana). Rename it 'Sukanya Samriddhi (SSY) / PPF'.", "id": "tools-edu--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "For 'Abroad', the dollar rate is a hidden assumption. Show it next to the cost ('at ₹90 per $; the rupee has historically weakened about 3% a year') so parents see why overseas costs grow faster.", "id": "tools-edu--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a simple 'what if I start 3 years later?' line next to the SIP result. The jump in monthly SIP is the emotional hook that makes a parent act today.", "id": "tools-edu--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-edu--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "After the result, add a soft link: 'Want a plan for every goal, not just this one? Find your batch'.", "id": "tools-edu--6"}], "key": "tools-edu"}, {"slug": "tools-holiday", "title": "Holiday Budget", "url": "https://games.investingformummies.com/classic?open=resources&tab=holiday", "file": "classic.html (#res_holiday)", "kind": "tool", "audience": "Mummies", "verdict": "A friendly trip budget with per-person and per-night costs and a monthly savings target. It shows two headers at the top, compiles its code in the browser, and misses the money lesson about where to keep the holiday savings.", "load": "57 KB frame + React + Babel compiling the page in the browser (about 1.5 MB of scripts before it can be used); the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Our 7-night family trip = ₹X. Saving ₹Y a month gets us there by <month> with no credit card hangover: <link>", "share_moment": "On the summary screen, under the 'Save / Month' and 'Save / Week' chips", "recommendation": "Move to /tools as its own page — a light, fun entry point to budgeting, and nothing else covers it.", "items": [{"area": "Layout", "priority": "High", "effort": "S", "text": "The first screen shows two stacked banners, 'Holiday Budget Planner' and then 'Family Travel Budget Planner', which push the trip form below the fold on phones. Keep one banner.", "id": "tools-holiday--1"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "It is the only calculator that downloads React and the Babel compiler and translates its own code on every visit, adding seconds on a mid-range phone. Pre-build it to plain JavaScript when moving it to its own page.", "id": "tools-holiday--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Two tips are risky for this audience: 'Pay big-ticket items with a rewards card' (credit-card debt) and 'Book flights on Tue/Wed — 10–15% cheaper' (unproven). Replace them with 'Keep the trip fund in a separate savings account or recurring deposit' and 'Book early and set a fare alert'.", "id": "tools-holiday--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If no month is picked, or a past month is picked, the whole 'Save per month' section silently disappears. Default to a month 6 months ahead and block past months.", "id": "tools-holiday--4"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Add one line on where to park the monthly savings ('a recurring deposit or a liquid fund, not equity, for money needed within a year'). This turns a trip planner into a money lesson.", "id": "tools-holiday--5"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-holiday--6"}], "key": "tools-holiday"}, {"slug": "tools-alloc", "title": "Asset Allocation", "url": "https://games.investingformummies.com/classic?open=resources&tab=alloc", "file": "classic.html (#res_alloc)", "kind": "tool", "audience": "Mummies", "verdict": "A quick age-plus-risk slider that gives a five-asset mix. Its explanation contradicts its own table, and words like 'Recommended' and 'the right mix' read as personal advice.", "load": "18 KB frame, no libraries; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "At 35 with a moderate appetite, the 100-minus-age rule suggests about X% equity. What's your mix? <link>", "share_moment": "Under the allocation bar and table", "recommendation": "Merge with Mix My Portfolio — it uses exactly the same age-band table; the game teaches the rule without telling a real person what to buy. Keep a 'try your own age' final round there.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "At age 30 it says '100 − 30 = 70% base equity' but the table shows 55% equity, and the text says 'your moderate profile keeps it close to 55%'. The rule and the numbers disagree. Either use the rule or drop the rule label.", "id": "tools-alloc--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The heading 'Recommended Allocation' and the subtitle 'the right mix of Equity, Bonds, Real Estate, Gold & Cash' sound like personal advice. Use 'A common rule-of-thumb mix for your age' and keep the SEBI disclaimer visible next to the result.", "id": "tools-alloc--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "It suggests 10% in 'Real Estate' for a 30-year-old, which a beginner can't buy in small amounts. Say 'Real estate (for example via REITs)' or fold it into equity, and explain bonds as 'debt funds / FDs'.", "id": "tools-alloc--3"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "It uses a purple theme, unlike the navy, teal and gold of every other IFM tool, and on desktop a large empty area sits below the button before you calculate. Restyle to brand colours.", "id": "tools-alloc--4"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "There are two 'Download My Plan' buttons, one inside the calculator and one under it, plus the WhatsApp button that shares the old ifm-deploy.vercel.app address. Keep one download button and fix the share address.", "id": "tools-alloc--5"}], "key": "tools-alloc"}, {"slug": "tools-divplan", "title": "Dividend Income Planner", "url": "https://games.investingformummies.com/classic?open=resources&tab=divplan", "file": "classic.html (#res_divplan)", "kind": "tool", "audience": "Mummies", "verdict": "A small dividend-reinvest-versus-cash projector with a chart and a disclaimer. Its jargon (DRIP), optimistic example yield and missing tax make it the weakest of the calculators for beginners.", "load": "14 KB frame + a second, different copy of Chart.js (4.4.0 from jsdelivr, unlike every other tool); the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "₹5 lakh could pay me about ₹X a month in dividends (assuming Y% yield). See what yours could pay: <link>", "share_moment": "Under the 'Monthly Dividend Income (Year 1)' result", "recommendation": "Move to /tools as its own page — useful for retirees, but low priority; fix the copy first.", "items": [{"area": "Copy", "priority": "High", "effort": "S", "text": "'DRIP' is an American term. In Indian mutual funds this is 'IDCW reinvestment' versus 'IDCW payout'. Rename it and add one line of explanation.", "id": "tools-divplan--1"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The example yield '3.5%' sits above the Nifty's typical 1–1.5%, and dividends are taxed at your slab rate in India, which the tool ignores. Use a 1.5% example, add a tax-slab field or note, and keep the disclaimer next to the result.", "id": "tools-divplan--2"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "On a phone the content is 415px wide in a 362px box, s
