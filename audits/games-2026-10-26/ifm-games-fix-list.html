<title>IFM Games Fix List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one working column — sticky progress + filters, then a card per game with tickable rows. IFM brand: navy / teal / gold, Lora + Nunito. */
:root{
  --bg:#f5f8f7; --surface:#ffffff; --ink:#1a3a5c; --muted:#5a7480; --line:#dbe6e3;
  --teal:#1f7a70; --teal-soft:#e2f2ef; --gold:#a8822a; --gold-soft:#f6eed9;
  --hi:#b4372f; --hi-soft:#f8e4e1; --med:#9a6a10; --med-soft:#f6ecd6; --lo:#4d6b78; --lo-soft:#e6eef1;
  --done:#8aa0a8; --wa:#1f9d57;
  --serif:'Lora',Georgia,'Times New Roman',serif; --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1c27; --surface:#162736; --ink:#e4eef2; --muted:#9db3bd; --line:#26394a;
  --teal:#5fc4b6; --teal-soft:#183a3a; --gold:#d9b85a; --gold-soft:#3a3220;
  --hi:#f08a80; --hi-soft:#43231f; --med:#e2b55a; --med-soft:#3c3018; --lo:#9fbac6; --lo-soft:#203342;
  --done:#5f7682; --wa:#4cc983; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c27; --surface:#162736; --ink:#e4eef2; --muted:#9db3bd; --line:#26394a;
  --teal:#5fc4b6; --teal-soft:#183a3a; --gold:#d9b85a; --gold-soft:#3a3220;
  --hi:#f08a80; --hi-soft:#43231f; --med:#e2b55a; --med-soft:#3c3018; --lo:#9fbac6; --lo-soft:#203342;
  --done:#5f7682; --wa:#4cc983; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
h1,h2{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15}
.lede{color:var(--muted);margin:8px 0 0;max-width:64ch}
.status{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.4em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line);margin-top:18px}
.prog{display:flex;align-items:center;gap:12px}
.prog-track{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog-fill{height:100%;background:var(--teal);width:0;transition:width .4s ease}
.prog-num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:700 13px var(--sans);cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.cb:focus-visible,input[type=search]:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
select#jump{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font:700 13px var(--sans);min-height:36px;max-width:100%}
input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px var(--sans);min-height:36px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.group-h{font-family:var(--sans);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px}
.game{scroll-margin-top:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.game-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 10px;flex-wrap:wrap}
.game-h h2{font-size:20px}
.game-h a{color:var(--teal);font-weight:800;font-size:13.5px;text-decoration:none;white-space:nowrap}
.game-h a:hover{text-decoration:underline}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--teal-soft);color:var(--teal)}
.tag.k-classroom{background:var(--gold-soft);color:var(--gold)}
.tag.k-site{background:var(--ink);color:var(--bg)}
.tag.count{background:transparent;color:var(--muted);padding-left:0}
.meta{padding:0 18px 12px;display:grid;gap:6px;font-size:14px}
.meta p{margin:0;max-width:75ch}
.meta .verdict{color:var(--ink)}
.meta .load,.meta .moment{color:var(--muted);font-size:13.5px}
.share{display:flex;gap:8px;align-items:flex-start;background:var(--teal-soft);border-radius:10px;padding:9px 12px;margin:2px 0 0}
.share svg{flex:none;margin-top:2px}
.share q{font-style:italic}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 18px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.cb{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;margin:1px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.cb:checked{background:var(--teal);border-color:var(--teal)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:disabled{cursor:default;opacity:.6}
.it-body{min-width:0}
.it-text{margin:0}
.it-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12px;font-weight:800}
.p{padding:1px 7px;border-radius:5px}
.p-High{background:var(--hi-soft);color:var(--hi)} .p-Med{background:var(--med-soft);color:var(--med)} .p-Low{background:var(--lo-soft);color:var(--lo)}
.area,.eff{color:var(--muted)}
.when{color:var(--teal)}
.item.is-done .it-text{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--done)}
.item.is-done .p{opacity:.55}
.rec{margin:0 18px 12px;font-size:13.5px;font-weight:700;color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:560px){.game-h,.meta,.item{padding-left:14px;padding-right:14px}.item{gap:10px}.sep{display:none}}
@media (prefers-reduced-motion:reduce){.prog-fill{transition:none}}
</style>

<div class="wrap">
  <h1>IFM Games Fix List</h1>
  <p class="lede">Every game on games.investingformummies.com, audited as a game designer and a web designer. Tick an item when it's done; ticks are saved for everyone who opens this page.</p>
  <p class="status" id="status" role="status">Loading saved ticks…</p>

  <div class="bar">
    <div class="prog"><div class="prog-track" aria-hidden="true"><div class="prog-fill" id="fill"></div></div><div class="prog-num" id="pnum">0 / 0 done</div></div>
    <div class="filters" role="group" aria-label="Filters">
      <button class="chip" data-f="prio" data-v="High" aria-pressed="false">High priority</button>
      <button class="chip" data-f="eff" data-v="S" aria-pressed="false">Quick wins (S)</button>
      <button class="chip" data-f="hide" data-v="1" aria-pressed="false">Hide done</button>
      <span class="sep"></span>
      <button class="chip" data-f="kind" data-v="site" aria-pressed="false">Site-wide</button>
      <button class="chip" data-f="kind" data-v="solo" aria-pressed="false">Solo games</button>
      <button class="chip" data-f="kind" data-v="classroom" aria-pressed="false">Classroom</button>
      <button class="chip" data-f="kind" data-v="tool" aria-pressed="false">Tools</button>
      <select id="jump" aria-label="Jump to a game"><option value="">Jump to a game…</option></select>
      <input type="search" id="q" placeholder="Search games or fixes" aria-label="Search games or fixes">
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>
</div>

<script id="audit-data" type="application/json">{"groups": [{"group": "requests", "games": [{"slug": "_hiral-requests", "title": "Hiral's requests (27 Oct)", "url": "https://games.investingformummies.com/", "file": "classic.html + all-games", "kind": "tool", "audience": "Mummies", "verdict": "Requests from Hiral on 27 Oct 2026. The Education Planner change is her stated priority. A tested draft exists (audits/games-2026-10-26/drafts/education-planner-per-child.html) but nothing is live.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Education Planner: let each child have their own expected SIP return, instead of one rate applied to all children. Children of different ages need different assumptions.", "id": "_hiral-requests--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Education Planner: let each child have their own existing investments (amount, return %, amount still being added each month), instead of one shared pot for all children.", "id": "_hiral-requests--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Education Planner: show, for each child, the monthly SIP (from now until that child's education starts) AND the one-time lump sum needed today to bridge that child's funding gap, plus a family total. Today there's one SIP figure, timed to the eldest child.", "id": "_hiral-requests--3"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Move the Dividend Income Planner out of the games list and into a separate Resources / Tools tab.", "id": "_hiral-requests--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Move Asset Allocation out of the games list and into the Resources / Tools tab.", "id": "_hiral-requests--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Remove the Financial Goal Planner from the listings (Fund YOUR Goal and Goal Tracker already cover it).", "id": "_hiral-requests--6"}], "key": "_hiral-requests"}]}, {"group": "sitewide", "games": [{"slug": "_every-game", "title": "Every game (one shared change, applied everywhere)", "url": "https://games.investingformummies.com/", "file": "all game pages", "kind": "site", "audience": "Both", "verdict": "Every game is a dead end today: none of the 21 checked game pages links back to the games homepage, to the IFM site, or to booking, and none can be shared.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Navigation", "priority": "High", "effort": "M", "text": "Add one slim shared top bar to every game: IFM logo (goes to the games homepage), 'All games' and 'investingformummies.com' links — built once and dropped into every page so it never drifts.", "id": "_every-game--1"}, {"area": "Share", "priority": "High", "effort": "M", "text": "Add one shared 'Share on WhatsApp' button component that every game can call with its own message (the player's result + a hook + the game's link); per-game wording is listed under each game below.", "id": "_every-game--2"}, {"area": "Conversion", "priority": "High", "effort": "M", "text": "Add one shared end-of-game card: 'That was a few minutes of the course' + 'Find your batch' (register.investingformummies.com) + 'Play another' — gentle, after the result, never mid-game.", "id": "_every-game--3"}, {"area": "Navigation", "priority": "Med", "effort": "S", "text": "Stop opening games in a new browser tab from the homepage once every game has its own way back; new tabs pile up on phones.", "id": "_every-game--4"}, {"area": "Speed", "priority": "High", "effort": "L", "text": "Pre-build the 9 games that compile their code on the visitor's phone (Inflation Calculator, Market Pulse, IPO Bonanza, My First Trade, Debt Boss, Asset Boss, Swayamvar, Stock Rush PRO, Stock Rush) and switch off the slow 'developer' React build.", "id": "_every-game--5"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Turn on browser caching for the games site (images, scripts, styles), so returning players don't re-download everything — www already does this.", "id": "_every-game--6"}, {"area": "Share", "priority": "Med", "effort": "M", "text": "Give each game its own share picture (a screenshot of the game) instead of the one generic games image, so WhatsApp previews show the actual game.", "id": "_every-game--7"}, {"area": "Conversion", "priority": "Med", "effort": "M", "text": "Track game_started, game_completed and share_clicked in PostHog for every game, so you can see which games people finish and which ones lead to bookings.", "id": "_every-game--8"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Wherever a game projects future money, show the assumed return on screen (e.g. 'assumes 12% a year — illustrative, not guaranteed'); the general disclaimer line alone isn't enough.", "id": "_every-game--9"}], "key": "_every-game"}, {"slug": "_old-address", "title": "Old ifm-deploy.vercel.app address", "url": "https://games.investingformummies.com/", "file": "several", "kind": "site", "audience": "Both", "verdict": "The old Vercel address still reaches players in share messages and the Swayamvar join code; it works, but looks unbranded and untrustworthy on a phone.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Swayamvar's join QR code sends players to ifm-deploy.vercel.app/swayamvar — switch it to games.investingformummies.com/swayamvar (file swayamvar/ui-common.js).", "id": "_old-address--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Fund YOUR Goal, Goal Tracker and the classic hub's share messages say 'Plan yours free: ifm-deploy.vercel.app' — change to the games address.", "id": "_old-address--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The classic hub loads its embedded games from ifm-deploy.vercel.app — switch to relative links so they load from the same site.", "id": "_old-address--3"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Move the images still pulled from ifm-deploy.vercel.app (Crorepati Lane, Money Map, Quiz, Sapno Ka Ghar, Slash the Scam, MF Manager art) to relative paths.", "id": "_old-address--4"}], "key": "_old-address"}, {"slug": "_games-home", "title": "Games homepage + All games", "url": "https://games.investingformummies.com/", "file": "index.html, all-games.html", "kind": "site", "audience": "Both", "verdict": "Three different 'homes' (homepage, All games, classic hub), emoji instead of real game art, and leftover mockup text on the live page.", "load": "31 KB page; fast", "share_idea": "", "share_moment": "", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Remove the leftover design-file text 'After every game, one line (sample)' from the live homepage.", "id": "_games-home--1"}, {"area": "Layout", "priority": "High", "effort": "L", "text": "Redo the homepage as ONE hub with three sections — Play (solo games), Tools (calculators), In class (host screens) — replacing both the homepage and the All games page; show 2–3 design options first.", "id": "_games-home--2"}, {"area": "Layout", "priority": "High", "effort": "M", "text": "Replace the emoji on game tiles with real screenshots or illustrations of each game, so people can see what they're about to play.", "id": "_games-home--3"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "Add filters people actually think in: topic, time to play (2 / 5 / 10 min), Mums or Gen Next, play alone or in class.", "id": "_games-home--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Pick a finished, polished game as 'Today's game' and rotate it weekly, instead of a fixed one.", "id": "_games-home--5"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Make the game count consistent everywhere ('50+ games and tools') across www, the games homepage and All games.", "id": "_games-home--6"}, {"area": "Navigation", "priority": "Med", "effort": "L", "text": "Retire the classic hub once its calculators and beta games have their own pages; redirect /classic to the new hub.", "id": "_games-home--7"}], "key": "_games-home"}, {"slug": "_tools", "title": "Tools section (calculators)", "url": "https://games.investingformummies.com/tools", "file": "new", "kind": "site", "audience": "Mummies", "verdict": "The calculators are the pages people search Google for, but they're buried inside the 3 MB classic hub. Give them their own section.", "load": "—", "share_idea": "", "share_moment": "", "items": [{"area": "Layout", "priority": "High", "effort": "L", "text": "Create games.investingformummies.com/tools with one fast page per calculator (SIP, SWP, retirement, education, holiday, budget, asset allocation, dividend, goal planner, goal tracker) — a section, not a new subdomain, so it's one site, one analytics, one Google ranking.", "id": "_tools--1"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Give each tool a 'Learn this properly in class' link and a WhatsApp 'share my plan' button.", "id": "_tools--2"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Add the tools to the sitemap with their own titles and descriptions so Google can find 'SIP calculator' etc.", "id": "_tools--3"}, {"area": "Navigation", "priority": "Med", "effort": "S", "text": "Link 'Free money tools' from www's menu and footer as well as from the games hub.", "id": "_tools--4"}], "key": "_tools"}]}, {"group": "solo-a", "games": [{"slug": "hidden-fortunes", "title": "Hidden Fortunes", "url": "https://games.investingformummies.com/hidden-fortunes", "file": "hidden-fortunes-2.html", "kind": "solo", "audience": "Mummies", "verdict": "A strong, relatable hook (your salon, Swiggy and coffee money turned into crores) with a nice result card and an image share already built in. What holds it back as the featured game: the screen never says 'tap the cards', the copy promises 'half' but uses the full amount, and on a phone the hero spills sideways and 1.5 MB of logo images load just to decorate sliders.", "load": "~1.8 MB up front: 61 KB page + a 1 MB logo PNG used as the slider knobs + a 0.5 MB logo PNG in the hero + html2canvas (~200 KB); 50 large emoji float behind the page non-stop", "share_idea": "Already has a WhatsApp button; sharpen its text to: 'My ₹10,000 a month of Swiggy + coffee could be ₹3.5 Cr in 30 years (at an assumed 12%). What are YOUR habits worth? 👉 games.investingformummies.com/hidden-fortunes' and point it at the clean /hidden-fortunes link instead of /hidden-fortunes-2.html.", "share_moment": "Result screen, directly under the big 'X× what you put in' panel, before the Download button.", "items": [{"area": "Copy", "priority": "High", "effort": "S", "text": "The intro and tip both say 'what if even half went into a SIP?' but the total uses the full amount of every habit picked; either halve the total or change the words to 'what if this money went into a SIP', so the promise matches the maths.", "id": "hidden-fortunes--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "On first load nothing is selected and the Reveal button is greyed out with no hint why; add a short line like 'Tap the habits you spend on 👇' (or pre-select two cards) so a WhatsApp visitor knows what to do in the first 3 seconds.", "id": "hidden-fortunes--2"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "On a 375px phone the hero subtitle runs off the right edge and the page scrolls sideways; let the subtitle wrap and hide the 'Scan to Play' QR button on phones (people are already on their phone, so a QR code is useless there and steals the most valuable space).", "id": "hidden-fortunes--3"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "The slider knobs use a 1 MB round-logo picture and the hero uses a 0.5 MB logo; swap both for small (under 25 KB) versions so the homepage's featured game opens fast on mobile data.", "id": "hidden-fortunes--4"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "The sliders go from ₹0 to ₹1–3 lakh a month in ₹1,000 steps, so on a phone the knob barely moves between ₹2,000 and ₹6,000; cap each slider at a realistic monthly spend (say ₹20,000–₹50,000) or add –/+ buttons so mums can set their real number.", "id": "hidden-fortunes--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The 50 big floating emoji keep moving behind the results and sit under the 'Redirect ₹10,000/month…' sentence, making it hard to read; slow them down and fade them out once the result is shown (this also saves phone battery).", "id": "hidden-fortunes--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add one honest 'in today's money' line under the 30-year figure (e.g. '₹3.5 Cr in 2056 buys roughly what ₹60 L buys today at 6% inflation'); it keeps the wow but makes the lesson trustworthy and links naturally to the Inflation Calculator.", "id": "hidden-fortunes--7"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Let the player choose how long (10/20/30 years) or what share to redirect (25/50/100%) on the result screen, so they can play with it again instead of only 'Try Different Habits'.", "id": "hidden-fortunes--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Drop '2.0' from the title ('Hidden Fortunes 2.0' means nothing to a first-time visitor) and use one name everywhere: page title, hero and share text.", "id": "hidden-fortunes--9"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "The habit cards are tap-only boxes, not real buttons, so keyboard and screen-reader users cannot select them; make each card a proper button that announces 'selected'.", "id": "hidden-fortunes--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the result, add a gentle line such as 'Want to know where a SIP actually goes and how to start one? Find your batch →' linking to register.investingformummies.com; right now the result ends with only Reset.", "id": "hidden-fortunes--11"}], "key": "hidden-fortunes"}, {"slug": "3-buckets", "title": "3 Buckets", "url": "https://games.investingformummies.com/3-buckets", "file": "3-buckets.html", "kind": "solo", "audience": "Mummies", "verdict": "Beautiful buckets, satisfying fly-in animations and genuinely useful 'why this bucket' explanations. What holds it back: it downloads about 6 MB before you can play, and on a phone the three buckets are stacked one under another so you scroll on every single item.", "load": "~6.3 MB up front: 2.6 MB autoplaying hero video + three 0.65 MB bucket PNGs + a 1 MB round-logo PNG (shown at 28–40px) + a 0.5 MB wide logo that loads and is immediately thrown away + 150 KB marble texture", "share_idea": "'I scored 11/12 sorting money into Emergency, Stability and Growth buckets 🪣 Can you beat me? 👉 games.investingformummies.com/3-buckets'", "share_moment": "Final screen, right under the score ring and 'Bucket Master!' title.", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "Why it is 4.5–6 MB: the decorative hero video (2.6 MB, 1280×720 with a sound track it never plays) autoplays on arrival, each bucket picture is a 650 KB PNG shown at about 230px wide, and two logo PNGs total 1.5 MB; shrink the buckets to ~40 KB WebP each, use small logos, and show only the 60 KB poster image on phones (play the video, re-encoded under 500 KB with no audio, only on desktop) to get the page under 500 KB.", "id": "3-buckets--1"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the buckets stack vertically (Growth starts about 1,100px down, below the fold), so the item and the right bucket are never on screen together and the fly-in animation happens off-screen; put the three buckets side by side as smaller tiles (or as three big labelled buttons) directly under the item card.", "id": "3-buckets--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Items name real brands as examples (SBI savings account; Reliance, TCS, HDFC Bank inside the Nifty item; L&T and Mahindra for bonds); replace them with generic wording ('a bank savings account', 'India's 50 biggest companies') so nothing reads like a recommendation.", "id": "3-buckets--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Rates are stated as current facts (PPF ~7.1%, Sukanya ~8.2%, savings ~2.7%, Nifty '12–14%'); add 'rates as of <month/year>' and change the Nifty line to 'has historically… not guaranteed', since these change every quarter.", "id": "3-buckets--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The government has stopped issuing new Sovereign Gold Bonds, so a mum can no longer act on that item; swap it for 'Gold ETF / Gold mutual fund' or reword it as 'gold held for 8+ years'.", "id": "3-buckets--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The '🏠 Back to Main Menu' button just restarts this game's own start screen instead of going to the games page, and the start screen promises '🏆 Earn badges' but there are no badges; fix the button's destination and remove or deliver the badges.", "id": "3-buckets--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The final screen says 'discuss with your group before playing again' — leftover classroom wording; for a solo player say something like 'Tap any item to see why it belongs there' or 'Play again — the items change each time'.", "id": "3-buckets--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "A wrong answer takes about 3 seconds of animation before the explanation pops up, then needs a tap, for each of 12 items; cut the wait to about 1 second so the pace stays snappy on a phone.", "id": "3-buckets--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The pop-up and item text use projector-sized fonts (set for classroom screens) which make the 'why' box long on a phone; use smaller sizes under 600px wide so the Next button stays visible without scrolling.", "id": "3-buckets--9"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Only one item (Sukanya) ever has two right answers; add one or two more genuinely 'it depends' items (e.g. a hybrid fund) so the 'tricky items' promise on the start screen pays off and the game teaches nuance.", "id": "3-buckets--10"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "The buckets are tap-only pictures, not buttons, so keyboard users cannot play; make each bucket a real button with its name read out.", "id": "3-buckets--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the 'Key Takeaway' on the final screen add a soft 'Want help filling your own three buckets? Find your batch →' link to register.investingformummies.com.", "id": "3-buckets--12"}], "key": "3-buckets"}, {"slug": "one-crore-ladder", "title": "₹1 Crore Ladder", "url": "https://games.investingformummies.com/one-crore-ladder", "file": "one-crore-ladder.html", "kind": "solo", "audience": "Mummies", "verdict": "A clear guess → reveal → 'cost of waiting' story that lands the compounding lesson well. What holds it back: the answer is spoiled before you guess, the numbers on the page disagree with each other, and on a phone the ladder bars shrink to dots.", "load": "117 KB page + Chart.js (~200 KB); fast", "share_idea": "'₹10,000 a month for 25 years → about ₹1.9 Cr at an assumed 12% (I guessed ₹50 L 🙈). How close can you guess? 👉 games.investingformummies.com/one-crore-ladder'", "share_moment": "Right after the ladder finishes (when the ₹1.9 Cr step appears), and again at the end under the 'Cost of Waiting' chart.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The locked 'One More Question…' card underneath is readable while you are still guessing and says 'You just watched ₹10K/month grow to ₹1.9 Crore'; hide that card's text until it unlocks so the guess is a real guess.", "id": "one-crore-ladder--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The numbers disagree: the ladder says ₹1.90 Cr at 25 years but the waiting chart shows ₹1.88 Cr for the same 25 years, and the bonus answer says ₹3.53 Cr at 30 years while the chart shows ₹3.49 Cr; use one formula everywhere so a careful mum doesn't lose trust.", "id": "one-crore-ladder--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Option C ('Over ₹1.5 Crore — compounding is powerful!') gives itself away with its cheerleading tone; make all three options plain numbers so players actually have to think.", "id": "one-crore-ladder--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The game is called '₹1 Crore Ladder' but never marks the moment you cross ₹1 crore (it happens just after year 20); add a gold '₹1 Crore reached in year 20!' rung or flash — that is the payoff the title promises.", "id": "one-crore-ladder--4"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "On a phone the 'Growth' bar column in the ladder is squeezed to a dot, and the 'Cost of Waiting' chart is tiny with overlapping 'Returns: ₹6.0…' labels; drop the mini bars on phones and give the chart more height with labels outside the bars.", "id": "one-crore-ladder--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "If you guess wrong, the feedback never tells you the real number ('The answer will surprise you!'); state '₹30 L grows to about ₹1.9 Cr' in the wrong-answer message too.", "id": "one-crore-ladder--6"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "After the first guess the ladder unlocks but the page doesn't scroll to it, so on a phone it looks like nothing happened; scroll down to the ladder automatically as the later steps already do.", "id": "one-crore-ladder--7"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "'Start at 25 / 30 / 35' assumes a young player while most Mummies are 30–45; let her enter her own age (or show 30/35/40) so the 'cost of waiting' is about her.", "id": "one-crore-ladder--8"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "The 12% is labelled 'Expected Return'; call it 'Assumed return (not guaranteed)' on the chips at the top, since the footnote disclaimer is far below.", "id": "one-crore-ladder--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero text sits off-centre to the right because space is reserved for a logo that never appears; remove that left padding or add the logo.", "id": "one-crore-ladder--10"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Points are counted in the background but never shown; either show a small '2/2 correct' at the end or remove the scoring so the ending has a clear finish.", "id": "one-crore-ladder--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Below the 'Emotional Takeaway' add 'Ready to start your own ladder? Find your batch →' linking to register.investingformummies.com, above Play Again.", "id": "one-crore-ladder--12"}], "key": "one-crore-ladder"}, {"slug": "double-or-nothing", "title": "Double or Nothing", "url": "https://games.investingformummies.com/double-or-nothing", "file": "double-or-nothing.html", "kind": "solo", "audience": "Mummies", "verdict": "A quick, clean 5-round timed quiz that teaches one genuinely handy trick (the Rule of 72). What holds it back: the rules on screen don't match how it actually scores, the right answer is almost always the middle one, and with the same 5 questions every time there is no reason to play twice.", "load": "124 KB page (mostly unused styles), no libraries; fast", "share_idea": "'I scored 13/15 on the Rule of 72 speed test ⏱️ — how fast can you tell when your money doubles? 👉 games.investingformummies.com/double-or-nothing'", "share_moment": "Score screen, right under the big score and verdict ('Money Genius!').", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The rules say '15 seconds per round' and '3 pts under 5 sec, 2 pts under 10 sec', but the timer actually runs 30 seconds and gives 3 pts under 10 sec and 2 pts under 20 sec; make the rules and the timer agree.", "id": "double-or-nothing--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The correct answer is the middle option in 4 of 5 rounds and the Round 4 answer literally says 'doubles in half the time'; shuffle option order and write neutral options so players must do the 72 ÷ rate sum.", "id": "double-or-nothing--2"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "There are only 5 fixed questions, so a replay is identical; add a pool of 15–20 (different rates, prices doubling, 'what rate do I need to double in 6 years?') and pick 5 at random each time.", "id": "double-or-nothing--3"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Round 5 names a real index ('Nifty 50 index fund earning 14% per year') and says it 'has historically returned ~14%' so 'your money doubles roughly every 5 years'; use a generic 'equity fund at an assumed 12%' and add 'past returns are not guaranteed'.", "id": "double-or-nothing--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Round 1's 9% FD is higher than any bank FD a mum will see today; use realistic rates (7% FD) so the example feels real, and mention once that the rule is an approximation.", "id": "double-or-nothing--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The formula hint is shown on every round, so it's a reading test, not a memory test; show it in rounds 1–2, then hide it behind a 'Need a hint?' tap that costs a point.", "id": "double-or-nothing--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The name 'Double or Nothing' suggests a gamble (risking everything), which is the opposite of the lesson; consider 'When Will It Double?' or add a gentle 'double or nothing' bonus round that matches the name.", "id": "double-or-nothing--7"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "The finish is a list of rounds; end on a personal punchline instead, e.g. 'Your ₹1 lakh FD at 7% doubles in ~10 years; at 12% in ~6 years', with an input for her own amount.", "id": "double-or-nothing--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero text sits off-centre to the right because space is reserved for a logo that never appears; remove that left padding or add the logo.", "id": "double-or-nothing--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On the score screen add 'Want to learn where your money can actually double faster? Find your batch →' linking to register.investingformummies.com.", "id": "double-or-nothing--10"}], "key": "double-or-nothing"}, {"slug": "rice-and-chessboard", "title": "The Rice & the Chessboard", "url": "https://games.investingformummies.com/rice-and-chessboard", "file": "chess-compounding.html", "kind": "solo", "audience": "Mummies", "verdict": "A lovely, light (24 KB) retelling of a classic story with great 'sack → truck → warehouse' milestones and a strong ending. What holds it back: the story itself is never told up front, on a phone the Next button is below the screen so every tap needs a scroll, and two of the ending's 'wow' facts are wrong.", "load": "24 KB page, no libraries; very fast", "share_idea": "'One grain of rice, doubled 64 times, is more rice than the world grows in 900 years 🌾 Now imagine your money doing that. 👉 games.investingformummies.com/rice-and-chessboard'", "share_moment": "End screen ('The King Ran Out of Rice'), under the 'So what does this mean for your money?' box.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The story (a wise man asks the king for 1 grain on the first square, doubled on every square) is never explained before you start; add a 2-line intro card with the deal and a 'Do you accept?' button so the player knows what is being promised.", "id": "rice-and-chessboard--1"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the 'Next Square' button sits about 950px down, below the screen, so each tap means scrolling down and the board scrolls out of view; pin the Next / Auto-play buttons to the bottom of the screen on phones.", "id": "rice-and-chessboard--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Two ending facts are wrong: 460 billion tonnes of rice is LESS than a single big mountain, not 'more than every mountain range in India', and 8 billion people eating 200 g a day would get through it in about 790 years, not 'over 2,000 years'; correct or replace these cards.", "id": "rice-and-chessboard--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The ending says 'good Indian index funds have averaged 12–15% a year for decades' as a fact; soften to 'equity has historically returned around 12% (not guaranteed)' and label the ₹10,000 → ₹12.8 L example as an assumption.", "id": "rice-and-chessboard--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add a quick prediction before play ('Which square fills a whole sack of rice?' or 'Would you take this deal or ₹1 crore?') so the player has something at stake when the numbers explode.", "id": "rice-and-chessboard--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The big counter switches to Western words (Million, Billion, Quintillion) and the board shows '10^15', while the milestones use lakh and crore; use lakh/crore (or 'crore crore') consistently and drop the '10^' notation — Mummies think in lakhs.", "id": "rice-and-chessboard--6"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The numbers inside the squares are about 6px tall on a phone and unreadable; show them only on bigger screens and let the big counter and milestone text carry the story on mobile.", "id": "rice-and-chessboard--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The fill bar shows '33%' at square 22 (on a 'log scale') which reads as a third of the rice, when it is a tiny fraction; replace the % with the milestone name ('sack') and drop the 'log scale' label.", "id": "rice-and-chessboard--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "It uses a different gold (#f6c842), an all-dark theme and no IFM logo, unlike the other games; bring it onto the brand gold and add the logo so a shared link is recognisably IFM.", "id": "rice-and-chessboard--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After 'Start early.' on the end screen, add 'Want to put the chessboard to work on your own money? Find your batch →' linking to register.investingformummies.com, and a link to Double or Nothing as the natural next game.", "id": "rice-and-chessboard--10"}], "key": "rice-and-chessboard"}, {"slug": "nav-pizza", "title": "NAV Pizza", "url": "https://games.investingformummies.com/nav-pizza", "file": "nav-pizza.html", "kind": "solo", "audience": "Mummies", "verdict": "The pizza-slice metaphor is a smart, memorable way to bust the 'low NAV = cheap fund' myth, and the explanations are excellent. What holds it back: it is one very long page (about 8½ phone screens) with nine questions, no progress counter and no ending, and the right answer is usually the longest, most sensible-sounding option.", "load": "143 KB page, no libraries; fast to load but a 6,900px-long page on a phone", "share_idea": "'Quick test: Fund A's NAV is ₹20, Fund B's is ₹100 — which is cheaper? 🍕 I got 8/9 on the NAV myth quiz. 👉 games.investingformummies.com/nav-pizza'", "share_moment": "A new end card after the last question showing her score (e.g. '8/9 myths busted').", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "There is no ending — after question 9 nothing happens, and the points are counted but never shown; add a final card with her score, the three key lessons (NAV ≠ price tag, dividends come out of NAV, dips mean more units) and Play Again.", "id": "nav-pizza--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "All nine questions sit on one long page with greyed-out cards below; show one question at a time with a '3 of 9' progress bar so a phone player knows how far she has to go.", "id": "nav-pizza--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The correct answer is almost always the longest, most balanced-sounding option (C or B); rewrite options to similar lengths and vary where the right one sits, so players learn rather than spot the pattern.", "id": "nav-pizza--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "In View 2 the ₹100 fund is simply given the higher return, which can leave a beginner thinking 'higher NAV = better'; add a one-line flip ('…and if the ₹20 fund had earned 15%, it would win — the NAV never decides') to close that loophole.", "id": "nav-pizza--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The hero puts white text on a pale gold background, which is hard to read in sunlight, and sits off-centre because of space reserved for a missing logo; use the navy or a darker gold behind the title and centre it.", "id": "nav-pizza--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Use today's term 'IDCW (formerly Dividend) plan' in the dividend questions, because that is what a mum will see on her fund app and statement.", "id": "nav-pizza--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Fix the garbled sentence 'The total value stayed ₹1,000 at the start' in View 1 (e.g. 'Both started at ₹1,000 and both ended at ₹1,100').", "id": "nav-pizza--7"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "Both 'pizzas' are the same emoji, so the visual doesn't show the idea; draw Fund A as a pizza cut into 50 thin slices and Fund B into 10 big ones — same pizza, different slicing.", "id": "nav-pizza--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The card titled 'Now That You Know the Truth About NAV…' looks like the last question but five more follow; retitle it so the structure doesn't feel endless.", "id": "nav-pizza--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On the new end card add 'Want to read a fund factsheet with confidence? Find your batch →' linking to register.investingformummies.com.", "id": "nav-pizza--10"}], "key": "nav-pizza"}, {"slug": "radhas-mission", "title": "Radha's Money Mission", "url": "https://games.investingformummies.com/radhas-mission", "file": "radhas-mission.html", "kind": "solo", "audience": "Mummies", "verdict": "A relatable 'help a working mum' case study with a good variety of question types (calculate, match, choose). What holds it back: real fund names presented as the 'perfect' pick, a replay bug that makes the game freeze at question 3, and it opens with the hardest maths question.", "load": "132 KB page + Chart.js (~200 KB) that the game never uses", "share_idea": "'I helped Radha (32, Mumbai) sort out her mutual funds and scored 95/120 ⭐ Can you be a Gold Star Mum? 👉 games.investingformummies.com/radhas-mission'", "share_moment": "'Mission Complete!' screen, under the score ring and badges.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "Questions name real funds — 'HDFC Balanced Advantage Fund… 25% returns last year', 'Axis Long Term Equity', 'HDFC Mid-Cap Opportunities', 'SBI Small Cap' — and call each the 'perfect fund' for a friend; replace with made-up fund houses (e.g. 'Sunrise Small Cap Fund') so it can't read as a recommendation.", "id": "radhas-mission--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "After 'Try Again', tapping any answer on questions 3, 4, 6 and 7 does nothing (verified in the browser), so a replaying player gets stuck at question 3; the same fault means the 'Concept Queen' badge can never be earned — fix how those questions remember they were answered.", "id": "radhas-mission--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Question 4 teaches 'always choose Direct, the RM ticks Regular for commission', but question 8's 'correct' answer puts a retired mum in a Regular-plan mid-cap fund for income; change Deepa's mum's answer (or the wording) so the game doesn't contradict itself and doesn't steer a retiree into mid-caps.", "id": "radhas-mission--3"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The very first question is a 3-step NAV calculation with odd numbers (₹850, 40 units) typed into boxes; start with an easy confidence-builder (the SIP or Regular-vs-Direct question) and move the maths to the middle.", "id": "radhas-mission--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The points don't add up: question 2 can give at most 18 (labelled 20) and question 5 gives 16 (labelled 15), so the advertised 120 is impossible; correct the labels or the scoring.", "id": "radhas-mission--5"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The number boxes use small text, so iPhones zoom the whole page in when you tap them; make the answer boxes at least 16px text and bring up the number keypad.", "id": "radhas-mission--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "When a question is answered the next one unlocks quietly below without scrolling; scroll to it (as other games do) so phone players know to continue.", "id": "radhas-mission--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Amisha' appears in questions 4 and 6 with no introduction, and the intro's daughter, goal and ₹2 lakh bonus are never used; introduce Amisha as Radha's friend/adviser in the intro and use the ₹2 lakh in at least one question.", "id": "radhas-mission--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The ELSS answer says 'save income tax this year'; add 'under the old tax regime', because under the new regime 80C does not apply and many mums are now on it.", "id": "radhas-mission--9"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Question 3 contains its own answer ('invest a fixed amount every month automatically is called… SIP'); make it a real scenario so it's worth 10 points.", "id": "radhas-mission--10"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "Remove the Chart.js library it loads but never uses (~200 KB).", "id": "radhas-mission--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On 'Mission Complete!' add 'Radha learned this in an IFM batch — find yours →' linking to register.investingformummies.com; it fits the story perfectly.", "id": "radhas-mission--12"}], "key": "radhas-mission"}, {"slug": "three-investors", "title": "The Three Investors", "url": "https://games.investingformummies.com/three-investors", "file": "three-investors.html", "kind": "solo", "audience": "Mummies", "verdict": "A dramatic, well-told comparison of SIP vs lump sum vs market timing with a nice ranked reveal. What holds it back: the player never makes a decision — 'your' strategy is picked at random and auto-played — and 1 time in 5 the random pick wins and the game congratulates you for timing the market.", "load": "124 KB page + Chart.js (~200 KB); fast", "share_idea": "Already has a WhatsApp button but it links to the www homepage; change it to: 'I tried to time the market against a steady SIP over 12 years 📉📈 — SIP still won (₹21 L vs my ₹16 L). Think you can beat it? 👉 games.investingformummies.com/three-investors'", "share_moment": "Big Reveal screen, directly under the three ranked result cards.", "items": [{"area": "Game design", "priority": "High", "effort": "L", "text": "Let the player actually be the market timer: show each year's price move and let her tap 'Invest ₹1L / ₹2L / ₹4L' or 'Wait', then compare her result with the SIP and lump-sum friends — right now she just watches a random preset and is labelled 'You'.", "id": "three-investors--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "One of the five random presets ('The Brave Buyer') wins with ₹29.5 L and the message says 'You timed the market perfectly'; until the player makes real choices, remove that preset or present it clearly as 'what a lucky hindsight timer would have got'.", "id": "three-investors--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The WhatsApp share sends people to the www homepage instead of this game, so friends never land on it; link to games.investingformummies.com/three-investors and include the player's result.", "id": "three-investors--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The year-by-year autoplay scrolls the page for you every second for about 15 seconds, fighting the player's thumb; let her step through with a 'Next year' button (or only auto-scroll if she hasn't touched the screen).", "id": "three-investors--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The lesson implies SIP always beats a lump sum, but here that only happens because the market crashes right after year 1; add one honest line ('in a steadily rising market the lump sum usually wins — SIP wins on discipline and peace of mind').", "id": "three-investors--5"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "On a phone each result card is about 250px tall so the three cards fill more than a screen; show them as a compact side-by-side row or a single ranked list so the comparison is visible at a glance.", "id": "three-investors--6"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero text sits off-centre to the right because space is reserved for a logo that never appears; remove that left padding or add the logo.", "id": "three-investors--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the lesson box add 'Want a SIP plan you can stick to? Find your batch →' linking to register.investingformummies.com.", "id": "three-investors--8"}], "key": "three-investors"}, {"slug": "inflation-calculator", "title": "Inflation Calculator", "url": "https://games.investingformummies.com/inflation-calculator", "file": "inflation-calculator.html", "kind": "tool", "audience": "Mummies", "verdict": "Three genuinely useful views (future monthly expense, buying power, corpus needed) with clean result cards on desktop. What holds it back: it is slow because the phone has to download and run a 2.8 MB code translator before anything appears, and on a phone the layout is broken — the amount box is 28px wide and the tabs are cut off.", "load": "347 KB page (only about a fifth is this calculator; the rest is code for three retired apps) + React + Babel in-browser compiler (2.8 MB unpacked, ~1 MB download) that must run before the tool shows; mobile Lighthouse 34", "share_idea": "'My ₹40,000 monthly household budget will be ₹71,600 in 10 years at 6% inflation 😳 Check yours: 👉 games.investingformummies.com/inflation-calculator'", "share_moment": "Under the big result number in each tab (e.g. 'In year 10 your monthly expense will be ₹17,908').", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "Why it scores 34: the calculator is hidden inside a frame that only starts after the page loads, then downloads React plus the Babel translator and converts the code on the phone before showing anything; pre-build it once into plain JavaScript (as planned for the other Babel games) so it appears almost instantly.", "id": "inflation-calculator--1"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "About 270 KB of the page is leftover code and styles for other apps (Investopia, Lifestyle Time Machine, 3 Buckets styles) that this page never shows; delete it so the page is a fraction of its size.", "id": "inflation-calculator--2"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 375px phone the ₹ amount box is only 28px wide so '10,000' is invisible, the third tab ('Corpus Calculator') and 'yrs → 2036' are cut off, and the page has 28px side margins inside another padded box; stack the controls full-width and shrink the tab labels on phones.", "id": "inflation-calculator--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "'Total corpus required' simply adds up every future year's expenses and assumes the money earns nothing while you draw it down, which overstates what a mum needs; either add an assumed return (with the assumption shown) or rename it 'Total you will spend over N years'.", "id": "inflation-calculator--4"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The tip 'Equity mutual funds averaging 12–14% p.a. are one of India's most powerful inflation hedges' states returns as fact; reword to 'equity has historically returned more than inflation over long periods (not guaranteed)'.", "id": "inflation-calculator--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Start with a familiar example: the code already has a 'basket' of everyday items (coffee, petrol, onions, rice) that is never shown; use it ('your ₹60 kilo of rice will cost ₹107 in 10 years') — it lands harder than percentages.", "id": "inflation-calculator--6"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero labels it 'Resource' and sits off-centre with space reserved for a missing logo; centre it and give it the same look as the game heroes so it feels part of the set.", "id": "inflation-calculator--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The 'Rule of 72' box actually shows an exact calculation, not the rule; call it 'Your money's buying power halves in…' so beginners aren't confused by the label.", "id": "inflation-calculator--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the 'To beat inflation' box add 'Want a plan that beats inflation? Find your batch →' linking to register.investingformummies.com — this is the most natural lead-in of all the tools.", "id": "inflation-calculator--9"}], "key": "inflation-calculator"}]}, {"group": "solo-b", "games": [{"slug": "wheel-of-gold", "title": "Wheel of Gold", "url": "https://games.investingformummies.com/wheel-of-gold", "file": "wheel-of-gold.html", "kind": "solo", "audience": "Mummies", "verdict": "Beautiful gold-medallion wheel and clear one-line explanations after every answer. What holds it back: it's heavy to load, cramped on phones, and the content has no Indian (rupee) angle and never says how mums should actually hold gold.", "load": "145 KB page (33 KB zipped) plus about 2.1 MB of logo PNGs: 1.1 MB on open (white and black logos, one of them for a hidden Silver screen) and the 1 MB round logo when you press Start. About 150 KB of wheel art, plus an extra font (Cinzel).", "share_idea": "\"I called 7 out of 8 gold price moves on Wheel of Gold 🪙 Does gold go up or down when the rupee falls? Try it: games.investingformummies.com/wheel-of-gold\"", "share_moment": "On the final screen, right under the score ring (before the badges)", "items": [{"area": "Speed", "priority": "High", "effort": "S", "text": "Replace the three full-size logo PNGs (about 550 KB and 1 MB each) with small web-sized versions of about 20 KB, and drop the logo that only exists for the hidden Silver screen. The page would open several times faster on mobile data.", "id": "wheel-of-gold--1"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the wheel shrinks to about 220 px. The Up/Down wax seals get squeezed into 58 px strips with roughly 9 px captions, and the scenario text is crammed inside the wheel. On phones, show the scenario as a card under the wheel and put two big full-width 'Gold goes UP' / 'Gold goes DOWN' buttons beneath it.", "id": "wheel-of-gold--2"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The Up/Down choices are pictures of seals with no words on them (the tiny caption sits underneath). Put 'UP' and 'DOWN' in large text on the buttons themselves so nobody has to guess which seal is which.", "id": "wheel-of-gold--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Every spin takes 6.5 seconds and the result is random anyway, so a player spends about 50 seconds just waiting over 8 rounds. Shorten the spin to about 3 seconds and let a tap skip it.", "id": "wheel-of-gold--4"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "Add the India angle. For a mum buying in rupees, a weaker rupee, import-duty changes and wedding/festival-season demand move gold prices as much as the dollar does. Add cards like 'Rupee falls against the dollar' and 'Government cuts import duty on gold'.", "id": "wheel-of-gold--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Two answers are taught as firm rules that recent years broke. Gold rose to records in 2024–25 while stocks were also at all-time highs, and central banks have been big gold BUYERS, not sellers. Add 'usually' to the explanations and swap 'Central banks sell gold' for 'Central banks buy record amounts of gold'.", "id": "wheel-of-gold--6"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "It's the same 8 cards every time, and once you learn 'bad news = gold up' you score 8/8 on the second try. Build a pool of 15–20 cards (including a few trick cards) and draw 8 at random so replays still teach something.", "id": "wheel-of-gold--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The ending doesn't connect to what mums actually do with gold. Add a takeaway comparing jewellery (making charges, purity, GST, resale cut) with paper/digital ways of owning gold in general terms, without naming any product. The 'Jewellery is not an investment' insight currently sits only on the Silver page.", "id": "wheel-of-gold--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The final screen shows correct answers, accuracy % and points, and points are just correct × 10, so that's three ways of saying the same thing. Show one score plus the best streak, and use the space for the takeaway.", "id": "wheel-of-gold--9"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The lowest-score message says 'Come back after reviewing the material!' but there is no material to review. Replace it with something warm like 'Spin again — you'll spot the pattern fast'.", "id": "wheel-of-gold--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the insight box, add one gentle line, for example 'Gold is one of the three buckets we unpack in the IFM workshop — see upcoming batches', linking to register.investingformummies.com.", "id": "wheel-of-gold--11"}], "key": "wheel-of-gold"}, {"slug": "wheel-of-silver", "title": "Wheel of Silver", "url": "https://games.investingformummies.com/wheel-of-silver", "file": "wheel-of-silver.html", "kind": "solo", "audience": "Mummies", "verdict": "Same polished wheel as Gold, with a good 'double life' angle (silver is both a precious and an industrial metal). But the page skips its own intro and drops players straight into the wheel, so that hook is never explained, and the phone layout is cramped.", "load": "141 KB page plus about 2.1 MB of logo PNGs, all loaded on open because the game auto-starts (white 543 KB, black 556 KB for a hidden screen, round logo 1 MB)", "share_idea": "\"Silver has a double life 🥈 Jewellery AND solar panels. I scored 6/8 predicting its price on Wheel of Silver. Can you beat me? games.investingformummies.com/wheel-of-silver\"", "share_moment": "On the final screen under the score ring", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The page jumps straight into the spinning wheel with no 'How it works' and no explanation of silver's 'double life' (precious metal + industrial metal), which is the whole lesson. The silver intro card already exists in the page but is never shown, so show it first.", "id": "wheel-of-silver--1"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "About 2 MB of logo images load the moment the page opens, including a 1 MB round logo for the middle of the wheel and a logo for a hidden screen. On the phone screenshot the wheel centre was still blank while it loaded. Use small web-sized logos.", "id": "wheel-of-silver--2"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The 'SPIN THE WHEEL' button is white text on light grey, which is very low contrast and hard to read outdoors on a phone. Use navy text or a darker silver button.", "id": "wheel-of-silver--3"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 390 px phone the wheel is only about 180 px wide with unlabelled emoji icons, the Up/Down buttons are 64 px strips with roughly 10 px labels, and the '8' round marker wraps alone onto a second line. Use full-width Up/Down buttons under the wheel, smaller round markers, and a bigger wheel.", "id": "wheel-of-silver--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Each spin takes 6.5 seconds of waiting, about 50 seconds per game. Cut it to about 3 seconds and allow tap-to-skip.", "id": "wheel-of-silver--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Add the points mums most need about silver: its price swings much more than gold's (it isn't just 'cheap gold'), and a weaker rupee pushes the Indian price up. Add a card or two on each.", "id": "wheel-of-silver--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The end insight 'Jewellery is NOT an investment!' feels like a scolding. Rephrase it kindly with the reason (making charges, purity, resale cut) and mention in general terms that there are other ways to own silver, without naming products.", "id": "wheel-of-silver--7"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Same 8 cards every play. Add a larger pool and draw 8 so a second play isn't a memory test.", "id": "wheel-of-silver--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the insight, add a soft link: 'Where do gold and silver fit in a family plan? We cover it in the IFM workshop — see batches' → register.investingformummies.com.", "id": "wheel-of-silver--9"}], "key": "wheel-of-silver"}, {"slug": "reit-or-real", "title": "REIT or Real?", "url": "https://games.investingformummies.com/reit-or-real", "file": "reit-or-real.html", "kind": "solo", "audience": "Mummies", "verdict": "A quick, clear 2-minute True/False with genuinely useful facts (rental yield is only 2–3%). It names two real REITs in a way that reads like a recommendation, it's one-sided against owning property, and the text is very small on phones.", "load": "123 KB page, no images or libraries. Fast, though most of the page is styling for other games.", "share_idea": "\"Myth or fact: a ₹1 crore flat earns 8–10% rent a year? 🏠 I busted 7/8 property myths on REIT or Real? — try it: games.investingformummies.com/reit-or-real\"", "share_moment": "On the final screen, right under the score bar (before the question recap)", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "Q1's answer says 'Embassy REIT and Mindspace REIT are popular options in India'. From an unregistered educator that reads like a recommendation. Remove the names, or say 'India has a handful of listed REITs that own office parks and malls'.", "id": "reit-or-real--1"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Soften the promises. Q3 calls REITs 'reliable income-generating investments' and Q8 says you can sell 'instantly at market price'. Payouts can go down, unit prices can fall, and some REITs trade thinly, so say so in one line.", "id": "reit-or-real--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Q3 says REITs pay 90% 'as dividends'. In reality the payout is a mix of dividend, interest and part-repayment, and each is taxed differently, which is something mums will run into. Reword to 'distribute at least 90% of their cash to unitholders'.", "id": "reit-or-real--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "All 8 answers point the same way: REIT good, property bad. Mums who own or dream of a home may feel lectured. Add 2–3 balanced statements where property has a real point (security of your own home, a loan lets you buy something bigger) and one where REITs disappoint (unit prices fall in market crashes).", "id": "reit-or-real--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The questions come in the same order every time, so the answer pattern is fixed. Shuffle the order and, ideally, draw 8 from a pool of 12–15 so replays are worth it.", "id": "reit-or-real--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The word REIT isn't explained until after the first answer, and the intro shows 'Direct RE'. Add one plain line on the start screen ('A REIT lets you own a small slice of big office buildings and malls through the stock market') and write 'Buying a flat' instead of 'Direct RE'.", "id": "reit-or-real--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Q1 says 'You need ₹50 Lakhs or more to invest in commercial real estate' and the answer is False, which only holds if REITs count. Reword to 'to earn rent from offices or malls', and change 'from as low as ₹500' to 'the price of one unit — a few hundred rupees'.", "id": "reit-or-real--7"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Most reading text is tiny on phones: explanations about 13 px, takeaways about 12 px, the disclaimer about 11 px. Raise the body text to at least 15–16 px so mums don't have to pinch-zoom.", "id": "reit-or-real--8"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The score bar during the game shows an empty grey circle on the left where a logo was meant to go (the image has no picture set). Add the small logo or remove the circle.", "id": "reit-or-real--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The orange banner and purple takeaway cards are off-brand, and on phones the banner text sits off-centre because space is reserved for a logo that isn't there. Switch to navy/teal/gold and centre the banner text.", "id": "reit-or-real--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the Key Takeaways, add 'Property, REITs, gold, mutual funds — we compare them side by side in the IFM workshop. See batches' → register.investingformummies.com.", "id": "reit-or-real--11"}], "key": "reit-or-real"}, {"slug": "debt-detective", "title": "Debt Detective", "url": "https://games.investingformummies.com/debt-detective", "file": "debt-detective.html", "kind": "solo", "audience": "Mummies", "verdict": "A great core idea: 'you are the lender, so who's borrowing your money?'. The reveal card (borrower, risk, liquidity) is excellent. But each product's description gives the answer away, and it leaves out the products mums actually get confused by.", "load": "134 KB page, no images or libraries; fast", "share_idea": "\"When you open an FD, who are you actually lending to? 🕵️ I spotted 7/8 borrowers on Debt Detective — try it: games.investingformummies.com/debt-detective\"", "share_moment": "On the final screen, right under the 'x/8 borrowers spotted' number", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The small description under each product gives the answer away ('government savings scheme', 'issued by individual state governments', 'deposit with a bank', 'issued by a company'), so it's reading, not detecting. Hide those giveaway words until the reveal.", "id": "debt-detective--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add the products where the detective twist really lives: a company/NBFC fixed deposit (the borrower is a company, not a bank, and it is NOT covered by the ₹5 lakh deposit insurance), a small-finance-bank FD, Post Office schemes (NSC, Senior Citizens' scheme, Monthly Income), and a debt mutual fund (many borrowers at once).", "id": "debt-detective--2"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "The SSY card says it 'matures when the girl turns 21'. It actually matures 21 years after the account is opened. Fix it, because parents plan around this date.", "id": "debt-detective--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "PPF 7.1% and SSY 8.2% are shown as fixed facts, but the government resets these rates every quarter. Add 'rate as of Oct–Dec 2026, revised quarterly'. Also change 'zero default risk' to 'practically no default risk', and drop 'AA+ equivalent' for state loans (they aren't rated).", "id": "debt-detective--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "A 30-second timer bar counts down and then just says 'Take your time'. It adds stress and does nothing. Remove it, or make it an optional 'speed round'.", "id": "debt-detective--5"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "The key question 'Who is borrowing your money?' is about 10 px text, and the reveal text is 11–12 px. Make the question the biggest text on the card and raise all reading text to at least 15 px.", "id": "debt-detective--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Replace jargon with plain words: 'Sovereign' → 'Backed by the Government of India', 'Liquidity' → 'How fast can you get your money back?', drop 'NDS-OM', 'fiscal deficit' and 'EEE' (or explain EEE as 'tax-free going in, growing and coming out').", "id": "debt-detective--7"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The four borrower tiles aren't real buttons, so they can't be reached with a keyboard or read out properly by a screen reader. Make them proper buttons.", "id": "debt-detective--8"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The score shows '0/0' before the first answer, and the score bar has an empty grey logo circle on the left. Start at '0 of 8' and add or remove the logo.", "id": "debt-detective--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "Pink, purple and orange product colours are off-brand. Use the navy/teal/gold palette (for example, teal for government, navy for banks, gold for companies) so colour itself teaches the safety ladder.", "id": "debt-detective--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After 'The Big Picture', add 'Want to know which of these suits your family's goals? That's Session 2 of the IFM workshop — see batches' → register.investingformummies.com.", "id": "debt-detective--11"}], "key": "debt-detective"}, {"slug": "debt-boss", "title": "Debt Boss", "url": "https://games.investingformummies.com/debt-boss", "file": "debt-boss.html", "kind": "solo", "audience": "Mummies", "verdict": "The richest debt lesson on the site: a rate shock, a default and inflation each hit a ₹10 lakh portfolio differently, with a nice real-vs-nominal ending. Pinch-zoom works. But the score ignores your portfolio, tax (the biggest mum lesson) isn't counted, and one takeaway contradicts what the player just saw.", "load": "201 KB page plus React and Babel (about 650 KB zipped, 3 MB unzipped) that compile the game on the phone each visit. About 1.5 MB of logos are used inside the game.", "share_idea": "\"My ₹10 lakh survived a rate hike, a company default and inflation — and ended at ₹X (worth ₹Y in today's money). Can your mix do better? games.investingformummies.com/debt-boss\"", "share_moment": "On the results screen, right under the Nominal / Real totals", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "The score only counts the four quiz answers (25 points each). Your allocation, which is the whole game, doesn't affect it, so a player who lost lakhs can still be crowned 'Debt Master!'. Score the portfolio too, for example 'beat inflation?' and 'beat a plain FD?'.", "id": "debt-boss--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Returns are shown before tax even though each card says 'Tax-Free' or 'Taxable'. In the game a 7.5% FD beats 7.1% PPF, but for someone in the 30% bracket the FD is only about 5.25%. Add a simple 'my tax slab' choice and show after-tax results, which is the most useful debt lesson for working mums.", "id": "debt-boss--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The inflation pop-up's takeaway says 'Only Corporate Bonds meaningfully beat inflation', moments after the player watched corporate bonds lose about 35% in the default. That contradicts the lesson and nudges people toward risky bonds. The same list also shows a 'Gold Bond' that isn't in the game and leaves out Debt MF.", "id": "debt-boss--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The allocation screen starts pre-filled to exactly ₹10 lakh, so a player can press 'Simulate' without making a single decision. Start with everything unplaced and ask them to choose.", "id": "debt-boss--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The four events are always the same, in the same order, so the 'best' mix can be memorised. Shuffle the order and occasionally swap in a 'rate cut' year (when bonds do well) so no single answer always wins.", "id": "debt-boss--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Debt MF is labelled 'LTCG' (the long-term gains tax treatment). Since April 2023, gains on debt funds are taxed at your normal slab rate, with no long-term benefit. Fix the label.", "id": "debt-boss--6"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "Add an 'as of' date to the rates (PPF 7.1%, SSY 8.2%, FD 7.5%), because they change. Also state the inflation assumption clearly: results use 7% for all four years, but the game only mentions inflation (7.5%) in Year 4.", "id": "debt-boss--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Fix three slips: 'Your class has ₹10,00,000' (it's a solo game, so say 'You have'), the 'Balanced Borrower' profile (the player is the lender), and the mix of 'Rs' and '₹' on the results screen.", "id": "debt-boss--8"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "The 'what is this instrument?' explanations only appear when a mouse hovers over a card, so phone users never see them. Add a tap-able ⓘ. The event pop-up text is also 9–11 px on phones; raise it to at least 14 px.", "id": "debt-boss--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The title appears twice on open: the page banner 'Debt Boss' and then another 'Debt Boss' card. This pushes 'Start Allocating' well below the fold on phones, so keep one.", "id": "debt-boss--10"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "The game is translated into runnable code inside the visitor's phone every visit (Babel, about 600 KB). On slow phones mums see 'Loading Debt Boss… Connecting to CDN'. Pre-build it once so it opens instantly.", "id": "debt-boss--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The results already end on 'long-term wealth needs growth assets beyond debt'. Follow it with 'That's exactly what we build in the IFM workshop — see batches', linking to register.investingformummies.com, above the Play Again button.", "id": "debt-boss--12"}], "key": "debt-boss"}, {"slug": "cap-climber", "title": "Cap Climber", "url": "https://games.investingformummies.com/cap-climber", "file": "cap-climber.html", "kind": "solo", "audience": "Mummies", "verdict": "Fast and simple, but several answers are out of date or wrong, and with only a company name and 6 seconds it's guesswork, not learning. It needs a clue to reason from.", "load": "121 KB page, no images or libraries; fast", "share_idea": "\"Is Asian Paints a large, mid or small cap? 🏔️ I scored 80/100 on Cap Climber — beat me: games.investingformummies.com/cap-climber\"", "share_moment": "On the final screen, right under the 'x / 100' score", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Several answers look wrong or out of date. Hindustan Zinc (worth about ₹2 lakh crore) is a Large cap, not Mid. Jubilant FoodWorks and MCX have recently sat in the Mid-cap band, not Small. MCX's fact says 'smaller than NSE', but NSE isn't even listed. Check all 10 against AMFI's latest half-yearly list and show 'as of <month year>' on screen.", "id": "cap-climber--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "With only a company name and 6 seconds, players can only guess. Show a clue, such as the company's total value in ₹ crore or 'bigger or smaller than Asian Paints?', so they learn that 'cap' simply means size.", "id": "cap-climber--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Market cap' is never explained. Add one line on the start screen: 'Market cap = what the whole company is worth on the stock market (share price × number of shares)'. Also drop trader jargon in the facts ('telecom play', 'QSR', 'consumer discretionary').", "id": "cap-climber--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The end lesson promises too much: 'Large caps are stable wealth preservers', 'small caps can be multi-baggers', 'A diversified portfolio holds all three!'. Rephrase neutrally, for example 'large companies have usually swung less; small ones can rise or fall much more'.", "id": "cap-climber--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "After each answer the explanation (about 11 px text) disappears after 2 seconds, which is too fast to read on
