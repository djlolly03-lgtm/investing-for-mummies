cher for the game code'. Add a 'Have a game PIN?' box to the solo page so people who can't scan the QR can still join.", "id": "the-wealth-hack--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If the host refreshes while still in the lobby, everyone who already joined disappears and has to join again. The game only picks up where it left off once Round 1 has started. Keep the joined players when the lobby is reloaded, the same way a mid-game reload does.", "id": "the-wealth-hack--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A wrong or expired room link leaves the phone on 'Finding the game…' forever. After about 8 seconds with no game found, show 'We can't find this game. Check the PIN on the big screen' with a box to type it again.", "id": "the-wealth-hack--3"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Every phone downloads a 1 MB logo picture just to show a small round badge in the top bar. A 20 KB version would look the same and makes the join screen appear much faster on slow classroom Wi-Fi.", "id": "the-wealth-hack--4"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The phone screen lays a full-screen grain texture and several blurred glass panels over everything. These make scrolling stutter on cheap Android phones. Turn the grain and blur off on phones and keep them for the projector.", "id": "the-wealth-hack--5"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The game ends on 'The best month to start is this one' and one excuse card even promises 'that is exactly what the next few days are for', but there's no next step. Add a gentle 'Find your batch' link under the WhatsApp button on the phone end screen and at the bottom of the shared message.", "id": "the-wealth-hack--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Nobody mentions that ₹10 Cr in 15–20 years buys much less than ₹10 Cr today. Add one line to the Round 1 reveal, e.g. 'at 6% inflation, ₹10 Cr at 40 is roughly ₹3.5 Cr in today's money'. This keeps the big number honest and makes the 'start now' point stronger.", "id": "the-wealth-hack--7"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Round 1 gives phones 5 minutes on the clock to type one number. Most people lock in within a minute, and the room goes flat while they wait. Start the clock at 2 minutes (the host can still add time) and let the 'Reveal' button pulse as soon as everyone has locked in.", "id": "the-wealth-hack--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The Round 3 reveal says things like '1.6× less money', which is hard to read. Say 'about 60% as much' or 'less than two-thirds'.", "id": "the-wealth-hack--9"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "The headings use Fraunces and Manrope, not the brand's Lora and Nunito. This is the only game here in a different type family. Decide whether the midnight-and-gold look is now the standard. If not, switch the fonts when you do the phone and lobby redesign that's already planned.", "id": "the-wealth-hack--10"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "The projector's background video is hidden on phones, but because it is set to autoplay, some phones may still download its 400 KB. Only add the video to the page in host mode.", "id": "the-wealth-hack--11"}], "key": "the-wealth-hack"}, {"slug": "swayamvar/", "title": "Swayamvar", "url": "https://games.investingformummies.com/swayamvar/", "file": "swayamvar/ (index.html, engine.js, game-data.js, ui-common.js, host-view.js, player-view.js; edit the .jsx then run build-jsx.sh)", "kind": "classroom", "audience": "Mummies", "verdict": "A lovely, very on-brand-for-the-audience idea (asset classes as rishta prospects), with gorgeous art, precompiled code, and a host refresh that keeps the room. But the whole world shares one room (1995), any visitor opens it as the host with a Reset button, and the join address printed on the projector doesn't exist.", "load": "6 KB page + ~120 KB own JS (precompiled, no Babel) + React production + Supabase; portraits are 30–70 KB WebPs loaded per screen (1.7 MB folder). Fast", "share_idea": "'My money Swayamvar: I'd marry Mr. Equity, date Mr. Gold, and call Mr. Cash at 2 AM 💍 Who would you pick for your savings? → games.investingformummies.com/swayamvar/'", "share_moment": "On the phone's 'Your Report Card' screen at the finale, just under the four picks and the 'Welcome to Asset Allocation' quote.", "items": [{"area": "Bug", "priority": "High", "effort": "M", "text": "Every class uses the same fixed room code (1995), and anyone who opens the game link gets the teacher screen for that room, including the 'Reset game' button. A visitor from the games page can see a live class and wipe it, and two workshops on the same day would clash. Give each teacher a new room code when they open the game, as Sapno Ka Ghar and The Wealth Hack already do.", "id": "swayamvar--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector prints 'ifm.game/swayamvar' as the join address, but that domain doesn't exist. Anyone who types it instead of scanning gets an error page. Print the real address plus the room code instead, or remove the line.", "id": "swayamvar--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Confirmed: the QR code sends phones to the old address ifm-deploy.vercel.app/swayamvar/ (built in swayamvar/ui-common.jsx and the compiled ui-common.js). It works today, but students see an unfamiliar web address and it will break if that old project name ever changes. Point it at games.investingformummies.com, then rebuild with build-jsx.sh.", "id": "swayamvar--3"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Someone opening the link on a phone (from the games page or WhatsApp) lands on the projector lobby, which is cut off on a phone and shows a QR they can't scan with the same phone. A friendly 'host or join?' landing page already exists in app.jsx but can never appear, because the game always starts as host. Show it on phones.", "id": "swayamvar--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "One tap on a suitor casts the vote straight away, with no undo. On a two-column grid of small cards, a mis-tap or a scroll that turns into a tap locks in the wrong answer. Make the first tap select the suitor, then add a 'Confirm' button, or allow changes until the host closes voting.", "id": "swayamvar--5"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Lots of labels are tiny: phone captions such as 'YOUR NAME', 'Waiting for others…' and the return figures on the vote cards are about 7–9px, and projector captions are about 8–10px. Set the smallest text to about 12px on phones and 18px on the projector so the back row and older eyes can read them.", "id": "swayamvar--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The finale bucket screen and the phone report card show '12–15% returns', '8–12%+' and '8–10%' with no note. Add 'long-term past averages, not guaranteed' next to these numbers on both screens. The footer disclaimer is too far away and too small to count.", "id": "swayamvar--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone finale ends on the quote and nothing else, and the projector only offers 'Play Again'. Add a soft 'Want your own portfolio built like this? Find your batch' link on the phone report card.", "id": "swayamvar--8"}, {"area": "Bug", "priority": "Low", "effort": "M", "text": "Each vote re-saves the whole game. If the host taps 'close voting' at the same moment someone votes, the saved game can slip back to 'voting', and phones may flip back to the vote screen for a few seconds until the host's next tap. Make votes save only the vote.", "id": "swayamvar--9"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "If the host refreshes during the finale, the bucket reveal starts again from the first step because the step number is only kept in the browser. Save the reveal step with the rest of the game.", "id": "swayamvar--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'est. 1995' and 'Finding the Perfect Match for your savings since 1995' read like a real founding date, but IFM wasn't around then. Either make the joke obvious ('Aunty-approved since 1995') or drop it.", "id": "swayamvar--11"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "React and Supabase load from addresses that only say 'version 18' and 'version 2', with no exact number. A surprise update on the CDN could break the live game during a class. Fix them to the exact versions that work today.", "id": "swayamvar--12"}], "key": "swayamvar"}, {"slug": "stock-rush/", "title": "Stock Rush (teen)", "url": "https://games.investingformummies.com/stock-rush/", "file": "stock-rush/ (index.html + engine.js, game-data.js, ui-common.jsx, host-view.jsx, player-view.jsx compiled in the browser)", "kind": "classroom", "audience": "Gen Next", "verdict": "The game itself is deep: real Indian market history, lock-to-finish rounds, recaps, a counterfactual and an exit quiz. But the bare link puts everyone in one shared room, the printed join address leads to the teacher screen, and phones have to download and compile about 1 MB of development-mode code before anything appears. Every item here needs the owner's call because of the don't-edit rule.", "load": "14 KB page, but every phone downloads ~650 KB of Babel plus ~260 KB of React development builds, then compiles ~330 KB of JSX (including the teacher screen it never uses); slow on a cheap Android", "share_idea": "'I finished #2 in Stock Rush with ₹1.38L from ₹1L, trading 10 years of real Indian market news in 20 minutes 📈 Think you'd beat me? → games.investingformummies.com/stock-rush/'", "share_moment": "On the student's phone end screen, right after their final rank and net worth, above the counterfactual.", "items": [{"area": "Bug", "priority": "High", "effort": "M", "text": "Opening the plain link /stock-rush/ (no '?role=host') shows the teacher screen, but for one shared room called TEEN. Anyone else who opens the same link gets 'There's already a game here' with Resume and Start Fresh buttons for that room, so a curious student or a games-page visitor can take over or wipe a live class. A random room code is only created when the link includes ?role=host. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector prints 'ifm-deploy.vercel.app/stock-rush' as the join address. That is the old domain, and it has no room code, so a student who types it lands on the teacher screen for the shared TEEN room, not the join form. Print the real address including the room code, or drop it and rely on the QR. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Typing the room code by hand never works. The join form only accepts the built-in code 'TEEN', not the teacher's random 4-letter code, so the Join button stays greyed out. Only scanning the QR gets students in. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--3"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "Every phone downloads the in-browser compiler (Babel) plus the slow development versions of React, then compiles about 330 KB of code before showing anything. On a cheap Android that takes several seconds, and the development builds keep the game slower while it runs. Precompiling, as was done for Swayamvar, removes all of this. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A student's identity is kept only for the life of the browser tab. On cheap Androids, switching to WhatsApp or the camera often reloads the tab, and the student lands back on the join screen mid-game. Stock Rush Pro already fixed this by saving identity more permanently. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "With a wrong or expired room link, the phone says 'Waiting for your teacher. Your phone is connected' forever, even though there's no game. After a few seconds, show 'No game found with this code'. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--6"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "About 90 bits of projector text are fixed at 9–13px, so the leaderboard details and the activity feed can't be read from the back of a classroom. Scale the projector text to the screen size, the way The Wealth Hack does. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--7"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The end screen ranks real companies by 'what if you'd put all your money in one stock in 2016', which for teens reads like 'pick the winner'. Add a line under the best result, e.g. 'that's hindsight; nobody knew this in 2016', and show a 'spread across all 8' result as the sensible line. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The link preview (WhatsApp/Google text) says 'eight rounds of real headlines', but the game plays 5 rounds. Change it to five. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--9"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "The look is black-and-white Geist type, with none of the IFM navy, teal, gold, Lora or Nunito, so teens don't connect it to the brand they'll see on posters and Instagram. Add the brand colours and logo, at least on the join and end screens. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--10"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "The student end screen has no share and no next step. For teens the natural next step is 'Tell your parents about IFM's workshops', with a link. (teen version — owner rule: don't edit; decide)", "id": "stock-rush--11"}], "key": "stock-rush"}, {"slug": "stock-rush-pro/", "title": "Stock Rush Pro", "url": "https://games.investingformummies.com/stock-rush-pro/", "file": "stock-rush-pro/ (index.html + engine.js, game-data.js, ui-common.jsx, host-view.jsx, player-view.jsx compiled in the browser)", "kind": "classroom", "audience": "Both", "verdict": "The richest classroom game: IPOs, splits, buybacks and rights issues over real Indian history, a resume-or-restart choice when the host reloads, rejoin-safe phones and a shareable result card. It is held back by a broken manual join (typed codes and the printed address both fail), every phone compiling about 340 KB of JSX, and a share link that 404s.", "load": "9 KB page, but every phone downloads ~650 KB of Babel and compiles ~345 KB of JSX (React production build), plus Supabase, QR and html2canvas; several seconds on a cheap Android", "share_idea": "Fix the existing share text, which ends on a dead link: 'I finished #3 of 24 in Stock Rush Pro, ₹2L → ₹3.1L through 12 years of real Indian markets (IPOs, splits, Yes Bank…) 📈 Play it → games.investingformummies.com/stock-rush-pro/'", "share_moment": "On the player's end screen, on the existing result card, after rank and net worth and before the 'what if' comparison.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Typing a room code never works. If a phone opens the player page without a code in the link, the join form only accepts the built-in code 'GO25', so the teacher's real code (e.g. 'KQWT') keeps the Join button greyed out with no explanation. Only scanning the QR gets people in.", "id": "stock-rush-pro--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector prints 'ifm-deploy.vercel.app/stock-rush-pro' as the join address (in two places). That is the old domain, and the plain link opens a new teacher screen, not the join form. A student who types it starts their own empty game. Print a working join link, or 'scan the QR' only.", "id": "stock-rush-pro--2"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "Every phone downloads the in-browser compiler (Babel, about 650 KB) and compiles about 340 KB of code, including the teacher screens it never uses, before showing the join form. On a cheap Android that's a long blank wait while the room watches. Precompile it, as was done for Swayamvar.", "id": "stock-rush-pro--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share my result' message ends with https://investingformummies.com/stock-rush-pro, which is a 404 page. Change it to games.investingformummies.com/stock-rush-pro/.", "id": "stock-rush-pro--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Someone who taps Stock Rush Pro on the games page from a phone lands on 'Go Live: project this screen', which is meaningless on a phone. On phones, show 'This is a live classroom game. Join with a room code, or see how it works', the way The Wealth Hack's phone page does.", "id": "stock-rush-pro--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "About 80 bits of projector text are fixed at 9–13px (leaderboard sub-lines, activity feed, chips), too small for the back of a room. Scale the projector text with the screen size, as The Wealth Hack does.", "id": "stock-rush-pro--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Real listed companies carry labels like 'low risk' (Infosys, HDFC Bank, TCS), and the end screen compares 'what if you'd held X'. Add one clear line on the end screen and the stock cards: 'real companies, used as a history lesson, not a recommendation; past prices don't predict future ones'.", "id": "stock-rush-pro--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The game describes its own length five different ways: 'A decade', '9 years' (share text), 'twelve years 2014→2026' (landing), 'five real market eras' (link preview) and '6 rounds' (description). Pick one, e.g. '6 rounds, 2014 to 2026', and use it everywhere.", "id": "stock-rush-pro--8"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "The end screen has a share button but no next step. Add a quiet 'Liked managing a portfolio? Learn to do it for real: find your batch' link under the share button.", "id": "stock-rush-pro--9"}, {"area": "Layout", "priority": "Low", "effort": "M", "text": "Like the teen version, it uses black-and-white Geist type with none of the IFM colours or fonts, so it doesn't look like an IFM product on the projector. Add the navy, teal and gold and the logo, at least on the lobby and end screens.", "id": "stock-rush-pro--10"}], "key": "stock-rush-pro"}, {"slug": "sapno-ka-ghar.html", "title": "Sapno Ka Ghar", "url": "https://games.investingformummies.com/sapno-ka-ghar.html", "file": "sapno-ka-ghar.html", "kind": "classroom", "audience": "Mummies", "verdict": "A brilliant metaphor that lands: a 90-second shopping panic, bought ratings, a designer who is secretly a fund manager, and a 'you've been investing all along' reveal. It is fully on-brand and gives each class its own room. It is held back by phones that redraw all 116 items whenever anyone buys anything (exactly during the 90-second rush), small buy buttons, and a lobby that empties if the host refreshes.", "load": "128 KB single page + Supabase + QR library; the projector also loads a 1 MB logo PNG from the old ifm-deploy domain. Phones are light on download but heavy on redrawing", "share_idea": "'My dream-home score went from 41 (DIY) to 88 (with a designer) in Sapno Ka Ghar 🏡 Turns out I'd been learning mutual funds the whole time. Try it → games.investingformummies.com/sapno-ka-ghar.html'", "share_moment": "On the phone finale ('Your dream home got built'), right under the DIY → today score card.", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "During the 90-second shopping rush, every purchase by anyone in the room makes every phone redraw the whole 116-item catalogue (the host saves after each buy, and phones also redraw on a 2.5-second check). With 25–30 people on cheap Androids, the list stutters, the category strip jumps back and taps miss, at the one moment speed matters. Update only the budget and the item that changed.", "id": "sapno-ka-ghar-html--1"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The 'Add to home' button is about 30px tall, below the comfortable 44px. The same button instantly turns into 'tap to return', so a nervous double-tap buys and then returns the item. Make it taller, and make returning a separate small link or a confirm.", "id": "sapno-ka-ghar-html--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If the host reloads during the lobby, or more than 30 minutes after the last action, the game starts fresh and everyone who joined disappears from the projector. Phones fall back to the join screen. Keep the lobby and its players on reload, and allow a longer gap for long discussions.", "id": "sapno-ka-ghar-html--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A wrong or old PIN leaves the phone on 'Connecting…' forever. After a few seconds, show 'No game found with this PIN. Check the big screen'. Joining also waits silently on 'Unlocking your door…' if the host screen is offline; add a 'still trying…' message.", "id": "sapno-ka-ghar-html--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The projector's logo is a 1 MB PNG loaded from the old address ifm-deploy.vercel.app. Use a small copy from games.investingformummies.com so it loads fast and survives if the old address goes.", "id": "sapno-ka-ghar-html--5"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Opening the link on a phone (e.g. from a WhatsApp forward) shows the projector screen, with overlapping panels and its own QR. On phones, show 'This is a live class game. Enter the PIN from the big screen' with a PIN box, the way The Wealth Hack does.", "id": "sapno-ka-ghar-html--6"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone finale ends on the closing quote and no next step, though this is the exact moment a mum is thinking 'I want a designer for my money'. Add a gentle 'Want help building yours? Find your batch' link.", "id": "sapno-ka-ghar-html--7"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "On the projector, the '↺ New game' button sits on top of the logo and the 'Investing for Mummies' label in the top-left corner. Move it to a bottom corner.", "id": "sapno-ka-ghar-html--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The phase strip at the top lets the host jump to any step (including back to Lobby) with one click, which is easy to do by accident mid-class. Ask 'Jump back to Lobby?' before going backwards.", "id": "sapno-ka-ghar-html--9"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "The designer (the fund) always lands every home at 82–90, which suggests funds never have a bad year. Add one line to 'The Secret' screen: 'Real funds also have bad years and different fees; check the fund's track record, and past returns aren't promises.'", "id": "sapno-ka-ghar-html--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "SALE items say '20% OFF TODAY', but the crossed-out price makes them about 37% off. One shopping 'noise' message names a real brand (Natuzzi) while every catalogue brand is made up. Match the numbers and use a made-up brand name.", "id": "sapno-ka-ghar-html--11"}], "key": "sapno-ka-ghar-html"}]}, {"group": "classic", "games": [{"slug": "tools-budget", "title": "Budget Tracker", "url": "https://games.investingformummies.com/classic?open=resources&tab=budget", "file": "classic.html (#res_budget)", "kind": "tool", "audience": "Mummies", "verdict": "A thorough monthly budget with a 50/30/20 health check and emergency-fund targets. Two things hold it back: it comes pre-filled with ₹1.24 lakh of sample expenses but no income, and on a phone it sits in a box that scrolls separately from the page.", "load": "99 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "My family's money in 3 numbers: ₹X needs, ₹Y wants, ₹Z left to save. See where your money goes in 2 minutes: <link>", "share_moment": "On the dashboard, right under 'Money Remaining' and the 50/30/20 scorecard", "recommendation": "Move to /tools as its own page — it is the most useful everyday tool here and nothing else on the site duplicates it (Money Map is the teen version).", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 390px phone the calculator sits in a fixed 1,400px-tall box while its content is 2,300px tall and 447px wide, so the results scroll inside a box inside the page, and long labels are cut off ('Salary (…', 'Business…', 'Rental In…'). As its own page, let it grow to full height and stack each label above its input.", "id": "tools-budget--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "All expense fields start filled with sample numbers (₹15,000 EMI, ₹16,000 groceries and more, ₹1.24 lakh a month in total) but income starts at zero. A mum who fills in only her salary gets a scary 'you're spending more than you earn' verdict built on made-up costs. Start every field empty with grey example text, or ask 'Use a sample family?' first.", "id": "tools-budget--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "In the 'Where does your money go' doughnut, 'Fixed Expenses' and 'Essentials' share the same navy colour, and so do the Income and Essentials bars, so the two biggest slices can't be told apart. Give every category its own colour.", "id": "tools-budget--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The results stop at 'Consider moving it into savings'. Add one step that turns the surplus into action: 'Your ₹X left over could be an emergency fund in N months, then a ₹Y SIP'. Link it to the SIP Calculator and the emergency-fund target already on the page.", "id": "tools-budget--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-budget--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "After the health check, add one gentle line: 'Want help building this into a plan? Find your batch' linking to register.investingformummies.com.", "id": "tools-budget--6"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "Shrink the frame on its own page: drop the second, duplicate Google Fonts load and the unused empty script blocks, and load Chart.js only when 'Show Me My Budget Picture' is tapped.", "id": "tools-budget--7"}], "key": "tools-budget"}, {"slug": "tools-sip", "title": "SIP Calculator", "url": "https://games.investingformummies.com/classic?open=resources&tab=sip", "file": "classic.html (#res_sip)", "kind": "tool", "audience": "Both", "verdict": "A strong step-up SIP calculator with a year-by-year table and a 'cost of starting 5 years later' card. But its starting numbers (₹1 lakh a month at 12%) are far from a first-time investor's reality, and some 'real-life' comparisons overpromise.", "load": "85 KB frame, hand-drawn chart, no libraries; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "If I step up my ₹X SIP by 10% a year, I could have ₹Y in Z years instead of ₹W (assuming 12%). Try your number: <link>", "share_moment": "Below the 'Extra Wealth Created' result card", "recommendation": "Move to /tools as its own page — it is the core calculator, and it is the natural next step from Budget and Goal tools.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The default SIP is ₹1,00,000 a month with an 11% step-up, while the explainer underneath talks about ₹10,000 a month. Start at ₹5,000–₹10,000 and a 10% step-up so the first result feels reachable for a mum starting out.", "id": "tools-sip--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The 'real-life equivalent' lines claim things like 'That's 1.2 crore — enough to retire on' and '₹X/month — a nice salary boost' (that one is the lump sum divided by 12, which is not a monthly income). Remove the retirement claim, fix or drop the salary line, and show the return assumption next to every result ('at 12% a year, not guaranteed').", "id": "tools-sip--2"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone it shows in a 900px-tall box while its content is 3,070px tall, so you see only the inputs and must scroll inside the box to reach any result. As its own page, let it run full height and put the two result cards first.", "id": "tools-sip--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The title says 'SIP Step-Up Calculator', but there is no line explaining what a step-up is. Add one: 'Step-up = raising your SIP a little every year, usually when your salary goes up.' The custom-return box also reads '0 %'; leave it blank with a placeholder.", "id": "tools-sip--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a 'show in today's money' switch that removes 6% inflation, so ₹2 crore in 25 years is also shown as roughly ₹46 lakh in today's money. This is the honest version of the big number.", "id": "tools-sip--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-sip--6"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Under 'The Cost of Starting 5 Years Later', add a soft 'Ready to start your first SIP with guidance? Find your batch' link.", "id": "tools-sip--7"}], "key": "tools-sip"}, {"slug": "tools-swp", "title": "SWP Calculator", "url": "https://games.investingformummies.com/classic?open=resources&tab=swp", "file": "classic.html (#res_swp)", "kind": "tool", "audience": "Mummies", "verdict": "A clear 'can your money pay you a salary' calculator with an honest 'money runs out in year 5' warning and safe, moderate and danger withdrawal bands. The 'historical real data' mode names real mutual funds and tells people which plan to pick, which is a compliance risk.", "load": "35 KB built into the hub page (no frame); historical mode calls the free mfapi.in fund database; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Can ₹X give me ₹Y a month for 25 years? This calculator says my money lasts N years. Check yours: <link>", "share_moment": "Directly under the remaining-corpus result and the 'money runs out' banner", "recommendation": "Move to /tools as its own page — it is the only withdrawal tool, and it pairs with the Retirement Planner.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "The historical mode's helper text names real funds ('Parag Parikh Flexi Cap', 'HDFC Top 100') and says 'Pick the Direct option for lower fees'. That reads as a recommendation from an unregistered educator. Use neutral wording ('type any mutual fund name'), drop the advice, and add 'past performance is not a guide to future returns'.", "id": "tools-swp--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The default (₹50 lakh corpus, ₹1 lakh a month, so 24% withdrawn a year) runs out in year 5. That is a dramatic lesson, but it opens on a red failure with no explanation. Either start at a sustainable 5–6% and invite people to push it, or label the default 'What happens if you withdraw too much?'", "id": "tools-swp--2"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "On desktop the IFM logo watermark sits inside the doughnut, behind the 'Remaining Corpus ₹0' figure, and makes the key number hard to read. Remove the watermark from the chart centre.", "id": "tools-swp--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'SWP' is never spelled out. Add 'SWP = Systematic Withdrawal Plan, a fixed monthly amount paid to you from your investments' under the title, and explain 'step-up' as 'raise the withdrawal each year to keep up with prices'.", "id": "tools-swp--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-swp--5"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Add a 'what if markets fall in year 1?' toggle to the simple mode. Showing the same plan with a bad first year teaches sequence risk, the real danger for retirees, far better than a flat 8%.", "id": "tools-swp--6"}], "key": "tools-swp"}, {"slug": "tools-retire", "title": "Retirement Planner", "url": "https://games.investingformummies.com/classic?open=resources&tab=retire", "file": "classic.html (#res_retire)", "kind": "tool", "audience": "Mummies", "verdict": "The most complete planner here: inflation, life expectancy, per-asset existing savings, the gap, the SIP or lump sum to close it, and a disclaimer. It is too technical for beginners (a methodology essay for financial planners) and breaks on phones.", "load": "143 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I need about ₹X to retire at 60 and I'm Y% of the way there. Here's the monthly SIP that closes my gap: <link>", "share_moment": "After the 'Monthly SIP to Bridge the Gap' card", "recommendation": "Move to /tools as its own page — keep this one, retire the beta Retirement Planner and the Chat Bot, and borrow the beta's per-investment step-up field.", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 390px phone the content is 620px wide in a 362px box, so the input boxes and section badges are cut off on the right, and the existing-savings table needs sideways scrolling inside a box that also scrolls up and down. Stack the savings rows as cards on phones, one asset per card.", "id": "tools-retire--1"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The 'Note for Financial Planners — Methodology' block (annuity formulas, 'end-of-period', Excel comparison) sits in the main flow. Fold it behind a 'How we calculate' link so a mum isn't confronted with formulas after her result.", "id": "tools-retire--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The defaults are aimed at a high earner (₹1 lakh a month spending, retire at 65). Use ₹50,000 and 60, the common Indian retirement age, and label the cryptic 'M' and 'Cont. yrs' columns in plain words ('Monthly top-up', 'For how many years').", "id": "tools-retire--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Per-asset return defaults (stocks 13%, mutual funds 12%, NPS 10%) appear as plain numbers. Add a small 'assumed, not guaranteed' note beside the returns rows, not only in the footer disclaimer.", "id": "tools-retire--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-retire--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Under the gap result, add 'Not sure how to close a ₹X gap? This is exactly what our course covers — find your batch' linking to register.investingformummies.com.", "id": "tools-retire--6"}], "key": "tools-retire"}, {"slug": "tools-edu", "title": "Education Planner", "url": "https://games.investingformummies.com/classic?open=resources&tab=edu", "file": "classic.html (#res_edu)", "kind": "tool", "audience": "Mummies", "verdict": "A genuinely useful multi-child planner with India/abroad costs, education inflation and a monthly SIP to close the gap. The phone layout is the main problem: labels cut off and a table wider than the screen.", "load": "115 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "My child's college will cost about ₹X by 2040. Starting ₹Y a month now covers it (assuming 11%). Plan yours: <link>", "share_moment": "After the 'Monthly SIP Needed to Bridge the Gap' card", "recommendation": "Move to /tools as its own page — it is a top worry for the core audience, and nothing else covers it.", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the content is 634px wide in a 362px box. Labels are truncated ('Age When Edu…', 'Duration of Edu…', 'Annua…') and the investments table needs sideways scrolling. Put each label above its field and turn the table rows into stacked cards.", "id": "tools-edu--1"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The savings row 'Sukanya / PPF / SSY' lists Sukanya twice (SSY is Sukanya Samriddhi Yojana). Rename it 'Sukanya Samriddhi (SSY) / PPF'.", "id": "tools-edu--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "For 'Abroad', the dollar rate is a hidden assumption. Show it next to the cost ('at ₹90 per $; the rupee has historically weakened about 3% a year') so parents see why overseas costs grow faster.", "id": "tools-edu--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a simple 'what if I start 3 years later?' line next to the SIP result. The jump in monthly SIP is the emotional hook that makes a parent act today.", "id": "tools-edu--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-edu--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "After the result, add a soft link: 'Want a plan for every goal, not just this one? Find your batch'.", "id": "tools-edu--6"}], "key": "tools-edu"}, {"slug": "tools-holiday", "title": "Holiday Budget", "url": "https://games.investingformummies.com/classic?open=resources&tab=holiday", "file": "classic.html (#res_holiday)", "kind": "tool", "audience": "Mummies", "verdict": "A friendly trip budget with per-person and per-night costs and a monthly savings target. It shows two headers at the top, compiles its code in the browser, and misses the money lesson about where to keep the holiday savings.", "load": "57 KB frame + React + Babel compiling the page in the browser (about 1.5 MB of scripts before it can be used); the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Our 7-night family trip = ₹X. Saving ₹Y a month gets us there by <month> with no credit card hangover: <link>", "share_moment": "On the summary screen, under the 'Save / Month' and 'Save / Week' chips", "recommendation": "Move to /tools as its own page — a light, fun entry point to budgeting, and nothing else covers it.", "items": [{"area": "Layout", "priority": "High", "effort": "S", "text": "The first screen shows two stacked banners, 'Holiday Budget Planner' and then 'Family Travel Budget Planner', which push the trip form below the fold on phones. Keep one banner.", "id": "tools-holiday--1"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "It is the only calculator that downloads React and the Babel compiler and translates its own code on every visit, adding seconds on a mid-range phone. Pre-build it to plain JavaScript when moving it to its own page.", "id": "tools-holiday--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Two tips are risky for this audience: 'Pay big-ticket items with a rewards card' (credit-card debt) and 'Book flights on Tue/Wed — 10–15% cheaper' (unproven). Replace them with 'Keep the trip fund in a separate savings account or recurring deposit' and 'Book early and set a fare alert'.", "id": "tools-holiday--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If no month is picked, or a past month is picked, the whole 'Save per month' section silently disappears. Default to a month 6 months ahead and block past months.", "id": "tools-holiday--4"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Add one line on where to park the monthly savings ('a recurring deposit or a liquid fund, not equity, for money needed within a year'). This turns a trip planner into a money lesson.", "id": "tools-holiday--5"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The 'Share via WhatsApp' button sends a generic line ('I just used the free ... on Investing for Mummies') plus the old ifm-deploy.vercel.app address. Change it to the new games.investingformummies.com/tools address and include the person's own result.", "id": "tools-holiday--6"}], "key": "tools-holiday"}, {"slug": "tools-alloc", "title": "Asset Allocation", "url": "https://games.investingformummies.com/classic?open=resources&tab=alloc", "file": "classic.html (#res_alloc)", "kind": "tool", "audience": "Mummies", "verdict": "A quick age-plus-risk slider that gives a five-asset mix. Its explanation contradicts its own table, and words like 'Recommended' and 'the right mix' read as personal advice.", "load": "18 KB frame, no libraries; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "At 35 with a moderate appetite, the 100-minus-age rule suggests about X% equity. What's your mix? <link>", "share_moment": "Under the allocation bar and table", "recommendation": "Merge with Mix My Portfolio — it uses exactly the same age-band table; the game teaches the rule without telling a real person what to buy. Keep a 'try your own age' final round there.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "At age 30 it says '100 − 30 = 70% base equity' but the table shows 55% equity, and the text says 'your moderate profile keeps it close to 55%'. The rule and the numbers disagree. Either use the rule or drop the rule label.", "id": "tools-alloc--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The heading 'Recommended Allocation' and the subtitle 'the right mix of Equity, Bonds, Real Estate, Gold & Cash' sound like personal advice. Use 'A common rule-of-thumb mix for your age' and keep the SEBI disclaimer visible next to the result.", "id": "tools-alloc--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "It suggests 10% in 'Real Estate' for a 30-year-old, which a beginner can't buy in small amounts. Say 'Real estate (for example via REITs)' or fold it into equity, and explain bonds as 'debt funds / FDs'.", "id": "tools-alloc--3"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "It uses a purple theme, unlike the navy, teal and gold of every other IFM tool, and on desktop a large empty area sits below the button before you calculate. Restyle to brand colours.", "id": "tools-alloc--4"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "There are two 'Download My Plan' buttons, one inside the calculator and one under it, plus the WhatsApp button that shares the old ifm-deploy.vercel.app address. Keep one download button and fix the share address.", "id": "tools-alloc--5"}], "key": "tools-alloc"}, {"slug": "tools-divplan", "title": "Dividend Income Planner", "url": "https://games.investingformummies.com/classic?open=resources&tab=divplan", "file": "classic.html (#res_divplan)", "kind": "tool", "audience": "Mummies", "verdict": "A small dividend-reinvest-versus-cash projector with a chart and a disclaimer. Its jargon (DRIP), optimistic example yield and missing tax make it the weakest of the calculators for beginners.", "load": "14 KB frame + a second, different copy of Chart.js (4.4.0 from jsdelivr, unlike every other tool); the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "₹5 lakh could pay me about ₹X a month in dividends (assuming Y% yield). See what yours could pay: <link>", "share_moment": "Under the 'Monthly Dividend Income (Year 1)' result", "recommendation": "Move to /tools as its own page — useful for retirees, but low priority; fix the copy first.", "items": [{"area": "Copy", "priority": "High", "effort": "S", "text": "'DRIP' is an American term. In Indian mutual funds this is 'IDCW reinvestment' versus 'IDCW payout'. Rename it and add one line of explanation.", "id": "tools-divplan--1"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The example yield '3.5%' sits above the Nifty's typical 1–1.5%, and dividends are taxed at your slab rate in India, which the tool ignores. Use a 1.5% example, add a tax-slab field or note, and keep the disclaimer next to the result.", "id": "tools-divplan--2"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "On a phone the content is 415px wide in a 362px box, so the 'Price Growth % p.a.' field is cut off on the right. Stack the two fields.", "id": "tools-divplan--3"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "It uses an orange theme unlike other IFM tools, and starts with empty inputs, so first-time users see nothing until they guess numbers. Pre-fill a realistic example and restyle to brand colours.", "id": "tools-divplan--4"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "There are two 'Download My Plan' buttons, and the WhatsApp share uses the old ifm-deploy.vercel.app address. Keep one button and fix the address.", "id": "tools-divplan--5"}], "key": "tools-divplan"}, {"slug": "tools-goals", "title": "Financial Goal Planner (beta)", "url": "https://games.investingformummies.com/classic?open=resources&tab=goals", "file": "classic.html (#res_goals)", "kind": "tool", "audience": "Mummies", "verdict": "A careful 4-step goal planner (goals, inflated targets, current investments, shortfall and SIP). It overlaps heavily with the standalone Fund YOUR Goal and Goal Tracker, has no disclaimer, and contradicts its own tip by applying one 12% return to every goal.", "load": "96 KB frame + its own copy of Chart.js; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "My 3 goals need ₹X in total; ₹Y a month gets me there (assuming 12%). Map your goals: <link>", "share_moment": "Step 4, under the 'Total Monthly SIP to Fund All Goals' card", "recommendation": "Merge with Fund YOUR Goal — the standalone Fund YOUR Goal and Goal Tracker pages already cover single goals; fold this tool's multi-goal buckets and per-bucket inflation into them rather than shipping a third goal tool.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "It applies one 12% return to every goal, including short-term goals 1–3 years away, while its own tip says short-term money should sit in liquid funds or FDs. Use a separate return per bucket (for example 6% short, 9% medium, 12% long) and add the missing 'estimates, not guaranteed' disclaimer.", "id": "tools-goals--1"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "On a phone it shows in an 1,100px box while its content is 1,685px tall (taller after each step), so steps 2–4 scroll inside a box. Goal names are cut off ('Home Down Paym'). As a page, let it grow and stack goal name, amount and years.", "id": "tools-goals--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Its four steps each need a button press, with no way to go back and tweak one goal and see the SIP change. Recalculate live once all goals are entered.", "id": "tools-goals--3"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The 'beta' label and three goal tools (Goal Planner, Fund Goal, Goal Tracker) side by side in the tab bar confuse visitors. Whichever survives the merge, name it plainly: 'Plan all my goals'.", "id": "tools-goals--4"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The WhatsApp share sends the old ifm-deploy.vercel.app address with no result in the text. Fix it in the merged tool.", "id": "tools-goals--5"}], "key": "tools-goals"}, {"slug": "classic-mixport", "title": "Mix My Portfolio", "url": "https://games.investingformummies.com/classic?open=mixport", "file": "classic.html (#mixport)", "kind": "solo", "audience": "Mummies", "verdict": "A neat persona game (Neha 25 … Kavita 60): set five sliders and get scored against an 'ideal' mix with side-by-side pies. Scoring to the exact percent against one 'correct' answer teaches false precision.", "load": "12 KB of markup + about 8 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I scored 410/500 matching portfolios to 5 women's life stages. Can you beat me? <link>", "share_moment": "Final 'Portfolio Master' screen after the total score", "recommendation": "Move to games as its own page — unique persona framing. Absorb the Asset Allocation calculator as a last 'now try your own age' round.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Each persona has one exact 'ideal' mix and you lose a point for every 1% away, so 65% equity for Neha loses points even though any of 60–75% is sensible. Score by bands (within 10% = full marks) and show the ideal as a range.", "id": "classic-mixport--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Neha's hint says '100 minus age = equity %' (75%) and her tip says '~75', yet her 'ideal' equity is 70%. Make the hint, tip and answer agree.", "id": "classic-mixport--2"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The sliders are 3px thin tracks with small thumbs, hard to drag on a phone, and moving one slider silently shifts the others. Make the tracks taller, enlarge the thumbs to 44px, and use +/− buttons as an alternative.", "id": "classic-mixport--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Calling one mix the 'ideal' for a real-sounding person edges toward advice. Use 'a typical rule-of-thumb mix for someone like Neha', and add one line that real choices depend on goals and risk comfort.", "id": "classic-mixport--4"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "On the final screen add 'Want to work out the right mix for your own goals? Find your batch'.", "id": "classic-mixport--5"}], "key": "classic-mixport"}, {"slug": "classic-rollercoaster", "title": "Market Rollercoaster", "url": "https://games.investingformummies.com/classic?open=game1", "file": "classic.html (#game1)", "kind": "solo", "audience": "Both", "verdict": "A short, well-paced lesson on rupee-cost averaging, with Vikram's year-by-year units reveal. It gives away its own quiz answer and overclaims ('markets always recover').", "load": "6.5 KB of markup + about 5 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Markets crashed 20% and I kept my SIP. Vikram got his most units in the crash year. Would you panic? <link>", "share_moment": "After Step 4, next to the closing quote", "recommendation": "Move to games as its own page — the clearest rupee-cost-averaging lesson on the site, and short enough for a WhatsApp click. Link onward to The Timing Trap.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "When Step 2 finishes, the chips already show 'Final Value ₹68,016', and then Step 3B asks 'what do you think his investment is worth now?'. Hide the final value until after that question is answered.", "id": "classic-rollercoaster--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "Answer C reads 'Continue my SIP — markets always recover', and the feedback calls rupee-cost averaging 'the most powerful tool'. Say 'markets have historically recovered over time, though not always quickly' and drop the superlative.", "id": "classic-rollercoaster--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Vikram invests '₹10,000 every year' yet it's called a SIP, which is monthly. Make it ₹10,000 a month, or call it a yearly investment, so beginners don't learn the wrong idea of a SIP.", "id": "classic-rollercoaster--3"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Each year row packs five things (year, bar, %, NAV, units) into one line. On a phone the bar is squeezed to a few pixels. Put NAV and units on a second line under the bar.", "id": "classic-rollercoaster--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Points are counted but never shown. There is no end screen. Add a small result card ('4/4 — you've got the crash-proof mindset') before 'Play again' so the lesson has a payoff.", "id": "classic-rollercoaster--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Under the closing quote add 'Learn to build a SIP you won't panic-sell: find your batch'.", "id": "classic-rollercoaster--6"}], "key": "classic-rollercoaster"}, {"slug": "classic-chaiboss", "title": "ChaiBoss Ltd", "url": "https://games.investingformummies.com/classic?open=game7", "file": "classic.html (#game7)", "kind": "solo", "audience": "Both", "verdict": "A charming 8-quarter story that teaches EPS, P/E and price = EPS × P/E with a chai brand. The answer is almost always option A, and the hint shown before you answer gives it away.", "load": "6 KB of markup + about 25 KB of scenario script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I scored 7/8 reading ChaiBoss's stock like a pro (EPS, P/E and all). Can you? <link>", "share_moment": "Results screen, beside 'Points Earned' and 'Correct Answers'", "recommendation": "Move to games as its own page — the best plain-English P/E lesson here. Fold Fair or Fleeced in as its bonus round.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The correct choice is option A in 7 of 8 quarters (only Quarter 3 is B), so players learn to tap A. Shuffle the order of the choices each round.", "id": "classic-chaiboss--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The hint box sits above the choices and states the answer (for example 'EPS jumped… investors get excited'). Hide it behind a 'Need a hint?' button, as Rollercoaster does.", "id": "classic-chaiboss--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Quarter 3's headline says an analyst calls ChaiBoss 'Overvalued', but the story says its P/E of 9 is well below the industry's 15, which is undervalued. Change the headline to 'Undervalued — or in trouble?'.", "id": "classic-chaiboss--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The intro promises 'you'll run a fictional chai company', but your answers never change the stock price. Make it honest ('predict how the market reacts'), or let a correct call earn the player a share bonus so choices matter.", "id": "classic-chaiboss--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "On a phone the price, EPS, P/E and points chips stack in a tall navy block, and 'Price: ₹' wraps. Put the four stats in one compact row.", "id": "classic-chaiboss--5"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "On the results screen add 'Want to read a real company's numbers with confidence? Find your batch'.", "id": "classic-chaiboss--6"}], "key": "classic-chaiboss"}, {"slug": "classic-divdash", "title": "Dividend or Dash?", "url": "https://games.investingformummies.com/classic?open=divdash", "file": "classic.html (#divdash)", "kind": "solo", "audience": "Mummies", "verdict": "A good idea (match income or growth to a life stage). Its simulation bars contradict its own correct answers and explanations, and it names a real PSU stock.", "load": "3.6 KB of markup + about 6 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I matched 5 life stages to dividend or growth stocks and scored 40/50. Which would you pick at 58? <link>", "share_moment": "Final score card", "recommendation": "Move to games as its own page — but only after fixing the numbers below; otherwise retire it.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Round 4's explanation says '₹1L becomes ₹32L in 20 years vs ₹3.9L', but the bars on screen show ₹75.1L vs ₹7.4L. Make the text use the same calculation as the bars.", "id": "classic-divdash--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "In the three rounds where 'dividend' is the correct answer, the bars still show the growth stock ending 4–10× richer (for example ₹86.7L vs ₹9.3L), which undercuts the lesson. For income rounds, show monthly income received and risk of a fall, not 20-year wealth.", "id": "classic-divdash--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "'PowerGrid Corp — Steady 5.1% yield, PSU stock' is a real listed company presented as the right pick for a near-retiree. Use fictional names only, as the other rounds do (StableBank, TechRocket).", "id": "classic-divdash--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Growth rates of 22–25% a year for 20 years and yields of 4–6.5% are unrealistic and presented without any 'assumed' label. Use toned-down rates (12–15% growth, 1.5–4% yield) and label them assumed.", "id": "classic-divdash--4"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The title 'Dividend or Dash?' doesn't say what 'dash' means. Use 'Income Now or Growth Later?' or add a subtitle; also note that in India dividends are taxed at your slab rate.", "id": "classic-divdash--5"}], "key": "classic-divdash"}, {"slug": "classic-fairfl", "title": "Fair or Fleeced?", "url": "https://games.investingformummies.com/classic?open=fairfl", "file": "classic.html (#fairfl)", "kind": "solo", "audience": "Both", "verdict": "A clean 5-round P/E drill (cheap, fair or pricey against the sector) with a strong closing takeaway. It is thin on its own, and repeats ChaiBoss's subject.", "load": "6.6 KB of markup + about 4 KB of script inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I spotted which 4/5 stocks were cheap or pricey just from their P/E. Fair or fleeced — can you tell? <link>", "share_moment": "Final score card under the 'P/E is a relative tool' takeaway", "recommendation": "Merge with ChaiBoss Ltd — it is the natural 'level 2' after ChaiBoss teaches what P/E is; five rounds is too thin for a page of its own.", "items": [{"area": "Copy", "priority": "Med", "effort": "S", "text": "One fictional company is called 'Sahara Power'. Sahara is a real group linked to a well-known investor scandal. Rename it (for example 'Surya Power') to avoid confusion.", "id": "classic-fairfl--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Players must divide 420 by 21 in their heads. Many beginners will guess. Add a 'Show me the maths' tap that reveals the P/E before they choose, and score the verdict, not the arithmetic.", "id": "classic-fairfl--2"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The explanations call stocks 'potentially undervalued!' and 'a hidden gem'. Add one line that a low P/E alone is not a reason to buy, which ChaiBoss already teaches as a 'value trap'.", "id": "classic-fairfl--3"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "With five fixed rounds, every replay is identical. Shuffle the order and add 3–5 more companies so a replay feels fresh.", "id": "classic-fairfl--4"}], "key": "classic-fairfl"}, {"slug": "classic-timing-trap", "title": "The Timing Trap", "url": "https://games.investingformummies.com/classic?open=nifty26", "file": "classic.html (#nifty26)", "kind": "solo", "audience": "Both", "verdict": "A strong, real-data story: three investors, 26 years of Nifty, and perfect versus worst timing barely differ. The data stops in 2021, some wording overclaims, and two versions of the game load on every visit.", "load": "36 KB game + an older 27 KB version that loads first and is then replaced, both compiled in the browser by React + Babel; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Even the investor who bought at the worst moment every year for 26 years ended with ₹X. Timing barely matters: <link>", "share_moment": "Result screen, under the CAGR comparison", "recommendation": "Move to games as its own page — the most convincing 'time in the market' lesson on the site (real Nifty history). Point Three Investors and Rollercoaster to it.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "The simulation ends in 2021 while it is now late 2026. Extend it to 2025 (or reframe as 2000–2025) so the result includes the 2022 dip and recent years.", "id": "classic-timing-trap--1"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Event notes say 'markets always recover from macro shocks', and 2014 is labelled 'Modi Wave'. Say 'markets have historically recovered', rename the event '2014 election rally', and note that the figures are the Nifty price index, past returns only.", "id": "classic-timing-trap--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Steady Sunita invests once a year on 1 January but the takeaway calls this 'a boring SIP'. Also the worst-timer is 'Worried Waris' on the cards and 'Unlucky Waris' in the story. Use 'invests every January' and one name throughout.", "id": "classic-timing-trap--3"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Both the old and the new version are set up on every open, so the browser compiles two React apps and throws one away. Ship only the new version, pre-built without Babel.", "id": "classic-timing-trap--4"}, {"area": "Mobile", "priority": "Low", "effort": "S", "text": "On a phone the three investor cards stack to almost three screens before the start button. Show them as a compact row of three or a swipeable strip.", "id": "classic-timing-trap--5"}], "key": "classic-timing-trap"}, {"slug": "classic-market-madness-1", "title": "Market Madness 1", "url": "https://games.investingformummies.com/classic?open=marketmad", "file": "classic.html (#marketmad)", "kind": "solo", "audience": "Both", "verdict": "A 6-round buy, hold or sell race against a Reactive, a Smart Picker and a Safe investor. Market Madness 2 (live at /market-madness-2) already does the same and more, and both use real stock names with fictional returns.", "load": "39 KB plain-JavaScript frame; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I raced a panic seller and an index investor over 6 crazy market years and ended at ₹X. Did you beat the Nifty? <link>", "share_moment": "Final standings screen", "recommendation": "Retire — Market Madness 2 already has its own page and reuses the same assets, opponents and behaviour stats.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "It labels real single stocks with risk levels (Reliance Industries and HDFC Bank 'Low risk', Yes Bank and Suzlon 'High risk') and gives them invented returns. If anything is kept, use fictional company names. The same applies to Market Madness 2.", "id": "classic-market-madness-1--1"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Zomato' was renamed Eternal in 2025, so the list already looks dated. Another reason not to use real names.", "id": "classic-market-madness-1--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Before retiring it, check that MM2 keeps the one strong feature here: the end-of-game 'Your behaviour' panel (trades made, panic sells, late buys).", "id": "classic-market-madness-1--3"}], "key": "classic-market-madness-1"}, {"slug": "classic-investopia", "title": "Investopia", "url": "https://games.investingformummies.com/classic?open=investopia", "file": "classic.html (#investopia)", "kind": "solo", "audience": "Mummies", "verdict": "An 8-world map, but only World 1 ('Clean House') exists, and the other seven are locked forever. Its content overlaps Module 1 and IFM Course.", "load": "43 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I cleaned up my money house in World 1 of Investopia: emergency fund, insurance, debt. Start yours: <link>", "share_moment": "World 1 completion screen", "recommendation": "Retire — World 1 is the same 'Clean House' material as Module 1 (/module-1) and IFM Course; the other 7 worlds were never built.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Seven of eight worlds show a lock and 'Coming Soon', which reads as abandoned. If it isn't retired, show only World 1 and drop the empty map.", "id": "classic-investopia--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Lost hearts are saved in the browser and never refill, so a player who loses all five stays at zero forever, and nothing happens at zero. Remove hearts or refill them daily.", "id": "classic-investopia--2"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "It downloads React and the Babel compiler for one world of quizzes. If any of it is reused in Module 1, pre-build it.", "id": "classic-investopia--3"}], "key": "classic-investopia"}, {"slug": "classic-investopia-2", "title": "Investopia 2", "url": "https://games.investingformummies.com/classic?open=investopia2", "file": "classic.html (#investopia2)", "kind": "solo", "audience": "Mummies", "verdict": "Byte-for-byte the same file as 'IFM Course' (same 72 KB, same title 'Investopia 2'), shown under a second name.", "load": "72 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Same as IFM Course: 'I finished World 1: 9 stages, 80+ questions, ₹X coins. Ready to clean your money house?' <link>", "share_moment": "World 1 completion screen", "recommendation": "Retire — it is an exact duplicate of IFM Course; keep one copy at most.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Investopia 2 and IFM Course load the identical file, so the hub lists the same game twice under two names, and progress is shared between them. Remove one entry.", "id": "classic-investopia-2--1"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Six of seven worlds say 'Coming Soon'. Whichever copy survives, hide unbuilt worlds rather than showing a wall of locks.", "id": "classic-investopia-2--2"}], "key": "classic-investopia-2"}, {"slug": "classic-ifm-course", "title": "IFM Course", "url": "https://games.investingformummies.com/classic?open=ifmcourse", "file": "classic.html (#ifmcourse)", "kind": "solo", "audience": "Mummies", "verdict": "A rich 9-stage 'Clean House' journey (myths, vocabulary, insurance, Rule of 72, a boss stage) with coins and hearts. It is titled 'Investopia 2' on screen, uses a dark purple theme, and repeats Module 1.", "load": "72 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I finished World 1 of the IFM money course: 9 stages, 80+ questions. Ready to clean your money house? <link>", "share_moment": "World 1 completion screen", "recommendation": "Merge with Module 1 (/module-1) — same topic. Move its best stages (Insurance IQ, Rule of 72, Quick Fire) into Module 1 and drop the rest.", "items": [{"area": "Copy", "priority": "High", "effort": "S", "text": "The screen opened from 'IFM Course' is titled 'Investopia 2', so a visitor can't tell which course they're in. If it is kept, name it consistently.", "id": "classic-ifm-course--1"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "The dark purple and violet theme ignores the navy, teal and gold brand used by Module 1–6, so the two 'courses' look like different products. Restyle any stages moved into Module 1.", "id": "classic-ifm-course--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Hearts drop on wrong answers, are saved forever, never refill, and nothing happens at zero. That punishes learners for no benefit. Drop hearts, or refill them daily and explain what they do.", "id": "classic-ifm-course--3"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "It compiles React in the browser on every open. Module 1 is plain JavaScript and much lighter; another reason to merge into it.", "id": "classic-ifm-course--4"}], "key": "classic-ifm-course"}, {"slug": "classic-ifm-course-2", "title": "IFM Course 2 (module hub)", "url": "https://games.investingformummies.com/classic?open=ifmcourse2", "file": "classic.html (#ifmcourse2)", "kind": "solo", "audience": "Mummies", "verdict": "A clean menu of the six course modules (Before You Invest → Measuring Returns). The modules already exist as standalone pages (/module-1 … /module-6), but this hub opens the older copies built into the classic page.", "load": "4 KB menu; each module 56–91 KB of plain JavaScript inside the hub; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I'm working through the free 6-module Investing for Mummies course and just finished Module 2. Join me: <link>", "share_moment": "At the bottom of each finished module, and on the hub once a module shows as complete", "recommendation": "Move to games as its own page — make it a light '/course' landing page that links to the existing /module-1 … /module-6 pages.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The module tiles open the copies built into the classic hub, which have drifted from the standalone /module-1 … /module-6 pages (every one differs by about 3–4 KB). Point each tile at its standalone page so there is one version to maintain.", "id": "classic-ifm-course-2--1"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The hub shows no progress. Add a tick and 'done' badge for finished modules (the modules already save progress in the browser) and a 'Continue where you left off' button.", "id": "classic-ifm-course-2--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'IFM Course 2' means nothing to a visitor. Call it 'The free 6-step money course' and give each module a time estimate (for example '15 min').", "id": "classic-ifm-course-2--3"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "This is the warmest page for sign-ups: after Module 6, or on the hub, add 'Liked the course? Learn it live with Hiral — find your batch'.", "id": "classic-ifm-course-2--4"}], "key": "classic-ifm-course-2"}, {"slug": "classic-ifm-chatbot", "title": "IFM Chat Bot", "url": "https://games.investingformummies.com/classic?open=ifmchat", "file": "classic.html (#ifmchat)", "kind": "solo", "audience": "Mummies", "verdict": "A scripted chat that walks through retirement, education, holiday, savings-goal and SIP sums. It repeats five calculators, its photo-upload does nothing, and on phones the reply box sits under the floating buttons.", "load": "189 KB frame (including the same 23 KB logo image embedded 5 times); loads on every hub visit; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "I planned my retirement just by chatting: I need ₹X, that's ₹Y a month. Try it: <link>", "share_moment": "After the bot's final plan summary", "recommendation": "Retire — it duplicates the Retirement, Education, Holiday, Goal and SIP calculators. If a chat-style entry is wanted later, build it as a 'guided mode' that hands off to the /tools pages.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "It offers 'Upload a photo of your portfolio statement', but the photo is never read; only the file name is echoed back. It invites people to share a sensitive financial document for nothing. Remove the option.", "id": "classic-ifm-chatbot--1"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "On a phone the 'Your answer…' box and send button sit under the floating 'Menu' and 'Suggest' buttons, so the main control is covered. Keep the floating buttons away from the chat's bottom bar.", "id": "classic-ifm-chatbot--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The banner says 'we'll build your retirement plan', but the bot first asks you to pick from five goals. Make the promise match ('plan any money goal by chatting').", "id": "classic-ifm-chatbot--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "An older copy of the same bot sits in the Beta screen's 'Chat Planner' tab with the same page ID, so there are two chat bots to maintain and they can clash. Remove the beta copy.", "id": "classic-ifm-chatbot--4"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "It states 'good equity MFs return ~11% p.a. over the long run'. Add 'historically, not guaranteed' to that line.", "id": "classic-ifm-chatbot--5"}], "key": "classic-ifm-chatbot"}, {"slug": "classic-news-agency", "title": "IFM News Agency", "url": "https://games.investingformummies.com/classic?open=newsagency", "file": "classic.html (#newsagency)", "kind": "solo", "audience": "Mummies", "verdict": "Billed as a 'Daily Digest', but its live news feed is gone (the Vercel deployment returns 'not found'), so it shows six articles from 4 May 2026, including one twice, plus a public 'Admin only' panel.", "load": "7.5 KB markup; fetches a dead news feed and then a small backup file; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Today's money news in plain English, simplified for mums: <article title> <link>", "share_moment": "On each article card, after 'Read simplified version'", "recommendation": "Retire — the scanner behind it is offline and the content is six months old. If news returns, publish it on the main website or Instagram, not inside the games site.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The live feed (ifm-news-agency.vercel.app/api/news) returns 'DEPLOYMENT_NOT_FOUND', and the 'Open the newsroom' button links to the same dead address. Remove the screen, or the link at least.", "id": "classic-news-agency--1"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "It says 'Daily Digest' while every article is dated 2026-05-04, two are near-duplicates ('Save Tax and Grow Money'), and most show no source. Stale news hurts trust more than no news.", "id": "classic-news-agency--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "'Copy for WhatsApp' does nothing: the page fills its article list through a different path than the one the copy button reads, so it always finds no article. Fix this if the screen survives.", "id": "classic-news-agency--3"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The public panel reads 'Admin only · scans, mummifies and files to Google Drive', internal wording visitors shouldn't see. Hide it from public visitors.", "id": "classic-news-agency--4"}], "key": "classic-news-agency"}, {"slug": "classic-retirement-beta", "title": "Retirement Planner (beta)", "url": "https://games.investingformummies.com/classic?open=beta", "file": "classic.html (#beta)", "kind": "solo", "audience": "Mummies", "verdict": "A React rebuild of the Retirement Planner with a nice per-investment step-up field. It is a second retirement planner, it breaks on phones, and it compiles in the browser.", "load": "45 KB frame + React + Babel compiling in the browser; the classic hub page (3.1 MB, about 0.9 MB compressed) loads all 11 calculator frames and the 190 KB chat bot at once, whichever one you open", "share_idea": "Same as Retirement Planner: 'I'm X% funded for retirement at 60; ₹Y a month closes the gap' <link>", "share_moment": "Under the funded-percentage bar", "recommendation": "Merge with Retirement Planner — two retirement planners confuse people; move the beta's per-investment 'step-up' field and 'income replacement %' into the main planner, then retire this.", "items": [{"area": "Mobile", "priority": "High", "effort": "S", "text": "On a phone it keeps its two-column layout, so the right column (Expenses, Current investments) runs off the screen and the 'Retire at' box shows '6' instead of '60'. This settles which version to keep.", "id": "classic-retirement-beta--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The header badge overlaps its own text ('MU CLASSROOM' printed over 'INVESTING FOR MUMMIES'), and the outer 'Beta Tools' banner plus the inner banner fill the first phone screen.", "id": "classic-retirement-beta--2"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Worth keeping in the main planner: a step-up % per investment and the 'income replacement %' figure. Move both over before retiring this screen.", "id": "classic-retirement-beta--3"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "It loads React and the Babel compiler only to show a form the main planner already shows without them.", "id": "classic-retirement-beta--4"}], "key": "classic-retirement-beta"}]}]}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('audit-data').textContent);
