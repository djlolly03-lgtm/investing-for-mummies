swer (or the wording) so the game doesn't contradict itself and doesn't steer a retiree into mid-caps.", "id": "radhas-mission--3"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The very first question is a 3-step NAV calculation with odd numbers (₹850, 40 units) typed into boxes; start with an easy confidence-builder (the SIP or Regular-vs-Direct question) and move the maths to the middle.", "id": "radhas-mission--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The points don't add up: question 2 can give at most 18 (labelled 20) and question 5 gives 16 (labelled 15), so the advertised 120 is impossible; correct the labels or the scoring.", "id": "radhas-mission--5"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The number boxes use small text, so iPhones zoom the whole page in when you tap them; make the answer boxes at least 16px text and bring up the number keypad.", "id": "radhas-mission--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "When a question is answered the next one unlocks quietly below without scrolling; scroll to it (as other games do) so phone players know to continue.", "id": "radhas-mission--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Amisha' appears in questions 4 and 6 with no introduction, and the intro's daughter, goal and ₹2 lakh bonus are never used; introduce Amisha as Radha's friend/adviser in the intro and use the ₹2 lakh in at least one question.", "id": "radhas-mission--8"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The ELSS answer says 'save income tax this year'; add 'under the old tax regime', because under the new regime 80C does not apply and many mums are now on it.", "id": "radhas-mission--9"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Question 3 contains its own answer ('invest a fixed amount every month automatically is called… SIP'); make it a real scenario so it's worth 10 points.", "id": "radhas-mission--10"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "Remove the Chart.js library it loads but never uses (~200 KB).", "id": "radhas-mission--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On 'Mission Complete!' add 'Radha learned this in an IFM batch — find yours →' linking to register.investingformummies.com; it fits the story perfectly.", "id": "radhas-mission--12"}], "key": "radhas-mission"}, {"slug": "three-investors", "title": "The Three Investors", "url": "https://games.investingformummies.com/three-investors", "file": "three-investors.html", "kind": "solo", "audience": "Mummies", "verdict": "A dramatic, well-told comparison of SIP vs lump sum vs market timing with a nice ranked reveal. What holds it back: the player never makes a decision — 'your' strategy is picked at random and auto-played — and 1 time in 5 the random pick wins and the game congratulates you for timing the market.", "load": "124 KB page + Chart.js (~200 KB); fast", "share_idea": "Already has a WhatsApp button but it links to the www homepage; change it to: 'I tried to time the market against a steady SIP over 12 years 📉📈 — SIP still won (₹21 L vs my ₹16 L). Think you can beat it? 👉 games.investingformummies.com/three-investors'", "share_moment": "Big Reveal screen, directly under the three ranked result cards.", "items": [{"area": "Game design", "priority": "High", "effort": "L", "text": "Let the player actually be the market timer: show each year's price move and let her tap 'Invest ₹1L / ₹2L / ₹4L' or 'Wait', then compare her result with the SIP and lump-sum friends — right now she just watches a random preset and is labelled 'You'.", "id": "three-investors--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "One of the five random presets ('The Brave Buyer') wins with ₹29.5 L and the message says 'You timed the market perfectly'; until the player makes real choices, remove that preset or present it clearly as 'what a lucky hindsight timer would have got'.", "id": "three-investors--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The WhatsApp share sends people to the www homepage instead of this game, so friends never land on it; link to games.investingformummies.com/three-investors and include the player's result.", "id": "three-investors--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The year-by-year autoplay scrolls the page for you every second for about 15 seconds, fighting the player's thumb; let her step through with a 'Next year' button (or only auto-scroll if she hasn't touched the screen).", "id": "three-investors--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The lesson implies SIP always beats a lump sum, but here that only happens because the market crashes right after year 1; add one honest line ('in a steadily rising market the lump sum usually wins — SIP wins on discipline and peace of mind').", "id": "three-investors--5"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "On a phone each result card is about 250px tall so the three cards fill more than a screen; show them as a compact side-by-side row or a single ranked list so the comparison is visible at a glance.", "id": "three-investors--6"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero text sits off-centre to the right because space is reserved for a logo that never appears; remove that left padding or add the logo.", "id": "three-investors--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the lesson box add 'Want a SIP plan you can stick to? Find your batch →' linking to register.investingformummies.com.", "id": "three-investors--8"}], "key": "three-investors"}, {"slug": "inflation-calculator", "title": "Inflation Calculator", "url": "https://games.investingformummies.com/inflation-calculator", "file": "inflation-calculator.html", "kind": "tool", "audience": "Mummies", "verdict": "Three genuinely useful views (future monthly expense, buying power, corpus needed) with clean result cards on desktop. What holds it back: it is slow because the phone has to download and run a 2.8 MB code translator before anything appears, and on a phone the layout is broken — the amount box is 28px wide and the tabs are cut off.", "load": "347 KB page (only about a fifth is this calculator; the rest is code for three retired apps) + React + Babel in-browser compiler (2.8 MB unpacked, ~1 MB download) that must run before the tool shows; mobile Lighthouse 34", "share_idea": "'My ₹40,000 monthly household budget will be ₹71,600 in 10 years at 6% inflation 😳 Check yours: 👉 games.investingformummies.com/inflation-calculator'", "share_moment": "Under the big result number in each tab (e.g. 'In year 10 your monthly expense will be ₹17,908').", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "Why it scores 34: the calculator is hidden inside a frame that only starts after the page loads, then downloads React plus the Babel translator and converts the code on the phone before showing anything; pre-build it once into plain JavaScript (as planned for the other Babel games) so it appears almost instantly.", "id": "inflation-calculator--1"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "About 270 KB of the page is leftover code and styles for other apps (Investopia, Lifestyle Time Machine, 3 Buckets styles) that this page never shows; delete it so the page is a fraction of its size.", "id": "inflation-calculator--2"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 375px phone the ₹ amount box is only 28px wide so '10,000' is invisible, the third tab ('Corpus Calculator') and 'yrs → 2036' are cut off, and the page has 28px side margins inside another padded box; stack the controls full-width and shrink the tab labels on phones.", "id": "inflation-calculator--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "'Total corpus required' simply adds up every future year's expenses and assumes the money earns nothing while you draw it down, which overstates what a mum needs; either add an assumed return (with the assumption shown) or rename it 'Total you will spend over N years'.", "id": "inflation-calculator--4"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The tip 'Equity mutual funds averaging 12–14% p.a. are one of India's most powerful inflation hedges' states returns as fact; reword to 'equity has historically returned more than inflation over long periods (not guaranteed)'.", "id": "inflation-calculator--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Start with a familiar example: the code already has a 'basket' of everyday items (coffee, petrol, onions, rice) that is never shown; use it ('your ₹60 kilo of rice will cost ₹107 in 10 years') — it lands harder than percentages.", "id": "inflation-calculator--6"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The hero labels it 'Resource' and sits off-centre with space reserved for a missing logo; centre it and give it the same look as the game heroes so it feels part of the set.", "id": "inflation-calculator--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The 'Rule of 72' box actually shows an exact calculation, not the rule; call it 'Your money's buying power halves in…' so beginners aren't confused by the label.", "id": "inflation-calculator--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the 'To beat inflation' box add 'Want a plan that beats inflation? Find your batch →' linking to register.investingformummies.com — this is the most natural lead-in of all the tools.", "id": "inflation-calculator--9"}], "key": "inflation-calculator"}]}, {"group": "solo-b", "games": [{"slug": "wheel-of-gold", "title": "Wheel of Gold", "url": "https://games.investingformummies.com/wheel-of-gold", "file": "wheel-of-gold.html", "kind": "solo", "audience": "Mummies", "verdict": "Beautiful gold-medallion wheel and clear one-line explanations after every answer. What holds it back: it's heavy to load, cramped on phones, and the content has no Indian (rupee) angle and never says how mums should actually hold gold.", "load": "145 KB page (33 KB zipped) plus about 2.1 MB of logo PNGs: 1.1 MB on open (white and black logos, one of them for a hidden Silver screen) and the 1 MB round logo when you press Start. About 150 KB of wheel art, plus an extra font (Cinzel).", "share_idea": "\"I called 7 out of 8 gold price moves on Wheel of Gold 🪙 Does gold go up or down when the rupee falls? Try it: games.investingformummies.com/wheel-of-gold\"", "share_moment": "On the final screen, right under the score ring (before the badges)", "items": [{"area": "Speed", "priority": "High", "effort": "S", "text": "Replace the three full-size logo PNGs (about 550 KB and 1 MB each) with small web-sized versions of about 20 KB, and drop the logo that only exists for the hidden Silver screen. The page would open several times faster on mobile data.", "id": "wheel-of-gold--1"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the wheel shrinks to about 220 px. The Up/Down wax seals get squeezed into 58 px strips with roughly 9 px captions, and the scenario text is crammed inside the wheel. On phones, show the scenario as a card under the wheel and put two big full-width 'Gold goes UP' / 'Gold goes DOWN' buttons beneath it.", "id": "wheel-of-gold--2"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The Up/Down choices are pictures of seals with no words on them (the tiny caption sits underneath). Put 'UP' and 'DOWN' in large text on the buttons themselves so nobody has to guess which seal is which.", "id": "wheel-of-gold--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Every spin takes 6.5 seconds and the result is random anyway, so a player spends about 50 seconds just waiting over 8 rounds. Shorten the spin to about 3 seconds and let a tap skip it.", "id": "wheel-of-gold--4"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "Add the India angle. For a mum buying in rupees, a weaker rupee, import-duty changes and wedding/festival-season demand move gold prices as much as the dollar does. Add cards like 'Rupee falls against the dollar' and 'Government cuts import duty on gold'.", "id": "wheel-of-gold--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Two answers are taught as firm rules that recent years broke. Gold rose to records in 2024–25 while stocks were also at all-time highs, and central banks have been big gold BUYERS, not sellers. Add 'usually' to the explanations and swap 'Central banks sell gold' for 'Central banks buy record amounts of gold'.", "id": "wheel-of-gold--6"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "It's the same 8 cards every time, and once you learn 'bad news = gold up' you score 8/8 on the second try. Build a pool of 15–20 cards (including a few trick cards) and draw 8 at random so replays still teach something.", "id": "wheel-of-gold--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The ending doesn't connect to what mums actually do with gold. Add a takeaway comparing jewellery (making charges, purity, GST, resale cut) with paper/digital ways of owning gold in general terms, without naming any product. The 'Jewellery is not an investment' insight currently sits only on the Silver page.", "id": "wheel-of-gold--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The final screen shows correct answers, accuracy % and points, and points are just correct × 10, so that's three ways of saying the same thing. Show one score plus the best streak, and use the space for the takeaway.", "id": "wheel-of-gold--9"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The lowest-score message says 'Come back after reviewing the material!' but there is no material to review. Replace it with something warm like 'Spin again — you'll spot the pattern fast'.", "id": "wheel-of-gold--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the insight box, add one gentle line, for example 'Gold is one of the three buckets we unpack in the IFM workshop — see upcoming batches', linking to register.investingformummies.com.", "id": "wheel-of-gold--11"}], "key": "wheel-of-gold"}, {"slug": "wheel-of-silver", "title": "Wheel of Silver", "url": "https://games.investingformummies.com/wheel-of-silver", "file": "wheel-of-silver.html", "kind": "solo", "audience": "Mummies", "verdict": "Same polished wheel as Gold, with a good 'double life' angle (silver is both a precious and an industrial metal). But the page skips its own intro and drops players straight into the wheel, so that hook is never explained, and the phone layout is cramped.", "load": "141 KB page plus about 2.1 MB of logo PNGs, all loaded on open because the game auto-starts (white 543 KB, black 556 KB for a hidden screen, round logo 1 MB)", "share_idea": "\"Silver has a double life 🥈 Jewellery AND solar panels. I scored 6/8 predicting its price on Wheel of Silver. Can you beat me? games.investingformummies.com/wheel-of-silver\"", "share_moment": "On the final screen under the score ring", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The page jumps straight into the spinning wheel with no 'How it works' and no explanation of silver's 'double life' (precious metal + industrial metal), which is the whole lesson. The silver intro card already exists in the page but is never shown, so show it first.", "id": "wheel-of-silver--1"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "About 2 MB of logo images load the moment the page opens, including a 1 MB round logo for the middle of the wheel and a logo for a hidden screen. On the phone screenshot the wheel centre was still blank while it loaded. Use small web-sized logos.", "id": "wheel-of-silver--2"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The 'SPIN THE WHEEL' button is white text on light grey, which is very low contrast and hard to read outdoors on a phone. Use navy text or a darker silver button.", "id": "wheel-of-silver--3"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a 390 px phone the wheel is only about 180 px wide with unlabelled emoji icons, the Up/Down buttons are 64 px strips with roughly 10 px labels, and the '8' round marker wraps alone onto a second line. Use full-width Up/Down buttons under the wheel, smaller round markers, and a bigger wheel.", "id": "wheel-of-silver--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Each spin takes 6.5 seconds of waiting, about 50 seconds per game. Cut it to about 3 seconds and allow tap-to-skip.", "id": "wheel-of-silver--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Add the points mums most need about silver: its price swings much more than gold's (it isn't just 'cheap gold'), and a weaker rupee pushes the Indian price up. Add a card or two on each.", "id": "wheel-of-silver--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The end insight 'Jewellery is NOT an investment!' feels like a scolding. Rephrase it kindly with the reason (making charges, purity, resale cut) and mention in general terms that there are other ways to own silver, without naming products.", "id": "wheel-of-silver--7"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Same 8 cards every play. Add a larger pool and draw 8 so a second play isn't a memory test.", "id": "wheel-of-silver--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the insight, add a soft link: 'Where do gold and silver fit in a family plan? We cover it in the IFM workshop — see batches' → register.investingformummies.com.", "id": "wheel-of-silver--9"}], "key": "wheel-of-silver"}, {"slug": "reit-or-real", "title": "REIT or Real?", "url": "https://games.investingformummies.com/reit-or-real", "file": "reit-or-real.html", "kind": "solo", "audience": "Mummies", "verdict": "A quick, clear 2-minute True/False with genuinely useful facts (rental yield is only 2–3%). It names two real REITs in a way that reads like a recommendation, it's one-sided against owning property, and the text is very small on phones.", "load": "123 KB page, no images or libraries. Fast, though most of the page is styling for other games.", "share_idea": "\"Myth or fact: a ₹1 crore flat earns 8–10% rent a year? 🏠 I busted 7/8 property myths on REIT or Real? — try it: games.investingformummies.com/reit-or-real\"", "share_moment": "On the final screen, right under the score bar (before the question recap)", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "Q1's answer says 'Embassy REIT and Mindspace REIT are popular options in India'. From an unregistered educator that reads like a recommendation. Remove the names, or say 'India has a handful of listed REITs that own office parks and malls'.", "id": "reit-or-real--1"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Soften the promises. Q3 calls REITs 'reliable income-generating investments' and Q8 says you can sell 'instantly at market price'. Payouts can go down, unit prices can fall, and some REITs trade thinly, so say so in one line.", "id": "reit-or-real--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Q3 says REITs pay 90% 'as dividends'. In reality the payout is a mix of dividend, interest and part-repayment, and each is taxed differently, which is something mums will run into. Reword to 'distribute at least 90% of their cash to unitholders'.", "id": "reit-or-real--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "All 8 answers point the same way: REIT good, property bad. Mums who own or dream of a home may feel lectured. Add 2–3 balanced statements where property has a real point (security of your own home, a loan lets you buy something bigger) and one where REITs disappoint (unit prices fall in market crashes).", "id": "reit-or-real--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The questions come in the same order every time, so the answer pattern is fixed. Shuffle the order and, ideally, draw 8 from a pool of 12–15 so replays are worth it.", "id": "reit-or-real--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The word REIT isn't explained until after the first answer, and the intro shows 'Direct RE'. Add one plain line on the start screen ('A REIT lets you own a small slice of big office buildings and malls through the stock market') and write 'Buying a flat' instead of 'Direct RE'.", "id": "reit-or-real--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Q1 says 'You need ₹50 Lakhs or more to invest in commercial real estate' and the answer is False, which only holds if REITs count. Reword to 'to earn rent from offices or malls', and change 'from as low as ₹500' to 'the price of one unit — a few hundred rupees'.", "id": "reit-or-real--7"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Most reading text is tiny on phones: explanations about 13 px, takeaways about 12 px, the disclaimer about 11 px. Raise the body text to at least 15–16 px so mums don't have to pinch-zoom.", "id": "reit-or-real--8"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The score bar during the game shows an empty grey circle on the left where a logo was meant to go (the image has no picture set). Add the small logo or remove the circle.", "id": "reit-or-real--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The orange banner and purple takeaway cards are off-brand, and on phones the banner text sits off-centre because space is reserved for a logo that isn't there. Switch to navy/teal/gold and centre the banner text.", "id": "reit-or-real--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the Key Takeaways, add 'Property, REITs, gold, mutual funds — we compare them side by side in the IFM workshop. See batches' → register.investingformummies.com.", "id": "reit-or-real--11"}], "key": "reit-or-real"}, {"slug": "debt-detective", "title": "Debt Detective", "url": "https://games.investingformummies.com/debt-detective", "file": "debt-detective.html", "kind": "solo", "audience": "Mummies", "verdict": "A great core idea: 'you are the lender, so who's borrowing your money?'. The reveal card (borrower, risk, liquidity) is excellent. But each product's description gives the answer away, and it leaves out the products mums actually get confused by.", "load": "134 KB page, no images or libraries; fast", "share_idea": "\"When you open an FD, who are you actually lending to? 🕵️ I spotted 7/8 borrowers on Debt Detective — try it: games.investingformummies.com/debt-detective\"", "share_moment": "On the final screen, right under the 'x/8 borrowers spotted' number", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "The small description under each product gives the answer away ('government savings scheme', 'issued by individual state governments', 'deposit with a bank', 'issued by a company'), so it's reading, not detecting. Hide those giveaway words until the reveal.", "id": "debt-detective--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add the products where the detective twist really lives: a company/NBFC fixed deposit (the borrower is a company, not a bank, and it is NOT covered by the ₹5 lakh deposit insurance), a small-finance-bank FD, Post Office schemes (NSC, Senior Citizens' scheme, Monthly Income), and a debt mutual fund (many borrowers at once).", "id": "debt-detective--2"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "The SSY card says it 'matures when the girl turns 21'. It actually matures 21 years after the account is opened. Fix it, because parents plan around this date.", "id": "debt-detective--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "PPF 7.1% and SSY 8.2% are shown as fixed facts, but the government resets these rates every quarter. Add 'rate as of Oct–Dec 2026, revised quarterly'. Also change 'zero default risk' to 'practically no default risk', and drop 'AA+ equivalent' for state loans (they aren't rated).", "id": "debt-detective--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "A 30-second timer bar counts down and then just says 'Take your time'. It adds stress and does nothing. Remove it, or make it an optional 'speed round'.", "id": "debt-detective--5"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "The key question 'Who is borrowing your money?' is about 10 px text, and the reveal text is 11–12 px. Make the question the biggest text on the card and raise all reading text to at least 15 px.", "id": "debt-detective--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Replace jargon with plain words: 'Sovereign' → 'Backed by the Government of India', 'Liquidity' → 'How fast can you get your money back?', drop 'NDS-OM', 'fiscal deficit' and 'EEE' (or explain EEE as 'tax-free going in, growing and coming out').", "id": "debt-detective--7"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The four borrower tiles aren't real buttons, so they can't be reached with a keyboard or read out properly by a screen reader. Make them proper buttons.", "id": "debt-detective--8"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The score shows '0/0' before the first answer, and the score bar has an empty grey logo circle on the left. Start at '0 of 8' and add or remove the logo.", "id": "debt-detective--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "Pink, purple and orange product colours are off-brand. Use the navy/teal/gold palette (for example, teal for government, navy for banks, gold for companies) so colour itself teaches the safety ladder.", "id": "debt-detective--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After 'The Big Picture', add 'Want to know which of these suits your family's goals? That's Session 2 of the IFM workshop — see batches' → register.investingformummies.com.", "id": "debt-detective--11"}], "key": "debt-detective"}, {"slug": "debt-boss", "title": "Debt Boss", "url": "https://games.investingformummies.com/debt-boss", "file": "debt-boss.html", "kind": "solo", "audience": "Mummies", "verdict": "The richest debt lesson on the site: a rate shock, a default and inflation each hit a ₹10 lakh portfolio differently, with a nice real-vs-nominal ending. Pinch-zoom works. But the score ignores your portfolio, tax (the biggest mum lesson) isn't counted, and one takeaway contradicts what the player just saw.", "load": "201 KB page plus React and Babel (about 650 KB zipped, 3 MB unzipped) that compile the game on the phone each visit. About 1.5 MB of logos are used inside the game.", "share_idea": "\"My ₹10 lakh survived a rate hike, a company default and inflation — and ended at ₹X (worth ₹Y in today's money). Can your mix do better? games.investingformummies.com/debt-boss\"", "share_moment": "On the results screen, right under the Nominal / Real totals", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "The score only counts the four quiz answers (25 points each). Your allocation, which is the whole game, doesn't affect it, so a player who lost lakhs can still be crowned 'Debt Master!'. Score the portfolio too, for example 'beat inflation?' and 'beat a plain FD?'.", "id": "debt-boss--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Returns are shown before tax even though each card says 'Tax-Free' or 'Taxable'. In the game a 7.5% FD beats 7.1% PPF, but for someone in the 30% bracket the FD is only about 5.25%. Add a simple 'my tax slab' choice and show after-tax results, which is the most useful debt lesson for working mums.", "id": "debt-boss--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The inflation pop-up's takeaway says 'Only Corporate Bonds meaningfully beat inflation', moments after the player watched corporate bonds lose about 35% in the default. That contradicts the lesson and nudges people toward risky bonds. The same list also shows a 'Gold Bond' that isn't in the game and leaves out Debt MF.", "id": "debt-boss--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The allocation screen starts pre-filled to exactly ₹10 lakh, so a player can press 'Simulate' without making a single decision. Start with everything unplaced and ask them to choose.", "id": "debt-boss--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The four events are always the same, in the same order, so the 'best' mix can be memorised. Shuffle the order and occasionally swap in a 'rate cut' year (when bonds do well) so no single answer always wins.", "id": "debt-boss--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Debt MF is labelled 'LTCG' (the long-term gains tax treatment). Since April 2023, gains on debt funds are taxed at your normal slab rate, with no long-term benefit. Fix the label.", "id": "debt-boss--6"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "Add an 'as of' date to the rates (PPF 7.1%, SSY 8.2%, FD 7.5%), because they change. Also state the inflation assumption clearly: results use 7% for all four years, but the game only mentions inflation (7.5%) in Year 4.", "id": "debt-boss--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Fix three slips: 'Your class has ₹10,00,000' (it's a solo game, so say 'You have'), the 'Balanced Borrower' profile (the player is the lender), and the mix of 'Rs' and '₹' on the results screen.", "id": "debt-boss--8"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "The 'what is this instrument?' explanations only appear when a mouse hovers over a card, so phone users never see them. Add a tap-able ⓘ. The event pop-up text is also 9–11 px on phones; raise it to at least 14 px.", "id": "debt-boss--9"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The title appears twice on open: the page banner 'Debt Boss' and then another 'Debt Boss' card. This pushes 'Start Allocating' well below the fold on phones, so keep one.", "id": "debt-boss--10"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "The game is translated into runnable code inside the visitor's phone every visit (Babel, about 600 KB). On slow phones mums see 'Loading Debt Boss… Connecting to CDN'. Pre-build it once so it opens instantly.", "id": "debt-boss--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The results already end on 'long-term wealth needs growth assets beyond debt'. Follow it with 'That's exactly what we build in the IFM workshop — see batches', linking to register.investingformummies.com, above the Play Again button.", "id": "debt-boss--12"}], "key": "debt-boss"}, {"slug": "cap-climber", "title": "Cap Climber", "url": "https://games.investingformummies.com/cap-climber", "file": "cap-climber.html", "kind": "solo", "audience": "Mummies", "verdict": "Fast and simple, but several answers are out of date or wrong, and with only a company name and 6 seconds it's guesswork, not learning. It needs a clue to reason from.", "load": "121 KB page, no images or libraries; fast", "share_idea": "\"Is Asian Paints a large, mid or small cap? 🏔️ I scored 80/100 on Cap Climber — beat me: games.investingformummies.com/cap-climber\"", "share_moment": "On the final screen, right under the 'x / 100' score", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Several answers look wrong or out of date. Hindustan Zinc (worth about ₹2 lakh crore) is a Large cap, not Mid. Jubilant FoodWorks and MCX have recently sat in the Mid-cap band, not Small. MCX's fact says 'smaller than NSE', but NSE isn't even listed. Check all 10 against AMFI's latest half-yearly list and show 'as of <month year>' on screen.", "id": "cap-climber--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "With only a company name and 6 seconds, players can only guess. Show a clue, such as the company's total value in ₹ crore or 'bigger or smaller than Asian Paints?', so they learn that 'cap' simply means size.", "id": "cap-climber--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Market cap' is never explained. Add one line on the start screen: 'Market cap = what the whole company is worth on the stock market (share price × number of shares)'. Also drop trader jargon in the facts ('telecom play', 'QSR', 'consumer discretionary').", "id": "cap-climber--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The end lesson promises too much: 'Large caps are stable wealth preservers', 'small caps can be multi-baggers', 'A diversified portfolio holds all three!'. Rephrase neutrally, for example 'large companies have usually swung less; small ones can rise or fall much more'.", "id": "cap-climber--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "After each answer the explanation (about 11 px text) disappears after 2 seconds, which is too fast to read on a phone. Add a 'Next' button and bigger text.", "id": "cap-climber--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Same 10 companies in the same order every time (the three easy Large caps come first). Shuffle the order and draw from a bigger pool of 20–25 well-known brands mums buy from.", "id": "cap-climber--6"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The 6-second timer can't be turned off, which is stressful for first-timers. Offer a 'relaxed mode' without the clock.", "id": "cap-climber--7"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The final list shows the right answers but not what the player picked. Show 'You said Mid · Actually Large' so mistakes stick.", "id": "cap-climber--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The bright blue banner and purple 'Small cap' colour are off-brand, and on phones the banner text is pushed off-centre by space reserved for a missing logo. Use brand colours and centre the text.", "id": "cap-climber--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the lesson, add: 'Large, mid or small — which fits your goals? We explain simply in the IFM workshop — see batches' → register.investingformummies.com.", "id": "cap-climber--10"}], "key": "cap-climber"}, {"slug": "market-pulse", "title": "Market Pulse", "url": "https://games.investingformummies.com/market-pulse", "file": "market-pulse.html", "kind": "solo", "audience": "Mummies", "verdict": "Exciting 'predict the reaction' format with great lessons (priced in, splits change nothing, pledges are red flags). But it pretends to be a LIVE NSE feed, attaches invented events to real companies, never stops growing the page, overflows on phones, and is the heaviest page in this group.", "load": "187 KB page plus the React DEVELOPMENT build and Babel: about 920 KB zipped, 4.3 MB unzipped, compiled on the phone. It also re-draws every second forever.", "share_idea": "\"I called 7/10 market reactions — including the one where GOOD news made a stock fall 📉 Try Market Pulse: games.investingformummies.com/market-pulse\"", "share_moment": "On the summary screen, right under the Hits / Misses / Accuracy boxes", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "The game looks like a live market feed. It shows a red 'LIVE' badge, 'NSE · BSE · INTRADAY', 'SESSION OPEN', a real-time IST clock, moving prices and a boot log saying 'connecting to NSE feed … OK'. Under SEBI's 2025 rule unregistered educators may only use market data at least 3 months old, so this look invites the wrong reading. Relabel it 'Replay of past market moments' and show the month and year on every event. None of the events are from the last 3 months (the newest is early 2025), so this is about how it looks.", "id": "market-pulse--1"}, {"area": "Compliance", "priority": "High", "effort": "M", "text": "The hero says 'Real headlines', but several events look invented and are attached to real company names: an abrupt HDFC Bank CEO resignation, a 78% promoter pledge at Paytm, a TCS guidance cut, a ₹26,000 crore L&T export order, a 1:10 Bajaj Finance split. Either use genuine past events with dates, or anonymise them ('a large private bank').", "id": "market-pulse--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The page keeps getting taller by itself. Measured on a phone, it grew from 1,201 px to 1,801 px in 15 seconds and never stops, leaving a huge empty dark band (the start card floats far down the page on desktop). The game frame should only resize when the screen changes.", "id": "market-pulse--3"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "At phone width the start card and top bar run off the right edge, and the 'ENTER TRADING FLOOR' button is cut off. Make the terminal fit 390 px: stack the top bar and shrink the start card.", "id": "market-pulse--4"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "It loads React's large DEVELOPMENT version (meant only for programmers testing) plus Babel, which compiles the game on the phone. That's about 920 KB to download and several seconds of phone work, the main reason for the score of 56. Pre-build it with the small production version.", "id": "market-pulse--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The Fed rate-cut event marks a +3.4% move as 'Sharp rise', but the game's own buttons say sharp means '+5% or more'. Players who follow the rules get marked wrong. Change the answer to 'Slight rise'.", "id": "market-pulse--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The circuit-breaker flash says 'TRADING HALTED · 20% LIMIT BREACHED' on moves of +12% and −18%. Also, big F&O stocks like Adani Enterprises and L&T don't have fixed circuit limits, so this teaches a wrong rule. Match the wording to the actual move and pick a stock where a circuit really applies.", "id": "market-pulse--7"}, {"area": "Accessibility", "priority": "High", "effort": "S", "text": "The pandemic event flashes the whole screen red about 5 times a second for 2.5 seconds, which is a seizure risk (the safe limit is 3 flashes a second). Remove the strobe. Klaxon and alarm sounds also play with no mute button, so add one: many mums play in public or at night.", "id": "market-pulse--8"}, {"area": "Copy", "priority": "High", "effort": "M", "text": "The language is written for traders: 'read the tape', 'breadth', 'rotation', 'front-running', 're-rates', 'bps', 'P/E', 'FII', 'F8 BUY · F9 SELL'. Add a one-line plain-English 'What this means for you' to each reveal, and remove the fake BUY/SELL key hints (they do nothing and suggest trading).", "id": "market-pulse--9"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "The neon black terminal in Inter/JetBrains fonts feels like a different company and uses 10–12 px labels. Bring it onto the brand: navy background, Nunito/Lora, teal for up, and a muted red for down. Keep the drama but make it readable.", "id": "market-pulse--10"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The summary gives only a rank ('Fresh Intern' … 'Portfolio Manager'). Add the three lessons the player just met, for example 'markets react to surprises, not news', 'if everyone expects it, it's priced in' and 'a low share price isn't cheap', so the payoff is learning, not a job title.", "id": "market-pulse--11"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The start-up text log skips the 'NSE feed' line and repeats 'loading circuit thresholds' twice (visible on the desktop screenshot). Minor, but it looks broken.", "id": "market-pulse--12"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the summary, add 'Don't try to predict the market — learn how to invest through it. See IFM workshop batches' → register.investingformummies.com.", "id": "market-pulse--13"}], "key": "market-pulse"}, {"slug": "ipo-bonanza", "title": "IPO Bonanza", "url": "https://games.investingformummies.com/ipo-bonanza", "file": "ipo-bonanza.html", "kind": "solo", "audience": "Mummies", "verdict": "An impressively thorough walk through the real Zomato IPO, from the red-flag hunt and annotated newspaper notice to the lottery and listing. But leftover text from an older fictional company ('NEXAFIN', 30-share lots, December dates) contradicts the case, and it always ends in a big listing-day profit.", "load": "245 KB page plus React (no fixed version) and Babel: about 700 KB zipped, 3.3 MB unzipped, compiled on the phone", "share_idea": "\"I read Zomato's IPO papers, spotted the red flags and bid in the lottery — and got rated 'Prudent Bidder' 📊 Would you have applied? games.investingformummies.com/ipo-bonanza\"", "share_moment": "On the Final Report, right under the investor persona and XP", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Leftover text from an older made-up company shows on screen and contradicts the Zomato case: 'ISSUE LIVE · NEXAFIN', 'Blocked for NEXAFIN' and '× NEXAFIN' shares, '1 LOT ALLOTTED · 30 SHARES' and 'lottery in lots of 30' (Zomato's lot was 195), December dates in the money timeline (the IPO was July 2021), '₹25 SPREAD' (the band was ₹72–76), and registrar 'KFinTech' (the notice correctly says Link Intime). Clean them all up.", "id": "ipo-bonanza--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The 'Allocation buckets' panel and the final recap say QIB 50% · HNI 15% · Retail 35%, but the newspaper notice in the same game correctly says 75% / 15% / 10% for Zomato, because it was loss-making. Show Zomato's split and mention that 35% retail is the usual case.", "id": "ipo-bonanza--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The banner promises 'decide if you'd invest', but there's no way to NOT apply: after the red-flag hunt you must bid. Add an 'Apply or Skip?' choice and reward a well-reasoned skip as well. Deciding whether to apply at all is the real lesson for mums.", "id": "ipo-bonanza--3"}, {"area": "Compliance", "priority": "High", "effort": "M", "text": "Listing day is fixed as a +50–66% jump, with confetti and a 'Five-Figure Flex' badge for making ₹10,000+. Everyone who gets shares profits, which teaches 'IPO = quick money' even though the text says about 40% list at a loss. Randomly draw a second real case that flopped (e.g. a 2021 fintech IPO that listed −27%) and replace the 'flex' badge with one for good decisions.", "id": "ipo-bonanza--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The chance of winning shares at cut-off is set to 32%, but the game's own explanation says about 1 in 7 (7.45× retail demand). Align the odds with what you teach.", "id": "ipo-bonanza--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "'↻ NEW IPO · NEXT COMPANY' just reloads the same Zomato case, and three 'SOON' cards on the start screen promise modes that don't exist. Rename the button 'Play again' and hide the 'SOON' cards until they're built.", "id": "ipo-bonanza--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Tone and jargon: 'Pray for allotment', 'Greater Fool' and 'Hype-pilled' may put mums off, and QIB, NII, ASBA, DRHP, GMP and cut-off come thick and fast. Add a small tap-to-open glossary, warm up the persona names, and say 'Savings account' instead of the American 'Chequing'.", "id": "ipo-bonanza--7"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "'BID AT CUT-OFF — Recommended for retail' and 'retail almost always wins by selecting cut-off' read like advice. Rephrase as 'Most retail investors choose cut-off because…'.", "id": "ipo-bonanza--8"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "On phones the dark terminal style uses 10–12 px labels, a cramped top bar and a giant headline that fills the first screen. Raise the smallest text to 13–14 px, simplify the top bar, and shift towards brand colours/fonts.", "id": "ipo-bonanza--9"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "Babel (about 650 KB) compiles the game on the phone, and React is loaded without a fixed version (it can silently change and break the game). Pre-build it and pin the version.", "id": "ipo-bonanza--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Add a note that Zomato is now called Eternal (renamed in 2025), so mums who look it up aren't confused.", "id": "ipo-bonanza--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On the Final Report, add 'IPOs are exciting — but they're one small slice of a family plan. See IFM workshop batches' → register.investingformummies.com.", "id": "ipo-bonanza--12"}], "key": "ipo-bonanza"}, {"slug": "my-first-trade", "title": "My First Trade", "url": "https://games.investingformummies.com/my-first-trade", "file": "my-first-trade.html", "kind": "solo", "audience": "Mummies", "verdict": "A friendly, well-built 5-round journey that makes dividends, splits, bonuses, buybacks and rights issues feel concrete, and it's the most on-brand of the stock games. But it's sold as 'real market history' when many prices and dates are invented, the split maths contradicts its own lesson, and a 'go back in time' button can be exploited.", "load": "216 KB page plus React and Babel (about 650 KB zipped, 3 MB unzipped) compiled on the phone, plus the 1 MB round logo", "share_idea": "\"I turned ₹2 lakh into ₹X over 9 years in My First Trade 📈 (and learned what a bonus share is). Beat my portfolio: games.investingformummies.com/my-first-trade\"", "share_moment": "On the results screen, right under 'Total Return' (next to the index-fund comparison, once added)", "items": [{"area": "Compliance", "priority": "High", "effort": "M", "text": "It promises '9 years of real market history', but many prices and events don't match reality. DMart and Dixon weren't listed until 2017 yet can be bought in 2016. Zomato's IPO is placed in 2020 (it was July 2021). The Titan 1:5 split in 2018 and Trent 1:1 bonus in 2023 don't match the record. 'Dixon gave 100×' comes from a made-up ₹160 starting price. Use true prices and dates, or say clearly 'inspired by real events — prices simplified'.", "id": "my-first-trade--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The '← Go back to <earlier year> — sell holdings' button lets players travel back a round. Dividends, splits and bonuses then apply a second time, and you can trade with hindsight, which breaks the result. Remove time travel, or reset the round properly.", "id": "my-first-trade--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The Titan split gives you 5× the shares, but the price only drops from ₹420 to ₹180, so your holding more than doubles. That's right next to a lesson saying 'the total value stays the same'. Set the post-split price to one-fifth so the maths matches the lesson.", "id": "my-first-trade--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The Zomato IPO always gives you about 32% of what you applied for (at least one lot). For retail investors a popular IPO is a lottery for one lot, which is exactly what IPO Bonanza teaches. Make the two games agree.", "id": "my-first-trade--4"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The ending celebrates lucky stock picks ('Dixon gave 100×'). Add a comparison: 'If you'd simply put ₹2 lakh into a Nifty 50 index fund in 2016, you'd have about ₹X today (assumption: index returns 2016–2025, before tax)'. That's the real IFM takeaway for mums.", "id": "my-first-trade--5"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The IPO banner uses fear-of-missing-out language: '🔥 LIVE', 'First-Ever IPO Opportunity', 'Close soon', 'Apply now!'. Tone it down to a neutral 'Zomato IPO — would you apply?'.", "id": "my-first-trade--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Buyback: instant profit' and 'Rights issue — exclusive to you!' oversell. Add that only part of your shares may be accepted in a buyback, and that skipping a rights issue shrinks your share of the company.", "id": "my-first-trade--7"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "Many labels are 0.48–0.58 rem (about 8–9 px), including the KPI labels (Cash/Holdings/Net Worth) and the IPO tiles. These are unreadable for many mums, so raise them to at least 12–13 px.", "id": "my-first-trade--8"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The game's name appears three times on open: the page banner, the game's own header, and the welcome card. The header's logo circle is also empty while a 1 MB logo loads. Keep one title and use a small logo.", "id": "my-first-trade--9"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "The game is compiled on the visitor's phone by Babel (about 600 KB) every visit. Pre-build it so it opens instantly from WhatsApp links.", "id": "my-first-trade--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under 'The Big Lesson', add 'Ready to do this for real, calmly? Join an IFM workshop batch' → register.investingformummies.com, above Play Again.", "id": "my-first-trade--11"}], "key": "my-first-trade"}]}, {"group": "solo-c", "games": [{"slug": "money-map", "title": "Money Map", "url": "https://games.investingformummies.com/money-map", "file": "teen-budget.html", "kind": "tool", "audience": "Gen Next", "verdict": "A bright, phone-friendly allowance tracker with nice live feedback (the shaking balance, the coloured split bar). What holds it back: it opens with no title or explanation, it quietly changes numbers teens type, and its existing share button sends friends to a page that no longer exists.", "load": "44 KB page + Google font; fast. Only the saved-report page pulls the logo from the old ifm-deploy address.", "share_idea": "\"I saved ₹[saved] out of my ₹[income] this month 🫙 — that's ₹[yearly] by next year. Map your money in 1 minute: games.investingformummies.com/money-map\"", "share_moment": "Under the savings insight card, once income and at least one spend are filled in (replace the current generic 'Share with friends' button).", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The 'Share with friends' button sends people to www.investingformummies.com/moneymap, which now shows a 'page not found' error — point it at games.investingformummies.com/money-map so every share actually lands on the game.", "id": "money-map--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The page starts straight on 'Money in' tiles with no title, no goal and no one-line instruction — add a small header ('Money Map: where does your pocket money really go?') and a 3-step hint so a teen arriving from WhatsApp knows what to do in the first second.", "id": "money-map--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The hint under the balance says 'Add your money below 👇' but the money-in boxes are above it — change it to 'above 👆' (the very first frame already says 'above', then it flips to the wrong arrow).", "id": "money-map--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "When a teen types more spending than they have, the number they typed is silently cut down (only a quick red flash) — instead let them overspend, show the balance go red with 'BROKE 🚨', and explain why; going broke is the lesson, and right now that message can almost never appear.", "id": "money-map--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The insight cards talk in percentages ('62% spent · 8% saved', 'the 50/30/20 rule') — for first-timers lead with rupees ('You saved ₹200 of your ₹2,500') and explain 50/30/20 in plain words or drop it.", "id": "money-map--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a tiny 'challenge' layer so it feels like a game, not a form — e.g. a 'Can you save ₹500 this month?' target with a badge when the savings jar hits it, or a sample 'Riya's month' to fix.", "id": "money-map--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "In the saved PDF the first box is labelled 'Allowance' but shows total income (allowance + parents + job) — relabel it 'Money in'.", "id": "money-map--7"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The saved PDF loads the IFM logo from the old ifm-deploy.vercel.app address — switch it to the games site so the report doesn't break if that old address goes away.", "id": "money-map--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "On a laptop or projector the tiles stretch edge-to-edge across the whole 1440px screen — cap the page at about 480px wide and centre it so it looks like the phone app it is.", "id": "money-map--9"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Many labels are 9–11px (stat labels, insight text, section headings at 30% white) — bump them to at least 12–13px and raise the contrast so they're readable on a cheap phone in daylight.", "id": "money-map--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The footer disclaimer talks about 'Illustrative returns' but this tool shows no returns — use a line that fits ('Just a practice tracker — your numbers stay on your phone').", "id": "money-map--11"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "After the insights, add a soft line for parents ('Want your teen to learn this properly? See our Gen Next batches') linking to register.investingformummies.com.", "id": "money-map--12"}], "key": "money-map"}, {"slug": "lifestyle-time-machine", "title": "Lifestyle Time Machine", "url": "https://games.investingformummies.com/lifestyle-time-machine", "file": "lifestyle-time-machine.html", "kind": "classroom", "audience": "Gen Next", "verdict": "A genuinely fun pass-the-laptop class game — the 'Japan Trip → Lonavala Weekend' downgrade gag lands the inflation lesson beautifully. What holds it back: the budget says ₹25L on screen but the game uses ₹15L, and the payoff round (where savers buy back their dreams) is built but unreachable, so the game ends on 'for now' instead of the investing punchline.", "load": "92 KB page + 1 MB hero image (ltm-hero.png) + 11 meme sound clips (~350 KB, loaded on demand); first screen is heavy on mobile data.", "share_idea": "\"Inflation turned my Japan trip into a Lonavala weekend 😭 — play the Lifestyle Time Machine and see what 10 years does to your dreams: games.investingformummies.com/lifestyle-time-machine\"", "share_moment": "On the final scoreboard (after Round 4, once it's reachable), next to Play Again — and a teacher-friendly 'share with parents' variant on the Round 3 summary.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The budget is inconsistent: the game actually gives everyone ₹15L, but the screen says 'Total budget: ₹25L', 'Remove items until you're within ₹25L', and Round 4 says 'everyone had the same ₹25L' — pick one number and use it everywhere so students' maths adds up.", "id": "lifestyle-time-machine--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Round 4 (the investor reveal and buy-back round) is fully built but nothing on screen leads to it — Round 3 ends with 'That's the end — for now' and only Play Again. Add a 'Round 4 — The Payoff →' button so the class actually sees savers win; that is the whole point of the game.", "id": "lifestyle-time-machine--2"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "Students are never told how fast prices rise — the banner just says 'Prices have gone up'. Add one plain line per round ('Prices rose about 7% a year, so a ₹1L trip now costs ₹1.4L') so inflation is explained, not just felt.", "id": "lifestyle-time-machine--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Round 4 grows savings at 14% a year ('grew to 4×') — label it clearly as an assumption ('if invested in a fund that averaged 14% a year — real returns go up and down and are not guaranteed') and consider a more cautious 10–12%.", "id": "lifestyle-time-machine--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Words like 'corpus', 'purchasing power' and '14% × 10 yrs' appear in Round 4 — swap for teen language ('your savings pot', 'what your money can buy', 'growing about 14% a year for 10 years').", "id": "lifestyle-time-machine--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The 6-student cap on the setup screen is too small for a real class — allow up to ~12 names (or team names) on the setup screen rather than relying on the hidden mid-game '+ Add student' prompt.", "id": "lifestyle-time-machine--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The setup screen is pre-filled with six sample names (Maya, Sofía…) that teachers must delete one by one — show them as grey placeholders instead so the teacher just types.", "id": "lifestyle-time-machine--7"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The red pulsing 'OVER' badge is pinned to the top-left and pulses forever while a student is over budget — on a phone or small laptop it covers item cards; place it inside the budget bar and stop the endless pulse after a few seconds.", "id": "lifestyle-time-machine--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Round 3 skips the big 'your turn' name card that Rounds 1 and 2 show between students — add it back so the class always knows whose turn it is on the projector.", "id": "lifestyle-time-machine--9"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Typo: 'Lonawala Weekend' should be 'Lonavala Weekend'.", "id": "lifestyle-time-machine--10"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The 1 MB background picture on the first screen slows the start on school Wi-Fi and phones, and on a phone only a thin strip of it peeks out above the names card — compress it to under 150 KB or hide it on small screens.", "id": "lifestyle-time-machine--11"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "Several sound effects are well-known meme/brand clips (Mario coin, Among Us) — swap for royalty-free equivalents so a public IFM page doesn't carry copyrighted audio, and double-check the fart sound suits school sessions.", "id": "lifestyle-time-machine--12"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Round 3's 'We'll come back to this story when we talk about compounding' is a perfect bridge — link it to the Gen Next batch page at register.investingformummies.com for teachers and parents.", "id": "lifestyle-time-machine--13"}], "key": "lifestyle-time-machine"}, {"slug": "need-want-value", "title": "Need. Want. Value.", "url": "https://games.investingformummies.com/need-want-value", "file": "nwv.html", "kind": "solo", "audience": "Gen Next", "verdict": "A quick, well-written sorting game with great 'discuss' prompts and honest 'it can be both' answers. What holds it back: some items are judged on a price the player never sees, so fair answers get marked wrong, and with only 11 fixed items there's little reason to play twice.", "load": "29 KB page + Google font; very fast.", "share_idea": "\"I scored 8/11 on Need. Want. Value. 🛡️✨📈 — is therapy a NEED or a VALUE? Argue with me: games.investingformummies.com/need-want-value\"", "share_moment": "Results screen, directly under the score and before the recap list.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Items like 'Sneakers' are marked WANT-only, yet the explanation says 'footwear is a NEED — but a ₹15,000 limited drop is a WANT'. Put the detail on the card itself ('₹15,000 limited-drop sneakers', '₹1.2L gaming laptop') — the empty hint line under each item is already there for it — so players aren't marked wrong for a fair answer.", "id": "need-want-value--1"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Only 11 items, the same every game — add a pool of 25–30 everyday Indian-teen items (Zomato order, coaching class, bike EMI, Spotify, concert ticket, phone recharge) and draw 10 per round so replays feel fresh.", "id": "need-want-value--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Tuition / Uni' will confuse Indian teens — 'tuition' means coaching classes here and 'Uni' is British; use 'College fees' (and maybe a separate 'Coaching classes' card).", "id": "need-want-value--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Explanations use money jargon ('compounds like interest', 'pays dividends') — replace with plain words ('pays you back for years').", "id": "need-want-value--4"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Swap less-relatable examples for Indian ones — the '₹600 açaí bowl' discuss prompt could be '₹400 café cold coffee'; 'trade qualification vs degree' could be 'diploma vs degree'.", "id": "need-want-value--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The results screen gives a score but no takeaway — add a one-line personal insight ('You called most things NEEDs — try the 30-day wait test before your next buy') so the money lesson sticks.", "id": "need-want-value--6"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Add a little juice when you answer — a quick card flip or colour burst for 'Nailed it' and a gentle shake for 'Not quite' — it's currently a static text panel.", "id": "need-want-value--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The footer disclaimer mentions 'Illustrative returns' but the game shows none — use a disclaimer that fits a spending game.", "id": "need-want-value--8"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Add a soft line on the results screen for parents/teachers ('Run this with your class or teen batch → register.investingformummies.com').", "id": "need-want-value--9"}], "key": "need-want-value"}, {"slug": "swipe-right-sip", "title": "Swipe Right on SIP", "url": "https://games.investingformummies.com/swipe-right-sip", "file": "swipe-right-sip.html", "kind": "solo", "audience": "Gen Next", "verdict": "The strongest Gen Next game in this group: a sharp, funny Tinder-style feed with tap-to-explain jargon chips, real red-flag lessons and a satisfying 'boring genius vs hype victim' finish. What holds it back: tiny text, a running money total that jumps around confusingly, and the made-up fund returns aren't labelled as assumptions.", "load": "47 KB page + 3 Google fonts; fast.", "share_idea": "\"My ₹10,000 became ₹[corpus] and I dodged [x]/[y] red flags 🚩 — grade: [BORING GENIUS]. Can your feed fool you? games.investingformummies.com/swipe-right-sip\"", "share_moment": "Results screen — the existing 'Share your score' button is in the right place; just fix where its link points (see items).", "items": [{"area": "Bug", "priority": "Med", "effort": "S", "text": "The existing 'Share your score' text links to investingformummies.com (the homepage) instead of the game — use games.investingformummies.com/swipe-right-sip so friends land straight in the feed.", "id": "swipe-right-sip--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "During the reveal, 'YOUR MONEY SO FAR' starts low and jumps around (it counts unspent cash but leaves out picks not yet revealed), and its last value doesn't match the final score — show a simple running 'invested picks so far' total, or the full ₹10,000 picture from the first card.", "id": "swipe-right-sip--2"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Reveals say an index fund turned ₹2,000 into ₹3,600 in 5 years (about 12% a year) with no stated assumption — add a small line on the reveal screen ('Made-up results to show the idea; real funds go up and down and nothing is guaranteed').", "id": "swipe-right-sip--3"}, {"area": "Accessibility", "priority": "High", "effort": "S", "text": "Lots of text is 7–9px (stat labels, HUD labels, post footers, the 'drag the card' hint, bench labels) — raise the minimum to about 12px; first-timers on budget phones can't read it.", "id": "swipe-right-sip--4"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The background grid lines run straight through the big 'SWIPE RIGHT ON SIP' title, and the grey-on-green 'SWIPE' word is low-contrast — fade the grid behind headings and brighten the title so the first screen reads instantly.", "id": "swipe-right-sip--5"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The 'FLAGS DODGED' box in the top bar always shows '?' — either hide it until the reveal or call it 'Flags: revealed at the end' so it doesn't look broken.", "id": "swipe-right-sip--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Every post, including the honest low-like ones, is tagged 'sponsored · finance' — tag the hype posts 'sponsored' and the good ones something like 'friend' so the feed itself teaches 'sponsored = someone is paid'.", "id": "swipe-right-sip--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The intro strip says 'MF · 101' and 'STAKE ₹2K' — say 'Mutual funds 101' and 'Each swipe: ₹2,000' so the first screen has zero jargon.", "id": "swipe-right-sip--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "On the results screen, list the 1–2 red flags the player fell for with their tell ('Fake urgency: \"closes Friday\"') — the lesson is there per card but not summarised at the end.", "id": "swipe-right-sip--9"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Each new card adds another set of drag listeners to the whole page and never removes them — harmless now, but on long sessions it can make dragging feel laggy on older phones; clean them up when a card leaves.", "id": "swipe-right-sip--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After 'The lesson: good funds are boring', add one soft line — 'Want to learn the checklist properly? Find your batch' → register.investingformummies.com — this is the most natural sales moment in the Gen Next set.", "id": "swipe-right-sip--11"}], "key": "swipe-right-sip"}, {"slug": "asset-boss", "title": "Asset Boss", "url": "https://games.investingformummies.com/asset-boss", "file": "asset-boss.html", "kind": "classroom", "audience": "Both", "verdict": "A solid classroom flow — allocate ₹10L, discuss why, then live through a boom, crash and recovery — with good teacher prompts. What holds it back: it's the heaviest page in this group (in-browser code compiling plus a 1 MB logo), the market always plays out the same way so 'boring wins' is rigged, and the end is a dead stop with no replay.", "load": "148 KB page (about 100 KB of it unused styling) + React + Babel compiler (~1 MB, compiles the game in the browser) + 1 MB watermark PNG shown at 60px; slow on phones.", "share_idea": "\"I'm a 🎢 Risk Chaser — my ₹10L became ₹[final] after a boom, a crash and a recovery. What's your investor DNA? games.investingformummies.com/asset-boss\"", "share_moment": "Results screen, right under the 'Your Investor DNA' badge.", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "The game compiles its own code inside the visitor's browser (React + the Babel compiler) and loads a 1 MB logo just to sit in the middle of a small donut — pre-build the game once and use a 20 KB logo; phones will open it several seconds faster.", "id": "asset-boss--1"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "About 100 KB of leftover styling copied from the old main site is loaded but unused — strip it out.", "id": "asset-boss--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The three years are identical every time (boom, crash, small recovery), so 'Gold and FD beat stocks' is always the answer — add 2–3 different market stories (e.g. a long bull run where stocks win) picked at random, so the real lesson becomes 'spread your money because you can't know' rather than 'boring always wins'.", "id": "asset-boss--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "'That's why every portfolio needs some gold!' and the hard-coded 'Big Lesson' read as advice — soften to 'Many investors keep a little gold because it often holds up in crashes' and make clear the returns are made up for the game.", "id": "asset-boss--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The end (reflection screen) has no 'Play again' or 'Try a different mix' button — add one so players can test whether a different split would have done better.", "id": "asset-boss--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "On the results screen, show 2 comparison mixes (e.g. 'All FD' and 'Even split') next to the player's number so they can see how their choice stacked up.", "id": "asset-boss--6"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The + / − buttons are 32px and move ₹25,000 at a time, so filling ₹10L takes 40 taps — make the buttons 44px and add quick-fill chips (₹1L / ₹2.5L) or a slider.", "id": "asset-boss--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Solo visitors hit a 'Teacher Checkpoint — your class has locked in…' screen that makes no sense at home — reword it for both ('Playing at home? Tap Run the simulation') or skip it outside class mode.", "id": "asset-boss--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The Year 1 question ('which asset gave the highest return?') is answered by the table right above it — replace with a thinking question ('Would you move money into crypto now?').", "id": "asset-boss--9"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'REITs', 'asset classes' and 'not liquid' are unexplained for beginners — add a one-line plain meaning ('REITs: owning a slice of big buildings that pay rent').", "id": "asset-boss--10"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "The final 'You have completed Asset Boss!' card is a good moment for a soft 'Learn how to build your real mix → Find your batch' link to register.investingformummies.com.", "id": "asset-boss--11"}], "key": "asset-boss"}, {"slug": "short-squeeze", "title": "The Short Squeeze", "url": "https://games.investingformummies.com/short-squeeze", "file": "short-squeeze-sim.html", "kind": "solo", "audience": "Mummies", "verdict": "A clear, well-paced 5-scene explainer — the gold-bangles analogy and the hold-or-cut moment are excellent teaching. What holds it back: it presents a named real company and real hedge funds with specific prices as fact with no source, the quiz answers are all option B, and a couple of small bugs undercut the key 'you lost $7,500' moment.", "load": "53 KB page + 1 MB logo PNG in the header (shown at ~44px); the logo is most of the weight.", "share_idea": "\"I'd have lost $7,500 on a $1,000 bet 😱 — learn why a 'short squeeze' is the most dangerous trade in 5 quick scenes: games.investingformummies.com/short-squeeze\"", "share_moment": "Scene 5, after the quiz score and the '3 things to take away' card.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "The story names Avis, SRS Investment and Pentwater Capital with exact 2026 dates, ownership splits and prices — check every number against a news source and cite it ('Source: …, April 2026'), or clearly label the chart as 'simplified'. A wrong fact about named firms is a credibility and legal risk.", "id": "short-squeeze--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "All three quiz answers are option B — shuffle the correct positions so players can't guess the pattern.", "id": "short-squeeze--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "In Scene 3, losses are shown as '$1,000' in red with no minus sign — show '−$1,000' so the meaning doesn't rely on colour alone.", "id": "short-squeeze--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If you choose 'Hold', the text says the broker forced you out at $850 for a $7,500 loss, but the chart keeps playing down to $200 and the P&L box ends at only −$1,000 — stop the chart (or freeze the loss) at the forced exit so the screen matches the story.", "id": "short-squeeze--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "After you make the hold/cut decision once, going back to Scene 3 shows '▶ Play the squeeze' but the button only resets and never plays again — make it restart the animation.", "id": "short-squeeze--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Everything is in dollars and uses 'float', 'P&L', 'short interest', 'margin account' — add a one-line rupee translation at the start ('$100 ≈ ₹8,300') and plain meanings for those words for mums new to markets.", "id": "short-squeeze--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The header says '$100 to $850 in 3 weeks' but the timeline runs 20 March to 22 April (about 5 weeks) — make them agree.", "id": "short-squeeze--7"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "In 'The brutal asymmetry' chart the −$4,000 bar is drawn at 88% of the −$7,500 bar — size the bars in proportion so the picture tells the truth.", "id": "short-squeeze--8"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Replace the 1 MB header logo with a small (~20 KB) version — it's the single biggest thing slowing the first screen.", "id": "short-squeeze--9"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Bring it home for Indian investors — add a final card on 'Could this happen to me?' (Indian retail investors can't easily short; the real takeaway is 'don't chase a stock that's suddenly flying').", "id": "short-squeeze--10"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Takeaway 3 ('short selling is not for regular investors… long-term investing is kinder to your sleep') is a natural spot for 'Learn the calm way → Find your batch' linking to register.investingformummies.com.", "id": "short-squeeze--11"}], "key": "short-squeeze"}, {"slug": "market-madness-2", "title": "Market Madness 2", "url": "https://games.investingformummies.com/market-madness-2", "file": "mm2_content.html", "kind": "solo", "audience": "Mummies", "verdict": "A rich, on-brand trading sim with lovely emotional prompts ('did your stomach drop?') and three AI investors to race. What holds it back: it uses six real listed stocks, and the built-in 'Stock Picker' (60% Reliance, 40% HDFC Bank) beats the 'Safe whole-market' investor — so the game quietly contradicts its own lesson and looks like a stock tip.", "load": "65 KB page + Google fonts; fast, no heavy assets.", "share_idea": "\"I stayed calm through a crash and finished with ₹[final] from ₹10L — did you panic-sell? Race 3 investors through 6 market rounds: games.investingformummies.com/market-madness-2\"", "share_moment": "Final screen, under the 4-investor leaderboard and before 'Try Again'.", "items": [{"area": "Compliance", "priority": "High", "effort": "M", "text": "The game trades real companies (Reliance, HDFC Bank, Tata Power, Zomato, Suzlon, Yes Bank) with made-up price moves, and calls Yes Bank 'a bank that ran into trouble' — replace with fictional names (e.g. 'Bharat Mega Industries', 'Desi Delivery Co.') so nothing reads as a tip or a comment on a real company.", "id": "market-madness-2--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "With the fixed price moves, the 'Stock Picker' (two big companies) always finishes about +22% and beats the 'Safe' investor (+15%), yet the closing message says 'a simple, diversified approach usually beats clever trading' — rebalance the moves (or the Safe investor's mix) so the calm, spread-out investor actually wins, or change the lesson to match.", "id": "market-madness-2--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The 'Safe' investor is described as 'invests in the whole market' but actually buys equal amounts of six stocks including the two riskiest — call it 'Even Spreader' or make it behave like an index fund.", "id": "market-madness-2--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The Market / Limit / Stop Loss tabs in the buy and sell window change the description but do nothing to the trade — either make Stop Loss actually sell when the price falls, or label the tabs 'What these mean' so players aren't misled.", "id": "market-madness-2--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Players can make only one trade per round (one buy or one sell), so they can't build a spread-out portfolio like the AI 'Safe' investor — allow several buys per round, or add a one-tap 'buy a bit of everything' option.", "id": "market-madness-2--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Every replay has exactly the same price path, so the 'see if it was skill' invitation just rewards memory — add 2–3 alternative market stories picked at random.", "id": "market-madness-2--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'Bid / Ask', 'large/mid/small cap', 'rotation' and 'divergence' round titles are heavy for beginners — keep the plain sub-labels and drop or explain the jargon headings.", "id": "market-madness-2--7"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The investor commentaries for the last round ('Held to the end', 'Finished ahead. Boring and effective.') are written but never shown because the lists are one line too long — show them on the final screen.", "id": "market-madness-2--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The final 'In the stock market…' teaching card is the right place for a soft 'Ready to invest calmly for real? Find your batch' link to register.investingformummies.com.", "id": "market-madness-2--9"}], "key": "market-madness-2"}, {"slug": "slash-the-scam.html", "title": "Slash the Scam", "url": "https://games.investingformummies.com/slash-the-scam.html", "file": "slash-the-scam.html", "kind": "solo", "audience": "Mummies", "verdict": "The most polished arcade game here — rich art, sound, combos, hearts and a gentle speed curve make it genuinely fun on a phone. What holds it back: the lessons whizz past in a ticker mid-swipe and are never recapped, one 'good' item (diamonds) teaches a shaky money idea, and the logo loads from the old domain.", "load": "72 KB page + ~14 small game-icon PNGs + 1 MB logo from ifm-deploy.vercel.app; logo is the heaviest piece.", "share_idea": "\"I protected ₹[score] from scams in 75 seconds ✂️ — verdict: [SCAM-PROOF SUPERMOM]. Can you beat me? games.investingformummies.com/slash-the-scam.html\"", "share_moment": "End screen, right under the score and verdict, above 'Play again'.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The logo loads from ifm-deploy.vercel.app (and is a 1 MB file) — serve a small logo from the games site so it doesn't break or slow the game if the old address changes.", "id": "slash-the-scam-html--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The game already remembers up to 4 lessons you
