 a phone. Add a 'Next' button and bigger text.", "id": "cap-climber--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Same 10 companies in the same order every time (the three easy Large caps come first). Shuffle the order and draw from a bigger pool of 20–25 well-known brands mums buy from.", "id": "cap-climber--6"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "The 6-second timer can't be turned off, which is stressful for first-timers. Offer a 'relaxed mode' without the clock.", "id": "cap-climber--7"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The final list shows the right answers but not what the player picked. Show 'You said Mid · Actually Large' so mistakes stick.", "id": "cap-climber--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The bright blue banner and purple 'Small cap' colour are off-brand, and on phones the banner text is pushed off-centre by space reserved for a missing logo. Use brand colours and centre the text.", "id": "cap-climber--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After the lesson, add: 'Large, mid or small — which fits your goals? We explain simply in the IFM workshop — see batches' → register.investingformummies.com.", "id": "cap-climber--10"}], "key": "cap-climber"}, {"slug": "market-pulse", "title": "Market Pulse", "url": "https://games.investingformummies.com/market-pulse", "file": "market-pulse.html", "kind": "solo", "audience": "Mummies", "verdict": "Exciting 'predict the reaction' format with great lessons (priced in, splits change nothing, pledges are red flags). But it pretends to be a LIVE NSE feed, attaches invented events to real companies, never stops growing the page, overflows on phones, and is the heaviest page in this group.", "load": "187 KB page plus the React DEVELOPMENT build and Babel: about 920 KB zipped, 4.3 MB unzipped, compiled on the phone. It also re-draws every second forever.", "share_idea": "\"I called 7/10 market reactions — including the one where GOOD news made a stock fall 📉 Try Market Pulse: games.investingformummies.com/market-pulse\"", "share_moment": "On the summary screen, right under the Hits / Misses / Accuracy boxes", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "The game looks like a live market feed. It shows a red 'LIVE' badge, 'NSE · BSE · INTRADAY', 'SESSION OPEN', a real-time IST clock, moving prices and a boot log saying 'connecting to NSE feed … OK'. Under SEBI's 2025 rule unregistered educators may only use market data at least 3 months old, so this look invites the wrong reading. Relabel it 'Replay of past market moments' and show the month and year on every event. None of the events are from the last 3 months (the newest is early 2025), so this is about how it looks.", "id": "market-pulse--1"}, {"area": "Compliance", "priority": "High", "effort": "M", "text": "The hero says 'Real headlines', but several events look invented and are attached to real company names: an abrupt HDFC Bank CEO resignation, a 78% promoter pledge at Paytm, a TCS guidance cut, a ₹26,000 crore L&T export order, a 1:10 Bajaj Finance split. Either use genuine past events with dates, or anonymise them ('a large private bank').", "id": "market-pulse--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The page keeps getting taller by itself. Measured on a phone, it grew from 1,201 px to 1,801 px in 15 seconds and never stops, leaving a huge empty dark band (the start card floats far down the page on desktop). The game frame should only resize when the screen changes.", "id": "market-pulse--3"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "At phone width the start card and top bar run off the right edge, and the 'ENTER TRADING FLOOR' button is cut off. Make the terminal fit 390 px: stack the top bar and shrink the start card.", "id": "market-pulse--4"}, {"area": "Speed", "priority": "High", "effort": "M", "text": "It loads React's large DEVELOPMENT version (meant only for programmers testing) plus Babel, which compiles the game on the phone. That's about 920 KB to download and several seconds of phone work, the main reason for the score of 56. Pre-build it with the small production version.", "id": "market-pulse--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The Fed rate-cut event marks a +3.4% move as 'Sharp rise', but the game's own buttons say sharp means '+5% or more'. Players who follow the rules get marked wrong. Change the answer to 'Slight rise'.", "id": "market-pulse--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The circuit-breaker flash says 'TRADING HALTED · 20% LIMIT BREACHED' on moves of +12% and −18%. Also, big F&O stocks like Adani Enterprises and L&T don't have fixed circuit limits, so this teaches a wrong rule. Match the wording to the actual move and pick a stock where a circuit really applies.", "id": "market-pulse--7"}, {"area": "Accessibility", "priority": "High", "effort": "S", "text": "The pandemic event flashes the whole screen red about 5 times a second for 2.5 seconds, which is a seizure risk (the safe limit is 3 flashes a second). Remove the strobe. Klaxon and alarm sounds also play with no mute button, so add one: many mums play in public or at night.", "id": "market-pulse--8"}, {"area": "Copy", "priority": "High", "effort": "M", "text": "The language is written for traders: 'read the tape', 'breadth', 'rotation', 'front-running', 're-rates', 'bps', 'P/E', 'FII', 'F8 BUY · F9 SELL'. Add a one-line plain-English 'What this means for you' to each reveal, and remove the fake BUY/SELL key hints (they do nothing and suggest trading).", "id": "market-pulse--9"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "The neon black terminal in Inter/JetBrains fonts feels like a different company and uses 10–12 px labels. Bring it onto the brand: navy background, Nunito/Lora, teal for up, and a muted red for down. Keep the drama but make it readable.", "id": "market-pulse--10"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The summary gives only a rank ('Fresh Intern' … 'Portfolio Manager'). Add the three lessons the player just met, for example 'markets react to surprises, not news', 'if everyone expects it, it's priced in' and 'a low share price isn't cheap', so the payoff is learning, not a job title.", "id": "market-pulse--11"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The start-up text log skips the 'NSE feed' line and repeats 'loading circuit thresholds' twice (visible on the desktop screenshot). Minor, but it looks broken.", "id": "market-pulse--12"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the summary, add 'Don't try to predict the market — learn how to invest through it. See IFM workshop batches' → register.investingformummies.com.", "id": "market-pulse--13"}], "key": "market-pulse"}, {"slug": "ipo-bonanza", "title": "IPO Bonanza", "url": "https://games.investingformummies.com/ipo-bonanza", "file": "ipo-bonanza.html", "kind": "solo", "audience": "Mummies", "verdict": "An impressively thorough walk through the real Zomato IPO, from the red-flag hunt and annotated newspaper notice to the lottery and listing. But leftover text from an older fictional company ('NEXAFIN', 30-share lots, December dates) contradicts the case, and it always ends in a big listing-day profit.", "load": "245 KB page plus React (no fixed version) and Babel: about 700 KB zipped, 3.3 MB unzipped, compiled on the phone", "share_idea": "\"I read Zomato's IPO papers, spotted the red flags and bid in the lottery — and got rated 'Prudent Bidder' 📊 Would you have applied? games.investingformummies.com/ipo-bonanza\"", "share_moment": "On the Final Report, right under the investor persona and XP", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Leftover text from an older made-up company shows on screen and contradicts the Zomato case: 'ISSUE LIVE · NEXAFIN', 'Blocked for NEXAFIN' and '× NEXAFIN' shares, '1 LOT ALLOTTED · 30 SHARES' and 'lottery in lots of 30' (Zomato's lot was 195), December dates in the money timeline (the IPO was July 2021), '₹25 SPREAD' (the band was ₹72–76), and registrar 'KFinTech' (the notice correctly says Link Intime). Clean them all up.", "id": "ipo-bonanza--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The 'Allocation buckets' panel and the final recap say QIB 50% · HNI 15% · Retail 35%, but the newspaper notice in the same game correctly says 75% / 15% / 10% for Zomato, because it was loss-making. Show Zomato's split and mention that 35% retail is the usual case.", "id": "ipo-bonanza--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The banner promises 'decide if you'd invest', but there's no way to NOT apply: after the red-flag hunt you must bid. Add an 'Apply or Skip?' choice and reward a well-reasoned skip as well. Deciding whether to apply at all is the real lesson for mums.", "id": "ipo-bonanza--3"}, {"area": "Compliance", "priority": "High", "effort": "M", "text": "Listing day is fixed as a +50–66% jump, with confetti and a 'Five-Figure Flex' badge for making ₹10,000+. Everyone who gets shares profits, which teaches 'IPO = quick money' even though the text says about 40% list at a loss. Randomly draw a second real case that flopped (e.g. a 2021 fintech IPO that listed −27%) and replace the 'flex' badge with one for good decisions.", "id": "ipo-bonanza--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The chance of winning shares at cut-off is set to 32%, but the game's own explanation says about 1 in 7 (7.45× retail demand). Align the odds with what you teach.", "id": "ipo-bonanza--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "'↻ NEW IPO · NEXT COMPANY' just reloads the same Zomato case, and three 'SOON' cards on the start screen promise modes that don't exist. Rename the button 'Play again' and hide the 'SOON' cards until they're built.", "id": "ipo-bonanza--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Tone and jargon: 'Pray for allotment', 'Greater Fool' and 'Hype-pilled' may put mums off, and QIB, NII, ASBA, DRHP, GMP and cut-off come thick and fast. Add a small tap-to-open glossary, warm up the persona names, and say 'Savings account' instead of the American 'Chequing'.", "id": "ipo-bonanza--7"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "'BID AT CUT-OFF — Recommended for retail' and 'retail almost always wins by selecting cut-off' read like advice. Rephrase as 'Most retail investors choose cut-off because…'.", "id": "ipo-bonanza--8"}, {"area": "Mobile", "priority": "Med", "effort": "M", "text": "On phones the dark terminal style uses 10–12 px labels, a cramped top bar and a giant headline that fills the first screen. Raise the smallest text to 13–14 px, simplify the top bar, and shift towards brand colours/fonts.", "id": "ipo-bonanza--9"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "Babel (about 650 KB) compiles the game on the phone, and React is loaded without a fixed version (it can silently change and break the game). Pre-build it and pin the version.", "id": "ipo-bonanza--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Add a note that Zomato is now called Eternal (renamed in 2025), so mums who look it up aren't confused.", "id": "ipo-bonanza--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "On the Final Report, add 'IPOs are exciting — but they're one small slice of a family plan. See IFM workshop batches' → register.investingformummies.com.", "id": "ipo-bonanza--12"}], "key": "ipo-bonanza"}, {"slug": "my-first-trade", "title": "My First Trade", "url": "https://games.investingformummies.com/my-first-trade", "file": "my-first-trade.html", "kind": "solo", "audience": "Mummies", "verdict": "A friendly, well-built 5-round journey that makes dividends, splits, bonuses, buybacks and rights issues feel concrete, and it's the most on-brand of the stock games. But it's sold as 'real market history' when many prices and dates are invented, the split maths contradicts its own lesson, and a 'go back in time' button can be exploited.", "load": "216 KB page plus React and Babel (about 650 KB zipped, 3 MB unzipped) compiled on the phone, plus the 1 MB round logo", "share_idea": "\"I turned ₹2 lakh into ₹X over 9 years in My First Trade 📈 (and learned what a bonus share is). Beat my portfolio: games.investingformummies.com/my-first-trade\"", "share_moment": "On the results screen, right under 'Total Return' (next to the index-fund comparison, once added)", "items": [{"area": "Compliance", "priority": "High", "effort": "M", "text": "It promises '9 years of real market history', but many prices and events don't match reality. DMart and Dixon weren't listed until 2017 yet can be bought in 2016. Zomato's IPO is placed in 2020 (it was July 2021). The Titan 1:5 split in 2018 and Trent 1:1 bonus in 2023 don't match the record. 'Dixon gave 100×' comes from a made-up ₹160 starting price. Use true prices and dates, or say clearly 'inspired by real events — prices simplified'.", "id": "my-first-trade--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The '← Go back to <earlier year> — sell holdings' button lets players travel back a round. Dividends, splits and bonuses then apply a second time, and you can trade with hindsight, which breaks the result. Remove time travel, or reset the round properly.", "id": "my-first-trade--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The Titan split gives you 5× the shares, but the price only drops from ₹420 to ₹180, so your holding more than doubles. That's right next to a lesson saying 'the total value stays the same'. Set the post-split price to one-fifth so the maths matches the lesson.", "id": "my-first-trade--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The Zomato IPO always gives you about 32% of what you applied for (at least one lot). For retail investors a popular IPO is a lottery for one lot, which is exactly what IPO Bonanza teaches. Make the two games agree.", "id": "my-first-trade--4"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The ending celebrates lucky stock picks ('Dixon gave 100×'). Add a comparison: 'If you'd simply put ₹2 lakh into a Nifty 50 index fund in 2016, you'd have about ₹X today (assumption: index returns 2016–2025, before tax)'. That's the real IFM takeaway for mums.", "id": "my-first-trade--5"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The IPO banner uses fear-of-missing-out language: '🔥 LIVE', 'First-Ever IPO Opportunity', 'Close soon', 'Apply now!'. Tone it down to a neutral 'Zomato IPO — would you apply?'.", "id": "my-first-trade--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Buyback: instant profit' and 'Rights issue — exclusive to you!' oversell. Add that only part of your shares may be accepted in a buyback, and that skipping a rights issue shrinks your share of the company.", "id": "my-first-trade--7"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "Many labels are 0.48–0.58 rem (about 8–9 px), including the KPI labels (Cash/Holdings/Net Worth) and the IPO tiles. These are unreadable for many mums, so raise them to at least 12–13 px.", "id": "my-first-trade--8"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The game's name appears three times on open: the page banner, the game's own header, and the welcome card. The header's logo circle is also empty while a 1 MB logo loads. Keep one title and use a small logo.", "id": "my-first-trade--9"}, {"area": "Speed", "priority": "Med", "effort": "M", "text": "The game is compiled on the visitor's phone by Babel (about 600 KB) every visit. Pre-build it so it opens instantly from WhatsApp links.", "id": "my-first-trade--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under 'The Big Lesson', add 'Ready to do this for real, calmly? Join an IFM workshop batch' → register.investingformummies.com, above Play Again.", "id": "my-first-trade--11"}], "key": "my-first-trade"}]}, {"group": "solo-c", "games": [{"slug": "money-map", "title": "Money Map", "url": "https://games.investingformummies.com/money-map", "file": "teen-budget.html", "kind": "tool", "audience": "Gen Next", "verdict": "A bright, phone-friendly allowance tracker with nice live feedback (the shaking balance, the coloured split bar). What holds it back: it opens with no title or explanation, it quietly changes numbers teens type, and its existing share button sends friends to a page that no longer exists.", "load": "44 KB page + Google font; fast. Only the saved-report page pulls the logo from the old ifm-deploy address.", "share_idea": "\"I saved ₹[saved] out of my ₹[income] this month 🫙 — that's ₹[yearly] by next year. Map your money in 1 minute: games.investingformummies.com/money-map\"", "share_moment": "Under the savings insight card, once income and at least one spend are filled in (replace the current generic 'Share with friends' button).", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The 'Share with friends' button sends people to www.investingformummies.com/moneymap, which now shows a 'page not found' error — point it at games.investingformummies.com/money-map so every share actually lands on the game.", "id": "money-map--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The page starts straight on 'Money in' tiles with no title, no goal and no one-line instruction — add a small header ('Money Map: where does your pocket money really go?') and a 3-step hint so a teen arriving from WhatsApp knows what to do in the first second.", "id": "money-map--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The hint under the balance says 'Add your money below 👇' but the money-in boxes are above it — change it to 'above 👆' (the very first frame already says 'above', then it flips to the wrong arrow).", "id": "money-map--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "When a teen types more spending than they have, the number they typed is silently cut down (only a quick red flash) — instead let them overspend, show the balance go red with 'BROKE 🚨', and explain why; going broke is the lesson, and right now that message can almost never appear.", "id": "money-map--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The insight cards talk in percentages ('62% spent · 8% saved', 'the 50/30/20 rule') — for first-timers lead with rupees ('You saved ₹200 of your ₹2,500') and explain 50/30/20 in plain words or drop it.", "id": "money-map--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a tiny 'challenge' layer so it feels like a game, not a form — e.g. a 'Can you save ₹500 this month?' target with a badge when the savings jar hits it, or a sample 'Riya's month' to fix.", "id": "money-map--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "In the saved PDF the first box is labelled 'Allowance' but shows total income (allowance + parents + job) — relabel it 'Money in'.", "id": "money-map--7"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The saved PDF loads the IFM logo from the old ifm-deploy.vercel.app address — switch it to the games site so the report doesn't break if that old address goes away.", "id": "money-map--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "On a laptop or projector the tiles stretch edge-to-edge across the whole 1440px screen — cap the page at about 480px wide and centre it so it looks like the phone app it is.", "id": "money-map--9"}, {"area": "Accessibility", "priority": "Med", "effort": "S", "text": "Many labels are 9–11px (stat labels, insight text, section headings at 30% white) — bump them to at least 12–13px and raise the contrast so they're readable on a cheap phone in daylight.", "id": "money-map--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The footer disclaimer talks about 'Illustrative returns' but this tool shows no returns — use a line that fits ('Just a practice tracker — your numbers stay on your phone').", "id": "money-map--11"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "After the insights, add a soft line for parents ('Want your teen to learn this properly? See our Gen Next batches') linking to register.investingformummies.com.", "id": "money-map--12"}], "key": "money-map"}, {"slug": "lifestyle-time-machine", "title": "Lifestyle Time Machine", "url": "https://games.investingformummies.com/lifestyle-time-machine", "file": "lifestyle-time-machine.html", "kind": "classroom", "audience": "Gen Next", "verdict": "A genuinely fun pass-the-laptop class game — the 'Japan Trip → Lonavala Weekend' downgrade gag lands the inflation lesson beautifully. What holds it back: the budget says ₹25L on screen but the game uses ₹15L, and the payoff round (where savers buy back their dreams) is built but unreachable, so the game ends on 'for now' instead of the investing punchline.", "load": "92 KB page + 1 MB hero image (ltm-hero.png) + 11 meme sound clips (~350 KB, loaded on demand); first screen is heavy on mobile data.", "share_idea": "\"Inflation turned my Japan trip into a Lonavala weekend 😭 — play the Lifestyle Time Machine and see what 10 years does to your dreams: games.investingformummies.com/lifestyle-time-machine\"", "share_moment": "On the final scoreboard (after Round 4, once it's reachable), next to Play Again — and a teacher-friendly 'share with parents' variant on the Round 3 summary.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The budget is inconsistent: the game actually gives everyone ₹15L, but the screen says 'Total budget: ₹25L', 'Remove items until you're within ₹25L', and Round 4 says 'everyone had the same ₹25L' — pick one number and use it everywhere so students' maths adds up.", "id": "lifestyle-time-machine--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Round 4 (the investor reveal and buy-back round) is fully built but nothing on screen leads to it — Round 3 ends with 'That's the end — for now' and only Play Again. Add a 'Round 4 — The Payoff →' button so the class actually sees savers win; that is the whole point of the game.", "id": "lifestyle-time-machine--2"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "Students are never told how fast prices rise — the banner just says 'Prices have gone up'. Add one plain line per round ('Prices rose about 7% a year, so a ₹1L trip now costs ₹1.4L') so inflation is explained, not just felt.", "id": "lifestyle-time-machine--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Round 4 grows savings at 14% a year ('grew to 4×') — label it clearly as an assumption ('if invested in a fund that averaged 14% a year — real returns go up and down and are not guaranteed') and consider a more cautious 10–12%.", "id": "lifestyle-time-machine--4"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Words like 'corpus', 'purchasing power' and '14% × 10 yrs' appear in Round 4 — swap for teen language ('your savings pot', 'what your money can buy', 'growing about 14% a year for 10 years').", "id": "lifestyle-time-machine--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The 6-student cap on the setup screen is too small for a real class — allow up to ~12 names (or team names) on the setup screen rather than relying on the hidden mid-game '+ Add student' prompt.", "id": "lifestyle-time-machine--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The setup screen is pre-filled with six sample names (Maya, Sofía…) that teachers must delete one by one — show them as grey placeholders instead so the teacher just types.", "id": "lifestyle-time-machine--7"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The red pulsing 'OVER' badge is pinned to the top-left and pulses forever while a student is over budget — on a phone or small laptop it covers item cards; place it inside the budget bar and stop the endless pulse after a few seconds.", "id": "lifestyle-time-machine--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Round 3 skips the big 'your turn' name card that Rounds 1 and 2 show between students — add it back so the class always knows whose turn it is on the projector.", "id": "lifestyle-time-machine--9"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Typo: 'Lonawala Weekend' should be 'Lonavala Weekend'.", "id": "lifestyle-time-machine--10"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The 1 MB background picture on the first screen slows the start on school Wi-Fi and phones, and on a phone only a thin strip of it peeks out above the names card — compress it to under 150 KB or hide it on small screens.", "id": "lifestyle-time-machine--11"}, {"area": "Compliance", "priority": "Low", "effort": "S", "text": "Several sound effects are well-known meme/brand clips (Mario coin, Among Us) — swap for royalty-free equivalents so a public IFM page doesn't carry copyrighted audio, and double-check the fart sound suits school sessions.", "id": "lifestyle-time-machine--12"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Round 3's 'We'll come back to this story when we talk about compounding' is a perfect bridge — link it to the Gen Next batch page at register.investingformummies.com for teachers and parents.", "id": "lifestyle-time-machine--13"}], "key": "lifestyle-time-machine"}, {"slug": "need-want-value", "title": "Need. Want. Value.", "url": "https://games.investingformummies.com/need-want-value", "file": "nwv.html", "kind": "solo", "audience": "Gen Next", "verdict": "A quick, well-written sorting game with great 'discuss' prompts and honest 'it can be both' answers. What holds it back: some items are judged on a price the player never sees, so fair answers get marked wrong, and with only 11 fixed items there's little reason to play twice.", "load": "29 KB page + Google font; very fast.", "share_idea": "\"I scored 8/11 on Need. Want. Value. 🛡️✨📈 — is therapy a NEED or a VALUE? Argue with me: games.investingformummies.com/need-want-value\"", "share_moment": "Results screen, directly under the score and before the recap list.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Items like 'Sneakers' are marked WANT-only, yet the explanation says 'footwear is a NEED — but a ₹15,000 limited drop is a WANT'. Put the detail on the card itself ('₹15,000 limited-drop sneakers', '₹1.2L gaming laptop') — the empty hint line under each item is already there for it — so players aren't marked wrong for a fair answer.", "id": "need-want-value--1"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Only 11 items, the same every game — add a pool of 25–30 everyday Indian-teen items (Zomato order, coaching class, bike EMI, Spotify, concert ticket, phone recharge) and draw 10 per round so replays feel fresh.", "id": "need-want-value--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Tuition / Uni' will confuse Indian teens — 'tuition' means coaching classes here and 'Uni' is British; use 'College fees' (and maybe a separate 'Coaching classes' card).", "id": "need-want-value--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Explanations use money jargon ('compounds like interest', 'pays dividends') — replace with plain words ('pays you back for years').", "id": "need-want-value--4"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Swap less-relatable examples for Indian ones — the '₹600 açaí bowl' discuss prompt could be '₹400 café cold coffee'; 'trade qualification vs degree' could be 'diploma vs degree'.", "id": "need-want-value--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The results screen gives a score but no takeaway — add a one-line personal insight ('You called most things NEEDs — try the 30-day wait test before your next buy') so the money lesson sticks.", "id": "need-want-value--6"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Add a little juice when you answer — a quick card flip or colour burst for 'Nailed it' and a gentle shake for 'Not quite' — it's currently a static text panel.", "id": "need-want-value--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The footer disclaimer mentions 'Illustrative returns' but the game shows none — use a disclaimer that fits a spending game.", "id": "need-want-value--8"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Add a soft line on the results screen for parents/teachers ('Run this with your class or teen batch → register.investingformummies.com').", "id": "need-want-value--9"}], "key": "need-want-value"}, {"slug": "swipe-right-sip", "title": "Swipe Right on SIP", "url": "https://games.investingformummies.com/swipe-right-sip", "file": "swipe-right-sip.html", "kind": "solo", "audience": "Gen Next", "verdict": "The strongest Gen Next game in this group: a sharp, funny Tinder-style feed with tap-to-explain jargon chips, real red-flag lessons and a satisfying 'boring genius vs hype victim' finish. What holds it back: tiny text, a running money total that jumps around confusingly, and the made-up fund returns aren't labelled as assumptions.", "load": "47 KB page + 3 Google fonts; fast.", "share_idea": "\"My ₹10,000 became ₹[corpus] and I dodged [x]/[y] red flags 🚩 — grade: [BORING GENIUS]. Can your feed fool you? games.investingformummies.com/swipe-right-sip\"", "share_moment": "Results screen — the existing 'Share your score' button is in the right place; just fix where its link points (see items).", "items": [{"area": "Bug", "priority": "Med", "effort": "S", "text": "The existing 'Share your score' text links to investingformummies.com (the homepage) instead of the game — use games.investingformummies.com/swipe-right-sip so friends land straight in the feed.", "id": "swipe-right-sip--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "During the reveal, 'YOUR MONEY SO FAR' starts low and jumps around (it counts unspent cash but leaves out picks not yet revealed), and its last value doesn't match the final score — show a simple running 'invested picks so far' total, or the full ₹10,000 picture from the first card.", "id": "swipe-right-sip--2"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Reveals say an index fund turned ₹2,000 into ₹3,600 in 5 years (about 12% a year) with no stated assumption — add a small line on the reveal screen ('Made-up results to show the idea; real funds go up and down and nothing is guaranteed').", "id": "swipe-right-sip--3"}, {"area": "Accessibility", "priority": "High", "effort": "S", "text": "Lots of text is 7–9px (stat labels, HUD labels, post footers, the 'drag the card' hint, bench labels) — raise the minimum to about 12px; first-timers on budget phones can't read it.", "id": "swipe-right-sip--4"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The background grid lines run straight through the big 'SWIPE RIGHT ON SIP' title, and the grey-on-green 'SWIPE' word is low-contrast — fade the grid behind headings and brighten the title so the first screen reads instantly.", "id": "swipe-right-sip--5"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The 'FLAGS DODGED' box in the top bar always shows '?' — either hide it until the reveal or call it 'Flags: revealed at the end' so it doesn't look broken.", "id": "swipe-right-sip--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Every post, including the honest low-like ones, is tagged 'sponsored · finance' — tag the hype posts 'sponsored' and the good ones something like 'friend' so the feed itself teaches 'sponsored = someone is paid'.", "id": "swipe-right-sip--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The intro strip says 'MF · 101' and 'STAKE ₹2K' — say 'Mutual funds 101' and 'Each swipe: ₹2,000' so the first screen has zero jargon.", "id": "swipe-right-sip--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "On the results screen, list the 1–2 red flags the player fell for with their tell ('Fake urgency: \"closes Friday\"') — the lesson is there per card but not summarised at the end.", "id": "swipe-right-sip--9"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Each new card adds another set of drag listeners to the whole page and never removes them — harmless now, but on long sessions it can make dragging feel laggy on older phones; clean them up when a card leaves.", "id": "swipe-right-sip--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "After 'The lesson: good funds are boring', add one soft line — 'Want to learn the checklist properly? Find your batch' → register.investingformummies.com — this is the most natural sales moment in the Gen Next set.", "id": "swipe-right-sip--11"}], "key": "swipe-right-sip"}, {"slug": "asset-boss", "title": "Asset Boss", "url": "https://games.investingformummies.com/asset-boss", "file": "asset-boss.html", "kind": "classroom", "audience": "Both", "verdict": "A solid classroom flow — allocate ₹10L, discuss why, then live through a boom, crash and recovery — with good teacher prompts. What holds it back: it's the heaviest page in this group (in-browser code compiling plus a 1 MB logo), the market always plays out the same way so 'boring wins' is rigged, and the end is a dead stop with no replay.", "load": "148 KB page (about 100 KB of it unused styling) + React + Babel compiler (~1 MB, compiles the game in the browser) + 1 MB watermark PNG shown at 60px; slow on phones.", "share_idea": "\"I'm a 🎢 Risk Chaser — my ₹10L became ₹[final] after a boom, a crash and a recovery. What's your investor DNA? games.investingformummies.com/asset-boss\"", "share_moment": "Results screen, right under the 'Your Investor DNA' badge.", "items": [{"area": "Speed", "priority": "High", "effort": "M", "text": "The game compiles its own code inside the visitor's browser (React + the Babel compiler) and loads a 1 MB logo just to sit in the middle of a small donut — pre-build the game once and use a 20 KB logo; phones will open it several seconds faster.", "id": "asset-boss--1"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "About 100 KB of leftover styling copied from the old main site is loaded but unused — strip it out.", "id": "asset-boss--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The three years are identical every time (boom, crash, small recovery), so 'Gold and FD beat stocks' is always the answer — add 2–3 different market stories (e.g. a long bull run where stocks win) picked at random, so the real lesson becomes 'spread your money because you can't know' rather than 'boring always wins'.", "id": "asset-boss--3"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "'That's why every portfolio needs some gold!' and the hard-coded 'Big Lesson' read as advice — soften to 'Many investors keep a little gold because it often holds up in crashes' and make clear the returns are made up for the game.", "id": "asset-boss--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The end (reflection screen) has no 'Play again' or 'Try a different mix' button — add one so players can test whether a different split would have done better.", "id": "asset-boss--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "On the results screen, show 2 comparison mixes (e.g. 'All FD' and 'Even split') next to the player's number so they can see how their choice stacked up.", "id": "asset-boss--6"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The + / − buttons are 32px and move ₹25,000 at a time, so filling ₹10L takes 40 taps — make the buttons 44px and add quick-fill chips (₹1L / ₹2.5L) or a slider.", "id": "asset-boss--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Solo visitors hit a 'Teacher Checkpoint — your class has locked in…' screen that makes no sense at home — reword it for both ('Playing at home? Tap Run the simulation') or skip it outside class mode.", "id": "asset-boss--8"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The Year 1 question ('which asset gave the highest return?') is answered by the table right above it — replace with a thinking question ('Would you move money into crypto now?').", "id": "asset-boss--9"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'REITs', 'asset classes' and 'not liquid' are unexplained for beginners — add a one-line plain meaning ('REITs: owning a slice of big buildings that pay rent').", "id": "asset-boss--10"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "The final 'You have completed Asset Boss!' card is a good moment for a soft 'Learn how to build your real mix → Find your batch' link to register.investingformummies.com.", "id": "asset-boss--11"}], "key": "asset-boss"}, {"slug": "short-squeeze", "title": "The Short Squeeze", "url": "https://games.investingformummies.com/short-squeeze", "file": "short-squeeze-sim.html", "kind": "solo", "audience": "Mummies", "verdict": "A clear, well-paced 5-scene explainer — the gold-bangles analogy and the hold-or-cut moment are excellent teaching. What holds it back: it presents a named real company and real hedge funds with specific prices as fact with no source, the quiz answers are all option B, and a couple of small bugs undercut the key 'you lost $7,500' moment.", "load": "53 KB page + 1 MB logo PNG in the header (shown at ~44px); the logo is most of the weight.", "share_idea": "\"I'd have lost $7,500 on a $1,000 bet 😱 — learn why a 'short squeeze' is the most dangerous trade in 5 quick scenes: games.investingformummies.com/short-squeeze\"", "share_moment": "Scene 5, after the quiz score and the '3 things to take away' card.", "items": [{"area": "Compliance", "priority": "High", "effort": "S", "text": "The story names Avis, SRS Investment and Pentwater Capital with exact 2026 dates, ownership splits and prices — check every number against a news source and cite it ('Source: …, April 2026'), or clearly label the chart as 'simplified'. A wrong fact about named firms is a credibility and legal risk.", "id": "short-squeeze--1"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "All three quiz answers are option B — shuffle the correct positions so players can't guess the pattern.", "id": "short-squeeze--2"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "In Scene 3, losses are shown as '$1,000' in red with no minus sign — show '−$1,000' so the meaning doesn't rely on colour alone.", "id": "short-squeeze--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "If you choose 'Hold', the text says the broker forced you out at $850 for a $7,500 loss, but the chart keeps playing down to $200 and the P&L box ends at only −$1,000 — stop the chart (or freeze the loss) at the forced exit so the screen matches the story.", "id": "short-squeeze--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "After you make the hold/cut decision once, going back to Scene 3 shows '▶ Play the squeeze' but the button only resets and never plays again — make it restart the animation.", "id": "short-squeeze--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Everything is in dollars and uses 'float', 'P&L', 'short interest', 'margin account' — add a one-line rupee translation at the start ('$100 ≈ ₹8,300') and plain meanings for those words for mums new to markets.", "id": "short-squeeze--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The header says '$100 to $850 in 3 weeks' but the timeline runs 20 March to 22 April (about 5 weeks) — make them agree.", "id": "short-squeeze--7"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "In 'The brutal asymmetry' chart the −$4,000 bar is drawn at 88% of the −$7,500 bar — size the bars in proportion so the picture tells the truth.", "id": "short-squeeze--8"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Replace the 1 MB header logo with a small (~20 KB) version — it's the single biggest thing slowing the first screen.", "id": "short-squeeze--9"}, {"area": "Game design", "priority": "Low", "effort": "M", "text": "Bring it home for Indian investors — add a final card on 'Could this happen to me?' (Indian retail investors can't easily short; the real takeaway is 'don't chase a stock that's suddenly flying').", "id": "short-squeeze--10"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Takeaway 3 ('short selling is not for regular investors… long-term investing is kinder to your sleep') is a natural spot for 'Learn the calm way → Find your batch' linking to register.investingformummies.com.", "id": "short-squeeze--11"}], "key": "short-squeeze"}, {"slug": "market-madness-2", "title": "Market Madness 2", "url": "https://games.investingformummies.com/market-madness-2", "file": "mm2_content.html", "kind": "solo", "audience": "Mummies", "verdict": "A rich, on-brand trading sim with lovely emotional prompts ('did your stomach drop?') and three AI investors to race. What holds it back: it uses six real listed stocks, and the built-in 'Stock Picker' (60% Reliance, 40% HDFC Bank) beats the 'Safe whole-market' investor — so the game quietly contradicts its own lesson and looks like a stock tip.", "load": "65 KB page + Google fonts; fast, no heavy assets.", "share_idea": "\"I stayed calm through a crash and finished with ₹[final] from ₹10L — did you panic-sell? Race 3 investors through 6 market rounds: games.investingformummies.com/market-madness-2\"", "share_moment": "Final screen, under the 4-investor leaderboard and before 'Try Again'.", "items": [{"area": "Compliance", "priority": "High", "effort": "M", "text": "The game trades real companies (Reliance, HDFC Bank, Tata Power, Zomato, Suzlon, Yes Bank) with made-up price moves, and calls Yes Bank 'a bank that ran into trouble' — replace with fictional names (e.g. 'Bharat Mega Industries', 'Desi Delivery Co.') so nothing reads as a tip or a comment on a real company.", "id": "market-madness-2--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "With the fixed price moves, the 'Stock Picker' (two big companies) always finishes about +22% and beats the 'Safe' investor (+15%), yet the closing message says 'a simple, diversified approach usually beats clever trading' — rebalance the moves (or the Safe investor's mix) so the calm, spread-out investor actually wins, or change the lesson to match.", "id": "market-madness-2--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The 'Safe' investor is described as 'invests in the whole market' but actually buys equal amounts of six stocks including the two riskiest — call it 'Even Spreader' or make it behave like an index fund.", "id": "market-madness-2--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The Market / Limit / Stop Loss tabs in the buy and sell window change the description but do nothing to the trade — either make Stop Loss actually sell when the price falls, or label the tabs 'What these mean' so players aren't misled.", "id": "market-madness-2--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Players can make only one trade per round (one buy or one sell), so they can't build a spread-out portfolio like the AI 'Safe' investor — allow several buys per round, or add a one-tap 'buy a bit of everything' option.", "id": "market-madness-2--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Every replay has exactly the same price path, so the 'see if it was skill' invitation just rewards memory — add 2–3 alternative market stories picked at random.", "id": "market-madness-2--6"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'Bid / Ask', 'large/mid/small cap', 'rotation' and 'divergence' round titles are heavy for beginners — keep the plain sub-labels and drop or explain the jargon headings.", "id": "market-madness-2--7"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The investor commentaries for the last round ('Held to the end', 'Finished ahead. Boring and effective.') are written but never shown because the lists are one line too long — show them on the final screen.", "id": "market-madness-2--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The final 'In the stock market…' teaching card is the right place for a soft 'Ready to invest calmly for real? Find your batch' link to register.investingformummies.com.", "id": "market-madness-2--9"}], "key": "market-madness-2"}, {"slug": "slash-the-scam.html", "title": "Slash the Scam", "url": "https://games.investingformummies.com/slash-the-scam.html", "file": "slash-the-scam.html", "kind": "solo", "audience": "Mummies", "verdict": "The most polished arcade game here — rich art, sound, combos, hearts and a gentle speed curve make it genuinely fun on a phone. What holds it back: the lessons whizz past in a ticker mid-swipe and are never recapped, one 'good' item (diamonds) teaches a shaky money idea, and the logo loads from the old domain.", "load": "72 KB page + ~14 small game-icon PNGs + 1 MB logo from ifm-deploy.vercel.app; logo is the heaviest piece.", "share_idea": "\"I protected ₹[score] from scams in 75 seconds ✂️ — verdict: [SCAM-PROOF SUPERMOM]. Can you beat me? games.investingformummies.com/slash-the-scam.html\"", "share_moment": "End screen, right under the score and verdict, above 'Play again'.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The logo loads from ifm-deploy.vercel.app (and is a 1 MB file) — serve a small logo from the games site so it doesn't break or slow the game if the old address changes.", "id": "slash-the-scam-html--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "The game already remembers up to 4 lessons you met during play, but the end screen never shows them — add a 'What you learned' strip with those 3–4 scams and their one-line tell, since nobody can read the ticker while swiping.", "id": "slash-the-scam-html--2"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "'Diamonds — precious things hold their value for years' is shaky advice (diamonds usually resell for far less than you paid) — swap the diamond for something solid like 'SIP' or 'Term insurance', or reword it as 'family jewellery — don't panic-sell'.", "id": "slash-the-scam-html--3"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The opening ticker says 'Read the labels…' but the flying items have no labels (by design) — change it to 'Know the shapes: ✂️ slash the tricks, let the good ones land'.", "id": "slash-the-scam-html--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Before the first round, show the 8 symbols with their names for 2 seconds (e.g. 'top hat = magic money scheme') — first-time mums otherwise slash by colour and guesswork.", "id": "slash-the-scam-html--5"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Tapping 'End round' after a few seconds can award 'SCAM-PROOF SUPERMOM' and say 'protected from scams in 75 seconds' — give quitters a neutral verdict ('Round ended early').", "id": "slash-the-scam-html--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "This page has no Google Analytics tag (every other game has one) and no browser-tab icon — add both so its traffic shows up in the games report.", "id": "slash-the-scam-html--7"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "Losing a heart is signalled mostly by red flashes and sound — add a short vibration on phones and keep the 'X hearts left' banner, which helps players who play muted.", "id": "slash-the-scam-html--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under 'The lesson' on the end screen add a soft 'Learn to spot money traps with other mums → Find your batch' link to register.investingformummies.com.", "id": "slash-the-scam-html--9"}], "key": "slash-the-scam-html"}, {"slug": "fundgoal.html", "title": "Fund Your Goal", "url": "https://games.investingformummies.com/fundgoal.html", "file": "fundgoal.html", "kind": "tool", "audience": "Mummies", "verdict": "A genuinely useful goal planner — multi-goal, inflation-adjusted, with a 'cost of delay' view and PDF/WhatsApp export. What holds it back: the 12% return default isn't explained, the 'start today' message is garbled, and every share and PDF still advertises the old ifm-deploy.vercel.app address.", "load": "35 KB page + 1 MB logo from ifm-deploy.vercel.app; logo is most of the weight.", "share_idea": "\"To fund [Child's education] in [10] years I need ₹[SIP]/month — waiting just 1 year adds ₹[extra]/month 😳 Plan your goal free: games.investingformummies.com/fundgoal.html\"", "share_moment": "Under the 'Your Full Picture' totals, where the WhatsApp button already sits (fix its text/link).", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The WhatsApp message ends 'Plan yours free: ifm-deploy.vercel.app' and the PDF footer says the same — change both to games.investingformummies.com/fundgoal.html so every share brings people back to the right site.", "id": "fundgoal-html--1"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "'Expected return' defaults to 12% with no explanation — add a short note next to it ('12% is an assumption, roughly what equity funds have averaged over long periods; it can be lower and is not guaranteed') and show a safer 8% result alongside for comparison.", "id": "fundgoal-html--2"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The yellow 'Start today' banner reads 'Every year you delay costs you an extra ₹X — actually, waiting even 1 year means paying ₹Y more every month, forever' — the first number is meaningless and 'forever' is wrong; replace with one clear line: 'Waiting 1 year means ₹Y more every month until your goal.'", "id": "fundgoal-html--3"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'Corpus', 'SIP' and 'Lump sum' are never explained — add tiny helper text ('Corpus = total you'll need', 'SIP = a fixed amount invested every month').", "id": "fundgoal-html--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The summary table has four money columns that get cramped on a 390px phone — stack each goal as a small card on phones instead of a wide table.", "id": "fundgoal-html--5"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "Percentage boxes use a number-only keypad, so on iPhones you can't type '6.5%' — allow a decimal keypad for inflation and return.", "id": "fundgoal-html--6"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The 'All goals combined' totals are rebuilt from the rounded '₹12.34 L' text on screen, so they can be slightly off — add up the real numbers instead.", "id": "fundgoal-html--7"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "Header logo (and PDF logo) is the 1 MB watermark file from the old domain — swap for a small local logo.", "id": "fundgoal-html--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Once a goal has a monthly amount, add a gentle 'Want help picking where to put this ₹X/month? Find your batch' link to register.investingformummies.com — this is the highest-intent moment on the whole games site.", "id": "fundgoal-html--9"}], "key": "fundgoal-html"}, {"slug": "goal-tracker.html", "title": "Goal Tracker", "url": "https://games.investingformummies.com/goal-tracker.html", "file": "goal-tracker.html", "kind": "tool", "audience": "Mummies", "verdict": "A tidy short/medium/long-term goal board with a clear funded-vs-gap donut, good on a laptop. What holds it back: on a phone the page spills sideways and the 'Funded so far' box is hidden entirely, so the main thing the tool does can't be done on the device most visitors use.", "load": "31 KB page + Chart.js (~200 KB) for a single donut; fine, could be lighter.", "share_idea": "\"My family goals are [42]% funded 🎯 — ₹[gap] to go. Map yours in 2 minutes: games.investingformummies.com/goal-tracker.html\"", "share_moment": "Under the Overall Summary donut, where the WhatsApp button already sits (fix its text/link).", "items": [{"area": "Mobile", "priority": "High", "effort": "M", "text": "On phones the 'Funded so far' and 'Gap' columns are hidden and the column labels disappear, so mums can't enter what they've saved and see unlabelled boxes — on small screens show each goal as a stacked card with labelled fields (Goal, Years, Target, Saved so far).", "id": "goal-tracker-html--1"}, {"area": "Mobile", "priority": "High", "effort": "S", "text": "Each goal row is wider than the screen (the page is about 462px wide on a 390px phone), causing sideways scrolling — let the row wrap or stack as above.", "id": "goal-tracker-html--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The WhatsApp message and the downloaded plan both say 'ifm-deploy.vercel.app' — change to games.investingformummies.com/goal-tracker.html.", "id": "goal-tracker-html--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "The tool shows the gap but not what to do about it — add 'To close this gap in [Years], you'd need about ₹X a month' (or a 'Plan this goal →' link into Fund Your Goal) so a gap turns into an action.", "id": "goal-tracker-html--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Yrs' box is collected but used nowhere, and a 10-year goal can sit under 'Short term' — use the years to place or warn, and in the monthly-amount maths above.", "id": "goal-tracker-html--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "'Download My Plan' saves a plain .txt file, which feels unfinished next to Fund Your Goal's branded PDF — reuse that branded print layout here.", "id": "goal-tracker-html--6"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "'People who write down goals are 42% more likely to achieve them' is an unsourced stat — cite it or soften it ('Writing a goal down with a number and a date makes it far more likely to happen').", "id": "goal-tracker-html--7"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "'Target corpus' is jargon — say 'Amount needed'; also close the 4–5 year gap between 'Medium (1–4 years)' and 'Long (5+ years)'.", "id": "goal-tracker-html--8"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The faint IFM watermark only works when the page sits inside the old site, so on its own it's an empty image — point it at a small local logo or remove it.", "id": "goal-tracker-html--9"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "Chart.js is loaded just to draw one two-colour ring — a simple CSS ring would do the same and save ~200 KB on phones.", "id": "goal-tracker-html--10"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "Under the summary add a soft 'Not sure how to close the gap? Find your batch' link to register.investingformummies.com.", "id": "goal-tracker-html--11"}], "key": "goal-tracker-html"}]}, {"group": "class-a", "games": [{"slug": "swipe-right-live", "title": "Swipe Right on SIP LIVE", "url": "https://games.investingformummies.com/swipe-right-live", "file": "swipe-right-sip-live.html", "kind": "classroom", "audience": "Gen Next", "verdict": "A tight, funny format: fake finfluencer posts on the projector, students swipe on phones, then a dramatic '5 years later' receipts reveal that names who fell for what. What holds it back: every class shares one fixed room, and much of the projector text is too small to read from the back.", "load": "67 KB page + Supabase live library (~218 KB) + QR library + 3 Google fonts; no images — fast on any phone", "share_idea": "\"I got BORING GENIUS — my ₹10,000 became ₹16,450 and I dodged 5 of 6 scammy finfluencers in Swipe Right on SIP. Can you spot the red flags?\" + link", "share_moment": "On the student's phone, on the final 'Your verdict' card, right under the ₹ total and rank.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Every class plays in the same fixed room, MF101: two teachers running it at once end up in one game, and opening the host screen shows the last class's players and scores until someone presses Reset. Give each new host screen its own random room code, as Broke by Friday already does.", "id": "swipe-right-live--1"}, {"area": "Layout", "priority": "High", "effort": "S", "text": "Key projector text is only about 9px: the lobby rules ('₹10,000 · 10 funds · max 5 investments · right = invest'), the bottom-bar hints and the 'swipes locked in' labels. Make the rules line at least three times bigger so the back row can read it.", "id": "swipe-right-live--2"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "A swipe made in the last second can be lost. When the teacher taps 'Next fund', the host saves its own copy of the game, which can overwrite a vote a phone saved a moment earlier. Re-check the latest votes, or pause for a second, before moving on.", "id": "swipe-right-live--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Each ₹2,000 a player doesn't invest quietly grows to ₹2,150 (a savings-account rate) and counts toward their score, but nobody is ever told. Say this in the lobby rules and on the final card so 'skipping everything' is a visible, fair choice.", "id": "swipe-right-live--4"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "The 'I'm playing' button on the landing page sends phones to the default room, and there's nowhere to type a room code. Add a room-code box, so a student whose camera won't scan the QR can still join.", "id": "swipe-right-live--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The teacher can't remove a player, so a prank name stays on the projector for the whole game. Let the host tap a name in the lobby to remove it.", "id": "swipe-right-live--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Receipts show '₹2,000 → ₹3,600 in 5 years' on the big screen with no caveat (the page's disclaimer sits below the fixed control bar, out of view). Add a small line on the receipt screen: 'Made-up 5-year outcomes to show the pattern, not real fund data.'", "id": "swipe-right-live--7"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone's final screen ends with 'Leaderboard on the big screen'. Add one soft line and link under the lesson, e.g. 'Want to pick real funds this calmly? Find your batch' → register.investingformummies.com.", "id": "swipe-right-live--8"}, {"area": "Layout", "priority": "Low", "effort": "S", "text": "The forest-green, lime and Anton look carries no IFM logo on the host screens, and the final board says 'Screenshot the board 📸'. Add the IFM logo and web address to the lobby and final board so shared screenshots credit IFM.", "id": "swipe-right-live--9"}, {"area": "Accessibility", "priority": "Low", "effort": "S", "text": "The page blocks pinch-to-zoom, so players with weak eyesight can't enlarge text. Allow zoom. The same setting is on all five games in this group.", "id": "swipe-right-live--10"}, {"area": "Speed", "priority": "Low", "effort": "S", "text": "The live library is loaded as 'whatever the latest version 2 is' (it is 2.118 today), so an upstream update could break a class mid-session. Lock it to one tested version. This applies to all four live games here.", "id": "swipe-right-live--11"}], "key": "swipe-right-live"}, {"slug": "broke-by-friday", "title": "Broke by Friday LIVE", "url": "https://games.investingformummies.com/broke-by-friday", "file": "broke-by-friday-live.html", "kind": "classroom", "audience": "Gen Next", "verdict": "The richest classroom game here: 30 sharp, very Indian-teen scenarios, real peer-to-peer borrowing between students, teacher notes and a lovely 'disciplined twin' ending. What holds it back is joining: the bare link opens a teacher screen, there's no real place to type the room code, and refreshing the projector in the lobby kicks everyone out.", "load": "148 KB page + Supabase library (~218 KB) + QR library; light, but the phone join screen's hero image is missing on the live site (404)", "share_idea": "\"I finished Broke by Friday THRIVING ✨ with ₹6,200 left and my AirPods goal fully saved. Could you survive a month on ₹15,000?\" + link", "share_moment": "On the student's phone end screen, right after the verdict title and the 'disciplined twin' comparison.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The plain link (from WhatsApp or the games page) always opens the teacher screen, so a phone that taps it creates an empty room and never joins the class. Make the plain link ask 'I'm the teacher / Join with a code'. The code box already exists but only appears with ?role=player in the address.", "id": "broke-by-friday--1"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The lobby tells students 'on the IFM site → enter room', but no such place exists. Show the exact short address to type next to the code, and make that address open the code box.", "id": "broke-by-friday--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "Refreshing the projector during the lobby wipes everyone who has already joined. Their phones go back to the join screen and they have to pick their dream again. Keep the lobby on refresh, the same way it already survives mid-game.", "id": "broke-by-friday--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Students' names go onto the projector unescaped, so a name typed with angle-bracket code (e.g. <marquee>) can break or deface the big screen and the borrow lists on other phones. Show names as plain text only, as Quiz and Fund Manager already do.", "id": "broke-by-friday--4"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "'Lock it in' and each choice are sent once with no confirmation. On shaky venue wifi a tap can vanish and the student isn't told. Show 'sending…' and send again automatically if the projector hasn't confirmed within 3 seconds.", "id": "broke-by-friday--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Several prices don't match their own story: café ₹1,300 vs ₹1,800 on the button, hoodie ₹5,600 vs ₹6,800, chef dinner ₹4,000 vs ₹5,000, IMAX ₹2,000 vs ₹2,500, jacket ₹3,800 vs ₹4,500. The Coldplay lesson also says ₹6,500 is '32% of your month' when it is 43% of ₹15,000. Students will check the maths, so fix the numbers.", "id": "broke-by-friday--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The goal moment and the final screen disagree. 'You saved enough! Claim it' counts wallet plus jar, but the final screen and the class banner count only the jar, so a student who just claimed can be told they reached 40%. Use one rule everywhere.", "id": "broke-by-friday--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The life score barely rewards money: an extra ₹10,000 is worth only 20 points, the same as 10 mood points, and mood alone can earn 200. A splurger can top the board and blur the lesson. Give money more weight, or name a separate 'Best saver' winner.", "id": "broke-by-friday--8"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The phone join screen's background art (assets/bbf-live-hero.png) isn't on the live site (404), leaving an empty band at the top. Upload the image or remove the reference.", "id": "broke-by-friday--9"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The lobby QR is only 172px, too small to scan from the back of a classroom unless the teacher knows to tap the corner pill. Show it about 300px wide by default.", "id": "broke-by-friday--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "The lobby asks 'can your class make it to day 28?' but scenarios run to day 30. The pop-up dinner also names a real chef (Ranveer Brar) and wrongly calls him 'Michelin'. Make the day number consistent and use a fictional chef.", "id": "broke-by-friday--11"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The end screen closes with 'next month: flip the spend-vs-save ratio'. Add one line for the parent or teacher watching, e.g. 'IFM runs money workshops for teens: Find your batch' → register.investingformummies.com.", "id": "broke-by-friday--12"}], "key": "broke-by-friday"}, {"slug": "quiz", "title": "The IFM Crorepati (KBC-style quiz)", "url": "https://games.investingformummies.com/quiz", "file": "quiz.html", "kind": "classroom", "audience": "Both", "verdict": "The most polished host experience: a studio backdrop, prize ladder, streaks, fastest-finger, wagers, keyboard control, undo, 'game recovered' after a refresh, and a superb 'teach the tricky ones' ending. What holds it back: the lobby video doesn't load on the live site, a 1 MB logo from the old domain loads on every phone, and players have nowhere to type the PIN the screen tells them to enter.", "load": "158 KB page + Supabase + QR library; host also loads 672 KB + 595 KB studio JPGs and a 1 MB logo PNG from ifm-deploy.vercel.app (phones load that logo too). The 2.8 MB lobby video returns 404 live, so it isn't actually downloading.", "share_idea": "\"I won ₹18.5 Lakh and finished #2 of 24 in the IFM Crorepati money quiz 🏆 Think you know mutual funds better?\" + link", "share_moment": "On the player's phone end screen (rank + winnings), shown once the podium is on the projector.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The lobby and podium video (ifm-hero-lockup-9s.mp4) returns 'not found' on the live site because video files are excluded from deploys, so a cropped logo shows instead. Allow just this file through (it is 2.8 MB, so ideally shrink it) or drop the video.", "id": "quiz--1"}, {"area": "Speed", "priority": "High", "effort": "S", "text": "The IFM logo is a 1 MB PNG pulled from the old ifm-deploy.vercel.app address. It loads on every student's join screen, in the QR centre and as the video poster. Use a small local logo on the new domain (e.g. /ifm-round.png); join screens will open noticeably faster on cheap phones.", "id": "quiz--2"}, {"area": "Bug", "priority": "High", "effort": "S", "text": "The projector says 'or enter Game PIN', but there's nowhere to type one. The plain link opens a new host screen, and a phone without a room only says 'Scan the QR'. Add a PIN box for phones and make the plain link ask 'Host or join?'.", "id": "quiz--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A mistyped or old PIN leaves the phone on 'Connecting…' forever. Show 'Room not found: check the PIN on the big screen' with a retry box.", "id": "quiz--4"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "Joining and answering are each sent once with no confirmation. If one gets lost, the phone still says 'You're in!' or 'Answer locked ✓', but the projector never counted it and scores the player as 'Too slow'. Resend automatically until the host confirms.", "id": "quiz--5"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Refreshing the projector during the lobby wipes everyone who joined (refresh mid-game is handled well). Keep lobby players on refresh too.", "id": "quiz--6"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "The screen title is 'Kaun Banega Crorepati', the trademarked name of the Sony TV show, while the browser tab already says 'The IFM Crorepati'. Use the IFM name on screen to avoid a takedown risk.", "id": "quiz--7"}, {"area": "Accessibility", "priority": "Med", "effort": "M", "text": "Phones show only A/B/C/D, so anyone at the back or with weak eyesight can't play fairly. Add a 'show the question on my phone' option; the option text is already sent to the phones.", "id": "quiz--8"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "The Round 3 (Risk & Reward) briefing is one dense 70-word paragraph on the projector. Turn it into 3 short lines: 'Invest before you see the question · Right = it grows, wrong = it's gone · Your one 50:50 is now live'.", "id": "quiz--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The player's end screen only says 'now go invest like a pro'. Show the 2–3 questions they got wrong with the right answer (the host already works out the room's 'tricky ones'), then a soft 'Learn this properly: Find your batch' link.", "id": "quiz--10"}, {"area": "Copy", "priority": "Low", "effort": "S", "text": "Round 1 says 'trust what you learned this week', which is wrong for one-off talks and the teens set. The podium also shouts 'Crorepati!' even when the winner has ₹6 Lakh. Reword both.", "id": "quiz--11"}, {"area": "Bug", "priority": "Low", "effort": "S", "text": "The correct answers are included in the data sent to every phone, so a tech-savvy student could peek. Send only the current question's options, and the answer only after the reveal.", "id": "quiz--12"}], "key": "quiz"}, {"slug": "crorepati-lane", "title": "Crorepati Lane", "url": "https://games.investingformummies.com/crorepati-lane", "file": "crorepati-lane.html", "kind": "classroom", "audience": "Mummies", "verdict": "An on-brand, smoothly built Monopoly for mums with nice touches (Market Crash jail, Dividend Pool, SIP top-ups). What holds it back: the game has no end short of bankrupting everyone, and its rules teach the wrong money lesson (other investors pay you 'returns', and an FD behaves exactly like an IPO).", "load": "54 KB page, no libraries; the only weight is a 1 MB logo PNG loaded from ifm-deploy.vercel.app for a 62px icon", "share_idea": "\"I won Crorepati Lane with a ₹48 Lakh portfolio built on index funds and gold 👑 Play the IFM money board game with your friends\" + link", "share_moment": "In the winner pop-up, under the final net-worth ranking, beside 'Play Again'.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "The only ending is when everyone but one player is bankrupt, which can take 1–2 hours, yet the tagline promises 'the richest mum wins'. Let the group pick a length at setup (e.g. 20 minutes or 5 laps), then the highest net worth wins.", "id": "crorepati-lane--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "The money lesson is upside down. Landing on another mum's Index Fund makes you 'pay her returns' like rent, and every asset pays the same 10% of its price, so an FD carries the same risk as a small-cap and the IPO is the board's premium square. Pay returns from the market, not from other players. Make FD/PPF small but steady, and stocks bigger but hit by Market Event cards.", "id": "crorepati-lane--2"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "On a phone the board text is about 8px and names are cut off ('Fixed', 'Govt', 'Small-'), and on a projector it's unreadable from a chair. Use bigger icons with short names, let players tap a square for details, and use the large empty board centre to show the current card or event.", "id": "crorepati-lane--3"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "The 'Advance to PAYDAY' card pays the salary twice (₹4 Lakh instead of ₹2 Lakh): once for passing PAYDAY and again for landing on it.", "id": "crorepati-lane--4"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "A page refresh or an accidental back-swipe wipes the whole game with no warning. Save the game on the device after every turn and offer 'Resume game' on reopening.", "id": "crorepati-lane--5"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The logo is a 1 MB PNG from the old ifm-deploy.vercel.app address, shown at 62px on setup and again on the board. Swap in a small local copy; it is most of this page's download.", "id": "crorepati-lane--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "The rules say a frozen player 'needs doubles or ₹50,000', but there is no button to pay ₹50,000 and leave early. Players must fail three turns first. Add a 'Pay ₹50,000 to recover' button.", "id": "crorepati-lane--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "The goal is stated two ways ('the richest mum wins' vs 'be the last mum standing'). Some cards also blur real terms: 'Your SIP matured' (SIPs don't mature), and 'top-up your SIP' only after owning a whole colour set. Pick one goal and rename the build step (e.g. 'Grow this holding').", "id": "crorepati-lane--8"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The winner pop-up only offers 'Play Again'. Add a one-line takeaway (e.g. 'The winner spread her money across safe and growth assets') and a gentle 'Learn to do this for real: Find your batch' link.", "id": "crorepati-lane--9"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "The rules hide behind a small 'How to play' link and most mums will skip them. Add a 3-step coach on the first turn (roll → buy or pass → end turn).", "id": "crorepati-lane--10"}, {"area": "Mobile", "priority": "Low", "effort": "S", "text": "The token picker icons are 34px with tight gaps, below the 44px comfortable tap size. Enlarge them or show fewer per row.", "id": "crorepati-lane--11"}], "key": "crorepati-lane"}, {"slug": "mutual-fund-manager", "title": "Mutual Fund Manager LIVE", "url": "https://games.investingformummies.com/mutual-fund-manager", "file": "fund-manager.html", "kind": "classroom", "audience": "Both", "verdict": "A genuinely clever teaching sim: the class becomes the investors of a fund the teacher builds, and AUM, units, NAV, market months and withdrawals are all shown live with the class's own money. What holds it back: a projector refresh wipes the whole session, half the lessons it contains can't be reached, and it names real stocks and shows rosy, unexplained returns.", "load": "207 KB page + Supabase + QR library; plus a 1 MB logo and 13 art JPGs (90–275 KB each, ~2.2 MB total, loaded as screens appear), all from ifm-deploy.vercel.app", "share_idea": "\"Our class just ran a real-style mutual fund: I put in ₹2 Lakh by SIP and watched the NAV go ₹10 → ₹22. Learn how funds really work with IFM\" + link", "share_moment": "On the student's phone, on the final 'Your mutual fund journey' card.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "Refreshing the projector wipes the whole session. The host screen always starts a blank fund on load, so every investor is removed and all phones go back to 'join'. Resume the existing room on refresh, as Quiz and Broke by Friday do.", "id": "mutual-fund-manager--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "About half the lessons are built but unreachable: NAV myth, Feezilla (fees), SIP vs lump sum, STP, SWP, diversification, compounding and the factsheet quiz. Nothing in the step bar leads to them, and the host screen has no case to display them. Add them to the flow as optional 'bonus' steps, or remove the dead weight.", "id": "mutual-fund-manager--2"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The fund's holdings are real companies (Reliance, HDFC Bank, Infosys, TCS, ITC, Asian Paints), which can read as stock picks from an educator who isn't SEBI-registered. Use made-up names (e.g. 'Big Bank Ltd', 'Tech Co') or label them clearly 'names for illustration only'.", "id": "mutual-fund-manager--3"}, {"area": "Compliance", "priority": "High", "effort": "S", "text": "The fast-forward jumps the NAV to ₹22 in 4 years (roughly doubling, about 19% a year) with 'your money's about to be worth a lot more' and no assumption shown. State the assumption on screen, use a modest figure, and mention it could have been lower.", "id": "mutual-fund-manager--4"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "Market months are weighted to rise, and the SIP screen announces 'SIP wins, it's the smart default' based on a dip-then-recover path. Add one honest line: 'In a steadily rising market a lump sum usually ends ahead; SIP's real win is discipline and smoother buying.'", "id": "mutual-fund-manager--5"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Most explanations on the projector use the 'tiny' style (about 12px) and the step bar is about 11px, too small from the back of a room. Raise body text on host screens to at least 18–20px.", "id": "mutual-fund-manager--6"}, {"area": "Bug", "priority": "Med", "effort": "S", "text": "Students can't type the PIN shown on the projector. The plain link opens a new host room, a phone without a room only says 'Scan the QR', and a wrong PIN sits on 'Connecting…' forever. Add a PIN box and a 'Room not found' message.", "id": "mutual-fund-manager--7"}, {"area": "Bug", "priority": "Med", "effort": "M", "text": "Joining and investing are sent once with no confirmation. If a message is lost, the phone says 'You're in!' forever while the student is missing from the projector. Resend automatically until the host confirms.", "id": "mutual-fund-manager--8"}, {"area": "Speed", "priority": "Med", "effort": "S", "text": "The logo and all 13 artworks load from the old ifm-deploy.vercel.app address, but the same art already exists on the games site at /art/. Switch to the local copies so the game keeps working if the old address is retired, and replace the 1 MB logo with a small one.", "id": "mutual-fund-manager--9"}, {"area": "Conversion", "priority": "Med", "effort": "S", "text": "The phone's final 'Your mutual fund journey' card has no next step. Add a soft line and link: 'Ready to try this with your own money, step by step? Find your batch' → register.investingformummies.com.", "id": "mutual-fund-manager--10"}], "key": "mutual-fund-manager"}]}, {"group": "class-b", "games": [{"slug": "the-wealth-hack", "title": "The Wealth Hack", "url": "https://games.investingformummies.com/the-wealth-hack", "file": "the-wealth-hack.html", "kind": "classroom", "audience": "Gen Next", "verdict": "The most polished classroom game in this group: projector text scales to the room, guesses stay private, the 12% assumption is printed everywhere, phones opened from WhatsApp get a solo 'find your number' page, and the end screen already has a WhatsApp share. What holds it back is the join path (a game PIN with nowhere to type it, a lobby that empties if the host refreshes) and a heavy phone page.", "load": "123 KB page + Supabase + QR library; phones also pull a 1 MB logo PNG for a 30px badge; projector adds a 400 KB looping video + 215 KB backdrop", "share_idea": "A share already exists and is good. Keep the personal numbers ('₹X a month from today vs ₹Y if I wait 5 years') and the '12% a year, not a promise' line, then add one soft line before the link: 'Want to actually start? Next IFM batch → register.investingformummies.com'.", "share_moment": "Already in the right places (phone end screen after 'Your numbers · keep these', and the solo result). Also add the button to the Round 2 reveal on the phone, which is the peak shock moment.", "items": [{"area": "Bug", "priority": "High", "effort": "S", "text": "The projector says 'or enter game PIN E1234', but the phone has nowhere to type a PIN: opening the game on a phone shows the solo page, which only says 'ask your tea
