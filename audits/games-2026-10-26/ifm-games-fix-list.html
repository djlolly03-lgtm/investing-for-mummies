 balance meter: https://playspent.org/html/).", "id": "killer-inflation-calculator--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Anchor to her life instead of to 'years'. Ask her child's age (optional) and label the timeline in milestones ('when Riya starts college · 2041'). The headline becomes one sentence: 'When Riya starts college, ₹10,000 of today's groceries will cost about ₹24,000 (assumes 6% a year).' Inspired by benchmark #17 One personal sentence (NYT rent-or-buy: https://www.ngpf.org/blog/interactive/is-it-better-to-rent-or-buy-a-financial-calculator/).", "id": "killer-inflation-calculator--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Give each item its own assumed rate, editable and shown on the tag (for example groceries 6%, school fees 10%). Explain under 'Why different?' that education costs have often risen faster than general prices, labelled as an assumption she can change. Inspired by benchmark #18 Show your assumptions (SPENT sources: https://playspent.org/html/files/sources/umd_spent_sources-2.pdf).", "id": "killer-inflation-calculator--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "Restructure the three tabs into one flow: Guess → Reveal → '…and how much would I need?' as an optional sandbox at the end. The current 'How much will I need / What will my money buy / How much lump sum' tabs become the sandbox's sliders. Inspired by benchmark #16 End with a sandbox (Parable of the Polygons: https://ncase.me/polygons/).", "id": "killer-inflation-calculator--6"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Story card: the shrunken ₹100 note, the 'rice ₹60 → ₹107' tag and the assumption, plus the WhatsApp line. Every number in it is the game's example basket, not her spending. (reuse: Hidden Fortunes image share card, Wealth Hack WhatsApp share). Inspired by benchmark #2 9:16 card (Spotify Wrapped: https://nogood.io/blog/spotify-wrapped-marketing-strategy/).", "id": "killer-inflation-calculator--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Rename from 'Inflation Calculator (Resource)' to 'The Price *Time Machine*', with kicker '6 PRICES · 2 MINUTES' and hook 'Your ₹60 kilo of rice. Guess what it costs when your child turns 18.' The calculator becomes a game without losing its use. (reuse: Wealth Hack intro shape). Inspired by benchmark #5 A dare (SPENT 'Prove it': https://playspent.org/html/).", "id": "killer-inflation-calculator--8"}], "key": "killer-inflation-calculator"}, {"slug": "killer-wheel-of-gold", "title": "Wheel of Gold — killer upgrade", "url": "https://games.investingformummies.com/wheel-of-gold", "file": "wheel-of-gold.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version keeps the beautiful medallion wheel but makes each spin a newspaper headline that moves a live gold-price line, with a confidence bet on every call. It ends on a twist every Indian mum needs: she 'sells' a bangle after gold rose 10% and still gets back less than she paid, because of making charges. The screenshot is that bill: 'Gold went UP. My bangle still lost money.'", "load": "", "share_idea": "🪙 *Wheel of Gold* 7/8\n🟨🟨⬛🟨🟨🟨🟨🟨\nI read gold's mood right 7 times, and still learned my bangle loses money at resale even when gold goes UP 😳\nCan you read gold? 👇\ngames.investingformummies.com/wheel-of-gold", "share_moment": "War, rupee, interest rates: spin a headline and call it. Does gold go up or down?", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Add a confidence bet: before revealing, she stakes 1, 2 or 3 gold coins on her call. Wrong-but-cautious costs little; overconfident-and-wrong costs a lot. Add 2 'trick' headlines where gold did the unexpected (record highs alongside record stocks). It teaches that gold's behaviour is a 'usually', not a law, so this is not trivia. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-wheel-of-gold--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Add one live number: an illustrative gold-price line across the bottom that takes a step after each headline (labelled 'illustrative, not real prices'), so by the end she sees a year of gold's mood as one wiggly line made by her 8 headlines. (reuse: Wealth Hack count-up). Inspired by benchmark #6 One live number (SPENT balance meter: https://playspent.org/html/).", "id": "killer-wheel-of-gold--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "New finale, 'Sell your bangle'. She bought a ₹1,00,000 bangle and gold has since risen 10%. The jeweller's bill animates: gold value, minus the making charge she can't get back, minus GST, minus the buyback deduction, giving about ₹92,000. One line: 'Gold went up, and your bangle still came back lower.' Show every assumption on the bill (illustrative 12% making charge, 3% GST, 2% buyback deduction; these vary by jeweller and rates change). No product named. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/); benchmark #20 Local life events (SEBI Check QR game: https://www.nism.ac.in/wp-content/uploads/2026/02/SEBI-Investor-Awareness-Stall-at-IKBF-2026-Crosses-100000-Visitors-1.pdf).", "id": "killer-wheel-of-gold--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Juice: synthesised peg-ticks as the wheel passes each segment (slowing with the wheel), a soft 'thunk' and buzz on landing, a rising chime for a right call and a coin pour onto her pile. Shorten the spin to about 3 s and let a tap skip it. (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-wheel-of-gold--4"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "Show headlines as newspaper clippings: each scenario is a torn newsprint clipping in serif type ('RUPEE SLIPS TO RECORD LOW') over the wheel, with India-angle headlines in the mix (rupee, import duty, wedding-season demand). It looks like the real world and suits the medallion art. Inspired by benchmark #20 Local life events (SEBI Check QR game: https://www.nism.ac.in/wp-content/uploads/2026/02/SEBI-Investor-Awareness-Stall-at-IKBF-2026-Crosses-100000-Visitors-1.pdf).", "id": "killer-wheel-of-gold--5"}, {"area": "Share", "priority": "High", "effort": "S", "text": "Wordle-style result: 🟨 right, ⬛ wrong, in spin order, plus '7/8' and the bangle line. Replace the emoji trophy, the locked badges and the Benjamin Franklin quote with one tailored verdict ('You read fear well; rates fooled you') and the share. (reuse: Wealth Hack WhatsApp share, Hidden Fortunes image share card). Inspired by benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/); benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-wheel-of-gold--6"}, {"area": "Mobile", "priority": "Med", "effort": "S", "text": "Phone layout: wheel on top (about 300 px), the headline clipping under it, and two full-width 'Gold UP ↑' / 'Gold DOWN ↓' buttons with words on them in the thumb zone. The spin button becomes a swipe-down on the wheel. (reuse: Wealth Hack sticky CTA).", "id": "killer-wheel-of-gold--7"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Link the finale to the next game: 'Silver has a day job. Try the Wheel of Silver →', with a combined 'Metals' badge if she plays both, via localStorage. (reuse: Slash the Scam personal best).", "id": "killer-wheel-of-gold--8"}], "key": "killer-wheel-of-gold"}, {"slug": "killer-wheel-of-silver", "title": "Wheel of Silver — killer upgrade", "url": "https://games.investingformummies.com/wheel-of-silver", "file": "wheel-of-silver.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version is about silver's double life. Every headline asks two things, up or down and whether the jewel side or the factory side moved it, and every answer shows silver swinging further than gold on the same news. It ends on a Dhanteras silver coin. The moment she screenshots is the rollercoaster card: 'Silver is gold with a day job, and it swings twice as hard.'", "load": "", "share_idea": "🥈 *Wheel of Silver* 6/8\n🟦⬛🟦🟦🟦⬛🟦🟦\nSilver turns out to be _gold with a day job_ 🏭💍, and it swings twice as hard.\nCan you read its mood? 👇\ngames.investingformummies.com/wheel-of-silver", "share_moment": "Silver lives two lives: jewellery box and factory floor. Spin a headline. Which one moves the price?", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Use a two-tap call: after 'Up or Down?', a second quick tap asks 'Why: 💍 jewel side (fear, safe haven) or 🏭 factory side (solar panels, electronics)?'. Getting the why right earns the bonus. That second tap teaches the game's whole premise, which the current version only states in a hidden intro. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-wheel-of-silver--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "After each answer, show two bars for the same headline, gold and silver, with silver's bar longer both ways (labelled 'illustrative: silver has typically swung more than gold'). By the 8th headline she has seen volatility rather than read about it. Inspired by benchmark #6 One live number (SPENT balance meter: https://playspent.org/html/).", "id": "killer-wheel-of-silver--2"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Rollercoaster finale: plot both metals' illustrative paths across her 8 headlines on one chart, silver's line wilder, then a local closer: 'You bought a silver coin on Dhanteras.' Show what affects its resale (purity, the seller's cut), with assumptions shown and no products named. Inspired by benchmark #20 Local life events (SEBI Check QR game: https://www.nism.ac.in/wp-content/uploads/2026/02/SEBI-Investor-Awareness-Stall-at-IKBF-2026-Crosses-100000-Visitors-1.pdf); benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-wheel-of-silver--3"}, {"area": "Layout", "priority": "High", "effort": "M", "text": "Visuals: commission 8 silver relief icons to match the gold medallion wheel (≤30 KB WebP each). Silver currently falls back to emoji, which is why it looks a tier below Gold. Use cool moonlit tones and the same wheel engine.", "id": "killer-wheel-of-silver--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Juice (same as Gold): peg-ticks, landing buzz, a 3 s spin with tap-to-skip, and a chime or thud. Add a combined 'Metals' run that unlocks after Gold, where a mixed wheel asks 'Gold or Silver: which moves more on this headline?'. (reuse: Slash the Scam sound kit + mute, Slash the Scam personal best). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-wheel-of-silver--5"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Intro to the new shape: kicker '8 HEADLINES · 3 MINUTES', title 'Wheel of *Silver*', hook 'Silver lives two lives: jewellery box and factory floor. Which one moves the price?', button 'Spin the first headline →'. The jewellery takeaway becomes a kind, reasoned line in place of 'Jewellery is NOT an investment!'. (reuse: Wealth Hack intro shape). Inspired by benchmark #3 First tap is the first decision (SPENT: https://playspent.org/html/).", "id": "killer-wheel-of-silver--6"}, {"area": "Share", "priority": "High", "effort": "S", "text": "Wordle-style 🟦/⬛ grid plus '6/8' and the 'gold with a day job' line. The verdict replaces the trophy: 'You spotted the factory side every time', and so on. (reuse: Wealth Hack WhatsApp share, Hidden Fortunes image share card). Inspired by benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/); benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-wheel-of-silver--7"}], "key": "killer-wheel-of-silver"}, {"slug": "killer-reit-or-real", "title": "REIT or Real? — killer upgrade", "url": "https://games.investingformummies.com/reit-or-real", "file": "reit-or-real.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version lets her be a landlord for ten fast years. A ₹1 crore flat's ₹25,000 rent arrives as a receipt that gets chipped away by an empty month, society maintenance, a leaking bathroom and property tax, while a slice of an office park quietly pays out next to it. The moment she screenshots is the shrunken rent receipt ('About 2% a year, in hand'), with a warm note that a home you live in is worth more than its yield.", "load": "", "share_idea": "🏢 *REIT or Real?*\nI was a landlord for 10 years (in a game 😅). After the empty months and the leaking bathroom, my 'rent' shrank to about *2% a year* 🫠\nOwn the flat or a slice of the mall? 👇\n_(illustrative numbers)_\ngames.investingformummies.com/reit-or-real", "share_moment": "You just bought a ₹1 crore flat to rent out. Guess how much it really earns you each year.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "Open with a guess: 'Your ₹1 Cr flat rents for ₹25,000 a month. What % of its price does it earn you each year after costs?' (slider 1–12%). Most people guess 6–10%. Reveal about 2% with an off-by pill. That one gap is the lesson of the game. (reuse: Wealth Hack off-by pill). Inspired by benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/).", "id": "killer-reit-or-real--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Run a landlord simulator: 10 years, one tap each. A rent receipt (₹3 L a year) takes event cards (an empty 2 months, a maintenance hike, a leaking bathroom ₹40,000, property tax, a rent rise) and the in-hand figure in the receipt's corner counts down in coral. All numbers are labelled illustrative. Inspired by benchmark #6 One live number (SPENT balance meter: https://playspent.org/html/); benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-reit-or-real--2"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Run a twin lane: next to the flat, 'a slice of an office park' (a REIT unit priced like a family dinner, about a few hundred rupees) pays its distributions each year. Show that they can also fall ('payouts aren't fixed; unit prices move'). The two lanes end side by side, with no product named. Inspired by benchmark #15 Same game, one variable changed (NGPF PAYBACK: https://www.ngpf.org/blog/paying-for-college/ngpf-launches-payback/).", "id": "killer-reit-or-real--3"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "Before the simulator, ask 'Is this flat to live in or to earn from?'. If 'to live in', the game says warmly 'A home is security and memories, not just a yield. This game is about property bought to earn' and plays on. That fixes the one-sided tone without diluting the lesson.", "id": "killer-reit-or-real--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Keep the 8 True/False myths as a fast 'Myth or Fact?' swipe warm-up (1 minute) with a 'how sure are you?' tap. The landlord years are the main course. The final screen shows 3 takeaway rows and the full recap behind 'See all answers ▸'. (reuse: Wealth Hack result rows). Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-reit-or-real--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "Visuals: one painted Mumbai-highrise flat and one office park (≤40 KB WebP each) as the two lanes. The office park visibly splits into thousands of tiny glowing units when she 'buys a slice', which replaces the 🏠 vs 🏢 emoji tiles.", "id": "killer-reit-or-real--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Juice: a coin clink when rent lands, a drip sound for the leak, a 'thunk' for the tax stamp, and the receipt tearing a strip off for each cost. Archetype at the end: 'The Rent Realist' / 'The Brick Believer'. (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/); benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-reit-or-real--7"}, {"area": "Share", "priority": "Med", "effort": "S", "text": "Story card: the shrunken rent receipt with '≈2% a year in hand, illustrative' and the dare 'Own the flat or a slice of the mall?', plus the WhatsApp line. No personal property values. (reuse: Hidden Fortunes image share card, Wealth Hack WhatsApp share). Inspired by benchmark #2 9:16 card (Spotify Wrapped: https://nogood.io/blog/spotify-wrapped-marketing-strategy/).", "id": "killer-reit-or-real--8"}], "key": "killer-reit-or-real"}, {"slug": "killer-debt-detective", "title": "Debt Detective — killer upgrade", "url": "https://games.investingformummies.com/debt-detective", "file": "debt-detective.html", "kind": "solo", "audience": "Mummies", "verdict": "The killer version is a detective case board. Each product arrives as a stamped case file, she questions three clues to find out who is really borrowing her money, and each solved case is pinned onto a wall that builds the safety ladder from Government down to Company. The twist case is an 'FD' that turns out to be a company, not a bank, and isn't covered by deposit insurance. The screenshot is her finished case board with that impostor circled in red.", "load": "", "share_idea": "🔍 *Debt Detective* 7/8\n🟩🟩🟩🟥🟩🟩🟩🟩\nSolved 7 cases, and caught the 'FD' that isn't from a bank 🕵️‍♀️\nWho's really borrowing your money? 👇\ngames.investingformummies.com/debt-detective", "share_moment": "Every FD, bond and PPF is a loan, and you're the lender. 8 case files. Find out who's really borrowing your money.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Clues instead of descriptions: each case file opens with its name only. She taps 2 of 3 clue chips ('Who pays your interest?', 'Who guarantees it?', 'What if they can't pay?') to reveal a one-line clue, then names the borrower. The giveaway descriptions become detective work, and fewer clues used earns a bonus magnifier. Inspired by benchmark #7 Teach in the result (SPENT: https://playspent.org/html/).", "id": "killer-debt-detective--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Add an impostor case, 'Company Fixed Deposit': it looks like a bank FD but the borrower is a company, and company deposits are not covered by the ₹5 lakh bank-deposit insurance (DICGC covers bank deposits: https://www.dicgc.org.in/). The reveal stamps 'NOT A BANK' across the file. That twist is the most useful thing a mum can learn here. Inspired by benchmark #20 Local life events (SEBI Check QR game: https://www.nism.ac.in/wp-content/uploads/2026/02/SEBI-Investor-Awareness-Stall-at-IKBF-2026-Crosses-100000-Visitors-1.pdf).", "id": "killer-debt-detective--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Build a case board as the payoff: each solved file is pinned to a corkboard in its safety tier (Central Govt → State Govt → Bank → Company), joined by red string. At the end the full board is the safety ladder she built herself, with any case she got wrong circled in red. It replaces the plain 'By borrower type' list. Inspired by benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-debt-detective--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add a yield line-up round: drag 4 case files into order of 'who pays you the most interest?'. The answer mirrors the safety board upside down, so 'higher interest = more risk' becomes something she sees. Rates are shown with 'as of' dates. Inspired by benchmark #1 Guess first, then reveal (NYT 'You Draw It': https://flowingdata.com/2015/05/28/compare-your-curve-to-reality-for-income-percentile-versus-college-attendance/).", "id": "killer-debt-detective--4"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "Visuals: manila case-file cards with a CASE #04 stamp, a typewriter font only for the file number (Lora/Nunito everywhere else), a red rubber stamp for the verdict and a magnifier icon. Use brand colours by tier: teal for government, navy for banks, gold for companies, so the colour teaches the ladder.", "id": "killer-debt-detective--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Juice: a stamp 'thunk' plus a buzz when she names the borrower, a paper rustle as a file opens, and a short red-string draw animation on the board. Retire the 30-second timer bar entirely; detectives take their time. (reuse: Slash the Scam sound kit + mute). Inspired by benchmark #12 Juice (Juice it or lose it: https://roblog.co.uk/2024/03/juicy-games/).", "id": "killer-debt-detective--6"}, {"area": "Share", "priority": "High", "effort": "S", "text": "Wordle-style 🟩/🟥 grid plus '7/8' plus 'caught the impostor FD ✓', with a detective rank as the headline ('Inspector', 'Constable', 'Rookie' rather than 'Keep Studying!'). Story card of her case board. (reuse: Wealth Hack WhatsApp share, Hidden Fortunes image share card). Inspired by benchmark #2 Spoiler-free result card (Wordle: https://www.smithsonianmag.com/smart-news/heres-why-the-word-game-wordle-went-viral-180979439/); benchmark #10 End on an identity (How Bad Is Your Spotify: https://mikelacher.com/work/how-bad-is-your-spotify).", "id": "killer-debt-detective--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Intro to the new shape: kicker '8 CASE FILES · NO TIMER', title 'Who's borrowing *your* money?', hook 'Every FD, bond and PPF is a loan, and you're the lender.', button 'Open case #1 →'. (reuse: Wealth Hack intro shape). Inspired by benchmark #3 First tap is the first decision (SPENT: https://playspent.org/html/); benchmark #5 A dare (SPENT 'Prove it': https://playspent.org/html/).", "id": "killer-debt-detective--8"}], "key": "killer-debt-detective"}]}, {"group": "killer-b", "games": [{"slug": "killer-debt-boss", "title": "Debt Boss — killer upgrade", "url": "https://games.investingformummies.com/debt-boss", "file": "debt-boss.html", "kind": "solo", "audience": "Mummies", "verdict": "Turn Debt Boss into 'You are the moneylender': borrowers queue at your door (the Government, a bank, a company in a hard hat, a flashy finance firm promising 12%), you hand out ten ₹1 lakh coins, and four years of shocks play out on one live 'buying power' meter. The moment people screenshot is the Shrink Ray: the paper total counts up, then the same pile of coins visibly shrinks to what it buys in today's prices, with the line 'Your money grew. Your shopping trolley didn't.' It is the 'safe money' lesson every mum with an FD needs, in one picture.", "load": "", "share_idea": "🪙 I played moneylender with ₹10 lakh of 'safe' money — it grew on paper and still lost buying power 😳 Can yours beat inflation? games.investingformummies.com/debt-boss  _(Game uses made-up returns and assumes 7% inflation a year. Education only.)_", "share_moment": "FDs, PPF, bonds: all 'safe', right? Lend ₹10 lakh and see what's left after 4 years. 3 minutes.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Rebuild the core loop around lending, not filling boxes. Replace the six-card grid of ₹25,000 steppers with ten big ₹1 lakh gold coins: tap a borrower to hand them a coin, tap their coin stack to take one back. Each borrower card is a character with one line ('Government of India: I always pay, but slowly', 'Bluestone Builders Ltd (BBB): I pay 11% because I might not pay at all'). Ten taps instead of forty, and every tap is a real decision. (Benchmark #3 First tap is the first decision — SPENT)", "id": "killer-debt-boss--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Add the Shrink Ray reveal as the finale. Step 1: 'Your ₹10 lakh is now ₹12.1 lakh on paper. Drag the slider: what will it buy in today's prices?' Step 2: reveal the real figure over their guess with an off-by pill ('You guessed ₹11.5 L — it buys ₹9.2 L'). Step 3: the coin pile shrinks on screen, and a shopping trolley loses two items. Show '(assumes 7% inflation a year)' under the number. (Benchmark #1 Guess first, then reveal — NYT You Draw It)", "id": "killer-debt-boss--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add a desperate-yield lure in Year 2: a WhatsApp-style message slides in from 'Sunshine Finance (fictional): 12% FD, limited period, today only!'. The player can move coins into it. In Year 3 it freezes withdrawals, and a callout explains what happened: higher rate means higher risk, and DICGC insurance covers bank deposits only, not company deposits. This turns the default round from a fact into a felt mistake. (Benchmark #14 Desperate lifelines with a hidden price — SPENT 'Need cash?')", "id": "killer-debt-boss--3"}, {"area": "Layout", "priority": "High", "effort": "M", "text": "[Kit: Count-up] [Kit: Top bar] Pin one live 'Buying power' meter to the top bar for the whole game, showing the paper total and a thinner gold 'in today's prices' bar under it. Both count up or down after every event, and the gap between them widens year by year, so inflation is visible every round, not only in Year 4. Add Year 1 to Year 4 dots as the progress row. (Benchmark #6 One live number you can't stop watching — SPENT balance meter)", "id": "killer-debt-boss--4"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Sound] [Kit: Confetti] Juice the shocks. Rate hike: bond coins wobble and slide down a little with a low thud. Default: the Bluestone Builders door slams and its coins crack, with one short vibration on phones that support it. Inflation: the trolley icon sheds items. Use confetti only if the player's buying power ends above where it started, and skip all motion for reduce-motion users. (Benchmark #12 Juice — Juice it or lose it)", "id": "killer-debt-boss--5"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Result rows] [Kit: Personal best] End on an identity, not 'Debt Master 100/100'. Pick one of four lender archetypes from how they lent: 'The Locker Guardian' (mostly PPF/SSY), 'The Yield Chaser' (mostly corporate/Sunshine), 'The Ladder Builder' (spread across all), 'The Gullak Saver' (parked in FD). Show three result rows: paper total (gold), buying power (coral if below ₹10 L), and the one borrower who hurt most. Add one tailored line, for example 'Your money was safe from default, but not from inflation.' (Benchmark #10 End on an identity — BitLife ribbons)", "id": "killer-debt-boss--6"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Replace 'Play again' with one specific replay: 'Same 4 years, but tax at 30%' or 'Same 4 years, without Sunshine Finance'. Then show both endings side by side ('Run 1: ₹9.2 L buying power · Run 2: ₹8.4 L'). The tax replay is where the PPF-vs-FD lesson lands for working mums, without adding a tax screen up front. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-debt-boss--7"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Rewrite the event pop-ups into a 'what just happened' bubble of no more than 35 words, with a rupee figure about the player's own coins first ('Your 2 Govt Bond coins dropped ₹4,000 — when rates rise, old bonds get cheaper'). Put the longer classroom paragraph (Year 2 is about 150 words today) behind 'Why? ▸'. Use 'Not quite — here's the twist' for wrong answers. (Benchmark #7 Teach in the result, not before the choice — SPENT result bubbles)", "id": "killer-debt-boss--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text)] [Kit: Share image card] Make WhatsApp the primary end button, sending the share line above with the archetype name added. Offer a 1080×1920 Story card on navy: the Shrink Ray picture (big coin pile and smaller coin pile), the archetype, 'Your money grew. Your trolley didn't.', the assumption line and the game URL. No rupee totals on the card. (Benchmark #2 Spoiler-free result card — Wordle / Spotify Wrapped)", "id": "killer-debt-boss--9"}, {"area": "Compliance", "priority": "Med", "effort": "S", "text": "[Kit: Assumption footer] Keep every lender character generic: 'Government of India', 'A big bank', 'Bluestone Builders (fictional company)', 'Sunshine Finance (fictional)'. Never name a real NBFC, bank or bond issuer, even for the default. On the Shrink Ray and the share card, print 'Made-up returns · 7% inflation assumed · not a promise'. Add a 'Where do these numbers come from?' sheet listing the PPF, SSY and FD rates with their 'as of' date. (Benchmark #18 Show your sources and assumptions — SPENT sources PDF)", "id": "killer-debt-boss--10"}], "key": "killer-debt-boss"}, {"slug": "killer-cap-climber", "title": "Cap Climber — killer upgrade", "url": "https://games.investingformummies.com/cap-climber", "file": "cap-climber.html", "kind": "solo", "audience": "Mummies", "verdict": "Rebuild Cap Climber around the one insight beginners always get wrong: a pricey share is not a big company. Each round puts two or three fictional companies on a mountain, each with a share price and a number of shares, and the player drags them to the summit (large), the slopes (mid) or the foothills (small). The screenshot-and-forward moment is the reveal where the ₹4,000 share slides down to the foothills while the ₹250 share climbs to the summit, under the line 'Price fooled you. Size is price × shares.'", "load": "", "share_idea": "🏔️ I thought the ₹4,000 share was the big company. It wasn't 😅 3-minute game on how 'large cap' really works: games.investingformummies.com/cap-climber  _(Fictional companies, education only.)_", "share_moment": "Which company is bigger: the ₹4,000 share or the ₹250 share? Most people pick wrong. 2 minutes.", "items": [{"area": "Compliance", "priority": "High", "effort": "M", "text": "Decision: switch to fictional companies, and drop real names entirely. Sorting real listed companies by size is factual, but it breaks three ways. The large/mid/small lists are reshuffled every six months, so answers go stale (the earlier audit found three already wrong). A list of real names next to 'small caps can be multi-baggers' reads like a tip sheet. And IFM's rule is no real stocks as picks. Keep it relatable with fictional brands from everyday life: 'Rangoli Paints', 'Chaiwala Chain', 'Ghar Ghar Gas', 'Dabba Delivery', each with a one-line 'what they do'.", "id": "killer-cap-climber--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Change the core loop from 'name, then guess within 6 seconds' to 'reason, then place'. Each card shows share price and number of shares ('₹250 × 400 crore shares'), and the player drags it onto the mountain. Round 1 is a gimme (a huge company with a huge share count). Round 3 is the trap: a ₹4,000 share with only 2 crore shares, so it is a small company. Show 'market cap = price × shares' as a tappable chip, never as a rules paragraph. (Benchmark #3 First tap is the first decision — SPENT)", "id": "killer-cap-climber--2"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "[Kit: Count-up] [Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Turn each placement into guess-then-reveal: after the drop, a coin tower rises beside the company to its real value ('₹1,00,000 crore'), counting up, and the company slides to its true band if the player misplaced it. The callout leads with the trap in one line: 'The ₹4,000 share is worth ₹8,000 crore in total — smaller than the ₹250 one.' (Benchmark #1 Guess first, then reveal — NYT You Draw It)", "id": "killer-cap-climber--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a 'Who's bigger?' bonus round between bands: two fictional brands side by side, and the player taps the bigger company before the towers rise. A correct call earns a climbing step. Make the timer optional: 'relaxed mode' should be the default, and a 'beat the clock' toggle is for people replaying. (Benchmark #12 Juice — Juice it or lose it)", "id": "killer-cap-climber--4"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "Make the mountain the whole phone screen: summit, slopes and foothills as three tappable bands filling the top 60% of the viewport, the company card docked in the thumb zone at the bottom, and drag-or-tap to place. A tiny climber figure moves up one ledge per correct answer, as the progress indicator for all 8 rounds. Remove the 'How It Works' card and the 'Back to Main Menu' button from the play screen. (Benchmark #13 Say how long it takes, then show progress — The Evolution of Trust)", "id": "killer-cap-climber--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Tokens: Daylight] Replace emoji logos (⛽ 💻 🏦) and the off-brand blue/purple with one illustrated mountain (navy summit, teal slopes, gold foothills) and simple outline icons for each fictional brand. Colour-code the bands, but always label them in words too (LARGE / MID / SMALL), and keep icon files at or under 30 KB each.", "id": "killer-cap-climber--6"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Result rows] End with an identity and one sentence: 'The Size Spotter: you saw past the price tag 7 times out of 8' or 'The Price-Tag Trusted: you picked the expensive share as the big company — most people do.' Three result rows: traps spotted, the biggest company you sized right, and one sentence on why size matters for risk, worded neutrally ('bigger companies have usually moved less than smaller ones; not always'). (Benchmark #10 End on an identity — BitLife ribbons)", "id": "killer-cap-climber--7"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Personal best] Add a daily 'Size-up of the day': three fictional companies picked by the date (the same for everyone, no backend needed), a localStorage streak, and a Wordle-style result line ('Cap Climber #12 🟢🟢🔴 · streak 4'). This gives a short, endlessly replayable format a reason to come back. (Benchmark #19 A small daily ritual — Wordle / Duolingo)", "id": "killer-cap-climber--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text)] [Kit: Share image card] The primary end button sends the share line above, built around the trap rather than the score. The Story card shows the mountain with the two trap companies, the player's archetype, and 'Size = price × shares', plus the URL. Give this game its own og:image with the hook question 'Which is the bigger company: the ₹4,000 share or the ₹250 one?' (Benchmark #4 Link preview as the cover — WhatsApp link-preview requirements)", "id": "killer-cap-climber--9"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "Rewrite the whole page voice for a first-timer: kicker 'MARKET CAP · 2 MINUTES'; title 'Cap *Climber*'; hook 'A ₹4,000 share or a ₹250 share: which company is bigger? Most people get this wrong.'; button 'Start climbing →'. Drop 'telecom play', 'blue-chip', 'QSR', 'multi-baggers' and the 'Top 100 / 101–250' rank rules from the intro, and put the rank bands in the end-screen 'Learn more ▸' instead.", "id": "killer-cap-climber--10"}], "key": "killer-cap-climber"}, {"slug": "killer-market-pulse", "title": "Market Pulse — killer upgrade", "url": "https://games.investingformummies.com/market-pulse", "file": "market-pulse.html", "kind": "solo", "audience": "Mummies", "verdict": "Market Pulse becomes a 3-minute 'read the market's mood' game: a headline drops, you draw with your finger where you think the price goes next, and the real line draws over yours. The moment people screenshot is the plot twist: a headline about good news, the player's line going up, the real line going down, and a stamp saying 'The market disagreed'. It ends on a Wordle-style row of coloured squares and an archetype, not a trader rank.", "load": "", "share_idea": "📈 *Market Pulse* — I read 10 headlines and guessed the market's mood 6 times. 🟩🟩🟥🟨🟩🟥🟩🟩🟨🟥 Good news doesn't always mean a rising price. Can you beat me? 👇 games.investingformummies.com/market-pulse _(made-up companies, practice only, not investment advice)_", "share_moment": "Good news, price falls. Bad news, price rises. Can you read the market's mood? 10 headlines · 3 minutes", "items": [{"area": "Game design", "priority": "High", "effort": "L", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Replace the five Sharp-rise to Sharp-fall buttons with a 'draw it' pad. Under each headline sits an empty chart. The player drags a finger to sketch the next session, taps 'Lock my line', and the real line animates over theirs, with a pill such as 'Right way, too timid: you drew +1%, it moved +7%'. Score 2 points for the right direction and 1 for getting the size roughly right, so the five-way guess becomes a drawing that feels personal. (Benchmark #1 Guess first, then reveal — NYT 'You Draw It')", "id": "killer-market-pulse--1"}, {"area": "Compliance", "priority": "High", "effort": "M", "text": "Build a recurring cast of 12 fictional companies with painted logo tiles of 30 KB or less each, such as 'Chai & Co.' (FMCG), 'Swift Bank', 'Desi Wheels Motors', 'RocketPay' (fintech), 'Bharat Infra' and 'Circuit Makers'. Call the indices 'the whole market'. On each reveal add a small 'Inspired by a real moment: the 2019 corporate tax cut' line, so the lesson stays real without attaching invented events to listed companies. Players get to know the characters across rounds, which also makes daily replays work (see the daily headline item). (Benchmark #18 Show your sources and assumptions — SPENT sources PDF)", "id": "killer-market-pulse--2"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "Curate the 30-headline pool so that about 4 in 10 are twists: good news where the price falls ('priced in'), splits that change nothing, and bad news that was already expected. Stamp each twist with a gold 'PLOT TWIST' seal and one line in the player's terms: 'You drew it up. Everyone already knew, so it fell.' The twists are what people talk about, so deal at least three into every 10-headline game.", "id": "killer-market-pulse--3"}, {"area": "Layout", "priority": "Med", "effort": "S", "text": "[Kit: Top bar] Pin one live element to the top bar: a row of 10 empty squares that fill green (called it), yellow (right direction, wrong size) or coral (wrong way) after each headline. It is the progress bar, the score and the future share line in one, and it replaces the CALLS / HITS / ACCURACY / STREAK status bar and its keyboard hints. (Benchmark #6 One live number you can't stop watching — SPENT balance meter)", "id": "killer-market-pulse--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Count-up + Sound] Reveal juice on the brand palette: the real line draws in about 1.2 seconds while the % change counts up beside it, a soft bell plays for a hit and a low thud for a miss (both already synthesised in the file), and a phone without reduce-motion gives a short buzz on a big miss. Replace the full-screen circuit flash with one rubber-stamp card ('TRADING PAUSED: the exchange hit the brakes'). Then show at most three lines: what happened, why, and a 'What this means for you' line in plain words. (Benchmark #12 Juice — 'Juice it or lose it'; #7 Teach in the result — SPENT)", "id": "killer-market-pulse--5"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "[Kit: Tokens: Midnight + Primary / sticky / outline / WhatsApp buttons] Rebuild the phone screen as one card per step on the Midnight theme, keeping the drama but on-brand: the headline card on top (serif, 22 px), the 358 px-wide drawing pad in the middle, and a sticky 'Lock my line →' button in the thumb zone. Move the 23-row market-depth grid behind a 'See the whole market ▸' sheet on phones. Nothing should need sideways scrolling at 390 px, and the headline, pad and button must fit in one 844 px screen.", "id": "killer-market-pulse--6"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Result rows + Personal best] End on an identity instead of 'Fresh Intern … Portfolio Manager'. Choose from four warm archetypes based on how they played: 'The Priced-In Pro' (caught most twists), 'The Optimist' (drew every good headline up), 'The Calm Reader' (mostly right on size) and 'The Headline Chaser'. Under it put three rows of the lessons they actually met, then the closing line: 'Headlines a long-term investor needed to act on today: 0.' (Benchmark #10 End on an identity, not a score — BitLife ribbons / Sorted quiz)", "id": "killer-market-pulse--7"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add a 'Headline of the day': the same headline for everyone each day, picked from the pool by date with no backend, plus a localStorage streak ('Pulse #23 · streak 4 🔥'). It turns a one-off game into a 20-second daily habit that suits a WhatsApp group. Keep the 10-headline game as the main mode. (Benchmark #19 A small daily ritual — Wordle / Duolingo streaks)", "id": "killer-market-pulse--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] The share is the coloured-square row plus the archetype: no money and no spoilers. Also offer a 1080×1920 Story card showing the best plot-twist chart (their line against the real one) under the headline. Give the page its own 1200×630 og:image reading 'Good news. Price falls. Why?' so a forwarded link previews this game rather than the generic games card. (Benchmark #2 Spoiler-free result card — Wordle grid; #4 Link preview as the cover)", "id": "killer-market-pulse--9"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "[Kit: Kicker + Title block] Rewrite the intro as a dare with no boot log and no rules list. Kicker '10 HEADLINES · 3 MINUTES', title 'Market *Pulse*', hook 'Good news, price falls. Bad news, price rises. Can you read the market's mood?', and one button, 'Read the first headline →', that opens straight onto headline 1. The rules become a three-second animated hint on the first drawing pad. (Benchmark #3 First tap is the first decision — SPENT; #5 A dare — SPENT 'PROVE IT')", "id": "killer-market-pulse--10"}], "key": "killer-market-pulse"}, {"slug": "killer-ipo-bonanza", "title": "IPO Bonanza — killer upgrade", "url": "https://games.investingformummies.com/ipo-bonanza", "file": "ipo-bonanza.html", "kind": "solo", "audience": "Mummies", "verdict": "IPO Bonanza becomes a 4-minute case file: one of three made-up IPOs is dealt at random (one pops, one flops, one goes nowhere). You swipe through the fine print, guess your odds, decide to apply or walk away, and only then learn how it listed. The screenshot moment is the lottery drum: seven application slips shuffle, one turns gold, and the screen says 'Not allotted, like 6 in 7 people who applied. Your money is back in 6 days.' Next to it, a two-timeline ending shows what happened to the path you didn't take.", "load": "", "share_idea": "📜 *IPO Bonanza* — I read the fine print on a hyped IPO, caught 3 of 4 red flags 🚩🚩🚩⬜ and decided to SKIP. Guess how it listed? Play the case 👇 games.investingformummies.com/ipo-bonanza _(made-up company built from real IPO patterns; education only, not advice)_", "share_moment": "Everyone's applying. The grey market says +20%. Would you? Read the fine print first. · 4 minutes", "items": [{"area": "Game design", "priority": "High", "effort": "L", "text": "Turn the single fixed case into three fictional case files dealt at random, each built from real Indian IPO patterns. 'TiffinTap Ltd' is a loss-making food app with heavy hype, and lists high. 'Sharma Pipes' is a profitable, boring maker with little hype, and lists flat then grows slowly. 'ZapPay Fintech' is priced at the top of its band and lists about 25% below issue. Because the endings differ, 'IPO = quick money' can no longer be learnt by replaying. The real 2021 Zomato story moves to a closing 'Based on a true story' card. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK; anti-pattern: rewarding short-term gambling)", "id": "killer-ipo-bonanza--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Make the apply-or-skip choice (already planned) pay off with a two-timeline ending. Whatever the player chose, the end screen shows both paths side by side: 'You: skipped, money free all week' next to 'If you'd applied: 1 in 7 chance of one lot, which listed −24%'. Both outcomes are always shown, so a good skip feels as rewarding as a lucky allotment. (Benchmark #15 Replay to see the difference — NGPF PAYBACK)", "id": "killer-ipo-bonanza--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Add two guesses before the reveals. Before the subscription bars climb: 'How many times over will ordinary investors bid?', on a slider from 1× to 50×. Before the lottery: 'Your chance of getting shares?', with chips '1 in 2 · 1 in 7 · 1 in 20'. The bars then count past the player's pin, and an off-by pill says 'You guessed 1 in 2, it was 1 in 7.' Retire the separate explanation paragraph, because the guess teaches it. (Benchmark #1 Guess first, then reveal — NYT 'You Draw It')", "id": "killer-ipo-bonanza--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Sound + Count-up] Make the lottery the drama beat. A full-screen drum of 7 paper slips (one is 'YOUR PAN') shuffles for 2 seconds with a ticking sound, and one slip lifts out and turns gold. If it's not theirs: 'Not allotted, like 6 in 7 applicants. Your ₹14,820 unblocks in 6 days', with the bank meter counting back up. If it is theirs: a short coin chime and no confetti, because the listing is still unknown. This replaces the random-letter scramble. (Benchmark #12 Juice — 'Juice it or lose it')", "id": "killer-ipo-bonanza--4"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "Turn the red-flag hunt into a swipe deck on phones. Each disclosure is one card with the original line on the front and the plain-English line under it. Swipe left for '🚩 Worries me' or right for '👍 Fine', or use two 56 px buttons. The card flips to show the one-line reason straight away, instead of waiting for a Submit at the end. Eight cards take about 60 seconds and fit on one screen, unlike today's long list of 13 px rows. (Benchmark #7 Teach in the result — SPENT)", "id": "killer-ipo-bonanza--5"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Top bar + Life bar / timeline] Compress the 8-stage stepper into 4 beats: Meet the company → Read the fine print → Bidding week → Listing day. Pin one live number to the top bar: 'In your bank: ₹2,50,000 · blocked: ₹14,820', which turns gold when money is blocked and mint when it comes back, so ASBA ('your money is held, not taken') is something the player watches happen rather than reads about. Put '4 min' on the start button. (Benchmark #6 One live number — SPENT; #13 Say how long it takes — Evolution of Trust)", "id": "killer-ipo-bonanza--6"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Tokens: Daylight + Glass card + gold hairline] Move from the neon trading terminal to a daylight 'case file' look built around the game's best asset, the newspaper public notice. Use a manila-folder header stamped 'RED HERRING', serif headings, flags that land as rubber-stamp animations, and the notice as the hero image of the 'Read the fine print' beat. One signature look, on brand, and calmer for mums.", "id": "killer-ipo-bonanza--7"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Result rows + Personal best] Replace the XP total and the 'Greater Fool' tier with an archetype plus one personal sentence. The archetypes: 'The Fine-Print Reader', 'The Patient Skipper', 'The Lottery Optimist', 'The Hype Follower (we've all been there)'. The sentence names what they did: 'You spotted 3 of 4 warning signs and walked away. It listed 24% below its price.' Below that, three rows at most, with the full recap behind 'See all 7 lessons ▸'. (Benchmark #10 End on an identity — BitLife / Sorted; #17 One personal sentence — NYT rent-or-buy)", "id": "killer-ipo-bonanza--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] Build the share from the flag row (🚩 for each flag caught, ⬜ for each missed), the decision (APPLIED or SKIPPED) and a teaser, 'Guess how it listed?', so it never spoils the ending or shows the player's money. Add a Story-size card in the case-file look and a page-specific og:image: 'Would you apply? Read the fine print first.' (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-ipo-bonanza--9"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "Finish with one real-world step: 'Before any real IPO, open its offer document on SEBI's website and read Risk Factor #1. That's the line you just learned to spot.' Add a link to SEBI's public-issues page. That turns the game into a habit, and it is pure education with no pick. (Benchmark #20 Local life events, one real-world action — SEBI Check QR game)", "id": "killer-ipo-bonanza--10"}], "key": "killer-ipo-bonanza"}, {"slug": "killer-my-first-trade", "title": "My First Trade — killer upgrade", "url": "https://games.investingformummies.com/my-first-trade", "file": "my-first-trade.html", "kind": "solo", "audience": "Mummies", "verdict": "My First Trade becomes 'nine years in four minutes, with one crash in the middle'. Every round you race a ghost, 'Do-Nothing Didi', who spread the same ₹2 lakh across all eight made-up companies and never touched it. In 2020 a big red 'Sell everything' button pulses while your portfolio counts down. The screenshot moment is the final chart: your line against Didi's, with a red dot reading 'You panicked here' or a gold dot reading 'You held here'.", "load": "", "share_idea": "📊 *My First Trade* — 9 years of investing in 4 minutes. 2016 🟢 2018 🟢 2020 🔴➡️💪 2023 🟢 2025 🏁 I held through the crash and finished as 'The Steady Holder'. Would you have panic-sold? 👇 games.investingformummies.com/my-first-trade _(made-up companies and prices, education only, not advice)_", "share_moment": "It's 2016. You have ₹2 lakh. Nine years, one crash. Will you hold your nerve? · 4 minutes", "items": [{"area": "Compliance", "priority": "High", "effort": "M", "text": "Replace the eight real listed companies with eight fictional ones that keep the same personalities and corporate actions: 'Chai & Co.' (steady FMCG, pays dividends), 'Bharat Energy & Telecom' (price-war disruptor), 'InfoBridge' (IT, buyback), 'Sunrise Bank' (risky lender that collapses), 'Sona Jewellers' (split), 'Trendy Retail' (bonus), 'Circuit Makers' (small electronics, rights issue) and 'Apna Mart' (supermarket). Label rounds by era ('a telecom price war', 'the 2020 crash') rather than by real tickers. This also removes the dated-history problem for good, because the prices no longer claim to be real.", "id": "killer-my-first-trade--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Top bar + Count-up + Money formatting] Add the ghost race. 'Do-Nothing Didi' puts the same ₹2,00,000 equally into all eight companies in 2016 and never trades. Her net worth sits beside yours in the top bar every round ('You ₹2.31 L · Didi ₹2.44 L'), counting up on each year flip. The question the game asks shifts from 'which stock?' to 'did all my clicking beat doing nothing?' State on screen: 'Didi's basket uses the same made-up prices as yours.' (Benchmark #6 One live number — SPENT; #8 Compress decades into minutes — NGPF STAX)", "id": "killer-my-first-trade--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Turn the 2020 crash into the game's big decision. The year opens with the portfolio counting down for 2 seconds, a soft heartbeat sound, and a big pulsing 'Sell everything' button beside a calm 'Hold' button. Pressing sell locks the loss and records a red dot on the timeline. Holding, or buying more, records a gold dot. Nothing scolds the player at the time; the cost shows up on the final chart. (Benchmark #14 Desperate lifelines with a hidden price — SPENT 'Need cash?')", "id": "killer-my-first-trade--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Feedback callout + off-by pill + \"your guess, put to work\"] Before each corporate action, ask one quick guess about the player's own holding. Split: 'Your 100 Sona shares become 500. Is your holding worth more, the same, or less?' Bonus, buyback and rights issue get the same treatment. Then reveal it with their real numbers ('Same: ₹42,000 before, ₹42,000 after'). Five guess-and-reveal beats teach the corporate actions better than the current 'Key lesson' boxes. (Benchmark #1 Guess first, then reveal — NYT 'You Draw It')", "id": "killer-my-first-trade--4"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "[Kit: Sound + Confetti] Give each event a small piece of juice. Dividend: coins drop into a gullak icon on the holding card, with a chime. Split: a scissor snip and the share count multiplying while the ₹ value stays still. Bonus: a gift box pops and the count doubles. Crash: cards shake once. Keep confetti for the final screen only, and only if the player beat or matched Didi. Turn all of it off under reduce-motion. (Benchmark #12 Juice — 'Juice it or lose it')", "id": "killer-my-first-trade--5"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Personal best] Build the payoff around the race chart: two lines from 2016 to 2025 (you in gold, Didi in mist), the crash decision marked with a red or gold dot, and one personal sentence ('You traded 14 times and finished ₹18,000 behind Didi, who traded zero times'). Then give an archetype: 'The Steady Holder', 'The Crash Bargain-Hunter', 'The Panic Seller (most people are)' or 'The All-In Gambler'. This replaces the 'Dixon gave 100×' lesson, which celebrates lucky picks. (Benchmark #10 End on an identity — BitLife; #17 One personal sentence — NYT rent-or-buy)", "id": "killer-my-first-trade--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Offer two specific replay buttons on the end screen: 'Replay without the panic button' and 'Replay as Didi: buy everything, then just watch'. Show the new ending next to the previous one, which gives a reason to play a second time, something the 'Play again — try a different strategy' button never does. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-my-first-trade--7"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Primary / sticky / outline / WhatsApp buttons] On phones, show each year as a newspaper front page: a flip animation from 2016 to 2018, one headline and one picture, then the 8-card company grid. Draw each fictional company as a painted 30 KB WebP logo tile in IFM style, not initials in coloured squares. Keep 'Done trading → 2018' sticky in the thumb zone, and show the year on the button so the player always knows how far they've come.", "id": "killer-my-first-trade--8"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] The share is the year-by-year emoji timeline plus the archetype, with no rupee figures. The Story card is the race chart with the red or gold crash dot and the line 'Would you have held?'. Give the page its own og:image: 'Nine years. One crash. Would you hold?' (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-my-first-trade--9"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "[Kit: Kicker + Title block] Rewrite the intro as a dare and cut the six-row 'What you'll experience' list, since the game will teach those as it goes. Kicker '9 YEARS · 4 MINUTES', title 'My first *trade*', hook 'It's 2016. You have ₹2 lakh. Nine years, one crash. Will you hold your nerve?', and button 'Open 2016 →'. Add the assumption line in the footer: 'Made-up companies and prices, shaped like real market years. Not a prediction.' (Benchmark #5 A dare — SPENT; #13 Say how long it takes)", "id": "killer-my-first-trade--10"}], "key": "killer-my-first-trade"}, {"slug": "killer-money-map", "title": "Money Map — killer upgrade", "url": "https://games.investingformummies.com/money-map", "file": "teen-budget.html", "kind": "solo", "audience": "Gen Next", "verdict": "Turn the blank allowance form into 'Survive the Month': you get ₹2,500 of pocket money on day 1, and 30 days of real teen life (a friend's birthday, a cracked phone screen, a Zomato craving, a concert drop) fly at you one tap at a time while a big balance number falls in real time. The moment people forward is the end card: a coloured strip of emoji blocks showing where the month went, with a money-personality title like 'The Jar Guardian' or 'The Weekend Spender' on top and no rupee amounts. The current tracker stays as the 'Track my real month' tool you unlock after playing.", "load": "", "share_idea": "I survived the month on Money Map 🫙 🫙🍕🍕🎮🎬🚌📚🫙🫙🫙 — I'm *The Jar Guardian*. Think you can last 30 days on ₹2,500 of pocket money without going broke? 👇 https://games.investingformummies.com/money-map  (₹2,500 is the game's pocket money, not mine)", "share_moment": "₹2,500 pocket money. 30 days. One cracked phone screen. Can you make it to the 1st with something left in the jar?", "items": [{"area": "Game design", "priority": "High", "effort": "L", "text": "Replace the empty form with a 30-day story mode, 'Survive the Month'. Start the player with ₹2,500, then show about 12 event cards, one at a time ('Day 4: Riya's birthday. Gift? ₹0 card / ₹300 gift / ₹800 gift', 'Day 11: your screen cracks, ₹1,200 to fix or live with it', 'Day 19: concert tickets drop, ₹1,500'). Every tap moves the money right away, so the player feels each choice instead of filling in boxes. Keep the current tracker as a 'Now track your real month →' screen at the end. (Benchmark #8 Compress decades into minutes — NGPF STAX; #20 Local life events — Visa Financial Football)", "id": "killer-money-map--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Count-up] Pin one huge 'Left for the month' number and a 30-day calendar strip to the top of the screen. The number rolls down after each card, turns coral when it falls below ₹500, and the calendar shows how many days are still left before the next pocket money. That gap between the days left and the money left is the lesson. (Benchmark #6 One live number you can't stop watching — SPENT)", "id": "killer-money-map--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Feedback callout + off-by pill] Ask for one guess before the month starts: 'How much do you spend on snacks and cold coffee in a month? Drag to guess.' At the end, show the real total from their own choices against the guess, for example 'You guessed ₹300. You actually spent ₹950 — ₹650 more than you thought.' Most teens underestimate, and that surprise is the take-away. (Benchmark #1 Guess first, then reveal — NYT 'You Draw It')", "id": "killer-money-map--3"}, {"area": "Game design", "priority": "Med", "effort": "M", "text": "Add one tempting lifeline button that is always on screen, 'Borrow from Didi 🙏' (₹500 now), which quietly takes ₹600 back on day 28. A 'Buy now, pay later' card on day 15 does the same with a ₹100 late fee. Explain in one line when it bites: 'Borrowing feels free on the day and costs you at the end of the month.' (Benchmark #14 Desperate lifelines with a hidden price — SPENT 'Need cash?')", "id": "killer-money-map--4"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Personal best] End on an identity, not a percentage: 'The Jar Guardian' (finished with savings), 'The Weekend Spender' (fine until day 20, then broke), 'The Treat-Yo-Self Legend' (spent it all on fun), 'The Planner' (paid the jar first on day 1). Under it, three rupee rows: 'Saved ₹400', 'Biggest leak: food, ₹950', 'Days broke: 0', plus one doable next step ('Put ₹250 in the jar on the day the money comes in, before anything else'). Store the best finish on the phone as '🏆 Your best: ₹400 left'. (Benchmark #10 End on an identity, not a score — BitLife ribbons)", "id": "killer-money-map--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add a specific replay button: 'Replay — jar first'. It locks ₹250 into the savings jar on day 1 and replays the same 30 days, then shows both endings side by side ('Run 1: broke on day 24 · Run 2: made it with ₹310'). Paying yourself first is the main lesson here, so let the player see the difference it makes. (Benchmark #15 Same game, one variable changed — NGPF PAYBACK)", "id": "killer-money-map--6"}, {"area": "Copy", "priority": "High", "effort": "S", "text": "[Kit: Kicker + Title block] Rewrite the first screen to the new shape. Kicker: 'POCKET MONEY · 3 MINUTES'. Title: 'Survive the *month*'. Hook: '₹2,500. 30 days. Your friends have plans.' One button: 'Start day 1 →'. Talk only in rupees all the way through ('You spent ₹950 on food', not '38% spent'), and turn the 50/30/20 card into plain words: 'A simple split: about half on must-haves, a bit less on fun, and some saved first.' (Benchmark #3 First tap is the first decision — SPENT; #5 A dare — SPENT 'PROVE IT')", "id": "killer-money-map--7"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Tokens: Midnight + Glass card + gold hairline + Sound] Keep the bright teen energy, but move it onto IFM's midnight tokens. Event cards become glass cards with a gold hairline and a painted icon (≤30 KB WebP) instead of a flat emoji tile. Add sound: a coin chime when money goes into the jar, a soft thud when the balance drops below ₹500, and a short phone buzz (navigator.vibrate) when you go broke, with the mute button always visible. Choices sit as two or three 56 px buttons in the thumb zone so the month can be played one-handed. (Benchmark #12 Juice — 'Juice it or lose it')", "id": "killer-money-map--8"}, {"area": "Share", "priority": "High", "effort": "M", "text": "[Kit: Share image card + WhatsApp share (text)] Make the end card a Wordle-style strip of 10 emoji blocks, each block standing for one tenth of the month's money (🫙 jar, 🍕 food, 🎮 games, 🎬 fun, 🚌 travel), with the archetype title above it. The share shows the shape of the month and never the rupees. Send it as a 1080×1920 Story image through the phone's share sheet, and as WhatsApp text with the game link. Give the page its own 1200×630 link preview showing the dare 'Could you survive a month on ₹2,500?'. (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-money-map--9"}, {"area": "Conversion", "priority": "Low", "effort": "S", "text": "After the result, add one parent-facing line under the share button: 'Parents: this is week 1 of our Gen Next money course. See batches →'. Also add a 'Play it as a parent: could you survive on your teen's pocket money?' link that reopens the same game, because a parent-and-teen challenge is the most natural forward in a family WhatsApp group. (Benchmark #5 A dare that challenges the player's self-image — SPENT)", "id": "killer-money-map--10"}], "key": "killer-money-map"}, {"slug": "killer-lifestyle-time-machine", "title": "Lifestyle Time Machine — killer upgrade", "url": "https://games.investingformummies.com/lifestyle-time-machine", "file": "lifestyle-time-machine.html", "kind": "solo", "audience": "Gen Next", "verdict": "Make it a 3-minute solo phone game that still runs as a class game: build your ₹15 lakh dream life in 2026, choose how much to set aside for 'future you', then pull a time-machine lever and watch 2036 prices eat your list, card by card, as Japan Trip becomes Lonavala Weekend and the Dream Car becomes a Second-hand Scooty. The moment people forward is the 'Your 2036 life' receipt: a stack of before-and-after downgrades signed 'Thanks, inflation 🙃'. The second card next to it shows what the saver version of you bought back.", "load": "", "share_idea": "My dream life, 10 years later 🕰️ ✈️→🏕️ 🚗→🛵 👜→👡 — inflation took 3 of my 5 dreams. Can yours survive the time machine? 👇 https://games.investingformummies.com/lifestyle-time-machine  (game assumes prices rise about 7% a year; savings growth is an illustration, not a promise)", "share_moment": "You've got ₹15 lakh and a dream list. In 2036 the same list costs almost double. What survives?", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Solo-on-phone fallback] Make solo the default. A phone opening the link skips the class-names screen and asks one question, 'What should we call you?' (optional), then goes straight into building a dream list. Keep the current six-name class setup behind a small link, 'Teacher? Run it for a class →', just as The Wealth Hack detects a phone visitor and gives them a solo path. (Benchmark #3 First tap is the first decision — Wordle, SPENT)", "id": "killer-lifestyle-time-machine--1"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Money input] Make saving an active choice instead of whatever is left over. After picking dreams, the player drags a 'Future-you jar' slider ('Set aside ₹0 … ₹5 lakh — it comes out of your dream budget'). Every rupee set aside visibly greys out a dream card, so the trade-off is felt on day one and the payoff round has something real to pay off. Phrase it for first-timers: 'This money goes into an investment and sits there for 10 years.'", "id": "killer-lifestyle-time-machine--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Feedback callout + off-by pill] Before the time jump, ask for one guess: 'Your ₹2.5 lakh Japan trip — what will it cost in 2036? Drag to guess.' Then reveal ₹4.9 lakh rising over the guess, with an off-by pill such as 'You guessed ₹3 lakh — ₹1.9 lakh short'. One line of plain-English explanation follows: 'Prices went up about 7% every year. That's called inflation: the same thing costs more later.' (Benchmark #1 Guess first, then reveal — NYT 'You Draw It')", "id": "killer-lifestyle-time-machine--3"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Count-up + Life bar / timeline + Sound] Turn the jump into a lever moment. Show a big year counter spinning 2026 → 2031 → 2036 along the life-bar timeline while every price on the list counts up live (₹2.5L … ₹3.5L … ₹4.9L) and the budget bar overflows in coral. Each forced cut flips the card into its downgrade (keep the excellent 'Lonavala Weekend' and 'Fastrack (₹999)' gags) with a whoosh-and-thud sound built from the kit's synthesised sounds. (Benchmark #8 Compress decades into minutes — NGPF STAX, BitLife; #12 Juice — 'Juice it or lose it')", "id": "killer-lifestyle-time-machine--4"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Assumption footer] End on two futures side by side. Left: 'Spend-it-all you, 2036' (the downgrade list). Right: 'Future-you-jar you, 2036', where the money set aside has grown and buys back two of the lost dreams. Use one personal sentence as the headline, for example 'Setting aside ₹3 lakh in 2026 would buy back your Japan trip in 2036.' Print the growth assumption on the card ('if the investment grew about 10% a year; real returns go up and down and are not guaranteed'). (Benchmark #17 One personal sentence as the answer — NYT rent-or-buy; #18 Show your assumptions)", "id": "killer-lifestyle-time-machine--5"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "Add one replay button that changes one thing: 'Replay with ₹3 lakh in the jar'. It keeps the same dream list, saves ₹3 lakh, and shows the two endings next to each other ('Run 1: kept 2 of 5 dreams · Run 2: kept 4 of 5'). End with a small 2-slider sandbox (amount set aside, years in the time machine) that redraws the 2036 list live. (Benchmark #15 Replay one variable — NGPF PAYBACK; #16 End with a sandbox — Parable of the Polygons)", "id": "killer-lifestyle-time-machine--6"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Result rows] Give the player an archetype to keep: 'The Time Traveller' (kept every dream thanks to the jar), 'The YOLO Dreamer' (spent it all, lost the most to inflation), 'The Balanced Planner' (cut one dream, saved, bought it back). Show the title on the receipt above the downgrades, with one warm next step ('Next birthday money: put a slice in the jar before you spend'). (Benchmark #10 End on an identity, not a score — BitLife, How Bad Is Your Spotify)", "id": "killer-lifestyle-time-machine--7"}, {"area": "Mobile", "priority": "High", "effort": "M", "text": "Rebuild the phone layout. Dream cards go in a 2-column grid with a sticky budget strip at the top ('₹6.5L left of ₹15L') and a sticky 'Lock my dream life →' button in the thumb zone. The over-budget warning lives inside the budget strip instead of floating over the cards, and the downgrade flip plays in place on the card itself, not as a full-screen overlay. A solo run should need no scrolling past the first screen to understand what to do. (Benchmark #13 Say how long it takes, then show progress — The Evolution of Trust)", "id": "killer-lifestyle-time-machine--8"}, {"area": "Share", "priority": "High", "effort": "M", "text": "[Kit: Share image card + WhatsApp share (text)] Make the share card a 9:16 'Your 2036 life' receipt: kicker 'TIME MACHINE · 2026 → 2036', the archetype, then each dream as 'emoji → downgrade emoji' with no rupee amounts, and the line 'Thanks, inflation 🙃'. Share it through the native share sheet (image plus text) with a wa.me fallback, and give the page its own link preview, 'Will your dream life survive 2036?'. (Benchmark #2 Spoiler-free result card — Spotify Wrapped 9:16; #4 Link preview as the cover)", "id": "killer-lifestyle-time-machine--9"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "[Kit: Kicker + Title block] Rewrite every round banner for first-timers in rupees. Use 'Your ₹2.5L trip now costs ₹3.5L' instead of 'Prices have gone up'. Make 'inflation' a tappable chip ('Inflation: prices slowly going up every year, so the same money buys less'). Retire 'corpus' and 'purchasing power' in favour of 'your savings pot' and 'what your money can buy'. Replace brand-name luxury items (Louis Vuitton, Rolex, Disney World) with generic ones ('Designer bag', 'Luxury watch', 'Theme-park trip abroad') so the game shows no brand as a goal. (Benchmark #7 Teach in the result, not before the choice — SPENT)", "id": "killer-lifestyle-time-machine--10"}], "key": "killer-lifestyle-time-machine"}, {"slug": "killer-need-want-value", "title": "Need. Want. Value. — killer upgrade", "url": "https://games.investingformummies.com/need-want-value", "file": "nwv.html", "kind": "solo", "audience": "Gen Next", "verdict": "Turn the 11-card quiz into a fast 10-card swipe sort where every card shows a real price and its 'hours of work' cost, so a ₹15,000 sneaker drop reads as '75 hours at a ₹200-an-hour job'. Add a 'You vs Mum' mode: the teen and a parent sort the same cards on one phone, then the game reveals where they disagree. The moment people forward is that disagreement card, 'We disagreed on 4 of 10 — Netflix started a family fight 😅', or the solo money-personality badge ('The Value Hunter').", "load": "", "share_idea": "Me vs Mum on Need. Want. Value. 🛡️✨📈 We agreed on 6 of 10. Netflix = WANT says Mum, NEED says me 😅 Sort the same 10 things and see if your family agrees 👇 https://games.investingformummies.com/need-want-value", "share_moment": "Is a ₹1,20,000 gaming laptop a need? Your mum has an opinion. Sort 10 things, then compare.", "items": [{"area": "Game design", "priority": "High", "effort": "M", "text": "Make the core loop a swipe sort. Each card shows the item, a real price and a short context line ('Phone recharge ₹299/month', 'Limited-drop sneakers ₹15,000', 'Coaching classes ₹4,000/month'). Swipe left for WANT, right for NEED and up for VALUE, with the three buttons kept underneath for anyone who prefers tapping. Draw 10 cards from a pool of about 30 Indian-teen items, so a round takes about 90 seconds and the next one is different. (Benchmark #3 First tap is the first decision — Wordle)", "id": "killer-need-want-value--1"}, {"area": "Game design", "priority": "High", "effort": "S", "text": "[Kit: Money formatting] Turn every price into 'hours of work' on the card: 'At ₹200 an hour of part-time work, these sneakers = 75 hours'. After the sort, ask one guess-first question on a big-ticket item: 'Your ₹199-a-month streaming subscription — what does it cost over a year?' Drag to guess, then reveal ₹2,388. This is the one number a teen remembers. State the ₹200-an-hour assumption on screen. (Benchmark #1 Guess first, then reveal — NYT 'You Draw It'; #17 One personal sentence)", "id": "killer-need-want-value--2"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "Add a 'You vs Mum' (or 'You vs your friend') mode that works on one phone with no backend. Player 1 sorts 10 cards, passes the phone, and Player 2 sorts the same 10. The reveal walks through the disagreements one by one ('You: NEED · Mum: WANT — Netflix'), each with the existing 'discuss' prompt as the debate starter. The discuss prompts are the best writing in the game, and this gives them a real person to argue with. (Benchmark #11 Compare me with everyone else — NYT crowd overlay, done locally)", "id": "killer-need-want-value--3"}, {"area": "Game design", "priority": "Med", "effort": "S", "text": "[Kit: Feedback callout + off-by pill] Keep 'it can be both' as the twist, but make it feel like a reward. When an item is genuinely two things, the card splits in half with both colours and a '2-in-1 card!' tag, and a correct pick earns a bonus. Feedback stays at two sentences or fewer with the rupee figure in bold: 'Footwear is a NEED. A *₹15,000* limited drop is a WANT.' (Benchmark #7 Teach in the result, not before the choice — SPENT)", "id": "killer-need-want-value--4"}, {"area": "Game design", "priority": "High", "effort": "M", "text": "[Kit: Result rows + Personal best] Replace 'Done! 4/11' with a money personality based on the pattern of choices: 'The Value Hunter' (spots future-you spending), 'The Honest Wanter' (calls fun spending what it is), 'The Need Stretcher' (calls most things needs, which most people do). Show three rows underneath: 'You called 6 things NEEDs', 'Most hours of work: sneakers, 75 hrs', 'Your tricky one: gym membership'. Add one doable next step: 'Before your next WANT over ₹1,000, wait 3 days.' (Benchmark #10 End on an identity, not a score — Sorted money-personality quiz)", "id": "killer-need-want-value--5"}, {"area": "Game design", "priority": "Low", "effort": "S", "text": "Add a 'Paisa Sort of the Day': five cards picked by today's date, so everyone gets the same five, with a streak counter saved on the phone. The share line works like Wordle ('Need. Want. Value. #42 🛡️✨📈✨🛡️ · streak 3'), which gives teens a reason to come back and compare tomorrow. (Benchmark #19 A small daily ritual for return visits — Wordle, Duolingo)", "id": "killer-need-want-value--6"}, {"area": "Layout", "priority": "Med", "effort": "M", "text": "[Kit: Tokens: Midnight + Glass card + gold hairline + Sound] Swap emoji-as-art for one illustrated card per item (≤30 KB WebP, same painted style as Slash the Scam's medallions). Card feedback gets juice: the card flies into its bucket, a rising chime plays for a correct sort, a soft low thud for 'not quite', and the bucket count ticks up. Keep the sort buttons 64 px tall in the thumb zone, and keep the whole card plus buttons inside one 390×844 screen with no scrolling. (Benchmark #12 Juice — 'Juice it or lose it')", "id": "killer-need-want-value--7"}, {"area": "Share", "priority": "High", "effort": "S", "text": "[Kit: WhatsApp share (text) + Share image card] Two shares. Solo: the personality badge plus the 10-emoji sort strip (🛡️✨📈…), with no answers spoiled. Duel: 'We agreed on 6 of 10 — Netflix started a fight', which is the natural forward into a family group. Both link straight back to the game, and the page gets its own preview image asking 'Is a ₹1.2 lakh gaming laptop a NEED?'. (Benchmark #2 Spoiler-free result card — Wordle; #4 Link preview as the cover)", "id": "killer-need-want-value--8"}, {"area": "Copy", "priority": "Med", "effort": "S", "text": "[Kit: Kicker + Title block] New first screen. Kicker: '10 THINGS · 90 SECONDS'. Title: 'Need. Want. *Value.*' Hook: 'Is a ₹1,20,000 gaming laptop a need? Sort 10 things — then argue with your mum.' Two buttons: 'Play solo →' and 'Me vs Mum →'. Define VALUE in plain words on the first card ('VALUE = spending that keeps paying you back, like a course that gets you a better job'), and keep every example Indian (cutting chai, Zomato order, coaching class, bike EMI, concert ticket). (Benchmark #5 A dare that challenges the player's self-image — SPENT; #20 Local life events)", "id": "killer-need-want-value--9"}], "key": "killer-need-want-value"}, {"slug": "killer-swipe-right-sip", "title": "Swipe Right on SIP — killer upgrade", "url": "https://games.investingformummies.com/swipe-right-sip", "file": "swipe-right-sip.html", "kind": "solo", "audience": "Gen Next", "verdict": "Keep the hilarious finfluencer feed, and add a crunchy 'receipts' reveal: before each reveal the player guesses whether their ₹2,000 grew or shrank. The end is a 'Likes vs Results' chart where the 120K-like posts sit at the bottom and the 47-like index-fund post sits at the top. That chart is the moment people forward, along with a Wordle-style row of 💚🚩 squares and the title 'BORING GENIUS'. A same-for-everyone 'Today's Feed' and a bonus round where you write the scam post yourself give a reason to play again and challenge friends.", "load": "", "share_idea": "Swipe Right on SIP — Today's Feed #12 🚩 💚🚩🚩💚⬜💚🚩⬜💚⬜ Red-flag radar 5/5 · BORING GENIUS 😴📈 Your feed is lying to you. Can you spot all the red flags? 👇 https://games.investingformummies.com/swipe-right-sip  (made-up funds and results to show the idea)", "share_moment": "Your first salary just dropped. So did 10 'investment tips'. Swipe right on the keepers. Dodge the red flags.", "items": [{"area": "Game design", "priority": "High", "effort": "S", "text": "[Kit: Feedback callout + off-by pill] Add guess-then-reveal to the receipts. Before each card's 5-years-later result, the player taps 'Grew 📈' or 'Shrank 📉' for that ₹2,000, then the number rolls out. Score this guess separately as 'Gut check: 7/10'. The surprise that the 47-like post won and the 120K-like post went to ₹0 lands harder when the player bet on it first. (Benchmark #1 Guess first, then reveal — NYT 'You Draw It')", "id": "killer-swipe-right-sip--1"}
