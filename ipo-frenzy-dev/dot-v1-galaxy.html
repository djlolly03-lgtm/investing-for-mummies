<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>The Dot Moment</title>
<!--
  IPO Frenzy — "The Dot Moment" (v1, galaxy art direction)
  Standalone classroom projector animation. Teacher-paced: SPACE or click advances.
  Scene A (frozen bid bars) -> collapse -> Scene B (the dot) -> Scene C (the flood).
  Vanilla JS + Canvas 2D. No libraries. No build step.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#1a3a5c; --teal:#2a9d8f; --mint:#bde9e4; --gold:#c9a84c; --cream:#f7faf9;
    --bg:#04070d;
  }
  html,body{
    margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;
    cursor:default;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;}

  .ov{position:fixed;left:0;right:0;text-align:center;opacity:0;pointer-events:none;}
  .ov.show{opacity:1;}

  #capB{
    bottom:27%;
    font-family:Lora,serif;font-weight:500;
    font-size:clamp(18px,2.1vw,30px);
    color:var(--cream);letter-spacing:.02em;
    transition:opacity 1.6s ease;
  }
  #capB.show{opacity:.92;}
  #capB.dim{opacity:.26;transition:opacity 2.8s ease;}

  #counterWrap{top:9%;transition:opacity 1.1s ease;}
  #counterWrap:not(.show){transition-duration:.4s;}
  #counterLabel{
    font-family:Nunito,sans-serif;font-weight:700;
    font-size:clamp(11px,.95vw,15px);letter-spacing:.34em;
    color:rgba(189,233,228,.55);margin-bottom:clamp(6px,.9vh,14px);
  }
  #counterValue{
    font-family:Nunito,sans-serif;font-weight:900;
    font-size:clamp(44px,6.2vw,104px);line-height:1;
    color:var(--cream);
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
    text-shadow:0 0 36px rgba(42,157,143,.25);
  }
  #counterValue .suffix{
    font-size:.34em;font-weight:800;letter-spacing:.2em;
    color:rgba(189,233,228,.8);margin-left:.4em;
  }

  #closing{
    bottom:6.5%;
    font-family:Lora,serif;font-style:italic;font-weight:500;
    font-size:clamp(16px,1.6vw,26px);
    color:rgba(247,250,249,.78);
    transition:opacity 2.4s ease;
  }
  #closing:not(.show){transition-duration:.5s;}

  #hint{
    position:fixed;right:30px;bottom:24px;
    font-family:Nunito,sans-serif;font-weight:700;font-size:11px;
    letter-spacing:.32em;color:var(--mint);
    opacity:0;transition:opacity 1.2s ease;pointer-events:none;
  }
  #hint.show{opacity:.4;}

  #tag{
    position:fixed;left:20px;bottom:18px;
    font-family:Nunito,sans-serif;font-weight:800;font-size:13px;
    letter-spacing:.24em;color:var(--cream);opacity:.09;pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="counterWrap" class="ov">
  <div id="counterLabel">TOTAL BIDS RECEIVED · JIO PLATFORMS IPO</div>
  <div id="counterValue"><span id="cv">₹0</span><span class="suffix">CRORE</span></div>
</div>
<div id="capB" class="ov">₹82.5 LAKH — everything this room applied</div>
<div id="closing" class="ov">₹82.5 Lakh of ₹4,90,414 Crore</div>
<div id="hint">press SPACE</div>
<div id="tag">A</div>

<script>
(function(){
'use strict';

/* ---------------- constants ---------------- */
const COL = { navy:'#1a3a5c', teal:'#2a9d8f', mint:'#bde9e4', gold:'#c9a84c', cream:'#f7faf9' };
const TOTAL_CR   = 490414;  // national bids: ₹4,90,414 Crore
const STAR_COUNT = 4904;    // one star = ₹100 Crore
const COLLAPSE_D = 2.2;     // s — bars -> dot
const SPAWN_D    = 4.3;     // s — star cascade window
const STAR_FADE  = 0.55;    // s — per-star materialise
const COUNT_D    = 4.8;     // s — counter spin-up
const SETTLE     = 5.4;     // s — scene C counts as settled
const DOT_R      = 7.5;     // px — the classroom dot, base radius

/* ---------------- canvas ---------------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W=0,H=0,CX=0,CY=0,DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
}
window.addEventListener('resize', resize);
resize();

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.max(0, Math.min(r, w/2, h/2));
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
  };
}

/* ---------------- helpers ---------------- */
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp01=t=>t<0?0:t>1?1:t;
const easeInCubic=t=>t*t*t;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOutCubic=t=>t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutQuint=t=>1-Math.pow(1-t,5);

function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(h1,h2,t){
  const a=hexRGB(h1), b=hexRGB(h2);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';
}
function formatIndian(n){
  let s=String(Math.max(0,Math.floor(n)));
  if(s.length<=3) return s;
  const last3=s.slice(-3);
  let rest=s.slice(0,-3);
  const parts=[];
  while(rest.length>2){ parts.unshift(rest.slice(-2)); rest=rest.slice(0,-2); }
  if(rest) parts.unshift(rest);
  return parts.join(',')+','+last3;
}

/* ---------------- DOM refs ---------------- */
const elCounterWrap=document.getElementById('counterWrap');
const elCV=document.getElementById('cv');
const elCapB=document.getElementById('capB');
const elClosing=document.getElementById('closing');
const elHint=document.getElementById('hint');
const elTag=document.getElementById('tag');

/* ---------------- state machine ---------------- */
/* 'A' -> 'COLLAPSE' (auto-runs, ignores input) -> 'B' -> 'C' (flood, then holds) -> 'A' */
let state='A';
let t0=0, now=0, tState=0;
let cSettled=false;
let pulseStart=0;

function enter(s){
  state=s; t0=now; tState=0;
  if(s==='A'){ stars.length=0; cSettled=false; elCV.textContent='₹0'; }
  if(s==='B'){ pulseStart=now; }
  if(s==='C'){ genStars(); cSettled=false; }
}
function advance(){
  if(state==='A') enter('COLLAPSE');
  else if(state==='B') enter('C');
  else if(state==='C' && cSettled) enter('A');
  /* COLLAPSE and un-settled C ignore input */
}
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) advance(); }
});
window.addEventListener('pointerdown', ()=>advance());

/* ---------------- star field (scene C) ---------------- */
const stars=[];
let sprites=null;

function makeSprite(r,g,b){
  const s=document.createElement('canvas'); s.width=s.height=64;
  const c=s.getContext('2d');
  const gr=c.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,    'rgba('+r+','+g+','+b+',1)');
  gr.addColorStop(0.12, 'rgba('+r+','+g+','+b+',0.9)');
  gr.addColorStop(0.35, 'rgba('+r+','+g+','+b+',0.22)');
  gr.addColorStop(1,    'rgba('+r+','+g+','+b+',0)');
  c.fillStyle=gr; c.fillRect(0,0,64,64);
  return s;
}
function initSprites(){
  sprites=[
    makeSprite(238,246,249),  // cold white
    makeSprite(189,233,228),  // mint
    makeSprite(42,157,143)    // teal
  ];
}
function haloRadius(){ return Math.max(70, Math.min(W,H)*0.075); }

function genStars(){
  stars.length=0;
  const hr=haloRadius()*1.2;
  for(let i=0;i<STAR_COUNT;i++){
    let nx=0.5, ny=0.5;
    for(let k=0;k<24;k++){
      nx=Math.random(); ny=Math.random();
      if(Math.hypot(nx*W-CX, ny*H-CY) > hr) break;
    }
    const depth=Math.random();
    const u=Math.random();
    stars.push({
      nx, ny, depth,
      /* cumulative spawn count grows ~t^3: a few, then dozens, then hundreds per second */
      spawn: SPAWN_D*Math.cbrt(Math.random()),
      size: 0.9 + Math.pow(depth,2.4)*5.0,
      a0:   0.18 + 0.55*Math.pow(depth,1.3),
      tw:   0.5 + Math.random()*1.5,
      ph:   Math.random()*Math.PI*2,
      dx:  (Math.random()-0.5)*1.6,
      dy:  (Math.random()-0.5)*1.6,
      si:  u<0.68 ? 0 : (u<0.9 ? 1 : 2)
    });
  }
}

function drawStars(t){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const drift=Math.min(t,60);
  for(let i=0;i<stars.length;i++){
    const s=stars[i];
    if(t<s.spawn) continue;
    const ap=clamp01((t-s.spawn)/STAR_FADE);
    const e=easeOutCubic(ap);
    const par=0.25+0.75*s.depth;
    const x=s.nx*W + s.dx*drift*0.4*par + Math.sin(now*0.06+s.ph)*2.5*s.depth;
    const y=s.ny*H + s.dy*drift*0.4*par + Math.cos(now*0.05+s.ph)*2.0*s.depth;
    const twk=0.78+0.22*Math.sin(now*s.tw+s.ph);
    let al=s.a0*twk*e;
    if(ap<1) al=Math.min(1, al+(1-ap)*0.5);  /* small birth flash */
    const sz=s.size*(0.65+0.35*e)*4;
    ctx.globalAlpha=al;
    ctx.drawImage(sprites[s.si], x-sz/2, y-sz/2, sz, sz);
  }
  ctx.restore();
}

/* ---------------- shared painting ---------------- */
function drawBG(haze){
  ctx.fillStyle='#04070d';
  ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(CX,CY*0.92,0,CX,CY,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(26,58,92,'+(0.20*haze).toFixed(3)+')');
  g.addColorStop(1,'rgba(26,58,92,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}
function drawVignette(a){
  if(a<=0) return;
  const g=ctx.createRadialGradient(CX,CY,Math.min(W,H)*0.25,CX,CY,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,'+(0.55*a).toFixed(3)+')');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}
function drawDot(x,y,r,glowK,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  const gR=r*glowK;
  let g=ctx.createRadialGradient(x,y,0,x,y,gR);
  g.addColorStop(0,'rgba(255,233,170,0.5)');
  g.addColorStop(0.35,'rgba(201,168,76,0.22)');
  g.addColorStop(1,'rgba(201,168,76,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,gR,0,Math.PI*2); ctx.fill();
  g=ctx.createRadialGradient(x-r*0.25,y-r*0.25,0,x,y,r);
  g.addColorStop(0,'#fff3d0');
  g.addColorStop(0.55,'#e9ca72');
  g.addColorStop(1,'#c9a84c');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function dotRadius(t){ return DOT_R*(1+0.13*Math.sin(t*Math.PI*2/2.1)); }

/* ---------------- scene A: frozen bars ---------------- */
function barLayout(){
  const blockW=Math.min(W*0.56, 860);
  const left=CX-blockW/2;
  const barH=Math.max(30, Math.min(50, H*0.046));
  const lh=Math.max(24, barH*0.62);
  const rowH=lh+barH;
  const gap=barH*0.95;
  const totalGap=barH*1.25;
  const blockH=rowH*2+gap+totalGap+44;
  const top=CY-blockH/2;
  const SCALE=6000000;  // bar track represents ₹60,00,000
  function mk(y, amt, col, label, amtStr){
    return { labelBase:y+lh-10, barY:y+lh, fillW:blockW*(amt/SCALE), col, label, amtStr };
  }
  return {
    blockW, left, barH, lh, top,
    retail: mk(top,           3000000, COL.teal, 'RETAIL', '₹30,00,000'),
    hni:    mk(top+rowH+gap,  5250000, COL.gold, 'HNI',    '₹52,50,000'),
    dividerY:  top+rowH*2+gap+totalGap*0.45,
    totalBase: top+rowH*2+gap+totalGap+30
  };
}

function drawTrack(L,row,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.beginPath();
  ctx.roundRect(L.left,row.barY,L.blockW,L.barH,L.barH*0.24);
  ctx.fillStyle='rgba(247,250,249,0.045)';
  ctx.fill();
  ctx.strokeStyle='rgba(189,233,228,0.10)';
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.restore();
}
function drawFill(L,row,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(L.left,0,L.left+row.fillW,0);
  g.addColorStop(0, mix(row.col,'#000000',0.28));
  g.addColorStop(1, row.col);
  ctx.beginPath();
  ctx.roundRect(L.left,row.barY,row.fillW,L.barH,L.barH*0.24);
  ctx.fillStyle=g;
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(L.left,row.barY,row.fillW,L.barH*0.45,L.barH*0.24);
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fill();
  ctx.restore();
}

function drawSceneAText(L,alpha){
  if(alpha<=0) return;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.textBaseline='alphabetic';
  const small=Math.round(Math.max(12, L.barH*0.34));
  const amtF=Math.round(Math.max(16, L.barH*0.52));

  [L.retail, L.hni].forEach(function(row){
    ctx.letterSpacing='0.22em';
    ctx.font='700 '+small+'px Nunito, sans-serif';
    ctx.fillStyle='rgba(189,233,228,0.72)';
    ctx.textAlign='left';
    ctx.fillText(row.label, L.left+2, row.labelBase);
    ctx.letterSpacing='0.02em';
    ctx.font='800 '+amtF+'px Nunito, sans-serif';
    ctx.fillStyle=COL.cream;
    ctx.textAlign='right';
    ctx.fillText(row.amtStr, L.left+L.blockW, row.labelBase+1);
  });

  ctx.strokeStyle='rgba(189,233,228,0.14)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(L.left, L.dividerY);
  ctx.lineTo(L.left+L.blockW, L.dividerY);
  ctx.stroke();

  ctx.letterSpacing='0.26em';
  ctx.font='700 '+small+'px Nunito, sans-serif';
  ctx.fillStyle='rgba(189,233,228,0.6)';
  ctx.textAlign='left';
  ctx.fillText('TOTAL', L.left+2, L.totalBase);
  ctx.letterSpacing='0.02em';
  ctx.font='900 '+Math.round(amtF*1.35)+'px Nunito, sans-serif';
  ctx.fillStyle=COL.gold;
  ctx.textAlign='right';
  ctx.fillText('₹82,50,000', L.left+L.blockW, L.totalBase+2);

  /* IPO CLOSED stamp */
  ctx.letterSpacing='0.3em';
  ctx.font='900 '+Math.round(small*1.12)+'px Nunito, sans-serif';
  const txt='IPO CLOSED';
  const tw=ctx.measureText(txt).width;
  const bw=tw+34, bh=small*1.1+22;
  ctx.translate(L.left+L.blockW - tw/2 - 8, L.top - Math.max(50, L.barH*1.4));
  ctx.rotate(-0.12);
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.strokeStyle='rgba(201,168,76,0.7)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.roundRect(-bw/2,-bh/2,bw,bh,6);
  ctx.stroke();
  ctx.fillStyle='rgba(201,168,76,0.85)';
  ctx.fillText(txt, 4, 1);
  ctx.restore();
}

function renderA(){
  drawBG(1);
  drawVignette(0.35);
  const L=barLayout();
  drawTrack(L,L.retail,1); drawFill(L,L.retail,1);
  drawTrack(L,L.hni,1);    drawFill(L,L.hni,1);
  drawSceneAText(L,1);
}

/* ---------------- transition: bars collapse into the dot ---------------- */
function renderCollapse(){
  const t=clamp01(tState/COLLAPSE_D);
  drawBG(1-0.6*t);
  const L=barLayout();
  const textA=Math.max(0, 1-tState/0.55);
  drawSceneAText(L, textA*0.9);
  drawVignette(easeInOutCubic(t)*0.9);

  const targW=Math.min(190, L.blockW*0.3);

  if(t<0.5){
    /* phase 1: both bars slide and shrink toward centre */
    const p=easeInOutCubic(t/0.5);
    drawTrack(L,L.retail,(1-p)*0.8);
    drawTrack(L,L.hni,(1-p)*0.8);
    [L.retail, L.hni].forEach(function(row){
      const w=lerp(row.fillW, targW, p);
      const x=lerp(L.left, CX-targW/2, p);
      const y=lerp(row.barY, CY-L.barH/2, p);
      ctx.save();
      ctx.shadowColor='rgba(201,168,76,0.6)';
      ctx.shadowBlur=24*p;
      ctx.fillStyle=mix(row.col, COL.gold, p);
      ctx.beginPath();
      ctx.roundRect(x,y,w,L.barH,L.barH*0.24);
      ctx.fill();
      ctx.restore();
    });
  } else {
    /* phase 2: the merged bar compresses into the dot (with light trails) */
    const compress=function(tt){
      const q=clamp01(easeInCubic((tt-0.5)/0.32));
      return { w:lerp(targW, DOT_R*2, q), h:lerp(L.barH, DOT_R*2, q), q:q };
    };
    for(let k=5;k>=1;k--){
      const tk=t-k*0.030;
      if(tk<=0.5) continue;
      const c=compress(tk);
      ctx.globalAlpha=0.07;
      ctx.fillStyle=COL.gold;
      ctx.beginPath();
      ctx.roundRect(CX-c.w/2, CY-c.h/2, c.w, c.h, Math.min(c.h/2,10));
      ctx.fill();
      ctx.globalAlpha=1;
    }
    const c=compress(t);
    if(t<0.82){
      ctx.save();
      ctx.shadowColor='rgba(201,168,76,0.75)';
      ctx.shadowBlur=26+34*c.q;
      ctx.fillStyle=mix(COL.gold,'#ffe9aa',c.q*0.5);
      ctx.beginPath();
      ctx.roundRect(CX-c.w/2, CY-c.h/2, c.w, c.h, Math.min(c.h/2,10));
      ctx.fill();
      ctx.restore();
    } else {
      /* phase 3: impact bloom, dot settles with a small overshoot */
      const r3=clamp01((t-0.82)/0.18);
      const er=easeOutCubic(r3);
      const fg=ctx.createRadialGradient(CX,CY,0,CX,CY,70+260*er);
      fg.addColorStop(0,'rgba(255,233,170,'+(0.28*(1-er)).toFixed(3)+')');
      fg.addColorStop(1,'rgba(255,233,170,0)');
      ctx.fillStyle=fg;
      ctx.beginPath(); ctx.arc(CX,CY,70+260*er,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(201,168,76,'+(0.4*(1-er)).toFixed(3)+')';
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(CX,CY,16+210*er,0,Math.PI*2); ctx.stroke();
      drawDot(CX, CY, DOT_R*(1+0.55*(1-er)), 6, 1);
    }
  }

  if(tState>=COLLAPSE_D) enter('B');
}

/* ---------------- scene B: the dot ---------------- */
function renderB(){
  drawBG(0.4);
  drawVignette(0.55);
  const r=dotRadius(now-pulseStart);
  const glow=6+0.8*Math.sin((now-pulseStart)*Math.PI*2/2.1);
  drawDot(CX,CY,r,glow,1);
}

/* ---------------- scene C: the flood ---------------- */
function drawPointer(aRaw){
  const a=easeOutCubic(aRaw);
  if(a<=0) return;
  ctx.save();
  ctx.globalAlpha=a;
  /* thin gold ring so the dot stays findable */
  ctx.strokeStyle='rgba(201,168,76,0.9)';
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(CX,CY,22,0,Math.PI*2); ctx.stroke();
  /* pointer line, flipped if the right side is tight */
  const dir=(CX+430<W) ? 1 : -1;
  const ang=-0.95;
  const cA=Math.cos(ang)*dir, sA=Math.sin(ang);
  ctx.strokeStyle='rgba(201,168,76,0.65)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(CX+cA*26, CY+sA*26);
  ctx.lineTo(CX+cA*120, CY+sA*120);
  ctx.stroke();
  const lx=CX+cA*120+10*dir, ly=CY+sA*120;
  ctx.textBaseline='middle';
  ctx.textAlign=dir===1?'left':'right';
  ctx.letterSpacing='0.14em';
  ctx.font='700 15px Nunito, sans-serif';
  ctx.fillStyle='rgba(201,168,76,0.95)';
  ctx.fillText('Your classroom', lx, ly-9);
  ctx.letterSpacing='0em';
  ctx.font='italic 500 13px Lora, serif';
  ctx.fillStyle='rgba(247,250,249,0.5)';
  ctx.fillText('(your dot is magnified ~1,000× so you can still see it)', lx, ly+12);
  ctx.restore();
}

function renderC(){
  drawBG(0.3);
  const t=tState;
  drawStars(t);

  /* protective dark halo so the dot never gets lost */
  const hr=haloRadius();
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,hr);
  g.addColorStop(0,'rgba(4,7,13,0.92)');
  g.addColorStop(0.55,'rgba(4,7,13,0.55)');
  g.addColorStop(1,'rgba(4,7,13,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(CX,CY,hr,0,Math.PI*2); ctx.fill();

  drawVignette(0.4);

  /* the classroom dot: same place, same size as scene B */
  const r=dotRadius(now-pulseStart);
  drawDot(CX,CY,r,6,1);

  /* counter: fast start, agonizing slow finish */
  const cp=clamp01(t/COUNT_D);
  elCV.textContent='₹'+formatIndian(TOTAL_CR*easeOutQuint(cp));

  if(t>=SETTLE) cSettled=true;
  if(cSettled) drawPointer(clamp01((t-SETTLE)/0.9));
}

/* ---------------- DOM choreography (idempotent, per frame) ---------------- */
function updateDOM(){
  const t=tState;
  elTag.textContent = state==='B' ? 'B' : (state==='C' ? 'C' : 'A');
  elCounterWrap.classList.toggle('show', state==='C');
  elCapB.classList.toggle('show', state==='B' && t>0.7);
  elCapB.classList.toggle('dim',  state==='B' && t>4.2);
  elClosing.classList.toggle('show', state==='C' && cSettled && t>SETTLE+0.9);
  const hint =
    (state==='A' && t>1.3) ||
    (state==='B' && t>5.0) ||
    (state==='C' && t>SETTLE+2.0);
  elHint.classList.toggle('show', hint);
}

/* ---------------- main loop ---------------- */
function frame(ts){
  now=ts/1000;
  tState=now-t0;
  switch(state){
    case 'A':        renderA();        break;
    case 'COLLAPSE': renderCollapse(); break;
    case 'B':        renderB();        break;
    case 'C':        renderC();        break;
  }
  updateDOM();
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
initSprites();
let started=false;
function start(){
  if(started) return;
  started=true;
  requestAnimationFrame(function(ts){
    now=ts/1000; t0=now;
    requestAnimationFrame(frame);
  });
}
if(document.fonts && document.fonts.ready){
  Promise.all([
    document.fonts.load('700 16px Nunito'),
    document.fonts.load('800 24px Nunito'),
    document.fonts.load('900 32px Nunito'),
    document.fonts.load('italic 500 14px Lora')
  ]).then(start).catch(start);
  setTimeout(start, 1800);   /* never block on fonts */
} else {
  start();
}

})();
</script>
</body>
